# 复制为 secret.yaml，填真实值后 kubectl apply（勿 commit secret.yaml）
#
# FEISHU_BITABLE_WEBHOOK_SECRET = 团队自建口令（非飞书平台字段）
# 生成：openssl rand -base64 32  或见 .env.example 注释
# 须与飞书自动化 Header「X-GKX-Webhook-Secret」完全一致
apiVersion: v1
kind: Secret
metadata:
  name: gkx-feishu-sync
  namespace: zhipu-tts
type: Opaque
stringData:
  FEISHU_APP_ID: "cli_xxx"
  FEISHU_APP_SECRET: "xxx"
  FEISHU_BITABLE_WEBHOOK_SECRET: "your-webhook-secret"
  GKX_GITLAB_USER: "oauth2"
  GKX_GITLAB_TOKEN: "glpat-xxx"
  GKX_GITLAB_BASE: "https://aminer-edu-gitlab.jyzhang.cn"
  GKX_GITLAB_GROUP: "sz-gkx/gkx-lumen"
  GIT_BRANCH: "dev"
