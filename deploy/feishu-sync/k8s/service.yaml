# gkx-feishu-sync · Webhook + Cron
# NodePort 30894。新集群节点 10.50.192.46 / 10.50.62.9 / 10.50.75.136。
# 外网 111.198.38.90:12287 若仍做 DNAT，目标须改为上述任一节点的 30894。
apiVersion: v1
kind: Service
metadata:
  name: gkx-feishu-sync
  namespace: zhipu-tts
  labels:
    app: gkx-feishu-sync
spec:
  type: NodePort
  selector:
    app: gkx-feishu-sync
  ports:
    - name: http
      port: 8787
      targetPort: http
      nodePort: 30894
