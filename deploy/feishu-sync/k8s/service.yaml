# gkx-feishu-sync · Webhook + Cron
# NodePort 30894。现网节点 10.50.69.111（旧 10.50.75.136 已迁走）。
# 外网 111.198.38.90:12287 若仍做 DNAT，目标须改为 10.50.69.111:30894。
apiVersion: v1
kind: Service
metadata:
  name: gkx-feishu-sync
  namespace: zhipu-tts
  labels:
    app: gkx-feishu-sync
spec:
  type: NodePort
  selector:
    app: gkx-feishu-sync
  ports:
    - name: http
      port: 8787
      targetPort: http
      nodePort: 30894
