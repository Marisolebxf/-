apiVersion: batch/v1
kind: CronJob
metadata:
  name: gkx-feishu-sync-board-watch
  namespace: gkx-dev
  labels:
    app: gkx-feishu-sync
    component: board-sync-cron
spec:
  # 每 30 分钟：出站投影 + inbound 兜底 + git push + dispatch scan
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: gkx-feishu-sync
            component: board-sync-cron
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: harbor-pull
          containers:
            - name: sync
              image: harbor.htmisoft.net/gkx/gkx-feishu-sync:latest
              imagePullPolicy: Always
              command: ["/bin/bash", "/orch/deploy/feishu-sync/run-board-sync.sh"]
              envFrom:
                - secretRef:
                    name: gkx-feishu-sync
              env:
                - name: TZ
                  value: Asia/Shanghai
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
