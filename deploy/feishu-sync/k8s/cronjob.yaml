apiVersion: batch/v1
kind: CronJob
metadata:
  name: gkx-feishu-sync-board-watch
  namespace: gkx-dev
  labels:
    app: gkx-feishu-sync
    component: board-sync-cron
spec:
  # 触发器每 15 分钟；实际是否 sync 由 should-run-cron.sh 按 Asia/Shanghai 时段门控：
  #   08:30–01:00  → 每 15 分钟
  #   01:00–08:30  → 03:00 / 05:00 / 07:00（2 小时）
  schedule: "*/15 * * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: gkx-feishu-sync
            component: board-sync-cron
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: harbor-pull
          containers:
            - name: sync
              image: harbor.htmisoft.net/gkx/gkx-feishu-sync:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  if /orch/deploy/feishu-sync/should-run-cron.sh; then
                    exec /orch/deploy/feishu-sync/run-board-sync.sh
                  fi
                  echo "[INFO] cron tick skipped (schedule gate)"
              envFrom:
                - secretRef:
                    name: gkx-feishu-sync
              env:
                - name: TZ
                  value: Asia/Shanghai
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
