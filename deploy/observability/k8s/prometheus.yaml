apiVersion: v1
kind: ConfigMap
metadata:
  name: gkx-prometheus
  namespace: zhipu-tts
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: gkx-otel-collector
        static_configs:
          - targets: ["gkx-otel-collector.zhipu-tts.svc.cluster.local:8888"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gkx-prometheus-data
  namespace: zhipu-tts
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-nfs-storage
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gkx-prometheus
  namespace: zhipu-tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gkx-prometheus
  template:
    metadata:
      labels:
        app: gkx-prometheus
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: docker.m.daocloud.io/prom/prometheus:v2.55.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-remote-write-receiver"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: gkx-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: gkx-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: gkx-prometheus
  namespace: zhipu-tts
spec:
  selector:
    app: gkx-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
