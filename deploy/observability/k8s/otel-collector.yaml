apiVersion: v1
kind: ConfigMap
metadata:
  name: gkx-otel-collector
  namespace: zhipu-tts
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlp/tempo:
        endpoint: gkx-tempo.zhipu-tts.svc.cluster.local:4317
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://gkx-prometheus.zhipu-tts.svc.cluster.local:9090/api/v1/write
      otlphttp/loki:
        endpoint: http://gkx-loki.zhipu-tts.svc.cluster.local:3100/otlp
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gkx-otel-collector
  namespace: zhipu-tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gkx-otel-collector
  template:
    metadata:
      labels:
        app: gkx-otel-collector
    spec:
      containers:
        - name: collector
          image: docker.m.daocloud.io/otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: gkx-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: gkx-otel-collector
  namespace: zhipu-tts
spec:
  selector:
    app: gkx-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8888
      targetPort: metrics
