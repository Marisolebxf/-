apiVersion: v1
kind: ConfigMap
metadata:
  name: gkx-tempo
  namespace: zhipu-tts
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    storage:
      trace:
        backend: s3
        s3:
          bucket: gkx-tempo
          endpoint: rustfs.zhipu-tts.svc.cluster.local:9000
          access_key: ${S3_ACCESS_KEY}
          secret_key: ${S3_SECRET_KEY}
          insecure: true
          forcepathstyle: true
        wal:
          path: /var/tempo/wal
    compactor:
      compaction:
        block_retention: 168h
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gkx-tempo-wal
  namespace: zhipu-tts
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-nfs-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gkx-tempo
  namespace: zhipu-tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gkx-tempo
  template:
    metadata:
      labels:
        app: gkx-tempo
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: tempo
          image: docker.m.daocloud.io/grafana/tempo:2.7.1
          args:
            - "-config.file=/etc/tempo/tempo.yaml"
            - "-config.expand-env=true"
          envFrom:
            - secretRef:
                name: gkx-observability-s3
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: wal
              mountPath: /var/tempo
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: gkx-tempo
        - name: wal
          persistentVolumeClaim:
            claimName: gkx-tempo-wal
---
apiVersion: v1
kind: Service
metadata:
  name: gkx-tempo
  namespace: zhipu-tts
spec:
  selector:
    app: gkx-tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: v1
kind: Service
metadata:
  name: gkx-tempo-query
  namespace: zhipu-tts
spec:
  type: NodePort
  selector:
    app: gkx-tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
      nodePort: 30201
