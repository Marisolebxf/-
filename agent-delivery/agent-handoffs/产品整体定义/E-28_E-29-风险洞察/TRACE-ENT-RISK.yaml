    title: 查看企业供应链关系、关键节点和断链风险
    source_relation: direct_requirement
    source_refs:
      - 科技信息展示系统和科技专题服务系统.md#1.1.1.2.4.2.3.8
      - 科技信息展示系统和科技专题服务系统.md#1.1.1.2.4.2.3.8.1
