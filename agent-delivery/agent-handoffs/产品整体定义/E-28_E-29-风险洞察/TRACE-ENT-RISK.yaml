architecture_constraints:
  - 前端经网关和 Java 聚合访问算法与 ADS，不直连 Python 或数据库
  - 供应链图谱正式图数据使用 NebulaGraph，不新增 Neo4j
  - 前端不计算官方风险等级、中心性、痛难点严重度或行业差距
  - 报告任务与结果任务使用不可变快照和服务端指纹

multi_object_presentation_contract:
  shared_baseline:
    task_scope_preserved: true
    configuration_one_to_five: show_all_removable_tags
    configuration_six_to_fifty: first_three_in_snapshot_order_plus_manage_all
    configuration_manage_view: {surface: editable_drawer, capabilities: [name_search, pagination_page_size_10, remove_from_current_draft], add_object: prohibited, compare_basket_writeback: prohibited}
    one_to_five_object_summary: show_all_names
    six_to_fifty_object_summary: first_three_in_snapshot_order_plus_total
    all_objects_view: {surface: readonly_drawer, capabilities: [name_search, validity_filter, data_status_filter, pagination], task_mutation: prohibited}
    result_all_objects_action_layout: below_summary_left_aligned
    result_snapshot_guidance: {review_mode: present, business_mode: absent}
  pain_points:
    overview: four_dimension_affected_distribution
    common_issue_default_limit: 5
    common_issue_order: affected_count_desc_then_backend_order
    typical_enterprise_limit_per_issue: 3
    affected_enterprises_view: {readonly: true, capabilities: [name_search, validity_filter, data_status_filter, pagination, enterprise_hit_summary]}
    enterprise_score_or_ranking: prohibited
    implicit_single_enterprise_task_or_report: prohibited
  supply_chain:
    exception_object_limit: 2
    inherits_multi_object_result_disclosure: false

