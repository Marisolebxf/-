confirmed_product_decisions:
  - id: DEC-RISK-CONFIG-OBJECT-DISCLOSURE-20260721
    decision: 配置态共享对象区1–5家完整显示，6–50家仅显示快照顺序前三家与“管理全部对象”；管理抽屉支持名称搜索、每页10家和当次移除，不新增对象、不回写对比篮；供应链超过2家时仍保留对象并阻断提交
    source_relation: product_interpretation
    confirmed_by: human:高颖
    confirmed_at: "2026-07-21"
  - id: DEC-RISK-RESULT-OBJECT-LAYOUT-20260721
    decision: 痛难点结果的“查看全部对象”置于对象摘要文字下方并左对齐；完整对象抽屉的快照顺序说明只在评审模式展示，业务模式完全不渲染
    source_relation: product_interpretation
    confirmed_by: human:高颖
    confirmed_at: "2026-07-21"
  - id: DEC-RISK-MULTI-OBJECT-DISCLOSURE-20260721
    decision: 企业分析类页面采用完整任务范围加渐进披露；痛难点1–5家显示全部对象名，6–50家显示快照顺序前三家与“等N家”并提供只读完整对象入口，全部对象仍进入同一任务与计算结果，不静默截断或拆分任务；供应链保持1–2家例外
    source_relation: product_interpretation
    confirmed_by: human:高颖
    confirmed_at: "2026-07-21"
  - id: DEC-RISK-PAIN-COMMON-ISSUE-DISCLOSURE-20260721
    decision: 痛难点集合首屏展示四维影响分布与影响企业数最高的5个共性问题；每项最多显示3家典型企业，完整受影响企业进入只读二级视图并可查看企业在当前任务中的问题命中摘要，不生成企业排名、第二份单企任务或报告
    source_relation: product_interpretation
    confirmed_by: human:高颖
    confirmed_at: "2026-07-21"
  - id: DEC-RISK-ROLE-20260718
    decision: 直接产品角色为政府、园区、投资机构；行业协会和企业自身仅作为算法能力适用对象
    confirmed_by: human:高颖
    confirmed_at: "2026-07-18"
  - id: DEC-RISK-SHARED-INTERACTION-20260718
    decision: 企业选择、报告生成、导出、历史和个人资产中心交互与企业评估一致
    confirmed_by: human:高颖
    confirmed_at: "2026-07-18"
  - id: DEC-RISK-SUPPLY-REPORT-20260718
    decision: 按算法库真源保留供应链分析报告，不沿用既有深化材料中的排除口径
    confirmed_by: human:高颖
    confirmed_at: "2026-07-18"
  - id: DEC-RISK-DIMENSION-LAYERING-20260720
    decision: 页面可见维度采用技术研发、市场拓展、融资、管理；算法库经营竞争力、盈利能力、生产效率、人才状况作为底层指标域，映射由 Q018 闭合
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-PRODUCT-INTERPRETATION-20260720
    decision: 供应链 1–2 家双中心、痛难点最多 50 家集合、任务过程、历史与个人资产中心均登记为 product_interpretation
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-DRILLDOWN-20260720
    decision: 移除用户侧展开层级选择；结果初始一级，点击可展开节点逐层加载，系统最多三级，并提供可展开、加载、无子级、折叠、路径与上限反馈
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-SHARED-OBJECT-20260720
    decision: 来源与分析对象作为供应链关系和发展痛难点的共享上下文置于 Tab 上方；切换 Tab 不改变对象，各 Tab 分别保留配置草稿
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-OBJECT-CONTEXT-PARITY-20260720
    decision: 风险洞察对象区与企业评估保持同构；对象区空态只保留居中的蓝色主按钮，标题右侧不渲染重复入口；有对象时才显示返回对比篮调整对象
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-HISTORY-THIRD-TAB-20260720
    decision: 最近分析作为第三个页面级 Tab，顺序位于发展痛难点之后；复用 F-RISK-05 历史态，页面标题区不保留重复入口
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-GRAPH-INFORMATION-LAYOUT-20260720
    decision: 图谱顶部使用轻量状态文本展示当前层级、节点数和共同节点数；系统最大三级收进展开动作提示；中心企业、供应商、客户、合作伙伴静态图例独立放在画布右下角
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-KEYRISK-TRACE-20260720
    decision: 评审模式在“关键节点与断链风险”标题旁单独挂载 E-28.2 原需求追溯，不以图谱标题或指标说明代替
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-BACKUP-PROMPT-20260720
    decision: 关键节点风险、断链风险项和供应链报告显示“建议提前制定备份方案”；不生成方案、不推荐替代供应商、不维护备选名单
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-REVIEW-MOUNT-PLACEMENT-20260720
    decision: 区块标题仅挂原需求追溯；指标说明仅挂实际统计值；Mock 或 Pending 仅挂对应数据值或统一数据说明区域；无可见量化字段不渲染指标挂点
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-SHARED-TASK-LIFECYCLE-20260720
    decision: 风险洞察复用企业评估的异步任务生命周期；完成后停留过程页并显示完成态，由用户主动查看结果；结果页顶部只保留按此配置新建分析，报告入口置于业务结果后的独立区块并按状态变化
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-PROCESS-VISUAL-PARITY-20260720
    decision: 风险洞察过程页与企业评估使用同构视觉结构；上方任务摘要卡展示任务 ID、分析类型、企业数量、已用时间和状态，下方可视化分析过程卡使用纵向阶段状态、语义 Alert，并将所有状态动作置于 Alert 下方右侧；风险洞察保留自己的五阶段名称与按钮文案
    source_relation: product_interpretation
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"
  - id: DEC-RISK-CONFIG-SUBMIT-ACTION-PARITY-20260720
    decision: “开始分析”与企业评估的“生成评估”同属页面级最终提交动作；风险洞察将其置于页面底部操作栏右侧，数据与权限预检区只展示状态和问题；无模板能力时底栏只保留一个主按钮
    source_relation: product_interpretation
    confirmed_by: human:高颖
    confirmed_at: "2026-07-20"

