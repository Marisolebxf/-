    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 单企业按技术研发、市场拓展、融资、管理展示问题、成因、最佳实践和解决方向
      - 企业集合最多 50 家，只输出共性诊断，不逐家生成完整诊断
      - 严重度仅用于阅读优先级，不转换为企业得分或排名
      - 数据不足时明确缺失依据，不把缺失值当作零或正式结论
      - 1–5家对象摘要显示全部名称；6–50家显示快照顺序前三家与“等N家”，完整对象抽屉只读且支持名称搜索、有效性或数据状态筛选和分页
      - “查看全部对象”位于对象摘要文字下方并左对齐；对象抽屉的快照顺序说明仅在评审模式显示，业务模式不渲染
      - 集合首屏展示四维影响分布与affected_count最高的5个共性问题；并列保持后端结果顺序，不使用Q018未闭合的严重度阈值创造排序
      - 每个共性问题最多显示3家典型企业；完整受影响名单可检索、筛选、分页，并可查看企业在当前任务中的问题命中摘要
      - 查看企业命中摘要不新增单企任务、报告指纹或历史记录，关闭后恢复原问题、筛选、分页和滚动位置
    ia_nodes: [F-RISK-01, F-RISK-03]
    wireframe_frames: [F-RISK-01, F-RISK-03]
    review_mount_refs: [ENT-RISK-F01-PAIN-TITLE, ENT-RISK-F01-Q018, ENT-RISK-F03-DIAGNOSIS-TITLE, ENT-RISK-F03-ISSUES-TITLE, ENT-RISK-F03-TECH-METRIC, ENT-RISK-F03-MARKET-METRIC, ENT-RISK-F03-FINANCE-METRIC, ENT-RISK-F03-MANAGEMENT-METRIC, ENT-RISK-F03-MOCK, ENT-RISK-F03-OBJECT-SNAPSHOT-NOTE]
    compliance_refs:
      - leaf_id: E-29
        req_id: REQ-ENT-009
        md_ref: 1.1.1.2.4.2.3.9
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-29
        route: /enterprise-center/risk?tab=pain-points
        screen_tier: medium
        delivery_track: Track-MS
        planned_tier: DEMO
        wave: 0
    metrics:
      - M_ENT_PAINPOINT_COUNT
      - M_ENT_PAINPOINT_SEVERITY
    open_questions: [Q018]

  - id: US-ENT-RISK-PROCESS
    title: 创建并恢复风险分析任务
    source_relation: product_interpretation
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 数据与权限预检区只展示校验状态和问题；“开始分析”作为配置页唯一主提交动作固定置于页面底部操作栏右侧
      - 对象为空、对象超限、预检未通过或无权限时“开始分析”禁用，具体原因在预检区可见
      - 开始分析后进入独立过程页，只展示可证明的阶段和已用时间
      - 过程页上方使用任务摘要卡展示任务 ID、分析类型、企业数量、已用时间和状态；下方使用“可视化分析过程”卡展示纵向阶段状态与语义 Alert
      - 稍后查看、查看最近分析、查看分析结果及失败态操作统一位于 Alert 下方右侧，不占用卡片标题栏
      - 离开页面不取消后台任务，可从最近分析或个人资产中心恢复
      - 分析完成后停留在过程页并显示“分析结果已生成”，不得自动跳转结果页
      - 完成态提供“查看分析结果”和“查看最近分析”；只有用户主动触发后才进入结果页
      - 失败保留失败阶段和错误编号，可重试或按此配置新建
    ia_nodes: [F-RISK-04]
    wireframe_frames: [F-RISK-04]
    review_mount_refs: [ENT-RISK-F04-PROCESS-TITLE]
    compliance_refs:
      - leaf_id: E-28
        req_id: REQ-ENT-008
        relation: productized_task_flow
      - leaf_id: E-29
        req_id: REQ-ENT-009
        relation: productized_task_flow

  - id: US-ENT-RISK-REPORT
    title: 生成并下载当前风险分析报告
    source_relation: direct_requirement
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 只有结果页可以创建与当前不可变任务快照绑定的报告
      - 结果页顶部任务摘要只提供“按此配置新建分析”，不得使用“修改配置并重新分析”暗示改写旧任务
      - 报告入口位于业务结果后的独立报告区块，不与任务摘要动作混排；按状态区分创建、生成中、查看或下载
      - 供应链报告和痛难点建议报告使用不同模板并保留各自需求边界
      - 重复指纹复用处理中或有效报告，完成后只能下载当前任务报告
      - 报告状态、下载、权限、水印和资产回查与企业评估同构
    ia_nodes: [F-RISK-02, F-RISK-03, F-RISK-06]
    wireframe_frames: [F-RISK-02, F-RISK-03, F-RISK-06]
    review_mount_refs: [ENT-RISK-F06-SUPPLY-REPORT, ENT-RISK-F06-PAIN-REPORT]
    compliance_refs:
      - leaf_id: E-28
        req_id: REQ-ENT-008
        md_ref: 科技专题服务算法库.md#1.1.1.1.1.1.1.5.4
        relation: direct_report_export
      - leaf_id: E-29
        req_id: REQ-ENT-009
        md_ref: 1.1.1.2.4.2.3.9.2
        relation: direct_report_output

  - id: US-ENT-RISK-HISTORY
    title: 找回分析和报告资产
    source_relation: product_interpretation
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 最近分析作为第三个页面级 Tab，位于发展痛难点之后，且页面标题区不再显示重复入口
      - 最近分析与个人资产中心读取同一任务和报告源
      - 可以恢复不可变结果或按此配置新建，不覆盖旧任务
      - 无权限或对象失效时保留任务摘要并说明不可用原因
    ia_nodes: [F-RISK-05, F-RISK-06]
