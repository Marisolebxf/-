revision_record:
  revised_by: human:高颖
  revised_at: "2026-07-21"
  scope:
    - 原需求与当前实现偏差核查
    - 痛难点页面维度与算法指标域分层
    - product_interpretation 归类
    - 移除用户侧展开层级并补全图谱下钻交互契约
    - 共享来源与分析对象上移至两个分析 Tab 上方，并冻结 Tab 切换保持对象与分区草稿规则
    - 风险洞察对象区与企业评估共用平台对象交互；空态去除标题右侧重复按钮
    - 最近分析归位为发展痛难点后的第三个页面级 Tab，并移除标题区重复入口
    - 图谱轻量状态行、右下角静态关系图例及展开提示归位
    - 关键节点与断链风险标题级原需求追溯挂载补齐
    - 风险项与供应链报告补充备份方案提示，不扩展为方案生成能力
    - 评审挂点按标题需求追溯、实际数值指标说明、数据区 Mock 或 Pending 分层
    - 痛难点恢复问题清单标题追溯，四维指标拆分唯一宿主，行业差距指标改为登记但当前不可见
    - 分析完成后停留过程页并由用户主动查看结果，不自动跳转
    - 结果页顶部动作与独立报告区块按企业评估范式统一
    - 开始分析归位为页面底部操作栏右侧的唯一主提交动作；数据与权限预检区仅承载状态与问题说明
    - 过程页按企业评估范式拆分任务摘要卡与可视化分析过程卡，统一纵向阶段状态、语义 Alert 和底部右对齐操作行
    - 痛难点 6–50 家集合结果采用渐进披露：紧凑对象摘要、共性问题 Top 5、典型企业最多 3 家、完整受影响企业二级视图与企业命中摘要；供应链 1–2 家例外不变
    - 配置态共享对象 1–5 家完整显示，6–50 家显示前三家与可编辑管理抽屉；结果态查看全部对象按钮下移至摘要文字下方左对齐，对象快照说明仅在评审模式显示
  files: [IA-ENT-RISK.md, TRACE-ENT-RISK.yaml, USM-ENT-RISK.md, Wireframe-ENT-RISK.md]

