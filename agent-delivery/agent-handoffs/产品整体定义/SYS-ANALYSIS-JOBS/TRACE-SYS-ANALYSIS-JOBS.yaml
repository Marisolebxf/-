approved_decisions:
  - id: DEC-SYS-ANALYSIS-JOBS-20260723
    approved_by: user
    approved_at: "2026-07-23"
    source_relation: product_enhancement
    approved_scope_change: product_workflow_enhancement
    scope_effect: within_existing_leaves_no_leaf_change
    decisions:
      - 长耗时分析任务机制定位为科技专题服务系统共享能力，企业分析为首批接入域，产业链等后续按协议接入。
      - 只有用户提交、长耗时异步、需要跨页面恢复并产生不可变结果快照的能力才属于分析生成任务。
      - 重点企业领域分布分析不属于长耗时大模型任务。
      - 分析任务唯一性按发起用户与具体task_type判断，不涉及其他用户的业务互斥。
      - 同一用户同一task_type的排队中和运行中任务共同占用唯一名额。
      - 不同task_type可以同时提交。
      - 分析执行槽满载后进入有界队列，队列满载后才拒绝。
      - 排队任务可撤回，运行中任务普通用户不可取消。
      - 失败后保留原记录并基于原配置创建新task_id，使用retry_from_task_id关联。
      - 分析队列和报告队列独立，容量由每个部署环境配置。
      - 首期每个分析任务占一个槽位，协议预留按task_type配置权重。
      - 系统浮层只展示当前用户自己的任务；排队可显示位置，不承诺预计等待时间。
      - 刚完成和刚失败任务保留到用户确认或短暂通知周期结束，完整历史进入来源模块或个人资产中心。
      - 用户进入存在非终态任务的分析类型时，保留系统与模块导航，主工作区恢复完整过程页。
      - 所有创建报告文件的位置统一接入报告任务，使用报告指纹复用，并返回来源页面打开报告任务弹层。
      - 报告统一读取来源快照、校验权限与脱敏、渲染图表、组装报告和生成文件，禁止重新执行来源业务计算。
      - 不同页面标签页和设备读取同一服务端任务状态，重新登录后恢复。
      - 普通用户不能取消运行中任务；管理员可在故障或资源异常时强制终止并记录审计。

