scope:
  effect: within_existing_leaves_no_leaf_change
  baseline_leaf_delta: 0
  purpose: 为现有业务分析与报告能力提供统一的长耗时任务、队列、浮层、恢复和失败处理工作流。
  includes:
    - 当前用户长耗时分析任务的统一状态和恢复
    - 发起用户与具体task_type组成的非终态互斥
    - 分析与报告独立有界队列
    - 系统级个人任务浮层
    - 来源模块内完整分析过程页
    - 来源业务页内报告任务弹层
    - 报告指纹复用和来源快照绑定
    - 跨页面标签页设备和重新登录同步
    - 管理员异常终止与审计边界
  excludes:
    - 业务模型指标权重和结果内容
    - 同步查询统计聚合确定性映射
    - 重点企业领域分布分析
    - 其他用户任务详情和业务互斥
    - 普通用户取消运行中任务
    - 完整历史任务中心
    - 报告阶段重算来源业务结果
    - 产品文档硬编码容量数值

