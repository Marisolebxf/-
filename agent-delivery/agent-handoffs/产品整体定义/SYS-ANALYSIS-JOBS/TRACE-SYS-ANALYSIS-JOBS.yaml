    implementation_mapping: [OPS, SYS]

task_classes:
  analysis_generation:
    admission:
      required:
        - explicit_user_submission
        - long_running_async_backend
        - continue_after_navigation
        - cross_session_recovery
        - immutable_result_snapshot
      excluded:
        - synchronous_query
        - statistical_aggregation
        - deterministic_mapping
        - existing_result_read
    mutex_key: [user_id, task_type]
    mutex_states: [queued, running]
    queue: analysis
    initial_slot_weight: 1
    future_configurable_weight: true
    recovery_target: full_processing_page
  report_generation:
    admission:
      required:
        - creates_report_file
        - immutable_source_snapshot
        - report_permission_passed
      excluded:
        - download_existing_valid_file
        - view_online_result
        - query_without_report_file
    dedupe_key: report_fingerprint
    queue: report
    recovery_target: source_page_report_modal

status_model:
  non_terminal: [queued, running]
  terminal: [succeeded, failed, withdrawn, terminated]
  user_withdrawable: [queued]
  user_cancellable: []
  admin_terminable: [running]
  release_mutex_on: [succeeded, failed, withdrawn, terminated]
  release_slot_on: [succeeded, failed, terminated]

queue_contract:
  bounded: true
  analysis_and_report_pools_are_separate: true
  capacity_configuration: environment_admin
  queue_position_visible: true
  eta_promised: false
  other_user_details_visible: false
  rejection_when: queue_capacity_exhausted

report_contract:
  source_snapshot_required: true
  stages:
    - task_submitted
    - source_snapshot_loaded
    - permission_and_masking_checked
    - charts_rendered
    - report_assembled
    - file_generated
  prohibited:
    - recalculate_source_scores
    - rerun_source_analysis
    - overwrite_source_result
    - create_second_business_truth
  dedupe:
    processing_same_fingerprint: reuse_existing_task
    valid_artifact_same_fingerprint: direct_download
    failed_expired_or_snapshot_changed: create_new_task

stories:
  - id: US-SYS-JOBS-01
    title: 提交不同类型的长耗时分析任务
    role_refs: [ROLE-SYS-JOBS-DECISION, ROLE-SYS-JOBS-RESEARCH]
    source_relation: product_enhancement
    approved_scope_change: DEC-SYS-ANALYSIS-JOBS-20260723
    compliance_refs: []
    frames: [F-SYS-JOBS-03]
    acceptance:
      - 当前用户同一task_type已有排队或运行任务时恢复原任务，不创建第二个。
      - 不同task_type可分别提交；其他用户的同类任务不形成业务互斥。
      - 同步查询统计和确定性映射不自动创建后台分析任务。

  - id: US-SYS-JOBS-02
    title: 在有界资源池中排队并开始执行
    role_refs: [ROLE-SYS-JOBS-DECISION, ROLE-SYS-JOBS-RESEARCH]
    source_relation: product_enhancement
    approved_scope_change: DEC-SYS-ANALYSIS-JOBS-20260723
    compliance_refs: []
    frames: [F-SYS-JOBS-02, F-SYS-JOBS-03]
    acceptance:
      - 分析槽满载时进入有界队列，队列满载才拒绝。
      - 排队显示位置但不承诺预计等待时间，不说明其他用户占用详情。
      - 排队任务可撤回，运行中任务不提供普通用户取消。

  - id: US-SYS-JOBS-03
    title: 从系统任务浮层查看并跳转自己的任务
    role_refs: [ROLE-SYS-JOBS-DECISION, ROLE-SYS-JOBS-RESEARCH]
    source_relation: product_enhancement
    approved_scope_change: DEC-SYS-ANALYSIS-JOBS-20260723
    compliance_refs: []
    frames: [F-SYS-JOBS-01, F-SYS-JOBS-02, F-SYS-JOBS-05]
    review_mount_refs: [SYS-JOBS-F02-PANEL-TITLE]
    acceptance:
      - 浮层只展示当前用户任务，不展示或影射其他用户。
      - 点击分析任务进入完整过程页；点击报告任务返回来源页并打开报告弹层。
      - 刚完成或刚失败仅短暂保留，完整历史不堆积在浮层。

  - id: US-SYS-JOBS-04
    title: 跨页面和重新登录恢复完整分析过程
    role_refs: [ROLE-SYS-JOBS-DECISION, ROLE-SYS-JOBS-RESEARCH]
    source_relation: product_enhancement
    approved_scope_change: DEC-SYS-ANALYSIS-JOBS-20260723
    compliance_refs: []
    frames: [F-SYS-JOBS-03]
    review_mount_refs: [SYS-JOBS-F03-PROCESS-TITLE]
    acceptance:
      - 切换页面刷新关闭浏览器或退出登录不取消任务。
      - 重新进入同一task_type时恢复相同task_id的完整过程页。
      - 过程页展示真实阶段和已用时间，不伪造百分比。

  - id: US-SYS-JOBS-05
    title: 处理完成失败撤回和重试
    role_refs: [ROLE-SYS-JOBS-DECISION, ROLE-SYS-JOBS-RESEARCH]
    source_relation: product_enhancement
    approved_scope_change: DEC-SYS-ANALYSIS-JOBS-20260723
    compliance_refs: []
    frames: [F-SYS-JOBS-03, F-SYS-JOBS-05]
    acceptance:
      - 成功后跳到来源结果，失败保留阶段和错误编号并释放互斥与执行槽。
      - 失败重试创建新task_id并通过retry_from_task_id关联原失败任务。
      - 排队撤回保留记录但不进入完整历史结果。

  - id: US-SYS-JOBS-06
    title: 从任一业务模块创建和恢复报告任务
    role_refs: [ROLE-SYS-JOBS-DECISION, ROLE-SYS-JOBS-RESEARCH]
    source_relation: product_enhancement
    approved_scope_change: DEC-SYS-ANALYSIS-JOBS-20260723
    compliance_refs: []
    frames: [F-SYS-JOBS-02, F-SYS-JOBS-04, F-SYS-JOBS-06]
    review_mount_refs: [SYS-JOBS-F04-REPORT-TITLE]
    acceptance:
      - 所有创建报告文件的位置进入独立报告队列，下载现成有效文件不创建任务。
      - 同报告指纹处理中任务复用，有效成品直接下载，失败过期或来源快照变化才新建。
      - 报告读取来源快照且不重算业务结果；点击浮层返回来源页打开报告弹层。

  - id: US-SYS-JOBS-07
    title: 在故障时审计性终止任务
    role_refs: [ROLE-SYS-JOBS-OPS]
    source_relation: product_enhancement
    approved_scope_change: DEC-SYS-ANALYSIS-JOBS-20260723
    compliance_refs: []
    frames: [F-SYS-JOBS-07]
    acceptance:
      - 普通用户不能取消运行中任务。
      - 管理员仅在故障或资源异常时终止任务，并记录操作者原因时间和审计编号。
      - 终止释放执行槽和互斥键，业务结果不得被标为成功。

