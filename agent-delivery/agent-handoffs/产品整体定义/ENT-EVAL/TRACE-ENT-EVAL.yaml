quality_contract:
  confidence:
    high: coverage_rate_gte_90_percent_and_no_key_metric_missing
    medium: coverage_rate_70_to_89_percent_or_few_key_metrics_missing
    low: coverage_rate_50_to_69_percent_or_multiple_key_metrics_missing
    cannot_generate: coverage_rate_lt_50_percent_or_all_key_metrics_missing
  per_enterprise_confidence_for_comparison: true
  warn_when_coverage_structures_differ: true
  radar_missing_point: show_missing_not_zero
  weight_input: integer_0_to_100
  each_weight_level_total: 100
  silent_normalization: false
  equal_distribution_action: true

visualization_contract:
  technology:
    one: unsupported
    two: [dual_radar, difference_bar, ranking]
    three_or_more: [ranking, bar, matrix, detail_list]
  business:
    one: unsupported
    two: [score, ranking, key_business_metric_comparison, shortboards]
    three_or_more: [ranking, bar, matrix, detail_list]
  competitiveness:
    one: [dimension_radar, shortboards]
    two: [dual_dimension_radar, gap]
    three_or_more: [ranking, matrix, difference]
  complex_radar_for_three_or_more: prohibited

report_contract:
  entry: result_page_only
  default_format: PDF
  later_format: Word
  backend_stages: [submitted, data_preparation, scoring, chart_generation, report_assembly, completed, failed]
  fingerprint_fields: [enterprise_set, mode, template_version, weights, data_batch, algorithm_version, permission_scope, report_template]
  reuse_in_progress_or_valid_same_fingerprint: true
  frontend_cache_is_source_of_truth: false
  governed_by: [role, field_classification, object_limit, template, sensitive_permission, approval, desensitization, audit]

review_mode:
