gaps:
  - id: GAP-METRIC-01
    severity: gate_blocking
    description: 三模式评分权重算法和关键指标语义尚未由何老师闭合。
    open_question: Q014
    owner: human:何老师
  - id: GAP-METRIC-02
    severity: gate_blocking
    description: 市场份额无正式数据源，不得以样例或前端推导替代。
    open_question: Q019
    owner: product-and-data-owner
  - id: GAP-METRIC-03
    severity: trace_correction_required
    description: cfg_metric-ENT-seed.yaml 中 M_ENT_BUSINESS_POWER_SCORE 当前 bid_ref 指向需求 3.3 且 acceptance_unit_id 为 E-23，应由指标与合规 Owner 核验并校正为商业力叶子 E-24 / 需求 3.4。
    owner: ["human:何老师", "human:郭万迎"]
  - id: GAP-DELIVERY-01
    severity: delivery_upgrade_required
    description: E-23 E-24 E-30 当前只能按 DEMO 登记，FULL 需真实 ADS 和已登记算法联调。
    owner: [product-agent, algorithm-agent, data-agent]
  - id: GAP-GATE-01
    severity: gate_blocking
    description: UX深化 UI高保真Demo V1首轮会签与必需多角色评审尚未完成。
    owner: human:高颖

