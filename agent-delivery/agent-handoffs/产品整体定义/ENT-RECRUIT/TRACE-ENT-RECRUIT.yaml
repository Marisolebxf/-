  - id: DEC-RECRUIT-VIEW-BOUNDARY-20260718
    decision: 引育推荐为一个二级菜单，内部拆为招引推荐和培育推荐两个独立视图；两者共享候选管理、任务和追溯框架，但不共用对象池或结论
    evidence: p2a-session/DECISIONS.md#57-63
  - id: DEC-RECRUIT-CANDIDATE-RESULT-20260718
    decision: 外部模块只能加入招引或培育候选；候选是对象池，任务完成后的招引推荐名单和建议培育名单才是分析结果
    evidence: p2a-session/DECISIONS.md#64
  - id: DEC-RECRUIT-OUTPUT-20260718
    decision: 页面名单与依据为 E-26/E-27 核心输出；文件导出仅作为通用增强，不恢复独立分析导出菜单
