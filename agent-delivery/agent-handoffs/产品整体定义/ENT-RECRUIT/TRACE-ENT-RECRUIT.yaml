architecture_constraints:
  - 前端经网关和 Java 聚合服务访问内部推荐算法与 ADS，不直连 Python、数据库或数据平台
  - 前端不计算正式推荐指数、排名、阈值命中或推荐结论
  - 规则模板、模型版本、默认权重和阈值由维护管理发布并版本化，业务页只提交本次任务参数
  - 每次生成使用不可变配置、权限和数据批次快照；结果与审计记录不可被后续模板覆盖
  - 敏感名单和字段继承字段级权限、脱敏、水印与审计

