# ---------------------------------------------------------------------------
# 4. 级别累加权限（由 §3 推导，便于前端直接 import；与注册表保持同步）
#    实际 userPerms = 取 L0..userLevel 各档 grants 的并集
# ---------------------------------------------------------------------------
level_perms:
  L0:
    grants:
      # 展示系统 L0 可见二级页面
      - menu:ds:ds01
      - menu:ds:ds02
      - menu:ds:ds04
      - menu:ds:ds05
      - menu:ds:ds06
      - menu:ds:ds08
      - menu:ds:ds10
      - menu:ds:ds13
      - menu:ds:ds14
      - menu:ds:ds21
      - menu:ds:ds25
      - menu:ds:ds26
      - menu:ds:ds27
      - menu:ds:ds28
      - menu:ds:ds29
      - menu:ds:svc-eco
      - menu:ds:svc-think
      - menu:ds:svc-exchange
      - menu:ds:svc-contest
      - menu:ds:svc-spread
      # 企业入门级
      - menu:ent:overview
      - menu:ent:search
      - btn:common:view
      - btn:common:filter
  L1:
    grants:
      # 展示系统 L1 解锁二级页面
      - menu:ds:ds03
      - menu:ds:ds07
      - menu:ds:ds09
      - menu:ds:ds11
      - menu:ds:ds15
      - menu:ds:ds17
      - menu:ds:ds18
      - menu:ds:ds19
      - menu:ds:ds20
      - menu:ds:ds22
      - menu:ds:ds23
      # 企业入门级
      - menu:ent:keypano
      - menu:ent:star
      - menu:ent:sz
      - menu:ent:profile
      - menu:ent:basket
      - menu:ent:dash          # L1 仅结论条；完整驾驶舱 L2
      - btn:common:drill
      - btn:common:compare
      - btn:common:fav
      - btn:common:subscribe
      - btn:common:export
      - btn:common:share
  L2:
    grants:
      # 展示系统 L2 解锁（推演/推荐/图服务）
      - menu:ds:ds12
      - menu:ds:ds16
      - menu:ds:ds24
      # 企业分析级
      - menu:ent:type
      - menu:ent:domain
      - menu:ent:capability
      - menu:ent:szstatus
      - menu:ent:attract
      - menu:ent:supply
      - menu:ent:painpoint
      - menu:ent:compete
      - btn:common:filter-adv
      - btn:common:layout
      - btn:common:apply-sensitive
      - btn:common:view-switch
      - btn:common:analysis-type
      - btn:common:start-analysis
      - btn:common:report-generate
  L3:
    grants:
      - btn:common:export-list
      - btn:common:simulate
      - btn:common:weight
      - btn:common:view-sensitive
  L4:
    grants: []                 # L4 基线 = L3 全量；后台能力按子角色叠加（见 l4_role_perms）

# L4 子角色叠加权限（在 L4 基线之上）
l4_role_perms:
  super_admin: [menu:sys:user, menu:sys:role, menu:sys:log, btn:sys:user-mgt, btn:sys:rollback]
  sys_admin:   [menu:sys:user]
  data_maint:  [menu:sys:data, btn:sys:edit]
  graph_maint: [menu:sys:graph, btn:sys:edit]
  content_ops: [menu:sys:content, btn:sys:edit]
  auditor:     [menu:sys:audit, menu:sys:log, btn:sys:audit, btn:sys:publish, btn:sys:rollback]
  device_ops:  [menu:sys:device, menu:ds:screen, btn:screen:play]
  lecturer:    [menu:ds:screen, btn:screen:play]

# ---------------------------------------------------------------------------
# 5. 数据密级 -> 最低可见级别（Q022；列级脱敏在数据服务实现）
# ---------------------------------------------------------------------------
data_classification:
  PUBLIC:     { min: L0, name: 公开 }
  INTERNAL:   { min: L1, name: 内部 }
  SENSITIVE:  { min: L3, name: 敏感, audit: true }
  RESTRICTED: { min: L3, name: 涉密, audit: true, persona_limited: true }

# 6. 导出配额（占位，数值待甲方 Q025）
export_quota:
  L0: { allow: false }
  L1: { chart_per_day: TBD, list_max_rows: TBD, watermark: account }
  L2: { chart_per_day: unlimited, list_max_rows: TBD, watermark: account }
  L3: { chart_per_day: unlimited, list_max_rows: unlimited, watermark: account+classification }

# ---------------------------------------------------------------------------
# 7. demo 标签 -> 本模型（级别切换器映射；demo 仅参考）
