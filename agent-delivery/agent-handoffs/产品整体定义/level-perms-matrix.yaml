# 权限映射表：level -> perms（前端 mock 鉴权 / Wave 1 网关下发同构）
# 状态：🟡 讨论稿（口径随 Q020–Q029 待甲方；见 客户决策清单跟踪表 §2.5）
# 作者：产品经理（人主导，AI 辅助）  创建：2026-06-22
# 来源：全系统角色权限体系设计.md + 权限点清单-菜单与按钮.md（同目录）
#
# 用法（前端）：
#   userPerms = union( level_perms[L0..userLevel] )           # 级别累加
#             + union( l4_role_perms[subrole] for 已授子角色 )  # L4 子角色叠加
#   可见/可用 = perm 命中 userPerms
#             ∧ 屏幕过滤：菜单看 screens 含当前屏；按钮看 feature_classes[class][screen] != false
#             ∧ 密级/子角色命中；未命中 -> 非阻断降级（disabled+🔒+引导）
#   persona 仅决定默认视图与数据范围，不增减 perm（除 L4 子角色）
#   screen（LARGE/MEDIUM/SMALL）= 设备形态，与级别正交：大屏纯展示、中屏最全、小屏裁剪
# Wave 0：本表本地静态推导；Wave 1：perms[] 改由网关/统一权限服务下发，结构不变（D6）

meta:
  version: "0.1.0"
  status: draft
  cumulative: true            # 高级别包含低级别
  non_blocking: true          # 无权降级而非隐藏关键入口

# ---------------------------------------------------------------------------
# 1. 级别定义
# ---------------------------------------------------------------------------
levels:
  L0: { code: GUEST,      name: 公众访客,     enroll: 无需登录 }
  L1: { code: REGISTERED, name: 注册用户,     enroll: 注册即得 }          # Q021
  L2: { code: PRO,        name: 专业用户,     enroll: 实名认证 }          # Q021
  L3: { code: INTERNAL,   name: 内部业务用户, enroll: 内部审批 }          # Q021
  L4: { code: ADMIN,      name: 管理/运营,    enroll: 管理员分配子角色 }

# ---------------------------------------------------------------------------
# 2. 身份场景（决定默认视图 + 数据范围，不改 perm）
# ---------------------------------------------------------------------------
personas:
  GOV:   { name: 政府决策, default_view: dashboard, scope: 全域 }
  INNO:  { name: 创新主体, default_view: workbench, scope: 技术/人才/机构/成果 }
  THINK: { name: 智库研究, default_view: workbench, scope: 前沿/评价/竞争力 }
  VISIT: { name: 接待访客, default_view: readonly,  scope: 接待/成果 }
  OPS:   { name: 内容运营, default_view: backend,   scope: 内容/专题 }
  SYS:   { name: 系统设备, default_view: backend,   scope: 用户/设备/日志 }

# L4 子角色（叠加在 L4 之上；编辑与审核发布职责分离，不可同授）
l4_subroles:
  super_admin: 系统超级管理员
  sys_admin:   系统管理员
  data_maint:  数据维护
  graph_maint: 图谱维护
  content_ops: 内容运营
  auditor:     审核发布
  device_ops:  设备/现场运维
  lecturer:    展示讲解员

# ---------------------------------------------------------------------------
# 2.5 屏幕类型（独立维度：决定功能形态，不改数据可见深度）
# ---------------------------------------------------------------------------
screen_types:
  LARGE:  { name: 大屏/超大屏, role: 展示为主, personalization: false, showcase: true }
  MEDIUM: { name: 中屏/PC工作台, role: 功能最全, personalization: true,  showcase: false }
  SMALL:  { name: 小屏/移动, role: 中屏裁剪, personalization: partial,  showcase: false }

# 屏幕适用范围：仅展示系统多形态；专题系统（门户/企业等 menu:ent:* / 其余要素）仅 PC=中屏
system_screen_scope:
  display_system: [LARGE, MEDIUM, SMALL]   # menu:ds:*
  topic_system:   [MEDIUM]                 # menu:ent:* 及其余 6 要素主题（仅 PC）

# 线上原型地址
prototypes:
  display_system: { repo: demo-ui-science, url: "https://skxrules.unicomcn.tech:30999/" }
  topic_system:   { repo: demo-ui-topic,   url: "https://skxdemo.unicomcn.tech:30999/" }

# 功能分类 -> 各屏开放（true=完整 / trim=裁剪只读 / false=不出现）
# 最终可用 = 用户级别命中 minLevel  ∧  feature_classes[class][screen] != false  ∧  密级/子角色命中
feature_classes:
  display:  { LARGE: true,  MEDIUM: true,  SMALL: true  }   # 基础展示
  showcase: { LARGE: true,  MEDIUM: false, SMALL: false }   # 酷炫展示（大屏专属）
  interact: { LARGE: trim,  MEDIUM: true,  SMALL: trim  }   # 交互分析（大屏仅只读巡览）
  deep:     { LARGE: false, MEDIUM: true,  SMALL: false }   # 深度功能（推演/配置/自助）
  personal: { LARGE: false, MEDIUM: true,  SMALL: partial}  # 个人定义（订阅/收藏/导出/布局）
  manage:   { LARGE: false, MEDIUM: true,  SMALL: false }   # 维护管理（后台）

# ---------------------------------------------------------------------------
# 3. 权限点注册表（真源：每点 minLevel + 可选 roles + 按钮 class）
#    screens 由 feature_classes[class] 推导；菜单的 screens 单列（页面是否在该屏出现）
# ---------------------------------------------------------------------------
permissions:
  # --- 展示系统：一级模块组（任一子页可见则显示）---
  - { code: "menu:ds:trend",   group: true, desc: 科技发展态势 }
  - { code: "menu:ds:policy",  group: true, desc: 科技政策跟踪 }
  - { code: "menu:ds:talent",  group: true, desc: 科技人才态势 }
  - { code: "menu:ds:data",    group: true, desc: 科技数据资源 }
  - { code: "menu:ds:graph",   group: true, desc: 科技知识图谱 }
  - { code: "menu:ds:achv",    group: true, desc: 科技成果展示 }
  - { code: "menu:ds:service", group: true, desc: 科技服务全景 }
  # --- 展示系统：二级页面（parent=模块组；screens=出现的屏幕）---
