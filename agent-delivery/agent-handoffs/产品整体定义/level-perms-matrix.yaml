  - { code: "menu:ds:ds07", parent: "menu:ds:trend",  minLevel: L1, screens: [LARGE,MEDIUM,SMALL], desc: 科技创新评估 }
  - { code: "menu:ds:ds08", parent: "menu:ds:trend",  minLevel: L0, screens: [LARGE,MEDIUM,SMALL], desc: 科技指数 }
