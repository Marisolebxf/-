stories:
  - id: US-E33-01
    title: 查看重点企业产业链全景
    role: 科研人员
    acceptance:
      - 明确显示当前未来产业、当前产业链和数据批次
      - 按上游、中游、下游和具体链位展示重点企业及基础信息
      - 链位选择只更新本区块详情；单企业进入画像
      - 不展示供应商客户关系、断链风险、推荐排名或独立导出
    compliance_refs:
      - leaf_id: E-33
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.2 重点企业全景图"
          items:
            - 重点企业全景
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-33
        route: /enterprise-center/overview?tab=key-enterprises
        legacy_route: /development/key-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E33-02
    title: 查看重点企业规模与资质结构
    role: 政府科技管理与决策部门
    acceptance:
      - 复用系统通用资质荣誉枚举
      - 原始统计维度使用外企、国高企、小微、上市
      - 展示国家、省、市三级数量或结构
      - 多标签重复计数时显示不可直接求和提示
    compliance_refs:
      - leaf_id: E-33
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.2 重点企业全景图"
          items:
            - 重点企业规模统计
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-33
        route: /enterprise-center/overview?tab=key-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E33-03
    title: 查看重点企业领域在产业链中的分布
    role: 科研人员
    acceptance:
      - 从重点企业论文、专利中抽取关键词
      - 关键词关联到当前产业链的领域、环节或链位
      - 展示重点分布、关联企业和证据摘要
      - 映射证据不足时显示覆盖率与证据不足状态，不生成虚构排名
    compliance_refs:
      - leaf_id: E-33
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.2 重点企业全景图"
          items:
            - 重点企业领域统计
            - 企业抽取论文、专利关键词，关键词关联到产业链
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-33
        route: /enterprise-center/overview?tab=key-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

