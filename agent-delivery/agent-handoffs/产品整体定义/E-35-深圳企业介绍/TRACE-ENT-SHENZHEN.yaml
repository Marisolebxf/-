stories:
  - id: US-E35-01
    title: 查看深圳企业数量与趋势
    role: 政府科技管理与决策部门
    acceptance:
      - 固定深圳市并按八大未来产业展示企业数量和历年趋势
      - 正式趋势至少包含两个连续可比时间点，否则隐藏趋势模块
      - 统计数字有 metric_id 或 Q049/DEMO
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳企业数量
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E35-02
    title: 查看深圳企业领域分布
    role: 科研人员
    acceptance:
      - 默认在八大未来产业范围呈现深圳企业领域概览
      - 可聚焦一个未来产业查看其产业链领域/环节分布摘要
      - 不进入企业集合或产业链角色下钻，映射不足时显示覆盖情况
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳企业领域分布
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E35-03
    title: 查看深圳企业规模结构
    role: 政府科技管理与决策部门
    acceptance:
      - 按八大未来产业展示大、中、小、微企业结构
      - 规模分级与资质荣誉分别治理，不将小微等资质标签直接等同规模口径
      - 正式规模分类口径待 Q049 闭合，闭合前标 DEMO
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳企业规模分析
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E35-04
    title: 浏览深圳重点企业
    role: 访客
    acceptance:
      - 按八大未来产业展示深圳重点企业公开基础档案
      - 资质荣誉复用统一枚举，国有企业使用企业性质字段
      - 企业名称可进入统一企业画像，不提供批量选择或专业分析动作
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳重点企业
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

