exclusions:
  - 全国或城市横向对标
  - 产业链角色定位或企业集合下钻
  - 企业评价模型、评分或排名
  - 供应链风险或断链分析
  - 复杂筛选、批量操作或导出
  - CMS 编辑、草稿预览或内容发布

