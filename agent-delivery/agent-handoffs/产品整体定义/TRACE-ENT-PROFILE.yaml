    role: 创新工作台（INNO）
    acceptance:
      - 点击企业名 → 详情整页；「查看画像」→ 右侧抽屉六层摘要（Decision 074~075）
      - 抽屉可「查看详情」进入整页；面包屑原路返回来源
      - 画像不进左侧菜单（PDR-10 ✅）
    compliance_refs:
