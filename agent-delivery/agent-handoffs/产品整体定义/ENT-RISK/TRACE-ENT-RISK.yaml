        wave: 0

  - id: US-ENT-RISK-SUPPLY
    title: 查看企业供应链关系、关键节点和断链风险
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 单企业展示中心辐射图谱，两企业展示双中心共同与差异节点
      - 默认一级、最多三级下钻，关系只包含供应商、客户和合作伙伴
      - 图谱、关键节点列表和断链风险列表双向定位
      - 不生成供应链总评分、企业排名、替代供应商或备份方案
    ia_nodes: [F-RISK-01, F-RISK-02]
    wireframe_frames: [F-RISK-01, F-RISK-02]
    compliance_refs:
      - leaf_id: E-28
        req_id: REQ-ENT-008
        md_ref: 1.1.1.2.4.2.3.8
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-28
        route: /enterprise-center/risk?tab=supply-chain
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0
