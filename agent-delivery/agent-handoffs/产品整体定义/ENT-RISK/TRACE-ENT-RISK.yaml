      - M_ENT_CORE_SUPPLIER_COUNT
      - M_ENT_NODE_CENTRALITY
      - M_ENT_SUPPLY_CHAIN_RISK
      - M_ENT_RELATION_STRENGTH
    open_questions: [Q017]

  - id: US-ENT-RISK-PAIN
    title: 识别企业发展痛难点并查看改进方向
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 单企业按技术研发、市场拓展、融资、管理展示问题、成因、最佳实践和解决方向
      - 企业集合只输出共性诊断，不逐家生成完整诊断
      - 严重度仅用于阅读优先级，不转换为企业得分或排名
      - 数据不足时明确缺失依据，不把缺失值当作零或正式结论
    ia_nodes: [F-RISK-01, F-RISK-03]
    wireframe_frames: [F-RISK-01, F-RISK-03]
    compliance_refs:
      - leaf_id: E-29
        req_id: REQ-ENT-009
        md_ref: 1.1.1.2.4.2.3.9
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-29
        route: /enterprise-center/risk?tab=pain-points
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0
    metrics:
      - M_ENT_PAINPOINT_COUNT
      - M_ENT_PAINPOINT_SEVERITY
      - M_ENT_PAINPOINT_GAP
    open_questions: [Q018]

  - id: US-ENT-RISK-PROCESS
    title: 创建并恢复风险分析任务
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 开始分析后进入独立过程页，只展示可证明的阶段和已用时间
      - 离开页面不取消后台任务，可从最近分析或个人资产中心恢复
      - 失败保留失败阶段和错误编号，可重试或按此配置新建
    ia_nodes: [F-RISK-04]
    wireframe_frames: [F-RISK-04]
    compliance_refs:
      - leaf_id: E-28
        req_id: REQ-ENT-008
        relation: productized_task_flow
      - leaf_id: E-29
        req_id: REQ-ENT-009
        relation: productized_task_flow

  - id: US-ENT-RISK-REPORT
    title: 生成并下载当前风险分析报告
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 只有结果页可以创建与当前不可变任务快照绑定的报告
      - 供应链报告和痛难点建议报告使用不同模板并保留各自需求边界
      - 重复指纹复用处理中或有效报告，完成后只能下载当前任务报告
      - 报告状态、下载、权限、水印和资产回查与企业评估同构
    ia_nodes: [F-RISK-02, F-RISK-03, F-RISK-06]
    wireframe_frames: [F-RISK-02, F-RISK-03, F-RISK-06]
    compliance_refs:
      - leaf_id: E-28
        req_id: REQ-ENT-008
        md_ref: 科技专题服务算法库.md#1.1.1.1.1.1.1.5.4
        relation: direct_report_export
      - leaf_id: E-29
        req_id: REQ-ENT-009
        md_ref: 1.1.1.2.4.2.3.9.2
        relation: direct_report_output

  - id: US-ENT-RISK-HISTORY
    title: 找回分析和报告资产
    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 最近分析与个人资产中心读取同一任务和报告源
      - 可以恢复不可变结果或按此配置新建，不覆盖旧任务
      - 无权限或对象失效时保留任务摘要并说明不可用原因
    ia_nodes: [F-RISK-05, F-RISK-06]
    wireframe_frames: [F-RISK-05, F-RISK-06]
    compliance_refs:
