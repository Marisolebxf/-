    roles: [ROLE-RISK-GOV, ROLE-RISK-PARK, ROLE-RISK-INVEST]
    acceptance:
      - 有效企业自动成为当次对象并显示来源与数量，不在风险洞察页重复搜索
      - 当次移除不回写对比篮；补充对象返回同一 return_context_id
      - 供应链对象超过 2 家时明确阻断并要求缩减，不静默截断
    ia_nodes: [F-RISK-01]
    wireframe_frames: [F-RISK-01]
