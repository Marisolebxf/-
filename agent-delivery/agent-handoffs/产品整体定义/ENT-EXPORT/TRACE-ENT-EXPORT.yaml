  id: DEC-ENT-EXPORT-DIRECTION-20260731
  status: confirmed_by_current_human
  confirmed_by: human:高颖
  confirmed_at: "2026-07-31"
  source_relation: product_interpretation
  decisions:
    - 抽取系统级可复用报告骨架。
    - 采用结构化报告内容模型、只读HTML阅读页和同源PDF。
    - 终端用户不可编辑正文或配置章节。
