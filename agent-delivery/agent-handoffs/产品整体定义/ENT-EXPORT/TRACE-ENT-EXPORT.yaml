  evidence: agent-delivery/agent-handoffs/产品整体定义/ENT-EXPORT/REPORT-CONTRACT-ENT-EXPORT.md
  contract_version: "0.1"
  decisions:
    - 五个共用对象和七个固定核心章节作为产品层适配器基线。
    - ENT-EVAL专属模式权重评分排名雷达和评估模板不得成为共用必填字段。
