    - {metric_id: M_ENT_DOMAIN_COVERAGE_COUNT, leaf_id: E-22, mapping_status: mapped, implementation_status: partial}
    - {metric_id: M_ENT_DOMAIN_COVERAGE_BREADTH, leaf_id: E-22, mapping_status: mapped, formula_status: pending, pending_ref: Q013, implementation_status: gap}
    - {metric_id: M_ENT_DOMAIN_COVERAGE_DEPTH, leaf_id: E-22, mapping_status: mapped, formula_status: pending, pending_ref: Q013, implementation_status: gap}
    - {metric_id: M_ENT_DIVERSIFICATION_INDEX, leaf_id: E-22, mapping_status: mapped, formula_status: pending, pending_ref: Q013, implementation_status: gap}
  explicit_metric_gaps:
    - gap_id: GAP-KEYENT-REGIONAL-SCALE
      field: 区域企业规模分布
      mapping_status: pending_source
      owner: "human:何老师"
      data_owner: "human:辜少彬"
      treatment: 正式指标未登记前，业务模式省略或显示正常不可用态；技术原因仅评审模式可见
    - gap_id: GAP-KEYENT-REGIONAL-RATIO
      field: 区域企业占比
      mapping_status: pending_source
      owner: "human:何老师"
      data_owner: "human:辜少彬"
      treatment: 不得使用高企占比替代；正式展示前注册独立 metric_id

