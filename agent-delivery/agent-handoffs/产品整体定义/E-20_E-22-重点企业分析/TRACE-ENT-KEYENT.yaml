original_requirement_sources:
  - id: BID-ENT-KEYENT-ROOT
    file: agent-delivery/bid-reference/科技信息展示系统和科技专题服务系统.md
    section: "§1.1.1.2.4.2.3 企业分析"
    relation: direct_requirement
    summary: 企业分析面向政府、园区与投资机构，支撑企业生态到个体企业的穿透式洞察。
  - id: BID-ENT-KEYENT-TYPE
    file: agent-delivery/bid-reference/科技信息展示系统和科技专题服务系统.md
    section: "§1.1.1.2.4.2.3.1 重点企业类型分析（含 .3.1.1、.3.1.2）"
    relation: direct_requirement
    summary: 按产业与企业类型筛选匹配企业，并在国家、省、市三级地理维度分析数量、规模、占比和集聚特征。
  - id: BID-ENT-KEYENT-DOMAIN
    file: agent-delivery/bid-reference/科技信息展示系统和科技专题服务系统.md
    section: "§1.1.1.2.4.2.3.2 重点企业领域分布分析（含 .3.2.1）"
    relation: direct_requirement
    summary: 对一家或多家重点企业解析业务、产品与技术标签，映射产业领域并计算覆盖广度、参与深度及多元化程度。

derived_definition_sources:
  - id: DEC-KEYENT-IA-20260722
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 一个权威入口承载两个分析视图；类型结果可加入对比篮，对比篮所选企业可发起领域分布分析。
  - id: DEC-KEYENT-TAB-INPUT-OWNERSHIP-20260722
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 分析类型 Tab 位于输入条件之前；类型分析与领域分析各自拥有专属输入，仅共享页面级数据更新时间。
  - id: DEC-KEYENT-MAP-SCOPE-DRILL-20260722
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 顶部 RegionSelect 限定地图允许范围并在变化时重置地图；地图只在范围内局部下钻，不反向修改顶部条件，到区县后展示企业点位。
  - id: DEC-KEYENT-MAP-WORKSPACE-20260722
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 重点企业空间分布为主工作区，右侧为区域洞察；仅有至少两个真实同级区域时显示排行或区域类型矩阵，固定区域比较表删除。
  - id: DEC-KEYENT-ENTERPRISE-LIST-20260722
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 企业清单入口位于区域洞察标题区，采用紧凑次级动作并打开保留上下文的右侧宽 Drawer，不以整卡主按钮表达。
  - id: DEC-KEYENT-REVIEW-BUSINESS-BOUNDARY-20260722
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 业务模式只保留业务信息；数据批次、Mock、算法、Q/GAP 和技术降级说明仅在统一评审挂点、审计或导出元数据中存在。
  - id: DEC-KEYENT-REVIEW-MOUNT-PLACEMENT-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 同一区块评审挂点集中放在标题旁，不散落于内容、面包屑、操作区或 Footer；产品解释归入需求追溯子模块，不设独立 review_copy 挂点。
  - id: DEC-KEYENT-FILTER-SUMMARY-SELECTION-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 类型标题区删除与顶部重复的产业/企业类型摘要；企业清单的全选/取消全选归入 Drawer 底部批量操作栏，搜索时仅作用于当前搜索结果；选择数量只保留一个“已选 N 家”表达。
  - id: DEC-KEYENT-SUMMARY-METRICS-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 顶部删除主导类型企业数与主导类型占比，改为匹配企业数、覆盖企业类型数、覆盖区域数；多标签类型数量与占比只在当前区域类型结构中表达。
  - id: DEC-KEYENT-REGION-INSIGHT-REDUNDANCY-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 区域洞察删除类型结构图下方重复的当前类型状态文案；顶部筛选表达业务条件，图表局部选择由企业清单入口反馈。
  - id: DEC-KEYENT-DOMAIN-PRODUCT-LANGUAGE-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 领域分析业务标题采用决策语言，不平铺 Frame、组件或数据结构名称；Q013 未闭合指标不在业务模式占位，业务概览仅展示确定性关系摘要。
  - id: DEC-KEYENT-Q044
    type: approved_product_rule
    source: agent-delivery/客户决策清单跟踪表.md#Q044
    summary: 企业分布保留地图、列表和区域切换，默认最新数据。
  - id: CURRENT-FOUR-PACK
    type: current_derived_definition
    files: [IA-ENT-KEYENT.md, TRACE-ENT-KEYENT.yaml, USM-ENT-KEYENT.md, Wireframe-ENT-KEYENT.md]

