    decision_ref: DEC-KEYENT-MAP-WORKSPACE-20260722
    summary: E-21 复用企业总览地图底座与通用工具，但使用重点企业独立数据适配。
  - id: PI-KEYENT-07
    decision_ref: DEC-KEYENT-MAP-SCOPE-DRILL-20260722
    summary: 顶部 RegionSelect 是唯一范围真源；地图在允许范围内局部下钻且不反写顶部。
  - id: PI-KEYENT-08
    decision_ref: DEC-KEYENT-MAP-WORKSPACE-20260722
    summary: 地图为主工作区；右侧区域洞察只在有至少两个真实同级对象时显示比较，固定比较表删除。
  - id: PI-KEYENT-09
    decision_ref: DEC-KEYENT-TAB-INPUT-OWNERSHIP-20260722
    summary: Tab 前置；类型与领域分析拥有不同输入区，仅共享数据更新时间。
  - id: PI-KEYENT-10
    decision_ref: DEC-KEYENT-MAP-SCOPE-DRILL-20260722
    summary: 市级继续到区县用于展示企业点位，不新增区县分析指标或 Bid 叶子。
  - id: PI-KEYENT-11
    decision_ref: DEC-KEYENT-ENTERPRISE-LIST-20260722
    summary: 企业清单由区域洞察标题区的紧凑次级动作打开右侧宽 Drawer，并保留分析上下文。
  - id: PI-KEYENT-12
    decision_ref: DEC-KEYENT-REVIEW-MOUNT-PLACEMENT-20260723
    summary: 同一区块 review mounts 集中到标题行；产品解释统一收纳到对应 requirement_trace 的子模块内，不再生成独立 review_copy，指标与 Pending 继续保留独立语义。
  - id: PI-KEYENT-13
    decision_ref: DEC-KEYENT-SUMMARY-METRICS-20260723
    summary: 顶部总体摘要只显示匹配企业数、覆盖企业类型数、覆盖区域数；后两项分别由类型和区域分组结果派生，类型占比保留在当前区域类型结构。
  - id: PI-KEYENT-14
    decision_ref: DEC-KEYENT-REGION-INSIGHT-REDUNDANCY-20260723
    summary: 当前区域企业类型结构不复述顶部企业类型条件，也不显示独立当前类型状态行；图表选择由清单入口文案反馈。
  - id: PI-KEYENT-15
    decision_ref: DEC-KEYENT-DOMAIN-PRODUCT-LANGUAGE-20260723
    summary: 领域分析以“已选企业、领域布局概览、企业领域覆盖、跨领域布局、重点领域分布、领域识别依据”表达任务；Q013 未闭合指标只保留评审定义，业务模式不占位。
  - id: PI-KEYENT-16
    decision_ref: DEC-KEYENT-DOMAIN-DENSITY-20260723
    summary: 领域分析对象区采用标签在上、控件在下的上下结构，已选对象最多一行；跨领域图例绑定实际节点类别色；重点领域表分页并固定首尾列，中间列在表内横向滚动。

