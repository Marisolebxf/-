        route: /enterprise-center/basket#empty
        tier: DEMO
        wave: 0
    metrics:
      - M_ENT_KEY_ENTERPRISE_COUNT
    open_questions: [Q037, Q041]

  - id: US-ENT-CMP-04
    title: 选择分析类型 — 任务发起器（非竞争力页）
    role: 研判工作台（THINK）
    acceptance:
      - 对比篮 = 暂存区 + 分析类型选择 + 权限校验 + 任务发起
      - 加入时不绑定分析类型；主按钮「选择分析类型」
      - 支持评估/风险/招引/培育等批量工具栏（Decision 088）
    compliance_refs:
