        tier: DEMO
        wave: 0
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-03
    title: 空篮态 — 推荐企业 ≤30 + 分析类型预告
    role: 创新工作台（INNO）
    acceptance:
      - 空篮展示引导文案与「去添加企业」主操作
      - 空态下方展示「加入后可发起的分析」类型（置灰说明前置条件）
      - 空态推荐重点/明星企业 ≤30 条，无个性化（Q037）
    compliance_refs:
      - leaf_id: E-33
        md_ref: "§1.1.1.1.1.1.1.2"
        route: /enterprise-center/basket#empty
        tier: DEMO
        wave: 0
