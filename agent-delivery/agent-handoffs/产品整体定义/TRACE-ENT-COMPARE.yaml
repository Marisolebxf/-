    open_questions: [Q015]

  - id: US-ENT-CMP-05
    title: 跨模块跳转 — 带 enterprise_codes 与来源条件
    role: 研判工作台（THINK）
    acceptance:
      - 确认分析类型后跳转企业评估/风险洞察/引育推荐，携带对象集合
      - 权限不足置灰并说明；不静默隐藏
