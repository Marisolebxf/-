  - id: US-ENT-CMP-02
    title: 对比篮工作区 — 二级菜单入口与容量上限
    role: 研判工作台（THINK）
    acceptance:
      - 左侧二级菜单「对比篮」为正式工作区（Decision 088）
      - 单用户单篮默认容量 50 家；达上限须提示
      - 篮内展示企业来源（检索/画像/榜单等）
    compliance_refs:
