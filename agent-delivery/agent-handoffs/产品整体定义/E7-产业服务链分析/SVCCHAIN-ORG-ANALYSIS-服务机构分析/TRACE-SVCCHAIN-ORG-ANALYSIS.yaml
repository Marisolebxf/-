# ------------------------------------------------------------------
# 指标登记（8 件套真源；前端 serviceReviewData.ts 为只读镜像）
# ------------------------------------------------------------------
metric_registration:
  - {metric_id: M_SVC_ORG_TOTAL, name_zh: 入库服务机构总数, def_status: aligned,
     formula: "COUNT(DISTINCT org_id)", update_freq: daily, ingestion: mock}
  - {metric_id: M_SVC_ORG_SELECTED_COUNT, name_zh: 当前分析机构数, def_status: aligned,
     formula: "COUNT(selection.org_id)", update_freq: realtime, ingestion: mock}
  - {metric_id: M_SVC_ORG_COVERAGE_BREADTH, name_zh: 服务广度, def_status: aligned,
     formula: "COUNT(DISTINCT field_id) WHERE org 服务记录存在", update_freq: daily, ingestion: mock}
  - {metric_id: M_SVC_ORG_COVERAGE_DEPTH, name_zh: 服务深度得分, def_status: draft,
     pending_ref: Q-SVCCHAIN-02,
     formula: "pending_algorithm（演示态：领域内服务记录强度归一 0-100）", update_freq: weekly, ingestion: mock}
  - {metric_id: M_SVC_ORG_NEW_COUNT, name_zh: 年度新增服务机构数, def_status: aligned,
     formula: "COUNT(org) GROUP BY field_id, founded_year", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_ORG_MARKET_HEAT, name_zh: 市场热度评级, def_status: missing,
     pending_ref: Q-SVCCHAIN-02,
     note: 曲线特征→评级映射算法未定义；UI 红问号只显治理引用，不显伪 8 件套, ingestion: mock}
  - {metric_id: M_SVC_ORG_TECH_SCORE, name_zh: 技术力综合得分, def_status: draft,
     pending_ref: Q-SVCCHAIN-01,
     formula: "pending_algorithm（演示态：Σ 维度归一值×用户权重，归一基准=对比集合内最大值）",
     update_freq: on_demand, ingestion: mock}

open_questions:
  - {ref: Q-SVCCHAIN-01, summary: 服务机构技术力评价模型算法定义卡缺失（维度口径/归一化基准/默认权重）,
     temp_default: 对比集合内最大值归一 × 用户权重（🧪 演示态）, owner: 算法 Lead, blocking_release: true}
  - {ref: Q-SVCCHAIN-02, summary: 服务深度得分与市场热度评级判读口径未定（斜率/波动→评级映射）,
     temp_default: 深度=服务强度归一 0-100；热度=近段斜率与波动幅度规则分档（🧪）, owner: 算法 Lead, blocking_release: true}

