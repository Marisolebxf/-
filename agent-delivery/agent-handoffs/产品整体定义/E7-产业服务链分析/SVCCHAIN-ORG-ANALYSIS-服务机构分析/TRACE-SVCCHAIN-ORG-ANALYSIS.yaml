# ------------------------------------------------------------------
# 三级项 → 故事 → Frame → 实现 逐条闭合（6/6）
# ------------------------------------------------------------------
requirement_trace:
  - ref: REQ-SVC-ORG-COVERAGE
    bid_section: "1.1.1.2.4.2.7.1.1 服务机构产业领域覆盖分析"
    original_text_digest: 根据用户选定的单个或多个重点服务机构，计算输出其在各产业领域的服务覆盖情况（服务广度和服务深度）
    stories: [US-SVC-ORG-01, US-SVC-ORG-02]
    frames: [F-SVC-01, F-SVC-02]
    implementation: "ServiceOrgAnalysisPage(上下文区+选择器) + CoverageView(广度/深度计算展示)"
    metrics: [M_SVC_ORG_COVERAGE_BREADTH, M_SVC_ORG_COVERAGE_DEPTH, M_SVC_ORG_SELECTED_COUNT]
    status: closed_demo
  - ref: REQ-SVC-ORG-COVERAGE-VIS
    bid_section: "1.1.1.2.4.2.7.1.2 服务机构产业领域分析结果呈现"
    original_text_digest: 矩阵图或热力图可视化呈现，支持直观查看各机构在不同产业的服务覆盖深度与广度
    stories: [US-SVC-ORG-02]
    frames: [F-SVC-02]
    implementation: "CoverageView 热力图/矩阵图切换（EChart heatmap/scatter），hover 明细 + 行头/气泡下钻"
    metrics: [M_SVC_ORG_COVERAGE_DEPTH]
    status: closed_demo
  - ref: REQ-SVC-ORG-TREND
    bid_section: "1.1.1.2.4.2.7.2.1 趋势可视化呈现"
    original_text_digest: 选择特定产业领域或技术方向，统计新增服务机构数量变化并生成时间序列趋势图
    stories: [US-SVC-ORG-04]
    frames: [F-SVC-03]
    implementation: "TrendView 折线图（≤3 领域对比、时间窗切换持久化、明细表下钻）"
    metrics: [M_SVC_ORG_NEW_COUNT]
    status: closed_demo
  - ref: REQ-SVC-ORG-HEAT
    bid_section: "1.1.1.2.4.2.7.2.2 市场热度判断"
    original_text_digest: 通过趋势曲线波动、斜率等特征直观判断产业/技术的服务市场热度和资本关注度
    stories: [US-SVC-ORG-05]
    frames: [F-SVC-03]
    implementation: "TrendView 热度研判面板（依据行可核对；评级算法未定保持诚实态）"
    metrics: [M_SVC_ORG_MARKET_HEAT]
    open_refs: [Q-SVCCHAIN-02]
    status: closed_demo_with_honest_gap
  - ref: REQ-SVC-ORG-EVAL-MODEL
    bid_section: "1.1.1.2.4.2.7.3.1 多维度评价模型"
    original_text_digest: 内置可配置技术力评价模型，涵盖专利数量、研发投入、核心专家、成功案例、标准制定等维度
    stories: [US-SVC-ORG-06]
    frames: [F-SVC-04]
    implementation: "CapabilityView 模型配置区（内置五维与 Bid 列举一致；启停/调权/归一校验）"
    metrics: [M_SVC_ORG_TECH_SCORE]
    open_refs: [Q-SVCCHAIN-01]
    status: closed_demo_with_honest_gap
  - ref: REQ-SVC-ORG-EVAL-COMPARE
    bid_section: "1.1.1.2.4.2.7.3.2 自定义对比分析"
    original_text_digest: 自定义评价指标及权重，选取目标机构横向对比；结果以排名列表或雷达图展示
    stories: [US-SVC-ORG-06]
    frames: [F-SVC-04]
    implementation: "CapabilityView 自定义维度 + 2~5 家对比 + 排名列表/雷达图（同一次计算结果）"
    metrics: [M_SVC_ORG_TECH_SCORE]
    open_refs: [Q-SVCCHAIN-01]
    status: closed_demo_with_honest_gap

