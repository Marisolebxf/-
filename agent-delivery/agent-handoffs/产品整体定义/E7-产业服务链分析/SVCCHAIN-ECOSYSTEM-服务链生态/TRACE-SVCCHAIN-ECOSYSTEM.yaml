# ------------------------------------------------------------------
# 指标登记（8 件套真源；前端 serviceReviewData.ts 为只读镜像）
# ------------------------------------------------------------------
metric_registration:
  - {metric_id: M_SVC_CHAIN_SEGMENT_ORG_COUNT, name_zh: 环节服务机构数, def_status: aligned,
     formula: "COUNT(org) WHERE org.segment ∈ stage.segments AND coverage[field] 存在", update_freq: daily, ingestion: mock}
  - {metric_id: M_SVC_CHAIN_SEGMENT_AVG_DEPTH, name_zh: 环节平均服务深度, def_status: draft,
     pending_ref: Q-SVCCHAIN-02,
     formula: "AVG(coverage[field].depth) WHERE org ∈ stage（深度口径沿用 Q-SVCCHAIN-02）", update_freq: weekly, ingestion: mock}
  - {metric_id: M_SVC_CHAIN_BOTTLENECK, name_zh: 瓶颈堵点判定, def_status: missing,
     pending_ref: Q-SVCCHAIN-03,
     note: 薄弱/空白/瓶颈判据与专家规则库均未定义；UI 红问号只显治理引用；演示态规则=机构数 0/≤1/深度<55, ingestion: mock}
  - {metric_id: M_SVC_GRAPH_DENSITY, name_zh: 服务网络密度, def_status: aligned,
     formula: "2E / (N(N-1))（无向去重口径，统计范围=当前可见子网）", update_freq: on_demand, ingestion: mock}
  - {metric_id: M_SVC_GRAPH_CENTRALITY, name_zh: 节点度中心性, def_status: aligned,
     formula: "degree(node)（当前可见子网内连接数）", update_freq: on_demand, ingestion: mock}
  - {metric_id: M_SVC_GRAPH_INFLUENCE, name_zh: 生态影响力评分, def_status: missing,
     pending_ref: Q-SVCCHAIN-03,
     note: 影响力合成口径未定义（度/介数/业务权重均无定义卡）；不输出伪评分, ingestion: mock}
  - {metric_id: M_SVC_SZ_COMPARE_METRIC, name_zh: 城市对比指标值, def_status: draft,
     pending_ref: Q-SVCCHAIN-04,
     formula: "pending_framework（演示态：确定性城市基准数据集）", update_freq: quarterly, ingestion: mock}
  - {metric_id: M_SVC_SZ_CHAIN_COMPLETENESS, name_zh: 服务链完整度, def_status: missing,
     pending_ref: Q-SVCCHAIN-04,
     note: 完整度算法未定义；不参与对比图渲染与结论（诚实排除）, ingestion: mock}
  - {metric_id: M_SVC_SZ_TIER, name_zh: 深圳梯队位置, def_status: draft,
     pending_ref: Q-SVCCHAIN-04,
     formula: "pending_framework（演示态：可比指标排名前二占比分档）", update_freq: quarterly, ingestion: mock}

open_questions:
  - {ref: Q-SVCCHAIN-03, summary: 瓶颈堵点识别算法与专家规则库口径未定（薄弱/空白/瓶颈判据、生态影响力评分合成）,
     temp_default: 演示规则=环节机构数 0→空白、≤1→薄弱、平均深度<55→瓶颈；影响力不输出（🧪）, owner: 算法 Lead, blocking_release: true}
  - {ref: Q-SVCCHAIN-04, summary: 深圳服务链统一评价框架未定（指标构成、链完整度算法、城市基准数据源、梯队分档）,
     temp_default: 演示框架=机构数量/平均技术力/网络密度三指标 + 确定性城市基准；完整度诚实排除（🧪⚠️）, owner: 算法 Lead + 数据 Lead, blocking_release: true}

cross_module_contracts:
  - {id: CT-SVC-ORG-02, direction: "R1 叶子 → 本叶子", content: org_id/field_id 字典共用真源；OrgProfileDrawer 组件直接复用}
  - {id: CT-SVC-ECO-01, direction: "E2 产业链全景 → 本叶子", content: 复用"图谱+过滤+统计"交互心智与 EChart graph 容器（REUSE-MATRIX 原则）；禁止复制 CHAIN 数据模型/字段/storage key}
