requirement_trace:
  - ref: REQ-SVC-ECO-CHAIN-VIS
    bid_section: "1.1.1.2.4.2.7.4.1 全链路可视化呈现"
    original_text_digest: 结合内置专家知识库绘制特定产业从研发、中试到产业化的全周期服务链路图，展示各环节依赖的服务类型
    stories: [US-SVC-ECO-01]
    frames: [F-SVC-ECO-01, F-SVC-ECO-02, F-SVC-ECO-05]
    implementation: "ServiceChainEcosystemPage + ChainLinkView（6 环节链路卡 + 服务类型清单）+ StageDetailDrawer（环节下钻）"
    metrics: [M_SVC_CHAIN_SEGMENT_ORG_COUNT, M_SVC_CHAIN_SEGMENT_AVG_DEPTH]
    status: closed_demo
  - ref: REQ-SVC-ECO-BOTTLENECK
    bid_section: "1.1.1.2.4.2.7.4.2 瓶颈堵点智能识别"
    original_text_digest: 通过算法分析与专家规则自动识别薄弱环节、服务空白区及资源瓶颈堵点，以高亮或警示标签在链路图上标注
    stories: [US-SVC-ECO-02]
    frames: [F-SVC-ECO-02]
    implementation: "ChainLinkView 瓶颈识别面板（三类判定 + 依据行 + 环节定位）；判定算法未定保持诚实态"
    metrics: [M_SVC_CHAIN_BOTTLENECK]
    open_refs: [Q-SVCCHAIN-03]
    status: closed_demo_with_honest_gap
  - ref: REQ-SVC-ECO-GRAPH-BUILD
    bid_section: "1.1.1.2.4.2.7.5.1 关系网络构建"
    original_text_digest: 基于产业服务链数据动态构建以重点服务机构为核心的关联图谱，展示投资、合作、竞争、人才流动等多元关系
