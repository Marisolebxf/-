    frames: [F-SVC-ECO-03]
    implementation: "EcosystemGraphView（EChart graph；四类关系 + 三类关联主体 + 过滤持久化 + 聚焦邻域）"
    metrics: []
    status: closed_demo
  - ref: REQ-SVC-ECO-GRAPH-EXPLORE
    bid_section: "1.1.1.2.4.2.7.5.2 图谱探索与统计"
    original_text_digest: 图谱自由探索，钻取任意机构节点详细信息；提供关联实体统计分析，量化评估服务网络密度、中心性与影响力
    stories: [US-SVC-ECO-04]
    frames: [F-SVC-ECO-03, F-SVC-05]
    implementation: "机构节点→复用 R1 OrgProfileDrawer；统计面板（密度/中心性 TOP5/影响力诚实缺失）"
    metrics: [M_SVC_GRAPH_DENSITY, M_SVC_GRAPH_CENTRALITY, M_SVC_GRAPH_INFLUENCE]
    open_refs: [Q-SVCCHAIN-03]
    status: closed_demo_with_honest_gap
  - ref: REQ-SVC-ECO-FRAMEWORK
    bid_section: "1.1.1.2.4.2.7.8.1 统一评价框架"
    original_text_digest: 在统一的产业服务链评价框架下，确保分析口径的一致性与可比性
    stories: [US-SVC-ECO-05]
    frames: [F-SVC-ECO-04]
