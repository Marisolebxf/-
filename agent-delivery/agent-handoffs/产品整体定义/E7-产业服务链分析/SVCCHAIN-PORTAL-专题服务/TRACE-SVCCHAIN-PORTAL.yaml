# ------------------------------------------------------------------
# 指标登记（8 件套真源；前端 serviceReviewData.ts / serviceReadinessSeed.ts 为只读镜像）
# ------------------------------------------------------------------
metric_registration:
  - {metric_id: M_SVC_PT_GLOBAL_TOTAL, name_zh: 全球服务机构总数, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(DISTINCT org_id) GROUP BY year（全球口径）", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_PT_GLOBAL_TYPE_DIST, name_zh: 全球服务机构类型分布, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(org) GROUP BY org_type（高校/科研院所/企业）", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_PT_GLOBAL_SCALE_DIST, name_zh: 全球服务机构规模分布, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(org) GROUP BY staff_band（<50/50-200/200-500/>500）", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_PT_CHAIN_NODE_ORG, name_zh: 产业链节点服务机构数, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(org) GROUP BY field_id, stage_id（环节字典=CHAIN_STAGES）", update_freq: quarterly, ingestion: mock}
  - {metric_id: M_SVC_PT_REGION_ORG, name_zh: 区域服务机构数, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(org) GROUP BY region（全球=国家/地区；全国=省级）", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_PT_SZ_TOTAL, name_zh: 深圳产业服务机构数量, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(DISTINCT org_id) WHERE city=深圳 GROUP BY year", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_PT_SZ_TYPE_DIST, name_zh: 深圳机构类型统计, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(org) WHERE city=深圳 GROUP BY org_type", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_PT_SZ_FIELD_DIST, name_zh: 深圳机构产业领域分布, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(org) WHERE city=深圳 GROUP BY field_id, stage_id", update_freq: quarterly, ingestion: mock}
  - {metric_id: M_SVC_PT_SZ_REGION_ORG, name_zh: 深圳机构区域分布, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "COUNT(org) WHERE city=深圳 GROUP BY district（十区字典全集）", update_freq: yearly, ingestion: mock}
  - {metric_id: M_SVC_PT_KEYORG_SCALE, name_zh: 重点机构规模档案值, def_status: draft,
     pending_ref: Q-SVCCHAIN-06,
     formula: "档案字段直读（staff_count / annual_revenue / scale_band），非计算指标", update_freq: yearly, ingestion: mock}
  # --- 复用指标（真源在 TRACE-SVCCHAIN-ORG-ANALYSIS.yaml，此处只登记复用关系，不重复注册）---
  - {metric_id: M_SVC_ORG_TECH_SCORE, reuse_from: TRACE-SVCCHAIN-ORG-ANALYSIS.yaml,
     usage: "Top30 榜单综合分（固定等权五维配置，CT-SVC-PT-03）", pending_ref: Q-SVCCHAIN-01}
  - {metric_id: M_SVC_ORG_COVERAGE_DEPTH, reuse_from: TRACE-SVCCHAIN-ORG-ANALYSIS.yaml,
     usage: "重点机构详情③业务服务领域的深度条", pending_ref: Q-SVCCHAIN-02}

open_questions:
