cross_module_contracts:
  - {id: CT-SVC-PT-01, direction: "本叶子 ← ECOSYSTEM", content: 服务链六环节字典 CHAIN_STAGES 为链路节点分布唯一字典来源；"结合产业链全景图"展示分层语义参照 E2 全景交互心智（REUSE-MATRIX-CHAIN 原则），禁复制 CHAIN 数据模型}
  - {id: CT-SVC-PT-02, direction: "本叶子 → ORG-ANALYSIS", content: 门户详情抽屉"进入分析侧画像"跳 /service/institution-judgment?org={org_id}，消费分析侧既有 org 参数契约（US-SVC-ORG-03）}
  - {id: CT-SVC-PT-03, direction: "本叶子 ← ORG-ANALYSIS", content: Top30 排名分 = computeEvaluation 固定等权应用 + CAPABILITY_DIM_DEFS 同一字典；M_SVC_ORG_TECH_SCORE 指标复用；禁止门户另造技术力口径}
  - {id: CT-SVC-PT-04, direction: "本叶子 ← 政策门户", content: PolicyLeafletMap 作为通用比例圆点地图容器复用（GeoPoint 接口），图例/数据语义由本模块传参}
  - {id: CT-SVC-ORG-03-EXT, direction: "本叶子 → 系统对比篮", content: CT-SVC-ORG-03 触点扩展——门户 Top30 榜单行 + 重点机构详情抽屉新增 service_org 入篮触点；篮语义/上限/分发/回跳机制不变}

