stories:
  - id: US-E1-SCH-01
    title: 查企业：企业名称关键词模糊查询
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 仅企业名称参与关键词模糊查询，不检索曾用名、统一社会信用代码或其他字段
      - 查企业搜索框提示为“输入企业名称关键词”；结果为无企业 Logo / 标识的横向长卡片列表；企业名称进入企业画像
    compliance_refs:
      - leaf_id: E-20
        source_section: "§1.1.1.2.4.2.3"
        source_relation: "企业分析的微观个体画像；查企业为本轮产品定义的查询入口"
        route: /development/search?mode=company
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO

  - id: US-E1-SCH-02
    title: 智能搜索：多字段关键词匹配，不接 LLM
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 经营范围、产业、技术标签、专利、资质和区域支持模糊匹配
      - 不出现自然语言理解、大模型解析或意图识别承诺
    compliance_refs:
      - leaf_id: E-22
        source_section: "§1.1.1.2.4.2.3.2"
        source_relation: "重点企业领域分布分析中的企业选择、业务范围与技术标签解析"
        route: /development/search?mode=smart
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
    open_questions: [Q033]

  - id: US-E1-SCH-03
    title: 初始态：搜索示例、热门场景与最近检索
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 智能搜索和查企业的热门场景按当前入口直接提交查询，不进入高级筛选字段库
      - 普通查询仅展示最近检索，不展示或保存查询方案
      - 最近检索恢复个人查询上下文；访客不记录
      - 普通查询顶部使用蓝色搜索主视觉，固定为检索模式、搜索框、示例查询、热门场景四层
      - 示例查询与热门场景各占独立一行；示例只回填，热门场景按当前普通入口直接提交
      - 高级筛选下级页保持浅色工作台，不继承蓝色搜索主视觉
      - 全局内部评审模式开启后，页面标题和推荐企业标题显示源需求章节溯源；关闭后完整隐藏
    source_type: product_enhancement
    supports_sections: ["§1.1.1.2.4.2.3", "§1.1.1.2.4.2.3.1.1", "§1.1.1.2.4.2.3.2"]

  - id: US-E1-SCH-04
    title: 高级筛选：简化字段条件构造
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 条件逐项添加，点击应用筛选后生成结果
      - 不支持任意 AND/OR 条件组嵌套
      - 字段库展开、收起和结果态共用画框底部固定 Footer；保存方案、使用方案和清空条件保持位置，应用后主按钮原位切换为“编辑高级筛选”
      - 高级筛选结果态继续提供“使用查询方案”；恢复方案后回到编辑态，由用户手动应用
      - 查询方案只保存和恢复高级筛选字段条件与逻辑；不保存智能搜索 / 查企业关键词或企业结果名单
      - “导出当前结果”位于结果列表工具区，不占用高级筛选 Footer
    compliance_refs:
      - leaf_id: E-25
        source_section: "§1.1.1.2.4.2.3.1.1"
        source_relation: "产业与企业类型筛选；高级筛选交互为本轮产品定义"
        route: /development/search?mode=advanced
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
    open_questions: [Q036]

  - id: US-E1-SCH-05
    title: 结果列表：横向长卡片、排序与结果内再筛
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 不提供卡片 / 表格双视图切换
      - 综合竞争力、有效专利数、最新营收、成立时间均可排序且在卡片中可见
      - 主查询空态与结果内筛选空态表现不同
      - 结果选择区提供“全选本页”复选框，并准确显示未选、部分选中、当前页全部选中三态
      - “全选本页”仅选择当前分页；重新查询、结果内再筛、排序或翻页时清除当前选择，空结果时不可用
      - “全选本页”在业务模式与评审模式使用同一选择状态，review_mounts 为空
    compliance_refs:
      - leaf_id: E-30
        source_sections: ["§1.1.1.2.4.2.3.3", "§1.1.1.2.4.2.3.4", "§1.1.1.2.4.2.3.10"]
        source_relation: "企业技术力、商业力与综合竞争力的结果呈现；列表形态与排序为本轮产品定义"
        route: /development/search#results
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
      - leaf_id: E-23
        source_section: "§1.1.1.2.4.2.3.3"
        route: /development/search#results
        tier: DEMO
      - leaf_id: E-24
        source_section: "§1.1.1.2.4.2.3.4"
        route: /development/search#results
        tier: DEMO
    metrics: [M_ENT_TECH_POWER_SCORE, M_ENT_BUSINESS_POWER_SCORE, M_ENT_COMPETITIVENESS_SCORE]
    open_questions: [Q034, Q019]

  - id: US-E1-SCH-06
    title: 企业对象操作与跨模块带参
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 单个或批量企业可加入对比篮，重复项反馈已存在数量
      - 通过“全选本页”形成的选择集合与逐项勾选使用同一批量操作、权限和重复项反馈契约
      - 进入评估、风险或引育时携带 enterprise_codes 与来源查询条件
    compliance_refs:
      - leaf_id: E-26
        source_section: "§1.1.1.2.4.2.3.6"
        route: /development/search#results
        tier: DEMO
      - leaf_id: E-28
        source_section: "§1.1.1.2.4.2.3.8"
        route: /development/search#results
        tier: DEMO
      - leaf_id: E-29
        source_sections: ["§1.1.1.2.4.2.3.7", "§1.1.1.2.4.2.3.9", "§1.1.1.2.4.2.3.10"]
        route: /development/search#results
        tier: DEMO

  - id: US-E1-SCH-07
    title: 导出当前查询结果
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 支持单企业、已选企业和当前结果；单次最多 1000 条、异步下载、记录进入个人资产中心
      - 统一按 Excel 模板转换为 PDF，批量导出打包 PDF；水印含平台名、用户名、时间
    source_type: product_enhancement
    source_relation: "企业分析未定义查询结果导出；本轮评审决策 Q035 新增"
    open_questions: [Q035, Q025]

  - id: US-E1-SCH-08
    title: 初始空态推荐重点 / 明星企业
    role: 政府 / 园区 / 投资机构
    acceptance:
      - 正式业务态的推荐卡片仅提供查看画像、加入对比，不提供“以此查询”
      - 单企业推荐理由属于业务内容，正式业务态展示；固定 Top 30、按竞争力倒排、非个性化和 Mock / 指标状态等推荐机制说明只在全局内部评审模式开启后显示
      - 主查询 0 命中时不展示推荐企业
    compliance_refs:
      - leaf_id: E-33
        source_section: "§1.1.1.2.4.2.3"
        route: /development/search
        tier: DEMO
      - leaf_id: E-34
        source_section: "§1.1.1.2.4.2.3"
        route: /development/search
        tier: DEMO
    open_questions: [Q037]

