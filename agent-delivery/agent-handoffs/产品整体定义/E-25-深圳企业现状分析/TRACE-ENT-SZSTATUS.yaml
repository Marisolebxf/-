      - ENT-SZSTATUS-F00-DATA-MOCK
      - ENT-SZSTATUS-F00-DEMO-DISCLOSURE
      - ENT-SZSTATUS-F01-TITLE-REQ
      - ENT-SZSTATUS-F01-CHAIN-METRIC
      - ENT-SZSTATUS-F01-CHAIN-PENDING

  - id: US-SZSTATUS-02
    title: 核验并继续使用深圳企业对象
    role: 园区招商与企业服务人员
    source_relation: product_interpretation
    interpretation_basis: E-25.1 必须形成企业清单并标注链中角色；页内表格与全选用于编组对象，完整企业详情宽幅 Drawer 用于核验对象，加入对比篮用于继续使用明确选择的企业对象。
    decision_refs:
      - DEC-SZSTATUS-ENTERPRISE-ACTIONS-20260723
      - DEC-SZSTATUS-LIST-SELECT-ALL-20260723
      - DEC-SZSTATUS-FULL-DETAIL-DRAWER-20260723
    route: /enterprise-center/shenzhen-enterprise-status-analysis?view=chain-position
    ia_nodes: [深圳相关企业清单, 企业详情宽幅Drawer, 加入对比篮]
    wireframe_frames: [F-SZSTATUS-01, F-SZSTATUS-02]
    acceptance_refs: [SZSTATUS-USM-04, SZSTATUS-USM-05, SZSTATUS-USM-06, SZSTATUS-USM-19, SZSTATUS-USM-20]
    interaction_contract:
      enterprise_list_container: chain_position_page_table
      select_all_scope: current_filtered_or_searched_result
      selection_states: [none, partial, all]
      selection_survives_pagination: true
      selection_clears_on_chain_change: true
      table_fixed_columns: {left: [选择, 企业名称], right: 操作}
      first_control_column_extends_left_fixed_range_to_two_columns: true
      table_middle_columns_scroll_x: true
      table_scroll_preserves_filters_pagination_and_selection: true
      detail_container: wide_drawer
      detail_width: "clamp(1040px, 80vw, 1520px)"
      detail_owner: ENT-PROFILE
      detail_default_tab: 工商概况
      detail_scope: full_enterprise_detail_tabs
      detail_action_presentation: text_button_without_icon
      allowed_enterprise_actions: [查看详情, 加入对比篮]
      forbidden_enterprise_actions: [查看对比篮, 生成评估, 生成风险, 生成推荐]
    metrics: [M_ENT_SZ_CHAIN_POSITION]
    open_questions: []
    review_mounts:
      - ENT-SZSTATUS-F01-LIST-REQ
      - ENT-SZSTATUS-F01-BASKET-REQ
      - ENT-SZSTATUS-F02-DETAIL-REQ
      - ENT-SZSTATUS-F02-DETAIL-MOCK

  - id: US-SZSTATUS-03
    title: 将深圳企业群与全国及重点城市对标
    role: 投资机构产业研究人员
    source_relation: direct_requirement
    source_refs: [BID-ENT-ROOT, BID-ENT-SZSTATUS, BID-ENT-SZSTATUS-CITY]
    route: /enterprise-center/shenzhen-enterprise-status-analysis?view=city-benchmark
    ia_nodes: [多城市横向对标, 独立雷达对比工作区, 当前产业链相对观察, 城市指标对比表]
    wireframe_frames: [F-SZSTATUS-03]
    acceptance_refs: [SZSTATUS-USM-07, SZSTATUS-USM-08, SZSTATUS-USM-09, SZSTATUS-USM-10, SZSTATUS-USM-17, SZSTATUS-USM-18, SZSTATUS-USM-21]
    metrics:
      - M_ENT_CITY_AVG_TECH_POWER
      - GAP-SZSTATUS-CITY-AVG-BUSINESS-POWER
      - M_ENT_CITY_DENSITY
      - M_ENT_CHAIN_COMPLETENESS
    open_questions:
      - Q014
      - Q016
      - GAP-SZSTATUS-DENSITY-DENOMINATOR
      - GAP-SZSTATUS-CHAIN-COMPLETENESS-FORMULA
    review_mounts:
      - ENT-SZSTATUS-F03-TITLE-REQ
      - ENT-SZSTATUS-F03-CITY-METRIC
      - ENT-SZSTATUS-F03-CITY-PENDING
      - ENT-SZSTATUS-F03-RADAR-NOTE
    comparison_contract:
      primary_precision_surface: city_rows_metric_columns_table
      structure_overview_surface: independent_radar_comparison_workspace
      fixed_rows: [深圳, 全国参照]
      benchmark_city_pool: nationwide_reference_plus_selected_cities
      radar_object_a: 深圳固定
      radar_object_b: 从全国参照与当前已选重点城市中单选
      radar_object_b_default: 全国参照
      radar_max_series: 2
      radar_object_b_removed_fallback: 全国参照
      relative_observation_scope: radar_object_a_vs_b
      table_page_size: 5
      table_fixed_columns: {left: 对象, right: 数据状态}
      table_middle_columns_scroll_x: true
      table_presentation_does_not_change_analysis_context: true
      city_pool_change_resets_table_page: 1
      comparable_metric_minimum_for_radar: 3
      missing_value_treatment: unavailable_not_zero
      shared_data_time_placement: table_title
      conclusion_boundary: relative_strengths_and_gaps_only

  - id: US-SZSTATUS-04
    title: 在两个分析任务之间保持同一深圳产业链坐标系
    role: 政府产业治理人员
    source_relation: product_interpretation
    interpretation_basis: E-25.1 与 E-25.2 必须围绕同一深圳产业链对象形成可解释的定位与对标结果。
    decision_ref: DEC-SZSTATUS-TABS-20260723
    route: /enterprise-center/shenzhen-enterprise-status-analysis
    ia_nodes: [页面共享层]
    wireframe_frames: [F-SZSTATUS-00, F-SZSTATUS-01, F-SZSTATUS-03]
    acceptance_refs: [SZSTATUS-USM-11, SZSTATUS-USM-12, SZSTATUS-USM-21]
    metrics: []
    open_questions: []
    review_mounts: [ENT-SZSTATUS-F00-TITLE-REQ, ENT-SZSTATUS-F00-DEMO-DISCLOSURE]

