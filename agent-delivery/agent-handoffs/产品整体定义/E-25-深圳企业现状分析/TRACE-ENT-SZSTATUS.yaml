original_requirement_sources:
  - id: BID-ENT-ROOT
    file: agent-delivery/bid-reference/科技信息展示系统和科技专题服务系统.md
    section: "§1.1.1.2.4.2.3 企业分析"
    relation: direct_requirement
    summary: 企业分析面向政府、园区与投资机构，支撑产业治理、招商育商和企业服务。
  - id: BID-ENT-SZSTATUS
    file: agent-delivery/bid-reference/科技信息展示系统和科技专题服务系统.md
    section: "§1.1.1.2.4.2.3.5 深圳企业现状分析"
    relation: direct_requirement
    summary: 聚焦深圳本地企业，按产业链或环节筛选并与全国及重点城市对标，评估链上位置、竞争力和生态完整性。
  - id: BID-ENT-SZSTATUS-CHAIN
    file: agent-delivery/bid-reference/科技信息展示系统和科技专题服务系统.md
    section: "§1.1.1.2.4.2.3.5.1 深圳企业产业链定位"
    relation: direct_requirement
    summary: 按选择的产业链提取深圳企业清单并标注链中角色。
  - id: BID-ENT-SZSTATUS-CITY
    file: agent-delivery/bid-reference/科技信息展示系统和科技专题服务系统.md
    section: "§1.1.1.2.4.2.3.5.2 多城市横向对标分析"
    relation: direct_requirement
    summary: 深圳企业群与北京、上海、苏州等城市比较平均技术力、商业力和企业密度，识别优势与短板。

derived_definition_sources:
  - id: DEC-SZSTATUS-PLACEMENT-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 一级分析域按技术链分析、产业链分析、企业分析排列；只移动完整一级分组，深圳企业现状分析仍作为独立二级页面放在重点企业分析之后、对比篮之前。
  - id: DEC-SZSTATUS-NEW-ROUTE-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 不复用或继续修改旧 /enterprise/status-analysis，由新完整权威路由承接 E-25。
  - id: DEC-SZSTATUS-TABS-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 页面采用产业链定位和多城市横向对标两个平级 Tab，深圳为固定分析锚点。
  - id: DEC-SZSTATUS-ENTERPRISE-ACTIONS-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 企业清单只提供查看企业详情和加入对比篮；不在本页生成评估、风险或引育结果。
  - id: DEC-SZSTATUS-LIST-SELECT-ALL-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 企业清单直接位于产业链定位页，批量操作栏提供全选当前结果、取消全选、已选数量和加入对比篮。
  - id: DEC-SZSTATUS-FULL-DETAIL-DRAWER-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 查看详情不是企业摘要或画像概览，而是以宽幅 Drawer 嵌入完整企业详情页签。
  - id: DEC-SZSTATUS-CITY-TABLE-MODE-20260723
    type: explicit_human_decision
    approved_by: "human:高颖"
    summary: 城市为行、指标为列的表格作为精确对比主载体；雷达承担结构概览；业务与评审模式按字段、动作、状态和挂点隔离。
  - id: CURRENT-FOUR-PACK
    type: current_derived_definition
    files:
      - IA-ENT-SZSTATUS.md
      - TRACE-ENT-SZSTATUS.yaml
      - USM-ENT-SZSTATUS.md
      - Wireframe-ENT-SZSTATUS.md

