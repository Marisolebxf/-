  - id: US-SZSTATUS-01
    title: 定位深圳企业的产业链角色
    role: 政府产业治理人员
    source_relation: direct_requirement
    source_refs: [BID-ENT-ROOT, BID-ENT-SZSTATUS, BID-ENT-SZSTATUS-CHAIN]
    route: /enterprise-center/shenzhen-enterprise-status-analysis?view=chain-position
    ia_nodes: [页面共享层, 产业链定位, 链条环节与角色分布]
    wireframe_frames: [F-SZSTATUS-00, F-SZSTATUS-01]
    acceptance_refs: [SZSTATUS-USM-01, SZSTATUS-USM-02, SZSTATUS-USM-03]
    metrics: [M_ENT_SZ_COUNT, M_ENT_KEY_NODE_COUNT, M_ENT_CHAIN_COMPLETENESS, M_ENT_SZ_CHAIN_POSITION]
    open_questions: [GAP-SZSTATUS-CHAIN-COMPLETENESS-FORMULA]
    review_mounts:
