    route: /industry-center/results/:resultId
    frame_ids: [F-CHAIN-04]
    depends_on_stories: [US-CHAIN-TOPIC-04, US-SYS-JOBS-05]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 成功结果以不可变快照呈现阶段、回溯、预测、驱动因素和潜在拐点。
      - 过期结果仍可只读查看，但不得静默刷新或用于新正式报告。
  - id: US-CHAIN-TOPIC-06
    title: 确认并提交产业关键环节识别
    source_relation: direct_requirement
    role: ROLE-CHAIN-PARK
    requirement_refs: [REQ-CHAIN-TOPIC-04]
    compliance_refs: [REQ-CHAIN-TOPIC-04]
    execution_authority: ../CHAIN-TOPIC-DIAGNOSIS-产业运行诊断/TRACE-CHAIN-TOPIC-DIAGNOSIS.yaml
    route: /industry-center/diagnosis?tab=key-link
    frame_ids: [F-CHAIN-05]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 仅接受一个 industry_chain；只读确认已注册固定模型因子并点击“生成分析”后，创建任务并进入统一可视化过程壳层。
      - 因子或模型版本不可用时禁止提交，不提供伪可编辑权重或无意义模板保存。
  - id: US-CHAIN-TOPIC-07
    title: 查看完整链条中的关键环节结果
    source_relation: direct_requirement
    role: ROLE-CHAIN-PARK
    requirement_refs: [REQ-CHAIN-TOPIC-04]
    compliance_refs: [REQ-CHAIN-TOPIC-04]
    execution_authority: ../CHAIN-TOPIC-DIAGNOSIS-产业运行诊断/TRACE-CHAIN-TOPIC-DIAGNOSIS.yaml
    route: /industry-center/results/:resultId
    frame_ids: [F-CHAIN-05]
    depends_on_stories: [US-CHAIN-TOPIC-06, US-SYS-JOBS-05]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 保留完整链条并标注关键环节、排名、竞争格局、代表企业与技术趋势。
      - 指标证据缺失时不得补造关键标注；代表企业只可交接共享企业抽屉与企业篮。
  - id: US-CHAIN-TOPIC-08
    title: 确认并提交产业瓶颈堵点识别
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-05]
    compliance_refs: [REQ-CHAIN-TOPIC-05]
    execution_authority: ../CHAIN-TOPIC-DIAGNOSIS-产业运行诊断/TRACE-CHAIN-TOPIC-DIAGNOSIS.yaml
    route: /industry-center/diagnosis?tab=bottleneck
    frame_ids: [F-CHAIN-06]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 仅接受一个 industry_chain；只读确认注册的技术、人才、资本、政策等维度并点击“生成分析”后，进入统一可视化过程壳层。
      - 维度、阈值或来源未就绪时禁止正式提交并显示对应 gap，不允许前端临时自定。
  - id: US-CHAIN-TOPIC-09
    title: 查看瓶颈归因与改进建议结果
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-05]
    compliance_refs: [REQ-CHAIN-TOPIC-05]
    execution_authority: ../CHAIN-TOPIC-DIAGNOSIS-产业运行诊断/TRACE-CHAIN-TOPIC-DIAGNOSIS.yaml
    route: /industry-center/results/:resultId
    frame_ids: [F-CHAIN-06]
    depends_on_stories: [US-CHAIN-TOPIC-08, US-SYS-JOBS-05]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 结果展示全链健康、维度矩阵、瓶颈位置、原因和建议，并绑定模型与数据版本。
      - 数据不足时不得把 Mock 结论当正式诊断，评审模式与业务模式边界明确。
  - id: US-CHAIN-TOPIC-10
    title: 配置预览并提交区域产业指数评价
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-03]
    compliance_refs: [REQ-CHAIN-TOPIC-03]
    execution_authority: ../CHAIN-TOPIC-REGIONAL-区域产业评价/TRACE-CHAIN-TOPIC-REGIONAL.yaml
    route: /industry-center/regional?tab=index
    frame_ids: [F-CHAIN-07]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 支持 1产业+1至5区域或2至5产业+1区域，权重合计100%，轻量预览不创建任务。
      - 用户点击“生成分析”并通过最终校验后创建任务，轻量预览与正式过程严格区分，正式任务进入统一可视化过程壳层。
      - 本期预设指标可勾选但不允许创建或删除指标；自定义指标差异必须可见且不宣称满足。
  - id: US-CHAIN-TOPIC-11
    title: 查看区域产业指数及优势短板
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-03]
    compliance_refs: [REQ-CHAIN-TOPIC-03]
    execution_authority: ../CHAIN-TOPIC-REGIONAL-区域产业评价/TRACE-CHAIN-TOPIC-REGIONAL.yaml
    route: /industry-center/results/:resultId
    frame_ids: [F-CHAIN-07]
    depends_on_stories: [US-CHAIN-TOPIC-10, US-SYS-JOBS-05]
