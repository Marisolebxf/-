    acceptance:
      - 结果按对象组合呈现综合指数、维度、指标贡献、优势与短板，并可核对原配置。
      - 无可比数据或口径不兼容时不生成误导性排名，明确不可比较对象和原因。
  - id: US-CHAIN-TOPIC-12
    title: 配置并提交区域产业竞争力评价
    source_relation: direct_requirement
    role: ROLE-CHAIN-PARK
    requirement_refs: [REQ-CHAIN-TOPIC-08]
    compliance_refs: [REQ-CHAIN-TOPIC-08]
    execution_authority: ../CHAIN-TOPIC-REGIONAL-区域产业评价/TRACE-CHAIN-TOPIC-REGIONAL.yaml
    route: /industry-center/regional?tab=competitiveness
    frame_ids: [F-CHAIN-08]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 对象组合沿用区域合同，固定企业能力、学术生态、配套环境三维，只允许调整一级权重。
      - 用户点击“生成分析”并通过最终校验后创建任务，进入统一可视化过程壳层。
      - 任一固定维度不可用时禁止正式提交或按已批准降级处理，不得静默改成两维模型。
  - id: US-CHAIN-TOPIC-13
    title: 查看区域产业竞争力排名与短板
    source_relation: direct_requirement
    role: ROLE-CHAIN-PARK
    requirement_refs: [REQ-CHAIN-TOPIC-08]
    compliance_refs: [REQ-CHAIN-TOPIC-08]
    execution_authority: ../CHAIN-TOPIC-REGIONAL-区域产业评价/TRACE-CHAIN-TOPIC-REGIONAL.yaml
    route: /industry-center/results/:resultId
    frame_ids: [F-CHAIN-08]
    depends_on_stories: [US-CHAIN-TOPIC-12, US-SYS-JOBS-05]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 呈现综合排名、三维对比、热力图及优势短板，并绑定评价对象和权重快照。
      - 权重或数据版本不一致时不同结果不得被直接混排，必须提示版本边界。
  - id: US-CHAIN-TOPIC-14
    title: 配置并提交深圳产业情况对比
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-06]
    compliance_refs: [REQ-CHAIN-TOPIC-06]
    execution_authority: ../CHAIN-TOPIC-SHENZHEN-深圳产业决策/TRACE-CHAIN-TOPIC-SHENZHEN.yaml
    route: /industry-center/shenzhen?tab=comparison
    frame_ids: [F-CHAIN-09]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 固定深圳，选择一个 industry 与1至5个国内或国际标杆区域，只读确认四维模型和区域就绪情况。
      - 用户点击“生成分析”并通过最终校验后创建任务，进入统一可视化过程壳层。
      - 标杆区域无兼容数据时不可选；至少一个有效标杆且权限通过才能创建任务。
  - id: US-CHAIN-TOPIC-15
    title: 查看深圳产业优势差距与阶段判断
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-06]
    compliance_refs: [REQ-CHAIN-TOPIC-06]
    execution_authority: ../CHAIN-TOPIC-SHENZHEN-深圳产业决策/TRACE-CHAIN-TOPIC-SHENZHEN.yaml
    route: /industry-center/results/:resultId
    frame_ids: [F-CHAIN-09]
    depends_on_stories: [US-CHAIN-TOPIC-14, US-SYS-JOBS-05]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 结果呈现四维对比、综合结论、优势差距、产业化潜力和发展阶段。
