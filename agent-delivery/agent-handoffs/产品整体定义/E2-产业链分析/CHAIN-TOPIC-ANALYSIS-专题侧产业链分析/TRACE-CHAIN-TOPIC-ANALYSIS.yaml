stories:
  - id: US-CHAIN-TOPIC-01
    title: 发现并保存兼容的产业对象
    source_relation: product_interpretation
    role: ROLE-CHAIN-PARK
    requirement_refs: []
    compliance_refs: []
    route: /industry-center/search
    frame_ids: [F-CHAIN-01]
    depends_on_stories: [SYS-COMPARE-WORKSPACE]
    planned_tier: null
    metrics: []
    acceptance:
      - 三种检索模式只返回 industry 与 industry_chain，并提供可解释摘要；无已执行条件时只展示带理由的确定性推荐产业，执行有效查询后切换检索结果且零命中保持空态。
      - 智能检索将已识别的字段化匹配关键词显示在搜索框下方并支持逐项移除；移除后按剩余关键词重算，结果卡不重复显示匹配关键词；未识别时在输入区说明多字段降级。
      - 点击高级筛选进入同路由独立高筛页面；点击热门产业进入该页面并预置对应父级产业条件，应用前不得执行查询或在蓝色查询主视觉内展开字段编辑。
      - 普通检索条件与结果之间显示当前模式的最近检索；智能检索或查产业仅在有效执行后写入，点击记录恢复条件并立即重跑；记录按标题去重、最多 10 条、可清除，示例预填和热门产业未应用时不得写入。
      - 普通检索必须挂载与企业查询相同的要素无关查询工作台和最近检索组件，并保持模式栏→输入/SmartChip→快捷入口→最近检索→推荐或结果的结构顺序；产业字段、数据、卡片与入篮动作通过配置或插槽注入，不得复制共享布局。
      - 推荐态不显示复选框或批量工具栏，通过单卡查看摘要、进入全景图谱和加入对比篮完成操作；检索结果态才启用首个勾选锁定类型、全选本页和批量加入对比篮。
      - 卡片与对象摘要抽屉跳转统一为进入全景图谱；industry 与 industry_chain 均进入 /industry-center/panorama 并携带对象身份与查询返回上下文；产业入口展开所含产业链；不得出现去门户总览或打开专题全景。
      - 同一次选择锁定对象类型；已入篮、不可用或权限撤回对象不得被重复加入或泄露敏感摘要。
      - 权限受限对象与对象或数据暂不可用对象使用不同状态：前者显示 Arco 锁图标、权限原因和锁定动作，保留允许公开的元数据但隐藏敏感摘要，并锁定查看摘要、进入全景图谱、选择与加入对比篮；后者显示普通不可用原因且不得使用权限锁语义。两者均不得由 Mock 用户反推具体 L0-L4 门槛。
  - id: US-CHAIN-TOPIC-02
    title: 浏览产业链完整结构并下钻节点
    status: superseded
    historical_trace_only: true
    superseded_by: [US-CHAIN-PANORAMA-02, US-CHAIN-PANORAMA-03]
    execution_authority: ../CHAIN-TOPIC-PANORAMA-产业链全景图谱/TRACE-CHAIN-TOPIC-PANORAMA.yaml
    source_relation: direct_requirement
    role: ROLE-CHAIN-PARK
    requirement_refs: [REQ-CHAIN-TOPIC-01]
    compliance_refs: [REQ-CHAIN-TOPIC-01]
    route: /industry-center/panorama
    frame_ids: [F-CHAIN-02, F-CHAIN-03]
    split_exception_reason: 主画布与绑定当前节点的详情共同交付一次不可分的结构认知结果；单独任一 Frame 都不能完成节点下钻。
    depends_on_stories: []
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - industry 入口先展示所属链，industry_chain 入口直接展示完整正式环节与关系。
      - 节点详情绑定当前快照，企业可打开共享抽屉；技术路线不形成技术分析入口。
  - id: US-CHAIN-TOPIC-03
    title: 对比产业链快照并观察动态演进
    status: superseded
    historical_trace_only: true
    superseded_by: [US-CHAIN-PANORAMA-04]
    execution_authority: ../CHAIN-TOPIC-PANORAMA-产业链全景图谱/TRACE-CHAIN-TOPIC-PANORAMA.yaml
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-01]
    compliance_refs: [REQ-CHAIN-TOPIC-01]
    route: /industry-center/panorama
    frame_ids: [F-CHAIN-02, F-CHAIN-03]
    split_exception_reason: 时间控制与画布变化必须共同呈现同一空间基线上的演进结果。
    depends_on_stories: [US-CHAIN-TOPIC-02]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 单时间点、双快照和时间轴播放共用稳定布局，变化可追溯到具体节点与快照。
      - 快照不可用或时间范围无数据时保持当前有效视图并明确失败原因。
  - id: US-CHAIN-TOPIC-04
    title: 配置并提交产业周期分析
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-02]
    compliance_refs: [REQ-CHAIN-TOPIC-02]
    execution_authority: ../CHAIN-TOPIC-DIAGNOSIS-产业运行诊断/TRACE-CHAIN-TOPIC-DIAGNOSIS.yaml
    route: /industry-center/diagnosis?tab=cycle
    frame_ids: [F-CHAIN-04]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    planned_tier: null
    metrics: [GAP-CHAIN-TOPIC-METRICS]
    acceptance:
      - 仅接受一个 industry；用户点击“生成分析”后冻结注册参数、模型和数据版本，创建新 task_id 并进入统一可视化过程壳层。
      - 对象、权限、参数或并发校验失败时不创建任务，保留可修正草稿。
  - id: US-CHAIN-TOPIC-05
    title: 阅读产业周期判断与趋势预测结果
    source_relation: direct_requirement
    role: ROLE-CHAIN-GOV
    requirement_refs: [REQ-CHAIN-TOPIC-02]
    compliance_refs: [REQ-CHAIN-TOPIC-02]
