    owner: SYS-ANALYSIS-JOBS
    stories: [US-SYS-JOBS-01, US-SYS-JOBS-02, US-SYS-JOBS-03, US-SYS-JOBS-04, US-SYS-JOBS-05]
    lifecycle:
      non_terminal: [created, prechecking, queued, running]
      terminal: [succeeded, failed, withdrawn, terminated]
      user_withdrawable: [queued]
      user_cancellable: []
      note: queued 撤回后进入 withdrawn 并释放同类互斥；running 不向普通用户提供取消。
    interaction_shell_reuse_contract:
      reference_implementation: enterprise_evaluation_config_processing_result_flow
      evidence_only_not_requirement_source: true
      reuse_level: page_shell_state_and_action_contract
      common_flow: [object_and_configuration, generate_analysis, visualized_processing, explicit_view_result, immutable_result, generate_report]
      reused_hosts:
        - 任务摘要：task_id、分析类型、对象摘要、状态、队列位置或已用时间
        - 阶段 Steps：当前阶段、已完成、等待、失败与完成反馈
        - 当前阶段提示：后台继续、离页恢复、失败重试或复制配置说明
        - 完成动作：succeeded 后显式“查看结果”，不得自动跳转
        - 结果交接：不可变结果身份与“生成报告”动作
      prohibited_reuse:
        - 企业评估对象、模板、指标、权重与企业数量字段
        - 企业评估六个阶段的领域文案
        - 企业评估雷达图、排名、得分和报告章节
        - 演示计时推进、虚构百分比或仅 Spinner 的伪过程
      required_domain_registration: [analysis_type, object_summary, configuration_summary, stage_definitions, result_route, result_content_slot, report_type]
      domain_owner: CHAIN-TOPIC-ANALYSIS
    domain_stage_registry:
      # cycle 执行权威在 CHAIN-TOPIC-DIAGNOSIS；此处仅溯源镜像，禁止并行改文案
      cycle:
        - 任务提交与参数冻结
        - 整合产业参数与联网检索的历史与市场数据
        - 大语言模型推理与周期阶段判断（诊断）
        - 基于全网检索动态归纳趋势预测、关键驱动因素与潜在拐点
        - 结果可信性校验与分析报告组装
      # key_link 执行权威在 CHAIN-TOPIC-DIAGNOSIS；此处仅溯源镜像
      key_link:
        - 任务提交与产业链对象冻结
        - 全链路环节结构化拆解（研发/设计/制造/销售/服务）
        - 基于附加值率、技术壁垒、市场集中度计算高端化指数
        - 关键环节智能标注与竞争格局/代表企业/技术趋势归纳
        - 结果可信性校验与分析报告组装
      # bottleneck 执行权威在 CHAIN-TOPIC-DIAGNOSIS；此处仅溯源镜像
      bottleneck:
        - 任务提交与产业链对象冻结
        - 整合各环节技术/人才/资本/政策等时序数据
        - 基于技术成熟度、人才供给量、融资事件、政策覆盖率计算环节健康度
        - 瓶颈智能识别与卡脖子环节归因/改进建议生成
        - 结果可信性校验与靶向方案/报告组装
      regional_index: [任务提交, 权限与配置校验, 产业与区域数据准备, 区域产业指数计算, 可比性与可信性校验, 结果图表与结论组装]
      regional_competitiveness: [任务提交, 权限与配置校验, 产业与区域数据准备, 区域竞争力计算, 可比性与可信性校验, 排名图表与结论组装]
      shenzhen_comparison: [任务提交, 权限与配置校验, 深圳与标杆数据准备, 产业对标分析, 可比性与可信性校验, 对比图表与结论组装]
      shenzhen_development: [任务提交, 权限与来源结果校验, 对比结果与目标准备, 发展建议与路径生成, 依据与完整性校验, 建议路径与结论组装]
  report_jobs:
    owner: SYS-ANALYSIS-JOBS
    stories: [US-SYS-JOBS-06]
