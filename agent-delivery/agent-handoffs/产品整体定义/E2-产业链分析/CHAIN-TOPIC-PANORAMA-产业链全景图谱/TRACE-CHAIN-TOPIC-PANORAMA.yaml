stories:
  - id: US-CHAIN-PANORAMA-01
    title: 确认唯一产业链对象
    source_relation: product_interpretation
    role: ROLE-PAN-PARK
    requirement_refs: []
    compliance_refs: [IC-29, IC-30]
    frame_ids: [F-PAN-01, F-PAN-02]
    depends_on_stories: []
    metrics: []
    acceptance:
      - 无对象进菜单补默认推荐产业+首条1级链秒开；换对象走页内产业/链Select；清空保持空态不写回默认；禁止打开对比篮作为换对象主路径。
      - 分析对象只选level0产业；所属产业链再选level1链；数据截至可选；改条件后开始分析并套分析过程壳；本页无查看报告。
      - 对比篮/查询预跑条件秒开不创建任务；改条件后才创建chain:panorama任务；本页主路径不经篮。
      - ReviewMode投影CHAIN-PAN-F01-OBJECT-MODAL-TITLE于Select标签，BusinessMode必须absent且不改变对象或权限。
  - id: US-CHAIN-PANORAMA-02
    title: 浏览完整产业链结构
    source_relation: direct_requirement
    role: ROLE-PAN-PARK
    requirement_refs: [REQ-CHAIN-PANORAMA-STRUCTURE, REQ-CHAIN-PANORAMA-MODEL-SERVICE]
    compliance_refs: [IC-12, IC-16, IC-30]
    frame_ids: [F-PAN-02]
    depends_on_stories: [US-CHAIN-PANORAMA-01]
    metrics: []
    acceptance:
      - 全部正式环节和关系可达，不静默折叠、聚合或分页。
      - 前端只渲染服务返回关系，不推断或补造关系。
      - 断点是关系完整性缺口，使用红色虚线和中文断点文本，可选中并查看详情；不得用瓶颈关注节点状态代替。
      - 页面内容容器保持16px内边距；左侧布局外层无额外卡片视觉；系统通用工具栏位于图谱左上，五色中文演进图例位于左下；时间轴与图谱间距16px且共同位于首屏内。
      - 业务界面使用数据截至、当前状态、状态对比和演进时间轴，不显示快照或schema版本；状态标识在工具栏下方16px，图例单列，工作区充满首屏，双状态窄于1100px自动纵向。
      - 结构列表仅展示当前发布结构；进入时停止播放并回当前状态，隐藏演进控制、图例及详情变化标识。
      - ReviewMode投影CHAIN-PAN-F02-PANORAMA-TITLE，BusinessMode必须absent且不改变画布容量。
  - id: US-CHAIN-PANORAMA-03
    title: 下钻节点并查看关联详情
    source_relation: direct_requirement
    role: ROLE-PAN-PARK
    requirement_refs: [REQ-CHAIN-PANORAMA-DRILL-EVOLUTION, REQ-CHAIN-PANORAMA-MODEL-SERVICE]
    compliance_refs: [IC-12, IC-16, IC-30]
    frame_ids: [F-PAN-02, F-PAN-03]
    split_exception_reason: 主画布选中与绑定详情共同交付一次不可分的下钻结果。
    depends_on_stories: [US-CHAIN-PANORAMA-02]
    metrics: [M_CHAIN_MARKET_SIZE]
    acceptance:
      - 详情绑定chain_id、node_id、snapshot_id，失败不重置画布。
      - 复合环节在服务返回child_nodes/child_edges时可进入可递归子结构；叶子环节进入关联企业/主流技术路线/市场规模。返回上级恢复复合节点选中、高亮、详情和视口。
      - 主流技术路线显示前置投入、技术或工艺步骤、产出或应用及方向，不得以技术标签列表改名代替。
      - 人才科研、服务供应是算法多源输入和可查主体范围，无独立展示需求时不转换为本页Tab。
      - 关联企业卡、共享企业画像抽屉和企业对比篮使用同一企业主记录及稳定ID；查看企业不得使用节点临时ID或打开空详情。
      - 主要投入和主要产出仅在概要显示；路线卡可引用其中的路径端点，但不再复制整段概要。
      - 左侧外层仅承担布局且无额外卡片视觉；右侧演进状态条位于面包屑之后、概要和列表之前，同一变化类型不在概要重复。
      - 环节状态Tag按内容自适应宽度；瓶颈关注橙、关键环节蓝、稳健环节青，企业在营深青，演进新增绿，语义色彼此可区分。
      - 市场规模无正式源时值为空并显示暂无正式数据源。
      - ReviewMode投影CHAIN-PAN-F03-MARKET-SIZE-PENDING，BusinessMode仅保留业务空值文案而无评审标识。
  - id: US-CHAIN-PANORAMA-04
    title: 对比固定快照并观察动态演进
    source_relation: direct_requirement
    role: ROLE-PAN-GOV
    requirement_refs: [REQ-CHAIN-PANORAMA-DRILL-EVOLUTION, REQ-CHAIN-PANORAMA-MODEL-SERVICE]
    compliance_refs: [IC-16, IC-30]
    frame_ids: [F-PAN-02, F-PAN-03]
    split_exception_reason: 模式控制、稳定画布与变化证据共同构成不可分结果。
    depends_on_stories: [US-CHAIN-PANORAMA-02, US-CHAIN-PANORAMA-03]
    metrics: []
    decision_refs: [Q062]
    acceptance:
      - V1只比较同一chain_id的两个固定快照。
      - 新增、退出、关系变化、主体变化、技术替代均绑定证据；界面以不同语义色和中文文本区分；IconExclamationCircle加待补证及Q062浮层、schema版本仅ReviewMode显示，BusinessMode必须absent，内部状态为pending。
      - 节点详情、关系详情和演进记录的变化Tag与图例使用同一映射：新增绿、退出红、关系变化蓝、主体变化紫、技术替代橙。
      - 演进时间轴位于图谱下方并保持16px间距；图谱让出所需高度，保证图谱和时间轴共同位于首屏可用空间内。
      - 不宣称实时，不生成无证据差异或变化数量KPI。
      - ReviewMode投影CHAIN-PAN-F03-EVOLUTION-TITLE，BusinessMode必须absent且不改变快照身份。

