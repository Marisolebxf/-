stories:
  - id: US-CHAIN-REG-01
    title: 配置预览并提交区域产业指数评价
    source_relation: direct_requirement
    role: ROLE-REG-GOV
    requirement_refs: [REQ-CHAIN-REG-01]
    compliance_refs: [REQ-CHAIN-REG-01]
    route: /industry-center/regional?tab=index
    frame_ids: [F-REG-02]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    parent_story_alias: US-CHAIN-TOPIC-10
    metrics: [GAP-CHAIN-REG-METRICS]
    acceptance:
      - 支持 1产业+1至5区域或2至5产业+1区域（评价对象可配），权重合计100%；配置即时汇总不创建任务；无独立轻量预览按钮。
      - 用户点击“生成分析”并通过最终校验后创建任务；禁止静默归一化权重；任务固化 template_id/version + 指标权重快照。
      - 默认加载官方系统模板；表内仅已选指标，禁止默认铺全库；可通过「添加指标」下拉追加库内项。
      - 可「保存为个人模板」（名称+指标+权重，不含对象）；模板选择器含系统模板/我的模板/当次配置。
      - 已选指标分组可见商业力/技术力/学术力/支撑力（原型加工词）；旁注 ⚠️ QC11；不宣称国标终态命名。
  - id: US-CHAIN-REG-02
    title: 查看区域产业指数及优势短板
    source_relation: direct_requirement
    role: ROLE-REG-GOV
    requirement_refs: [REQ-CHAIN-REG-01]
    compliance_refs: [REQ-CHAIN-REG-01]
    route: /industry-center/results/:resultId
    frame_ids: [F-REG-02]
    depends_on_stories: [US-CHAIN-REG-01, US-SYS-JOBS-05]
    parent_story_alias: US-CHAIN-TOPIC-11
    metrics: [GAP-CHAIN-REG-METRICS]
    acceptance:
      - 结果按对象组合呈现综合指数、四力维度对比、指标贡献、优势与短板，并可核对原配置。
      - 无可比数据或口径不兼容时不生成误导性排名。
      - 维度文案与配置快照一致；确认前保留 ⚠️ QC11，不把四力写成展示 Bid 原文。
  - id: US-CHAIN-REG-03
    title: 配置并提交区域产业竞争力评价
    source_relation: direct_requirement
    role: ROLE-REG-PARK
    requirement_refs: [REQ-CHAIN-REG-02]
    compliance_refs: [REQ-CHAIN-REG-02]
    route: /industry-center/regional?tab=competitiveness
    frame_ids: [F-REG-03]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    parent_story_alias: US-CHAIN-TOPIC-12
    metrics: [GAP-CHAIN-REG-METRICS]
    acceptance:
      - 对象组合沿用区域合同，固定三维，只允许调整一级权重至100%。
