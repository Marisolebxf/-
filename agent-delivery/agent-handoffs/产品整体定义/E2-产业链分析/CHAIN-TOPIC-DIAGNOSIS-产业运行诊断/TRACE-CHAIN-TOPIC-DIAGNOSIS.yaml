stories:
  - id: US-CHAIN-DIAG-01
    title: 配置并提交产业周期分析
    source_relation: direct_requirement
    role: ROLE-DIAG-GOV
    requirement_refs: [REQ-CHAIN-DIAG-01]
    compliance_refs: [REQ-CHAIN-DIAG-01]
    route: /industry-center/diagnosis?tab=cycle
    frame_ids: [F-DIAG-02]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    parent_story_alias: US-CHAIN-TOPIC-04
    metrics: [GAP-CHAIN-DIAG-METRICS]
    acceptance:
      - 仅接受一个 industry；业务可见分析上下文含分析时间范围；用户点击“生成分析”后冻结时间范围、参数、模型和数据版本，创建新 task_id，并进入共享任务可视化过程。
      - 过程阶段文案须包含 Bid 原文能力词：联网检索/历史与市场数据、大语言模型、周期阶段判断、趋势预测与驱动因素/拐点、报告组装。
      - 对象、权限、参数或并发校验失败时不创建任务，保留可修正草稿。
      - 权重阈值版本/模型版本/数据截至仅评审态展示，不挤入业务上下文。
  - id: US-CHAIN-DIAG-02
    title: 阅读产业周期判断与趋势预测结果
    source_relation: direct_requirement
    role: ROLE-DIAG-GOV
    requirement_refs: [REQ-CHAIN-DIAG-01]
    compliance_refs: [REQ-CHAIN-DIAG-01]
    route: /industry-center/results/:resultId
    frame_ids: [F-DIAG-02]
    depends_on_stories: [US-CHAIN-DIAG-01, US-SYS-JOBS-05]
    parent_story_alias: US-CHAIN-TOPIC-05
    metrics: [GAP-CHAIN-DIAG-METRICS]
    acceptance:
      - 成功结果以不可变快照呈现「回溯—诊断—预测」结构，含阶段、驱动因素、潜在拐点与决策摘要。
      - 结果顶栏回显冻结的分析时间范围（与提交时上下文一致）。
      - V1 未接通正式检索/LLM 时，检索来源标明固定可回放快照并可见待接通说明；禁止「已完成实时全网检索」完成态文案。
  - id: US-CHAIN-DIAG-03
    title: 确认并提交产业关键环节识别
    source_relation: direct_requirement
    role: ROLE-DIAG-PARK
    requirement_refs: [REQ-CHAIN-DIAG-02, REQ-CHAIN-DIAG-02A, REQ-CHAIN-DIAG-02B]
    compliance_refs: [REQ-CHAIN-DIAG-02]
    route: /industry-center/diagnosis?tab=key-link
    frame_ids: [F-DIAG-03]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    parent_story_alias: US-CHAIN-TOPIC-06
    metrics: [GAP-CHAIN-DIAG-METRICS]
    acceptance:
      - 仅接受一个 industry_chain；只读确认附加值率/技术壁垒/市场集中度等注册因子后点击“生成分析”创建任务。
      - 因子或模型版本不可用时禁止提交，不提供伪可编辑权重。
      - 过程阶段文案须包含 Bid 原文能力词：全链路结构化拆解（研发/设计/制造/销售/服务）、高端化指数、关键环节智能标注、竞争格局/代表企业/技术趋势、报告组装。
  - id: US-CHAIN-DIAG-04
    title: 查看完整链条中的关键环节结果
    source_relation: direct_requirement
    role: ROLE-DIAG-PARK
    requirement_refs: [REQ-CHAIN-DIAG-02, REQ-CHAIN-DIAG-02A, REQ-CHAIN-DIAG-02B]
    compliance_refs: [REQ-CHAIN-DIAG-02]
    route: /industry-center/results/:resultId
    frame_ids: [F-DIAG-03]
    depends_on_stories: [US-CHAIN-DIAG-03, US-SYS-JOBS-05]
    parent_story_alias: US-CHAIN-TOPIC-07
    metrics: [GAP-CHAIN-DIAG-METRICS]
    acceptance:
      - 结果须呈现全链路价值链结构化图谱（五环节节点+有向边，或窄屏等价链式），含研发/设计/制造/销售/服务；不得截断为仅关键节点列表；不得用全景产业链关键路径通图高亮冒充。
      - 各环节须可见功能边界与衔接逻辑说明。
      - 须显式呈现高端化指数，并分色标注「关键环节」与「皇冠明珠」；同步竞争格局、代表企业与技术趋势；正式报告经 ENT-EXPORT 交接。
      - 代表企业使用与全景「关联企业」同构卡片，可查看共享企业画像并加入/移出企业篮；不得跳企业分析页；不得补造关键标注。
      - 结果顶栏须直接显示当前分析对象名称（「{分析对象} · 产业关键环节识别结果」）。
  - id: US-CHAIN-DIAG-05
    title: 确认并提交产业瓶颈堵点识别
    source_relation: direct_requirement
    role: ROLE-DIAG-GOV
    requirement_refs: [REQ-CHAIN-DIAG-03, REQ-CHAIN-DIAG-03A, REQ-CHAIN-DIAG-03B]
    compliance_refs: [REQ-CHAIN-DIAG-03]
    route: /industry-center/diagnosis?tab=bottleneck
    frame_ids: [F-DIAG-04]
    depends_on_stories: [US-SYS-JOBS-01, US-SYS-JOBS-02]
    parent_story_alias: US-CHAIN-TOPIC-08
    metrics: [GAP-CHAIN-DIAG-METRICS]
    acceptance:
      - 仅接受一个 industry_chain；只读确认技术/人才/市场需求/资本/政策五维后提交；页面文案必须用「资本」。
      - 算法 Bid「资金」仅作同维别名，不得拆成第六维；维度未就绪时禁止提交。
      - 过程阶段文案须包含 Bid 原文能力词：时序数据、技术成熟度/人才供给量/融资事件/政策覆盖率、环节健康度、卡脖子、瓶颈智能识别、成因/改进建议、靶向方案/报告组装。
  - id: US-CHAIN-DIAG-06
    title: 查看瓶颈归因与改进建议结果
    source_relation: direct_requirement
    role: ROLE-DIAG-GOV
    requirement_refs: [REQ-CHAIN-DIAG-03, REQ-CHAIN-DIAG-03A, REQ-CHAIN-DIAG-03B]
    compliance_refs: [REQ-CHAIN-DIAG-03]
    route: /industry-center/results/:resultId
    frame_ids: [F-DIAG-04]
    depends_on_stories: [US-CHAIN-DIAG-05, US-SYS-JOBS-05]
    parent_story_alias: US-CHAIN-TOPIC-09
    metrics: [GAP-CHAIN-DIAG-METRICS]
    acceptance:
      - 结果主工区为五环节健康图谱；节点须给出健康度评分与 L1 分档（稳健/关注/薄弱），不得只给链级总分；不得以纸质报告体替代图谱。
      - .5.1 四核心指标名须在过程 Steps 可见；结果主工区为五环节健康图谱与右详情（等高）；不设链级汇总双栏；禁止 Progress 灰卡冒充矩阵；不随点选变化时禁止放右侧详情；顶栏「卡脖子环节数」与图谱卡脖子角标一致且 ⊆ 瓶颈数；政策/项目设计正式出口为报告下载；时序说明 V1 可固定可回放（长说明可评审态）。
      - 词汇分层（DEC-CHAIN-DIAG-BOTTLENECK-VOCAB-LAYERS-20260806）：薄弱=健康分档；瓶颈=清单成员；卡脖子=瓶颈∧severity高；禁断链；图例分健康分档与判定角标两行；详情分列是否瓶颈/是否卡脖子；点选后输出成因、影响、改进建议与趋势预警；正式报告经 ENT-EXPORT 交接。
      - 数据不足时不得把 Mock 结论当正式诊断；评审模式与业务模式边界明确；禁止跳转全景冒充；禁止「薄弱/瓶颈」并格与顶栏「断链」借词。
  - id: US-CHAIN-DIAG-07
    title: 恢复诊断任务与结果
    source_relation: product_interpretation
    role: ROLE-DIAG-GOV
    requirement_refs: []
    compliance_refs: [REQ-CHAIN-DIAG-01, REQ-CHAIN-DIAG-02, REQ-CHAIN-DIAG-03]
    route: /industry-center/diagnosis?tab=records
    frame_ids: [F-DIAG-05]
    depends_on_stories: [US-SYS-JOBS-03, US-SYS-JOBS-04, US-SYS-JOBS-05]
    metrics: []
    acceptance:
      - 可按对象、诊断类型、状态与时间过滤本工作空间历史。
      - 恢复进入对应 Tab/结果，不复制共享任务中心内部故事。
      - 「查看结果」须恢复任务快照中的分析对象并写入结果顶栏；不得因对比篮为空显示「未选分析对象」。

