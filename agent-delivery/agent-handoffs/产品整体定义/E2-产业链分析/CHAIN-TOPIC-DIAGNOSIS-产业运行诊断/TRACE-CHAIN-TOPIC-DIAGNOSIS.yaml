configuration_interpretation:
  cycle:
    editable_parameters: [市场规模, 增长率, 利润率, 技术成熟度]
    context_fields: [分析对象, 所属产业链占位不依赖, 分析时间范围]
    analysis_time_range: business_visible_in_context_frozen_on_submit
    review_only_version_snapshot: [权重阈值版本, 模型版本, 数据截至]
    retrieval_snapshot: fixed_replayable_v1
    realtime_web_claim: prohibited
    process_surface: bid_vocabulary_on_shared_task_stages
    process_stage_contract: |
      配置完成并点击生成分析后，共享任务可视化过程阶段须呈现展示 Bid 原文能力词：
      联网检索/实时网络搜索、历史与市场数据、大语言模型、推理与归纳、
      周期阶段判断、趋势预测、关键驱动因素、潜在拐点、分析报告。
      用户不配置联网方式；过程为只读进度说明。
      V1 未接通时阶段词仍保留，并可见固定可回放快照/待接通说明；禁止「已完成实时全网检索」。
    result_surface: 回溯—诊断—预测；结果顶栏回显冻结的分析时间范围
  key_link:
    registered_factors: [附加值率, 技术壁垒, 市场集中度]
    factor_mapping_note: |
      展示 Bid 父段「技术含量、附加值等指标」映射为子叶 .4.2 三因子：
      附加值率←附加值；技术壁垒←技术含量（及壁垒语义）；市场集中度←结构/竞争集中。
      不另增第四个「技术含量」可编辑因子，避免与算法注册因子分叉。
    editable_formal_weight: prohibited
    editable_formal_threshold: prohibited
    process_stage_contract: |
      配置完成并点击生成分析后，可视化过程阶段须呈现展示 Bid .2.2.4/.4.1/.4.2 原文能力词：
      全链路环节结构化拆解（研发/设计/制造/销售/服务）、功能边界与衔接逻辑、
      附加值率/技术壁垒/市场集中度、高端化指数、关键环节智能标注、
      竞争格局、代表企业、技术趋势报告。
      用户不配置因子公式；过程为只读进度说明。
    result_surface:
      - 结果顶栏显示「{分析对象} · 产业关键环节识别结果」（优先任务快照对象）
      - 全链路五环节价值链结构化图谱（非全景关键路径通图高亮；不得截断为仅关键节点）
      - 各环节功能边界与衔接逻辑
      - 高端化指数；「关键环节 / 皇冠明珠」分色标注
      - 竞争格局、代表企业、技术趋势（报告经 ENT-EXPORT 交接）
  bottleneck:
    registered_dimensions: [技术, 人才, 市场需求, 资本, 政策]
    dimension_alias_note: |
      展示 Bid 原文维度词为「资本」；页面配置、结果与验收文案必须使用「资本」。
      算法 Bid「资金」视为同一维度的服务侧别名，禁止拆成「资本」「资金」两维。
    dimension_set_note: |
      展示 Bid 父段列举技术、人才、资本、政策；算法五维含「市场需求」。
      页面保留五维（含市场需求）以便服务合同对齐；父段四维为展示原文必现维，资本为必用词。
    core_indicators_5_1: [技术成熟度, 人才供给量, 融资事件, 政策覆盖率]
    editable_formal_weight: prohibited
    editable_formal_threshold: prohibited
    process_stage_contract: |
      配置完成并点击生成分析后，可视化过程阶段须呈现展示 Bid .2.2.5/.5.1/.5.2 原文能力词：
      时序数据、技术/人才/资本/政策、技术成熟度/人才供给量/融资事件/政策覆盖率、
      各产业环节健康度评分、薄弱环节、卡脖子、瓶颈智能识别、成因、改进建议、靶向方案。
      用户不配置算法公式；过程为只读进度说明。
    result_surface:
      - 结果顶栏显示「{分析对象} · 产业瓶颈堵点识别结果」（优先任务快照对象）
      - 全链路五环节健康图谱为主工区（节点健康度；非全景；非纸质报告体主区）
      - 结果纵序：图谱+详情（等高）→ 诊断报告；不设链级汇总（五维雷达+四核心对齐表）双栏；顶栏 KPI「卡脖子环节数」与图谱 choke 点位同词；正式带走经 ENT-EXPORT 报告
      - 时序数据参与说明（V1 可固定可回放；长说明评审态）
      - 节点卡脖子/瓶颈点位标注 + 点选后成因/改进建议（可用于政策或项目设计）
      - 趋势预警；正式报告经 ENT-EXPORT 交接

