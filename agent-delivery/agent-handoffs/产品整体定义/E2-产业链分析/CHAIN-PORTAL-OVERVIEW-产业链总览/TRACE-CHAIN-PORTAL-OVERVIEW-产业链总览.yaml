product_interpretations:
  - id: PI-CHAIN-OV-01
    classification: product_interpretation
    title: 单一 L0 产业上下文
    approved_by: human:高颖
    approved_at: "2026-08-06"
    interpretation: 页面只展示一个 industry_id（L0）；顶部先选 15 集群再选该集群 L0（Q068，高颖已补签）；Tab 内不得切换产业或子链。
    supports: [REQ-CHAIN-OV-001, REQ-CHAIN-OV-002]
    decision_ref: DEC-CHAIN-PORTAL-OVERVIEW-L0-L1-20260806
  - id: PI-CHAIN-OV-02
    classification: product_interpretation
    title: 可检索 L0 产业下拉框（与企业查询所属产业一致）
    approved_by: human:高颖
    approved_at: "2026-08-06"
    interpretation: 顶部两级可检索：集群（例：新一代信息技术）→ L0（例：集成电路）；与企业/展示同一份 15 目录；不直接选 L1。
    supports: [REQ-CHAIN-OV-001]
    decision_ref: DEC-CHAIN-PORTAL-OVERVIEW-L0-L1-20260806
  - id: PI-CHAIN-OV-03
    classification: product_interpretation
    title: 五 Tab 归位
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 全景默认，后续依次为整体概况、资讯、发展历程、深圳产业现状。
    supports: [REQ-CHAIN-OV-001, REQ-CHAIN-OV-002, REQ-CHAIN-OV-003, REQ-CHAIN-OV-004]
  - id: PI-CHAIN-OV-04
    classification: product_interpretation
    title: 专业全景首屏（默认 L1 子链）
    approved_by: human:高颖
    approved_at: "2026-08-06"
    interpretation: 选定 L0 后，首屏默认展示其上/中/下游 L1 子链（例：半导体设备、晶圆制造）、主流工艺/环节/依赖关系；不得默认铺开 L2+ 工艺叶子。点击细分产业查看简介与企业列表；更细子链结构经逐级下钻进入。不提供产业链演进控件。
    supports: [REQ-CHAIN-OV-002]
    decision_ref: DEC-CHAIN-PORTAL-OVERVIEW-L0-L1-20260806
  - id: PI-CHAIN-OV-05
    classification: product_interpretation
    title: 全景常驻双栏与对象详情（简介+企业列表）
    approved_by: human:高颖
    approved_at: "2026-08-06"
    interpretation: Bid 写「弹窗」展示简介与企业列表；门户 Demo/V1 以常驻 60% 图谱 + 40% 右栏承载同等内容，比例固定且不可拖拽、折叠。未选择对象时右栏只显示操作引导；节点态展示基础信息、简介与企业列表，不提供核心技术、科研与服务机构、市场规模 Tab；关系态可展示关系语义摘要。图谱是唯一对象选择入口，再次点击已选节点不取消选择。
    supports: [REQ-CHAIN-OV-002]
    decision_ref: DEC-CHAIN-PORTAL-OVERVIEW-PANORAMA-SCOPE-20260806
  - id: PI-CHAIN-OV-06
    classification: product_interpretation
    title: 门户全景不承接动态演进
    approved_by: human:高颖
    approved_at: "2026-08-06"
    interpretation: 门户全景 Tab 不提供「产业链演进」时间状态控件与变化标记；IC-30 动态演进归专题 CHAIN-TOPIC-PANORAMA。门户「产业发展历程」是独立阶段时间轴，不等于图谱演进。
    supports: [REQ-CHAIN-OV-001]
    decision_ref: DEC-CHAIN-PORTAL-OVERVIEW-PANORAMA-SCOPE-20260806
  - id: PI-CHAIN-OV-07
    classification: product_interpretation
    title: 资讯事件线交互
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 默认按时间倒序，支持类型和时间筛选，详情保留原始报道链接。
    supports: [REQ-CHAIN-OV-003]
  - id: PI-CHAIN-OV-08
    classification: product_interpretation
    title: 整体概况独立 Tab
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 整体概况统计整条链，不随全景节点选择而变化。
    supports: [REQ-CHAIN-OV-004]
  - id: PI-CHAIN-OV-09
    classification: product_interpretation
    title: 四级地域与地图列表双视图
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 复用全球/全国/区域/深圳可搜索级联控件；全球固定 G20，全国省市区县下钻；默认全国地图，列表与地图共享状态。
    supports: [REQ-CHAIN-OV-004]
  - id: PI-CHAIN-OV-10
    classification: product_interpretation
    title: 阶段化发展历程
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 按发展阶段组织里程碑、影响和证据；不与资讯事件线混用；也不承担图谱动态演进。
    supports: [REQ-CHAIN-OV-001]
  - id: PI-CHAIN-OV-11
    classification: product_interpretation
    title: 深圳产业现状边界
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 展示深圳关键指标、各区分布、特色优势、集群效应、竞争地位；只读现状，不输出决策建议。
    supports: [REQ-CHAIN-OV-001]
  - id: PI-CHAIN-OV-12
    classification: product_interpretation
    title: 总览接入系统共享对比篮状态
    approved_by: human:高颖
    approved_at: "2026-08-06"
    interpretation: 顶部只提供加入/移出产业对比篮并写入 industry（L0）共享对象域；页面不提供打开全局对比篮按钮、不写入打开信号。用户从系统悬浮入口自行打开全局浮层；本模块不自建 Drawer、不定义浮层内部结构，不得引入关注功能。
    supports: [REQ-CHAIN-OV-001]
    decision_ref: DEC-CHAIN-PORTAL-OVERVIEW-L0-L1-20260806
  - id: PI-CHAIN-OV-13
    classification: product_interpretation
    title: 分模块就地评审挂载
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 每个 Frame 的需求、指标、Mock、Pending 挂在对应可见宿主旁；需求浮层展示完整原文；业务模式全部移除评审层。
    supports: [REQ-CHAIN-OV-001, REQ-CHAIN-OV-002, REQ-CHAIN-OV-003, REQ-CHAIN-OV-004]
  - id: PI-CHAIN-OV-14
    classification: product_interpretation
    title: L1 默认与逐级下钻
    approved_by: human:高颖
    approved_at: "2026-08-06"
    interpretation: 全景默认渲染当前 L0 下的 L1 子链；具备子结构的节点可通过详情区「下钻内部结构」逐级进入更细层级；面包屑返回；切换 L0 清空下钻栈。该下钻仅用于结构浏览，不引入专题演进/技术路线/市场规模详情。
    supports: [REQ-CHAIN-OV-002]
    decision_ref: DEC-CHAIN-PORTAL-OVERVIEW-L0-L1-20260806

product_enhancements: []

stories:
  - id: US-CHAIN-OV-01
    title: 确定并切换当前集群与 L0 产业
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-001, PI-CHAIN-OV-01, PI-CHAIN-OV-02, PI-CHAIN-OV-03]
    frames: [F-CHAIN-OV-01]
    acceptance:
      - 有效入口 cluster_id + industry_id（L0）被使用；仅有 L0 时反查所属集群；无对象时加载后台配置的默认推荐（有映射的集群 + 其默认 L0）。
      - 顶部先列 15 个产业集群，再列该集群已映射 L0；无映射停空态，不造假 L0。支持名称与别名检索；Tab 内无第二个产业/子链选择器。DEC-CHAIN-PORTAL-OVERVIEW-CLUSTER-SELECTOR-20260817 高颖已补签。
      - 切换后保留 Tab，清除下钻栈与旧局部状态。
    review_mounts: [CHAIN-OV-F01-CONTEXT-REQ]
  - id: US-CHAIN-OV-02
    title: 看清 L1 子链结构
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-002, PI-CHAIN-OV-04, PI-CHAIN-OV-14]
    frames: [F-CHAIN-OV-02]
    acceptance:
      - 首屏同时可见上游、中游、下游的 L1 子链（如半导体设备、晶圆制造），不默认铺开 L2+ 工艺叶子。
      - 关系具有方向和业务语义；图中不混入第二条产业。
      - 页面不出现产业链演进控件。
    review_mounts: [CHAIN-OV-F02-PANORAMA-REQ]
  - id: US-CHAIN-OV-03
    title: 查看细分产业简介与企业列表
    role: 企业战略与产业合作人员
    trace_refs: [REQ-CHAIN-OV-002, PI-CHAIN-OV-05]
    frames: [F-CHAIN-OV-03]
    acceptance:
      - 全景常驻 60% 图谱与 40% 对象详情面板（Bid 弹窗的交互解释），比例固定；未选对象时右栏显示操作引导。
      - 节点态展示基础信息、简介与企业列表；不提供核心技术、科研与服务机构、市场规模 Tab。
      - 权限 L0 激活对象时进入登录引导并保留原对象上下文；权限 L1 及以上可查看对象详情。
    review_mounts: [CHAIN-OV-F03-NODE-REQ]
  - id: US-CHAIN-OV-04
    title: （废止）门户全景不承接动态演进
    role: —
    status: withdrawn
    withdrawn_reason: DEC-CHAIN-PORTAL-OVERVIEW-PANORAMA-SCOPE-20260806；能力归专题 CHAIN-TOPIC-PANORAMA / IC-30
    trace_refs: [PI-CHAIN-OV-06]
    frames: []
    acceptance: []
    review_mounts: []
  - id: US-CHAIN-OV-05
    title: 沿事件线追踪产业资讯
    role: 投资机构产业研究人员
    trace_refs: [REQ-CHAIN-OV-003, PI-CHAIN-OV-07]
    frames: [F-CHAIN-OV-05]
    acceptance:
      - 事件线默认时间倒序，可按类型与时间范围筛选。
      - 每条详情展示事件时间、报道时间、来源机构和可访问原始报道链接。
    review_mounts: [CHAIN-OV-F05-NEWS-REQ]
  - id: US-CHAIN-OV-06
    title: 查看整条产业链基础概况
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-004, PI-CHAIN-OV-08]
    frames: [F-CHAIN-OV-06]
    metrics: [M_CHAIN_ENTERPRISE_COUNT, M_CHAIN_INSTITUTION_COUNT]
    acceptance:
      - 展示整链介绍、关联企业数和关联机构数；节点选择不改变整链统计。
      - 每个统计字段具有独立 metric_id 挂载。
    review_mounts: [CHAIN-OV-F06-PROFILE-REQ, CHAIN-OV-F06-ENT-METRIC, CHAIN-OV-F06-ENT-MOCK, CHAIN-OV-F06-ORG-METRIC, CHAIN-OV-F06-ORG-MOCK]
  - id: US-CHAIN-OV-07
    title: 浏览全球与全国空间分布
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-004, PI-CHAIN-OV-09]
    frames: [F-CHAIN-OV-07]
    metrics: [M_CHAIN_ENTERPRISE_COUNT, M_CHAIN_INSTITUTION_COUNT]
    acceptance:
      - 默认全国省级地图；全球只提供 G20 国家，全国可下钻至区县。
      - 地图和列表展示同层同批对象，切换不重置地域路径，列表可定位回地图。
