metric_readiness_contract:
  authority: agent-delivery/metrics/metric-readiness-matrix-CHAIN.yaml
  consumer_mode: read_only
  dimensions: [D1_definition, D2_schema, D3_source_mapping, D4_ingestion]
  projection_rule: 页面评审角标仅消费矩阵状态，不得从旧 mapping_status、Demo 数据或页面常量推断就绪结论。
  schema_assessment: provisional
  scope: [M_CHAIN_MARKET_SIZE, M_CHAIN_ENTERPRISE_COUNT, M_CHAIN_INSTITUTION_COUNT, M_CHAIN_SZ_ENTERPRISE_COUNT, M_CHAIN_SZ_INSTITUTION_COUNT, M_CHAIN_SZ_REGION_COUNT]

module_boundary:
  includes:
    - 当前单一产业链上下文与可检索切换
    - 产业链全景、节点下钻与同链动态演进
    - 产业整体概况、产业资讯、产业发展历程、深圳产业现状
    - 当前产业链加入或移出系统级产业链对比篮
  excludes:
    - 产业查询三种检索模式及结果列表
    - 趋势诊断、区域评价、深圳决策的任务配置、计算、结果与报告
    - 门户内容编辑、审核和发布后台
    - 关注产业链或收藏产业链
    - 前端直接运行图谱或算法计算

route_contract:
  route: /industry-center/overview
  required_context: chain_id
  default_resolution:
    - 使用入口携带且有效的 chain_id
    - 无有效对象时使用后台配置的默认推荐产业链
  tabs: [panorama, profile, news, history, shenzhen]
  default_tab: panorama
  tab_local_state:
    panorama: [evolution_time, node_id, relation_id, detail_mode, detail_tab, graph_view_state]
    profile: [region_path, distribution_view]
    news: [news_type, date_range, event_id]
    history: [phase_id, milestone_id]
    shenzhen: [district_path, distribution_view]
  chain_switch_rule: 保留当前 tab，清除旧链局部状态；对比篮和已提交任务快照不变。

permission_contract:
  exception_policy: none
  source_refs:
    - agent-delivery/agent-handoffs/产品整体定义/全系统角色权限体系设计.md#7-门户垂直主题通用授权模型
    - agent-delivery/agent-handoffs/产品整体定义/权限点清单-菜单与按钮.md#3-通用按钮权限清单
  level_rules:
    L0_GUEST: [view_overview]
    L1_REGISTERED: [view_overview, drill_node_detail, add_or_remove_compare_basket]
    L2_PRO: [L1_capabilities, select_analysis_type, start_analysis]
    L3_INTERNAL: [L2_capabilities, view_sensitive_detail, advanced_configuration]
  fail_closed_rules:
    - L0 触发下钻或对比篮操作时进入登录引导并保留当前 chain_id、Tab 和页面上下文
    - 未获得 L2 时不得从全局对比篮选择分析类型或发起分析
    - 未获得 L3 时不得展示敏感明细或高级配置
    - 前端降级提示不能替代网关和统一权限服务的服务端鉴权
  decision_ref: Q063-resolved-2026-08-01

