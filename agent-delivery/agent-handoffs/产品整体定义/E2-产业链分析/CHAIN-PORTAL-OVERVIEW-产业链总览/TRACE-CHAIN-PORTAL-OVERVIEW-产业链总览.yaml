product_interpretations:
  - id: PI-CHAIN-OV-01
    classification: product_interpretation
    title: 单一产业链上下文
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 页面只展示一个 chain_id；顶部选择器控制全部 Tab，Tab 内不得切换产业链。
    supports: [REQ-CHAIN-OV-001, REQ-CHAIN-OV-002, REQ-CHAIN-OV-005]
  - id: PI-CHAIN-OV-02
    classification: product_interpretation
    title: 可检索产业链下拉框
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 顶部以可检索下拉框快速切换产业链；它不替代产业查询。
    supports: [REQ-CHAIN-OV-001]
  - id: PI-CHAIN-OV-03
    classification: product_interpretation
    title: 五 Tab 归位
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 全景默认，后续依次为整体概况、资讯、发展历程、深圳产业现状。
    supports: [REQ-CHAIN-OV-001, REQ-CHAIN-OV-002, REQ-CHAIN-OV-003, REQ-CHAIN-OV-004]
  - id: PI-CHAIN-OV-04
    classification: product_interpretation
    title: 专业全景首屏
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 首屏展示上中下游及全部链位环节、语义化有向关系、已发布分析标注和证据；企业、技术、机构按节点下钻。
    supports: [REQ-CHAIN-OV-002, REQ-CHAIN-OV-005]
  - id: PI-CHAIN-OV-05
    classification: product_interpretation
    title: 全景常驻双栏与对象详情
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 全景常驻 60% 图谱与 40% 右侧对象详情面板，比例固定且不可拖拽、折叠。未选择对象时右栏只显示操作引导；节点态固定展示名称、阶段、标注、简介、输入、输出、市场规模，下方仅有“关联企业 / 核心技术 / 科研与服务机构”三 Tab；关系态单页展示关系语义与证据。图谱是唯一对象选择入口，再次点击已选节点不取消选择。
    supports: [REQ-CHAIN-OV-002, REQ-CHAIN-OV-005]
  - id: PI-CHAIN-OV-06
    classification: product_interpretation
    title: 产业链演进时间状态与变化标记
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 可见控件统一命名为“产业链演进”，选择当前或历史时间状态只改变 evolution_time、不改变 chain_id；在原 60% 图谱标识新增、退出、技术替代和关系变化，默认相对上一已发布状态计算。变化对象及证据继续在右侧 40% 面板展示，不提供独立“对比变化”按钮、对比模式或对比工作区。仅一个状态时显示“暂无历史演进数据”。
    supports: [REQ-CHAIN-OV-005]
  - id: PI-CHAIN-OV-07
    classification: product_interpretation
    title: 资讯事件线交互
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 默认按时间倒序，支持类型和时间筛选，详情保留原始报道链接。
    supports: [REQ-CHAIN-OV-003]
  - id: PI-CHAIN-OV-08
    classification: product_interpretation
    title: 整体概况独立 Tab
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 整体概况统计整条链，不随全景节点选择而变化。
    supports: [REQ-CHAIN-OV-004]
  - id: PI-CHAIN-OV-09
    classification: product_interpretation
    title: 四级地域与地图列表双视图
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 复用全球/全国/区域/深圳可搜索级联控件；全球固定 G20，全国省市区县下钻；默认全国地图，列表与地图共享状态。
    supports: [REQ-CHAIN-OV-004]
  - id: PI-CHAIN-OV-10
    classification: product_interpretation
    title: 阶段化发展历程
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 按发展阶段组织里程碑、影响和证据；不与资讯事件线或产业链演进混用。
    supports: [REQ-CHAIN-OV-001]
  - id: PI-CHAIN-OV-11
    classification: product_interpretation
    title: 深圳产业现状边界
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 展示深圳关键指标、各区分布、特色优势、集群效应、竞争地位；只读现状，不输出决策建议。
    supports: [REQ-CHAIN-OV-001]
  - id: PI-CHAIN-OV-12
    classification: product_interpretation
    title: 总览接入系统共享对比篮状态
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 顶部只提供加入/移出产业链对比篮并写入 industry_chain 共享对象域；页面不提供打开全局对比篮按钮、不写入打开信号。用户从系统悬浮入口自行打开全局浮层；本模块不自建 Drawer、不定义浮层内部结构，不得引入关注功能。
    supports: [REQ-CHAIN-OV-001]
  - id: PI-CHAIN-OV-13
    classification: product_interpretation
    title: 分模块就地评审挂载
    approved_by: human:高颖
    approved_at: "2026-08-01"
    interpretation: 每个 Frame 的需求、指标、Mock、Pending 挂在对应可见宿主旁；需求浮层展示完整原文；业务模式全部移除评审层。
    supports: [REQ-CHAIN-OV-001, REQ-CHAIN-OV-002, REQ-CHAIN-OV-003, REQ-CHAIN-OV-004, REQ-CHAIN-OV-005]

product_enhancements: []

stories:
  - id: US-CHAIN-OV-01
    title: 确定并切换当前产业链
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-001, PI-CHAIN-OV-01, PI-CHAIN-OV-02, PI-CHAIN-OV-03]
    frames: [F-CHAIN-OV-01]
    acceptance:
      - 有效入口 chain_id 被使用；无对象时加载后台配置的默认推荐产业链。
      - 顶部下拉支持名称与别名检索；Tab 内无第二个产业链选择器。
      - 切换后保留 Tab，清除旧链局部状态。
    review_mounts: [CHAIN-OV-F01-CONTEXT-REQ]
  - id: US-CHAIN-OV-02
    title: 看清产业链完整结构
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-002, REQ-CHAIN-OV-005, PI-CHAIN-OV-04]
    frames: [F-CHAIN-OV-02]
    acceptance:
      - 首屏同时可见上游、中游、下游及全部链位环节。
      - 关系具有方向和业务语义；图中不混入第二条产业链。
      - 已发布关键或瓶颈标注可辨识，并可查看业务证据。
    review_mounts: [CHAIN-OV-F02-PANORAMA-REQ]
  - id: US-CHAIN-OV-03
    title: 下钻环节主体与技术
    role: 企业战略与产业合作人员
    trace_refs: [REQ-CHAIN-OV-002, REQ-CHAIN-OV-005, PI-CHAIN-OV-05]
    frames: [F-CHAIN-OV-03]
    metrics: [M_CHAIN_MARKET_SIZE]
    acceptance:
      - 全景常驻 60% 图谱与 40% 对象详情面板，比例固定；未选对象时右栏显示操作引导。
      - 节点态固定展示概览和三个详情 Tab；关系态展示关系语义与证据，不新增返回或关闭按钮。
      - L0 激活对象时进入登录引导并保留原对象上下文；L1 及以上可查看对象详情。
      - 市场规模无正式数据源时显示不可用状态，不生成虚构数字。
    review_mounts: [CHAIN-OV-F03-NODE-REQ, CHAIN-OV-F03-MARKET-METRIC, CHAIN-OV-F03-MARKET-PENDING, CHAIN-OV-F03-MARKET-MOCK]
  - id: US-CHAIN-OV-04
    title: 查看同一产业链动态演进
    role: 投资机构产业研究人员
    trace_refs: [REQ-CHAIN-OV-005, PI-CHAIN-OV-06]
    frames: [F-CHAIN-OV-04]
    acceptance:
      - “产业链演进”时间状态选择只改变当前 chain_id 的 evolution_time，并在原图谱呈现变化。
      - 新增、退出、关系变化和技术替代具有可区分标记；默认相对上一已发布状态计算，证据在右栏展示。
      - 不提供独立对比按钮、对比模式或对比工作区；仅一个状态时显示“暂无历史演进数据”。
    review_mounts: [CHAIN-OV-F04-EVOLUTION-REQ, CHAIN-OV-F04-EVOLUTION-PENDING]
  - id: US-CHAIN-OV-05
    title: 沿事件线追踪产业资讯
    role: 投资机构产业研究人员
    trace_refs: [REQ-CHAIN-OV-003, PI-CHAIN-OV-07]
    frames: [F-CHAIN-OV-05]
    acceptance:
      - 事件线默认时间倒序，可按类型与时间范围筛选。
      - 每条详情展示事件时间、报道时间、来源机构和可访问原始报道链接。
    review_mounts: [CHAIN-OV-F05-NEWS-REQ]
  - id: US-CHAIN-OV-06
    title: 查看整条产业链基础概况
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-004, PI-CHAIN-OV-08]
    frames: [F-CHAIN-OV-06]
    metrics: [M_CHAIN_ENTERPRISE_COUNT, M_CHAIN_INSTITUTION_COUNT]
    acceptance:
      - 展示整链介绍、关联企业数和关联机构数；节点选择不改变整链统计。
      - 每个统计字段具有独立 metric_id 挂载。
    review_mounts: [CHAIN-OV-F06-PROFILE-REQ, CHAIN-OV-F06-ENT-METRIC, CHAIN-OV-F06-ENT-MOCK, CHAIN-OV-F06-ORG-METRIC, CHAIN-OV-F06-ORG-MOCK]
  - id: US-CHAIN-OV-07
    title: 浏览全球与全国空间分布
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-004, PI-CHAIN-OV-09]
    frames: [F-CHAIN-OV-07]
    metrics: [M_CHAIN_ENTERPRISE_COUNT, M_CHAIN_INSTITUTION_COUNT]
    acceptance:
      - 默认全国省级地图；全球只提供 G20 国家，全国可下钻至区县。
      - 地图和列表展示同层同批对象，切换不重置地域路径，列表可定位回地图。
    review_mounts: [CHAIN-OV-F07-DIST-REQ, CHAIN-OV-F07-ENT-METRIC, CHAIN-OV-F07-ENT-MOCK, CHAIN-OV-F07-ORG-METRIC, CHAIN-OV-F07-ORG-MOCK, CHAIN-OV-F07-DIST-PENDING]
  - id: US-CHAIN-OV-08
    title: 理解产业发展阶段和里程碑
    role: 投资机构产业研究人员
    trace_refs: [REQ-CHAIN-OV-001, PI-CHAIN-OV-10]
    frames: [F-CHAIN-OV-08]
    acceptance:
      - 每个阶段展示起止时间、特征和代表性成果；里程碑展示影响及证据。
      - 关闭详情后保留时间轴位置。
    review_mounts: [CHAIN-OV-F08-HISTORY-REQ, CHAIN-OV-F08-HISTORY-PENDING]
  - id: US-CHAIN-OV-09
    title: 查看深圳产业现状
    role: 政府产业管理与决策人员
    trace_refs: [REQ-CHAIN-OV-001, PI-CHAIN-OV-11]
    frames: [F-CHAIN-OV-09]
    metrics: [M_CHAIN_SZ_ENTERPRISE_COUNT, M_CHAIN_SZ_INSTITUTION_COUNT, M_CHAIN_SZ_REGION_COUNT]
    acceptance:
      - 展示深圳企业数、机构数、覆盖区县数以及各区地图/列表。
