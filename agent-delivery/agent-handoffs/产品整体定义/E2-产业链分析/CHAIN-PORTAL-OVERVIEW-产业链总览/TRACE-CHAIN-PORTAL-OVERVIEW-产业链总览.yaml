      - 下钻后图谱替换为该层 nodes/edges，面包屑可返回上级；切换 L0 清空下钻栈。
      - 下钻仅用于结构浏览，不改变顶部 industry_id，也不写入对比篮。
    review_mounts: [CHAIN-OV-F02-PANORAMA-REQ]

