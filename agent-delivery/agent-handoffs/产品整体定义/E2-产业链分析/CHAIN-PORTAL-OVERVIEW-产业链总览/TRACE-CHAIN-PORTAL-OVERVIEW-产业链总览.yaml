      - 权限 L0 触发加入或移出时进入登录引导；权限 L1 可使用共享对比篮；权限 L2 才能在全局篮选择并发起分析。
      - 总览不提供打开全局对比篮的按钮或打开信号；用户从系统悬浮入口自行打开同一个全局浮层。
      - 总览不实现局部篮 Drawer，界面不存在关注状态。
    review_mounts: [CHAIN-OV-F10-BASKET-REQ]
