  - id: US-E7-POL-04
    title: 完成深圳政策三维框架评估与短板定位
    role: 政府科技主管部门 / 研究团队
    source_relation: direct_requirement
    acceptance:
      - 用户可在三维框架下勾选指标并设置权重（合计 100%）后提交 policy_sz_3d_assessment 任务
      - 权重非法时不创建任务；过程壳层与系统任务规则同企业/产业
      - 结果含得分仪表盘、优势/短板雷达、短板成因与优化策略卡
      - 有效结果可进入报告故事
