      - {tab: entity, label: 政策主体信息, bid: "§1.1.1.2.4.5.1.6", leaf: P-77}
      - {tab: entity_dynamics, label: 政策动态与区域, bid: "§1.1.1.2.4.5.6.7.2"}
      - {tab: expert_knowledge, label: 政策专家知识, bid: "§1.1.1.2.4.5.6.7"}
      - {tab: visualization, label: 政策可视化配置, bid: "§1.1.1.2.4.5", leaf: P-76}
      - {tab: lifecycle, label: 政策实体生命周期, bid: "§1.1.1.2.4.5.3"}
      - {tab: relation_lifecycle, label: 政策关系链生命周期, bid: "§1.1.1.2.4.5.3"}
      - {tab: entity_attrs, label: 政策实体属性, bid: "§1.1.1.2.4.5.3"}
      - {tab: graph_draw, label: 政策图谱绘制, bid: "§1.1.1.2.4.5.3"}
      - {tab: fields_metrics, label: 字段指标, group: 分析配置}
      - {tab: model_rules, label: 模型规则, group: 分析配置}
      - {tab: data_batch, label: 数据批次, group: 分析配置}
      - {tab: report_templates, label: 报告导出模板, group: 分析配置}
      - {tab: perm_mask, label: 权限脱敏, group: 分析配置}
      - {tab: audit, label: 审计监控, group: 分析配置}
    shell_owns: [group_nav, permission_lock, workflow_tabs, placeholder_maturity]
    module_owns: [policy_content_types, policy_entity_fields, policy_rule_templates]
    prohibited: [edit_publish_on_portal_or_analysis_pages, copy_enterprise_content_types]

  system_tasks:
    host: app-shell#system-task-layer
    store: system-tasks/systemTaskStore
    kinds: [analysis, report]
    reuse_from: [enterprise_evaluation, industry_chain_topic_analysis]
    decision_ref: DEC-E7-SYSTEM-TASK-REUSE-20260805
    analysis_types:
      - {id: policy_timeseries_analysis, route: /policy/overview, leaf: P-70, report_task_type: policy_timeseries_analysis_report}
      - {id: policy_region_compare, route: /policy/analysis, leaf: P-72, report_task_type: policy_region_compare_report}
      - {id: policy_sz_3d_assessment, route: /policy/recommendation, leaf: P-73, report_task_type: policy_sz_3d_assessment_report}
    lifecycle: [created, prechecking, queued, running, succeeded, failed, withdrawn]
    withdraw_when: queued
    cancel_when_running_for_normal_user: false
    module_owns: [analysis_type_registration, stage_definitions_copy, result_snapshot_fields, report_section_payload]
    shared_shell_owns: [queue_slots, task_layer_ui, collision_with_compare_basket, resume_routing]
    prohibited: [private_policy_task_center, fake_percent_progress, auto_jump_to_result, result_or_report_favorite]
  shared_report:
    framework: ENT-EXPORT
    decision_ref: DEC-E7-REPORT-TEMPLATE-HTML-PDF-20260805
    reuse_from: [enterprise_evaluation, industry_chain_topic_analysis]
    template_form: unified_system_template
    reader: SystemReportReader
    download_contract: system_report_task
    entry: 仅成功且有效结果页「生成报告」
    flow: [load_unified_template, generate_html_preview, download_pdf_same_revision]
    formats_v1: [HTML, PDF]
    html_before_pdf: true
    html_pdf_same_revision_required: true
    fingerprint_reuse: true
    expired_result_new_report: false
    module_owns: [report_template_id_binding, section_payload, fingerprint_fields]
    shared_owns: [template_engine, html_reader_shell, pdf_renderer, revision_metadata]
    prohibited: [skip_html_direct_pdf_only, private_policy_reader, private_pdf_engine, docx_pptx_v1]

stories:
  - id: US-E7-POL-01
    title: 发现并准备政策分析对象（产业入篮）
    role: 政府科技主管部门 / 产业园区 / 投资机构 / 研究团队
    source_relation: product_interpretation
    supports_sections: ["§1.1.1.2.4.2.6.1.1", "§1.1.1.2.4.2.6.2.1"]
    decision_ref: DEC-E7-POLICY-LAUNCH-FROM-INDUSTRY-BASKET-20260807
    acceptance:
      - 在产业查询将目标产业加入系统对比篮产业 Tab；停留原页；角标同步
      - 政策查询 /policy/search 可浏览/画像，但不提供政策文档「加入对比篮」；禁止深度分析直达
      - 查询工具栏无聚合对比篮按钮
    compliance_refs:
      - leaf_id: P-70
        source_section: "§1.1.1.2.4.2.6.1.1"
        source_relation: product_interpretation
        route: /industry-center/search
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
      - leaf_id: P-72
        source_section: "§1.1.1.2.4.2.6.2.1"
        source_relation: product_interpretation
        route: /industry-center/search
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
    ia_nodes: [产业查询, 政策查询]
    wireframe_frames: [F-POL-00, F-POL-CMP]

  - id: US-E7-POL-05
    title: 经系统对比篮产业 Tab 分发政策分析
    role: 政府科技主管部门 / 产业园区 / 投资机构 / 研究团队
    source_relation: product_interpretation
    supports_sections: ["§1.1.1.2.4.2.6"]
    decision_ref: DEC-E7-POLICY-LAUNCH-FROM-INDUSTRY-BASKET-20260807
    depends_on_stories: [US-E7-POL-01]
    acceptance:
      - 系统对比篮无「政策」Tab；产业 Tab 可操作
      - 勾选恰好 1 个产业后，「发起分析」含分组「政策分析」三项并分发 object_type=industry
      - 产业链对象不可发起政策三项；分发成功收起面板；篮内无分析可视化
      - 分析页可通过 open_compare_basket&compare_object_type=industry 原位调整对象
      - 无分发上下文时轻量空态 + 打开产业对比篮
    compliance_refs:
      - leaf_id: P-70
        source_section: "§1.1.1.2.4.2.6.1"
        source_relation: product_interpretation
        route: "app-shell#system-compare-basket?active_type=industry→/policy/overview"
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
      - leaf_id: P-72
        source_section: "§1.1.1.2.4.2.6.2"
        source_relation: product_interpretation
        route: "app-shell#system-compare-basket?active_type=industry→/policy/analysis"
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
      - leaf_id: P-73
        source_section: "§1.1.1.2.4.2.6.3"
        source_relation: product_interpretation
        route: "app-shell#system-compare-basket?active_type=industry→/policy/recommendation"
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
    ia_nodes: [系统对比篮·政策Tab]
    wireframe_frames: [F-POL-00, F-POL-CMP]

  - id: US-E7-POL-02
    title: 完成选定领域的政策时序洞察
    role: 政府科技主管部门 / 研究团队
    source_relation: direct_requirement
    acceptance:
      - 对象就绪后可配置粒度并提交 policy_timeseries_analysis 系统任务
      - 过程视图展示阶段 Steps；succeeded 后需显式查看结果
      - 结果含发布数量时序、支持强度趋势与可点选关键节点明细
      - 有效结果可进入报告故事；评审模式可见 Mock/指标说明
    compliance_refs:
      - leaf_id: P-70
        source_section: "§1.1.1.2.4.2.6.1"
        source_relation: direct_requirement
        route: /policy/overview
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
    metrics:
      - M_POLICY_TOTAL_COUNT
      - M_POLICY_INTENSITY_SCORE
      - M_POLICY_INTENSITY_INDEX
    open_questions: [QPOL-02]
    depends_on_stories: [US-E7-POL-01, US-E7-POL-05]
    ia_nodes: [政策时序分析]
    wireframe_frames: [F-POL-01, F-POL-TASK]

  - id: US-E7-POL-06
    title: 跟踪、恢复并在排队阶段撤回政策分析任务
    role: 政府科技主管部门 / 产业园区 / 投资机构 / 研究团队
    source_relation: product_interpretation
    decision_ref: DEC-E7-SYSTEM-TASK-REUSE-20260805
    depends_on_stories: [US-E7-POL-01, US-E7-POL-05]
    acceptance:
      - 系统任务浮层可恢复政策 analysis 任务至正确分析页/过程/结果
      - queued 阶段发起人可二次确认撤回为 withdrawn，不产生结果
      - running 阶段普通用户无取消入口；离页不终止
      - 同 analysis_type 已有进行中任务时不创建新任务，引导恢复
    compliance_refs:
      - leaf_id: P-70
        source_section: "§1.1.1.2.4.2.6.1"
        source_relation: product_interpretation
        route: app-shell#system-task-layer
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
    ia_nodes: [系统任务浮层]
    wireframe_frames: [F-POL-TASK]

  - id: US-E7-POL-07
    title: 从有效政策分析结果经统一模板生成 HTML 预览并下载 PDF
    role: 政府科技主管部门 / 研究团队
    source_relation: product_interpretation
    decision_ref: DEC-E7-REPORT-TEMPLATE-HTML-PDF-20260805
    depends_on_stories: [US-E7-POL-02, US-E7-POL-03, US-E7-POL-04, US-E7-POL-06]
    acceptance:
      - 仅成功且有效结果页显示「生成报告」并创建/复用 report 任务（统一模板装载）
      - 报告任务成功后先进入系统性只读 HTML 预览页，不得跳过 HTML 仅交付 PDF
      - 自 HTML 预览下载 PDF；HTML 与 PDF 绑定同一 report_revision / fingerprint
      - 过期结果、无权或框架未激活时失败关闭；PDF 缺失时 HTML 仍可读并可重生成 PDF
      - 同 fingerprint 不重复堆积同质进行中报告任务
    compliance_refs:
      - leaf_id: P-70
        source_section: "§1.1.1.2.4.2.6.1"
        source_relation: product_interpretation
        route: /policy/overview#report
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
      - leaf_id: P-72
        source_section: "§1.1.1.2.4.2.6.2"
        source_relation: product_interpretation
        route: /policy/analysis#report
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
      - leaf_id: P-73
        source_section: "§1.1.1.2.4.2.6.3"
        source_relation: product_interpretation
        route: /policy/recommendation#report
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
    ia_nodes: [结果页报告入口, 共享报告阅读器]
    wireframe_frames: [F-POL-01, F-POL-02, F-POL-03, F-POL-REPORT]

  - id: US-E7-POL-03
    title: 完成跨区域政策标准化对比
    role: 政府科技主管部门 / 产业园区 / 投资机构
    source_relation: direct_requirement
    acceptance:
      - 对象就绪后可配置区域集合并提交 policy_region_compare 系统任务
      - 过程视图与系统任务规则同企业/产业；succeeded 后需显式查看结果
      - 结果含统一评价框架下的对比矩阵，并支持雷达图/热力图切换与差异结论
      - 补贴标准、准入条件等结构化条款可查看；有效结果可进入报告故事；口径待确认项带 ⚠️
    compliance_refs:
      - leaf_id: P-72
        source_section: "§1.1.1.2.4.2.6.2"
        source_relation: direct_requirement
        route: /policy/analysis
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
    metrics:
