    activation: DEC-E7-COMPARE-ACTIVATE-20260805
    capacity: 50
    source_add_routes: [/policy/search]
    dispatch_targets:
      - {task: 政策时序分析, route: /policy/overview, leaf: P-70}
      - {task: 区域政策对比, route: /policy/analysis, leaf: P-72}
      - {task: 深圳政策现状分析, route: /policy/recommendation, leaf: P-73}
    module_owns: [policy_tab_storage, policy_add_entry, policy_dispatch_tasks, return_context_on_policy_pages]
