stories:
  - id: US-E7-POL-01
    title: 发现并准备政策分析对象
    role: 政府科技主管部门 / 产业园区 / 投资机构 / 研究团队
    source_relation: product_interpretation
    supports_sections: ["§1.1.1.2.4.2.6.1.1", "§1.1.1.2.4.2.6.2.1"]
    decision_ref: DEC-E7-SEARCH-REUSE-20260805
    acceptance:
      - 专题 /policy/search 挂载与企业/产业查询同一 ElementSearchWorkbench 区块顺序
      - 模式为智能检索 / 查政策 / 高级筛选；高筛与热门进入独立 advanced 页，不在蓝色 Hero 内嵌
      - 智能检索 SmartChip 可逐项移除并重算；最近检索按模式隔离、最多 10 条、点击恢复重跑
      - 结果卡仅提供加入对比篮/已加入（及查看摘要）；禁止深度分析直达分析页；不与门户检索共用 storage
      - 查询工具栏无聚合对比篮按钮
