      SharedMapChrome；地图无对照；概况额外承担连续性与同级对照；P-20 力度榜与密度主语义分离。
      详见 DEC-E7-PORTAL-STATS-MAP-DENSITY-20260807.md。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-07"
    approval_status: approved
    scope_effect: 不增删 Bid 叶子；收紧 P-17/P-18 数据与视觉合同
  - id: DEC-E7-PORTAL-STATS-INDUSTRY-COMPARE-20260807
    source_relation: product_interpretation
    decision: >
      概览产业锚点为左右 Cascader（产业→细分，禁空）；stats 工具条另含同级对照≤5
      （区域/省/市与 geo 同级，跨档清空；全国档关闭）；对照仅 stats，map 不展示对照且不点选入对照；
      展示层对比不发起分析。详见 DEC-E7-PORTAL-STATS-INDUSTRY-COMPARE-20260807.md。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-07"
    approval_status: approved
    scope_effect: 不增删 Bid 叶子；补齐 P-17 相关产业与同级对照
  - id: DEC-E7-PORTAL-RANK-PRESENTATION-20260807
    source_relation: product_interpretation
    decision: >
      P-20 力度榜不绑产业/对照/geo；呈现为 Top3 领奖台 + 全量排名表（无条形榜、无 KPI 摘要条）；
      招标「关键指标提取」为上游加工，门户不另开模块。详见 DEC-E7-PORTAL-RANK-PRESENTATION-20260807.md。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-07"
    approval_status: approved
    scope_effect: 不增删 Bid 叶子；收紧 P-20 Demo/文档呈现
  - id: DEC-E7-PORTAL-SHENZHEN-MIRROR-20260807
    source_relation: product_interpretation
    decision: >
      深圳政策 Tab 采用 S1：四段镜像招标能力（政策数量对比/地图/覆盖/动态），范围锁深圳；
      **不含力度榜**；stats/map 共享产业；对照改为深圳各区；地图主区地图/列表双视图。
      去掉标杆雷达/三维摘要作 P-22 主路径。详见 DEC-E7-PORTAL-SHENZHEN-MIRROR-20260807.md。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-07"
    approval_status: approved
    scope_effect: 不增删 Bid 叶子；收紧 P-22 呈现与概况地图双视图
  - id: DEC-E7-OPS-REUSE-20260805
    source_relation: product_interpretation
    decision: >
      政策域维护管理按企业分析 ENT-OPS 已落地菜单形态复用：左侧分组「内容运营 / 图谱运营 / 分析配置」，
      路由建议 /policy/maintenance（或政策中心 maintenance 入口），壳层交互（权限锁态、待我处理/审核/发布/版本、占位成熟度）
      复用企业维护管理；政策注入门户内容（政策新闻 §1.1.1.2.4.5.6.7）、政策主体（内容管理工具 §1.1.1.2.4.5.1.6）
      及政策域图谱/分析配置项；禁止复制企业字段与企业内容类型；禁止在前台分析/门户展示页内嵌编辑发布。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增 Bid 叶子；P-76/P-77 以前端维护菜单承接，catalog 后台标注保留为 GAP 说明

shared_dependencies:
