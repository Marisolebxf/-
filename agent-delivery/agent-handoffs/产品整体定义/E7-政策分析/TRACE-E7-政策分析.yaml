module_exclusions:
  - 科技信息展示系统·科技政策跟踪（科创政策全景 / 政策分析评价 / 政策效果推演）及核增政策对比
  - 全站统一智能检索模块页（其它厂商范围）
  - 独立竞争力报告页（P-74）与独立优势短板报告页（P-75）Wave2
  - 前端内嵌 NLP/图谱算法（须 Java→Python /internal/*）
  - 为政策查询复制私有 Hero/最近检索/结果容器（必须挂载 ElementSearchWorkbench 共享壳）
  - 政策模块内第二套对比篮页面或页内常驻聚合「打开对比篮」按钮
  - 在对比篮内生成时序/区域对比/三维分析结果
  - 独立政策任务中心、私有下载中心、结果/报告收藏
  - 用虚构百分比或单一 Spinner 替代系统任务阶段过程
  - 在查询页或篮内直接创建正式报告任务
