  portal_display:
    host: /policy-portal/overview
    decision_ref: DEC-E7-PORTAL-TAB-MERGE-A-20260807
    parent_decision_ref: DEC-E7-PORTAL-INCLUDE-20260805
    reuse_from: [enterprise_portal_display, chain_portal_overview]
    primary_tabs: [overview, coverage, latest, shenzhen]
    overview_views: [stats, map, rank]
    pages:
      - {id: P-17, route: "/policy-portal/overview?tab=overview&view=stats", name: 政策概况统计, primary_tab: overview, view: stats}
      - {id: P-18, route: "/policy-portal/overview?tab=overview&view=map", name: 政策地图, primary_tab: overview, view: map}
      - {id: P-19, route: "/policy-portal/overview?tab=coverage", name: 政策产业覆盖, primary_tab: coverage}
      - {id: P-20, route: "/policy-portal/overview?tab=overview&view=rank", name: 政策力度排名, primary_tab: overview, view: rank}
      - {id: P-21, route: "/policy-portal/overview?tab=latest", name: 最新政策动态, primary_tab: latest}
      - {id: P-22, route: "/policy-portal/overview?tab=shenzhen", name: 深圳政策对比, primary_tab: shenzhen}
    basket_contract:
