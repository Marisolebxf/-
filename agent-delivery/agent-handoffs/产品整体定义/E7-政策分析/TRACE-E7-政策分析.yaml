        source_relation: direct_requirement
        route: /policy/recommendation
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        planned_tier: DEMO
    metrics:
      - M_POLICY_SUPPORT_STRENGTH
      - M_POLICY_INDUSTRY_FIT
      - M_POLICY_IMPLEMENTATION_EFFECT
      - M_POLICY_SHORTBOARD_COUNT
      - M_POLICY_LAYOUT_REC_COUNT
    open_questions: [QPOL-02, QPOL-03]
    depends_on_stories: [US-E7-POL-01, US-E7-POL-05]
