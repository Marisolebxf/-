confirmed_product_decisions:
  - id: DEC-E7-SEARCH-REUSE-20260805
    source_relation: product_interpretation
    decision: >
      政策分析模块增加专题侧政策查询入口 /policy/search，按企业查询与产业链查询已复用的
      ElementSearchWorkbench 页面模式继续复用（模式栏、SearchHub/SmartChip、示例与热门、
      RecentSearchPanel、推荐/结果工作区、独立 FilterPanel 高筛页）；政策仅注入标签、schema、
      卡片与动作；与门户 /policy-portal/search 分轨（独立路由与 storage key）。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增或删除 Bid 叶子；查询为 P-70/P-72 关联与采集能力的前端对象准备入口
  - id: DEC-E7-COMPARE-ACTIVATE-20260805
    source_relation: product_interpretation
    decision: >
      系统对比篮浮层中已预留的 policy Tab（原 developing_placeholder）作为政策域后续开发正式激活：
      对象为政策文档（policy_id），独立容量 50；政策查询提供逐条加入/已加入；系统 Shell 为唯一管理入口；
      禁止页内常驻聚合对比篮按钮；政策 Tab 可分发至 /policy/overview、/policy/analysis、/policy/recommendation；
      篮内不生成分析结果。共享浮层壳层规则继承 ENT-COMPARE，本包不复制壳层实现。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增或删除 Bid 叶子；激活预留槽位，不宣称核增多维政策对比页已交付
  - id: DEC-E7-REPORT-TEMPLATE-HTML-PDF-20260805
    source_relation: product_interpretation
    decision: >
      系统第三共享能力为分析报告模板框架（ENT-EXPORT）：由统一模板形态生成报告；
      先产出系统性只读 HTML 预览页，再下载与该 HTML 同一 report_revision 的 PDF。
      政策模块只注册 report_template_id 与章节 payload，不自建阅读器/PDF 引擎或跳过 HTML 直出 PDF。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增或删除 Bid 叶子；明确报告交付顺序与共享归属
  - id: DEC-E7-SYSTEM-TASK-REUSE-20260805
    source_relation: product_interpretation
    decision: >
      政策三项计算型分析的分析任务、过程恢复、报告生成与 PDF 下载，统一复用企业评估与产业链分析已落地的
      SystemTaskLayer（kind=analysis|report）与共享报告阅读/下载合同：配置→生成分析→可视化过程→显式查看结果→
      生成报告；queued 可撤回、running 不可取消；结果不可变；报告仅来自有效结果并绑定 fingerprint。
      政策模块只注册 analysis_type / stage_definitions / 报告章节数据，不建独立任务中心或下载中心。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增或删除 Bid 叶子；交互复用共享能力，不把企业/产业业务字段写入政策

  - id: DEC-E7-EMPTY-STATE-BY-BASKET-20260805
    source_relation: product_interpretation
    decision: >
      分析页在无对比篮分发上下文时的对象空态引导，归属系统对比篮能力：读取政策 Tab 可用对象数；
      空篮时目标页只提供「去政策查询入篮」主 CTA；篮内有可用对象时提供「去查询入篮」与「打开对比篮」双 CTA。
      分析页消费该状态，不自建对象选择器，不在空篮时提供无效的打开对比篮主路径。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增或删除 Bid 叶子；细化 ENT-COMPARE 政策 Tab 与目标页交接
  - id: DEC-E7-BASKET-ONLY-LAUNCH-20260805
    source_relation: product_interpretation
    decision: >
      政策域所有计算型分析（时序/区域对比/深圳三维）仅允许由系统对比篮政策 Tab「发起分析」分发启动；
      专题政策查询与门户政策扶持展示的结果动作仅限加入/移出对比篮（及查看摘要），不提供「深度分析」
      或携带对象上下文直达分析页。菜单可进入分析页；无分发上下文时为空态，引导由对比篮政策 Tab
      可用对象数决定：count=0 仅引导去查询入篮；count≥1 引导去查询入篮或打开系统对比篮发起分析。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增或删除 Bid 叶子；收紧对象流，消除查询直达分析路径
  - id: DEC-E7-PORTAL-INCLUDE-20260805
    source_relation: product_interpretation
    decision: >
      政策分析产品包纳入智慧服务门户「政策扶持」六页（P-17~P-22，/policy-portal/*）：
      展示方式对齐企业发展门户与产业链总览已落地模式——展示页可发现政策对象并加入/移出系统对比篮政策 Tab，
      后续仅经系统对比篮分发至专题三项分析；门户页不运行分析任务、不生成报告、不提供页内第二套篮。
      与专题 /policy/* 分路由；仍排除展示系统 DS-10/11/12 与核增多维对比结果页。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 将 leaves_required 扩至 9（专题 3 + 门户 6）；不宣称核增对比页交付
  - id: DEC-E7-OPS-REUSE-20260805
    source_relation: product_interpretation
    decision: >
      政策域维护管理按企业分析 ENT-OPS 已落地菜单形态复用：左侧分组「内容运营 / 图谱运营 / 分析配置」，
      路由建议 /policy/maintenance（或政策中心 maintenance 入口），壳层交互（权限锁态、待我处理/审核/发布/版本、占位成熟度）
      复用企业维护管理；政策注入门户内容（政策新闻 §1.1.1.2.4.5.6.7）、政策主体（内容管理工具 §1.1.1.2.4.5.1.6）
      及政策域图谱/分析配置项；禁止复制企业字段与企业内容类型；禁止在前台分析/门户展示页内嵌编辑发布。
    confirmed_by: human:高颖
    confirmed_at: "2026-08-05"
    approval_status: approved
    scope_effect: 不新增 Bid 叶子；P-76/P-77 以前端维护菜单承接，catalog 后台标注保留为 GAP 说明

