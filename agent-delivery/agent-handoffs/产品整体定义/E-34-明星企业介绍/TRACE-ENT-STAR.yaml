content_dependencies:
  - owner: 数据与算法侧
    content: 固定明星企业表、入选标准版本、入选理由、专利及研发投入等基础指标
    status: PARTIAL
    open_question_id: Q048
  - owner: E-37 CMS / 运营侧
    content: 企业介绍、产品、视频、3D 模型、案例、团队、发展历程、口碑及其他宣传内容
    status: PUBLISHED_ONLY
    open_question_id: Q041
  - owner: 图数据库与算法侧
    content: 上下游、供应链和战略合作伙伴关系
    status: DEMO
    open_question_id: Q040
  - owner: 企业查询与统一企业画像
    content: 企业基础档案、核心产品和系统通用资质荣誉
    status: REUSE

review_mode:
  internal:
    media_rule: 使用占位图展示媒体字段、来源、发布状态和接口依赖
    metric_rule: 未配置 metric_id 的量化字段显示 DEMO 与 Q048
    content_rule: CMS 草稿不可作为前台正式内容
  presentation:
    media_rule: 可模拟视频、3D 模型、案例和图谱的真实展示效果，但必须标识为演示内容
    history_rule: 可引用开放企业官网公开事实做摘要模拟，并标明来源，不冒充 CMS 正式发布内容

open_questions:
  - id: Q040
    summary: 产业生态图谱先使用图数据库 demo 接口，正式产业链/招投标关系待补充
  - id: Q041
    summary: 固定明星企业表与 CMS 人工维护内容的发布、字段和接口待对接
  - id: Q048
    summary: E-34 入选标准、候选池、版本更新及基础量化指标 metric_id 待确认

gaps:
  yellow:
    - reason: 固定明星企业的推荐标准、候选池、维护责任和基础指标语义未闭合
      open_question_id: Q048
      temporary_default: 原型按当前未来产业配置固定一家具代表性的 DEMO 企业，标准待配置，不展示权重或排名
    - reason: 视频、团队、介绍、发展历程等 CMS 字段及发布接口未闭合
      open_question_id: Q041
      temporary_default: 内部评审使用占位，非评审演示使用明确标识的模拟内容
    - reason: 产业生态图谱正式关系数据未闭合
      open_question_id: Q040
      temporary_default: 使用图数据库 demo 实体与关系接口占位，不生成风险结论
  red: []

