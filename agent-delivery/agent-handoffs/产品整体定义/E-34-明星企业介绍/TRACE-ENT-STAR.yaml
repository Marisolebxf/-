stories:
  - id: US-E34-01
    title: 理解代表企业及其入选理由
    role: 政府科技管理与决策部门
    acceptance:
      - 当前未来产业只展示固定明星企业，不提供自由选择、换一换或跨产业混排
      - 首屏展示入选理由、适用标准版本或待配置状态及数据时间
      - 入选标准只读说明不暴露权重、内部阈值、排名或敏感证据
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E34-02
    title: 查看产品功能全景
    role: 访客
    acceptance:
      - 展示核心产品、产品能力、应用场景、行业案例和公开影响摘要
      - 媒体只读取 CMS 已发布内容，缺失时使用业务空态
      - 内部评审模式展示媒体占位、字段、来源和状态，非评审演示可模拟真实效果但标记 DEMO
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3/产品功能全景图
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E34-03
    title: 理解技术优势与团队实力
    role: 科研人员
    acceptance:
      - 展示专利数、研发投入占比、核心技术、科研成果等公开技术信息
      - 展示核心成员、科学家或人才比例和团队成果等已发布内容
      - 每个统计数字有 metric_id 或 Q048/DEMO，不把内容性字段伪装成自动计算指标
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3/技术优势可视化+团队实力多维展示
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E34-04
    title: 浏览产业生态与企业故事
    role: 访客
    acceptance:
      - 产业生态图谱展示已确认的上下游、合作伙伴和关系摘要
      - 发展历程和口碑作为 CMS 企业故事辅助内容，不新增评分或风险结论
      - 生态节点可查看合作详情，企业名称可进入统一企业画像
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3/产业生态图谱
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

