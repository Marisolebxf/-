stories:
  - id: US-E33-01
    title: 查看重点企业产业链全景
    role: 科研人员
    acceptance:
      - 页面顶部保留当前产业链选择器，一次只展示一条产业链
      - 左侧按上游、中游、下游和具体链位纵向展示链位名称、重点企业数和重点领域数
      - 右侧以单列分页列表展示当前链位重点企业及基础信息；单企业进入画像
      - 切换链位后企业列表回到第1页，并更新领域摘要和关键词证据
      - 不展示供应商客户关系、断链风险、推荐排名或独立导出
    compliance_refs:
      - leaf_id: E-33
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.2 重点企业全景图"
          items:
            - 重点企业全景
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-33
        route: /enterprise-center/overview?tab=key-enterprises
        legacy_route: /development/key-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E33-02
    title: 查看整链重点企业资质分布
    role: 政府科技管理与决策部门
    acceptance:
      - 复用系统通用资质荣誉枚举
      - 原始统计维度使用外企、国高企、小微、上市
      - 使用横向分组条形图并列展示深圳市、广东省、全国完整口径的绝对数量，不使用地域增量堆叠
      - 四项资质共用同一个绝对数量轴，每根条形末端固定显示精确数量
      - 外企、国高企、小微、上市固定保留，零值显示0，顺序不按数值重排
      - 显示国家、省、市嵌套范围不可相加，以及多标签重复计数不可直接求和的提示
      - 统计保持当前产业链整链口径，点击链位不改写统计口径
      - 图表只读，不点击筛选当前链位企业列表
    compliance_refs:
      - leaf_id: E-33
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.2 重点企业全景图"
          items:
            - 重点企业规模统计
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-33
        route: /enterprise-center/overview?tab=key-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E33-03
    title: 查看重点企业领域在产业链中的分布
    role: 科研人员
    acceptance:
      - 从重点企业论文、专利中抽取关键词
      - 关键词关联到当前产业链的领域、环节或链位
      - 展示重点分布、关联企业和证据摘要
      - 点击左侧链位后更新当前链位的领域摘要和关键词证据
      - 映射证据不足时显示覆盖率与证据不足状态，不生成虚构排名
    compliance_refs:
      - leaf_id: E-33
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.2 重点企业全景图"
          items:
            - 重点企业领域统计
            - 企业抽取论文、专利关键词，关键词关联到产业链
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-33
        route: /enterprise-center/overview?tab=key-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

