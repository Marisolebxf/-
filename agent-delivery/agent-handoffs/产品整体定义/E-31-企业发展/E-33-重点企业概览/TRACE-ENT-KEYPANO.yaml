shared_context:
  required:
    - topic_service
    - future_industry_code
    - industry_chain_code
    - data_time
  primary_control: 页面顶部当前产业链选择器
  reset_rule: 切换未来产业或产业链时清除旧链位、企业列表页码、领域和证据的局部选中态

interaction_context:
  chain_node:
    scope: local
    updates:
      - 重点企业分页列表
      - 领域摘要
      - 论文专利关键词证据
    does_not_update:
      - 整链重点企业资质分布口径
  qualification_statistics:
    scope: current_industry_chain
    display_title: 整链重点企业资质分布
    chart_type: horizontal_grouped_bar
    qualification_order:
      - 外企
      - 国高企
      - 小微
      - 上市
    region_series:
      - 深圳市
      - 广东省
      - 全国
    region_value_rule: 完整嵌套口径，不使用深圳市、广东省其他、全国其他增量分段，各地域层级数量不可相加
    axis_rule: 四项资质共用同一个绝对数量轴，不按行归一化
    value_label: 每根条形末端固定显示精确数量
    zero_value_rule: 四项资质固定保留，零值显示0
    interaction: 只读，不筛选企业列表
  enterprise_list:
    layout: 单列
    pagination: true
    page_reset_rule: 切换产业链或链位后回到第1页

