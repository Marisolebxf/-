stories:
  - id: US-E32-01
    title: 查看未来产业企业总体态势
    role: 科研人员
    source_relation: direct_requirement
    acceptance:
      - 顶部明确展示全球企业总数、全球企业科研人数、覆盖未来产业数，且不受下方选择器联动
      - 产业按企业数量降序排列，默认展示 Top10；实际覆盖产业超过 10 个时可展开全部并收起
      - 排名前三名分别使用设计系统金、银、铜配色，第 4 名起统一使用普通排名色
      - 排名纵轴仅显示产业名称，不重复显示排名序号；名次由排序位置与排名色表达
      - 可选择一个产业查看趋势，或最多选择两个产业作趋势对比
      - 有至少两个连续可比时间点时，才展示该产业的历年趋势
    compliance_refs:
      - leaf_id: E-32
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.1 企业整体概况"
          items:
            - 企业总体数量
            - 企业分布情况
            - 科研人数
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-32
        route: /enterprise-center/overview?tab=overall
        legacy_route: /development/overview
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E32-02
    title: 查看企业空间分布与科研人力
    role: 政府科技管理与决策部门
    source_relation: direct_requirement
    acceptance:
      - 企业分布卡片内置通用四级地域选择器，默认深圳，且不联动顶部 KPI 与上方统计卡片
      - 可在全球、全国、区域、深圳四级地域之间切换，并在热力地图与列表视图间切换
      - 地图按国家、省、市、区的缩放层级返回对应粒度数据；深圳不逐企业点位打点
      - 可查看当前快照下的企业分布数据
      - 列表视图固定展示地域、企业数、科研人员数、覆盖未来产业数和操作列
      - 仅操作列触发行为：在地图中查看切回地图并高亮地域，进入企业查询跳转企业查询并带入地域条件
      - 地图画布填满企业分布卡片预留的地图内容区，不出现无业务含义的下方空白
      - 地图左侧工具栏与右侧显示热力控制顶边对齐，且不改变各自既有操作语义
    compliance_refs:
      - leaf_id: E-32
        md_ref:
          file: bid-reference/智慧服务门户系统-要素相关.md
          section: "1.1.1.1.1.1.1.1 企业整体概况"
          items:
            - 企业分布情况
            - 科研人数
        catalog_ref: acceptance-catalog/catalog-topic-enterprise.yaml#E-32
        route: /enterprise-center/overview?tab=overall
        screen_tier: medium_1440_1920
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

