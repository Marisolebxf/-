requirement_sources:
  scope_truth: bid-reference/智慧服务门户系统-要素相关.md#1.1.1.1.1.1.1.3
  acceptance_detail: 验收文档/企业要素需求规格说明书SRS(v1).md#FR-04-明星企业介绍E-34
  acceptance_catalog: acceptance-catalog/catalog-topic-enterprise.yaml#E-34

routes:
  canonical: /enterprise-center/overview?tab=star-enterprises
  industry_state: /enterprise-center/overview?tab=star-enterprises&future_industry_code={future_industry_code}
  selected_state: /enterprise-center/overview?tab=star-enterprises&future_industry_code={future_industry_code}&enterprise_code={enterprise_code}
  legacy_selected_state: /enterprise-center/overview?tab=star-enterprises&enterprise_code={enterprise_code}
  legacy:
    - /development/star-enterprises
  page_name: 企业总览
  tab_name: 明星企业介绍

shared_context:
  required:
    - topic_service
    - future_industry_code
    - data_time
  industry_control: E-34 Tab 内必须显式展示集群 + L0 选择器，不依赖其他 Tab 或被隐藏的共享 ContextBar 告知当前对象
  industry_options: 共享 15 集群目录；无 L0 映射停空态；即使本 L0 明星企业为 0 家也保留选项并进入业务空态
  restore_priority:
    - URL 中有效的 cluster_id + industry_id
    - URL 中仅有 industry_id 时反查所属集群
    - 旧 future_industry_code 只读兼容（能解析则回填；不能解析不猜）
    - 仅有 enterprise_code 时，由已发布名单映射反查所属 L0 / 集群
    - 从 E-31 继承的当前集群 + 当前 L0
    - 有映射的集群 sort_order 第一项及其默认 L0
  reset_rule: 切换集群或 L0 时同步刷新已发布明星企业名单，按 sort_order 选择第一家，更新 cluster_id、industry_id 与 enterprise_code，并清除旧企业的局部选中态

selection_model:
  cardinality_per_industry: 0..N
  source: CMS 运营固定明星企业名单
  default_rule: 按 sort_order 升序选择第一家，不由前端计算排名
  route_state: enterprise_code
  parent_route_state: future_industry_code
  display_rules:
    zero: 展示本产业明星企业待配置空态
    one: 直接展示企业并隐藏选择器，提示本产业共 1 家明星企业
    many: 展示可搜索下拉框和共 N 家，候选项含企业名称和一句入选标签；支持按企业名称或入选标签检索
  switch_rule: 更新 enterprise_code，清除旧企业局部状态，刷新详情并返回明星企业首屏
  publish_gate: 名单条目与基础介绍必须发布；其他内容区允许部分缺失并显示业务空态
  prohibited:
    - 名单外自由选企
    - 跨产业混排
    - 随机换一换
    - 前端计算评分或排名

product_presentation_model:
  source_ref: bid-reference/智慧服务门户系统-要素相关.md#1.1.1.1.1.1.1.3/产品功能全景图
  cardinality_per_enterprise: 0..N
  source: E-37 CMS 已发布产品及其功能模块、场景、案例与媒体关联
  sort_rule: 按 sort_order 升序展示；前端不按热度、点击量或影响力重排
  local_state:
    product_id: 当前产品；不写入 URL；切换企业后重置
    product_page: 当前产品页码；不写入 URL；切换企业后重置为 1
    product_module_id: 当前展开功能模块；切换产品后重置为该产品第一项或未展开态
  default_rule: 默认选择已发布产品中 sort_order 第一项，并确保其所在页可见
  medium_screen_pagination:
    page_size: 3
    zero: 展示核心产品待完善业务空态，不渲染产品卡和分页控件
    one_to_three: 单行展示全部已发布产品，隐藏分页控件
    four_or_more: 标题右侧显示上一页、下一页和当前页/总页数；仅手动非循环翻页
    page_switch_rule: 翻页后选择目标页 sort_order 第一项作为当前产品，并按产品切换规则更新详情、关闭旧媒体层和重置旧功能模块状态
    prohibited:
      - 自动轮播
      - 循环翻页
      - 用整页横向滚动承载产品溢出
  selection_linkage:
    - 点击产品卡后显示明确选中态
    - 同步更新当前产品的功能模块或产品架构、应用场景、行业案例和公开影响摘要
    - 视频、3D 模型、操作演示等媒体只读取当前产品已发布关联项
    - 切换产品时关闭上一产品媒体查看层并重置上一产品功能模块局部状态
  accessibility:
    - 产品卡可聚焦并用 Enter/Space 选择
    - 上一页和下一页使用按钮语义，边界页对应按钮禁用
    - 页码变化和当前产品名称可被辅助技术获知
  product_fields:
    - product_id
    - product_name
    - product_summary
    - impact_summary
    - sort_order
    - publish_status
  child_fields:
    - product_module_id
    - module_name
    - module_summary
    - scenario_refs
    - case_refs
    - media_refs
  publish_gate: 产品、功能模块、场景、案例和媒体分别只消费 CMS 已发布内容；缺失子内容按局部空态降级

team_presentation_model:
  source_ref: bid-reference/智慧服务门户系统-要素相关.md#1.1.1.1.1.1.1.3/团队实力多维展示
  placement: 技术优势可视化下方的独立全宽模块
  selection_state: team_member_id；仅为模块局部状态，不写入 URL；切换企业后重置
  default_rule: 选择 CMS 已发布成员中 sort_order 第一位
  switching:
    - 点击成员卡选择指定成员
    - 上一位或下一位按 sort_order 循环切换
    - 支持成员卡键盘聚焦、Enter/Space 选择与左右方向键切换
    - 少于 2 位成员时隐藏切换控件
    - 不自动轮播
  public_profile_fields:
    - team_member_id
    - name
    - avatar_url
    - title
    - profile_summary
    - professional_domains
    - industry_achievements
    - leading_projects
    - external_profile_url
    - sort_order
    - publish_status
    - portrait_authorization_status
    - external_link_authorization_status
  publish_gate: 成员文本须 CMS 已发布；人物照片与外部人物主页还须对应授权有效
  presentation_mode: 当前成员大图 + 人员画像正文 + 其他成员卡 + 上一位/下一位；隐藏评审字段、来源、状态和 Q 编号
  internal_review_mode: 展示字段、来源、CMS 发布状态、照片/外链授权状态和 Q041
  boundary: 人员画像仅指 E-34 页面内的公开成员介绍，不新增独立人员画像路由
  reference_image_rule: 用户截图仅约束信息层级、横向构图和切换方式，不作为人物照片、品牌色或人物事实来源

