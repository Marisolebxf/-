stories:
  - id: US-E34-01
    title: 理解代表企业及其入选理由
    role: 政府科技管理与决策部门
    acceptance:
      - 当前集群 + 当前 L0 只展示固定运营名单内且通过发布准入的明星企业；0 家为空态、1 家直接展示、2 家及以上提供可搜索选择器
      - E-34 Tab 内始终可见当前集群与当前 L0 并可切换；选项来自共享 15 集群目录；无映射空态，0 家企业的 L0 不隐藏
      - 默认选择 sort_order 第一家，当前对象与企业分别写入 cluster_id、industry_id、enterprise_code；旧 future_industry_code 只读兼容；切换后更新 URL 并返回首屏
      - 企业候选支持按企业名称或入选标签检索；标签不扩展为全库企业筛选
      - 不提供名单外自由选择、随机换一换或跨产业混排
      - 首屏展示入选理由、适用标准版本或待配置状态及数据时间
      - 入选标准只读说明不暴露权重、内部阈值、排名或敏感证据
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E34-02
    title: 查看产品功能全景
    role: 访客
    acceptance:
      - 当前企业产品集合为 0..N 个 CMS 已发布产品，按 sort_order 升序展示并默认选择第一项；前端不计算产品排名
      - 中屏每页最多展示 3 个产品；1~3 个隐藏分页控件，4 个及以上显示上一页、下一页及当前页/总页数，采用手动非循环翻页且不自动轮播；翻页后选中目标页 sort_order 第一项并同步详情
      - 点击或键盘选择产品卡后显示明确选中态，并联动其功能模块或产品架构、应用场景、行业案例、公开影响摘要和关联媒体
      - product_id、product_page、product_module_id 均为模块局部状态，不写入 URL；切换企业时回到第 1 页并选择首个产品，切换产品时关闭旧媒体层并重置旧功能模块状态
      - 产品卡和分页按钮支持键盘操作；边界页禁用对应翻页按钮，页码及当前产品变化可被辅助技术获知
      - 产品与媒体只读取 CMS 已发布内容；无产品或子内容缺失时使用对应业务空态
      - 内部评审模式展示媒体占位、字段、来源和状态，非评审演示可模拟真实效果但标记 DEMO
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3/产品功能全景图
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E34-03
    title: 理解技术优势与团队实力
    role: 科研人员
    acceptance:
      - 展示专利数、研发投入占比、核心技术、科研成果等公开技术信息
      - 团队实力位于技术优势下方并独占一行；非评审展示模式采用当前成员大图、人员画像正文、其他成员卡和上一位/下一位的轮播布局
      - 默认选择已发布成员 sort_order 第一位；点击成员卡或上一位/下一位切换姓名、照片、职务/领域、专业领域、行业成就、主导项目和外部主页入口
      - 当前成员画像至少覆盖姓名、职务/领域、专业领域、行业成就、主导项目；少于 2 位时隐藏切换控件且不自动轮播
      - 团队成员文本只读取 CMS 已发布内容；人物照片与外部人物主页还须授权有效，不可用时安全占位或隐藏入口
      - 内部评审开启时显示团队字段、来源、发布和授权状态；关闭后隐藏治理信息并恢复展示型轮播
      - 展示科学家或人才比例和团队成果等已发布内容
      - 每个统计数字有 metric_id 或 Q048/DEMO，不把内容性字段伪装成自动计算指标
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3/技术优势可视化+团队实力多维展示
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E34-04
    title: 浏览产业生态与企业故事
    role: 访客
    acceptance:
      - 产业生态图谱展示已确认的上下游、合作伙伴和关系摘要
      - 发展历程和口碑作为 CMS 企业故事辅助内容，不新增评分或风险结论
      - 生态节点可查看合作详情，企业名称可进入统一企业画像
    compliance_refs:
      - leaf_id: E-34
        source_section: 1.1.1.1.1.1.1.3/产业生态图谱
        route: /enterprise-center/overview?tab=star-enterprises
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

