content_dependencies:
  - owner: 数据与算法侧
    content: 当前产业固定明星企业名单、sort_order、入选标准版本、入选理由、专利及研发投入等基础指标
    status: PARTIAL
    open_question_id: Q048
  - owner: E-37 CMS / 运营侧
    content: 企业介绍；产品主数据、sort_order、功能模块/产品架构、场景、案例与媒体关联；视频、3D 模型；团队成员画像、人物照片及授权、外部人物主页及授权；发展历程、口碑及其他宣传内容
    status: PUBLISHED_ONLY
    open_question_id: Q041
  - owner: 图数据库与算法侧
    content: 上下游、供应链和战略合作伙伴关系
    status: DEMO
    open_question_id: Q040
  - owner: 企业查询与统一企业画像
    content: 企业基础档案、核心产品和系统通用资质荣誉
    status: REUSE

review_mode:
  internal:
    media_rule: 使用占位图展示媒体字段、来源、发布状态和接口依赖
    metric_rule: 未配置 metric_id 的量化字段显示 DEMO 与 Q048
    content_rule: CMS 草稿不可作为前台正式内容
    team_rule: 团队模块位于技术优势下方，展示成员字段、来源、CMS 发布状态、人物照片授权、外链授权和 Q041
    product_rule: 展示产品主数据、sort_order、发布状态、功能模块/场景/案例/媒体关联及 Q041；产品分页仍遵循每页 3 个和手动非循环规则
  presentation:
    media_rule: 可模拟视频、3D 模型、案例和图谱的真实展示效果，但必须标识为演示内容
    history_rule: 可引用开放企业官网公开事实做摘要模拟，并标明来源，不冒充 CMS 正式发布内容
    team_rule: 使用全宽团队轮播；当前成员大图与画像正文联动其他成员卡和上一位/下一位，隐藏评审说明与 Q 编号；演示数据仍标 DEMO，正式数据不标 DEMO
    product_rule: 使用产品卡 + 当前产品功能模块/场景/案例/媒体联动；4 个及以上手动非循环分页，不自动轮播；演示数据标 DEMO

open_questions:
  - id: Q040
    summary: 产业生态图谱先使用图数据库 demo 接口，正式产业链/招投标关系待补充
    owner: human:徐滕强 + human:唐绍祖
    deadline: 图谱模块开发前
  - id: Q041
    summary: CMS 人工维护内容的发布、字段和接口待对接；产品主数据、sort_order、功能模块/场景/案例/媒体关联，以及团队成员画像字段、人物照片与外部人物主页授权须一并闭合
    owner: human:高颖 + CMS 运营（外部）
    deadline: 门户 CMS 对接后
  - id: Q048
    summary: E-34 候选名单、发布准入、sort_order 唯一性、入选标准、版本更新及基础量化指标 metric_id 待确认
    owner: human:何老师 + human:唐绍祖 + CMS 运营（外部）；human:郭万迎闭环
    deadline: E-34 门1 PDR 前

gaps:
  yellow:
    - reason: 固定明星企业名单的候选池、发布准入、sort_order 唯一性、推荐标准、维护责任和基础指标语义未闭合
      open_question_id: Q048
      temporary_default: 原型使用共享有效未来产业字典；每产业配置 0..N 家 DEMO 明星企业，名单条目与基础介绍发布后才进入前台，按 sort_order 默认第一家，2 家及以上可按名称或入选标签搜索选择，不展示权重或排名
