shared_context:
  required:
    - topic_service
    - region_code: "440300"
    - future_industry_scope: active_future_industry_catalog
    - data_time
  fixed_region: 深圳市
  catalog_rule: 现行目录为 15 个产业集群（Q068）；控件不得把 8 或 15 固化为数量上限；无映射集群占位或空态
  reset_rule: 切换领域或重点企业区聚焦产业时只刷新对应局部内容，不改变深圳固定地域和全页当前产业集群目录统计范围

local_state:
  trend_industry_codes:
    purpose: 驱动当前未来产业目录数量对比与所选产业历年深圳企业数量趋势
    initialization: 优先采用有效的当前专题产业；否则选择深圳企业数量排名第一的产业
    selection_limit: 1..2
    third_selection_rule: 阻止新增并提示“最多对比两个产业”，不得静默覆盖已有选择
    scope_rule: 只更新趋势、图例和局部说明，不改变概况 KPI、领域分布、规模分析、深圳重点企业或全页当前未来产业目录统计范围
    visibility_rule: 每个所选产业至少有 2 个连续可比时间点才展示该序列；全部所选产业均不满足时隐藏趋势区并由数量对比区占满整行
  domain_industry_code:
    purpose: 驱动深圳企业领域分布区的当前产业链概况和领域/环节分布
    initialization: 优先采用有效的当前专题产业；否则选择当前目录第一个有领域映射数据的产业
    selection_limit: 1
    layout_rule: 标题旁显示原始需求说明；区块采用上方产业选择、产业链名称与“已识别领域/环节 X 个”，下方领域/环节分布的上下结构；已识别项数取当前分布集合总项数，不等同映射覆盖率；Q049 未闭合前业务态不得展示覆盖百分比或进度条
    list_rule: 默认按企业数量降序展示前 12 项，每次“查看更多”追加 12 项，全部展示后提供“收起”，并显示“已展示 X / 共 Y”；总数不超过 12 时不显示展开控件；不使用传统页码分页；切换产业后恢复前 12 项
    scope_rule: 只更新领域分布区，不改变趋势、规模或深圳重点企业局部状态
  key_enterprise_industry_code:
    purpose: 驱动深圳重点企业区当前展示的单一未来产业及企业卡
    initialization: 优先采用有效的当前专题产业；否则选择当前目录第一个有重点企业数据的产业；再否则选择目录第一项
    selection_limit: 1
    navigation_rule: 容器宽度内使用可见横向 Tab；未容纳产业进入支持名称搜索的“更多产业”下拉；产业数量不设 8 个固定上限
    selected_visibility_rule: 从“更多产业”选择后当前产业必须保持可见，可替换最后一个非固定可见 Tab，但不得改变目录顺序或丢失其他产业入口
    scope_rule: 只更新深圳重点企业区，不改变全页统计口径、趋势选择、领域聚焦或规模图

