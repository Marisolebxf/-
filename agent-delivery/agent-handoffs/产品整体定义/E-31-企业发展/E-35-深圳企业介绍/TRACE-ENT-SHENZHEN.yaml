stories:
  - id: US-E35-01
    title: 查看深圳企业数量与趋势
    role: 政府科技管理与决策部门
    acceptance:
      - 固定深圳市并按当前有效未来产业目录展示企业数量和历年趋势
      - 数量对比中的产业选择联动所选产业历年深圳企业数量趋势，支持单产业或最多双产业对比
      - 选择第三个产业时阻止新增并明确提示，不静默覆盖已有选择
      - 产业选择只更新趋势局部状态，不改变概况 KPI 或其他 E-35 区块
      - 每个所选产业至少包含两个连续可比时间点才展示该序列；全部所选产业均不满足时隐藏趋势模块
      - 统计数字有 metric_id 或 Q049/DEMO
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳企业数量
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E35-02
    title: 查看深圳企业领域分布
    role: 科研人员
    acceptance:
      - 标题旁显示原始需求说明“结合各未来产业链全景图，展示深圳企业在产业领域中的分布情况”
      - 可聚焦一个未来产业查看其产业链领域/环节分布摘要
      - 领域区采用上方产业选择、产业链名称与“已识别领域/环节 X 个”，下方领域/环节分布的上下结构，不使用左右分栏
      - 领域/环节默认展示前 12 项，每次“查看更多”追加 12 项，全部展示后提供“收起”并显示展示进度；总数不超过 12 时不显示展开控件，不使用页码分页
      - 不进入企业集合或产业链角色下钻；覆盖率分子、分母、metric_id 和来源未闭合时不展示百分比或进度条，评审态关联 Q049
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳企业领域分布
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E35-03
    title: 查看深圳企业规模结构
    role: 政府科技管理与决策部门
    acceptance:
      - 按当前有效未来产业目录展示大、中、小、微企业结构
      - 规模分级与资质荣誉分别治理，不将小微等资质标签直接等同规模口径
      - 正式规模分类口径待 Q049 闭合，闭合前标 DEMO
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳企业规模分析
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

  - id: US-E35-04
    title: 浏览深圳重点企业
    role: 访客
    acceptance:
      - 通过可见横向 Tab 选择常用产业，超出可见宽度的产业进入支持名称搜索的“更多产业”下拉
      - 产业导航消费当前有效 15 个产业集群，不把 8 或 15 固化为控件数量上限
      - 一次只展示当前选中产业的深圳重点企业公开基础档案；从“更多产业”选择后当前产业保持可见
      - 切换产业只更新重点企业区；无重点企业时保留选中态并显示业务空态
      - 资质荣誉复用统一枚举，国有企业使用企业性质字段
      - 企业名称可进入统一企业画像，不提供批量选择或专业分析动作
    compliance_refs:
      - leaf_id: E-35
        source_section: 1.1.1.1.1.1.1.4/深圳重点企业
        route: /enterprise-center/overview?tab=shenzhen
        screen_tier: medium
        delivery_track: Track-MS
        tier: DEMO
        wave: 0

