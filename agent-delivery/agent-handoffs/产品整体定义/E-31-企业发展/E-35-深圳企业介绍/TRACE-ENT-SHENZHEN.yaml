    summary: 重点企业识别阈值初版使用专利数，正式规则待算法闭合
  - id: Q049
    summary: E-35 正式 metric_id、ADS 来源、趋势可比性、规模分级、产业/产业链映射、覆盖率分子分母及 CMS 数据接口待确认

