approved_incremental_decisions:
  - date: "2026-07-20"
    source_relation: product_interpretation
    decision: 综合竞争力结果将“优势与短板诊断”与“指标明细与综合差距”合并为单一“综合竞争力与差距诊断”；单企态显式展示当前企业综合得分、数据可信度、维度得分、对象集均值与领先值、差距和优势短板，双企态展示A/B综合得分、可信度、维度差值与差异结论；右侧主排名图保持唯一排名表达，不重复企业表。
  - date: "2026-07-20"
    source_relation: product_interpretation
    decision: 商业力配置在业务模式提供确定性行业配置模拟预览；切换行业会加载适用指标与默认权重，已有改动时必须选择应用行业配置、保留自定义配置或取消。业务与评审模式共享相同配置结果；评审模式仅追加正式行业映射与权重尚未闭合的说明。模拟预览不解除 Q014、K-O7 或正式算法与 ADS 阻断。
  - date: "2026-07-20"
    source_relation: product_interpretation
    decision: 技术力结果将“技术指标诊断”与通用“指标明细与综合差距”合并为单一“技术指标与差距诊断”；同表展示技术力综合得分、原始技术指标、数据可信度、领先差距、优势与短板，趋势与建议缺失作为区块内状态，不重复企业表。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 三模式结果页统一为任务KPI、模式解释型分析、全对象综合排名、指标诊断和报告；主分析图表按模式区分。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 三家及以上对象仍全部进入排名，但雷达最多同时展示两家企业；企业A/B只能从任务对象集中选择且不可重复。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 排名只读取任务快照中的模式综合得分，不得使用第一个已选指标代替；任务固化模板ID、已选指标和权重。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 技术力采用归一化技术维度解释与原始指标诊断；商业力采用带原单位的经营指标对比，不使用营收专利混图或无来源雷达。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 配置页不要求用户编辑任务名称；生成评估时系统创建只读 task_display_name。个人模板名称只标识指标与权重配置，三种评估均须支持鼠标展开和选择当前模式个人模板。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 商业力结果将经营诊断与通用指标明细合并为“商业诊断与明细”，主排名图作为唯一排行表达；明细表展示经营指标、综合得分、数据可信度和诊断结论，不重复排名列。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 对比篮是新增企业评估对象的唯一来源；评估页不提供企业搜索、固定候选池或本地新增，但可移除本次对象且不回写对比篮；返回对比篮时按当前模式预选分析类型。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 生成评估后进入独立过程页，按六个业务阶段展示真实进度与已用时间，不伪造百分比，可离开并从最近评估或个人中心恢复。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 指标说明使用业务抽屉，内部评审模式在同一抽屉追加指标元数据，业务模式不渲染内部字段。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 最近评估和个人中心评估任务读取同一任务源，个人中心不复制第二份任务或状态。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 当前 DEMO 数据批次未接入，只可在评审态说明缺口，禁止生成或保存 mock_20260618 等伪造批次值。
  - date: "2026-07-17"
    source_relation: product_interpretation
    decision: 报告完成态提供下载当前报告，下载内容必须关联当前 task_id 和不可变结果快照。

boundary:
  purpose: 用可复现的对象、模式、模板、权重、数据与算法快照生成企业技术力、商业力或综合竞争力评估。
  includes:
    - 对比篮对象带入确认与当次移除
    - 技术力商业力综合竞争力三模式
    - 系统模板个人模板当次自定义配置
    - 指标选择整数权重和两层权重校验
    - 数据覆盖关键指标缺失可信度预检
    - 独立生成过程和离开恢复
    - 指标说明业务抽屉与评审元数据分层
    - 正式结果差距短板排名矩阵和适量雷达
    - 最近评估个人中心同源任务后台报告任务内部评审追溯
  excludes:
    - 在评估页嵌入或改写对比篮
    - 在评估页搜索添加企业或展示固定候选池
    - 风险洞察供应链发展痛难点结果
    - 招引培育结论一企一策候选名单
    - 普通用户修改全局模板默认权重模型参数数据批次
    - 配置页总览和对比篮报告导出
    - 第四种业务模式

product_roles:
  - id: ROLE-GOV-DECISION
    name: 政府科技管理与产业决策人员
    implementation_mapping: GOV-L3
    purpose: 区域和产业企业能力研判及政策服务决策。
    evidence: 科技专题服务算法库.md#政府科技管理部门
  - id: ROLE-PARK-SERVICE
    name: 产业园区运营或企业服务人员
    implementation_mapping: INNO-L3
    purpose: 园区企业分层短板识别和服务优先级。
    evidence: 科技专题服务算法库.md#产业园区
  - id: ROLE-INVEST-RESEARCH
    name: 投资机构产业研究或尽调人员
    implementation_mapping: THINK-L2
    purpose: 授权企业能力对标和尽调辅助。
    evidence: 科技专题服务算法库.md#投资机构
  - id: ROLE-ASSOCIATION
    name: 行业协会研究或服务人员
    implementation_mapping: THINK-L2
    purpose: 会员企业行业对标共性短板和服务议题。
    evidence: 科技专题服务算法库.md#行业协会
  - id: ROLE-ENTERPRISE-SELF
    name: 企业经营管理或战略人员
    implementation_mapping: INNO-L2-after-enterprise-verification
    purpose: 本企业自评和授权或脱敏同行对标。
    evidence: 科技专题服务算法库.md#企业自身

permission_contract:
  L2:
    personas: [INNO, THINK]
    allowed:
      - 使用系统默认模板
      - 选择指标并临时调整权重
      - 保存个人模板并生成结果
    data_scope: 授权或脱敏字段；受对象数量和报告模板约束。
    prohibited: 修改全局模板或反查未授权同行敏感明细。
  L3:
    personas: [GOV, INNO, THINK]
    allowed:
      - L2全部能力
      - 按授权查看内部或敏感字段
    prohibited: 以当次配置修改全局模板。
  L4:
    personas: [OPS, SYS]
    purpose: 维护全局模板默认权重字段模型参数数据批次权限和审计。
    routine_evaluation_user: false

handoff_contract:
  source_module: ENT-COMPARE
  input_fields: [enterprise_codes, source, analysis_type, return_context_id]
  source_value: compare-basket
  auto_preselect_valid_objects: true
  target_validates: [object_count, permission, fields, data_coverage, indicators, weights, model_conditions]
  target_can_add_current_objects: false
  target_can_remove_current_objects: true
  write_back_to_basket: false
  clear_basket_after_dispatch: false
  return_restores: [filters, selection, scroll_position]
  return_prefills_analysis_type: true
  invalid_object_policy: keep_valid_intersection_and_report_unavailable_count

