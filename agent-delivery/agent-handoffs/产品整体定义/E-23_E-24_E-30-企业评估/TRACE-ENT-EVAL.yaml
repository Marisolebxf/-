quality_contract:
  confidence:
    high: coverage_rate_gte_90_percent_and_no_key_metric_missing
    medium: coverage_rate_70_to_89_percent_or_few_key_metrics_missing
    low: coverage_rate_50_to_69_percent_or_multiple_key_metrics_missing
    cannot_generate: coverage_rate_lt_50_percent_or_all_key_metrics_missing
  per_enterprise_confidence_for_comparison: true
  warn_when_coverage_structures_differ: true
  radar_missing_point: show_missing_not_zero
  weight_input: integer_0_to_100
  each_weight_level_total: 100
  silent_normalization: false
  equal_distribution_action: true

template_contract:
  selector_groups: [system_templates, my_templates_for_current_mode, current_custom_configuration]
  personal_template_restores: [selected_indicator_keys, integer_weights, display_preferences]
  personal_template_does_not_restore: [enterprise_objects, unauthorized_fields]
  personal_center_and_configuration_share_source: true
  option_summary_fields: [template_name, indicator_count, saved_at]

processing_contract:
  route: "/enterprise-center/evaluation?view=processing&task_id={evaluationTaskId}"
  stages: [task_submitted, permission_and_configuration_validation, enterprise_data_aggregation, metric_calculation, confidence_and_comparability_validation, result_chart_assembly]
  visible_state: [current_stage, completed_stages, elapsed_time, task_id, mode, enterprise_count]
  fabricated_percentage: prohibited
  leave_and_resume: true
  resume_sources: [recent_evaluations, personal_center_evaluation_tasks]
  completion_actions: [view_result]
  failure_actions: [retry, create_new_from_configuration]

metric_description_contract:
  trigger: indicator_description_view
  container: business_drawer
  business_fields: [metric_name, purpose, dimension, business_definition, unit, direction, scope, availability, missing_impact]
  review_only_fields: [metric_id, formula, source_table, source_system, update_frequency, version, open_question]
  business_mode_internal_metadata: prohibited
  mutates_configuration: false

task_asset_contract:
  source_of_truth: evaluation_task_store
  projections: [recent_evaluations, personal_center_evaluation_tasks]
  duplicated_task_record: prohibited
  shared_fields: [task_id, status, mode, enterprise_summary, created_at, result_url, report_count]

data_batch_contract:
  full_snapshot_field: data_batch
  demo_status: not_integrated
  review_mode_copy: 数据批次未接入
  business_mode_gap_visible: false
  forbidden_demo_values: [mock_20260618]
  task_or_report_fingerprint_fabrication: prohibited

visualization_contract:
  common:
    layout: [task_kpis, mode_explanatory_analysis, all_object_composite_ranking, indicator_diagnosis, report]
    ranking_basis: mode_composite_score_from_task_snapshot
    first_selected_indicator_as_ranking_score: prohibited
    compare_enterprises_source: task_enterprise_set_only
    compare_enterprises_must_differ: true
    default_pair_for_three_or_more: top_two_by_snapshot_composite_score
    viewpoint_switch_mutates_task_snapshot: false
  technology:
    one: unsupported
