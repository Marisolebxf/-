    approved_scope_change: true
    decision: 对比篮从企业分析左侧二级菜单移除，升级为系统Shell可拖动浮层入口；与系统任务入口可同时显示，但同一时间只允许一个面板展开；共享协调器统一以Header下沿top 80px为最小顶部安全线，并处理至少16px碰撞吸附、临时置顶、按用户位置持久化和窗口缩放夹取；并发几何变化时任务窗保留坐标，对比篮监听任务窗出现、移动、展开与收起并重新让位；两个展开面板通过标题栏更多菜单提供恢复默认位置，默认位置时置灰且仅恢复当前浮层坐标
