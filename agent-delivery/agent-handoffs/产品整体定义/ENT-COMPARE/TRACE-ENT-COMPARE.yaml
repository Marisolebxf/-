      - 只提供企业名称搜索和企业类型筛选；不提供来源筛选；统一社会信用代码仅用于识别和去重。
      - 企业名称和企业类型旁的筛选恢复动作统一命名为“重置”，不使用“清空筛选”。
      - 对象列表提供“全选当前筛选结果”三态复选框；三态只按当前可见集合计算，当前筛选无结果时不可用。
      - 全选当前筛选结果、已选 X 家、取消选择、分隔线、发起分析、加入招引候选、加入培育候选按该顺序原位迁移到浮层底部固定操作栏，不把全选移入筛选栏。
      - 勾选全选把当前可见企业合并进已有选择；取消全选只取消当前可见企业；筛选后不可见的既有选择继续保留，“取消选择”清除全部选择。
      - “全选当前筛选结果”在业务模式与评审模式共用同一选择集合，review_mounts 为空。
      - 有对象时保持稳定高度浮层：筛选区固定在顶部，企业列表在中间剩余区域独立纵向滚动，批量操作栏固定在浮层底部。
      - 短列表不把操作栏上推；长列表不推动整页增长，滚动列表时操作栏位置不变。
      - 企业卡片不展示统一社会信用代码和加入来源标签；来源元数据仅用于内部追溯。
      - 清空篮需确认，单个移除无需确认。
    compliance_refs: []
    decision_refs: [Decision-088]
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-03
    title: 将对象送入重点企业分析、企业评估或风险洞察
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 对比篮-批量分发区
    wireframe_frames: [F-CMP-03, F-CMP-04]
    route: app-shell#system-compare-basket
    target_routes: [/enterprise-center/key-enterprise-analysis, /enterprise-center/evaluation, /enterprise-center/risk]
    acceptance:
      - 已选对象工具栏使用“发起分析”单一主动作；“取消选择”紧邻“已选X家”，仅取消当前勾选。
      - 企业评估分组提供技术力评估、商业力评估、综合竞争力评估。
      - 风险洞察分组提供供应链关系分析、发展痛难点分析。
      - 重点企业分析分组提供领域分布分析；接受1至50家企业并只应用当前勾选对象。
      - 供应链关系分析仅允许1至2家企业；已选超过2家时任务选项保留并禁用，明确提示最多选择2家，不静默截断。
      - 点击“发起分析”打开“选择分析任务”浮层；选择具体类型只更新选中态，不立即跳转。
      - 从通用入口打开时不预选任务；从携带有效analysis_type的目标分析页原位打开时预选对应任务，领域分布分析页对应key-enterprise-domain。
      - 未选择分析任务时“下一步：前往配置”不可执行；选择可用任务并点击该按钮后，才传递enterprise_codes、来源、analysis_type和必要上下文进入目标模块。
      - 关闭或取消任务选择浮层后留在对比篮，篮内容、筛选与勾选状态不变。
      - 目标模块负责权限、数量、模型和字段条件校验。
      - 目标页直接将enterprise_codes解析为已自动带入的分析对象并展示企业名称，不强制二次选择；领域分布分析、3种企业评估和2种风险洞察均以本次分发参数为配置草稿权威输入。
      - 对比篮不展示目标模块的任何分析结果。
      - 分发前生成会话级return_context_id并保存筛选、勾选与滚动位置，目标页展示来自对比篮与返回入口。
      - 同一分发往返恢复工作现场且不自动清空篮或勾选；对象失效时恢复有效交集并提示。
      - 刷新页面、通过兼容路由重新打开对比篮或return_context_id失效时只恢复篮内容，临时工作现场回到默认态。
    analysis_types:
      key_enterprise_analysis:
        route: /enterprise-center/key-enterprise-analysis
        options:
          - {value: key-enterprise-domain, label: 领域分布分析, target_route: "/enterprise-center/key-enterprise-analysis?view=domain", min_enterprise_count: 1, max_enterprise_count: 50, object_application: replace_domain_configuration_draft}
      enterprise_evaluation:
        route: /enterprise-center/evaluation
        options:
          - {value: technology, label: 技术力评估, target_route: "/enterprise-center/evaluation?tab=capability&capabilityType=tech"}
          - {value: business, label: 商业力评估, target_route: "/enterprise-center/evaluation?tab=capability&capabilityType=business"}
          - {value: competitiveness, label: 综合竞争力评估, target_route: "/enterprise-center/evaluation?tab=competitiveness"}
      risk_insight:
        route: /enterprise-center/risk
        options:
          - {value: supply-chain, label: 供应链关系分析, target_route: "/enterprise-center/risk?tab=supply-chain", min_enterprise_count: 1, max_enterprise_count: 2, overflow_behavior: disabled_with_hint}
          - {value: pain-points, label: 发展痛难点分析, target_route: "/enterprise-center/risk?tab=pain-points"}
    compliance_refs:
      - {leaf_id: E-22, coverage_role: target_handoff, owner_route: "/enterprise-center/key-enterprise-analysis?view=domain"}
      - {leaf_id: E-23, coverage_role: target_handoff, owner_route: /enterprise/capability}
      - {leaf_id: E-24, coverage_role: target_handoff, owner_route: /enterprise/capability}
      - {leaf_id: E-28, coverage_role: target_handoff, owner_route: /enterprise/supply-chain}
      - {leaf_id: E-29, coverage_role: target_handoff, owner_route: /enterprise/pain-points}
      - {leaf_id: E-30, coverage_role: target_handoff, owner_route: /enterprise/competitiveness}
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-04
    title: 加入招引或培育候选
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS]
    ia_node: 对比篮-批量分发区
    wireframe_frames: [F-CMP-03, F-CMP-04]
    route: app-shell#system-compare-basket
    target_routes: [/enterprise-center/attraction]
    acceptance:
      - 已在候选名单中的企业不重复写入。
      - 提示新增与重复数量，不自动跳转。
      - 查看引育名单可选择招引或培育并直达对应候选Tab，展示对应已加入对象。
      - 不在对比篮生成推荐理由、一企一策或名单导出。
    compliance_refs:
      - {leaf_id: E-26, coverage_role: candidate_handoff, owner_route: /enterprise/recommendation}
      - {leaf_id: E-27, coverage_role: candidate_handoff, owner_route: /enterprise/recommendation}
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-05
    title: 从空篮继续发现企业
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 对比篮-空篮启动页
    wireframe_frames: [F-CMP-00, F-CMP-01, F-CMP-04, F-CMP-06]
    route: app-shell#system-compare-basket
    acceptance:
      - 主操作进入企业查询。
      - 空篮说明可从企业查询、重点企业分析、总览或企业画像加入企业。
      - 空篮不展示推荐企业。
    compliance_refs: []
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-06
    title: 与系统任务窗口无冲突地使用可拖动浮层
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 应用Shell-系统浮层协调器
    wireframe_frames: [F-CMP-00, F-CMP-06]
    route: app-shell#system-compare-basket
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-SYSTEM-FLOAT-20260731
    acceptance:
      - 系统任务入口与对比篮入口可同时显示；任务无可见任务时沿用既有隐藏规则。
      - 系统任务入口默认右上，对比篮入口默认右下，视口边界与浮层间距均不小于16px。
      - 同一时间只允许一个系统浮层面板展开；打开任一面板自动收起另一面板但不清空业务状态。
      - 入口与展开面板标题可拖动；拖动结束发生重叠时当前浮层吸附到最近无冲突位置，拖动后不误触点击动作。
      - 当前操作浮层临时置顶，交互结束后恢复统一系统浮层层级；阻塞弹层覆盖系统浮层且不允许点击穿透。
      - 任务与对比篮位置分别按用户保存；页面切换保持，窗口缩放或面板尺寸变化后重新夹取与避让。
      - 两个收起入口始终保持可访问；两个展开面板标题栏的更多菜单均提供恢复默认位置，默认位置时置灰，执行仅恢复当前浮层坐标且不改变业务或展开状态；键盘用户不依赖拖动即可操作。
    compliance_refs: []
    decision_refs: [ASC-ENT-COMPARE-SYSTEM-FLOAT-20260731]
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-07
    title: 在五Tab系统篮中完整使用企业能力
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 系统篮-多对象Tab壳层-企业Tab
    wireframe_frames: [F-CMP-00, F-CMP-01, F-CMP-02, F-CMP-03, F-CMP-04, F-CMP-05, F-CMP-07]
    route: app-shell#system-compare-basket
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-MULTI-OBJECT-SHELL-20260731
    acceptance:
      - 系统篮按企业产业政策服务机构区域排列五个Tab并默认进入企业Tab。
      - 五类对象目标容量分别为50且不共享总额；已启用类型各自生效。
      - 企业Tab完整保留恢复搜索筛选三态全选画像移除清空分析分发引育候选和返回恢复能力。
      - 旧企业篮数据首次加载时幂等迁移到enterprise类型空间；新结构写入成功前不删除旧数据。
      - 迁移失败时继续读取旧企业篮并提供重试，不把失败显示为空篮。
      - 收起入口使用纯篮图标，数量以右上红色数字角标显示并统计全部已启用类型合计；企业Tab显示企业X/50。
      - 旧/enterprise-center/basket链接打开系统篮并默认定位企业Tab。
      - 不同类型独立计数去重选择和清空，不允许混合发起同一分析任务。
    compliance_refs: []
    decision_refs: [ASC-ENT-COMPARE-MULTI-OBJECT-SHELL-20260731, ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807]
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-08
    title: 识别尚未开放的区域对象类型
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 系统篮-区域开发中Tab
    wireframe_frames: [F-CMP-11]
    route: app-shell#system-compare-basket
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807
    acceptance:
      - 区域Tab显示行政区域未来用途和开发中状态。
      - 区域Tab不显示数量0/50 Mock对象搜索选择添加分析清空或批量动作。
      - 综合智能分析等区域来源模块本期不显示加入对比篮入口。
      - 切换区域Tab后返回任一已启用Tab，该Tab内容筛选选择和滚动位置不丢失。
      - 业务模式不显示内部评审说明；评审模式挂载唯一范围追溯且不改变Tab业务状态。
    compliance_refs: []
    decision_refs: [ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807]
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-09
    title: 收集产业与产业链对象并分发分析
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 系统篮-产业Tab
    wireframe_frames: [F-CMP-08]
    route: app-shell#system-compare-basket?active_type=industry
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807
    approval_status: pending_approval
    acceptance:
      - 产业查询与产业总览可加入或移出industry与industry_chain对象。
      - 产业Tab键为industry；角标显示两类对象合计/单池max；两类对象各自独立容量50。
      - 产业与产业链对象不可混选后发起分析；切换选择类型时清空或提示并重置已选分析。
      - 发起分析可分发到产业链全景产业运行诊断区域产业评价深圳产业决策等兼容配置页。
      - 篮内不生成诊断评分区域指数或深圳对比结论。
    compliance_refs: []
    decision_refs: [ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807]
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-10
    title: 收集政策对象并分发政策分析
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 系统篮-政策Tab
    wireframe_frames: [F-CMP-09]
    route: app-shell#system-compare-basket?active_type=policy
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807
    approval_status: pending_approval
    acceptance:
      - 政策查询等来源页可加入或移出policy对象，容量独立50。
      - 政策Tab可搜索选择清空并分发到兼容政策分析配置。
      - 篮内不生成政策对比结论或评分。
    compliance_refs: []
    decision_refs: [ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807]
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-11
    title: 收集服务机构对象并分发服务链分析
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 系统篮-服务机构Tab
    wireframe_frames: [F-CMP-10]
    route: app-shell#system-compare-basket?active_type=service_org
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807
    approval_status: pending_approval
    acceptance:
      - 服务机构查询能力页推荐页等来源可加入或移出service_org对象，容量独立50。
      - 服务机构Tab可搜索选择清空并分发到兼容服务链分析配置。
      - 篮内不生成服务链评价或招引培育结论。
    compliance_refs: []
    decision_refs: [ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807]
    metrics: []
    open_questions: []

