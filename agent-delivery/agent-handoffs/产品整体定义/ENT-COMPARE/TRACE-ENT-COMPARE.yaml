    picker_selected_count:
      label: 已选择 X 家企业
      placement: below_modal_title_before_task_groups
      migration_mode: preserve_existing_implementation_layout
    picker_groups: [企业评估, 风险洞察]
    option_selection_behavior: update_picker_selection_without_navigation
    confirm_label: 下一步：前往配置
    navigation_trigger: confirm_after_selecting_available_analysis_type
    close_behavior: preserve_basket_filters_and_selection
  candidate_actions:
    presentation: secondary_immediate_actions
    actions: [加入招引候选, 加入培育候选]
    success_navigation: stay_on_compare_basket
  legacy_enterprise_migration:
    target_object_type: enterprise
    trigger: first_system_basket_load
    idempotent: true
    delete_legacy_before_target_write_success: false
    duplicate_policy: deduplicate_by_enterprise_key
    failure_fallback: continue_reading_legacy_basket_and_offer_retry
    failure_empty_state: prohibited
    legacy_route_default_tab: enterprise
  workspace_layout:
    mode: stable_vertical_floating_panel
    filter_bar: fixed_top
    enterprise_list: flex_fill_with_internal_vertical_scroll
    action_bar: pinned_to_panel_bottom
    short_list_behavior: preserve_action_bar_bottom_alignment
    long_list_behavior: scroll_list_without_moving_action_bar_or_growing_panel_or_page
  floating_layer_coordination:
    coordinator_scope: app_shell
    surfaces: [system-task-layer, system-compare-basket]
    simultaneous_docks: allowed
    simultaneous_expanded_panels: prohibited
    open_other_behavior: collapse_current_panel_preserve_business_state
    system_task_default_anchor: top_right_24px_below_64px_header
    compare_basket_default_anchor: bottom_right_24px
    viewport_safe_margin: 16
    inter_surface_gap: 16
    drag_handles: [collapsed_dock, expanded_panel_title]
    collision_during_drag: allow_pointer_follow
    collision_on_drop: snap_current_surface_to_nearest_free_position
    active_layer_behavior: temporary_raise_then_restore_shared_layer
    blocking_overlay_behavior: modal_or_drawer_above_and_no_pointer_through
    position_persistence: separate_per_surface_per_user
    resize_behavior: clamp_then_resolve_collisions
    constrained_space_priority: keep_both_docks_accessible_and_only_active_panel_expanded
    recovery_action:
      label: 恢复默认位置
      placement: expanded_panel_title_overflow_menu
      enabled_when: current_surface_position_differs_from_default
      disabled_when: current_surface_position_is_default
      scope: current_surface_position_only
      preserves: [basket_items, active_tab, filters, selection, panel_expansion_state, task_state]
      persistent_title_button: prohibited
    keyboard_drag_required: false
  clear_basket_requires_confirmation: true
  single_remove_requires_confirmation: false
  batch_overflow: add_first_n_within_remaining_capacity_and_report_rejected_count
  permission_behavior: preserve_action_and_explain_reason
  dispatch_state:
    persistent: [basket_items]
    session_snapshot: [enterprise_name_keyword, enterprise_type_filter, selected_enterprise_codes, list_scroll_position]
    handoff_fields: [enterprise_codes, source, analysis_type, return_context_id]
    target_context: [source_label, selected_count, selected_enterprise_names, preselected_analysis_objects, compare_basket_import_action, return_to_basket_action]
    target_object_policy: auto_inherit_enterprise_codes_with_optional_basket_import
    target_execution_policy: configure_model_or_dimensions_then_start_analysis
    return_restore: same_return_context_only
    invalid_object_policy: restore_valid_intersection_and_report_unavailable_count
    fresh_entry_policy: shell_or_legacy_route_open_restores_basket_only_and_resets_session_snapshot
    auto_clear_after_dispatch: false

