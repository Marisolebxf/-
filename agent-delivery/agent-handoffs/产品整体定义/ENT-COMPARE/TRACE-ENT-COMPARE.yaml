source_differences:
  - id: DIFF-01
    old: 旧产品设计把对比篮放在企业总览之后。
    current: 最新企业IA将对比篮放在重点企业分析之后。
  - id: DIFF-02
    old: 旧产品设计将多类分析与分析口径配置混在统一选择流程。
    current: 对比篮在重点企业分析、企业评估与风险洞察三个分组下选择1+3+2种目标分析，口径配置与计算归目标模块。
  - id: DIFF-03
    old: TRACE v0.1使用INNO与THINK作为角色。
    current: 改为E-20有证据的政府、园区和投资机构产品角色。
  - id: DIFF-04
    old: 旧四件套在空篮展示推荐企业，并支持按统一社会信用代码搜索。
    current: 2026-07-15人工评审确认对比篮不做推荐，篮内只按企业名称搜索；信用代码仅作为识别和去重字段。
  - id: DIFF-05
    old: 旧四件套只定义分发参数，未定义目标页来源状态与返回后的工作现场。
    current: 2026-07-16人工评审补充会话级return_context_id；同一往返恢复筛选、勾选与滚动位置，篮内容不自动清空，新进入只恢复篮内容。
  - id: DIFF-06
    old: 筛选条件旁使用“清空筛选”，与“清空选择”和“清空对比篮”形成近义混淆。
    current: 2026-07-16人工反馈确认筛选恢复动作统一命名为“重置”；对象清空与当前勾选取消分别使用“清空对比篮”和“取消选择”。
  - id: DIFF-07
    old: 已选工具栏使用“企业评估 / 风险洞察”名词型下拉，点击具体类型后立即跳转，外观和行为容易被误解为筛选器。
    current: 2026-07-16人工反馈确认合并为“发起分析”主动作；2026-07-31补充重点企业领域分布分析，浮层按重点企业分析、企业评估与风险洞察展示1+3+2种任务，选择不跳转，点击“下一步：前往配置”后才进入目标模块；“清空选择”同步改为“取消选择”。
  - id: DIFF-08
    old: 企业列表与批量操作栏按普通文档流排列；短列表时操作栏停在页面中部，长列表时操作栏被推到列表末尾。
    current: 2026-07-16人工反馈确认采用稳定纵向工作区；筛选区固定顶部，企业列表独立滚动，批量操作栏固定工作区底部。
  - id: DIFF-09
    old: 对比篮对象列表只支持逐项勾选，批量操作前需逐个选择企业。
    current: 2026-07-20用户反馈确认增加“全选当前筛选结果”三态复选框；选择只覆盖当前名称与类型筛选可见集合，隐藏选择保留，取消选择仍清除全部选择。
  - id: DIFF-10
    old: 对比篮任务选择浮层未在分发前表达供应链关系分析的对象数量上限，超过2家仍可选择该任务。
    current: 2026-07-20用户反馈确认继承ENT-RISK既有1至2家对象契约；超过2家时保留供应链关系分析选项但置灰，明确提示最多选择2家，不静默截断。
  - id: DIFF-11
    old: 对比篮通过企业分析左侧二级菜单进入独立页面；既有系统任务浮层与对比篮没有共享定位或冲突协议。
    current: 2026-07-31会议评审确认移除左侧二级菜单入口，升级为系统Shell可拖动浮层；任务与对比篮入口可同时显示但只允许一个面板展开，由共享协调器处理碰撞吸附、临时置顶、按用户位置持久化与窗口缩放夹取；位置恢复通过展开标题栏更多菜单中的恢复默认位置完成。
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-SYSTEM-FLOAT-20260731
  - id: DIFF-12
    old: 系统浮层仍以企业单类型篮表达，收起入口与面板都使用X/50，未覆盖其他已明确业务域。
    current: 2026-07-31人工确认规划企业产业政策服务机构区域五类基础对象Tab，每类目标容量独立为50且不共享总额；壳层ASC仍有效。
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-MULTI-OBJECT-SHELL-20260731
  - id: DIFF-17
    old: v2.8四件套仍写一期仅企业启用，产业政策服务机构区域均为开发中占位；Tab名写产业链。
    current: >
      2026-08-07按Demo as-built对齐：Tab名为企业/产业/政策/服务机构/区域；
      产业政策服务机构真实启用；区域仍占位；共X项统计已启用类型合计；
      产业Tab同屏管理industry与industry_chain且禁止混选分发。激活范围登记ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807，approval_status=pending_approval。
    source_relation: product_enhancement
    approved_scope_change: ASC-ENT-COMPARE-MULTI-OBJECT-ACTIVATE-20260807
    approval_status: pending_approval
  - id: DIFF-13
    old: 展开面板标题栏常驻显示还原位置按钮，低频恢复动作占用高频操作区且文案不统一。
    current: 2026-07-31人工复核确认保留恢复能力并统一命名为恢复默认位置，移入展开面板标题栏更多菜单；默认位置时置灰，执行只恢复当前浮层坐标，不改变业务或展开状态。
    source_relation: product_interpretation
  - id: DIFF-14
    old: v2.1线框将全选当前筛选结果放在筛选栏，与现有企业篮底部操作栏布局不一致。
    current: 2026-07-31人工确认按现有实现原位迁移企业底部操作栏，顺序固定为全选、已选数量、取消选择、分隔线、发起分析、加入招引候选、加入培育候选。
    source_relation: product_interpretation
  - id: DIFF-15
    old: 企业查询推荐结果区在系统Shell入口之外继续显示页内常驻对比篮按钮及数量角标，形成两个聚合入口和重复计数表达。
    current: 2026-07-31人工反馈确认移除企业查询页内聚合按钮及数量角标，只保留逐企业加入和已加入状态；系统Shell图标为唯一打开与管理入口。
    source_relation: product_interpretation
  - id: DIFF-16
    old: 企业查询入口去重仅概括标题区结果区和瞬时反馈，未逐一约束普通结果高级结果完整详情和画像快览Drawer，Drawer动作还可能让系统浮层在其下方或与其叠加。
    current: 2026-07-31人工复核逐一冻结四类宿主；前三类移除聚合入口，画像快览Drawer保留临时接力动作并执行关闭完成后再安全展开系统浮层。
