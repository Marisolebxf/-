boundary:
  purpose: 暂存、恢复和管理企业对象，并把选中对象分发到企业评估、风险洞察或招引/培育候选名单。
  includes:
    - 全局加入与取消加入
    - 企业唯一键去重与多来源记录
    - 单用户单篮恢复与50家容量
    - 当前篮内搜索、来源筛选和企业类型筛选
    - 勾选、移除、清空、查看画像
    - 进入企业评估或风险洞察
    - 加入招引或培育候选
    - Q037空态固定推荐
  excludes:
    - 轻量对比或任何分析结果
    - 技术力商业力竞争力评分雷达排名差距
    - 供应链图谱风险诊断痛难点报告
    - 推荐理由一企一策名单导出
    - 多套命名篮团队共享篮收藏夹
    - 地区产业风险引育标签复杂筛选

product_roles:
  - id: ROLE-GOV-DECISION
    name: 政府科技管理与决策人员
    evidence: catalog-topic-enterprise.yaml#E-20
  - id: ROLE-PARK-OPS
    name: 产业园区运营或企业服务人员
    evidence: catalog-topic-enterprise.yaml#E-20
  - id: ROLE-INVEST-RESEARCH
    name: 投资机构产业研究人员
    evidence: catalog-topic-enterprise.yaml#E-20

stories:
  - id: US-ENT-CMP-01
    title: 收集企业并保持全局一致
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 对比篮-对象管理区
    wireframe_frames: [F-CMP-02]
    route: /enterprise-center/basket
    acceptance:
      - 同一企业按企业ID或统一社会信用代码全局去重。
      - 所有来源入口同步显示加入或已加入状态。
      - 重复加入可追加来源并更新最近操作时间，不产生重复记录。
    compliance_refs:
      - {leaf_id: E-20, coverage_role: module_scope_anchor, owner_route: /enterprise/overview}
      - {leaf_id: E-21, coverage_role: source_context, owner_route: /enterprise/type-distribution}
      - {leaf_id: E-22, coverage_role: source_context, owner_route: /enterprise/domain-distribution}
      - {leaf_id: E-25, coverage_role: source_context, owner_route: /enterprise/status-analysis}
      - {leaf_id: E-32, coverage_role: source_context, owner_route: /development/overview}
      - {leaf_id: E-33, coverage_role: source_context, owner_route: /development/key-enterprises}
      - {leaf_id: E-34, coverage_role: source_context, owner_route: /development/star-enterprises}
      - {leaf_id: E-35, coverage_role: source_context, owner_route: /development/shenzhen}
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-02
    title: 找回并管理单用户单篮
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 对比篮-对象管理区
    wireframe_frames: [F-CMP-02, F-CMP-04]
    route: /enterprise-center/basket
    acceptance:
      - 默认最多50家，刷新或重新进入后恢复最近单篮。
      - 默认按最近操作时间倒序。
      - 只提供名称或统一社会信用代码搜索、来源筛选、企业类型筛选。
      - 清空篮需确认，单个移除无需确认。
    compliance_refs: []
    decision_refs: [Decision-088]
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-03
    title: 将对象送入企业评估或风险洞察
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 对比篮-批量分发区
    wireframe_frames: [F-CMP-03, F-CMP-04]
    route: /enterprise-center/basket
    target_routes: [/enterprise-center/evaluation, /enterprise-center/risk]
    acceptance:
      - 只传递enterprise_codes、来源和必要上下文。
      - 目标模块负责权限、数量、模型和字段条件校验。
      - 对比篮不展示目标模块的任何分析结果。
    compliance_refs:
      - {leaf_id: E-23, coverage_role: target_handoff, owner_route: /enterprise/capability}
      - {leaf_id: E-24, coverage_role: target_handoff, owner_route: /enterprise/capability}
      - {leaf_id: E-28, coverage_role: target_handoff, owner_route: /enterprise/supply-chain}
      - {leaf_id: E-29, coverage_role: target_handoff, owner_route: /enterprise/pain-points}
      - {leaf_id: E-30, coverage_role: target_handoff, owner_route: /enterprise/competitiveness}
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-04
    title: 加入招引或培育候选
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS]
    ia_node: 对比篮-批量分发区
    wireframe_frames: [F-CMP-03, F-CMP-04]
    route: /enterprise-center/basket
    target_routes: [/enterprise-center/attraction]
    acceptance:
      - 已在候选名单中的企业不重复写入。
      - 提示新增与重复数量，不自动跳转。
      - 不在对比篮生成推荐理由、一企一策或名单导出。
    compliance_refs:
      - {leaf_id: E-26, coverage_role: candidate_handoff, owner_route: /enterprise/recommendation}
      - {leaf_id: E-27, coverage_role: candidate_handoff, owner_route: /enterprise/recommendation}
    metrics: []
    open_questions: []

  - id: US-ENT-CMP-05
    title: 从空篮继续发现企业
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 对比篮-空篮启动页
    wireframe_frames: [F-CMP-01, F-CMP-04]
    route: /enterprise-center/basket
    acceptance:
      - 主操作进入企业查询。
      - 固定重点或明星企业推荐不超过30条且不个性化。
      - 推荐失败时保留主操作，不生成伪造推荐。
    compliance_refs:
      - {leaf_id: E-33, coverage_role: empty_state_recommendation_source, owner_route: /development/key-enterprises}
      - {leaf_id: E-34, coverage_role: empty_state_recommendation_source, owner_route: /development/star-enterprises}
    metrics: []
    open_questions: [Q037]

field_contract:
  entity_key: enterprise_code_or_unified_social_credit_code
  required_fields:
    - enterprise_code
    - unified_social_credit_code
    - enterprise_name
    - region
    - industry_domain
    - enterprise_type
    - risk_level_if_authorized
    - attraction_cultivation_tags_if_authorized
    - source_routes
    - last_operated_at
    - data_updated_at
  operational_counts:
    - {field: basket_count, metric_id: N/A, reason: 交互状态计数}
    - {field: selected_count, metric_id: N/A, reason: 交互状态计数}
  statistical_metrics_required: 0
  statistical_metrics_mapped: 0

interaction_contract:
  max_items: 50
  persistence: single_user_single_basket_recoverable
  default_sort: last_operated_at_desc
  allowed_filters: [enterprise_name_or_credit_code, source, enterprise_type]
  prohibited_filters: [region, industry_domain, risk_level, attraction_tag, cultivation_tag]
  clear_basket_requires_confirmation: true
  single_remove_requires_confirmation: false
  batch_overflow: add_first_n_within_remaining_capacity_and_report_rejected_count
  permission_behavior: preserve_action_and_explain_reason

