boundary:
  purpose: 以系统级五类基础对象Tab组织暂存与分发能力；已启用企业/产业/政策/服务机构，区域仍为开发中占位（激活ASC待签字）。
  includes:
    - 全局加入与取消加入
    - 按object_type独立唯一键去重与多来源记录
    - 单用户单篮恢复与每类型50容量
    - 企业名称搜索和企业类型筛选
    - 产业Tab内产业/产业链对象管理与同类型发起分析
    - 政策Tab对象管理与政策分析分发
    - 服务机构Tab对象管理与服务链相关分发
    - 逐项勾选、全选当前筛选结果、移除、清空、查看画像或对象
    - 进入企业评估或风险洞察
    - 加入招引或培育候选
    - 系统Shell常驻入口、拖动与按用户位置恢复
    - 与系统任务浮层的展开互斥、碰撞避让和层级协调
    - 企业产业政策服务机构区域五类对象Tab壳层
    - 企业既有数据幂等迁移与旧路由默认企业Tab
    - 区域开发中空页
  excludes:
    - 轻量对比或任何分析结果
    - 技术力商业力竞争力评分雷达排名差距
    - 供应链图谱风险诊断痛难点报告
    - 推荐理由一企一策名单导出
    - 多套命名篮团队共享篮收藏夹
    - 地区产业风险引育标签复杂筛选
    - 企业分析左侧对比篮二级菜单
    - 两个完整系统浮层面板同时展开
    - 将任务状态与对比篮合并为同一业务面板
    - 区域对象的真实存储加入入口与分析动作
    - 跨类型混选与联合分析
    - 将区域时间指标权重等分析条件保存为篮对象
    - 产业Tab内industry与industry_chain混选后发起分析

