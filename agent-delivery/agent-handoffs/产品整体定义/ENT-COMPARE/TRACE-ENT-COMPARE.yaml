  - id: US-ENT-CMP-02
    title: 找回并管理单用户单篮
    roles: [ROLE-GOV-DECISION, ROLE-PARK-OPS, ROLE-INVEST-RESEARCH]
    ia_node: 对比篮-对象管理区
    wireframe_frames: [F-CMP-00, F-CMP-02, F-CMP-04, F-CMP-06]
    route: app-shell#system-compare-basket
    acceptance:
      - 默认最多50家，刷新或重新进入后恢复最近单篮。
      - 已登录业务页面通过系统Shell对比篮入口打开浮层，入口显示共X项且统计全部已启用类型合计；企业Tab显示X/50；企业分析左侧二级菜单不再出现对比篮。
