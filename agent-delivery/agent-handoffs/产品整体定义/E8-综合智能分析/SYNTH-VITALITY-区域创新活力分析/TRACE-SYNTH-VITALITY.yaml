cross_leaf_contracts:
  - id: CT-SYN-CTX
    name: 区域分析共享上下文
    fields: [region, compareScope, window]
    defaults:
      region: 深圳
      compareScope: 全国重点城市
      window: 最近3年
    persistence_key: topic-synth-workbench
    url_params: [region, compare, window]
    consumers: [SYNTH-VITALITY, SYNTH-ELEMENT, SYNTH-COLLAB]
    rules:
      - 三叶读写同一状态机，禁止私有互斥默认值
      - URL 优先级 > localStorage > 系统默认
      - 本叶为 defaults 权威草案；兄弟叶 Pack 引用不得另起默认
  - id: CT-SYN-VIT-ELEM
    from: F-VIT-01
    to: SYNTH-ELEMENT
    mechanism: router /intelligence/elements 携带 CT-SYN-CTX
  - id: CT-SYN-VIT-COLLAB
    from: F-VIT-01
    to: SYNTH-COLLAB
    mechanism: router /intelligence/collaboration 携带 CT-SYN-CTX
  - id: CT-SYN-03
    from: F-VIT-01
    to: 系统报告面
    mechanism: 挂 resultSnapshotId（batch 或 task）
  - id: CT-SYN-JOBS
    from: F-VIT-02
    to: SYS-ANALYSIS-JOBS
    task_type: region_innovation_vitality
    stages:
      - { code: submit, name: 任务提交与分析条件冻结 }
      - { code: validate, name: 校验目标区域×对比范围×时间窗，装载四维专题库快照与权重合计 }
      - { code: compute, name: 按科技/产业/人才/政策四维计算区域创新活力指数 }
      - { code: contribute, name: 生成单维评分、权重分布与优势短板 }
      - { code: assemble, name: 结果可信性校验与分析报告组装 }

