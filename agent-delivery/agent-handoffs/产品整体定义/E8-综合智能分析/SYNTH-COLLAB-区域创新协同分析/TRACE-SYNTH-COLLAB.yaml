cross_leaf_contracts:
  - id: CT-SYN-CTX
    name: 区域分析共享上下文
    fields: [region, compareScope, window]
    defaults:
      region: 深圳
      compareScope: 全国重点城市
      window: 最近3年
    persistence_key: topic-synth-workbench
    url_params: [region, compare, window]
    consumers: [SYNTH-VITALITY, SYNTH-ELEMENT, SYNTH-COLLAB]
    rules:
      - URL 优先级 > localStorage > 系统默认
      - 默认三元组有跑批快照时秒开
      - 任一字段改变后须由用户点击开始分析
  - id: CT-SYN-JOBS
    from: F-COLLAB-02
    to: SYS-ANALYSIS-JOBS
    task_type: region_innovation_collaboration
    mutex_key: user_id + task_type
    stages:
      - { code: submit, name: 任务提交与分析条件冻结 }
      - { code: network, name: 装载创新主体与合作关系快照，构建区域协同网络 }
      - { code: metrics, name: 计算完整度、中心度与密度三项网络指标 }
      - { code: diagnose, name: 合成协同指数，识别高效集群、孤立主体与优势不足 }
      - { code: assemble, name: 校验横向对比与趋势结果，组装协同效率报告快照 }
  - id: CT-SYN-01
    from: F-COLLAB-01
    to: E-31 企业画像
    mechanism: 企业节点携带 enterpriseCode 跳统一画像
  - id: CT-SYN-02
    from: F-COLLAB-01
    to: E7 机构画像
    mechanism: 服务机构节点携带稳定 org ID
  - id: CT-SYN-03
    from: F-COLLAB-01
    to: 系统报告面
    mechanism: 报告绑定 batch 或 task 的 resultSnapshotId

