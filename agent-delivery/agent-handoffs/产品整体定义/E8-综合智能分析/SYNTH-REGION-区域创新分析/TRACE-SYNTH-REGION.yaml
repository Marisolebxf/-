requirement_trace:
  - ref: REQ-SYN-VIT-SYSTEM
    bid_section: "1.1.1.2.4.2.8.1.1 指标体系构建"
    original_text_digest: 系统预设一套科学的区域创新活力评价指标体系，涵盖研发高新技术企业数量、专利申请与授权量、高质量论文数量等多个维度，全面衡量区域创新动能
    stories: [US-SYN-02]
    frames: [F-SYN-01]
    implementation: "RegionalInnovationVitality 指标体系分层区（4 维度卡 → 12 指标行：口径/权重/值/得分，展开持久化）"
    metrics: [M_SYNTH_INDICATOR_SCORE]
    open_refs: [Q-SYNTH-01]
    status: closed_demo_with_honest_gap
  - ref: REQ-SYN-VIT-MODEL
    bid_section: "1.1.1.2.4.2.8.1.2 综合评价模型"
    original_text_digest: 基于构建的指标体系，运用加权算法或机器学习模型建立创新活力综合计算模型，将多维度数据融合为单一直观的创新活力指数
    stories: [US-SYN-03]
    frames: [F-SYN-01]
    implementation: "synthModel.computeVitality（演示态固定权重加权，前端可复现；正式模型属 Python 侧）；指数卡 D1 missing 红问号诚实态"
    metrics: [M_SYNTH_VITALITY_INDEX]
    open_refs: [Q-SYNTH-01]
    status: closed_demo_with_honest_gap
  - ref: REQ-SYN-VIT-INDEX
    bid_section: "1.1.1.2.4.2.8.1.3 区域指数计算与可视化"
    original_text_digest: 用户灵活选择目标区域（如深圳市、南山区等），系统自动调用模型实时计算，生成创新活力综合指数及各分项得分，通过排名榜等形式可视化展示
    stories: [US-SYN-01, US-SYN-03]
    frames: [F-SYN-01]
    implementation: "上下文条（市/区两级区域 + 时间窗，URL+持久化）+ 指数仪表盘 + 分项分组条形 + TOP10 排名榜（点击切换区域全页重算）+ 逐年趋势"
    metrics: [M_SYNTH_VITALITY_INDEX, M_SYNTH_INDICATOR_SCORE]
    open_refs: [Q-SYNTH-01]
    status: closed_demo_with_honest_gap
  - ref: REQ-SYN-ELEM-GATHER
    bid_section: "1.1.1.2.4.2.8.2.1 创新要素数据汇聚"
    original_text_digest: 整合区域内的企业、科研机构、高层次人才、科研资金等核心创新要素数据，形成要素全景数据库
    stories: [US-SYN-04]
    frames: [F-SYN-02, F-SYN-04]
    implementation: "RegionalInnovationElements 要素全景卡组（四类要素规模+同比）+ 要素详情抽屉（构成明细 + 代表主体样例，实体 ID 与图谱一致）"
    metrics: [M_SYNTH_ELEMENT_SCALE]
    status: closed_demo
  - ref: REQ-SYN-ELEM-MODEL
    bid_section: "1.1.1.2.4.2.8.2.2 要素评价模型构建"
    original_text_digest: 建立综合评价模型，对各要素的规模、质量、结构及活跃度进行量化打分，评估区域创新要素的整体禀赋与配置效率
    stories: [US-SYN-04]
    frames: [F-SYN-02, F-SYN-04]
    implementation: "四要素×四维（规模/质量/结构/活跃度）评价雷达 + 区域 vs 对比均值切换；评价模型未定义保持 D1 missing 红问号"
    metrics: [M_SYNTH_ELEMENT_SCORE]
    open_refs: [Q-SYNTH-02]
    status: closed_demo_with_honest_gap
  - ref: REQ-SYN-ELEM-IMPACT
    bid_section: "1.1.1.2.4.2.8.2.3 要素影响关联分析"
    original_text_digest: 通过数据挖掘与关联分析，量化识别各创新要素对特定产业发展及创新成果的贡献度与影响路径，揭示驱动创新的关键动力
    stories: [US-SYN-05]
    frames: [F-SYN-02]
    implementation: "影响关联区（贡献度排序条形 + 点击展开影响路径卡 + 驱动/瓶颈结论）；关联算法未定义保持诚实态"
    metrics: [M_SYNTH_ELEMENT_CONTRIB]
    open_refs: [Q-SYNTH-02]
    status: closed_demo_with_honest_gap
  - ref: REQ-SYN-COLLAB-GRAPH
    bid_section: "1.1.1.2.4.2.8.3.1 创新主体关系图谱"
    original_text_digest: 动态构建"企业－机构－人才"合作关系网络图，支持按产业领域筛选节点，可视化连接密度与中心性指标
    stories: [US-SYN-06]
    frames: [F-SYN-03, F-SYN-05]
    implementation: "RegionalInnovationCollaboration ForceGraph（四类主体 + 三类关系边）+ 产业领域/主体类型筛选（持久化+URL）+ 网络统计侧栏（密度/中心性 TOP）+ 节点下钻分流（CT-SYN-01/02 跨模块，人才本地抽屉）"
    metrics: [M_SYNTH_COLLAB_DENSITY, M_SYNTH_COLLAB_CENTRALITY]
    open_refs: [Q-SYNTH-03]
    status: closed_demo_with_honest_gap
  - ref: REQ-SYN-COLLAB-INDEX
    bid_section: "1.1.1.2.4.2.8.3.2 协同度计算模型"
    original_text_digest: 定义联合专利、合作项目、人才流动等协同指标，计算创新协同指数，识别高效协同集群与孤立主体
    stories: [US-SYN-07]
    frames: [F-SYN-03]
    implementation: "协同度区（协同指数卡 + 三类协同指标逐项值）+ 集群卡（点击图谱高亮成员与内部边）+ 孤立主体列表（点击定位）；计算模型未定义保持 D1 missing"
    metrics: [M_SYNTH_COLLAB_INDEX]
    open_refs: [Q-SYNTH-03]
    status: closed_demo_with_honest_gap
  - ref: REQ-SYN-COLLAB-EVAL
    bid_section: "1.1.1.2.4.2.8.3.3 协同效果评估"
    original_text_digest: 分析协同网络与创新产出（如联合发明专利数）的相关性，生成协同效率报告，提出优化合作路径的策略建议
    stories: [US-SYN-07]
    frames: [F-SYN-03]
    implementation: "效果评估区（协同度×联合专利产出对照 + 相关系数诚实态 + 结论文本🧪）+ 生成协同效率报告（CT-SYN-03 系统报告面）"
    metrics: [M_SYNTH_COLLAB_OUTPUT_CORR]
    open_refs: [Q-SYNTH-03]
    status: closed_demo_with_honest_gap

