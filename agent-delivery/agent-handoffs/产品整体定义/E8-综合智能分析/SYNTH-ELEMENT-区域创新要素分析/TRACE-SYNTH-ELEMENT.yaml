cross_leaf_contracts:
  - id: CT-SYN-CTX
    name: 区域分析共享上下文
    fields: [region, compareScope, window]
    defaults:
      region: 深圳
      compareScope: 全国重点城市
      window: 最近3年
    persistence_key: topic-synth-workbench
    url_params: [region, compare, window]
    consumers: [SYNTH-VITALITY, SYNTH-ELEMENT, SYNTH-COLLAB]
    rules:
      - 三叶读写同一状态机，禁止私有互斥默认值
      - URL 优先级 > localStorage > 系统默认
      - defaults 权威草案见 VITALITY Pack；本叶引用，不另起默认开放项
  - id: CT-SYN-VIT-ELEM
    from: SYNTH-VITALITY
    to: F-ELEM-01
    mechanism: router /intelligence/elements 携带 CT-SYN-CTX
  - id: CT-SYN-ELEM-VIT
    from: F-ELEM-01
    to: SYNTH-VITALITY
    mechanism: router /intelligence/vitality 携带 CT-SYN-CTX
  - id: CT-SYN-ELEM-COLLAB
    from: F-ELEM-01
    to: SYNTH-COLLAB
    mechanism: router /intelligence/collaboration 携带 CT-SYN-CTX
  - id: CT-SYN-03
    from: F-ELEM-01
    to: 系统报告面
    mechanism: 挂 resultSnapshotId（batch 或 task）
  - id: CT-SYN-JOBS
    from: F-ELEM-02
    to: SYS-ANALYSIS-JOBS
    task_type: region_innovation_elements
    stages:
      - { code: submit, name: 任务提交与分析条件冻结 }
      - { code: aggregate, name: 汇聚七类创新要素多源数据与全景快照 }
      - { code: type_level, name: 计算要素类型指数与层次指数 }
      - { code: domain_impact, name: 计算领域指数并量化要素贡献路径 }
      - { code: synthesize, name: 合成要素综合指数、优势短板与分析报告组装 }

