    frames: [F-ELEM-01, F-ELEM-03]
    source_relation: direct_requirement
    implementation_hint: "规模/质量/活跃度→类型透镜；结构→层次透镜；领域覆盖→领域透镜；综合→要素指数。方法抽屉显性展示计算步骤；公式未定→D1 missing"
