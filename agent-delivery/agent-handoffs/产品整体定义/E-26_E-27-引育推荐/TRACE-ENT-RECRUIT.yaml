    source: Bid 细项覆盖复核
    changes:
      - 补齐招引目标企业特征：高成长、关键技术型、隐形冠军、专精特新。
      - 补齐培育的“发展瓶颈 → 培育建议 → 所需支持”证据链。
      - 建立 18 项直接需求能力明细，区分 mapped 与 complete，不再仅以 E-26 / E-27 两个叶子代表全量覆盖。
      - 补齐多源输入、训练 / 版本 / 动态更新和 RESTful API / SDK / 在线平台契约及阻断项。
  - date: "2026-07-21"
    source: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    changes:
      - 企业查询 / 对比篮加入的候选对象定义为人工线索。
      - 在引育视图内新增候选工作台与指定对象复核模式。
