    lifecycle: [历史样本训练, 模型优化, 政策变化监测, 数据更新监测, 推荐结果重新计算]
  - id: MODEL-ENT-RECRUIT-CULTIVATION
    source_relation: direct_requirement
    requirement_ref: DR-ENT-RECRUIT-C-07
    lifecycle: [历史样本训练, 模型优化, 政策数据更新监测, 市场与企业数据更新监测, 培育评分重新计算]

