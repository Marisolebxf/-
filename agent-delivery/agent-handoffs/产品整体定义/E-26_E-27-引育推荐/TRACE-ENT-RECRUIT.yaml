large_result_contract:
  source_relation: product_interpretation
  approved_decision: DEC-ENT-RECRUIT-LARGE-RESULT-20260721
  result_semantics: 完整分析结果，不以默认 Top N 或无限滚动替代
  pagination:
    mode: server_stable_pagination
    default_page_size: 20
    page_size_options: [20, 50, 100]
    ranking_rule: 保留完整结果原始排名，局部筛选后不重编号
  local_filtering:
    effect: 仅缩小展示集合
    prohibitions: [不重新运行模型, 不改变结果版本, 不静默重排]
  selection:
    current_page_select: 表头全选仅当前页
    filtered_result_select: 底部显示全选当前筛选结果及明确数量
    persistence: 跨页保留
    compare_basket_overflow: 整批阻断并提示缩小范围，不静默截断
  temporary_thresholds:
    specified_object_review_max: 50
    direct_export_max: 1000
    export_over_limit: 后台生成，不扩展为通用异步任务中心
    gap_ref: GAP-RECRUIT-BATCH-01

risk_credit_contract:
  source_relation: product_enhancement
  approved_scope_change: DEC-ENT-RECRUIT-RISK-CREDIT-20260722
  applies_to_views: [attraction, cultivation]
  placement:
    summary: 企业详情标题旁
    section: 关键指标之后的企业风险与信用区
    detail: 当前企业风险明细抽屉
  categories: [司法涉诉, 失信被执行, 经营异常, 行政处罚]
  summary_states: [attention_required, public_record_not_found, verification_pending]
  business_copy:
    attention_required: 存在 N 项需关注
    public_record_not_found: 当前公开数据未检出
    verification_pending: 风险数据待核验
  detail_fields: [risk_type, event_summary, occurred_at, current_status, source_name, data_updated_at]
  required_context: [enterprise_code, source_coverage_summary, data_updated_at]
  prohibitions:
    - 不使用“无风险”
    - 不将缺失或未覆盖显示为 0 条
    - 不生成未经批准的风险分数或等级
