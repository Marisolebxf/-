approved_decisions:
  - id: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    approved_by: user
    approved_at: "2026-07-21"
    scope_effect: within_existing_leaves_no_leaf_change
    approved_scope_change: product_workflow_enhancement
    decisions:
      - 企业查询的“加入招引 / 培育候选”创建人工线索，不创建模型推荐结论。
      - 候选工作台归属引育推荐，不仅作为个人资产只读记录。
      - 引育分析结果可加入对比篮，再分发至企业评估或风险洞察并返回原候选工作台。
      - 评估与风险结果只是证据，不自动改写推荐指数或候选状态。
      - 人工线索使用“指定对象复核分析”，复用当前引育模型，排名仅在指定对象集合内有效。
  - id: DEC-ENT-RECRUIT-LARGE-RESULT-20260721
    approved_by: user
    approved_at: "2026-07-21"
    scope_effect: within_existing_leaves_no_leaf_change
    approved_scope_change: product_interaction_interpretation
    decisions:
      - 分析结果保留完整名单，不以默认 Top N 或无限滚动替代完整结果。
      - 采用服务端稳定分页，默认每页 20 家，可切换 20 / 50 / 100；局部筛选不重跑模型或重编号原始排名。
      - 底部操作栏展示已选数、取消选择、全选当前筛选结果及加入对比篮；选择跨页保留。
      - 超出对比篮剩余容量时整批阻断并提示缩小范围，不静默截断。
      - 单次指定对象复核暂定不超过 50 家；导出不超过 1,000 家直接生成，超过后后台生成；阈值待性能验证。
  - id: DEC-ENT-RECRUIT-RISK-CREDIT-20260722
    approved_by: user
    approved_at: "2026-07-22"
    scope_effect: within_existing_leaves_no_leaf_change
    approved_scope_change: product_detail_evidence_enhancement
    decisions:
      - 招引与培育企业详情均增加独立的“企业风险与信用”复核区，并在企业标题旁显示风险摘要状态。
      - 风险区覆盖司法涉诉、失信被执行、经营异常、行政处罚四类公开风险线索，并提供明细抽屉。
      - 风险摘要只使用“存在 N 项需关注 / 当前公开数据未检出 / 风险数据待核验”，不得使用“无风险”。
      - 风险与信用线索不进入推荐指数，不自动改排名或候选状态，也不构成专业法律意见。
  - id: DEC-ENT-RECRUIT-ASYNC-PROCESS-20260723
    approved_by: user
    approved_at: "2026-07-23"
    scope_effect: within_existing_leaves_no_leaf_change
    approved_scope_change: product_workflow_enhancement
    upstream_decision: DEC-SYS-ANALYSIS-JOBS-20260723
    decisions:
      - 招引推荐和培育推荐统一使用五阶段可视化分析过程。
      - 两类分析接入共享系统任务层，允许离开页面后从系统任务浮层或个人中心恢复。
      - 招引与培育使用独立 task_type，不共享输入快照或结果。
      - 引育页不自建通用任务中心或历史资产中心。
  - id: DEC-ENT-RECRUIT-IN-TAB-REVIEW-20260731
    approved_by: user
    approved_at: "2026-07-31"
    scope_effect: within_existing_leaves_no_leaf_change
    approved_scope_change: product_interaction_interpretation
    decisions:
      - 在候选工作台点击“执行指定对象复核”后保持当前候选工作台 Tab，不切换到条件筛选推荐 Tab。
      - 当前 Tab 内依次承接指定对象模型参数配置、五阶段分析过程和人工线索复核结果。
      - 条件筛选推荐与候选工作台分别保存任务 ID、输入与参数快照、五阶段过程、结果引用和列表交互状态；切换入口只挂载目标入口自身上下文，切回后恢复。
      - 参数配置只投影模型契约实际提供的参数项；未闭合的阈值或权重不由页面补造默认值。
      - 返回候选列表时恢复原视图、候选筛选、分页和未失效的选择上下文。

  - id: DEC-ENT-RECRUIT-REPORT-CONSUMER-20260731
    approved_by: current_user
    approved_at: "2026-07-31"
    source_relation: product_interpretation
    scope_effect: within_existing_bid_report_and_export_capabilities_no_leaf_change
    approved_scope_change: product_interaction_interpretation
    decisions:
      - 招引分析报告与培育分析报告作为ENT-EXPORT的两个独立报告类型，复用七个固定核心章节、只读HTML Reader与同修订PDF。
      - 引育推荐拥有业务事实、指标语义、来源快照、权限上下文、局限性与安全返回路由；ENT-EXPORT不推导推荐结论。
      - 推荐数据导出继续作为当前结果的表格或数据导出契约，不并入报告Reader，不把HTML或PDF当作数据导出格式。
      - 技术接口、指纹、授权、审计和正式范围激活属于下游缺口，不阻断采用确定性适配数据的V1。

