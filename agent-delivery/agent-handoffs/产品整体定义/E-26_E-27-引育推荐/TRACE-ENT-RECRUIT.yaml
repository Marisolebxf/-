information_architecture:
  page:
    name: 引育推荐
    route: /enterprise/recommendation
    views:
      - id: attraction
        name: 招引推荐
        leaf_id: E-26
        object_scope: 全国企业
        filters: [企业标签, 行业领域, 地域来源]
        result_primary: 优选企业清单与企业行业领域排名
        work_entries: [filtered_recommendation, candidate_workbench]
      - id: cultivation
        name: 培育推荐
        leaf_id: E-27
        object_scope: 深圳市内企业
        filters: [产业类别, 政策导向, 企业规模]
        result_primary: 优选企业排名
        result_secondary: 可视化行业分布
        work_entries: [filtered_recommendation, candidate_workbench]
    shared_levels:
      - L1 页面壳层与视图切换
      - L2 筛选条件与显式执行分析
      - L3 推荐名单或排名
      - L4 企业推荐详情
      - L5 分析报告与数据导出
      - L6 对比篮研判与人工确认闭环
    prohibited_shared_semantics:
      - 对象范围
      - 业务筛选
      - 模型维度
      - 推荐名单
      - 企业详情

stories:
  - id: US-ENT-RECRUIT-A1
    title: 设置招引条件并执行推荐分析
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST]
    leaf_id: E-26
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.6.1
      - BID-ENT-ALGORITHM#5.7
    route: /enterprise/recommendation
    view: attraction
    frames: [F-RECRUIT-A-CONFIG]
    review_mount_refs: [ENT-RECRUIT-F01-CONFIG-TITLE]
    acceptance:
      - 可按企业标签、行业领域或地域来源设置招引分析条件。
      - 目标特征明确覆盖高成长性、关键技术型、隐形冠军和专精特新；字典与识别规则由数据 / 模型契约提供。
      - 用户显式执行分析后才产生结果，未执行时不显示默认名单或虚构分数。
      - 对象范围为全国企业，不能继承培育视图的深圳本地限制。

  - id: US-ENT-RECRUIT-A2
    title: 查看招引名单与企业价值
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST]
    leaf_id: E-26
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.6.2
      - BID-ENT-ALGORITHM#5.7
    route: /enterprise/recommendation
    view: attraction
    frames: [F-RECRUIT-A-RESULT]
    review_mount_refs: [ENT-RECRUIT-F02-RESULT-TITLE, ENT-RECRUIT-F02-METRIC-DETAIL, ENT-RECRUIT-F02-MODEL-STATUS]
    metric_refs:
      - M_ENT_ATTRACTION_INDEX
      - M_ENT_INDUSTRY_MATCH_SCORE
      - M_ENT_POLICY_MATCH_SCORE
      - GAP-RECRUIT-METRIC-01
      - GAP-RECRUIT-METRIC-03
    acceptance:
      - 名单展示排名、企业名称、行业领域、地域来源和招引推荐指数。
      - 选择企业后联动展示产业相关度、政策匹配度、深圳连接度和高潜挖掘依据。
      - 详情展示核心优势、关键指标和合作价值；关键指标中的每个统计项携带自身 metric_id。
      - 名单或详情显示命中的目标特征及识别依据，不把泛化企业标签当作隐形冠军 / 专精特新认定。
      - 结果携带 model_version、data_version、generated_at 和动态更新状态；新版本完成前不静默替换旧结果。

  - id: US-ENT-RECRUIT-A3
    title: 生成招引分析报告并导出数据
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST]
    leaf_id: E-26
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-ALGORITHM#5.7
    route: /enterprise/recommendation
    view: attraction
    frames: [F-RECRUIT-A-RESULT]
    review_mount_refs: [ENT-RECRUIT-F02-RESULT-TITLE]
    acceptance:
      - 当前招引结果页提供分析报告生成和数据导出入口。
      - 操作反馈限定为当前页面状态，不扩展历史任务或个人资产中心。

  - id: US-ENT-RECRUIT-C1
    title: 设置培育条件并执行推荐分析
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_id: E-27
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.7.1
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    view: cultivation
    frames: [F-RECRUIT-C-CONFIG]
    review_mount_refs: [ENT-RECRUIT-F03-CONFIG-TITLE]
    acceptance:
      - 可按产业类别、政策导向或企业规模设置培育分析条件。
      - 对象范围固定为深圳市内企业，不能混入全国招引企业。
      - 用户显式执行分析后才产生结果。

  - id: US-ENT-RECRUIT-C2
    title: 查看培育排名、行业分布与所需支持
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_id: E-27
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.7.2
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    view: cultivation
    frames: [F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F04-RESULT-TITLE, ENT-RECRUIT-F04-METRIC-DETAIL, ENT-RECRUIT-F04-MODEL-STATUS]
    metric_refs:
      - M_ENT_CULTIVATION_INDEX
      - M_ENT_INDUSTRY_MATCH_SCORE
      - M_ENT_POLICY_MATCH_SCORE
      - M_ENT_GROWTH_POTENTIAL
      - GAP-RECRUIT-METRIC-02
      - GAP-RECRUIT-METRIC-04
    acceptance:
      - 企业排名展示排名、企业名称、产业类别、企业规模和培育推荐指数。
      - 行业分布作为企业排名的补充结果视图，不取代名单主工作区。
      - 选择企业后联动展示产业相关度、政策匹配度、企业潜力、识别依据和所需支持。
      - 详情按“发展瓶颈 → 培育建议 → 所需支持”展示可追溯对应关系，不用风险洞察结果替代培育模型的瓶颈识别。
      - 结果携带 model_version、data_version、generated_at 和动态更新状态；新版本完成前不静默替换旧结果。

  - id: US-ENT-RECRUIT-C3
    title: 生成培育分析报告并导出数据
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_id: E-27
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    view: cultivation
    frames: [F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F04-RESULT-TITLE]
    acceptance:
      - 当前培育结果页提供详细分析报告生成和数据导出入口。
      - 报告或导出失败时保留当前结果，不表现为空结果。

  - id: US-ENT-RECRUIT-L1
    title: 管理人工线索与候选状态
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_enhancement
    approved_scope_change: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    compliance_refs: []
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-CANDIDATES]
    review_mount_refs: [ENT-RECRUIT-F05-CANDIDATE-TITLE]
    acceptance:
      - 企业查询或对比篮加入的对象标记为人工线索，不冒充模型推荐。
      - 候选工作台展示线索来源、加入人、加入时间和当前状态。
      - 培育线索未通过深圳市内范围预检时禁止培育复核，可显式转为招引线索。

  - id: US-ENT-RECRUIT-L2
    title: 对指定企业执行引育复核分析
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_interpretation
    approved_decision: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    compliance_refs:
      - BID-ENT-ALGORITHM#5.7
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-CANDIDATES, F-RECRUIT-A-RESULT, F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F05-CANDIDATE-TITLE, ENT-RECRUIT-F02-MANUAL-RESULT-TITLE, ENT-RECRUIT-F04-MANUAL-RESULT-TITLE]
    acceptance:
      - 指定对象复核使用当前引育视图的模型、维度、权重和数据版本。
      - 结果标记为“人工线索复核结果”，与条件筛选推荐结果区分。
      - 排名仅在本次指定对象集合内有效，不冒充全国或深圳全量排名。

  - id: US-ENT-RECRUIT-L3
