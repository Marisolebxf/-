    input_categories: [企业基本信息, 政策数据, 市场调研数据, 行业动态, 产业相关度参数, 政策匹配度参数, 企业潜力指标与权重]
    required_result_metadata: [model_version, data_version, generated_at, data_coverage_summary, missing_data_summary]
  - id: MODEL-ENT-RECRUIT-ATTRACTION
    source_relation: direct_requirement
