      pending_ref: Q015
    - metric_id: M_ENT_CULTIVATION_INDEX
      page_field: 培育推荐指数
      status: semantic_revision_required
      issue: 现有定义为四维，bid 为产业相关度、政策匹配度、企业潜力三维。
      pending_ref: Q015
    - metric_id: M_ENT_INDUSTRY_MATCH_SCORE
      page_field: 产业相关度
      status: candidate_semantic_revision
      issue: 现有名称为产业匹配度，需确认是否可校准为同一语义。
      pending_ref: Q015
    - metric_id: M_ENT_POLICY_MATCH_SCORE
      page_field: 政策匹配度
      status: reusable_pending_definition
      pending_ref: Q015
    - metric_id: M_ENT_GROWTH_POTENTIAL
      page_field: 企业潜力
      status: candidate_only
      issue: 现有成长潜力语义和 E-26 归属不能直接等同培育模型的企业潜力。
      pending_ref: Q015
  explicit_gaps:
    - id: GAP-RECRUIT-METRIC-01
      field: 深圳连接度
      treatment: 登记独立 metric_id；不得与区域适配性静默合并。
    - id: GAP-RECRUIT-METRIC-02
      field: 企业潜力
      treatment: 数据评审决定修订 M_ENT_GROWTH_POTENTIAL 或新增 metric_id。
    - id: GAP-RECRUIT-METRIC-03
      field: 企业行业领域排名
      treatment: 明确排名范围、排序字段、并列规则和 metric_id / 派生字段定义。
    - id: GAP-RECRUIT-METRIC-04
      field: 可视化行业分布
      treatment: 明确统计量、分母、行业分类和 metric_id 后再显示真实数值。
    - id: GAP-RECRUIT-METRIC-05
      field: 关键指标集合
      treatment: 每个实际指标携带自身 metric_id；不创建笼统总分。

