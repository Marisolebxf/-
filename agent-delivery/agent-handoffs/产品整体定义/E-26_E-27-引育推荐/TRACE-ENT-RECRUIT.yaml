explicit_exclusions:
  - 引育页自建异步任务中心或历史任务；只复用 SYS-ANALYSIS-JOBS 共享任务层
  - 以个人资产中心替代引育候选工作台
  - 页面内编辑模型公式、阈值或权重
  - 执行指定对象复核时切换到条件筛选推荐 Tab，或用条件筛选表单替代候选工作台内的参数配置阶段
  - 前端计算官方推荐指数
  - 企业评估或风险洞察结论自动改写推荐指数或候选状态
  - 完整一企一策生成与服务派单
  - 默认截断为 Top N 并冒充完整推荐名单
  - 以无限滚动替代可定位、可复核的稳定分页
  - 对超容量批量操作静默截取前若干家
  - 将企业风险与信用线索计入推荐指数或自动改变排名、培育建议和候选状态
  - 使用“无风险”或把数据未覆盖、查询失败解释为 0 条风险记录
  - 在引育推荐中生成专业法律意见，或用风险与信用摘要替代风险洞察模块

