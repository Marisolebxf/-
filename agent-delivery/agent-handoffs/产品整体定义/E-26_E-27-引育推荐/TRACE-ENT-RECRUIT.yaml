    capability_scope: [按产业类别查询, 按政策导向查询, 按企业规模查询, 执行分析, 获取报告, 数据导出]
    architecture_rule: 对外契约经网关 / Java 聚合服务提供，不直接暴露 Python 内部接口。

metrics:
  registered_reuse_with_bid_alignment:
    - metric_id: M_ENT_ATTRACTION_INDEX
      page_field: 招引推荐指数
      status: semantic_revision_required
      issue: 现有定义使用生态连接度，bid 使用深圳连接度。
      pending_ref: Q015
    - metric_id: M_ENT_CULTIVATION_INDEX
      page_field: 培育推荐指数
      status: semantic_revision_required
      issue: 现有定义为四维，bid 为产业相关度、政策匹配度、企业潜力三维。
      pending_ref: Q015
    - metric_id: M_ENT_INDUSTRY_MATCH_SCORE
      page_field: 产业相关度
      status: candidate_semantic_revision
      issue: 现有名称为产业匹配度，需确认是否可校准为同一语义。
      pending_ref: Q015
    - metric_id: M_ENT_POLICY_MATCH_SCORE
      page_field: 政策匹配度
      status: reusable_pending_definition
      pending_ref: Q015
    - metric_id: M_ENT_GROWTH_POTENTIAL
      page_field: 企业潜力
      status: candidate_only
      issue: 现有成长潜力语义和 E-26 归属不能直接等同培育模型的企业潜力。
      pending_ref: Q015
  explicit_gaps:
    - id: GAP-RECRUIT-METRIC-01
      field: 深圳连接度
      treatment: 登记独立 metric_id；不得与区域适配性静默合并。
    - id: GAP-RECRUIT-METRIC-02
      field: 企业潜力
      treatment: 数据评审决定修订 M_ENT_GROWTH_POTENTIAL 或新增 metric_id。
    - id: GAP-RECRUIT-METRIC-03
      field: 企业行业领域排名
      treatment: 明确排名范围、排序字段、并列规则和 metric_id / 派生字段定义。
    - id: GAP-RECRUIT-METRIC-04
      field: 可视化行业分布
      treatment: 明确统计量、分母、行业分类和 metric_id 后再显示真实数值。
    - id: GAP-RECRUIT-METRIC-05
      field: 关键指标集合
      treatment: 每个实际指标携带自身 metric_id；不创建笼统总分。
    - id: GAP-RECRUIT-RISK-COUNT-01
      field: 司法涉诉记录数
      treatment: 明确案件范围、企业关联规则、去重、当前状态和统计窗口后登记 metric_id；闭合前不显示正式计数。
    - id: GAP-RECRUIT-RISK-COUNT-02
      field: 失信被执行记录数
      treatment: 明确失信主体匹配、已履行 / 已移出状态、去重和统计窗口后登记 metric_id；不得与一般司法记录混算。
    - id: GAP-RECRUIT-RISK-COUNT-03
      field: 经营异常记录数
      treatment: 明确列入 / 移出状态、记录去重和统计窗口后登记 metric_id；闭合前不显示正式计数。
    - id: GAP-RECRUIT-RISK-COUNT-04
      field: 行政处罚记录数
      treatment: 明确处罚类型、有效状态、企业关联、去重和统计窗口后登记 metric_id；不得仅凭数量生成风险等级。

evidence_fields:
  attraction: [技术匹配度, 成长性, 区域适配性]
  cultivation: [技术壁垒, 市场增速, 团队背景]
  rule: 先按证据字段展示；只有显示数值时才登记独立 metric_id。

analysis_modes:
  - id: filtered_recommendation
    source_relation: direct_requirement
    object_scope: 招引为全国企业池；培育为深圳市内企业池
    ranking_scope: 对象池内筛选与排名
  - id: specified_object_review
    source_relation: product_interpretation
    approved_decisions: [DEC-ENT-RECRUIT-CLOSED-LOOP-20260721, DEC-ENT-RECRUIT-IN-TAB-REVIEW-20260731]
    object_scope: 用户本次选定的人工线索集合
    ranking_scope: 仅在本次指定集合内有效
    host_entry: candidate_workbench
    in_tab_stages: [list, review_config, review_process, review_result]
    navigation_rule: 保持候选工作台 Tab；不得切换到条件筛选推荐 Tab。
    parameter_rule: 只投影模型契约实际提供的参数项；未闭合阈值或权重保持 pending / disabled。
    context_restore: 返回候选列表时恢复视图、候选筛选、分页和未失效的选择上下文。

