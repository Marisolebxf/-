shared_states:
  - id: initial
    rule: 未执行分析不等于空结果，不显示默认名单或虚构分数。
  - id: loading
    rule: 保留条件并防止重复提交；展示五阶段、当前阶段和稍后查看入口；任务离开页面后继续且可由系统任务层恢复，不展示旧结果冒充本次结果。
  - id: success
    rule: 展示名单、详情、更新时间、报告和导出入口。
  - id: empty
    rule: 保留条件，不自动放宽范围或用其他企业填充名单。
  - id: partial
    rule: 缺失字段显示暂无数据，不显示为 0；报告披露缺失项。
  - id: error
    rule: 保留条件并允许重试，不表现为空结果。
  - id: permission
    rule: 不通过数量、排名、详情或导出接口泄露结果。

