change_log:
  - date: "2026-07-31"
    source: DEC-ENT-RECRUIT-REPORT-CONSUMER-20260731
    changes:
      - 将招引分析报告和培育分析报告定义为ENT-EXPORT第三消费者下的两个独立报告类型。
      - 固定七个核心章节、来源快照、只读HTML Reader、同修订PDF、安全返回和业务/评审模式隔离规则。
      - 明确引育推荐拥有业务内容与指标语义，ENT-EXPORT只拥有共用结构、Reader、渲染与产物元数据。
      - 将推荐数据导出拆为独立表格或数据导出契约，不复用报告Reader。
      - 新增GAP-RECRUIT-REPORT-ADAPTER-01，作为不阻断V1的下游技术契约缺口。
  - date: "2026-07-31"
    source: DEC-ENT-RECRUIT-IN-TAB-REVIEW-20260731
    changes:
      - 指定对象复核固定在当前候选工作台 Tab 内完成，不再跳转到条件筛选推荐 Tab。
      - 新增 F-RECRUIT-REVIEW-CONFIG，明确“参数配置 → 五阶段过程 → 人工线索复核结果”的当前 Tab 闭环。
      - 参数项以模型契约实际提供内容为准，未闭合阈值 / 权重保持 pending 或 disabled。
      - 明确返回候选列表时恢复筛选、分页和未失效选择上下文。
      - screen_tier 校准为 medium_1440_1920，并明确 1920 / 1680 / 1440 三档。
  - date: "2026-07-23"
    source: DEC-ENT-RECRUIT-ASYNC-PROCESS-20260723
    changes:
      - 招引与培育统一为任务提交、权限与配置校验、数据汇聚、算法计算、结果组装五阶段过程。
      - 接入 SYS-ANALYSIS-JOBS 共享任务层，支持离开页面后从系统任务浮层或个人中心恢复。
      - 招引与培育使用独立 task_type，禁止共享输入快照或结果。
      - 保留“引育页不自建通用任务中心或历史资产中心”的边界。
  - date: "2026-07-22"
    source: DEC-ENT-RECRUIT-RISK-CREDIT-20260722
    changes:
      - 招引与培育企业详情新增独立的企业风险与信用摘要和明细抽屉。
      - 风险线索限定为司法涉诉、失信被执行、经营异常、行政处罚四类公开记录。
      - 明确“存在 N 项需关注 / 当前公开数据未检出 / 风险数据待核验”三态，禁止使用“无风险”。
      - 风险与信用线索不进入推荐指数，不自动改排名、培育建议或候选状态。
      - 新增 GAP-RECRUIT-RISK-CREDIT-01 与四项记录数指标 GAP，等待 Data / GDF / 合规闭合。
  - date: "2026-07-21"
    source: DEC-ENT-RECRUIT-LARGE-RESULT-20260721
    changes:
      - 大结果集保留完整名单语义，采用默认 20 家、可切换 20 / 50 / 100 的服务端稳定分页。
