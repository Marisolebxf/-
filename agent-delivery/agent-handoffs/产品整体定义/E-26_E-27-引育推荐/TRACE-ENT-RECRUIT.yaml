approved_decisions:
  - id: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    approved_by: user
    approved_at: "2026-07-21"
    scope_effect: within_existing_leaves_no_leaf_change
    approved_scope_change: product_workflow_enhancement
    decisions:
      - 企业查询的“加入招引 / 培育候选”创建人工线索，不创建模型推荐结论。
      - 候选工作台归属引育推荐，不仅作为个人资产只读记录。
      - 引育分析结果可加入对比篮，再分发至企业评估或风险洞察并返回原候选工作台。
      - 评估与风险结果只是证据，不自动改写推荐指数或候选状态。
      - 人工线索使用“指定对象复核分析”，复用当前引育模型，排名仅在指定对象集合内有效。
  - id: DEC-ENT-RECRUIT-LARGE-RESULT-20260721
    approved_by: user
    approved_at: "2026-07-21"
    scope_effect: within_existing_leaves_no_leaf_change
    approved_scope_change: product_interaction_interpretation
    decisions:
      - 分析结果保留完整名单，不以默认 Top N 或无限滚动替代完整结果。
      - 采用服务端稳定分页，默认每页 20 家，可切换 20 / 50 / 100；局部筛选不重跑模型或重编号原始排名。
      - 底部操作栏展示已选数、取消选择、全选当前筛选结果及加入对比篮；选择跨页保留。
      - 超出对比篮剩余容量时整批阻断并提示缩小范围，不静默截断。
      - 单次指定对象复核暂定不超过 50 家；导出不超过 1,000 家直接生成，超过后后台生成；阈值待性能验证。

