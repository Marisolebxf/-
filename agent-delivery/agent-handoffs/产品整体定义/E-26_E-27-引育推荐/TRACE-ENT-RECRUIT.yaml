information_architecture:
  page:
    name: 引育推荐
    route: /enterprise/recommendation
    views:
      - id: attraction
        name: 招引推荐
        leaf_id: E-26
        object_scope: 全国企业
        filters: [企业标签, 行业领域, 地域来源]
        result_primary: 优选企业清单与企业行业领域排名
        work_entries: [filtered_recommendation, candidate_workbench]
      - id: cultivation
        name: 培育推荐
        leaf_id: E-27
        object_scope: 深圳市内企业
        filters: [产业类别, 政策导向, 企业规模]
        result_primary: 优选企业排名
        result_secondary: 可视化行业分布
        work_entries: [filtered_recommendation, candidate_workbench]
    shared_levels:
      - L1 页面壳层与视图切换
      - L2 筛选条件与显式执行分析
      - L3 推荐名单或排名
      - L4 企业推荐详情与风险信用复核
      - L5 分析报告与数据导出
      - L6 对比篮研判与人工确认闭环
      - L7 五阶段异步分析过程与系统任务恢复
    prohibited_shared_semantics:
      - 对象范围
      - 业务筛选
      - 模型维度
      - 推荐名单
      - 企业详情

stories:
  - id: US-ENT-RECRUIT-A1
    title: 设置招引条件并执行推荐分析
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST]
    leaf_id: E-26
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.6.1
      - BID-ENT-ALGORITHM#5.7
    route: /enterprise/recommendation
    view: attraction
    frames: [F-RECRUIT-A-CONFIG]
    review_mount_refs: [ENT-RECRUIT-F01-CONFIG-TITLE]
    acceptance:
      - 可按企业标签、行业领域或地域来源设置招引分析条件。
      - 目标特征明确覆盖高成长性、关键技术型、隐形冠军和专精特新；字典与识别规则由数据 / 模型契约提供。
      - 用户显式执行分析后才产生结果，未执行时不显示默认名单或虚构分数。
      - 对象范围为全国企业，不能继承培育视图的深圳本地限制。

  - id: US-ENT-RECRUIT-A2
    title: 查看招引名单与企业价值
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST]
    leaf_id: E-26
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.6.2
      - BID-ENT-ALGORITHM#5.7
    route: /enterprise/recommendation
    view: attraction
    frames: [F-RECRUIT-A-RESULT]
    review_mount_refs: [ENT-RECRUIT-F02-RESULT-TITLE, ENT-RECRUIT-F02-METRIC-DETAIL, ENT-RECRUIT-F02-MODEL-STATUS]
    metric_refs:
      - M_ENT_ATTRACTION_INDEX
      - M_ENT_INDUSTRY_MATCH_SCORE
      - M_ENT_POLICY_MATCH_SCORE
      - GAP-RECRUIT-METRIC-01
      - GAP-RECRUIT-METRIC-03
    acceptance:
      - 名单展示排名、企业名称、行业领域、地域来源和招引推荐指数。
      - 选择企业后联动展示产业相关度、政策匹配度、深圳连接度和高潜挖掘依据。
      - 详情展示核心优势、关键指标和合作价值；关键指标中的每个统计项携带自身 metric_id。
      - 名单或详情显示命中的目标特征及识别依据，不把泛化企业标签当作隐形冠军 / 专精特新认定。
      - 结果携带 model_version、data_version、generated_at 和动态更新状态；新版本完成前不静默替换旧结果。

  - id: US-ENT-RECRUIT-A3
    title: 生成招引分析报告并导出数据
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST]
    leaf_id: E-26
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-ALGORITHM#5.7
    route: /enterprise/recommendation
    view: attraction
    frames: [F-RECRUIT-A-RESULT]
    review_mount_refs: [ENT-RECRUIT-F02-RESULT-TITLE]
    acceptance:
      - 当前招引结果页提供分析报告生成和数据导出入口。
      - 生成报告冻结当前来源任务与不可变结果快照，使用report_type=attraction_recommendation_analysis_report提交引育适配内容。
      - 报告覆盖七个固定核心章节；招引排名、推荐维度、目标特征、核心优势和合作价值仅作为来源内容或扩展章节，不成为共用必填字段。
      - 报告可用后进入ENT-EXPORT只读HTML Reader；PDF与HTML绑定同一report_revision_id，业务模式与PDF不显示内部ID、权限编码、指纹或评审payload。
      - 报告状态在当前结果页反馈并可进入共享任务层；失败不清空名单，Reader返回后恢复当前招引结果上下文。
      - 数据导出独立携带当前视图、筛选、排序、列、对象范围、数据版本和权限上下文；不经过报告Reader。

  - id: US-ENT-RECRUIT-C1
    title: 设置培育条件并执行推荐分析
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_id: E-27
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.7.1
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    view: cultivation
    frames: [F-RECRUIT-C-CONFIG]
    review_mount_refs: [ENT-RECRUIT-F03-CONFIG-TITLE]
    acceptance:
      - 可按产业类别、政策导向或企业规模设置培育分析条件。
      - 对象范围固定为深圳市内企业，不能混入全国招引企业。
      - 用户显式执行分析后才产生结果。

  - id: US-ENT-RECRUIT-C2
    title: 查看培育排名、行业分布与所需支持
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_id: E-27
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-PRODUCT#3.7.2
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    view: cultivation
    frames: [F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F04-RESULT-TITLE, ENT-RECRUIT-F04-METRIC-DETAIL, ENT-RECRUIT-F04-MODEL-STATUS]
    metric_refs:
      - M_ENT_CULTIVATION_INDEX
      - M_ENT_INDUSTRY_MATCH_SCORE
      - M_ENT_POLICY_MATCH_SCORE
      - M_ENT_GROWTH_POTENTIAL
      - GAP-RECRUIT-METRIC-02
      - GAP-RECRUIT-METRIC-04
    acceptance:
      - 企业排名展示排名、企业名称、产业类别、企业规模和培育推荐指数。
      - 行业分布作为企业排名的补充结果视图，不取代名单主工作区。
      - 选择企业后联动展示产业相关度、政策匹配度、企业潜力、识别依据和所需支持。
      - 详情按“发展瓶颈 → 培育建议 → 所需支持”展示可追溯对应关系，不用风险洞察结果替代培育模型的瓶颈识别。
      - 结果携带 model_version、data_version、generated_at 和动态更新状态；新版本完成前不静默替换旧结果。

  - id: US-ENT-RECRUIT-C3
    title: 生成培育分析报告并导出数据
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_id: E-27
    source_relation: direct_requirement
    compliance_refs:
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    view: cultivation
    frames: [F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F04-RESULT-TITLE]
    acceptance:
      - 当前培育结果页提供详细分析报告生成和数据导出入口。
      - 生成报告冻结当前来源任务与不可变结果快照，使用report_type=cultivation_recommendation_analysis_report提交引育适配内容。
      - 报告覆盖七个固定核心章节；培育排名、行业分布、推荐维度、发展瓶颈、培育建议和所需支持仅作为来源内容或扩展章节。
      - 报告可用后进入ENT-EXPORT只读HTML Reader；PDF与HTML绑定同一report_revision_id，业务模式与PDF不显示内部ID、权限编码、指纹或评审payload。
      - 报告或数据导出失败时保留当前结果，不表现为空结果；Reader返回后恢复当前培育结果上下文。
      - 数据导出独立携带当前视图、筛选、排序、列、对象范围、数据版本和权限上下文；不经过报告Reader。

  - id: US-ENT-RECRUIT-L1
    title: 管理人工线索与候选状态
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_enhancement
    approved_scope_change: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    compliance_refs: []
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-CANDIDATES]
    review_mount_refs: [ENT-RECRUIT-F05-CANDIDATE-TITLE]
    acceptance:
      - 企业查询或对比篮加入的对象标记为人工线索，不冒充模型推荐。
      - 候选工作台展示线索来源、加入人、加入时间和当前状态。
      - 培育线索未通过深圳市内范围预检时禁止培育复核，可显式转为招引线索。

  - id: US-ENT-RECRUIT-L2
    title: 对指定企业执行引育复核分析
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_interpretation
    approved_decisions: [DEC-ENT-RECRUIT-CLOSED-LOOP-20260721, DEC-ENT-RECRUIT-IN-TAB-REVIEW-20260731]
    compliance_refs:
      - BID-ENT-ALGORITHM#5.7
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-CANDIDATES, F-RECRUIT-REVIEW-CONFIG, F-RECRUIT-PROCESS, F-RECRUIT-A-RESULT, F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F05-CANDIDATE-TITLE, ENT-RECRUIT-F07-REVIEW-CONFIG-TITLE, SYS-JOBS-F03-PROCESS-TITLE, ENT-RECRUIT-F02-MANUAL-RESULT-TITLE, ENT-RECRUIT-F04-MANUAL-RESULT-TITLE]
    acceptance:
      - 指定对象复核使用当前引育视图的模型、维度、权重和数据版本。
      - 点击“执行指定对象复核”后保持当前候选工作台 Tab，并在当前 Tab 内完成模型参数配置、任务提交、五阶段过程和结果输出；不得切换到条件筛选推荐 Tab。
      - 参数配置仅显示模型契约实际提供的参数项；未闭合的阈值或权重保持 pending / disabled，不生成产品默认值。
      - 结果标记为“人工线索复核结果”，与条件筛选推荐结果区分。
      - 条件筛选推荐与候选工作台不共享任务、五阶段过程或结果列表；任一入口处于处理中、成功或失败时，另一入口仍只显示自己的状态。
      - 排名仅在本次指定对象集合内有效，不冒充全国或深圳全量排名。
      - 从复核结果返回候选列表时恢复复核前的视图、候选筛选、分页和未失效的选择上下文。

  - id: US-ENT-RECRUIT-L3
    title: 送入对比篮研判并返回人工确认
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_enhancement
    approved_scope_change: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    compliance_refs: []
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-CANDIDATES, F-RECRUIT-A-RESULT, F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F05-CANDIDATE-TITLE]
    acceptance:
      - 引育结果与候选工作台支持将选中企业加入对比篮。
      - 企业评估或风险洞察通过 return_context_id 返回原候选上下文并挂载证据引用。
      - 证据不自动改写推荐指数或候选状态；确认、待定或排除必须由用户显式执行。

  - id: US-ENT-RECRUIT-R1
    title: 浏览和批量处理大结果集
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_interpretation
    approved_decision: DEC-ENT-RECRUIT-LARGE-RESULT-20260721
    compliance_refs:
      - BID-ENT-PRODUCT#3.6.2
      - BID-ENT-PRODUCT#3.7.2
      - BID-ENT-ALGORITHM#5.7
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-A-RESULT, F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F02-LARGE-RESULT, ENT-RECRUIT-F04-LARGE-RESULT]
    acceptance:
      - 结果区显示完整结果总数、当前筛选数和已选数；默认每页 20 家，可切换 20 / 50 / 100。
      - 结果内局部筛选不重新运行模型、不改变结果版本，列表保留完整结果中的原始排名。
      - 表头全选仅选当前页；“全选当前筛选结果 Y 家”位于底部操作栏并明确作用范围，选择跨页保留。
      - 超出对比篮剩余容量时整批阻断并提示缩小范围，不自动加入前若干家。
      - 单次指定对象复核暂定不超过 50 家；导出不超过 1,000 家直接生成，超过后后台生成，阈值以 GAP-RECRUIT-BATCH-01 跟踪验证。
      - 默认不以 Top N 或无限滚动替代完整名单；若提供 Top 20 快捷视图，必须保留查看完整结果及排序依据。

  - id: US-ENT-RECRUIT-R2
    title: 复核企业风险与信用线索
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_enhancement
    approved_scope_change: DEC-ENT-RECRUIT-RISK-CREDIT-20260722
    compliance_refs: []
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-A-RESULT, F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F02-RISK-CREDIT, ENT-RECRUIT-F04-RISK-CREDIT]
    metric_refs:
      - GAP-RECRUIT-RISK-COUNT-01
      - GAP-RECRUIT-RISK-COUNT-02
      - GAP-RECRUIT-RISK-COUNT-03
      - GAP-RECRUIT-RISK-COUNT-04
    acceptance:
      - 招引与培育企业详情均在标题旁显示风险摘要状态，并在关键指标之后展示企业风险与信用区。
      - 风险区覆盖司法涉诉、失信被执行、经营异常、行政处罚四类公开风险线索；每类展示记录数量、最近事件时间和摘要。
      - 查看风险明细打开当前企业抽屉，逐条展示风险类型、事件摘要、发生日期、当前状态、信息来源和数据更新时间。
      - 缺失、未覆盖或查询失败统一显示“风险数据待核验”；未检出须携带数据时间和覆盖说明，不表述为“无风险”。
      - 风险线索不进入推荐指数，不自动改排名、培育建议或候选状态，也不替代专业法律意见。

  - id: US-ENT-RECRUIT-R3
    title: 查看并恢复异步分析过程
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_enhancement
    approved_scope_change: DEC-ENT-RECRUIT-ASYNC-PROCESS-20260723
    compliance_refs: []
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-PROCESS]
    review_mount_refs: [SYS-JOBS-F03-PROCESS-TITLE]
    acceptance:
      - 招引与培育均展示任务提交、权限与配置校验、数据汇聚、算法计算、结果组装五阶段。
      - 过程明确区分已完成、进行中和等待中，并显示当前阶段。
      - 用户可选择稍后查看；离开页面后任务继续，并可从系统任务浮层或个人中心恢复。
      - 招引与培育使用独立 task_type，不混用条件、任务或结果。

