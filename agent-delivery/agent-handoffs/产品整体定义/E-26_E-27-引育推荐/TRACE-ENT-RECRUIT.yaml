    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_enhancement
    approved_scope_change: DEC-ENT-RECRUIT-CLOSED-LOOP-20260721
    compliance_refs: []
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-CANDIDATES, F-RECRUIT-A-RESULT, F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F05-CANDIDATE-TITLE]
    acceptance:
      - 引育结果与候选工作台支持将选中企业加入对比篮。
      - 企业评估或风险洞察通过 return_context_id 返回原候选上下文并挂载证据引用。
      - 证据不自动改写推荐指数或候选状态；确认、待定或排除必须由用户显式执行。

  - id: US-ENT-RECRUIT-R1
    title: 浏览和批量处理大结果集
    role_refs: [ROLE-GOV, ROLE-PARK, ROLE-INVEST, ROLE-ASSOCIATION]
    leaf_ids: [E-26, E-27]
    source_relation: product_interpretation
    approved_decision: DEC-ENT-RECRUIT-LARGE-RESULT-20260721
    compliance_refs:
      - BID-ENT-PRODUCT#3.6.2
      - BID-ENT-PRODUCT#3.7.2
      - BID-ENT-ALGORITHM#5.7
      - BID-ENT-ALGORITHM#5.8
    route: /enterprise/recommendation
    views: [attraction, cultivation]
    frames: [F-RECRUIT-A-RESULT, F-RECRUIT-C-RESULT]
    review_mount_refs: [ENT-RECRUIT-F02-LARGE-RESULT, ENT-RECRUIT-F04-LARGE-RESULT]
    acceptance:
      - 结果区显示完整结果总数、当前筛选数和已选数；默认每页 20 家，可切换 20 / 50 / 100。
      - 结果内局部筛选不重新运行模型、不改变结果版本，列表保留完整结果中的原始排名。
      - 表头全选仅选当前页；“全选当前筛选结果 Y 家”位于底部操作栏并明确作用范围，选择跨页保留。
      - 超出对比篮剩余容量时整批阻断并提示缩小范围，不自动加入前若干家。
      - 单次指定对象复核暂定不超过 50 家；导出不超过 1,000 家直接生成，超过后后台生成，阈值以 GAP-RECRUIT-BATCH-01 跟踪验证。
      - 默认不以 Top N 或无限滚动替代完整名单；若提供 Top 20 快捷视图，必须保留查看完整结果及排序依据。

