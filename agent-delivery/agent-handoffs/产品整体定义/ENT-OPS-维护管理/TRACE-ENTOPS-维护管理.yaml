boundary:
  purpose: |
    为企业分析提供运营写侧入口：内容运营、图谱运营、分析配置共 15 项；
    前台只消费已发布 CMS 与 ADS；分析配置仅维护全局配置对象。
  includes:
    - 内容运营 5 项（含门户内容 E-37 完整样例）
    - 图谱运营 4 项
    - 分析配置 6 分区（字段指标/模型规则/数据批次/报告模板/权限脱敏/审计监控）
    - 主数据只读摘要 + 纠错交接
    - CMS vs APP 真源分治说明
  excludes:
    - 系统管理中心账户与全局工单中枢（链出，不重建）
    - 前台 E-31~E-35 内嵌编辑发布
    - 以 CMS 覆盖 ODS 工商真源
    - 完整 ETL 调度 / 数据清洗工作台（C3 仅批次切换与质量提示）
    - 非企业专题的内容运营 / 图谱能力（人才/机构等）

