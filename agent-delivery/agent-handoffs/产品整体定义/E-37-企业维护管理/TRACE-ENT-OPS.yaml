product_interpretations:
  - id: PI-ENT-OPS-01
    title: 三角色分离与审核发布治理
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 内容编辑起草并提交，内容审核复核并退回，发布管理员负责发布、退回、下线与回滚；禁止自审、越级发布和删除历史
  - id: PI-ENT-OPS-02
    title: 主数据只读分治
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 企业主数据仅只读引用，CMS 只维护门户补充内容；错误通过纠错申请处理，不在本模块覆盖数据真源
  - id: PI-ENT-OPS-03
    title: 人工策展榜单
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: Top30 为人工顺序，维护评估维度、上榜企业、评估依据与专家评述，不计算技术力、商业力或竞争力分数
  - id: PI-ENT-OPS-04
    title: 流程优先 IA 与确定性角色入口
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 统一工作台以待办流程组织六类内容；首次默认入口按发布管理员、内容审核、内容编辑优先，仅恢复仍有权的上次显式选择
  - id: PI-ENT-OPS-05
    title: 不可变发布版本与高风险审计
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 已发布内容再编辑生成新草稿；发布、下线、回滚与批量关系变更需原因、二次确认和完整审计，回滚也生成新发布版本
  - id: PI-ENT-OPS-06
    title: 六类 payload 所有权隔离
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#6-内容模型与数据边界
    decision: 六类内容共享只读 enterprise_ref 与可复用 media_ref，但 payload、语义、排序、展示位与版本归各 content_type 所有，禁止跨类型覆盖、联动保存或自动同步

product_enhancements: []
approved_scope_changes: []

product_roles:
  - id: content_editor
    name: 内容编辑
    default_entry: /enterprise/content-management?view=mine
    permitted_actions: [新建, 编辑, 保存草稿, 预览, 提交审核, 发起主数据纠错]
    prohibited_actions: [审核自己的提交, 发布, 覆盖企业主数据]
    decision_ref: PI-ENT-OPS-01
  - id: content_reviewer
    name: 内容审核
    default_entry: /enterprise/content-management/review
    permitted_actions: [查看版本差异, 查看来源说明, 填写审核意见, 审核通过, 退回]
    prohibited_actions: [修改正文, 直接发布, 审核自己的提交]
    decision_ref: PI-ENT-OPS-01
  - id: publishing_admin
    name: 发布管理员
    default_entry: /enterprise/content-management/publish
    permitted_actions: [立即发布, 定时发布, 发布退回, 下线, 回滚, 查看审计]
    prohibited_actions: [修改正文, 绕过审核发布, 删除版本或审计历史]
    decision_ref: PI-ENT-OPS-01

content_types:
  - id: enterprise_profile
    name: 企业基础档案
    capability_ref: IA-ENT-OPS-CAP-01
    payload_owner: enterprise_profile_payload
    owned_payload: [门户展示名称, 短简介, 通用展示标签, 通用展示媒体及排序]
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 不覆盖明星企业代表性叙事或深圳区域叙事，不反写主数据
  - id: growth_event
    name: 成长轨迹事件
    capability_ref: IA-ENT-OPS-CAP-02
    payload_owner: growth_event_payload
    owned_payload: [事件日期, 标题, 摘要, 事件类型, 来源说明, 事件媒体]
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 事件与媒体随本 payload 独立版本化，不从其他类型自动生成、覆盖或同步
  - id: key_enterprise_panorama
    name: 重点企业全景
    capability_ref: IA-ENT-OPS-CAP-03
    payload_owner: key_enterprise_panorama_payload
    owned_payload: [重点标识, 专属档案, 合作关系描述, 供应链关联描述, 竞争关系描述, 全景展示媒体]
    shared_readonly_refs: [enterprise_ref, related_enterprise_ref, media_ref]
    isolation_contract: 关系说明及媒体归本 payload，不计算图谱关系或风险，不写入其他内容类型
  - id: capability_ranking
    name: 能力榜单
    capability_ref: IA-ENT-OPS-CAP-04
    payload_owner: capability_ranking_payload
    owned_payload: [技术力或商业力类型, 期次, 评估维度, Top30人工顺序, 评估依据, 专家评述, 榜单媒体]
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 不从其他类型自动取值、计分或排名，不回写企业档案
  - id: star_enterprise_intro
    name: 明星企业介绍
    capability_ref: IA-ENT-OPS-CAP-05
    payload_owner: star_enterprise_intro_payload
    owned_payload: [代表性叙事, 核心成果, 代表产品, 荣誉内容, 成果产品荣誉媒体]
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 媒体语义、说明、排序与展示位归本 payload，不自动决定明星身份或覆盖基础档案
  - id: shenzhen_enterprise_intro
    name: 深圳企业介绍
    capability_ref: IA-ENT-OPS-CAP-06
    payload_owner: shenzhen_enterprise_intro_payload
    owned_payload: [区域定位, 区域优势, 竞争力分析意见, 区域叙事, 区域叙事媒体]
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 区域语境、说明、排序与展示位归本 payload，不同步明星介绍或基础档案，不生成统计或竞争力分数

workflow:
  states:
    - id: draft
      label: 草稿
    - id: pending_review
      label: 待审核
    - id: pending_publish
      label: 待发布
    - id: published
      label: 已发布
    - id: offline
      label: 已下线
  high_risk_actions:
    - action: batch_relation_change
      applicable_content_type: key_enterprise_panorama
      applicable_payload: descriptive_relationships
      allowed_fields: [cooperation_relation_description, supply_chain_relation_description, competition_relation_description]
      guard:
        reason: required
        second_confirmation: required
        full_audit: required
      audit_payload: [operator, operated_at, reason, affected_content_ids, before_after_diff]
      prohibited_behaviors: [algorithmic_relation_computation, graph_relation_computation, risk_inference, cross_content_type_sync]
  transitions:
    - from: draft
      action: submit
      to: pending_review
      guard: 提交人不得审核自己的提交
    - from: pending_review
      action: approve
      to: pending_publish
    - from: pending_review
      action: reject_with_reason
      to: draft
    - from: pending_publish
      action: publish_with_confirmation
      to: published
    - from: pending_publish
      action: reject_with_reason
      to: draft
    - from: published
      action: edit_as_new_draft
      to: draft
      effect: 线上 published 版本保持不变，新草稿独立流转
    - from: published
      action: offline_with_reason_and_confirmation
      to: offline
      effect: 停止门户 published 指针消费并保留完整历史
    - from: offline
      action: create_new_draft_from_history
      to: draft
      effect: 重新上线必须重走提交、审核和发布，禁止直接切回 published
    - from: published
      action: rollback_as_new_published_version
      to: published
      guard:
        reason: required
        second_confirmation: required
        full_audit: required
      audit_payload: [operator, operated_at, reason, source_version, new_version, before_after_diff]
      effect: 以历史发布版本生成新发布版本，不倒写、覆盖或删除历史

frames:
  - id: F-OPS-01
    name: 内容工作台
    route: /enterprise/content-management?view={mine|all}&type={content_type}&status={workflow_status}&page={n}
    states: [default, loading, empty, error, no_permission]
    review_mounts: [ENT-OPS-F01-WORKBENCH-TITLE]
  - id: F-OPS-02
    name: 内容编辑器
    route: /enterprise/content-management/content/:content_id/edit?view&type&status&page
    states: [default, loading, error, no_permission, readonly_lock, saving, save_success, save_failure, draft_with_published_version, correction_submitting, correction_submitted, correction_failure]
    review_mounts: [ENT-OPS-F02-EDITOR-TITLE, ENT-OPS-F02-MASTER-DATA-BOUNDARY]
  - id: F-OPS-03
    name: 审核详情
    route: /enterprise/content-management/content/:content_id/review?view&type&status&page
    states: [default, loading, error, no_permission, review_rejected]
    review_mounts: [ENT-OPS-F03-REVIEW-TITLE]
  - id: F-OPS-04
    name: 发布确认
    route: /enterprise/content-management/content/:content_id/publish?view&type&status&page
    states: [default, loading, error, no_permission, publishing, publish_failure]
    review_mounts: [ENT-OPS-F04-PUBLISH-RISK]
  - id: F-OPS-05
    name: 版本与审计
    route: /enterprise/content-management/content/:content_id/versions?view&type&status&page
    states: [default, loading, empty, error, no_permission, offline, create_draft_from_history]
    review_mounts: [ENT-OPS-F05-VERSION-AUDIT-TITLE]
  - id: F-OPS-06
    name: 冲突处理
    route: /enterprise/content-management/content/:content_id/edit?view&type&status&page&state=conflict
    states: [conflict_detected, compare_server_and_local, resaving, save_failure]
    review_mounts: [ENT-OPS-F06-CONFLICT-TITLE]

