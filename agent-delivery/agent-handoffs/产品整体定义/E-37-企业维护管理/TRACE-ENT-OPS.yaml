acceptance_criteria:
  - id: ENT-OPS-USM-01
    statement: 三角色默认进入各自可继续处理的工作台；多角色首次按发布管理员、内容审核、内容编辑优先，仅恢复仍有权的上次显式选择
  - id: ENT-OPS-USM-02
    statement: 内容列表支持 view、type、status、page 筛选与分页，进入子路由并返回时完整恢复上下文
  - id: ENT-OPS-USM-03
    statement: 内容编辑可分型创建和编辑企业基础档案、成长轨迹事件、重点企业全景、能力榜单、明星企业介绍和深圳企业介绍；批量关系变更仅可作用于重点企业全景的合作、供应链或竞争关系描述 payload，执行前必须填写原因、二次确认并生成完整审计，结果仅更新描述性内容，不计算算法或图谱关系
  - id: ENT-OPS-USM-04
    statement: 企业主数据在编辑器中只读；发现错误可发起纠错，但不得在 CMS 覆盖数据真源
  - id: ENT-OPS-USM-05
    statement: 能力榜单明确披露 Top30 为人工策展顺序，并保留评估维度、评估依据与专家评述，不声称算法排名
  - id: ENT-OPS-USM-06
    statement: 编辑者可提交草稿进入待审核，但系统禁止提交人审核自己的内容
  - id: ENT-OPS-USM-07
    statement: 审核者可查看当前草稿与对照版本的差异及来源说明；退回必须填写原因并返回草稿
  - id: ENT-OPS-USM-08
    statement: 发布前展示发布范围、生效时间与影响摘要，必须填写原因并完成二次确认
  - id: ENT-OPS-USM-09
    statement: 发布失败不得显示或提前切换为已发布，必须保留原流程状态与用户输入
  - id: ENT-OPS-USM-10
    statement: 编辑已发布内容时生成新草稿，线上 published 版本不被覆盖并继续服务门户
  - id: ENT-OPS-USM-11
    statement: 已发布内容可在填写原因并二次确认后下线；再上线须从历史版本生成新草稿并重走审核发布
  - id: ENT-OPS-USM-12
    statement: 回滚前必须填写原因并完成二次确认；回滚必须以历史发布版本生成新的 published 版本，完整审计操作人、时间、原因、源版本、新版本和版本差异，不覆盖或删除历史
  - id: ENT-OPS-USM-13
    statement: 并发版本冲突时保留当前输入，展示服务端新版本与本地差异，用户刷新比较后重新保存
  - id: ENT-OPS-USM-14
    statement: 7 个评审挂载在评审模式均存在，业务模式均不渲染，且不改变业务字段、权限或流程

