product_interpretations:
  - id: PI-ENT-OPS-01
    title: 三角色分离与审核发布治理
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 内容编辑起草并提交，内容审核复核并退回，发布管理员负责发布、退回、下线与回滚；禁止自审、越级发布和删除历史
  - id: PI-ENT-OPS-02
    title: 主数据只读分治
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 企业主数据仅只读引用，CMS 只维护门户补充内容；错误通过纠错申请处理，不在本模块覆盖数据真源
  - id: PI-ENT-OPS-03
    title: 人工策展榜单
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: Top30 为人工顺序，维护评估维度、上榜企业、评估依据与专家评述，不计算技术力、商业力或竞争力分数
  - id: PI-ENT-OPS-04
    title: 流程优先 IA 与确定性角色入口
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 统一工作台以待办流程组织六类内容；首次默认入口按发布管理员、内容审核、内容编辑优先，仅恢复仍有权的上次显式选择
  - id: PI-ENT-OPS-05
    title: 不可变发布版本与高风险审计
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 已发布内容再编辑生成新草稿；发布、下线、回滚与批量关系变更需原因、二次确认和完整审计，回滚也生成新发布版本
  - id: PI-ENT-OPS-06
    title: 六类 payload 所有权隔离
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#6-内容模型与数据边界
    decision: 六类内容共享只读 enterprise_ref 与可复用 media_ref，但 payload、语义、排序、展示位与版本归各 content_type 所有，禁止跨类型覆盖、联动保存或自动同步

product_enhancements: []
approved_scope_changes: []

product_roles:
  - id: content_editor
    name: 内容编辑
    default_entry: /enterprise/content-management?view=mine
    default_frame_id: F-OPS-01
    default_route_variant_id: content_editor_mine
    permitted_actions: [新建, 编辑, 保存草稿, 预览, 提交审核, 发起主数据纠错]
    permitted_action_ids: [save_draft, create_draft_from_version, submit_for_review, batch_relation_change, submit_master_data_correction]
    prohibited_actions: [审核自己的提交, 发布, 覆盖企业主数据]
    decision_ref: PI-ENT-OPS-01
  - id: content_reviewer
    name: 内容审核
    default_entry: /enterprise/content-management/review
    default_frame_id: F-OPS-01
    default_route_variant_id: content_reviewer_center
    permitted_actions: [查看版本差异, 查看来源说明, 填写审核意见, 审核通过, 退回]
    permitted_action_ids: [approve_review, return_from_review]
    prohibited_actions: [修改正文, 直接发布, 审核自己的提交]
    decision_ref: PI-ENT-OPS-01
  - id: publishing_admin
    name: 发布管理员
    default_entry: /enterprise/content-management/publish
    default_frame_id: F-OPS-01
    default_route_variant_id: publishing_admin_center
    permitted_actions: [立即发布, 定时发布, 发布退回, 下线, 回滚, 查看审计]
    permitted_action_ids: [immediate_publish, schedule_publish, return_from_publish, take_offline, rollback_as_new_published_version]
    prohibited_actions: [修改正文, 绕过审核发布, 删除版本或审计历史]
    decision_ref: PI-ENT-OPS-01

content_types:
  - id: enterprise_profile
    name: 企业基础档案
    capability_ref: IA-ENT-OPS-CAP-01
    payload_owner: enterprise_profile_payload
    owned_payload:
      - {field_id: display_name, label: 门户展示名称}
      - {field_id: short_introduction, label: 短简介}
      - {field_id: display_tags, label: 通用展示标签}
      - {field_id: display_media, label: 通用展示媒体及排序}
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 不覆盖明星企业代表性叙事或深圳区域叙事，不反写主数据
  - id: growth_event
    name: 成长轨迹事件
    capability_ref: IA-ENT-OPS-CAP-02
    payload_owner: growth_event_payload
    owned_payload:
      - {field_id: event_date, label: 事件日期}
      - {field_id: event_title, label: 标题}
      - {field_id: event_summary, label: 摘要}
      - {field_id: event_type, label: 事件类型}
      - {field_id: source_note, label: 来源说明}
      - {field_id: event_media, label: 事件媒体}
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 事件与媒体随本 payload 独立版本化，不从其他类型自动生成、覆盖或同步
  - id: key_enterprise_panorama
    name: 重点企业全景
    capability_ref: IA-ENT-OPS-CAP-03
    payload_owner: key_enterprise_panorama_payload
    owned_payload:
      - {field_id: key_enterprise_flag, label: 重点标识}
      - {field_id: exclusive_profile, label: 专属档案}
      - {field_id: descriptive_relationships, label: 合作、供应链或竞争关系的人工描述}
      - {field_id: panorama_media, label: 全景展示媒体}
    field_semantics:
      descriptive_relationships: 仅表示编辑人工维护的描述性文本，不是算法关系、图谱边、关系推断或风险计算
    shared_readonly_refs: [enterprise_ref, related_enterprise_ref, media_ref]
    isolation_contract: 关系说明及媒体归本 payload，不计算图谱关系或风险，不写入其他内容类型
  - id: capability_ranking
    name: 能力榜单
    capability_ref: IA-ENT-OPS-CAP-04
    payload_owner: capability_ranking_payload
    owned_payload:
      - {field_id: ranking_type, label: 技术力或商业力类型}
      - {field_id: ranking_period, label: 期次}
      - {field_id: evaluation_dimensions, label: 评估维度}
      - {field_id: curated_top30_order, label: Top30 人工顺序}
      - {field_id: evaluation_basis, label: 评估依据}
      - {field_id: expert_commentary, label: 专家评述}
      - {field_id: ranking_media, label: 榜单媒体}
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 不从其他类型自动取值、计分或排名，不回写企业档案
  - id: star_enterprise_intro
    name: 明星企业介绍
    capability_ref: IA-ENT-OPS-CAP-05
    payload_owner: star_enterprise_intro_payload
    owned_payload:
      - {field_id: representative_narrative, label: 代表性叙事}
      - {field_id: core_achievements, label: 核心成果}
      - {field_id: representative_products, label: 代表产品}
      - {field_id: honor_content, label: 荣誉内容}
      - {field_id: achievement_product_honor_media, label: 成果、产品与荣誉媒体}
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 媒体语义、说明、排序与展示位归本 payload，不自动决定明星身份或覆盖基础档案
  - id: shenzhen_enterprise_intro
    name: 深圳企业介绍
    capability_ref: IA-ENT-OPS-CAP-06
    payload_owner: shenzhen_enterprise_intro_payload
    owned_payload:
      - {field_id: regional_positioning, label: 区域定位}
      - {field_id: regional_advantages, label: 区域优势}
      - {field_id: competitiveness_opinion, label: 竞争力分析意见}
      - {field_id: regional_narrative, label: 区域叙事}
      - {field_id: regional_media, label: 区域叙事媒体}
    shared_readonly_refs: [enterprise_ref, media_ref]
    isolation_contract: 区域语境、说明、排序与展示位归本 payload，不同步明星介绍或基础档案，不生成统计或竞争力分数

workflow:
  states:
    - id: draft
      label: 草稿
    - id: pending_review
      label: 待审核
    - id: pending_publish
      label: 待发布
    - id: published
      label: 已发布
    - id: offline
      label: 已下线
  role_constraints:
    publishing_admin:
      content_body_mutation: forbidden
      statement: 发布管理员只能执行发布治理动作，不得修改正文或 payload
  actions:
    save_draft:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: draft
      guards: {edit_permission: required, optimistic_version_match: required}
      audit_payload: [operator_id, operated_at, content_id, version, change_summary]
    create_draft_from_version:
      actor_role_ids: [content_editor]
      from_states: [published, offline]
      to_state: draft
      inputs:
        - {field_id: source_version_id, required: true}
      guards:
        source_version_overwrite: forbidden
        published_history_preserved: true
        offline_source_requires_submit_review_publish: true
      audit_payload: [operator_id, operated_at, content_id, source_version_id, source_state, new_draft_version_id]
    submit_for_review:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: pending_review
      guards: {content_complete: required, unresolved_conflict: forbidden}
      audit_payload: [operator_id, operated_at, content_id, submitted_version]
    approve_review:
      actor_role_ids: [content_reviewer]
      from_states: [pending_review]
      to_state: pending_publish
      guards: {reviewer_id_not_equal_submitter_id: true, content_body_mutation: forbidden}
      audit_payload: [reviewer_id, reviewed_at, content_id, reviewed_version, review_opinion]
    return_from_review:
      actor_role_ids: [content_reviewer]
      from_states: [pending_review]
      to_state: draft
      guards: {reason_required: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [reviewer_id, operated_at, content_id, returned_version, reason]
    immediate_publish:
      actor_role_ids: [publishing_admin]
      from_states: [pending_publish]
      to_state: published
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [publisher_id, published_at, content_id, source_version, new_published_version, reason, impact_summary]
    schedule_publish:
      actor_role_ids: [publishing_admin]
      from_states: [pending_publish]
      to_state: pending_publish
      guards: {reason_required: true, second_confirmation: true, full_audit: true, scheduled_effective_at_required: true, content_body_mutation: forbidden}
      effects: {scheduled_effective_at: write_from_request}
      audit_payload: [publisher_id, operated_at, content_id, source_version, scheduled_effective_at, reason, impact_summary]
    scheduled_publish_activate:
      actor_role_ids: []
      actor_type: system_event
      from_states: [pending_publish]
      to_state: published
      guards: {scheduled_effective_at_reached: true, scheduled_publish_not_cancelled: true, full_audit: true}
      audit_payload: [system_event_id, activated_at, content_id, source_version, new_published_version, scheduled_effective_at]
    return_from_publish:
      actor_role_ids: [publishing_admin]
      from_states: [pending_publish]
      to_state: draft
      guards: {reason_required: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [publisher_id, operated_at, content_id, returned_version, reason]
    take_offline:
      actor_role_ids: [publishing_admin]
      from_states: [published]
      to_state: offline
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [publisher_id, operated_at, content_id, published_version, reason, impact_summary]
    rollback_as_new_published_version:
      actor_role_ids: [publishing_admin]
      from_states: [published]
      to_state: published
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [publisher_id, operated_at, content_id, source_version, new_published_version, reason, before_after_diff]
    batch_relation_change:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: draft
      payload_owner_ref: key_enterprise_panorama_payload
      allowed_field_ids: [descriptive_relationships]
      field_semantics: 仅更新人工维护的描述性文本，不产生算法关系、图谱边、关系推断或风险计算
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_type: key_enterprise_panorama}
      audit_payload: [operator_id, operated_at, content_id, affected_content_ids, reason, before_after_diff]
    submit_master_data_correction:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: draft
      guards: {master_data_readonly: true, correction_reason_required: true}
      audit_payload: [operator_id, operated_at, enterprise_ref, correction_fields, correction_reason, correction_request_id]
  transitions:
    - {id: TR-OPS-01, action_id: save_draft, from_state: draft, to_state: draft}
    - {id: TR-OPS-13, action_id: create_draft_from_version, from_state: published, to_state: draft}
    - {id: TR-OPS-14, action_id: create_draft_from_version, from_state: offline, to_state: draft}
    - {id: TR-OPS-02, action_id: submit_for_review, from_state: draft, to_state: pending_review}
    - {id: TR-OPS-03, action_id: approve_review, from_state: pending_review, to_state: pending_publish}
    - {id: TR-OPS-04, action_id: return_from_review, from_state: pending_review, to_state: draft}
    - {id: TR-OPS-05, action_id: immediate_publish, from_state: pending_publish, to_state: published}
    - {id: TR-OPS-06, action_id: schedule_publish, from_state: pending_publish, to_state: pending_publish}
    - {id: TR-OPS-07, action_id: scheduled_publish_activate, from_state: pending_publish, to_state: published}
    - {id: TR-OPS-08, action_id: return_from_publish, from_state: pending_publish, to_state: draft}
    - {id: TR-OPS-09, action_id: take_offline, from_state: published, to_state: offline}
    - {id: TR-OPS-10, action_id: rollback_as_new_published_version, from_state: published, to_state: published}
    - {id: TR-OPS-11, action_id: batch_relation_change, from_state: draft, to_state: draft}
    - {id: TR-OPS-12, action_id: submit_master_data_correction, from_state: draft, to_state: draft}
  lifecycle_rules:
    edit_published_as_new_draft: 执行 create_draft_from_version 从 published 版本生成独立新草稿，线上 published 版本与历史保持不变
    republish_offline_content: 执行 create_draft_from_version 从选定 offline 历史版本生成新草稿，再依次执行 submit_for_review、approve_review、immediate_publish 或 schedule_publish；禁止 offline 直接切回 published

frames:
  - id: F-OPS-01
    name: 内容工作台
    route: /enterprise/content-management
    route_variants:
      root_workbench:
        route: /enterprise/content-management
        list_center_state: workbench
        role_ids: [content_editor, content_reviewer, publishing_admin]
      content_editor_mine:
        route: /enterprise/content-management?view=mine&type={content_type}&status={workflow_status}&page={n}
        list_center_state: editor_workbench
        role_ids: [content_editor]
      content_reviewer_center:
        route: /enterprise/content-management/review
        list_center_state: review_center
        role_ids: [content_reviewer]
      publishing_admin_center:
        route: /enterprise/content-management/publish
        list_center_state: publish_center
        role_ids: [publishing_admin]
    states: [default, workbench, editor_workbench, review_center, publish_center, loading, empty, error, no_permission]
