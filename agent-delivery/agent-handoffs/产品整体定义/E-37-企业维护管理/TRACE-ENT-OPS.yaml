acceptance_criteria:
  - id: ENT-OPS-USM-01
    statement: F-OPS-01 仅定义 editor_workbench、all_content、review_center、publish_center、versions_center 五个固定 route variant；内容编辑、内容审核、发布管理员的默认 variant 分别为 editor_workbench、review_center、publish_center，多角色首次按发布管理员、内容审核、内容编辑优先，仅恢复仍有权的上次显式选择
    action_ids: []
  - id: ENT-OPS-USM-02
    statement: 编辑、审核、发布、版本详情均以必填 route_variant_id 与可选 type/status/page 恢复列表上下文；pathname 及工作台 view 只由固定 variant_path_map 派生，原 variant 缺失、未知或失权时回退到当前最高有效权限的默认入口
    action_ids: []
    story_ids: [US-ENT-OPS-01, US-ENT-OPS-02, US-ENT-OPS-03, US-ENT-OPS-04, US-ENT-OPS-05]
    frame_ids: [F-OPS-01, F-OPS-02, F-OPS-03, F-OPS-04, F-OPS-05]
  - id: ENT-OPS-USM-03
    statement: 内容编辑可通过 save_draft 分型保存六类内容；batch_relation_change 仅可更新 key_enterprise_panorama_payload.descriptive_relationships 人工描述，执行前必须填写原因、二次确认并生成完整审计，不计算算法关系、图谱边、关系推断或风险
    action_ids: [save_draft, batch_relation_change]
  - id: ENT-OPS-USM-04
    statement: 企业主数据在编辑器中只读；发现错误可执行 submit_master_data_correction，但不得在 CMS 覆盖数据真源；成功后必须返回真实 correction_request_id、逻辑交接目标 enterprise_master_data_correction_queue、submitted 状态与 submitted_at，且可以按请求号追踪
    action_ids: [submit_master_data_correction]
    expected_result:
      correction_request_id: required_nonempty
      target: enterprise_master_data_correction_queue
      status: submitted
      submitted_at: required_timestamp
      traceable_by: correction_request_id
  - id: ENT-OPS-USM-05
    statement: 能力榜单明确披露 Top30 为人工策展顺序，并保留评估维度、评估依据与专家评述；专家只是 business_material_source，所有相关字段由 content_editor 通过真实 source_material_ref 写入，无专家角色、入口或直写，不声称算法排名
    action_ids: [save_draft]
  - id: ENT-OPS-USM-06
    statement: 内容编辑执行 submit_for_review 使草稿进入 pending_review；内容审核执行 approve_review 时必须满足 reviewer_id != submitter_id，且审核者不得修改正文
    action_ids: [submit_for_review, approve_review]
    story_ids: [US-ENT-OPS-02, US-ENT-OPS-03]
  - id: ENT-OPS-USM-07
    statement: 审核者可查看当前草稿与对照版本的差异及来源说明；return_from_review 必须填写原因、记录完整审计并返回 draft
    action_ids: [return_from_review]
  - id: ENT-OPS-USM-08
    statement: immediate_publish 与 schedule_publish 执行前均须展示发布范围、生效时间与影响摘要，必须填写原因、二次确认并完整审计；schedule_publish 仅写入 scheduled_effective_at 且状态保持 pending_publish，到时由 system event scheduled_publish_activate 转为 published 并记录审计；发布管理员也可通过 return_from_publish 填写原因后退回 draft。若 scheduled_effective_at 存在，退回 draft 与取消定时激活必须是同一原子操作；成功后该计划不得再触发 scheduled_publish_activate，并须把取消事实与取消时间写入审计。本合同仅定义逻辑事务效果，不指定物理 job 或 API
    action_ids: [immediate_publish, schedule_publish, scheduled_publish_activate, return_from_publish]
  - id: ENT-OPS-USM-09
    statement: 全部 13 个 action 均遵循 idle/submitting/succeeded/failed 局部操作态；submitting 禁止重复提交，succeeded 必须依据服务端权威成功，failed 必须保留已有 dirty input、原 business state 和返回上下文，不得假成功或提前推进流程；scheduled_publish_activate 仅由 system_event 触发
    action_ids: [save_draft, create_draft_from_version, submit_for_review, approve_review, return_from_review, immediate_publish, schedule_publish, scheduled_publish_activate, return_from_publish, take_offline, rollback_as_new_published_version, batch_relation_change, submit_master_data_correction]
    story_ids: [US-ENT-OPS-02, US-ENT-OPS-03, US-ENT-OPS-04, US-ENT-OPS-05, US-ENT-OPS-06, US-ENT-OPS-07]
    frame_ids: [F-OPS-02, F-OPS-03, F-OPS-04, F-OPS-05, F-OPS-06]
  - id: ENT-OPS-USM-10
    statement: 编辑已发布内容时必须通过 create_draft_from_version 传入 source_version_id 生成新草稿，再以 save_draft 保存草稿内修改；线上 published 版本及历史不被覆盖并继续服务门户
    action_ids: [create_draft_from_version, save_draft]
  - id: ENT-OPS-USM-11
    statement: take_offline 必须填写原因、二次确认并完整审计；再上线须通过 create_draft_from_version 传入 source_version_id 生成新草稿，再执行 submit_for_review、approve_review 及 immediate_publish 或 schedule_publish，禁止 offline 直接切回 published
    action_ids: [take_offline, create_draft_from_version, submit_for_review, approve_review, immediate_publish, schedule_publish, scheduled_publish_activate]
  - id: ENT-OPS-USM-12
    statement: rollback_as_new_published_version 执行前必须填写原因、二次确认并完整审计；以历史发布版本生成新的 published 版本，不覆盖或删除历史
    action_ids: [rollback_as_new_published_version]
  - id: ENT-OPS-USM-13
    statement: 并发版本冲突时保留当前输入，展示服务端新版本与本地差异，用户刷新比较后重新保存
    action_ids: [save_draft]
  - id: ENT-OPS-USM-14
    statement: 7 个评审挂载在评审模式均存在，业务模式均不渲染，且不改变业务字段、权限或流程
    action_ids: []

