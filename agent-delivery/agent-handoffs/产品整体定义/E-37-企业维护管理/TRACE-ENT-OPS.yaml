acceptance_criteria:
  - id: ENT-OPS-USM-01
    statement: 内容编辑默认进入 /enterprise/content-management?view=mine，内容审核默认进入 /enterprise/content-management/review，发布管理员默认进入 /enterprise/content-management/publish；三者均落在 F-OPS-01 的不同 route_variant，多角色首次按发布管理员、内容审核、内容编辑优先，仅恢复仍有权的上次显式选择
    action_ids: []
  - id: ENT-OPS-USM-02
    statement: 内容列表支持 view、type、status、page 筛选与分页，进入子路由并返回时完整恢复上下文
    action_ids: []
  - id: ENT-OPS-USM-03
    statement: 内容编辑可通过 save_draft 分型保存六类内容；batch_relation_change 仅可更新 key_enterprise_panorama_payload.descriptive_relationships 人工描述，执行前必须填写原因、二次确认并生成完整审计，不计算算法关系、图谱边、关系推断或风险
    action_ids: [save_draft, batch_relation_change]
  - id: ENT-OPS-USM-04
    statement: 企业主数据在编辑器中只读；发现错误可发起纠错，但不得在 CMS 覆盖数据真源
    action_ids: [submit_master_data_correction]
  - id: ENT-OPS-USM-05
    statement: 能力榜单明确披露 Top30 为人工策展顺序，并保留评估维度、评估依据与专家评述，不声称算法排名
    action_ids: [save_draft]
  - id: ENT-OPS-USM-06
    statement: 内容编辑执行 submit_for_review 使草稿进入 pending_review；内容审核执行 approve_review 时必须满足 reviewer_id != submitter_id，且审核者不得修改正文
    action_ids: [submit_for_review, approve_review]
  - id: ENT-OPS-USM-07
    statement: 审核者可查看当前草稿与对照版本的差异及来源说明；return_from_review 必须填写原因、记录完整审计并返回 draft
    action_ids: [approve_review, return_from_review]
  - id: ENT-OPS-USM-08
    statement: immediate_publish 与 schedule_publish 执行前均须展示发布范围、生效时间与影响摘要，必须填写原因、二次确认并完整审计；schedule_publish 仅写入 scheduled_effective_at 且状态保持 pending_publish，到时由 system event scheduled_publish_activate 转为 published 并记录审计
    action_ids: [immediate_publish, schedule_publish, scheduled_publish_activate]
  - id: ENT-OPS-USM-09
    statement: 发布失败不得显示或提前切换为已发布，必须保留原流程状态与用户输入
    action_ids: [immediate_publish, schedule_publish, scheduled_publish_activate]
  - id: ENT-OPS-USM-10
    statement: 编辑已发布内容时必须通过 create_draft_from_version 传入 source_version_id 生成新草稿，再以 save_draft 保存草稿内修改；线上 published 版本及历史不被覆盖并继续服务门户
    action_ids: [create_draft_from_version, save_draft]
  - id: ENT-OPS-USM-11
    statement: take_offline 必须填写原因、二次确认并完整审计；再上线须通过 create_draft_from_version 传入 source_version_id 生成新草稿，再执行 submit_for_review、approve_review 及 immediate_publish 或 schedule_publish，禁止 offline 直接切回 published
    action_ids: [take_offline, create_draft_from_version, submit_for_review, approve_review, immediate_publish, schedule_publish, scheduled_publish_activate]
  - id: ENT-OPS-USM-12
    statement: rollback_as_new_published_version 执行前必须填写原因、二次确认并完整审计；以历史发布版本生成新的 published 版本，不覆盖或删除历史
    action_ids: [rollback_as_new_published_version]
  - id: ENT-OPS-USM-13
    statement: 并发版本冲突时保留当前输入，展示服务端新版本与本地差异，用户刷新比较后重新保存
    action_ids: [save_draft]
  - id: ENT-OPS-USM-14
    statement: 7 个评审挂载在评审模式均存在，业务模式均不渲染，且不改变业务字段、权限或流程
    action_ids: []

