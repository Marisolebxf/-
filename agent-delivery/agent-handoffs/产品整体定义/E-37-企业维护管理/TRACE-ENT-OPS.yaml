product_interpretations:
  - id: PI-ENT-OPS-01
    title: 三角色分离与审核发布治理
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 内容编辑起草并提交，内容审核复核并退回，发布管理员负责发布、退回、下线与回滚；禁止自审、越级发布和删除历史
  - id: PI-ENT-OPS-02
    title: 主数据只读分治
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 企业主数据仅只读引用，CMS 只维护门户补充内容；错误通过纠错申请处理，不在本模块覆盖数据真源
  - id: PI-ENT-OPS-03
    title: 人工策展榜单
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: Top30 为人工顺序，维护评估维度、上榜企业、评估依据与专家评述，不计算技术力、商业力或竞争力分数
  - id: PI-ENT-OPS-04
    title: 流程优先 IA 与派生入口合同
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    approved_core: 统一工作台以流程优先方式组织六类内容，六类内容作为稳定导航和筛选维度
    derived_contract_refs: [ENT-OPS-DERIVED-ROUTE-RETURN, return_context_contract, frames.F-OPS-01.route_variants]
    derived_elaboration: 五 route variant、角色默认入口优先级、仅恢复仍有权的显式选择与失权 fallback 是当前四件套派生合同，不是 design spec 六项批准结论的原文
  - id: PI-ENT-OPS-05
    title: 不可变发布版本与高风险审计
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#3-已批准产品解释
    decision: 已发布内容再编辑生成新草稿；发布、下线、回滚与批量关系变更需原因、二次确认和完整审计，回滚也生成新发布版本
  - id: PI-ENT-OPS-06
    title: 六类 payload 核心边界与派生所有权合同
    parent_requirement: E-37
    source_relation: product_interpretation
    approved_decision_ref: docs/superpowers/specs/2026-07-22-ent-ops-product-package-design.md#6-内容模型与数据边界
    approved_core: design spec §6 已确认六类载荷边界及主数据只读、CMS 只写补充内容、门户只消费 published 版本的三源分治
    derived_contract_refs: [ENT-OPS-DERIVED-MATERIAL-OWNER, business_material_source_contract, content_types, Wireframe-ENT-OPS.md#3.3]
    derived_elaboration: payload、语义、排序、展示位与版本的严格所有权隔离，以及专家材料的 content_editor/source_material_ref 写入合同，是当前四件套派生细化，不扩大批准决定来源

