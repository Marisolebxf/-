workflow:
  states:
    - id: draft
      label: 草稿
    - id: pending_review
      label: 待审核
    - id: pending_publish
      label: 待发布
    - id: published
      label: 已发布
    - id: offline
      label: 已下线
  role_constraints:
    publishing_admin:
      content_body_mutation: forbidden
      statement: 发布管理员只能执行发布治理动作，不得修改正文或 payload
  actions:
    save_draft:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: draft
      guards: {edit_permission: required, optimistic_version_match: required}
      audit_payload: [operator_id, operated_at, content_id, version, change_summary]
    create_draft_from_version:
      actor_role_ids: [content_editor]
      from_states: [published, offline]
      to_state: draft
      inputs:
        - {field_id: source_version_id, required: true}
      guards:
        source_version_overwrite: forbidden
        published_history_preserved: true
        offline_source_requires_submit_review_publish: true
      audit_payload: [operator_id, operated_at, content_id, source_version_id, source_state, new_draft_version_id]
    submit_for_review:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: pending_review
      guards: {content_complete: required, unresolved_conflict: forbidden}
      audit_payload: [operator_id, operated_at, content_id, submitted_version]
    approve_review:
      actor_role_ids: [content_reviewer]
      from_states: [pending_review]
      to_state: pending_publish
      guards: {reviewer_id_not_equal_submitter_id: true, content_body_mutation: forbidden}
      audit_payload: [reviewer_id, reviewed_at, content_id, reviewed_version, review_opinion]
    return_from_review:
      actor_role_ids: [content_reviewer]
      from_states: [pending_review]
      to_state: draft
      guards: {reason_required: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [reviewer_id, operated_at, content_id, returned_version, reason]
    immediate_publish:
      actor_role_ids: [publishing_admin]
      from_states: [pending_publish]
      to_state: published
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [publisher_id, published_at, content_id, source_version, new_published_version, reason, impact_summary]
    schedule_publish:
      actor_role_ids: [publishing_admin]
      from_states: [pending_publish]
      to_state: pending_publish
      guards: {reason_required: true, second_confirmation: true, full_audit: true, scheduled_effective_at_required: true, content_body_mutation: forbidden}
      effects: {scheduled_effective_at: write_from_request}
      audit_payload: [publisher_id, operated_at, content_id, source_version, scheduled_effective_at, reason, impact_summary]
    scheduled_publish_activate:
      actor_role_ids: []
      actor_type: system_event
      from_states: [pending_publish]
      to_state: published
      guards: {scheduled_effective_at_reached: true, scheduled_publish_not_cancelled: true, full_audit: true}
      audit_payload: [system_event_id, activated_at, content_id, source_version, new_published_version, scheduled_effective_at]
    return_from_publish:
      actor_role_ids: [publishing_admin]
      from_states: [pending_publish]
      to_state: draft
      guards:
        reason_required: true
        full_audit: true
        content_body_mutation: forbidden
        scheduled_activation_cancel_required_when_scheduled_effective_at_present: true
      effects:
        atomic_scope: transition_to_draft_and_cancel_scheduled_activation
        when_scheduled_effective_at_present:
          scheduled_activation_cancelled: true
          scheduled_activation_cancelled_at: required_timestamp
          scheduled_effective_at: cleared
        success_business_state: draft
        scheduled_activation_after_success: forbidden
        physical_job_or_api_contract: unspecified
      audit_payload: [publisher_id, operated_at, content_id, returned_version, reason, scheduled_effective_at, scheduled_activation_cancelled, scheduled_activation_cancelled_at]
    take_offline:
      actor_role_ids: [publishing_admin]
      from_states: [published]
      to_state: offline
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [publisher_id, operated_at, content_id, published_version, reason, impact_summary]
    rollback_as_new_published_version:
      actor_role_ids: [publishing_admin]
      from_states: [published]
      to_state: published
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_body_mutation: forbidden}
      audit_payload: [publisher_id, operated_at, content_id, source_version, new_published_version, reason, before_after_diff]
    batch_relation_change:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: draft
      payload_owner_ref: key_enterprise_panorama_payload
      allowed_field_ids: [descriptive_relationships]
      field_semantics: 仅更新人工维护的描述性文本，不产生算法关系、图谱边、关系推断或风险计算
      guards: {reason_required: true, second_confirmation: true, full_audit: true, content_type: key_enterprise_panorama}
      audit_payload: [operator_id, operated_at, content_id, affected_content_ids, reason, before_after_diff]
    submit_master_data_correction:
      actor_role_ids: [content_editor]
      from_states: [draft]
      to_state: draft
      handoff_target: enterprise_master_data_correction_queue
      guards: {master_data_readonly: true, correction_reason_required: true}
      result_payload:
        - {field_id: correction_request_id, contract: required_nonempty}
        - {field_id: target, value: enterprise_master_data_correction_queue}
        - {field_id: status, value: submitted}
        - {field_id: submitted_at, contract: required_timestamp}
      audit_payload: [operator_id, operated_at, enterprise_ref, correction_fields, correction_reason, correction_request_id, target, status, submitted_at]
  transitions:
    - {id: TR-OPS-01, action_id: save_draft, from_state: draft, to_state: draft}
    - {id: TR-OPS-13, action_id: create_draft_from_version, from_state: published, to_state: draft}
    - {id: TR-OPS-14, action_id: create_draft_from_version, from_state: offline, to_state: draft}
    - {id: TR-OPS-02, action_id: submit_for_review, from_state: draft, to_state: pending_review}
    - {id: TR-OPS-03, action_id: approve_review, from_state: pending_review, to_state: pending_publish}
    - {id: TR-OPS-04, action_id: return_from_review, from_state: pending_review, to_state: draft}
    - {id: TR-OPS-05, action_id: immediate_publish, from_state: pending_publish, to_state: published}
    - {id: TR-OPS-06, action_id: schedule_publish, from_state: pending_publish, to_state: pending_publish}
    - {id: TR-OPS-07, action_id: scheduled_publish_activate, from_state: pending_publish, to_state: published}
    - id: TR-OPS-08
      action_id: return_from_publish
      from_state: pending_publish
      to_state: draft
      atomic_effect_ref: workflow.actions.return_from_publish.effects
      success_requires: [draft_transition_committed, scheduled_activation_cancelled_if_present, cancellation_audit_recorded_if_present]
      success_forbids: [later_scheduled_publish_activate]
    - {id: TR-OPS-09, action_id: take_offline, from_state: published, to_state: offline}
    - {id: TR-OPS-10, action_id: rollback_as_new_published_version, from_state: published, to_state: published}
    - {id: TR-OPS-11, action_id: batch_relation_change, from_state: draft, to_state: draft}
    - {id: TR-OPS-12, action_id: submit_master_data_correction, from_state: draft, to_state: draft}
  lifecycle_rules:
    edit_published_as_new_draft: 执行 create_draft_from_version 从 published 版本生成独立新草稿，线上 published 版本与历史保持不变
    republish_offline_content: 执行 create_draft_from_version 从选定 offline 历史版本生成新草稿，再依次执行 submit_for_review、approve_review、immediate_publish 或 schedule_publish；禁止 offline 直接切回 published

ui_operation_state_contract:
  id: ENT-OPS-UI-OPERATION-STATE-V1
  ui_states: [idle, submitting, succeeded, failed]
  business_state_namespace: workflow.states
  global_rules:
    duplicate_submission: blocked_while_submitting
    succeeded_requires: authoritative_server_success
    failed_preserves:
      dirty_input: true_if_present
      original_business_state: true
      reason: true_if_present
      return_context: true
    failed_forbids: [fake_success, optimistic_business_state_advance, input_clear, silent_retry]
    retry_from: failed
  action_coverage:
    save_draft: {actor_role_ids: [content_editor], frame_ids: [F-OPS-02, F-OPS-06], on_failed_preserve: [dirty_payload, optimistic_version, draft, return_context]}
    create_draft_from_version: {actor_role_ids: [content_editor], frame_ids: [F-OPS-05, F-OPS-02], on_failed_preserve: [source_version_id, original_business_state, return_context]}
    submit_for_review: {actor_role_ids: [content_editor], frame_ids: [F-OPS-02], on_failed_preserve: [dirty_payload, draft, return_context]}
    approve_review: {actor_role_ids: [content_reviewer], frame_ids: [F-OPS-03], on_failed_preserve: [review_opinion, pending_review, return_context]}
    return_from_review: {actor_role_ids: [content_reviewer], frame_ids: [F-OPS-03], on_failed_preserve: [reason, pending_review, return_context]}
    immediate_publish: {actor_role_ids: [publishing_admin], frame_ids: [F-OPS-04], on_failed_preserve: [reason, second_confirmation, pending_publish, return_context]}
    schedule_publish: {actor_role_ids: [publishing_admin], frame_ids: [F-OPS-04], on_failed_preserve: [reason, scheduled_effective_at, second_confirmation, pending_publish, return_context]}
    scheduled_publish_activate:
      actor_role_ids: []
      actor_type: system_event
      user_trigger: system_only
      frame_ids: [F-OPS-04]
      duplicate_submission: handled_by_system_idempotency
      on_failed_preserve: [scheduled_effective_at, pending_publish, return_context]
    return_from_publish: {actor_role_ids: [publishing_admin], frame_ids: [F-OPS-04], on_failed_preserve: [reason, scheduled_effective_at, pending_publish, return_context]}
    take_offline: {actor_role_ids: [publishing_admin], frame_ids: [F-OPS-05], on_failed_preserve: [reason, second_confirmation, published, return_context]}
    rollback_as_new_published_version: {actor_role_ids: [publishing_admin], frame_ids: [F-OPS-05], on_failed_preserve: [reason, source_version_id, second_confirmation, published, return_context]}
    batch_relation_change: {actor_role_ids: [content_editor], frame_ids: [F-OPS-02], on_failed_preserve: [reason, descriptive_relationships, second_confirmation, draft, return_context]}
    submit_master_data_correction: {actor_role_ids: [content_editor], frame_ids: [F-OPS-02], on_failed_preserve: [correction_fields, correction_reason, draft, return_context]}

return_context_contract:
  id: ENT-OPS-RETURN-CONTEXT-V1
  required_query_key: route_variant_id
  optional_query_keys: [type, status, page]
  detail_query_contract: route_variant_id&type&status&page
  route_variant_ids: [editor_workbench, all_content, review_center, publish_center, versions_center]
  variant_path_map:
    editor_workbench: /enterprise/content-management?view=mine
    all_content: /enterprise/content-management?view=all
    review_center: /enterprise/content-management/review
    publish_center: /enterprise/content-management/publish
    versions_center: /enterprise/content-management/versions
  derivation:
    pathname_source: variant_path_map_only
    workbench_view_source: variant_path_map_only
    caller_supplied_view: forbidden
    caller_supplied_return_path: forbidden
  fallback:
    trigger: route_variant_id_missing_or_unknown_or_no_longer_authorized
    policy: current_highest_authorized_default_entry
    role_priority: [publishing_admin, content_reviewer, content_editor]
    default_variant_by_role: {publishing_admin: publish_center, content_reviewer: review_center, content_editor: editor_workbench}
    no_authorized_role: render_no_permission

