<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>M4-L02 冒烟证据（API → 列表/回看字段预览）</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 24px; background: #D8E7FC; color: #1d2129; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .meta { color: #86909c; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e5e6eb; padding: 8px; text-align: left; }
    .tag { display: inline-block; background: #e8f3ff; color: #165DFF; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    pre { background: #f7f8fa; padding: 12px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>科技新闻实体扩展 · M4-L02 API 冒烟预览</h1>
    <div class="meta">非登录态网关截图替代证据 · 来源 FastAPI TestClient · 仅调 Python /internal/tech-news/*（Java 透传契约同形）</div>
  </div>
  <div class="card">
    <h1>历史列表（q=小米）</h1>
    <table>
      <thead><tr><th>ID</th><th>标题</th><th>来源</th><th>事件数</th><th>实体数</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="card">
    <h1>回看字段</h1>
    <div>event_types: <span id="et" class="tag">-</span></div>
    <div style="margin-top:8px">entities: <span id="en"></span></div>
    <pre id="raw"></pre>
  </div>
  <script>
    fetch('./E-TECH-NEWS-ENTITY-M4-L02-api-smoke.json').then(r => r.json()).then(d => {
      const tb = document.getElementById('rows');
      tb.innerHTML = `<tr>
        <td>${d.extract_request_id}</td>
        <td>M4-L02 smoke 小米玄戒</td>
        <td>m4-l02-smoke</td>
        <td>${d.event_count}</td>
        <td>${d.entity_count}</td>
      </tr>`;
      document.getElementById('et').textContent = (d.event_types || []).join(', ') || '-';
      document.getElementById('en').textContent = (d.entity_names || []).join('、');
      document.getElementById('raw').textContent = JSON.stringify(d, null, 2);
    }).catch(e => { document.getElementById('raw').textContent = String(e); });
  </script>
</body>
</html>
