  - {path: agent-delivery/agent-handoffs/交付覆盖/ENT-EVAL/implementation-coverage.yaml, source_type: implementation_evidence}
  - {path: agent-delivery/agent-handoffs/交付覆盖/ENT-EVAL/validation-report.md, source_type: implementation_evidence}
  - {path: repos/demo-ui-topic/src/app/pages/enterprise, source_type: implementation_evidence}

freeze_basis:
  source_status: current_four_pack_v1_6_user_confirmed_for_demo
  implementation_authorization: "2026-07-20 用户要求根据修订后的企业评估产品四件套修改 Demo"
  delivery_limit: 只交付 DEMO 落位、显式 GAP 与双模式追溯；不宣告 PDR、FULL、正式指标或正式算法完成。
  forbidden_sources:
    - SRS 第 1 至 5 章
    - 历史决策日志
    - p2a-session
    - 旧 IA_TRACE_USM_Wireframe
    - 旧产品定义与用户故事

demo_repository:
  path: repos/demo-ui-topic
  branch: dev
  commit_policy: local_commits_and_uncommitted_no_push

sample_data:
  provenance: simulated
  basis: repos/demo-ui-topic/src/app/mock/enterprise/enterpriseList.ts 中已检入的确定性企业记录
  policy:
    - 演示值只用于界面和流程，不冒充正式算法输出。
    - 未登记 Bid 指标只展示显式 GAP，不创造 metric_id、公式或数值。
    - K-O7 指标不进入评分、图表或报告。
    - 业务模式不暴露原始 GAP_Q_metric_id_批次标识。

scope:
  routes:
    - /enterprise-center/evaluation?mode=technology
    - /enterprise-center/evaluation?mode=business
    - /enterprise-center/evaluation?mode=competitiveness
    - /enterprise-center/evaluation?view=processing&task_id={evaluationTaskId}
    - /enterprise-center/evaluation?view=result&task_id={evaluationTaskId}
    - /enterprise-center/evaluation?view=history
    - /personal/assets
  exclusions:
    - 不实现真实 ADS、正式评分算法或后台正式报告服务。
    - 不在企业评估页搜索或新增企业，不回写对比篮。
    - 不实现风险洞察、引育推荐或一企一策。
    - 不提供 small 屏交付。
