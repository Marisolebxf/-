source_resolutions:
  - id: E34-LOGO-DESIGN-OVERRIDE
    package_statement: 产品四件套 v0.3 已按 Design.md §1.1 移除企业 Logo 字段
    higher_priority_source: agent-delivery/Design.md §1.1
    resolution: 科技专题服务系统 Demo 与定义包一致，不展示企业 Logo；选择项保留企业名称和一句入选标签
  - id: E34-TWO-LEVEL-SELECTION
    package_statement: 未来产业为显式一级选择，明星企业为当前产业内二级选择
    resolution: Demo 使用共享有效未来产业语义的确定性编码字典；即使产业为 0 家也保留选项和业务空态
  - id: E34-FIXED-LIST-NOT-SINGLE
    package_statement: 每产业固定运营名单为 0..N 家
    resolution: 固定表示名单由运营维护，不表示固定一家；前台不查询名单外企业
  - id: E34-TEAM-SHOWCASE-LAYOUT
    package_statement: 团队实力多维展示在非评审态使用全宽人物轮播，位于技术优势可视化下方
    resolution: Demo 使用当前成员大图、成员画像文本、其余成员卡和上一位/下一位切换；两种模式均保留人物展示，评审态在其下追加发布与授权审查表
  - id: E34-TEAM-PORTRAIT-SIMULATION
    package_statement: 截图仅作为布局参考，不作为人物事实或图片内容来源
    resolution: 使用 AI 生成的虚构写实职业人物肖像并随源码本地打包；不引用真实企业成员、公众人物或外部图片地址，业务态标注人物信息为示例演示内容
  - id: E34-PRODUCT-PAGINATION
    package_statement: 产品为 0..N；中屏每页最多 3 个；4 个及以上手动非循环翻页；选择产品联动功能模块、场景、案例和媒体
    resolution: Demo 使用局部 productPage、activeProductId、activeProductModuleId；翻页选中目标页 sortOrder 第一项，选择新产品时默认展开其首个已发布功能模块并关闭旧媒体层；三项状态均不写入 URL

