    required_fields_state: productId、productName、productSummary、impactSummary、sortOrder、publishStatus；productModuleId、moduleName、moduleSummary；scenarioRefs、caseRefs、mediaRefs；productPage、activeProductId、activeProductModuleId；0 个业务空态、1~3 个无分页、4 个及以上每页 3 个手动非循环分页；媒体评审占位与业务示例态
