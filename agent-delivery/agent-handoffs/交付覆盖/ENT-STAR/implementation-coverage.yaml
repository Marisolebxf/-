      business:
        - 产品功能全景
        - 核心产品名称、产品摘要、公开影响摘要
        - 当前产品功能模块名称与说明
        - 当前产品应用场景
        - 当前产品行业案例
        - 上一页、下一页与当前页/总页数
        - 产品介绍视频
        - 技术原理 3D 模型
        - 行业案例
        - 操作演示
        - 当前为示例演示内容提示
      review_only:
        - 媒体评审占位
        - product_id / product_module_id / media_type / title / cover / url / publish_status / source
        - 产品排序、发布与子内容关联状态
        - DEMO 状态
        - CMS E-37 发布资源接入说明
