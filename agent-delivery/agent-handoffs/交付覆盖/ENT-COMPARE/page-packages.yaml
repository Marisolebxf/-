module_id: ENT-COMPARE
package_version: "1.5"
page_packages:
  - id: ENT-CMP-PAGE-BASKET
    route: /enterprise-center/basket
    responsibility: 篮内管理、筛选、勾选、列表内滚动、固定底部操作栏、分发前快照与返回恢复
    write_files:
      - repos/demo-ui-topic/src/app/components/common/CompareBasket.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/EnterpriseCompareBasketPage.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/compareBasketReturnContext.ts
    tests:
      - repos/demo-ui-topic/tests/enterprise-compare-basket-definition.test.mjs
      - repos/demo-ui-topic/tests/enterprise-compare-return-context.test.mjs
  - id: ENT-CMP-PAGE-TARGET-CONTEXT
    route: /enterprise-center/evaluation|risk
    responsibility: 显示来自对比篮的上下文并提供返回入口
    write_files:
      - repos/demo-ui-topic/src/app/pages/enterprise/CompareBasketHandoffBar.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/EnterpriseCenterPage.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/compareBasketTargetContext.ts
      - repos/demo-ui-topic/src/app/pages/enterprise/EnterpriseCapabilityEvaluation.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/CompetitivenessAnalysis.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/SupplyChainAnalysis.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/PainPointsAnalysis.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/CompareBasketImportButton.tsx
    tests:
      - repos/demo-ui-topic/tests/enterprise-compare-basket-definition.test.mjs
      - repos/demo-ui-topic/tests/enterprise-compare-target-context.test.mjs
  - id: ENT-CMP-PAGE-CANDIDATE-LISTS
    route: /enterprise-center/attraction
    responsibility: 按招引或培育定向展示对比篮已加入的候选企业
    write_files:
      - repos/demo-ui-topic/src/app/pages/enterprise/EnterpriseCompareBasketPage.tsx
      - repos/demo-ui-topic/src/app/pages/enterprise/EnterpriseRecommendation.tsx
    tests:
      - repos/demo-ui-topic/tests/enterprise-compare-basket-definition.test.mjs
shared_write_ownership:
  current_writer: codex:current-session
  overlapping_writer_detected: false
