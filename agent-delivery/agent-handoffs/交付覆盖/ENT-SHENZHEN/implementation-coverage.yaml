    required_fields_state:
      - domain_industry_code 单选且由有效当前专题产业初始化
      - 标题旁原始需求说明仅在评审态展示
      - 上方产业选择、当前产业名称与已识别领域/环节数；不重复展示“当前产业链”文案
      - 已识别项数取当前去重领域/环节集合总项数；覆盖率分子、分母、metric_id 和来源未闭合前不展示百分比或进度条
      - 下方领域/环节名称、企业数量或结构、shown_count、total_count
      - 默认前 12 项，每次追加 12 项，全部展示后可收起；切换产业恢复前 12 项
    trigger_result_or_exclusion: 选择产业只更新领域区并重置展开状态；查看更多不分页、不跳转、不打开企业清单；区块使用上下结构，不恢复左右分栏
    visibility_by_mode:
      business:
        - 深圳企业领域分布标题
        - 当前未来产业选择控件及选中态
        - 已识别领域/环节
        - X 个
        - 领域 / 环节分布摘要标题
        - 领域或环节名称
        - 企业数量标签
        - 已展示 X / 共 Y
        - 查看更多
        - 收起
        - 领域映射待完善业务空态
      review_only:
        - 结合各未来产业链全景图，展示深圳企业在产业领域中的分布情况。
        - Q049
        - DEMO 数据来源
        - 覆盖率口径与全量环节分母待 Q049 确认。
        - 映射至当前产业链但不展开企业名单或链位角色的说明
        - 不生成虚假链位分布的实现说明
