geo_dim_plan:
  conclusion: 不新建地理主维：复用 gkxlumenx_dim.code_region / region_scope / code_country / city；扩展街道级、港澳台、大鹏新区码与园区成员，并新增一张地名/区划归一映射表；全球省州级（admin1）待定
  levels:
  - level: global
    carrier: region_scope scope_code=global（国家集合）
    card: INT-C-X-475
    status: existing
  - level: country
    carrier: code_country（ISO alpha-3）
    card: INT-C-X-476
    status: existing
  - level: admin1（境外省/州）
    carrier: unknown（ISO 3166-2 候选）
    card: null
    status: missing
    open_item: OI-C05-04
  - level: province / city / district（中国）
    carrier: code_region level 1–3（GB/T 2260）
    card: INT-C-X-474
    status: existing
  - level: street（深圳街道）
    carrier: code_region level=4（统计用区划 9/12 位码）
    card: INT-C-X-474
    status: existing_alter
  - level: park（园区）
    carrier: region_scope member_type=park（边界/码源 unknown）
    card: INT-C-X-475
    status: existing_alter
    open_item: OI-C05-05
  - level: 湾区 / 京津冀 / 长三角 / 热点城市
    carrier: region_scope（gba 缺港澳）
    card: INT-C-X-475
    status: existing_alter
  mapping: 三方 dwd_dim_admin_area.cur_code（C03 INT-C-ORG-222）、人才履历地名文本、境外城市名 → map_region_alias（INT-C-X-477）→ region_code / country_code
  boundary_assets: GIS 边界（GeoJSON/瓦片）为前端静态资产或天地图服务，不入 MySQL 维表；与 region_code 对齐即可
  prior_art: innov vendor dim_admin_division 已有 level 4 街道 / 5 园区 设计（demo 库、仅城市级种子）——只作参考，lumen 不读 demo 表
  page_needs_low_confidence:
    DS-13: 全球→国家→省州→城市 四级缩放与分布计数
    DS-14: 中国 省→市；深圳 市→区→街道/园区
  structure_escalation: true
  escalate_to: human:李伟
  business_decision: 行政区划精度属业务口径（公约 §3.8），按团队临时默认值先跑（🟡），须登记客户决策清单
domain_dim_plan:
  conclusion: 技术领域单一真源 gkxlumenx_dim.tech_domain（domain_code），人才研究领域 / 机构领域 / 技术点共用；外部分类经锚点映射桥表挂接；产业维复用 industry_cluster，不与技术领域混用
  tables:
  - card: INT-C-TECH-421
    name: tech_domain
    role: 领域码树 + is_focus 重点技术领域（DS-14 人工智能、生物医药…）
  - card: INT-C-TECH-422
    name: map_tech_domain_anchor
    role: IPC/CPC、学科 GB/T 13745、项目 discipline_code、论文 WoS/scope → domain_code
  - card: INT-C-X-478
