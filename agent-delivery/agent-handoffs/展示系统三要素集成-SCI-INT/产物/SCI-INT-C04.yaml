load_pipeline:
  summary: 「先 ADS 再投影」——C01–C03 主数据/关系表落 ADS 后，由 lumen-algo-py 新增三要素投影 Job 单向写 Nebula；首次全量、之后按水位增量（频率 weekly 待确认）；图算法 Job 读 Nebula 结果投影回 ADS；Java 只读 ADS + 经 Python /internal/graph/* 取子图
  stages:
  - step: 1 入站
    who: GDF（ods→dwd）；久新 Python 104/105/110/111/114/115 并入 lumen-algo-py 后的抽取 Job（IP-07）
    output: dwd_scholar*、文献/项目桥接、技术点/机构候选（C01/C02/C03 源卡）
    nebula: 零 nGQL
  - step: 2 主数据与关系 ADS
    who: GDF / lumen-algo-py 批 Job（主数据 ID 对齐 C01–C03；人工维护层合并，见 write_back_conflicts）
    output: 技术点主表(technology_id)、人才主档(scholar_id)、dim_research_org(org_uid)、各关系表（含 source/version/is_deleted）
    nebula: 零 nGQL
  - step: 3 图投影
    who: lumen-algo-py 三要素投影 Job（待建；参照 graph_project.py 的 NebulaSink 与 ENT 菜单 A/B/C 的 op_id + dry_run + calc_batch_id 幂等）
    output: demo_gkx_chain 中 technology/talent/institution 顶点 + 6 类边 UPSERT
    rule: 端点 VID 不存在 → skipped(no_stable_id / not_in_wave / vid_too_long / empty_field)，禁止名称猜 VID
  - step: 4 图算法
    who: lumen-algo-py IP-05 批 Job（中心性/关键节点/路径/影响力；DN-02 待定是否自建）
    output: ADS 投影表（候选 ads_sci_graph_metric_snapshot，结构未定）
  - step: 5 读
    who: Java（gkxlumen-*）只读 ADS；子图 Java Feign → lumen-algo-py /internal/graph/*（draft）→ Nebula；前端 G6 渲染
  writers:
    nebula_writer: lumen-algo-py（唯一写者；三要素 Job 待建，现仅 chain graph_project 写 chain/segment）
    not_writers: [lumen-etl-es-py（E11 零 Nebula 代码）, Java（E07 禁 nGQL）, 久新（不直写我方图，交代码并入 IP-07）, lumen-topic-py（E10 只连 entan，须清退）]
  frequency:
    initial: 全量（首次灌建 / schema 变更 / VID 迁移）
    regular: 增量，按 ADS updated_at 水位 + calc_batch_id；频率 weekly（未确认，随 IP-07 freshness）
    manual_write_back: 事件触发单实体/单边增量重投（A03/A14 保存后）
    graph_algo: weekly 全量重算（IP-05，未确认）
    delete: tombstone（ADS is_deleted）→ 下一次增量同步 DELETE VERTEX/EDGE；禁止靠全量重灌删除
  full_vs_incremental: 顶点/边增量 UPSERT；全量仅用于重建且须先保全人工层（ADS 人工表不随重建丢失）
  readonly_ngql_for_human:   # 供人执行核实现状，本叶未执行
  - SHOW SPACES;
  - USE demo_gkx_chain; SHOW TAGS; SHOW EDGES;
  - USE demo_gkx_chain; DESCRIBE TAG institution; DESCRIBE TAG enterprise; DESCRIBE EDGE participates;
  - USE demo_gkx_chain; SUBMIT JOB STATS;   # 等 SHOW JOBS 完成后
  - USE demo_gkx_chain; SHOW STATS;
  - USE demo_gkx_chain; LOOKUP ON institution YIELD id(vertex) AS vid | LIMIT 5;   # 需已有索引，无索引则跳过
  - SHOW CREATE SPACE demo_gkx_chain;   # 核 vid_type 是否 FIXED_STRING(80)
  - "旧 graphd（若仍可达）：USE entan; SHOW TAGS; SHOW EDGES;  # 仅对照 as-built，不迁移名称 VID"
  open_items: [OI-C04-04, OI-C04-05]

