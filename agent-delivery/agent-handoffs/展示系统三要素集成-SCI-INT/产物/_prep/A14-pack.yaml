    - path: 智能服务集群/科技信息展示系统/科技人才态势/重点科技人才画像/基础画像/信息展示方式

    - bid_desc: 支持全球重点科技人才高精度画像和专家领域权威度分析展示，能够按照研究领域、主题进行分类。需提供的功能包括：基础画像、关联画像、分析画像、近期成果展示、合作网络图谱、研究领域图谱等。

    - notes:


    #### 需规功能描述


    信息展示方式的具体功能包括分级展示、标签化展示、卡片式展示。

    （1）分级展示

    支持按详细程度分层展示人才信息，用户可以从基本信息（姓名、单位）逐步展开，查看更多如教育背景、工作经历、代表成果等详细内容。

    （2）标签化展示

    自动为人才打上多维标签（如研究领域、职称、技能），便于用户快速识别人才特点并进行筛选。

    （3）卡片式展示

    采用卡片式页面设计，将人才信息以结构化卡片形式呈现，美观直观，便于快速浏览与对比。'
