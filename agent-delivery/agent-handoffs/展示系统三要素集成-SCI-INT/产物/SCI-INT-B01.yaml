# ─────────────────────────────────────────────────────────────
# 二、通用集成模式
# ─────────────────────────────────────────────────────────────
patterns:
  - id: IP-01
    name: STAT 自建统计（GDF 建 ADS → Java 只读）
    applies_to: {algorithm_type: [STAT], 交付形态: [table]}
    responsibility_by_layer:
      L0: defineApi 调 Java；ⓘ + 角标
      L1: catalog 8 件套 algorithm_type=STAT
      L2: 模块 Owner Java（展示=李伟）SELECT ads_*；分页/维度过滤
      L3: 不参与
      L4: GDF ods→dwd→ads（COUNT/SUM/DISTINCT 等聚合在 SQL 加工里完成）
    freshness: T+1（默认，跟随 GDF 调度；甲方未确认）
    failure_degrade: ADS 无当期分区 → 返回上一期 + period 字段 + 前端「数据截至 X」；空表 → 空态，禁止 Mock 回填（USE_MOCK=false）
    observability: {java_agent: 必加（SQL span）, python_instrument: N/A, frontend: observability.ts 接口耗时 + trace_id}
    test_points: [聚合口径与 8 件套 formula 一致, period 回落正确, 空表空态不报错, USE_MOCK=false 无 fixture]
    open_items: [三要素 ADS 表名与粒度未定（D02）, 6 个 STAT 指标 source_tables 均 pending_ods]
  - id: IP-02
    name: COMPUTE 确定性派生计算（ADS 上公式二次计算）
    applies_to: {algorithm_type: [COMPUTE], 交付形态: [table, Python]}
    responsibility_by_layer:
      L0: 同 IP-01
      L2: 只读计算结果；简单比值/同比若可纯 SQL 则在 GDF 完成，Java 不做公式
      L3: 非纯 SQL 的公式在 lumen-algo-py 批 Job 计算后写 ADS
      L4: ADS 结果表 + 计算版本号
    freshness: 跟随上游 ADS（T+1）
    failure_degrade: 上游缺一项 → 该指标置灰 + PendingBadge，不以 0 代替
    observability: {java_agent: 必加, python_instrument: Job span + 指标行数, frontend: 同 IP-01}
    test_points: [公式单测（assert 级）, 上游缺失时置灰, 版本号随公式变更递增]
    open_items: [93 中当前无 COMPUTE 类型；保留本模式供 algorithm_type 改型时使用]
  - id: IP-03
    name: MODEL 同步推理（Python /internal 同步调用）
    applies_to: {algorithm_type: [MODEL], 交付形态: [Python, API]}
    sync_vs_async_criteria:
      同步: "P95 ≤ 2s 且 单次输入 ≤ 1 个对象/页面条件 且 无写库副作用 且 结果可按条件缓存"
      异步: "任一不满足：P95 > 2s、批量对象、需写快照、依赖久新 API 且其 SLA 未知、需排队限流"
      默认: 久新 API 背后模型一律先按 IP-04 异步（SLA 未确认前不承诺同步）
    responsibility_by_layer:
      L0: 条件栏「开始分析」才触发（附录 E；切条件不自动起任务）
      L2: RestTemplate/Feign 调 /internal/*，超时 3s，透传 trace
      L3: lumen-algo-py 模型推理，输入校验，mock_guard
      L4: 只读 ADS / Nebula 特征
    freshness: realtime（按请求）
    failure_degrade: 超时 → Java 返回业务码「模型暂不可用」+ 上一份快照（若有）；无快照 → 空态
    observability: {java_agent: 必加（下游 span）, python_instrument: 推理耗时/输入规模, frontend: 分析按钮点击 + 结果耗时}
    test_points: [P95 压测, 超时降级路径, 同条件幂等]
    open_items: [M_TECH_DS_07_TECH_INNOV_002/004/006 模型 Owner 未定（DN-05）]
  - id: IP-04
    name: MODEL 异步 Job（提交 → worker → 结果快照 → 轮询）
    applies_to: {algorithm_type: [MODEL, GRAPH], 交付形态: [Python, API]}
    responsibility_by_layer:
      L0: 「开始分析」→ 轮询任务状态；同用户同条件单飞；当天已成功直接打开结果；「重新分析」强制重跑（Q-ANALYSIS-01）
      L2: 提交/查询/取结果三接口，任务表只存元数据；结果读 ADS 快照（IP-11）
      L3: lumen_algo_worker + lumen_common/tasks/{lifecycle,executor}；结果写快照
      L4: ADS 快照表、Nebula 读
    freshness: 按任务；周期类（G3 Job，如 M_TECH_HEAT_INDEX / M_TALENT_ATTRACT_SCORE）weekly 或 T+1 预算（未确认）
    failure_degrade: 失败 → 任务状态 failed + 原因码；页面保留上一成功快照并标「非最新」；不自动重试超过 1 次
    observability: {java_agent: 提交/查询 span, python_instrument: job_id 贯穿 trace + 阶段耗时, frontend: 任务提交/完成/失败事件}
    test_points: [单飞（并发提交只一条 running）, 当天复用, 失败保留旧快照, job_id 与 trace_id 关联]
    open_items: [三要素任务表/快照表结构（structure_escalation）, 专题跑 Job 与展示读同一快照的写者归属（C3）]
  - id: IP-05
    name: GRAPH 自建（Python 读写 NebulaGraph TRSGraph → 结果投影 ADS）
    applies_to: {algorithm_type: [GRAPH], 交付形态: [Python]}
    responsibility_by_layer:
      L0: 子图用 AntV G6；ⓘ 指向图指标
      L2: 读 ADS 投影结果（中心性/关键节点/影响力表）；子图查询经 Python /internal，不写 nGQL、不读 dwm_graph_*
      L3: lumen-algo-py nebula3-python 连 graphd 10.50.75.136:9669；中心性/关键节点/路径算法；批 Job 写 ADS 投影
      L4: TRSGraph 三要素 space（schema 未知）
    freshness: weekly（图批量重算；未确认）
    failure_degrade: Nebula 不可达 → 读最近投影快照 + 「图谱更新中」；无投影 → 空态
    observability: {java_agent: 必加, python_instrument: nGQL 耗时/返回节点数, frontend: 图渲染耗时}
    test_points: [禁止 Neo4j 依赖, space 名非 demo_*（参照 NonDemoNebulaSpaceError）, 中心性小图 assert 自检]
    open_items: [M_TECH_PATH_CENTRALITY/KEYNODE/PRIORITY、M_TECH_ENTITY_INFLUENCE 是否自建（DN-02，唐绍祖）, TRSGraph 三要素 schema unknown]
  - id: IP-06
    name: third_party × SQL（久新交 SQL → 我方 GDF/ETL 落 ADS → 同 IP-01 读链）
    applies_to: {algorithm_type: [third_party], 交付形态: [SQL]}
    jiuxin_rows: [SRS-96, SRS-98, SRS-99]
    responsibility_by_layer:
      L0: 同 IP-01
      L2: 只读 ADS
      L3: 不参与（若 SQL 依赖 ES 则 lumen-etl-es-py 承接）
      L4: 久新 SQL 经我方评审（口径/性能/表名映射到 gkx 三方库）后纳入 GDF 调度，产出 ADS
    freshness: T+1（随 GDF；未确认）
    failure_degrade: 同 IP-01
    observability: {java_agent: 必加, python_instrument: ETL 任务行数/耗时（若经 etl-es）, frontend: 同 IP-01}
    test_points: [久新 SQL 在 gkx 沙箱可执行, 结果行数与久新样例一致, 口径与 8 件套一致]
    open_items: [SQL 依赖的源表是否在 gkx 三方库（D3 pending_ods）, 3 行交付形态均「待确认」]
  - id: IP-07
    name: third_party × Python（久新交 Python → 并入 lumen-algo-py → 按 IP-04/IP-05 运行）
    applies_to: {algorithm_type: [third_party], 交付形态: [Python]}
    jiuxin_rows: [SRS-104, SRS-105, SRS-110, SRS-111, SRS-114, SRS-115]
    responsibility_by_layer:
      L0: 同 IP-05
      L2: 只调 Python /internal 或读 ADS 投影
      L3: 代码并入 lumen-algo-py（lumen_common/algorithms/sci/…，目录待定）；依赖进 requirements 须评审；实体识别/关系抽取结果写 Nebula + ADS
      L4: TRSGraph、ADS
    freshness: weekly / 增量（未确认）
    failure_degrade: 抽取 Job 失败 → 保留上一版图谱与投影；新代码不得在 lumen 链路回落 demo-algo-*（D12）
    observability: {java_agent: 必加, python_instrument: 抽取条数/失败率/模型版本, frontend: 同 IP-05}
    test_points: [并入代码有 1 个最小可跑自检, 无 demo-* import, 依赖许可审查, 抽取结果写入 TRSGraph 非 demo space]
    open_items: [久新是否交源码还是 wheel/镜像 unknown, 模型权重存放与许可 unknown, 并入后维护责任（郭万迎对接）]
  - id: IP-08
    name: third_party × API（Python 适配层封装 → Java 只调 Python）
    applies_to: {algorithm_type: [third_party], 交付形态: [API]}
    jiuxin_rows: "SRS-130…140、SRS-149…155、SRS-156…165、TOPIC-RORG-012 + 13 展示 third_party 行（与库叶同交，不单独再要）"
    adapter_contract:
      鉴权: 久新凭据只存在 Python 侧（K8s Secret），不下发 Java/前端
      限流: 适配层令牌桶（按久新给定 QPS；未知前保守 5 QPS）
      超时: 连接 2s / 读 10s（同步）；超出转 IP-04 异步
      缓存: 按 (接口, 规范化参数) 键缓存，TTL = freshness；是否允许落库待甲方（DN-09）
      熔断: 连续 5 次失败或错误率 >50%/1min 打开 60s；打开期间读快照
      重试: 幂等 GET 最多 1 次，退避 500ms
      字段映射: 久新响应 → 我方 contract_draft.response_key_fields，在适配层完成，Java 不感知久新字段
    responsibility_by_layer:
      L0: 同 IP-04 交互
      L2: 只调 /internal/v1/sci/*（路径待定），不知道久新存在
      L3: lumen-algo-py 适配层 + 快照写入（IP-11）
      L4: 久新 API
    freshness: 按库叶（未确认；默认 T+1 快照 + 页面读快照）
    failure_degrade: 熔断/超时 → 最近快照 + 「数据更新中」；无快照 → 空态 + PendingBadge；禁止 Mock 兜底
    observability: {java_agent: 必加, python_instrument: 外呼 span（久新耗时/状态码/熔断状态）, frontend: 同 IP-04}
    test_points: [凭据不出 Python, 熔断打开读快照, 超时降级, 字段映射单测, 前端/Java 无久新域名]
    open_items: [42 行 API 接口文档/鉴权/SLA 全部「待确认」, 缓存/落库合规（DN-09）, 适配层缓存表 structure_escalation]
