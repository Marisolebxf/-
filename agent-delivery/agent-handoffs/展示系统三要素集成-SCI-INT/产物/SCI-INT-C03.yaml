    dwd_forg_university_org_info / dwd_forg_research_org_info（只有三方 org_id，无 GRID/ROR，08-31 业务行=0）；论文/专利/项目/学者里的机构全部只有名称（唯一例外 dwd_zh_report_org 带 org_xydm）。草案：我方自建科研机构主数据维表 dim_research_org（INT-C-ORG-240，全局
