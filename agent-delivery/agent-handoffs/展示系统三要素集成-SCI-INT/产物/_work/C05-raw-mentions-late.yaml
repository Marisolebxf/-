    - id: IP-03
      name: MODEL 同步推理（Python /internal 同步调用）
      applies_to:
        algorithm_type:
        - MODEL
        交付形态:
        - Python
        - API
      sync_vs_async_criteria:
        同步: P95 ≤ 2s 且 单次输入 ≤ 1 个对象/页面条件 且 无写库副作用 且 结果可按条件缓存
        异步: 任一不满足：P95 > 2s、批量对象、需写快照、依赖久新 API 且其 SLA 未知、需排队限流
        默认: 久新 API 背后模型一律先按 IP-04 异步（SLA 未确认前不承诺同步）
      responsibility_by_layer:
        L0: 条件栏「开始分析」才触发（附录 E；切条件不自动起任务）
        L2: RestTemplate/Feign 调 /internal/*，超时 3s，透传 trace
        L3: lumen-algo-py 模型推理，输入校验，mock_guard
        L4: 只读 ADS / Nebula 特征
      freshness: realtime（按请求）
      failure_degrade: 超时 → Java 返回业务码「模型暂不可用」+ 上一份快照（若有）；无快照 → 空态
      observability:
        java_agent: 必加（下游 span）
        python_instrument: 推理耗时/输入规模
        frontend: 分析按钮点击 + 结果耗时
      test_points:
      - P95 压测
      - 超时降级路径
      - 同条件幂等
      open_items:
      - M_TECH_DS_07_TECH_INNOV_002/004/006 模型 Owner 未定（DN-05）
    - id: IP-04
      name: MODEL 异步 Job（提交 → worker → 结果快照 → 轮询）
      applies_to:
        algorithm_type:
        - MODEL
        - GRAPH
        交付形态:
        - Python
        - API
      responsibility_by_layer:
        L0: 「开始分析」→ 轮询任务状态；同用户同条件单飞；当天已成功直接打开结果；「重新分析」强制重跑（Q-ANALYSIS-01）
        L2: 提交/查询/取结果三接口，任务表只存元数据；结果读 ADS 快照（IP-11）
        L3: lumen_algo_worker + lumen_common/tasks/{lifecycle,executor}；结果写快照
        L4: ADS 快照表、Nebula 读
      freshness: 按任务；周期类（G3 Job，如 M_TECH_HEAT_INDEX / M_TALENT_ATTRACT_SCORE）weekly 或 T+1 预算（未确认）
      failure_degrade: 失败 → 任务状态 failed + 原因码；页面保留上一成功快照并标「非最新」；不自动重试超过 1 次
      observability:
        java_agent: 提交/查询 span
        python_instrument: job_id 贯穿 trace + 阶段耗时
        frontend: 任务提交/完成/失败事件
      test_points:
      - 单飞（并发提交只一条 running）
      - 当天复用
      - 失败保留旧快照
      - job_id 与 trace_id 关联
      open_items:
      - 三要素任务表/快照表结构（structure_escalation）
      - 专题跑 Job 与展示读同一快照的写者归属（C3）
