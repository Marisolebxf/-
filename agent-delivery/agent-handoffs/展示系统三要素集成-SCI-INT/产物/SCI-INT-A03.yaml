    - option: B 久新持有实体库、我方回推人工变更
      desc: 人工变更经 Python 适配层调用久新「实体增删改」接口（SRS-104「支持添加删除修改实体」）；我方存 jx_tech_id→technology_id 映射
      precondition: 久新提供写接口 + 变更回执 + 冲突码；当前 51 行中无此类写接口行（unknown）
      cons: 主数据在对端，回滚/审计依赖对端；与 C02 推荐方案 A（我方持有）相悖
    - option: C 久新周期全量覆盖（不可取）
