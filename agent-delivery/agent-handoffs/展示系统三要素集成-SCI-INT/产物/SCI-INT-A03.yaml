  status: draft（未评审；不是定论；依赖 C02 OI-C02-01 主数据决策与 C04 图谱 schema）
  premise:
    - C02 结论：技术点目前没有任何一方持有主数据；TRSGraph technology 顶点 VID = tech:{名称}；草案建议我方自建技术点主表 + technology_id（待决策）
    - 存储真源 data/data-design/storage/README.md：Nebula 只由 Python 写（Java 禁直连 nGQL）；「一张 G」= 正式 space gkx_chain / Demo demo_gkx_chain（TRSGraph 集群 10.50.75.136:9669）
    - 详设 11 §11.1：展示不另建图库、禁止 display 专有 graph schema；A 图复用 /topic/v1/{element}/graph/**（与专题同一资源）
    - SRS-104 原文：实体库「支持添加、删除、修改实体及定期库更新」——库侧本身会周期刷新，是人工写回冲突的主来源
  master_data_ownership:
    - object: 技术点（technology）
      owner_draft: 我方项目自建技术点主表（C02 INT-C-TECH-180，technology_id 全局稳定）；本页是唯一人工写入口
      today: 无任何一方持有（C02）
      decision: DN-A03-01（= C02 OI-C02-01）
    - object: 技术领域分类（technology.category）
      owner_draft: 我方技术领域维表 dim_tech_domain（C02 INT-C-TECH-181，名待定）；本页只读选用，不在本页增改分类体系
      decision: OI-C02-02 分类体系选型（甲方）
    - object: 技术–技术边
      owner_draft: 我方图谱；自动层来自久新 SRS-105 产出（并入 lumen-algo-py 的 Job，待确认），人工层来自本页
    - object: 人才 / 科研机构节点
      owner_draft: 主数据归 C01 / C03 结论（gkx 三方库 scholar_id / dwd_org_base_info.org_id 等）；本页只「挂接」进全景图，不改其主数据
      decision: DN-A03-04（全景页改实体属性的生效范围）
    - object: 论文 / 专利节点
      owner_draft: 甲方三方库 dwd_* 只读（C02 doc_bridge 主键）；本页只挂接，属性编辑仅作全景图本地覆盖
    - object: 实体–技术边（技术点↔人/机构/论文/专利）
      owner_draft: 自动层 = SRS-105 关系抽取 / C02 桥接表 INT-C-TECH-182；人工层 = 本页添加/删除/编辑
    - object: 变更集 / 修改历史 / 版本 / 审计
      owner_draft: 我方新表（graph_change_set、graph_change_log、graph_version，名待定）；写者 = Python（单写者原则）
      decision: DN-07（李伟）是否允许 Java 业务库持有审核状态
  layers:
    auto: 久新 104/105 产出层，按 run_id 版本化（source=jx104|jx105），每次 Job 全量或增量产出，不直接覆盖已发布图
    manual: 本页人工层（source=manual）：add / update(字段级覆盖) / tombstone(抑制自动层同对象复活)，带 operator / reason / base_version
    published: merge(auto 最新成功 run, manual) → 技术点主表 + Nebula gkx_chain 投影 + ADS 投影（graph_node/graph_edge 同类表供 Java 只读）
    merge_rule_draft: 字段级 manual > auto；tombstone > auto 新增；auto 对已被人工覆盖字段的新值不静默覆盖 → 进冲突队列待人工确认（DN-A03-03）
  flow_draft:
    - step: 编辑
      where: 前端会话（G6 画布 + 本地撤销/重做栈，SRS-39）
      write: 无（未提交前不落库）
    - step: 提交草稿
      where: "前端 → gateway → Java 门面（鉴权、角色校验、入参校验、幂等键、@SysLog 请求级审计）→ Python POST /internal/v1/sci/tech/graph/changes（draft）"
      write: Python 写 graph_change_set(status=draft, base_version, ops[])；不触 Nebula
    - step: 审核（可选）
      where: SRS 原文无「审核」字样，只有「团队协作和变更追踪」；是否需要审核、谁审核 → DN-A03-02
      write: change_set.status draft→approved|rejected；若需要流程引擎，gkxlumen-flow 为候选（未核是否可用，unknown）
    - step: 发布（= SRS-40「保存」）
      where: Python 单事务语义：主表 upsert → graph_version +1 → Nebula 投影（UPSERT/DELETE VERTEX/EDGE）→ ADS 投影 → 失效相关快照（IP-11）
      write: 技术点主表、版本表、change_log(before/after)、Nebula gkx_chain、ADS 投影
      failure: MySQL 先提交、Nebula 失败 → 版本标 projection_pending + 补偿重放（Nebula 无跨库事务）；页面读 ADS 投影仍为上一版并标「图谱更新中」
    - step: 同步（与久新/自动层）
      where: 下次 104/105 Job merge 时读取 manual 层与 tombstone；若久新持有运行中的实体库（而非交 Python），需双向接口（待确认）
  version_and_rollback_draft:
    version_table: graph_version(version_id, parent_version_id, label, operator, created_at, change_set_ids[], stats{+node,-node,+edge,-edge})
    snapshot: Nebula 不存多版本，只存 published；历史版本存 MySQL（按版本存 diff，每 N 版存一次全量快照，N 待定）
    rollback: 回滚 = 由目标版本与当前版本 diff 生成「反向变更集」再走发布流程（可审计、可再回滚），不做物理覆盖
    concurrency: 乐观锁 base_version；提交时 base_version≠当前 → 409 + 差异列表，前端提示合并
    retention: 版本保留期数 / 审计保留期 → DN-A03-06
    id_stability: 改名不换 technology_id；合并/拆分写 redirect（旧 ID→新 ID，C02 id_alignment_draft.versioning）
  audit_log_draft:
    request_level: Java gkxlumen-common-log @SysLog（存量注解，已在仓内）→ 记录操作人/接口/耗时/结果
    object_level: Python graph_change_log(change_id, version_id, object_type, object_id, op, before, after, operator, trace_id, at)
    trace: 前端 observability.ts trace_id → Java Agent → Python instrument 贯穿；change_log 存 trace_id
    view: SRS-40「查看各版本修改记录和操作人员」读 change_log + graph_version（Java 只读其 ADS 投影或经 Python 查询，待 DN-07）
  jiuxin_sync_options:
    - option: A 分层叠加（推荐草案）
      desc: 久新 104/105 以 Python 交付并入 lumen-algo-py 离线 Job；产出进 auto 层；merge 时尊重 manual/tombstone；不需要与久新系统做运行时双向同步
