      cons: 人工编辑每轮丢失，违背 SRS-39/40 可追溯与版本要求
  required_from_jiuxin_draft:   # 全部「待确认」，经郭万迎对接；Z01 汇入久新接口需求说明
    - id: JX-A03-01
