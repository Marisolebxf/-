    source_system: 三方要素库（国内政策要素库 + 国际政策要素库）
    source_table: [dwd_zck_policy, dwd_zck_intl_policy]
    field_map:
      policy_id: dwd_zck_policy.id
      title: dwd_zck_policy.title
      issued_number: dwd_zck_policy.issueno
      publish_organization: dwd_zck_policy.pubdeptname
      publish_date: dwd_zck_policy.pubtime
      status: dwd_zck_policy.docstatus（20已发布→1/30已撤销→2）
      level: dwd_zck_policy.policylevel（国家级1/省级2/市级3/区县级4）
      region: dwd_zck_policy.region / area
      abstract: dwd_zck_policy.abs
      keywords: dwd_zck_policy.keywords
      pedigree: dwd_zck_policy.pedigree
      elements: dwd_zck_policy.maelements
      keypoints: dwd_zck_policy.ma_keypoints
      factors: dwd_zck_policy.allfactors
      attachment: dwd_zck_policy.attachments
      expire_date: dwd_zck_policy.expiration_date
      implementation_date: dwd_zck_policy.crtime（成文日期近似）  # ⚠️ QPOL/无独立字段
      gis_location: 🔧 region 地理编码
      sci_tech_attribute: 🔧 keywords/elements 规则判定
      application_conditions: 🔧 elements/allfactors 二次解析
      related_entities: 🔧 elements/keypoints 实体抽取→JSON
    transform_rule: "ODS → DWD 清洗加工；19 字段直接映射，4 字段轻量加工(🔧)，4 字段待确认(⚠️)；国际政策以 level='国际'+source 区分；详见映射报告 §4/§8"
