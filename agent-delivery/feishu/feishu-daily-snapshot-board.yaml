# 飞书「GKX 当日进展」看板（新企业 Z.ai）
# ============================================================================
# 真源：agent-delivery/工程过程/当日进展/YYYY-MM-DD.md（今日快照）
# 飞书：只读投影；格子改动下一轮覆盖，不回写 git
# 同步：node scripts/sync-feishu-daily-snapshot.mjs [--date YYYY-MM-DD] [--dry-run]
# 缺陷页：node scripts/sync-feishu-bug.mjs [--id BUG-...] [--dry-run]
# 凭据：本机 .env 的 FEISHU_APP_ID / FEISHU_APP_SECRET（新企业自建应用 cli_aa698af4efb9dc09）
# 不挂入 feishu-bitable-cron-sync；仅 PM 快照后手跑或口令触发
# ============================================================================

version: 1
updated: "2026-10-29"

bitable:
  # https://zhipu-ai.feishu.cn/base/P0DdbN6Iia3BxXsSusycQCyunIh
  app_token: "P0DdbN6Iia3BxXsSusycQCyunIh"
  daily:
    table_name: "当日八列"
    # 首表沿用建表时默认 table；列由脚本补齐
    table_id: "tbl4v5387JROZvrP"
  summary:
    table_name: "维度汇总"
    table_id: "tblR4KgnidPsYfwc"   # 首跑自动建表后回填
  bugs:
    table_name: "缺陷"
    table_id: "tblNf4ZXScKjsOkU"   # 首跑按表名找到后回填；不跟当日快照互相覆盖

sync:
  direction: snapshot_to_bitable
  mode: upsert   # 主键 = 行键；同日多余行删除
  source_dir: agent-delivery/工程过程/当日进展

field_names:
  daily:
    row_key: "行键"
    snapshot_date: "快照日期"
    owner: "负责人"
    task: "任务内容"
    due: "完成时间"
    status: "完成状态"
    today_task: "当日任务"
    today_progress: "当日进展"
    test: "测试情况"
    note: "其他备注"
    dimension: "对接维度"
  summary:
    row_key: "行键"
    snapshot_date: "快照日期"
    scope: "范围"
    design: "设计"
    develop: "开发"
    overall: "整体"
    blocked: "阻塞行数"
  bugs:
    id: "BUG编号"
    title: "标题"
    conclusion: "结论"
    module: "模块"
    entry: "入口"
    env: "环境"
    expected: "预期"
    actual: "实际"
    status: "状态"
    screenshot: "截图"
    source_case: "关联用例"
    found_date: "发现日期"

status_options:
