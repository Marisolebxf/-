# 飞书「指标与数据开发进度」看板配置
# ============================================================================
# 定位：与任务看板同一 Bitable 应用内的独立数据表；一行 = 一个 metric_id。
# 真源分层：
#   metrics/metric-readiness-matrix-*.yaml（四维就绪度）+ metrics/cfg_metric-*-seed.yaml（8 件套）
#   + agent-handoffs/**/{模块}-data-gap-catalog.yaml（缺口长文案）= 唯一真源
#   飞书 = 只读投影（拖拽/改列不回写 git）
# 同步：node scripts/sync-feishu-metric-board.mjs [--dry-run]
#   矩阵/种子更新后手跑一次即刷新看板；无 FEISHU_* 凭据时软失败。
# 任务：ORCH-METRIC-BOARD-L01（监管 human:淮政玮）· 2026-08-01
# 模型：designs/data-lineage-v1.3-readiness-draft.md（D1 定义 / D2 结构 / D3 源映射 / D4 接入）
# ============================================================================

version: 1
updated: "2026-08-01"

bitable:
  # 复用任务看板同一多维表格应用（feishu-bitable.yaml#bitable.app_token）
  app_token: "JI94bBxwsaIzyMsMBrYcPJscnDc"
  table_name: "指标与数据开发进度"
  table_id: "tblw8ZPW6geOuyqt"   # 首跑自动建表/发现后由脚本回填；勿手填错表
  # 建议视图（表建好后在飞书 UI 手动配置）：
  view_hints:
    - "① 表格视图（全量总览，默认）"
    - "② 看板视图：分组 = 综合就绪（对齐会议主视图）"
    - "③ 表格视图：分组 = 模块（各模块负责人自查）"
    - "④ 筛选视图：源映射 ∈ {无源, 待ODS}（数据采购/GDF 跟踪）"
    - "⑤ 筛选视图：定义状态 = 草案（甲方口径待办，配合客户决策清单）"

sync:
  direction: matrix_to_bitable   # 只出站；禁止 inbound 回写
  mode: upsert                   # 主键 = 指标ID 列
  rate_limit_ms: 200
  batch_size: 100

# 数据来源文件（脚本按 glob 扫描）
sources:
  readiness_matrix_glob: agent-delivery/metrics/metric-readiness-matrix-*.yaml
  cfg_metric_seed_glob: agent-delivery/metrics/cfg_metric-*-seed.yaml
  gap_catalog_glob: agent-delivery/agent-handoffs/**/*data-gap-catalog.yaml

# Bitable 列名（脚本自动建列；改名须同步改此处）
field_names:
  metric_id: "指标ID"          # 主列（文本）
  metric_name: "指标名"
  module: "模块"               # 单选：E1 企业-评估 | E1 企业-其他 | E2 产业链 | E7 政策 | 科技动态 | 其他
  acceptance_unit: "验收单元"   # 文本（E-23 / C-xx 等，各域编号体系不同）
  readiness_assessed: "四维评估" # 单选：已评估 | 待评估
  def_status: "定义状态"        # 单选：已对齐 | 草案 | 未登记 | 待评估
  pending_ref: "开放项"         # 文本（Q014 等，甲方待办编号）
  schema_status: "结构支撑"     # 单选：就绪 | 部分 | 缺失 | 待评估
  schema_gap: "结构缺口"
  schema_assessed: "结构判定"   # 单选：初判 | 已核验 | —
  source_status: "源映射"       # 单选：齐备 | 部分缺口 | 无源 | 待ODS | 待评估
  source_gap: "源缺口"
  ingestion_status: "接入状态"  # 单选：Mock | 接入中 | 已接真
  ingestion_stages: "接入阶段"  # 文本：五阶段清单
  overall: "综合就绪"           # 单选（看板分组列）
  blocker_owner: "卡点责任方"
  update_freq: "更新频率"
  definition_summary: "口径摘要"
  gap_hint: "缺口说明"          # gap catalog pending_hint
  synced_at: "更新日期"

# 状态显示映射（内部枚举 → 看板选项文字）
display_maps:
  def_status: { aligned: "已对齐", draft: "草案", missing: "未登记", unassessed: "待评估" }
  schema_status: { ready: "就绪", partial: "部分", missing: "缺失", unassessed: "待评估" }
  schema_assessed: { provisional: "初判", verified: "已核验", none: "—" }
  source_status: { full: "齐备", partial: "部分缺口", none: "无源", pending_ods: "待ODS", unassessed: "待评估" }
  ingestion_status: { mock: "Mock", ingesting: "接入中", live: "已接真" }
  overall:
    unregistered: "未登记"
    no_source: "无数据源"
    pending_definition: "待口径确认"
    pending_algorithm: "待算法实现"
    pending_schema: "待结构设计"
    pending_source: "待数据源"
    mock_waiting: "待接入（Mock）"
    ingesting: "接入中"
    live: "可上线"
  stage_labels: { ods_synced: "源同步", dwd_loaded: "DWD", es_indexed: "ES", graph_loaded: "图谱", verified: "核验" }
  stage_status: { done: "✔", in_progress: "进行中", todo: "未开始", "n/a": "不适用" }

# 卡点责任方（按综合就绪推导；花名册见 team-roster.yaml）
blocker_owner_map:
  unregistered: "数据组（王惠）"
  no_source: "甲方/数据采购（PM 跟踪）"
  pending_definition: "口径（王惠）+ 甲方决策清单"
  pending_algorithm: "算法（唐绍祖）"
  pending_schema: "架构（徐滕强/李伟）"
  pending_source: "GDF（辜少彬）/ 甲方源侧"
  mock_waiting: "数据工厂（GDF 接入排期）"
  ingesting: "数据工厂（GDF）"
  live: "—"

# 模块显示名（矩阵 module 精确匹配优先，其次按 metric_id 前缀；未评估域统一标「待四维评估」）
module_map:
  ENT-EVAL: "E1 企业-评估（E-23/24/30）"
  default_by_prefix:
    M_ENT_: "E1 企业-其他（待四维评估）"
    M_CHAIN_: "E2 产业链（待四维评估）"
    M_POLICY_: "E7 政策（待四维评估）"
    M_TNIE_: "科技动态（待四维评估）"
  default: "其他"

# 首批范围（2026-08-01）：全部 cfg_metric 种子域 129 条
#   ENT 49（其中 EVAL 13 条带完整四维）· CHAIN 60 · POLICY 19 · TNIE 1
#   非 EVAL 条目按旧 mapping_status 降级投影，「四维评估」列标「待评估」；矩阵补齐后重跑即升级
