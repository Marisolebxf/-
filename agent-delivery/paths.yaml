# gkx-lumen 路径真源 — Coordinator / 各 Agent 会话均以此为准
# 与老版不同：所有路径基于 ${GKX_ROOT} 环境变量，便于跨 OS / 跨盘符 / 跨用户

version: 2
updated: "2026-06-19"
based_on: "RFC-002 §6"
supersedes: "v1 (E:/gkx_src 硬编码版)"

# ============================================================
# 路径解耦（必读）
# ============================================================
# 1. 用户在 .env 设置 GKX_ROOT，例：GKX_ROOT=${GKX_ROOT}
# 2. 所有 agent / script 通过 ${GKX_ROOT}/... 引用，禁止硬编码绝对路径
# 3. docs_root 通过 GKX_DOCS_ROOT 单独设置（保留人工档案的私有路径，不入 git）
# 4. 老根 (E:/gkx_src) 已废弃，进入 deprecation 期 (RFC-002 §8 M0-M6)

# ============================================================
# 工作区结构（相对 ${GKX_ROOT}）
# ============================================================
workspace:
  orchestration_dir: ${GKX_ROOT}/gkx-orchestration   # 编排主仓
  repos_dir: ${GKX_ROOT}/repos                       # 业务子仓挂载点
  worktrees_dir: ${GKX_ROOT}/worktrees               # worktree 集中区

# ============================================================
# 编排主仓内子目录（相对 orchestration_dir）
# ============================================================
orchestration:
  agent_delivery: agent-delivery
  cursor_rules: .cursor/rules
  knowledge_base: knowledge-base
  scripts: scripts
  hooks_template: .git-template/hooks

# ============================================================
# 业务子仓（相对 repos_dir，按 RFC-002 §7.3 新命名）
# 命名规约：{stage}-{layer}-{domain}[-{variant}]
#   stage  : demo / lumen
#   layer  : ui / svc / algo
#   domain : science / topic / platform / system-test / ent-analysis
#   variant: pc / mobile （仅前端用）
# ============================================================
repos:
  # demo 原型/演示仓（探索与验证阶段）
  demo-ui-science:          ${GKX_ROOT}/repos/demo-ui-science          # 老 demo2 - 科技信息展示系统前端 demo
  demo-algo-ent-analysis:   ${GKX_ROOT}/repos/demo-algo-ent-analysis   # 老 demo-algo-ent-analysis - 企业维度算法 demo
  demo-ui-system-test:      ${GKX_ROOT}/repos/demo-ui-system-test      # 老 demo-ui-system-test - 系统级实验前端
  demo-svc-platform:        ${GKX_ROOT}/repos/demo-svc-platform        # 老 demo-svc-platform - demo 环境后端
  demo-algo-science:        ${GKX_ROOT}/repos/demo-algo-science        # 老 demo-algo-science - 创新监测算法 demo
  demo-ui-topic:            ${GKX_ROOT}/repos/demo-ui-topic            # 老 demo-ui-topic - 科技专题服务前端 demo
  demo-svc-topic-py:        ${GKX_ROOT}/repos/demo-svc-topic-py        # 专题服务 Python demo（检索 /internal）

  # lumen 工程正式仓（稳定交付阶段）
  lumen-svc-platform:       ${GKX_ROOT}/repos/lumen-svc-platform       # 老 lumen-svc-platform - 后端 Java 微服务正式仓
  lumen-ui-science-pc:      ${GKX_ROOT}/repos/lumen-ui-science-pc      # 老 lumen-ui-science-pc - PC 前端正式仓
  lumen-ui-science-mobile:  ${GKX_ROOT}/repos/lumen-ui-science-mobile  # 展示系统小屏正式仓
  lumen-ui-topic-mobile:    ${GKX_ROOT}/repos/lumen-ui-topic-mobile    # 专题系统小屏正式仓（独立；禁写 lumen-ui-topic）
  lumen-ui-science-topic:   ${GKX_ROOT}/repos/lumen-ui-science-topic   # GitLab 正式 path；本地 clone 可能为 lumen-ui-topic
  lumen-ui-topic:           ${GKX_ROOT}/repos/lumen-ui-topic           # 本地 clone 别名 → 同仓 lumen-ui-science-topic
  lumen-ui-admin:           ${GKX_ROOT}/repos/lumen-ui-admin           # 运营管理后台前端（对接 gkxlumen-platform；对照 demo-admin-ui）
  demo-admin-ui:            ${GKX_ROOT}/repos/demo-admin-ui            # demo 管理后台（NodePort 30890；与 lumen-ui-admin 隔离）
  lumen-etl-es-py:          ${GKX_ROOT}/repos/lumen-etl-es-py          # DWD→ES ETL（enterprise_base→gkx_enterprise；NodePort 30806）
  lumen-algo-py:            ${GKX_ROOT}/repos/lumen-algo-py            # 正式 Python 算法（产业链已切；D12 正式下游）
  demo-ui-algo-apiview:     ${GKX_ROOT}/repos/demo-ui-algo-apiview     # 算法合规交付台（NodePort 30897；demo-platform-innov-py / entan-py）
  lumen-ui-algo-apiview:    ${GKX_ROOT}/repos/lumen-ui-algo-apiview    # 算法合理调试台（NodePort 30899；仅本台直连 gkxlumen-platform-*-py）
  lumen-topic-py:           ${GKX_ROOT}/repos/lumen-topic-py           # 正式专题检索/AI Python 门面（对照 demo-svc-topic-py；D12-DEBT-TOPIC-PY）

  # 开源工具 fork（不套命名规约，可不迁移；按 RFC-002 §7.3 例外）
  dataease:                 ${GKX_ROOT}/repos/dataease                 # 老 gkx_dataease - DataEase fork

# 已 archive 不迁移的仓（按 RFC-002 §13 Q4）
archived_in_old_root:
  - gkx_ui_demo              # 4 月以来零活跃，留老根 archive
  - gkx_demo_python          # 3 commits，已废弃

# ============================================================
# 编排资产快捷引用（相对 orchestration/agent_delivery）
# ============================================================
registry:
  task_queue:           agent-delivery/task-registry.yaml
  system_wbs:           agent-delivery/system-wbs.yaml
  repo_map:             agent-delivery/repo-registry.yaml
  architecture_baseline: agent-delivery/architecture-baseline.md
  scope_baseline:       agent-delivery/scope-baseline.yaml
  data_source_mapping:  agent-delivery/data-source-mapping-registry.yaml
  orchestration_roadmap: agent-delivery/orchestration-maturity-and-roadmap.md
  formal_docs:          agent-delivery/formal-docs-registry.yaml
  acceptance_authority: agent-delivery/acceptance-authority.yaml
  acceptance_catalog:   agent-delivery/acceptance-catalog
  demo_registry:        agent-delivery/demo-fallback-registry.yaml
  handoffs:             agent-delivery/agent-handoffs
  acceptance_docs:      agent-delivery/验收文档
  design_authority:     agent-delivery/Design.md          # 前端 UI 权威规范（D8）
  rfc_archive:          agent-delivery/RFC                # 含 RFC-001 (Superseded) + RFC-002 (Active)

# ============================================================
# 设计文档根（不复制大文件，仅引用；用户私有路径）
# 在 .env 单独设置 GKX_DOCS_ROOT
# ============================================================
docs_root:
  path_env: GKX_DOCS_ROOT
  req_analysis_dir: 2-概要设计/2-1需求分析

docs_paths:
  formal_dir:        5-实施和开发/详细设计/正式文件
  outline_design:    2-概要设计
  req_analysis:      2-概要设计/2-1需求分析
  req_csv:           2-概要设计/2-1需求分析/需求调研和澄清/csv
  req_srs:           2-概要设计/2-1需求分析/正式文件/需规-科技信息展示系统.md
  feature_list:      2-概要设计/2-1需求分析/需求调研和澄清/01-展示系统-功能全量清单.md
  innov_package:     2-概要设计/2-2概要设计/创新监测-开发承接包
  bid_pdfs_deprecated: 1-招投标需求    # PDF 仅归档，agent 禁止读

# ============================================================
# 环境与服务（dev）
# ============================================================
dev:
  k8s_namespace: zhipu-tts
  pc_frontend: http://10.50.69.111:30891             # lumen-pc.yaml nodePort
  topic_frontend: http://10.50.69.111:30892          # lumen-topic.yaml nodePort
  demo_ui_science_url: https://skxrules.unicomcn.tech:30999/   # demo-ui-science 演示环境
  etl_es_py: http://gkxlumen-platform-etl-es-py:8000  # 正式 in-cluster；demo NodePort 30806 随 CUTOVER 释放
  nebula_graphd: 10.50.75.136:9669               # TRSGraph graphd。口令不进 git（E-PLATFORM-P0-TRSGRAPH-L01）
  elasticsearch: http://10.50.11.76:9200          # 2026-10-19 环境切换后 ES（Basic Auth，口令不进 git；旧内网 ES 地址已停用）
  harbor: harbor.test.com/zp-tts
  gitlab_base: https://aminer-edu-gitlab.jyzhang.cn
  gitlab_group: sz-gkx/gkx-lumen
  gitlab_group_url: https://aminer-edu-gitlab.jyzhang.cn/sz-gkx/gkx-lumen

# ============================================================
# 老根迁移历史（M0-M6 期间保留索引，M6 后 archive）
# ============================================================
legacy:
  old_root: E:/gkx_src
  old_gitlab_group: https://gitlab.htmisoft.net/SZCGKX
  status: "deprecating (RFC-002 §8 M0-M6)"
  deprecation_trigger: "RFC-002 §8.3 触发条件 T1-T4 全部满足"
  deprecation_target_window: "2026-12-04 ± 2 weeks (default)"
  rename_map:                                      # 老名 → 新名（按 §7.3）
    demo2: demo-ui-science
    demo-algo-ent-analysis: demo-algo-ent-analysis
    gkx_dataease: dataease
    demo-ui-system-test: demo-ui-system-test
    lumen-svc-platform: lumen-svc-platform
    lumen-ui-science-pc: lumen-ui-science-pc
    lumen-ui-science-mobile: lumen-ui-science-mobile
    lumen-ui-topic-mobile: lumen-ui-topic-mobile
    lumen-ui-topic: lumen-ui-science-topic
    demo-svc-platform: demo-svc-platform
    demo-algo-science: demo-algo-science
    demo-ui-topic: demo-ui-topic

# ============================================================
# 路径解析约定（agent 必读）
# ============================================================
# ${GKX_ROOT}/gkx-orchestration/...          → 编排主仓
# ${GKX_ROOT}/repos/{repo-name}/...          → 业务代码
# ${GKX_ROOT}/worktrees/{repo}--{epic}/...   → AI 多 worktree 区
# ${GKX_DOCS_ROOT}/...                       → 读设计/招标
# 禁止：硬编码 E:/gkx_src（老）、E:/gkx-lumen（新）等绝对路径；必须用 ${GKX_ROOT} 占位符
