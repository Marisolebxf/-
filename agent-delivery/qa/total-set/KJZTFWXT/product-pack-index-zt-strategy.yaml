# 科技专题战略分析 · 功能清单 L5 → 产品定义八件套目录
# 八件套实践件：USM / TRACE / IA / Wireframe / UX-SPEC / METRIC-OPEN / data-gap / FUNC-DESIGN（有则用）
# 冲突策略：八件套与 demo-ui-topic 不一致时，以原型为准（路由/控件/导航）
version: "1.3"
pack_root: agent-handoffs/产品整体定义
conflict_policy: prototype_wins

