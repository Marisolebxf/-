# L6 名称 → 追加测试点（在 L5 壳基础上细化，避免只重复 L5/L6 标题）
l6_overlays:
  产业与企业类型筛选:
    points:
      - { 功能项: 产业范围, 子功能项: 顶部产业多选, 功能点: 顶部产业范围约束级联, 测试内容: 顶部产业变更后产业链选项同步收窄, 步骤: 1.登录测试环境\n2.进入侧栏「企业分析」→「重点企业类型分析」\n3.在顶部多选产业\n4.打开产业链选择, 预期: 1、产业链首级仅含已选产业\n2、超出范围的旧选项被清除\n3、指标与列表随产业刷新, 优先级: P0 }
      - { 功能项: 企业类型, 子功能项: 类型标签, 功能点: 外企高企小微上市四标签, 测试内容: 外企、高企、小微、上市均可勾选并生效, 步骤: 1.登录测试环境\n2.进入侧栏「企业分析」→「重点企业类型分析」\n3.在筛选区依次取消或勾选外企、高企、小微、上市\n4.点确认并观察指标与饼图, 预期: 1、仅选中类型参与统计\n2、未选类型时给出可解释空态或 0 值\n3、类型摘要显示当前选择, 优先级: P0 }
  三级地理透视与可视化呈现:
    points:
      - { 功能项: 地理下钻, 子功能项: 国家省市层级, 功能点: 三级地理透视切换, 测试内容: 从全国到省、市逐级下钻展示企业数量、规模、占比, 步骤: 1.登录测试环境\n2.进入侧栏「企业分析」→「重点企业类型分析」\n3.默认国家层，点「省级」\n4.再点「市级」, 预期: 1、地图与列表层级切换正确\n2、当前地理范围文案随层级变化\n3、非国家层时可返回上一级, 优先级: P0 }
      - { 功能项: 指标视图, 子功能项: 数量占比集聚指数, 功能点: 三类指标视图切换, 测试内容: 区域分布支持数量、占比、集聚指数三种视图, 步骤: 1.登录测试环境\n2.进入侧栏「企业分析」→「重点企业类型分析」\n3.在区域分布区切换「数量/占比/集聚指数」\n4.观察地图着色与列表列, 预期: 1、地图着色与当前指标一致\n2、列表排序列随视图可解释变化, 优先级: P1 }
  供应链图谱构建与多级下钻:
    points:
      - { 功能项: 供应链图谱, 子功能项: 多级下钻, 功能点: 节点逐层展开, 测试内容: 图谱展示供应商、客户、合作伙伴，支持点击节点展开, 步骤: 1.登录测试环境\n2.进入侧栏「企业分析」→「企业供应链关系分析」\n3.选择 1～2 家企业开始分析\n4.在图谱中点击节点展开, 预期: 1、节点可展开下一级关系\n2、展开后当前分析对象不丢失\n3、供应商/客户/合作伙伴筛选生效, 优先级: P0 }
