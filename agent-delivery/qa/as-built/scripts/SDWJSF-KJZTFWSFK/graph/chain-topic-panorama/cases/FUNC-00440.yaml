id: FUNC-00440
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00440
priority: P1
title: A/B/C 按 op_id 写入非法 dry_run
entry_id: chain.topic-panorama
tier: A
steps:
  - action: goto
    target: "#/chain/topic-panorama"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: A/B/C 按 op_id 写入
  - action: algo_fill
    set:
      dry_run: __invalid__
  - action: algo_run
expect:
  - note: message 或 msg 指出 dry_run，且不返回含 written_nodes 的成功业务 body
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/dry_run/.test(text)) throw new Error('结果未说明 dry_run');
      if (/written_nodes/.test(text)) throw new Error('结果含 written_nodes')
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。
