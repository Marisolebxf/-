id: FUNC-00548
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00548
priority: P1
title: B 关系边上图 POLICY_RE_CITE 不传 scope时返回指出该参数的错误说明
entry_id: policy.graph
tier: A
steps:
  - action: goto
    target: "#/policy/graph"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: "B 关系边上图 POLICY_RE_CITE"
  - action: algo_fill
    set:
      op_id: POLICY_RE_CITE
      filter: '{"policy_ids":["POL202200001","POL202200002"]}'
      relation_whitelist: '["cite"]'
      mode: rule
      dry_run: true
    omit: ['c']
  - action: algo_run
expect:
  - note: 1、返回面板 的 message 或 msg 指出 scope
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/scope/.test(text)) throw new Error('结果未说明 scope'); if (/written_edges/.test(text)) throw new Error('结果含 written_edges')
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=unavailable，断言仍按文档字段。不断言 sample 具体数字。
