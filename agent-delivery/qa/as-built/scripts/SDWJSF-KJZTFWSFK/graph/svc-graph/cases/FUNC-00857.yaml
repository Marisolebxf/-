id: FUNC-00857
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00857
priority: P0
title: 服务机构实体与关系接口信息清单
entry_id: svc.graph
tier: A
steps:
  - action: goto
    target: "#/industry-service/graph"
  - action: assert_visible
    target: "10 个接口"
  - action: assert_visible
    target: /entan/v1/svc/graph/ner
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: B 关系边上图 SVC_RE_SVC_SVC
expect:
  - note: 接口信息 tab 下拉 10 项；默认 ner POST；切换后 intra POST
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc/graph/intra');
      await expect(page.locator('.api-info-grid header')).toContainText('B 关系边上图 SVC_RE_SVC_SVC');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(10);
      for (const name of ["A 实体识别 SVC_NER_ORG", "B 关系边上图 SVC_RE_SVC_SVC", "C 产业 SVC_RE_INDUSTRY", "C 技术 SVC_RE_TECH", "C 企业 SVC_RE_ENTERPRISE", "C 政府 SVC_RE_GOV", "C 人才 SVC_RE_TALENT", "C 政策 SVC_RE_POLICY", "C 科研 SVC_RE_RESEARCH", "D 浏览 SVC_GRAPH_BROWSE"]) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 ner path，再切换 B 关系边上图。选项标题由 runner 在已打开弹层里点 .arco-select-option。
