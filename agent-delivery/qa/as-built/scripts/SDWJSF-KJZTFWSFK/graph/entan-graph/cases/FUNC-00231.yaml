priority: P1
title: C 产业 ENT_RE_INDUSTRY 非法 mode时返回指出该参数的错误说明
entry_id: entan.graph
tier: A
steps:
  - action: goto
    target: "#/entan/graph"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: "C 产业 ENT_RE_INDUSTRY"
  - action: algo_fill
    set:
      op_id: ENT_RE_INDUSTRY
      scope: one
      id: 7bfe8fcda027df3c6dd94674b804c75b
      mode: not-a-mode
      dry_run: true
      filter: '{"all":true}'
      dest_types: '["industry"]'
  - action: algo_run
expect:
  - note: 1、返回面板 的 message 或 msg 指出 mode 非法或无法解析
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/mode/.test(text)) throw new Error('结果未说明 mode'); if (/written_nodes/.test(text)) throw new Error('结果含 written_nodes')
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=unavailable，断言仍按文档字段。不断言 sample 具体数字。
