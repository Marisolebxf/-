id: FUNC-00304
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00304
priority: P1
title: D 浏览 ENT_GRAPH_BROWSE 非法 center时返回指出该参数的错误说明
entry_id: entan.graph
tier: A
steps:
  - action: goto
    target: #/entan/graph
  - action: algo_tab
    target: test
  - action: algo_pick
    target: "D 浏览 ENT_GRAPH_BROWSE"
  - action: algo_fill
    set:
      center: __invalid__
      hops: 1
      limit: 90
  - action: algo_run
expect:
  - note: 1、返回面板 的 message 或 msg 指出 center 非法或无法解析
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/center/.test(text)) throw new Error('结果未说明 center'); if (/nodes/.test(text)) throw new Error('结果含 nodes')
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=unavailable，断言仍按文档字段。不断言 sample 具体数字。
