    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/filter/.test(text)) throw new Error('结果未说明 filter'); if (/written_nodes/.test(text)) throw new Error('结果含 written_nodes')
