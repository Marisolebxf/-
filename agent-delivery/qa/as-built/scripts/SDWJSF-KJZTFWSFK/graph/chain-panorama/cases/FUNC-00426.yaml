id: FUNC-00426
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00426
priority: P0
title: 产业链全景接口信息清单
entry_id: chain.panorama
tier: A
steps:
  - action: goto
    target: "#/chain/panorama"
  - action: assert_visible
    target: "3 个接口"
  - action: assert_visible
    target: /chain/v1/chain/graph/ops/
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 全景图谱
expect:
  - note: 接口信息 tab 下拉 3 项；默认 ops POST；切换后全景图谱 GET panorama
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/chain/v1/chain/');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/panorama');
      await expect(page.locator('.api-info-grid header')).toContainText('全景图谱');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3);
      for (const name of ["A/B/C 按 op_id 写入","全景图谱","产业链全景模型"]) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 ops path，再切换全景图谱。选项标题由 runner 在已打开弹层里点 .arco-select-option。
