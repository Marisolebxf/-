id: FUNC-00425
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00425
priority: P1
title: 产业链全景模型缺 chainId
entry_id: chain.panorama
tier: A
steps:
  - action: goto
    target: "#/chain/panorama"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 产业链全景模型
  - action: algo_fill
    omit: [chainId, chain_id]
  - action: algo_run
expect:
  - note: message 或 msg 指出 chainId 缺失，且不返回含 metric_id 的成功业务 body
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/chainId/.test(text)) throw new Error('结果未说明 chainId');
      if (/metric_id/.test(text)) throw new Error('结果含 metric_id');
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=available，断言仍按文档字段。不断言 sample 具体数字。名称表无此 id，仍按用例写入 chain_id=INB1701。
