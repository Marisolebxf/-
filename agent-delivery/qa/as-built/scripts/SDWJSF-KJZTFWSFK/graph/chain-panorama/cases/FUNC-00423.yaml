id: FUNC-00423
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00423
priority: P1
title: 全景图谱缺 chainId
entry_id: chain.panorama
tier: A
steps:
  - action: goto
    target: "#/chain/panorama"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 全景图谱
  - action: algo_fill
    omit: [chainId]
  - action: algo_run
expect:
  - note: message 或 msg 指出 chainId 缺失，且不返回含 nodes 的成功业务 body
    assert: |-
      const tag = page.locator('.test-workbench .chain-cascader .arco-tag');
      if (await tag.count() && await tag.first().isVisible()) throw new Error('chainId 未清空');
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/chainId/.test(text)) throw new Error('结果未说明 chainId');
      if (/nodes/.test(text)) throw new Error('结果含 nodes');
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。
