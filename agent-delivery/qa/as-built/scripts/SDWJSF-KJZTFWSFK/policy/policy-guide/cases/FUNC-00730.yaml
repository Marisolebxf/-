id: FUNC-00730
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00730
priority: P0
title: 发展战略引导力接口信息清单
entry_id: policy.guide
tier: A
steps:
  - action: goto
    target: "#/policy/guide"
  - action: assert_visible
    target: 1 个接口
  - action: assert_visible
    target: /policy/v1/policy/analysis/guide
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 引导力
expect:
  - note: 接口信息 tab；下拉 1 项；GET /policy/v1/policy/analysis/guide 与文档一致
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/policy/analysis/guide');
      await expect(page.locator('.api-info-grid header')).toContainText('引导力');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(1);
      await expect(page.locator('.arco-trigger-popup:visible')).toContainText('引导力');
as_built_note: 页面清单，不用 algo_*，不点执行接口。单接口页下拉仅 1 项。选项标题由 runner 在已打开弹层里点 .arco-select-option。
