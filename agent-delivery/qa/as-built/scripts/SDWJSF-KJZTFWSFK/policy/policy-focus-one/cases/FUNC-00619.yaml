id: FUNC-00619
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00619
priority: P1
title: 单条焦点识别非法 execution FO1-09
entry_id: policy.focus-one
tier: A
steps:
  - action: goto
    target: "#/policy/focus-one"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 单条焦点识别
  - action: algo_fill
    set:
      execution: 0
  - action: algo_run
expect:
  - note: message 或 msg 指出 execution 非法，且不返回含 focus_list 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/execution/.test(text)) throw new Error('结果未说明 execution');
      if (/focus_list/.test(text) && /bottleneck_list/.test(text)) throw new Error('结果含 focus_list 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。execution=0（number，非 string）。catalog status=unavailable，反向断言仍按文档。
