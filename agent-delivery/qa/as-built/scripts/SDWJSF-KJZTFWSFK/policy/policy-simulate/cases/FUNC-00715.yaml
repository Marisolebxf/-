id: FUNC-00715
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00715
priority: P1
title: 效果推演非法 limit
entry_id: policy.simulate
tier: A
steps:
  - action: goto
    target: "#/policy/simulate"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 效果推演
  - action: algo_fill
    set:
      limit: -1
    omit: [scope_code, scenario_id]
  - action: algo_run
expect:
  - note: message 或 msg 指出 limit，且不返回含 simulated_value 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/limit/.test(text)) throw new Error('结果未说明 limit');
      if (/simulated_value/.test(text) && /baseline_value/.test(text)) throw new Error('结果含 simulated_value 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。limit=-1。catalog status=unavailable。
