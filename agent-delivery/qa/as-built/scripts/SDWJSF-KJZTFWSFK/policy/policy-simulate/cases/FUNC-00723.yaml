id: FUNC-00723
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00723
priority: P0
title: 效果推演实施路径接口信息清单
entry_id: policy.simulate
tier: A
steps:
  - action: goto
    target: "#/policy/simulate"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /policy/v1/policy/simulate
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 政策效果推演
expect:
  - note: 接口信息 tab；2 项下拉；默认效果推演 GET simulate；切换后 POST M_POLICY_SIMULATE/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/polan/metric/M_POLICY_SIMULATE/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('政策效果推演');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['效果推演', '政策效果推演']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认效果推演 GET path，再切换政策效果推演。选项标题由 runner 在已打开弹层里点 .arco-select-option。
