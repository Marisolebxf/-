priority: P1
title: 后端模型非法 scope_code
entry_id: policy.deep
tier: A
steps:
  - action: goto
    target: "#/policy/deep"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 后端模型
  - action: algo_fill
    set:
      scope_code: __invalid__
      limit: 50
  - action: algo_run
expect:
  - note: message 或 msg 指出 scope_code，且不返回含 model、model_name、metric_id、index 的成功业务 rows
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/scope_code/.test(text)) throw new Error('结果未说明 scope_code');
      if (/model_name/.test(text) && /metric_id/.test(text) && /\bindex\b/.test(text)) throw new Error('结果含 model 成功业务 rows');
as_built_note: 用例写点击调用，页面按钮是执行接口。scope_code=__invalid__，limit=50。catalog status=unavailable。
