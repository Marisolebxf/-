id: FUNC-00698
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00698
priority: P1
title: 政策匹配非法 subject_type
entry_id: policy.match
tier: A
steps:
  - action: goto
    target: "#/policy/match"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 政策匹配
  - action: algo_fill
    omit: [subject_id]
    set:
      subject_type: __invalid__
      limit: 20
  - action: algo_run
expect:
  - note: message 或 msg 指出 subject_type，且不返回含 match_score 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/subject_type/.test(text)) throw new Error('结果未说明 subject_type');
      if (/match_score/.test(text) && /policy_title/.test(text)) throw new Error('结果含 match_score 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。subject_type=__invalid__（枚举外）。catalog status=unavailable。
