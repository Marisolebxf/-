id: FUNC-00707
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00707
priority: P0
title: 匹配推送接口信息清单
entry_id: policy.match
tier: A
steps:
  - action: goto
    target: "#/policy/match"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /policy/v1/policy/match
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 政策匹配推送
expect:
  - note: 接口信息 tab；下拉 2 项；默认政策匹配 GET /policy/v1/policy/match；切换政策匹配推送 POST M_POLICY_MATCH/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/polan/metric/M_POLICY_MATCH/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('政策匹配推送');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['政策匹配', '政策匹配推送']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认政策匹配 path，再切换政策匹配推送。选项标题由 runner 在已打开弹层里点 .arco-select-option。
