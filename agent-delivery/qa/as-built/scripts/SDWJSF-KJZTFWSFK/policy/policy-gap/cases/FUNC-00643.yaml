id: FUNC-00643
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00643
priority: P1
title: 短板分析非法 limit
entry_id: policy.gap
tier: A
steps:
  - action: goto
    target: "#/policy/gap"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 短板分析
  - action: algo_fill
    set:
      limit: -1
    omit: [scope_code]
  - action: algo_run
expect:
  - note: message 或 msg 指出 limit，且不返回含 shortboard_cnt 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/limit/.test(text)) throw new Error('结果未说明 limit');
      if (/shortboard_cnt/.test(text) && /scope_name/.test(text)) throw new Error('结果含 shortboard_cnt 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。limit=-1。catalog status=unavailable。
