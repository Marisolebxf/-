id: FUNC-00691
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00691
priority: P0
title: 文本解析·智能摘要接口信息清单
entry_id: policy.parse
tier: A
steps:
  - action: goto
    target: "#/policy/parse"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /policy/v1/policy/text/parse
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 政策文本解析
expect:
  - note: 接口信息 tab；2 项下拉；默认文本解析 GET text/parse；切换后 POST M_POLICY_TEXT_PARSE/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/polan/metric/M_POLICY_TEXT_PARSE/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('政策文本解析');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['文本解析', '政策文本解析']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认文本解析 path，再切换政策文本解析。选项标题由 runner 在已打开弹层里点 .arco-select-option。
