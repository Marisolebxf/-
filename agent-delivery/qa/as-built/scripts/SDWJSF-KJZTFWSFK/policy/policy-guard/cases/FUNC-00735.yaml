id: FUNC-00735
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00735
priority: P1
title: 保障力非法 scope_code
entry_id: policy.guard
tier: A
steps:
  - action: goto
    target: "#/policy/guard"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 保障力
  - action: algo_fill
    set:
      scope_code: __invalid__
      limit: 20
  - action: algo_run
expect:
  - note: message 或 msg 指出 scope_code，且不返回含 effect_score 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/scope_code/.test(text)) throw new Error('结果未说明 scope_code');
      if (/effect_score/.test(text) && /scope_name/.test(text)) throw new Error('结果含 effect_score 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。scope_code=__invalid__。catalog status=unavailable。
