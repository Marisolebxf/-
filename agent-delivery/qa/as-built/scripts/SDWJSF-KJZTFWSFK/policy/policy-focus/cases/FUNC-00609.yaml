id: FUNC-00609
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00609
priority: P0
title: 政策焦点识别接口信息清单
entry_id: policy.focus
tier: A
steps:
  - action: goto
    target: "#/policy/focus"
  - action: assert_visible
    target: 1 个接口
  - action: assert_visible
    target: /policy/v1/policy/analysis/focus
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 焦点识别
expect:
  - note: 接口信息 tab；下拉 1 项；GET /policy/v1/policy/analysis/focus 与文档一致
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/policy/analysis/focus');
      await expect(page.locator('.api-info-grid header')).toContainText('焦点识别');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(1);
      await expect(page.locator('.arco-trigger-popup:visible')).toContainText('焦点识别');
as_built_note: 页面清单，不用 algo_*，不点执行接口。单接口页下拉仅 1 项。选项标题由 runner 在已打开弹层里点 .arco-select-option。
