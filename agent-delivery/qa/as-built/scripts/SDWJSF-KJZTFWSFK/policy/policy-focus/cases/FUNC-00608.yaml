id: FUNC-00608
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00608
priority: P1
title: 焦点识别非法 limit
entry_id: policy.focus
tier: A
steps:
  - action: goto
    target: "#/policy/focus"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 焦点识别
  - action: algo_fill
    set:
      policy_id: POL_SZ_IC
      region_code: "440300"
      limit: "-1"
  - action: algo_run
expect:
  - note: message 或 msg 指出 limit 非法，且无 focus_score 成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/limit/.test(text)) throw new Error('结果未说明 limit');
      if (/focus_score/.test(text)) throw new Error('结果含 focus_score 成功业务 body');
as_built_note: 用例写点击调用，页面按钮是执行接口。limit=-1。catalog status=unavailable。
