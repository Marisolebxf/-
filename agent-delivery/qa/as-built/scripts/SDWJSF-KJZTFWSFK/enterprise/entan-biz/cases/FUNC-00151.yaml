id: FUNC-00151
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00151
priority: P0
title: 企业商业力评估接口信息清单
entry_id: entan.biz
tier: A
steps:
  - action: goto
    target: "#/entan/biz"
  - action: assert_visible
    target: 4 个接口
  - action: assert_visible
    target: /entan/v1/entan/metric/M_ENT_BUSINESS_POWER_SCORE/compute
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 商业力详情
expect:
  - note: 接口信息 tab 下拉 4 项；切换后商业力详情 GET /entan/v1/biz-power/{orgId}
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/biz-power/{orgId}');
      await expect(page.locator('.api-info-grid header')).toContainText('商业力详情');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(4);
      for (const name of ['企业商业力得分（企业集合）', '商业力详情', '模型权重', '评估报告']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息，步骤 assert_visible 确认企业商业力得分 path，再切换商业力详情。选项标题由 runner 在已打开弹层里点 .arco-select-option。
