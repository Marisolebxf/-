id: FUNC-00148
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00148
priority: P1
title: 模型权重缺 model
entry_id: entan.biz
tier: A
steps:
  - action: goto
    target: "#/entan/biz"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 模型权重
  - action: algo_fill
    omit: [model]
  - action: algo_run
expect:
  - note: message 或 msg 说明缺少 model，且不返回含 weight 的成功结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/model/.test(text)) throw new Error('结果未说明 model');
      if (/weight/.test(text) && /name_zh/.test(text)) throw new Error('结果含 weight 成功态');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 model。catalog_status=unavailable，反向断言仍按文档。
