id: FUNC-00340
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00340
priority: P0
title: 企业成长与产业匹配接口信息清单
entry_id: entan.growth-match
tier: A
steps:
  - action: goto
    target: "#/entan/growth-match"
  - action: assert_visible
    target: 4 个接口
  - action: assert_visible
    target: /entan/v1/entan/metric/M_ENT_GROWTH_POTENTIAL/compute
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 产业匹配度（企业集合）
expect:
  - note: 接口信息 tab 下拉 4 项；默认成长潜力 POST；切换后产业匹配度 POST
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/entan/metric/M_ENT_INDUSTRY_MATCH_SCORE/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('产业匹配度（企业集合）');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(4);
      for (const name of ['成长潜力（企业集合）', '产业匹配度（企业集合）', 'M_ENT_AGGLOMERATION_INDEX', 'M_ENT_DS_07_INDUSTRY_POTENTIAL_006']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息，步骤 assert_visible 确认成长潜力 path。选项标题由 runner 在已打开弹层里点 .arco-select-option。
