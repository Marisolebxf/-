id: FUNC-00335
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00335
priority: P1
title: 产业匹配度（企业集合）缺 enterprise_codes
entry_id: entan.growth-match
tier: A
steps:
  - action: goto
    target: "#/entan/growth-match"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 产业匹配度（企业集合）
  - action: algo_fill
    omit: [enterprise_codes]
  - action: algo_run
expect:
  - note: message 或 msg 说明缺少 enterprise_codes，且不返回 M_ENT_INDUSTRY_MATCH_SCORE 带 value 的成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/enterprise_codes/.test(text)) throw new Error('结果未说明 enterprise_codes');
      if (/M_ENT_INDUSTRY_MATCH_SCORE/.test(text) && /metric_name_zh/.test(text) && /"value"/.test(text)) throw new Error('结果含 M_ENT_INDUSTRY_MATCH_SCORE 且带 value 的成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 enterprise_codes。catalog_status=unavailable。
