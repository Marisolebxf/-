id: FUNC-00106
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00106
priority: P0
title: 深圳企业竞争力水平分析接口信息清单
entry_id: entan.competitiveness
tier: A
steps:
  - action: goto
    target: "#/entan/competitiveness"
  - action: assert_visible
    target: 3 个接口
  - action: assert_visible
    target: /entan/v1/entan/metric/M_ENT_COMPETITIVENESS_SCORE/compute
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 深圳企业竞争力排名（企业集合）
expect:
  - note: 接口信息 tab；下拉 3 项与 catalog 一致；默认与切换后 path 符合文档
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true')
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST')
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/entan/metric/M_ENT_COMPETITIVENESS_SCORE/compute')
      await expect(page.locator('.api-info-grid header')).toContainText('深圳企业竞争力排名（企业集合）')
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click()
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3)
      for (const name of ['深圳企业竞争力水平分析（企业集合）','深圳企业竞争力排名（企业集合）','多城市企业群对标值']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name)
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息，步骤先确认默认项 path，再切换排名接口。选项标题由 runner 在已打开弹层里点 .arco-select-option。
