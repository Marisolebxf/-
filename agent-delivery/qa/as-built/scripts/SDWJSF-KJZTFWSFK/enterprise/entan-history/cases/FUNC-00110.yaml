id: FUNC-00110
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00110
priority: P1
title: 企业搜索非法 limit
entry_id: entan.history
tier: A
steps:
  - action: goto
    target: "#/entan/history"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 企业搜索
  - action: algo_fill
    set: { keyword: 测试, limit: -1 }
  - action: algo_run
expect:
  - note: 结果或错误说明出现 limit，且不出现 enterprise_name 成功命中形态
    assert: "const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/limit/.test(text)) throw new Error('结果未说明 limit'); if (/enterprise_name/.test(text) && /org_id/.test(text)) throw new Error('结果含可信命中列表字段')"
as_built_note: 用例写点击调用，页面按钮是执行接口。limit=-1。结果须说明 limit，且不得返回含 org_id 与 enterprise_name 的成功命中列表。
