id: FUNC-00115
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00115
priority: P0
title: 企业发展历程接口信息清单
entry_id: entan.history
tier: A
steps:
  - action: goto
    target: "#/entan/history"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /entan/v1/enterprises
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 发展历程
expect:
  - note: 接口信息 tab；2 项下拉；默认企业搜索 GET /entan/v1/enterprises；切换后 GET /entan/v1/history
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true')
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET')
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/history')
      await expect(page.locator('.api-info-grid header')).toContainText('发展历程')
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click()
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2)
      for (const name of ['企业搜索', '发展历程']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name)
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认企业搜索 path，再切换发展历程。选项标题由 runner 在已打开弹层里点 .arco-select-option。
