    assert: |-
      await expect(page.locator('.test-workbench .test-source')).toContainText('GET');
      await expect(page.locator('.test-workbench .test-source')).toContainText('/entan/v1/enterprises/{orgId}/report');
      await expect(page.locator('.test-workbench .tab-endpoint-select .arco-select-view')).toContainText('评估报告');
      await page.locator('.test-workbench .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(5);
      for (const name of ['企业技术力得分（企业集合）', '技术力详情', '模型权重', '评估报告', '技术影响力评估']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
