id: FUNC-00141
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00141
priority: P0
title: 企业技术力评估接口信息清单
entry_id: entan.tech
tier: A
steps:
  - action: goto
    target: "#/entan/tech"
  - action: assert_visible
    target: 5 个接口
  - action: assert_visible
    target: /entan/v1/entan/metric/M_ENT_TECH_POWER_SCORE/compute
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 技术力详情
expect:
  - note: 接口信息 tab 下拉 5 项；默认得分 POST compute；切换后详情 GET /entan/v1/tech-power/{orgId}
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/tech-power/{orgId}');
      await expect(page.locator('.api-info-grid header')).toContainText('技术力详情');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(5);
      for (const name of ['企业技术力得分（企业集合）', '技术力详情', '模型权重', '评估报告', '技术影响力评估']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认企业技术力得分 path，再切换技术力详情。选项标题由 runner 在已打开弹层里点 .arco-select-option。
