id: FUNC-00321
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00321
priority: P1
title: 创新能力指数（企业集合）缺 enterprise_codes
entry_id: entan.innovation
tier: A
steps:
  - action: goto
    target: "#/entan/innovation"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 创新能力指数（企业集合）
  - action: algo_fill
    set: {}
    omit: [enterprise_codes]
  - action: algo_run
expect:
  - note: message 或 msg 说明缺少 enterprise_codes，且不返回含 innovation_index 的成功业务 enterprises 列表
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/enterprise_codes/.test(text)) throw new Error('结果未说明 enterprise_codes');
      if (/innovation_index/.test(text) && /enterprises/.test(text)) throw new Error('结果含 innovation_index 与 enterprises 成功态');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 enterprise_codes。catalog_status=unavailable，反向断言仍按文档。
