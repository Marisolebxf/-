id: FUNC-00118
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00118
priority: P1
title: 企业发展痛难点反映企业数缺 enterprise_codes
entry_id: entan.pain-points
tier: A
steps:
  - action: goto
    target: "#/entan/pain-points"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 企业发展痛难点反映企业数（企业集合）
  - action: algo_fill
    omit: [enterprise_codes]
  - action: algo_run
expect:
  - note: message 或 msg 说明缺少 enterprise_codes，且不返回含 value.count 与 dimension_cards 的成功结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/enterprise_codes/.test(text)) throw new Error('结果未说明 enterprise_codes');
      if (/dimension_cards/.test(text) && /"count"/.test(text)) throw new Error('结果含 value.count 与 dimension_cards 成功态');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 enterprise_codes。catalog status=unavailable，反向断言仍按文档。
