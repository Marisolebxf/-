id: FUNC-00122
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00122
priority: P1
title: 痛难点改进差距缺 enterprise_codes
entry_id: entan.pain-points
tier: A
steps:
  - action: goto
    target: "#/entan/pain-points"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 痛难点改进差距
  - action: algo_fill
    omit: [enterprise_codes]
  - action: algo_run
expect:
  - note: message 或 msg 说明缺少 enterprise_codes，且不返回含 metric_id 与 dimension_cards 的成功结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/enterprise_codes/.test(text)) throw new Error('结果未说明 enterprise_codes');
      if (/metric_id/.test(text) && /dimension_cards/.test(text)) throw new Error('结果含 metric_id 与 dimension_cards 成功态');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 enterprise_codes。
