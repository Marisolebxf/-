id: FUNC-01042
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01042
priority: P1
title: 政策成果评价非法 year
entry_id: comp.policy-outcome
tier: A
steps:
  - action: goto
    target: "#/industry-comp/policy-outcome"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 政策成果评价
  - action: algo_fill
    set:
      region: "440300"
      year: -1
  - action: algo_run
expect:
  - note: 结果说明 year 非法，且无 index、rows 成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/year/.test(text)) throw new Error('结果未说明 year');
      if (/index/.test(text) && /rows/.test(text) && /rank/.test(text) && /yoy/.test(text)) throw new Error('结果含 index 或 rows 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。year=-1。catalog status=unavailable，不断言 sample 具体数字。文档标记未交付。
