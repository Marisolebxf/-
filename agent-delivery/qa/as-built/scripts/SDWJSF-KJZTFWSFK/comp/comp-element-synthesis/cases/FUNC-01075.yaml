priority: P1
title: 要素贡献度与影响路径非法 region
entry_id: comp.element-synthesis
tier: A
steps:
  - action: goto
    target: "#/industry-comp/element-synthesis"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 要素贡献度与影响路径
  - action: algo_fill
    set:
      region: __invalid__
  - action: algo_run
expect:
  - note: 结果说明 region 非法，且无 metric_id、index 成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/region/.test(text)) throw new Error('结果未说明 region');
      if (/metric_id/.test(text) && /index/.test(text)) throw new Error('结果含 metric_id 或 index 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。region=__invalid__。catalog status=available。组合 ECON-03。
