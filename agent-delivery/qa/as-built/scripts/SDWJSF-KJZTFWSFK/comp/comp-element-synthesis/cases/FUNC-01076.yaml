id: FUNC-01076
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01076
priority: P0
title: 区域创新要素综合分析接口信息清单
entry_id: comp.element-synthesis
tier: A
steps:
  - action: goto
    target: "#/industry-comp/element-synthesis"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /comp/v1/comp/element-synthesis
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 要素贡献度与影响路径
expect:
  - note: 接口信息 tab；2 项下拉；切换后 POST M_SYNTH_ELEM_CONTRIB/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/synth-metric/metric/M_SYNTH_ELEM_CONTRIB/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('要素贡献度与影响路径');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['要素综合', '要素贡献度与影响路径']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '要素综合' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/comp/v1/comp/element-synthesis');
      await expect(page.locator('.api-info-grid header')).toContainText('要素综合');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 element-synthesis path，再切换要素贡献度与影响路径；assert 内再核要素综合默认 GET path。
