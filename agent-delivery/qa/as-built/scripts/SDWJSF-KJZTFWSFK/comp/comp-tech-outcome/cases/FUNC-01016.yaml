id: FUNC-01016
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01016
priority: P1
title: 区域科技创新成果综合评价模型非法 year
entry_id: comp.tech-outcome
tier: A
steps:
  - action: goto
    target: "#/industry-comp/tech-outcome"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 区域科技创新成果综合评价模型
  - action: algo_fill
    set:
      region: "440300"
      year: -1
  - action: algo_run
expect:
  - note: 结果说明 year 非法，且无 metric_id、index 成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/year/.test(text)) throw new Error('结果未说明 year');
      if (/metric_id/.test(text) && /index/.test(text)) throw new Error('结果含 metric_id 或 index 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。year=-1。catalog status=available。
