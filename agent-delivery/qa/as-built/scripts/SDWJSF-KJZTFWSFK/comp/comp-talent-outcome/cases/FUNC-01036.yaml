id: FUNC-01036
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01036
priority: P0
title: 区域产业创新人才综合评价接口信息清单
entry_id: comp.talent-outcome
tier: A
steps:
  - action: goto
    target: "#/industry-comp/talent-outcome"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /comp/v1/comp/region-talent-outcome
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 区域产业创新人才综合评价模型
expect:
  - note: 接口信息 tab；2 项下拉；切换后 POST M_SYNTH_184_1/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/synth-metric/metric/M_SYNTH_184_1/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('区域产业创新人才综合评价模型');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['人才成果评价', '区域产业创新人才综合评价模型']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人才成果评价' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/comp/v1/comp/region-talent-outcome');
      await expect(page.locator('.api-info-grid header')).toContainText('人才成果评价');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 region-talent-outcome path，再切换区域产业创新人才综合评价模型；assert 内再核人才成果评价默认 GET path。
