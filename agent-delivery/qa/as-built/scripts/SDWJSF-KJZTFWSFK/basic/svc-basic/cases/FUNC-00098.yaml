priority: P0
title: 服务机构基础指标接口信息清单
entry_id: svc.basic
tier: A
steps:
  - action: goto
    target: "#/industry-service/basic"
  - action: assert_visible
    target: 6 个接口
  - action: assert_visible
    target: /entan/v1/svc/indicators
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 全球服务机构产业布局
expect:
  - note: 接口信息页签；切换后概览为全球服务机构产业布局 GET /entan/v1/svc/indicators；下拉 6 项
    assert: "await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true'); await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET'); await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc/indicators'); await expect(page.locator('.api-info-grid header')).toContainText('全球服务机构产业布局'); await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click(); await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(6); for (const name of ['服务机构基础指标（全维度）','全球服务机构产业布局','全球服务机构分布','投融资动态资讯','新增服务机构动态','深圳服务机构规模及分布']) { await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name); }"
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息，步骤切换至全球服务机构产业布局。
