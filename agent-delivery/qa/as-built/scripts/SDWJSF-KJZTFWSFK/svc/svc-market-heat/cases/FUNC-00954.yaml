id: FUNC-00954
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00954
priority: P0
title: 市场热度评级接口信息清单
entry_id: svc.market-heat
tier: A
steps:
  - action: goto
    target: "#/industry-service/market-heat"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /entan/v1/svc/market-heat
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 市场热度评级
expect:
  - note: 接口信息 tab；2 项下拉；切换后 POST M_SVC_ORG_MARKET_HEAT/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc-metric/metric/M_SVC_ORG_MARKET_HEAT/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('市场热度评级');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['市场热度', '市场热度评级']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '市场热度' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc/market-heat');
      await expect(page.locator('.api-info-grid header')).toContainText('市场热度');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 market-heat path，再切换市场热度评级；assert 内再核市场热度默认 GET path。
