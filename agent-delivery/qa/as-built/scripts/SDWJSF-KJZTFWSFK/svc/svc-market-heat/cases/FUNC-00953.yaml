id: FUNC-00953
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00953
priority: P1
title: 市场热度评级非法 industry
entry_id: svc.market-heat
tier: A
steps:
  - action: goto
    target: "#/industry-service/market-heat"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 市场热度评级
  - action: algo_fill
    set: { industry: __invalid__ }
  - action: algo_run
expect:
  - note: 结果说明 industry 非法，且不返回 M_SVC_ORG_MARKET_HEAT 成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/industry/.test(text)) throw new Error('结果未说明 industry');
      if (/M_SVC_ORG_MARKET_HEAT/.test(text) && /hint/.test(text)) throw new Error('结果含 M_SVC_ORG_MARKET_HEAT 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。industry=__invalid__。catalog status=available。
