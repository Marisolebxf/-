id: FUNC-00946
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00946
priority: P0
title: 服务机构培育推荐接口信息清单
entry_id: svc.cultivate
tier: A
steps:
  - action: goto
    target: "#/industry-service/cultivate"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /entan/v1/svc/models
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 服务机构培育推荐模型
expect:
  - note: 接口信息 tab；2 项下拉；切换后 POST M_SVC_DEEP_181_1/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc-metric/metric/M_SVC_DEEP_181_1/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('服务机构培育推荐模型');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['培育推荐', '服务机构培育推荐模型']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /^\s*培育推荐\s*$/ }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc/models');
      await expect(page.locator('.api-info-grid header')).toContainText('培育推荐');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 models path，再切换服务机构培育推荐模型；assert 内再核培育推荐默认 GET path。
