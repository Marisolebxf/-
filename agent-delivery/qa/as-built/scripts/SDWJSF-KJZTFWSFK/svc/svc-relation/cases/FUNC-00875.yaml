id: FUNC-00875
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00875
priority: P1
title: 关系链图谱非法 limit
entry_id: svc.relation
tier: A
steps:
  - action: goto
    target: "#/industry-service/relation"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 关系链图谱
  - action: algo_fill
    set: { limit: -1 }
  - action: algo_run
expect:
  - note: message 或 msg 指出 limit，且不返回含 nodes、edges 的成功结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/limit/.test(text)) throw new Error('结果未说明 limit');
      if (/\bnodes\b/.test(text) && /\bedges\b/.test(text)) throw new Error('结果含 nodes edges 成功结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。limit=-1。catalog status=unavailable，不断言 sample 具体数字。文档标记未交付。
