id: FUNC-00868
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00868
priority: P0
title: 服务链短板分析接口信息清单
entry_id: svc.gap
tier: A
steps:
  - action: goto
    target: "#/industry-service/gap"
  - action: assert_visible
    target: 3 个接口
  - action: assert_visible
    target: /entan/v1/svc/models
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 服务机构产业领域覆盖评分
expect:
  - note: 接口信息 tab；下拉 3 项；默认 models；切换覆盖评分与短板分析模型 path
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc-metric/metric/M_SVC_ORG_COVERAGE_DEPTH/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('服务机构产业领域覆盖评分');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3);
      for (const name of ['服务链短板', '服务机构产业领域覆盖评分', '服务链短板分析模型']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '服务链短板' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc/models');
      await expect(page.locator('.api-info-grid header')).toContainText('服务链短板');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '服务链短板分析模型' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc-metric/metric/M_SVC_DEEP_172_1/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('服务链短板分析模型');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 models path，再切换服务机构产业领域覆盖评分；assert 内再核服务链短板默认项与服务链短板分析模型 path。
