id: FUNC-00898
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00898
priority: P0
title: 知识产权服务机构技术力评估接口信息清单
entry_id: svc.tech-ip
tier: A
steps:
  - action: goto
    target: "#/industry-service/tech-ip"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /entan/v1/svc/models
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 知识产权服务机构技术力评价模型
expect:
  - note: 接口信息 tab；2 项下拉；切换后 POST M_SVC_DEEP_175_1/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc-metric/metric/M_SVC_DEEP_175_1/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('知识产权服务机构技术力评价模型');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['知识产权技术力', '知识产权服务机构技术力评价模型']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '知识产权技术力' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc/models');
      await expect(page.locator('.api-info-grid header')).toContainText('知识产权技术力');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 models path，再切换知识产权服务机构技术力评价模型；assert 内再核知识产权技术力默认 GET path。
