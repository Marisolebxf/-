id: FUNC-00962
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00962
priority: P0
title: 深圳梯队位置接口信息清单
entry_id: svc.sz-tier
tier: A
steps:
  - action: goto
    target: "#/industry-service/sz-tier"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /entan/v1/svc/sz-tier
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 深圳梯队位置
expect:
  - note: 接口信息 tab；2 项下拉；切换后 POST M_SVC_SZ_TIER/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc-metric/metric/M_SVC_SZ_TIER/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('深圳梯队位置');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['深圳梯队', '深圳梯队位置']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /^\s*深圳梯队\s*$/ }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/entan/v1/svc/sz-tier');
      await expect(page.locator('.api-info-grid header')).toContainText('深圳梯队');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 sz-tier path，再切换深圳梯队位置；assert 内再核深圳梯队默认 GET path。
