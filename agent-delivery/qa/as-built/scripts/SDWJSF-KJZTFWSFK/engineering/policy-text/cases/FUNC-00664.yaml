id: FUNC-00664
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00664
priority: P1
title: 文本解析非法 limit
entry_id: policy.text
tier: A
steps:
  - action: goto
    target: "#/policy/text"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 文本解析
  - action: algo_fill
    set:
      limit: not_a_number
    omit: [policy_id]
  - action: algo_run
expect:
  - note: message 或 msg 指出 limit，且不返回含 title 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/limit/.test(text)) throw new Error('结果未说明 limit');
      if (/title/.test(text) && /elements/.test(text)) throw new Error('结果含 title 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。limit=not_a_number，omit policy_id。catalog status=unavailable。
