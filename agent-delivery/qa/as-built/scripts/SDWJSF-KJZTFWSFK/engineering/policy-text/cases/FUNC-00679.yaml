id: FUNC-00679
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00679
priority: P0
title: 政策文本处理接口信息清单
entry_id: policy.text
tier: A
steps:
  - action: goto
    target: "#/policy/text"
  - action: assert_visible
    target: 3 个接口
  - action: assert_visible
    target: /policy/v1/policy/text/parse
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 政策匹配
expect:
  - note: 接口信息 tab；下拉 3 项；默认文本解析 GET parse；切换政策匹配、效果推演 path 刷新
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/policy/match');
      await expect(page.locator('.api-info-grid header')).toContainText('政策匹配');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3);
      for (const name of ['文本解析', '政策匹配', '效果推演']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '文本解析' }).click();
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/policy/text/parse');
      await expect(page.locator('.api-info-grid header')).toContainText('文本解析');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '效果推演' }).click();
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/policy/v1/policy/simulate');
      await expect(page.locator('.api-info-grid header')).toContainText('效果推演');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 parse path，再切换政策匹配；assert 内再核文本解析默认项与效果推演 path。选项标题由 runner 在已打开弹层里点 .arco-select-option。
