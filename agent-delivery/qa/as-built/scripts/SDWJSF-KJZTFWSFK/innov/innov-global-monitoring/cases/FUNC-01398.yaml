id: FUNC-01398
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01398
priority: P0
title: 全球创新监测接口信息清单
entry_id: innov.global-monitoring
tier: A
steps:
  - action: goto
    target: "#/innov/global-monitoring"
  - action: assert_visible
    target: 18 个接口
  - action: assert_visible
    target: /innov/v1/innov/metrics
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 创新价值
expect:
  - note: 接口信息 tab；下拉 18 项；默认 metrics GET；切换创新价值 POST compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metrics');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '创新价值' }).first().click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metric/M_INNOV_ACHIEVE_VALUE/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('创新价值');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(18);
      for (const name of ['全球创新监测指标清单', '创新价值', '创新载体创新能力指数', '创新影响预测', '创新影响分数', '创新点发现', '创新点价值评估', '创新价值', '创新能力指数', '创新点发现', '创新价值评估', '创新影响分数', '创新影响预测', '创新载体多维度排名', '城市对标分析', '城市创新能力要素表现', '城市创新能力排名', '多维度排名展示']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。同名 title 下拉点第一项创新价值（M_INNOV_ACHIEVE_VALUE）。场景=接口信息-清单。
