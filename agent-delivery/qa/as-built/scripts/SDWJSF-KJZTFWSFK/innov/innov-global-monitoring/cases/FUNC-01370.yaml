id: FUNC-01370
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01370
priority: P1
title: 创新能力指数
entry_id: innov.global-monitoring
tier: A
steps:
  - action: goto
    target: "#/innov/global-monitoring"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 创新能力指数
  - action: algo_fill
    set:
      module: __invalid__
  - action: algo_run
expect:
  - note: 结果说明 module 非法
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/module/.test(text)) throw new Error('结果未说明 module');
      if (/metric_id/.test(text) && /hint/.test(text)) throw new Error('结果含 metric_id、hint 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=available。不断言 sample 具体数字。组合 CR1-03。
