id: FUNC-01477
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01477
priority: P0
title: 湾区创新监测接口信息清单
entry_id: innov.bay-area-monitoring
tier: A
steps:
  - action: goto
    target: "#/innov/bay-area-monitoring"
  - action: assert_visible
    target: 17 个接口
  - action: assert_visible
    target: /innov/v1/innov/metrics
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 威胁因素分析
expect:
  - note: 接口信息 tab；下拉 17 项；默认 metrics GET；切换威胁因素分析 POST compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metrics');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '威胁因素分析' }).first().click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metric/M_INNOV_DS_05_GBA_ANALYSIS_006/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('威胁因素分析');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(17);
      for (const name of ["湾区创新监测指标清单","粤港澳大湾区创新能力指标","创新环境指数","湾区创新热点区域","创新机制指数","创新机构指数","创新资源指数","子指标贡献度","湾区创新能力机会因素","湾区创新能力优势因素","湾区创新能力威胁因素","湾区创新能力短板因素","创新热点区域识别","优势因素分析","短板因素分析","机会因素分析","威胁因素分析"]) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。场景=接口信息-清单。
