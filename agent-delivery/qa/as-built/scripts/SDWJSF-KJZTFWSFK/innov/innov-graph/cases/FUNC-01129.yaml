id: FUNC-01129
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01129
priority: P0
title: M2 创新点落图与赋分接口信息清单
entry_id: innov.graph
tier: A
steps:
  - action: goto
    target: "#/innov/graph"
  - action: assert_visible
    target: 3 个接口
  - action: assert_visible
    target: /innov/v1/graph/domains
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 影响分排行
expect:
  - note: 接口信息 tab；下拉 3 项；默认 domains GET；切换影响分排行 GET rank
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/graph/influence/rank');
      await expect(page.locator('.api-info-grid header')).toContainText('影响分排行');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3);
      for (const name of ['领域树', '领域子图', '影响分排行']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '领域树' }).click();
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/graph/domains');
      await expect(page.locator('.api-info-grid header')).toContainText('领域树');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 domains path，再切换影响分排行；assert 内再核领域树默认项。选项标题由 runner 在已打开弹层里点 .arco-select-option。
