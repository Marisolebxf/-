id: FUNC-01119
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01119
priority: P1
title: 领域子图
entry_id: innov.graph
tier: A
steps:
  - action: goto
    target: "#/innov/graph"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 领域子图
  - action: algo_fill
    set:
      domainId: D-AI
      limit: not-a-limit
  - action: algo_run
expect:
  - note: message 或 msg 指出 limit 非法；不含 nodes、edges 成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/limit/.test(text)) throw new Error('结果未说明 limit');
      if (/nodes/.test(text) && /edges/.test(text)) throw new Error('结果含 nodes、edges 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。组合 SUB-04。
