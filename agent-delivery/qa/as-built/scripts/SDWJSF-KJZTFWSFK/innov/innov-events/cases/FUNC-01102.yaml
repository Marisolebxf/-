      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/mode/.test(text)) throw new Error('结果未说明 mode'); if (/FeatureCollection/.test(text) && /features/.test(text)) throw new Error('结果含 type 为 FeatureCollection 且含 features 的成功点位结果')
