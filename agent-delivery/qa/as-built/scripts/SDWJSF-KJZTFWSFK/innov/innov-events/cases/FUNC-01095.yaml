id: FUNC-01095
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01095
priority: P1
title: 事件列表非法 endTime
entry_id: innov.events
tier: A
steps:
  - action: goto
    target: "#/innov/events"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 事件列表
  - action: algo_fill
    set:
      pageNum: 1
      pageSize: 20
      endTime: "not-a-date"
    omit: [startTime, eventTypes, importanceLevels, keyword]
  - action: algo_run
expect:
  - note: "message 或 msg 指出 endTime 非法；不含 total 与 list 成功业务 data"
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/endTime/.test(text)) throw new Error('结果未说明 endTime'); if (/total/.test(text) && /list/.test(text) && /eventId/.test(text)) throw new Error('结果含 total 与 list 成功业务 data')
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。组合 LST-10。
