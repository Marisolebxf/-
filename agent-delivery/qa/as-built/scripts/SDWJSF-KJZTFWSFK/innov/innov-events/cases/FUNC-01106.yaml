id: FUNC-01106
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01106
priority: P1
title: 热力聚合非法 startTime
entry_id: innov.events
tier: A
steps:
  - action: goto
    target: "#/innov/events"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 热力聚合
  - action: algo_fill
    set:
      startTime: "not-a-date"
    omit: [endTime]
  - action: algo_run
expect:
  - note: "message 或 msg 指出 startTime 非法；不含 lng、lat、weight 成功热力数组"
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/startTime/.test(text)) throw new Error('结果未说明 startTime'); if (/lng/.test(text) && /lat/.test(text) && /weight/.test(text)) throw new Error('结果含 lng、lat、weight 的成功热力数组')
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。组合 HM-04。
