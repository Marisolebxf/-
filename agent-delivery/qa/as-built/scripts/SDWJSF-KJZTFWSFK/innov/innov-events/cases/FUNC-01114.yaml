expect:
  - note: "算法测试 tab 下拉 6 项；切换后 GET /innov/v1/events/heatmap"
    assert: |-
      await expect(page.locator('.test-workbench .test-source')).toContainText('GET');
      await expect(page.locator('.test-workbench .test-source')).toContainText('/innov/v1/events/heatmap');
      await expect(page.locator('.test-workbench .tab-endpoint-select .arco-select-view')).toContainText('热力聚合');
      await page.locator('.test-workbench .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(6);
      for (const name of ["事件列表","地图点位","热力聚合","事件详情","关联分析","事件类型字典"]) { await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name); }
