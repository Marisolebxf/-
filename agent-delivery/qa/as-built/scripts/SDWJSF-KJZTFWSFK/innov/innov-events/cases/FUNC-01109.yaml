title: 事件详情缺 eventId
entry_id: innov.events
tier: A
steps:
  - action: goto
    target: "#/innov/events"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 事件详情
  - action: algo_fill
    omit: [eventId]
  - action: algo_run
expect:
  - note: "message 或 msg 指出 eventId 缺失或非法；不含 eventId 与 importanceDetail 成功详情"
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert'); const viewer = page.locator('.test-workbench .json-viewer'); const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : ''); if (!/eventId/.test(text)) throw new Error('结果未说明 eventId'); if (/eventId/.test(text) && /importanceDetail/.test(text)) throw new Error('结果含 eventId 与 importanceDetail 的成功详情')
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。omit path eventId。组合 DET-02。
