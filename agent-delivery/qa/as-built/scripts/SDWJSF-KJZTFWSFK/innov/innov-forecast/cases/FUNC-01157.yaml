id: FUNC-01157
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01157
priority: P1
title: 创新点贡献度
entry_id: innov.forecast
tier: A
steps:
  - action: goto
    target: "#/innov/forecast"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 创新点贡献度
  - action: algo_fill
    set:
      domainId: D-AI
      pageNum: not-a-page
      pageSize: "10"
  - action: algo_run
expect:
  - note: message 或 msg 指出 pageNum 非法；不含 list 贡献度排行成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/pageNum/.test(text)) throw new Error('结果未说明 pageNum');
      if (/list/.test(text) && /contribution/.test(text)) throw new Error('结果含 list 贡献度排行成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。组合 CON-05。
