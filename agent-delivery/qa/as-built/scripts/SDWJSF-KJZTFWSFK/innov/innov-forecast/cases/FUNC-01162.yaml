id: FUNC-01162
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01162
priority: P0
title: M5 创新影响预测接口信息清单
entry_id: innov.forecast
tier: A
steps:
  - action: goto
    target: "#/innov/forecast"
  - action: assert_visible
    target: 3 个接口
  - action: assert_visible
    target: /innov/v1/forecast/domain/{domainId}
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 创新点贡献度
expect:
  - note: 接口信息 tab；下拉 3 项；默认 domain GET；切换创新点贡献度 GET contributions
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/forecast/contributions');
      await expect(page.locator('.api-info-grid header')).toContainText('创新点贡献度');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3);
      for (const name of ['领域趋势预测', '创新点贡献度', '主题突变']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '领域趋势预测' }).click();
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/forecast/domain/{domainId}');
      await expect(page.locator('.api-info-grid header')).toContainText('领域趋势预测');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 domain path，再切换创新点贡献度；assert 内再核领域趋势预测默认项。选项标题由 runner 在已打开弹层里点 .arco-select-option。
