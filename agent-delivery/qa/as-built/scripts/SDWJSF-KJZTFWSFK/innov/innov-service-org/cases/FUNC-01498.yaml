id: FUNC-01498
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01498
priority: P1
title: 影响力评价非法 module
entry_id: innov.service-org
tier: A
steps:
  - action: goto
    target: "#/innov/service-org"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 影响力评价
  - action: algo_fill
    set:
      module: __invalid__
  - action: algo_run
expect:
  - note: message 或 msg 指出 module 非法；不含 M_INNOV_DS_29_INCUBATOR_006 且含 hint 的成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/module/.test(text)) throw new Error('结果未说明 module');
      if (/M_INNOV_DS_29_INCUBATOR_006/.test(text) && /hint/.test(text)) throw new Error('结果含 M_INNOV_DS_29_INCUBATOR_006 且含 hint 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。module=__invalid__。catalog_status=available。组合 INC-03 场景=异常-入参-非法module。
