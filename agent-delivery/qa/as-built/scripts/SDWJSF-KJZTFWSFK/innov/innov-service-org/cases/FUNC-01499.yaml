id: FUNC-01499
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01499
priority: P0
title: 服务机构管理接口信息清单
entry_id: innov.service-org
tier: A
steps:
  - action: goto
    target: "#/innov/service-org"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /innov/v1/innov/metrics
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 影响力评价
expect:
  - note: 接口信息 tab；下拉 2 项；默认 GET metrics；切换影响力评价 POST compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metric/M_INNOV_DS_29_INCUBATOR_006/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('影响力评价');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['服务机构管理指标清单', '影响力评价']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '服务机构管理指标清单' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metrics');
      await expect(page.locator('.api-info-grid header')).toContainText('服务机构管理指标清单');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息，步骤切换至影响力评价；assert 内再核默认 GET metrics。选项标题由 runner 在已打开弹层里点 .arco-select-option。场景=接口信息-清单。
