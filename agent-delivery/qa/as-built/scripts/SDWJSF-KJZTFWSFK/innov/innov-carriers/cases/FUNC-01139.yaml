id: FUNC-01139
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01139
priority: P0
title: M3 创新载体排行接口信息清单
entry_id: innov.carriers
tier: A
steps:
  - action: goto
    target: "#/innov/carriers"
  - action: assert_visible
    target: 3 个接口
  - action: assert_visible
    target: /innov/v1/carriers/rank
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 载体详情
expect:
  - note: 接口信息 tab；下拉 3 项；默认 rank；切换载体详情 path 刷新
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/carriers/{carrierId}');
      await expect(page.locator('.api-info-grid header')).toContainText('载体详情');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3);
      for (const name of ['载体排行', '载体详情', '指数方法与权重']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '载体排行' }).click();
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/carriers/rank');
      await expect(page.locator('.api-info-grid header')).toContainText('载体排行');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '指数方法与权重' }).click();
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/carriers/index-method');
      await expect(page.locator('.api-info-grid header')).toContainText('指数方法与权重');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认 rank path，再切换载体详情；assert 内再核载体排行默认项与指数方法与权重 path。
