priority: P0
title: 科技全域态势算法测试清单
entry_id: innov.tech-landscape
tier: A
steps:
  - action: goto
    target: "#/innov/tech-landscape"
  - action: click
    target: role=tab 算法测试
  - action: click
    target: .test-workbench .tab-endpoint-select .arco-select-view
  - action: click
    target: 监测趋势预测
expect:
  - note: 算法测试 tab 下拉 15 项；切换监测趋势预测（F018）后 POST path 刷新
    assert: |-
      await page.locator('.test-workbench .tab-endpoint-select .arco-select-view').click();
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /^\\s*监测趋势预测\\s*$/ }).nth(1).click();
      await expect(page.locator('.test-workbench .test-source')).toContainText('POST');
      await expect(page.locator('.test-workbench .test-source')).toContainText('/innov/v1/innov/metric/M_INNOV_DS_FACTORS_018/compute');
      await expect(page.locator('.test-workbench .tab-endpoint-select .arco-select-view')).toContainText('监测趋势预测');
      await page.locator('.test-workbench .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(15);
      for (const name of ["科技全域态势指标清单","会议影响力","企业影响力","事件关注度","事件影响力","监测异常点识别","要素聚类","监测趋势预测","期刊影响力","科研机构影响力","专利影响力","项目（含课题）影响力","专家学者影响力","要素聚类分析","监测趋势预测"]) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。同名 title 下拉点第二项监测趋势预测（endpoint_id=innov.tech-landscape.m_innov_ds_factors_018）。未点击调用时不校验返回字段。场景=算法测试-清单。
