priority: P1
title: 城市排名非法 scope
entry_id: innov.cities
tier: A
steps:
  - action: goto
    target: "#/innov/cities"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 城市排名
  - action: algo_fill
    set:
      scope: __invalid__
  - action: algo_run
expect:
  - note: 结果说明 scope 非法，且无 list 城市排名成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/scope/.test(text)) throw new Error('结果未说明 scope');
      if (/list/.test(text) && /subScores/.test(text)) throw new Error('结果含 list 城市排名成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。scope=__invalid__。catalog status=running。组合 RNK-03。
