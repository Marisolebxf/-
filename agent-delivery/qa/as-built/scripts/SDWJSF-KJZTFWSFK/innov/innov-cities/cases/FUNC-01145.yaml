id: FUNC-01145
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01145
priority: P1
title: 城市对标不传 cityCodes
entry_id: innov.cities
tier: A
steps:
  - action: goto
    target: "#/innov/cities"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 城市对标
  - action: algo_fill
    omit: [cityCodes]
  - action: algo_run
expect:
  - note: 结果说明 cityCodes，且无 list、radar 成功对标 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/cityCodes/.test(text)) throw new Error('结果未说明 cityCodes');
      if (/list/.test(text) && /radar/.test(text)) throw new Error('结果含 list、radar 成功对标 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit cityCodes。catalog status=running。组合 CMP-02。
