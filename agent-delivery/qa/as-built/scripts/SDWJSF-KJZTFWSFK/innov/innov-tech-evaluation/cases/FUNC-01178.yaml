      module: __invalid__
  - action: algo_run
expect:
  - note: message 或 msg 指出 module 非法；不含 metrics 与 total 成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/module/.test(text)) throw new Error('结果未说明 module');
      if (/metrics/.test(text) && /total/.test(text)) throw new Error('结果含 metrics 与 total 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。module=__invalid__。catalog_status=unavailable 文档标记未交付。组合 MET-03 场景=异常-入参-非法module。
