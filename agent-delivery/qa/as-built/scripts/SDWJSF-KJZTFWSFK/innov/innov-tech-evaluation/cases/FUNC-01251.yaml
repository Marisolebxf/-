id: FUNC-01251
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01251
priority: P0
title: 科技创新评估接口信息清单
entry_id: innov.tech-evaluation
tier: A
steps:
  - action: goto
    target: "#/innov/tech-evaluation"
  - action: assert_visible
    target: 25 个接口
  - action: assert_visible
    target: /innov/v1/innov/metrics
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 政策与条件保障力综合评估
expect:
  - note: 接口信息 tab 下拉 25 项；默认 GET metrics；切换政策与条件保障力综合评估 POST compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metric/M_INNOV_PG_COMPOSITE/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('政策与条件保障力综合评估');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(25);
      for (const name of ["科技创新评估指标清单", "政策与条件保障力综合评估", "发展战略引导力", "产业发展潜力综合评估", "技术产品成熟度", "产业科学影响力", "产业技术影响力", "技术创新力综合评估", "技术创新趋势预测", "技术市场潜力", "专利质量", "科学创造力趋势预测", "科学创造力趋势预测", "科学研究前沿性", "政策实施效果", "政策扶持力度", "科学网络中心性", "区域科技创新竞争力水平", "区域科技创新发展潜力", "增长速度", "热度指数", "多企业竞争情报比对", "专利质量评估", "技术创新力综合评估", "技术创新趋势预测"]) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '科技创新评估指标清单' }).click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metrics');
      await expect(page.locator('.api-info-grid header')).toContainText('科技创新评估指标清单');
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤切换政策与条件保障力综合评估；assert 内再核默认 metrics。选项标题由 runner 在已打开弹层里点 .arco-select-option。
