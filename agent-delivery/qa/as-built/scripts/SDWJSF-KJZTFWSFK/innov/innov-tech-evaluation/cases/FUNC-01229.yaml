entry_id: innov.tech-evaluation
tier: A
steps:
  - action: goto
    target: "#/innov/tech-evaluation"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 区域科技创新竞争力水平
  - action: algo_fill
    set:
      module: __invalid__
  - action: algo_run
expect:
  - note: message 或 msg 指出 module 非法；不含 M_INNOV_KEYD_COMPETITIVENESS 且含 hint 的成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/module/.test(text)) throw new Error('结果未说明 module');
      if (/M_INNOV_KEYD_COMPETITIVENESS/.test(text) && /hint/.test(text)) throw new Error('结果含 M_INNOV_KEYD_COMPETITIVENESS 且含 hint 成功业务结果');
as_built_note: 用例写点击调用，页面按钮是执行接口。module=__invalid__。catalog_status=running。组合 KDC-03 场景=异常-入参-非法module。
