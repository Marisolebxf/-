as_built_note: 用例写点击调用，页面按钮是执行接口。sub_type 单选填选项文案「招引」。enterprise_codes 为用例两码逗号串。catalog_status=running，断言仍按文档字段。不断言 sample 具体数字。组合=ATTR-01。
