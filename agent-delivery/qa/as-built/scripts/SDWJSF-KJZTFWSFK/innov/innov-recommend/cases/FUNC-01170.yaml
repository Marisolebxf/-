      const viewer = page.locator('.test-workbench .json-viewer');
      for (const f of ['task_id', 'candidate_count', 'weights', 'technology_match', 'growth', 'regional_fit', 'rankings', 'rank', 'enterprise_name', 'recommendation_score', 'industry_domain', 'geographic_source']) {
        await expect(viewer).toContainText(f);
