priority: P1
title: 科技发展规划指标清单
entry_id: innov.tech-planning
tier: A
steps:
  - action: goto
    target: "#/innov/tech-planning"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 科技发展规划指标清单
  - action: algo_fill
    set:
      module: __invalid__
  - action: algo_run
expect:
  - note: message 或 msg 指出 module 非法；不含 metrics、total 成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/module/.test(text)) throw new Error('结果未说明 module');
      if (/metrics/.test(text) && /total/.test(text)) throw new Error('结果含 metrics、total 成功业务 data');
