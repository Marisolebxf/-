id: FUNC-01491
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-01491
priority: P0
title: 接口信息
entry_id: innov.topic-strategy
tier: A
steps:
  - action: goto
    target: "#/innov/topic-strategy"
  - action: assert_visible
    target: 4 个接口
  - action: assert_visible
    target: /innov/v1/innov/metrics
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 热点区域自动识别与预警
expect:
  - note: 接口信息 tab；下拉 4 项；默认 metrics GET；切换热点区域自动识别与预警 POST compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metrics');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '热点区域自动识别与预警' }).first().click();
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/innov/metric/M_INNOV_DS_27_SPATIO_003/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('热点区域自动识别与预警');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(4);
      for (const name of ["科技专题战略分析指标清单","影响力评价与应用反馈","协同绩效与影响力智能评估","热点区域自动识别与预警"]) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。场景=接口信息-清单。
