priority: P1
title: 热点区域自动识别与预警
entry_id: innov.topic-strategy
tier: A
steps:
  - action: goto
    target: "#/innov/topic-strategy"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 热点区域自动识别与预警
  - action: algo_fill
    set:
      module: __invalid__
  - action: algo_run
expect:
  - note: message 或 msg 指出 module 非法；不含 M_INNOV_DS_27_SPATIO_003 且含 hint 的成功业务结果
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/module/.test(text)) throw new Error('结果未说明 module');
      if (/M_INNOV_DS_27_SPATIO_003/.test(text) && /hint/.test(text)) throw new Error('结果含 M_INNOV_DS_27_SPATIO_003 且含 hint 成功业务结果');
