id: FUNC-00518
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00518
priority: P1
title: 重点布局产业推荐模型不传 chainId
entry_id: chain.layout
tier: A
steps:
  - action: goto
    target: "#/chain/layout"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 重点布局产业推荐模型
  - action: algo_fill
    omit: [chainId]
  - action: algo_run
expect:
  - note: message 或 msg 指出 chainId，且不返回含 M_CHAIN_DEEP_129_1 的成功业务 body
    assert: |-
      const tag = page.locator('.test-workbench .chain-cascader .arco-tag');
      if (await tag.count() && await tag.first().isVisible()) throw new Error('chainId 未清空');
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/chainId/.test(text)) throw new Error('结果未说明 chainId');
      if (/M_CHAIN_DEEP_129_1/.test(text) && /hint/.test(text)) throw new Error('结果含 metric_id 成功业务 body');
      if (/recommend_level/.test(text)) throw new Error('结果含 recommend_level 成功业务 body');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 chainId，请求体不含 chain_id。catalog status=available。结果须说明 chainId，且不得出现 M_CHAIN_DEEP_129_1、recommend_level 成功体。
