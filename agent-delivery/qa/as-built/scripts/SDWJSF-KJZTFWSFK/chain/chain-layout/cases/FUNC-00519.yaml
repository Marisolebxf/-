id: FUNC-00519
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00519
priority: P0
title: 重点布局产业推荐接口信息清单
entry_id: chain.layout
tier: A
steps:
  - action: goto
    target: "#/chain/layout"
  - action: assert_visible
    target: 2 个接口
  - action: assert_visible
    target: /innov/v1/industry/{chainId}/recommendation
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 重点布局产业推荐模型
expect:
  - note: 接口信息 tab；2 项下拉；默认重点布局产业推荐 GET recommendation；切换后 POST M_CHAIN_DEEP_129_1/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/industry/chainan/metric/M_CHAIN_DEEP_129_1/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('重点布局产业推荐模型');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(2);
      for (const name of ['重点布局产业推荐', '重点布局产业推荐模型']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认重点布局产业推荐 path，再切换重点布局产业推荐模型。选项标题由 runner 在已打开弹层里点 .arco-select-option。
