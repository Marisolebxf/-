id: FUNC-00405
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00405
priority: P0
title: 第一波16STAT接口信息清单
entry_id: chain.wave1
tier: A
steps:
  - action: goto
    target: "#/chain/wave1"
  - action: assert_visible
    target: "17 个接口"
  - action: assert_visible
    target: /innov/v1/industry/chainan/metric/M_CHAIN_TOTAL_COUNT/compute
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: WAVE1 产业市场规模
expect:
  - note: 接口信息 tab 下拉 17 项；默认第一项 POST M_CHAIN_TOTAL_COUNT；切换后产业市场规模 POST M_CHAIN_MARKET_SIZE/compute
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('POST');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/industry/chainan/metric/M_CHAIN_MARKET_SIZE/compute');
      await expect(page.locator('.api-info-grid header')).toContainText('WAVE1 产业市场规模');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(17);
      for (const name of ["WAVE1 产业链环节总数", "WAVE1 链上企业数", "WAVE1 链上新增企业数", "WAVE1 全国区域企业分布", "WAVE1 深圳区域企业分布", "WAVE1 深圳企业数", "WAVE1 深圳企业占比", "WAVE1 产业市场规模", "WAVE1 产业市场增速", "WAVE1 投融资事件数", "WAVE1 区域融资分布", "WAVE1 区域营收分布", "WAVE1 区域专利分布", "WAVE1 深圳产业链完备度", "WAVE1 链上专利数", "WAVE1 链上产品数", "全球成功案例匹配"]) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认第一项 path，再切换产业市场规模。选项标题由 runner 在已打开弹层里点 .arco-select-option。
