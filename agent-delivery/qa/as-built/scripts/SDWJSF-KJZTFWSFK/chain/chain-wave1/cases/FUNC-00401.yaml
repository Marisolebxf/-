id: FUNC-00401
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00401
priority: P1
title: 全球成功案例匹配异常 mode
entry_id: chain.wave1
tier: A
steps:
  - action: goto
    target: "#/chain/wave1"
  - action: algo_tab
    target: "test"
  - action: algo_pick
    target: "全球成功案例匹配"
  - action: algo_fill
    set:
      op_id: "CHAIN_NER_INDUSTRY"
      scope: "one"
      id: "INB13"
      mode: "__invalid__"
      dry_run: true
  - action: algo_run
expect:
  - note: message 或 msg 指出 mode 问题，且不返回含 metric_id、written_nodes 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/mode/.test(text)) throw new Error('结果未说明 mode');
      if (/metric_id/.test(text) && /written_nodes/.test(text)) throw new Error('结果含 metric_id、written_nodes 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog status=available，断言仍按文档字段。不断言 sample 具体数字。
