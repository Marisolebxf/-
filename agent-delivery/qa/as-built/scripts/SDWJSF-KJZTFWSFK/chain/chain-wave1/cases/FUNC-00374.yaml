id: FUNC-00374
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00374
priority: P1
title: WAVE1 区域融资分布非法 chain_id
entry_id: chain.wave1
tier: A
steps:
  - action: goto
    target: "#/chain/wave1"
  - action: algo_tab
    target: "test"
  - action: algo_pick
    target: "WAVE1 区域融资分布"
  - action: algo_fill
    set:
      chain_id: "__invalid__"
  - action: algo_run
expect:
  - note: message 或 msg 指出 chain_id 非法，且不返回含 metric_id 的成功业务 data
    assert: |-
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/chain_id/.test(text)) throw new Error('结果未说明 chain_id');
      if (/metric_id/.test(text) && /metric_name_zh/.test(text)) throw new Error('结果含 metric_id 成功业务 data');
as_built_note: 用例写点击调用，页面按钮是执行接口。catalog status=available，断言仍按文档字段。不断言 sample 具体数字。
