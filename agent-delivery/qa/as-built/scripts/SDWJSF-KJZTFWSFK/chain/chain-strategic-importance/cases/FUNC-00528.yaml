id: FUNC-00528
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00528
priority: P1
title: 战略重要性不传 chainId
entry_id: chain.strategic-importance
tier: A
steps:
  - action: goto
    target: "#/chain/strategic-importance"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 战略重要性
  - action: algo_fill
    omit: [chainId]
  - action: algo_run
expect:
  - note: message 或 msg 指出 chainId，且不返回含 rows、importance_score 的成功业务 body
    assert: |-
      const tag = page.locator('.test-workbench .chain-cascader .arco-tag');
      if (await tag.count() && await tag.first().isVisible()) throw new Error('chainId 未清空');
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/chainId/.test(text)) throw new Error('结果未说明 chainId');
      if (/rows/.test(text) && /importance_score/.test(text)) throw new Error('结果含战略重要性成功业务 body');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 chainId。catalog status=unavailable。结果须说明 chainId，且不得出现 rows、importance_score 成功体特征字段。
