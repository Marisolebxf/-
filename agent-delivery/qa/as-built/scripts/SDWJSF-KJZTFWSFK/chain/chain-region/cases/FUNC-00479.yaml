id: FUNC-00479
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00479
priority: P0
title: 区域产业指数接口信息清单
entry_id: chain.region
tier: A
steps:
  - action: goto
    target: "#/chain/region"
  - action: assert_visible
    target: 3 个接口
  - action: assert_visible
    target: /innov/v1/industry/{chainId}/region-index
  - action: click
    target: .api-info-grid .tab-endpoint-select .arco-select-view
  - action: click
    target: 竞争力评价
expect:
  - note: 接口信息 tab；下拉 3 项；切换后 GET competitiveness
    assert: |-
      await expect(page.getByRole('tab', { name: '接口信息' })).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.api-info-grid .endpoint-headline')).toContainText('GET');
      await expect(page.locator('.api-info-grid .endpoint-path')).toContainText('/innov/v1/industry/{chainId}/competitiveness');
      await expect(page.locator('.api-info-grid header')).toContainText('竞争力评价');
      await page.locator('.api-info-grid .tab-endpoint-select .arco-select-view').click();
      await expect(page.locator('.arco-trigger-popup:visible .arco-select-option')).toHaveCount(3);
      for (const name of ['区域指数', '竞争力评价', '区域产业指数模型']) {
        await expect(page.locator('.arco-trigger-popup:visible')).toContainText(name);
      }
as_built_note: 页面清单，不用 algo_*，不点执行接口。进页默认接口信息 tab，步骤先确认区域指数 GET region-index path，再切换竞争力评价。选项标题由 runner 在已打开弹层里点 .arco-select-option。
