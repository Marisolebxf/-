id: FUNC-00456
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00456
priority: P1
title: 产业阶段分析不传 chainId
entry_id: chain.stage
tier: A
steps:
  - action: goto
    target: "#/chain/stage"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 产业阶段分析
  - action: algo_fill
    omit: [chainId]
  - action: algo_run
expect:
  - note: message 或 msg 指出 chainId 缺失，且不返回含 cycle_stage 或 sub_stage 的成功业务 body
    assert: |-
      const tag = page.locator('.test-workbench .chain-cascader .arco-tag');
      if (await tag.count() && await tag.first().isVisible()) throw new Error('chainId 未清空');
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/chainId/.test(text)) throw new Error('结果未说明 chainId');
      if (/cycle_stage/.test(text) || /sub_stage/.test(text)) throw new Error('结果含 cycle_stage 或 sub_stage 成功业务 body');
as_built_note: 用例写点击调用，页面按钮是执行接口。omit 清空 chainId。catalog_status=unavailable，反向断言仍按文档。文档将 chainId 标为必填。
