id: FUNC-00458
func_id: ZNFWJQ-SDWJSF/KJZTFWSFK-v1.0-FUNC-00458
priority: P1
title: 产业阶段分析模型不传 chainId
entry_id: chain.stage
tier: A
steps:
  - action: goto
    target: "#/chain/stage"
  - action: algo_tab
    target: test
  - action: algo_pick
    target: 产业阶段分析模型
  - action: algo_fill
    omit: [chainId]
  - action: algo_run
expect:
  - note: message 或 msg 指出 chainId 缺失，且不返回含 metric_id 为 M_CHAIN_DEEP_123_1 的成功业务 body
    assert: |-
      const tag = page.locator('.test-workbench .chain-cascader .arco-tag');
      if (await tag.count() && await tag.first().isVisible()) throw new Error('chainId 未清空');
      const alert = page.locator('.test-workbench .test-control-column .arco-alert');
      const viewer = page.locator('.test-workbench .json-viewer');
      const text = ((await alert.count()) ? await alert.first().innerText() : '') + '\n' + ((await viewer.count()) ? await viewer.first().innerText() : '');
      if (!/chainId/.test(text)) throw new Error('结果未说明 chainId');
      if (/M_CHAIN_DEEP_123_1/.test(text) && /metric_id/.test(text)) throw new Error('结果含 M_CHAIN_DEEP_123_1 成功业务 body');
as_built_note: 用例写点击调用，页面按钮是执行接口。请求体为空 omit chainId。catalog_status=available，反向断言仍按文档。
