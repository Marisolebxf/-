id: FUNC-05097
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05097
priority: P0
tier: B
title: 主流程-生物的产业链选项
entry_id: svc-portal-region
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/region-map
expect:
  - note: 1、产业链选项共 2 个，名称见附录 B
    assert: |-
      const regionPage = page.locator('div').filter({ has: page.getByRole('heading', { name: '服务机构区域分布', exact: true }) }).last();
      await regionPage.locator('.arco-select-view').first().click();
      await page.locator('.arco-select-popup').getByText('生物', { exact: true }).click();
      const chainRow = regionPage
        .locator('div')
        .filter({ has: page.getByText('生物产业 / 生物医药', { exact: true }) })
        .first();
      await chainRow.locator('.arco-select-view').click();
      const options = page.locator('.arco-select-dropdown:visible .arco-select-option');
      await expect(options).toHaveCount(2);
      await expect(options.getByText('生物医药与生命健康', { exact: true })).toBeVisible();
      await expect(options.getByText('高端医疗器械', { exact: true })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
