id: FUNC-05106
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05106
priority: P1
tier: B
title: 备选-点击全球视图
entry_id: svc-portal-region
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/region-map
  - action: evaluate
    script: |-
      const global = page.getByRole('radio', { name: '全球视图' });
      await global.click({ force: true, timeout: 500 }).catch(() => {});
expect:
  - note: 「全国视图」仍为选中
    assert: |-
      await expect(page.locator('label.arco-radio-checked').filter({ hasText: '全国视图' })).toBeVisible()
  - note: 「全球视图」仍为禁用
    assert: |-
      await expect(page.getByRole('radio', { name: '全球视图' })).toBeDisabled()
on_fail: 截图 + 抄 X-Trace-Id
