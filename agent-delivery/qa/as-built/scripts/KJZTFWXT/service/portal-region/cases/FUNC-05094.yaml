expect:
  - note: 选项共 15 个产业集群，名称见附录 A
    assert: |-
      const clusterRow = page
        .locator('div')
        .filter({ has: page.getByText('产业集群 / 产业', { exact: true }) })
        .first();
      await clusterRow.locator('.arco-select-view').click();
      const options = page.locator('.arco-select-dropdown:visible .arco-select-option');
      await expect(options).toHaveCount(15);
