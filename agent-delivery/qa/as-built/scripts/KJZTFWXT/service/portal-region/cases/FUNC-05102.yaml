id: FUNC-05102
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05102
priority: P0
tier: B
title: 主流程-排行省级个数
entry_id: svc-portal-region
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/region-map
expect:
  - note: 1、排行共 3 个省级行政区，名称见附录 C
    assert: |-
      const rank = page.locator('main').filter({ hasText: '省级行政区排行' });
      const canvas = rank.locator('canvas').first();
      await expect(canvas).toBeVisible();
      const box = await canvas.boundingBox();
      if (!box) throw new Error('无排行画布');
      const probes = [
        { name: '浙江省', y: 0.88 },
        { name: '北京市', y: 0.55 },
        { name: '广东省', y: 0.22 },
      ];
      for (const { name, y } of probes) {
        await page.mouse.move(box.x + box.width * 0.65, box.y + box.height * y);
        await page.waitForTimeout(400);
        await expect(page.getByText(new RegExp(`${name}：`))).toBeVisible();
      }
  - note: 2、每个名称旁展示家数
    assert: |-
      const rank = page.locator('main').filter({ hasText: '省级行政区排行' });
      const canvas = rank.locator('canvas').first();
      await expect(canvas).toBeVisible();
      const box = await canvas.boundingBox();
      if (!box) throw new Error('无排行画布');
      const probes = [
        { name: '浙江省', y: 0.88 },
        { name: '北京市', y: 0.55 },
        { name: '广东省', y: 0.22 },
      ];
      for (const { name, y } of probes) {
        await page.mouse.move(box.x + box.width * 0.65, box.y + box.height * y);
        await page.waitForTimeout(400);
        await expect(page.getByText(new RegExp(`${name}：\\d[\\d,]* 家（占`))).toBeVisible();
      }
on_fail: 截图 + 抄 X-Trace-Id
