id: FUNC-05098
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05098
priority: P0
tier: B
title: 主流程-选定产业后家数不变
entry_id: svc-portal-region
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/region-map
  - action: evaluate
    note: 选择产业「生物」
    assert: |-
      const main = page.locator('main');
      await main.locator('.svc-portal-kpi__value').first().waitFor({ state: 'visible', timeout: 20000 });
      const readKpiCounts = async () => {
        const kpis = main.locator('.svc-portal-kpi');
        const card1 = (await kpis.nth(0).locator('.svc-portal-kpi__value').innerText()).trim();
        const card2 = (await kpis.nth(1).locator('.svc-portal-kpi__value').innerText()).trim();
        const card3 = (await kpis.nth(2).locator('.svc-portal-kpi__hint').innerText()).trim();
        return [card1, card2, card3];
      };
      const before = await readKpiCounts();
      await page.evaluate((json) => {
        document.documentElement.dataset.func05098KpiBefore = json;
      }, JSON.stringify(before));
      const cascader = main.locator('.svc-portal-industry-cascader .arco-cascader-view');
      await cascader.click({ timeout: 15000 });
      const popup = page.locator('.arco-cascader-popup:visible');
      await popup.waitFor({ timeout: 8000 });
      await popup
        .locator('.arco-cascader-column')
        .first()
        .locator('.arco-cascader-option')
        .filter({ has: page.getByText('生物', { exact: true }) })
        .click({ timeout: 8000 });
      await expect(main).toContainText('「生物」为上下文', { timeout: 15000 });
      await page.waitForTimeout(800);
expect:
  - note: 三张卡的家数与选择前相同
    assert: |-
      const main = page.locator('main');
      await expect(main).toContainText('「生物」为上下文', { timeout: 15000 });
      const raw = await page.locator('html').getAttribute('data-func05098-kpi-before');
      if (!raw) throw new Error('missing kpi before snapshot');
      const before = JSON.parse(raw);
      const kpis = main.locator('.svc-portal-kpi');
      await expect(kpis.nth(0).locator('.svc-portal-kpi__value')).toHaveText(before[0]);
      await expect(kpis.nth(1).locator('.svc-portal-kpi__value')).toHaveText(before[1]);
      await expect(kpis.nth(2).locator('.svc-portal-kpi__hint')).toHaveText(before[2]);
  - note: 结论条仍写明不按产业切片
    assert: |-
      await expect(page.locator('main')).toContainText('不按产业切片', { timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
