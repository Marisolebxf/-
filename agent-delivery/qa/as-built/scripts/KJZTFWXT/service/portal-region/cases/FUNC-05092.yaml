id: FUNC-05092
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05092
priority: P0
tier: B
title: 主流程-首位区域与结论条一致
entry_id: svc-portal-region
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/region-map
expect:
  - note: 首位区域卡展示省名与家数
    assert: |-
      const topCard = page.locator('.svc-portal-kpi').filter({
        has: page.locator('.svc-portal-kpi__label', { hasText: '首位区域' }),
      });
      await expect(topCard.locator('.svc-portal-kpi__value')).not.toHaveText('暂无', { timeout: 30000 });
      await expect(topCard).toContainText('家', { timeout: 30000 });
  - note: 结论条中的居首省名与该卡相同
    assert: |-
      const topCard = page.locator('.svc-portal-kpi').filter({
        has: page.locator('.svc-portal-kpi__label', { hasText: '首位区域' }),
      });
      const provinceName = (await topCard.locator('.svc-portal-kpi__value').innerText()).trim();
      await expect(page.getByText('「' + provinceName + '」居首')).toBeVisible({ timeout: 30000 });
on_fail: 截图 + 抄 X-Trace-Id
