      await expect(page.getByText('招引推荐模型')).toBeVisible();
  - note: 回到培育页后模型区为「培育评估模型（演示模型口径）」
    assert: |-
      await page.getByText('培育服务机构推荐分析', { exact: true }).first().click();
      await page.waitForTimeout(800);
      await expect(page.getByText('培育评估模型')).toBeVisible();
