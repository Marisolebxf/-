id: FUNC-04690
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04690
priority: P1
tier: B
title: 主流程-选定产业回显
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: wait
    ms: 1500
  - action: click
    target: 重点产业方向
    locator: |-
      page.locator('main [data-testid="svc-rec-cultivate-context"] .arco-cascader-view').first()
  - action: click
    target: 生物
    locator: |-
      page.locator('.arco-cascader-popup-visible .arco-cascader-option-label').filter({ hasText: /^生物$/ }).first()
expect:
  - note: 1、选择框回显「生物」
    assert: |-
      const cascader = page.locator('main [data-testid="svc-rec-cultivate-context"] .arco-cascader-view').first();
      await expect(cascader).toContainText('生物');
  - note: 2、页面仍停留在分析配置
    assert: |-
      await expect(page.getByRole('heading', { name: '分析配置' })).toBeVisible();
      await expect(page.locator('main [data-testid="svc-rec-cultivate-config"]')).toBeVisible();
      await expect(page.getByRole('button', { name: '生成培育名单' })).toBeVisible();
  - note: 3、配置区仍提示切换产业不会自动创建任务
    assert: |-
      await expect(page.getByText('切换 workspace 或产业不会自动创建任务')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
