id: FUNC-04692
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04692
priority: P0
tier: B
title: 主流程-服务环节下拉
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: assert_visible
    target: 分析配置
  - action: click
    target: 服务环节
expect:
  - note: 选项共 11 个，名称见附录 A.2
    assert: |-
      const segSelect = page.getByTestId('svc-rec-cultivate-segments');
      const dropdown = page.locator('.arco-select-dropdown:visible');
      if ((await dropdown.count()) === 0) {
        await segSelect.click();
      }
      await expect(dropdown).toBeVisible({ timeout: 15000 });
      const options = dropdown.locator('.arco-select-option');
      await expect(options).toHaveCount(11);
      const names = [
        '上游·研发',
        '上游·标准',
        '上游·知识产权',
        '上游·科研合作',
        '中游·中试',
        '中游·检测',
        '中游·孵化',
        '中游·技术转移',
        '下游·投融资',
        '下游·人才',
        '下游·数字化',
      ];
      for (const name of names) {
        await expect(dropdown.getByText(name, { exact: true })).toBeVisible();
      }
on_fail: 截图 + 抄 X-Trace-Id
