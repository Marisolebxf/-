id: FUNC-01268
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01268
priority: P1
tier: B
title: 主流程-权重调节与键入编辑
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 调节钮每次增减 1（现有规模 25 上调一次变 26）
    assert: |-
      const main = page.locator('main');
      const model = main.locator('[data-testid="svc-rec-cultivate-model"]');
      await expect(model).toBeVisible();
      await expect(model.getByText('现有规模 25%', { exact: true })).toBeVisible();
      const spinners = model.locator('.arco-input-number');
      await expect(spinners).toHaveCount(4);
      const scale = spinners.first();
      await scale.locator('.arco-input-number-step-button.up').click();
      await expect(scale.locator('input')).toHaveValue('26');
      await scale.locator('.arco-input-number-step-button.down').click();
      await expect(scale.locator('input')).toHaveValue('25');
  - note: 权重值支持直接键入修改
    assert: |-
      const main = page.locator('main');
      const model = main.locator('[data-testid="svc-rec-cultivate-model"]');
      const scale = model.locator('.arco-input-number').first();
      await scale.locator('input').fill('40');
      await expect(scale.locator('input')).toHaveValue('40');
on_fail: 截图 + 抄 X-Trace-Id
