id: FUNC-04703
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04703
priority: P0
tier: B
title: 主流程-导出名单
entry_id: svc-rec-cultivate
preconditions:
  - 已打开本土机构培育名单
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: click
    role: button
    name: 生成培育名单
expect:
  - note: 浏览器下载 csv 文件
    assert: |-
      await expect(page.getByRole('button', { name: '导出名单' })).toBeVisible({ timeout: 120000 });
      const [download] = await Promise.all([
        page.waitForEvent('download'),
        page.getByRole('button', { name: '导出名单' }).click(),
      ]);
      await expect(download.suggestedFilename()).toMatch(/\.csv$/i);
  - note: 页面提示已导出
    assert: |-
      await expect(page.getByText(/已导出/)).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
