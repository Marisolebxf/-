priority: P1
tier: B
title: 备选-未选产业仍可发起
entry_id: svc-rec-cultivate
preconditions:
  - 重点产业方向为空
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 分析记录出现新任务
    assert: |-
      await page.getByRole('button', { name: '生成培育名单' }).click();
      await page.getByText('分析记录', { exact: true }).click();
      await expect(page.locator('main').getByText(/^SVC-\d+/).first()).toBeVisible({ timeout: 60000 });
  - note: 该任务变为已完成
    assert: |-
      await expect(page.locator('main').getByText('已完成').first()).toBeVisible({ timeout: 120000 });
