id: P0-22
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01276
priority: P0
tier: B
title: 培育建议与机构一一对应——标签属资金支持/市场对接/人才引进集合且短板数值与该行一致（有据完整机检/无据诚实空，双分支）
story: US-SVC-REC-04
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（g5 已完成任务可查看结果）
  - 用例前置「已生成培育名单结果」：经「分析记录」打开既有已完成 cultivate 任务结果态（不新发起——写稿时 POST create 返回「SVC 中间层 create 失败：404」，见 scout-p022-start-diag.json / ticket D4-SVCCULT-TASK-CREATE-404；创建链深验归 01271/P0-12 不吞并）
  - 名单数据态：多任务持续诚实空（SVC-20261015-027/036/061/071 等；scout-p022-suggest.json 实证 label_hits=[]）；按双分支断言，不造假建议行
  - 本环境 user_id=guest 共享账号，并行会话可能同时作业
locators:
  tab_records: '[role=tab][data-tab-key=records] / Tab「分析记录」'
  view_result_btn: button「查看结果」（exact；记录行 enabled，跳过失败行 disabled）
  result_title: 结果态主区标题「本土机构培育名单」
  empty_hint: 诚实空态文案「暂无候选」/「当前筛选范围内无本土机构」
  suggest_labels: 建议标签集合「资金支持」「市场对接」「人才引进」（用例预期 2 / 功能点 #27~#32）
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 切「分析记录」Tab，点首个 enabled「查看结果」打开既有已完成任务结果态（URL view=result&task_id=SVC-*；跳过失败行 disabled 按钮）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('http://111.198.38.90:50892/service/institution-decision?workspace=cultivate&tab=cultivate', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) } const rec=page.locator('[role=tab][data-tab-key=records], [role=tab]').filter({ hasText: '分析记录' }).first(); await expect(rec).toBeVisible({ timeout: 8000 }); await rec.click({ timeout: 8000 }); await page.waitForTimeout(1800); let body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/暂无分析记录/.test(body)) { await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2200); const rec2=page.locator('[role=tab][data-tab-key=records], [role=tab]').filter({ hasText: '分析记录' }).first(); if (await rec2.count()) await rec2.click({ timeout: 8000 }); await page.waitForTimeout(1500); body=((await page.locator('main').first().innerText().catch(()=>''))||'') } const vrs=page.getByRole('button', { name: '查看结果', exact: true }); const n=await vrs.count(); if (!n) throw new Error('分析记录未见「查看结果」按钮（g5 应有已完成任务）'); let clicked=false; for (let i=0;i<n;i++) { const b=vrs.nth(i); if (await b.isEnabled().catch(()=>false)) { await b.click({ timeout: 8000 }); clicked=true; globalThis.__p022VrIndex=i; break } } if (!clicked) throw new Error('分析记录无 enabled「查看结果」（或仅失败行 disabled）'); await page.waitForURL((u)=>/[?&]view=result/.test(String(u)), { timeout: 15000 }); await page.waitForTimeout(2000); const u=page.url(); const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (!m) throw new Error('结果态 URL 未带 task_id: '+u); globalThis.__p022TaskId=m[1]; let rbody=''; for (let i=0;i<10;i++) { rbody=((await page.locator('main').first().innerText().catch(()=>''))||''); if (rbody.includes('本土机构培育名单')) break; await page.waitForTimeout(1000) } if (!rbody.includes('本土机构培育名单')) throw new Error('结果态主区未见「本土机构培育名单」标题（任务 '+m[1]+'）')
  - note: 培育建议双分支（用例步骤①浏览两条不同机构建议；预期 1/2/3）——有据（≥2 行机构）：两行机构标识互异不串行；每行建议区命中标签集合{资金支持,市场对接,人才引进}至少一类；建议文本中「维度名+数值」引用须出现在该行数字字段内（短板数值一致）；无据：诚实空双文案齐备+不造伪机构行+正文不伪渲染三类建议标签——诚实空即「建议对应无可验证」如实形态 pass 非缺陷
    assert: |-
      const tid2=(globalThis.__p022TaskId)||''; if (!tid2) throw new Error('前置缺失：未捕获任务 ID（expect[0] 应已红）'); if (!page.url().includes(tid2)) throw new Error('前置错位：URL 已不含任务 ID '+tid2+': '+page.url()); const close3=page.locator('button[aria-label="关闭对比篮"]'); if (await close3.count() && await close3.first().isVisible().catch(()=>false)) { try { await close3.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const ORG=/公司|大学|学院|学校|研究所|研究院|医院|中心/; const LABEL_SET=['资金支持','市场对接','人才引进']; const DIMS=['现有规模','技术创新能力','服务成效','市场缺口']; const rowsLoc=page.locator('main .arco-table-tr, main [role=row], main tr').filter({ hasText: ORG }); let rows=0, emptyHit='', body3=''; for (let i=0;i<14;i++) { rows=await rowsLoc.count(); if (rows>0) break; body3=((await page.locator('main').first().innerText().catch(()=>''))||''); if (body3.includes('暂无候选') && body3.includes('当前筛选范围内无本土机构')) { emptyHit='暂无候选+当前筛选范围内无本土机构'; break } await page.waitForTimeout(1000) } globalThis.__p022Branch=rows>=2?'non-empty':(rows===1?'non-empty-partial':(emptyHit?'honest-empty':null)); if (!globalThis.__p022Branch) { const tbody=((await page.locator('main').first().innerText().catch(()=>''))||''); if (tbody.includes('暂无候选')||tbody.includes('当前筛选范围内无本土机构')) globalThis.__p022Branch='honest-empty' } if (globalThis.__p022Branch==='non-empty' || globalThis.__p022Branch==='non-empty-partial') { const n=Math.min(rows,2); if (n<1) throw new Error('有据分支但机构行计数异常'); const orgNames=[]; for (let i=0;i<n;i++) { const t=((await rowsLoc.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim(); globalThis[('__p022Row'+(i+1))]=t.slice(0,260); const om=t.match(/(?:[\u4e00-\u9fffA-Za-z0-9（）()]{2,40}(?:公司|大学|学院|学校|研究所|研究院|医院|中心))/); orgNames.push(om?om[0]:t.slice(0,24)); const labels=LABEL_SET.filter((lb)=>t.includes(lb)); if (!labels.length) throw new Error('第 '+(i+1)+' 行未见建议标签（资金支持/市场对接/人才引进）: "'+t.slice(0,160)+'"'); globalThis[('__p022Labels'+(i+1))]=labels.join('/'); const numsInRow=(t.match(/\d+(?:\.\d+)?/g)||[]).map(Number); for (const dim of DIMS) { const re=new RegExp(dim+'[^\\d]{0,12}(\\d+(?:\\.\\d+)?)'); const mm=t.match(re); if (mm) { const cited=Number(mm[1]); const ok=numsInRow.some((x)=>Math.abs(x-cited)<=0.51); if (!ok) throw new Error('第 '+(i+1)+' 行建议引用「'+dim+'」数值 '+cited+' 未出现在该行数字字段（疑串行/短板不一致）: "'+t.slice(0,180)+'"') } } } if (n>=2 && orgNames[0] && orgNames[1] && orgNames[0]===orgNames[1]) throw new Error('两行机构标识相同（疑串行/重复行）: '+orgNames[0]); if (n>=2) globalThis.__p022PairObserved='机构1='+orgNames[0]+' 标签='+(globalThis.__p022Labels1||'')+'；机构2='+orgNames[1]+' 标签='+(globalThis.__p022Labels2||''); else globalThis.__p022PairObserved='仅 1 行机构（用例「两条」不可达）机构='+orgNames[0]+' 标签='+(globalThis.__p022Labels1||'')+'——跨行不串行待 ≥2 行回访'; globalThis.__p022RowsCount=rows } else if (globalThis.__p022Branch==='honest-empty') { const ebody=((await page.locator('main').first().innerText().catch(()=>''))||''); const missE=[]; if (!ebody.includes('暂无候选')) missE.push('暂无候选'); if (!ebody.includes('当前筛选范围内无本土机构')) missE.push('当前筛选范围内无本土机构'); if (missE.length) throw new Error('诚实空态文案不齐备（缺 '+missE.join('/')+'）'); if (rows>0) throw new Error('诚实空态下渲染了 '+rows+' 个伪机构行（D3-SVCCULT-LIST-DISHONEST 候选）'); const fakeLabels=LABEL_SET.filter((lb)=>ebody.includes(lb)); if (fakeLabels.length) throw new Error('名单空仍渲染建议标签 '+fakeLabels.join('/')+'（伪建议呈现，D3-SVCCULT-SUGGEST-DISHONEST 候选）'); globalThis.__p022EmptyObserved='任务 '+tid2+' 名单诚实空（暂无候选+当前筛选范围内无本土机构）：培育建议逐行对应/标签集合/短板数值一致在本数据态无可验证对象，诚实空为如实形态非缺陷；建议生成算法归服务侧黑盒（用例备注）' } else { throw new Error('名单区既无机构行也无诚实空态文案（暂无候选/当前筛选范围内无本土机构）——名单呈现缺失') }
  - note: observed 收口（不判红）——记录打开的任务 ID、名单条数、两行机构与建议标签命中、短板数值核对摘要、本轮落局分支；创建链 404 环境债旁证记 observed
    assert: |-
      const tid4=(globalThis.__p022TaskId)||''; const branch=(globalThis.__p022Branch)||null; if (!tid4 || !branch) throw new Error('前置缺失：任务 ID 或双分支未定局（expect[0]/[1] 应已红）'); if (branch==='non-empty' || branch==='non-empty-partial') { globalThis.__p022Observed='任务 '+tid4+'（记录行查看结果 index='+(globalThis.__p022VrIndex??'?')+'）名单非空 '+(globalThis.__p022RowsCount||'')+' 行；'+(globalThis.__p022PairObserved||'')+'；标签集合口径=资金支持/市场对接/人才引进' } else { globalThis.__p022Observed=((globalThis.__p022EmptyObserved)||('任务 '+tid4+' 名单诚实空'))+'；入口=分析记录查看结果（规避 D4-SVCCULT-TASK-CREATE-404）；探针 scout-p022-suggest.json / scout-p022-start-diag.json' }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若名单空但伪渲染建议标签/伪机构行 → 红挂 D3-SVCCULT-SUGGEST-DISHONEST（或 LIST-DISHONEST）；若有据分支缺三类标签/串行/短板数值不一致 → 红归 01276；若记录 Tab 无 enabled 查看结果 → 归 D4 历史任务债（g5）；创建链 404 不在本条判红（入口已绕开）
as_built_note: 蓝本 FUNC-01276（培育建议与机构一一对应；kind=GAP 补齐；用例册自动化用例 ID 列原空，本条落 P0-22）。D4（任务创建债）：写稿自检/探针 scout-p022-start-diag.json 实证 POST /analysis/tasks 返回 code=1「创建下游任务失败：SVC 中间层 create 失败：404」，配置态不跳 view=——挂票 D4-SVCCULT-TASK-CREATE-404；本条入口改走分析记录 enabled「查看结果」打开既有已完成任务（对齐用例前置「已生成培育名单结果」+ env-gate g5），不新发起、不吞并 01271 创建链。D1（双分支）：scout-p022-suggest.json（SVC-20261015-071）诚实空、label_hits_in_body=[]、suggest_dom=[]——有据（≥2 行）承载预期 1/2/3；无据诚实空双文案+不造伪行+不伪渲染三类标签=pass 非缺陷（同 P0-14/P0-19）。D1（标签集合）：行内至少命中资金支持/市场对接/人才引进一类。D1（短板数值）：行内「维度名+邻近数值」须出现在同行数字字段（容差 0.5）；无维度名引用则跳过。D1（两条机构）：取前 2 行标识互异；仅 1 行记 partial observed。B 档零 allow_skip（记录入口+双分支可落）。P2/P3/P8 同姊妹条。viewport 1920x1080@1。列表 2 空格缩进。
