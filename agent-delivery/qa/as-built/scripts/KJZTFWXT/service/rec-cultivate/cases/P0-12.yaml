id: P0-12
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01271
priority: P0
tier: B
title: 显式触发「开始分析」创建异步任务进过程态、分析记录新增、停过程页引导空态待显式查看结果
story: US-SVC-REC-04
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（g5 既有 SVC-20261014-009 已完成）
  - fresh 短探（scout-p012-fresh.json，2026-10-15）：POST /api/topicAsync/topic/v1/analysis/tasks 已 200 恢复（旧票 D4-SVCCULT-TASK-CREATE-500 为上波前夜实测，今日不成立）
  - 本环境 user_id=guest 共享账号，并行会话可能同时作业（瞬时异常加 1 次诚实重试并记 observed）
locators:
  cluster_select: .industry-catalog-select / placeholder「选择产业集群」（P7 点可见容器）
  cluster_option: .arco-trigger-popup:visible .arco-select-option（「新一代信息技术」）
  start_btn: button「开始分析」（getByRole exact，避开粘性提示文案「再点击开始分析」）
  process_shell: main 含「可视化分析过程」/「培育推荐分析生成中」
  task_line: 过程页「任务 ID … 分析对象 产业方向：新一代信息技术」
  tab_records: '[role=tab][data-tab-key=records]'
  records_row: tr 含 task_id（已完成 / cultivate / 查看过程查看结果）
  view_process_btn: 记录行 button「查看过程」
  view_result_btn: button「查看结果」（exact，引导空态出口）
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 显式点击「开始分析」后发起分析任务并进入计算过程态（URL view=processing&task_id=SVC-*，过程壳与分析对象正确）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('未见「开始分析」按钮'); if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）'); let hit=null; const pollUrl=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null }; await start.first().click({ timeout: 8000 }); hit=await pollUrl(8000); if (!hit) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); hit=await pollUrl(12000) } } if (!hit) throw new Error('点击开始分析后未进入过程态（含 1 次诚实重试）: '+page.url()); await page.evaluate((v)=>{ window.__p012TaskId=v; }, hit); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/可视化分析过程|生成中/.test(body)) throw new Error('过程态未见过程壳/生成中标识'); if (!body.includes(hit)) throw new Error('过程页未见任务 ID '+hit); if (!/产业方向：\s*新一代信息技术/.test(body)) throw new Error('过程页分析对象非新一代信息技术')
  - note: 切到「分析记录」Tab，出现本条新建任务的对应记录且状态如实呈现
    assert: |-
      const tid=(await page.evaluate(()=>window.__p012TaskId))||null; if (!tid) throw new Error('前置缺失：未捕获本条新建任务 ID'); const rec=page.locator('[role=tab][data-tab-key="records"]').first(); await expect(rec).toBeVisible({ timeout: 8000 }); await rec.click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(2500); const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; let ok=false; for (let i=0;i<10 && !ok;i++) { const row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid }).first(); if (await row.count()) { const rt=((await row.innerText().catch(()=>''))||''); ok=/已完成/.test(rt) && /cultivate/.test(rt) } if (!ok) { const esc=String(tid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); ok=new RegExp(esc+'[\\s\\S]{0,200}?(cultivate[\\s\\S]{0,80}?已完成|已完成[\\s\\S]{0,80}?cultivate)').test(body) } if (!ok) await page.waitForTimeout(1000) } if (!ok) throw new Error('分析记录未见新任务 '+tid+' 的已完成行')
  - note: 未显式查看结果前结果区呈引导空态（停过程页「分析结果已生成」引导 + 显式「查看结果」出口，不自动跳结果态、不渲染培育名单）
    assert: |-
      const tid2=(await page.evaluate(()=>window.__p012TaskId))||''; if (!tid2) throw new Error('前置缺失：未捕获本条新建任务 ID'); let row2=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid2 }).first(); if (!await row2.count()) { const rec=page.locator('[role=tab][data-tab-key="records"]').first(); await rec.click({ timeout: 8000 }); await page.waitForTimeout(2000); row2=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid2 }).first() } const procBtn=row2.getByRole('button', { name: /查看过程/ }).first(); await procBtn.click({ timeout: 8000 }); await page.waitForTimeout(2000); let body=''; for (let i=0;i<10;i++) { body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body)) break; await page.waitForTimeout(1000) } if (!/分析结果已生成/.test(body)) throw new Error('完成后未见「分析结果已生成」引导文案（引导空态缺失）'); if (!body.includes(tid2)) throw new Error('过程页任务 ID 缺失'); const vr=page.getByRole('button', { name: '查看结果', exact: true }); if (!await vr.count()) throw new Error('未见「查看结果」按钮（引导空态出口缺失）'); const u3=page.url(); if (!/[?&]view=processing/.test(u3)) throw new Error('完成后应停过程页等待显式查看结果，实际 URL: '+u3); if (/[?&]view=result/.test(u3)) throw new Error('不应自动跳转结果态: '+u3); if (/本土机构培育名单/.test(body)) throw new Error('未显式查看结果前不应渲染结果态名单区')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若当天同条件复用直接开结果态记红归 01279 域
as_built_note: 蓝本 FUNC-01271；01271 B 档（显式触发面；P0-06/01262 已验不自动起任务，本条补显式发起）。fresh 短探（_probe-p012-fresh.mjs / scout-p012-fresh.json，2026-10-15 11:30）：POST /analysis/tasks **200 已恢复**（旧票 D4-SVCCULT-TASK-CREATE-500 为上波前夜三次 500，今日姊妹入口 sz P0-07/08、chain-graph P0-08 fresh 均 200，本条实测一致），故不 skip、实跑全程；探针实勘 SVC-20261015-021 创建 → URL view=processing&demo_state=processing&task_id → ~1s success → 记录 2→3。D1（引导空态口径）：用例预期 3「未生成结果前结果区呈引导空态」as-built = 任务生成结束停过程页呈「分析结果已生成 · 任务快照已固化。请点击「查看结果」进入结果页；不会自动跳转」引导 + 显式「查看结果」出口，不自动跳结果态、不请求/渲染培育名单（过程壳原文「须点查看结果后才请求培育名单」）；结果态深验归 01273（金样）/01274~01277。任务 ID 跨 expect 经 window.__p012TaskId 传递；预期 3 经记录行「查看过程」直达本条任务过程页断言（共享环境最新任务≠本条时避免并发歧义）。P2 跨 tick（点击后轮询 URL/正文至稳态）；P3 对比篮可见才关；P7 点可见容器；P8 steps 自含 goto 重置。observed：user_id=guest 共享账号并行作业可能，expect[0] 含 1 次诚实重试（仅 URL 仍无 view= 且按钮仍可见可用时再点，非伪造绿）。B 档零 allow_skip（创建链路 fresh 200，无 skip 理由）。列表 2 空格缩进。
