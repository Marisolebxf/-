id: FUNC-01267
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01267
priority: P1
tier: B
title: 主流程-维度说明文案与演示口径声明
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 1、四条说明文案与附录 A 一致
    assert: |-
      const main = page.locator('main');
      const model = main.getByTestId('svc-rec-cultivate-model');
      await expect(model).toBeVisible();
      const dims = [
        ['现有规模', /体量归一得分|核心专家\/研发投入体量归一得分（演示口径）/],
        ['技术创新能力', /专利|标准产出归一得分（演示口径）/],
        ['服务成效', /服务案例归一得分（演示口径）/],
        ['市场缺口', /稀缺度（演示口径）|供给稀缺度/],
      ];
      for (const [name, pattern] of dims) {
        const tag = model.locator('.svc-rec-fixed-weight-tag').filter({ hasText: name });
        await expect(tag).toBeVisible();
        await tag.hover();
        const tip = page.getByRole('tooltip');
        await expect(tip).toBeVisible();
        await expect(tip).toContainText(pattern);
      }
  - note: 2、底部声明完整可读、与附录 A 一致
    assert: |-
      const main = page.locator('main');
      const config = main.getByTestId('svc-rec-cultivate-config');
      const model = main.getByTestId('svc-rec-cultivate-model');
      await expect(model).toContainText('四维度与招标一致（现有规模/技术创新能力/服务成效/市场缺口）');
      await expect(config).toContainText('权重参数仅演示配置，不改签发分数');
      const weights = model.getByTestId('svc-rec-cultivate-fixed-weights');
      await expect(weights).toContainText('现有规模 25%');
      await expect(weights).toContainText('技术创新能力 30%');
      await expect(weights).toContainText('服务成效 25%');
      await expect(weights).toContainText('市场缺口 20%');
on_fail: 截图 + 抄 X-Trace-Id
