id: FUNC-04691
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04691
priority: P1
tier: B
title: 主流程-机构类型勾选
entry_id: svc-rec-cultivate
preconditions:
  - 已打开分析配置
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 取消后「企业」为未勾选
    assert: |-
      const enterprise = page.locator('.arco-checkbox').filter({ hasText: /^企业$/ }).first();
      await expect(enterprise).toBeVisible();
      const checked = await enterprise.evaluate((el) => el.classList.contains('arco-checkbox-checked'));
      if (checked) await enterprise.click();
      await expect(enterprise).not.toHaveClass(/arco-checkbox-checked/);
  - note: 再次勾选后「企业」为已勾选
    assert: |-
      const enterprise = page.locator('.arco-checkbox').filter({ hasText: /^企业$/ }).first();
      const checked = await enterprise.evaluate((el) => el.classList.contains('arco-checkbox-checked'));
      if (!checked) await enterprise.click();
      await expect(enterprise).toHaveClass(/arco-checkbox-checked/);
  - note: 页面仍在分析配置
    assert: |-
      await expect(page.getByText('分析配置').first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
