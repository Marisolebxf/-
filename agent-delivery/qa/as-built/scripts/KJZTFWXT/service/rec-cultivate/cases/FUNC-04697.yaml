id: FUNC-04697
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04697
priority: P1
tier: B
title: 主流程-过程页不自动进结果
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: wait
    ms: 1500
  - action: click
    target: 重点产业方向
    locator: |-
      page.locator('main [data-testid="svc-rec-cultivate-context"] .arco-cascader-view').first()
  - action: click
    target: 新材料
    locator: |-
      page.locator('.arco-cascader-popup-visible .arco-cascader-option-label').filter({ hasText: /^新材料$/ }).first()
  - action: click
    target: 生成培育名单
  - action: wait
    target: 已完成
expect:
  - note: 1、过程页保持停留，未自动进入名单
    assert: |-
      const main = page.locator('main');
      const process = main.locator('[data-testid="svc-org-analysis-process"]');
      await expect(process).toBeVisible({ timeout: 10000 });
      await expect(process.getByText('已完成').first()).toBeVisible();
      await expect(main.getByRole('heading', { name: '本土机构培育名单' })).not.toBeVisible();
  - note: 2、页面提示不会自动跳转，并提供「查看结果」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('不会自动跳转')).toBeVisible();
      await expect(main.getByRole('button', { name: '查看结果' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
