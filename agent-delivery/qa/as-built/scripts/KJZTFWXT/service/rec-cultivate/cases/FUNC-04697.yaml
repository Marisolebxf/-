id: FUNC-04697
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04697
priority: P1
tier: B
title: 主流程-过程页不自动进结果
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 1、过程页保持停留，未自动进入名单
    assert: |-
      const selectView = page.locator('text=重点产业方向').locator('..').locator('.arco-select-view').first();
      await selectView.click();
      await page.locator('.arco-select-option').filter({ hasText: '新材料' }).first().click();
      await page.getByRole('button', { name: '生成培育名单' }).click();
      await expect(page.getByText('已完成', { exact: false }).first()).toBeVisible({ timeout: 120000 });
      await expect(page.getByText('本土机构培育名单')).not.toBeVisible();
  - note: 2、页面提示不会自动跳转，并提供「查看结果」
    assert: |-
      await expect(page.getByText('不会自动跳转')).toBeVisible();
      await expect(page.getByRole('button', { name: '查看结果' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
