id: FUNC-04709
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04709
priority: P1
tier: B
title: 备选-当天再次开始分析
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: wait
    target: 800ms
  - action: evaluate
    target: |-
      await page.locator('main [data-testid="svc-rec-cultivate-start"]').click({ timeout: 15000 });
      const viewResult = page.getByRole('button', { name: '查看结果' });
      await viewResult.waitFor({ state: 'visible', timeout: 60000 });
      await viewResult.click({ timeout: 15000 });
      await page.locator('[data-testid="svc-rec-cultivate-result"]').waitFor({ state: 'visible', timeout: 60000 });
      await page.getByRole('button', { name: '返回配置' }).click({ timeout: 15000 });
      await page.locator('[data-testid="svc-rec-cultivate-config"]').waitFor({ state: 'visible', timeout: 30000 });
  - action: evaluate
    target: |-
      await page.locator('main').getByText('分析记录', { exact: true }).click();
      await page.waitForTimeout(1200);
      const rows = page.locator('[data-testid="svc-rec-cultivate-records"] tbody tr');
      await rows.first().waitFor({ state: 'visible', timeout: 30000 }).catch(() => {});
      const n = await rows.count();
      await page.evaluate((count) => { window.__cultivateRecordCountBefore = count; }, n);
      await page.locator('main').getByText('培育服务机构推荐分析', { exact: true }).first().click();
      await page.locator('[data-testid="svc-rec-cultivate-config"]').waitFor({ state: 'visible', timeout: 15000 });
  - action: click
    target: 生成培育名单
    locator: |-
      page.locator('main [data-testid="svc-rec-cultivate-start"]')
  - action: wait
    target: 800ms
expect:
  - note: 1、打开当天已有结果
    assert: |-
      await expect(page.getByText('本土机构培育名单')).toBeVisible({ timeout: 60000 });
  - note: 2、分析记录不新增任务
    assert: |-
      await expect(page.getByRole('button', { name: '查看结果' })).not.toBeVisible();
      await page.locator('main').getByText('分析记录', { exact: true }).click();
      await page.waitForTimeout(1200);
      const rows = page.locator('[data-testid="svc-rec-cultivate-records"] tbody tr');
      const after = await rows.count();
      const before = await page.evaluate(() => window.__cultivateRecordCountBefore ?? -1);
      await expect(after).toBe(before);
on_fail: 截图 + 抄 X-Trace-Id
