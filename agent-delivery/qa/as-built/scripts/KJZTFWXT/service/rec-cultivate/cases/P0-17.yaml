as_built_note: 蓝本 FUNC-01278（备选-分析记录列表与切回保留；本波前作金样区已锁 P0-01~05，本条新写落 tier B，用例优先级 P1、脚本 id 按母表顺延 P0-17，coverage 主表 P 列写 P1）。承载面拆解：预期① 列表呈现+表头（任务/类型/状态/创建时间/操作，env-gate history_completed 实证）+互斥（records aria-selected/active 类 + 主 Tab 失活 + .industry-catalog-select 卸载——互斥断言用产业集群选择器而非「分析配置」文本，避开评审模式常驻追溯按钮假红）＝必绿；预期② 状态如实双分支——当天已成功行「已完成」形态机检（状态列+查看过程/查看结果），非完成行命中扩展词表（已完成|在跑|运行中|排队|等待|失败|错误|处理中|进行中|已取消|已终止|超时|已停止）即徽标如实，无据不伪造失败态、live/无据分支落 globalThis observed（用例备注「列表构成勘察未深勘」开放项 3 口径，打开已成功结果归 01279 不吞并）；预期③ 配置草稿保留以「非默认草稿基线快照 + 切回全等比对」承载（权重现有规模键入 30、产业=新一代信息技术、高校取消、中游·中试取消 +7），避免默认态回显假绿；权重四值与 checkbox 三态为相对比较不钉死绝对默认（D1-SVCCULT-WEIGHT-DEFAULT-READOUT 教训，aria-label 定位失败时按 main 内 4 个 spinbutton DOM 序兜底）；链位初始非 +8（跨页持久化残留）时不动链位记 observed 相对比较（P0-09 scout-cross-group 持久化口径）。前置「已产生至少一条分析记录（无则先发起一次）」自含兜底：列表空先 reload 一次（P0-15/16 实证记录列表偶发「暂无分析记录」）、仍空切回主 Tab 显式点「开始分析」再回列表（当天同条件复用直开归 01279，本条兜底触发即无既有记录、无复用歧义）。P2 跨 tick（点击后读态分步求值）；P3 对比篮可见才关；P7 点可见容器（下拉/checkbox）；P8 steps 自含 goto 重置 + expect[0] view= 残留兜底 + 收尾恢复默认权重/重勾高校/重选中游·中试防污染下一条。user_id=guest 共享账号并行作业：兜底 reload+发起即诚实重试路径。B 档零 allow_skip。viewport 1920x1080@1（runner 默认，同 fixtures 口径）。列表 2 空格缩进。
