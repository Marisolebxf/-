o-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(ind)) throw new Error('产业集群未回显: "'+ind+'"'); const orgRead=async()=>{ const out={}; for (const n of ['高校','科研院所','企业']) { let v=null; for (let i=0;i<3&&(v===null);i++) { v=await page.locator('main .arco-checkbox').filter({ hasText: n }).first().locator('input').isChecked().catch(()=>null); if (v===null) await page.waitForTimeout(500) } out[n]=v } return out }; const org0=await orgRead(); if (org0['高校']!==true) { const g=page.locator('main .arco-checkbox').filter({ hasText: '高校' }).first(); await g.click({ timeout: 5000 }); await page.waitForTimeout(700) } const org1=await orgRead(); if (org1['高校']!==true) throw new Error('高校 checkbox 无法归位全选: '+String(org1['高校'])); const g2=page.locator('main .arco-checkbox').filter({ hasText: '高校' }).first(); await g2.click({ timeout: 5000 }); await page.waitForTimeout(800); const org2=await orgRead(); if (org2['高校']!==false) throw new Error('取消高校后仍选中'); for (const k of ['科研院所','企业']) { if (String(org2[k])!==String(org1[k])) throw new Error('取消高校不应影响 '+k+': '+org1[k]+'→'+org2[k]) } const stageView=page.locator('.arco-select-view-multiple').filter({ hasText: '上游·研发' }).first(); await expect(stageView).toBeVisible({ timeout: 8000 }); const s0=((await stageView.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim(); let stageDraft=s0; if (/\+8/.test(s0)) { await stageView.click({ timeout: 8000 }); await page.waitForTimeout(900); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '中游·中试' }).first().click({ timeout: 5000 }); await page.waitForTimeout(800); stageDraft=((await stageView.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim(); if (!/\+7/.test(stageDraft)) throw new Error('取消中游·中试后应 +7 实见: "'+stageDraft+'"'); await page.keyboard.press('Escape'); await page.waitForTimeout(300) } else { globalThis.__p017StagePolluted=s0 } globalThis.__p017Base={ ind: ind, org: org2, stage: stageDraft, weights: weights }
  - note: 预期①②——「分析记录」Tab 呈现历史任务列表（表头 任务/类型/状态/创建时间/操作、≥1 行 SVC-* 任务）且与主 Tab 互斥（主 Tab 失活+配置区卸载）；状态如实——当天已成功行「已完成」形态（含查看过程/查看结果操作），在跑/排队/失败行有据验状态徽标命中词表、无据不伪造（记 observed）
