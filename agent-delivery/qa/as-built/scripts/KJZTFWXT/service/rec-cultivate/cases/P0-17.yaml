 { await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(3000); n=await rowLoc().count() } } if (!n) throw new Error('分析记录列表无任务行（含无则先发起兜底后仍空）'); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/任务[\s\S]{0,60}?类型[\s\S]{0,60}?状态[\s\S]{0,80}?创建时间[\s\S]{0,80}?操作/.test(body)) throw new Error('记录表头不全（任务/类型/状态/创建时间/操作）: '+body.slice(0,200).replace(/\s+/g,' ')); const tabState=async(key)=>{ const t=page.locator('[role=tab][data-tab-key="'+key+'"]').first(); const a=await t.getAttribute('aria-selected').catch(()=>null); const cls=String(await t.getAttribute('class').catch(()=>'')); return { sel:a, active:/active/.test(cls) } }; const rs=await tabState('records'); const cs=await tabState('cultivate'); if (!((rs.sel==='true')||rs.active)) throw new Error('records Tab 未呈激活态: '+JSON.stringify(rs)); if ((cs.sel==='true')||cs.active) throw new Error('records 激活时主 Tab 仍激活（Tab 互斥违背）: '+JSON.stringify(cs)); if (await page.locator('.industry-catalog-select').first().isVisible().catch(()=>false)) throw new Error('记录 Tab 下产业集群选择器仍可见（内容互斥违背）'); const KNOWN=/(已完成|在跑|运行中|排队中?|等待中?|已?失败|错误|处理中|进行中|已取消|已终止|超时|已停止)/; let completed=0; const states=[]; const live=[]; const unknown=[]; const cnt=Math.min(n,30); for (let i=0;i<cnt;i++) { const row=rowLoc().nth(i); const t=((await row.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim(); if (!t) continue; const m=t.match(KNOWN); if (!m) { unknown.push(t.slice(0,100)); continue } const stt=m[1]; states.push(stt); if (stt==='已完成') { completed++; if (!/查看过程/.test(t)) throw new Error('已完成行缺「查看过程」操作: '+t.slice(0,120)); if (!/查看结果/.test(t)) throw new Error('已完成行缺「查看结果」操作: '+t.slice(0,120)) } else { live.push(stt+': '+t.slice(0,100)) } } if (unknown.length) throw new Error('记录行状态列出现无法识别文案（状态如实呈现异常）: '+unknown[0]); if (completed<1) throw new Error('列表无「已完成」行（当天已成功行已完成形态断言无据）'); globalThis.__p017Obs={ rows:n, states:states.join(','), liveRows:live, liveBranch:live.length?('有据：现场非完成态行 '+live.length+' 条，状态徽标命中词表如实呈现'):('无据：现场无在跑/排队/失败行，已完成态如实呈现，未伪造非完成态') }
