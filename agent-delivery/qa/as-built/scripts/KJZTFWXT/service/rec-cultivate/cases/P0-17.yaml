    assert: |-
      const base=globalThis.__p017Base; if (!base) throw new Error('前置缺失：基线快照未建立（expect[0] 应已红）'); const back=page.locator('[role=tab][data-tab-key="cultivate"]').first(); await expect(back).toBeVisible({ timeout: 8000 }); await back.click({ timeout: 8000 }); await page.waitForURL(/tab=cultivate/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1800); const close3=page.locator('button[aria-label="关闭对比篮"]'); if (await close3.count() && await close3.first().isVisible().catch(()=>false)) { try { await close3.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const cfgOk=async()=>((await page.locator('.industry-catalog-select').first().isVisible().catch(()=>false))); let cfgSeen=false; for (let i=0;i<25&&!cfgSeen;i++) { if (await cfgOk()) { cfgSeen=true; break } const u1=page.url(); if (/view=processing|view=result/.test(u1)) { const backBtn=page.getByRole('button', { name: '返回配置', exact: true }); if (await backBtn.count()) { try { await backBtn.first().click({ timeout: 3000 }) } catch {} } else { await page.waitForTimeout(1200) } const mt=page.locator('[role=tab][data-tab-key="cultivate"]').first(); if (await mt.count() && (await mt.isVisible().catch(()=>false))) { try { await mt.click({ timeout: 3000 }) } catch {} } await page.waitForTimeout(1200) } else { await page.waitForTimeout(1000) } } if (!cfgSeen) throw new Error('切回主 Tab 后 25s 内未见分析配置区（含兜底：view= 残留时经「返回配置」+补点主 Tab，P0-15 口径）: '+page.url()); const u=page.url(); if (/view=processing|view=result/.test(u)) throw new Error('配置区可见时 URL 不应残留 view= 处理/结果态: '+u); const sel=page.locator('.industry-catalog-select').first(); const ind=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(ind)) throw new Error('切回后产业集群回显丢失（预期③违背）: "'+ind+'"'); const orgRead=async()=>{ const out={}; for (const n of ['高校','科研院所','企业']) { let v=null; for (let i=0;i<3&&(v===null);i++) { v=await page.locator('main .arco-checkbox').filter({ hasText: n }).first().locator('input').isChecked().catch(()=>null); if (v===null) await page.waitForTimeout(500) } out[n]=v } return out }; const orgA=await orgRead(); for (const k of ['高校','科研院所','企业']) { if (String(orgA[k])!==String(base.org[k])) throw new Error('切回后机构类型 '+k+' 选中态丢失（预期③违背）: '+orgA[k]+'（基线 '+base.org[k]+'）') } if (orgA['高校']!==false) throw new Error('高校应保持取消态（非默认草稿保留断言）: '+String(orgA['高校'])); const stageView=page.locator('.arco-select-view-multiple').filter({ hasText: '上游·研发' }).first(); const st=((await stageView.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim(); if (/\+7/.test(base.stage)) { if (!/\+7/.test(st)) throw new Error('切回后服务环节多选回显丢失（应 +7 实见 "'+st+'"，预期③违背）') } else if (st!==base.stage) throw new Error('切回后服务环节多选与基线不一致: "'+st+'" vs "'+base.stage+'"'); const spin=(name)=>page.locator('[aria-label="'+name+'权重"] [role=spinbutton]').first(); const readW=async(name)=>{ const s=spin(name); if (await s.count()) { const v=String(await s.inputValue().catch(()=>'')); if (v) return v } const all=page.locator('main [role=spinbutton]'); const nn=await all.count(); const idx={'现有规模':0,'技术创新能力':1,'服务成效':2,'市场缺口':3}[name]; if (nn===4 && idx!==undefined) { const v=String(await all.nth(idx).inputValue().catch(()=>'')); if (v) return v } return null }; for (const name of ['现有规模','技术创新能力','服务成效','市场缺口']) { const v=await readW(name); if (String(v)!==String(base.weights[name])) throw new Error('切回后权重 '+name+' 丢失（预期③违背）: '+v+'（基线 '+base.weights[name]+'）') } const wS=await readW('现有规模'); if (String(wS)!=='30') throw new Error('现有规模权重应保持键入值 30（非默认草稿）: '+String(wS)); await page.getByRole('button', { name: '恢复默认权重', exact: true }).click({ timeout: 5000 }); await page.waitForTimeout(600); const g3=page.locator('main .arco-checkbox').filter({ hasText: '高校' }).first(); if ((await g3.locator('input').isChecked().catch(()=>null))===false) { await g3.click({ timeout: 5000 }); await page.waitForTimeout(600) } if (/\+7/.test(st)) { await stageView.click({ timeout: 8000 }); await page.waitForTimeout(900); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '中游·中试' }).first().click({ timeout: 5000 }); await page.waitForTimeout(700); await page.keyboard.press('Escape'); await page.waitForTimeout(300) }; globalThis.__p017Obs2={ url:u, industry:ind, org:orgA, stage:st, weights:{ 现有规模:(await readW('现有规模')), 技术创新能力:(await readW('技术创新能力')), 服务成效:(await readW('服务成效')), 市场缺口:(await readW('市场缺口')) } }
