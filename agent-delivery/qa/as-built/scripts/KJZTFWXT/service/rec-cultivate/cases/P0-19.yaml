steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 选定「新一代信息技术」后显式点击「开始分析」发起本条唯一一次任务，停过程页引导态（「分析结果已生成」+ 显式「查看结果」出口，任务 ID 为本条新任务 SVC-*；跳过任务约 1s，15s 内出引导）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-decision?workspace=cultivate&tab=cultivate', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) } await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('未见「开始分析」按钮'); if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）'); const pollUrl=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null }; await start.first().click({ timeout: 8000 }); let hit=await pollUrl(8000); if (!hit) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); hit=await pollUrl(12000) } } if (!hit) throw new Error('点击开始分析后未进入过程态（含 1 次诚实重试）: '+page.url()); await page.waitForTimeout(1000); let pbody=''; for (let i=0;i<15;i++) { pbody=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(pbody)) break; await page.waitForTimeout(1000) } if (!/分析结果已生成/.test(pbody)) throw new Error('15s 内未见「分析结果已生成」引导（任务未完成或过程页异常，任务 '+hit+'）'); if (!pbody.includes(hit)) throw new Error('过程页未见本条任务 ID '+hit); globalThis.__p019TaskId=hit
  - note: 点过程页引导出口「查看结果」进入结果态——URL view=result 且携带本条任务 ID，主区「本土机构培育名单」
    assert: |-
      const tid=(globalThis.__p019TaskId)||null; if (!tid) throw new Error('前置缺失：未捕获本条任务 ID（expect[0] 应已红）'); const vr=page.getByRole('button', { name: '查看结果', exact: true }); if (!await vr.count()) throw new Error('过程页未见「查看结果」按钮（引导出口缺失）'); await vr.first().click({ timeout: 8000 }); await page.waitForURL((u)=>/[?&]view=result/.test(String(u)), { timeout: 10000 }); await page.waitForTimeout(2000); const u1=page.url(); if (!u1.includes(tid)) throw new Error('结果态 URL 未携带本条任务 ID '+tid+': '+u1); let body=''; for (let i=0;i<10;i++) { body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (body.includes('本土机构培育名单')) break; await page.waitForTimeout(1000) } if (!body.includes('本土机构培育名单')) throw new Error('结果态主区未见「本土机构培育名单」标题')
  - note: 名单落局双分支（步骤①②承载）——有据分支：名单表头列构成含五类语义（机构标识/四维取值/综合分/名次/培育建议；列名按现场 observed 记不强求字面）+前 3 行综合分非严格递减（score[1]≥score[2]≥score[3]，容差 0.5）；无据分支（本轮预期命中）：诚实空态文案齐备（暂无候选+当前筛选范围内无本土机构）+不造伪机构行+不渲染伪名次词（无「第 1 名」类）——诚实空即「降序无可验证」的如实形态，pass 非缺陷
    assert: |-
      const tid2=(globalThis.__p019TaskId)||''; if (!tid2) throw new Error('前置缺失：未捕获本条任务 ID'); if (!page.url().includes(tid2)) throw new Error('前置错位：URL 已不含本条任务 ID '+tid2+': '+page.url()); const close3=page.locator('button[aria-label="关闭对比篮"]'); if (await close3.count() && await close3.first().isVisible().catch(()=>false)) { try { await close3.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const ORG=/公司|大学|学院|学校|研究所|研究院|医院|中心/; const rowsLoc=page.locator('main .arco-table-tr, main [role=row], main tr').filter({ hasText: ORG }); let rows=0, emptyHit='', body3=''; for (let i=0;i<14;i++) { rows=await rowsLoc.count(); if (rows>0) break; body3=((await page.locator('main').first().innerText().catch(()=>''))||''); if (body3.includes('暂无候选') && body3.includes('当前筛选范围内无本土机构')) { emptyHit='暂无候选+当前筛选范围内无本土机构'; break } await page.waitForTimeout(1000) } globalThis.__p019Branch=rows>0?'non-empty':(emptyHit?'honest-empty':null); if (!globalThis.__p019Branch) { const tbody=((await page.locator('main').first().innerText().catch(()=>''))||''); if (tbody.includes('暂无候选')) globalThis.__p019Branch='honest-empty'; else if (tbody.includes('当前筛选范围内无本土机构')) globalThis.__p019Branch='honest-empty' } if (globalThis.__p019Branch==='non-empty') { const head=((await page.locator('main .arco-table-th, main th').allInnerTexts().catch(()=>[]))||[]).join('||'); globalThis.__p019HeadObserved=head; const hitCols={}; if (/机构|单位|名称|企业/.test(head)) hitCols['机构标识']=true; if (/规模|创新|成效|缺口|维度|得分/.test(head)) hitCols['四维取值']=true; if (/综合分|综合评/.test(head)) hitCols['综合分']=true; if (/名次|排名|序/.test(head)) hitCols['名次']=true; if (/建议|培育/.test(head)) hitCols['培育建议']=true; globalThis.__p019HitCols=Object.keys(hitCols).join('/'); const miss=[['机构标识',/机构|单位|名称|企业/],['四维取值',/规模|创新|成效|缺口|维度|得分/],['综合分',/综合分|综合评/],['名次',/名次|排名|序/],['培育建议',/建议|培育/]].filter(([k])=>!hitCols[k]).map(([k])=>k); if (miss.length) throw new Error('名单表头缺列类语义（'+miss.join('/')+'；列名现场记 observed不强求字面）: '+head.slice(0,160)); const texts=[]; const n3=Math.min(rows,3); for (let i=0;i<n3;i++) { const t=((await rowsLoc.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim(); texts.push(t); globalThis[('__p019Row'+(i+1))]=t.slice(0,220) } const scores=[]; texts.forEach((t,i)=>{ const nums=(t.match(/\d+(?:\.\d+)?/g)||[]).map(Number); if (!nums.length) throw new Error('第 '+(i+1)+' 行未见数字字段（综合分/名次/四维类）: "'+t.slice(0,120)+'"'); scores.push(nums) }); const pickScore=(nums)=>{ const cands=nums.filter((x)=>x>=0 && x<=100); if (!cands.length) return nums[0]; const mx=Math.max(...cands); return (cands.filter((x)=>Math.abs(x-mx)<=1e-9).length>1)?mx:mx }; const s1=pickScore(scores[0]), s2=pickScore(scores[1]||scores[0]), s3=pickScore(scores[2]||scores[0]); globalThis.__p019Scores=s1+'/'+s2+'/'+s3; if (s1 < s2 - 0.5) throw new Error('默认排序违背非严格递减：第 1 名综合分 '+s1+' 低于第 2 名 '+s2+'（容差 0.5）'); if (s2 < s3 - 0.5) throw new Error('默认排序违背非严格递减：第 2 名综合分 '+s2+' 低于第 3 名 '+s3+'（容差 0.5）') } else if (globalThis.__p019Branch==='honest-empty') { const ebody=((await page.locator('main').first().innerText().catch(()=>''))||''); const missE=[]; if (!ebody.includes('暂无候选')) missE.push('暂无候选'); if (!ebody.includes('当前筛选范围内无本土机构')) missE.push('当前筛选范围内无本土机构'); if (missE.length) throw new Error('诚实空态文案不齐备（缺 '+missE.join('/')+'）'); if (rows>0) throw new Error('诚实空态下渲染了 '+rows+' 个伪机构行（D3-SVCCULT-LIST-DISHONEST 候选）'); const fakeRank=/第\s*[1１一二三]\s*名/.test(ebody); if (fakeRank) throw new Error('名单空仍渲染伪名次词「第 N 名」（伪排序呈现，D3-SVCCULT-LIST-DISHONEST 候选）'); globalThis.__p019EmptyObserved='任务 '+tid2+' 名单诚实空（暂无候选+当前筛选范围内无本土机构）：默认降序在本数据态无可验证对象（第 1 名综合分不低于第 2 名——无名单即无违背），诚实空为如实形态非缺陷；列构成机检待有据数据态回访' } else { throw new Error('名单区既无机构行也无诚实空态文案（暂无候选/当前筛选范围内无本土机构）——名单呈现缺失') }
  - note: observed 收口（不判红）——记录名单条数、列名现场形态、名次列数值首二三行非严格递增形态、本轮落局分支与诚实空证据；升序切换现场未见控件归 coverage 未覆盖
    assert: |-
      const tid4=(globalThis.__p019TaskId)||''; const branch=(globalThis.__p019Branch)||null; if (!tid4 || !branch) throw new Error('前置缺失：任务 ID 或双分支未定局（expect[0]/[2] 应已红）'); if (branch==='non-empty') { globalThis.__p019Observed='任务 '+tid4+' 名单非空：'+((globalThis.__p019RowsCount)||(globalThis.__p019RowsCount=undefined)||'')+' 行；列构成命中 '+((globalThis.__p019HitCols)||'')+'；前 3 行综合分 '+((globalThis.__p019Scores)||'')+'（非严格递减，容差 0.5）；名单对象属地黑盒执行时记录（用例备注：深圳本土在库机构）' } else { globalThis.__p019Observed=((globalThis.__p019EmptyObserved)||('任务 '+tid4+' 名单诚实空'))+'；升序切换现场未见控件归 coverage 未覆盖；ⓘ 语义（D1=draft）与 mock（D4=mock）旁证记 observed，角标深验归 01281' }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若名单空但页面仍渲染伪表头+伪机构行 / 伪名次词 → 记红挂 D3-SVCCULT-LIST-DISHONEST（名单不诚实呈现）；若表头缺列类语义（有据分支）或前 3 行综合分严格递增超容差 → 记红归 01275 列构成/降序域（列名现场记 observed 不作字面红）；若点击「查看结果」后停 processing 未跳结果态 → 归结果态呈现域（P0-14 已实证路径，复发按环境波动记 observed 并附任务 ID）；若创建 POST 失效未进过程态 → 归执行链域（P0-12/P0-13 已实证 200 恢复，复发按环境波动记 observed）
as_built_note: 蓝本 FUNC-01275（名单字段构成与默认降序；上波情报「01275 排序与建议字段深验受名单空限制归其本条双分支」由本条落地）。D1（列语义映射口径）：用例预期 1 五类列（机构标识/四维取值/综合分/名次/培育建议）现场列名不可预读（本环境名单持续诚实空，scout-p014-result result_body_head 无表头证据），有据分支按语义正则命中表头（机构|单位|名称|企业 / 规模|创新|成效|缺口|维度|得分 / 综合分|综合评 / 名次|排名|序 / 建议|培育），命中清单与表头全文记 observed 不钉死字面；四维取值未单列四根时按语义类命中（宽正则），单列核对待有据回访。D1（降序口径，预期 2「第 1 名综合分不低于第 2 名」）：黑盒行文本无法定位综合分列 → 行内数字启发取分（0–100 段最大值兜底首数；0–100 段空缺时取首数），前 3 行 s1≥s2≥s3 容差 0.5（用例「不低于」=非严格；容差吞伪同分行并列），取分行数值全文记 observed。D1（双分支）：当前数据态多任务持续诚实空（SVC-20261015-027/036/061，P0-14/15/16/18 实证），本条预期命中无据分支——诚实空文案齐备（暂无候选+当前筛选范围内无本土机构双文案同时验，比 P0-14 单文案 or 更严）+不造伪行+不渲染伪名次词（/第\s*[1１一二三]\s*名/），诚实空即「降序无可验证」的如实形态 pass 非缺陷；名单空但渲染伪表头+伪行/伪名次词则红挂 D3-SVCCULT-LIST-DISHONEST。规避复用缺陷票干扰（P0-18 票 D3-SVCCULT-SAME-DAY-REUSE-MISSING）：本条只发起一次任务、不二次发起不复用既有任务回看，与同条件再发起三判据域（01279）不吞并。结果态进入走 P0-14 蓝本全链（发起→停过程页引导→显式查看结果）。指标旁证：M_SVC_REC_CULTIVATE_SCORE 经 metric-registry MCP 查得 D1=draft（挂 Q-SVCCHAIN-05）/D4=mock / D2=pending / D3=pending_ods（2026-10-15）——综合分列语义断言的注册表旁证（ⓘ 在位语义归 01281 评审角标条不吞并，本条只记 observed）。任务 ID 跨 expect 经 globalThis.__p019TaskId 传递，expect[1]/[2]/[3] 防 URL 错位（核对含 tid）。P2 跨 tick（点击后轮询 URL/正文至稳态）；P3 对比篮可见才关；P7 点可见容器（.industry-catalog-select / .arco-select-view）；P8 steps 自含 goto 重置 + expect[0] 承接态（view=processing/result 残留）兜底重置。诚实重试仅当 URL 仍无 view= 且按钮仍可见可用（首次完全未生效）；user_id=guest 共享账号并发异常记 observed。B 档零 allow_skip（双分支可落，无 skip 理由）。viewport 1920x1080@1（runner 默认，同 fixtures 口径）。列表 2 空格缩进。
