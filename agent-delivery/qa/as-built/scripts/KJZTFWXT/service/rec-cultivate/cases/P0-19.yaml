  - 指标 M_SVC_REC_CULTIVATE_SCORE 就绪度（MCP 2026-10-15）：D1=draft（挂 Q-SVCCHAIN-05）/ D4=mock——综合分列语义断言的注册表旁证；D2=pending / D3=pending_ods，评审态角标深验归 01281 不吞并
  - 本环境 user_id=guest 共享账号，并行会话可能同时作业（非本条异常加 1 次诚实重试并记 observed）
