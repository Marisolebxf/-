title: 名单字段构成与默认降序——列含机构标识/四维取值/综合分/名次/培育建议且默认综合分非严格递减（有据完整机检/无据诚实空，双分支）
story: US-SVC-REC-04
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（g2 合法条件后开始分析 enabled；g5 已完成任务可查看结果）
