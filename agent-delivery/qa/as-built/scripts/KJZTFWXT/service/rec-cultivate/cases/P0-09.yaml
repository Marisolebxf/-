id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01265
priority: P0
tier: B
title: 目标与链位跨组条件并存、空选保护使全取消重置回全选
story: US-SVC-REC-03
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass
  - 已进入 cultivate 工作区且配置区可见
locators:
  org_checkboxes: 'main .arco-checkbox（高校/科研院所/企业，默认全选）'
  stage_select: '.arco-select-view-multiple（上游·研发…，默认全选 11 项）'
  stage_opts: '.arco-trigger-popup:visible .arco-select-option'
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 目标组与链位组条件可同时并存（取消高校/企业 + 取消 2 个链位后，两组剩余选中态同时成立、不互相清空；前置自愈全选基线防上轮遗留）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; for (const n of ['高校','科研院所','企业']) { const c=page.locator('main .arco-checkbox').filter({ hasText: n }).first(); if (!(await c.locator('input').isChecked().catch(()=>true))) { await c.click({ timeout: 5000 }); await page.waitForTimeout(400) } } const sel=page.locator('main .arco-select-view-multiple').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(900); const opts=page.locator('.arco-trigger-popup:visible .arco-select-option'); const cnt=await opts.count(); for (let i=0;i<cnt;i++) { const cls=await opts.nth(i).getAttribute('class'); if (!((cls||'').includes('selected'))) { await opts.nth(i).click({ timeout: 3000 }); await page.waitForTimeout(300) } } await page.keyboard.press('Escape'); await page.waitForTimeout(400); for (const n of ['高校','企业']) { const c=page.locator('main .arco-checkbox').filter({ hasText: n }).first(); if (await c.locator('input').isChecked().catch(()=>false)) { await c.click({ timeout: 5000 }); await page.waitForTimeout(500) } } const kyChecked=await page.locator('main .arco-checkbox').filter({ hasText: '科研院所' }).first().locator('input').isChecked().catch(()=>null); if (kyChecked!==true) throw new Error('跨组操作后科研院所应仍选中'); await sel.click({ timeout: 8000 }); await page.waitForTimeout(900); for (const k of ['中游·中试','下游·人才']) { const o=page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: k }).first(); await o.click({ timeout: 5000 }); await page.waitForTimeout(500) } const v=(await sel.innerText()).replace(/\s+/g,' '); if (!/\+6/.test(v)) throw new Error('取消 2 链位后应 +6 实见: '+v); const kyChecked2=await page.locator('main .arco-checkbox').filter({ hasText: '科研院所' }).first().locator('input').isChecked().catch(()=>null); if (kyChecked2!==true) throw new Error('链位操作清掉了目标组选中态'); await page.keyboard.press('Escape'); await page.waitForTimeout(300)
  - note: 两组均不可清空（空选保护）：目标组级联取消至最后一项后整组重置回全选；链位组单轮全取消后重置回全选 +8（用例「回未选态」现场不可达，D2 跟现场）
    assert: |-
      for (const n of ['高校','科研院所','企业']) { const c=page.locator('main .arco-checkbox').filter({ hasText: n }).first(); if (!(await c.locator('input').isChecked().catch(()=>true))) { await c.click({ timeout: 5000 }); await page.waitForTimeout(400) } } const c1=page.locator('main .arco-checkbox').filter({ hasText: '高校' }).first(); await c1.click({ timeout: 5000 }); await page.waitForTimeout(500); const c2=page.locator('main .arco-checkbox').filter({ hasText: '科研院所' }).first(); await c2.click({ timeout: 5000 }); await page.waitForTimeout(500); if (await c1.locator('input').isChecked().catch(()=>null)!==false) throw new Error('高校 取消后仍选中'); if (await c2.locator('input').isChecked().catch(()=>null)!==false) throw new Error('科研院所 取消后仍选中'); const c3=page.locator('main .arco-checkbox').filter({ hasText: '企业' }).first(); await c3.click({ timeout: 5000 }); await page.waitForTimeout(800); for (const n of ['高校','科研院所','企业']) { const on=await page.locator('main .arco-checkbox').filter({ hasText: n }).first().locator('input').isChecked().catch(()=>null); if (on!==true) throw new Error('点掉最后一项后未整组重置全选（空选保护）：'+n+'='+on) } const selAny=page.locator('main .arco-select-view-multiple').first(); await selAny.click({ timeout: 8000 }); await page.waitForTimeout(900); const allOpts=page.locator('.arco-trigger-popup:visible .arco-select-option'); const total=await allOpts.count(); if (total!==11) throw new Error('链位选项 '+total+' ≠11'); for (let i=0;i<total;i++) { const cls=await allOpts.nth(i).getAttribute('class'); if (!((cls||'').includes('selected'))) { await allOpts.nth(i).click({ timeout: 3000 }); await page.waitForTimeout(300) } } await page.keyboard.press('Escape'); await page.waitForTimeout(400); await selAny.click({ timeout: 8000 }); await page.waitForTimeout(900); for (let i=0;i<total;i++) { await allOpts.nth(i).click({ timeout: 3000 }); await page.waitForTimeout(300) } await page.keyboard.press('Escape'); await page.waitForTimeout(600); const v2=(await selAny.innerText()).replace(/\s+/g,' ').trim(); if (!/\+8/.test(v2)) throw new Error('链位全取消后未重置全选 实见: '+v2); for (const n2 of ['高校','科研院所','企业']) { const on2=await page.locator('main .arco-checkbox').filter({ hasText: n2 }).first().locator('input').isChecked().catch(()=>null); if (on2!==true) throw new Error('链位操作后目标组基线被扰：'+n2+'='+on2) }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-01265；实勘（scout-cross-group.json）：目标组=checkbox 默认全选、链位组=多选默认全选（11）。跨组并存断言=一组改动不清另一组选中态。用例预期「全部取消后回未选态」现场不可达——两组均有空选保护：最后一项取消后整组重置回全选（checkbox 逐项取消→点最后一项回 3/3；链位逐项取消→回 +8 全选），属控件行为变化 D2-SVCCULT-CROSSGROUP-EMPTY-RESET（脚本跟现场，回开用例修订）；控件形态差异另见 D2-SVCCULT-ORG-TAG-ASBUILT / D2-SVCCULT-STAGE-TAG-ASBUILT。空选保护使末态自然回到全选基线防污染下一条（P8）；筛选态跨页持久化，reload 不重置。全不选目标类型时发起行为按用例备注归 observed（POST 恒 500 本轮不可达，见 P0-10）。B 档零 allow_skip；列表 2 空格缩进。
