id: P0-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01272
priority: P0
tier: B
title: 同用户同条件单飞拦截——过程态入口守势（配置区卸载）+ 会话级 create 计数不重复起任务
story: US-SVC-REC-04
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass
  - fresh 短探（scout-p012-fresh.json，2026-10-15）：POST /api/topicAsync/topic/v1/analysis/tasks 已 200 恢复（旧票 D4-SVCCULT-TASK-CREATE-500 不成立），执行链可实跑
  - 本环境 user_id=guest 共享账号，并行会话可能同时作业（非本条异常加 1 次诚实重试并记 observed）
locators:
  cluster_select: .industry-catalog-select / placeholder「选择产业集群」（P7 点可见容器）
  cluster_option: .arco-trigger-popup:visible .arco-select-option（「新一代信息技术」）
  start_btn: button「开始分析」（getByRole exact，避开粘性提示文案「再点击开始分析」）
  create_post: POST /api/topicAsync/topic/v1/analysis/tasks（非 /list；会话级计数只认 status<400 的成功创建）
  process_shell: main 含「可视化分析过程」/ 任务 ID / 分析对象
  tab_records: '[role=tab][data-tab-key=records]'
  records_row: tr 含 task_id（已完成 / cultivate / 查看过程查看结果）
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 同条件首次发起合法——显式点击「开始分析」创建一次任务并进入计算过程态（URL view=processing&task_id=SVC-*，过程壳与分析对象正确）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-decision?workspace=cultivate&tab=cultivate', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) } await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); if (!globalThis.__p013Hooked) { globalThis.__p013Hooked = true; globalThis.__p013CreatePosts = 0; page.on('response', (r) => { if (r.request().method() === 'POST' && /\/analysis\/tasks(\?|$)/.test(r.url()) && r.status() < 400) globalThis.__p013CreatePosts++ }) } else { globalThis.__p013CreatePosts = 0 } const sel=page.locator('.industry-catalog-select').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('未见「开始分析」按钮'); if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）'); const pollUrl=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null }; await start.first().click({ timeout: 8000 }); let hit=await pollUrl(8000); if (!hit) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); hit=await pollUrl(12000) } } if (!hit) throw new Error('点击开始分析后未进入过程态（会话成功 create='+((globalThis.__p013CreatePosts)||0)+' 次）: '+page.url()); await page.waitForTimeout(1000); if (!((globalThis.__p013CreatePosts)||0)) throw new Error('已进过程态但会话内未见成功 create POST（监听或链路异常）'); globalThis.__p013TaskId=hit; const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/可视化分析过程|生成中|分析结果已生成/.test(body)) throw new Error('过程态未见过程壳/生成中/结果引导标识'); if (!body.includes(hit)) throw new Error('过程页未见任务 ID '+hit); if (!/产业方向：\s*新一代信息技术/.test(body)) throw new Error('过程页分析对象非新一代信息技术')
  - note: 任务在跑/停过程页期间入口守势——配置区卸载、「开始分析」按钮不可见，同条件重复发起物理不可达（不重复起任务）
    assert: |-
      const tid=(globalThis.__p013TaskId)||null; if (!tid) throw new Error('前置缺失：未捕获本条任务 ID（expect[0] 应已红）'); const u=page.url(); if (!/[?&]view=processing/.test(u)) throw new Error('应停过程页 view=processing（守势断言前提），实际: '+u); const startBtn=page.getByRole('button', { name: '开始分析', exact: true }); const n=await startBtn.count(); const vis=n ? await startBtn.first().isVisible().catch(()=>false) : false; if (vis) throw new Error('过程态「开始分析」按钮仍可见（入口守势失效，可重复发起）'); const ph=page.getByPlaceholder('选择产业集群'); if (await ph.count() && await ph.first().isVisible().catch(()=>false)) throw new Error('过程态配置区（产业集群选择框）仍可见（配置区未卸载）'); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!body.includes(tid)) throw new Error('过程页未见本条任务 ID '+tid)
  - note: 会话级 POST 计数——过程态全周期至完成静置后成功 create 恰 1 次，分析记录中本条任务恰 1 行且已完成（重复点击不重复起任务）
    assert: |-
      const tid2=(globalThis.__p013TaskId)||''; if (!tid2) throw new Error('前置缺失：未捕获本条任务 ID'); let body=''; for (let i=0;i<12;i++) { body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成|已完成/.test(body)) break; await page.waitForTimeout(1000) } await page.waitForTimeout(3000); const posts=(globalThis.__p013CreatePosts)||0; if (posts>1) throw new Error('会话内成功 create POST='+posts+' 次（>1，重复起任务，单飞失效）'); if (posts<1) throw new Error('会话内成功 create POST='+posts+' 次（<1，监听或链路异常）'); const rec=page.locator('[role=tab][data-tab-key="records"]').first(); await expect(rec).toBeVisible({ timeout: 8000 }); await rec.click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(2500); const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const rows=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid2 }); let rn=-1; for (let i=0;i<8;i++) { rn=await rows.count(); if (rn>0) break; await page.waitForTimeout(1000) } if (rn!==1) throw new Error('分析记录中本条任务 '+tid2+' 行数='+rn+'（应恰 1 行）'); const rt=((await rows.first().innerText().catch(()=>''))||''); if (!/已完成/.test(rt)) throw new Error('本条任务记录状态非已完成: '+rt.slice(0,120))
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若点击后直接 view=result（当天复用直开结果、poll 不到 processing）记红并归 01279 域 observed；若会话成功 create ≥2 视单飞失效真红（附 POST 状态序列）
as_built_note: 蓝本 FUNC-01272；01272 B 档（单飞拦截面）。D1（单飞拦截 as-built 口径）：用例「任务在跑时以同条件再次点击开始分析→不重复起任务」，现场拦截形态=入口守势——点击后进 view=processing 过程态即卸载配置区与「开始分析」按钮（scout-p012-fresh 实证过程页仅「查看结果/查看分析记录」出口），同条件重复发起物理不可达；辅以会话级 POST /analysis/tasks（非 /list）成功计数（只认 status<400，拦截 4xx 不计成功创建）在过程态全周期+完成静置 3s 内恒 1，及分析记录本条任务恰 1 行。任务为快完型（~1s success），「生成中」在跑态不强求捕获；完成后停过程页引导态（「分析结果已生成」，P0-12 实证 URL 保持 view=processing 不自动跳），守势断言覆盖 processing 全周期含引导态。analysis_fp=svc|cultivate|*（产业仅上下文、筛选与权重不进指纹）→「同条件」以工作区级指纹承载，本条用「新一代信息技术」与蓝本一致；已完成后再发起行为（返回配置重析/当天复用/重新分析）归 01277/01279 域，本条不吞并。点击失效诚实重试仅当 URL 仍无 view= 且按钮仍可见可用（首次完全未生效）；若重试仍双成功 create → 真红（单飞失效）。旧票 D4-SVCCULT-TASK-CREATE-500 已不成立（scout-p012-fresh：SVC-20261015-021 创建 200），执行链实跑不 skip。任务 ID 跨 expect 经 globalThis.__p013TaskId 传递（node 侧，与 P0-12 的 window.__ 同用途）；POST 监听器经 __p013Hooked 仅注册一次。P2 跨 tick（点击后轮询 URL/正文至稳态）；P3 对比篮可见才关；P7 点可见容器；P8 steps 自含 goto 重置 + expect[0] 承接态兜底。viewport 1920x1080@1（runner 默认，同 fixtures 口径）。B 档零 allow_skip（创建链路 fresh 200，无 skip 理由）。列表 2 空格缩进。
