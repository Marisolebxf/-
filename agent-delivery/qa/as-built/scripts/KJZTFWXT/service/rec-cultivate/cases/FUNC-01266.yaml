id: FUNC-01266
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01266
priority: P1
tier: B
title: 主流程-培育评估模型区构成与默认权重
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 1、区块标题为「培育评估模型（演示模型口径）」且说明行明示四维度与招标一致；2、四维度为现有规模、技术创新能力、服务成效、市场缺口；3、四权重初值为 25/30/25/20 且各带上下调节钮
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '培育评估模型（演示模型口径）' })).toBeVisible();
      await expect(main.getByText(/四维度与招标一致/)).toBeVisible();
  - note: 2、四维度为现有规模、技术创新能力、服务成效、市场缺口
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('现有规模')).toBeVisible();
      await expect(main.getByText('技术创新能力')).toBeVisible();
      await expect(main.getByText('服务成效')).toBeVisible();
      await expect(main.getByText('市场缺口')).toBeVisible();
  - note: 3、四权重初值为 25/30/25/20 且各带上下调节钮
    assert: |-
      const main = page.locator('main');
      const spinners = main.locator('.arco-input-number');
      await expect(spinners).toHaveCount(4);
      await expect(spinners.nth(0).locator('input')).toHaveValue('25');
      await expect(spinners.nth(1).locator('input')).toHaveValue('30');
      await expect(spinners.nth(2).locator('input')).toHaveValue('25');
      await expect(spinners.nth(3).locator('input')).toHaveValue('20');
      await expect(main.locator('.arco-input-number-step-button').first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
