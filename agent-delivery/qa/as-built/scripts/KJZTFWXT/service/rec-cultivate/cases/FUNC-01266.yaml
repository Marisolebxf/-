id: FUNC-01266
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01266
priority: P0
tier: B
title: 主流程-培育评估模型区构成与默认权重
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 1、区块标题为「培育评估模型（演示模型口径）」且说明行明示四维度与招标一致
    assert: |-
      const model = page.locator('div, section').filter({ hasText: '培育评估模型' }).filter({ hasText: '四维度与招标一致' }).first();
      await expect(model.getByText('培育评估模型', { exact: true })).toBeVisible();
      await expect(model.getByText('四维度与招标一致（现有规模/技术创新能力/服务成效/市场缺口）')).toBeVisible();
  - note: 2、四维度为现有规模、技术创新能力、服务成效、市场缺口
    assert: |-
      const model = page.locator('div, section').filter({ hasText: '培育评估模型' }).filter({ hasText: '四维度与招标一致' }).first();
      await expect(model.getByText('现有规模 25%')).toBeVisible();
      await expect(model.getByText('技术创新能力 30%')).toBeVisible();
      await expect(model.getByText('服务成效 25%')).toBeVisible();
      await expect(model.getByText('市场缺口 20%')).toBeVisible();
  - note: 3、四权重初值为 25/30/25/20 且各带上下调节钮
    assert: |-
      const model = page.locator('div, section').filter({ hasText: '培育评估模型' }).filter({ hasText: '四维度与招标一致' }).first();
      await expect(model.getByText('现有规模 25%')).toBeVisible();
      await expect(model.getByText('技术创新能力 30%')).toBeVisible();
      await expect(model.getByText('服务成效 25%')).toBeVisible();
      await expect(model.getByText('市场缺口 20%')).toBeVisible();
      const tweakButtons = model.getByRole('button').filter({ hasNotText: '生成培育名单' });
      await expect(tweakButtons).toHaveCount(8);
on_fail: 截图 + 抄 X-Trace-Id
