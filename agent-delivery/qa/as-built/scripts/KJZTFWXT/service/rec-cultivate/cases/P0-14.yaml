id: P0-14
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01273
priority: P0
tier: B
title: 培育名单结果态呈现——过程页「查看结果」显式进结果态，名单有据验机构行/无据验诚实空（双分支）
story: US-SVC-REC-04
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（g5 已完成任务可查看结果）
  - fresh 短探（scout-p012-fresh.json，2026-10-15）：POST /api/topicAsync/topic/v1/analysis/tasks 已 200 恢复（SVC-20261015-021），本条实跑新任务链路不 skip
  - 结果态名单数据态：历史任务 SVC-20261014-009 名单为诚实空（scout-result-view.json：「暂无候选」/「当前筛选范围内无本土机构」）；新任务名单态不钉死，按双分支断言（有据验字段、无据验诚实空），不造假名单
  - 本环境 user_id=guest 共享账号，并行会话可能同时作业（非本条异常加 1 次诚实重试并记 observed）
locators:
  cluster_select: .industry-catalog-select / placeholder「选择产业集群」（P7 点可见容器）
  cluster_option: .arco-trigger-popup:visible .arco-select-option（「新一代信息技术」）
  start_btn: button「开始分析」（getByRole exact，避开粘性提示文案「再点击开始分析」）
  process_guide: 过程页引导「分析结果已生成 · 任务快照已固化…」
  view_result_btn: button「查看结果」（exact，过程页引导出口）
  result_title: 结果态主区标题「本土机构培育名单」
  result_actions: 结果态按钮「重新分析」「返回配置」「导出名单」
  empty_hint: 诚实空态文案「暂无候选」/「当前筛选范围内无本土机构」
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
expect:
  - note: 选定「新一代信息技术」后显式点击「开始分析」，创建异步任务并停在过程页引导态（「分析结果已生成」+ 显式「查看结果」出口，任务 ID 为本条新任务 SVC-*）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('http://10.50.69.111:30892/service/institution-decision?workspace=cultivate&tab=cultivate', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) } await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('未见「开始分析」按钮'); if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）'); const pollUrl=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null }; await start.first().click({ timeout: 8000 }); let hit=await pollUrl(8000); if (!hit) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); hit=await pollUrl(12000) } } if (!hit) throw new Error('点击开始分析后未进入过程态（含 1 次诚实重试）: '+page.url()); await page.waitForTimeout(1000); let pbody=''; for (let i=0;i<15;i++) { pbody=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(pbody)) break; await page.waitForTimeout(1000) } if (!/分析结果已生成/.test(pbody)) throw new Error('15s 内未见「分析结果已生成」引导（任务未完成或过程页异常，任务 '+hit+'）'); if (!pbody.includes(hit)) throw new Error('过程页未见本条任务 ID '+hit); globalThis.__p014TaskId=hit
  - note: 点过程页引导出口「查看结果」进入结果态——URL view=result 且携带本条任务 ID，主区为培育名单（标题「本土机构培育名单」）并带「重新分析」「返回配置」操作件
    assert: |-
      const tid=(globalThis.__p014TaskId)||null; if (!tid) throw new Error('前置缺失：未捕获本条任务 ID（expect[0] 应已红）'); const vr=page.getByRole('button', { name: '查看结果', exact: true }); if (!await vr.count()) throw new Error('过程页未见「查看结果」按钮（引导出口缺失）'); await vr.first().click({ timeout: 8000 }); await page.waitForURL((u)=>/[?&]view=result/.test(String(u)), { timeout: 10000 }); await page.waitForTimeout(2000); const u1=page.url(); if (!u1.includes(tid)) throw new Error('结果态 URL 未携带本条任务 ID '+tid+': '+u1); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!body.includes('本土机构培育名单')) throw new Error('结果态主区未见「本土机构培育名单」标题'); const rerun=page.getByRole('button', { name: '重新分析', exact: true }); if (!await rerun.count()) throw new Error('结果态未见「重新分析」按钮'); const back=page.getByRole('button', { name: '返回配置', exact: true }); if (!await back.count()) throw new Error('结果态未见「返回配置」按钮')
  - note: 名单双分支（预期 1+2 合并承载）——有据分支：名单呈机构行且行含机构标识与数字字段（名次/评分类，命中名单记 observed 不钉死硬期望）；无据分支：名单为诚实空态（「暂无候选」或「当前筛选范围内无本土机构」），不渲染伪造机构行
    assert: |-
      const tid2=(globalThis.__p014TaskId)||''; if (!tid2) throw new Error('前置缺失：未捕获本条任务 ID'); if (!page.url().includes(tid2)) throw new Error('前置错位：URL 已不含本条任务 ID '+tid2+': '+page.url()); const close3=page.locator('button[aria-label="关闭对比篮"]'); if (await close3.count() && await close3.first().isVisible().catch(()=>false)) { try { await close3.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const ORG=/公司|大学|学院|学校|研究所|研究院|医院|中心/; const rowsLoc=page.locator('main .arco-table-tr, main [role=row], main tr').filter({ hasText: ORG }); let rows=0, emptyHit=''; for (let i=0;i<14;i++) { rows=await rowsLoc.count(); if (rows>0) break; const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (body.includes('暂无候选')) { emptyHit='暂无候选'; break } if (body.includes('当前筛选范围内无本土机构')) { emptyHit='当前筛选范围内无本土机构'; break } await page.waitForTimeout(1000) } globalThis.__p014Rows=rows; globalThis.__p014Empty=emptyHit; globalThis.__p014BranchUrl=page.url(); if (rows>0) { const n=Math.min(rows,20); const texts=[]; for (let i=0;i<n;i++) { const t=((await rowsLoc.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim(); if (t) texts.push(t.slice(0,200)) } globalThis.__p014RowTexts=texts; const first=texts[0]||''; if (!/\d+(\.\d+)?/.test(first)) throw new Error('首行未见数字字段（名次/评分类）: "'+first+'"') } else if (!emptyHit) { throw new Error('名单区既无机构行也无诚实空态文案（暂无候选/当前筛选范围内无本土机构）——名单呈现缺失') }
  - note: 双分支观察收口（observed，不判红）——新任务名单态与上波历史任务空态（SVC-20261014-009）对照记 observed；结果态操作件（重新分析/返回配置/导出名单）至少 2 件可见
    assert: |-
      const tid3=(globalThis.__p014TaskId)||''; if (!tid3) throw new Error('前置缺失：未捕获本条任务 ID'); const rows=(globalThis.__p014Rows); if (rows===undefined) throw new Error('前置缺失：双分支未定局（expect[2] 应已红）'); const empty=(globalThis.__p014Empty)||''; if (rows>0) { globalThis.__p014Observed='新任务 '+tid3+' 名单非空 '+rows+' 行（有据分支命中，行文本不钉死硬期望，详见 result.actual 与截图）' } else { globalThis.__p014Observed='新任务 '+tid3+' 名单为诚实空态（'+empty+'），与上波历史任务 SVC-20261014-009 空态口径一致；01275/01276 排序与建议字段深验在本数据态不可验（归其本条双分支/observed，不在本条吞并）' } const btns=[]; for (const name of ['重新分析','返回配置','导出名单']) { if (await page.getByRole('button', { name, exact: true }).count()) btns.push(name) } globalThis.__p014ResultBtns=btns.join('/'); if (btns.length<2) throw new Error('结果态操作件缺失（重新分析/返回配置/导出名单 仅见: '+(btns.join('/')||'无')+'）')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若点击「查看结果」后停 processing 未跳结果态或名单区双分支 miss → 记红归 01273 结果态呈现域（附过程页/结果态截图与任务 ID）；若创建 POST 失效未进过程态 → 归执行链域（P0-12/P0-13 已实证 200 恢复，复发按环境波动记 observed 并附 POST 状态）
as_built_note: 蓝本 FUNC-01273（金样用例；本波前作金样区已锁 P0-01~05，本条作为新写条目落 tier B，升金样归父验收裁量）。D1（结果态入口 as-built）：用例步骤「选定条件后点击开始分析并等待完成」→ 现场生成结束停过程页引导态（「分析结果已生成 · 任务快照已固化…」，P0-12 已实证不自动跳），须显式点「查看结果」进结果态（URL view=result&demo_state=result&task_id=本条任务）——本条以本条新任务实跑全链（非复用历史任务），任务 ID 跨 expect 经 globalThis.__p014TaskId 传递，expect[1]/[2] 防 URL 错位（核对含 tid）。D1（双分支口径，预期 1「结果态主区为培育名单列表」+ 预期 2「名单行含机构标识与综合评分」合并承载）：当前数据态历史任务名单为诚实空（scout-result-view.json：SVC-20261014-009「暂无候选」/「当前筛选范围内无本土机构」+ 重新分析/返回配置/导出名单按钮），新任务名单态不钉死——有据分支验机构行（行含机构标识词与数字字段，命中名单记 observed 不作硬期望）；无据分支验诚实空态文案齐备（不渲染伪造机构行）；上波情报 01275 排序与 01276 建议字段深验同样受名单空限制，归其本条双分支/observed 不在本条吞并。expect[3] 为 observed 收口 + 结果态操作件宽松断言（≥2 件，防止 exact 文案误伤单按钮）。P2 跨 tick（点击后轮询 URL/正文至稳态）；P3 对比篮可见才关；P7 点可见容器（.industry-catalog-select / .arco-select-view）；P8 steps 自含 goto 重置 + expect[0] 承接态（view=processing/result 残留）兜底重置。诚实重试仅当 URL 仍无 view= 且按钮仍可见可用（首次完全未生效）；user_id=guest 共享账号并发异常记 observed。B 档零 allow_skip（创建链路 fresh 200 + 双分支可落，无 skip 理由）。列表 2 空格缩进。
