      const first3=globalThis.__p018FirstTaskId||null;
      const wantId=(globalThis.__p018LandedId)||first3;
      if (!wantId) throw new Error('前置缺失：首发/落点任务 ID 未捕获');
      const rec=page.locator('[role=tab][data-tab-key="records"]').first();
      await expect(rec).toBeVisible({ timeout: 8000 });
      await rec.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{});
      await page.waitForTimeout(2500);
      const close2=page.locator('button[aria-label="关闭对比篮"]');
      if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      const findRow=async (tid) => { for (let i=0;i<8;i++) { const r0=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid }).first(); if (await r0.count()) return r0; await page.waitForTimeout(1000) } return null };
      let row=await findRow(wantId);
      if (!row) { const todayRe=new RegExp('SVC-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-\\d+'); for (let i=0;i<8;i++) { const r1=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: todayRe }).first(); if (await r1.count()) { row=r1; globalThis.__p018Notes=((globalThis.__p018Notes)||[]).concat(['目标行兜底命中当天任意行（wantId='+wantId+' 未直配）']); break } await page.waitForTimeout(1000) } }
      if (!row) { globalThis.__p018Notes=((globalThis.__p018Notes)||[]).concat(['记录列表短暂未见目标行，reload 诚实重试一次']); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(3000); row=await findRow(wantId) }
      if (!row || !(await row.count())) throw new Error('分析记录未见目标任务 '+wantId+' 行（含 reload 重试；探针实勘记录列表偶发暂无分析记录）');
      let rt='';
      for (let i=0;i<10;i++) { rt=((await row.innerText().catch(()=>''))||''); if (/已完成/.test(rt)) break; await page.waitForTimeout(1000) }
      if (!/已完成/.test(rt)) throw new Error('目标记录行非已完成: '+rt.slice(0,120));
      const vr=row.getByRole('button', { name: '查看结果', exact: true });
      if (!await vr.count()) throw new Error('记录行无「查看结果」按钮');
      if (!await vr.first().isEnabled()) throw new Error('记录行「查看结果」不可点（已完成应可点）');
      const okCnt3=()=>((globalThis.__p018Posts)||[]).filter((s)=>s<400).length;
      const okBefore3=okCnt3();
      await vr.first().click({ timeout: 8000 });
      await page.waitForURL((u)=>/[?&]view=result/.test(String(u)), { timeout: 10000 }).catch(()=>{});
      for (let i=0;i<12;i++) { const uu=page.url(); if (/[?&]view=result/.test(uu)) break; const bb=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(bb)) { const vr2=page.getByRole('button', { name: '查看结果', exact: true }).first(); if (await vr2.count()) { await vr2.click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1500); continue } } await page.waitForTimeout(1000) }
      const u3=page.url();
      if (!/[?&]view=result/.test(u3)) throw new Error('查看结果后未落结果态: '+u3);
      if (!u3.includes(wantId)) throw new Error('结果态 task_id 非「'+wantId+'」: '+u3);
      let rb='';
      for (let i=0;i<10;i++) { rb=((await page.locator('main').first().innerText().catch(()=>''))||''); if (rb.includes('本土机构培育名单')) break; await page.waitForTimeout(1000) }
      if (!rb.includes('本土机构培育名单')) throw new Error('既有结果壳缺失（本土机构培育名单）');
      if (!/返回配置/.test(rb)) throw new Error('结果态「返回配置」出口缺失');
      const newPosts3=okCnt3()-okBefore3;
      if (newPosts3!==0) throw new Error('查看结果触发了新任务创建（应 0 成功 POST，实 '+newPosts3+'）');
