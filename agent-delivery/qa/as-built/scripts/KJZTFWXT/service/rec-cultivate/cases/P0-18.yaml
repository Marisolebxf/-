as_built_note: |-
  蓝本 FUNC-01279（备选-当天同条件已成功直接复用，P1；本波前作金样区已锁 P0-01~05，本条新写落 tier B，脚本 id 按母表顺延 P0-18，coverage 主表 P 列写 P1）。备注对齐用例册：「当天复用与重新分析口径=Q-ANALYSIS-01，observed-执行时记录（开放项 3）」。
  D3 缺陷预设红（ticket D3-SVCCULT-SAME-DAY-REUSE-MISSING，跑绿则票不成立转对照证据）+ D1 as-built 口径差。姊妹工作区实证：graph P0-19（D3-SVCGRAPH-SAME-DAY-REUSE-MISSING，同日同指纹 svc|graph|INB1701 再发起 028→029 仍 POST 新建、toast「任务已创建，正在展示分析过程」，探针 _probe-p019b）/ chain P0-15（D3-SVCSHORT-SAME-DAY-REUSE-MISSING，032→033 同型）——疑 analysis_fp 指纹不等值致共享闸门 decideAnalysisTaskGate（同指纹当日 success → restore_result）失效。本条 cultivate 侧同口径验证：红则三工作区全灭（根因大概率在共享闸门层，两姊妹票并注同根因升级）；绿则复用闸门按工作区分化，形成关键对照缩小根因范围。
  预期① 复用判定三判据（graph/chain 跨入口同款，保持三票口径可比）：同条件再发起后 ① 成功 create POST（/analysis/tasks 非 /list，只认 status<400）增量=0；② 落点 task_id=当天既有（首发/首发落点）；③ toast 无「任务已创建」（graph/chain 现场实文「任务已创建，正在展示分析过程」为不复用判据；若形如「已打开当天结果」类则为复用佐证——toast 文案命中现场记 observed 不钉死硬期望）。证据（newPosts/landed/first/toasts/fp）落 globalThis.__p018ReuseEvidence 供 run observed 抄录。
  首发双形态容差（本条特有设计）：user_id=guest 共享账号本波前作（P0-12~16）今日已建多条 cultivate·新一代信息技术 已完成任务，用例前置「当天已有一条同条件已成功记录」天然满足——若 cultivate 复用闸门生效，expect[0] 首发本身即被拦截直达结果态（view=result、0 新 POST），此时 firstShotReuse=true 记复用实证，expect[1] 跳过「查看结果」直接断言、expect[2] 再发起验证持续复用（落点应同 ID）；若复用失效（graph/chain 同型世界）首发=新建停过程页引导态（P0-12 口径「分析结果已生成」不自动跳）。两世界均给出正确判定，避免把「复用生效」误判为「前置失败」。
  同条件口径（任务书：同产业+同筛选+同权重默认，指纹逐字段一致）：首发前「恢复默认权重」（现有规模 25，P0-11/15 实证路径；D1-SVCCULT-WEIGHT-DEFAULT-READOUT 教训——aria-label 失败按 main 内 4 spinbutton DOM 序兜底，仍失败记 observed 不阻塞）+ 机构类型三项全选校验补勾（跨会话残留归位记 observed）+ 产业显式选定「新一代信息技术」；返回配置后「不改任何条件」只核对不操作，产业回显丢失/权重非默认/机构类型被取消视为并行会话污染，归位记 observed（保证再发起指纹一致）。链位 +8 默认校验：非 +8 记 observed 不强求归位（P0-09 跨页持久化口径；analysis_fp 现场形态记 __p018Fp——若指纹含筛选维度以现场 URL 为准）。
  预期② 「另提供重新分析可强制重跑」承载面：结果态按钮组「重新分析」存在且 enabled（P0-14 实证 3 件齐：重新分析/返回配置/导出名单，可断言必绿）；实际强制重跑行为归 01277/P0-16 显式重析面（重析=新建新 task_id≠首次已实证），本条不吞并不实点重跑（避免额外新建任务污染记录）。
  用例步骤② 「打开分析记录中当天已成功记录」=记录行「查看结果」直达既有结果壳（0 新成功 POST 不重跑）；wantId=再发起落点||首发（红分支最新落点、绿分支同 ID），兜底当天日期正则（chain P0-15 同款 SVC-YYYYMMDD-\d+ 动态生成）；记录行查找带 reload 诚实重试（P0-15/16 实证记录列表偶发「暂无分析记录」）。
  P1~P8：P2 跨 tick（点击后轮询 URL/toast/正文至稳态，toast 500ms 间隔轮询防 3s 消失漏采）；P3 对比篮可见才关；P7 点可见容器（.industry-catalog-select / checkbox / trigger-popup 选项）；P8 steps 自含 goto 重置 + expect[0] 承接态（view=processing/result 残留）兜底重置。POST 监听 __p018Hooked 一次注册（response 记 status；成功=status<400，4xx 拦截不计成功可记 observed）。user_id=guest 共享账号并发：首发与再发起均含 1 次诚实重试（仅 URL 仍无 view= 且按钮仍可见可用时再点，非伪造绿；重试场景双 POST 计入计数不掩盖判定）。B 档零 allow_skip（创建链路 fresh 200 + 复用红绿双分支均可落，无 skip 理由）。viewport 1920x1080@1（runner 默认，同 fixtures 口径）。列表 2 空格缩进。
