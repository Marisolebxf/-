id: FUNC-04701
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04701
priority: P0
tier: B
title: 主流程-推荐理由与培育建议
entry_id: svc-rec-cultivate
preconditions:
  - 已打开本土机构培育名单
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: click
    target: 生成培育名单
  - action: click
    target: 查看结果
  - action: wait
    target: 推荐理由
expect:
  - note: 每行都有推荐理由
    assert: |-
      const rows = page.locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 60000 });
      await expect(rows).not.toHaveCount(0);
      const n = await rows.count();
      const headers = page.locator('.arco-table-header .arco-table-th');
      let reasonIdx = -1;
      const hc = await headers.count();
      for (let j = 0; j < hc; j++) {
        const t = (await headers.nth(j).innerText()).trim();
        if (t.includes('推荐理由')) reasonIdx = j;
      }
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        const cell = reasonIdx >= 0 ? row.locator('.arco-table-td').nth(reasonIdx) : row.filter({ hasText: '推荐理由' }).locator('.arco-table-td').last();
        await expect(cell).toBeVisible();
        await expect(cell).not.toHaveText(/^[\s\-—]*$/);
      }
  - note: 每行都有培育建议
    assert: |-
      const rows = page.locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible();
      const n = await rows.count();
      await expect(rows).not.toHaveCount(0);
      const headers = page.locator('.arco-table-header .arco-table-th');
      let suggestIdx = -1;
      const hc = await headers.count();
      for (let j = 0; j < hc; j++) {
        const t = (await headers.nth(j).innerText()).trim();
        if (t.includes('培育建议')) suggestIdx = j;
      }
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        const cell = suggestIdx >= 0 ? row.locator('.arco-table-td').nth(suggestIdx) : row.filter({ hasText: '培育建议' }).locator('.arco-table-td').last();
        await expect(cell).toBeVisible();
        await expect(cell).not.toHaveText(/^[\s\-—]*$/);
      }
  - note: 建议文字落在该机构行内
    assert: |-
      const rows = page.locator('.arco-table-body .arco-table-tr');
      const n = await rows.count();
      await expect(rows).not.toHaveCount(0);
      const headers = page.locator('.arco-table-header .arco-table-th');
      let suggestIdx = -1;
      const hc = await headers.count();
      for (let j = 0; j < hc; j++) {
        const t = (await headers.nth(j).innerText()).trim();
        if (t.includes('培育建议')) suggestIdx = j;
      }
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        const cell = suggestIdx >= 0 ? row.locator('.arco-table-td').nth(suggestIdx) : row.locator('.arco-table-td').last();
        const text = (await cell.innerText()).trim();
        await expect(cell).not.toHaveText(/^[\s\-—]*$/);
        await expect(row).toContainText(text);
      }
on_fail: 截图 + 抄 X-Trace-Id
