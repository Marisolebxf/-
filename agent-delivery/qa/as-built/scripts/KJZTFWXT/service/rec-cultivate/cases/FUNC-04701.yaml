id: FUNC-04701
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04701
priority: P0
tier: B
title: 主流程-推荐理由与培育建议
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: click
    target: 分析记录
  - action: click
    target: 查看结果
expect:
  - note: 1、每行都有推荐理由
    assert: |-
      await expect(page.locator('main').getByText('本土机构培育名单')).toBeVisible({ timeout: 120000 });
      const rows = page.locator('[data-testid="svc-rec-cultivate-list"] article.svc-rec-rank-row');
      await expect(rows.first()).toBeVisible({ timeout: 120000 });
      const count = await rows.count();
      expect(count).toBeGreaterThan(0);
      for (let i = 0; i < count; i++) {
        await expect(rows.nth(i).getByText(/推荐理由：/)).toBeVisible();
      }
  - note: 2、每行都有培育建议
    assert: |-
      const rows = page.locator('[data-testid="svc-rec-cultivate-list"] article.svc-rec-rank-row');
      const count = await rows.count();
      for (let i = 0; i < count; i++) {
        const row = rows.nth(i);
        const hasInline = await row.getByText(/培育建议：/).count();
        const hasExpand = await row.getByText(/展开培育建议/).count();
        expect(hasInline + hasExpand).toBeGreaterThan(0);
      }
  - note: 3、建议文字落在该机构行内
    assert: |-
      const rows = page.locator('[data-testid="svc-rec-cultivate-list"] article.svc-rec-rank-row');
      const count = await rows.count();
      for (let i = 0; i < count; i++) {
        const row = rows.nth(i);
        await expect(row.locator('.svc-rec-rank-name').first()).toBeVisible();
        const adviceInRow = row.locator('.svc-rec-reason, .svc-rec-advice-groups, .svc-rec-advice-toggle');
        await expect(adviceInRow.first()).toBeVisible();
        const orgBox = await row.locator('.svc-rec-rank-name').boundingBox();
        const adviceBox = await adviceInRow.first().boundingBox();
        expect(orgBox && adviceBox).toBeTruthy();
        expect(adviceBox.y).toBeGreaterThanOrEqual(orgBox.y);
        expect(adviceBox.y).toBeLessThan(orgBox.y + 600);
      }
on_fail: 截图 + 抄 X-Trace-Id
