id: FUNC-04705
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04705
priority: P1
tier: B
title: 备选-结果页切换产业
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: wait
    timeout_ms: 800
expect:
  - note: 首行机构名与切换前相同
    assert: |-
      const main = page.locator('main');
      async function pickIndustry(scope, label) {
        await scope.locator('.sci-arco-cascader .arco-cascader-view, .svc-portal-industry-cascader .arco-cascader-view').first().click();
        const popup = page.locator('.arco-cascader-popup:visible, .svc-portal-industry-cascader-menu');
        await popup.waitFor({ state: 'visible', timeout: 8000 });
        const search = popup.locator('input').first();
        if (await search.count()) {
          await search.fill(label);
          await page.waitForTimeout(300);
        }
        await popup.getByText(label, { exact: true }).last().click();
        await page.waitForTimeout(500);
      }
      await main.getByTestId('svc-rec-cultivate-start').click();
      await page.getByRole('button', { name: '查看结果' }).click({ timeout: 90000 });
      await expect(main.getByTestId('svc-rec-cultivate-list')).toBeVisible({ timeout: 60000 });
      const resultCtx = main.getByTestId('svc-rec-cultivate-result');
      const firstLink = main.getByTestId('svc-rec-cultivate-list').locator('.svc-rec-org-link').first();
      await expect(firstLink).toBeVisible();
      const nameBefore = (await firstLink.innerText()).trim();
      await pickIndustry(resultCtx, '新能源');
      const nameAfter = (await firstLink.innerText()).trim();
      await expect(nameAfter).toBe(nameBefore);
  - note: 标题仍为「本土机构培育名单」
    assert: |-
      await expect(page.locator('main').getByText('本土机构培育名单', { exact: true })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
