eout: 8000 }); await page.waitForTimeout(1500); const echo2=((await sel2.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/^新能源$/.test(echo2)) throw new Error('改选后未更新回显（应为新能源）: "'+echo2+'"'); await page.waitForTimeout(3000); const u=page.url(); if (/view=processing|view=result/.test(u)) throw new Error('改产业集群后不应自动进过程/结果态（01262 互证）: '+u); const creates=((globalThis.__p016CreateStatuses)||[]).filter((s)=>s<400).length; if (creates>((globalThis.__p016Creates1)||0)) throw new Error('改产业集群不应自动创建任务（01262 互证）：会话成功 create '+creates+' > 首次 '+((globalThis.__p016Creates1)||0)); globalThis.__p016DraftChanged=true
