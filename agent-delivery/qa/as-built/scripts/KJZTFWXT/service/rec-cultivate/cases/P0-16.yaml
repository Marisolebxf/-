o-table-tr').filter({ hasText: tid }).first(); if (await row.count()) return row } return null }; const rowT2=await findRow(t2); if (!rowT2) throw new Error('分析记录未见新任务 '+t2+' 行（含 reload 重试；探针实勘记录列表偶发暂无分析记录）'); const rt2=((await rowT2.innerText().catch(()=>''))||''); if (!/已完成/.test(rt2)) throw new Error('新任务记录状态非已完成: '+rt2.slice(0,120)); const rowT1=await findRow(t1c); if (!rowT1) throw new Error('分析记录未见首次任务 '+t1c+' 行（双任务并存断言，含 reload 重试）'); globalThis.__p016RecordsBoth=true
