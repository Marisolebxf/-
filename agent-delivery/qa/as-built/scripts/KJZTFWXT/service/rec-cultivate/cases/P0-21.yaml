as_built_note: |-
  蓝本 FUNC-01281（备选-评审模式零泄漏；本册唯一 4 点结构性例外——评审层多挂点检查类）。用例优先级 P1、脚本 id 按母表顺延 P0-21，coverage 主表 P 列写 P1。跨入口蓝本 = graph P0-21 / chain-shortboard P0-16（零泄漏三重断言成熟写法）；本入口适配与实证口径（scout-p021-review/popups/popups-fresh/diag/domclick2/seq/final/eclick-diag/force3/dismiss-blank 十探，2026-10-15）：
  1. 多挂点=三按钮（用例步骤②「逐一点击」字面承载）：开启态现场 5 枚 trace-info-icon——用例指定三枚（培育服务机构推荐分析/分析配置/培育模型权重需求追溯）可见 enabled 必断；另两枚壳层共享按钮（系统浮层范围变更/多对象壳层范围）不可见、多出不计泄漏（graph P0-21 同款口径）。「逐一点击」工程路径=每枚点击前 fresh goto + 远处空白点击（(1500,600)/(960,950)）收起跨导航恢复的弹层 + 原生 click（scout-p021-dismiss-blank 实证）：弹层为 Arco Trigger 单例常驻型且开态跨 goto/storage 恢复并覆盖第 2/3 枚按钮（原生 click actionability 拦截 5s 超时、force click 坐标落在恢复弹层上不切换内容——scout-p021-diag/force3/r2 三证），空白点击一次即关、关掉后原生 click 即可点且内容切换为各自锚点。e.click()（纯 DOM 事件无 pointer 序列）开不了 Arco Trigger 弹层（scout-p021-eclick-diag 实证），不可用；清 storage 会导致渲染器恢复卡死全页（scout-p021-seq 实证），禁止。弹层断言=任一 :visible 弹层 innerText 含锚点（各弹层正文首词=各自区块名）。注意 filter({hasText}) 按元素粒度匹配不到标题行（弹层文本逐行分层 DOM），断言用 .first()+innerText 包含式。弹层无 Esc/toggle 收起路径（scout-p021-popups 三试全灭，P4 归缺陷单不判 Fail），空白点击为本条实证的收起口径记 fixtures。
  2. 角标形态（D1）：「指标未登记：培育综合分」=button.metric-spec-card.is-missing[aria-label]（arco-icon-question 红问号 24x24 icon 按钮），挂「培育评估模型（演示模型口径）」区块内——非文本节点，getByText 计 0 属正常（P0-20 observed badge_count_config_state=0 即此口径），断言必须 aria-label 定位；配置态可见（scout-p021-review badge.visible=true）。角标与 metric=M_SVC_REC_CULTIVATE_SCORE 的血缘对照见 P0-19 coverage 注（MCP 查得 D1=draft(Q-SVCCHAIN-05)/D2=pending/D3=pending_ods/D4=mock）。
