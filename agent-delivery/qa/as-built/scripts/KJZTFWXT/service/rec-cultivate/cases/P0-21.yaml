id: P0-21
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01281
priority: P1
tier: B
title: 评审模式零泄漏——开启三枚需求追溯按钮可见可点与「指标未登记：培育综合分」角标长提示呈现，关闭刷新后零泄漏且业务态不变
story: US-SVC-REC-03
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass；scout-p021-review/final 实证：勘察时评审模式为开启态（长提示常驻），本条自适应开/关
  - 可经右上 persona 菜单切换内部评审模式（P3：switch 用 aria-label="内部评审模式" 精确定位；菜单开着拦截主区点击，操作后 Esc）
  - 本条为纯配置态开关类，全程不起任务（0 POST 只读往返），不进结果态
locators:
  persona_menu: .persona-switch（右上人设按钮开菜单；不可见时兜底 [class*=persona]）
  review_switch: 'button[role=switch][aria-label="内部评审模式"]（P3：菜单内常有第二个 switch，禁 first() 盲点；aria-checked 缺失时回退 arco-switch-checked class 判定）'
  trace_buttons: 'button.trace-info-icon（icon 按钮无可见文本，aria-label 定位；开启态本页实测 5 枚：用例指定三枚=培育服务机构推荐分析/分析配置/培育模型权重需求追溯，另有「系统浮层范围变更」「多对象壳层范围」两枚壳层共享按钮不可见、多出不计泄漏）'
  badge: 'button.metric-spec-card.is-missing[aria-label="指标未登记：培育综合分"]（红问号形态：arco-icon-question 24x24 icon 按钮，挂「培育评估模型（演示模型口径）」区块；非文本节点——getByText 查 0 属正常，必须 aria-label 定位）'
  long_hint: 评审开态主区长提示（「培育综合分未入指标库，D1 missing 走 GAP 红问号。Q063 / Q-SVCCHAIN-05 待核验，不改绿。」——页首评审声明段承载）
  weight_spin: 'main [role=spinbutton]（四维权重，DOM 序=现有规模/技术创新能力/服务成效/市场缺口，inputValue 读数）'
  restore_btn: button「恢复默认权重」
