as_built_note: |-
  蓝本 FUNC-01282（异常-分析失败态；kind=GAP 补齐；用例册自动化用例 ID 列原空，本条落 P0-23）。用例：断开分析服务后点「开始分析」→局部错误提示；点失败态「重试」→页面壳与配置保留。
  env-gate overall=pass；B 档零 allow_skip。异常构造口径（写前探针 scout-p023-fail.json / _probe-p023-fail.mjs / probe-p023-failed-state.png / probe-p023-after-retry.png，2026-10-15）：无后端控制权无法真断链，经 Playwright route.abort('connectionreset') 拦截创建任务 POST（glob **/topicAsync/topic/v1/analysis/tasks* + 方法 POST + 尾段正则精确匹配，/tasks/list 与 /tasks/running 轮询 continue 不误伤，探针 aborted 恰 1）——脚本内 route 拦截属测试工具合法模拟网络异常，非改业务环境；结束 unroute 恢复并复查拦截计数归零。
  探针结论：断链可触发、失败态可稳定复现 → 不援引用例备注「失败态需构造异常触发，本轮不判 Fail（开放项 3）」skip，按预期断言实跑（与 sz P0-20 / graph P0-29 / org-trend P0-15 同型同落局；共用 useSvcAnalysisJob）。
  失败态 as-built：页面壳内 .arco-alert「Network Error / traceId：8942cd47…」非白屏；title/双 Tab/分析配置/培育评估模型/产业集群「新一代信息技术」回显全保留；URL 停配置态（industry=INB1701）不漂移任务态；retry_word_hits=0。
  D1：无独立「重试」按钮——「开始分析」失败态后仍可用即重试承载（同 sz/graph）。
  D1：预期①「结果区呈局部错误提示」→ 配置态无独立结果容器，失败在创建任务阶段，壳层 .arco-alert 承载（局部=非整页替换非白屏）。
  D4：unroute 后重试——探针本轮 silent_config（Network Error 清、壳/配置保留、未进 view=）；CREATE 健康时可落 processing（analysis_fp=svc|cultivate|）；CREATE 中间层 404 文案驻留旁证既有票 D4-SVCCULT-TASK-CREATE-404（P0-22）。expect[3] 四分支联合轮询（processing / CREATE404 / 局部错误 / 静默配置态）均绿；用例预期不要求必落任务态。
  「失败态在分析记录中的呈现归 01278」：本条失败在创建任务阶段（POST 被拒、任务未创建），记录列表无本条失败行属语义正确，不吞并。
  防御票 D3-SVCCULT-FAILURE-STATE-MISSING（吞错/白屏/丢壳）；探针未命中该形态。不进 gold。P2/P3/P7/P8 同姊妹条。viewport 1920x1080@1。列表 2 空格缩进。
