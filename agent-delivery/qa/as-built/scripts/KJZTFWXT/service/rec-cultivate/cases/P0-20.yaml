id: P0-20
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01280
priority: P1
tier: B
title: 备选-兄弟工作区招引隔离——attract 侧为招引内容（页标题与主题正确、无培育专属区块/角标/长提示）、回切培育配置权重与 Tab 正常（互不串扰）
story: US-SVC-REC-03
entry_id: svc-rec-cultivate
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass；attract sibling 深链可达（scout-attract 实证 attract_title/has_cultivate_model=false/cultivate_restored=true）
  - 已进入培育工作区；评审模式开启（脚本自适应——长提示不可见时经 P3 路径 persona 菜单 → aria-label="内部评审模式" 的 switch 开启）
  - 本环境 user_id=guest 共享账号，并行会话可能同时作业（非本条异常加 1 次诚实重试并记 observed）
locators:
  attract_url: /service/institution-decision?workspace=attract&tab=attract（同路由 sibling；步骤①=路由参数改写，goto 直改即字面执行）
  attract_title: document.title「引入服务机构推荐分析 - 科技专题服务系统」（scout-attract 实证）
  attract_theme: 招引侧主题锚点「招引推荐模型（演示模型口径）」（scout attract_body_head 实证）
  cultivate_only: 培育专属四短语——「培育评估模型」/「指标未登记：培育综合分」/「培育综合分未入」/「本土机构培育名单」
  review_switch: 'button[role=switch][aria-label="内部评审模式"]（P3 路径；菜单内常有第二个 switch 禁 first() 盲点；菜单开着拦截主区点击，操作后 Esc）'
  weight_spin: main [role=spinbutton]（四维权重，DOM 序=现有规模/技术创新能力/服务成效/市场缺口，inputValue 读数）
  tab_main: '[role=tab][data-tab-key=cultivate]；记录=[role=tab][data-tab-key=records]（aria-selected 判互斥）'
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
    note: 自含重置进培育配置态（P8）；attract 往返与回切由 expect 自含 goto 驱动（同 P0-15/16/17 口径）
expect:
  - note: 前置——评审模式开启下培育侧正向对照（评审长提示「培育综合分未入…」与「培育评估模型（演示模型口径）」区块必可见，为预期②缺席断言提供同页对照），并快照入口基线（权重读数/角标计数记 observed）
    assert: |-
      await page.waitForTimeout(1500);
      const close0=page.locator('button[aria-label="关闭对比篮"]');
      if (await close0.count() && await close0.first().isVisible().catch(()=>false) && await close0.first().isEnabled().catch(()=>false)) { try { await close0.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      if (/view=processing|view=result/.test(page.url())) { await page.goto('http://111.198.38.90:50892/service/institution-decision?workspace=cultivate&tab=cultivate', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) };
      const mainText=async()=>((await page.locator('main').first().innerText().catch(()=>''))||'');
      let m0=await mainText();
      if (!/培育综合分未入/.test(m0)) {
        let opener=page.locator('.persona-switch').first();
        if (!(await opener.isVisible().catch(()=>false))) opener=page.locator('[class*="persona" i]').first();
        await opener.click({ timeout: 5000 });
        await page.waitForTimeout(800);
        const sw=page.locator('button[role=switch][aria-label="内部评审模式"], [aria-label="内部评审模式"]').first();
        let checked=await sw.getAttribute('aria-checked').catch(()=>null);
        if (checked===null) { const holder=sw.locator('xpath=ancestor-or-self::*[contains(@class,"arco-switch")][1]'); checked=/arco-switch-checked/.test((await holder.first().getAttribute('class').catch(()=>''))||'')?'true':'false'; };
        if (checked!=='true') { await sw.click({ timeout: 5000 }); await page.waitForTimeout(1200) };
        await page.keyboard.press('Escape').catch(()=>{});
        await page.waitForTimeout(800);
        m0=await mainText();
      };
      if (!/培育综合分未入/.test(m0)) throw new Error('评审模式开启前置未满足——主区未见培育口径长提示（培育综合分未入…）');
      if (!/培育评估模型（演示模型口径）/.test(m0)) throw new Error('培育侧正向对照缺失——未见「培育评估模型（演示模型口径）」区块');
      const badgeCnt=await page.getByText('指标未登记：培育综合分').count().catch(()=>0);
      const spins0=page.locator('main [role=spinbutton]');
      const n0=await spins0.count();
      const w0=[];
      for (let i=0;i<Math.min(n0,4);i++) w0.push(String(await spins0.nth(i).inputValue().catch(()=>'')));
      globalThis.__p020Base={ url: page.url(), badgeCnt: badgeCnt, spinCount: n0, weights: w0 };
  - note: 预期①②——路由 workspace 参数改写至 attract 后，招引工作区为招引侧内容（页标题「引入服务机构推荐分析」+主题锚点「招引推荐模型」），且无培育评估模型区、无培育综合分角标与培育口径长提示（评审开启态下正向对照后的缺席=真隔离）
    assert: |-
      await page.goto('http://111.198.38.90:50892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' });
      await page.waitForLoadState('networkidle', { timeout: 8000 }).catch(()=>{});
      await page.waitForTimeout(1500);
      const closeA=page.locator('button[aria-label="关闭对比篮"]');
      if (await closeA.count() && await closeA.first().isVisible().catch(()=>false) && await closeA.first().isEnabled().catch(()=>false)) { try { await closeA.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      const ua=page.url();
      if (!/workspace=attract/.test(ua)) throw new Error('attract 工作区 URL 漂移: '+ua);
      const title=await page.title();
      if (!/引入服务机构推荐分析/.test(title)) throw new Error('预期①违背——招引页标题非「引入服务机构推荐分析」: '+title);
      await expect(page.getByText('招引推荐模型').first()).toBeVisible({ timeout: 8000 });
      const ma=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (!/引入服务机构推荐分析/.test(ma)) throw new Error('预期①违背——招引页主区无「引入服务机构推荐分析」标题');
      for (const k of ['培育评估模型','指标未登记：培育综合分','培育综合分未入','本土机构培育名单']) { if (ma.includes(k)) throw new Error('预期②违背——招引侧泄漏培育专属内容「'+k+'」'); };
      globalThis.__p020Attract={ url: ua, title: title, bodyHead: ma.replace(/\s+/g,' ').trim().slice(0,300) };
      console.log('[P0-20 observed attract]', JSON.stringify(globalThis.__p020Attract));
  - note: 预期③——回切 workspace=cultivate&tab=cultivate 后培育配置区完整（分析配置/重点产业方向/机构类型 3 项/服务环节/培育评估模型四维）、权重读数与「合计 100%」声明正常、双 Tab 状态正常（主 Tab 选中/分析记录未选）、无过程/结果态残留、无招引内容泄漏（互不串扰）
    assert: |-
      await page.goto('http://111.198.38.90:50892/service/institution-decision?workspace=cultivate&tab=cultivate', { waitUntil: 'domcontentloaded' });
      await page.waitForLoadState('networkidle', { timeout: 8000 }).catch(()=>{});
      await page.waitForTimeout(1800);
      const closeC=page.locator('button[aria-label="关闭对比篮"]');
      if (await closeC.count() && await closeC.first().isVisible().catch(()=>false) && await closeC.first().isEnabled().catch(()=>false)) { try { await closeC.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      const uc=page.url();
      if (!/workspace=cultivate/.test(uc) || !/tab=cultivate/.test(uc)) throw new Error('回切后 URL 非 cultivate 直达态: '+uc);
      if (/view=processing|view=result/.test(uc)) throw new Error('回切后残留过程/结果态: '+uc);
      await expect(page.getByText('培育评估模型（演示模型口径）').first()).toBeVisible({ timeout: 8000 });
      const mc=((await page.locator('main').first().innerText().catch(()=>''))||'');
      for (const k of ['分析配置','重点产业方向','机构类型','高校','科研院所','企业','服务环节','现有规模','技术创新能力','服务成效','市场缺口','恢复默认权重','开始分析']) { if (!mc.includes(k)) throw new Error('预期③违背——回切后配置区缺失「'+k+'」'); };
      const spins=page.locator('main [role=spinbutton]');
      const n=await spins.count();
      if (n<4) throw new Error('预期③违背——回切后权重 spinbutton 不足 4 个（实见 '+n+'）');
      const vals=[];
      for (let i=0;i<4;i++) vals.push(String(await spins.nth(i).inputValue().catch(()=>'')));
      if (vals.some(v=>!/^\d+$/.test(v))) throw new Error('预期③违背——回切后权重读数异常: '+JSON.stringify(vals));
      if (!/权重合计[：:]\s*100%/.test(mc)) throw new Error('预期③违背——回切后缺「权重合计 100% 已对齐」声明');
      const tC=page.locator('[role=tab][data-tab-key="cultivate"]').first();
      const tR=page.locator('[role=tab][data-tab-key="records"]').first();
      const aC=await tC.getAttribute('aria-selected').catch(()=>null);
      const clsC=String(await tC.getAttribute('class').catch(()=>''));
      if (!((aC==='true')||/active/.test(clsC))) throw new Error('预期③违背——回切后主 Tab「培育服务机构推荐分析」未选中（aria-selected='+aC+'）');
      const aR=await tR.getAttribute('aria-selected').catch(()=>null);
      if (aR==='true') throw new Error('预期③违背——回切后「分析记录」Tab 仍选中（Tab 状态串扰）');
      for (const k of ['招引推荐模型','引入服务机构推荐分析']) { if (mc.includes(k)) throw new Error('预期③违背（互不串扰）——回切后培育侧泄漏招引内容「'+k+'」'); };
      const indEcho=((await page.locator('.industry-catalog-select .arco-select-view-value').first().innerText().catch(()=>''))||'').trim();
      globalThis.__p020Back={ url: uc, weights: vals, industryEcho: indEcho, baseWeights: (globalThis.__p020Base&&globalThis.__p020Base.weights)||null, baseBadgeCnt: (globalThis.__p020Base&&globalThis.__p020Base.badgeCnt) };
      console.log('[P0-20 observed back]', JSON.stringify(globalThis.__p020Back));
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若 attract 侧出现培育专属内容、或回切后培育配置/权重区渲染损坏（spinbutton 缺失/读数空/Tab 串扰/招引内容泄漏）→ 按隔离违背口径记红挂 D3-SVCCULT-ATTRACT-SWITCH-STATE-LOST（与姊妹 WS-SWITCH 票同形态并注同根因）；若 attract 深链不可达（登录态/路由缺失）→ 归环境债 D4 报父派单
as_built_note: |-
  蓝本 FUNC-01280（备选-兄弟工作区招引隔离；用例优先级 P1、脚本 id 按母表顺延 P0-20，coverage 主表 P 列写 P1）。承载面拆解与口径：
  1. 步骤①按用例字面=「路由 workspace 参数改为 attract」，脚本以 goto 直改同路由 sibling 的 canonical URL（?workspace=attract&tab=attract，tab 键跟工作区走；rec-attract 蓝本与 scout-attract 实证同款）；步骤③回切用例给的完整形态 workspace=cultivate&tab=cultivate（bare，不带 industry/cw 草稿参数）。
  2. 预期①=招引页标题「引入服务机构推荐分析」（document.title+主区双锚）+招引侧主题锚点「招引推荐模型（演示模型口径）」（scout attract_body_head 实证，P1 以实勘为准；招引侧能力验收归 SVCATTR 用例集 v2.0 册 00780~00802 不展开，本条只断隔离面）。
  3. 预期②=培育专属四短语缺席（培育评估模型/指标未登记：培育综合分/培育综合分未入/本土机构培育名单）；评审开前置使缺席断言更严（角标本可见却无=真隔离）——正向对照在 expect[0] 落地：培育侧（评审开）必有长提示「培育综合分未入…」与模型区，再于 attract 侧断缺席；配置态角标「指标未登记：培育综合分」可能不渲染（env-gate main_snippet 未见），badgeCnt 记 observed、缺席断言保留（vacuous-but-correct）。
  4. 预期③按用例「正常」口径断言（配置区完整+四维权重读数与合计声明+双 Tab 互斥+无 view= 残留+无招引内容泄漏），不按「保留」加严——本册用例措写「正常」与 graph 册「切回保留」不同（graph P0-20 用例明写保留故红挂 D3-SVCGRAPH-WS-SWITCH-STATE-LOST）；若回切后配置/权重区渲染损坏或 attract 内容泄漏则红挂 D3-SVCCULT-ATTRACT-SWITCH-STATE-LOST（与姊妹 WS-SWITCH 票同形态并注同根因）。草稿跨工作区保留细项与 URL 参数语义（query 整体替换→industry/cw 不携带、回切 bare 即默认配置态）记 observed 不判 Fail（用例备注口径：两侧状态互不串扰细项 observed-执行时记录）。培育=本土与招引=外部引进范围口径互斥以两侧主区文案互斥旁证（attract 侧无「本土机构培育名单」、培育侧无招引文案）记 observed。
  5. P3 评审开=persona 菜单 → aria-label="内部评审模式" 的 switch（禁 first() 盲点；菜单开着拦截主区点击，操作后 Esc；已开则自适应跳过菜单）；P2 断言跨 tick 分步求值；P4 对比篮可见才关；P7 不涉及下拉点选；P8 steps 自含 goto 重置 + expect 自含 attract→cultivate 双跳，不依赖上一条还原。
  6. B 档零 allow_skip；user_id=guest 共享账号遇非本条异常加一次诚实重试记 observed。viewport 1920x1080@1（runner 默认，同 fixtures 口径）。列表 2 空格缩进。
