id: FUNC-01269
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01269
priority: P1
tier: B
title: 主流程-恢复默认权重一键复位
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: fill
    target: 现有规模权重
    value: "30"
  - action: click
    target: 恢复默认权重
expect:
  - note: 复位后四权重恢复 25/30/25/20
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('button', { name: '恢复默认权重' })).toBeVisible();
      await expect(main.locator('.arco-input-number')).toHaveCount(4);
      await expect(main.getByText('现有规模 25%')).toBeVisible();
      await expect(main.getByText('技术创新能力 30%')).toBeVisible();
      await expect(main.getByText('服务成效 25%')).toBeVisible();
      await expect(main.getByText('市场缺口 20%')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
