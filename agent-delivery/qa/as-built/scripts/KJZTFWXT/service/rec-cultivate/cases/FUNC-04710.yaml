id: FUNC-04710
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04710
priority: P1
tier: B
title: 备选-分析记录列表
entry_id: svc-rec-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=cultivate&tab=cultivate
  - action: click
    target: 分析记录
  - action: wait
    timeout_ms: 2000
expect:
  - note: 表头为任务、类型、状态、创建时间、操作
    assert: |-
      const records = page.getByTestId('svc-rec-cultivate-records');
      await expect(records.getByRole('columnheader', { name: '任务号' })).toBeVisible();
      await expect(records.getByRole('columnheader', { name: '分析类型' })).toBeVisible();
      await expect(records.getByRole('columnheader', { name: '任务状态' })).toBeVisible();
      await expect(records.getByRole('columnheader', { name: '提交时间' })).toBeVisible();
      await expect(records.getByRole('columnheader', { name: '操作' })).toBeVisible();
  - note: 列表中能看到已完成和失败
    assert: |-
      const records = page.getByTestId('svc-rec-cultivate-records');
      await expect(records.getByText('已完成').first()).toBeVisible();
      await expect(records.getByText('失败').first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
