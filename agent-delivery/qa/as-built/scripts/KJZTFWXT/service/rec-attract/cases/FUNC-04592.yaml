id: FUNC-04592
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04592
priority: P1
tier: B
title: 主流程-选定产业回显
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: wait
    ms: 1500
  - action: assert_visible
    target: 分析配置
  - action: click
    target: 重点产业方向
    locator: |-
      page.locator('main [data-testid="svc-rec-analysis-context"] .arco-cascader-view').first()
  - action: click
    target: 生物
    locator: |-
      page.locator('.svc-portal-industry-cascader-menu .arco-cascader-panel-column').first().locator('.arco-cascader-option-label').filter({ hasText: /^生物/ }).first()
  - action: click
    target: 重点产业方向
    locator: |-
      page.locator('main [data-testid="svc-rec-analysis-context"] .arco-cascader-view').first()
  - action: click
    target: 新能源
    locator: |-
      page.locator('.svc-portal-industry-cascader-menu .arco-cascader-panel-column').first().locator('.arco-cascader-option-label').filter({ hasText: /^新能源/ }).first()
expect:
  - note: 1、选择器回显「新能源」
    assert: |-
      await expect(
        page.locator('main [data-testid="svc-rec-analysis-context"] .arco-cascader-view'),
      ).toContainText('新能源');
  - note: 2、仍停在分析配置
    assert: |-
      await expect(page.locator('main [data-testid="svc-rec-analysis-config"]')).toBeVisible();
      await expect(page.getByRole('button', { name: '生成招引名单' })).toBeVisible();
  - note: 3、不出现分析过程页
    assert: |-
      await expect(page.getByText('招引推荐分析生成中')).not.toBeVisible();
      await expect(page.getByRole('button', { name: '查看结果' })).not.toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
