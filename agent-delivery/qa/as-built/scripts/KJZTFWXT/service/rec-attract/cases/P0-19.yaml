id: P0-19
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00797
priority: P1
tier: B
title: 分析记录列表与状态如实呈现、切回主 Tab 配置保留
story: US-SVC-REC-02
entry_id: svc-rec-attract
preconditions:
  - 已登录 admin
  - env-gate overall=pass（historical_results：已完成 ≥1 + 查看/过程按钮）
locators:
  tab_records: '[role=tab][data-tab-key=records]'
  tab_main: '[role=tab][data-tab-key=attract]'
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=records
expect:
  - note: 「分析记录」呈现历史任务列表（任务 ID 行）且与主 Tab 互斥（记录态 URL tab=records）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.waitForTimeout(2000); const rec=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/SVC-[A-Z0-9-]+/.test(rec)) throw new Error('记录列表无任务 ID 行'); if (!/attract/.test(rec)) throw new Error('记录行缺类型列'); if (!/查看过程|查看结果/.test(rec)) throw new Error('记录行缺操作入口'); if (!/tab=records/.test(page.url())) throw new Error('URL 非 records 态: '+page.url())
  - note: 在跑、排队、失败状态如实呈现、不伪装成功（状态列为事实文案；演示态任务即完成，未见失败行不误伤）
    assert: |-
      const rec=((await page.locator('main').first().innerText().catch(()=>''))||''); const lines=rec.split('\n').filter(l=>/SVC-[A-Z0-9-]+/.test(l)); let ok=0; for (const l of lines) { if (/已完成|进行中|排队|失败|运行中|等待/.test(l)) ok++ } if (lines.length && ok===0) throw new Error('记录行缺状态列: '+lines[0]); if (/失败/.test(rec) && !/重试|重新/.test(rec)) throw new Error('失败记录缺重试入口')
  - note: 切回主 Tab 后产业集群、权重配置保留（先在主 Tab 设条件再切记录再切回）
    assert: |-
      await page.goto('http://10.50.69.111:30892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const sel=page.locator('.industry-catalog-select').first(); const echo0=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); let picked=false; if (/新一代信息技术|生物|新能源|新材料/.test(echo0)) { picked=true } else { await sel.click({ timeout: 8000 }); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1000); picked=/新一代信息技术/.test(((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim()) }; const s0=page.locator('[role=spinbutton]').nth(0); await s0.click({ timeout: 5000 }); await s0.fill('40'); await s0.blur().catch(()=>{}); await page.waitForTimeout(800); const wBefore=String((await s0.inputValue().catch(()=>''))||''); await page.locator('[role=tab][data-tab-key="records"]').click({ timeout: 8000 }); await page.waitForTimeout(1500); await page.locator('[role=tab][data-tab-key="attract"]').click({ timeout: 8000 }); await page.waitForTimeout(2000); if (/view=processing|view=result/.test(page.url())) { await page.goto('http://10.50.69.111:30892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) }; const sel2=page.locator('.industry-catalog-select').first(); const echo1=((await sel2.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (picked && !/新一代信息技术/.test(echo1)) throw new Error('切回后产业选择丢失: '+echo1); const s1=page.locator('[role=spinbutton]').nth(0); const wAfter=String((await s1.inputValue().catch(()=>''))||(await s1.getAttribute('aria-valuenow').catch(()=>null))||''); if (wBefore==='40' && wAfter!=='40') throw new Error('切回后权重丢失: '+wBefore+'→'+wAfter)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00797；实勘记录行含 任务ID/类型(attract)/状态(已完成)/创建时间/操作(查看过程查看结果)（scout-empty-click.json records.snippet）。P1 用例（脚本 id 顺延 P0-19，见 coverage P 列标 P1）。列表构成 observed；失败态呈现归 P0-23。切回保留为组件内 state（无持久化），断言在同会话内切 Tab 核。
