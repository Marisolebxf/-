id: FUNC-04588
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04588
priority: P1
tier: B
title: 主流程-选定产业并看到名单
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: wait
    ms: 1500
  - action: click
    target: 重点产业方向
    locator: |-
      page.locator('main [data-testid="svc-rec-analysis-context"] .arco-cascader-view, main [data-testid="svc-rec-analysis-context"] .arco-select-view').first()
  - action: click
    target: 生物
    locator: |-
      page.locator('.arco-cascader-list-column, .arco-select-dropdown:visible').first().getByText('生物', { exact: true })
  - action: click
    target: 生成招引名单
    locator: |-
      page.locator('main [data-testid="svc-rec-start-analysis"]')
  - action: click
    target: 查看结果
    locator: |-
      page.locator('main').getByRole('button', { name: '查看结果' })
expect:
  - note: 结果页出现「外部机构引进推荐名单」
    assert: |-
      await expect(page.getByText('外部机构引进推荐名单')).toBeVisible({ timeout: 60000 })
  - note: 重点产业方向回显「生物」
    assert: |-
      await expect(page.locator('main [data-testid="svc-rec-result-context"]').getByText('生物')).toBeVisible()
  - note: 名单至少有一行机构
    assert: |-
      await expect(page.locator('[data-testid="svc-rec-list"] article').first()).toBeVisible()
on_fail: 截图 + 抄 X-Trace-Id
