age.getByRole('button', { name: '开始分析', exact: true }).click({ timeout: 8000 }); await page.waitForTimeout(3500); const cur=page.url(); const main=((await page.locator('main').first().innerText().catch(()=>''))||''); const reused=/view=result/.test(cur)||/复用|已存在|已创建|快照/.test(main); await page.goto('http://111.198.38.90:50892/service/institution-decision?workspace=attract&tab=records', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const rec1=((await page.locator('main').first().innerText().catch(()=>''))||''); const ids1=[...new Set([...rec1.matchAll(/SVC-[A-Z0-9-]+/g)].map(m=>m[0]))]; if (!reused && ids1.length>ids0.length+1) throw new Error('当天同条件重复起任务且无复用: before='+ids0.length+' after='+ids1.length)
