id: P0-21
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00799
priority: P1
tier: B
title: 兄弟工作区 cultivate 隔离——培育侧无招引模型区与招引口径文案
story: US-SVC-REC-01
entry_id: svc-rec-attract
preconditions:
  - 已登录 admin
  - env-gate overall=pass（attract 侧可达）
locators:
  workspace_param: URL workspace=cultivate / attract
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 切 workspace=cultivate 后培育侧页面为培育口径（标题/主题非「引入服务机构推荐分析」）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.waitForTimeout(1500); await page.goto('http://10.50.69.111:30892/service/institution-decision?workspace=cultivate&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2500); const title=await page.title(); const main=((await page.locator('main').first().innerText().catch(()=>''))||''); const isAttract=/引入服务机构推荐分析/.test(title)||/引入服务机构推荐分析/.test(main); if (isAttract) throw new Error('cultivate 侧仍为招引口径: title='+title)
  - note: 培育侧无招引模型区与招引综合分口径文案
    assert: |-
      const main=((await page.locator('main').first().innerText().catch(()=>''))||''); const title=await page.title(); if (/招引推荐模型/.test(main)) throw new Error('培育侧泄漏招引模型区'); if (/招引综合分/.test(main) && /招引/.test(title+main.slice(0,100))) { }; if (/指标说明：招引综合分/.test(main)) throw new Error('培育侧泄漏招引综合分角标')
  - note: 回切 workspace=attract&tab=attract 后配置、权重与 Tab 状态正常
    assert: |-
      await page.goto('http://10.50.69.111:30892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2500); await expect(page).toHaveTitle(/引入服务机构推荐分析/); const main=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/分析配置/.test(main)) throw new Error('回切后配置区缺失'); const spins=page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(4, { timeout: 8000 }); const tab=page.locator('[role=tab][data-tab-key="attract"]'); await expect(tab.first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00799；培育侧能力验收归 B 线其余入口任务，本条只验隔离（用例元信息禁止条款）。observed：cultivate 侧标题/主题记入截图；回切后权重默认 35/30/20/15 归 P0-03 核，本条只验 spin×4 存在与 Tab 正常。P1 用例（脚本 id 顺延 P0-21）。
