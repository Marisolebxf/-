expect:
  - note: 打开历史结果，抓取名单快照（机构行文本+分值列）；若名单为诚实空则本条降级核「演示口径声明」在结果态可见（不重算承诺文案）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.waitForTimeout(2000); const rows=page.locator('tr, [class*=record], [class*=task], li').filter({ hasText: /已完成/ }); const viewBtn=rows.first().getByRole('button', { name: /查看结果/ }).first(); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); if (!/view=result/.test(page.url())) throw new Error('未进入结果态: '+page.url()); const main=((await page.locator('main').first().innerText().catch(()=>''))||''); const empty=/暂无候选|当前方向暂无高匹配外部机构/.test(main); globalThis.__svcSnap=empty?null:main; if (empty) { if (!/当前为后端签发分|综合分由 Java rec-list 上送|不重算/.test(main.replace(/\s+/g,''))) { if (!/重新分析|导出名单/.test(main)) throw new Error('结果态既无声明也无工具条') } }
  - note: 调整四维权重后名单（若非空）综合分与排序不变；点「恢复默认权重」后仍不变
    assert: |-
      const snap=globalThis.__svcSnap; await page.goto('http://111.198.38.90:50892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const spins=page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(4, { timeout: 8000 }); const s0=spins.nth(0); await s0.click({ timeout: 5000 }); await s0.fill('50'); await s0.blur().catch(()=>{}); await page.waitForTimeout(600); if (snap) { const cmp=snap.replace(/[0-9.]+/g,'#'); const back=page.getByRole('button', { name: /返回配置/ }); if (await back.count()) { await back.click({ timeout: 5000 }); await page.waitForTimeout(2000); if (!/view=result/.test(page.url())) { throw new Error('返回配置后无法回看结果: '+page.url()) } } const main2=((await page.locator('main').first().innerText().catch(()=>''))||''); const rows2=main2.split('\n').filter(l=>/机构|学院|大学|研究所|公司/.test(l)).join('|'); if (rows2) { if (!/当前为后端签发分|不重算/.test(main2.replace(/\s+/g,''))) throw new Error('改权重后结果页缺「不重算」承诺文案') } } else { const main0=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/演示模型口径|不按四指标权重重算/.test(main0.replace(/\s+/g,''))) throw new Error('配置页缺演示口径声明（权重不重算承诺）') }; await page.getByRole('button', { name: '恢复默认权重', exact: true }).click({ timeout: 5000 }); await page.waitForTimeout(600)
