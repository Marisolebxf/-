as_built_note: 蓝本 FUNC-00793；metric M_SVC_REC_ATTRACT_SCORE。ENV-SVCATTR-RESULT-LIST-EMPTY-001：名单常诚实空。双分支判定：名单非空时对比改权重前后分值/排序快照（服务端上送不变）；名单空时降级核「不重算/后端签发分」承诺文案（结果态+配置态声明均在）——不伪造分值核。分值与响应一致性黑盒核对（接口级）归人工/后续单，本条锁 UI 诚实性。
