id: FUNC-04604
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04604
priority: P1
tier: B
title: 备选-分析记录列
entry_id: svc-rec-attract
preconditions:
  - 当天至少有一条已完成记录
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: wait
    ms: 1500
  - action: click
    target: 生成招引名单
    locator: |-
      page.locator('main [data-testid="svc-rec-start-analysis"]')
  - action: click
    target: 分析记录
    locator: |-
      page.locator('main').getByRole('tab', { name: '分析记录' }).or(page.locator('.enterprise-center-primary-tabs').getByText('分析记录', { exact: true }))
expect:
  - note: 1、列名为任务、类型、状态、创建时间、操作
    assert: |-
      const table = page.locator('[data-testid="svc-rec-analysis-records"] .arco-table');
      await expect(table.getByText('任务', { exact: true }).first()).toBeVisible({ timeout: 60000 });
      await expect(table.getByText('类型', { exact: true }).first()).toBeVisible();
      await expect(table.getByText('状态', { exact: true }).first()).toBeVisible();
      await expect(table.getByText('创建时间', { exact: true }).first()).toBeVisible();
      await expect(table.getByText('操作', { exact: true }).first()).toBeVisible();
  - note: 2、已完成行的操作含「查看过程」和「查看结果」
    assert: |-
      const table = page.locator('[data-testid="svc-rec-analysis-records"] .arco-table');
      const completedRow = table.locator('tbody tr').filter({ hasText: '已完成' }).first();
      await expect(completedRow.getByRole('button', { name: '查看过程' })).toBeVisible({ timeout: 60000 });
      await expect(completedRow.getByRole('button', { name: '查看结果' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
