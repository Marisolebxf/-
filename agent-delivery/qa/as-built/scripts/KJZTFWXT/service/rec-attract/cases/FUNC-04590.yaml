id: FUNC-04590
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04590
priority: P1
tier: B
title: 备选-未选产业仍可开始
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 分析对象为「产业方向：未选择（名单不按产业切片）」
    assert: |-
      const row = page.locator('.arco-form-item').filter({ hasText: '重点产业方向' }).first();
      const trigger = row.locator('.arco-select-view').first();
      const clearIcon = trigger.locator('.arco-icon-close');
      if (await clearIcon.count()) {
        await clearIcon.click();
      }
      await expect(trigger).toContainText('选择产业集群');
      await page.getByText('按比例归一').click();
      await page.getByRole('button', { name: '开始分析' }).click();
      await expect(page.getByText('产业方向：未选择（名单不按产业切片）')).toBeVisible({ timeout: 120000 });
  - note: 状态为已完成
    assert: |-
      await expect(page.getByText('已完成', { exact: true })).toBeVisible({ timeout: 120000 });
on_fail: 截图 + 抄 X-Trace-Id
