id: P0-18
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00796
priority: P0
tier: B
title: 变更条件重析——切产业显式重跑、旧数据不残留
story: US-SVC-REC-02
entry_id: svc-rec-attract
preconditions:
  - 已登录 admin
  - env-gate overall=pass（任务可创建；结果态可达）
locators:
  cluster_select: .industry-catalog-select
  start: button「开始分析」
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 首次以「新一代信息技术」显式发起分析进入过程态（建立基线任务）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('http://10.50.69.111:30892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) }; const sel=page.locator('.industry-catalog-select').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1000); await page.getByRole('button', { name: '开始分析', exact: true }).click({ timeout: 8000 }); await page.waitForTimeout(3000); if (!/view=processing|view=result/.test(page.url())) throw new Error('首次发起未进入过程/结果: '+page.url()); await page.waitForTimeout(2500)
  - note: 变更为「生物」后须显式重析——切条件不自动起任务（回配置态 URL 无 processing/result）
    assert: |-
      await page.goto('http://10.50.69.111:30892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const sel=page.locator('.industry-catalog-select').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '生物' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); if (/view=processing|view=result/.test(page.url())) throw new Error('切条件自动起任务: '+page.url()); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/生物/.test(echo)) throw new Error('新条件未回显: '+echo)
  - note: 显式点「开始分析」重析后进入新过程态，旧快照不残留（结果页任务/对象为新条件口径）
    assert: |-
      await page.getByRole('button', { name: '开始分析', exact: true }).click({ timeout: 8000 }); await page.waitForTimeout(3000); if (!/view=processing|view=result/.test(page.url())) throw new Error('显式重析未进入过程/结果: '+page.url()); const main=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/新一代信息技术/.test(main) && /生物/.test(main) && /产业方向：新一代信息技术/.test(main.replace(/\s+/g,''))) throw new Error('过程页仍残留旧条件口径对象'); if (!/任务|分析/.test(main)) throw new Error('过程态无任务文案')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00796；切条件不自动起任务与 P0-06/P0-05 互证。注意现场声明「Java rec-list 不按产业切片」：重析后结果名单内容可能与旧名单一致（口径使然），本条只核「切条件回配置态不自动起任务 + 显式重析进新过程态 + 过程页对象不残留旧条件文案」，不断言名单内容差异。
