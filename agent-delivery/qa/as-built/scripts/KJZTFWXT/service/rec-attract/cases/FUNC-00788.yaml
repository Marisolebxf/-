id: FUNC-00788
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00788
priority: P0
tier: B
title: 主流程-恢复默认权重一键复位
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: evaluate
    note: 调整任一权重偏离默认值；点「恢复默认权重」
expect:
  - note: 1、复位后四权重恢复 35/30/20/15
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByTestId('svc-rec-analysis-config')).toBeVisible({ timeout: 15000 });
      const weights = main.getByTestId('svc-rec-fixed-weights');
      await expect(weights).toBeVisible({ timeout: 10000 });
      const spinbuttons = main.getByRole('spinbutton');
      const spinCount = await spinbuttons.count();
      if (spinCount < 1) {
        throw new Error('主区无 spinbutton，权重为固定 Tag 展示，无法执行调整与恢复默认');
      }
      const industrySpin = main.getByRole('spinbutton', { name: /产业匹配度/ }).first();
      await industrySpin.click({ timeout: 5000 });
      await industrySpin.fill('50');
      await industrySpin.press('Enter');
      const resetBtn = main.getByRole('button', { name: '恢复默认权重' });
      await expect(resetBtn).toBeVisible({ timeout: 5000 });
      await resetBtn.click({ timeout: 5000 });
      for (const label of ['产业匹配度 35%', '技术领先性 30%', '发展潜力 20%', '对外合作意愿 15%']) {
        await expect(weights.getByText(label, { exact: false })).toBeVisible({ timeout: 5000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
