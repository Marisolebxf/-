id: FUNC-00785
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00785
priority: P0
tier: B
title: 主流程-招引推荐模型区构成与默认权重
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 区块标题为「招引推荐模型（演示模型口径）」
    assert: |-
      await expect(
        page.locator('main').getByRole('heading', { name: '招引推荐模型（演示模型口径）' }),
      ).toBeVisible()
  - note: 四指标为产业匹配度、技术领先性、发展潜力、对外合作意愿
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('产业匹配度', { exact: true })).toBeVisible();
      await expect(main.getByText('技术领先性', { exact: true })).toBeVisible();
      await expect(main.getByText('发展潜力', { exact: true })).toBeVisible();
      await expect(main.getByText('对外合作意愿', { exact: true })).toBeVisible();
  - note: 四权重初值为 35/30/20/15 且各带上下调节钮
    assert: |-
      const main = page.locator('main');
      const model = main.locator('[data-testid="svc-rec-demo-model"]');
      await expect(model.getByText('35%')).toBeVisible();
      await expect(model.getByText('30%')).toBeVisible();
      await expect(model.getByText('20%')).toBeVisible();
      await expect(model.getByText('15%')).toBeVisible();
      const spinners = model.getByRole('spinbutton');
      await expect(spinners).toHaveCount(4);
on_fail: 截图 + 抄 X-Trace-Id
