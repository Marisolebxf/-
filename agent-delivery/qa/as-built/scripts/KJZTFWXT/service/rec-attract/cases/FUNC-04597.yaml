id: FUNC-04597
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04597
priority: P0
tier: B
title: 主流程-推荐名单行
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: click
    target: 生成招引名单
  - action: wait
    target: table tbody tr
expect:
  - note: 每行含名次、机构名称、城市、推荐理由和分数
    assert: |-
      const lastRow = page.locator('table tbody tr').last();
      await lastRow.scrollIntoViewIfNeeded();
      await expect(lastRow).toBeVisible();
      await expect(page.getByRole('columnheader', { name: '名次' })).toBeVisible();
      await expect(page.getByRole('columnheader', { name: '机构名称' })).toBeVisible();
      await expect(page.getByRole('columnheader', { name: '城市' })).toBeVisible();
      await expect(page.getByRole('columnheader', { name: '推荐理由' })).toBeVisible();
      await expect(page.getByRole('columnheader', { name: '分数' })).toBeVisible();
      const cells = lastRow.locator('td');
      await expect(cells.nth(0)).toBeVisible();
      await expect(cells.nth(1)).toBeVisible();
      await expect(cells.nth(2)).toBeVisible();
      await expect(cells.nth(3)).toBeVisible();
      await expect(cells.nth(4)).toBeVisible();
  - note: 最后一行名次与候选家数一致
    assert: |-
      const lastRow = page.locator('table tbody tr').last();
      await lastRow.scrollIntoViewIfNeeded();
      const rankText = (await lastRow.locator('td').first().innerText()).trim();
      const candidateLabel = page.getByText(/候选.*家/).first();
      await expect(candidateLabel).toBeVisible();
      const labelText = await candidateLabel.innerText();
      const candidateCount = labelText.replace(/[^\d]/g, '');
      await expect(lastRow.locator('td').first()).toContainText(candidateCount);
on_fail: 截图 + 抄 X-Trace-Id
