id: FUNC-04600
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04600
priority: P0
tier: B
title: 主流程-机构画像
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: wait
    timeout_ms: 800
  - action: click
    target: 生成招引名单
  - action: wait
    timeout_ms: 2500
  - action: click
    target: 按钮 查看结果
  - action: assert_visible
    target: 外部机构引进推荐名单
  - action: click
    target: 广州新节奏智能科技股份有限公司
expect:
  - note: 抽屉标题以「机构画像」开头并含该机构名
    assert: |-
      const viewResult = page.getByRole('button', { name: '查看结果' });
      if (await viewResult.isVisible().catch(() => false)) {
        await viewResult.click();
        await page.waitForTimeout(1200);
      }
      const orgBtn = page.locator('[data-testid="svc-rec-list"] button.svc-rec-org-link').first();
      if (await orgBtn.isVisible().catch(() => false)) {
        await orgBtn.click();
        await page.waitForTimeout(800);
      }
      const orgName = (await orgBtn.textContent().catch(() => ''))?.trim() || '广州新节奏智能科技股份有限公司';
      await expect(page.getByText(new RegExp(`^机构画像：.*${orgName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`))).toBeVisible({ timeout: 15000 });
  - note: 可见「基本信息」「技术力五维」「近三年新增服务记录」
    assert: |-
      const drawer = page.locator('.arco-drawer:visible');
      await expect(drawer.getByText('基本信息', { exact: true })).toBeVisible();
      await expect(drawer.getByText('技术力五维', { exact: true })).toBeVisible();
      await expect(drawer.getByText('近三年新增服务记录', { exact: true })).toBeVisible();
  - note: 基本信息含机构类型、所在地、行业、领域覆盖细分
    assert: |-
      const drawer = page.locator('.arco-drawer:visible');
      await expect(drawer.getByText('机构类型')).toBeVisible();
      await expect(drawer.getByText('所在地')).toBeVisible();
      await expect(drawer.getByText('行业')).toBeVisible();
      await expect(drawer.getByText('领域覆盖细分', { exact: true })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
