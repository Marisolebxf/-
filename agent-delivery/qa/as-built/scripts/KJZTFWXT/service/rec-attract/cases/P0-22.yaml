id: P0-22
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00800
priority: P1
tier: B
title: 评审模式显隐——开启四追溯按钮+招引综合分角标，关闭后零泄漏且不改业务态
story: US-SVC-REC-01
entry_id: svc-rec-attract
preconditions:
  - 已登录 admin
  - env-gate overall=pass（勘察时评审模式为开启态）
  - 可经 persona 菜单切换内部评审模式（P3：aria-label="内部评审模式" 的 switch）
locators:
  persona_menu: .persona-switch（右上「专 创新工作台」按钮开菜单）
  review_switch: '.persona-menu button[role=switch][aria-label="内部评审模式"]'
  trace_buttons: 'button.trace-info-icon（aria-label 含「需求追溯」）'
  metric_badge: 'button[aria-label="指标说明：招引综合分"]'
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 开启评审模式后四个需求追溯按钮可见可点（引入服务机构推荐分析/分析配置/招引模型权重/招引模型配置）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.waitForTimeout(2000); const traces=page.locator('button.trace-info-icon'); let n=await traces.count(); if (n<4) { const persona=page.locator('.persona-switch').first(); await persona.click({ timeout: 5000 }); await page.waitForTimeout(800); const sw=page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"], [aria-label="内部评审模式"]').first(); const checked=await sw.getAttribute('aria-checked').catch(()=>null); if (checked!=='true') { await sw.click({ timeout: 5000 }); await page.waitForTimeout(1000) }; await page.keyboard.press('Escape'); await page.waitForTimeout(800); n=await traces.count() } if (n<4) throw new Error('评审开启态追溯按钮 '+n+' <4'); const labels=['引入服务机构推荐分析需求追溯','分析配置需求追溯','招引模型权重需求追溯','招引模型配置需求追溯']; for (const lb of labels) { if (!(await page.locator('button.trace-info-icon[aria-label="'+lb+'"]').count())) throw new Error('缺追溯按钮: '+lb) }
  - note: 角标「指标说明：招引综合分」呈现、长提示含待核验（Q063）与禁止前端重算表述
    assert: |-
      const badge=page.locator('button[aria-label="指标说明：招引综合分"]'); if (!(await badge.count())) throw new Error('未见「指标说明：招引综合分」角标'); const pending=page.locator('[aria-label*="招引综合分口径待核验"]'); if (await pending.count()) { const tip=await pending.first().getAttribute('aria-label'); if (!/Q063/.test(tip||'')) throw new Error('长提示缺 Q063: '+tip); if (!/重算/.test(tip||'')) throw new Error('长提示缺禁止重算表述: '+tip) } else { const main=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/Q063/.test(main)) throw new Error('未见待核验长提示（Q063）') }
  - note: 关闭评审模式后页面无追溯按钮、无综合分角标、无评审字样泄漏（DOM 零泄漏）
    assert: |-
      const persona=page.locator('.persona-switch').first(); await persona.click({ timeout: 5000 }); await page.waitForTimeout(800); const sw=page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"], [aria-label="内部评审模式"]').first(); const checked=await sw.getAttribute('aria-checked').catch(()=>null); if (checked==='true') { await sw.click({ timeout: 5000 }); await page.waitForTimeout(1200) }; await page.keyboard.press('Escape'); await page.waitForTimeout(800); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2500); const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const traces=await page.locator('button.trace-info-icon').count(); if (traces>0) throw new Error('关闭后追溯按钮泄漏 ×'+traces); const badge=await page.locator('button[aria-label*="指标说明：招引综合分"], button[aria-label*="招引综合分"]').count(); if (badge>0) throw new Error('关闭后综合分角标泄漏 ×'+badge); const main=((await page.locator('main').first().innerText().catch(()=>''))||''); const leaks=['Q063','Q-SVC-010','Q-SVCCHAIN-05','GAP-','metric_id','评审']; for (const k of leaks) { if (main.includes(k)) throw new Error('关闭后泄漏字样: '+k) }
  - note: 开关不改变产业集群、权重值与页面业务态（关后默认权重仍在 35/30/20/15）
    assert: |-
      const sel=page.locator('.industry-catalog-select').first(); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (/view=processing|view=result/.test(page.url())) throw new Error('开关评审后页面业务态漂移: '+page.url()); const spins=page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(4, { timeout: 8000 }); const need=['35','30','20','15']; for (let i=0;i<4;i++) { const el=spins.nth(i); const v=String((await el.inputValue().catch(()=>''))||(await el.getAttribute('aria-valuenow').catch(()=>null))||''); if (v!==need[i]) throw new Error('关评审后权重#'+i+'='+v+' ≠'+need[i]+'（若此前人为改过权重，本条以 as_built_note 口径忽略——脚本内未改权重则为真泄漏）') }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00800（本册唯一 4 点结构性例外）；长提示待核验编号=Q063 / Q-SVC-010 / Q-SVCCHAIN-05。P3：评审开关在 persona 菜单内 aria-label="内部评审模式" 的 switch（禁 first() 盲点，菜单开着会遮挡主区——操作后 Esc 关菜单）。零泄漏检索范围含指标编号与缺口字样（用例备注）。零泄漏断言后 reload 防 DOM 残影（P8/X2）。业务态断言假设本条未改权重（脚本事实成立）。P1 用例（脚本 id 顺延 P0-22）。
