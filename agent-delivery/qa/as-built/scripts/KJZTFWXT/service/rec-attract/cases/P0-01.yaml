id: P0-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00779
priority: P0
tier: A
title: 直达 attract 工作区路由与页头双 Tab 正确
story: US-SVC-REC-01
entry_id: svc-rec-attract
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（deep_link/login pass；本条只验入口/双 Tab）
locators:
  title: document.title 含「引入服务机构推荐分析」
  tab_main: '[role=tab][data-tab-key=attract]'
  tab_records: '[role=tab][data-tab-key=records]'
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: assert_url
    expect_contains: workspace=attract&tab=attract
expect:
  - note: 路由为招引工作区直达态（workspace=attract、tab=attract）
    assert: |-
      await expect(page).toHaveURL(/\/service\/institution-decision/); await expect(page).toHaveURL(/workspace=attract/); await expect(page).toHaveURL(/tab=attract/)
  - note: 页标题为「引入服务机构推荐分析」
    assert: await expect(page).toHaveTitle(/引入服务机构推荐分析/)
  - note: 顶部为「引入服务机构推荐分析（选中）/ 分析记录」双 Tab
    assert: |-
      const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); const main = page.locator('[role=tab][data-tab-key="attract"]'); const rec = page.locator('[role=tab][data-tab-key="records"]'); await expect(main).toBeVisible({ timeout: 8000 }); await expect(rec).toBeVisible({ timeout: 8000 }); const aria = await main.getAttribute('aria-selected'); const cls = await main.getAttribute('class'); if (aria !== 'true' && !(cls || '').includes('active')) throw new Error('引入服务机构推荐分析 Tab 未选中'); if (!/引入服务机构推荐分析/.test((await main.innerText()).trim())) throw new Error('主 Tab 文案不符'); if (!/^分析记录/.test((await rec.innerText()).trim())) throw new Error('记录 Tab 文案不符')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00779；env-gate overall=pass；实勘 title=「引入服务机构推荐分析 - 科技专题服务系统」；主 Tab data-tab-key=attract + aria-selected/class=active（评审挂载嵌在标题内，勿对 getByRole name 用 exact）；对比篮浮层 Tab 勿与页头双 Tab 混淆（可见才关）。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
