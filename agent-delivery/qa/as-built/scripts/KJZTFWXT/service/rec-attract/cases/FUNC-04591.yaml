id: FUNC-04591
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04591
priority: P1
tier: B
title: 主流程-重点产业方向下拉
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: assert_visible
    target: 分析配置
  - action: click
    target: 重点产业方向
expect:
  - note: 选项共 15 个，名称见附录 A
    assert: |-
      const cascader = page.locator('main .svc-portal-industry-cascader .arco-cascader-view');
      await cascader.click();
      const col = page.locator('.arco-cascader-panel-column').first();
      await expect(col).toBeVisible();
      const expected = [
        '新一代信息技术', '生物', '新能源', '新材料', '高端装备',
        '智能网联新能源汽车', '绿色环保', '低空经济与空天', '传统与创意', '海洋',
        '未来制造', '未来信息', '未来能源', '未来空间', '未来健康',
      ];
      const labels = col.locator('.arco-cascader-option-label');
      await expect(labels).toHaveCount(15);
      for (const name of expected) {
        await expect(col.getByText(name, { exact: false })).toBeVisible();
      }
  - note: 未选择时占位为「选择产业集群」
    assert: |-
      await page.keyboard.press('Escape');
      const cascader = page.locator('main .svc-portal-industry-cascader .arco-cascader-view');
      await expect(cascader).toContainText('选择产业集群');
  - note: 旁注为「产业只作上下文。Java rec-list 不按产业切片，前端也不假装过滤出另一套名单。」
    assert: |-
      await expect(
        page.locator('main [data-testid="svc-rec-analysis-context"] .svc-rec-note'),
      ).toHaveText('产业只作上下文。Java rec-list 不按产业切片，前端也不假装过滤出另一套名单。');
on_fail: 截图 + 抄 X-Trace-Id
