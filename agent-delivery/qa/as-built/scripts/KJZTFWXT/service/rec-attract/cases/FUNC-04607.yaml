id: FUNC-04607
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04607
priority: P1
tier: B
title: 备选-查看分析记录
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: click
    target: 生成招引名单
  - action: click
    target: 查看分析记录
expect:
  - note: 进入分析记录列表
    assert: |-
      await expect(page).toHaveURL(/[?&]tab=records/, { timeout: 15000 });
      await expect(page.locator('main [data-testid="svc-rec-analysis-records"]')).toBeVisible({ timeout: 15000 });
  - note: 能看到任务、类型、状态、创建时间、操作列
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('columnheader', { name: '任务号' })).toBeVisible();
      await expect(main.getByRole('columnheader', { name: '分析类型' })).toBeVisible();
      await expect(main.getByRole('columnheader', { name: '任务状态' })).toBeVisible();
      await expect(main.getByRole('columnheader', { name: '提交时间' })).toBeVisible();
      await expect(main.getByRole('columnheader', { name: '操作' })).toBeVisible();
      await expect(main.getByText(/^SVC-\d{8}-\d+$/).first()).toBeVisible();
      await expect(main.getByRole('button', { name: '查看结果' }).first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
