id: FUNC-04589
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04589
priority: P1
tier: B
title: 主流程-过程页停住
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 1、过程页状态为已完成
    assert: |-
      const selectView = page.locator('text=重点产业方向').locator('..').locator('.arco-select-view').first();
      await selectView.click();
      await page.locator('.arco-select-option').filter({ hasText: '生物' }).first().click();
      await page.getByRole('button', { name: '开始分析' }).click();
      await expect(page.getByText('已完成', { exact: false }).first()).toBeVisible({ timeout: 120000 });
  - note: 2、分析对象写明产业方向为「生物」
    assert: |-
      await expect(page.locator('body')).toContainText('生物');
  - note: 3、提示不会自动跳转，并出现「查看结果」
    assert: |-
      await expect(page.getByRole('button', { name: '查看结果' })).toBeVisible();
      await expect(page.getByText('不会自动跳转')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
