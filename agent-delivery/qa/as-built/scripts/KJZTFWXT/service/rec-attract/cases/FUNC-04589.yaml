id: FUNC-04589
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04589
priority: P1
tier: B
title: 主流程-过程页停住
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 1、过程页状态为已完成
    assert: |-
      const main = page.locator('main');
      const config = main.locator('[data-testid="svc-rec-analysis-config"]');
      await config.locator('.arco-select-view').first().click();
      await page.locator('.arco-select-dropdown:visible .arco-select-option').filter({ hasText: '生物' }).first().click();
      await config.getByRole('button', { name: '生成招引名单' }).click();
      await expect(main.getByText('已完成', { exact: false }).first()).toBeVisible({ timeout: 120000 });
  - note: 2、分析对象写明产业方向为「生物」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText(/产业方向：.*生物/)).toBeVisible();
  - note: 3、提示不会自动跳转，并出现「查看结果」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('button', { name: '查看结果' })).toBeVisible();
      await expect(main.getByText(/不会自动|须点「查看结果」|停在过程页/)).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
