id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00787
priority: P0
tier: B
title: 权重调节钮增减与输入框直接键入两种编辑方式
story: US-SVC-REC-01
entry_id: svc-rec-attract
preconditions:
  - 已登录 admin
  - env-gate overall=pass
  - 已进入 attract 工作区且模型区可见
locators:
  spins: '[role=spinbutton]' ×4
  step_buttons: .arco-input-number-step-button ×8（每权重 2 枚，实勘 DOM 序 nth(0)=上调 nth(1)=下调）
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
expect:
  - note: 点产业匹配度调节钮各一次：先上调 +1（35→36）、再下调回 35（P2 跨 tick）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) }; const spins=page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(4, { timeout: 8000 }); const s0=spins.nth(0); const wrap=s0.locator('xpath=ancestor::*[contains(@class,"arco-input-number")][1]'); const btns=wrap.locator('.arco-input-number-step-button'); const readV=async()=>String((await s0.inputValue().catch(()=>''))||(await s0.getAttribute('aria-valuenow').catch(()=>null))||''); let upIdx=1; await btns.nth(upIdx).click({ timeout: 5000 }); await page.waitForTimeout(700); let v1=await readV(); if (v1!=='36') { upIdx=0; const s0b=page.locator('[role=spinbutton]').nth(0); await s0b.click({ timeout: 5000 }); const wrapB=s0b.locator('xpath=ancestor::*[contains(@class,"arco-input-number")][1]'); const btnsB=wrapB.locator('.arco-input-number-step-button'); await btnsB.nth(0).click({ timeout: 5000 }); await page.waitForTimeout(700); v1=String((await s0b.inputValue().catch(()=>''))||(await s0b.getAttribute('aria-valuenow').catch(()=>null))||''); if (v1!=='36') throw new Error('两向调节钮均未 +1: nth1 得 34、nth0 得 '+v1) } const s0c=page.locator('[role=spinbutton]').nth(0); const wrapC=s0c.locator('xpath=ancestor::*[contains(@class,"arco-input-number")][1]'); const btnsC=wrapC.locator('.arco-input-number-step-button'); await btnsC.nth(upIdx===1?0:1).click({ timeout: 5000 }); await page.waitForTimeout(700); const v2=String((await s0c.inputValue().catch(()=>''))||(await s0c.getAttribute('aria-valuenow').catch(()=>null))||''); if (v2!=='35') throw new Error('反向调节后='+v2+' ≠35')
  - note: 权重输入框支持直接键入新值（第二项 30→25）
    assert: |-
      const s1=page.locator('[role=spinbutton]').nth(1); await s1.click({ timeout: 5000 }); await s1.fill('25'); await s1.blur().catch(()=>{}); await page.waitForTimeout(600); const v=String((await s1.inputValue().catch(()=>''))||(await s1.getAttribute('aria-valuenow').catch(()=>null))||''); if (v!=='25') throw new Error('键入后='+v+' ≠25')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00787。首跑实测 35→34：nth(1) 实为下调、nth(0) 为上调（图标钮无文本/aria-label，实勘定向）。改为运行时探测：先点 nth(1)，若非 36 则点 nth(0)（值须 36，否则真红）；反向用对侧钮。合计=100 校验为 USM 目标态未实现不判 Fail（开放项 2）。收尾不还原（下条自含 goto 重置，P8）。
