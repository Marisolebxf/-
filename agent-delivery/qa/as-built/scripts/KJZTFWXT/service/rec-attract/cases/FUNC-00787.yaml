id: FUNC-00787
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00787
priority: P1
tier: B
title: 主流程-权重调节与键入编辑
entry_id: svc-rec-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-decision?workspace=attract&tab=attract
  - action: exec
    note: 点产业匹配度的上调钮一次再下调一次
    script: |-
      const model = page.locator('[data-testid="svc-rec-demo-model"]');
      await expect(model).toBeVisible();
      await expect(model.getByText('产业匹配度', { exact: false })).toBeVisible();
      const row = model.locator('.svc-rec-weight-row').filter({ hasText: '产业匹配度' });
      await expect(row).toBeVisible();
      const spin = row.getByRole('spinbutton');
      const up = row.locator('.arco-input-number-step-button').first();
      const down = row.locator('.arco-input-number-step-button').last();
      const before = Number(await spin.inputValue());
      await up.click();
      await expect(spin).toHaveValue(String(before + 1));
      await down.click();
      await expect(spin).toHaveValue(String(before));
  - action: exec
    note: 在产业匹配度权重输入框直接键入新值
    script: |-
      const model = page.locator('[data-testid="svc-rec-demo-model"]');
      const row = model.locator('.svc-rec-weight-row').filter({ hasText: '产业匹配度' });
      const spin = row.getByRole('spinbutton');
      await spin.fill('42');
      await spin.blur();
      await expect(spin).toHaveValue('42');
expect:
  - note: 调节钮每次增减 1
    assert: |-
      const model = page.locator('[data-testid="svc-rec-demo-model"]');
      const row = model.locator('.svc-rec-weight-row').filter({ hasText: '产业匹配度' });
      const spin = row.getByRole('spinbutton');
      await expect(spin).toHaveValue('42');
  - note: 权重值支持直接键入修改
    assert: |-
      const model = page.locator('[data-testid="svc-rec-demo-model"]');
      const row = model.locator('.svc-rec-weight-row').filter({ hasText: '产业匹配度' });
      await expect(row.getByRole('spinbutton')).toHaveValue('42');
on_fail: 截图 + 抄 X-Trace-Id
