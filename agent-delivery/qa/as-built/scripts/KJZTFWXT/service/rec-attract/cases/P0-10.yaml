    assert: |-
      const main=((await page.locator('main').first().innerText().catch(()=>''))||''); const keys=['综合分由 Java rec-list 上送','前端不按四指标权重重算','默认 35/30/20/15','权重不进入分析指纹','也不写入创建任务参数']; for (const k of keys) { if (!main.replace(/\s+/g,'').includes(k.replace(/\s+/g,''))) throw new Error('底部声明缺要点: '+k) }
