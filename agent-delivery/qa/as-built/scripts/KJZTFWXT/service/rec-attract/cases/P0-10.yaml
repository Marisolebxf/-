      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('http://111.198.38.90:50892/service/institution-decision?workspace=attract&tab=attract', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) }; await expect(page.getByText(/招引推荐模型/).first()).toBeVisible({ timeout: 8000 }); const main=((await page.locator('main').first().innerText().catch(()=>''))||''); const keys=['匹配程度','领先程度','成长空间','合作意愿']; for (const k of keys) { if (!main.includes(k)) throw new Error('说明文案缺关键词: '+k) }
