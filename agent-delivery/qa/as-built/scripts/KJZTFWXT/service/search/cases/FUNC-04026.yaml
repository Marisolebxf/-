id: FUNC-04026
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04026
priority: P1
tier: B
title: 备选-示例词再搜索（双条件标签 + 空结果）
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search
  - action: evaluate
    note: 智能检索点示例「知识产权 广东」再点「搜索」（判定在 expect）
expect:
  - note: 1、已匹配条件含「所在城市：广东」
    assert: |-
      const hideCompareBasket = async () => {
        const x = page.locator('[aria-label="关闭对比篮"]');
        if (!(await x.count())) return;
        if (await x.first().isVisible().catch(() => false)) {
          await x.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      await hideCompareBasket();
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('ENV-ENTRY-UNREACHABLE: /service-center/search SPA404');
      }
      await expect(page.getByRole('tab', { name: '智能检索' })).toHaveAttribute('aria-selected', 'true', { timeout: 10000 });
      await page.getByRole('button', { name: '知识产权 广东', exact: true }).click();
      await page.waitForTimeout(400);
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(2000);
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 15000 });
      await expect(page.getByText(/所在城市：广东/)).toBeVisible({ timeout: 10000 });
      globalThis.__func04026_searched = true;
  - note: 2、已匹配条件含「行业：知识产权」
    assert: |-
      if (!globalThis.__func04026_searched) throw new Error('前置：示例词搜索未完成');
      await expect(page.getByText(/行业：知识产权/)).toBeVisible({ timeout: 10000 });
  - note: 3、结果文案为「暂无匹配的服务机构」
    assert: |-
      if (!globalThis.__func04026_searched) throw new Error('前置：示例词搜索未完成');
      await expect(page.getByText('暂无匹配的服务机构', { exact: true })).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
