id: FUNC-04009
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04009
priority: P0
tier: B
title: 主流程-专利数量条件（运算符与单位）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已进入「高级筛选」
locators:
  tab_adv: '.enterprise-search-mode-tabs [role=tab] → 高级筛选'
  field_lib: region「高级筛选字段库」
  field_patent: 字段库 Tag「专利数量」
  cond_row: .condition-builder（含专利数量）
  cond_op: .condition-builder__op
  cond_unit: .condition-builder__unit
steps:
  - action: evaluate
    note: 侧栏进服务机构查询 → 高级筛选点「专利数量」并展开运算符（判定在 expect）
expect:
  - note: 1、运算符为「≥」「≤」「范围」共 3 个；2、单位为「件」
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/智能检索|产业查询|专题全景/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2500);
        }
      };
      const ensureAppShell = async () => {
        await dismissBasket();
        await recover404Shell();
        const menuRoot = page.locator('.arco-menu, .layout-menu, nav').first();
        const hasMenu = await menuRoot.isVisible().catch(() => false);
        if (!hasMenu || (await bodyIs404())) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
          await recover404Shell();
        }
      };
      const searchItem = () =>
        page.locator('.arco-menu-item, .layout-menu-item').filter({ hasText: /^服务机构查询$/ });
      const enterSvcSearch = async () => {
        await ensureAppShell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 登录后仍 SPA404 无侧栏壳 url=' + page.url());
        }
        if (!(await searchItem().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(500);
          }
        }
        await expect(searchItem().first()).toBeVisible({ timeout: 15000 });
        await searchItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/service-center\/search/, { timeout: 20000 });
        await recover404Shell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 侧栏进 /service-center/search 仍 SPA404 url=' + page.url());
        }
      };
      await enterSvcSearch();
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      const patentTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '专利数量' }).first();
      await expect(patentTag).toBeVisible({ timeout: 8000 });
      await patentTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const condRow = page.locator('.condition-builder').filter({ hasText: '专利数量' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const unitEl = condRow.locator('.condition-builder__unit');
      await expect(unitEl).toBeVisible({ timeout: 8000 });
      const unitText = ((await unitEl.innerText()) || '').replace(/\s+/g, '').trim();
      if (unitText !== '件') {
        throw new Error('专利数量单位应为「件」，实际 unit=' + JSON.stringify(unitText));
      }
      const opSelect = condRow.locator('.condition-builder__op');
      await expect(opSelect).toBeVisible({ timeout: 8000 });
      const opTrigger = condRow.locator('.condition-builder__op .arco-select-view-single, .condition-builder__op .arco-select-view').first();
      if (await opTrigger.count()) {
        await opTrigger.click({ timeout: 8000 });
      } else {
        await condRow.getByRole('combobox').first().click({ timeout: 8000 });
      }
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      const count = await opts.count();
      const labels = [];
      for (let i = 0; i < count; i++) {
        labels.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      const want = ['≥', '≤', '范围'];
      if (count !== 3) {
        throw new Error('专利数量运算符应共 3 个选项，实际 count=' + count + ' labels=' + JSON.stringify(labels));
      }
      for (const w of want) {
        if (!labels.some((l) => l === w || l.includes(w))) {
          throw new Error('缺少运算符「' + w + '」，实际 labels=' + JSON.stringify(labels));
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 04009；catalog_path=/service-center/search。高级筛选 Tab + 字段库点「专利数量」Tag。
  运算符=.condition-builder__op（≥/≤/范围 共 3 项）；单位=.condition-builder__unit「件」（对齐 fixture numberRange）。
  壳恢复对齐 FUNC-01328（goto 根路径 + 侧栏 menu_leaf，不 goto sibling 深链）。登录与关内部评审由 runner 会话前置。
