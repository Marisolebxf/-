id: FUNC-04022
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04022
priority: P1
tier: B
title: 备选-管理方案后取消
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search
  - action: evaluate
    note: 高级筛选 Tab、点管理、点取消；两条预期在 expect 分步判定
expect:
  - note: 1、方案名「深圳」仍在
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/service-center\/search/, { timeout: 15000 });
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const plansRow = page.locator('.enterprise-search-history-row').filter({ hasText: '我的方案' }).first();
      await expect(plansRow).toBeVisible({ timeout: 10000 });
      const chip = plansRow.locator('.enterprise-search-history-tag').filter({ hasText: '深圳' }).first();
      if ((await chip.count()) === 0) {
        throw new Error('前置：我的方案中应有「深圳」，当前未见该方案 chip');
      }
      await expect(chip).toBeVisible({ timeout: 8000 });
      const manageBtn = plansRow.getByRole('button', { name: '管理', exact: true });
      await expect(manageBtn).toBeVisible({ timeout: 8000 });
      await manageBtn.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const cancelBtn = plansRow.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 8000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      await expect(chip).toBeVisible({ timeout: 8000 });
  - note: 2、按钮文案恢复为「管理」
    assert: |-
      const plansRow = page.locator('.enterprise-search-history-row').filter({ hasText: '我的方案' }).first();
      await expect(plansRow.getByRole('button', { name: '管理', exact: true })).toBeVisible({ timeout: 8000 });
      await expect(plansRow.getByRole('button', { name: '取消', exact: true })).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
