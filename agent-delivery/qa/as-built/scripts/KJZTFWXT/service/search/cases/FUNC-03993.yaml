id: FUNC-03993
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03993
priority: P0
tier: B
title: 主流程-结果卡片构成（卡片信息）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已进入有机构卡片的检索结果
locators:
  org_card: article.svc-org-search-card
  org_name_link: button.svc-org-search-link
  card_meta: .svc-org-search-card__meta
  score_hint: .svc-org-search-card__score-hint → 技术力分
  score_value: .svc-org-search-card__score-value
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进入后智能检索「深圳」出结果，再浏览首张结果卡片（判定在 expect）
expect:
  - note: 前置：检索结果区至少一张机构卡片
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const enterSvcSearch = async () => {
        await dismissBasket();
        await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await recover404Shell();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入服务机构查询壳 url=' + page.url());
        }
        const searchItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^服务机构查询$/ });
        if (!(await searchItem().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(searchItem().first()).toBeVisible({ timeout: 10000 });
        await searchItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/service-center\/search/, { timeout: 15000 });
      };
      await enterSvcSearch();
      const inp = page.getByPlaceholder(/用一句话描述机构需求/);
      await expect(inp).toBeVisible({ timeout: 8000 });
      await inp.fill('深圳');
      const searchBtn = page.locator('.arco-input-search-btn').filter({ hasText: /^搜索$/ }).first();
      await expect(searchBtn).toBeVisible({ timeout: 8000 });
      await searchBtn.click({ timeout: 8000 });
      await page.waitForTimeout(2500);
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/共 \d+ 家匹配机构/)).toBeVisible({ timeout: 15000 });
      const card = page.locator('article.svc-org-search-card').first();
      const nCard = await card.count();
      if (nCard < 1) throw new Error('前置：结果区未见机构卡片 article.svc-org-search-card');
      await expect(card).toBeVisible({ timeout: 10000 });
      globalThis.__func03993_card = card;
  - note: 1、卡片首行是可点的名称或代码
    assert: |-
      const card = globalThis.__func03993_card || page.locator('article.svc-org-search-card').first();
      const nameBtn = card.locator('button.svc-org-search-link').first();
      await expect(nameBtn).toBeVisible({ timeout: 8000 });
      const nameText = ((await nameBtn.innerText()) || '').trim();
      if (!nameText) throw new Error('卡片首行名称为空');
      await expect(nameBtn).toBeEnabled({ timeout: 5000 });
  - note: 2、卡片含服务类型、行业以及城市、省份、区域
    assert: |-
      const card = globalThis.__func03993_card || page.locator('article.svc-org-search-card').first();
      const titleTags = card.locator('.svc-org-search-card__title .arco-tag');
      const tagN = await titleTags.count();
      if (tagN < 1) throw new Error('卡片标题区未见服务类型或行业 Tag');
      const meta = card.locator('.svc-org-search-card__meta');
      await expect(meta).toBeVisible({ timeout: 8000 });
      const metaText = ((await meta.innerText()) || '').replace(/\s+/g, ' ');
      if (!/城市：/.test(metaText)) throw new Error('卡片 meta 缺少「城市：」');
      if (!/省份：/.test(metaText)) throw new Error('卡片 meta 缺少「省份：」');
      if (!/区域：/.test(metaText)) throw new Error('卡片 meta 缺少「区域：」');
  - note: 3、技术力分无值时显示「暂无」
    assert: |-
      const card = globalThis.__func03993_card || page.locator('article.svc-org-search-card').first();
      await expect(card.locator('.svc-org-search-card__score-hint').filter({ hasText: '技术力分' })).toBeVisible({ timeout: 8000 });
      const scoreVal = card.locator('.svc-org-search-card__score-value').first();
      await expect(scoreVal).toBeVisible({ timeout: 8000 });
      const scoreText = ((await scoreVal.innerText()) || '').trim();
      if (scoreText === '暂无') {
        await expect(scoreVal).toHaveText('暂无');
        return;
      }
      if (/^\d+(\.\d+)?$/.test(scoreText)) {
        const cards = page.locator('article.svc-org-search-card');
        const total = await cards.count();
        for (let i = 0; i < Math.min(total, 8); i++) {
          const t = ((await cards.nth(i).locator('.svc-org-search-card__score-value').innerText()) || '').trim();
          if (t === '暂无') {
            await expect(cards.nth(i).locator('.svc-org-search-card__score-value')).toHaveText('暂无');
            return;
          }
        }
        throw new Error('首卡有技术力分值但前 8 张均无「暂无」空态，无法验无值展示');
      }
      throw new Error('技术力分值应为「暂无」或数字，实际=' + scoreText);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 03993；catalog_path=/service-center/search。卡片 DOM：article.svc-org-search-card；
  首行 button.svc-org-search-link；meta 城市/省份/区域；score-value 无分「暂无」+ score-hint「技术力分」
  （ServiceOrgSearchPage.vue）。前置经智能检索「深圳」出卡，不写死机构全名。登录与关内部评审由 runner 前置。
