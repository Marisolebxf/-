id: FUNC-03993
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03993
priority: P0
tier: B
title: 主流程-结果卡片构成
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?kw=深圳
  - action: wait
    assert: |-
      await expect(page.locator('main')).getByText('检索结果', { exact: false }).toBeVisible({ timeout: 60000 })
expect:
  - note: 1、卡片首行是可点的名称或代码
    assert: |-
      const card = page.locator('main article.svc-org-search-card').first();
      await expect(card.locator('button.svc-org-search-link').first()).toBeVisible();
      await expect(card.locator('button.svc-org-search-link').first()).toBeEnabled();
  - note: 2、卡片含服务类型、行业以及城市、省份、区域
    assert: |-
      const card = page.locator('main article.svc-org-search-card').first();
      await expect(card.locator('.svc-org-search-card__meta')).toContainText('城市：');
      await expect(card.locator('.svc-org-search-card__meta')).toContainText('省份：');
      await expect(card.locator('.svc-org-search-card__meta')).toContainText('区域：');
      const title = card.locator('.svc-org-search-card__title');
      await expect(title.locator('.arco-tag').first()).toBeVisible();
  - note: 3、技术力分无值时显示「暂无」
    assert: |-
      const scoreBlock = page.locator('main article.svc-org-search-card').first().locator('.svc-org-search-card__score');
      await expect(scoreBlock.locator('.svc-org-search-card__score-value')).toHaveText('暂无');
      await expect(scoreBlock).toContainText('技术力分');
on_fail: 截图 + 抄 X-Trace-Id
