id: FUNC-03991
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03991
priority: P0
tier: A
title: 主流程-使用查询方案到达结果（方案深圳）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已进入「高级筛选」
  - 「使用查询方案」中已有「深圳」
locators:
  tab_adv: '.enterprise-search-mode-tabs [role=tab] → 高级筛选'
  use_plan: button 使用查询方案
  plan_option: .arco-dropdown-option → 深圳
  result_heading: heading「检索结果」
  org_card_action: 结果卡片「加入对比篮」
steps:
  - action: goto
    target: /service-center/search
  - action: evaluate
    note: 高级筛选 Tab、使用查询方案选「深圳」；三条预期在 expect 分步判定
expect:
  - note: 前置：高级筛选已打开且下拉含「深圳」方案
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/service-center\/search/, { timeout: 15000 });
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const usePlanBtn = page.locator('main').getByRole('button', { name: '使用查询方案' });
      await expect(usePlanBtn).toBeVisible({ timeout: 10000 });
      const disabled = await usePlanBtn.isDisabled().catch(() => true);
      if (disabled) {
        throw new Error('前置：使用查询方案应有已存方案（含「深圳」），当前按钮 disabled');
      }
      await usePlanBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const planOpt = page.locator('.arco-dropdown-option').filter({ hasText: /^深圳$/ });
      if ((await planOpt.count()) === 0) {
        await page.keyboard.press('Escape');
        throw new Error('前置：使用查询方案下拉中应有「深圳」');
      }
      await expect(planOpt.first()).toBeVisible({ timeout: 8000 });
      globalThis.__func03991_planReady = true;
  - note: 1、出现「高级筛选结果」
    assert: |-
      if (!globalThis.__func03991_planReady) throw new Error('前置：方案下拉未就绪');
      const planOpt = page.locator('.arco-dropdown-option').filter({ hasText: /^深圳$/ }).first();
      await planOpt.click({ timeout: 8000 });
      await page.waitForTimeout(2000);
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText('高级筛选结果', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、当前条件为「机构名称：深圳」
    assert: |-
      await expect(page.getByText('当前条件').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('机构名称：深圳', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、检索结果中有机构卡片（至少一条含「加入对比篮」行动点，不写死命中条数）
    assert: |-
      await expect(page.getByText(/共 \d+ 家匹配机构/)).toBeVisible({ timeout: 15000 });
      const n = await page.getByRole('button', { name: '加入对比篮' }).count();
      if (n < 1) throw new Error('结果区未见机构卡片行动「加入对比篮」');
      await expect(page.getByRole('button', { name: '加入对比篮' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  30892 重写：Arco Dropdown 用 .arco-dropdown-option 选「深圳」，非 menuitem。
