id: FUNC-03994
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03994
priority: P0
tier: B
title: 主流程-机构抽屉（抽屉字段）
entry_id: svc-search
preconditions:
  - 已进入有卡片的检索结果
locators: {}
steps:
  - action: goto
    target: /service-center/search
  - action: evaluate
    note: 点击首条机构名称打开抽屉
expect:
  - note: 前置：检索结果区至少一张机构卡片；点击首卡机构名称
    assert: |-
      const card = page.locator('main article.svc-org-search-card').first();
      await expect(card).toBeVisible({ timeout: 25000 });
      const nameBtn = card.locator('button.svc-org-search-link').first();
      const cardName = ((await nameBtn.innerText()) || '').trim();
      if (!cardName) throw new Error('卡片机构名称为空');
      const svcTag = card.locator('.svc-org-search-card__title .arco-tag').first();
      const svcType = (await svcTag.count()) ? ((await svcTag.innerText()) || '').trim() : '';
      const metaText = ((await card.locator('.svc-org-search-card__meta').innerText()) || '').replace(/\s+/g, ' ');
      const cityM = metaText.match(/城市：([^省区]+)/);
      const cardCity = cityM ? cityM[1].trim() : '';
      const indTag = card.locator('.svc-org-search-card__title .arco-tag').nth(1);
      const cardIndustry = (await indTag.count()) ? ((await indTag.innerText()) || '').trim() : '';
      globalThis.__func03994 = { cardName, svcType, cardCity, cardIndustry };
      await nameBtn.click({ timeout: 10000 });
      await page.waitForURL(/\borg=/, { timeout: 20000 });
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 20000 });
      await expect(drawer.locator('[data-testid="svc-org-profile-drawer"]')).toBeVisible({ timeout: 20000 });
      globalThis.__func03994_drawer = drawer;
  - note: 1、抽屉标题为该机构名称
    assert: |-
      const snap = globalThis.__func03994;
      const drawer = globalThis.__func03994_drawer || page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 15000 });
      const titleText = ((await drawer.locator('.arco-drawer-title, .svc-org-drawer-title').first().innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!titleText.includes(snap.cardName)) {
        throw new Error('抽屉标题应含机构名称，title=' + titleText);
      }
  - note: 2、抽屉含机构标识、名称、服务类型、城市、行业
    assert: |-
      const snap = globalThis.__func03994;
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 15000 });
      const orgId = new URL(page.url()).searchParams.get('org');
      if (!orgId || !orgId.trim()) throw new Error('机构标识（URL org）缺失');
      const body = drawer.locator('[data-testid="svc-org-profile-drawer"]');
      await expect(body).toBeVisible({ timeout: 15000 });
      await expect(drawer.locator('.arco-spin')).toBeHidden({ timeout: 25000 }).catch(async () => {
        await expect(drawer.locator('.svc-drawer-section').first()).toBeVisible({ timeout: 25000 });
      });
      const titleText = ((await drawer.locator('.arco-drawer-title').innerText()) || '').replace(/\s+/g, ' ');
      if (!titleText.includes(snap.cardName)) throw new Error('名称未在抽屉标题：' + titleText);
      if (snap.svcType) {
        await expect(drawer.getByText(snap.svcType, { exact: false }).first()).toBeVisible({ timeout: 12000 });
      }
      if (snap.cardCity && snap.cardCity !== '暂无') {
        const cityNeedle = snap.cardCity.replace(/市$/, '');
        await expect(drawer.getByText(new RegExp(cityNeedle)).first()).toBeVisible({ timeout: 12000 });
      }
      const industryNeedle = (snap.cardIndustry || snap.svcType || '').trim();
      if (industryNeedle) {
        await expect(drawer.getByText(industryNeedle, { exact: false }).first()).toBeVisible({ timeout: 12000 });
      } else {
        await expect(body.locator('.arco-descriptions-item-label').filter({ hasText: '行业' }).first()).toBeVisible({ timeout: 12000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
