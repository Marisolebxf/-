id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01347
priority: P1
title: 关闭评审模式后本页零泄漏且检索状态保留
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
- 可切换内部评审模式
- 已输入关键词发起一次检索
locators:
  review_switch: persona-menu 内 switch aria-label「内部评审模式」
steps:
- action: goto
  target: /service-center/search
- action: fill
  target: 搜索框
  value: 深圳
- action: click
  target: 搜索
- action: wait
  for: 结果区
- action: evaluate
  note: 经 persona-menu 关闭内部评审模式
- action: reload
expect:
- note: 关闭后全页无评审类文案与内部编号字样（附录 B）
  assert: |-
    async function closeReview() { const persona = page.locator('button.persona-switch').first(); await persona.click(); await page.waitForTimeout(400); const sw = page.getByRole('switch', { name: '内部评审模式' }); if (await sw.count()) { if (await sw.getAttribute('aria-checked') === 'true') await sw.click(); } await page.keyboard.press('Escape'); } await page.getByPlaceholder(/用一句话描述机构需求/).fill('深圳'); await page.getByRole('button', { name: '搜索', exact: true }).click(); await expect(page.getByText(/共 \d+ 家匹配机构/)).toBeVisible({ timeout: 15000 }); await closeReview(); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const txt = await page.locator('main').innerText(); for (const bad of ['指标说明','指标未登记','需求追溯','metric_id','GAP-']) { if (txt.includes(bad)) throw new Error('业务态泄漏: ' + bad); } if (/Q0\d{2}/.test(txt)) throw new Error('业务态泄漏 Q0xx')
- note: 当前 Tab 选中态与输入框关键词保留
  assert: |-
    await expect(page.getByRole('tab', { name: '智能检索' })).toHaveAttribute('aria-selected', 'true'); const v = await page.getByPlaceholder(/用一句话描述机构需求/).inputValue().catch(() => ''); if (!v && !(await page.getByText(/共 \d+ 家匹配机构|已匹配条件/).count())) throw new Error('刷新后关键词与结果态均未保留')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 零泄漏清单=用例附录 B；开启态角标挂点未深勘。对比篮浮层内追溯按钮不计入 main 业务区（assert 扫 main）。
tier: B
