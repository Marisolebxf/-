id: FUNC-03998
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03998
priority: P0
tier: B
title: 主流程-所在城市取值（下拉选项）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已在高级筛选添加「所在城市」
locators:
  tab_adv: '.enterprise-search-mode-tabs [role=tab] → 高级筛选'
  field_lib: region「高级筛选字段库」
  field_city: 字段库 Tag「所在城市」
  cond_row: .condition-builder（含所在城市）
  value_select: .condition-builder__value .arco-select-view
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进入服务机构查询、高级筛选添加所在城市并展开取值下拉（判定在 expect）
expect:
  - note: 1、选项共 8 个
    assert: |-
      const searchItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^服务机构查询$/ });
      if (!(await searchItem().first().isVisible().catch(() => false))) {
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      }
      await expect(searchItem().first()).toBeVisible({ timeout: 10000 });
      await searchItem().first().click({ timeout: 10000 });
      await page.waitForURL(/\/service-center\/search/, { timeout: 15000 });
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      const cityTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '所在城市' }).first();
      await expect(cityTag).toBeVisible({ timeout: 8000 });
      await cityTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const condRow = page.locator('.condition-builder').filter({ hasText: '所在城市' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const valueView = condRow.locator('.condition-builder__value .arco-select-view').first();
      await expect(valueView).toBeVisible({ timeout: 8000 });
      await valueView.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      await expect(pop.locator('.arco-select-option')).toHaveCount(8);
  - note: 2、名称与附录 D 一致
    assert: |-
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const want = ['深圳', '北京', '上海', '广州', '杭州', '苏州', '成都', '武汉'];
      for (let i = 0; i < want.length; i++) {
        await expect(options.nth(i)).toContainText(want[i]);
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
