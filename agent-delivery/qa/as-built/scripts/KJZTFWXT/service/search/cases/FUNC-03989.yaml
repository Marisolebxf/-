id: FUNC-03989
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03989
priority: P0
tier: A
title: 主流程-查机构到达结果（关键词检索）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已进入「查机构」Tab
locators:
  tab_org: '.enterprise-search-mode-tabs [role=tab] → 查机构（第 2 枚）'
  org_input: textbox placeholder「输入机构名称、城市或行业关键词」
  search_btn: button「搜索」（exact）
  result_heading: heading「检索结果」
  org_card_action: 结果卡片「加入对比篮」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进入服务机构查询 → 查机构 Tab → 输入「检验检测」并搜索（判定在 expect）
expect:
  - note: 出现标题「检索结果」
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const enterSvcSearch = async () => {
        await dismissBasket();
        await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await recover404Shell();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入服务机构查询壳 url=' + page.url());
        }
        const searchItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^服务机构查询$/ });
        if (!(await searchItem().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(searchItem().first()).toBeVisible({ timeout: 10000 });
        await searchItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/service-center\/search/, { timeout: 15000 });
      };
      await enterSvcSearch();
      const tabs = page.locator('.enterprise-search-mode-tabs [role=tab]');
      await expect(tabs).toHaveCount(3, { timeout: 8000 });
      await tabs.nth(1).click();
      await page.waitForTimeout(400);
      await expect(page).toHaveURL(/mode=org/);
      const inp = page.getByPlaceholder(/输入机构名称、城市或行业关键词/);
      await expect(inp).toBeVisible({ timeout: 8000 });
      await inp.fill('检验检测');
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(1200);
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 15000 });
  - note: 结果列表中有机构卡片（至少一条含「加入对比篮」行动点，不写死命中条数）
    assert: |-
      await expect(page.getByText(/共 \d+ 家匹配机构/)).toBeVisible({ timeout: 15000 });
      const n = await page.getByRole('button', { name: '加入对比篮' }).count();
      if (n < 1) throw new Error('结果区未见机构卡片行动「加入对比篮」');
      await expect(page.getByRole('button', { name: '加入对比篮' }).first()).toBeVisible({ timeout: 8000 });
  - note: 页面没有「已匹配条件」标签（查机构与智能检索差异）
    assert: |-
      const markers = page.getByText('已匹配条件', { exact: false });
      const cnt = await markers.count();
      for (let i = 0; i < cnt; i++) {
        const vis = await markers.nth(i).isVisible().catch(() => false);
        if (vis) throw new Error('查机构结果态不应出现「已匹配条件」标签');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 金样 03989；关键词「检验检测」来自用例册。edu 深链 /service-center/search 常 SPA404，侧栏经 sibling /industry-center/search 进 menu_leaf（同 FUNC-01328/03988）。查机构 Tab 用 .enterprise-search-mode-tabs 第 2 枚 tab。catalog_path 仍为 /service-center/search。实勘 org+检验检测约 15 命中、无已匹配条件（scout-hits matched=false）。登录与关内部评审由 runner 会话前置。
