id: FUNC-03996
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03996
priority: P1
tier: B
title: 主流程-加入分析集合
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?kw=深圳
  - action: wait
    ms: 800
expect:
  - note: 前置：已进入有卡片的检索结果
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('检索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(main.locator('[data-search-state="recommendation"]')).toHaveCount(0);
      const card = main.locator('article.svc-org-search-card').first();
      await expect(card.getByRole('button', { name: '加入分析集合' })).toBeVisible();
  - note: 1.点击一行「加入分析集合」
    assert: |-
      const main = page.locator('main');
      const card = main.locator('article.svc-org-search-card').first();
      await card.getByRole('button', { name: '加入分析集合' }).click();
  - note: 1、提示已将该机构加入服务机构分析集合
    assert: |-
      const toast = page.locator('.arco-message').filter({ hasText: '加入服务机构分析集合' });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
