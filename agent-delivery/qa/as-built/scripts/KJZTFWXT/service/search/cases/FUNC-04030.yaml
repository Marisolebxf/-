id: FUNC-04030
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04030
priority: P1
tier: B
title: 备选-分析集合再点（重复提示）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 该机构已加入过分析集合
locators:
  join_analysis_btn: button「加入分析集合」
  org_card: article.svc-org-search-card
steps:
  - action: goto
    target: /service-center/search
expect:
  - note: 前置：该机构已加入过分析集合
    assert: |-
      await expect(page.getByText('技术力领先机构').or(page.getByRole('heading', { name: '检索结果', exact: true }))).toBeVisible({ timeout: 20000 });
      const card = page
        .locator('article.svc-org-search-card')
        .filter({ has: page.getByRole('button', { name: '加入分析集合' }) })
        .first();
      await expect(card).toBeVisible({ timeout: 15000 });
      const nameBtn = card.locator('button.svc-org-search-link').first();
      const orgName = ((await nameBtn.innerText()) || '').trim();
      if (!orgName) throw new Error('卡片机构名称为空');
      const esc = orgName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const joinBtn = card.getByRole('button', { name: '加入分析集合' });
      await joinBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const firstOk = new RegExp('已将[「"]' + esc + '[」"]加入服务机构分析集合');
      const already = new RegExp('「' + esc + '」已在分析集合中');
      const toast = page.locator('.arco-message, .arco-notification');
      const body = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const okFirst =
        (await toast.filter({ hasText: firstOk }).count()) > 0 ||
        firstOk.test(body) ||
        (await toast.filter({ hasText: already }).count()) > 0 ||
        already.test(body);
      if (!okFirst) throw new Error('前置：首次加入分析集合未出现成功或已在集合提示');
      globalThis.__func04030 = { card, orgName };
  - note: 1.再次点击「加入分析集合」
    assert: |-
      const snap = globalThis.__func04030;
      const joinBtn = snap.card.getByRole('button', { name: '加入分析集合' });
      await expect(joinBtn).toBeVisible({ timeout: 8000 });
      await joinBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
  - note: 1、提示该机构已在分析集合中
    assert: |-
      const orgName = globalThis.__func04030.orgName;
      const toastRe = new RegExp('「' + orgName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '」已在分析集合中');
      const msg = page.locator('.arco-message, .arco-notification').filter({ hasText: toastRe });
      if (await msg.count()) {
        await expect(msg.first()).toBeVisible({ timeout: 10000 });
      } else {
        const body = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!toastRe.test(body)) {
          throw new Error('未见重复入集合提示，期望：「' + orgName + '」已在分析集合中');
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 04030；深链 catalog_path=/service-center/search。推荐区卡先点一次造「已入集合」态，再点 info「「{机构名}」已在分析集合中」。
