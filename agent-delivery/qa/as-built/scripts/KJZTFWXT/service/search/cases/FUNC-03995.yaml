id: FUNC-03995
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03995
priority: P0
tier: B
title: 主流程-加入对比篮
entry_id: svc-search
preconditions:
  - 结果中有一行按钮为「加入对比篮」
locators: {}
steps:
  - action: goto
    target: /service-center/search
expect:
  - note: 前置：结果中有一行按钮为「加入对比篮」
    assert: |-
      const main = page.locator('main');
      const card = main
        .locator('article.svc-org-search-card')
        .filter({ has: main.getByRole('button', { name: '加入对比篮' }) })
        .first();
      await expect(card).toBeVisible({ timeout: 15000 });
      const orgName = ((await card.locator('button.svc-org-search-link').first().innerText()) || '').trim();
      if (!orgName) throw new Error('卡片机构名称为空');
      globalThis.__func03995 = { orgName };
  - note: 1.点击该行「加入对比篮」
    assert: |-
      const main = page.locator('main');
      const { orgName } = globalThis.__func03995;
      const card = main
        .locator('article.svc-org-search-card')
        .filter({ hasText: orgName })
        .filter({ has: page.getByRole('button', { name: '加入对比篮' }) })
        .first();
      const joinBtn = card.getByRole('button', { name: '加入对比篮' });
      await expect(joinBtn).toBeVisible({ timeout: 8000 });
      await joinBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
  - note: 1、该行按钮变为「已在对比篮」
    assert: |-
      const main = page.locator('main');
      const { orgName } = globalThis.__func03995;
      const card = main
        .locator('article.svc-org-search-card')
        .filter({ hasText: orgName })
        .first();
      await expect(card.getByRole('button', { name: '已在对比篮' })).toBeVisible({ timeout: 12000 });
  - note: 2、提示已将该机构加入对比篮
    assert: |-
      const { orgName } = globalThis.__func03995;
      const toastRe = new RegExp('已将[「"]' + orgName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[」"]加入对比篮');
      const msg = page.locator('.arco-message, .arco-notification').filter({ hasText: toastRe });
      await expect(msg.first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
