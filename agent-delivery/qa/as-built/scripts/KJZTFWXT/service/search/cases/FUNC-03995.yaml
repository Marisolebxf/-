id: FUNC-03995
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03995
priority: P1
tier: B
title: 主流程-加入对比篮
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?kw=深圳
  - action: wait
    assert: |-
      await expect(page.locator('main')).getByText('检索结果', { exact: false }).toBeVisible({ timeout: 60000 })
expect:
  - note: 前置：结果中有一行按钮为「加入对比篮」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('button', { name: '加入对比篮', exact: true }).first()).toBeVisible({ timeout: 15000 });
  - note: 1.点击该行「加入对比篮」
    assert: |-
      const card = page.locator('main article.svc-org-search-card').first();
      await expect(card).toBeVisible({ timeout: 15000 });
      await expect(card.getByRole('button', { name: '加入对比篮', exact: true })).toBeVisible();
      const orgName = (await card.locator('button.svc-org-search-link').first().innerText()).trim();
      globalThis.__func03995 = { orgName };
      await card.getByRole('button', { name: '加入对比篮', exact: true }).click();
      const toastLine = page.getByText(/已将「.+」加入对比篮/);
      await expect(toastLine).toBeVisible({ timeout: 5000 });
      globalThis.__func03995.toastText = (await toastLine.first().innerText()).trim();
  - note: 1、该行按钮变为「已在对比篮」
    assert: |-
      const { orgName } = globalThis.__func03995;
      const card = page
        .locator('main article.svc-org-search-card')
        .filter({ has: page.locator('button.svc-org-search-link', { hasText: orgName }) })
        .first();
      await expect(card.getByRole('button', { name: '已在对比篮', exact: true })).toBeVisible({ timeout: 10000 });
  - note: 2、提示已将该机构加入对比篮
    assert: |-
      const { orgName, toastText } = globalThis.__func03995;
      const t = String(toastText ?? '');
      if (!t.includes('加入对比篮') || !t.includes(orgName)) {
        throw new Error('提示文案不符合预期：' + t);
      }
      await expect(page.locator('main')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
