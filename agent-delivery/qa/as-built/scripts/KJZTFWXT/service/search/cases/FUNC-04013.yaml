id: FUNC-04013
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04013
priority: P0
tier: B
title: 主流程-技术力分条件（运算符）
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: evaluate
    note: 点击「技术力分（演示）」；展开运算符下拉（判定在 expect）
expect:
  - note: 1、运算符为「≥」「≤」「范围」共 3 个
    assert: |-
      const main = page.locator('main');
      const fieldLib = main.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 15000 });
      const techTag = fieldLib.locator('.arco-tag').filter({ hasText: '技术力分（演示）' }).first();
      await expect(techTag).toBeVisible({ timeout: 8000 });
      await techTag.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const condRow = main.locator('.condition-builder').filter({ hasText: '技术力分（演示）' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const opSelect = condRow.locator('.condition-builder__op');
      await expect(opSelect).toBeVisible({ timeout: 8000 });
      await opSelect.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-select-dropdown:visible, .arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      await expect(opts).toHaveCount(3);
      await expect(pop.getByText('≥', { exact: true })).toBeVisible();
      await expect(pop.getByText('≤', { exact: true })).toBeVisible();
      await expect(pop.getByText('范围', { exact: true })).toBeVisible();
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id
