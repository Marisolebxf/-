id: FUNC-04005
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04005
priority: P0
tier: B
title: 主流程-覆盖产业领域运算符（下拉选项）
entry_id: svc-search
preconditions:
  - 已添加「覆盖产业领域」
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: wait
    for: 高级筛选字段库就绪
    timeout_ms: 12000
  - action: evaluate
    note: 高级筛选添加覆盖产业领域并展开运算符下拉（判定在 expect）
expect:
  - note: 1、选项为「属于」「全部包含」共 2 个
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('高级筛选 · 字段库')).toBeVisible({ timeout: 10000 });
      const fieldTag = main.locator('.fp-tags .arco-tag').filter({ hasText: '覆盖产业领域' }).first();
      await expect(fieldTag).toBeVisible({ timeout: 8000 });
      await fieldTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const row = main
        .locator('.condition-builder')
        .filter({ has: page.locator('.condition-builder__label', { hasText: '覆盖产业领域' }) })
        .first();
      await expect(row).toBeVisible({ timeout: 8000 });
      const op = row.locator('.condition-builder__op');
      await expect(op).toBeVisible({ timeout: 8000 });
      await op.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      await expect(opts).toHaveCount(2);
      await expect(opts.filter({ hasText: '属于' })).toHaveCount(1);
      await expect(opts.filter({ hasText: '全部包含' })).toHaveCount(1);
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id
