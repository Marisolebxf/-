id: FUNC-04010
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04010
priority: P0
tier: B
title: 主流程-核心专家条件（运算符与单位）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已进入「高级筛选」
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: evaluate
    note: 点「核心专家」并展开运算符（断言在 expect）
expect:
  - note: 1、运算符为「≥」「≤」「范围」共 3 个
    assert: |-
      await page.waitForURL(/[?&]mode=advanced/, { timeout: 15000 });
      const fieldLib = page.getByRole('region', { name: /高级筛选.*字段库|服务机构高级筛选字段库/ });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      let condRow = page.locator('.condition-builder').filter({ hasText: '核心专家' }).first();
      if (!(await condRow.isVisible().catch(() => false))) {
        const expertTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: /^核心专家$/ }).first();
        await expect(expertTag).toBeVisible({ timeout: 8000 });
        await expertTag.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        condRow = page.locator('.condition-builder').filter({ hasText: '核心专家' }).first();
      }
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const opWrap = condRow.locator('.condition-builder__op');
      await expect(opWrap).toBeVisible({ timeout: 8000 });
      const opTrigger = opWrap.locator('.arco-select-view').first();
      await opTrigger.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      const count = await opts.count();
      const labels = [];
      for (let i = 0; i < count; i++) {
        labels.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      if (count !== 3) {
        throw new Error('核心专家运算符应共 3 个，实际 count=' + count + ' labels=' + JSON.stringify(labels));
      }
      for (const w of ['≥', '≤', '范围']) {
        if (!labels.some((l) => l === w || l.includes(w))) {
          throw new Error('缺少运算符「' + w + '」，实际 labels=' + JSON.stringify(labels));
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
  - note: 2、单位为「人」
    assert: |-
      const condRow = page.locator('.condition-builder').filter({ hasText: '核心专家' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const unitEl = condRow.locator('.condition-builder__unit');
      await expect(unitEl).toBeVisible({ timeout: 8000 });
      const unitText = ((await unitEl.innerText()) || '').replace(/\s+/g, '').trim();
      if (unitText !== '人') {
        throw new Error('核心专家单位应为「人」，实际 unit=' + JSON.stringify(unitText));
      }
on_fail: 截图 + 抄 X-Trace-Id
