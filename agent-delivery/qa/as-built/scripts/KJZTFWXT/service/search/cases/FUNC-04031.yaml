id: FUNC-04031
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04031
priority: P1
tier: B
title: 备选-关闭机构抽屉
entry_id: svc-search
preconditions:
  - 机构抽屉已打开
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=smart&kw=深圳
expect:
  - note: 前置：机构抽屉已打开
    assert: |-
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 45000 });
      const hitRe = page.getByText(/共 \d+ 家匹配机构/);
      await expect(hitRe).toBeVisible({ timeout: 20000 });
      const hitText = ((await hitRe.innerText()) || '').trim();
      const card = page.locator('article.svc-org-search-card').first();
      await expect(card).toBeVisible({ timeout: 15000 });
      const cardCount = await page.locator('article.svc-org-search-card').count();
      if (cardCount < 1) throw new Error('结果区未见机构卡片');
      await card.locator('button.svc-org-search-link').first().click({ timeout: 10000 });
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 20000 });
      globalThis.__func04031 = { hitText, cardCount, drawerOpened: true };
  - note: 1.点击「关闭」
    assert: |-
      if (!globalThis.__func04031?.drawerOpened) throw new Error('前置：机构抽屉未打开');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const closeBtn = drawer
        .getByRole('button', { name: '关闭', exact: true })
        .or(drawer.locator('.arco-drawer-close-btn'));
      await expect(closeBtn.first()).toBeVisible({ timeout: 8000 });
      await closeBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
  - note: 1、抽屉关闭
    assert: |-
      if (!globalThis.__func04031?.drawerOpened) throw new Error('前置：机构抽屉未打开');
      await expect(page.locator('.arco-drawer:visible')).toHaveCount(0, { timeout: 12000 });
      const orgParam = new URL(page.url()).searchParams.get('org');
      if (orgParam) throw new Error('关闭后 URL 仍带 org 参数：' + orgParam);
  - note: 2、检索结果列表仍在
    assert: |-
      const snap = globalThis.__func04031;
      if (!snap?.drawerOpened) throw new Error('前置：机构抽屉未打开');
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 8000 });
      await expect(page.getByText(snap.hitText)).toBeVisible({ timeout: 8000 });
      const n = await page.locator('article.svc-org-search-card').count();
      if (n < 1 || n !== snap.cardCount) {
        throw new Error('关闭抽屉后机构卡片数变化：before=' + snap.cardCount + ' after=' + n);
      }
on_fail: 截图 + 抄 X-Trace-Id
