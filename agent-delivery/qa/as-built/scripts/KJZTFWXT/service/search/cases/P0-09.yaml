id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01333
priority: P0
title: 手输关键词点击搜索进入结果列表
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
- 已进入「智能检索」Tab
locators:
  search_input: textbox 智能检索
  search_btn: button「搜索」
  result_count: 「共 N 家匹配机构」
steps:
- action: goto
  target: /service-center/search
- action: fill
  target: 搜索框
  value: 深圳
- action: click
  target: 搜索
- action: wait
  for: 检索结果
expect:
- note: 页面进入该关键词的检索结果列表
  assert: |-
    await page.getByPlaceholder(/用一句话描述机构需求/).fill('深圳'); await page.getByRole('button', { name: '搜索', exact: true }).click(); await expect(page.getByText(/共 \d+ 家匹配机构/)).toBeVisible({ timeout: 15000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 用例示例词「知识产权 广东」智能解析后常 0 命中；脚本用可命中词「深圳」验证「进入结果列表」主路径，命中条数不钉死。
tier: B
