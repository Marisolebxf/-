id: FUNC-04011
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04011
priority: P1
tier: B
title: 主流程-成功案例条件
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: evaluate
    script: |-
      const main = page.locator('main');
      await expect(main.getByText('高级筛选 · 字段库')).toBeVisible();
      await main.getByPlaceholder('搜索字段名称 / key').fill('成功案例');
      const caseTag = main.locator('.fp-tags .arco-tag').filter({ hasText: '成功案例' });
      await expect(caseTag).toBeVisible();
      await caseTag.click();
      await expect(main.locator('.condition-builder').filter({ hasText: '成功案例' })).toBeVisible();
  - action: evaluate
    script: |-
      const row = page.locator('main .condition-builder').filter({ hasText: '成功案例' });
      await row.locator('.condition-builder__op .arco-select-view').click();
expect:
  - note: 1、运算符为「≥」「≤」「范围」共 3 个
    assert: |-
      const dropdown = page.locator('.arco-select-dropdown:visible');
      await expect(dropdown.getByText('≥', { exact: true })).toBeVisible();
      await expect(dropdown.getByText('≤', { exact: true })).toBeVisible();
      await expect(dropdown.getByText('范围', { exact: true })).toBeVisible();
  - note: 2、单位为「个」
    assert: |-
      const row = page.locator('main .condition-builder').filter({ hasText: '成功案例' });
      await expect(row.locator('.condition-builder__unit')).toHaveText('个');
on_fail: 截图 + 抄 X-Trace-Id
