id: FUNC-04011
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04011
priority: P1
tier: B
title: 主流程-成功案例条件（运算符与单位）
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: evaluate
    note: 字段库点「成功案例」
    script: |-
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 15000 });
      const successTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '成功案例' }).first();
      await expect(successTag).toBeVisible({ timeout: 8000 });
      await successTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
  - action: evaluate
    note: 展开运算符下拉
    script: |-
      const condRow = page
        .locator('main .condition-builder')
        .filter({ hasText: '成功案例' })
        .filter({ has: page.locator('.condition-builder__unit') })
        .first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const opCombo = condRow.locator('.condition-builder__op').getByRole('combobox');
      await expect(opCombo).toBeVisible({ timeout: 8000 });
      await opCombo.click({ timeout: 8000 });
      await page.waitForTimeout(300);
expect:
  - note: 1、运算符为「≥」「≤」「范围」共 3 个
    assert: |-
      const pop = page.locator('.arco-select-dropdown:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      await expect(opts).toHaveCount(3);
      await expect(pop.getByText('≥', { exact: true })).toBeVisible();
      await expect(pop.getByText('≤', { exact: true })).toBeVisible();
      await expect(pop.getByText('范围', { exact: true })).toBeVisible();
      await page.keyboard.press('Escape').catch(() => {});
  - note: 2、单位为「个」
    assert: |-
      const condRow = page
        .locator('main .condition-builder')
        .filter({ hasText: '成功案例' })
        .filter({ has: page.locator('.condition-builder__unit') })
        .first();
      await expect(condRow.locator('.condition-builder__unit')).toHaveText('个');
on_fail: 截图 + 抄 X-Trace-Id
