id: FUNC-04004
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04004
priority: P0
tier: B
title: 主流程-覆盖产业领域取值（下拉选项）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已添加「覆盖产业领域」
locators:
  tab_adv: '.enterprise-search-mode-tabs [role=tab] → 高级筛选'
  field_lib: region「高级筛选字段库」
  field_cover: 字段库 Tag「覆盖产业领域」
  cond_row: .condition-builder（含覆盖产业领域）
  value_select: .condition-builder__value .arco-select-view
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 高级筛选添加覆盖产业领域并展开取值下拉（判定在 expect）
expect:
  - note: 1、选项共 8 个；2、名称与附录 F 一致（生物医药、电子信息、人工智能、高端装备、新能源、前沿新材料、量子信息、深地深海）
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const enterSvcSearch = async () => {
        await dismissBasket();
        await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await recover404Shell();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入服务机构查询壳 url=' + page.url());
        }
        const searchItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^服务机构查询$/ });
        if (!(await searchItem().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(searchItem().first()).toBeVisible({ timeout: 10000 });
        await searchItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/service-center\/search/, { timeout: 15000 });
      };
      await enterSvcSearch();
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      const coverTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '覆盖产业领域' }).first();
      await expect(coverTag).toBeVisible({ timeout: 8000 });
      await coverTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const condRow = page.locator('.condition-builder').filter({ hasText: '覆盖产业领域' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const valueView = condRow.locator('.condition-builder__value .arco-select-view').first();
      await expect(valueView).toBeVisible({ timeout: 8000 });
      await valueView.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const count = await options.count();
      const got = [];
      for (let i = 0; i < count; i++) {
        got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim().split('\n')[0].trim());
      }
      const want = ['生物医药', '电子信息', '人工智能', '高端装备', '新能源', '前沿新材料', '量子信息', '深地深海'];
      if (count !== 8) {
        throw new Error('覆盖产业领域下拉选项应为 8 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error(
            '覆盖产业领域下拉选项顺序/文案不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got),
          );
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 04004；附录 F 八项顺序机检。高级筛选点字段库「覆盖产业领域」→ 条件行展开 `.condition-builder__value` 下拉验 8 项。
  edu 深链 SPA404 时侧栏经 sibling /industry-center/search 进入（同 FUNC-03998）。登录与关内部评审由 runner 会话前置。
