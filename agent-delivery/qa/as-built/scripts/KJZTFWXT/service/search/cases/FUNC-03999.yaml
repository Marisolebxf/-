id: FUNC-03999
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03999
priority: P0
tier: B
title: 主流程-所在城市运算符（下拉选项）
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: wait
    for: 高级筛选字段库就绪
    timeout_ms: 12000
  - action: evaluate
    note: 前置添加所在城市并展开运算符下拉
expect:
  - note: 1、选项只有「属于」共 1 个
    assert: |-
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      let condRow = page.locator('.condition-builder').filter({ hasText: '所在城市' }).last();
      if (!(await condRow.isVisible().catch(() => false))) {
        const cityTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '所在城市' }).first();
        await cityTag.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        condRow = page.locator('.condition-builder').filter({ hasText: '所在城市' }).last();
      }
      await expect(condRow).toBeVisible({ timeout: 8000 });
      await condRow.scrollIntoViewIfNeeded();
      const op = condRow.locator('.condition-builder__op');
      await expect(op).toBeVisible({ timeout: 8000 });
      const opView = op.locator('.arco-select-view');
      await opView.click({ timeout: 8000 }).catch(async () => {
        await op.click({ timeout: 8000 });
      });
      await page.waitForTimeout(300);
      let pop = page.locator('.arco-trigger-popup:visible').last();
      if (!(await pop.isVisible().catch(() => false))) {
        await opView.focus();
        await page.keyboard.press('ArrowDown');
        await page.waitForTimeout(200);
        pop = page.locator('.arco-trigger-popup:visible').last();
      }
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      await expect(opts).toHaveCount(1, { timeout: 5000 });
      await expect(opts.first()).toContainText('属于');
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id
