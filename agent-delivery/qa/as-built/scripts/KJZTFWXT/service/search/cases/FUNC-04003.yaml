id: FUNC-04003
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04003
priority: P0
tier: B
title: 主流程-服务链环节运算符（下拉选项）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已添加「服务链环节」
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: evaluate
    note: 字段库添加服务链环节并展开运算符下拉（判定在 expect）
expect:
  - note: 1、选项只有「属于」共 1 个
    assert: |-
      const main = page.locator('main');
      const fieldLib = main.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 15000 });
      const chainTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '服务链环节' }).first();
      await expect(chainTag).toBeVisible({ timeout: 8000 });
      await chainTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const condRow = main.locator('.condition-builder').filter({ hasText: '服务链环节' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const opWrap = condRow.locator('.condition-builder__op');
      await expect(opWrap).toBeVisible({ timeout: 8000 });
      const selectView = opWrap.locator('.arco-select-view, .arco-select-view-single').first();
      const hasSelect = await selectView.isVisible().catch(() => false);
      if (hasSelect) {
        await selectView.click({ timeout: 8000 });
        await page.waitForTimeout(300);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opts = pop.locator('.arco-select-option');
        await expect(opts).toHaveCount(1);
        await expect(opts.first()).toContainText('属于');
        await page.keyboard.press('Escape').catch(() => {});
      } else {
        await opWrap.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(300);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        const popVisible = await pop.isVisible().catch(() => false);
        if (popVisible) {
          const opts = pop.locator('.arco-select-option');
          await expect(opts).toHaveCount(1);
          await expect(opts.first()).toContainText('属于');
          await page.keyboard.press('Escape').catch(() => {});
        } else {
          const opText = ((await opWrap.innerText()) || '').replace(/\s+/g, ' ').trim();
          if (!opText.includes('属于')) {
            throw new Error('运算符区应显示「属于」，实际=' + opText);
          }
          for (const bad of ['不包含', '等于', '不等于', '包含', '不属于']) {
            if (opText.includes(bad)) {
              throw new Error('服务链环节运算符应仅有「属于」，实际=' + opText);
            }
          }
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
