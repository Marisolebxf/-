id: P1-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01346
priority: P1
title: 高级筛选无字段值时应用禁用
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
- 高级筛选 Tab；未选任何字段值
locators:
  apply_btn: button「应用筛选（0）」
steps:
- action: goto
  target: /service-center/search?mode=advanced
- action: evaluate
  note: 读应用按钮禁用态与解释
expect:
- note: 「应用」按钮呈禁用态
  assert: |-
    await page.getByRole('tab', { name: '高级筛选' }).click(); await page.waitForTimeout(500); const btn = page.getByRole('button', { name: /应用筛选（0）|应用筛选/ }).first(); await expect(btn).toBeVisible({ timeout: 8000 }); const disabled = await btn.isDisabled(); const cls = await btn.getAttribute('class'); if (!disabled && !(cls || '').includes('disabled')) throw new Error('应用筛选未禁用')
- note: 禁用解释文案呈现
  manual: true
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘按钮文案「应用筛选（0）」且 disabled；解释文案具体表述未深勘，标 manual。
tier: B
