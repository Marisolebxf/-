id: FUNC-04024
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04024
priority: P1
tier: B
title: 备选-清空最近检索-记录消失且结果仍在
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 智能检索 Tab 下最近检索中已有词
  - 当前停在检索结果页
locators:
  search_input: textbox placeholder「用一句话描述机构需求，如「深圳 检验检测」」
  search_btn: button「搜索」
  recent_row: .enterprise-search-history-row（含「最近检索」）
  recent_tag: .enterprise-search-history-tag
  clear_recent: button.enterprise-search-history-action「清空」（最近检索行）
  result_heading: heading「检索结果」
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 侧栏进服务机构查询 → 智能检索搜「深圳」→ 点最近检索「清空」；空态与结果仍在见 expect
expect:
  - note: 前置：智能检索 Tab、已有最近词且停在检索结果
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2500);
        }
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const assertNot404 = async (label) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: ' + label + ' url=' + page.url());
        }
      };
      const enterSvcSearch = async () => {
        await dismissBasket();
        await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
          await recover404Shell();
        }
        const searchItem = () =>
          page.locator('.arco-menu-item, .layout-menu-item').filter({ hasText: /^服务机构查询$/ });
        if (!(await bodyIs404()) && (await searchItem().first().isVisible().catch(() => false))) {
          if (!(await searchItem().first().isVisible().catch(() => false))) {
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(500);
            }
          }
          await searchItem().first().click({ timeout: 10000 });
          await page.waitForURL(/\/service-center\/search/, { timeout: 20000 });
          await assertNot404('侧栏进入服务机构查询');
        } else {
          await page.goto(spaUrl('/service-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await assertNot404('深链 catalog_path /service-center/search');
        }
      };
      await enterSvcSearch();
      const smartTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^智能检索$/ }).first();
      await expect(smartTab).toBeVisible({ timeout: 10000 });
      const inp = page.getByPlaceholder(/用一句话描述机构需求/);
      await expect(inp).toBeVisible({ timeout: 8000 });
      await inp.fill('深圳');
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(1200);
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 15000 });
      const row = page.locator('.enterprise-search-history-row').filter({ hasText: '最近检索' }).first();
      await expect(row).toBeVisible({ timeout: 8000 });
      const szTag = row.locator('.enterprise-search-history-tag').filter({ hasText: /^深圳$/ }).first();
      await expect(szTag).toBeVisible({ timeout: 8000 });
      globalThis.__func04024_ready = true;
  - note: 1、点击「清空」后最近检索变为「暂无「智能检索」最近记录」（无确认框）
    assert: |-
      if (!globalThis.__func04024_ready) throw new Error('前置：检索结果与最近词未就绪');
      const row = page.locator('.enterprise-search-history-row').filter({ hasText: '最近检索' }).first();
      const clearBtn = row.locator('button.enterprise-search-history-action').filter({ hasText: /^清空$/ }).first();
      if ((await clearBtn.count()) === 0) {
        await row.getByRole('button', { name: '清空' }).first().click({ timeout: 8000 });
      } else {
        await clearBtn.click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      const confirmModal = page.locator('.arco-modal:visible').filter({ hasText: /确认|确定清空/ });
      if (await confirmModal.count()) {
        throw new Error('点击最近检索清空后出现确认框，与用例「无确认框」不符');
      }
      await expect(page.getByText('暂无「智能检索」最近记录', { exact: true })).toBeVisible({ timeout: 8000 });
      await expect(row.locator('.enterprise-search-history-tag')).toHaveCount(0);
  - note: 2、当前检索结果仍在
    assert: |-
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 8000 });
      const body = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/检索结果/.test(body)) {
        throw new Error('清空最近检索后检索结果区不可见');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 04024；catalog_path=/service-center/search，侧栏 sibling /industry-center/search。
  智能检索结果页点最近检索行「清空」，空态「暂无「智能检索」最近记录」；勿点高级筛选「清空条件」。
  chip 裸词「深圳」（对齐 04023）。侧栏不可达时回退 catalog_path 深链（同 04022）。2026-10-20 机跑 ENV-EDU-TTS-SVCZ-404-001 blocked。
