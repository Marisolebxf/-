id: FUNC-04025
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04025
priority: P1
tier: B
title: 备选-关闭条件标签-标签消失
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已用「深圳」搜出「所在城市：深圳」
locators:
  search_input: textbox placeholder「用一句话描述机构需求，如「深圳 检验检测」」
  search_btn: button「搜索」
  matched_chip: .enterprise-search-match-feedback .arco-tag（所在城市：深圳）
  chip_close: .arco-tag-close-btn
steps:
  - action: goto
    target: /service-center/search
  - action: evaluate
    note: 深链/侧栏进页 → 智能检索搜「深圳」→ 点已匹配条件 Tag 关闭；判定在 expect
expect:
  - note: 前置：智能检索「深圳」后已匹配条件含「所在城市：深圳」
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/智能检索|查机构|高级筛选/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2500);
        }
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const assertNot404 = async (label) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: ' + label + ' url=' + page.url());
        }
      };
      const enterSvcSearch = async () => {
        await dismissBasket();
        await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
          await recover404Shell();
        }
        const searchItem = () =>
          page.locator('.arco-menu-item, .layout-menu-item').filter({ hasText: /^服务机构查询$/ });
        if (!(await bodyIs404()) && (await searchItem().first().isVisible().catch(() => false))) {
          if (!(await searchItem().first().isVisible().catch(() => false))) {
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(500);
            }
          }
          await searchItem().first().click({ timeout: 10000 });
          await page.waitForURL(/\/service-center\/search/, { timeout: 20000 });
          await assertNot404('侧栏进入服务机构查询');
        } else {
          await page.goto(spaUrl('/service-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await assertNot404('深链 /service-center/search');
        }
      };
      await enterSvcSearch();
      await assertNot404('enterSvcSearch 后');
      const smartTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^智能检索$/ }).first();
      if (!(await smartTab.isVisible().catch(() => false))) {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构查询壳 SPA404 url=' + page.url());
        }
        throw new Error('未见智能检索 Tab，url=' + page.url());
      }
      const inp = page.getByPlaceholder(/用一句话描述机构需求/);
      await expect(inp).toBeVisible({ timeout: 8000 });
      await inp.fill('深圳');
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(1200);
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 15000 });
      const feedback = page.locator('.enterprise-search-match-feedback');
      await expect(feedback).toBeVisible({ timeout: 8000 });
      const cityTag = feedback.locator('.arco-tag').filter({ hasText: /所在城市：深圳/ }).first();
      await expect(cityTag).toBeVisible({ timeout: 8000 });
      globalThis.__func04025_cityTag = cityTag;
  - note: 1、点击该条件标签关闭后「所在城市：深圳」不再显示
    assert: |-
      const cityTag = globalThis.__func04025_cityTag;
      if (!cityTag) throw new Error('前置：所在城市 Tag 未就绪');
      const closeBtn = cityTag.locator('.arco-tag-close-btn, [aria-label="Close"]').first();
      await expect(closeBtn).toBeVisible({ timeout: 8000 });
      await closeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const feedback = page.locator('.enterprise-search-match-feedback');
      const chipText = feedback.locator('.arco-tag').filter({ hasText: /所在城市：深圳/ });
      if ((await chipText.count()) > 0) {
        throw new Error('关闭后仍可见「所在城市：深圳」条件 Tag');
      }
      const stray = page.locator('.enterprise-search-match-feedback').getByText(/所在城市：深圳/);
      await expect(stray).toHaveCount(0);
  - note: 2、出现按多字段关键词检索的提示
    assert: |-
      const feedback = page.locator('.enterprise-search-match-feedback');
      await expect(feedback).toBeVisible({ timeout: 8000 });
      const hint = feedback.getByText(/已按多字段关键词/);
      await expect(hint).toBeVisible({ timeout: 8000 });
      const body = ((await feedback.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/深圳/.test(body)) {
        throw new Error('多字段关键词提示应仍含检索词「深圳」，实际=' + body.slice(0, 120));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 04025；catalog_path=/service-center/search，侧栏 sibling /industry-center/search。
  智能检索搜「深圳」得 closable Tag「所在城市：深圳」；点 .arco-tag-close-btn 后 chips 空→SearchHub 展示
  「未命中预设字段，已按多字段关键词「深圳」检索」（对齐 lumen-ui-topic SearchHub.vue）。
  勿点高级筛选「清空条件」。登录与关评审由 runner 前置。
