id: FUNC-04028
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04028
priority: P1
tier: B
title: 备选-改用高级筛选-切到字段库
entry_id: svc-search
preconditions:
  - 当前为「暂无匹配的服务机构」
locators: {}
steps:
  - action: goto
    target: /service-center/search
expect:
  - note: 前置：智能检索得到「暂无匹配的服务机构」并点击「改用高级筛选」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('tab', { name: '智能检索' })).toBeVisible({ timeout: 15000 });
      const inp = main.getByPlaceholder(/用一句话描述机构需求/);
      await expect(inp).toBeVisible({ timeout: 10000 });
      await inp.fill('__gkx_qa_FUNC04028_empty_probe__');
      await main.getByRole('button', { name: '搜索', exact: true }).click();
      await expect(main.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 15000 });
      await expect(main.getByText('暂无匹配的服务机构', { exact: true })).toBeVisible({ timeout: 15000 });
      const switchAdv = main.locator('[data-search-state="empty"]').getByRole('button', { name: '改用高级筛选' });
      await expect(switchAdv).toBeVisible({ timeout: 8000 });
      await switchAdv.click({ timeout: 8000 });
      await page.waitForTimeout(500);
  - note: 1、「高级筛选」为选中
    assert: |-
      const main = page.locator('main');
      const advTab = main.getByRole('tab', { name: '高级筛选' });
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await expect(advTab).toHaveAttribute('aria-selected', 'true');
      await expect(page).toHaveURL(/[?&]mode=advanced/, { timeout: 8000 });
  - note: 2、出现「高级筛选 · 字段库」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '高级筛选 · 字段库' })).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
