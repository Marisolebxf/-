id: FUNC-04001
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04001
priority: P0
tier: B
title: 主流程-机构类型运算符（下拉选项）
entry_id: svc-search
preconditions:
  - 已添加「机构类型」
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: wait
    for: 高级筛选字段库就绪
    timeout_ms: 12000
  - action: evaluate
    note: 字段库添加机构类型并展开运算符下拉（判定在 expect）
expect:
  - note: 1、选项只有「属于」共 1 个
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('高级筛选 · 字段库')).toBeVisible({ timeout: 10000 });
      const typeTag = main.locator('.fp-tags .arco-tag').filter({ hasText: '机构类型' }).first();
      await expect(typeTag).toBeVisible({ timeout: 8000 });
      await typeTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const row = main
        .locator('.condition-builder')
        .filter({ has: page.locator('.condition-builder__label', { hasText: '机构类型' }) })
        .first();
      await expect(row).toBeVisible({ timeout: 8000 });
      const op = row.locator('.condition-builder__op');
      await expect(op).toBeVisible({ timeout: 8000 });
      await op.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      await expect(opts).toHaveCount(1);
      await expect(opts.first()).toContainText('属于');
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id
