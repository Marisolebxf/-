id: FUNC-04029
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04029
priority: P1
tier: B
title: 备选-已在对比篮再点
entry_id: svc-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-center/search?kw=深圳
  - action: wait
    target: "800"
expect:
  - note: 前置：某行按钮已是「已在对比篮」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('检索结果')).toBeVisible({ timeout: 15000 });
      const joinBtn = main.getByRole('button', { name: '加入对比篮' }).first();
      if (await joinBtn.isVisible()) {
        await joinBtn.click();
      }
      await expect(main.getByRole('button', { name: '已在对比篮' }).first()).toBeVisible({ timeout: 10000 });
  - note: 1.再次点击「已在对比篮」
    assert: |-
      const main = page.locator('main');
      await main.getByRole('button', { name: '已在对比篮' }).first().click();
  - note: 1、提示该机构已在对比篮中
    assert: |-
      await expect(page.locator('.arco-message').filter({ hasText: '已在对比篮中' })).toBeVisible({ timeout: 10000 });
  - note: 2、按钮仍为「已在对比篮」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('button', { name: '已在对比篮' }).first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
