id: FUNC-04029
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04029
priority: P1
tier: B
title: 备选-已在对比篮再点（重复提示）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 某行按钮已是「已在对比篮」
locators:
  joined_btn: button「已在对比篮」
  join_btn: button「加入对比篮」
  org_card: article.svc-org-search-card
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 检索出卡并置为「已在对比篮」态（判定在 expect）
expect:
  - note: 前置：进入检索结果，某行按钮为「已在对比篮」
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2500);
        }
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const assertNot404 = async (label) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: ' + label + ' url=' + page.url());
        }
      };
      const enterSvcSearch = async () => {
        await dismissBasket();
        await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
          await recover404Shell();
        }
        const searchItem = () =>
          page.locator('.arco-menu-item, .layout-menu-item').filter({ hasText: /^服务机构查询$/ });
        if (!(await bodyIs404()) && (await searchItem().first().isVisible().catch(() => false))) {
          if (!(await searchItem().first().isVisible().catch(() => false))) {
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(500);
            }
          }
          await searchItem().first().click({ timeout: 10000 });
          await page.waitForURL(/\/service-center\/search/, { timeout: 20000 });
          await assertNot404('侧栏进入服务机构查询');
        } else {
          await page.goto(spaUrl('/service-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await assertNot404('深链 catalog_path /service-center/search');
        }
      };
      await enterSvcSearch();
      const inp = page.getByPlaceholder(/用一句话描述机构需求/);
      await expect(inp).toBeVisible({ timeout: 8000 });
      await inp.fill('深圳');
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(1200);
      await expect(page.getByRole('heading', { name: '检索结果', exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/共 \d+ 家匹配机构/)).toBeVisible({ timeout: 15000 });
      let card = page
        .locator('article.svc-org-search-card')
        .filter({ has: page.getByRole('button', { name: '已在对比篮' }) })
        .first();
      if (!(await card.count()) || !(await card.isVisible().catch(() => false))) {
        card = page
          .locator('article.svc-org-search-card')
          .filter({ has: page.getByRole('button', { name: '加入对比篮' }) })
          .first();
        await expect(card).toBeVisible({ timeout: 10000 });
        const joinBtn = card.getByRole('button', { name: '加入对比篮' });
        await joinBtn.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await expect(card.getByRole('button', { name: '已在对比篮' })).toBeVisible({ timeout: 12000 });
      } else {
        await expect(card).toBeVisible({ timeout: 10000 });
      }
      const nameBtn = card.locator('button.svc-org-search-link').first();
      const orgName = ((await nameBtn.innerText()) || '').trim();
      if (!orgName) throw new Error('卡片机构名称为空');
      globalThis.__func04029 = { card, orgName };
  - note: 1.再次点击「已在对比篮」
    assert: |-
      const snap = globalThis.__func04029;
      const joined = snap.card.getByRole('button', { name: '已在对比篮' });
      await expect(joined).toBeVisible({ timeout: 8000 });
      await joined.click({ timeout: 8000 });
      await page.waitForTimeout(800);
  - note: 1、提示该机构已在对比篮中
    assert: |-
      const orgName = globalThis.__func04029.orgName;
      const toastRe = new RegExp('「' + orgName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '」已在对比篮中');
      const msg = page.locator('.arco-message, .arco-notification').filter({ hasText: toastRe });
      if (await msg.count()) {
        await expect(msg.first()).toBeVisible({ timeout: 8000 });
      } else {
        const body = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!toastRe.test(body)) {
          throw new Error('未见重复入篮提示，期望：「' + orgName + '」已在对比篮中');
        }
      }
  - note: 2、按钮仍为「已在对比篮」
    assert: |-
      const card = globalThis.__func04029.card;
      const joined = card.getByRole('button', { name: '已在对比篮' });
      await expect(joined).toBeVisible({ timeout: 8000 });
      const joinBtn = card.getByRole('button', { name: '加入对比篮' });
      if (await joinBtn.count()) {
        const vis = await joinBtn.isVisible().catch(() => false);
        if (vis) throw new Error('再点后该行不应回到「加入对比篮」');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 04029；catalog_path=/service-center/search。前置无「已在对比篮」行时先点一次「加入对比篮」造态（同页 03995）。
  再点 info 提示「「{机构名}」已在对比篮中」；按钮保持「已在对比篮」。移出仅在对比篮面板，本册不覆盖。
