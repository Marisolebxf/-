id: FUNC-04008
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04008
priority: P0
tier: B
title: 主流程-机构名称运算符（下拉选项）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已进入「高级筛选」
locators:
  tab_adv: '.enterprise-search-mode-tabs [role=tab] → 高级筛选'
  field_lib: region「高级筛选字段库」
  field_org_name: 字段库 Tag「机构名称」
  cond_row: .condition-builder（含机构名称）
  cond_op: .condition-builder__op
steps:
  - action: evaluate
    note: 侧栏进服务机构查询 → 高级筛选点「机构名称」并展开运算符下拉（判定在 expect）
expect:
  - note: 1、运算符只有「包含」共 1 个
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2500);
        }
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const ensureAppShell = async () => {
        await dismissBasket();
        await recover404Shell();
        const menuRoot = page.locator('.arco-menu, .layout-menu, nav').first();
        const hasMenu = await menuRoot.isVisible().catch(() => false);
        if (!hasMenu || (await bodyIs404())) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
          await recover404Shell();
        }
      };
      const searchItem = () =>
        page.locator('.arco-menu-item, .layout-menu-item').filter({ hasText: /^服务机构查询$/ });
      const enterSvcSearch = async () => {
        await ensureAppShell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 登录后仍 SPA404 无侧栏壳 url=' + page.url());
        }
        if (!(await searchItem().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(500);
          }
        }
        await expect(searchItem().first()).toBeVisible({ timeout: 15000 });
        await searchItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/service-center\/search/, { timeout: 20000 });
        await recover404Shell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 侧栏点击后 /service-center/search SPA404 url=' + page.url());
        }
      };
      await enterSvcSearch();
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      const nameTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '机构名称' }).first();
      await expect(nameTag).toBeVisible({ timeout: 8000 });
      await nameTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const condRow = page.locator('.condition-builder').filter({ hasText: '机构名称' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const opSelect = condRow.locator('.condition-builder__op');
      await expect(opSelect).toBeVisible({ timeout: 8000 });
      await opSelect.locator('.arco-select-view').click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      const count = await opts.count();
      const labels = [];
      for (let i = 0; i < count; i++) {
        labels.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      if (count !== 1) {
        throw new Error('机构名称运算符应只有 1 个选项「包含」，实际 count=' + count + ' labels=' + JSON.stringify(labels));
      }
      const only = labels[0] || '';
      if (only !== '包含' && !only.includes('包含')) {
        throw new Error('运算符唯一选项应为「包含」，实际=' + only);
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  B 档 04008；catalog_path=/service-center/search。前置=高级筛选 Tab（用例「已进入高级筛选」）；步骤点字段库「机构名称」Tag 再展开运算符。
  运算符=.condition-builder__op Arco Select；展开后 .arco-select-option 应仅「包含」共 1 项（对齐 AC-US-SVC-ORG-07-01）。
  进页=ensureAppShell（根路径+侧栏 menu_leaf）；edu 全站 SPA404 时抛 ENV-EDU-TTS-SVCZ-404-001（同 04003）。登录与关内部评审由 runner 会话前置。
