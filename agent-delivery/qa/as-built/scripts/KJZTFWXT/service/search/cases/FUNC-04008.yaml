id: FUNC-04008
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04008
priority: P0
tier: B
title: 主流程-机构名称运算符（下拉选项）
entry_id: svc-search
preconditions:
  - 已进入「高级筛选」
locators: {}
steps:
  - action: goto
    target: /service-center/search?mode=advanced
  - action: evaluate
    note: 点击「机构名称」；展开运算符下拉
expect:
  - note: 1、运算符只有「包含」共 1 个
    assert: |-
      const main = page.locator('main').first();
      const fieldLib = main.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 15000 });
      const nameTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '机构名称' }).first();
      await expect(nameTag).toBeVisible({ timeout: 8000 });
      await nameTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const condRow = main.locator('.condition-builder').filter({ hasText: '机构名称' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const op = condRow.locator('.condition-builder__op');
      await expect(op).toBeVisible({ timeout: 8000 });
      await expect(op).toContainText('包含');
      const selectView = op.locator('.arco-select-view');
      let opened = false;
      if (await selectView.count()) {
        const vis = await selectView.first().isVisible().catch(() => false);
        if (vis) {
          await selectView.first().click({ timeout: 8000 });
          opened = true;
        }
      }
      if (!opened) {
        await op.click({ timeout: 8000 }).catch(() => {});
      }
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      const popVisible = await pop.isVisible().catch(() => false);
      if (popVisible) {
        const opts = pop.locator('.arco-select-option');
        const count = await opts.count();
        const labels = [];
        for (let i = 0; i < count; i++) {
          labels.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
        }
        if (count !== 1) {
          throw new Error('机构名称运算符应只有 1 个选项「包含」，实际 count=' + count + ' labels=' + JSON.stringify(labels));
        }
        const only = labels[0] || '';
        if (only !== '包含' && !only.includes('包含')) {
          throw new Error('运算符唯一选项应为「包含」，实际=' + only);
        }
        await page.keyboard.press('Escape').catch(() => {});
      } else {
        const t = ((await op.innerText()) || '').replace(/\s+/g, ' ').trim();
        if (t !== '包含' && !t.includes('包含')) {
          throw new Error('单运算符展示应为「包含」，实际=' + t);
        }
        if (/等于|不包含|开头|结尾/.test(t)) {
          throw new Error('机构名称运算符出现多余选项文案=' + t);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
