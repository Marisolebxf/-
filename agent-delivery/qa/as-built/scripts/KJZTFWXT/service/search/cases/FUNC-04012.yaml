id: FUNC-04012
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04012
priority: P0
tier: B
title: 主流程-标准制定条件（运算符与单位）
story: US-SVC-ORG-07
entry_id: svc-search
preconditions:
  - 已进入「高级筛选」
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进入服务机构查询、高级筛选、点标准制定并展开运算符
expect:
  - note: 1、运算符为「≥」「≤」「范围」共 3 个
    assert: |-
      const searchItem = page.locator('.arco-menu-item').filter({ hasText: /^服务机构查询$/ }).first();
      if (!(await searchItem.isVisible().catch(() => false))) {
        await page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
      }
      await searchItem.click({ timeout: 10000 });
      await page.waitForURL(/\/service-center\/search/, { timeout: 15000 });
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '标准制定' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const condRow = page.locator('main .condition-builder').filter({ hasText: '标准制定' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const opWrap = condRow.locator('.condition-builder__op');
      const opView = opWrap.locator('.arco-select-view-single, .arco-select-view').first();
      await opView.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      const count = await opts.count();
      const labels = [];
      for (let i = 0; i < count; i++) {
        labels.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      const want = ['≥', '≤', '范围'];
      if (count !== 3) {
        throw new Error('标准制定运算符应共 3 个选项，实际 count=' + count + ' labels=' + JSON.stringify(labels));
      }
      for (const w of want) {
        if (!labels.some((l) => l === w || l.includes(w))) {
          throw new Error('缺少运算符「' + w + '」，实际 labels=' + JSON.stringify(labels));
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
  - note: 2、单位为「项」
    assert: |-
      const condRow = page.locator('main .condition-builder').filter({ hasText: '标准制定' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const unitEl = condRow.locator('.condition-builder__unit');
      await expect(unitEl).toBeVisible({ timeout: 8000 });
      await expect(unitEl).toHaveText(/项/);
on_fail: 截图 + 抄 X-Trace-Id
