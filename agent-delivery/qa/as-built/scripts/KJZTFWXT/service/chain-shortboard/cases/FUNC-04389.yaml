id: FUNC-04389
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04389
priority: P0
tier: B
title: 主流程-结果摘要 · 产业与发起一致
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、产业领域回显「新一代信息技术」
    assert: |-
      const ctx = page.locator('[data-testid="svc-eco-analysis-context"]');
      await expect(ctx).toBeVisible({ timeout: 12000 });
      const ctxText = (await ctx.innerText().catch(() => '')).replace(/\s+/g, ' ');
      if (!ctxText.includes('新一代信息技术')) {
        const cascader = ctx.locator('.arco-cascader-view').first();
        await cascader.click({ timeout: 8000 });
        const popup = page.locator('.arco-trigger-popup:visible').first();
        await expect(popup).toBeVisible({ timeout: 8000 });
        await popup.getByText('新一代信息技术', { exact: true }).first().click({ timeout: 8000 });
        await page.keyboard.press('Escape').catch(() => {});
      }
      await expect(ctx).toContainText('新一代信息技术', { timeout: 8000 });
      await page.getByRole('button', { name: '开始分析', exact: true }).click({ timeout: 15000 });
      const viewResult = page.getByRole('button', { name: '查看结果', exact: true });
      await expect(viewResult).toBeEnabled({ timeout: 90000 });
      await viewResult.click({ timeout: 15000 });
      const bar = page.locator('[data-testid="svc-eco-chain-result-bar"]');
      await expect(bar).toBeVisible({ timeout: 15000 });
      await expect(bar.locator('.arco-cascader-view').first()).toContainText('新一代信息技术', { timeout: 8000 });
  - note: 2、链路标题为「新一代信息技术 · 全周期服务链路」
    assert: |-
      const title = '新一代信息技术 · 全周期服务链路';
      const board = page.locator('[data-testid="svc-eco-shortboard-board"]');
      await expect(board).toBeVisible({ timeout: 15000 });
      const heading = board.locator('h3, .ent-section-panel__title').filter({ hasText: title }).first();
      if (await heading.count()) {
        await expect(heading).toBeVisible({ timeout: 12000 });
      } else {
        await expect(board.getByText(title, { exact: true }).first()).toBeVisible({ timeout: 12000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
