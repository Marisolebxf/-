id: P0-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00694
priority: P0
tier: B
title: 识别面板判定行构成与依据（结果态 · 有据验行构成与数值一致 / 无据验规则声明+诚实空不造行 + 瓶颈指标红问号）
story: US-SVC-ECO-02
entry_id: svc-chain-shortboard
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G5 分析记录已完成可「查看结果」）
  - 评审模式开（现场默认态；红问号角标经评审层挂载，关闭后零泄漏归 00701 验）
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
  problems_panel: data-testid=svc-eco-shortboard-problems（识别面板判定行容器）
  problem_row: .svc-eco-problem-row（判定行 = 标签 + 环节名 + 判定依据）
  basis: 判定行 span.svc-eco-note「判定依据：…」
  station: data-stage-id / .svc-eco-metro-station（站卡统计「机构 N 家 / 平均深度 D」）
  btm_metric_badge: 瓶颈堵点识别标题旁 metric-spec-card.is-missing（红问号，外层 data-review-metric=GAP-SVC-CHAIN-BOTTLENECK）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 切「分析记录」点「查看结果」进入结果态，「瓶颈堵点识别」面板区承载可见
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const rec=page.getByRole('tab', { name: '分析记录', exact: true }); await expect(rec).toBeVisible({ timeout: 8000 }); await rec.click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1000); const viewBtn=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await viewBtn.count())) throw new Error('无可用查看结果按钮'); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); let url=page.url(); if (/view=processing/.test(url) && /查看结果/.test(await page.locator('main').first().innerText().catch(()=>''))) { const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await vr.count()) { await vr.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url() } }; if (!/view=result/.test(url)) throw new Error('未进入结果态: '+url); await expect(page.locator('h3.ent-section-panel__title').filter({ hasText: '瓶颈堵点识别' }).first()).toBeVisible({ timeout: 8000 })
  - note: 预期1 每条判定含环节名、问题类型与判定依据——有据：problems 面板每行构成齐（问题类型标签色级 + 环节名 + 「判定依据：」+数值引用）；无据：识别区诚实空「该产业服务供给数据不足，暂无法判定」且无判定行容器
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||''); const stations=await page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(()=>0); const panel=page.locator('[data-testid="svc-eco-shortboard-problems"]'); const nPanel=await panel.count().catch(()=>0); if (nPanel>0) { const rows=panel.locator('.svc-eco-problem-row'); const rc=await rows.count(); if (rc<1) throw new Error('problems 面板无判定行'); for (let i=0;i<rc;i++) { const row=rows.nth(i); const rowTxt=(await row.innerText().catch(()=>''))||''; if (!/服务空白|薄弱环节|资源瓶颈/.test(rowTxt)) throw new Error('第'+(i+1)+'行缺问题类型标签: '+rowTxt.slice(0,160)); if (!/环节/.test(rowTxt)) throw new Error('第'+(i+1)+'行缺环节名承载: '+rowTxt.slice(0,160)); if (!/判定依据/.test(rowTxt)) throw new Error('第'+(i+1)+'行缺判定依据: '+rowTxt.slice(0,160)); if (!/机构数|平均服务深度|机构\s*\d+/.test(rowTxt)) throw new Error('第'+(i+1)+'行判定依据未引用数值: '+rowTxt.slice(0,160)) } } else if (stations>0) { if (!/未发现明显短板/.test(body)) throw new Error('有环节行无命中应显 no-hit 诚实态: '+body.slice(0,240)) } else { if (!/该产业服务供给数据不足，暂无法判定/.test(body)) throw new Error('无环节行识别区应诚实空: '+body.slice(0,240)) }
  - note: 预期2 判定依据引用数值与链路图当前数据一致——有据：判定行依据内「机构数 N」「平均深度 D」与同名环节站卡统计「机构 N 家」「平均深度 D」逐一相等；无据：无判定行即无依据可对，识别区不出伪数值（只认声明行「依据行引用当前结果数值」）
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||''); const stations=await page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(()=>0); const panel=page.locator('[data-testid="svc-eco-shortboard-problems"]'); const nPanel=await panel.count().catch(()=>0); if (nPanel>0) { const rows=panel.locator('.svc-eco-problem-row'); const rc=await rows.count(); if (rc<1) throw new Error('problems 面板无判定行'); const stCards=page.locator('[data-stage-id], .svc-eco-metro-station'); const nSt=await stCards.count(); if (nSt<1) throw new Error('有判定行但无环节站卡可对数值'); const stMap={}; for (let j=0;j<nSt;j++) { const t=(await stCards.nth(j).innerText().catch(()=>''))||''; const nm=(t.match(/^[^\n]+/)||[''])[0].replace(/^\d+/,'').trim(); const cm=t.match(/机构\s*(\d+)\s*家/); const dm=t.match(/平均深度\s*(-?\d+(?:\.\d+)?|—)/); stMap[nm]={count:cm?cm[1]:null,depth:dm?dm[1]:null} } for (let i=0;i<rc;i++) { const rowTxt=(await rows.nth(i).innerText().catch(()=>''))||''; const nm=(rowTxt.match(/(服务空白|薄弱环节|资源瓶颈)\s*([^\n]+)/)||[])[2]; if (!nm) throw new Error('第'+(i+1)+'行未解析出环节名: '+rowTxt.slice(0,160)); const ref=stMap[nm.trim()]; if (!ref) throw new Error('第'+(i+1)+'行环节名「'+nm.trim()+'」未在链路图站卡中找到'); const bc=rowTxt.match(/机构数\s*=\s*(\d+)/)||rowTxt.match(/机构\s*(\d+)/); if (bc) { if (ref.count===null) throw new Error('站卡「'+nm.trim()+'」未见机构数统计'); if (ref.count!==bc[1]) throw new Error('第'+(i+1)+'行依据机构数 '+bc[1]+' 与站卡 '+ref.count+' 不一致') } const bd=rowTxt.match(/平均服务深度\s*=\s*(-?\d+(?:\.\d+)?)/)||rowTxt.match(/平均深度\s*(-?\d+(?:\.\d+)?)/); if (bd) { if (ref.depth===null||ref.depth==='—') throw new Error('站卡「'+nm.trim()+'」未见平均深度统计'); if (ref.depth!==bd[1]) throw new Error('第'+(i+1)+'行依据深度 '+bd[1]+' 与站卡 '+ref.depth+' 不一致') } if (!bc&&!bd) throw new Error('第'+(i+1)+'行依据未引用可对数值: '+rowTxt.slice(0,160)) } } else if (stations>0) { if (!/依据行引用当前结果数值/.test(body)) throw new Error('no-hit 态应保留依据行声明: '+body.slice(0,240)); if (/机构数\s*=\s*\d|平均深度\s*=\s*\d/.test(body)) throw new Error('无判定行不应出现伪依据数值: '+body.slice(0,240)) } else { if (!/依据行引用当前结果数值/.test(body)) throw new Error('无环节行识别区应保留依据行声明: '+body.slice(0,240)); if (/机构数\s*=\s*\d|平均深度\s*=\s*\d/.test(body)) throw new Error('无判定行不应出现伪依据数值: '+body.slice(0,240)) }
  - note: 预期3 瓶颈判定旁带红问号角标（M_SVC_CHAIN_BOTTLENECK 未登记 D1 missing 形态）——有据：problems 面板标题/瓶颈判定承载旁角标可见；无据（当前环境）：「瓶颈堵点识别」面板标题旁 metric-spec-card.is-missing 红问号（aria-label 指标未登记，外层 data-review-metric=GAP-SVC-CHAIN-BOTTLENECK）
    assert: |-
      const panelRoot=page.locator('h3.ent-section-panel__title').filter({ hasText: '瓶颈堵点识别' }).first().locator('xpath=ancestor::section[1]'); const badge=panelRoot.locator('.metric-spec-card.is-missing'); const nBadge=await badge.count().catch(()=>0); if (nBadge<1) { const anyBadge=panelRoot.locator('.metric-spec-card'); const nAny=await anyBadge.count().catch(()=>0); throw new Error('瓶颈堵点识别面板标题旁未见红问号角标: is-missing='+nBadge+' metric-spec-card='+nAny) } const lbl=String(await badge.first().getAttribute('aria-label')||''); if (!/指标未登记/.test(lbl)) throw new Error('角标非指标未登记形态: '+lbl); const wrap=badge.first().locator('xpath=ancestor::*[contains(@data-review-metric,"GAP-SVC-CHAIN-BOTTLENECK")]'); if (!(await wrap.count())) throw new Error('角标未挂 GAP-SVC-CHAIN-BOTTLENECK 治理引用')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 'env-gate overall=pass；00694 B 档双分支。D4 环境债（沿用 D4-SVCSHORT-STAGES-EMPTY 口径，无独立票）：前作实证（scout-p0-06-summary 3 条历史 + scout-p0-06-fresh-summary 新一代信息技术 fresh）结果态均无环节行（stages/gap 空）→ 无判定行可构造，用例前置 2「识别面板已呈现判定行」当前环境不可达 → 有据分支待环节行补齐自动转实；有据分支断言锚源码实证（只读引用）：SvcChainShortboardBoard.vue 判定行 .svc-eco-problem-row（a-tag PROBLEM_TAG_COLOR + 环节名按钮 aria-label=定位到…环节 + span.svc-eco-note「判定依据：{basis}」）、svcShortboardModel.ts stageBasis（演示规则 basis=「机构数 N」/「平均深度 D」逐值引用、payload 标注 basis=「机构数 N，平均深度 D」）与站卡统计「机构 {count} 家」「平均深度 {formatAvgDepth}」同源 → 依据↔站卡数值一致性按同名环节逐值比对。无据分支（当前环境实跑）：(a) 识别区诚实空「该产业服务供给数据不足，暂无法判定」且无 [data-testid=svc-eco-shortboard-problems] 判定行容器（诚实空态由 a-alert !hasStages 承载，源码 v-if=!board.hasStages）；(b) 声明行「依据行引用当前结果数值」在（演示规则声明第二句）且全页无「机构数 = N」「平均深度 = D」伪依据数值；(c) 红问号锚「瓶颈堵点识别」面板标题旁 ServiceReviewMount(SVC-ECO-02-BTLNK, refs=[GAP-SVC-CHAIN-BOTTLENECK, Q-SVCCHAIN-03]) → ReviewMetricBadges（外层 data-review-metric=GAP-SVC-CHAIN-BOTTLENECK）→ MetricSpecCard is-missing（icon-question-circle + aria-label=指标未登记：瓶颈堵点识别，getMetricMeta(GAP-*) 无 meta 恒红问号，M_SVC_CHAIN_BOTTLENECK 注册登记后同组件升 ⓘ，断言认 .metric-spec-card 类名+外层 data-review-metric 跨形态稳定；D1 文案 as-built：用例写「瓶颈判定旁」，现场角标挂面板标题承载位（判定行缺位时即面板），语义=瓶颈指标红问号一致）。e2 依据行数值比对正则覆盖源码两种 basis 形态（演示规则「机构数 = N」/ payload「机构数 N」；深度空值「—」跳比对）。演示规则为 Q-SVCCHAIN-03 临时默认（正式算法落地后补验，开放项 6）。勿因「开始分析」后停过程页误判（须点查看结果）。对比篮可见才关。列表 2 空格缩进。'
