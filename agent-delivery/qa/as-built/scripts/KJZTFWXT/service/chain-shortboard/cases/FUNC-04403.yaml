id: FUNC-04403
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04403
priority: P1
tier: B
title: 备选-未选产业仍可发起分析并进入结果页
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、过程页分析对象为「产业领域：未选择（短板跟产业走，*）」
    assert: |-
      const main = page.locator('main');
      await main.getByTestId('svc-eco-start-analysis').click();
      await expect(page.getByText('产业领域：未选择（短板跟产业走，*）')).toBeVisible({ timeout: 60000 });
  - note: 2、结果页标题为「全周期服务链路」
    assert: |-
      await page.getByRole('button', { name: '查看结果' }).click();
      await expect(page.getByText('全周期服务链路', { exact: true }).first()).toBeVisible({ timeout: 30000 });
  - note: 3、结果页提示「该产业服务供给数据不足，暂无法判定」
    assert: |-
      await expect(page.getByText('该产业服务供给数据不足，暂无法判定')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
