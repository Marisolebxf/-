id: FUNC-04390
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04390
priority: P1
tier: B
title: 主流程-全周期链路无环节行提示
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、全周期区块提示「该产业服务供给数据不足，暂无法判定」
    assert: |-
      const route = '/service/chain-analysis?workspace=chain&tab=chain';
      const closeBasket = async () => {
        for (let i = 0; i < 3; i++) {
          const close = page.locator('[aria-label="关闭对比篮"]');
          if (
            (await close.count()) &&
            (await close.first().isVisible().catch(() => false)) &&
            (await close.first().isEnabled().catch(() => false))
          ) {
            try {
              await close.first().click({ timeout: 1500 });
              await page.waitForTimeout(300);
            } catch {}
          } else break;
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const pickFlatIt = async () => {
        const sel = page.locator('main .industry-catalog-select').first();
        await expect(sel).toBeVisible({ timeout: 8000 });
        await sel.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await page
          .locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option')
          .filter({ hasText: /^新一代信息技术$/ })
          .first()
          .click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const openIndustry = async () => {
        const flat = page
          .locator('main .industry-catalog-select.arco-select-view, main .industry-catalog-select')
          .first();
        if (await flat.isVisible().catch(() => false)) {
          await flat.click({ timeout: 8000 });
          return 'flat';
        }
        const cascader = page
          .locator(
            'main .svc-portal-industry-cascader .arco-cascader-view, main .sci-arco-cascader, main .arco-cascader-view'
          )
          .first();
        if (await cascader.isVisible().catch(() => false)) {
          await cascader.click({ timeout: 8000 });
          return 'cascader';
        }
        const cfg = page.locator('main').filter({ hasText: '分析配置' }).first();
        const near = cfg.getByText(/产业领域/).first();
        if (await near.isVisible().catch(() => false)) {
          const row = near.locator('xpath=ancestor::*[contains(@class,"arco-form-item") or contains(@class,"config")][1]');
          const trigger = row.locator('.arco-select-view, .arco-cascader-view, .sci-arco-cascader').first();
          if (await trigger.isVisible().catch(() => false)) {
            await trigger.click({ timeout: 8000 });
            return 'cascader';
          }
        }
        const ph = page.getByText('选择产业集群', { exact: true }).first();
        if (await ph.isVisible().catch(() => false)) {
          await ph.click({ timeout: 8000 });
          return 'cascader';
        }
        throw new Error('未见产业领域下拉（flat/cascader/选择产业集群）');
      };
      const pickIt = async (mode) => {
        if (mode === 'flat' || (await page.locator('main .industry-catalog-select').first().isVisible().catch(() => false))) {
          await pickFlatIt();
          return;
        }
        await page.waitForTimeout(500);
        const popup = page
          .locator('.arco-trigger-popup:visible .svc-portal-industry-cascader-menu, .arco-trigger-popup:visible')
          .first();
        await expect(popup).toBeVisible({ timeout: 8000 });
        const col1 = popup.locator('.arco-cascader-panel-column, .arco-cascader-column').first();
        const row = col1
          .locator('.arco-cascader-option')
          .filter({ hasText: /^新一代信息技术/ })
          .first();
        if (await row.count()) {
          const cb = row.locator('.arco-checkbox, .arco-radio');
          if (await cb.count()) await cb.first().click({ timeout: 8000 });
          else await row.click({ timeout: 8000 });
        } else {
          const flatOpt = popup.locator('.arco-select-option').filter({ hasText: /^新一代信息技术$/ }).first();
          if (await flatOpt.count()) await flatOpt.click({ timeout: 8000 });
          else await popup.getByText(/^新一代信息技术/).first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(1000);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
        const cfgSlice = ((await page.locator('main').first().innerText().catch(() => '')) || '').split('开始分析')[0];
        if (!/新一代信息技术/.test(cfgSlice || '')) {
          throw new Error('选「新一代信息技术」后配置区未回显 url=' + page.url());
        }
      };
      const clickStart = async () => {
        const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 15000 });
      };
      const waitProcessingDone = async () => {
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 8 ? 1000 : 1500);
          const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
          if (/任务失败|分析失败/.test(body)) throw new Error('分析任务失败: ' + body.slice(0, 200));
          if (/分析结果已生成/.test(body) && (await vr.isVisible().catch(() => false))) {
            const disabled = await vr.isDisabled().catch(() => true);
            if (!disabled) return;
          }
          if (/已完成/.test(body) && (await vr.isVisible().catch(() => false))) {
            const disabled = await vr.isDisabled().catch(() => true);
            if (!disabled) return;
          }
        }
        throw new Error('过程页超时：未见可点的「查看结果」 url=' + page.url());
      };
      const openResult = async () => {
        const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
        await expect(vr).toBeEnabled({ timeout: 8000 });
        await vr.click({ timeout: 15000 });
        await page.waitForTimeout(1500);
      };
      const ensureItResult = async () => {
        const board = page.locator('[data-testid="svc-eco-shortboard-board"]');
        if (!(await board.isVisible().catch(() => false))) return false;
        const titleOk = await page.getByText('新一代信息技术 · 全周期服务链路').first().isVisible().catch(() => false);
        const noStages = await board.locator('[data-testid="svc-eco-shortboard-no-stages"]').first().isVisible().catch(() => false);
        return titleOk && noStages;
      };
      if (!page.url().includes('/service/chain-analysis')) {
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      }
      await closeBasket();
      if (!(await ensureItResult())) {
        if (/view=result/.test(page.url()) || (await page.locator('[data-testid="svc-eco-shortboard-board"]').isVisible().catch(() => false))) {
          const back = page.getByRole('button', { name: '返回配置', exact: true }).first();
          if (await back.isVisible().catch(() => false)) {
            await back.click({ timeout: 8000 });
            await page.waitForTimeout(1000);
          } else {
            await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1500);
          }
        }
        const cfgBody = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (!/分析配置|产业领域|开始分析|分析记录/.test(cfgBody) && !/view=processing/.test(page.url())) {
          throw new Error('未处于可起分析壳：' + cfgBody.slice(0, 200));
        }
        const sel = page.locator('main .industry-catalog-select').first();
        const viewVal = ((await sel.locator('.arco-select-view-value').first().innerText().catch(() => '')) ||
          (await sel.innerText().catch(() => '')) ||
          '')
          .trim();
        const cfgTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (!/^新一代信息技术/.test(viewVal) && !/新一代信息技术/.test(cfgTxt.split('开始分析')[0] || cfgTxt)) {
          const mode = await openIndustry();
          await pickIt(mode);
        }
        if (!/view=processing|view=result/.test(page.url())) {
          await clickStart();
        }
        if (!/view=result/.test(page.url())) {
          await waitProcessingDone();
          await openResult();
        }
      }
      if (!(await ensureItResult())) {
        throw new Error('未到达「新一代信息技术」无环节行结果态 url=' + page.url());
      }
      await expect(page.locator('[data-testid="svc-eco-shortboard-board"]')).toBeVisible({ timeout: 15000 });
      const chainSection = page
        .locator('section.ent-section-panel')
        .filter({ has: page.getByText('全周期服务链路', { exact: true }) })
        .first();
      await expect(chainSection).toBeVisible({ timeout: 8000 });
      const chainAlert = chainSection.locator('[data-testid="svc-eco-shortboard-no-stages"]').first();
      await expect(chainAlert).toBeVisible({ timeout: 8000 });
      await expect(chainAlert).toContainText('该产业服务供给数据不足，暂无法判定', { timeout: 8000 });
  - note: 2、说明含「当前快照没有环节行」
    assert: |-
      const chainSection = page
        .locator('section.ent-section-panel')
        .filter({ has: page.getByText('全周期服务链路', { exact: true }) })
        .first();
      const txt = ((await chainSection.innerText().catch(() => '')) || '');
      if (!/当前快照没有环节行/.test(txt)) {
        throw new Error('全周期区块说明未见「当前快照没有环节行」: ' + txt.slice(0, 320));
      }
on_fail: 截图 + 抄 X-Trace-Id
