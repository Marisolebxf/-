id: FUNC-04392
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04392
priority: P1
tier: B
title: 主流程-产业下拉 · 15 个选项
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、选项共 15 个
    assert: |-
      const ctx = page.locator('main [data-testid="svc-eco-analysis-context"]');
      await expect(ctx.getByText('产业领域')).toBeVisible({ timeout: 30000 });
      const trigger = ctx.locator('.arco-cascader-view, .arco-select-view').first();
      await expect(trigger).toBeVisible({ timeout: 15000 });
      await trigger.hover();
      const clearBtn = trigger.locator('.arco-icon-close, .arco-icon-hover').first();
      if (await clearBtn.isVisible().catch(() => false)) {
        await clearBtn.click({ timeout: 8000 });
      }
      await trigger.click({ timeout: 15000 });
      const opts = page.locator(
        '.arco-cascader-popup-visible .arco-cascader-column:first-child .arco-cascader-option, .arco-select-dropdown:visible .arco-select-option',
      );
      await expect(opts).toHaveCount(15, { timeout: 10000 });
  - note: 2、名称与附录 A 一致
    assert: |-
      const names = [
        '新一代信息技术', '生物', '新能源', '新材料', '高端装备',
        '智能网联新能源汽车', '绿色环保', '低空经济与空天', '传统与创意', '海洋',
        '未来制造', '未来信息', '未来能源', '未来空间', '未来健康',
      ];
      const opts = page.locator(
        '.arco-cascader-popup-visible .arco-cascader-column:first-child .arco-cascader-option, .arco-select-dropdown:visible .arco-select-option',
      );
      for (const n of names) {
        await expect(opts.filter({ hasText: n })).toHaveCount(1);
      }
  - note: 3、未选择时占位为「选择产业集群」
    assert: |-
      await page.keyboard.press('Escape');
      const ctx = page.locator('main [data-testid="svc-eco-analysis-context"]');
      const trigger = ctx.locator('.arco-cascader-view, .arco-select-view').first();
      await expect(trigger).toContainText('选择产业集群', { timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
