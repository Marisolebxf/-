priority: P0
tier: B
title: 补链强链指引（结果态 · 有据验指引区以识别结果为基础且引用环节数据不编造 / 无据验诚实空不输出指引；指引区未实现有据分支红即 D3 显性化）
story: US-SVC-ECO-02
entry_id: svc-chain-shortboard
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G5 分析记录已完成可「查看结果」）
  - 已完成一次有效分析且短板识别已输出结果（用例前置 2；当前环境无环节行不可达，走无据诚实分支）
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
  problems_panel: data-testid=svc-eco-shortboard-problems（识别面板判定行容器，指引输入源）
  problem_row: .svc-eco-problem-row（判定行 = 标签 + 环节名按钮 + 判定依据）
  guide_panel: h3.ent-section-panel__title 含「补链/指引」（补链强链指引区承载锚；承载形态待产品定稿，语义锚跨形态）
  station: data-stage-id / .svc-eco-metro-station（链路图站卡）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
    note: 自含重置进配置态（P8）；结果态在 expect 内经「分析记录→查看结果」进入
expect:
  - note: 切「分析记录」点「查看结果」进入结果态，「瓶颈堵点识别」面板区承载可见
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const rec=page.getByRole('tab', { name: '分析记录', exact: true }); await expect(rec).toBeVisible({ timeout: 8000 }); await rec.click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1000); const viewBtn=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await viewBtn.count())) throw new Error('无可用查看结果按钮'); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); let url=page.url(); if (/view=processing/.test(url) && /查看结果/.test(await page.locator('main').first().innerText().catch(()=>''))) { const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await vr.count()) { await vr.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url() } }; if (!/view=result/.test(url)) throw new Error('未进入结果态: '+url); await expect(page.locator('h3.ent-section-panel__title').filter({ hasText: '瓶颈堵点识别' }).first()).toBeVisible({ timeout: 8000 })
  - note: 预期1 补链强链指引以短板识别结果为呈现基础——有据（判定行已呈现）：指引区（面板标题含「补链/指引」）必须可见承载（目标态语义锚；现场指引区未实现，红即 D3-SVCSHORT-GUIDE-PANEL-MISSING 缺陷证据，承载落地后转绿）；有环节行无命中：no-hit 诚实态不输出指引；无据（当前环境）：识别区诚实空「该产业服务供给数据不足，暂无法判定」且无指引区、全页不出现「补链/强链」编造字样
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||''); const stations=await page.locator('[data-stage-id], .svc-eco-metro-station]').count().catch(()=>0); const panel=page.locator('[data-testid="svc-eco-shortboard-problems"]'); const nPanel=await panel.count().catch(()=>0); const guide=page.locator('h3.ent-section-panel__title').filter({ hasText: /补链|指引/ }); const nGuide=await guide.count().catch(()=>0); if (nPanel>0) { if (nGuide<1) throw new Error('D3-SVCSHORT-GUIDE-PANEL-MISSING: 识别已输出判定行但未见补链强链指引区承载（源码 chain 结果分支只挂全周期服务链路+瓶颈堵点识别两面板，指引承载形态待产品定稿=开放项 5；红即缺陷证据，承载落地后转绿）'); await expect(guide.first()).toBeVisible({ timeout: 8000 }) } else if (stations>0) { if (!/未发现明显短板/.test(body)) throw new Error('有环节行无命中应显 no-hit 诚实态: '+body.slice(0,240)); if (nGuide>0) throw new Error('无识别结果（no-hit）不应输出指引区') } else { if (!/该产业服务供给数据不足，暂无法判定/.test(body)) throw new Error('无环节行识别区应诚实空: '+body.slice(0,240)); if (nGuide>0) throw new Error('无识别结果不应输出指引区'); if (/补链|强链/.test(body)) throw new Error('指引承载缺位不应出现补链/强链编造字样: '+body.slice(0,240)) }
  - note: 预期2 指引内容引用识别结果与环节数据、无图外编造结论——有据：指引区文本引用 ≥1 条判定行环节名（以识别结果为输入）且含机构数/服务深度数值承载（引用环节数据，不图外编造）；有环节行无命中 / 无据（当前环境）：无指引区不输出，识别区诚实空且全页无伪指引结论
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||''); const stations=await page.locator('[data-stage-id], .svc-eco-metro-station]').count().catch(()=>0); const panel=page.locator('[data-testid="svc-eco-shortboard-problems"]'); const nPanel=await panel.count().catch(()=>0); const guide=page.locator('h3.ent-section-panel__title').filter({ hasText: /补链|指引/ }); const nGuide=await guide.count().catch(()=>0); if (nPanel>0) { if (nGuide<1) throw new Error('D3-SVCSHORT-GUIDE-PANEL-MISSING: 有判定行但无指引区，预期2无可验承载'); const guideRoot=guide.first().locator('xpath=ancestor::section[1]'); const guideTxt=((await guideRoot.innerText().catch(()=>''))||''); const rows=panel.locator('.svc-eco-problem-row'); const rc=await rows.count(); const names=[]; for (let i=0;i<rc;i++) { const t=((await rows.nth(i).innerText().catch(()=>''))||''); const nm=(t.match(/(服务空白|薄弱环节|资源瓶颈)\s*([^\n]+)/)||[])[2]; if (nm) names.push(nm.trim()) } if (!names.length) throw new Error('判定行未解析出环节名，指引引用比对无从进行'); const hit=names.some((n)=>guideTxt.includes(n)); if (!hit) throw new Error('指引区未引用任何判定行环节名（未以识别结果为输入）: '+guideTxt.slice(0,200)); if (!/机构|深度/.test(guideTxt)) throw new Error('指引区未引用环节数据（机构数/服务深度）: '+guideTxt.slice(0,200)) } else if (stations>0) { if (!/未发现明显短板/.test(body)) throw new Error('有环节行无命中应显 no-hit 诚实态: '+body.slice(0,240)); if (nGuide>0) throw new Error('无识别结果不应输出指引区'); if (/补链|强链/.test(body)) throw new Error('无识别结果不应出现补链/强链指引结论: '+body.slice(0,240)) } else { if (!/该产业服务供给数据不足，暂无法判定/.test(body)) throw new Error('无环节行识别区应诚实空: '+body.slice(0,240)); if (nGuide>0) throw new Error('无识别结果不应输出指引区'); if (/补链|强链/.test(body)) throw new Error('指引承载缺位不应出现补链/强链编造结论: '+body.slice(0,240)) }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 'env-gate overall=pass；00696 B 档双分支（同 P0-06~11 口径，实跑非 skip）。D3 产品未实现（本条开票 D3-SVCSHORT-GUIDE-PANEL-MISSING，与 Drawer 票同性不同票勿混淆）：源码实证（只读引用）ServiceChainAnalysisWorkspace.vue chain 结果分支（view=result && isChain）只挂 SvcChainShortboardBoard——仅「全周期服务链路」「瓶颈堵点识别」两 SectionPanel，全仓 src 无「补链/强链」业务承载（仅 metricSeed.ts 无关注释）；USM US-SVC-ECO-02 明确「不包含：补链措施自动生成」+ 用例备注「指引承载形态待产品定稿（开放项 5）」→ 指引区整体缺位属未实现而非形态变化；承载形态未定稿故有据分支用语义锚（h3.ent-section-panel__title 含 补链/指引，P0-10 教训锚 h3 而非 getByText 防隐藏节点误命中），识别落地后跑必红即 D3 显性化（参照 P0-11 预期2 先例），承载定稿后回炉校准锚点与引用深验。D4 环境债（沿用 D4-SVCSHORT-STAGES-EMPTY 口径，无独立票）：前作实证（scout-p0-06-summary 3 条历史 + scout-p0-06-fresh-summary 新一代信息技术 fresh）结果态均无环节行 → 无判定行 → 用例前置 2「短板识别已输出结果」当前环境不可达，有据分支待环节行补齐自动转实。无据分支（当前环境实跑）：(a) 识别区诚实空「该产业服务供给数据不足，暂无法判定」；(b) 无指引区不输出（nGuide=0）；(c) main 全页「补链/强链」零出现——指引承载缺位不编造方向性结论（源码 chain 分支正文无此二词，断言安全）。预期2 有据「无图外编造」由「引用判定行环节名 + 机构/深度数值承载」组合承担（图外环节名无法穷举机检，note 载明）。D1 文档引用偏差（仅记录不改用例）：用例册 00696「USM验收场景编号」列填 AC-US-SVC-ECO-02-04，USM 该 AC 实为定位联动（P0-11 承载），指引无对应 AC（USM 不包含措施自动生成），语义以原始需求 7.4.2「给出补链强链指引」+ 用例预期列为准。演示规则为 Q-SVCCHAIN-03 临时默认。勿因「开始分析」后停过程页误判（须点查看结果）。对比篮可见才关。列表 2 空格缩进。'
