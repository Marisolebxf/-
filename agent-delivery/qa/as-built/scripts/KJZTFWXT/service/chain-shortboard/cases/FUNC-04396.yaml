id: FUNC-04396
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04396
priority: P0
tier: B
title: 主流程-分析记录 · 列字段
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
  - action: click
    target: 分析记录
expect:
  - note: 1、表头为任务、类型、状态、创建时间、操作
    assert: |-
      await expect(page).toHaveURL(/tab=records/);
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(records).toBeVisible({ timeout: 15000 });
      await expect(records.locator('.arco-table-td').first()).toBeVisible({ timeout: 20000 });
      const main = page.locator('main');
      for (const h of ['任务', '类型', '状态', '创建时间', '操作']) {
        await expect(main.getByRole('columnheader', { name: h, exact: true })).toBeVisible({ timeout: 8000 });
      }
  - note: 2、类型列显示「shortboard」
    assert: |-
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(records.getByText('shortboard', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、状态列能见到「已完成」
    assert: |-
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(records.getByText('已完成', { exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
