id: FUNC-04412
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04412
priority: P1
tier: B
title: 失败过程页点返回配置重试回到分析记录
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 前置：点击「分析记录」→ 失败行点「查看过程」→ 点击「返回配置重试」（04411 前置 + 用例步骤 1）
    assert: |-
      const main = page.locator('main');
      await page.getByRole('tab', { name: '分析记录' }).click();
      await expect(page).toHaveURL(/tab=records/, { timeout: 15000 });
      const failedRow = main.getByRole('row').filter({ hasText: '失败' }).first();
      await expect(failedRow).toBeVisible({ timeout: 15000 });
      await failedRow.getByRole('button', { name: '查看过程' }).click();
      await expect(main.getByRole('button', { name: '返回配置重试' })).toBeVisible({ timeout: 15000 });
      await main.getByRole('button', { name: '返回配置重试' }).click();
      globalThis.__func04412 = { clickedBack: true };
  - note: 1、回到标题为「分析记录」的列表
    assert: |-
      if (!globalThis.__func04412?.clickedBack) throw new Error('前置：未点击返回配置重试');
      await expect(page).toHaveURL(/tab=records/);
      const recordsPane = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(recordsPane).toBeVisible();
      await expect(recordsPane.getByRole('heading', { name: '分析记录' })).toBeVisible();
  - note: 2、列表仍含「创建时间」列
    assert: |-
      if (!globalThis.__func04412?.clickedBack) throw new Error('前置：未点击返回配置重试');
      const recordsPane = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(recordsPane.getByRole('columnheader', { name: '创建时间' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
