priority: P1
tier: B
title: 异常-环节供给诚实空态（P1）——无在库机构环节显示诚实空态不渲染假数据；不可构造时 B 档 skip n/a（D4 无环节行），有据后跟 as-built「机构 0 家」+「服务空白」（D1 文案）
story: US-SVC-ECO-01
entry_id: svc-chain-shortboard
allow_skip: true
allow_skip_target: "[data-stage-id], .svc-eco-metro-station"
skip_reason: 不可构造含无在库机构环节的产业集群（用例前置 1 / 开放项 3）——D4 环境债 D4-SVCSHORT-STAGES-EMPTY（沿用口径无独立票）：同日 P0-18 探针 _probe-p018.json 实证 fresh 任务 GET result resultData=null、stages/gap 八键深挖零环节行，结果态诚实空「该产业服务供给数据不足，暂无法判定」且明示「不把 count=0 写成短板」；本条无头补探 _probe-p019.mjs（三产业 fresh）+ _probe-p019b.mjs（记录查看结果）均未采到环节卡 /「暂无供给机构」/「机构 0 家」。无环节行则「暂无供给机构」环节卡空态对象不存在，禁止用全页诚实空或补六卡伪绿。环节行补齐且出现 count=0 后 allow_skip 锚转实跑
ticket: D4-SVCSHORT-STAGES-EMPTY
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G5 分析记录已完成可「查看结果」；写结果态闸门已过）
