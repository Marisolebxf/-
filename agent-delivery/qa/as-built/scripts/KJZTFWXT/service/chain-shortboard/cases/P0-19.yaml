  - 本环境 user_id=guest 共享账号，遇非本条异常加一次诚实重试记 observed
locators:
  cluster_select: .industry-catalog-select（P7 点可见 view 容器）
  start_btn: 按钮「开始分析」（getByRole exact）
  view_result_btn: 「查看结果」（引导态或分析记录）
  station: 环节卡 [data-stage-id] / .svc-eco-metro-station（allow_skip 探测锚）
  blank_station: .svc-eco-metro-station--blank（count=0 → 服务空白）
  case_copy: 文案「暂无供给机构」（用例预期①；现场源码未见，转实跟 as-built）
