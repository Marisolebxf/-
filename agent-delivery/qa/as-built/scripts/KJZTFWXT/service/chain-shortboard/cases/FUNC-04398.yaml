id: FUNC-04398
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04398
priority: P0
tier: A
title: 主流程-分析记录 · 已完成查看结果
story: US-SVC-ECO-01
entry_id: svc-chain-shortboard
preconditions:
  - 分析记录中至少有一条状态为「已完成」的记录（env-gate G5）
locators:
  tab_records: tab「分析记录」（[data-tab-key=records]）
  view_result: button「查看结果」
  board: '[data-testid="svc-eco-shortboard-board"]'
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、进入结果页（步骤：点击「分析记录」→ 在「已完成」记录上点「查看结果」）
    assert: |-
      const route = '/service/chain-analysis?workspace=chain&tab=chain';
      const closeBasket = async () => {
        for (let i = 0; i < 3; i++) {
          const close = page.locator('[aria-label="关闭对比篮"]');
          if (
            (await close.count()) &&
            (await close.first().isVisible().catch(() => false)) &&
            (await close.first().isEnabled().catch(() => false))
          ) {
            try {
              await close.first().click({ timeout: 1500 });
              await page.waitForTimeout(300);
            } catch {}
          } else break;
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const clickCompletedViewResult = async () => {
        const rec = page
          .locator('[role=tab][data-tab-key="records"]')
          .or(page.getByRole('tab', { name: '分析记录', exact: true }));
        await expect(rec.first()).toBeVisible({ timeout: 8000 });
        await rec.first().click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(2000);
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (!/已完成/.test(body)) {
          throw new Error('前置：分析记录未见「已完成」: ' + body.slice(0, 360));
        }
        const row = page.locator('main tr').filter({ hasText: '已完成' }).first();
        let viewBtn = row.getByRole('button', { name: /查看结果/ }).first();
        if (!(await viewBtn.count()) || !(await viewBtn.isVisible().catch(() => false))) {
          viewBtn = page
            .getByRole('button', { name: /查看结果/ })
            .filter({ hasNot: page.locator('.arco-btn-disabled') })
            .first();
        }
        if (!(await viewBtn.count())) throw new Error('已完成行无可用「查看结果」');
        await viewBtn.click({ timeout: 8000 });
        await page.waitForTimeout(3000);
        let url = page.url();
        if (/view=processing/.test(url)) {
          const vr = page
            .getByRole('button', { name: /查看结果/ })
            .filter({ hasNot: page.locator('.arco-btn-disabled') })
            .first();
          if (await vr.count()) {
            await vr.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(2500);
            url = page.url();
          }
        }
        const shell =
          /view=result/.test(url) ||
          (await page.locator('[data-testid="svc-eco-shortboard-board"]').count()) > 0;
        if (!shell) throw new Error('未进入结果页: ' + url);
        await page.evaluate(() => {
          window.__func04398Ready = true;
        });
      };
      if (!page.url().includes('/service/chain-analysis') || !/workspace=chain/.test(page.url())) {
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      }
      await closeBasket();
      await expect(page.getByRole('tab', { name: /服务链短板分析/ }).first()).toBeVisible({
        timeout: 8000,
      });
      if (!/view=result/.test(page.url())) {
        await clickCompletedViewResult();
      } else {
        await page.evaluate(() => {
          window.__func04398Ready = true;
        });
      }
  - note: 2、可见「全周期服务链路」
    assert: |-
      if (!(await page.evaluate(() => window.__func04398Ready).catch(() => false))) {
        throw new Error('前置结果页未就绪');
      }
      await expect(page.getByText(/全周期服务链路/).first()).toBeVisible({ timeout: 12000 });
  - note: 3、可见「重新分析」
    assert: |-
      if (!(await page.evaluate(() => window.__func04398Ready).catch(() => false))) {
        throw new Error('前置结果页未就绪');
      }
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      const back = page.getByRole('button', { name: /返回配置重新分析|重新分析/ }).first();
      const btnOk =
        (await back.count()) && (await back.isVisible().catch(() => false));
      if (!btnOk && !/重新分析/.test(body)) {
        throw new Error('未见「重新分析」出口: ' + body.slice(0, 360));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  分析记录 Tab→已完成行「查看结果」进 view=result；验全周期服务链路壳与重新分析出口（按钮「返回配置重新分析」或文案点「重新分析」）。
  env-gate G5 历史记录，不 fresh 起任务。fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04398。零 allow_skip。
