id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00690
priority: P0
tier: B
title: 环节卡内容构成（结果态 · 环节行有据则验卡 / 无据则诚实空不造假卡）
story: US-SVC-ECO-01
entry_id: svc-chain-shortboard
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G5 分析记录已完成可「查看结果」）
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
  board: data-testid=svc-eco-shortboard-board / 「全周期服务链路」
  no_stages: data-testid=svc-eco-shortboard-no-stages
  station: data-stage-id / .svc-eco-metro-station
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 切「分析记录」点「查看结果」进入结果态，链路图区承载可见
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const rec=page.getByRole('tab', { name: '分析记录', exact: true }); await expect(rec).toBeVisible({ timeout: 8000 }); await rec.click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1000); const viewBtn=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await viewBtn.count())) throw new Error('无可用查看结果按钮'); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); let url=page.url(); if (/view=processing/.test(url) && /查看结果/.test(await page.locator('main').first().innerText().catch(()=>''))) { const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await vr.count()) { await vr.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url() } }; if (!/view=result/.test(url)) throw new Error('未进入结果态: '+url); await expect(page.getByText('全周期服务链路').first()).toBeVisible({ timeout: 8000 })
  - note: 环节行有据时：环节卡含环节名与统计承载（机构数/服务深度文案出现）；无据时：诚实空态、不补固定六卡
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||''); const noStages=page.locator('[data-testid="svc-eco-shortboard-no-stages"]'); const noStagesVis=(await noStages.count()>0 && await noStages.first().isVisible().catch(()=>false)); const stations=await page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(()=>0); if (stations>0 || /在库(服务)?机构|机构数/.test(body)) { if (!/机构数|在库/.test(body)) throw new Error('有环节行但未见机构数承载: '+body.slice(0,240)); if (!/服务深度|深度/.test(body)) throw new Error('有环节行但未见平均服务深度承载: '+body.slice(0,240)) } else if (noStagesVis) { if (/研发支持|技术转移与知识产权|中试与检测|孵化育成|产业化推广|投融资与人才/.test(body)) throw new Error('诚实空态不应渲染固定六环节卡: '+body.slice(0,240)) } else { throw new Error('既无环节卡亦无诚实空态: '+body.slice(0,240)) }
  - note: 图区带「只认 payload / 不造假」可读声明（环节机构数与平均服务深度只认 payload）
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/只认 payload|不补六张空卡|不补固定六卡|只画当前结果快照/.test(body)) throw new Error('未见 payload 只认声明: '+body.slice(0,300))
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: env-gate overall=pass；00690 B 档：实勘（2026-10-15 scout-p0-06-*）结果态 GET result 无 stages/gap 环节行——环节卡服务类型清单/机构数/服务深度当前环境无数据可断，属环境债（环境无环节行 payload，沿用 D4-SVCSHORT-STAGES-EMPTY 口径，非页面缺陷）；脚本走「查看结果」进结果态，有据验卡（机构数+服务深度承载）、无据认诚实空不造假卡+payload 只认声明，数据补齐后回炉补服务类型清单/每环节 ≥2 项深验。勿因「开始分析」后停过程页误判（生成完须点查看结果）。对比篮可见才关。列表 2 空格缩进。
