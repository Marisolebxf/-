id: FUNC-04399
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04399
priority: P0
tier: B
title: 主流程-重新分析 · 新一轮到新结果
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、过程页提示「任务已创建，正在展示分析过程」
    assert: |-
      const route = '/service/chain-analysis?workspace=chain&tab=chain';
      const l1Alias = { 生物: '生物产业', 海洋: '海洋产业', 传统与创意: '传统与创意产业' };
      const closeBasket = async () => {
        for (let i = 0; i < 3; i++) {
          const close = page.locator('[aria-label="关闭对比篮"]');
          if (
            (await close.count()) &&
            (await close.first().isVisible().catch(() => false)) &&
            (await close.first().isEnabled().catch(() => false))
          ) {
            try {
              await close.first().click({ timeout: 1500 });
              await page.waitForTimeout(300);
            } catch {}
          } else break;
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const openIndustryTrigger = async () => {
        const bar = page.locator('[data-testid="svc-eco-chain-result-bar"]');
        if (await bar.isVisible().catch(() => false)) {
          const ctrl = bar.locator('.arco-cascader-view, .industry-catalog-select, .arco-select-view').first();
          if (await ctrl.isVisible().catch(() => false)) {
            await ctrl.click({ timeout: 8000 });
            return;
          }
        }
        throw new Error('结果页未见产业领域选择器');
      };
      const pickCluster = async (shortName) => {
        const norm = (t) => String(t || '').trim().replace(/\s+/g, ' ');
        await page.waitForTimeout(500);
        const popup = page.locator('.arco-trigger-popup:visible').last();
        await expect(popup).toBeVisible({ timeout: 8000 });
        const col1 = popup.locator('.arco-cascader-panel-column, .arco-cascader-column').first();
        let candidates = col1.locator('.arco-cascader-option');
        if (!(await candidates.count())) {
          candidates = popup.locator('.arco-select-option, .arco-select-popup-visible .arco-select-option');
        }
        const l1 = l1Alias[shortName] || shortName;
        const n = await candidates.count();
        let picked = false;
        for (let i = 0; i < n; i++) {
          const el = candidates.nth(i);
          const txt = norm(await el.innerText());
          const hit =
            txt === shortName ||
            txt === l1 ||
            (shortName === '生物' && /^(生物|生物产业)$/.test(txt)) ||
            (shortName === '新一代信息技术' && /^新一代信息技术/.test(txt));
          if (!hit) continue;
          const cb = el.locator('.arco-checkbox, .arco-radio');
          if (await cb.count()) await cb.first().click({ timeout: 8000 });
          else await el.click({ timeout: 8000 });
          picked = true;
          break;
        }
        if (!picked) {
          const all = (await popup.locator('.arco-cascader-option, .arco-select-option').allTextContents())
            .map(norm)
            .filter(Boolean);
          throw new Error('下拉无「' + shortName + '」; 实见=' + all.slice(0, 28).join(','));
        }
        await page.waitForTimeout(800);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const openConfigIndustry = async () => {
        const flat = page
          .locator('main .industry-catalog-select.arco-select-view, main .industry-catalog-select')
          .first();
        if (await flat.isVisible().catch(() => false)) {
          await flat.click({ timeout: 8000 });
          return;
        }
        const cascader = page
          .locator(
            'main .svc-portal-industry-cascader .arco-cascader-view, main .sci-arco-cascader, main .arco-cascader-view'
          )
          .first();
        if (await cascader.isVisible().catch(() => false)) {
          await cascader.click({ timeout: 8000 });
          return;
        }
        throw new Error('配置区未见产业领域下拉');
      };
      const pickIt = async () => {
        await page.waitForTimeout(500);
        const popup = page
          .locator('.arco-trigger-popup:visible .svc-portal-industry-cascader-menu, .arco-trigger-popup:visible')
          .first();
        await expect(popup).toBeVisible({ timeout: 8000 });
        const col1 = popup.locator('.arco-cascader-panel-column, .arco-cascader-column').first();
        const row = col1.locator('.arco-cascader-option').filter({ hasText: /^新一代信息技术/ }).first();
        if (await row.count()) {
          const cb = row.locator('.arco-checkbox, .arco-radio');
          if (await cb.count()) await cb.first().click({ timeout: 8000 });
          else await row.click({ timeout: 8000 });
        } else {
          const flat = popup.locator('.arco-select-option').filter({ hasText: /^新一代信息技术$/ }).first();
          if (await flat.count()) await flat.click({ timeout: 8000 });
          else await popup.getByText(/^新一代信息技术/).first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(1000);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const waitProcessingDone = async () => {
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 8 ? 1000 : 1500);
          const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
          if (/分析结果已生成|已完成/.test(body) && (await vr.isVisible().catch(() => false))) {
            if (!(await vr.isDisabled().catch(() => true))) return;
          }
          if (/任务失败|分析失败/.test(body)) throw new Error('分析失败: ' + body.slice(0, 200));
        }
        throw new Error('过程页超时：未见可点的「查看结果」 url=' + page.url());
      };
      const resultBarShowsIt = async () => {
        const bar = page.locator('[data-testid="svc-eco-chain-result-bar"]');
        if (!(await bar.isVisible().catch(() => false))) return false;
        const txt = ((await bar.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /新一代信息技术/.test(txt);
      };
      const reachItResult = async () => {
        if (/view=result/.test(page.url()) && (await resultBarShowsIt())) {
          await expect(page.locator('[data-testid="svc-eco-shortboard-board"]')).toBeVisible({ timeout: 12000 });
          return;
        }
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await closeBasket();
        if (!/view=result/.test(page.url())) {
          const cfgTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          if (!/新一代信息技术/.test((cfgTxt.split('开始分析')[0] || cfgTxt))) {
            await openConfigIndustry();
            await pickIt();
          }
          if (!/view=processing|view=result/.test(page.url())) {
            const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
            await expect(start).toBeEnabled({ timeout: 8000 });
            await start.click({ timeout: 15000 });
          }
          if (!/view=result/.test(page.url())) {
            await waitProcessingDone();
            const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
            await expect(vr).toBeEnabled({ timeout: 8000 });
            await vr.click({ timeout: 15000 });
            await page.waitForTimeout(2000);
          }
        }
        if (!/view=result/.test(page.url())) throw new Error('前置：未进入结果页 url=' + page.url());
        await expect(page.locator('[data-testid="svc-eco-shortboard-board"]')).toBeVisible({ timeout: 15000 });
        if (!(await resultBarShowsIt())) {
          const barTxt = ((await page.locator('[data-testid="svc-eco-chain-result-bar"]').innerText().catch(() => '')) || '')
            .replace(/\s+/g, ' ')
            .slice(0, 160);
          throw new Error('前置：结果条未回显「新一代信息技术」: ' + barTxt);
        }
      };
      if (!page.url().includes('/service/chain-analysis')) {
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      }
      await closeBasket();
      await reachItResult();
      await openIndustryTrigger();
      await pickCluster('生物');
      await page.waitForTimeout(600);
      const rerun = page.getByRole('button', { name: '重新分析', exact: true }).first();
      await expect(rerun).toBeVisible({ timeout: 8000 });
      await expect(rerun).toBeEnabled({ timeout: 8000 });
      await rerun.click({ timeout: 15000 });
      await page.waitForTimeout(800);
      let sawToast = false;
      const toastLoc = page.locator('.arco-message-content, .arco-message').filter({
        hasText: /任务已创建，正在展示分析过程/,
      });
      if (await toastLoc.first().isVisible({ timeout: 4000 }).catch(() => false)) sawToast = true;
      let onProcess = false;
      for (let i = 0; i < 45; i++) {
        await page.waitForTimeout(i < 3 ? 600 : 1200);
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        const url = page.url();
        if (!sawToast && /任务已创建，正在展示分析过程/.test(body)) sawToast = true;
        if (/view=processing/.test(url) || /服务链短板分析生成中/.test(body)) onProcess = true;
        if (onProcess && sawToast) break;
        if (/本次分析生成失败|分析失败|create 失败/.test(body)) {
          throw new Error('重新分析失败: ' + body.slice(0, 240));
        }
      }
      if (!sawToast) {
        try {
          await page
            .getByText('任务已创建，正在展示分析过程')
            .first()
            .waitFor({ state: 'visible', timeout: 10000 });
          sawToast = true;
        } catch {}
      }
      if (!sawToast) {
        const snap = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (/任务已创建，正在展示分析过程/.test(snap)) sawToast = true;
      }
      if (!sawToast) throw new Error('未见提示「任务已创建，正在展示分析过程」');
      if (!onProcess) throw new Error('点击重新分析后未进入过程页 url=' + page.url());
      await page.evaluate(() => {
        window.__func04399Ready = true;
      });
  - note: 2、分析对象为「产业领域：生物」
    assert: |-
      if (!(await page.evaluate(() => window.__func04399Ready).catch(() => false))) {
        throw new Error('前置：未完成重新分析进过程页');
      }
      const main = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!/产业领域：生物(产业|医药)?/.test(main)) {
        throw new Error('过程页分析对象未见「产业领域：生物(产业)」: ' + main.slice(0, 360));
      }
  - note: 3、结果页标题为「生物 · 全周期服务链路」
    assert: |-
      if (!(await page.evaluate(() => window.__func04399Ready).catch(() => false))) {
        throw new Error('前置：过程页未就绪');
      }
      for (let i = 0; i < 90; i++) {
        await page.waitForTimeout(i < 8 ? 1000 : 1500);
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        const vr0 = page.getByRole('button', { name: '查看结果', exact: true }).first();
        if (/分析结果已生成|已完成/.test(body) && (await vr0.isVisible().catch(() => false))) {
          if (!(await vr0.isDisabled().catch(() => true))) break;
        }
        if (/任务失败|分析失败/.test(body)) throw new Error('过程页任务失败: ' + body.slice(0, 200));
        if (i === 89) throw new Error('过程页超时：未见可点的「查看结果」');
      }
      const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(vr).toBeEnabled({ timeout: 12000 });
      await vr.click({ timeout: 15000 });
      await page.waitForTimeout(2500);
      if (!/view=result/.test(page.url())) {
        for (let i = 0; i < 12; i++) {
          if (/view=result/.test(page.url())) break;
          await page.waitForTimeout(1000);
        }
      }
      if (!/view=result/.test(page.url())) throw new Error('点查看结果后未进结果页 url=' + page.url());
      const board = page.locator('[data-testid="svc-eco-shortboard-board"]');
      await expect(board).toBeVisible({ timeout: 15000 });
      const boardTxt = ((await board.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const titleRe = /生物(产业|医药)?\s*·\s*全周期服务链路/;
      if (!titleRe.test(boardTxt)) {
        throw new Error('结果页标题非「生物(产业)·全周期服务链路」: ' + boardTxt.slice(0, 240));
      }
on_fail: 截图 + 抄 X-Trace-Id