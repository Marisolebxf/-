id: FUNC-04402
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04402
priority: P0
tier: B
title: 备选-清空已选产业后恢复占位
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
  - action: click
    target: 新一代信息技术
    note: 展开产业领域（04401 改选前置）
  - action: click
    target: 「生物」
    note: 改选生物
expect:
  - note: 占位恢复为「选择产业集群」
    assert: |-
      const cfg = page.locator('main [data-testid="svc-eco-analysis-config"]');
      const industry = cfg.locator('.arco-select-view').first();
      await industry.hover();
      const clearBtn = cfg.locator('.arco-icon-close, .arco-select-view-clear-icon, .arco-select-clear-icon').first();
      await clearBtn.click({ timeout: 5000 });
      await expect(industry).toContainText('选择产业集群');
  - note: 页面仍为「分析配置」
    assert: |-
      await expect(page.locator('main [data-testid="svc-eco-analysis-config"] h2')).toHaveText('分析配置');
  - note: 不出现「服务链短板分析生成中」
    assert: |-
      await expect(page.getByText('服务链短板分析生成中')).toHaveCount(0)
on_fail: 截图 + 抄 X-Trace-Id
