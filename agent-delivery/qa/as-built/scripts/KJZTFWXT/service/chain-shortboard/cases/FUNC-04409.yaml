id: FUNC-04409
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04409
priority: P1
tier: B
title: 备选-结果页下拉 · 15 个选项
story: US-SVC-ECO-01
entry_id: svc-chain-shortboard
preconditions:
  - 已打开一次成功结果页
locators:
  result_bar: '[data-testid="svc-eco-chain-result-bar"]'
  board: '[data-testid="svc-eco-shortboard-board"]'
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、已打开成功结果页并展开产业领域下拉；2、选项共 15 个且名称与附录 A 一致
    assert: |-
      const route = '/service/chain-analysis?workspace=chain&tab=chain';
      const need = [
        '新一代信息技术',
        '生物',
        '新能源',
        '新材料',
        '高端装备',
        '智能网联新能源汽车',
        '绿色环保',
        '低空经济与空天',
        '传统与创意',
        '海洋',
        '未来制造',
        '未来信息',
        '未来能源',
        '未来空间',
        '未来健康',
      ];
      const noise = [
        '外资企业',
        '高新技术企业',
        '小微企业',
        '上市企业',
        '专精特新',
        '小巨人',
        '链主龙头',
      ];
      const norm = (t) =>
        t
          .trim()
          .replace(/\s+/g, ' ')
          .replace(/\s*（[^）]*）\s*$/, '')
          .trim();
      const closeBasket = async () => {
        for (let i = 0; i < 3; i++) {
          const close = page.locator('[aria-label="关闭对比篮"]');
          if (
            (await close.count()) &&
            (await close.first().isVisible().catch(() => false)) &&
            (await close.first().isEnabled().catch(() => false))
          ) {
            try {
              await close.first().click({ timeout: 1500 });
              await page.waitForTimeout(300);
            } catch {}
          } else break;
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const openConfigIndustry = async () => {
        const flat = page
          .locator('main .industry-catalog-select.arco-select-view, main .industry-catalog-select')
          .first();
        if (await flat.isVisible().catch(() => false)) {
          await flat.click({ timeout: 8000 });
          return;
        }
        const cascader = page
          .locator(
            'main .svc-portal-industry-cascader .arco-cascader-view, main .sci-arco-cascader, main .arco-cascader-view'
          )
          .first();
        if (await cascader.isVisible().catch(() => false)) {
          await cascader.click({ timeout: 8000 });
          return;
        }
        throw new Error('配置区未见产业领域下拉');
      };
      const pickIt = async () => {
        await page.waitForTimeout(500);
        const popup = page
          .locator('.arco-trigger-popup:visible .svc-portal-industry-cascader-menu, .arco-trigger-popup:visible')
          .first();
        await expect(popup).toBeVisible({ timeout: 8000 });
        const col1 = popup.locator('.arco-cascader-panel-column, .arco-cascader-column').first();
        const row = col1.locator('.arco-cascader-option').filter({ hasText: /^新一代信息技术/ }).first();
        if (await row.count()) {
          const cb = row.locator('.arco-checkbox, .arco-radio');
          if (await cb.count()) await cb.first().click({ timeout: 8000 });
          else await row.click({ timeout: 8000 });
        } else {
          const flat = popup.locator('.arco-select-option').filter({ hasText: /^新一代信息技术$/ }).first();
          if (await flat.count()) await flat.click({ timeout: 8000 });
          else await popup.getByText(/^新一代信息技术/).first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(1000);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const waitProcessingDone = async () => {
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 8 ? 1000 : 1500);
          const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
          if (/分析结果已生成/.test(body) && (await vr.isVisible().catch(() => false))) {
            if (!(await vr.isDisabled().catch(() => true))) return;
          }
        }
        throw new Error('过程页超时：未见可点的「查看结果」 url=' + page.url());
      };
      const reachResult = async () => {
        if (/view=result/.test(page.url())) {
          const board = page.locator('[data-testid="svc-eco-shortboard-board"]');
          if (await board.isVisible().catch(() => false)) return;
        }
        const deep =
          route +
          '&industry=INB1701&view=result&demo_state=result&task_id=SVC-20261015-066';
        await page.goto(baseUrl + deep, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        if (/view=result/.test(page.url())) {
          await expect(page.locator('[data-testid="svc-eco-shortboard-board"]')).toBeVisible({
            timeout: 12000,
          });
          return;
        }
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await closeBasket();
        const cfgTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (!/新一代信息技术/.test((cfgTxt.split('开始分析')[0] || cfgTxt))) {
          await openConfigIndustry();
          await pickIt();
        }
        if (!/view=processing|view=result/.test(page.url())) {
          const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
          await expect(start).toBeEnabled({ timeout: 8000 });
          await start.click({ timeout: 15000 });
        }
        if (!/view=result/.test(page.url())) {
          await waitProcessingDone();
          const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
          await expect(vr).toBeEnabled({ timeout: 8000 });
          await vr.click({ timeout: 15000 });
          await page.waitForTimeout(2000);
        }
        if (!/view=result/.test(page.url())) {
          throw new Error('前置：未进入成功结果页 url=' + page.url());
        }
        await expect(page.locator('[data-testid="svc-eco-shortboard-board"]')).toBeVisible({
          timeout: 15000,
        });
      };
      const openResultIndustry = async () => {
        const bar = page.locator('[data-testid="svc-eco-chain-result-bar"]');
        if (await bar.isVisible().catch(() => false)) {
          const ctrl = bar.locator('.arco-cascader-view, .industry-catalog-select, .arco-select-view').first();
          if (await ctrl.isVisible().catch(() => false)) {
            await ctrl.click({ timeout: 8000 });
            return 'result-bar';
          }
        }
        throw new Error('结果页未见产业领域选择器（svc-eco-chain-result-bar）');
      };
      if (!page.url().includes('/service/chain-analysis')) {
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      }
      await closeBasket();
      await reachResult();
      await openResultIndustry();
      await page.waitForTimeout(600);
      const popup = page.locator('.arco-trigger-popup:visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      let clean = [];
      const col1 = popup.locator('.arco-cascader-panel-column, .arco-cascader-column').first();
      if (await col1.locator('.arco-cascader-option').count()) {
        const texts = (await col1.locator('.arco-cascader-option').allTextContents()).map(norm).filter(Boolean);
        clean = texts.filter((t) => !noise.includes(t));
      } else {
        const opts = popup.locator('.arco-select-option, .arco-select-popup-visible .arco-select-option');
        const texts = (await opts.allTextContents()).map(norm).filter(Boolean);
        clean = texts.filter((t) => !noise.includes(t));
      }
      if (clean.length !== 15) {
        throw new Error('结果页产业选项数 ' + clean.length + ' ≠15 实见=' + clean.join(','));
      }
      for (const k of need) {
        if (!clean.some((t) => t === k || t.includes(k) || k.includes(t))) {
          throw new Error('缺附录 A 产业集群: ' + k + ' / 实见 ' + clean.join(','));
        }
      }
      const extra = clean.filter((t) => !need.some((k) => t === k || t.includes(k) || k.includes(t)));
      if (extra.length) {
        throw new Error('附录 A 外多余选项: ' + extra.join(',') + ' / 实见 ' + clean.join(','));
      }
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  成功结果页（深链 SVC-20261015-066 或 fresh 新一代信息技术→查看结果）→结果条 svc-eco-chain-result-bar 展开产业下拉；
  首列 15 集群短名 norm（对齐 04392/04404）；对比篮 noise 去噪。fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04409。B 档零 allow_skip。
