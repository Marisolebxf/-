    assert: |-
      const segUrl=String(globalThis.__p022SegUrl||'');
      if (!segUrl) throw new Error('前置未构造含 segment 参数 URL');
      await page.goto(segUrl, { waitUntil: 'domcontentloaded' });
      if (page.url().includes('/login')) throw new Error('会话丢失：goto 后落 /login（前置失败）');
      let msgSeen=false, msgText='', cleaned=false, drawerSeen=false;
      const deadline=Date.now()+12000;
      while (Date.now()<deadline) {
        const mts=await page.locator('.arco-message, .arco-message-list, .arco-notification').allInnerTexts().catch(()=>[]);
        const mt=((mts||[]).join(' ')||'').trim();
        if (!msgSeen && /环节不存在|不存在|无效/.test(mt)) { msgSeen=true; msgText=mt.slice(0,120) }
        const body=((await page.locator('main').first().innerText().catch(()=>''))||'');
        if (!msgSeen && /环节不存在/.test(body)) { msgSeen=true; msgText='body:'+body.slice(0,80) }
        if (!cleaned && !/[?&]segment=/.test(page.url())) cleaned=true;
        if (!drawerSeen && (await page.locator('.arco-drawer').first().isVisible().catch(()=>false))) drawerSeen=true;
        if (msgSeen && cleaned) break;
        await page.waitForTimeout(400);
      }
      globalThis.__p022MsgSeen=msgSeen; globalThis.__p022MsgText=msgText; globalThis.__p022Cleaned=cleaned; globalThis.__p022DrawerSeen=drawerSeen;
      console.log('[P0-22 observed] 无效segment观察窗 msgSeen='+msgSeen+' msgText='+(msgText||'无')+' cleaned='+cleaned+' drawerSeen='+drawerSeen+' url='+page.url());
  - note: 预期①「无效环节参数不打开详情面板」——终态断言 .arco-drawer 不可见（X2；当前环境因 segment 键零读取亦无抽屉，终态语义仍成立；若日后加载期短暂 mount 以终态为准，不造「全程零 mount」反实现断言）
