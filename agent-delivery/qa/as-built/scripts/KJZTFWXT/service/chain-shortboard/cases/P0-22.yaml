      const u0=page.url();
      const mTask=/[?&]task_id=(SVC-[0-9-]+)/.exec(u0);
      const mInd=/[?&]industry=([^&]+)/.exec(u0);
      const taskId=mTask?mTask[1]:'SVC-20261015-066';
      const ind=mInd?mInd[1]:'INB1701';
      globalThis.__p022TaskId=taskId;
      const rebuilt='http://10.50.69.111:30892/service/chain-analysis?workspace=chain&tab=chain&industry='+ind+'&view=result&demo_state=result&task_id='+taskId+'&segment=INVALID-SEGMENT-404';
