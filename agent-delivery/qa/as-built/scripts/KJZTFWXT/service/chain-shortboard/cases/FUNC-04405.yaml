id: FUNC-04405
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04405
priority: P1
tier: B
title: 备选-从结果页返回配置且产业选择仍在
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、出现「分析配置」
    assert: |-
      const close = page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && (await close.first().isVisible().catch(() => false)) && (await close.first().isEnabled().catch(() => false))) {
        try {
          await close.first().click({ timeout: 1500 });
          await page.waitForTimeout(300);
        } catch {}
      }
      let cfg = page.locator('[data-testid="svc-eco-analysis-config"]');
      if (!(await cfg.isVisible().catch(() => false))) {
        const backEarly = page.getByRole('button', { name: '返回配置', exact: true });
        if (await backEarly.isVisible().catch(() => false)) {
          await backEarly.click({ timeout: 8000 });
          await page.waitForTimeout(800);
        }
      }
      cfg = page.locator('[data-testid="svc-eco-analysis-config"]');
      await expect(cfg).toBeVisible({ timeout: 12000 });
      const ctx = cfg.locator('[data-testid="svc-eco-analysis-context"]');
      const cascader = ctx.locator('.arco-cascader-view').first();
      await cascader.click({ timeout: 8000 });
      const popup = page.locator('.arco-trigger-popup:visible').first();
      await expect(popup).toBeVisible({ timeout: 8000 });
      await popup.getByText('新一代信息技术', { exact: true }).first().click({ timeout: 8000 });
      await page.keyboard.press('Escape').catch(() => {});
      await expect(ctx).toContainText('新一代信息技术', { timeout: 8000 });
      await page.getByRole('button', { name: '开始分析', exact: true }).click({ timeout: 15000 });
      const viewResult = page.getByRole('button', { name: '查看结果', exact: true });
      await expect(viewResult).toBeEnabled({ timeout: 90000 });
      await viewResult.click({ timeout: 15000 });
      await expect(page.locator('[data-testid="svc-eco-chain-result-bar"]')).toBeVisible({ timeout: 15000 });
      const back = page.getByRole('button', { name: '返回配置', exact: true });
      await expect(back).toBeVisible({ timeout: 8000 });
      await back.click({ timeout: 8000 });
      await expect(page.locator('[data-testid="svc-eco-analysis-config"]')).toBeVisible({ timeout: 15000 });
      await expect(page.getByRole('heading', { name: '分析配置' })).toBeVisible({ timeout: 8000 });
  - note: 2、产业领域仍为「新一代信息技术」
    assert: |-
      const ctx = page.locator('[data-testid="svc-eco-analysis-config"] [data-testid="svc-eco-analysis-context"]');
      await expect(ctx).toContainText('新一代信息技术', { timeout: 8000 });
  - note: 3、可见「开始分析」
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析', exact: true })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
