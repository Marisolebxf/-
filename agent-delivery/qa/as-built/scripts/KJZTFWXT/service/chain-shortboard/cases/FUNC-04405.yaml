id: FUNC-04405
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04405
priority: P1
tier: B
title: 结果页返回配置保留新一代信息技术产业条件
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 出现「分析配置」
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); let trigger=page.locator('.industry-catalog-select .arco-select-view').first(); if (!(await trigger.count())) trigger=page.locator('.svc-eco-panel .arco-select-view').first(); await trigger.click({ timeout: 8000 }); await page.waitForTimeout(600); const opt=page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }); if (await opt.count()) { await opt.first().click({ timeout: 8000 }) } else { const m1=page.locator('.arco-trigger-popup:visible [role="menuitem"]').filter({ hasText: /^新一代信息技术$/ }).first(); await m1.hover({ timeout: 8000 }); await m1.click({ timeout: 8000 }); await page.waitForTimeout(400); const m2=page.locator('.arco-trigger-popup:visible [role="menuitem"]').filter({ hasText: /^新一代信息技术$/ }).nth(1); if (await m2.count()) await m2.click({ timeout: 8000 }); else await page.locator('.arco-trigger-popup:visible [role="menuitem"]').filter({ hasText: '半导体与集成电路' }).first().click({ timeout: 8000 }) }; await page.waitForTimeout(800); await page.getByRole('button', { name: '开始分析' }).click({ timeout: 8000 }); await page.waitForTimeout(2000); let back=page.getByRole('button', { name: '返回配置' }); if (!(await back.isVisible().catch(()=>false))) { const rec=page.getByRole('tab', { name: '分析记录', exact: true }); await rec.click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1200); const viewBtn=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await viewBtn.count()) { await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(2500) } }; back=page.getByRole('button', { name: '返回配置' }); await expect(back).toBeVisible({ timeout: 12000 }); await back.click({ timeout: 8000 }); await page.waitForTimeout(800); await expect(page.getByRole('heading', { name: '分析配置' })).toBeVisible({ timeout: 8000 })
  - note: 产业领域仍为「新一代信息技术」
    assert: |-
      const panelTxt=((await page.locator('.svc-eco-panel').first().innerText().catch(()=>''))||'').replace(/\s+/g,' '); if (!panelTxt.includes('新一代信息技术')) throw new Error('产业领域未保留「新一代信息技术」: '+panelTxt.slice(0,160))
  - note: 可见「开始分析」
    assert: await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id
