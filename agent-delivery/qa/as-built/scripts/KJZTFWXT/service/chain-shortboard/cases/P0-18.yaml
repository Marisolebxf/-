  ① segment 参数处理链路独立性探查——结果态 URL（本会话 fresh 任务 SVC-20261015-066，新一代信息技术）手工拼 segment=INVALID-SEGMENT-404 goto 冷加载，12s 观察窗 400ms 采样「三无」：URL segment 原样残留不清参（final_url 含 segment=INVALID-SEGMENT-404）+ 无「环节不存在/不存在/无效」类提示（.arco-message/.arco-notification 零命中）+ 无任何面板/.arco-drawer 开启；页面壳正常渲染（view=result/task_id/诚实空板全保留，截图 probe-p018-s2-segment-coldload.png）。与 graph 侧对比：graph 工作区 org 参数有完整处理链路（readOrgQuery→drawer watch→rejectMissing→Message.warning→patchQuery 清参，P0-23 实证），chain 侧 segment 键源码零读取（ServiceChainAnalysisWorkspace.vue 只读 org（仅 isGraph）/industry/tab/workspace；SvcChainShortboardBoard.vue 无 patchQuery 调用）→ 连参数处理链路都不存在，旁证 00698 的参数机制未实现（并同根因连带 00705 无效参数口径亦无承载）。
  ② 有效 segment 标识源探查（任务书途径「任务 result_data/记录 API」）——GET /topicAsync/topic/v1/analysis/tasks/SVC-20261015-066/result?user_id=guest：status=200/code=0/task.status=success 但 resultData=null（字段在键位上值为空）；POST tasks/list（user_id=guest,size=50）50 条 recent 任务全部 hasRd=false（含本任务 SVC-20261015-066 shortboard success 在列 top[0]）；stages/gap/links/segments/shortboard/items/rows/models 八键深挖零环节行 → 无有效 segment 标识可拼（探针 s3/s3b/s3c）。
