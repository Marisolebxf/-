        if (warnN>0 || labelHit) throw new Error('无环节行不应出现警示站卡/ PROBLEM_LABEL: warn='+warnN+' labelHit='+labelHit);
        console.log('[P0-20 observed] 无据分支：零警示标签通过（不伪绿 no-hit）');
