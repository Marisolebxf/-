  用例预期：①识别面板「当前演示规则下未发现明显短板」；②链路图不施加高亮或警示标签。前置须可构造无问题环节产业集群（开放项 3，本轮用例册不判 Fail）。
  落局（2026-10-15 无头实勘）：
  ① D4-SVCSHORT-STAGES-EMPTY——同日 _probe-p018：resultData=null、零环节行、结果态诚实空「该产业服务供给数据不足，暂无法判定」；本条 _probe-p020.mjs hist「查看结果」disabled、fresh 两产业未进任务态，zero stations / zero no-hit → 与 P0-06~19 环境债同根，不可构造 00703「有行全不命中」。
  ② 源码锚（只读）：SvcChainShortboardBoard.vue hasStages=false→供给不足 alert（00704）；hasStages && !problems.length→title「当前演示规则下未发现明显短板」+ data-testid=svc-eco-shortboard-no-hit。转实认该 testid/文案。
