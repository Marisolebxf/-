      if (!/view=result/.test(page.url())) throw new Error('未落结果态: '+page.url());
      const stations=await page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(()=>0);
      globalThis.__p020Stations=stations;
      console.log('[P0-20 observed] 结果态 stations='+stations+' task='+(globalThis.__p020TaskId||'hist')+' url='+page.url());
  - note: 预期①识别面板显示「当前演示规则下未发现明显短板」——源码 SvcChainShortboardBoard.vue：hasStages && !problems.length → a-alert title 该文案 + data-testid=svc-eco-shortboard-no-hit；无环节行时走供给不足空态（00704），本条 n/a 不伪绿；有环节行但 problems>0 则非 00703 对象须红
    assert: |-
      const stations=Number(globalThis.__p020Stations||0);
