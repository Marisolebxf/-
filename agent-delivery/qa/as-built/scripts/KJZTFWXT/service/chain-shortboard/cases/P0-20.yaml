  - note: 预期②链路图不施加高亮或警示标签——有 no-hit 时：站卡无 --blank/--weak/--bottleneck 且 PROBLEM_LABEL 全词（服务空白/薄弱环节/资源瓶颈）零出现；无环节行时：全页无上述警示标签（与 P0-09 无据「不造假标注」同口径，防假绿）
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||'');
      const stations=Number(globalThis.__p020Stations||await page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(()=>0));
      const warnN=await page.locator('.svc-eco-metro-station--blank, .svc-eco-metro-station--weak, .svc-eco-metro-station--bottleneck').count().catch(()=>0);
      const labelHit=/服务空白|薄弱环节|资源瓶颈/.test(body);
