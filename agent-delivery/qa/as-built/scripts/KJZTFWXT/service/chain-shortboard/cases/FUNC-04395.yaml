id: FUNC-04395
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04395
priority: P0
tier: A
title: 主流程-配置说明 · 指纹提示与空态
story: US-SVC-ECO-01
entry_id: svc-chain-shortboard
preconditions:
  - 已进入分析配置；尚未点击「开始分析」
locators:
  config: 分析配置
  fingerprint_hint: 产业进短板指纹。切产业不自动创建任务。
  empty_panel: .svc-eco-panel
  start: button「开始分析」
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、提示「产业进短板指纹。切产业不自动创建任务。」（步骤：停留在分析配置，不点「开始分析」）
    assert: |-
      const route = '/service/chain-analysis?workspace=chain&tab=chain';
      const closeBasket = async () => {
        for (let i = 0; i < 3; i++) {
          const close = page.locator('[aria-label="关闭对比篮"]');
          if (
            (await close.count()) &&
            (await close.first().isVisible().catch(() => false)) &&
            (await close.first().isEnabled().catch(() => false))
          ) {
            try {
              await close.first().click({ timeout: 1500 });
              await page.waitForTimeout(300);
            } catch {}
          } else break;
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const ensureConfigEmpty = async () => {
        const sel = page.locator('main .industry-catalog-select').first();
        if (!(await sel.isVisible().catch(() => false))) return;
        const viewTxt = (
          (await sel.locator('.arco-select-view-value').first().innerText().catch(() => '')) ||
          (await sel.innerText().catch(() => '')) ||
          ''
        )
          .trim()
          .replace(/\s+/g, ' ');
        if (
          viewTxt &&
          !/选择产业集群|^$/.test(viewTxt) &&
          /新一代|生物|新能源|新材料|高端装备|智能网联|绿色环保|低空|传统与创意|海洋|未来/.test(viewTxt)
        ) {
          await sel.hover();
          await page.waitForTimeout(200);
          const clr = page.locator(
            '.industry-catalog-select .arco-select-view-clear-btn, .industry-catalog-select .arco-select-clear-icon'
          );
          if (await clr.count()) {
            await clr.first().click({ force: true });
            await page.waitForTimeout(800);
          }
        }
        await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 });
      };
      if (!page.url().includes('/service/chain-analysis') || /view=processing|view=result/.test(page.url())) {
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      }
      await closeBasket();
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      if (/view=processing|view=result/.test(page.url())) {
        throw new Error('应停留在配置态，不应在过程/结果: ' + page.url());
      }
      await ensureConfigEmpty();
      const cfg = page.locator('main').filter({ hasText: '分析配置' }).first();
      const cfgTxt = ((await cfg.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/产业进短板指纹/.test(cfgTxt) || !/切产业不自动创建任务/.test(cfgTxt)) {
        throw new Error('配置区未见指纹提示: ' + cfgTxt.slice(0, 320));
      }
      await page.evaluate(() => {
        window.__func04395Ready = true;
      });
  - note: 2、空态含「请先确认产业条件，再点击「开始分析」」
    assert: |-
      if (!(await page.evaluate(() => window.__func04395Ready).catch(() => false))) {
        throw new Error('前置配置空态未就绪');
      }
      const panel = ((await page.locator('.svc-eco-panel').first().innerText().catch(() => '')) || '');
      if (!/请先确认产业条件/.test(panel) || !/再点击「开始分析」/.test(panel)) {
        throw new Error('空态未见「请先确认产业条件，再点击「开始分析」」: ' + panel.slice(0, 320));
      }
  - note: 3、空态含「不会自动创建任务」
    assert: |-
      if (!(await page.evaluate(() => window.__func04395Ready).catch(() => false))) {
        throw new Error('前置配置空态未就绪');
      }
      const panel = ((await page.locator('.svc-eco-panel').first().innerText().catch(() => '')) || '');
      if (!/不会自动创建任务/.test(panel)) {
        throw new Error('空态未见「不会自动创建任务」: ' + panel.slice(0, 320));
      }
      const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      if (/view=processing|view=result/.test(page.url())) {
        throw new Error('未点「开始分析」却进了过程/结果: ' + page.url());
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  配置态未点「开始分析」；配置区指纹「产业进短板指纹。切产业不自动创建任务。」+ .svc-eco-panel 软空态两句（对齐 scout-empty / P0-04）。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04395。零 allow_skip。
