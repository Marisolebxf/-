id: FUNC-04401
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04401
priority: P1
tier: B
title: 备选-改产业 · 配置页切产业不自动分析
entry_id: svc-chain-shortboard
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 步骤自含：分析配置→选「新一代信息技术」→改选「生物」（不点「开始分析」）
    assert: |-
      const ctx = page.locator('main [data-testid="svc-eco-analysis-context"]');
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 15000 });
      await expect(ctx).toBeVisible({ timeout: 8000 });
      const trigger = () => ctx.locator('.arco-cascader-view, .sci-arco-cascader').first();
      const pickL1 = async (name) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
        const t = trigger();
        await expect(t).toBeVisible({ timeout: 8000 });
        await t.click({ timeout: 8000 });
        const popup = page.locator('.arco-trigger-popup:visible').last();
        await expect(popup).toBeVisible({ timeout: 8000 });
        const col = popup.locator('.arco-cascader-panel-column, .arco-cascader-column').first();
        const names = [name, { 生物: '生物产业', 海洋: '海洋产业', 传统与创意: '传统与创意产业' }[name]].filter(Boolean);
        let row = null;
        for (const n of names) {
          const r = col.locator('.arco-cascader-option').filter({ hasText: new RegExp('^' + n + '$') }).first();
          if (await r.count()) {
            row = r;
            break;
          }
        }
        if (!row) throw new Error('cascader 一级无「' + name + '」');
        await expect(row).toBeVisible({ timeout: 8000 });
        const cb = row.locator('.arco-checkbox, .arco-radio');
        if (await cb.count()) await cb.first().click({ timeout: 8000 });
        else await row.click({ timeout: 8000 });
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(800);
      };
      await pickL1('新一代信息技术');
      const mid = ((await trigger().innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!mid.includes('新一代信息技术')) {
        throw new Error('选 IT 后未回显: ' + mid);
      }
      await pickL1('生物');
      await page.waitForTimeout(500);
  - note: 1、产业领域回显「生物」
    assert: |-
      const view = page.locator('main [data-testid="svc-eco-analysis-context"] .arco-cascader-view, main [data-testid="svc-eco-analysis-context"] .sci-arco-cascader').first();
      await expect(view).toBeVisible({ timeout: 8000 });
      const txt = ((await view.innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/(^|\s|\/)生物(\s|$|产业)/.test(txt) && !/^生物$/.test(txt)) {
        throw new Error('产业领域未回显「生物」: ' + txt);
      }
      if (/新一代信息技术/.test(txt)) {
        throw new Error('产业仍为 IT: ' + txt);
      }
  - note: 2、页面仍为「分析配置」
    assert: |-
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(page.locator('[data-testid="svc-eco-analysis-config"]')).toBeVisible({ timeout: 8000 });
      if (/view=processing|view=result/.test(page.url())) {
        throw new Error('改选产业后不应离开配置态: ' + page.url());
      }
  - note: 3、不出现「服务链短板分析生成中」
    assert: |-
      await expect(page.getByText('服务链短板分析生成中')).toHaveCount(0);
      await page.waitForTimeout(1200);
      await expect(page.getByText('服务链短板分析生成中')).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
