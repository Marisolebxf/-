id: FUNC-04391
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04391
priority: P0
tier: A
title: 主流程-瓶颈识别 · 规则说明与空快照
story: US-SVC-ECO-02
entry_id: svc-chain-shortboard
preconditions:
  - 已进入一次成功结果页且当前快照无环节行（分析记录或深链回落）
locators:
  board: '[data-testid="svc-eco-shortboard-board"]'
  bottleneck_section: section.ent-section-panel（标题「瓶颈堵点识别」）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
expect:
  - note: 1、区块标题为「瓶颈堵点识别」
    assert: |-
      const route = '/service/chain-analysis?workspace=chain&tab=chain';
      const closeBasket = async () => {
        for (let i = 0; i < 3; i++) {
          const close = page.locator('[aria-label="关闭对比篮"]');
          if (
            (await close.count()) &&
            (await close.first().isVisible().catch(() => false)) &&
            (await close.first().isEnabled().catch(() => false))
          ) {
            try {
              await close.first().click({ timeout: 1500 });
              await page.waitForTimeout(300);
            } catch {}
          } else break;
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const stationCount = async () =>
        page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(() => 0);
      const openNoStageResult = async () => {
        if (/view=processing|view=result/.test(page.url())) {
          await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
        }
        const rec = page.getByRole('tab', { name: '分析记录', exact: true });
        await expect(rec).toBeVisible({ timeout: 8000 });
        await rec.click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(2000);
        const pickView = async () => {
          const btns = page.getByRole('button', { name: /查看结果/ });
          const n = await btns.count();
          for (let i = 0; i < n; i++) {
            const b = btns.nth(i);
            const dis = await b.isDisabled().catch(() => true);
            const cls = (await b.getAttribute('class').catch(() => '')) || '';
            if (!dis && !/arco-btn-disabled/.test(cls) && (await b.isVisible().catch(() => false))) {
              await b.click({ timeout: 8000 });
              await page.waitForTimeout(3000);
              if (/view=processing/.test(page.url()) && /查看结果/.test(
                ((await page.locator('main').first().innerText().catch(() => '')) || '')
              )) {
                await b.click({ timeout: 8000 }).catch(() => {});
                await page.waitForTimeout(2500);
              }
              return true;
            }
          }
          return false;
        };
        let opened = await pickView();
        if (!opened) {
          await page.waitForTimeout(2500);
          opened = await pickView();
        }
        let stations = await stationCount();
        if (opened && stations === 0 && /view=result/.test(page.url())) return;
        const deep =
          baseUrl +
          '/service/chain-analysis?workspace=chain&tab=chain&industry=INB1701&view=result&demo_state=result&task_id=SVC-20261015-066';
        await page.goto(deep, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(3500);
        stations = await stationCount();
        if (stations > 0 || !/view=result/.test(page.url())) {
          throw new Error(
            '未构造无环节行结果态 stations=' + stations + ' url=' + page.url()
          );
        }
      };
      if (!page.url().includes('/service/chain-analysis')) {
        await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      }
      await closeBasket();
      if (!/view=result/.test(page.url()) || (await stationCount()) > 0) {
        await openNoStageResult();
      }
      globalThis.__p04391Stations = await stationCount();
      if (Number(globalThis.__p04391Stations) > 0) {
        throw new Error('有环节行非 04391 空快照对象，禁止伪绿');
      }
      await expect(page.locator('[data-testid="svc-eco-shortboard-board"]')).toBeVisible({ timeout: 15000 });
      const btlSection = page
        .locator('section.ent-section-panel')
        .filter({ has: page.getByText('瓶颈堵点识别', { exact: true }) })
        .first();
      await expect(btlSection).toBeVisible({ timeout: 8000 });
      await expect(btlSection.getByText('瓶颈堵点识别', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、可见演示规则「0 家为空白，不超过 1 家为薄弱，均深低于 55 为瓶颈」
    assert: |-
      const btlSection = page
        .locator('section.ent-section-panel')
        .filter({ has: page.getByText('瓶颈堵点识别', { exact: true }) })
        .first();
      const txt = ((await btlSection.innerText().catch(() => '')) || '');
      if (!/0\s*家为空白/.test(txt) || !/不超过\s*1\s*家为薄弱/.test(txt) || !/均深低于\s*55\s*为瓶颈/.test(txt)) {
        throw new Error('瓶颈区未见完整演示规则: ' + txt.slice(0, 360));
      }
  - note: 3、该区块提示「该产业服务供给数据不足，暂无法判定」
    assert: |-
      const btlSection = page
        .locator('section.ent-section-panel')
        .filter({ has: page.getByText('瓶颈堵点识别', { exact: true }) })
        .first();
      const alert = btlSection.locator('.arco-alert').filter({ hasText: '该产业服务供给数据不足，暂无法判定' }).first();
      await expect(alert).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  无环节行结果态经分析记录或深链回落；瓶颈区 section 内断言演示规则与供给不足 alert，勿与全周期 testid 混读。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04391。零 allow_skip。
