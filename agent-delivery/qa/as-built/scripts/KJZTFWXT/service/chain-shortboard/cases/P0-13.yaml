id: P0-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00697
priority: P0
tier: B
title: 产业切换重算（备选 · 完成一次分析进结果态后改选集群显式重析，新 task 新产业指纹 / 旧 task 与旧产业数据零残留）
story: US-SVC-ECO-01
entry_id: svc-chain-shortboard
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G2 合法选齐后「开始分析」enabled；本入口今日实证 POST 200 可建任务）
  - 本环境 user_id=guest 共享账号，并行会话可能同时起任务；task_id 断言只认本条捕获值（新旧关系断言，不钉死号段）
locators:
  cluster_select: .industry-catalog-select / placeholder「选择产业集群」（P7 点可见容器）
  cluster_option: .arco-trigger-popup:visible .arco-select-option（「新一代信息技术」/「新能源」）
  start_btn: button「开始分析」（getByRole exact，避开粘性提示文案）
  view_result_btn: button「查看结果」（exact，过程页引导空态出口）
  back_config: 结果态 button / 返回配置 /（现场 innerText 拼读「返回配置重新分析」；不可见时 fallback goto 重置）
  board: data-testid=svc-eco-shortboard-board / 「全周期服务链路」
  no_stages: data-testid=svc-eco-shortboard-no-stages（诚实空态）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
    note: 自含重置进配置态（P8）；首次分析、改选重析、结果断言分 3 条 expect 链式推进
expect:
  - note: 前置成立（用例前置 1）——选定「新一代信息技术」显式点「开始分析」完成任务，并显式点「查看结果」进结果态（链路图区承载可见）；捕获首个 task_id 备用
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('http://10.50.69.111:30892/service/chain-analysis?workspace=chain&tab=chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('未见「开始分析」按钮'); if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）'); const pollTask=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null }; await start.first().click({ timeout: 8000 }); let taskA=await pollTask(10000); if (!taskA) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); taskA=await pollTask(12000) } }; if (!taskA) throw new Error('首次分析未进过程态（含 1 次诚实重试）: '+page.url()); let body=''; for (let i=0;i<30;i++) { await page.waitForTimeout(2000); body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body) || /view=result/.test(page.url())) break } const vr=page.getByRole('button', { name: '查看结果', exact: true }); if (!/view=result/.test(page.url())) { if (!(await vr.count())) throw new Error('完成后未见「查看结果」出口'); await vr.first().click({ timeout: 8000 }); await page.waitForTimeout(2500) } for (let i=0;i<10;i++) { if (/view=result/.test(page.url())) break; await page.waitForTimeout(1000) }; if (!/view=result/.test(page.url())) throw new Error('首次分析未进结果态: '+page.url()); await expect(page.getByText('全周期服务链路').first()).toBeVisible({ timeout: 8000 }); await page.evaluate((v)=>{ try { sessionStorage.setItem('__p013TaskA', v) } catch(e) {} window.__p013TaskA=v; }, taskA)
  - note: 用例步骤 2（核心重算动作）——结果态点「返回配置」回配置态，改选「新能源」后再次显式点「开始分析」发起新任务：新 task_id ≠ 首次、URL industry 与 analysis_fp 切到新产业（INB1703），旧产业指纹不在发起态 URL 残留
    assert: |-
      const taskA=((await page.evaluate(()=>window.__p013TaskA||sessionStorage.getItem('__p013TaskA')).catch(()=>null))||''); if (!taskA) throw new Error('前置缺失：未捕获首个 task_id'); const back=page.getByRole('button', { name: /返回配置/ }); let backOk=false; if (await back.count()) { try { await back.first().click({ timeout: 8000 }); await page.waitForTimeout(1500); backOk=true } catch {} } if (!backOk) { const t=page.getByText('返回配置'); if (await t.count()) { try { await t.first().click({ timeout: 5000 }); await page.waitForTimeout(1500); backOk=true } catch {} } }; let atConfig=false; for (let i=0;i<8;i++) { const u=page.url(); const b=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/view=processing|view=result/.test(u) && /分析配置/.test(b)) { atConfig=true; break } await page.waitForTimeout(1000) }; if (!atConfig) { await page.goto('http://10.50.69.111:30892/service/chain-analysis?workspace=chain&tab=chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) }; const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false) && await close2.first().isEnabled().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新能源' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/^新能源$/.test(echo.replace(/\s+/g,''))) throw new Error('改选后回显非「新能源」: "'+echo+'"'); if (/新一代信息技术/.test(echo)) throw new Error('改选后残留旧集群回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('配置态未见「开始分析」按钮'); await expect(start.first()).toBeEnabled({ timeout: 8000 }); const pollTask2=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u) || /[?&]view=result/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null }; await start.first().click({ timeout: 8000 }); let taskB=await pollTask2(10000); if (!taskB) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); taskB=await pollTask2(12000) } }; if (!taskB) throw new Error('改选后再次开始分析未发起任务（含 1 次诚实重试）: '+page.url()); if (taskB===taskA) throw new Error('新任务 task_id 与首次相同（变更条件未按新指纹 CREATE，疑复用旧任务）: '+taskB); const u2=page.url(); if (!/[?&]industry=INB1703/.test(u2)) throw new Error('新任务 URL industry 非新能源 INB1703: '+u2); if (/INB1701/.test(u2)) throw new Error('发起态 URL 残留旧产业指纹 INB1701: '+u2); if (!/analysis_fp=svc%7Cchain%7CINB1703|analysis_fp=svc\|chain\|INB1703/.test(u2)) { await page.evaluate(()=>{ window.__p013FpObserved='analysis_fp 未匹配 INB1703 形态（observed）: '+document.location.search }) }; await page.evaluate((v)=>{ try { sessionStorage.setItem('__p013TaskB', v) } catch(e) {} window.__p013TaskB=v; }, taskB)
  - note: 预期1 链路图与环节数据按新产业重算 + 预期2 上一产业数值与标注不残留——新任务完成后显式「查看结果」进结果态：URL task_id/industry 指向新任务新产业、零旧 task_id 零旧产业指纹；双分支：有据验新 task 结果渲染（环节行+机构数/深度+新能源上下文），无据（当前环境）验诚实空态且旧 task_id 与旧产业名正文零出现，不造伪数据
    assert: |-
      const taskA=((await page.evaluate(()=>window.__p013TaskA||sessionStorage.getItem('__p013TaskA')).catch(()=>null))||''); const taskB=((await page.evaluate(()=>window.__p013TaskB||sessionStorage.getItem('__p013TaskB')).catch(()=>null))||''); if (!taskA||!taskB) throw new Error('前置缺失：task_id 未捕获 A='+taskA+' B='+taskB); let body=''; for (let i=0;i<30;i++) { await page.waitForTimeout(2000); body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body) || /view=result/.test(page.url())) break } if (!/view=result/.test(page.url())) { const vr=page.getByRole('button', { name: '查看结果', exact: true }); if (!(await vr.count())) throw new Error('新任务完成后未见「查看结果」出口'); await vr.first().click({ timeout: 8000 }); await page.waitForTimeout(2500) } for (let i=0;i<10;i++) { if (/view=result/.test(page.url())) break; await page.waitForTimeout(1000) }; if (!/view=result/.test(page.url())) throw new Error('新任务未进结果态: '+page.url()); const u=page.url(); if (!u.includes('task_id='+taskB)) throw new Error('结果态 URL task_id 非新任务 '+taskB+': '+u); if (u.includes('task_id='+taskA)) throw new Error('结果态 URL 残留旧 task_id '+taskA+': '+u); if (!/[?&]industry=INB1703/.test(u)) throw new Error('结果态 URL industry 非新能源 INB1703: '+u); if (/INB1701/.test(u)) throw new Error('结果态 URL 残留旧产业指纹 INB1701: '+u); await expect(page.getByText('全周期服务链路').first()).toBeVisible({ timeout: 8000 }); const bodyR=((await page.locator('main').first().innerText().catch(()=>''))||''); if (bodyR.includes(taskA)) throw new Error('结果态正文残留旧任务 ID '+taskA+': '+bodyR.slice(0,240)); if (bodyR.includes('新一代信息技术')) throw new Error('结果态正文残留旧产业名（新一代信息技术）: '+bodyR.slice(0,240)); const stations=await page.locator('[data-stage-id], .svc-eco-metro-station]').count().catch(()=>0); if (stations>0) { if (!/机构数|在库/.test(bodyR)) throw new Error('有环节行但未见机构数承载: '+bodyR.slice(0,240)); if (!/服务深度|深度/.test(bodyR)) throw new Error('有环节行但未见平均服务深度承载: '+bodyR.slice(0,240)); if (!/新能源/.test(bodyR)) throw new Error('有环节行但未见新产业上下文（新能源）: '+bodyR.slice(0,240)) } else { if (!/该产业服务供给数据不足，暂无法判定|当前快照没有环节行|不补固定六卡|不补六张空卡/.test(bodyR)) throw new Error('无环节行应认诚实空态（不造伪数据）: '+bodyR.slice(0,240)) }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若改选后二次发起复用旧 task（同 task_id）或结果态仍显旧产业数据，记红归 00697 本条缺陷；当天同条件复用口径归 00699 / Q-ANALYSIS-01 域
as_built_note: 'env-gate overall=pass；00697 B 档双分支（实跑非 skip）。链路照用例步骤直译：选定集群A（新一代信息技术）完成一次分析→显式「查看结果」进结果态（用例前置 1「结果态可见」；D1 as-built：生成结束停过程页须显式点查看结果，不自动跳转）→结果态点「返回配置」回配置态→改选集群B（新能源）→再次显式点「开始分析」。D1 文案/结构 as-built：结果态按钮现场 innerText 拼读「返回配置重新分析」（按钮级形态 observed-执行时记录，locator 用 /返回配置/ 正则容错、不可见时 fallback goto 重置配置态，sessionStorage 保底传 task_id 防 goto 丢 window，P8 自含）；结果态提示「当前快照不随切产业重算。点『重新分析』才按新指纹 CREATE」与用例「显式重析」同语义（变更条件显式重析与 00699 互证）。重算证据锚=URL 指纹：新 task_id ≠ 首次 + industry=INB1703 + analysis_fp=svc|chain|INB1703 + INB1701 零残留（task_id 只断言新旧关系与产业指纹，不钉死号段，命中现场记 observed）。D4 环境债（沿用 D4-SVCSHORT-STAGES-EMPTY 口径，无独立 ticket）：环境无环节行→「重算出新图」大概率命中诚实空——双分支：有据分支验新 task 结果渲染（环节行+机构数/深度+新能源上下文）；无据分支（当前环境实跑预期）验诚实空态「该产业服务供给数据不足，暂无法判定」+旧 task_id 正文零出现+旧产业名正文零出现，不造伪数据不盲 skip；「上一产业数值与标注不残留」无据下由「零旧 task_id + 零旧产业名/指纹 + 诚实空不造假」组合承担。user_id=guest 共享账号：两次发起各含 1 次诚实重试（仅当 URL 仍无 view= 且按钮可见可用时再点，非伪造绿，sz P0-07 同款）。勘察无结果态开放项 1：结果态实况（返回配置按钮形态/诚实空文案/task 序列）随 run observed 落盘。对比篮可见才关。列表 2 空格缩进。'
