title: 分析记录 Tab 呈现历史任务且与分析 Tab 互斥；当天同条件已成功再发起应复用不重跑（graph 侧同型缺陷红对照：chain 侧现场形态实测定档）；切回后产业与页面状态保留（Tab 内切换非菜单切换）
story: US-SVC-ECO-01
entry_id: svc-chain-shortboard
ticket: D3-SVCSHORT-SAME-DAY-REUSE-MISSING
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G2 合法选齐后「开始分析」enabled；G5 记录 Tab ≥3 条 shortboard 已完成可「查看结果」）
  - 前置（expect[0] 自含构造）：本会话 fresh 起一条当天已成功任务（svc|chain|INB1701 同指纹），作为「当天已成功记录」与复用判定的同指纹基准
  - 本环境 user_id=guest 共享账号，并行会话可能同时起任务；本条断言锚定本会话 POST 计数与本会话 task_id，免疫他端噪声
locators:
  cluster_select: .industry-catalog-select（P7 点可见 view 容器，选项挂 .arco-trigger-popup:visible）
  start_btn: button「开始分析」（getByRole exact，避开粘性提示文案）
  tab_records: tab「分析记录」（[data-tab-key=records]）
  tab_chain: tab「服务链短板分析」（[data-tab-key=chain]）
  records_row: tr 含 task_id（已完成 / shortboard / 查看过程查看结果）
  view_result_btn: 记录行/过程引导态「查看结果」
  back_btn: 结果态「返回配置重新分析」（locator 正则 /返回配置/ 容错）
  board: 「全周期服务链路」（chain 结果态链路图区锚）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
    note: 自含重置进 chain 配置态（P8）；首发构造、列表核验、复用尝试、记录查看结果、切回保留分 5 条 expect 链式推进（graph P0-19 同款）
expect:
  - note: 前置成立（用例前置「无则先发起一次」）——选定「新一代信息技术」显式点「开始分析」发起当天首条任务，完成停过程页引导态「分析结果已生成」；捕获 task_id 与 POST 计数基准备用
    assert: |-
      globalThis.__p015Posts=[];
      page.on('request', (r)=>{ if (r.method()==='POST' && /\/topicAsync\/topic\/v1\/analysis\/tasks\/?(\?|$)/.test(r.url())) globalThis.__p015Posts.push(r.url().slice(0,120)); });
      const close=page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      if (/view=processing|view=result/.test(page.url())) { await page.goto('http://111.198.38.90:50892/service/chain-analysis?workspace=chain&tab=chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) };
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 });
      const sel=page.locator('.industry-catalog-select').first();
      await sel.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim();
      if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"');
      const start=page.getByRole('button', { name: '开始分析', exact: true });
      if (!await start.count()) throw new Error('未见「开始分析」按钮');
      if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）');
      const pollTask=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null };
      await start.first().click({ timeout: 8000 });
      let task=await pollTask(10000);
      if (!task) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); task=await pollTask(12000) } };
      if (!task) throw new Error('首发分析未进过程态（含 1 次诚实重试）: '+page.url());
      let body='';
      for (let i=0;i<12;i++) { await page.waitForTimeout(1000); body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body)) break }
      if (!/分析结果已生成/.test(body)) throw new Error('过程页未出现完成引导态: '+page.url());
      const posts0=globalThis.__p015Posts||[];
      if (posts0.length<1) throw new Error('首发 POST 未捕获（计数='+posts0.length+'）');
      globalThis.__p015FirstTaskId=task;
      globalThis.__p015LandedId=task;
  - note: 预期①——「分析记录」Tab 呈现历史分析任务列表（表头 任务/类型/状态/创建时间/操作 + ≥1 行已完成）且与分析 Tab 互斥（记录 Tab 无「开始分析」入口、无配置空态；本会话当天任务在列表）
    assert: |-
      const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true }));
      await expect(rec.first()).toBeVisible({ timeout: 8000 });
      await rec.first().click({ timeout: 8000 });
