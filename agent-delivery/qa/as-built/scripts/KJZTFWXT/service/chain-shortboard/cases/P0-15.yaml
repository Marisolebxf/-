      if (ids.length<1) throw new Error('记录列表无任务行');
      const first=String(globalThis.__p015FirstTaskId||'');
      if (!ids.some((id)=>id===first)) throw new Error('记录列表缺本条当天任务 '+first+'（最新: '+ids.slice(0,5).join(',')+'）');
      if (/请先确认产业条件/.test(b1)) throw new Error('记录 Tab 泄漏配置区空态（与分析 Tab 不互斥）');
      const startN=await page.getByRole('button', { name: '开始分析', exact: true }).count();
      if (startN!==0) throw new Error('记录 Tab 仍存在「开始分析」入口 ×'+startN+'（与分析 Tab 不互斥）');
      globalThis.__p015RecIds=ids;
  - note: 预期②核心——当天同条件已成功记录再发起应直接打开既有结果不重跑（Q-ANALYSIS-01）；参照 graph 侧 P0-19 实测同型红（D3-SVCGRAPH-SAME-DAY-REUSE-MISSING，同日同指纹 028→029 仍 POST 新建），本条 chain 侧同口径验证：回配置态后同条件（新一代信息技术）再点「开始分析」——若同形态（POST 新建+落点新 task）按用例口径跑必红挂 chain 侧票 D3-SVCSHORT-SAME-DAY-REUSE-MISSING（与 graph 票并注同根因）；若复用拦截生效（0 新 POST+直接打开既有结果）则与 graph 形成对照缩小根因范围，记 pass
    assert: |-
      const mainTab=page.locator('[role=tab][data-tab-key="chain"]').or(page.getByRole('tab', { name: '服务链短板分析', exact: true }));
      await mainTab.first().click({ timeout: 8000 });
      await page.waitForTimeout(1800);
      const close2=page.locator('button[aria-label="关闭对比篮"]');
      if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      if (/tab=records/.test(page.url())) throw new Error('未切回分析 Tab: '+page.url());
      let guard=0;
      while (guard++<5) {
        const uc=page.url();
        const bc=((await page.locator('main').first().innerText().catch(()=>''))||'');
        if (!/view=processing|view=result/.test(uc) && !/task_id=/.test(uc) && /分析配置/.test(bc)) break;
        if (/分析结果已生成/.test(bc)) {
          const vr=page.getByRole('button', { name: '查看结果', exact: true }).first();
          if (await vr.count()) { await vr.click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(2000); continue; }
        }
        const back=page.getByRole('button', { name: /返回配置重新分析|返回配置/ }).first();
        if (await back.count()) { await back.click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1800); continue; }
        break;
      }
      const u1=page.url();
      const body=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (/view=processing|view=result/.test(u1)) throw new Error('未回配置态（复用尝试前置失败）: '+u1);
      if (/task_id=/.test(u1)) throw new Error('配置态 URL 残留 task_id（复用尝试前置失败）: '+u1);
      if (!/分析配置/.test(body)) throw new Error('配置区缺失（复用尝试前置失败）');
      const selVal=(((await page.locator('.industry-catalog-select .arco-select-view-value').first().innerText().catch(()=>''))||'')).trim();
      if (!/新一代信息技术/.test(selVal)) {
        const sel=page.locator('.industry-catalog-select').first();
        await sel.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1500);
      }
      const postsBefore=(globalThis.__p015Posts||[]).length;
      const start=page.getByRole('button', { name: '开始分析', exact: true });
      if (!await start.count()) throw new Error('配置态未见「开始分析」按钮（前置失败）');
      if (!await start.first().isEnabled()) throw new Error('同条件再发起时「开始分析」不可点（前置失败）');
      await start.first().click({ timeout: 8000 });
      await page.waitForTimeout(3000);
      const toast=(((await page.locator('.arco-message, .arco-message-list').first().innerText().catch(()=>''))||'')).trim();
      const m2=/[?&]task_id=(SVC-\d{8}-\d{1,4})/.exec(page.url());
      const landed=m2?m2[1]:null;
      if (landed) globalThis.__p015LandedId=landed;
      const first2=String(globalThis.__p015FirstTaskId||'');
      const newPosts=(globalThis.__p015Posts||[]).length-postsBefore;
      const evidence={ newPosts, landed, first: first2, toast, reuseHit: (newPosts===0) };
      globalThis.__p015ReuseEvidence=JSON.stringify(evidence);
      const errs=[];
      if (newPosts>0) errs.push('同日同条件再发起仍 POST 新建任务 ×'+newPosts+'（应 0 次，直接复用既有结果）');
      if (landed && first2 && landed!==first2) errs.push('落点任务 '+landed+' ≠ 当天既有 '+first2+'（应直接打开既有结果）');
      if (/任务已创建/.test(toast)) errs.push('toast「任务已创建」为新建而非复用提示');
      if (errs.length) throw new Error('D3-SVCSHORT-SAME-DAY-REUSE-MISSING: '+errs.join('; ')+'（Q-ANALYSIS-01 口径：当天同条件已成功应直接打开既有结果不重跑；graph 侧同型缺陷 D3-SVCGRAPH-SAME-DAY-REUSE-MISSING 并注同根因）');
  - note: 步骤②——打开一条当天已成功记录：记录行「查看结果」直达既有结果壳（全周期服务链路）且不重跑（POST 增量 0）；复用分支落结果态（try 时已 0 POST 打开）与再发起红分支（落新任务过程页须点查看结果）双形态容错
    assert: |-
      const rec2=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true }));
      await rec2.first().click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{});
      await page.waitForTimeout(2200);
      const close3=page.locator('button[aria-label="关闭对比篮"]');
      if (await close3.count() && await close3.first().isVisible().catch(()=>false)) { try { await close3.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      const wantId=String(globalThis.__p015LandedId||globalThis.__p015FirstTaskId||'');
      let row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: wantId }).first();
      if (!(await row.count())) {
        const todayRe=new RegExp('SVC-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-\\d+');
        row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: todayRe }).first();
      }
      if (!(await row.count())) throw new Error('未找到本条当天记录行（wantId='+wantId+'）');
      const rowText=((await row.innerText().catch(()=>''))||'');
      if (!/已完成/.test(rowText)) throw new Error('目标记录行非已完成: '+rowText.slice(0,100));
      const vr=row.getByRole('button', { name: '查看结果', exact: true });
      if (!(await vr.count())) throw new Error('记录行无「查看结果」按钮');
      if (!(await vr.first().isEnabled())) throw new Error('记录行「查看结果」不可点（已完成应可点）');
      const postsBefore2=(globalThis.__p015Posts||[]).length;
      await vr.first().click({ timeout: 8000 });
      await page.waitForTimeout(2200);
      let u=page.url();
      let bodyR='';
      for (let i=0;i<12;i++) { bodyR=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(bodyR)) { const vr2=page.getByRole('button', { name: '查看结果', exact: true }).first(); if (await vr2.count()) { await vr2.click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(2200); u=page.url(); continue } } if (/view=result/.test(u)) break; await page.waitForTimeout(1000); u=page.url() }
      if (!/view=result/.test(u)) throw new Error('查看结果后未落结果态: '+u);
      if (wantId && !u.includes(wantId)) throw new Error('结果态 task_id 非「'+wantId+'」: '+u);
      await expect(page.getByText('全周期服务链路').first()).toBeVisible({ timeout: 8000 });
      const b2=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (!/返回配置重新分析|返回配置/.test(b2)) throw new Error('结果态「返回配置」出口缺失');
      if ((globalThis.__p015Posts||[]).length-postsBefore2!==0) throw new Error('查看结果触发了新任务创建（应 0 POST）');
  - note: 步骤③+预期③——切回「服务链短板分析」Tab 后产业条件与页面状态保留（Tab 内切换非菜单切换，patchQuery merge 语义；D3-SVCSHORT-WS-SWITCH-STATE-LOST 为菜单跨工作区硬替换形态，Tab 切换不撞该票，若 chain 侧 Tab 切换也丢态另开票）；记录列表不同屏=与分析 Tab 互斥复证
    assert: |-
      const main2=page.locator('[role=tab][data-tab-key="chain"]').or(page.getByRole('tab', { name: '服务链短板分析', exact: true }));
      await main2.first().click({ timeout: 8000 });
      await page.waitForTimeout(2200);
      const close4=page.locator('button[aria-label="关闭对比篮"]');
      if (await close4.count() && await close4.first().isVisible().catch(()=>false)) { try { await close4.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      const u=page.url();
      if (/tab=records/.test(u)) throw new Error('未切回分析 Tab: '+u);
      if (!/tab=chain/.test(u)) throw new Error('分析 Tab URL 异常: '+u);
      const b3=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (/任务[\s\S]*?类型[\s\S]*?创建时间[\s\S]*?操作/.test(b3)) throw new Error('切回后记录列表仍同屏（与分析 Tab 不互斥）');
      const selVal2=(((await page.locator('.industry-catalog-select .arco-select-view-value').first().innerText().catch(()=>''))||'')).trim();
      const errs2=[];
      if (!/新一代信息技术/.test(selVal2)) errs2.push('产业条件未保留(实际:「'+selVal2+'」)');
      const keptState=/view=result/.test(u)?'result':(/view=processing/.test(u)||/分析结果已生成|生成中/.test(b3)?'processing/result-body':'config');
      if (keptState==='config' && !/分析配置/.test(b3)) errs2.push('页面状态未保留（既非结果/过程态也无配置区）');
      if (!/industry=/.test(u)) errs2.push('URL industry 参数丢失');
      if (errs2.length) throw new Error('Tab 内切换丢态（非 D3-SVCSHORT-WS-SWITCH-STATE-LOST 菜单硬替换域，若红另开 chain 侧 Tab 切换票）: '+errs2.join('; ')+'（Tab 切换 patchQuery merge 语义应保留）');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；复用判定若本会话 POST ≥2 次，先核对 globalThis.__p015Posts 明细排除共享账号并行噪声（他端任务不进本页 POST 计数）；Tab 切换丢态红另开新票（勿挂 D3-SVCSHORT-WS-SWITCH-STATE-LOST）
as_built_note: |-
  D3 缺陷预设红（ticket D3-SVCSHORT-SAME-DAY-REUSE-MISSING，与 graph 侧 D3-SVCGRAPH-SAME-DAY-REUSE-MISSING 并注同根因：源码闸门 decideAnalysisTaskGate 存在但 graph 侧失效疑指纹不等值，chain 侧形态本条实测定档）+ D1 as-built 口径差。用例 00699（P1）三点预期译法：
  ① 记录列表 + 与分析 Tab 互斥——graph P0-19 同型现场通过（记录表头 任务/类型/状态/创建时间/操作；记录 Tab 无「开始分析」入口/无配置空态；切回后列表不同屏），chain 侧同 workspace 共用壳预期可断言必绿。
