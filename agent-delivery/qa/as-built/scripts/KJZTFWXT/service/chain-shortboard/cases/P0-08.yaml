locators:
  deep_link: 查看结果深链（workspace=chain&tab=records&view=result&demo_state=result&task_id）
  station: data-stage-id / .svc-eco-metro-station（allow_skip 探测锚）
  stage_drawer: .arco-drawer（环节详情面板；抽屉断言限定 .arco-drawer）
  drawer_close: .arco-drawer .arco-drawer-close-btn
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=records&view=result&demo_state=result&task_id=SVC-20261015-010
    note: 结果态深链恢复（P0-07 探针实测原样 URL，SVC-20261015-010；allow_skip 在此后探测环节卡）
expect:
  - note: 深链恢复结果态且环节卡可见（allow_skip 锚转实前提；URL 含 view=result）
    assert: |-
      await expect(page).toHaveURL(/view=result/);
      const n = await page.locator('[data-stage-id], .svc-eco-metro-station').count();
      if (n < 1) throw new Error('环节卡不可见，allow_skip 锚未转实: n=' + n)
  - note: 鼠标点击任一环节卡打开环节详情面板（Drawer 可见，含服务类型说明与环节内机构列表承载；目标态口径，D3 修复后转绿）
    assert: |-
      const st = page.locator('[data-stage-id], .svc-eco-metro-station').first();
      await st.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(page.locator('.arco-drawer').first()).toBeVisible({ timeout: 8000 });
      const txt = ((await page.locator('.arco-drawer').first().innerText().catch(() => '')) || '');
      if (!/服务类型/.test(txt)) throw new Error('环节详情抽屉未见服务类型说明: ' + txt.slice(0, 200));
      if (!/机构/.test(txt)) throw new Error('环节详情抽屉未见环节内机构列表承载: ' + txt.slice(0, 200))
  - note: 键盘可达——关闭面板后焦点移至该环节卡按 Enter 同样打开面板（交互规范口径；目标态口径）
    assert: |-
      const closeBtn = page.locator('.arco-drawer .arco-drawer-close-btn').first();
      if (await closeBtn.count()) { await closeBtn.click({ timeout: 3000 }).catch(() => {}); await page.waitForTimeout(600); }
      const st2 = page.locator('[data-stage-id], .svc-eco-metro-station').first();
      await st2.focus();
      await page.keyboard.press('Enter');
      await page.waitForTimeout(800);
      await expect(page.locator('.arco-drawer').first()).toBeVisible({ timeout: 8000 })
  - note: 机构画像可从面板机构列表打开（复用 R1 抽屉 CT-SVC-ORG-02；面板 DOM 形态 D3 修复后校准转机检，先人工）
    manual: true
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
