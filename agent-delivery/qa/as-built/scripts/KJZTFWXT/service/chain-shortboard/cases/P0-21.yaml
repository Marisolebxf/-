id: P0-21
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00704
priority: P1
tier: B
title: 异常-供给不足判定（P1）——极端供给不足时识别面板诚实提示「该产业服务供给数据不足，暂无法判定」且链路图保留结构（壳+声明不白屏、不补六卡）
story: US-SVC-ECO-02
entry_id: svc-chain-shortboard
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G5 分析记录已完成可「查看结果」；写结果态闸门已过）
  - 用例前置「可构造服务供给数据不足的产业集群」——当前环境默认即此态（resultData=null / 零环节行）；有环节行后须另找供给不足对象，否则本条红（非假绿）
  - 本环境 user_id=guest 共享账号，遇非本条异常加一次诚实重试记 observed
locators:
  tab_records: tab「分析记录」
  view_result_btn: 「查看结果」（分析记录；P0-06 同款优先 hist）
  board: 「全周期服务链路」/ SectionPanel 壳
  no_stages: data-testid=svc-eco-shortboard-no-stages（alert title=该产业服务供给数据不足，暂无法判定）
  disclaimer: data-testid=svc-eco-shortboard-disclaimer / 地铁轨道图只认 payload 声明
  problems_panel_shell: 「瓶颈堵点识别」面板壳（极端态仍保留）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=chain&tab=chain
    note: 自含重置进 chain 配置态（P8）；结果态与供给不足断言在 expect 内推进（优先分析记录查看结果）
expect:
  - note: 选定服务供给数据不足的产业集群并点击「开始分析」等待完成——as-built：当前环境经「分析记录→查看结果」即可达零环节行结果态（与用例步骤同终态；P0-06 同款 hist 优先；按钮按 isDisabled/class 自检勿用 hasNot 子孙过滤）。进入 view=result 且链路图区壳可见
    assert: |-
      await page.waitForTimeout(1500);
      const close0=page.locator('button[aria-label="关闭对比篮"]');
      if (await close0.count() && await close0.first().isVisible().catch(()=>false) && await close0.first().isEnabled().catch(()=>false)) { try { await close0.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      if (/view=processing|view=result/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/chain-analysis?workspace=chain&tab=chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) };
      const rec=page.getByRole('tab', { name: '分析记录', exact: true });
      await expect(rec).toBeVisible({ timeout: 8000 });
      await rec.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{});
      await page.waitForTimeout(2000);
      const pickView=async ()=>{
        const btns=page.getByRole('button', { name: /查看结果/ });
        const n=await btns.count();
        for (let i=0;i<n;i++) {
          const b=btns.nth(i);
          const dis=await b.isDisabled().catch(()=>true);
          const cls=((await b.getAttribute('class').catch(()=>''))||'');
          if (!dis && !/arco-btn-disabled/.test(cls) && (await b.isVisible().catch(()=>false))) { await b.click({ timeout: 8000 }); return true }
        }
        const plain=page.locator('button.arco-btn:not(.arco-btn-disabled):not([disabled])').filter({ hasText: /查看结果/ });
        if (await plain.count()) { await plain.first().click({ timeout: 8000 }); return true }
        return false;
      };
      let clicked=await pickView();
      if (!clicked) {
        await page.waitForTimeout(2500);
        clicked=await pickView();
      }
      if (!clicked) {
        const deep='https://edu.itic-sci.com/tts/svcz/service/chain-analysis?workspace=chain&tab=chain&industry=INB1701&view=result&demo_state=result&task_id=SVC-20261015-066';
        console.log('[P0-21 observed] hist 无可用查看结果 → 深链已完成任务 '+deep);
        await page.goto(deep, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(3500);
      } else {
        await page.waitForTimeout(3000);
        if (/view=processing/.test(page.url()) && /查看结果/.test(((await page.locator('main').first().innerText().catch(()=>''))||''))) {
          await pickView();
          await page.waitForTimeout(2500);
        }
      }
      if (!/view=result/.test(page.url())) throw new Error('未落结果态: '+page.url());
      await expect(page.getByText('全周期服务链路').first()).toBeVisible({ timeout: 8000 });
      const stations=await page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(()=>0);
      globalThis.__p021Stations=stations;
      console.log('[P0-21 observed] 结果态 stations='+stations+' url='+page.url());
  - note: 预期①识别面板提示「该产业服务供给数据不足，暂无法判定」——源码 SvcChainShortboardBoard.vue：!hasStages → a-alert title 该文案 + data-testid=svc-eco-shortboard-no-stages（链路区）且瓶颈堵点识别区同文案；有环节行则非本条对象须红（勿用 no-hit/判定行伪绿）
    assert: |-
      const stations=Number(globalThis.__p021Stations||0);
      const body=((await page.locator('main').first().innerText().catch(()=>''))||'');
      const noStages=page.locator('[data-testid="svc-eco-shortboard-no-stages"]');
      const noStagesN=await noStages.count().catch(()=>0);
      const noStagesVis=noStagesN>0 && (await noStages.first().isVisible().catch(()=>false));
      if (stations>0) {
        throw new Error('有环节行非 00704 供给不足对象（stations='+stations+'）；须另构供给不足产业或回炉，禁止用有据结果伪绿: '+body.slice(0,240));
      }
      if (!(noStagesVis || /该产业服务供给数据不足，暂无法判定/.test(body))) {
        throw new Error('未见供给不足诚实提示（testid/文案）: noStages='+noStagesN+' body='+body.slice(0,280));
      }
      if (/当前演示规则下未发现明显短板/.test(body) && !/该产业服务供给数据不足，暂无法判定/.test(body)) {
        throw new Error('误命中 00703 no-hit，非 00704 供给不足');
      }
      console.log('[P0-21 observed] 预期①供给不足提示 ok noStagesVis='+noStagesVis+' noStagesN='+noStagesN);
  - note: 预期②极端态下链路图保留结构——全周期服务链路壳+地铁轨道图/只认 payload 声明仍可见；no-stages alert 嵌在板内非白屏；不补固定六环节假卡；瓶颈堵点识别面板壳仍在
    assert: |-
      const body=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (!/全周期服务链路/.test(body)) throw new Error('链路图壳标题丢失（未保留结构）');
      if (!/地铁轨道图|只画当前结果快照|不补六张空卡|只认 payload/.test(body)) throw new Error('链路图声明段丢失（未保留结构）: '+body.slice(0,280));
      const noStagesVis=await page.locator('[data-testid="svc-eco-shortboard-no-stages"]').first().isVisible().catch(()=>false);
      if (!noStagesVis && !/该产业服务供给数据不足，暂无法判定/.test(body)) throw new Error('板内诚实空承载丢失');
      const six=['研发支持','技术转移与知识产权','中试与检测','孵化育成','产业化推广','投融资与人才'];
      if (six.every((n)=>body.includes(n))) throw new Error('极端供给不足不应补固定六环节假卡');
      if (!/瓶颈堵点识别/.test(body)) throw new Error('识别面板壳丢失（未保留结构）');
      const stations=await page.locator('[data-stage-id], .svc-eco-metro-station').count().catch(()=>0);
      if (stations>0) throw new Error('保留结构≠渲染环节卡；零环节行时不应出现站卡: n='+stations);
      console.log('[P0-21 observed] 预期②链路图保留结构 ok（壳+声明+板内诚实空+零假六卡）');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6；前置查看结果瞬时失败按共享账号加一次诚实重试记 observed；预期①红=未见供给不足文案/testid 或误有环节行；预期②红=壳/声明丢失、白屏、或补六卡
as_built_note: |-
  00704 B 档实跑（非金样；tier B；用例优先级 P1，脚本 id 母表顺延 P0-21；**无 allow_skip**）。
  用例预期：①识别面板「该产业服务供给数据不足，暂无法判定」；②极端态下链路图保留结构。前置须可构造供给不足产业（开放项 3）。
  落局（2026-10-15 无头实勘 _probe-p021.json + 自检 run=20261015-50892-chain-shortboard-p021-self-r2 pass=1/1）：
  ① hist「查看结果」进 SVC-20261015-066：stations=0、no-stages testid 可见、文案命中、壳+声明保留、零假六卡 → constructable_00704=true（与 P0-19/20「缺对象须 skip」相反；本条无 allow_skip）。
  ② 源码锚（只读）：SvcChainShortboardBoard.vue !hasStages → 链路区 alert title+testid=svc-eco-shortboard-no-stages；瓶颈区同 title；壳=「全周期服务链路」+ disclaimer。
  ③ D1：记录按钮点选用 isDisabled/class 自检（勿 hasNot 子孙过滤误点 disabled）；hist 瞬时无可用时深链回落同日已完成 task（探针已证），不钉死号段作业务期望。
  ④ 与 00702/00703 边界：00702=有行 count=0；00703=有行 no-hit；00704=无行全板诚实空。D4-SVCSHORT-STAGES-EMPTY 对本条是可测对象；有环节行后须另构供给不足产业，禁止伪绿。
  脚本结构：expect[0] hist→深链回落；expect[1]①；expect[2]②。viewport 1920×1080@1。列表 2 空格缩进。
