id: FUNC-03895
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03895
priority: P0
tier: B
title: 环节详情进入短板分析
story: US-SVC-PT-02
entry_id: svc-portal
preconditions:
  - 已打开服务机构产业分布（runner 会话前置 + Tab 切换）
locators:
  tab_ind: tab「服务机构产业分布」
  stage_rd: button.svc-portal-stage-card（含「研发与科研合作」且有家数）
  stage_link: .svc-portal-stage-card__link「环节详情」
  chain_tab: tab「服务链短板分析」（服务链短板分析页签）
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 点击「研发与科研合作」上的「环节详情」
expect:
  - note: 1、页面标题变为「服务链短板分析」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      await dismissBasket();
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('C2：门户深链 404，无法验产业分布页');
      }
      await expect(page).toHaveURL(/service-portal\/overview/, { timeout: 20000 });
      const tablist = page.locator('[aria-label="专题服务子导航"]');
      await tablist.getByRole('tab', { name: '服务机构产业分布', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 15000 });
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 8000 });
      const rdCard = page.locator('.svc-portal-stage-card').filter({ hasText: '研发与科研合作' }).first();
      const emptyRd = rdCard.locator('.svc-portal-stage-card__empty').filter({ hasText: '暂无覆盖' });
      if (await emptyRd.isVisible().catch(() => false)) {
        throw new Error('ENV-SVC-PORTAL-STAGE-RD-EMPTY：研发与科研合作环节无覆盖，无法点环节详情');
      }
      const cards = page.locator('.svc-portal-stage-card');
      if ((await cards.count()) === 0) {
        const noStages = page.getByText('暂无环节分布').first();
        if (await noStages.isVisible().catch(() => false)) {
          throw new Error('ENV-SVC-PORTAL-STAGE-EMPTY：stages[] 为空，无环节卡');
        }
        throw new Error('环节卡数量为 0');
      }
      await expect(rdCard).toBeVisible({ timeout: 8000 });
      const valueEl = rdCard.locator('.svc-portal-stage-card__value');
      if (!(await valueEl.isVisible().catch(() => false))) {
        throw new Error('ENV-SVC-PORTAL-STAGE-RD-EMPTY：研发与科研合作无家家数展示');
      }
      const link = rdCard.locator('.svc-portal-stage-card__link').filter({ hasText: '环节详情' });
      await expect(link).toBeVisible({ timeout: 5000 });
      await link.click({ timeout: 8000 });
      await expect(page).toHaveURL(/service\/chain-analysis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=chain/, { timeout: 5000 });
      const chainTablist = page.locator('[role="tablist"]').filter({ has: page.getByRole('tab', { name: '服务链短板分析' }) }).first();
      const titleTab = chainTablist.getByRole('tab', { name: '服务链短板分析', exact: true });
      await expect(titleTab).toBeVisible({ timeout: 10000 });
      await expect(titleTab).toHaveAttribute('aria-selected', 'true');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  前置与 03894/03896 同：goto /service-portal → Tab「服务机构产业分布」。openStage 整卡可点，用例写「环节详情」故点 .svc-portal-stage-card__link。
  落点 /service/chain-analysis?workspace=chain&segment=…；页面标题=WorkbenchTabs 选中 tab「服务链短板分析」（aria-label 服务链短板分析页签）。
  本条只验到达配置/结果壳，不点「开始分析」。登录与关内部评审由 runner 前置。
