priority: P0
tier: B
title: 环节代表机构下钻——点环节展开代表机构列表、点机构名开机构详情抽屉
story: US-SVC-PT-02
entry_id: svc-portal
allow_skip: true
allow_skip_target: '.svc-portal-stage-card'
skip_reason: >-
  落局④（环节区诚实空，无环节卡可点）：POST /svc/topic/v1/service-portal/industry-distribution
  实包 stages=[]（默认全产业与 industry=INB1701 两参皆空，_probe-p006c 2026-10-15 实证 status=200）；
  页面渲染诚实空文案「暂无环节分布。不发明六张环节卡。」（env-gate G4 stage_empty 2026-10-14 +
  本轮 _probe-p006/_probe-p006b/_probe-p006d 复探，含深链 ?industry=INB1701 冷进）；
  同接口 by_service_type 返回 6 行有数据，证明页面与接口链路通、仅环节维度无数据=环境数据债。
ticket: ENV-SVC-PORTAL-STAGE-EMPTY
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 前置「已进入产业分布页；已选定产业集群」由深链 ?industry=INB1701（新一代信息技术）自含承载
  - env-gate G4 stage_empty（2026-10-14）+ 本轮 _probe-p006/b/c/d 复探（2026-10-15）：本轮预期 verdict=n/a
locators:
  stage_section: heading「产业链全景 · 环节服务分布」
  stage_card: button.svc-portal-stage-card（aria-label 形如「<环节>：<N>家，点击进入分析侧」）
  stage_empty: a-empty「暂无环节分布。不发明六张环节卡。」
  org_entry: 展开列表内机构条目（main li 或 [class*=org]，现场校准）
  org_drawer: '.arco-drawer（X2 可视性断言；形态参考 chain-graph P0-24 机构画像抽屉，跨入口只读参考）'
steps:
  - action: goto
    target: /service-portal/industry-distribution?industry=INB1701
    note: 自含重置（P8）+ 承载用例前置「已进入产业分布页；已选定产业集群」；allow_skip 在本步后探测环节卡
expect:
  - note: 步骤①点击任一环节——该环节展开呈现代表机构列表（用例 01313 预期①）
    assert: |-
      const close = page.locator('button[aria-label="关闭对比篮"]');
      if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch (e) {} }
      await expect(page).toHaveURL(/service-portal\/industry-distribution/);
      await expect(page.getByRole('heading', { name: /产业链全景|环节服务分布/ })).toBeVisible({ timeout: 8000 });
      const cards = page.locator('.svc-portal-stage-card');
      await cards.first().waitFor({ state: 'visible', timeout: 8000 });
      const total = await cards.count();
      let pick = cards.first();
      for (let i = 0; i < total; i++) { const t = (await cards.nth(i).innerText().catch(() => '')) || ''; if (/\d+\s*家/.test(t)) { pick = cards.nth(i); break; } }
      const ariaBefore = (await pick.getAttribute('aria-label')) || '';
      console.log('[P0-06 observed] 点击环节卡: ' + ariaBefore + '（共 ' + total + ' 张）');
      await pick.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const orgRe = /大学|学院|研究所|研究院|实验室|中心|院|公司|事务所|集团/;
      let listSeen = false, carrier = '';
      const deadline = Date.now() + 6000;
      while (Date.now() < deadline && !listSeen) {
        const inCard = await pick.locator('li, [class*=org]').count().catch(() => 0);
        const repZone = await page.getByText(/代表机构/).count();
        const orgLis = await page.locator('main li').filter({ hasText: orgRe }).count();
        if (inCard > 0) { listSeen = true; carrier = '环节卡内列表 x' + inCard; }
        else if (repZone > 0 && orgLis > 0) { listSeen = true; carrier = '代表机构区条目 x' + orgLis; }
        else await page.waitForTimeout(300);
      }
      const urlAfter = page.url();
      const drawerNow = await page.locator('.arco-drawer').first().isVisible().catch(() => false);
      console.log('[P0-06 observed] 点击后 listSeen=' + listSeen + (carrier ? ' carrier=' + carrier : '') + ' url=' + urlAfter + ' drawer=' + drawerNow);
      if (!listSeen) throw new Error('D3-SVCPORTAL-STAGE-DRILL-MISSING: 点击环节后未见代表机构列表展开（点击后 url=' + urlAfter + '，抽屉可见=' + drawerNow + '）——用例 01313 预期①「该环节展开呈现代表机构列表」未承载');
  - note: 步骤②点击列表内任一机构名——机构详情抽屉打开（用例 01313 预期②；机构名不钉死，现场记 observed）
    assert: |-
      if (!/service-portal\/industry-distribution/.test(page.url())) throw new Error('D3-SVCPORTAL-STAGE-DRILL-MISSING: 预期①未成立（已离开产业分布页: ' + page.url() + '），步骤②无从执行');
      const orgRe2 = /大学|学院|研究所|研究院|实验室|中心|院|公司|事务所|集团/;
      const entry = page.locator('main li').filter({ hasText: orgRe2 }).first();
      await entry.waitFor({ state: 'visible', timeout: 6000 });
      const orgName = (((await entry.innerText().catch(() => '')) || '').split('\n')[0] || '').slice(0, 40);
      console.log('[P0-06 observed] 点击机构条目: ' + orgName);
      await entry.click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.locator('.arco-drawer').first()).toBeVisible({ timeout: 8000 });
      const dtxt = ((await page.locator('.arco-drawer').first().innerText().catch(() => '')) || '');
      console.log('[P0-06 observed] 抽屉正文头 160 字: ' + dtxt.slice(0, 160).replace(/\n/g, ' '));
      if (!dtxt.trim()) throw new Error('D3-SVCPORTAL-STAGE-DRILL-MISSING: 抽屉可见但正文为空——用例 01313 预期②「机构详情抽屉打开」未承载');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6；环节区诚实空命中 allow_skip → n/a 不判 Fail（归 ENV-SVC-PORTAL-STAGE-EMPTY，证据见 fixtures/scout/probe-p006*.json）；stages 数据到位后实跑红（无列表/无抽屉承载）挂 D3-SVCPORTAL-STAGE-DRILL-MISSING
