id: FUNC-03893
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03893
priority: P0
tier: B
title: 选定产业链后结论条回显
story: US-SVC-PT-01
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/overview
  - action: evaluate
    note: 选择产业「新一代信息技术」；选择产业链「半导体与集成电路」
expect:
  - note: 1、结论条以「半导体与集成电路」起头
    assert: |-
      const main = page.locator('main');
      await main.locator('.arco-cascader-view').first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await page.locator('.arco-trigger-popup:visible').getByText('新一代信息技术', { exact: true }).click();
      await page.waitForTimeout(400);
      await page.locator('.arco-trigger-popup:visible').getByText('半导体与集成电路', { exact: true }).click();
      await page.waitForTimeout(1200);
      const strip = page.locator('.ent-judgment-strip').first();
      await expect(strip).toBeVisible({ timeout: 8000 });
      const txt = (await strip.innerText()).trim();
      if (!/^「半导体与集成电路」/.test(txt)) {
        throw new Error('结论条未以「半导体与集成电路」起头: ' + txt.slice(0, 120));
      }
  - note: 2、结论条写明 KPI 未按产业切片
    assert: |-
      const txt = (await page.locator('.ent-judgment-strip').first().innerText()).trim();
      if (!/KPI 未按产业切片/.test(txt)) {
        throw new Error('结论条未写明 KPI 未按产业切片: ' + txt.slice(0, 160));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
