id: FUNC-03913
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03913
priority: P1
tier: B
title: 备选-再点已在对比篮
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 进入技术能力榜，点击一行「已在对比篮」
expect:
  - note: 1、按钮仍为「已在对比篮」
    assert: |-
      const tablist = page.locator('[aria-label="专题服务子导航"]');
      await tablist.getByRole('tab', { name: '服务机构技术能力', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/capability-rank/, { timeout: 15000 });
      await expect(page.getByRole('heading', { name: '服务机构技术能力', level: 1 }).first()).toBeVisible({ timeout: 8000 });
      let inBtn = page.locator('main').getByRole('button', { name: '已在对比篮', exact: true }).first();
      if (!(await inBtn.isVisible().catch(() => false))) {
        const join = page.locator('main').getByRole('button', { name: '加入对比篮', exact: true }).first();
        await expect(join).toBeVisible({ timeout: 20000 });
        await join.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        inBtn = page.locator('main').getByRole('button', { name: '已在对比篮', exact: true }).first();
      }
      await expect(inBtn).toBeVisible({ timeout: 8000 });
      await inBtn.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      await expect(inBtn).toHaveText('已在对比篮', { timeout: 8000 });
  - note: 2、提示该机构已在对比篮中
    assert: |-
      const toast = page.locator('.arco-message-content, .arco-message').filter({ hasText: /已在对比篮中/ });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
