id: FUNC-01323
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01323
priority: P1
tier: B
title: 机构详情地址参数分享恢复
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
expect:
  - note: 1、携带机构参数进入时自动打开对应机构抽屉
    assert: |-
      const dismissBasket = async (p) => {
        const close = p.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await p.waitForTimeout(300); } catch {}
        }
      };
      await dismissBasket(page);
      const szTab = page.locator('main [role="tab"]').filter({ hasText: /^深圳产业服务介绍$/ }).first();
      if (await szTab.count()) {
        await szTab.click({ timeout: 15000 });
      } else {
        await page.locator('main').getByText('深圳产业服务介绍', { exact: true }).first().click({ timeout: 15000 });
      }
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 15000 });
      const heading = page.getByRole('heading', { name: '重点产业服务机构', exact: true });
      await heading.scrollIntoViewIfNeeded();
      await expect(heading).toBeVisible({ timeout: 8000 });
      const cards = page.locator('button.svc-portal-keyorg-card');
      const n = await cards.count();
      if (n === 0) {
        const empty = await page.getByText(/暂无重点机构/).first().isVisible().catch(() => false);
        if (empty) {
          throw new Error('ENV-SVC-PORTAL-KEY-ORG-EMPTY：重点机构墙诚实空，无法点卡写 ?org= 验分享恢复（Q060）');
        }
        throw new Error('重点产业服务机构无卡片，无法构造含 org 的分享地址');
      }
      const pick = cards.first();
      const triggerAria = (await pick.getAttribute('aria-label')) || '';
      await pick.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const shareUrl = page.url();
      const orgId = (() => { try { return new URL(shareUrl).searchParams.get('org'); } catch (e) { return null; } })();
      if (!orgId) {
        throw new Error('D3-SVCPORTAL-ORG-SHARE: 点卡后地址栏未见 ?org=，用例分享前提未承载');
      }
      const page2 = await page.context().newPage();
      await page2.goto(shareUrl, { waitUntil: 'domcontentloaded' });
      await page2.waitForTimeout(1500);
      await dismissBasket(page2);
      const drawer = page2.locator('.arco-drawer').filter({ has: page2.locator('[data-testid="svc-portal-keyorg-drawer"]') }).first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      if (!/[?&]org=/.test(page2.url())) {
        await page2.close();
        throw new Error('D3-SVCPORTAL-ORG-SHARE: 新页签含 org 地址进入后参数丢失 url=' + page2.url());
      }
      await page.evaluate(
        (payload) => sessionStorage.setItem('__func01323', JSON.stringify(payload)),
        { shareUrl, triggerAria },
      );
      await page2.close();
  - note: 2、关闭抽屉后地址栏机构参数移除且焦点返回触发卡片
    assert: |-
      const raw = await page.evaluate(() => sessionStorage.getItem('__func01323') || '');
      const stash = raw ? JSON.parse(raw) : {};
      const shareUrl = stash.shareUrl || '';
      const triggerAria = stash.triggerAria || '';
      if (!shareUrl) throw new Error('D3-SVCPORTAL-ORG-SHARE: 缺少分享地址');
      const page2 = await page.context().newPage();
      await page2.goto(shareUrl, { waitUntil: 'domcontentloaded' });
      await page2.waitForTimeout(1200);
      const drawer = page2.locator('.arco-drawer').filter({ has: page2.locator('[data-testid="svc-portal-keyorg-drawer"]') }).first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const closeBtn = drawer.locator('.arco-drawer-close-btn, button[aria-label="关闭"]').first();
      if (await closeBtn.count()) {
        await closeBtn.click({ timeout: 5000 });
      } else {
        await page2.keyboard.press('Escape');
      }
      await expect(drawer).toBeHidden({ timeout: 8000 });
      const orgAfter = (() => { try { return new URL(page2.url()).searchParams.get('org'); } catch (e) { return null; } })();
      if (orgAfter) {
        await page2.close();
        throw new Error('D3-SVCPORTAL-ORG-SHARE: 关闭后地址栏仍残留 org=' + orgAfter);
      }
      const card = triggerAria
        ? page2.locator(`button.svc-portal-keyorg-card[aria-label="${triggerAria}"]`).first()
        : page2.locator('button.svc-portal-keyorg-card').first();
      await expect(card).toBeVisible({ timeout: 8000 });
      await card.scrollIntoViewIfNeeded();
      await page2.waitForFunction(
        (aria) => {
          const el = document.activeElement;
          if (!el) return false;
          if (el.classList?.contains('svc-portal-keyorg-card')) return true;
          const a = el.getAttribute('aria-label') || '';
          return aria ? a === aria : /查看.+重点机构详情/.test(a);
        },
        triggerAria,
        { timeout: 8000 },
      );
      await page2.close();
on_fail: 截图 + 抄 X-Trace-Id
