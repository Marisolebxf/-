id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01322
priority: P1
tier: B
title: 技术能力产业切换后口径同步且可重进
story: US-SVC-PT-04
entry_id: svc-portal
preconditions:
  - 已进入技术能力页
locators:
  tab_cap: 服务机构技术能力
  industry: 全部产业
steps:
  - action: goto
    target: /service-portal/capability-rank
expect:
  - note: 产业变更后产业名与榜/空态区同步
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count()) { try { await close.click({ timeout: 1500 }); } catch {} } await page.getByRole('tab', { name: '服务机构技术能力', exact: true }).click(); await page.waitForTimeout(800); const ind=page.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业"]') }).first(); await ind.click(); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物' }).first().click(); await page.waitForTimeout(1200); await expect(page.getByText(/生物/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/技术力|等权|Top|入榜|暂无/).first()).toBeVisible({ timeout: 8000 })
  - note: 同一产业重复进入结果一致（含空态）
    assert: |-
      const ind=page.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业"]') }).first(); await ind.click(); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click(); await page.waitForTimeout(1000); const t1=await page.locator('main').innerText(); await ind.click(); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物' }).first().click(); await page.waitForTimeout(800); await ind.click(); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click(); await page.waitForTimeout(1000); const t2=await page.locator('main').innerText(); const norm=s=>s.replace(/\d{1,2}:\d{2}:\d{2}/g,'').slice(0,400); if (norm(t1)!==norm(t2) && !(/暂无/.test(t1) && /暂无/.test(t2))) throw new Error('重进结果不一致')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D2：现场为页组共用产业下拉（非独立产业页签 chip）。
