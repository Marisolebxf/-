id: FUNC-01308
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01308
priority: P1
tier: B
title: 主流程-筛选区构成与产业链初始禁用
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: wait
    for: 概况默认视图
    timeout_ms: 15000
expect:
  - note: 1、筛选区含产业与产业链两个下拉
    assert: |-
      await page.waitForURL(/\/service-portal\/overview/, { timeout: 20000 });
      const main = page.locator('main').first();
      const filter = main.locator('.svc-portal-filter, [aria-label="筛选条"]').first();
      await expect(filter).toBeVisible({ timeout: 12000 });
      const industryCtrl = filter.locator('.arco-cascader-view, .arco-select-view').first();
      const chainCtrl = filter.locator('.arco-cascader-view, .arco-select-view').nth(1);
      await expect(industryCtrl).toBeVisible({ timeout: 8000 });
      await expect(chainCtrl).toBeVisible({ timeout: 8000 });
  - note: 2、产业下拉占位为「全部产业」、产业链下拉占位为「全部产业链」
    assert: |-
      const main = page.locator('main').first();
      const filter = main.locator('.svc-portal-filter, [aria-label="筛选条"]').first();
      const views = filter.locator('.arco-cascader-view, .arco-select-view');
      const industryText = ((await views.nth(0).innerText()) || '').replace(/\s+/g, ' ').trim();
      const chainText = ((await views.nth(1).innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!industryText.includes('全部产业')) {
        throw new Error('产业下拉占位应含「全部产业」，实际：' + industryText);
      }
      if (!chainText.includes('全部产业链')) {
        throw new Error('产业链下拉占位应含「全部产业链」，实际：' + chainText);
      }
  - note: 3、初始态产业链下拉呈禁用只读、无下拉浮层弹出
    assert: |-
      const main = page.locator('main').first();
      const filter = main.locator('.svc-portal-filter, [aria-label="筛选条"]').first();
      const views = filter.locator('.arco-select-view, .arco-cascader-view');
      const chainCtrl = views.nth(1);
      await expect(chainCtrl).toBeVisible({ timeout: 8000 });
      const chainHost = filter.locator('.arco-select, .arco-cascader').nth(1);
      const hostClass = (await chainHost.getAttribute('class')) || '';
      const disabled =
        hostClass.includes('arco-select-disabled') ||
        hostClass.includes('arco-cascader-disabled') ||
        (await chainHost.locator('.arco-select-view-disabled, .arco-cascader-disabled').count()) > 0;
      await chainCtrl.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popAfterChain = page.locator('.arco-trigger-popup:visible');
      if ((await popAfterChain.count()) > 0) {
        throw new Error('点击产业链下拉不应弹出浮层');
      }
      if (!disabled) {
        throw new Error('产业链下拉初始态应为禁用只读');
      }
      const industryCtrl = views.nth(0);
      await industryCtrl.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page.locator('.arco-trigger-popup:visible').last()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
