id: FUNC-03922
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03922
priority: P1
tier: B
title: 深圳区域地图说明无坐标且不填演示点
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: evaluate
    note: 滚动到「产业机构区域分布」
expect:
  - note: 1、地图区文案含「无坐标字段」
    assert: |-
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 20000 });
      const regionHeading = page.getByRole('heading', { name: '产业机构区域分布' }).first();
      await regionHeading.scrollIntoViewIfNeeded();
      await expect(regionHeading).toBeVisible({ timeout: 8000 });
      const mapWrap = page.locator('.svc-portal-map--sz').first();
      await expect(mapWrap).toBeVisible({ timeout: 8000 });
      await expect(mapWrap.getByText(/无坐标字段/)).toBeVisible({ timeout: 8000 });
  - note: 2、写明不填演示点
    assert: |-
      const mapWrap = page.locator('.svc-portal-map--sz').first();
      await expect(mapWrap.getByText(/不填.*(演示点|Demo)/)).toBeVisible({ timeout: 8000 });
      const markers = mapWrap.locator('.leaflet-marker-icon');
      await expect(markers).toHaveCount(0, { timeout: 3000 });
on_fail: 截图 + 抄 X-Trace-Id
