id: FUNC-03897
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03897
priority: P1
tier: B
title: 主流程-区域视图与首位区域
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: click
    note: 点击「服务机构区域分布」页签
    assert: |-
      const tab = page.locator('.global-workbench-tabs [data-tab-key="region"]')
      await tab.waitFor({ state: 'visible' })
      await tab.scrollIntoViewIfNeeded()
      await tab.click({ timeout: 10000 })
      await page.waitForURL('**/service-portal/region-map')
expect:
  - note: 「全国视图」为选中
    assert: |-
      await expect(page.locator('.arco-radio-checked').filter({ hasText: '全国视图' })).toBeVisible()
  - note: 「全球视图」为禁用
    assert: |-
      await expect(page.locator('.arco-radio-disabled').filter({ hasText: '全球视图' })).toBeVisible()
  - note: 首位区域展示名称与家数
    assert: |-
      const kpi = page.locator('.svc-portal-kpi').filter({ hasText: '首位区域' })
      await expect(kpi.locator('.svc-portal-kpi__value')).not.toHaveText('暂无')
      await expect(kpi.locator('.svc-portal-kpi__hint')).toContainText('家')
on_fail: 截图 + 抄 X-Trace-Id
