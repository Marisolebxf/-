  ① 落局（重点机构墙诚实空）→ allow_skip n/a 挂 ENV-SVC-PORTAL-KEY-ORG-EMPTY。证据链（先探后写，2026-10-15）：env-gate G7 key_empty（2026-10-14）+ _probe-p013（深链 /service-portal/shenzhen：empty 文案可见、.svc-portal-keyorg-card=0、POST key-orgs 200/empty/items=[]）。
  ② D1/源码对齐（lumen-ui-topic SvcPortalKeyOrgSection/Drawer，静读+selector 口径）：卡片 = button.svc-portal-keyorg-card；抽屉 = .arco-drawer + data-testid=svc-portal-keyorg-drawer；四板块 h4 文案与用例一致（①机构概况 ②当前规模 ③业务服务领域 ④业务分布区域）。板块内扩展字段「资料完善中」空态属开放项 6，本条只验四板块标题依序可见，不钉死人数/营收/地图点。
