id: FUNC-03903
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03903
priority: P0
tier: B
title: 主流程-切换产业后榜单标题
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 选择产业「生物」；点击「服务机构技术能力」页签
expect:
  - note: 1、榜单标题含「生物」
    assert: |-
      await expect(page).toHaveURL(/service-portal/, { timeout: 20000 });
      const cascader = page.getByRole('combobox', { name: '产业集群与产业筛选' });
      await expect(cascader).toBeVisible({ timeout: 12000 });
      await cascader.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const panel = page.locator('.svc-portal-industry-cascader-menu, .arco-cascader-panel').first();
      await expect(panel).toBeVisible({ timeout: 8000 });
      await panel.locator('.arco-cascader-panel-column').first().getByText(/^生物$/).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(cascader).toContainText(/生物/, { timeout: 8000 });
      const tablist = page.locator('[aria-label="专题服务子导航"]');
      await tablist.getByRole('tab', { name: '服务机构技术能力', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/capability-rank/, { timeout: 15000 });
      const main = page.locator('main');
      await expect(main.getByText(/生物/).filter({ hasText: /技术力 Top/ }).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
