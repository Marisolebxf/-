id: FUNC-03903
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03903
priority: P0
tier: B
title: 切换产业后榜单标题跟随
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 选择产业「生物」；点击「服务机构技术能力」页签
expect:
  - note: 1、榜单标题含「生物」
    assert: |-
      const main = page.locator('main');
      const cascader = main.locator('.arco-cascader-view').first();
      await expect(cascader).toBeVisible({ timeout: 15000 });
      let cascaderText = ((await cascader.innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/生物/.test(cascaderText)) {
        await cascader.click();
        const popup = page.locator('.arco-trigger-popup:visible');
        await expect(popup).toBeVisible({ timeout: 8000 });
        await popup.getByText(/生物/).first().click();
        await page.waitForTimeout(300);
        const popup2 = page.locator('.arco-trigger-popup:visible');
        if (await popup2.count()) {
          await popup2.locator('.arco-cascader-list-column').last().getByText(/生物/).first().click();
        }
        await page.waitForTimeout(400);
        cascaderText = ((await cascader.innerText()) || '').replace(/\s+/g, ' ').trim();
        if (!/生物/.test(cascaderText)) {
          throw new Error('产业未选中含「生物」：' + cascaderText);
        }
      }
      await page.locator('[aria-label="专题服务子导航"] [data-tab-key="capability"]').click();
      await expect(page).toHaveURL(/service-portal\/capability-rank/, { timeout: 15000 });
      await expect(main.getByText(/生物/).filter({ hasText: /技术力 Top/ }).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
