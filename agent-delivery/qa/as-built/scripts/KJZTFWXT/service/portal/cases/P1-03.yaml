id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01324
priority: P1
tier: B
title: 评审开启态指标说明角标与三追溯按钮
story: US-SVC-PT-01
entry_id: svc-portal
preconditions:
  - 已进入概况；可开内部评审模式
locators:
  review: 内部评审模式
steps:
  - action: goto
    target: /service-portal/overview
expect:
  - note: 开启态指标说明角标 ≥4
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count()) { try { await close.click({ timeout: 1500 }); } catch {} } await page.locator('button.persona-switch').first().click(); await page.waitForTimeout(400); const sw=page.getByRole('switch', { name: '内部评审模式' }); if (await sw.getAttribute('aria-checked')!=='true') await sw.click(); await page.keyboard.press('Escape'); await page.waitForTimeout(400); for (const a of ['指标说明：全球服务机构分布（按国家计数）','指标说明：新增服务机构动态','指标说明：全球服务机构产业布局']) await expect(page.locator(`[aria-label="${a}"]`).first()).toBeVisible({ timeout: 8000 }); const n=await page.locator('[aria-label^="指标说明："]').count(); if (n<4) throw new Error('指标说明角标处数 '+n+' <4')
  - note: 角标打开后呈指标说明卡
    assert: |-
      await page.locator('[aria-label="指标说明：全球服务机构分布（按国家计数）"]').first().click(); await page.waitForTimeout(500); await expect(page.getByText(/指标|口径|全球/).first()).toBeVisible({ timeout: 8000 }); await page.keyboard.press('Escape')
  - note: 三个需求追溯按钮可见
    assert: |-
      for (const a of ['全球服务机构数量分析需求追溯','全球服务机构类型分析需求追溯','全球服务机构规模分析需求追溯']) await expect(page.locator(`[aria-label="${a}"]`)).toBeVisible({ timeout: 8000 })
  - note: 追溯按钮打开后内容可读
    assert: |-
      await page.locator('[aria-label="全球服务机构数量分析需求追溯"]').click(); await page.waitForTimeout(500); await expect(page.getByText(/需求|追溯|REQ|全球/).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: P3 必须用 aria-label=内部评审模式。
