id: FUNC-03902
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03902
priority: P1
tier: B
title: 主流程-榜单加入对比篮
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: click
    assert: |-
      const capTab = page.locator('[data-tab-key="capability"]');
      await expect(capTab).toBeVisible({ timeout: 30000 });
      await capTab.click({ timeout: 15000 });
      await expect(page).toHaveURL(/\/service-portal\/capability-rank/, { timeout: 30000 });
  - action: click
    assert: |-
      const main = page.locator('main');
      const addBtn = main.getByRole('button', { name: '加入对比篮' }).first();
      await expect(addBtn).toBeVisible({ timeout: 30000 });
      await addBtn.click({ timeout: 15000 });
expect:
  - note: 1、该按钮变为「已在对比篮」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('button', { name: '已在对比篮' }).first()).toBeVisible();
  - note: 2、出现已加入该机构的提示
    assert: |-
      await expect(
        page.locator('.arco-message').filter({ hasText: /已将「.+」加入对比篮/ }),
      ).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
