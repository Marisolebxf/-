id: FUNC-03920
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03920
priority: P1
tier: B
title: 深圳环节分布空态
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 点击「深圳产业服务介绍」页签并滚动到环节分布
expect:
  - note: 1、说明无领域×环节矩阵且不填演示环节条
    assert: |-
      const tablist = page.locator('[aria-label="专题服务子导航"]');
      await tablist.getByRole('tab', { name: '深圳产业服务介绍', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 15000 });
      const segHeading = page.locator('main').getByRole('heading', { name: /深圳产业链环节分布/ }).first();
      await segHeading.scrollIntoViewIfNeeded();
      await expect(segHeading).toBeVisible({ timeout: 8000 });
      await expect(page.locator('main').getByText('本包络无环节分布。不填演示环节条。')).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
