id: FUNC-03896
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03896
priority: P1
tier: B
title: 六类服务分布悬停提示含类型家数与占比
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 打开产业分布页并悬停「类型分析 · 六类服务分布」扇区
expect:
  - note: 1、提示中含服务类型、家数与占比
    assert: |-
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('C2：/service-portal 不可达（SPA404）');
      }
      await expect(page).toHaveURL(/service-portal/, { timeout: 15000 });
      const industryTab = page.getByRole('tab', { name: '服务机构产业分布', exact: true });
      await expect(industryTab).toBeVisible({ timeout: 10000 });
      await industryTab.click({ timeout: 8000 });
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 15000 });
      const blockTitle = page.getByText('类型分析 · 六类服务分布', { exact: true }).first();
      await expect(blockTitle).toBeVisible({ timeout: 8000 });
      const chartWrap = blockTitle.locator('xpath=ancestor::*[.//canvas][1]');
      const canvas = chartWrap.locator('canvas').first();
      await expect(canvas).toBeVisible({ timeout: 10000 });
      const readTip = () =>
        page.evaluate(() => {
          const tips = [...document.querySelectorAll('div')].filter((el) => {
            const st = window.getComputedStyle(el);
            if (st.display === 'none' || st.visibility === 'hidden' || st.opacity === '0') return false;
            const z = parseInt(st.zIndex, 10);
            if (!Number.isFinite(z) || z < 100) return false;
            const t = (el.innerText || '').trim();
            return t.length > 0 && t.length < 400;
          });
          return tips.map((el) => (el.innerText || '').trim()).sort((a, b) => b.length - a.length)[0] || '';
        });
      const hasTypeCountPct = (text) => {
        const t = (text || '').replace(/\s+/g, ' ');
        if (!/[\u4e00-\u9fa5]{2,}/.test(t)) return false;
        const hasCount = /[\d,]+/.test(t) && /家/.test(t);
        const hasPct = /%/.test(t) || /占比/.test(t);
        return hasCount && hasPct;
      };
      let tipText = '';
      const ecProbe = await page.evaluate(() => {
        const ec = window.echarts;
        if (!ec?.getInstanceByDom) return { ok: false, reason: 'no-echarts-global' };
        const nodes = document.querySelectorAll('.svc-portal-chart, [_echarts_instance_]');
        for (const node of nodes) {
          const inst = ec.getInstanceByDom(node);
          if (!inst) continue;
          const opt = inst.getOption();
          const series = opt?.series?.[0];
          if (series?.type !== 'pie') continue;
          const dataLen = series?.data?.length ?? 0;
          if (!dataLen) continue;
          const idx = Math.min(0, dataLen - 1);
          inst.dispatchAction({ type: 'showTip', seriesIndex: 0, dataIndex: idx });
          const name = series.data?.[idx]?.name ?? '';
          return { ok: true, name: String(name), via: 'dispatchAction' };
        }
        return { ok: false, reason: 'no-pie-chart' };
      });
      if (ecProbe.ok) {
        await page.waitForTimeout(350);
        tipText = await readTip();
      }
      if (!hasTypeCountPct(tipText)) {
        const box = await canvas.boundingBox();
        if (!box) throw new Error('六类分布环图 canvas 无 boundingBox');
        const pts = [
          [0.55, 0.35],
          [0.65, 0.5],
          [0.45, 0.55],
          [0.5, 0.4],
        ];
        for (const [fx, fy] of pts) {
          await page.mouse.move(box.x + box.width * fx, box.y + box.height * fy);
          await page.waitForTimeout(400);
          tipText = await readTip();
          if (hasTypeCountPct(tipText)) break;
        }
      }
      if (!hasTypeCountPct(tipText)) {
        throw new Error(
          '悬停六类服务分布后 tooltip 未同时含服务类型、家数与占比；tip=' +
            (tipText || '（空）') +
            '；echarts=' +
            JSON.stringify(ecProbe),
        );
      }
on_fail: 截图 + X-Trace-Id
