id: FUNC-01320
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01320
priority: P0
tier: B
title: 机构详情抽屉四板块依序呈现
story: US-SVC-PT-06
entry_id: svc-portal
preconditions:
  - 已进入深圳介绍页；重点机构卡片墙可见（runner 深链 /service-portal/shenzhen）
locators:
  section_heading: heading「重点产业服务机构」
  keyorg_card: button.svc-portal-keyorg-card
  org_drawer: '[data-testid=svc-portal-keyorg-drawer]'
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: evaluate
    note: 点击任一重点机构卡片并浏览抽屉四板块
expect:
  - note: 1、机构详情抽屉打开（用例预期①）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业服务介绍/.test(t);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: /service-portal/shenzhen SPA404，无法验机构详情抽屉 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 20000 });
      const heading = page.getByRole('heading', { name: '重点产业服务机构', exact: true });
      await heading.scrollIntoViewIfNeeded();
      await expect(heading).toBeVisible({ timeout: 8000 });
      const cards = page.locator('button.svc-portal-keyorg-card');
      const n = await cards.count();
      if (n === 0) {
        const empty = await page.getByText(/暂无重点机构/).first().isVisible().catch(() => false);
        if (empty) {
          throw new Error('ENV-SVC-PORTAL-KEY-ORG-EMPTY：重点机构墙诚实空，无法点卡开抽屉验四板块（Q060）');
        }
        throw new Error('重点产业服务机构板块无卡片且无诚实空文案');
      }
      const pick = cards.first();
      await expect(pick).toBeVisible({ timeout: 8000 });
      await pick.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const drawerShell = page.locator('.arco-drawer').first();
      await expect(drawerShell).toBeVisible({ timeout: 8000 });
      const testDrawer = page.locator('[data-testid="svc-portal-keyorg-drawer"]');
      await expect(testDrawer.first()).toBeVisible({ timeout: 8000 });
  - note: 2、四板块依序为机构概况、当前规模、业务服务领域、业务分布区域（用例预期②）
    assert: |-
      const root = page.locator('[data-testid="svc-portal-keyorg-drawer"]').first();
      await expect(root).toBeVisible({ timeout: 8000 });
      await expect(root.getByRole('heading', { name: /机构概况/ })).toBeVisible({ timeout: 8000 });
      await expect(root.getByRole('heading', { name: /当前规模/ })).toBeVisible({ timeout: 8000 });
      await expect(root.getByRole('heading', { name: /业务服务领域/ })).toBeVisible({ timeout: 8000 });
      await expect(root.getByRole('heading', { name: /业务分布区域/ })).toBeVisible({ timeout: 8000 });
      const dtxt = ((await root.innerText().catch(() => '')) || '');
      const i1 = dtxt.indexOf('机构概况');
      const i2 = dtxt.indexOf('当前规模');
      const i3 = dtxt.indexOf('业务服务领域');
      const i4 = dtxt.indexOf('业务分布区域');
      if (i1 < 0 || i2 < 0 || i3 < 0 || i4 < 0) {
        throw new Error('抽屉内四板块标题不全');
      }
      if (!(i1 < i2 && i2 < i3 && i3 < i4)) {
        throw new Error('四板块顺序不符：机构概况→当前规模→业务服务领域→业务分布区域');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  用例前置「已进入深圳介绍页」由 goto /service-portal/shenzhen 自含；catalog_path 仍为 /service-portal，子路由与 03905/03906 一致。
  抽屉限定 data-testid=svc-portal-keyorg-drawer（SvcPortalKeyOrgDrawer.vue h4 四板块文案与用例一致）；不钉死概况/规模字段与「资料完善中」空态（开放项 1/6）。
  墙诚实空 → ENV-SVC-PORTAL-KEY-ORG-EMPTY（blocked）。edu/tts/svcz 深链 SPA404 → ENV-EDU-TTS-SVCZ-404-001（blocked，同门户重写波姊妹条）。
