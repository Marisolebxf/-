id: FUNC-03912
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03912
priority: P1
tier: B
title: 刷新后保留产业
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 选择产业「生物」；刷新页面
expect:
  - note: 1、刷新后产业选择仍为「生物」
    assert: |-
      await expect(page).toHaveURL(/service-portal/, { timeout: 20000 });
      const cascader = page.locator('.arco-cascader-view').first();
      await expect(cascader).toBeVisible({ timeout: 8000 });
      await cascader.click();
      let popup = page.locator('.arco-trigger-popup:visible');
      await expect(popup).toBeVisible({ timeout: 8000 });
      await popup.getByText('生物产业', { exact: true }).click();
      await page.waitForTimeout(300);
      popup = page.locator('.arco-trigger-popup:visible');
      if (await popup.getByText('生物医药', { exact: true }).isVisible().catch(() => false)) {
        await popup.getByText('生物医药', { exact: true }).click();
      }
      await page.waitForTimeout(400);
      await expect(page.getByText(/生物产业/)).toBeVisible({ timeout: 8000 });
      await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
      await expect(page).toHaveURL(/service-portal/, { timeout: 20000 });
      await expect(page.getByText(/生物产业/)).toBeVisible({ timeout: 8000 });
      await expect(page.getByText(/生物医药/)).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
