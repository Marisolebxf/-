id: FUNC-03912
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03912
priority: P1
tier: B
title: 刷新后保留产业
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: wait
    for: 概况默认视图
    timeout_ms: 15000
  - action: evaluate
    note: 选择产业「生物」；刷新页面
expect:
  - note: 1、产业选择仍为「生物」
    assert: |-
      await page.waitForURL(/\/service-portal\/overview/, { timeout: 20000 });
      const main = page.locator('main').first();
      await expect(main.getByText('产业集群 / 产业')).toBeVisible({ timeout: 12000 });
      const filterBar = main.locator('[aria-label="筛选条"]').first();
      const scope = (await filterBar.count()) ? filterBar : main;
      const cascaderInMain = main.locator('.arco-cascader-view').first();
      if (await cascaderInMain.isVisible().catch(() => false)) {
        await cascaderInMain.click({ timeout: 8000 });
      } else {
        await scope.getByText(/新一代信息技术|全部产业/, { exact: false }).first().click({ timeout: 8000 });
      }
      await page.waitForTimeout(400);
      const popup = page.locator('.arco-trigger-popup:visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      await popup.locator('.arco-cascader-list-column').first().getByText('生物', { exact: false }).first().click();
      await page.waitForTimeout(500);
      const col2 = popup.locator('.arco-cascader-list-column').nth(1);
      if (await col2.isVisible().catch(() => false)) {
        await col2.locator('.arco-cascader-list-item').first().click();
        await page.waitForTimeout(400);
      }
      await expect(scope).toContainText(/生物/, { timeout: 8000 });
      await page.reload({ waitUntil: 'domcontentloaded' });
      await page.waitForURL(/\/service-portal\/overview/, { timeout: 20000 });
      await expect(main.getByText('产业集群 / 产业')).toBeVisible({ timeout: 12000 });
      await expect(scope).toContainText(/生物/, { timeout: 12000 });
on_fail: 截图 + 抄 X-Trace-Id
