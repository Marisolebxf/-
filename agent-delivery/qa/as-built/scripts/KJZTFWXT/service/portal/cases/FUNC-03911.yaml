id: FUNC-03911
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03911
priority: P1
tier: B
title: 页签往返保留产业
story: US-SVC-PT-02
entry_id: svc-portal
preconditions:
  - 已进入门户（runner 会话前置）
locators:
  industry: select placeholder 全部产业
  tab_region: tab「服务机构区域分布」
  tab_overview: tab「全球服务机构概况」
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 选择产业「生物」；点击「服务机构区域分布」页签；点击「全球服务机构概况」页签
expect:
  - note: 1、两次切页后产业选择仍为「生物」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const readIndustry = async () => {
        const ind = page.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业"]') }).first();
        const indVal = ((await page.locator('input[placeholder="全部产业"]').first().inputValue().catch(() => '')) || '').trim();
        const indView = ((await ind.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        return { indVal, indView, combined: indVal + indView };
      };
      const assertIndustryBio = async (phase) => {
        const { combined } = await readIndustry();
        if (!/生物/.test(combined)) {
          throw new Error('[' + phase + '] 产业未保持「生物」；combined=' + combined);
        }
      };
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: catalog_path /service-portal SPA404，无法验切页保留产业 url=' + page.url());
      }
      await dismissBasket();
      await expect(page).toHaveURL(/service-portal\/overview/, { timeout: 20000 });
      const ind = page.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业"]') }).first();
      await expect(ind).toBeVisible({ timeout: 8000 });
      await ind.click();
      const popup = page.locator('.arco-trigger-popup:visible');
      await expect(popup).toBeVisible({ timeout: 8000 });
      await popup.getByText('生物', { exact: true }).click();
      await page.waitForTimeout(400);
      await assertIndustryBio('选产业后');
      const tablist = page.locator('[aria-label="专题服务子导航"]');
      await tablist.getByRole('tab', { name: '服务机构区域分布', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/region-map/, { timeout: 15000 });
      await assertIndustryBio('区域分布页');
      await tablist.getByRole('tab', { name: '全球服务机构概况', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/overview/, { timeout: 15000 });
      await expect(page.getByRole('heading', { name: '全球服务机构概况', level: 1 }).first()).toBeVisible({ timeout: 8000 });
      await assertIndustryBio('返回概况页');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  产业为门户顶栏全局筛选，Tab 切换（区域分布 ↔ 概况）不应清空；用例备注「切页不改写概况三张卡切片口径」本条只验产业值保留，不验 KPI 卡数值。
  步骤顺序与用例册一致：先选「生物」再往返两个 Tab。goto catalog /service-portal；edu SPA404 → ENV-EDU-TTS-SVCZ-404-001→ledger blocked。
