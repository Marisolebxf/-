id: FUNC-03911
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03911
priority: P1
tier: B
title: 备选-页签往返保留产业
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
expect:
  - note: 1、两次切页后产业选择仍为「生物」
    assert: |-
      const main = () => page.locator('main').first();
      const filter = () => main().locator('.svc-portal-filter, [aria-label="筛选条"]').first();
      await expect(main().getByRole('heading', { name: '全球服务机构概况' })).toBeVisible({ timeout: 20000 });
      await expect(filter()).toBeVisible({ timeout: 15000 });
      const pickBio = async () => {
        const cluster = filter().locator('.arco-cascader-view').first();
        await cluster.waitFor({ state: 'visible', timeout: 15000 });
        let text = ((await filter().innerText()) || '').replace(/\s+/g, ' ').trim();
        if (/生物/.test(text) && !/新一代信息技术/.test(text)) return;
        await cluster.click({ timeout: 10000 });
        await page.waitForTimeout(500);
        const popup = page.locator('.arco-cascader-popup:visible').last();
        await popup.waitFor({ state: 'visible', timeout: 10000 });
        let clusterOpt = popup.locator('.arco-cascader-option-label').filter({ hasText: /^生物$/ });
        if (!(await clusterOpt.count())) {
          clusterOpt = popup.locator('.arco-cascader-option-label').filter({ hasText: /生物产业/ });
        }
        await clusterOpt.first().click({ timeout: 10000 });
        await page.waitForTimeout(500);
        const l0Opt = popup.locator('.arco-cascader-column').nth(1).locator('.arco-cascader-option-label').filter({ hasText: /生物医药/ });
        if (await l0Opt.count()) {
          await l0Opt.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(1000);
        await page.keyboard.press('Escape').catch(() => {});
        text = ((await filter().innerText()) || '').replace(/\s+/g, ' ').trim();
        if (!/生物/.test(text) || /新一代信息技术/.test(text)) {
          throw new Error('产业未选中生物，现场=' + text);
        }
      };
      await pickBio();
      await main().getByText('服务机构区域分布', { exact: true }).first().click({ timeout: 10000 });
      await page.waitForURL(/service-portal\/region-map/, { timeout: 20000 });
      await expect(filter()).toBeVisible({ timeout: 15000 });
      await main().getByText('全球服务机构概况', { exact: true }).first().click({ timeout: 10000 });
      await page.waitForURL(/service-portal\/overview/, { timeout: 20000 });
      await expect(filter()).toBeVisible({ timeout: 15000 });
      const text = ((await filter().innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/生物/.test(text) || /新一代信息技术/.test(text)) {
        throw new Error('两次切页后产业未保留生物，现场=' + text);
      }
      await expect(filter().getByText(/生物/)).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
