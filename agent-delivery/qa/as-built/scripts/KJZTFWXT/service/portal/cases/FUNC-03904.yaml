id: FUNC-03904
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03904
priority: P0
tier: A
title: 深圳三张指标卡
story: US-SVC-PT-05
entry_id: svc-portal
preconditions:
  - 已进入门户（runner 会话前置 + goto 概况）
locators:
  tab_sz: tab「深圳产业服务介绍」
  kpi_grid: .svc-portal-kpi-grid
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: 点击「深圳产业服务介绍」页签
expect:
  - note: 1、「深圳机构约数」展示家数
    assert: |-
      const kpiBlock = (label) =>
        page.locator('.svc-portal-kpi').filter({
          has: page.locator('.svc-portal-kpi__label').filter({ hasText: label }),
        }).first();
      const tablist = page.locator('[aria-label="专题服务子导航"]');
      await tablist.getByRole('tab', { name: '深圳产业服务介绍', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 15000 });
      const totalKpi = kpiBlock('深圳机构约数');
      await expect(totalKpi).toBeVisible({ timeout: 8000 });
      await expect(totalKpi.locator('.svc-portal-kpi__value')).toContainText(/\d/, { timeout: 20000 });
      await expect(totalKpi).toContainText(/家/, { timeout: 8000 });
  - note: 2、「本年新增」为暂无
    assert: |-
      const kpiBlock = (label) =>
        page.locator('.svc-portal-kpi').filter({
          has: page.locator('.svc-portal-kpi__label').filter({ hasText: label }),
        }).first();
      const newKpi = kpiBlock('本年新增');
      await expect(newKpi).toBeVisible({ timeout: 8000 });
      const valTxt = ((await newKpi.locator('.svc-portal-kpi__value').innerText()) || '').replace(/\s+/g, ' ').trim();
      if (valTxt !== '暂无') throw new Error('本年新增应为暂无；现场=' + valTxt);
  - note: 3、「覆盖领域数」为暂无
    assert: |-
      const kpiBlock = (label) =>
        page.locator('.svc-portal-kpi').filter({
          has: page.locator('.svc-portal-kpi__label').filter({ hasText: label }),
        }).first();
      const covKpi = kpiBlock('覆盖环节数');
      await expect(covKpi).toBeVisible({ timeout: 8000 });
      const valTxt = ((await covKpi.locator('.svc-portal-kpi__value').innerText()) || '').replace(/\s+/g, ' ').trim();
      if (valTxt !== '暂无') throw new Error('覆盖环节数应为暂无；现场=' + valTxt);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  Tab /service-portal/shenzhen。KPI 在 .svc-portal-kpi-grid；页签 label 为覆盖环节数；sz_total 异步 toContainText 数字。
