  ② D4 环境债：金银铜与「在库/返回 N」tag 依赖 Java ranking TECH 非空 items；当前 empty 不凑 30（与口径条一致）。P0-05 已覆盖空态+等权口径（不 skip）；本条只验名次配色/不足 30 诚实标注，无行则整条 skip，不降格复用 P0-05。
