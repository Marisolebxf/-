id: FUNC-03906
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03906
priority: P0
tier: B
title: 深圳区排行
story: US-SVC-PT-05
entry_id: svc-portal
preconditions:
  - 已打开深圳产业服务介绍（runner 深链 /service-portal/shenzhen）
locators:
  conclusion: .ent-judgment-strip
  rank_heading: heading「区排行」
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: evaluate
    note: 滚动到「区排行」
expect:
  - note: 1、结论条给出居首区名与家数
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业服务介绍/.test(t);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: /service-portal/shenzhen SPA404，无法验结论条与区排行 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '深圳产业服务介绍', level: 1 }).first()).toBeVisible({ timeout: 8000 });
      const strip = page.locator('.ent-judgment-strip').first();
      await expect(strip).toBeVisible({ timeout: 8000 });
      const txt = ((await strip.innerText()) || '').replace(/\s+/g, ' ').trim();
      const m = txt.match(/(.+?)居首[（(]([\d,，\s]+)\s*家[）)]/);
      if (!m) {
        if (/暂无已出区行/.test(txt)) {
          throw new Error('ENV-SVC-PORTAL-SZ-DISTRICT-EMPTY：结论条无居首区行，无法验居首区名与家数');
        }
        throw new Error('结论条未给出居首区名与家数：' + txt.slice(0, 160));
      }
      const district = m[1].trim();
      const countPart = m[2].replace(/[,，\s]/g, '');
      if (!district) throw new Error('居首区名为空');
      if (!/\d/.test(countPart)) throw new Error('居首家数无数字：' + m[2]);
  - note: 2、页面含「区排行」区块
    assert: |-
      const rankHeading = page.locator('main').getByRole('heading', { name: '区排行', exact: true }).first();
      await rankHeading.scrollIntoViewIfNeeded();
      await expect(rankHeading).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  结论条 ServicePortalShell JudgmentStrip（.ent-judgment-strip）；居首文案与 ServicePortalShenzhenPage conclusionText
  「{区名}居首（N 家）」一致，不钉死区名与家数。区排行 SectionPanel 标题 exact「区排行」；条形图或诚实空态均在区块内。
  goto /service-portal/shenzhen；catalog_path 仍为 /service-portal。
