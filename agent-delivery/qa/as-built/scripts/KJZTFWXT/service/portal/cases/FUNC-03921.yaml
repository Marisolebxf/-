id: FUNC-03921
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03921
priority: P1
tier: B
title: 抽屉扩展档案缺省显示资料完善中
story: US-SVC-PT-06
entry_id: svc-portal
preconditions:
  - 已打开深圳产业服务介绍（runner 深链 /service-portal/shenzhen）；重点机构卡片可见
locators:
  section_heading: heading「重点产业服务机构」
  keyorg_card: button.svc-portal-keyorg-card
  org_drawer: '[data-testid=svc-portal-keyorg-drawer]'
steps:
  - action: goto
    target: /service-portal
  - action: evaluate
    note: Tab 进深圳产业服务介绍后点击重点机构卡片
expect:
  - note: 1、机构详情抽屉打开（用例步骤 1）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业服务介绍|全球服务机构概况/.test(t);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: /service-portal SPA404，无法验抽屉扩展档案空态 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/overview/, { timeout: 20000 });
      const tablist = page.locator('[aria-label="专题服务子导航"]');
      await tablist.getByRole('tab', { name: '深圳产业服务介绍', exact: true }).click();
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 15000 });
      await expect(page.getByRole('heading', { name: '深圳产业服务介绍', level: 1 }).first()).toBeVisible({ timeout: 8000 });
      const heading = page.getByRole('heading', { name: '重点产业服务机构', exact: true });
      await heading.scrollIntoViewIfNeeded();
      await expect(heading).toBeVisible({ timeout: 8000 });
      const cards = page.locator('button.svc-portal-keyorg-card');
      const n = await cards.count();
      if (n === 0) {
        const empty = await page.getByText(/暂无重点机构/).first().isVisible().catch(() => false);
        if (empty) {
          throw new Error('ENV-SVC-PORTAL-KEY-ORG-EMPTY：重点机构墙诚实空，无法点卡验资料完善中（Q060）');
        }
        throw new Error('重点产业服务机构板块无卡片且无诚实空文案');
      }
      const pick = cards.first();
      await expect(pick).toBeVisible({ timeout: 8000 });
      await pick.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const root = page.locator('[data-testid="svc-portal-keyorg-drawer"]').first();
      await expect(root).toBeVisible({ timeout: 8000 });
  - note: 1、「当前规模」显示资料完善中（用例预期①）
    assert: |-
      const root = page.locator('[data-testid="svc-portal-keyorg-drawer"]').first();
      await expect(root).toBeVisible({ timeout: 8000 });
      const scaleBlock = root.locator('.svc-portal-keyorg-block').filter({ has: root.getByRole('heading', { name: /当前规模/ }) }).first();
      await expect(scaleBlock).toBeVisible({ timeout: 8000 });
      const scaleTxt = ((await scaleBlock.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/资料完善中/.test(scaleTxt)) {
        throw new Error('当前规模板块未显示资料完善中：' + scaleTxt.slice(0, 120));
      }
  - note: 2、「业务服务领域」与「业务分布区域」显示资料完善中（用例预期②）
    assert: |-
      const root = page.locator('[data-testid="svc-portal-keyorg-drawer"]').first();
      await expect(root).toBeVisible({ timeout: 8000 });
      const fieldBlock = root.locator('.svc-portal-keyorg-block').filter({ has: root.getByRole('heading', { name: /业务服务领域/ }) }).first();
      await expect(fieldBlock).toBeVisible({ timeout: 8000 });
      const fieldTxt = ((await fieldBlock.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/资料完善中/.test(fieldTxt)) {
        throw new Error('业务服务领域板块未显示资料完善中：' + fieldTxt.slice(0, 120));
      }
      const regionBlock = root.locator('.svc-portal-keyorg-block').filter({ has: root.getByRole('heading', { name: /业务分布区域/ }) }).first();
      await expect(regionBlock).toBeVisible({ timeout: 8000 });
      const regionTxt = ((await regionBlock.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/资料完善中/.test(regionTxt)) {
        throw new Error('业务分布区域板块未显示资料完善中：' + regionTxt.slice(0, 120));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  SVCPORTAL 用例预期不含「主要领导人」（归 SVCSZINTRO 03921）；本脚本只验当前规模、业务服务领域、业务分布区域三块 a-empty/ muted 文案含资料完善中（SvcPortalKeyOrgDrawer.vue）。
  四板块标题与顺序归 FUNC-01320。edu shenzhen 深链 SPA404 时 goto /service-portal + Tab 进深圳（同 03904/03908）；catalog_path=/service-portal。
  墙诚实空 → ENV-SVC-PORTAL-KEY-ORG-EMPTY（blocked）。edu/tts/svcz 深链 SPA404 → ENV-EDU-TTS-SVCZ-404-001（blocked）。
