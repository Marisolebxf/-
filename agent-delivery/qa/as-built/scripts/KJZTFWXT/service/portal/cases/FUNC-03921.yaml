  - note: 「业务服务领域」与「业务分布区域」显示资料完善中
    assert: |-
      await expect(page.locator('main').filter({ hasText: '业务服务领域' }).getByText('资料完善中')).toBeVisible();
      await expect(page.locator('main').filter({ hasText: '业务分布区域' }).getByText('资料完善中')).toBeVisible()
on_fail: 截图 + 抄 X-Trace-Id
