id: FUNC-03898
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03898
priority: P1
tier: B
title: 主流程-技术能力表头与在库返回
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: click
    note: 03910-1 选择产业「生物」
    target: .svc-portal-filter__control .arco-cascader-view
  - action: click
    target: .arco-cascader-popup >> text=生物
  - action: click
    note: 03910-2 清除产业选择
    target: .svc-portal-filter .arco-cascader-clear-icon
  - action: click
    note: 点击「服务机构技术能力」页签
    target: 服务机构技术能力
expect:
  - note: 表头依次为排名、服务机构、综合得分、操作
    assert: |-
      const table = page.locator('main table');
      await expect(table.getByRole('columnheader', { name: '排名' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '服务机构' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '综合得分' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '操作' })).toBeVisible();
  - note: 榜单标题为「全部产业 · 技术力 Top30」
    assert: |-
      await expect(page.locator('main').getByText('全部产业 · 技术力 Top30', { exact: true })).toBeVisible();
  - note: 页面展示「在库/返回」及家数
    assert: |-
      await expect(page.locator('main').getByText(/在库\/返回\s*\d+\s*家/)).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
