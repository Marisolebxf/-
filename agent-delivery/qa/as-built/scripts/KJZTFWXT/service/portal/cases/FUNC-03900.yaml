id: FUNC-03900
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03900
priority: P1
tier: B
title: 主流程-前三名次标识
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: click
    target: 「服务机构技术能力」
  - action: wait
    timeout_ms: 1200
expect:
  - note: 前三名名次标识彼此不同
    assert: |-
      await expect(page).toHaveURL(/\/service-portal\/capability-rank/, { timeout: 10000 });
      const spin = page.locator('main .arco-spin-loading').first();
      if (await spin.isVisible().catch(() => false)) {
        await spin.waitFor({ state: 'hidden', timeout: 15000 });
      }
      const ranks = page.locator('main .svc-portal-rank');
      await expect(ranks.nth(0)).toBeVisible({ timeout: 10000 });
      const top3 = await page.evaluate(() => {
        const badges = Array.from(document.querySelectorAll('main .svc-portal-rank')).slice(0, 3);
        if (badges.length < 3) return { ok: false, msg: '榜单不足3行' };
        const mods = badges.map((el) => {
          const hit = el.className.match(/svc-portal-rank--([1-4])/);
          return hit ? hit[1] : '';
        });
        const sigs = badges.map((el) => {
          const s = getComputedStyle(el);
          return `${el.className}|${s.backgroundColor}|${s.color}`;
        });
        if (mods.join(',') !== '1,2,3') return { ok: false, msg: '前三样式 modifier 应为 1,2,3，实际 ' + mods.join(',') };
        if (new Set(sigs).size !== 3) return { ok: false, msg: '前三视觉签名未彼此区分' };
        return { ok: true };
      });
      if (!top3.ok) throw new Error(top3.msg);
  - note: 第4名起名次标识一致
    assert: |-
      const tail = await page.evaluate(() => {
        const badges = Array.from(document.querySelectorAll('main .svc-portal-rank'));
        if (badges.length < 4) return { ok: true };
        const ref = badges[3].className;
        if (!ref.includes('svc-portal-rank--4')) return { ok: false, msg: '第4名缺少 svc-portal-rank--4' };
        for (let i = 3; i < badges.length; i++) {
          if (badges[i].className !== ref) return { ok: false, msg: '第' + (i + 1) + '名 class 与第4名不一致' };
        }
        return { ok: true };
      });
      if (!tail.ok) throw new Error(tail.msg);
on_fail: 截图 + 抄 X-Trace-Id
