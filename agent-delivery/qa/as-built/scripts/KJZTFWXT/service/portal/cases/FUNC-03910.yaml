id: FUNC-03910
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03910
priority: P1
tier: B
title: 备选-清除产业选择
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal
  - action: wait
    for: 概况默认视图
    timeout_ms: 1200
  - action: evaluate
    note: 选择产业「生物」；点击该产业选择上的清除图标
expect:
  - note: 1、产业恢复占位「全部产业」
    assert: |-
      await page.waitForURL(/\/service-portal\/overview/, { timeout: 20000 });
      const main = page.locator('main').first();
      const filter = main.locator('.svc-portal-filter, [aria-label="筛选条"]').first();
      await expect(filter).toBeVisible({ timeout: 10000 });
      const cascader = main.getByLabel('产业集群与产业筛选');
      await expect(cascader).toBeVisible({ timeout: 15000 });
      const cascView = cascader.locator('.arco-cascader-view').first();
      await cascView.click({ timeout: 10000 });
      const panel = page.locator('.arco-cascader-popup:visible .arco-cascader-panel').first();
      await panel.waitFor({ state: 'visible', timeout: 10000 });
      const col0 = panel.locator('.arco-cascader-panel-column').first();
      await col0.getByText(/^生物/, { exact: false }).first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const col1 = panel.locator('.arco-cascader-panel-column').nth(1);
      if (await col1.isVisible().catch(() => false)) {
        const leaf = col1.getByText(/生物医药/).first();
        if (await leaf.count()) await leaf.click({ timeout: 8000 });
      }
      await page.keyboard.press('Escape').catch(() => {});
      await page.waitForTimeout(600);
      await expect(cascView).toContainText(/生物/);
      const clearIcon = cascader.locator('.arco-cascader-view-clear-icon, .arco-icon-close-circle-fill, .arco-icon-hover').first();
      await clearIcon.click({ timeout: 8000 });
      await expect(cascView).toContainText('全部产业');
  - note: 2、产业链下拉恢复禁用
    assert: |-
      const main = page.locator('main').first();
      const filter = main.locator('.svc-portal-filter, [aria-label="筛选条"]').first();
      const chainInput = filter.locator('input[placeholder="全部产业链"]').first();
      if ((await chainInput.count()) === 0) {
        throw new Error('30892 筛选条无产业链下拉，仅产业集群级联');
      }
      const chainView = chainInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")]').first();
      await expect(chainView).toHaveClass(/arco-select-view-disabled|disabled/, { timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id
