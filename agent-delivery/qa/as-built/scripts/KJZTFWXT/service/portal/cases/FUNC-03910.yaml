id: FUNC-03910
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03910
priority: P1
tier: B
title: 清除产业选择
entry_id: svc-portal
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/overview
  - action: evaluate
    note: 选择产业「生物」；点击产业选择上的清除图标
expect:
  - note: 1、产业恢复占位「全部产业」
    assert: |-
      const main = page.locator('main');
      const cascader = main.locator('.svc-portal-industry-cascader .arco-cascader-view').first();
      await cascader.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const col0 = page.locator('.arco-cascader-panel-column').first();
      await col0.getByText(/生物/, { exact: false }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const label = ((await cascader.innerText().catch(() => '')) || '').trim();
      if (!/生物/.test(label)) throw new Error('前置：产业未选中含「生物」，现场=' + label);
      await cascader.hover();
      await page.waitForTimeout(300);
      const clr = main.locator('.svc-portal-industry-cascader .arco-icon-close, .svc-portal-industry-cascader .arco-cascader-view-clear-icon').first();
      if (!(await clr.count())) throw new Error('产业已选但未见清除图标（级联 allowClear）');
      await clr.click({ force: true, timeout: 5000 });
      await page.waitForTimeout(800);
      const ph = await main.locator('.svc-portal-industry-cascader input').first().getAttribute('placeholder');
      if (ph !== '全部产业') throw new Error('清除后 placeholder 非全部产业: ' + ph);
      const shown = ((await cascader.innerText().catch(() => '')) || '').trim();
      if (shown && !/^全部产业$/.test(shown)) throw new Error('清除后仍回显产业: ' + shown);
  - note: 2、产业链下拉恢复禁用
    assert: |-
      const chain = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业链"]') }).first();
      if (!(await chain.count())) throw new Error('页上无 placeholder「全部产业链」的产业链下拉');
      const dis = await chain.evaluate((el) => el.className.includes('disabled'));
      if (!dis) throw new Error('清除产业后产业链未恢复禁用');
      try { await chain.click({ timeout: 1500 }); } catch {}
      await page.waitForTimeout(300);
      const opts = await page.locator('.arco-trigger-popup:visible .arco-select-option').count();
      if (opts > 0) throw new Error('产业链禁用态仍弹出选项');
on_fail: 截图 + 抄 X-Trace-Id
