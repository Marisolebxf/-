id: FUNC-01327
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01327
priority: P1
tier: B
title: 非法机构参数不打开抽屉并清参
story: US-SVC-PT-06
entry_id: svc-portal
preconditions:
  - 已进入门户；可编辑地址栏机构参数（脚本自含：深链带无法解析的 ?org=）
locators:
  route_shenzhen: /service-portal/shenzhen
  invalid_org: __INVALID_ORG_NOEXIST__
  keyorg_drawer: '[data-testid=svc-portal-keyorg-drawer]'
steps:
  - action: goto
    target: /service-portal/shenzhen?org=__INVALID_ORG_NOEXIST__
expect:
  - note: 1、页面不打开机构抽屉并提示机构不存在或已下线（用例预期①）
    assert: |-
      const INVALID = '__INVALID_ORG_NOEXIST__';
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业服务介绍/.test(t);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: /service-portal/shenzhen SPA404，无法验非法 org 参数 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 20000 });
      await page.waitForTimeout(2500);
      const keyDrawer = page.locator('.arco-drawer').filter({ has: page.locator('[data-testid="svc-portal-keyorg-drawer"]') });
      const profileDrawer = page.locator('.arco-drawer').filter({ has: page.locator('[data-testid="svc-org-profile-drawer"]') });
      const keyVis = await keyDrawer.locator('visible=true').count();
      const profileVis = await profileDrawer.locator('visible=true').count();
      if (keyVis > 0 || profileVis > 0) {
        throw new Error('非法 org 仍打开抽屉 key=' + keyVis + ' profile=' + profileVis);
      }
      const toast = page.locator('.arco-message-content, .arco-message').filter({ hasText: /机构不存在或已下线/ });
      await expect(toast.first()).toBeVisible({ timeout: 10000 });
  - note: 2、地址栏机构参数被清除（用例预期②）
    assert: |-
      const INVALID = '__INVALID_ORG_NOEXIST__';
      await page.waitForTimeout(800);
      const u = page.url();
      let orgVal = null;
      try { orgVal = new URL(u).searchParams.get('org'); } catch (e) { orgVal = null; }
      if (orgVal === INVALID || (orgVal && orgVal.includes('INVALID_ORG'))) {
        throw new Error('非法 org 参数未被清除: ' + u);
      }
      if (/[?&]org=__INVALID/.test(u)) {
        throw new Error('地址栏仍含非法 org 片段: ' + u);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  用例 catalog_path=/service-portal/overview；无法解析 org 的异常分支由 SvcPortalKeyOrgSection（深圳重点机构墙）承载，query 名 org（readOrgQuery），非法值深链验。Message.error「机构不存在或已下线」后 patchOrg 清参；不打开 keyorg 抽屉（drawerVisibleId 空）。与 01323 合法分享恢复分开。B 档零 allow_skip。edu/tts/svcz SPA404→ENV-EDU-TTS-SVCZ-404-001。
