id: FUNC-03925
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03925
priority: P1
tier: B
title: 重点机构抽屉内加入对比篮后按钮变已在且提示已加入
story: US-SVC-PT-06
entry_id: svc-portal
preconditions:
  - 已打开重点机构详情抽屉且标题区按钮为「加入对比篮」
locators:
  keyorg_card: button.svc-portal-keyorg-card
  btn_join_basket: 抽屉标题区 button「加入对比篮」
  keyorg_drawer: '[data-testid="svc-portal-keyorg-drawer"]'
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: evaluate
    note: 点重点机构卡开抽屉，在标题区点「加入对比篮」
expect:
  - note: 1、抽屉内该按钮变为「已在对比篮」
    assert: |-
      const closeKeyOrgDrawer = async () => {
        const drawer = page.locator('.arco-drawer').filter({ has: page.locator('[data-testid="svc-portal-keyorg-drawer"]') }).first();
        if (!(await drawer.isVisible().catch(() => false))) return;
        const closeIcon = drawer.locator('.arco-drawer-close-icon, button.arco-drawer-close-btn').first();
        if (await closeIcon.count()) {
          await closeIcon.click({ timeout: 3000 }).catch(() => {});
        } else {
          await page.keyboard.press('Escape');
        }
        await expect(drawer).toBeHidden({ timeout: 8000 });
      };
      const closeBasketPanel = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      await closeBasketPanel();
      await expect(page).toHaveURL(/service-portal\/shenzhen/, { timeout: 20000 });
      const cards = page.locator('button.svc-portal-keyorg-card:not([disabled])');
      const n = await cards.count();
      if (n === 0) {
        const empty = await page.getByText(/暂无重点机构/).first().isVisible().catch(() => false);
        if (empty) throw new Error('ENV-SVC-PORTAL-KEY-ORG-EMPTY：重点机构墙诚实空，无法开抽屉验入篮（Q060）');
        throw new Error('重点产业服务机构无可用卡片，无法打开机构详情抽屉');
      }
      let joinBtn = null;
      let orgTitle = '';
      let drawerOpen = null;
      for (let i = 0; i < n; i++) {
        await closeKeyOrgDrawer();
        const card = cards.nth(i);
        await card.scrollIntoViewIfNeeded();
        await card.click({ timeout: 15000 });
        const drawer = page.locator('.arco-drawer').filter({ has: page.locator('[data-testid="svc-portal-keyorg-drawer"]') }).first();
        await expect(drawer).toBeVisible({ timeout: 15000 });
        const titleBar = drawer.locator('.svc-portal-keyorg-drawer-title, .arco-drawer-header').first();
        orgTitle = ((await titleBar.innerText().catch(() => '')) || '').split('\n')[0].replace(/\s+/g, ' ').trim();
        const join = drawer.getByRole('button', { name: '加入对比篮', exact: true });
        if (await join.count() && (await join.isVisible().catch(() => false))) {
          joinBtn = join;
          drawerOpen = drawer;
          break;
        }
      }
      if (!joinBtn || !drawerOpen) {
        throw new Error('前置：未找到抽屉内按钮为「加入对比篮」的重点机构（可能均已入篮或缺 orgId）');
      }
      await joinBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const inBtn = drawerOpen.getByRole('button', { name: '已在对比篮', exact: true });
      await expect(inBtn).toBeVisible({ timeout: 8000 });
      await expect(inBtn).toHaveText('已在对比篮', { timeout: 8000 });
      if (orgTitle) {
        page.__func03925_org = orgTitle.replace(/加入对比篮|已在对比篮|进入分析侧画像/g, '').trim();
      }
  - note: 2、出现已加入该机构的提示
    assert: |-
      const name = page.__func03925_org || '';
      const toast = page.locator('.arco-message-content, .arco-message').filter({
        hasText: name ? new RegExp('已将「' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '」加入对比篮') : /加入对比篮/,
      });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  抽屉标题区 mini 按钮（SvcPortalKeyOrgDrawer.vue addToBasket）；成功 Message.success(`已将「${titleName}」加入对比篮`)。
  goto /service-portal/shenzhen 与用例路由列一致；catalog_path 仍为 /service-portal。与 capability-rank 行内入篮（03913）分开验收。
  墙诚实空 → ENV-SVC-PORTAL-KEY-ORG-EMPTY。登录与关内部评审由 runner 会话前置。
