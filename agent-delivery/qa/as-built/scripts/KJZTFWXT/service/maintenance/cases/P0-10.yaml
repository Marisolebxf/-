# P0-10（FUNC-01360 异常-远端异常·网络异常反馈 · GAP）
# 落局：用例步骤「中断网络连接；刷新页面」经 Playwright BrowserContext.setOffline(true)+reload
# 合法模拟（与兄弟册 CHAINMAINT P1-09/FUNC-01177 同源手法）。写前探针 _probe-p010.mjs 实证：
# 离线 reload → net::ERR_INTERNET_DISCONNECTED + URL=chrome-error://chromewebdata/（非静默占位壳）；
# 在线恢复后深链回页占位文案/H1/title 恢复。D1：反馈形态=浏览器 chrome-error / 导航 ERR
# （占位壳无业务 API，无 .arco-alert 应用层失败态；不钉死应用文案）。零 allow_skip（模拟可构造）。
id: P0-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01360
priority: P1
tier: B
title: 异常-远端异常·网络异常反馈（setOffline+reload；chrome-error/ERR 即明确反馈且不静默占位）
entry_id: svc-maintenance
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入 /service/maintenance（深链等价）
  - 具备网络中断模拟条件（Playwright context.setOffline；脚本内模拟属测试工具合法手法，非改业务环境）
  - 写前探针 fixtures/scout/probe-p010.json（2026-10-15）：baseline 占位壳正常；offline reload ERR_INTERNET_DISCONNECTED + chrome-error；restore 后壳恢复
locators:
  h1: heading「维护管理」（level 1）
  heading_block: section.diagnosis-page-heading（页头 + 占位说明）
  offline: BrowserContext.setOffline / reload（用例「中断网络连接；刷新页面」）
  feedback: chrome-error:// 或 net::ERR_* 或正文「错误/失败/不可用/网络/重试/异常/加载失败」类（D1 跟现场；不钉死应用 alert）
steps:
  - action: goto
    target: /service/maintenance
  - action: assert_url
    expect_contains: /service/maintenance
  - action: evaluate
    note: 关对比篮 → 记基线占位（expect[0]）
  - action: screenshot
    note: 在线基线（占位壳）
  - action: evaluate
    note: setOffline(true)→reload→断言明确反馈且非静默占位（expect[1..2]）→setOffline(false) 恢复（P8）
  - action: screenshot
    note: 离线反馈终态（chrome-error 或异常文案）
expect:
  - note: 前置成立——已进入 /service/maintenance 且占位壳可见（H1「维护管理」+ 占位说明含「入口已对齐 demo 路由」），作为离线刷新对照基线
    assert: |-
      await page.waitForTimeout(600);
      const close = page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      await expect(page).toHaveURL(/\/service\/maintenance/);
      await expect(page.getByRole('heading', { name: '维护管理', level: 1 })).toBeVisible({ timeout: 8000 });
      const heading = page.locator('section.diagnosis-page-heading, .diagnosis-page-heading').first();
      await expect(heading).toBeVisible({ timeout: 8000 });
      const t = ((await heading.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/入口已对齐 demo 路由/.test(t)) throw new Error('基线占位文案异常: ' + t);
      globalThis.__p010BaselineHeading = t;
      globalThis.__p010BaselineUrl = page.url();
      console.log('[P0-10 observed] baseline url=' + globalThis.__p010BaselineUrl + ' heading=' + t);
  - note: 页面呈现明确的异常反馈——中断网络后刷新：出现 chrome-error / net::ERR_* 导航失败，或正文含错误/失败/不可用/网络/重试/异常/加载失败类反馈（形态随 run observed；占位壳无业务 API 失败 alert 时以浏览器层反馈为 as-built）
    assert: |-
      globalThis.__p010ReloadErr = null;
      globalThis.__p010OfflineUrl = null;
      globalThis.__p010OfflineBody = '';
      try {
        await page.context().setOffline(true);
        try {
          await page.reload({ waitUntil: 'domcontentloaded', timeout: 20000 });
        } catch (e) {
          globalThis.__p010ReloadErr = String(e && e.message ? e.message : e).slice(0, 400);
        }
        await page.waitForTimeout(1500);
        globalThis.__p010OfflineUrl = page.url();
        globalThis.__p010OfflineBody = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      } finally {
        try { await page.context().setOffline(false); } catch {}
      }
      const url = String(globalThis.__p010OfflineUrl || '');
      const body = String(globalThis.__p010OfflineBody || '');
      const err = String(globalThis.__p010ReloadErr || '');
      const FEEDBACK = /错误|失败|不可用|网络|重试|异常|加载失败|服务不可用|offline|ERR_|timed?\s*out|无法访问|连接|INTERNET_DISCONNECTED/i;
      const chromeErr = /chrome-error:|chromewebdata|about:blank|data:text\/html/i.test(url);
      const navErr = /ERR_|INTERNET_DISCONNECTED|net::/i.test(err);
      const bodyFb = FEEDBACK.test(body) || FEEDBACK.test(err);
      const hasFeedback = chromeErr || navErr || bodyFb;
      console.log('[P0-10 observed] offline url=' + url + ' reloadErr=' + err.slice(0, 160) + ' bodyHead=' + body.slice(0, 120) + ' hasFeedback=' + hasFeedback);
      if (!hasFeedback) throw new Error('离线刷新未见明确异常反馈（无 chrome-error/ERR/异常文案）url=' + url + ' err=' + err.slice(0, 200) + ' body=' + body.slice(0, 160));
  - note: 页面不静默失败——离线刷新后不得仍呈现「正常可达占位壳」假象（不得同时：URL 仍为 /service/maintenance 且占位说明「入口已对齐 demo 路由」在屏且无任何异常反馈迹象）
    assert: |-
      const url = String(globalThis.__p010OfflineUrl || '');
      const body = String(globalThis.__p010OfflineBody || '');
      const err = String(globalThis.__p010ReloadErr || '');
      const FEEDBACK = /错误|失败|不可用|网络|重试|异常|加载失败|服务不可用|offline|ERR_|timed?\s*out|无法访问|连接|INTERNET_DISCONNECTED/i;
      const stillHappy = /\/service\/maintenance/.test(url) && /入口已对齐 demo 路由/.test(body) && !FEEDBACK.test(body) && !FEEDBACK.test(err) && !/chrome-error:|chromewebdata/i.test(url);
      if (stillHappy) throw new Error('静默失败：离线刷新后仍呈正常占位壳（无异常反馈）url=' + url);
      try {
        await page.goto('https://edu.itic-sci.com/tts/svcz/service/maintenance', { waitUntil: 'domcontentloaded', timeout: 30000 });
        await page.waitForTimeout(1200);
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      } catch (e) {
        console.log('[P0-10 observed] restore goto warn: ' + String(e && e.message ? e.message : e).slice(0, 200));
      }
      console.log('[P0-10 observed] not_silent ok; restore url=' + page.url());
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类；离线后仍正常占位=静默失败缺陷；setOffline 不可用=C2 环境；P8 终态须 setOffline(false)
allow_empty: false
as_built_note: 01360 验服务不可用时异常反馈且不静默失败。kind=GAP。env-gate overall=pass。写前无头探针（_probe-p010.mjs → probe-p010.json + probe-p010-baseline/offline/restored.png，2026-10-15）——①setOffline(true)+reload 可构造中断（reload 抛 net::ERR_INTERNET_DISCONNECTED）；②终态 URL=chrome-error://chromewebdata/，body 对 Playwright 常空、无 .arco-alert（占位壳无业务拉取失败态）；③setOffline(false)+深链回页后占位文案/H1/title 与基线一致。D1 文案/结构 as-built：用例「明确异常反馈」现场承载=浏览器 chrome-error / 导航 ERR（非应用层 alert 文案）；机检认 chrome-error|ERR_*|正文异常关键词任一，并禁「仍正常占位」静默假象。与兄弟册 CHAINMAINT P1-09（01177）同源 setOffline 手法；本条因探针已采到 ERR+chrome-error → **零 allow_skip**（前置「具备网络中断模拟条件」可达），不进 gold。若未来壳页 SW/强缓存致离线仍绿占位，断言应红（静默失败）勿改假绿 skip。P8 末步恢复在线+深链回 maintenance。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
