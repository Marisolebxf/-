id: P0-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01351
priority: P0
title: 侧栏进入维护管理路由与页标题正确
entry_id: svc-maintenance
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 经人设面板关闭内部评审模式（默认可能为开；默认态记 observed）
locators:
  menu: 菜单项「产业服务链分析」→「维护管理」
  title: document title「维护管理 - 科技专题服务系统」
  h1: heading「维护管理」（level 1）
steps:
  - action: goto
    target: /service/maintenance
  - action: assert_url
    expect_contains: /service/maintenance
  - action: assert_visible
    target: heading 维护管理
expect:
  - note: 路由为 /service/maintenance
    assert: |-
      await expect(page).toHaveURL(/\/service\/maintenance/)
  - note: 页标题为「维护管理」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page).toHaveTitle(/维护管理 - 科技专题服务系统/); await expect(page.getByRole('heading', { name: '维护管理', level: 1 })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: 深链等价侧栏到达；document title 现场为「维护管理 - 科技专题服务系统」；主区 H1「维护管理」并存。占位说明文案归 01353（P0-02/03）；页面构成归 01352。对比篮浮层可见才关，非本条断言对象。勿与 chain-maintenance（/industry-center/maintenance）或 ENT-OPS 15 分类实壳混淆。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
