id: FUNC-04890
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04890
priority: P1
tier: B
title: 权限-无权提示
entry_id: svc-maintenance
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/maintenance
expect:
  - note: 1、出现当前账号无权访问该页面的提示
    assert: |-
      const origin = new URL(page.url()).origin;
      const unauthorized = page.locator('.arco-message-content').filter({ hasText: '当前账号无权访问该页面' });
      await Promise.all([
        unauthorized.first().waitFor({ state: 'visible', timeout: 20000 }),
        page.goto(`${origin}/service/maintenance`, { waitUntil: 'commit' }),
      ]);
      await expect(unauthorized.first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
