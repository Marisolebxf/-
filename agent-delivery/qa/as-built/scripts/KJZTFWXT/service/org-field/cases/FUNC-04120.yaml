id: FUNC-04120
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04120
priority: P1
tier: B
title: 异常-失败过程
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页状态为「失败」
    assert: |-
      const main = page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录', exact: true }).click();
      await expect(main.getByTestId('svc-org-analysis-records')).toBeVisible({ timeout: 8000 });
      const failedRow = main.locator('tr').filter({
        has: main.getByRole('cell', { name: '失败', exact: true }),
      }).first();
      if ((await failedRow.count()) === 0) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-FAILED-RECORD：分析记录无失败行（用例要求既有失败任务）');
      }
      await failedRow.getByRole('button', { name: '查看过程', exact: true }).click();
      await expect(main.getByText('失败', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、出现「本次分析生成失败」
    assert: |-
      await expect(page.locator('main').first().getByText('本次分析生成失败').first()).toBeVisible({ timeout: 8000 });
  - note: 3、出现「任务错误详情」
    assert: |-
      await expect(page.locator('main').first().getByText('任务错误详情').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
