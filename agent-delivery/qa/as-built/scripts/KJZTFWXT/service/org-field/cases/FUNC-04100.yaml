id: FUNC-04100
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04100
priority: P0
tier: B
title: 主流程-合作建议 · 建议空态
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、「合作建议」显示「集合内暂无可生成建议的机构」
    assert: |-
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const flatMain = async () =>
        ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      await dismissBasket();
      await expect(page.locator('[role=tab][data-tab-key="coverage"]').first()).toBeVisible({ timeout: 15000 });
      const openBasket = page.getByRole('button', { name: /打开对比篮/ }).first();
      await expect(openBasket).toBeVisible({ timeout: 10000 });
      await openBasket.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const selectAll = page.getByRole('button', { name: /全选当前筛选结果/ }).first();
      if (await selectAll.isVisible().catch(() => false)) {
        await selectAll.click({ timeout: 8000 });
      } else {
        const cb = page.locator('main .arco-checkbox:not(.arco-checkbox-disabled)').first();
        await expect(cb).toBeVisible({ timeout: 8000 });
        await cb.click({ timeout: 8000 });
      }
      await expect(main().getByText(/已选\s+[1-9]\d*\s*家机构/)).toBeVisible({ timeout: 10000 });
      await page.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
      await expect(main().getByText(/已选机构（[1-9]/)).toBeVisible({ timeout: 12000 });
      await page.waitForTimeout(600);
      await dismissBasket();
      await page.getByRole('button', { name: '开始分析' }).first().click({ timeout: 10000 });
      await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 45000 });
      await page.getByRole('button', { name: '查看结果' }).first().click({ timeout: 10000 });
      await page.waitForTimeout(2000);
      let body1 = await flatMain();
      if (!/合作建议|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(body1)) {
        throw new Error('修订 已发起仍为空结果壳');
      }
      globalThis.__func04100 = { firstOpen: true, taskUrl: page.url() };
      const recTab = page.locator('[role=tab][data-tab-key="records"]').first();
      await recTab.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
      await page.waitForTimeout(1000);
      const viewBtn = page.getByRole('button', { name: '查看结果' }).first();
      await expect(viewBtn).toBeVisible({ timeout: 10000 });
      await viewBtn.click({ timeout: 8000 });
      await page.waitForTimeout(2000);
      for (let i = 0; i < 12; i++) {
        body1 = await flatMain();
        if (/合作建议/.test(body1)) break;
        await page.waitForTimeout(1000);
      }
      await expect(main().getByText('合作建议').first()).toBeVisible({ timeout: 10000 });
      await expect(main().getByText('集合内暂无可生成建议的机构').first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
