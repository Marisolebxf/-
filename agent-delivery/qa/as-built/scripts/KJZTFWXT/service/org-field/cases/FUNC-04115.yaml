id: FUNC-04115
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04115
priority: P1
tier: B
title: 备选-刷新保留 · 已选家数
entry_id: svc-org-field
preconditions:
  - 配置区已确定 1 家机构
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、已选机构仍为 1 家
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('产业领域').first()).toBeVisible({ timeout: 15000 });
      const oneLabel = () => main.getByText(/已选机构（1\s*家）/).first();
      const pickTags = () =>
        page.locator('[data-testid="svc-org-analysis-context-field"] .svc-org-pick-tag');
      const ensureOneOrg = async () => {
        if (await oneLabel().isVisible().catch(() => false)) return;
        await main.getByTestId('svc-org-open-compare-basket').click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        const basket = page.locator('[data-testid="service-org-compare-basket-workspace"]');
        await expect(basket).toBeVisible({ timeout: 15000 });
        if (await page.getByText('对比篮暂无服务机构').isVisible().catch(() => false)) {
          await page.getByRole('button', { name: '新增', exact: true }).first().click({ timeout: 8000 });
          await page.waitForTimeout(1000);
          const join = page.getByRole('button', { name: '加入对比篮' }).first();
          await expect(join).toBeVisible({ timeout: 20000 });
          await join.click({ timeout: 8000 });
          await page.waitForTimeout(600);
          const close = page.locator('.arco-modal:visible .arco-modal-close-icon').first();
          if (await close.isVisible().catch(() => false)) {
            await close.click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(400);
          }
        }
        const rowCheck = basket.locator('.arco-checkbox:not(.arco-checkbox-disabled)').first();
        await expect(rowCheck).toBeVisible({ timeout: 12000 });
        const input = rowCheck.locator('input[type="checkbox"]');
        if (!(await input.isChecked().catch(() => false))) {
          await rowCheck.click({ timeout: 8000 });
          await page.waitForTimeout(300);
        }
        await page.getByRole('button', { name: '确定', exact: true }).click({ timeout: 10000 });
        await page.waitForURL(/workspace=field/, { timeout: 20000 });
        await expect(page).toHaveURL(/tab=coverage/);
        await page.waitForTimeout(1200);
        await expect(oneLabel()).toBeVisible({ timeout: 12000 });
      };
      await ensureOneOrg();
      await expect(oneLabel()).toBeVisible({ timeout: 8000 });
      await expect(pickTags()).toHaveCount(1, { timeout: 8000 });
      const beforeName = (await pickTags().first().innerText()).trim();
      await page.reload({ waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(2500);
      await expect(page).toHaveURL(/workspace=field/);
      await expect(page).toHaveURL(/tab=coverage/);
      await expect(oneLabel()).toBeVisible({ timeout: 12000 });
      await expect(pickTags()).toHaveCount(1, { timeout: 8000 });
      const afterName = (await pickTags().first().innerText()).trim();
      if (afterName !== beforeName) {
        throw new Error('刷新后已选机构变化: ' + afterName + ' != ' + beforeName);
      }
on_fail: 截图 + 抄 X-Trace-Id
