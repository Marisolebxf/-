id: FUNC-04118
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04118
priority: P1
tier: B
title: 备选-分组取消
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、该次勾选被撤掉
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 20000 });
      await page.locator('main').getByRole('button', { name: '打开对比篮' }).first().click({ timeout: 10000 });
      const picker = page.locator('main').filter({ hasText: '选择分析服务机构' });
      await expect(picker).toBeVisible({ timeout: 10000 });
      await picker.getByRole('button', { name: '全选当前筛选结果' }).click({ timeout: 8000 });
      const selectedLine = picker.getByText(/已选\s*\d+\s*家机构/);
      await expect(picker.getByText(/已选\s*[1-9]\d*\s*家机构/)).toBeVisible({ timeout: 8000 });
      const afterAll = await selectedLine.innerText();
      const afterMatch = afterAll.match(/已选\s*(\d+)\s*家机构/);
      const afterSelect = afterMatch ? Number(afterMatch[1]) : 0;
      globalThis.__p04118AfterSelect = afterSelect;
      await picker.getByRole('button', { name: '取消选择' }).click({ timeout: 8000 });
      const nowText = await selectedLine.innerText();
      const nowMatch = nowText.match(/已选\s*(\d+)\s*家机构/);
      const nowCount = nowMatch ? Number(nowMatch[1]) : -1;
      await expect(nowCount).toBeLessThan(afterSelect);
  - note: 2、弹窗「已选」家数减少
    assert: |-
      const afterSelect = globalThis.__p04118AfterSelect;
      if (!afterSelect || afterSelect < 1) throw new Error('前置：未执行分组全选');
      const picker = page.locator('main').filter({ hasText: '选择分析服务机构' });
      await expect(picker.getByText(/已选\s*0\s*家机构/)).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
