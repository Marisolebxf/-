id: FUNC-04118
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04118
priority: P1
tier: B
title: 备选-分组取消 · 取消该组勾选
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 已打开「选择服务机构」；刚在某一类型下完成勾选（脚本用分组「全选」）
locators:
  pick_btn: button「选择机构」
  modal: data-testid=svc-org-picker-modal
  group_head: .svc-org-picker-group__head
  group_select_all: button「全选」（分组头内）
  group_cancel: button「取消」（分组头内，非 footer）
  footer_count: .svc-org-picker-footer__count
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：打开机构弹窗并在某一类型分组点击「全选」完成勾选
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl ? baseUrl : 'http://10.50.69.111:30892').replace(/\/$/, '');
      const spaUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const tabsReady = async () => {
        const m = page.locator('[role=tab][data-tab-key="coverage"]');
        return (await m.count()) > 0 && (await m.first().isVisible().catch(() => false));
      };
      const clickMenuLeaf = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForTimeout(2500);
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (/sso\/user\/login|itic-sci\.com\/sso/i.test(page.url())) return false;
        if (await bodyIs404()) return false;
        await clickMenuLeaf();
        return (await tabsReady()) && !(await bodyIs404());
      };
      const ensureOnFieldCoverage = async () => {
        await dismissBasket();
        if (page.url().includes('/login') || page.url().includes('itic-sci.com/sso')) {
          throw new Error('ENV-EDU-TTS-SVCZ-SESSION-001: 会话已掉线 url=' + page.url());
        }
        if (/view=result|view=processing|[?&]task_id=/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (await bodyIs404() || !(await tabsReady())) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          await clickMenuLeaf();
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
          let ok = false;
          for (const s of siblings) {
            if (await enterViaSidebar(s)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均不可达 field/coverage url=' + page.url());
          }
        }
        await expect(page).toHaveURL(/\/service\/institution-judgment/, { timeout: 15000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        const cfgTab = page.locator('[role=tab][data-tab-key="coverage"]').first();
        const sel = await cfgTab.getAttribute('aria-selected').catch(() => 'true');
        if (sel === 'false') {
          await cfgTab.click({ timeout: 8000 });
          await page.waitForTimeout(600);
        }
      };
      const resetToZeroOrgs = async () => {
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      const parseFooterCount = async (dialog) => {
        const foot = dialog.locator('.svc-org-picker-footer__count').first();
        const txt = ((await foot.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = txt.match(/已选\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : -1;
      };
      const clearModalSearch = async (dialog) => {
        const search = dialog.getByPlaceholder('搜索机构名称 / 类型');
        await expect(search).toBeVisible({ timeout: 8000 });
        let val = (await search.inputValue().catch(() => '')).trim();
        if (val) {
          const clearBtn = dialog.locator('.svc-org-picker-search .arco-input-clear-icon, .arco-input-clear-btn').first();
          if (await clearBtn.count() && (await clearBtn.isVisible().catch(() => false))) {
            await clearBtn.click({ timeout: 3000 });
          } else {
            await search.fill('');
          }
          await page.waitForTimeout(900);
        }
      };
      await ensureOnFieldCoverage();
      await resetToZeroOrgs();
      const pickBtn = page
        .locator('[data-testid="svc-org-open-picker"]')
        .or(page.getByRole('button', { name: '选择机构', exact: true }))
        .first();
      await expect(pickBtn).toBeVisible({ timeout: 15000 });
      await pickBtn.click({ timeout: 10000 });
      await page.waitForTimeout(900);
      const dialog = page.locator('[data-testid="svc-org-picker-modal"], .arco-modal:visible')
        .filter({ hasText: '选择服务机构' })
        .first();
      await expect(dialog).toBeVisible({ timeout: 12000 });
      await clearModalSearch(dialog);
      const groups = dialog.locator('.svc-org-picker-group');
      await expect(groups.first()).toBeVisible({ timeout: 15000 });
      let target = null;
      let targetSize = 0;
      let groupIndex = -1;
      const groupN = await groups.count();
      for (let g = 0; g < Math.min(groupN, 12); g++) {
        const group = groups.nth(g);
        const headStrong = group.locator('.svc-org-picker-group__head strong').first();
        const headTxt = ((await headStrong.innerText().catch(() => '')) || '').trim();
        const m = headTxt.match(/（(\d+)）/);
        const size = m ? parseInt(m[1], 10) : 0;
        const cardCount = await group.locator('.svc-org-picker-card').count();
        if (size >= 1 && cardCount >= 1) {
          target = group;
          targetSize = size;
          groupIndex = g;
          break;
        }
      }
      if (!target || targetSize < 1) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：未找到含机构的类型分组');
      const countBefore = await parseFooterCount(dialog);
      if (countBefore < 0) throw new Error('未能读取弹窗已选家数');
      const selectAllBtn = target
        .locator('.svc-org-picker-group__head')
        .locator('button, .arco-btn')
        .filter({ hasText: /^全选$/ })
        .first();
      await expect(selectAllBtn).toBeVisible({ timeout: 8000 });
      await selectAllBtn.click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const countAfterSelect = await parseFooterCount(dialog);
      if (countAfterSelect <= countBefore) {
        throw new Error('分组全选后已选未增加：前=' + countBefore + ' 后=' + countAfterSelect);
      }
      globalThis.__p04118 = { countBefore, countAfterSelect, targetSize, groupIndex };
  - note: 1、该次勾选被撤掉；2、弹窗「已选」家数减少
    assert: |-
      const snap = globalThis.__p04118;
      if (!snap || snap.groupIndex < 0) throw new Error('前置：未完成分组勾选');
      const dialog = page.locator('[data-testid="svc-org-picker-modal"], .arco-modal:visible')
        .filter({ hasText: '选择服务机构' })
        .first();
      await expect(dialog).toBeVisible({ timeout: 8000 });
      const groups = dialog.locator('.svc-org-picker-group');
      const target = groups.nth(snap.groupIndex);
      const cancelBtn = target
        .locator('.svc-org-picker-group__head')
        .locator('button, .arco-btn')
        .filter({ hasText: /^取消$/ })
        .first();
      await expect(cancelBtn).toBeVisible({ timeout: 8000 });
      await cancelBtn.click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const cards = target.locator('.svc-org-picker-card');
      const n = await cards.count();
      for (let i = 0; i < n; i++) {
        const card = cards.nth(i);
        const box = card.locator('.arco-checkbox');
        const cls = (await box.getAttribute('class').catch(() => '')) || '';
        const selected = /arco-checkbox-checked/.test(cls) || (await card.evaluate((el) => el.classList.contains('is-selected')).catch(() => false));
        if (selected) throw new Error('分组取消后仍有勾选机构，index=' + i);
      }
      const foot = dialog.locator('.svc-org-picker-footer__count').first();
      const txt = ((await foot.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const m = txt.match(/已选\s*(\d+)\s*家/);
      const countAfterCancel = m ? parseInt(m[1], 10) : -1;
      if (countAfterCancel < 0) throw new Error('未能读取弹窗已选家数: ' + txt);
      if (countAfterCancel >= snap.countAfterSelect) {
        throw new Error('分组取消后已选未减少：全选后=' + snap.countAfterSelect + ' 取消后=' + countAfterCancel);
      }
      if (countAfterCancel !== snap.countBefore) {
        throw new Error('已选家数应回到分组操作前：期望=' + snap.countBefore + ' 实际=' + countAfterCancel);
      }
      await expect(foot).toContainText('已选 ' + snap.countBefore);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04118=选择服务机构 Modal 分组头「取消」（.svc-org-picker-group__head 内 /^取消$/，非 .arco-modal-footer 底部取消，口径同 P0-06 NOTE-SVC-ORG-FIELD-MODAL-CANCEL）。
  前置用同组「全选」制造该类型下勾选；点分组取消后该组卡片 .arco-checkbox-checked 清空且 footer .svc-org-picker-footer__count「已选 N 家」回到全选前。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage（entry-seed）。B 档。
