id: FUNC-04112
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04112
priority: P1
tier: B
title: 备选-配置区清空
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、已选机构为 0 家
    assert: |-
      await expect(page).toHaveURL(/workspace=field/, { timeout: 15000 });
      const countLine = page.getByText(/已选机构（\d+\s*家）/).first();
      await expect(countLine).toBeVisible({ timeout: 12000 });
      let countText = await countLine.innerText();
      let m = countText.match(/（(\d+)\s*家）/);
      let n = m ? parseInt(m[1], 10) : 0;
      if (n < 1) {
        await page.getByRole('button', { name: /打开对比篮/ }).first().click({ timeout: 8000 });
        const picker = page.locator('body').filter({ hasText: '选择分析服务机构' });
        await expect(picker.getByText('选择分析服务机构').first()).toBeVisible({ timeout: 12000 });
        await picker.locator('.arco-checkbox').first().click({ timeout: 8000 });
        await expect(picker.getByText(/已选\s*1\s*家机构/)).toBeVisible({ timeout: 8000 });
        await picker.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await expect(page.getByText('已选机构（1 家）').first()).toBeVisible({ timeout: 12000 });
      }
      const configBar = page.locator('.svc-context-bar').filter({ hasText: '已选机构' }).first();
      const clearBtn = configBar.getByRole('button', { name: '清空', exact: true });
      await expect(clearBtn).toBeVisible({ timeout: 8000 });
      await clearBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page.getByText('已选机构（0 家）').first()).toBeVisible({ timeout: 8000 });
  - note: 2、出现「未选择机构」
    assert: |-
      await expect(page.getByText('未选择机构').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
