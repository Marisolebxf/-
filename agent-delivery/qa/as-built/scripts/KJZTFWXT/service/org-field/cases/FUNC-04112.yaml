id: FUNC-04112
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04112
priority: P1
tier: B
title: 备选-配置区清空
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 配置区已回显至少 1 家（脚本自含：选 1 家并点「确定」）
locators:
  pick_btn: button「选择机构」
  config_clear: main 分析配置区 button「清空」（非弹窗 footer）
  empty_hint: text「未选择机构」/「已选机构（0 家）」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：配置区已确认至少 1 家机构
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const tabsReady = async () => {
        const m = page.locator('[role=tab][data-tab-key="coverage"]');
        return (await m.count()) > 0 && (await m.first().isVisible().catch(() => false));
      };
      const clickMenuLeaf = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForTimeout(2500);
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (/sso\/user\/login|itic-sci\.com\/sso/i.test(page.url())) return false;
        if (await bodyIs404()) return false;
        await clickMenuLeaf();
        return (await tabsReady()) && !(await bodyIs404());
      };
      const ensureOnFieldCoverage = async () => {
        await dismissBasket();
        if (page.url().includes('/login') || page.url().includes('itic-sci.com/sso')) {
          throw new Error('ENV-EDU-TTS-SVCZ-SESSION-001: 会话已掉线 url=' + page.url());
        }
        if (await bodyIs404() || !(await tabsReady())) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          await clickMenuLeaf();
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
          let ok = false;
          for (const s of siblings) {
            if (await enterViaSidebar(s)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            throw new Error(
              'ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均不可达 field/coverage url=' + page.url()
            );
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析入口不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/\/service\/institution-judgment/, { timeout: 15000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      };
      const pickOneOrgInConfig = async () => {
        const main = page.locator('main').first();
        const t0 = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t0)) return;
        const pick = page.getByRole('button', { name: '选择机构', exact: true }).first();
        await expect(pick).toBeVisible({ timeout: 12000 });
        await pick.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const dialog = page.locator('[data-testid="svc-org-picker-modal"], .arco-modal:visible')
          .filter({ hasText: '选择服务机构' })
          .first();
        await expect(dialog).toBeVisible({ timeout: 12000 });
        const checks = dialog.locator('.svc-org-picker-card .arco-checkbox:not(.arco-checkbox-disabled), .arco-checkbox:not(.arco-checkbox-disabled)');
        const n = await checks.count();
        if (n < 1) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：弹窗无可勾选机构');
        await checks.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await dialog.getByRole('button', { name: '确定', exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await expect(main.getByText(/已选机构（[1-9]\d*\s*家）/).first()).toBeVisible({ timeout: 8000 });
      };
      await ensureOnFieldCoverage();
      await pickOneOrgInConfig();
      const main = page.locator('main').first();
      const t = ((await main.innerText().catch(() => '')) || '');
      const m = t.match(/已选机构（(\d+)\s*家）/);
      const countBefore = m ? parseInt(m[1], 10) : 0;
      if (countBefore < 1) throw new Error('前置：配置区已选仍 <1，text=' + t.slice(0, 280));
      globalThis.__p04112 = { countBefore };
  - note: 1、点击配置区「清空」后已选机构为 0 家；2、出现「未选择机构」（无二次确认框）
    assert: |-
      const snap = globalThis.__p04112;
      if (!snap || snap.countBefore < 1) throw new Error('前置：配置区未回显机构');
      const main = page.locator('main').first();
      const configClear = main.getByRole('button', { name: '清空', exact: true }).first();
      await expect(configClear).toBeVisible({ timeout: 8000 });
      const modalOpen = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' });
      if (await modalOpen.count()) {
        throw new Error('前置：弹窗仍打开，无法区分配置区清空');
      }
      await configClear.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const confirm = page.locator('.arco-modal:visible').filter({ hasText: /确认|二次|确定要/ });
      if (await confirm.count()) {
        throw new Error('出现二次确认框（用例要求无确认）');
      }
      const t = ((await main.innerText().catch(() => '')) || '');
      const m = t.match(/已选机构（(\d+)\s*家）/);
      const countAfter = m ? parseInt(m[1], 10) : -1;
      if (countAfter !== 0) {
        throw new Error('配置区清空后已选应为 0 家：前=' + snap.countBefore + ' 后=' + countAfter);
      }
      await expect(main.getByText(/未选择机构|已选机构（0\s*家）/).first()).toBeVisible({ timeout: 8000 });
      const tags = main.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag, .svc-org-pick-tag');
      const tagN = await tags.count();
      for (let i = 0; i < tagN; i++) {
        const vis = await tags.nth(i).isVisible().catch(() => false);
        if (vis) throw new Error('清空后仍有可见已选标签 count=' + tagN);
      }
      if (/分析条件已就绪/.test(t)) {
        throw new Error('清空后不应仍显示分析条件已就绪');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04112=分析配置 main 区「清空」（scout 与 04109 弹窗 footer 清空区分；有已选时配置区才出现清空）。
  清空后「已选机构（0 家）」+「未选择机构」同屏；无二次确认。catalog_path 同 entry-seed。B 档零 allow_skip。
