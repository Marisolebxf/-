id: FUNC-04091
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04091
priority: P1
tier: B
title: 主流程-过程页用时
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页展示「已用时间」
    assert: |-
      const main = page.locator('main').first();
      const surface = page.locator('[data-system-surface-id="compare-basket"]');
      await expect(main.getByRole('button', { name: '开始分析', exact: true }).first()).toBeVisible({ timeout: 12000 });
      await main.getByRole('button', { name: '打开对比篮', exact: true }).first().click({ timeout: 8000 });
      await expect(surface).toHaveAttribute('data-panel-open', 'true', { timeout: 10000 });
      const selectAll = surface.getByRole('button', { name: '全选当前筛选结果' });
      if (await selectAll.count()) {
        await selectAll.first().click({ timeout: 8000 });
      } else {
        await surface.locator('.arco-checkbox:not(.arco-checkbox-disabled)').first().click({ timeout: 5000 });
      }
      await surface.getByRole('button', { name: '确定' }).first().click({ timeout: 8000 });
      await expect(main.getByText(/已选机构（[1-9]\d* 家）/).first()).toBeVisible({ timeout: 12000 });
      await main.getByRole('button', { name: '开始分析', exact: true }).first().click({ timeout: 8000 });
      await expect(main.getByText('已用时间').first()).toBeVisible({ timeout: 15000 });
      const processUrl = page.url();
      if (/task_id=/.test(processUrl)) {
        await page.goto('/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await page.goto(processUrl, { waitUntil: 'domcontentloaded' });
        await expect(main.getByText('已用时间').first()).toBeVisible({ timeout: 12000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
