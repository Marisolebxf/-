id: FUNC-04091
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04091
priority: P0
tier: A
title: 主流程-过程页用时
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已打开一次分析的过程页（脚本内先发起 1 次分析进入过程页）
locators:
  org_picker: button「选择机构」
  modal_title: 选择服务机构
  confirm: button「确定」
  start: button「开始分析」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页展示「已用时间」（先进入过程页，再打开该次过程页 URL）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const resetConfig = async () => {
        if (/org_ids|view=/.test(page.url())) {
          await page.goto('/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      const startOneAnalysis = async () => {
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
        await page.getByRole('button', { name: '选择机构', exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const dialog = page.locator('.arco-modal:visible, .arco-modal').filter({ hasText: '选择服务机构' }).first();
        await expect(dialog).toBeVisible({ timeout: 8000 });
        const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
        if (!(await checks.count())) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：弹窗无可勾选机构');
        await checks.first().click({ timeout: 5000 });
        await page.waitForTimeout(300);
        await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
        const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 8000 });
        let mainText = '';
        for (let i = 0; i < 40; i++) {
          await page.waitForTimeout(i === 0 ? 800 : 2000);
          mainText = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
          if (/view=processing|[?&]task_id=/.test(page.url()) && /分析对象|分析结果已生成|服务机构产业领域分析生成中|任务已创建/.test(mainText)) break;
          if (/本次分析生成失败|分析失败|create 失败/.test(mainText)) {
            throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：分析未成功进入过程页');
          }
        }
        if (!/[?&]view=processing|[?&]task_id=/.test(page.url()) && !/分析对象|分析结果已生成/.test(mainText)) {
          throw new Error('超时未进入过程页: ' + page.url() + ' ' + mainText.slice(0, 200));
        }
        return page.url();
      };
      await dismissBasket();
      await resetConfig();
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析 SPA 404 ' + page.url());
      }
      const processUrl = await startOneAnalysis();
      if (!processUrl || !/task_id=/.test(processUrl)) {
        throw new Error('过程页 URL 未携带 task_id: ' + processUrl);
      }
      await page.goto('/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      await page.goto(processUrl, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1500);
      const main = page.locator('main').first();
      const after = ((await main.innerText().catch(() => '')) || '').trim();
      if (/404|页面不存在|抱歉，页面不存在/.test(after)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 重开过程页 SPA404 ' + page.url());
      }
      await expect(main.getByText('已用时间').first()).toBeVisible({ timeout: 10000 });
      if (!/\d+\s*秒|已用时间/.test(after)) {
        throw new Error('过程页未见已用时间数值: ' + after.slice(0, 280));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  过程页元信息表含「已用时间」列（scout 常见「1 秒」）。步骤=首发进入过程页→回配置→再 goto 同 task 过程 URL。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage。
