      const closeB = async () => { const close = page.locator('[aria-label="关闭对比篮"]'); if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } }; const pick = page.getByRole('button', { name: '选择机构' }).first(); await pick.click({ timeout: 8000 }); await page.waitForTimeout(800); const dialog = page.locator('.arco-modal:visible, .arco-modal').filter({ hasText: '选择服务机构' }).first(); await expect(dialog).toBeVisible({ timeout: 8000 }); const boxes = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)'); for (let i = 0; i < 20 && !(await boxes.count()); i++) { const body = dialog.locator('.arco-modal-body, .arco-table-body, .arco-list').first(); if (await body.count()) { try { await body.evaluate((el) => { el.scrollTop = (el.scrollTop || 0) + 240 }) } catch {} } await page.waitForTimeout(400) }; if (!(await boxes.count())) { await page.keyboard.press('Escape').catch(() => {}); await page.waitForTimeout(400); await page.goto('http://10.50.69.111:30892/service/institution-judgment?workspace=field&tab=coverage&org_ids[]=79bbcfc0e68027808f1f4caf1b6f0469', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); globalThis.__p014_select = 'deeplink_fallback' } else { try { await boxes.first().scrollIntoViewIfNeeded() } catch {}; await boxes.first().click({ timeout: 8000 }); await page.waitForTimeout(300); await dialog.getByRole('button', { name: '确定', exact: true }).last().click({ timeout: 8000 }); await page.waitForTimeout(1200); globalThis.__p014_select = 'modal_pick' }; await closeB(); await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 }); const start = page.getByRole('button', { name: '开始分析', exact: true }).first(); await expect(start).toBeEnabled({ timeout: 8000 }); await start.click({ timeout: 8000 }); await page.waitForTimeout(3500); let reached = false; for (let i = 0; i < 24 && !reached; i++) { const mt = ((await page.locator('main').first().innerText().catch(() => '')) || ''); if (/view=result/.test(page.url()) || /当前结果快照没有覆盖矩阵|暂无覆盖数据|服务机构产业领域服务广度/.test(mt)) { reached = true; break } const viewBtn = page.getByRole('button', { name: /查看结果/ }).first(); if ((await viewBtn.count()) && (await viewBtn.isVisible().catch(() => false)) && !(await viewBtn.isDisabled().catch(() => true))) { await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(2500); reached = true; break } await page.waitForTimeout(1500) }; if (!reached || !(/当前结果快照没有覆盖矩阵|暂无覆盖数据/.test(((await page.locator('main').first().innerText().catch(() => '')) || '')))) { await page.locator('[role=tab][data-tab-key="records"]').first().click({ timeout: 8000 }); await page.waitForTimeout(1200); const allView = page.locator('main').getByRole('button', { name: '查看结果' }); const av = await allView.count(); let clicked = false; for (let i = 0; i < av; i++) { const b = allView.nth(i); if (await b.isEnabled().catch(() => false)) { await b.click({ timeout: 8000 }); await page.waitForTimeout(2500); clicked = true; globalThis.__p014_hist = i; break } } if (!clicked) throw new Error('过程未出查看结果且分析记录无可用查看结果'); reached = true }; await closeB(); const main = ((await page.locator('main').first().innerText().catch(() => '')) || ''); const honestMatrix = /当前结果快照没有覆盖矩阵/.test(main); const noCover = /暂无覆盖数据/.test(main); if (!honestMatrix && !noCover) throw new Error('结果态未见无覆盖诚实空文案: ' + main.slice(0, 320)); if (!/暂无可排名机构/.test(main)) throw new Error('未见「暂无可排名机构」（空数据应不参与排名）: ' + main.slice(0, 280)); const board = page.locator('.svc-org-coverage, [data-testid="svc-org-coverage-board"]').first(); const charts = await page.locator('main canvas, main [_echarts_instance_], main .echarts-for-react').count(); if (charts > 0 && honestMatrix) throw new Error('诚实空矩阵态仍渲染图表（疑 0 填充）count=' + charts); if (charts > 0 && noCover && !honestMatrix) { const canvasN = await board.locator('canvas:visible').count().catch(() => 0); if (canvasN > 0) throw new Error('「暂无覆盖数据」态仍见 canvas（疑 0 填色）') }; globalThis.__p014_path = noCover ? 'no_cover' : 'honest_matrix'; console.log('[P0-14 observed] result ok path=' + globalThis.__p014_path + ' select=' + (globalThis.__p014_select || '') + ' charts=' + charts + ' hist=' + (globalThis.__p014_hist ?? -1))
