      await page.goto('http://10.50.69.111:30892/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); if (/org_ids|view=/.test(page.url())) { await page.goto('http://10.50.69.111:30892/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) }; const close = page.locator('[aria-label="关闭对比篮"]'); if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const main = page.locator('main').first(); const t = ((await main.innerText().catch(() => '')) || ''); if (!/已选机构（0\s*家）|未选择机构|请先选择分析机构/.test(t)) throw new Error('未见配置空态文案: ' + t.slice(0, 220)); if (/view=result|view=processing/.test(page.url())) throw new Error('配置空态 URL 不应进入结果/过程: ' + page.url()); const charts = await main.locator('canvas, [_echarts_instance_], .echarts-for-react').count(); if (charts > 0) throw new Error('配置空态出现图表渲染 count=' + charts); if (/热力图|矩阵图/.test(t) && !/请先选择分析机构/.test(t)) throw new Error('配置空态出现热力/矩阵结果文案'); console.log('[P0-14 observed] configEmpty ok charts=0')
