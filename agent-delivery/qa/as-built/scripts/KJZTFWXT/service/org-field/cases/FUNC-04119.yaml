id: FUNC-04119
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04119
priority: P1
tier: B
title: 备选-清空搜索
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、类型分组恢复为金融服务、科技创新服务、咨询服务与未分类
    assert: |-
      await expect(page.locator('[data-testid="svc-org-analysis-config"]')).toBeVisible({ timeout: 12000 });
      await page.getByRole('button', { name: '打开对比篮' }).first().click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const addBtn = page.getByRole('button', { name: '新增' });
      await expect(addBtn.first()).toBeVisible({ timeout: 12000 });
      await addBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const dialog = page.locator('[data-testid="svc-org-picker-modal"], .arco-modal').filter({ hasText: '选择服务机构' }).first();
      await expect(dialog).toBeVisible({ timeout: 15000 });
      const search = dialog.getByPlaceholder('搜索机构名称 / 类型');
      await expect(search).toBeVisible({ timeout: 8000 });
      await search.fill('科技');
      await page.waitForTimeout(600);
      await search.fill('');
      await page.waitForTimeout(600);
      for (const label of ['金融服务', '科技创新服务', '咨询服务', '未分类']) {
        await expect(dialog.getByText(label, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
