id: FUNC-04110
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04110
priority: P1
tier: B
title: 备选-弹窗取消 · 已选不变
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 配置区已确定 1 家机构（脚本自含：对比篮 picker 选 1 家并点「确定」）
locators: {}
steps:
  - action: goto
    target: /
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：配置区已确认 1 家机构；再次打开 picker 并另勾 1 家（未点确定）
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText(/已选机构（\d+\s*家）/).first()).toBeVisible({ timeout: 15000 });
      const openBasket = async () => {
        const btn = main.getByRole('button', { name: /打开对比篮/ }).first();
        await expect(btn).toBeVisible({ timeout: 10000 });
        await btn.click({ timeout: 10000 });
        await page.waitForTimeout(800);
        const bar = page.locator('[data-testid="compare-basket-action-bar"]:visible').first();
        await expect(bar).toBeVisible({ timeout: 12000 });
        return bar;
      };
      const pickFirstOrgInBar = async (bar) => {
        const panel = bar.locator('xpath=ancestor::div[contains(@class,"system-compare")]').first();
        const root = (await panel.count()) ? panel : page.locator('body');
        let checks = root.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
        if (!(await checks.count())) {
          const add = root.getByRole('button', { name: '新增' }).first();
          if (await add.isVisible().catch(() => false)) {
            await add.click({ timeout: 8000 });
            await page.waitForTimeout(1000);
            const addModal = page.locator('.arco-modal:visible').filter({ hasText: /机构/ }).first();
            await expect(addModal).toBeVisible({ timeout: 12000 });
            const join = addModal.locator('.arco-btn').filter({ hasText: /^加入$/ }).first();
            if (!(await join.count())) {
              const rowJoin = addModal.getByRole('button', { name: '加入' }).first();
              await rowJoin.click({ timeout: 8000 }).catch(async () => {
                await addModal.locator('tbody tr').first().click({ timeout: 5000 });
                await addModal.getByRole('button', { name: '加入' }).first().click({ timeout: 8000 });
              });
            } else {
              await addModal.locator('tbody tr').first().click({ timeout: 5000 }).catch(() => {});
              await join.click({ timeout: 8000 });
            }
            await page.waitForTimeout(800);
            checks = root.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
          }
        }
        if (!(await checks.count())) throw new Error('对比篮 picker 无可勾选机构');
        return checks;
      };
      let bar = await openBasket();
      let checks = await pickFirstOrgInBar(bar);
      await checks.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await bar.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await expect(main.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      const tags = main.locator('[data-testid="svc-org-analysis-config"] .svc-org-pick-tag, [data-testid^="svc-org-analysis-context"] .svc-org-pick-tag');
      await expect(tags).toHaveCount(1, { timeout: 8000 });
      const confirmedName = (await tags.first().innerText()).trim();
      globalThis.__p04110 = { confirmedName };
      bar = await openBasket();
      checks = bar.locator('xpath=ancestor::div[1]').locator('.arco-checkbox:not(.arco-checkbox-disabled)');
      if (!(await checks.count())) checks = page.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
      const checked = page.locator('.arco-checkbox.arco-checkbox-checked:not(.arco-checkbox-disabled)');
      if ((await checked.count()) < 1) throw new Error('重开 picker 应有 1 家已勾选');
      const unchecked = page.locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)');
      if (!(await unchecked.count())) throw new Error('picker 无第二家可加选');
      await unchecked.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const barTxt = ((await bar.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/已选\s*2\s*家/.test(barTxt)) throw new Error('picker 计数非 2 家: ' + barTxt.slice(0, 80));
      globalThis.__p04110.pendingSecond = true;
  - note: 1、配置区仍是原来的 1 家；2、新勾选的机构没有加入
    assert: |-
      const snap = globalThis.__p04110;
      if (!snap?.confirmedName || !snap.pendingSecond) throw new Error('前置：未完成 picker 内加选');
      const bar = page.locator('[data-testid="compare-basket-action-bar"]:visible').first();
      await expect(bar).toBeVisible({ timeout: 8000 });
      await bar.locator('button:visible').filter({ hasText: /^取消$/ }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await expect(bar).toBeHidden({ timeout: 10000 });
      const main = page.locator('main').first();
      await expect(main.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      const tags = main.locator('[data-testid="svc-org-analysis-config"] .svc-org-pick-tag, [data-testid^="svc-org-analysis-context"] .svc-org-pick-tag');
      await expect(tags).toHaveCount(1, { timeout: 8000 });
      const afterName = (await tags.first().innerText()).trim();
      if (afterName !== snap.confirmedName) {
        throw new Error('取消后已选机构被改: ' + afterName + ' != ' + snap.confirmedName);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04110=对比篮 picker：先选 1 家确定，再开 picker 另勾 1 家后 action-bar「取消」；配置区仍 1 家且 tag 不变。
  入口按钮「打开对比篮」（步骤「选择机构」对齐源码可见名）。B 档 tier。
