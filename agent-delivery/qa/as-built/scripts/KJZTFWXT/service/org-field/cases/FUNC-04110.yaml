id: FUNC-04110
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04110
priority: P1
tier: B
title: 备选-弹窗取消 · 已选不变
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 配置区已确定 1 家机构（脚本自含：选 1 家并点「确定」）
locators:
  pick_btn: button「选择机构」
  modal: data-testid=svc-org-picker-modal
  confirm: .arco-modal-footer button「确定」（footer 内 last）
  cancel: .arco-modal-footer button「取消」（footer 内 last，禁分组头同名）
  selected_label: 已选机构（N 家）
  selected_tag: '[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'
steps:
  - action: goto
    target: /
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：配置区已确认 1 家机构；再次打开弹窗并另勾 1 家（未点确定）
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const tabsReady = async () => {
        const m = page.locator('[role=tab][data-tab-key="coverage"]');
        return (await m.count()) > 0 && (await m.first().isVisible().catch(() => false));
      };
      const clickMenuLeaf = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForTimeout(2500);
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (/sso\/user\/login|itic-sci\.com\/sso/i.test(page.url())) return false;
        if (await bodyIs404()) return false;
        await clickMenuLeaf();
        return (await tabsReady()) && !(await bodyIs404());
      };
      const ensureOnFieldCoverage = async () => {
        await dismissBasket();
        if (page.url().includes('/login') || /sso\/user\/login|itic-sci\.com\/sso/i.test(page.url())) {
          throw new Error('ENV-EDU-TTS-SVCZ-SESSION-001: 会话已掉线 url=' + page.url());
        }
        if (await bodyIs404() || !(await tabsReady())) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          await clickMenuLeaf();
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
          let ok = false;
          for (const s of siblings) {
            if (await enterViaSidebar(s)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均不可达 field/coverage url=' + page.url());
          }
        }
        await expect(page).toHaveURL(/\/service\/institution-judgment/, { timeout: 15000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
      };
      const resetConfig = async () => {
        if (/view=result|view=processing|[?&]task_id=|[?&]org_ids/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      const openPicker = async () => {
        await page.getByRole('button', { name: '选择机构', exact: true }).first().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        const dialog = page.locator('[data-testid="svc-org-picker-modal"], .arco-modal:visible')
          .filter({ hasText: '选择服务机构' })
          .first();
        await expect(dialog).toBeVisible({ timeout: 12000 });
        return dialog;
      };
      await ensureOnFieldCoverage();
      await resetConfig();
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      let dialog = await openPicker();
      const checks = dialog.locator('.svc-org-picker-card .arco-checkbox:not(.arco-checkbox-disabled), .arco-checkbox:not(.arco-checkbox-disabled)');
      const n = await checks.count();
      if (n < 1) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：弹窗无可勾选机构');
      await checks.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await dialog.locator('.arco-modal-footer button:visible').filter({ hasText: /^确定$/ }).last().click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag');
      await expect(tags).toHaveCount(1, { timeout: 8000 });
      const confirmedCode = (await tags.first().innerText()).trim();
      globalThis.__p04110 = { confirmedCode };
      dialog = await openPicker();
      const checked0 = await dialog.locator('.arco-checkbox.arco-checkbox-checked:not(.arco-checkbox-disabled)').count();
      if (checked0 !== 1) throw new Error('重开弹窗回显勾选数应为 1，实际 ' + checked0);
      const unchecked = dialog.locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)');
      if (!(await unchecked.count())) throw new Error('弹窗无未勾选机构可加选');
      await unchecked.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const footTxt = ((await dialog.locator('.arco-modal-footer').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/已选\s*2\s*家/.test(footTxt)) throw new Error('弹窗 footer 计数非 2 家（另勾未生效）: ' + footTxt.slice(0, 120));
      globalThis.__p04110.pendingSecond = true;
  - note: 1、配置区仍是原来的 1 家；2、新勾选的机构没有加入（弹窗取消后 container 卸载）
    assert: |-
      const snap = globalThis.__p04110;
      if (!snap || !snap.confirmedCode || !snap.pendingSecond) throw new Error('前置：未完成弹窗内加选');
      const dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first();
      await expect(dialog).toBeVisible({ timeout: 8000 });
      const cancel = dialog.locator('.arco-modal-footer button:visible').filter({ hasText: /^取消$/ }).last();
      await expect(cancel).toBeVisible({ timeout: 8000 });
      await cancel.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const gone = await page.evaluate(() => !document.querySelector('.arco-modal-container'));
      if (!gone) throw new Error('取消后弹窗容器未卸载');
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag');
      await expect(tags).toHaveCount(1, { timeout: 8000 });
      const afterCode = (await tags.first().innerText()).trim();
      if (afterCode !== snap.confirmedCode) {
        throw new Error('取消后已选机构被改: ' + afterCode + ' != ' + snap.confirmedCode);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04110=配置区已确认 1 家后重开弹窗另勾 1 家再 footer「取消」（.arco-modal-footer 内 last，禁分组头同名取消）；
  取消后 .arco-modal-container 卸载，配置区仍「已选机构（1 家）」且 tag 编码不变。入口预热同 FUNC-04102（goto / + tabsReady 侧栏）。
  口径同 P0-06 NOTE-SVC-ORG-FIELD-MODAL-CANCEL。B 档 tier。
