id: FUNC-04116
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04116
priority: P1
tier: B
title: 备选-兄弟菜单 · 不带出本页摘要
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、当前在服务机构产业领域分析
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      if (!page.url().includes('workspace=field') || !page.url().includes('tab=coverage') || /view=result|view=processing|[?&]task_id=/.test(page.url())) {
        await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
      }
      if (!page.url().includes('workspace=field')) {
        await page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ }).first().click({ timeout: 10000 });
        await page.waitForTimeout(1500);
      }
      await expect(page).toHaveURL(/workspace=field/, { timeout: 15000 });
      await expect(page).toHaveURL(/tab=coverage/);
      await expect(page.locator('[data-testid="svc-org-analysis-config"]')).toBeVisible({ timeout: 12000 });
      await expect(page.locator('[data-testid="svc-org-analysis-context-field"]')).toBeVisible({ timeout: 12000 });
  - note: 1、趋势页不出现「服务广度 TOP3」
    assert: |-
      await page.locator('.arco-menu-item').filter({ hasText: /^服务机构新增趋势分析$/ }).first().click({ timeout: 10000 });
      await page.waitForTimeout(2000);
      await expect(page).toHaveURL(/workspace=trend/, { timeout: 12000 });
      await expect(page).toHaveURL(/tab=trend/);
      await expect(page.locator('main').getByText(/^服务广度 TOP3$/)).toHaveCount(0);
  - note: 2、技术力页不出现「服务广度 TOP3」
    assert: |-
      await page.locator('.arco-menu-item').filter({ hasText: /^服务机构技术力评估分析$/ }).first().click({ timeout: 10000 });
      await page.waitForTimeout(2000);
      await expect(page).toHaveURL(/workspace=capability/, { timeout: 12000 });
      await expect(page).toHaveURL(/tab=capability/);
      await expect(page.locator('main').getByText(/^服务广度 TOP3$/)).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
