id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00644
priority: P0
tier: B
title: 多机构加选、弹窗直接取消与单个移除行为正确
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 已登录 admin
  - 已回显至少 1 家已选机构（脚本自含构造，同 P0-03 路径）
  - env-gate overall=pass（fixtures/scout/env-gate.json）
  - 无头实勘 pass（fixtures/scout/scout-p006.json，counts 1→2→2→1）
locators:
  org_picker: button「选择机构」
  modal: .arco-modal「选择服务机构」
  confirm: .arco-modal-footer button「确定」
  cancel: .arco-modal-footer button「取消」（分组内有同名取消，禁 dialog 级盲取）
  selected_label: 已选机构（N 家）
  selected_tag: '[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'
  tag_remove: .arco-tag-close-btn（aria-label=Close；无文字「移除」按钮）
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  # 操作（选 1 家 → 加选 1 家 → footer 取消 → tag close-btn 移除）自含在 expect[].assert 内，
  # 与 P0-03~05 同风格；runner 以 assert 为判定真源，避免描述性 step 被 click 分支误试。
expect:
  - note: 加选后回显集合与勾选一致且机构不重复（重开弹窗勾选数=回显家数；编码不重复）
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); if (/org_ids|view=/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) }; const close = page.locator('[aria-label="关闭对比篮"]'); if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const pick = page.getByRole('button', { name: '选择机构' }).first(); await pick.click({ timeout: 8000 }); await page.waitForTimeout(800); let dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first(); await expect(dialog).toBeVisible({ timeout: 8000 }); await dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)').first().click({ timeout: 5000 }); await page.waitForTimeout(300); await dialog.locator('.arco-modal-footer button:visible').filter({ hasText: /^确定$/ }).last().click({ timeout: 8000 }); await page.waitForTimeout(1000); await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 }); await pick.click({ timeout: 8000 }); await page.waitForTimeout(800); dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first(); await expect(dialog).toBeVisible({ timeout: 8000 }); const checked0 = await dialog.locator('.arco-checkbox.arco-checkbox-checked:not(.arco-checkbox-disabled)').count(); if (checked0 !== 1) throw new Error('重开弹窗回显勾选数应为 1，实际 ' + checked0); const unchecked = dialog.locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)'); if (!(await unchecked.count())) throw new Error('弹窗无未勾选机构可加选'); await unchecked.first().click({ timeout: 5000 }); await page.waitForTimeout(300); const footerTxt = await dialog.locator('.arco-modal-footer').innerText(); if (!/已选\s*2\s*家/.test(footerTxt)) throw new Error('弹窗 footer 计数非 2 家: ' + footerTxt.slice(0, 80)); await dialog.locator('.arco-modal-footer button:visible').filter({ hasText: /^确定$/ }).last().click({ timeout: 8000 }); await page.waitForTimeout(1000); await expect(page.getByText(/已选机构（2\s*家）/).first()).toBeVisible({ timeout: 8000 }); const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'); await expect(tags).toHaveCount(2, { timeout: 8000 }); const seen = []; for (let i = 0; i < 2; i++) { const t = (await tags.nth(i).innerText()).trim(); if (seen.includes(t)) throw new Error('已选机构重复: ' + t); seen.push(t) } await pick.click({ timeout: 8000 }); await page.waitForTimeout(800); dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first(); await expect(dialog).toBeVisible({ timeout: 8000 }); const checked1 = await dialog.locator('.arco-checkbox.arco-checkbox-checked:not(.arco-checkbox-disabled)').count(); if (checked1 !== 2) throw new Error('弹窗勾选数与已确认集合不一致: ' + checked1)
  - note: 再次打开弹窗后直接取消，已确认集合不变（回显仍 2 家且编码不变；弹窗容器卸载）
    assert: |-
      const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'); const nBefore = await tags.count(); if (nBefore !== 2) throw new Error('前置已选应为 2 家，实际 ' + nBefore); const before = []; for (let i = 0; i < nBefore; i++) before.push((await tags.nth(i).innerText()).trim()); const cancel = page.locator('.arco-modal:visible .arco-modal-footer button:visible').filter({ hasText: /^取消$/ }).last(); await expect(cancel).toBeVisible({ timeout: 8000 }); await cancel.click({ timeout: 8000 }); await page.waitForTimeout(1200); const gone = await page.evaluate(() => !document.querySelector('.arco-modal-container')); if (!gone) throw new Error('直接取消后弹窗容器未卸载'); await expect(page.getByText(/已选机构（2\s*家）/).first()).toBeVisible({ timeout: 8000 }); await expect(tags).toHaveCount(2, { timeout: 8000 }); for (let i = 0; i < 2; i++) { const t = (await tags.nth(i).innerText()).trim(); if (t !== before[i]) throw new Error('直接取消后集合被改: ' + t + ' != ' + before[i]) }
  - note: 已选机构可单个移除（点第 1 个条目移除控件后回显 1 家且该条目消失）
    assert: |-
      const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'); if ((await tags.count()) !== 2) throw new Error('前置已选应为 2 家'); const firstCode = (await tags.first().innerText()).trim(); const rmBtn = tags.first().locator('.arco-tag-close-btn'); await expect(rmBtn).toBeVisible({ timeout: 8000 }); await rmBtn.click({ timeout: 8000 }); await page.waitForTimeout(1000); await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 }); await expect(tags).toHaveCount(1, { timeout: 8000 }); const rest = (await tags.first().innerText()).trim(); if (rest === firstCode) throw new Error('被移除条目仍在回显: ' + firstCode)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: |-
  D1 NOTE-SVC-ORG-FIELD-TAG-CLOSE：用例步骤「移除按钮」实勘为已选机构 Arco tag 的 close-btn（`.arco-tag-close-btn`，aria-label="Close"，无文字「移除」按钮）——脚本跟现场；「移除」字样仅存在于对比篮条目，勿混用。
  D1 NOTE-SVC-ORG-FIELD-MODAL-CANCEL：弹窗「取消」在 `.arco-modal-footer`（`.svc-org-picker-footer__actions`），分组头部另有同名「取消」——必须限 footer 内定位；取消点击后 `.arco-modal-container` 整体卸载（非 display:none 残留），关闭断言用 container 不存在（X2 加强口径）。
  observed：实勘 counts 1→2→2→1，加选后编码不重复（91440101574031682H / 91440101MA59AABX6G，执行时记 observed 不钉死）；fixtures/scout/scout-p006.json。确定后 URL 带 org_ids[] 深链参数，脚本开场清参数。移除后门控联动归 00645，本条不断言。
