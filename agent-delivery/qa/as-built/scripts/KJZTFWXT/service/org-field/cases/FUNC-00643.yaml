id: FUNC-00643
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00643
priority: P1
tier: B
title: 主流程-选择机构回显
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、「选择服务机构」弹窗可勾选机构
    assert: |-
      const main = page.locator('main').first();
      await main.getByRole('button', { name: '打开对比篮' }).first().click({ timeout: 12000 });
      const picker = main.filter({ hasText: '选择分析服务机构' });
      await expect(picker.getByText('选择分析服务机构').first()).toBeVisible({ timeout: 12000 });
      await expect(picker.getByRole('button', { name: '全选当前筛选结果' })).toBeVisible({ timeout: 8000 });
      const toggle = picker.locator('.arco-checkbox').first();
      await expect(toggle).toBeVisible({ timeout: 8000 });
  - note: 2、确定后已选机构为 1 家
    assert: |-
      const main = page.locator('main').first();
      const picker = main.filter({ hasText: '选择分析服务机构' });
      await picker.locator('.arco-checkbox').first().click({ timeout: 8000 });
      await expect(picker.getByText(/已选\s*1\s*家机构/)).toBeVisible({ timeout: 8000 });
      await main.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await expect(main.getByText('已选机构（1 家）').first()).toBeVisible({ timeout: 12000 });
  - note: 3、配置区出现该机构
    assert: |-
      const main = page.locator('main').first();
      const ctx = main.locator('[data-testid="svc-org-analysis-context-field"]');
      await expect(ctx.locator('.svc-org-pick-tag').first()).toBeVisible({ timeout: 8000 });
      const tagText = (await ctx.locator('.svc-org-pick-tag').first().innerText()).trim();
      if (!tagText || tagText === '未选择机构') {
        throw new Error(`配置区未回显机构名，实际：${tagText || '(空)'}`);
      }
on_fail: 截图 + 抄 X-Trace-Id
