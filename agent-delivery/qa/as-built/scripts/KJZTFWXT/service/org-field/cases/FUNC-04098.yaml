id: FUNC-04098
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04098
priority: P1
tier: B
title: 主流程-广度摘要
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 「服务广度 TOP3」显示「暂无可排名机构」
    assert: |-
      const main = page.locator('main').first();
      const bodyNorm = async () =>
        ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const breadthEmpty = (body) =>
        /服务广度 TOP3/.test(body) && /服务广度 TOP3[\s\S]{0,160}暂无可排名机构/.test(body);
      const openFromRecords = async () => {
        const recTab = page
          .locator('[role=tab][data-tab-key="records"]')
          .or(page.getByRole('tab', { name: '分析记录', exact: true }))
          .first();
        await expect(recTab).toBeVisible({ timeout: 15000 });
        await recTab.click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 15000 }).catch(() => {});
        await page.waitForTimeout(800);
        const mainRec = ((await main.innerText().catch(() => '')) || '').trim();
        if (!/已完成/.test(mainRec)) return false;
        const rows = page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ });
        const rowN = await rows.count();
        if (!rowN) return false;
        for (let i = 0; i < Math.min(rowN, 10); i++) {
          const row = rows.nth(i);
          const resBtn = row.getByRole('button', { name: /查看结果/ }).first();
          if (!(await resBtn.count())) continue;
          if (await resBtn.isDisabled().catch(() => true)) continue;
          await resBtn.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          for (let j = 0; j < 12; j++) {
            const body = await bodyNorm();
            if (/当前结果快照没有覆盖矩阵/.test(body) || breadthEmpty(body)) return true;
            if (/核心结论|服务机构产业领域服务广度/.test(body)) break;
            await page.waitForTimeout(800);
          }
          await recTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
        }
        return false;
      };
      const createResultViaBasket = async () => {
        await main.getByRole('button', { name: '打开对比篮' }).first().click({ timeout: 12000 });
        const basket = page.locator('[data-system-surface-id="compare-basket"]');
        await expect(basket).toHaveAttribute('data-panel-open', 'true', { timeout: 10000 });
        const addModal = page.locator('[data-testid="compare-basket-add-modal"]');
        if (await addModal.isVisible().catch(() => false)) {
          await page.keyboard.press('Escape');
        }
        const basketWorkspace = basket.locator('[data-testid="service-org-compare-basket-workspace"]');
        if (await basket.getByText('对比篮暂无服务机构').isVisible().catch(() => false)) {
          await basket.getByRole('button', { name: '新增' }).first().click({ timeout: 8000 });
          await expect(addModal).toBeVisible({ timeout: 15000 });
          await addModal.getByRole('button', { name: '加入对比篮' }).first().click({ timeout: 15000 });
          await page.keyboard.press('Escape');
          await expect(addModal).toBeHidden({ timeout: 8000 });
        }
        let pickBox = basketWorkspace.locator('.arco-checkbox').first();
        if (!(await pickBox.count())) {
          pickBox = basket.locator('.arco-checkbox').first();
        }
        await expect(pickBox).toBeVisible({ timeout: 12000 });
        if (!(await pickBox.locator('input').isChecked().catch(() => false))) {
          await pickBox.click();
        }
        await expect(basket.getByText(/已选 1 家机构/)).toBeVisible({ timeout: 8000 });
        await basket.getByRole('button', { name: '确定', exact: true }).click({ timeout: 10000 });
        await expect(basket).toHaveAttribute('data-panel-open', 'false', { timeout: 10000 });
        await expect(main.getByText(/已选机构（1 家）/)).toBeVisible({ timeout: 15000 });
        await main.getByRole('button', { name: '开始分析' }).first().click({ timeout: 12000 });
        await expect(page.getByText('分析结果已生成').first()).toBeVisible({ timeout: 90000 });
        await page.getByRole('button', { name: '查看结果' }).click({ timeout: 15000 });
        await expect(page.getByText('服务机构产业领域服务广度 & 深度').first()).toBeVisible({
          timeout: 30000,
        });
      };
      let opened = await openFromRecords();
      if (!opened) {
        const covTab = page
          .locator('[role=tab][data-tab-key="coverage"]')
          .or(page.getByRole('tab', { name: '服务机构产业领域分析', exact: true }))
          .first();
        if (await covTab.count()) {
          await covTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
        }
        await createResultViaBasket();
        opened = true;
      }
      if (!opened) {
        throw new Error('修订 blocked：无法打开无覆盖矩阵的成功结果页');
      }
      const blocks = page.locator('.svc-org-coverage-block');
      const breadth = blocks
        .filter({ has: page.locator('h4').filter({ hasText: /^服务广度 TOP3$/ }) })
        .first();
      if (await breadth.count()) {
        await expect(breadth.getByText('暂无可排名机构').first()).toBeVisible({ timeout: 10000 });
        const txt = ((await breadth.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/服务广度 TOP3/.test(txt) || !/暂无可排名机构/.test(txt)) {
          throw new Error('广度摘要区块文案不符: ' + txt.slice(0, 200));
        }
      } else {
        const body = await bodyNorm();
        const m = body.match(/服务广度 TOP3[\s\S]{0,80}暂无可排名机构/);
        if (!m) {
          throw new Error(
            '主区未见「服务广度 TOP3」邻接「暂无可排名机构」: ' + body.slice(0, 320),
          );
        }
        await expect(main.getByText('暂无可排名机构').first()).toBeVisible({ timeout: 10000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
