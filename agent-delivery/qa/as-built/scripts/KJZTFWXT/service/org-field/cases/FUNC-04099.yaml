id: FUNC-04099
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04099
priority: P1
tier: B
title: 主流程-深度摘要空态
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  - action: evaluate
    note: 04088 前置与用例步骤：对比篮选 1 家→开始分析→查看结果→分析记录再打开该次结果
expect:
  - note: 1、「服务深度 TOP 领域（按机构）」显示「暂无可排名机构」
    assert: |-
      const main = page.locator('main').first();
      await page.locator('[data-testid="svc-org-open-compare-basket"]').click({ timeout: 12000 });
      await expect(main.getByText('选择分析服务机构')).toBeVisible({ timeout: 12000 });
      await main.locator('.arco-checkbox').first().click({ timeout: 8000 });
      await main.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await expect(main.getByText(/已选机构（1 家）/)).toBeVisible({ timeout: 12000 });
      await page.locator('[data-testid="svc-org-start-analysis"]').click({ timeout: 12000 });
      await expect(main.getByText('分析结果已生成')).toBeVisible({ timeout: 30000 });
      await main.getByRole('button', { name: '查看结果' }).click({ timeout: 12000 });
      await expect(main.getByText('核心结论')).toBeVisible({ timeout: 20000 });
      await page.getByRole('tab', { name: '分析记录', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const doneRow = main.locator('tr').filter({ hasText: '已完成' }).first();
      await expect(doneRow).toBeVisible({ timeout: 12000 });
      await doneRow.getByRole('button', { name: '查看结果' }).click({ timeout: 8000 });
      await expect(main.getByText('服务深度 TOP 领域（按机构）')).toBeVisible({ timeout: 20000 });
      const depthBlock = main.locator('.svc-org-coverage-block').filter({
        has: page.locator('h4').filter({ hasText: '服务深度 TOP 领域（按机构）' }),
      }).first();
      await expect(depthBlock.getByText('暂无可排名机构')).toBeVisible({ timeout: 12000 });
on_fail: 截图 + 抄 X-Trace-Id
