id: FUNC-04097
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04097
priority: P0
tier: B
title: 主流程-矩阵图切换
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、图型变为矩阵且仍是同一次结果
    assert: |-
      const main = page.locator('main').first();
      await main.getByRole('button', { name: '打开对比篮' }).first().click({ timeout: 15000 });
      const picker = page.locator('.arco-modal, .arco-drawer').filter({ hasText: '选择分析服务机构' }).last();
      await expect(picker).toBeVisible({ timeout: 15000 });
      const cb = picker.locator('.arco-checkbox-icon, label.arco-checkbox').first();
      await cb.click({ timeout: 10000 });
      await expect(picker.getByText(/已选\s*1\s*家/)).toBeVisible({ timeout: 10000 });
      await picker.getByRole('button', { name: '确定' }).click({ timeout: 10000 });
      await expect(main.getByText(/已选机构（1 家）/)).toBeVisible({ timeout: 12000 });
      await main.getByRole('button', { name: '开始分析' }).click({ timeout: 15000 });
      await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 45000 });
      const taskBefore = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      await page.getByRole('button', { name: '查看结果' }).click({ timeout: 15000 });
      await expect(page.locator('[data-testid="svc-org-coverage-chart-switch"]')).toBeVisible({ timeout: 20000 });
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 15000 });
      const sw = page.locator('[data-testid="svc-org-coverage-chart-switch"]').first();
      await sw.getByText('矩阵图', { exact: true }).click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const matInput = sw.locator('label:has-text("矩阵图") input').first();
      await expect(matInput).toBeChecked({ timeout: 8000 });
      const taskAfter = (page.url().match(/task_id=([^&]+)/) || [])[1] || taskBefore;
      if (taskBefore && taskAfter && taskAfter !== taskBefore) {
        throw new Error('切矩阵图后任务上下文变化: before=' + taskBefore + ' after=' + taskAfter);
      }
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 8000 });
  - note: 2、图表区仍显示「当前结果快照没有覆盖矩阵」
    assert: |-
      const board = page.locator('[data-testid="svc-org-coverage-board"]').first();
      await expect(board).toBeVisible({ timeout: 10000 });
      await expect(board.getByText('当前结果快照没有覆盖矩阵').first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
