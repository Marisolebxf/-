id: FUNC-04097
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04097
priority: P0
tier: B
title: 主流程-矩阵图切换
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已打开一次成功结果（脚本内：分析记录→已完成行「查看结果」进入结果态）
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
  chart_switch: '[data-testid="svc-org-coverage-chart-switch"]'
  matrix_label: switch 内 label「矩阵图」
  honest_empty: 当前结果快照没有覆盖矩阵
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、图型变为矩阵且仍是同一次结果（点「矩阵图」后 radio 置矩阵图，任务上下文不变）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const onTarget = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(toUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      await dismissBasket();
      if (await bodyIs404()) {
        await page.goto(toUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
      }
      if (!onTarget() || (await bodyIs404())) {
        const siblings = ['/service-portal/overview/overview', '/industry-center/search', '/service-portal/overview'];
        let ok = false;
        for (const s of siblings) {
          if (await enterViaSidebar(s)) {
            ok = true;
            break;
          }
        }
        if (!ok) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均 SPA404 url=' + page.url());
        }
      }
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析 SPA404 ' + page.url());
      }
      const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })).first();
      await expect(recTab).toBeVisible({ timeout: 12000 });
      await recTab.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
      await page.waitForTimeout(1200);
      const recTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!/SVC-\d{8}-\d+/.test(recTxt)) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-RECORDS：分析记录无历史任务');
      }
      const viewBtns = page.getByRole('button', { name: '查看结果' });
      const viewN = await viewBtns.count();
      if (!viewN) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-VIEW-RESULT：无可用「查看结果」');
      }
      let inResult = false;
      let taskBefore = '';
      for (let i = 0; i < Math.min(viewN, 5) && !inResult; i++) {
        const b = viewBtns.nth(i);
        if (await b.isDisabled().catch(() => true)) continue;
        await b.click({ timeout: 8000 });
        await page.waitForTimeout(2500);
        const board = page.locator('.svc-org-coverage, [data-testid="svc-org-coverage-board"]').first();
        if ((await board.count()) && (await board.isVisible().catch(() => false))) {
          inResult = true;
          taskBefore = (page.url().match(/task_id=(SVC-[\d-]+)/) || [])[1] || '';
          if (!taskBefore) {
            const mainTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
            const m = mainTxt.match(/SVC-\d{8}-\d+/);
            if (m) taskBefore = m[0];
          }
          break;
        }
      }
      if (!inResult) {
        throw new Error('ENV-SVC-ORG-FIELD-RESULT-UNREACHABLE：查看结果后未见覆盖结果板');
      }
      globalThis.__p04097_task = taskBefore;
      const sw = page.locator('[data-testid="svc-org-coverage-chart-switch"]').first();
      await expect(sw).toBeVisible({ timeout: 8000 });
      const matLabel = sw.locator('label:has-text("矩阵图")').first();
      await matLabel.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const matInput = sw.locator('label:has-text("矩阵图") input').first();
      const heatInput = sw.locator('label:has-text("热力图") input').first();
      if (!(await matInput.isChecked())) {
        throw new Error('切矩阵图后 radio 未置矩阵图');
      }
      if (await heatInput.isChecked()) {
        throw new Error('矩阵图态热力图 radio 仍选中（单选互斥破坏）');
      }
      const taskAfter = (page.url().match(/task_id=(SVC-[\d-]+)/) || [])[1] || globalThis.__p04097_task || '';
      if (globalThis.__p04097_task && taskAfter && taskAfter !== globalThis.__p04097_task) {
        throw new Error('切矩阵图后任务上下文变化: before=' + globalThis.__p04097_task + ' after=' + taskAfter);
      }
      const mainAfter = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!/核心结论/.test(mainAfter)) {
        throw new Error('切矩阵图后核心结论区缺失（非同一次结果上下文）');
      }
  - note: 2、图表区仍显示「当前结果快照没有覆盖矩阵」
    assert: |-
      const board = page.locator('.svc-org-coverage, [data-testid="svc-org-coverage-board"]').first();
      await expect(board).toBeVisible({ timeout: 8000 });
      const boardTxt = ((await board.innerText().catch(() => '')) || '');
      const mainTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      const emptyRe = /当前结果快照没有覆盖矩阵/;
      if (!emptyRe.test(boardTxt) && !emptyRe.test(mainTxt)) {
        const hasCanvas = (await board.locator('canvas:visible').count()) > 0;
        if (hasCanvas) {
          console.log('observed-matrix-rendered: 矩阵图态出现 canvas（非诚实空环境）；用例预期 2 以现场矩阵呈现为准，本条 edu 诚实空为主路径');
        }
        throw new Error('矩阵图态未见诚实空标题「当前结果快照没有覆盖矩阵」: ' + boardTxt.slice(0, 220));
      }
      await expect(board.getByText('当前结果快照没有覆盖矩阵').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04097=结果态（分析记录→查看结果）点「矩阵图」→ radio 置 matrix 且 task_id/核心结论区不变；图表区仍「当前结果快照没有覆盖矩阵」（与 scout-p008 同源诚实空，现场无独立矩阵坐标轴渲染）。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；switch=data-testid svc-org-coverage-chart-switch。
