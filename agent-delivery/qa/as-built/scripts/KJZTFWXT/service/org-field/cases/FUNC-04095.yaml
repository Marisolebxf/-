id: FUNC-04095
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04095
priority: P0
tier: A
title: 主流程-记录查看结果
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 分析记录中有状态为已完成的行
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、结果页出现「核心结论」（分析记录→已完成行「查看结果」）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const onTarget = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(toUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      await dismissBasket();
      if (!onTarget() || (await bodyIs404())) {
        const siblings = ['/service-portal/overview/overview', '/industry-center/search', '/service-portal/overview'];
        let ok = false;
        for (const s of siblings) {
          if (await enterViaSidebar(s)) {
            ok = true;
            break;
          }
        }
        if (!ok && (await bodyIs404())) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析深链与侧栏 sibling 均 SPA404 ' + page.url());
        }
      }
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate) && !/服务机构产业领域分析/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析 SPA404 ' + page.url());
      }
      const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })).first();
      await expect(recTab).toBeVisible({ timeout: 12000 });
      await recTab.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
      await page.waitForTimeout(1500);
      const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
      if (!/SVC-\d{8}-\d+/.test(mainRec)) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-RECORDS：分析记录无历史任务');
      }
      if (!/已完成/.test(mainRec)) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：分析记录无已完成行');
      }
      const rows = page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ }).filter({ hasText: /SVC-\d{8}-\d+/ });
      const rowN = await rows.count();
      if (!rowN) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：未定位到已完成任务行');
      }
      let opened = false;
      let taskId = '';
      for (let i = 0; i < Math.min(rowN, 6) && !opened; i++) {
        const row = rows.nth(i);
        const rowTxt = ((await row.innerText().catch(() => '')) || '').trim();
        const m = rowTxt.match(/SVC-\d{8}-\d+/);
        if (!m) continue;
        taskId = m[0];
        const resBtn = row.getByRole('button', { name: /查看结果/ }).first();
        if (!(await resBtn.count())) continue;
        if (await resBtn.isDisabled().catch(() => false)) continue;
        await resBtn.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        let body = '';
        for (let j = 0; j < 15; j++) {
          body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
          if (/核心结论/.test(body)) {
            opened = true;
            break;
          }
          if (/404|页面不存在/.test(body)) break;
          await page.waitForTimeout(1000);
        }
        if (!opened) {
          await recTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(1200);
        }
      }
      if (!opened) {
        throw new Error('ENV-SVC-ORG-FIELD-VIEW-RESULT-UNREACHABLE：已完成行点「查看结果」未见「核心结论」 task=' + taskId + ' url=' + page.url());
      }
      const main = page.locator('main').first();
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04095=分析记录 Tab→已完成行「查看结果」直达结果壳「核心结论」（scout-p010/env-gate 按钮名一致；不经过过程页）。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；edu 深链 SPA404→ENV-EDU-TTS-SVCZ-404-001（同 org-field 重写波姊妹条）。
