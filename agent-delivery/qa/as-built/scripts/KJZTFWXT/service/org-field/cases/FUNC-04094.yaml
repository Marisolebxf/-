id: FUNC-04094
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04094
priority: P0
tier: A
title: 主流程-记录查看过程
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 分析记录中有状态为已完成的行
locators:
  tab_records: tab「分析记录」
  view_process: button「查看过程」
  view_result: button「查看结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页出现「分析结果已生成」（分析记录→已完成行「查看过程」）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析 SPA404 ' + page.url());
      }
      const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })).first();
      await expect(recTab).toBeVisible({ timeout: 12000 });
      await recTab.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
      await page.waitForTimeout(1500);
      const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
      if (!/SVC-\d{8}-\d+/.test(mainRec)) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-RECORDS：分析记录无历史任务');
      }
      if (!/已完成/.test(mainRec)) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：分析记录无已完成行');
      }
      const rows = page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ }).filter({ hasText: /SVC-\d{8}-\d+/ });
      const rowN = await rows.count();
      if (!rowN) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：未定位到已完成任务行');
      }
      let opened = false;
      let taskId = '';
      for (let i = 0; i < Math.min(rowN, 6) && !opened; i++) {
        const row = rows.nth(i);
        const rowTxt = ((await row.innerText().catch(() => '')) || '').trim();
        const m = rowTxt.match(/SVC-\d{8}-\d+/);
        if (!m) continue;
        taskId = m[0];
        const procBtn = row.getByRole('button', { name: /查看过程|查看结果/ }).first();
        if (!(await procBtn.count())) continue;
        if (await procBtn.isDisabled().catch(() => false)) continue;
        await procBtn.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        let body = '';
        for (let j = 0; j < 12; j++) {
          body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
          if (/分析结果已生成/.test(body)) {
            opened = true;
            break;
          }
          if (/404|页面不存在/.test(body)) break;
          await page.waitForTimeout(1000);
        }
        if (!opened) {
          await recTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(1200);
        }
      }
      if (!opened) {
        throw new Error('ENV-SVC-ORG-FIELD-VIEW-PROCESS-UNREACHABLE：已完成行点「查看过程」未见「分析结果已生成」 task=' + taskId + ' url=' + page.url());
      }
      globalThis.__p04094_taskId = taskId;
      const main = page.locator('main').first();
      await expect(main.getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
  - note: 2、页面提供「查看结果」
    assert: |-
      const main = page.locator('main').first();
      const viewBtn = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(viewBtn).toBeVisible({ timeout: 8000 });
      await expect(viewBtn).toBeEnabled({ timeout: 8000 });
      const tid = globalThis.__p04094_taskId || '';
      if (tid) {
        const body = ((await main.innerText().catch(() => '')) || '').trim();
        if (!body.includes(tid)) {
          throw new Error('过程页任务号与所点行不一致: ' + tid);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04094=分析记录已完成行「查看过程」→过程页「分析结果已生成」+「查看结果」出口（不自动进结果壳）。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；edu 深链 SPA404→ENV-EDU-TTS-SVCZ-404-001（同 org-field 重写波姊妹条）。
