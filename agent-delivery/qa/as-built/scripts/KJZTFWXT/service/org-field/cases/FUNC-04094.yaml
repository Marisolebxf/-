id: FUNC-04094
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04094
priority: P1
tier: B
title: 主流程-记录查看过程
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页出现「分析结果已生成」
    assert: |-
      const main = page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录', exact: true }).click();
      await page.waitForURL(/tab=records/, { timeout: 15000 });
      await expect(main).toContainText('已完成', { timeout: 15000 });
      const doneRow = main.locator('tr').filter({ hasText: '已完成' }).first();
      await expect(doneRow).toBeVisible({ timeout: 8000 });
      const procBtn = doneRow.getByRole('button', { name: '查看过程', exact: true });
      await expect(procBtn).toBeVisible({ timeout: 8000 });
      await procBtn.click();
      await expect(main.getByText('分析结果已生成').first()).toBeVisible({ timeout: 20000 });
  - note: 2、页面提供「查看结果」
    assert: |-
      await expect(page.locator('main').first().getByRole('button', { name: '查看结果', exact: true })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
