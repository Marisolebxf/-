priority: P0
tier: B
title: 主流程-分析记录列
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  - action: click
    note: 点击「分析记录」
    target: 分析记录
expect:
  - note: 1、表头依次为任务、类型、状态、创建时间、操作
    assert: |-
      await page.locator('main [data-testid="svc-org-analysis-records"]').waitFor({ state: 'visible', timeout: 15000 });
      const thLoc = page.locator('main [data-testid="svc-org-analysis-records"] .arco-table thead .arco-table-th');
      await expect(thLoc.first()).toBeVisible({ timeout: 12000 });
      const expectedHeaders = ['任务', '类型', '状态', '创建时间', '操作'];
      await expect(thLoc).toHaveCount(expectedHeaders.length);
      for (let i = 0; i < expectedHeaders.length; i++) {
        await expect(thLoc.nth(i)).toHaveText(expectedHeaders[i], { timeout: 5000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
