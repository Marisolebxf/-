id: FUNC-04105
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04105
priority: P1
tier: B
title: 备选-产业领域选中 · 不发起分析
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 已选机构为 0 家（runner 会话前置：已登录且内部评审模式关闭）
locators:
  config_panel: data-testid=svc-org-analysis-config
  field_catalog: .industry-catalog-select
  field_filter_ph: placeholder「筛选领域（不改分析指纹）」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：配置空态已选机构 0 家，产业领域控件可见
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const onTarget = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      const resetToZeroOrgs = async () => {
        if (/org_ids|view=result|view=processing/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
        }
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      const ensureConfigTab = async () => {
        await dismissBasket();
        if (/view=result|view=processing/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
        }
        if (!onTarget() || (await bodyIs404())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
            await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          if (!onTarget() || (await bodyIs404())) {
            const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
            let ok = false;
            for (const s of siblings) {
              if (await enterViaSidebar(s)) {
                ok = true;
                break;
              }
            }
            if (!ok) {
              throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均 SPA404，无法进入分析配置 url=' + page.url());
            }
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析入口不可用 ' + page.url());
        }
        const cfgTab = page.locator('[role=tab][data-tab-key="coverage"]').or(page.getByRole('tab', { name: '服务机构产业领域分析', exact: true })).first();
        if (await cfgTab.count()) {
          const sel = await cfgTab.getAttribute('aria-selected').catch(() => 'true');
          if (sel === 'false') {
            await cfgTab.click({ timeout: 8000 });
            await page.waitForTimeout(600);
          }
        }
      };
      await ensureConfigTab();
      await resetToZeroOrgs();
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      const main = page.locator('main').first();
      const t0 = ((await main.innerText().catch(() => '')) || '');
      if (!/已选机构（0\s*家）|未选择机构/.test(t0)) {
        throw new Error('前置应为 0 家机构: ' + t0.slice(0, 220));
      }
      let trigger = page.locator('.industry-catalog-select .arco-select-view').first();
      if (!(await trigger.count())) trigger = page.locator('.industry-catalog-select').first();
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      globalThis.__p04105_url0 = page.url();
  - note: 1、在产业领域输入「生物」后，可选项收窄为名称含「生物」的产业
    assert: |-
      const kw = '生物';
      const filterInput = page.getByPlaceholder('筛选领域（不改分析指纹）');
      await expect(filterInput).toBeVisible({ timeout: 8000 });
      await filterInput.fill(kw, { timeout: 5000 });
      await page.waitForTimeout(600);
      const popup = page.locator('.arco-trigger-popup:visible').filter({ has: page.locator('.arco-select-option') }).last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const opts = popup.locator('.arco-select-option');
      const n = await opts.count();
      if (n < 1) throw new Error('键入「生物」后下拉无可见选项');
      if (n >= 15) throw new Error('筛选未收窄，仍见 ≥15 项: ' + n);
      const texts = [];
      for (let i = 0; i < n; i++) {
        const tx = (await opts.nth(i).innerText()).trim();
        texts.push(tx);
        if (!tx.includes(kw)) throw new Error('收窄后出现不含「生物」的选项: ' + tx);
      }
      globalThis.__p04105_filtered = texts;
  - note: 2、点选「生物」后回显「生物」；3、仍提示请先选择分析机构且不发起分析
    assert: |-
      const kw = '生物';
      const popup = page.locator('.arco-trigger-popup:visible').filter({ has: page.locator('.arco-select-option') }).last();
      const opt = popup.locator('.arco-select-option').filter({ hasText: /^生物$/ }).first();
      if (!(await opt.count())) {
        const optLoose = popup.locator('.arco-select-option').filter({ hasText: kw }).first();
        await expect(optLoose).toBeVisible({ timeout: 8000 });
        await optLoose.click({ timeout: 8000 });
      } else {
        await opt.click({ timeout: 8000 });
      }
      await page.waitForTimeout(600);
      const catalog = page.locator('.industry-catalog-select').first();
      const shown =
        (await catalog.locator('.arco-select-view-value').innerText().catch(() => '')).trim() ||
        (await page.getByPlaceholder('筛选领域（不改分析指纹）').inputValue().catch(() => '')).trim() ||
        (await catalog.innerText()).trim();
      if (!shown.includes(kw)) {
        throw new Error('选中后未回显「生物」，实际=' + shown.slice(0, 80));
      }
      const main = page.locator('main').first();
      const t = ((await main.innerText().catch(() => '')) || '');
      if (!/请先选择分析机构|已选机构（0\s*家）|未选择机构/.test(t)) {
        throw new Error('选中领域后应仍提示先选机构: ' + t.slice(0, 280));
      }
      const url = page.url();
      if (/view=processing|view=result|task_id=/.test(url)) {
        throw new Error('选中产业领域不应进入分析/任务态: ' + url);
      }
      if (/生成中|计算中|分析结果已生成/.test(t)) {
        throw new Error('选中后出现分析进行/结果文案: ' + t.slice(0, 200));
      }
      if (/已选机构（[1-9]/.test(t)) {
        throw new Error('0 家前置下选中领域不应改变已选机构数: ' + t.slice(0, 120));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04105=配置空态（0 家）Arco Select .industry-catalog-select，键入「生物」收窄选项（scout-p009 同控件；关评审点状复勘）。
  选中后仅回显领域，main 仍含「请先选择分析机构/已选机构（0 家）」；URL 无 view=processing|task_id。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage（entry-seed）。
