id: FUNC-04105
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04105
priority: P1
tier: B
title: 备选-产业领域选中
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  - action: evaluate
    note: 在产业领域输入「生物」；点选「生物」
expect:
  - note: 可选项收窄为名称含「生物」的产业
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('已选机构（0 家）')).toBeVisible({ timeout: 12000 });
      const cascader = main.locator('[data-testid="svc-org-analysis-config"] .arco-cascader-view').first();
      await cascader.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const filterInput = page.getByPlaceholder('筛选领域（不改分析指纹）');
      await expect(filterInput).toBeVisible({ timeout: 8000 });
      await filterInput.fill('生物', { timeout: 5000 });
      await page.waitForTimeout(600);
      const popup = page.locator('.arco-cascader-popup-visible').first();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const opts = popup.locator('.arco-cascader-option');
      const n = await opts.count();
      if (n < 1) throw new Error('筛「生物」后无可见选项');
      for (let i = 0; i < n; i++) {
        await expect(opts.nth(i)).toContainText('生物');
      }
  - note: 选中后回显「生物」
    assert: |-
      const popup = page.locator('.arco-cascader-popup-visible').first();
      await popup.locator('.arco-cascader-option').filter({ hasText: /^生物$/ }).first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await page.keyboard.press('Escape').catch(() => {});
      const filterInput = page.getByPlaceholder('筛选领域（不改分析指纹）');
      await expect(filterInput).toHaveValue('生物', { timeout: 8000 });
  - note: 仍提示请先选择分析机构
    assert: |-
      await expect(page.getByText(/尚未选择分析机构|请先选择分析机构|请先在对比篮中选择分析机构/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
