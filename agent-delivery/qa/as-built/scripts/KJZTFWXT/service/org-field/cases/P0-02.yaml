id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00642
priority: P0
tier: A
title: 分析配置区三控件齐备且未选机构时为配置空态
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass
  - 直达 field/coverage 且未改动任何配置（脏会话先清 org_ids 重进）
locators:
  field_filter: placeholder「筛选领域（不改分析指纹）」
  org_picker: button「选择机构」
  start: button「开始分析」
  empty_hint: 请先选择分析机构
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 分析配置区含领域筛选（占位「筛选领域（不改分析指纹）」）、「选择机构」、「开始分析」
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); if (/org_ids|view=/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000) }; const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('筛选领域（不改分析指纹）')).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: '选择机构', exact: true })).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: '开始分析', exact: true })).toBeVisible({ timeout: 8000 })
  - note: 未选机构时无结果区热力/矩阵渲染
    assert: |-
      const main = page.locator('main.content-shell-layout').first(); const t = await main.innerText(); if (!/已选机构（0 家）|未选择机构|请先选择分析机构/.test(t)) throw new Error('未见配置空态文案: ' + t.slice(0, 200)); if (/view=result|view=processing/.test(page.url())) throw new Error('空态 URL 不应进入结果/过程: ' + page.url()); const charts = main.locator('canvas, [_echarts_instance_], .echarts-for-react'); const n = await charts.count(); if (n > 0) throw new Error('配置空态出现图表渲染 count=' + n); if (/热力图|矩阵图/.test(t) && !/请先选择分析机构/.test(t)) throw new Error('空态出现热力/矩阵结果文案')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: A 档零 allow_skip；列表 2 空格缩进。机构入口全名「选择机构」；领域筛 placeholder 跟 as-built「筛选领域（不改分析指纹）」；空态跟实勘「已选机构（0 家）/未选择机构/请先选择分析机构」，不渲染热力/矩阵。对比篮浮层常默认展开，断言前先关。
