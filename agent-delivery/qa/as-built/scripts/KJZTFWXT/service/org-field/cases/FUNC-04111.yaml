id: FUNC-04111
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04111
priority: P1
tier: B
title: 备选-标签关闭 · 去掉一家
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 配置区已回显至少 2 家（脚本自含：弹窗选 2 家并点「确定」）
locators:
  pick_btn: button「选择机构」
  modal: data-testid=svc-org-picker-modal
  confirm: .arco-modal-footer button「确定」（footer 内 last）
  selected_label: 已选机构（N 家）
  selected_tag: '[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'
  tag_close: .arco-tag-close-btn（aria-label=Close；无文字「移除」）
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：配置区已确认 2 家机构
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const onTarget = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      const ensureConfigTab = async () => {
        await dismissBasket();
        if (/view=result|view=processing/.test(page.url()) || /org_ids/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
        }
        if (!onTarget() || (await bodyIs404())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
            await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          if (!onTarget() || (await bodyIs404())) {
            const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
            let ok = false;
            for (const s of siblings) {
              if (await enterViaSidebar(s)) {
                ok = true;
                break;
              }
            }
            if (!ok) {
              throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均 SPA404，无法进入分析配置 url=' + page.url());
            }
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析入口不可用 ' + page.url());
        }
        const cfgTab = page.locator('[role=tab][data-tab-key="coverage"]').or(page.getByRole('tab', { name: '服务机构产业领域分析', exact: true })).first();
        if (await cfgTab.count()) {
          const sel = await cfgTab.getAttribute('aria-selected').catch(() => 'true');
          if (sel === 'false') {
            await cfgTab.click({ timeout: 8000 });
            await page.waitForTimeout(600);
          }
        }
      };
      const resetToZeroOrgs = async () => {
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      const openPicker = async () => {
        const pickBtn = page
          .locator('[data-testid="svc-org-open-picker"]')
          .or(page.getByRole('button', { name: '选择机构', exact: true }))
          .first();
        await expect(pickBtn).toBeVisible({ timeout: 10000 });
        await pickBtn.click({ timeout: 10000 });
        await page.waitForTimeout(900);
        const dialog = page.locator('[data-testid="svc-org-picker-modal"], .arco-modal:visible')
          .filter({ hasText: '选择服务机构' })
          .first();
        await expect(dialog).toBeVisible({ timeout: 12000 });
        return dialog;
      };
      const footerConfirm = (dialog) =>
        dialog.locator('.arco-modal-footer button:visible').filter({ hasText: /^确定$/ }).last();
      const pickOneMoreInModal = async (dialog) => {
        const unchecked = dialog.locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)');
        if (!(await unchecked.count())) throw new Error('弹窗无未勾选机构可加选');
        await unchecked.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      await ensureConfigTab();
      await resetToZeroOrgs();
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      let dialog = await openPicker();
      await pickOneMoreInModal(dialog);
      await footerConfirm(dialog).click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      dialog = await openPicker();
      await pickOneMoreInModal(dialog);
      await footerConfirm(dialog).click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.getByText(/已选机构（2\s*家）/).first()).toBeVisible({ timeout: 10000 });
      const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag');
      await expect(tags).toHaveCount(2, { timeout: 8000 });
      const codes = [];
      for (let i = 0; i < 2; i++) codes.push((await tags.nth(i).innerText()).trim());
      globalThis.__p04111 = { removedCode: codes[0], keepCode: codes[1] };
  - note: 1、已选家数减少 1；2、被关掉的那家 tag 不再显示
    assert: |-
      const snap = globalThis.__p04111;
      if (!snap || !snap.removedCode || !snap.keepCode) throw new Error('前置：未构造 2 家已选');
      const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag');
      if ((await tags.count()) !== 2) throw new Error('前置已选应为 2 家');
      const rmBtn = tags.first().locator('.arco-tag-close-btn');
      await expect(rmBtn).toBeVisible({ timeout: 8000 });
      await rmBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      await expect(tags).toHaveCount(1, { timeout: 8000 });
      const rest = (await tags.first().innerText()).trim();
      if (rest === snap.removedCode) throw new Error('被关掉机构仍在回显: ' + snap.removedCode);
      if (rest !== snap.keepCode) throw new Error('剩余机构不符: ' + rest + ' != ' + snap.keepCode);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04111=配置区已确认 2 家后点第 1 个 svc-org-pick-tag 的 .arco-tag-close-btn（aria-label=Close，无「移除」文案）；
  已选机构（N 家）减 1 且被关编码不再出现在 tag 区。口径同 P0-06 NOTE-SVC-ORG-FIELD-TAG-CLOSE。catalog_path 同 entry-seed。B 档。
