id: FUNC-04111
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04111
priority: P1
tier: B
title: 备选-去掉一家
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、已选家数减少 1
    assert: |-
      const main = page.locator('main').first();
      const ctx = () => main.locator('[data-testid="svc-org-analysis-context-field"]');
      const openPicker = async () => {
        const legacy = main
          .locator('[data-testid="svc-org-open-picker"]')
          .or(main.getByRole('button', { name: '选择机构', exact: true }))
          .first();
        if (await legacy.isVisible().catch(() => false)) {
          await legacy.click({ timeout: 12000 });
          await page.waitForTimeout(800);
          const dialog = page
            .locator('[data-testid="svc-org-picker-modal"], .arco-modal:visible')
            .filter({ hasText: '选择服务机构' })
            .first();
          await expect(dialog).toBeVisible({ timeout: 12000 });
          return dialog;
        }
        const openBasket = main.getByRole('button', { name: /打开对比篮/ }).first();
        await expect(openBasket).toBeVisible({ timeout: 12000 });
        await openBasket.click({ timeout: 12000 });
        await expect(main.getByText('选择分析服务机构').first()).toBeVisible({ timeout: 12000 });
        return main.filter({ hasText: '选择分析服务机构' });
      };
      const pickTwoOrgs = async (shell) => {
        const selectAll = shell.getByRole('button', { name: '全选当前筛选结果' });
        if (await selectAll.isVisible().catch(() => false)) {
          await selectAll.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        } else {
          const checks = shell.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
          for (let i = 0; i < 10 && (await checks.count()) < 2; i++) {
            const body = shell
              .locator('.arco-modal-body, [data-testid="service-org-compare-basket-workspace"]')
              .first();
            if (await body.count()) {
              await body
                .evaluate((el) => {
                  el.scrollTop = (el.scrollTop || 0) + 260;
                })
                .catch(() => {});
            }
            await page.waitForTimeout(350);
          }
          if ((await checks.count()) < 2) {
            throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：可勾选机构不足 2 家');
          }
          await checks.nth(0).click({ timeout: 8000 });
          await page.waitForTimeout(300);
          const second = shell
            .locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)')
            .first();
          await second.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const foot = ((await shell.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/已选\s*[2-9]/.test(foot)) {
          throw new Error('选机构层已选不足 2 家: ' + foot.slice(0, 200));
        }
        const confirm = shell.getByRole('button', { name: '确定', exact: true }).last();
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await expect(main.getByText('选择分析服务机构').first()).toBeHidden({ timeout: 10000 });
      };
      const ensureTwoTags = async () => {
        let tags = ctx().locator('.arco-tag.svc-org-pick-tag');
        if ((await tags.count()) >= 2) return tags;
        const shell = await openPicker();
        await pickTwoOrgs(shell);
        await expect(main.getByText(/已选机构（2\s*家）/).first()).toBeVisible({ timeout: 12000 });
        tags = ctx().locator('.arco-tag.svc-org-pick-tag');
        await expect(tags).toHaveCount(2, { timeout: 8000 });
        return tags;
      };
      const tags = await ensureTwoTags();
      const removedName = (await tags.first().innerText()).trim();
      if (!removedName) throw new Error('首个已选标签文案为空');
      globalThis.__p04111Removed = removedName;
      const firstTag = tags.first();
      const closeBtn = firstTag.locator('.arco-tag-close-btn').first();
      if (await closeBtn.isVisible().catch(() => false)) {
        await closeBtn.click({ timeout: 8000 });
      } else {
        const iconClose = firstTag.locator('.arco-icon-hover, .arco-icon-close').first();
        if (await iconClose.isVisible().catch(() => false)) {
          await iconClose.click({ timeout: 8000 });
        } else {
          throw new Error('配置区标签无可见关闭叉');
        }
      }
      await page.waitForTimeout(600);
      await expect(main.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      await expect(ctx().locator('.arco-tag.svc-org-pick-tag')).toHaveCount(1, { timeout: 8000 });
  - note: 2、被关掉的那家不再显示
    assert: |-
      const removed = globalThis.__p04111Removed;
      if (!removed) throw new Error('前置：未记录被关闭机构名');
      const main = page.locator('main').first();
      const ctx = main.locator('[data-testid="svc-org-analysis-context-field"]');
      const tagTexts = await ctx.locator('.arco-tag.svc-org-pick-tag').allInnerTexts();
      const joined = tagTexts.map((t) => t.trim()).join('|');
      if (joined.includes(removed)) {
        throw new Error('被关闭机构仍在标签区显示: ' + removed);
      }
      await expect(main.getByText(removed, { exact: true })).toHaveCount(0, { timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id
