id: FUNC-04111
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04111
priority: P1
tier: B
title: 备选-标签关闭 · 去掉一家
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：配置区已确认 2 家机构
    assert: |-
      const root = (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/');
      const abs = (p) => new URL(p.startsWith('/') ? p : '/' + p, root).toString();
      const catalog = '/service/institution-judgment?workspace=field&tab=coverage';
      const dismissBasketOverlay = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const readSelectedCount = async () => {
        const t = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        const m = t.match(/已选机构（\s*(\d+)\s*家）/);
        return m ? parseInt(m[1], 10) : 0;
      };
      const seedBasketFromSearch = async () => {
        await page.goto(abs('/service-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1500);
        const main = page.locator('main').first();
        const join = main.getByRole('button', { name: '加入对比篮', exact: true });
        const n = await join.count();
        if (n < 1) throw new Error('检索页无「加入对比篮」可点');
        const clicks = Math.min(n, 2);
        for (let i = 0; i < clicks; i++) {
          await join.nth(0).click({ timeout: 10000 });
          await page.waitForTimeout(400);
        }
      };
      const pickTwoInServiceOrgPicker = async () => {
        await expect(page.getByText('选择分析服务机构').first()).toBeVisible({ timeout: 15000 });
        for (let i = 0; i < 2; i++) {
          const box = page.locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)').first();
          await expect(box).toBeVisible({ timeout: 8000 });
          await box.click({ timeout: 8000 });
          await page.waitForTimeout(350);
        }
        await expect(page.getByText(/已选\s*2\s*家机构/).first()).toBeVisible({ timeout: 8000 });
        await page.getByRole('button', { name: '确定', exact: true }).click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await dismissBasketOverlay();
      };
      const confirmTwoViaPicker = async () => {
        await page.goto(abs(catalog), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await dismissBasketOverlay();
        if (await page.getByText('选择分析服务机构').first().isVisible().catch(() => false)) {
          await pickTwoInServiceOrgPicker();
          return;
        }
        const openBtn = page
          .getByTestId('svc-org-open-compare-basket')
          .or(page.getByTestId('svc-org-empty-open-basket'))
          .or(page.getByRole('button', { name: /打开对比篮/ }))
          .first();
        await expect(openBtn).toBeVisible({ timeout: 12000 });
        await openBtn.click({ timeout: 10000 });
        await page.waitForTimeout(900);
        await pickTwoInServiceOrgPicker();
      };
      await dismissBasketOverlay();
      if ((await readSelectedCount()) < 2) {
        await confirmTwoViaPicker();
        if ((await readSelectedCount()) < 2) {
          await seedBasketFromSearch();
          await confirmTwoViaPicker();
        }
      }
      await expect(page.locator('main').first().getByText(/已选机构（\s*2\s*家）/).first()).toBeVisible({ timeout: 15000 });
      const tags = page.locator('[data-testid="svc-org-analysis-context-field"] .svc-org-pick-tag');
      await expect(tags).toHaveCount(2, { timeout: 8000 });
      const names = [];
      for (let i = 0; i < 2; i++) names.push(((await tags.nth(i).innerText()) || '').trim());
      globalThis.__p04111 = { removed: names[0], keep: names[1] };
  - note: 1、已选家数减少 1；2、被关掉的那家 tag 不再显示
    assert: |-
      const snap = globalThis.__p04111;
      if (!snap?.removed || !snap?.keep) throw new Error('前置：未构造 2 家已选');
      const tags = page.locator('[data-testid="svc-org-analysis-context-field"] .svc-org-pick-tag');
      await expect(tags).toHaveCount(2, { timeout: 8000 });
      const closeBtn = tags.first().locator('.arco-tag-close-btn');
      if (!(await closeBtn.count()) || !(await closeBtn.first().isVisible().catch(() => false))) {
        throw new Error('blocked: 配置区 tag 无关闭叉，无法执行步骤「点标签关闭」');
      }
      await closeBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(page.locator('main').first().getByText(/已选机构（\s*1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      await expect(tags).toHaveCount(1, { timeout: 8000 });
      const rest = ((await tags.first().innerText()) || '').trim();
      if (rest === snap.removed) throw new Error('被关掉机构仍在回显: ' + snap.removed);
      if (rest !== snap.keep) throw new Error('剩余机构不符: ' + rest + ' != ' + snap.keep);
on_fail: 截图 + 抄 X-Trace-Id
