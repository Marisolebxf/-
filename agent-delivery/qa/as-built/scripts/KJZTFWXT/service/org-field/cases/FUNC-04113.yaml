id: FUNC-04113
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04113
priority: P1
tier: B
title: 备选-当天再次开始 · 不新增任务
story: US-SVC-ORG-02
entry_id: svc-org-field
ticket: D3-SVCORG-SAME-DAY-REUSE-MISSING
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 脚本自含：同一家机构当天首发成功且配置区仍回显该 1 家（重建选首项=同指纹）
locators:
  org_picker: button「选择机构」
  start: button「开始分析」
  selected_label: 已选机构（1 家）
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置——配置区 1 家机构且当天已成功完成一次分析（无则首发构造 T1）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl ? baseUrl : 'https://edu.itic-sci.com/tts/svcz').replace(/\/$/, '');
      const spaUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const TID_RE = /SVC-\d{8}-\d+/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const tabsReady = async () => {
        const m = page.locator('[role=tab][data-tab-key="coverage"]');
        return (await m.count()) > 0 && (await m.first().isVisible().catch(() => false));
      };
      const clickMenuLeaf = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForTimeout(2500);
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await clickMenuLeaf();
        return (await tabsReady()) && !(await bodyIs404());
      };
      const ensureConfigSurface = async () => {
        await dismissBasket();
        if (page.url().includes('/login') || page.url().includes('itic-sci.com/sso')) {
          throw new Error('ENV-EDU-TTS-SVCZ-SESSION-001: 会话已掉线 url=' + page.url());
        }
        if (/view=result|view=processing|[?&]task_id=/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (await bodyIs404() || !(await tabsReady())) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          await clickMenuLeaf();
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
          let ok = false;
          for (const s of siblings) {
            if (await enterViaSidebar(s)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏均不可达 field/coverage url=' + page.url());
          }
        }
        await expect(page).toHaveURL(/\/service\/institution-judgment/, { timeout: 15000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
      };
      const pickFirstOrg = async () => {
        await ensureConfigSurface();
        const oneSelected = page.getByText(/已选机构（1\s*家）/).first();
        if (await oneSelected.isVisible().catch(() => false)) return;
        await expect(page.getByText(/已选机构（0\s*家）|未选择机构/).first()).toBeVisible({ timeout: 8000 });
        const pick = page.getByRole('button', { name: '选择机构' }).first();
        await pick.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first();
        await expect(dialog).toBeVisible({ timeout: 8000 });
        await dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)').first().click({ timeout: 5000 });
        await page.waitForTimeout(300);
        await dialog.locator('.arco-modal-footer button:visible').filter({ hasText: /^确定$/ }).last().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
      };
      const pollLand = async (ms) => {
        const toasts = [];
        let landed = null;
        for (let i = 0; i < Math.ceil(ms / 500); i++) {
          await page.waitForTimeout(500);
          const t = ((await page.locator('.arco-message, .arco-message-list').first().innerText().catch(() => '')) || '').trim();
          if (t && !toasts.includes(t)) toasts.push(t);
          const u = page.url();
          const m = u.match(/task_id=(SVC-\d{8}-\d+)/);
          if (m && /[?&]view=(processing|result)/.test(u)) {
            landed = m[1];
            return { landed, toasts };
          }
          const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          const bm = body.match(TID_RE);
          if (bm && /view=result/.test(u)) {
            landed = bm[0];
            return { landed, toasts };
          }
        }
        return { landed, toasts };
      };
      const waitResultReady = async () => {
        const main = page.locator('main').first();
        for (let i = 0; i < 45; i++) {
          await page.waitForTimeout(i < 3 ? 600 : 1500);
          const body = ((await main.innerText().catch(() => '')) || '');
          const url = page.url();
          if (/view=result/.test(url) && /核心结论|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(body)) return true;
          if (/分析结果已生成/.test(body)) {
            const vb = page.getByRole('button', { name: '查看结果', exact: true }).first();
            if (await vb.isVisible().catch(() => false)) {
              await vb.click({ timeout: 8000 });
              await page.waitForTimeout(2000);
            }
          }
          if (/本次分析生成失败|分析失败|create 失败/.test(body)) {
            throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：首发分析失败');
          }
        }
        return false;
      };
      globalThis.__func04113_posts = [];
      page.on('request', (r) => {
        try {
          if (r.method() === 'POST' && /\/tasks\/?(\?|$)/.test(r.url()) && !/\/list|\/running/.test(r.url())) {
            globalThis.__func04113_posts.push(r.url());
          }
        } catch {}
      });
      await pickFirstOrg();
      const start1 = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start1).toBeEnabled({ timeout: 8000 });
      const posts0 = globalThis.__func04113_posts.length;
      await start1.click({ timeout: 10000 });
      let land1 = await pollLand(12000);
      if (!land1.landed) {
        const s2 = page.getByRole('button', { name: '开始分析' }).first();
        if ((await s2.count()) && (await s2.isEnabled().catch(() => false)) && !/[?&]view=/.test(page.url())) {
          await s2.click({ timeout: 8000 });
          land1 = await pollLand(15000);
        }
      }
      if (!land1.landed) throw new Error('前置：首发未落过程/结果态 url=' + page.url());
      if (!(await waitResultReady())) throw new Error('前置：首发任务 ' + land1.landed + ' 未达可看结果');
      const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const priorId = land1.landed;
      if (!new RegExp('^SVC-' + todayStr + '-').test(priorId)) {
        globalThis.__func04113_notes = ['首发 task_id=' + priorId + ' 非日历当天（共享账号历史）；仍按同指纹复用口径判第二条'];
      } else {
        globalThis.__func04113_notes = [];
      }
      await ensureConfigSurface();
      await pickFirstOrg();
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
      globalThis.__func04113 = {
        priorTaskId: priorId,
        firstPosts: globalThis.__func04113_posts.length - posts0,
        firstToasts: land1.toasts || [],
      };
  - note: 1、再次点击「开始分析」应打开当天已成功的那次结果；2、不新增分析任务（Q-ANALYSIS-01 / AC-US-SVC-ORG-02-03）
    assert: |-
      const ctx = globalThis.__func04113;
      if (!ctx?.priorTaskId) throw new Error('前置：未捕获当天既有 task_id');
      const priorId = ctx.priorTaskId;
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await expect(start).toBeEnabled({ timeout: 8000 });
      const postsPre = (globalThis.__func04113_posts || []).length;
      await start.click({ timeout: 10000 });
      const toasts = [];
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(500);
        const t = ((await page.locator('.arco-message, .arco-message-list').first().innerText().catch(() => '')) || '').trim();
        if (t && !toasts.includes(t)) toasts.push(t);
      }
      let landed = null;
      for (let i = 0; i < 20; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 800);
        const u = page.url();
        const m = u.match(/task_id=(SVC-\d{8}-\d+)/);
        if (m) landed = m[1];
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        const bm = body.match(/SVC-\d{8}-\d+/);
        if (bm) landed = bm[0];
        if (/view=result/.test(u) && /核心结论|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(body)) break;
        if (/view=processing/.test(u) && /任务已创建|分析结果已生成/.test(body + toasts.join(' '))) break;
      }
      const newPosts = (globalThis.__func04113_posts || []).length - postsPre;
      const errs = [];
      if (!landed) errs.push('再点「开始分析」未落结果/过程态: ' + page.url());
      if (landed && landed !== priorId) errs.push('落点 ' + landed + ' ≠ 当天既有 ' + priorId + '（应直接打开已有结果）');
      if (newPosts > 0) errs.push('仍 POST 新建任务 ×' + newPosts + '（应 0 次复用）');
      if (/任务已创建/.test(toasts.join(' | '))) errs.push('toast「' + toasts.join(' | ') + '」表明新建而非复用');
      if (/view=processing/.test(page.url()) && landed !== priorId) {
        errs.push('进入过程壳且 task_id 已变（用例备注：现场仍新建并提示任务已创建）');
      }
      if (errs.length) {
        throw new Error(
          'D3-SVCORG-SAME-DAY-REUSE-MISSING: ' +
            errs.join('; ') +
            '（Q-ANALYSIS-01：同机构当天已成功后再开始应打开既有结果不重跑；与 P0-10 / sz/graph/chain/cultivate 同根因票；绿则本条转 pass）'
        );
      }
      const main = page.locator('main').first();
      await expect(main.getByText(/核心结论|当前结果快照没有覆盖矩阵/).first()).toBeVisible({ timeout: 10000 });
      globalThis.__func04113_reuse_ok = { landed, newPosts, toasts };
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04113=配置态同 1 家机构（重建选首项=同指纹）当天首发成功后，再点「开始分析」应复用既有结果（0 POST、task_id 不变、无「任务已创建」toast）。
  用例备注现场仍新建→预设红挂 ticket D3-SVCORG-SAME-DAY-REUSE-MISSING（与 P0-10 同票）；产品修复后本脚本应转绿。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；深链 404 时 sibling 侧栏补进（对齐 FUNC-04108）。
