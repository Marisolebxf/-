id: FUNC-04113
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04113
priority: P1
tier: B
title: 备选-当天再次开始 · 不新增任务
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  - action: click
    target: button「打开对比篮」
  - action: evaluate
    target: |-
      const ws = page.locator('[data-testid="service-org-compare-basket-workspace"]');
      await expect(ws).toBeVisible({ timeout: 15000 });
      const bar = page.locator('[data-testid="compare-basket-action-bar"]');
      await bar.getByRole('checkbox', { name: '全选当前筛选结果' }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(page.getByText(/已选 [1-9]\d* 家机构/).first()).toBeVisible({ timeout: 8000 });
      await bar.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 15000 });
  - action: evaluate
    target: |-
      globalThis.__func04113_posts = [];
      page.on('request', (r) => {
        try {
          if (r.method() === 'POST' && /\/tasks\/?(\?|$)/.test(r.url()) && !/\/list|\/running/.test(r.url())) {
            globalThis.__func04113_posts.push(r.url());
          }
        } catch {}
      });
      await page.locator('[data-testid="svc-org-start-analysis"]').click({ timeout: 10000 });
      const viewResult = page.getByRole('button', { name: '查看结果', exact: true }).first();
      for (let i = 0; i < 30; i++) {
        await page.waitForTimeout(500);
        if (await viewResult.isVisible().catch(() => false)) {
          await viewResult.click({ timeout: 8000 });
          break;
        }
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (/view=result/.test(page.url()) && /核心结论/.test(body)) break;
      }
      await expect(page.locator('main').first().getByText(/核心结论/).first()).toBeVisible({ timeout: 20000 });
      const m = page.url().match(/task_id=(SVC-\d{8}-\d+)/);
      globalThis.__func04113_priorTaskId = m ? m[1] : null;
      if (!globalThis.__func04113_priorTaskId) {
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        const bm = body.match(/SVC-\d{8}-\d+/);
        globalThis.__func04113_priorTaskId = bm ? bm[0] : null;
      }
      if (!globalThis.__func04113_priorTaskId) throw new Error('前置：首发未捕获 task_id');
      globalThis.__func04113_posts_after_first = globalThis.__func04113_posts.length;
  - action: evaluate
    target: |-
      await page.getByRole('button', { name: '返回配置' }).first().click({ timeout: 10000 });
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 15000 });
  - action: evaluate
    target: |-
      await page.locator('[data-testid="svc-org-start-analysis"]').click({ timeout: 10000 });
expect:
  - note: 1、打开当天已成功的那次结果
    assert: |-
      const priorId = globalThis.__func04113_priorTaskId;
      if (!priorId) throw new Error('前置：未捕获当天既有 task_id');
      const main = page.locator('main').first();
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(500);
        const u = page.url();
        const body = ((await main.innerText().catch(() => '')) || '');
        if (/view=result/.test(u) && /核心结论|当前结果快照没有覆盖矩阵/.test(body)) break;
        const vb = page.getByRole('button', { name: '查看结果', exact: true }).first();
        if (await vb.isVisible().catch(() => false)) {
          await vb.click({ timeout: 8000 });
          await page.waitForTimeout(800);
        }
      }
      await expect(main.getByText(/核心结论|当前结果快照没有覆盖矩阵/).first()).toBeVisible({ timeout: 12000 });
      const landed = (page.url().match(/task_id=(SVC-\d{8}-\d+)/) || [])[1]
        || (((await main.innerText().catch(() => '')) || '').match(/SVC-\d{8}-\d+/) || [])[0];
      if (landed && landed !== priorId) {
        throw new Error('应打开当天既有结果 ' + priorId + '，实际 ' + landed);
      }
      await expect(page).toHaveURL(new RegExp('task_id=' + priorId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
  - note: 2、不新增分析任务
    assert: |-
      const priorId = globalThis.__func04113_priorTaskId;
      const afterFirst = globalThis.__func04113_posts_after_first ?? 0;
      const posts = globalThis.__func04113_posts || [];
      const newPosts = Math.max(0, posts.length - afterFirst);
      const toasts = ((await page.locator('.arco-message, .arco-message-list').first().innerText().catch(() => '')) || '').trim();
      if (newPosts > 0) {
        throw new Error('仍 POST 新建任务 ×' + newPosts + '（应复用既有结果）');
      }
      if (/任务已创建/.test(toasts)) {
        throw new Error('toast 表明新建任务：' + toasts);
      }
      if (/view=processing/.test(page.url())) {
        const tid = (page.url().match(/task_id=(SVC-\d{8}-\d+)/) || [])[1];
        if (tid && tid !== priorId) {
          throw new Error('进入新过程页 task_id=' + tid + '，应复用 ' + priorId);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
