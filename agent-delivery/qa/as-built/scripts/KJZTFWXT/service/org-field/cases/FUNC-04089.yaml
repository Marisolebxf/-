id: FUNC-04089
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04089
priority: P0
tier: A
title: 主流程-未选不可发起-开始分析
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已选机构为 0 家
locators:
  config_heading: text「分析配置」
  org_picker: button「选择机构」
  start: button「开始分析」
  empty_hint: 请先选择分析机构
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、提示「请先选择分析机构」（未选机构时点击「开始分析」）
    assert: |-
      const resetIfDirty = async () => {
        if (/org_ids=|view=result|view=processing/.test(page.url())) {
          await page.goto('/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(900);
        }
      };
      await resetIfDirty();
      const closeBasket = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeBasket.count() && await closeBasket.first().isVisible().catch(() => false)) {
        try { await closeBasket.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
      }
      const main = page.locator('main.content-shell-layout, main').first();
      const t0 = await main.innerText().catch(() => '');
      if (/已选机构（[1-9]/.test(t0 || '')) {
        const clr = main.getByRole('button', { name: '清空' });
        if (await clr.count()) { await clr.first().click({ timeout: 5000 }); await page.waitForTimeout(600); }
      }
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析 SPA 404 ' + page.url());
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText(/已选机构（0\s*家）|未选择机构/).first()).toBeVisible({ timeout: 8000 });
      const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(page.getByText(/请先选择分析机构/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、仍停留在分析配置（不进入过程页）
    assert: |-
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      if (/view=processing|view=result/.test(page.url())) {
        throw new Error('未选机构点击开始分析不应进入过程/结果 view: ' + page.url());
      }
      const main = page.locator('main.content-shell-layout, main').first();
      const t = await main.innerText().catch(() => '');
      if (/分析结果已生成|分析过程|任务已创建，正在展示分析过程/.test(t || '')) {
        throw new Error('不应进入分析过程页: ' + (t || '').slice(0, 280));
      }
      await expect(page.getByRole('button', { name: '选择机构', exact: true })).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析', exact: true })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1：空态「开始分析」enabled=true，靠 Message/文案「请先选择分析机构」门控（勿 toBeDisabled）。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；前置 0 家机构（脏 URL 重进 + 已选则点清空）。
