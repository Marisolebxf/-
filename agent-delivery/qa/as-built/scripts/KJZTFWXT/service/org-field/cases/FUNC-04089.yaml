id: FUNC-04089
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04089
priority: P0
tier: A
title: 主流程-未选不可发起-开始分析
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已选机构为 0 家
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、提示「请先选择分析机构」
    assert: |-
      const main = page.locator('main.content-shell-layout, main').first();
      await expect(main.getByText(/已选机构（0\s*家）/).first()).toBeVisible({ timeout: 12000 });
      await expect(main.getByText('未选择机构').first()).toBeVisible({ timeout: 8000 });
      const start = main.getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.click({ force: true, timeout: 8000 });
      await page.waitForTimeout(600);
      const toast = page.locator('.arco-message, .arco-message-list').getByText(/请先.*选择.*分析机构/);
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
  - note: 2、仍停留在分析配置
    assert: |-
      await expect(page.locator('[data-testid="svc-org-analysis-config"]')).toBeVisible({ timeout: 8000 });
      if (/view=processing|view=result/.test(page.url())) {
        throw new Error('未选机构不应进入过程/结果 view: ' + page.url());
      }
      const main = page.locator('main.content-shell-layout, main').first();
      const t = await main.innerText().catch(() => '');
      if (/分析结果已生成|分析过程|任务已创建，正在展示分析过程/.test(t || '')) {
        throw new Error('不应进入分析过程页');
      }
      await expect(main.getByText(/已选机构（0\s*家）/).first()).toBeVisible({ timeout: 8000 });
      await expect(main.getByRole('button', { name: '开始分析', exact: true })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
