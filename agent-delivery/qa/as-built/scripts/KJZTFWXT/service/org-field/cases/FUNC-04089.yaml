id: FUNC-04089
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04089
priority: P0
tier: B
title: 主流程-未选不可发起
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、提示「请先选择分析机构」
    assert: |-
      const main = page.locator('main').first();
      await expect(page.locator('[data-testid="svc-org-analysis-config"]')).toBeVisible({ timeout: 12000 });
      const startBtn = page.getByTestId('svc-org-start-analysis').or(main.getByRole('button', { name: '开始分析' })).first();
      await expect(startBtn).toBeVisible({ timeout: 8000 });
      await startBtn.click({ force: true, timeout: 8000 });
      await page.waitForTimeout(1000);
      const hint = main.getByText(/请先选择分析机构|请先在对比篮中选择分析机构|尚未选择分析机构/).first();
      const toast = page.locator('.arco-message').filter({ hasText: /请先选择分析机构|请先在对比篮中选择分析机构|尚未选择分析机构/ }).first();
      if ((await hint.count()) > 0) {
        await expect(hint).toBeVisible({ timeout: 5000 });
      } else {
        await expect(toast).toBeVisible({ timeout: 5000 });
      }
  - note: 2、仍停留在分析配置
    assert: |-
      await expect(page).toHaveURL(/workspace=field/);
      await expect(page).toHaveURL(/tab=coverage/);
      await expect(page.locator('[data-testid="svc-org-analysis-config"]')).toBeVisible();
      await expect(page.locator('main').first().getByRole('button', { name: '开始分析' }).first()).toBeVisible();
      await expect(page.locator('main').first()).not.toContainText('分析结果已生成');
on_fail: 截图 + 抄 X-Trace-Id
