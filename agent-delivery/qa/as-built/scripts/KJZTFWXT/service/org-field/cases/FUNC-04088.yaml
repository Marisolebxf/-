id: FUNC-04088
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04088
priority: P0
tier: A
title: 主流程-已选机构发起直到成功结果（金样）
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已进入分析配置；当前未在分析过程中
locators:
  open_basket: button「打开对比篮」
  confirm: button「确定」
  start: button「开始分析」
  view_result: button「查看结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页出现「分析结果已生成」（选定 1 家机构并点击「开始分析」后）
    assert: |-
      const main = page.locator('main').first();
      await expect(page.locator('[data-testid="svc-org-analysis-config"]')).toBeVisible({ timeout: 12000 });
      const clr = main.getByRole('button', { name: '清空' });
      if (await clr.count()) {
        const t0 = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t0)) {
          await clr.first().click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(500);
        }
      }
      const openBasket = page
        .getByTestId('svc-org-open-compare-basket')
        .or(page.getByTestId('svc-org-empty-open-basket'));
      await openBasket.first().click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(main.getByText('选择分析服务机构').first()).toBeVisible({ timeout: 10000 });
      const pickCheck = main.locator('.arco-checkbox:not(.arco-checkbox-disabled)').nth(1);
      await pickCheck.click({ timeout: 5000 });
      await expect(main.getByText(/已选\s*1\s*家机构/).first()).toBeVisible({ timeout: 8000 });
      await main.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(main.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      const start = page.getByTestId('svc-org-start-analysis');
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      let body = '';
      for (let i = 0; i < 40; i++) {
        await page.waitForTimeout(i === 0 ? 800 : 2000);
        body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
        if (/分析结果已生成/.test(body)) break;
        if (/本次分析生成失败|分析失败|create 失败/.test(body)) {
          throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：分析未成功完成');
        }
      }
      if (!/分析结果已生成/.test(body)) {
        throw new Error('超时未见过程页「分析结果已生成」: ' + body.slice(0, 280));
      }
      globalThis.__func04088 = { processOk: true };
  - note: 2、结果页标题为「服务机构产业领域服务广度 & 深度」
    assert: |-
      if (!globalThis.__func04088?.processOk) throw new Error('前置：过程页未完成');
      const viewBtn = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(viewBtn).toBeVisible({ timeout: 8000 });
      if (!/view=result/.test(page.url())) {
        await viewBtn.click({ timeout: 8000 });
        await page.waitForTimeout(2500);
      }
      const main = page.locator('main').first();
      await expect(main.getByText(/服务机构产业领域服务广度\s*&\s*深度/).first()).toBeVisible({ timeout: 12000 });
  - note: 3、结果页出现「核心结论」
    assert: |-
      if (!globalThis.__func04088?.processOk) throw new Error('前置：过程页未完成');
      const main = page.locator('main').first();
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  金样 04088：对象集入口为「打开对比篮」picker；过程页须显式点「查看结果」。catalog_path=/service/institution-judgment?workspace=field&tab=coverage。
