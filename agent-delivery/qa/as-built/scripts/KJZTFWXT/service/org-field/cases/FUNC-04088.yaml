id: FUNC-04088
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04088
priority: P0
tier: A
title: 主流程-已选机构发起直到成功结果（金样）
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已进入分析配置；当前未在分析过程中
locators:
  org_picker: button「选择机构」
  modal_title: 选择服务机构
  confirm: button「确定」
  start: button「开始分析」
  view_result: button「查看结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页出现「分析结果已生成」（选定 1 家机构并点击「开始分析」后）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const resetConfig = async () => {
        if (/org_ids|view=/.test(page.url())) {
          await page.goto('/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      await dismissBasket();
      await resetConfig();
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析 SPA 404 ' + page.url());
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await page.getByRole('button', { name: '选择机构', exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const dialog = page.locator('.arco-modal:visible, .arco-modal').filter({ hasText: '选择服务机构' }).first();
      await expect(dialog).toBeVisible({ timeout: 8000 });
      const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
      if (!(await checks.count())) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：弹窗无可勾选机构');
      await checks.first().click({ timeout: 5000 });
      await page.waitForTimeout(300);
      await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
      const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      let body = '';
      for (let i = 0; i < 40; i++) {
        await page.waitForTimeout(i === 0 ? 800 : 2000);
        body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
        if (/分析结果已生成/.test(body)) break;
        if (/本次分析生成失败|分析失败|create 失败/.test(body)) {
          throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：分析未成功完成');
        }
      }
      if (!/分析结果已生成/.test(body)) {
        throw new Error('超时未见过程页「分析结果已生成」: ' + body.slice(0, 280));
      }
      globalThis.__func04088 = { processOk: true };
  - note: 2、结果页标题为「服务机构产业领域服务广度 & 深度」
    assert: |-
      if (!globalThis.__func04088?.processOk) throw new Error('前置：过程页未完成');
      const viewBtn = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(viewBtn).toBeVisible({ timeout: 8000 });
      if (!/view=result/.test(page.url())) {
        await viewBtn.click({ timeout: 8000 });
        await page.waitForTimeout(2500);
      }
      const main = page.locator('main').first();
      await expect(main.getByText(/服务机构产业领域服务广度\s*&\s*深度/).first()).toBeVisible({ timeout: 12000 });
  - note: 3、结果页出现「核心结论」
    assert: |-
      if (!globalThis.__func04088?.processOk) throw new Error('前置：过程页未完成');
      const main = page.locator('main').first();
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  金样 04088：过程页须显式点「查看结果」才进结果壳（不自动跳转）。catalog_path=/service/institution-judgment?workspace=field&tab=coverage。
  结果标题 h3 文案「服务机构产业领域服务广度 & 深度」；诚实空环境下仍可见「核心结论」区（TOP 排名可为「暂无可排名机构」）。
