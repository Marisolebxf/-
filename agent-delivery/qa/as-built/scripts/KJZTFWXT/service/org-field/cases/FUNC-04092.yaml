id: FUNC-04092
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04092
priority: P0
tier: A
title: 主流程-过程页回记录
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已打开一次分析的过程页（脚本内先发起 1 次分析进入过程页）
locators:
  view_records: button「查看分析记录」
  records_tab: tab「分析记录」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、进入分析记录（过程页点击「查看分析记录」）
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const TID_RE = /SVC-\d{8}-\d{3}/;
      const PROCESS_TITLE = '服务机构产业领域分析生成中';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const clickMenuLeaf = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (await bodyIs404()) return false;
        await clickMenuLeaf();
        return !(await bodyIs404());
      };
      const ensureOnConfig = async () => {
        await dismissBasket();
        if (!(await bodyIs404())) {
          await resetConfig();
          if (!(await bodyIs404()) && (await page.getByText('分析配置').first().isVisible().catch(() => false))) return;
        }
        await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(600);
        await page.goto(spaUrl('/service/institution-judgment?workspace=field&tab=coverage'), {
          waitUntil: 'domcontentloaded',
          timeout: 60000,
        });
        await page.waitForTimeout(1200);
        if (!(await bodyIs404()) && (await page.getByText('分析配置').first().isVisible().catch(() => false))) {
          await resetConfig();
          return;
        }
        for (const sibling of ['/industry-center/search', '/service-portal/overview']) {
          try {
            if (await enterViaSidebar(sibling)) {
              if (await page.getByText('分析配置').first().isVisible().catch(() => false)) return;
            }
          } catch {
            /* try next sibling */
          }
        }
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏均 SPA404 url=' + page.url());
        }
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入分析配置 url=' + page.url());
      };
      const resetConfig = async () => {
        if (/org_ids|view=/.test(page.url())) {
          await page.goto(spaUrl('/service/institution-judgment?workspace=field&tab=coverage'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        const t = ((await main().innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main().getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      const extractTaskId = (body, url) => {
        try {
          const fromUrl = new URL(url).searchParams.get('task_id') || '';
          if (fromUrl && TID_RE.test(fromUrl)) return fromUrl;
        } catch {}
        const m = (body || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const onProcessShell = (body, url) =>
        new RegExp(PROCESS_TITLE).test(body) ||
        /可视化分析过程/.test(body) ||
        /view=processing/.test(url) ||
        (/分析结果已生成/.test(body) && TID_RE.test(body));
      const startOneAnalysis = async () => {
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
        await page.getByRole('button', { name: '选择机构', exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const dialog = page.locator('.arco-modal:visible, .arco-modal').filter({ hasText: '选择服务机构' }).first();
        await expect(dialog).toBeVisible({ timeout: 8000 });
        const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
        if (!(await checks.count())) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：弹窗无可勾选机构');
        await checks.first().click({ timeout: 5000 });
        await page.waitForTimeout(300);
        await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
        const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 8000 });
        let mainText = '';
        let url = page.url();
        for (let i = 0; i < 40; i++) {
          await page.waitForTimeout(i === 0 ? 800 : 2000);
          mainText = ((await main().innerText().catch(() => '')) || '').trim();
          url = page.url();
          const tid = extractTaskId(mainText.replace(/\s+/g, ' '), url);
          if (onProcessShell(mainText.replace(/\s+/g, ' '), url) && tid) return tid;
          if (/本次分析生成失败|分析失败|create 失败/.test(mainText)) {
            throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：分析未成功进入过程页');
          }
        }
        throw new Error('超时未进入过程页: ' + url + ' ' + mainText.slice(0, 200));
      };
      await ensureOnConfig();
      const taskId = await startOneAnalysis();
      if (!taskId) throw new Error('过程页未捕获 task_id');
      globalThis.__func04092 = { taskId, clickedRecords: false };
      const recordsBtn = page.getByRole('button', { name: '查看分析记录' }).first();
      await expect(recordsBtn).toBeVisible({ timeout: 12000 });
      await recordsBtn.click({ timeout: 15000 });
      await page.waitForTimeout(1200);
      const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录' }));
      await expect(recTab.first()).toBeVisible({ timeout: 10000 });
      await expect(recTab.first()).toHaveAttribute('aria-selected', 'true');
      const urlAfter = page.url();
      const bodyAfter = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/tab=records|view=records/.test(urlAfter) && !/任务\s*\n|全部状态|org_coverage/.test(bodyAfter)) {
        throw new Error('点「查看分析记录」后未见分析记录区，url=' + urlAfter);
      }
      await expect(page.getByText(/任务|类型|状态|创建时间/).first()).toBeVisible({ timeout: 8000 });
      globalThis.__func04092.clickedRecords = true;
  - note: 2、地址仍带本次任务（URL 含过程页 task_id）
    assert: |-
      const snap = globalThis.__func04092;
      if (!snap?.clickedRecords) throw new Error('前置：未点击「查看分析记录」');
      const taskId = snap.taskId || '';
      if (!taskId) throw new Error('前置：无 task_id');
      const url = page.url();
      const params = new URL(url).searchParams;
      const urlTid = params.get('task_id') || '';
      const main = page.locator('main').first();
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (urlTid && urlTid === taskId) return;
      if (url.includes(taskId)) return;
      if (body.includes(taskId)) {
        const row = main.locator('tbody tr, .arco-table-tr').filter({ hasText: taskId }).first();
        if ((await row.count()) >= 1) return;
      }
      throw new Error('地址/列表未仍带本次任务 ' + taskId + ' url=' + url + ' body=' + body.slice(0, 240));
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  过程壳「查看分析记录」→ 分析记录 Tab 选中 + 记录表；地址仍带 task_id 或列表高亮本任务行。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；edu 深链 SPA404 时 sibling /service-portal/overview 侧栏补进。
