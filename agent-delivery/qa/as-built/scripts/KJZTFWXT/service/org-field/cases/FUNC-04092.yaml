id: FUNC-04092
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04092
priority: P1
tier: B
title: 主流程-过程页回记录
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、进入分析记录
    assert: |-
      const TID_RE = /SVC-\d{8}-\d{3}/;
      const main = () => page.locator('main').first();
      const extractTaskId = (body, url) => {
        try {
          const fromUrl = new URL(url).searchParams.get('task_id') || '';
          if (fromUrl && TID_RE.test(fromUrl)) return fromUrl;
        } catch {}
        const m = (body || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const onProcessShell = async (body, url) =>
        /服务机构产业领域分析生成中/.test(body) ||
        /可视化分析过程/.test(body) ||
        /view=processing/.test(url) ||
        (await main().getByTestId('svc-org-analysis-process').isVisible().catch(() => false));
      const pickOneOrgViaBasket = async () => {
        const openBasket = main()
          .getByTestId('svc-org-open-compare-basket')
          .or(main().getByTestId('svc-org-empty-open-basket'))
          .or(main().getByRole('button', { name: /打开对比篮/ }))
          .first();
        await expect(openBasket).toBeVisible({ timeout: 12000 });
        await openBasket.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        const checks = page.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
        await expect(checks.first()).toBeVisible({ timeout: 15000 });
        await checks.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const confirm = page.getByRole('button', { name: /^(确定|完成|确认)$/ }).first();
        await expect(confirm).toBeVisible({ timeout: 10000 });
        await confirm.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(main().getByText(/已选机构（\s*[1-9]\d*\s*家）/).first()).toBeVisible({ timeout: 15000 });
      };
      const startOneAnalysis = async () => {
        const mainText0 = ((await main().innerText().catch(() => '')) || '');
        if (!/已选机构（\s*[1-9]/.test(mainText0)) await pickOneOrgViaBasket();
        const start = main()
          .getByTestId('svc-org-start-analysis')
          .or(main().getByRole('button', { name: '开始分析', exact: true }))
          .first();
        await expect(start).toBeEnabled({ timeout: 12000 });
        await start.click({ timeout: 10000 });
        let mainText = '';
        let url = page.url();
        for (let i = 0; i < 45; i++) {
          await page.waitForTimeout(i === 0 ? 800 : 2000);
          mainText = ((await main().innerText().catch(() => '')) || '').trim();
          url = page.url();
          const tid = extractTaskId(mainText.replace(/\s+/g, ' '), url);
          if (tid && (await onProcessShell(mainText.replace(/\s+/g, ' '), url))) return tid;
          if (/查看结果/.test(mainText) && tid) {
            await main().getByRole('button', { name: '查看结果' }).first().click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(800);
            continue;
          }
          if (/本次分析生成失败|分析失败|create 失败/.test(mainText)) {
            throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL');
          }
        }
        throw new Error('超时未进入过程页');
      };
      const taskId = await startOneAnalysis();
      if (!taskId) throw new Error('过程页未捕获 task_id');
      globalThis.__func04092 = { taskId };
      const recordsBtn = main().getByRole('button', { name: '查看分析记录' }).first();
      await expect(recordsBtn).toBeVisible({ timeout: 15000 });
      await recordsBtn.click({ timeout: 15000 });
      await page.waitForTimeout(1200);
      const recordsPanel = main().getByTestId('svc-org-analysis-records');
      await expect(recordsPanel).toBeVisible({ timeout: 15000 });
      const urlAfter = page.url();
      await expect(page).toHaveURL(/tab=records|view=records/, { timeout: 8000 });
      const recTab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(recTab).toHaveAttribute('aria-selected', 'true');
  - note: 2、地址仍带本次任务
    assert: |-
      const snap = globalThis.__func04092;
      const taskId = snap?.taskId || '';
      if (!taskId) throw new Error('前置：无 task_id');
      const url = page.url();
      const urlTid = new URL(url).searchParams.get('task_id') || '';
      if (urlTid === taskId) return;
      if (url.includes(taskId)) return;
      const main = page.locator('main').first();
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (body.includes(taskId)) {
        const row = main.locator('tbody tr, .arco-table-tr').filter({ hasText: taskId }).first();
        if ((await row.count()) >= 1) return;
      }
      throw new Error('地址/主区未仍带本次任务 ' + taskId);
on_fail: 截图 + 抄 X-Trace-Id
