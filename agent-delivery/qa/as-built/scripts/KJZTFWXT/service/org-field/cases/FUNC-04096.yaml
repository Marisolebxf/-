id: FUNC-04096
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04096
priority: P1
tier: B
title: 主流程-热力图空态
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、页面提供「热力图」（前置：分析记录→已完成行「查看结果」打开该次结果页）
    assert: |-
      const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })).first();
      await expect(recTab).toBeVisible({ timeout: 15000 });
      await recTab.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 15000 }).catch(() => {});
      await page.waitForTimeout(800);
      const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
      if (!/已完成/.test(mainRec)) {
        throw new Error('修订 blocked：分析记录无已完成行，无法满足「已有一次成功结果」');
      }
      const rows = page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ });
      const rowN = await rows.count();
      if (!rowN) {
        throw new Error('修订 blocked：未定位到已完成任务行');
      }
      let openedEmpty = false;
      for (let i = 0; i < Math.min(rowN, 10); i++) {
        const row = rows.nth(i);
        const resBtn = row.getByRole('button', { name: /查看结果/ }).first();
        if (!(await resBtn.count())) continue;
        if (await resBtn.isDisabled().catch(() => true)) continue;
        await resBtn.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        for (let j = 0; j < 12; j++) {
          const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
          if (/当前结果快照没有覆盖矩阵/.test(body)) {
            openedEmpty = true;
            break;
          }
          if (/核心结论|服务机构产业领域服务广度/.test(body)) break;
          await page.waitForTimeout(800);
        }
        if (openedEmpty) break;
        await recTab.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
      }
      if (!openedEmpty) {
        throw new Error('修订 blocked：30892 已完成记录均无无覆盖矩阵空态，热力图空标题不可机检');
      }
      globalThis.__func04096 = { resultOpen: true };
      const switcher = page.locator('[data-testid="svc-org-coverage-chart-switch"]').first();
      if (await switcher.count()) {
        await expect(switcher.getByText('热力图', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      } else {
        await expect(page.locator('main').first().getByText('热力图', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      }
  - note: 2、图表区标题为「当前结果快照没有覆盖矩阵」
    assert: |-
      if (!globalThis.__func04096?.resultOpen) {
        throw new Error('修订 blocked：未打开无覆盖矩阵的结果页');
      }
      const board = page.locator('[data-testid="svc-org-coverage-board"]').first();
      const scope = (await board.count()) ? board : page.locator('main').first();
      await expect(scope.getByText('当前结果快照没有覆盖矩阵').first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
