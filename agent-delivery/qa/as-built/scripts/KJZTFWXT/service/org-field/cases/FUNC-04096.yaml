id: FUNC-04096
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04096
priority: P0
tier: A
title: 主流程-热力图空态
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已有一次成功结果（分析记录存在已完成任务）
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
  chart_switch: data-testid=svc-org-coverage-chart-switch
  coverage_board: data-testid=svc-org-coverage-board
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、页面提供「热力图」（打开该次结果页：分析记录→已完成行「查看结果」）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl ? baseUrl : 'http://10.50.69.111:30892').replace(/\/$/, '');
      const spaUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const onTarget = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      const ensureOnFieldCoverage = async () => {
        await dismissBasket();
        if (onTarget() && !(await bodyIs404())) return;
        if (await bodyIs404()) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!onTarget() || (await bodyIs404())) {
          const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
          let ok = false;
          for (const s of siblings) {
            if (await enterViaSidebar(s)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均 SPA404，无法打开结果页 url=' + page.url());
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析入口不可用 ' + page.url());
        }
      };
      const openExistingResult = async () => {
        if (/view=result/.test(page.url())) {
          const main0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          if (/当前结果快照没有覆盖矩阵/.test(main0)) return;
        }
        const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })).first();
        await expect(recTab).toBeVisible({ timeout: 12000 });
        await recTab.click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
        await page.waitForTimeout(1200);
        const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
        if (!/SVC-\d{8}-\d+/.test(mainRec)) {
          throw new Error('ENV-SVC-ORG-FIELD-NO-RECORDS：分析记录无历史任务，无法满足「已有一次成功结果」');
        }
        if (!/已完成/.test(mainRec)) {
          throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：分析记录无已完成行');
        }
        const rows = page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ }).filter({ hasText: /SVC-\d{8}-\d+/ });
        const rowN = await rows.count();
        if (!rowN) throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：未定位到已完成任务行');
        let hasEmptyMatrix = false;
        for (let i = 0; i < Math.min(rowN, 8) && !hasEmptyMatrix; i++) {
          const row = rows.nth(i);
          const resBtn = row.getByRole('button', { name: /查看结果/ }).first();
          if (!(await resBtn.count())) continue;
          if (await resBtn.isDisabled().catch(() => false)) continue;
          await resBtn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          let entered = false;
          for (let j = 0; j < 15; j++) {
            const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
            if (/当前结果快照没有覆盖矩阵/.test(body)) {
              hasEmptyMatrix = true;
              entered = true;
              break;
            }
            if (/view=result/.test(page.url()) || /服务机构产业领域服务广度/.test(body)) {
              entered = true;
              break;
            }
            await page.waitForTimeout(1000);
          }
          if (hasEmptyMatrix) break;
          if (entered) {
            await recTab.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1000);
          } else {
            await recTab.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1000);
          }
        }
        if (!hasEmptyMatrix) {
          throw new Error('ENV-SVC-ORG-FIELD-NO-EMPTY-MATRIX：已完成任务中未找到无覆盖矩阵的结果快照');
        }
      };
      await ensureOnFieldCoverage();
      await openExistingResult();
      globalThis.__func04096 = { resultOpen: true };
      const switcher = page.locator('[data-testid="svc-org-coverage-chart-switch"]').first();
      const heatInSwitch = switcher.locator('label, .arco-radio-button').filter({ hasText: /^热力图$/ }).first();
      if (await switcher.count()) {
        await expect(heatInSwitch).toBeVisible({ timeout: 10000 });
      } else {
        const main = page.locator('main').first();
        await expect(main.getByText('热力图', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      }
  - note: 2、图表区标题为「当前结果快照没有覆盖矩阵」
    assert: |-
      if (!globalThis.__func04096?.resultOpen) throw new Error('前置：未打开该次结果页');
      const board = page.locator('[data-testid="svc-org-coverage-board"]').first();
      const scope = (await board.count()) ? board : page.locator('main').first();
      await expect(scope.getByText('当前结果快照没有覆盖矩阵').first()).toBeVisible({ timeout: 10000 });
      const boardTxt = ((await scope.innerText().catch(() => '')) || '').trim();
      if (!/当前结果快照没有覆盖矩阵/.test(boardTxt)) {
        throw new Error('图表区未见空矩阵标题: ' + boardTxt.slice(0, 280));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04096=无覆盖矩阵时结果页热力图壳仍提供「热力图」图型切换，图表区诚实空标题「当前结果快照没有覆盖矩阵」（scout-p008/p014 关评审复勘）。
  入口=分析记录已完成行「查看结果」；catalog_path=/service/institution-judgment?workspace=field&tab=coverage。
