id: FUNC-00642
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00642
priority: P0
tier: A
title: 主流程-配置空态-未选机构
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 已进入服务机构产业领域分析页 field/coverage
  - 已选机构为 0 家
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、可见「选择机构」与「开始分析」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText(/已选机构（0\s*家）/)).toBeVisible({ timeout: 12000 });
      await expect(main.getByText('未选择机构')).toBeVisible({ timeout: 8000 });
      await expect(main.getByRole('button', { name: '开始分析', exact: true })).toBeVisible({ timeout: 8000 });
      await expect(main.getByRole('button', { name: '打开对比篮' }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、产业领域占位为「筛选领域（不改分析指纹）」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('产业领域').first()).toBeVisible({ timeout: 8000 });
      const cascader = main.locator('.arco-cascader-view').first();
      await expect(cascader).toBeVisible({ timeout: 8000 });
      const label = ((await cascader.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!label || !/产业/.test(label)) {
        throw new Error('产业领域级联未展示默认取值: ' + label);
      }
  - note: 3、提示先选择分析机构再点开始分析（未选机构配置空态，不进入结果区）
    assert: |-
      const main = page.locator('main.content-shell-layout, main').first();
      await expect(main.getByText(/尚未选择分析机构，请先在对比篮中组装分析对象/)).toBeVisible({ timeout: 8000 });
      if (/view=result|view=processing/.test(page.url())) {
        throw new Error('空态不应在结果/过程 view: ' + page.url());
      }
      const charts = main.locator('canvas, [_echarts_instance_], .echarts-for-react');
      if ((await charts.count()) > 0) {
        throw new Error('配置空态不应渲染图表 count=' + (await charts.count()));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  30892 对象集经对比篮；配置区可见已选机构（0 家）/未选择机构/打开对比篮/开始分析；
  产业领域为 Arco 级联默认展示路径（非旧 placeholder 文案）。
