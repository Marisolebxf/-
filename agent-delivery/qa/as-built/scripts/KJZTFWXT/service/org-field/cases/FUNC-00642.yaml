id: FUNC-00642
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00642
priority: P1
tier: B
title: 主流程-配置空态
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、可见「选择机构」与「开始分析」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('button', { name: '开始分析' })).toBeVisible();
      await expect(main.getByRole('button', { name: '打开对比篮' }).first()).toBeVisible();
  - note: 2、产业领域占位为「筛选领域（不改分析指纹）」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('产业领域', { exact: true })).toBeVisible();
      const cascader = main.locator('.arco-cascader-view').first();
      await expect(cascader).toBeVisible();
      await expect(cascader.locator('input')).toHaveAttribute('placeholder', '筛选领域（不改分析指纹）');
  - note: 3、提示先选择分析机构再点开始分析
    assert: |-
      await expect(page.locator('main')).toContainText('尚未选择分析机构');
on_fail: 截图 + 抄 X-Trace-Id
