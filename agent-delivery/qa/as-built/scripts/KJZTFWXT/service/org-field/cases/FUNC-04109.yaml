id: FUNC-04109
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04109
priority: P1
tier: B
title: 备选-弹窗清空
entry_id: svc-org-field
preconditions:
  - 弹窗内已勾选至少 1 家（runner 会话前置：已登录且内部评审模式关闭）
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：弹窗内已勾选至少 1 家
    assert: |-
      const panel = () => page.locator('[data-system-surface-id="compare-basket"]');
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 15000 });
      const openBtn = page
        .locator('[data-testid="svc-org-open-compare-basket"], [data-testid="svc-org-empty-open-basket"]')
        .first();
      await expect(openBtn).toBeVisible({ timeout: 10000 });
      await openBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1000);
      await expect(panel()).toBeVisible({ timeout: 15000 });
      const scope = panel();
      if (await scope.getByText('对比篮暂无服务机构').isVisible().catch(() => false)) {
        await scope.getByRole('button', { name: '新增' }).first().click({ timeout: 8000 });
        const addModal = page.locator('[data-testid="compare-basket-add-modal"]');
        await expect(addModal).toBeVisible({ timeout: 12000 });
        const joinBtn = addModal.getByRole('button', { name: '加入对比篮' }).first();
        await expect(joinBtn).toBeVisible({ timeout: 15000 });
        await joinBtn.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await page.keyboard.press('Escape');
        await page.waitForTimeout(500);
      }
      await expect(scope.locator('[data-testid="service-org-compare-basket-workspace"]')).toBeVisible({
        timeout: 12000,
      });
      const bar = scope.locator('[data-testid="compare-basket-action-bar"]');
      await expect(bar).toBeVisible({ timeout: 10000 });
      const parseSel = async () => {
        const txt = ((await bar.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = txt.match(/已选\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : -1;
      };
      let countBefore = await parseSel();
      if (countBefore < 1) {
        const cb = scope
          .locator('[data-testid="service-org-compare-basket-workspace"] .arco-checkbox:not(.arco-checkbox-disabled)')
          .first();
        await expect(cb).toBeVisible({ timeout: 8000 });
        await cb.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        countBefore = await parseSel();
      }
      if (countBefore < 1) throw new Error('前置：对比篮 picker 已选仍 <1');
      globalThis.__p04109 = { countBefore };
  - note: 1、弹窗「已选」变为 0 家
    assert: |-
      const snap = globalThis.__p04109;
      if (!snap || snap.countBefore < 1) throw new Error('前置：弹窗未勾选机构');
      const scope = page.locator('[data-system-surface-id="compare-basket"]');
      await expect(scope).toBeVisible({ timeout: 8000 });
      const bar = scope.locator('[data-testid="compare-basket-action-bar"]');
      const clearBtn = bar.getByRole('button', { name: '取消选择' });
      await expect(clearBtn).toBeVisible({ timeout: 5000 });
      await clearBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const confirm = page.locator('.arco-modal:visible').filter({ hasText: /确认|确定要/ });
      if (await confirm.count()) throw new Error('出现二次确认框（用例要求无确认）');
      const txt = ((await bar.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const m = txt.match(/已选\s*(\d+)\s*家/);
      const countAfter = m ? parseInt(m[1], 10) : -1;
      if (countAfter !== 0) {
        throw new Error('弹窗清空后已选应为 0 家：前=' + snap.countBefore + ' 后=' + countAfter + ' bar=' + txt);
      }
      await expect(bar).toContainText('已选');
      await expect(bar).toContainText('0');
on_fail: 截图 + 抄 X-Trace-Id
