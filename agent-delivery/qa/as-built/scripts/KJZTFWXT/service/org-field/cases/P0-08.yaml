id: P0-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00648
priority: P0
tier: B
title: 矩阵图与图型切换（结果态热力图未呈现时按 allow_skip 归票）
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 已登录 admin
  - env-gate overall=pass（fixtures/scout/env-gate.json）
  - 无头实勘 pass（fixtures/scout/scout-p008.json）：分析记录→查看结果可达结果态；4 条历史任务热力图均诚实空（无 canvas/echarts）；图型 switch 热力图/矩阵图往返 checked 状态真实互斥切换
allow_skip: true
allow_skip_target: '.svc-org-coverage canvas'
skip_reason: 本条 FUNC 前置 1=已进入结果态（热力图已呈现）；当前 dev 环境热力图 canvas 诚实空（NOTE-SVC-ORG-FIELD-HEATMAP-HONEST-EMPTY，与 P0-07 同因同源），canvas 5s 不可见即 n/a 归票不 Fail；非空环境 canvas 可见则不触发 skip，往返断言全量机跑
ticket: ENV-SVC-ORG-FIELD-HEATMAP-EMPTY
locators:
  records_tab: tab「分析记录」
  view_result: button「查看结果」
  board: .svc-org-coverage（data-testid=svc-org-coverage-board）
  chart_switch: '[data-testid="svc-org-coverage-chart-switch"]'
  heatmap_label: switch 内 label「热力图」（radio value=heatmap）
  matrix_label: switch 内 label「矩阵图」（radio value=matrix）
  honest_empty: 当前结果快照没有覆盖矩阵
  context_note: 演示口径 · 规则生成，数值与上图同源（核心结论区）
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  # 结果态进入（分析记录→查看结果）与图型往返操作自含在 expect[].assert 内，与 P0-05~07 同风格；runner 以 assert 为判定真源。
expect:
  - note: 分析记录存在已完成任务，点「查看结果」进入结果态且热力图板可见（进入失败即归票 skip，不 Fail）
    assert: |-
      await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const recTab = page.getByRole('tab', { name: '分析记录', exact: true }).first(); await recTab.click({ timeout: 8000 }); await page.waitForTimeout(1200); const recTxt = (await page.locator('main').first().innerText().catch(() => '')) || ''; if (!/SVC-\d+-\d+/.test(recTxt)) throw new Error('skip-no-record: 分析记录无历史任务'); const viewBtns = page.getByRole('button', { name: '查看结果' }); const viewN = await viewBtns.count(); if (!viewN) throw new Error('skip-no-view: 无可用查看结果按钮'); let inResult = false, lastErr = null; for (let i = 0; i < Math.min(viewN, 4) && !inResult; i++) { try { const b = viewBtns.nth(i); if (await b.isDisabled()) continue; await b.click({ timeout: 8000 }); await page.waitForTimeout(2500); const board = page.locator('.svc-org-coverage, [data-testid="svc-org-coverage-board"]').first(); if ((await board.count()) && (await board.isVisible().catch(() => false))) { inResult = true; break } } catch (e) { lastErr = e } }; if (!inResult) throw new Error('skip-result-unreachable: 查看结果后未见热力图板 ' + (lastErr ? String(lastErr.message).split('\n')[0] : '')); globalThis.__p08_task = (page.url().match(/task_id=(SVC-[\d-]+)/) || [])[1] || ''
  - note: 切矩阵图后 radio 互斥置矩阵图且同源呈现（canvas 分支断矩阵渲染与 Y 轴口径；诚实空分支断同一结果快照诚实空，轴口径记开放项）
    assert: |-
      const board = page.locator('.svc-org-coverage, [data-testid="svc-org-coverage-board"]').first(); if (!(await board.count())) throw new Error('结果态覆盖板不存在'); const sw = page.locator('[data-testid="svc-org-coverage-chart-switch"]').first(); await expect(sw).toBeVisible({ timeout: 8000 }); const matLabel = sw.locator('label:has-text("矩阵图")').first(); await matLabel.click({ timeout: 8000 }); await page.waitForTimeout(1200); const matInput = sw.locator('label:has-text("矩阵图") input').first(); const heatInput = sw.locator('label:has-text("热力图") input').first(); if (!(await matInput.isChecked())) throw new Error('切矩阵图后 radio 未置矩阵图'); if (await heatInput.isChecked()) throw new Error('矩阵图态热力图 radio 仍选中（单选互斥破坏）'); const hasCanvas = (await board.locator('canvas:visible').count()) > 0; if (hasCanvas) { globalThis.__p08_matrix_canvas = true; const bt = ((await board.innerText().catch(() => '')) || ''); if (!/平均深度得分/.test(bt)) console.log('observed-matrix-axis: 矩阵图已渲染但 Y 轴口径（平均深度得分）未入 DOM 文本（echarts 内嵌渲染）；X=覆盖领域数 与说明 note 同文案不足为凭，执行时人工核对记 observed'); } else { const main = ((await page.locator('main').first().innerText().catch(() => '')) || ''); if (!/当前结果快照没有覆盖矩阵/.test(main)) throw new Error('矩阵图态既无图表 canvas 也无诚实空提示: ' + main.slice(0, 200)); console.log('observed-matrix-honest: 矩阵图态与热力图态同源诚实空（同一结果快照无覆盖矩阵），轴口径与气泡点按归开放项 1 执行时记录') }
  - note: 切回热力图后 radio 回归且上下文保持（任务 task_id、领域筛选与核心结论区往返不变；canvas 回归仅在前置非空分支硬判）
    assert: |-
      const sw = page.locator('[data-testid="svc-org-coverage-chart-switch"]').first(); const heatLabel = sw.locator('label:has-text("热力图")').first(); await heatLabel.click({ timeout: 8000 }); await page.waitForTimeout(1200); const matInput = sw.locator('label:has-text("矩阵图") input').first(); const heatInput = sw.locator('label:has-text("热力图") input').first(); if (!(await heatInput.isChecked())) throw new Error('切回后 radio 未置热力图'); if (await matInput.isChecked()) throw new Error('切回后矩阵图 radio 仍选中（单选互斥破坏）'); const board = page.locator('.svc-org-coverage, [data-testid="svc-org-coverage-board"]').first(); const main = ((await page.locator('main').first().innerText().catch(() => '')) || ''); const hasCanvas = (await board.locator('canvas:visible').count()) > 0; if (globalThis.__p08_matrix_canvas && !hasCanvas) throw new Error('切回热力图后图表 canvas 未回归'); if (!globalThis.__p08_matrix_canvas && !hasCanvas && !/当前结果快照没有覆盖矩阵/.test(main)) throw new Error('切回后既无诚实空提示也无 canvas: ' + main.slice(0, 200)); if (!(/核心结论/.test(main) && /服务广度 TOP3/.test(main))) throw new Error('往返后核心结论区缺失（上下文未保持）'); if (!/产业领域/.test(main)) throw new Error('往返后领域筛选上下文缺失'); const taskNow = (page.url().match(/task_id=(SVC-[\d-]+)/) || [])[1] || ''; if (globalThis.__p08_task && taskNow !== globalThis.__p08_task) throw new Error('往返后任务上下文变化: ' + taskNow)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: |-
  D1 NOTE-SVC-ORG-FIELD-CHART-SWITCH（承 P0-07 同一环境债）：无头实勘（scout-p008.json）结果态可达后图型 switch（data-testid=svc-org-coverage-chart-switch，Arco radio-button，热力图 value=heatmap / 矩阵图 value=matrix）在热力图 canvas 诚实空下仍可点且 checked 状态往返真实互斥切换（heatmap checked→matrix checked→heatmap checked）；矩阵图态无独立容器/轴文本渲染（与热力图同源诚实空：「当前结果快照没有覆盖矩阵」恒在；board 文本「覆盖领域数」来自说明 note「广度=覆盖领域数」非轴标签，不作轴断言凭据）。
  D4 归票：FUNC 前置 1=已进入结果态（热力图已呈现）；当前 dev 环境热力图 canvas 不渲染（ENV-SVC-ORG-FIELD-HEATMAP-EMPTY，与 P0-07 同 ticket 同因），allow_skip_target=.svc-org-coverage canvas 5s 不可见即 n/a 归票不 Fail；未来非空环境 canvas 可见则不触发 skip，三条断言全量机跑（互斥=radio 单选+呈现切换；轴口径以「平均深度得分」DOM 文本为可靠信号，轴文本 echarts 内嵌时人工核对记 observed）。
  已选机构与领域上下文保持（FUNC 预期 3）：结果态无已选机构 tag 回显区（诚实空下核心结论为「暂无可排名机构」），往返保持以任务上下文（URL task_id 不变）+ 领域筛选（「产业领域」）+ 核心结论区结构保留为现场代理；机构级保持归非空环境执行时 observed。四象限文本标注、气泡点按、刷新后图型保留归开放项 1（observed-执行时记录，本条不硬造）。
