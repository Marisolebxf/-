id: FUNC-04103
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04103
priority: P0
tier: B
title: 主流程-重新分析
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页出现「分析结果已生成」
    assert: |-
      const main = page.locator('main').first();
      const TID_RE = /SVC-\d{8}-\d+/;
      const parseTaskId = (url, text) => {
        const q = url.match(/[?&]task_id=([^&]+)/);
        if (q) return decodeURIComponent(q[1]);
        const m = (text || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const openResultFromRecords = async () => {
        const recTab = page.getByRole('tab', { name: '分析记录', exact: true }).first();
        await expect(recTab).toBeVisible({ timeout: 15000 });
        await recTab.click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 15000 }).catch(() => {});
        await page.waitForTimeout(1200);
        const row = page.locator('tr, [role="row"]').filter({ hasText: /已完成/ }).filter({ hasText: TID_RE }).first();
        await expect(row).toBeVisible({ timeout: 10000 });
        await row.getByRole('button', { name: /查看结果/ }).first().click({ timeout: 10000 });
        for (let i = 0; i < 20; i++) {
          await page.waitForTimeout(i < 2 ? 800 : 1200);
          const t = ((await main.innerText().catch(() => '')) || '');
          if (/核心结论/.test(t)) return;
        }
        throw new Error('修订 blocked：分析记录查看结果未进结果页');
      };
      const openProcessFromRecords = async (preferAfterId) => {
        const recTab = page.getByRole('tab', { name: '分析记录', exact: true }).first();
        await recTab.click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
        await page.waitForTimeout(1000);
        let rows = page.locator('tr, [role="row"]').filter({ hasText: TID_RE });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const txt = ((await row.innerText().catch(() => '')) || '');
          const id = (txt.match(TID_RE) || [])[0] || '';
          if (preferAfterId && id === preferAfterId) continue;
          if (/已完成|进行中/.test(txt)) {
            const procBtn = row.getByRole('button', { name: /查看过程/ }).first();
            if (await procBtn.count()) {
              await procBtn.click({ timeout: 8000 });
              await page.waitForTimeout(1500);
              return id;
            }
          }
        }
        const top = rows.first();
        await top.getByRole('button', { name: /查看过程/ }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        return parseTaskId(page.url(), await main.innerText().catch(() => ''));
      };
      if (!/核心结论/.test((await main.innerText().catch(() => '')) || '')) {
        await openResultFromRecords();
      }
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 12000 });
      const priorTaskId = parseTaskId(page.url(), await main.innerText().catch(() => ''));
      if (!priorTaskId) throw new Error('修订 blocked：结果页未解析 task_id');
      globalThis.__func04103 = { priorTaskId };
      const rerun = main.getByRole('button', { name: '重新分析', exact: true }).first();
      await expect(rerun).toBeEnabled({ timeout: 8000 });
      await rerun.click({ timeout: 10000 });
      await page.waitForTimeout(2000);
      let body = ((await main.innerText().catch(() => '')) || '').trim();
      if (!/分析结果已生成/.test(body)) {
        const newIdHint = parseTaskId(page.url(), body);
        await openProcessFromRecords(priorTaskId);
        body = ((await main.innerText().catch(() => '')) || '').trim();
        globalThis.__func04103.processTaskId = parseTaskId(page.url(), body) || newIdHint;
      }
      for (let i = 0; i < 40; i++) {
        if (/分析结果已生成/.test(body)) break;
        await page.waitForTimeout(1200);
        body = ((await main.innerText().catch(() => '')) || '').trim();
        if (/本次分析生成失败|分析失败/.test(body)) {
          throw new Error('修订 blocked：重新分析过程失败');
        }
      }
      if (!/分析结果已生成/.test(body)) {
        throw new Error('过程页未见分析结果已生成: ' + body.slice(0, 240));
      }
      await expect(main.getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
      globalThis.__func04103.processReady = true;
  - note: 2、新结果与上一次不是同一次
    assert: |-
      if (!globalThis.__func04103?.processReady) throw new Error('前置：过程页未完成');
      const priorTaskId = globalThis.__func04103.priorTaskId;
      const TID_RE = /SVC-\d{8}-\d+/;
      const parseTaskId = (url, text) => {
        const q = url.match(/[?&]task_id=([^&]+)/);
        if (q) return decodeURIComponent(q[1]);
        const m = (text || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const main = page.locator('main').first();
      const viewBtn = main.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(viewBtn).toBeVisible({ timeout: 10000 });
      await viewBtn.click({ timeout: 10000 });
      await page.waitForTimeout(2000);
      let newTaskId = '';
      for (let i = 0; i < 25; i++) {
        await page.waitForTimeout(i < 2 ? 800 : 1200);
        const body = ((await main.innerText().catch(() => '')) || '');
        newTaskId = parseTaskId(page.url(), body);
        if (/核心结论/.test(body) && newTaskId && newTaskId !== priorTaskId) break;
      }
      if (!newTaskId || newTaskId === priorTaskId) {
        throw new Error('新结果 task_id 与上一次相同或未解析: prior=' + priorTaskId + ' new=' + newTaskId);
      }
      globalThis.__func04103.newTaskId = newTaskId;
  - note: 3、新结果页出现「核心结论」
    assert: |-
      if (!globalThis.__func04103?.newTaskId) throw new Error('前置：未确认新 task_id');
      const main = page.locator('main').first();
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
