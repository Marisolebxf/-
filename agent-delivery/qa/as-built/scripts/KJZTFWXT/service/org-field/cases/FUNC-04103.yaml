id: FUNC-04103
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04103
priority: P0
tier: B
title: 主流程-重新分析生成新结果
story: US-SVC-ORG-02
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已打开一次带已选机构的成功结果（脚本内：分析记录→已完成行「查看结果」）
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
  rerun: button「重新分析」
  core_conclusion: SectionPanel「核心结论」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：打开该次成功结果并点击「重新分析」（无确认框；可 toast「任务已创建，正在展示分析过程」）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl ? baseUrl : 'http://10.50.69.111:30892').replace(/\/$/, '');
      const spaUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const TID_RE = /SVC-\d{8}-\d+/;
      const parseTaskId = (url, mainText) => {
        const q = url.match(/[?&]task_id=([^&]+)/);
        if (q) return decodeURIComponent(q[1]);
        const m = (mainText || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const onTarget = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      const ensureOnFieldCoverage = async () => {
        await dismissBasket();
        if (onTarget() && !(await bodyIs404())) return;
        if (await bodyIs404()) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!onTarget() || (await bodyIs404())) {
          const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
          let ok = false;
          for (const s of siblings) {
            if (await enterViaSidebar(s)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均 SPA404，无法打开结果页 url=' + page.url());
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析入口不可用 ' + page.url());
        }
      };
      const openExistingResult = async () => {
        if (/view=result/.test(page.url())) {
          const main0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          if (/核心结论|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(main0)) return;
        }
        const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })).first();
        await expect(recTab).toBeVisible({ timeout: 12000 });
        await recTab.click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
        await page.waitForTimeout(1200);
        const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
        if (!TID_RE.test(mainRec)) {
          throw new Error('ENV-SVC-ORG-FIELD-NO-RECORDS：分析记录无历史任务，无法满足「已打开一次成功结果」');
        }
        if (!/已完成/.test(mainRec)) {
          throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：分析记录无已完成行');
        }
        const rows = page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ }).filter({ hasText: TID_RE });
        const rowN = await rows.count();
        if (!rowN) throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：未定位到已完成任务行');
        let opened = false;
        for (let i = 0; i < Math.min(rowN, 8) && !opened; i++) {
          const row = rows.nth(i);
          const resBtn = row.getByRole('button', { name: /查看结果/ }).first();
          if (!(await resBtn.count())) continue;
          if (await resBtn.isDisabled().catch(() => false)) continue;
          await resBtn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          for (let j = 0; j < 15; j++) {
            const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
            if (/view=result/.test(page.url()) || /核心结论|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(body)) {
              opened = true;
              break;
            }
            await page.waitForTimeout(1000);
          }
          if (!opened) {
            await recTab.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1000);
          }
        }
        if (!opened) {
          throw new Error('ENV-SVC-ORG-FIELD-VIEW-RESULT-UNREACHABLE：已完成行点「查看结果」未进入结果页 url=' + page.url());
        }
      };
      await ensureOnFieldCoverage();
      await openExistingResult();
      const main = page.locator('main').first();
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 10000 });
      const mainBefore = ((await main.innerText().catch(() => '')) || '');
      const hasSelectedOrgs =
        /已选机构（[1-9]/.test(mainBefore) ||
        (/服务广度 TOP3/.test(mainBefore) && /有限公司|机构/.test(mainBefore));
      if (!hasSelectedOrgs) {
        throw new Error('前置失败：结果页未见已选机构或服务对象回显');
      }
      const priorTaskId = parseTaskId(page.url(), mainBefore);
      if (!priorTaskId) {
        throw new Error('前置失败：未能从 URL/主区解析上一次 task_id');
      }
      const rerun = main.getByRole('button', { name: '重新分析', exact: true }).first();
      await expect(rerun).toBeVisible({ timeout: 8000 });
      await expect(rerun).toBeEnabled({ timeout: 8000 });
      await rerun.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const toastOk = await page
        .getByText(/任务已创建，正在展示分析过程/)
        .first()
        .isVisible({ timeout: 4000 })
        .catch(() => false);
      let enteredProcess = false;
      for (let i = 0; i < 45; i++) {
        await page.waitForTimeout(i < 3 ? 600 : 1500);
        const body = ((await main.innerText().catch(() => '')) || '').trim();
        const url = page.url();
        const newId = parseTaskId(url, body);
        if (/view=processing/.test(url) || /生成中|分析过程|任务已创建/.test(body)) {
          enteredProcess = true;
          if (/分析结果已生成/.test(body)) break;
        }
        if (newId && priorTaskId && newId !== priorTaskId && (/view=processing|view=result/.test(url) || /分析结果已生成/.test(body))) {
          enteredProcess = true;
          if (/分析结果已生成/.test(body)) break;
        }
        if (/请先在对比篮中选择分析机构/.test(body)) {
          throw new Error('前置失败：结果态未挂载分析机构，需经分析记录打开 view=result');
        }
        if (/本次分析生成失败|分析失败|create 失败|Network Error/.test(body)) {
          throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：重新分析未成功');
        }
      }
      if (!enteredProcess) {
        const snap = ((await main.innerText().catch(() => '')) || '').slice(0, 240);
        throw new Error('点击「重新分析」后未进入新任务过程页: ' + snap);
      }
      globalThis.__func04103 = { priorTaskId, toastOk, rerunClicked: true };
  - note: 1、过程页出现「分析结果已生成」
    assert: |-
      if (!globalThis.__func04103?.rerunClicked) throw new Error('前置：未点击重新分析');
      const main = page.locator('main').first();
      let body = '';
      for (let i = 0; i < 40; i++) {
        await page.waitForTimeout(i === 0 ? 500 : 1500);
        body = ((await main.innerText().catch(() => '')) || '').trim();
        if (/分析结果已生成/.test(body)) break;
        if (/本次分析生成失败|分析失败|create 失败/.test(body)) {
          throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：重新分析过程失败');
        }
      }
      if (!/分析结果已生成/.test(body)) {
        throw new Error('过程页未见「分析结果已生成」: ' + body.slice(0, 280));
      }
      await expect(main.getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
      globalThis.__func04103.processOk = true;
  - note: 2、新结果与上一次不是同一次；3、新结果页出现「核心结论」（过程页点击「查看结果」）
    assert: |-
      if (!globalThis.__func04103?.processOk) throw new Error('前置：过程页未完成');
      const priorTaskId = globalThis.__func04103.priorTaskId;
      const TID_RE = /SVC-\d{8}-\d+/;
      const parseTaskId = (url, mainText) => {
        const q = url.match(/[?&]task_id=([^&]+)/);
        if (q) return decodeURIComponent(q[1]);
        const m = (mainText || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const main = page.locator('main').first();
      const viewBtn = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(viewBtn).toBeVisible({ timeout: 8000 });
      if (!/view=result/.test(page.url())) {
        await viewBtn.click({ timeout: 8000 });
        await page.waitForTimeout(2500);
      }
      let newTaskId = '';
      for (let i = 0; i < 20; i++) {
        await page.waitForTimeout(i === 0 ? 800 : 1200);
        const body = ((await main.innerText().catch(() => '')) || '');
        newTaskId = parseTaskId(page.url(), body);
        if (/view=result/.test(page.url()) && /核心结论/.test(body) && newTaskId) break;
      }
      if (!newTaskId) {
        throw new Error('新结果页未能解析 task_id url=' + page.url());
      }
      if (newTaskId === priorTaskId) {
        throw new Error('新结果 task_id 与上一次相同（' + priorTaskId + '），未生成新的一次');
      }
      await expect(main.getByText('核心结论').first()).toBeVisible({ timeout: 10000 });
      globalThis.__func04103.newTaskId = newTaskId;
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04103=结果态 actions 槽「重新分析」→ startAnalysis(true) 新建任务并进过程壳（无确认框；Message「任务已创建，正在展示分析过程」）。
  过程页须显式点「查看结果」进新结果；task_id 取自 URL query 或主区 SVC-* 文案比对前后两次。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；edu 深链 SPA404 时 sibling 侧栏补进（对齐 FUNC-04101）。
