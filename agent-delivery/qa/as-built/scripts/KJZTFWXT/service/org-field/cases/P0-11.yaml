preconditions:
  - 已登录 admin
  - env-gate overall=pass（fixtures/scout/env-gate.json）
  - 前置「已在 field 工作区选定机构」：本条自含选 1 家后切「分析记录」再验直达/刷新（非默认 tab=records，避免「回落 coverage 默认」假绿）
  - 无头实勘 pass（fixtures/scout/scout-p011.json）：冷加载恢复 workspace=field&tab=records&org_ids[]；reload 同参保留；回 coverage 已选机构（1 家）
locators:
  org_picker: button「选择机构」
  modal: .arco-modal「选择服务机构」
  modal_confirm: .arco-modal-footer button「确定」
  selected_label: 已选机构（N 家）
  selected_tag: '[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'
  tab_coverage: '[role=tab][data-tab-key="coverage"]'
  tab_records: '[role=tab][data-tab-key="records"]'
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  # ①构造已选+非默认 Tab → ②冷加载直达恢复 → ③刷新保留；操作自含 expect[].assert（runner 真源）
expect:
  - note: 前置构造——field/coverage 选定 1 家机构后切「分析记录」，URL 含 workspace=field&tab=records&org_ids[]（非默认上下文，供直达/刷新验「不回落默认值」）
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); if (/org_ids|view=/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) }; const close = page.locator('[aria-label="关闭对比篮"]'); if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const main0 = ((await page.locator('main').first().innerText().catch(() => '')) || ''); if (/已选机构（[1-9]/.test(main0)) { const clr = page.locator('main').getByRole('button', { name: '清空' }); if (await clr.count()) { await clr.first().click({ timeout: 5000 }); await page.waitForTimeout(500) } }; const pick = page.getByRole('button', { name: '选择机构' }).first(); await pick.click({ timeout: 8000 }); await page.waitForTimeout(800); const dialog = page.locator('.arco-modal:visible, .arco-modal').filter({ hasText: '选择服务机构' }).first(); await expect(dialog).toBeVisible({ timeout: 8000 }); const boxes = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)'); for (let i = 0; i < 20 && !(await boxes.count()); i++) { const body = dialog.locator('.arco-modal-body, .arco-table-body, .arco-list').first(); if (await body.count()) { try { await body.evaluate((el) => { el.scrollTop = (el.scrollTop || 0) + 240 }) } catch {} } await page.waitForTimeout(400) }; if (!(await boxes.count())) { await page.keyboard.press('Escape').catch(() => {}); await page.waitForTimeout(400); await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage&org_ids[]=79bbcfc0e68027808f1f4caf1b6f0469', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); globalThis.__p011_select = 'deeplink_fallback' } else { try { await boxes.first().scrollIntoViewIfNeeded() } catch {}; await boxes.first().click({ timeout: 8000 }); await page.waitForTimeout(300); await dialog.getByRole('button', { name: '确定', exact: true }).last().click({ timeout: 8000 }); await page.waitForTimeout(1200); globalThis.__p011_select = 'modal_pick' }; await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 }); if (!/org_ids/.test(page.url())) throw new Error('选机构后 URL 未带 org_ids: ' + page.url()); const recTab = page.locator('[role=tab][data-tab-key="records"]').first(); await expect(recTab).toBeVisible({ timeout: 8000 }); await recTab.click({ timeout: 8000 }); await page.waitForTimeout(1500); await page.waitForURL(/tab=records/, { timeout: 8000 }); await expect(page).toHaveURL(/workspace=field/); await expect(page).toHaveURL(/org_ids/); const recSel = await recTab.getAttribute('aria-selected'); const recCls = await recTab.getAttribute('class'); if (recSel !== 'true' && !(recCls || '').includes('active')) throw new Error('切 Tab 后分析记录未选中'); globalThis.__p011_url = page.url(); const u = new URL(globalThis.__p011_url); globalThis.__p011_orgs = u.searchParams.getAll('org_ids[]').length ? u.searchParams.getAll('org_ids[]') : u.searchParams.getAll('org_ids'); if (!globalThis.__p011_orgs.length) throw new Error('捕获 URL 无 org_ids')
  - note: 预期①——复制当前完整 URL 冷加载直达（as-built=同 page 完整导航，SPA 重新 bootstrap 语义等价新标签；chain-graph P0-24 同款）：按 workspace 与 tab 参数恢复上下文、不回落默认值（须 tab=records 非 coverage 默认 + org_ids 保留 + 分析记录 Tab 选中）
    assert: |-
      const captured = String(globalThis.__p011_url || ''); if (!captured) throw new Error('前置缺失：未捕获 URL'); const wantOrgs = globalThis.__p011_orgs || []; await page.goto(captured, { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2500); const close = page.locator('[aria-label="关闭对比篮"]'); if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page).toHaveURL(/\/service\/institution-judgment/); await expect(page).toHaveURL(/workspace=field/); await expect(page).toHaveURL(/tab=records/); if (/tab=coverage/.test(page.url()) && !/tab=records/.test(page.url())) throw new Error('直达回落默认 tab=coverage: ' + page.url()); const got = (() => { const u = new URL(page.url()); const a = u.searchParams.getAll('org_ids[]'); return a.length ? a : u.searchParams.getAll('org_ids') })(); if (!got.length) throw new Error('直达后 URL 丢失 org_ids（回落未选默认）: ' + page.url()); if (wantOrgs.length && JSON.stringify(got) !== JSON.stringify(wantOrgs)) throw new Error('直达 org_ids 漂移: ' + JSON.stringify(got) + ' ≠ ' + JSON.stringify(wantOrgs)); const recTab = page.locator('[role=tab][data-tab-key="records"]').first(); await expect(recTab).toBeVisible({ timeout: 8000 }); const recSel = await recTab.getAttribute('aria-selected'); const recCls = await recTab.getAttribute('class'); if (recSel !== 'true' && !(recCls || '').includes('active')) throw new Error('直达后分析记录 Tab 未选中（上下文未恢复）')
  - note: 预期②——刷新后已选机构集合与激活 Tab 保留（URL workspace/tab/org_ids 不漂移 + 分析记录 Tab 仍选中；已选 UI 回显切回 coverage 验「已选机构（1 家）」——records 态不渲染 tag，主通道=URL org_ids）
    assert: |-
      const before = page.url(); const wantOrgs = globalThis.__p011_orgs || []; await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2500); const close = page.locator('[aria-label="关闭对比篮"]'); if ((await close.count()) && (await close.first().isVisible().catch(() => false))) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page).toHaveURL(/workspace=field/); await expect(page).toHaveURL(/tab=records/); const got = (() => { const u = new URL(page.url()); const a = u.searchParams.getAll('org_ids[]'); return a.length ? a : u.searchParams.getAll('org_ids') })(); if (!got.length) throw new Error('刷新后丢失 org_ids: ' + page.url()); if (wantOrgs.length && JSON.stringify(got) !== JSON.stringify(wantOrgs)) throw new Error('刷新后 org_ids 漂移: ' + JSON.stringify(got)); const recTab = page.locator('[role=tab][data-tab-key="records"]').first(); const recSel = await recTab.getAttribute('aria-selected'); const recCls = await recTab.getAttribute('class'); if (recSel !== 'true' && !(recCls || '').includes('active')) throw new Error('刷新后分析记录 Tab 未保留'); const idsQ = got.map((id) => 'org_ids[]=' + encodeURIComponent(id)).join('&'); await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=field&tab=coverage&' + idsQ, { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const close2 = page.locator('[aria-label="关闭对比篮"]'); if ((await close2.count()) && (await close2.first().isVisible().catch(() => false))) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 }); const tags = page.locator('[data-testid="svc-org-analysis-context"] .arco-tag.svc-org-pick-tag'); if ((await tags.count()) < 1) throw new Error('回 coverage 已选 tag 未恢复（集合丢失）'); globalThis.__p011_evidence = JSON.stringify({ beforeReload: before, afterReload: page.url().replace(/tab=coverage.*/, 'tab=records'), orgs: got, selectPath: globalThis.__p011_select || '' })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；直达回落 tab=coverage / 丢 org_ids = 参数恢复缺陷；刷新丢 Tab 或已选 = 持久化缺陷
