id: FUNC-04090
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04090
priority: P1
tier: B
title: 主流程-过程页分析对象与已选机构一致
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页「分析对象」为这 1 家机构
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByRole('button', { name: '开始分析', exact: true })).toBeVisible({ timeout: 15000 });
      await main.getByRole('button', { name: /^打开对比篮/ }).first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(page.getByText('选择分析服务机构').first()).toBeVisible({ timeout: 12000 });
      const pickToggle = page.locator('[aria-label^="选择 "]').first();
      if (await pickToggle.count()) {
        await pickToggle.click({ timeout: 8000 });
      } else {
        await page.locator('.arco-checkbox:not(.arco-checkbox-disabled)').first().click({ timeout: 8000 });
      }
      await expect(page.getByText(/已选\s*1\s*家机构/).first()).toBeVisible({ timeout: 8000 });
      await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(main.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 10000 });
      const orgLabel = ((await main.locator('.svc-org-pick-tag').first().innerText()) || '').trim();
      if (!orgLabel) throw new Error('未能读取已选机构名');
      const start = page.getByTestId('svc-org-start-analysis');
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      let sawObject = false;
      let text = '';
      for (let i = 0; i < 35; i++) {
        await page.waitForTimeout(i === 0 ? 800 : 2000);
        text = ((await main.innerText().catch(() => '')) || '').trim();
        if (/分析对象/.test(text) && text.includes(orgLabel)) {
          sawObject = true;
          break;
        }
        if (/本次分析生成失败|分析失败/.test(text)) {
          throw new Error('分析未成功进入过程页');
        }
      }
      if (!sawObject) {
        throw new Error('超时未见过程页「分析对象」含所选机构: ' + text.slice(0, 400));
      }
      await expect(main.getByText('分析对象').first()).toBeVisible({ timeout: 5000 });
      await expect(main.getByText(orgLabel).first()).toBeVisible({ timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id
