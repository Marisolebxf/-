id: FUNC-04090
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04090
priority: P0
tier: A
title: 主流程-过程页对象
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已进入分析配置
locators:
  org_picker: button「选择机构」
  modal_title: 选择服务机构
  confirm: button「确定」
  start: button「开始分析」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、过程页「分析对象」为这 1 家机构（选定 1 家并点击「开始分析」后）
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const enterViaSidebar = async () => {
        await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: sibling /industry-center/search 仍 SPA404 url=' + page.url());
        }
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
      };
      const ensureOnConfig = async () => {
        await dismissBasket();
        if (await bodyIs404()) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (await bodyIs404()) {
          await enterViaSidebar();
          await page.waitForTimeout(1200);
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 补进后仍为 SPA404 url=' + page.url());
        }
        await expect(page).toHaveURL(/\/service\/institution-judgment/, { timeout: 15000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 15000 });
      };
      const resetConfig = async () => {
        if (/org_ids|view=/.test(page.url())) {
          await page.goto(spaUrl('/service/institution-judgment?workspace=field&tab=coverage'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      const pickOrgLabel = async () => {
        const main = page.locator('main').first();
        const ctx = main.locator('[data-testid=svc-org-analysis-context]');
        const tags = ctx.locator('.arco-tag.svc-org-pick-tag, .svc-org-pick-tag');
        if ((await tags.count()) >= 1) {
          const label = (await tags.first().innerText()).trim();
          if (label && !/未选择/.test(label)) return label;
        }
        const chip = main.locator('.arco-tag').filter({ hasNotText: /已选机构|清空|筛选领域|产业领域|选择机构/ });
        if ((await chip.count()) >= 1) {
          const label = (await chip.first().innerText()).trim();
          if (label) return label;
        }
        throw new Error('未能读取已选机构芯片文案');
      };
      await ensureOnConfig();
      await resetConfig();
      await page.getByRole('button', { name: '选择机构', exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const dialog = page.locator('.arco-modal:visible, .arco-modal').filter({ hasText: '选择服务机构' }).first();
      await expect(dialog).toBeVisible({ timeout: 8000 });
      const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
      if (!(await checks.count())) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：弹窗无可勾选机构');
      await checks.first().click({ timeout: 5000 });
      await page.waitForTimeout(300);
      await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
      const orgLabel = await pickOrgLabel();
      const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      let mainText = '';
      for (let i = 0; i < 40; i++) {
        await page.waitForTimeout(i === 0 ? 800 : 2000);
        mainText = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
        if (/分析对象/.test(mainText) && (mainText.includes(orgLabel) || new RegExp(orgLabel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(mainText))) break;
        if (/分析结果已生成|服务机构产业领域分析生成中|任务已创建，正在展示分析过程/.test(mainText) && mainText.includes(orgLabel)) break;
        if (/本次分析生成失败|分析失败|create 失败/.test(mainText)) {
          throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：分析未成功进入过程页');
        }
      }
      if (!/分析对象/.test(mainText)) {
        throw new Error('超时未见过程页「分析对象」行: ' + mainText.slice(0, 320));
      }
      if (!mainText.includes(orgLabel)) {
        throw new Error('过程页分析对象与配置区机构不一致，期望含「' + orgLabel + '」: ' + mainText.slice(0, 320));
      }
      await expect(page.getByText('分析对象').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  过程页元信息表「分析对象」列与配置区 svc-org-pick-tag 芯片一致（现场多为统一社会信用代码/机构 id）。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；edu 深链 SPA404 时 SPA 根重试 + sibling /industry-center/search 侧栏补进（对齐 FUNC-00641）。
  2026-10-21 edu.itic-sci.com/tts/svcz 无头 --only：补进后「分析配置」仍不可见 → ENV-EDU-TTS-SVCZ-404-001，待环境恢复复跑。
