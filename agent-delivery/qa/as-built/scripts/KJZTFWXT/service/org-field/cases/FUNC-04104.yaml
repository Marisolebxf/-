id: FUNC-04104
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04104
priority: P1
tier: B
title: 备选-产业领域选项 · 下拉个数
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 已进入分析配置（runner 会话前置：已登录且内部评审模式关闭）
locators:
  config_panel: data-testid=svc-org-analysis-config
  field_catalog: .industry-catalog-select
  field_filter_ph: placeholder「筛选领域（不改分析指纹）」
steps:
  - action: goto
    target: /
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、已进入分析配置
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const onTarget = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      const ensureConfigTab = async () => {
        await dismissBasket();
        if (/view=result|view=processing/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
        }
        if (!onTarget() || (await bodyIs404())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
            await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          if (!onTarget() || (await bodyIs404())) {
            const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
            let ok = false;
            for (const s of siblings) {
              if (await enterViaSidebar(s)) {
                ok = true;
                break;
              }
            }
            if (!ok) {
              throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均 SPA404，无法进入分析配置 url=' + page.url());
            }
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 服务机构产业领域分析入口不可用 ' + page.url());
        }
        const cfgTab = page.locator('[role=tab][data-tab-key="coverage"]').or(page.getByRole('tab', { name: '服务机构产业领域分析', exact: true })).first();
        if (await cfgTab.count()) {
          const sel = await cfgTab.getAttribute('aria-selected').catch(() => 'true');
          if (sel === 'false') {
            await cfgTab.click({ timeout: 8000 });
            await page.waitForTimeout(600);
          }
        }
      };
      await ensureConfigTab();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 预热/侧栏后仍 SPA404，无法进入分析配置 url=' + page.url());
      }
      const cfgHint = page.getByText('分析配置').first();
      if (!(await cfgHint.isVisible().catch(() => false))) {
        const bodyHead = ((await page.locator('body').innerText().catch(() => '')) || '').slice(0, 200);
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 未见分析配置区 body=' + bodyHead + ' url=' + page.url());
      }
      await expect(cfgHint).toBeVisible({ timeout: 12000 });
      const panel = page.locator('[data-testid="svc-org-analysis-config"]').first();
      if (await panel.count()) {
        await expect(panel).toBeVisible({ timeout: 8000 });
      }
      await expect(page.locator('.industry-catalog-select').first()).toBeVisible({ timeout: 8000 });
      if (/view=result|view=processing/.test(page.url())) {
        throw new Error('前置应在配置态 tab=coverage，非结果/过程 view: ' + page.url());
      }
  - note: 1、展开产业领域下拉后，选项共 15 个产业集群（清单见附录A）
    assert: |-
      const expected = [
        '新一代信息技术', '生物', '新能源', '新材料', '高端装备',
        '智能网联新能源汽车', '绿色环保', '低空经济与空天', '传统与创意', '海洋',
        '未来制造', '未来信息', '未来能源', '未来空间', '未来健康',
      ];
      let trigger = page.locator('.industry-catalog-select .arco-select-view').first();
      if (!(await trigger.count())) {
        trigger = page.locator('.industry-catalog-select').first();
      }
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popup = page.locator('.arco-trigger-popup:visible').filter({ has: page.locator('.arco-select-option') }).last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const opts = popup.locator('.arco-select-option');
      const n = await opts.count();
      if (n !== 15) {
        throw new Error('产业领域下拉选项数 ' + n + ' ≠ 15');
      }
      const texts = [];
      for (let i = 0; i < n; i++) {
        texts.push((await opts.nth(i).innerText()).trim());
      }
      for (const name of expected) {
        if (!texts.includes(name)) {
          throw new Error('产业领域选项缺少附录A项：' + name + '；实际=' + texts.join('、'));
        }
      }
      if (texts.length !== new Set(texts).size) {
        throw new Error('产业领域选项存在重复：' + texts.join('、'));
      }
      await page.keyboard.press('Escape');
      await page.waitForTimeout(300);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04104=配置态「产业领域」Arco Select 宿主 .industry-catalog-select，placeholder「筛选领域（不改分析指纹）」（scout-p009/scout-p006；关评审点状复勘）。
  15 项与用例附录A一致。catalog_path=/service/institution-judgment?workspace=field&tab=coverage（entry-seed）。
  edu 深链 SPA404 时 sibling 侧栏补进；steps 先 goto SPA 根再深链（对齐 FUNC-00641）。
  2026-10-21 edu.itic-sci.com/tts/svcz 机跑未见分析配置→ENV-EDU-TTS-SVCZ-404-001→ledger blocked。
