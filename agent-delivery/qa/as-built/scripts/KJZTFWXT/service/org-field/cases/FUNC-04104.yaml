title: 备选-产业领域选项
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  - action: evaluate
    note: 展开产业领域下拉
    target: |-
      await page.getByTestId('svc-org-analysis-config').locator('.arco-cascader-view').first().click();
expect:
  - note: 选项共 15 个产业集群（清单见附录A）
    assert: |-
      const popup = page.locator('.arco-cascader-popup-visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const firstCol = popup.locator('.arco-cascader-list-column').first();
      await expect(firstCol.locator('.arco-cascader-option')).toHaveCount(15);
on_fail: 截图 + 抄 X-Trace-Id
