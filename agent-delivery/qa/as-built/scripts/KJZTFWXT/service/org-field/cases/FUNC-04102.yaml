id: FUNC-04102
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04102
priority: P0
tier: A
title: 主流程-条件就绪-不自动分析
story: US-SVC-ORG-01
entry_id: svc-org-field
preconditions:
  - 已进入分析配置（runner 会话前置：已登录且内部评审模式关闭）
locators:
  pick_btn: button「选择机构」
  modal_title: 选择服务机构
  confirm_btn: button「确定」
  ready_hint: text「分析条件已就绪」
  start: button「开始分析」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、点击「选择机构」勾选 1 家确定后出现「分析条件已就绪」
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t);
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const tabsReady = async () => {
        const m = page.locator('[role=tab][data-tab-key="coverage"]');
        return (await m.count()) > 0 && (await m.first().isVisible().catch(() => false));
      };
      const clickMenuLeaf = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForTimeout(2500);
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (/sso\/user\/login|itic-sci\.com\/sso/i.test(page.url())) return false;
        if (await bodyIs404()) return false;
        await clickMenuLeaf();
        return (await tabsReady()) && !(await bodyIs404());
      };
      const ensureOnFieldCoverage = async () => {
        await dismissBasket();
        if (page.url().includes('/login') || page.url().includes('itic-sci.com/sso')) {
          throw new Error('ENV-EDU-TTS-SVCZ-SESSION-001: 会话已掉线 url=' + page.url());
        }
        if (await bodyIs404() || !(await tabsReady())) {
          await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1500);
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          await clickMenuLeaf();
        }
        if ((await bodyIs404()) || !(await tabsReady())) {
          const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
          let ok = false;
          for (const s of siblings) {
            if (await enterViaSidebar(s)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            throw new Error(
              'ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏 sibling 均不可达 field/coverage url=' +
                page.url()
            );
          }
        }
        await expect(page).toHaveURL(/\/service\/institution-judgment/, { timeout: 15000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
      };
      const resetConfig = async () => {
        if (/view=result|view=processing|[?&]task_id=/.test(page.url())) {
          await page.goto(spaUrl('/service/institution-judgment?workspace=field&tab=coverage'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        const main = page.locator('main').first();
        const t = ((await main.innerText().catch(() => '')) || '');
        if (/已选机构（[1-9]/.test(t)) {
          const clr = main.getByRole('button', { name: '清空' });
          if (await clr.count()) {
            await clr.first().click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(500);
          }
        }
      };
      globalThis.__func04102Posts = [];
      page.on('request', (r) => {
        if (r.method() === 'POST' && /\/topicAsync\/topic\/v1\/analysis\/tasks\/?(\?|$)/.test(r.url())) {
          globalThis.__func04102Posts.push(r.url().slice(0, 120));
        }
      });
      globalThis.__func04102PostBase = globalThis.__func04102Posts.length;
      await ensureOnFieldCoverage();
      await resetConfig();
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await page.getByRole('button', { name: '选择机构', exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const dialog = page.locator('.arco-modal:visible, .arco-modal').filter({ hasText: '选择服务机构' }).first();
      await expect(dialog).toBeVisible({ timeout: 8000 });
      const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
      const n = await checks.count();
      if (n < 1) throw new Error('ENV-SVC-ORG-FIELD-NO-ORGS：弹窗无可勾选机构');
      await checks.first().click({ timeout: 5000 });
      await page.waitForTimeout(300);
      await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      const main = page.locator('main').first();
      await expect(main.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('分析条件已就绪').first()).toBeVisible({ timeout: 8000 });
  - note: 2、不进入分析过程页（选定机构后不自动开始分析）
    assert: |-
      await page.waitForTimeout(800);
      const url = page.url();
      if (/view=processing|view=result|[?&]task_id=/.test(url)) {
        throw new Error('选定机构后不应自动进入过程/结果态: ' + url);
      }
      const posts = globalThis.__func04102Posts || [];
      const base = Number(globalThis.__func04102PostBase || 0);
      const during = posts.slice(base);
      if (during.length) {
        throw new Error('选定机构后不应自动 POST 创建任务×' + during.length + ': ' + JSON.stringify(during).slice(0, 200));
      }
      const main = page.locator('main').first();
      const t = ((await main.innerText().catch(() => '')) || '');
      if (/分析结果已生成|任务已创建，正在展示分析过程|分析过程|生成中|计算中/.test(t)) {
        throw new Error('不应进入分析过程页文案: ' + t.slice(0, 280));
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析', exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage（entry-seed）。
  选定 1 家机构后出现「分析条件已就绪」+ 引导「切换机构或 workspace 不会自动创建任务」同屏（scout env-gate）；不自动分析以 URL 无 view=processing/result/task_id、无过程页文案、POST /analysis/tasks 增量 0 为代理。深链 SPA404 时侧栏补进（对齐 FUNC-00643）。A 档零 allow_skip。
