id: FUNC-04102
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04102
priority: P1
tier: B
title: 选定机构后条件就绪且不自动进入过程页
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 出现「分析条件已就绪」
    assert: |-
      const main = page.locator('main').first();
      await main.getByRole('button', { name: '打开对比篮' }).first().click({ timeout: 12000 });
      const basket = page.locator('[data-system-surface-id="compare-basket"]');
      await expect(basket).toHaveAttribute('data-panel-open', 'true', { timeout: 10000 });
      const addModal = page.locator('[data-testid="compare-basket-add-modal"]');
      if (await addModal.isVisible().catch(() => false)) {
        await page.keyboard.press('Escape');
      }
      const basketWorkspace = basket.locator('[data-testid="service-org-compare-basket-workspace"]');
      if (await basket.getByText('对比篮暂无服务机构').isVisible().catch(() => false)) {
        await basket.getByRole('button', { name: '新增' }).first().click({ timeout: 8000 });
        await expect(addModal).toBeVisible({ timeout: 15000 });
        await addModal.getByRole('button', { name: '加入对比篮' }).first().click({ timeout: 15000 });
        await page.keyboard.press('Escape');
        await expect(addModal).toBeHidden({ timeout: 8000 });
      }
      const pickBox = basketWorkspace.getByRole('checkbox').first();
      await expect(pickBox).toBeVisible({ timeout: 12000 });
      if (!(await pickBox.isChecked().catch(() => false))) {
        await pickBox.click();
      }
      await expect(basket.getByText(/已选 1 家机构/)).toBeVisible({ timeout: 8000 });
      await basket.getByRole('button', { name: '确定', exact: true }).click({ timeout: 10000 });
      await expect(basket).toHaveAttribute('data-panel-open', 'false', { timeout: 10000 });
      await expect(main.getByText(/已选机构（1 家）/)).toBeVisible({ timeout: 15000 });
      await expect(main.getByText('分析条件已就绪')).toBeVisible({ timeout: 15000 });
  - note: 不进入分析过程页
    assert: |-
      await expect(page.getByText('分析结果已生成').first()).not.toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
