id: FUNC-04114
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04114
priority: P1
tier: B
title: 备选-返回配置 · 已选机构仍在
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
  - action: click
    target: 打开对比篮
  - action: wait
    timeout_ms: 1200
  - action: click
    target: 全选所有
  - action: wait
    timeout_ms: 600
  - action: click
    target: 确定
  - action: wait
    timeout_ms: 1500
  - action: click
    target: 开始分析
  - action: wait
    timeout_ms: 2000
  - action: click
    target: 查看结果
  - action: wait
    timeout_ms: 2500
  - action: click
    target: 返回配置
  - action: wait
    timeout_ms: 1200
expect:
  - note: 1、回到「分析配置」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('服务机构分析配置').first()).toBeVisible({ timeout: 15000 });
      await expect(main.getByRole('button', { name: '开始分析', exact: true }).first()).toBeVisible({ timeout: 8000 });
      expect(page.url()).toMatch(/workspace=field/);
      expect(page.url()).toMatch(/tab=coverage/);
      expect(page.url()).not.toMatch(/view=result/);
  - note: 2、已选机构仍保留
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText(/已选机构（[1-9]\d*\s*家）/).first()).toBeVisible({ timeout: 10000 });
      await expect(main.getByText('请先选择分析机构').first()).not.toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
