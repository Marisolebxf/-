id: FUNC-04114
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04114
priority: P1
tier: B
title: 备选-返回配置 · 已选机构仍在
story: US-SVC-ORG-01
entry_id: svc-org-field
ticket: D3-SVCORG-BACK-CONFIG-ORG-LOST
preconditions:
  - 系统正常（runner 会话前置：已登录且内部评审模式关闭）
  - 已停留在带已选机构的结果页（脚本内：分析记录→已完成「查看结果」，或自含 1 家首发至结果）
locators:
  back_config: button「返回配置」
  start: button「开始分析」
  pick_btn: button「选择机构」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 前置：打开带已选机构（≥1 家）的结果页并点击「返回配置」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl ? baseUrl : 'https://edu.itic-sci.com/tts/svcz').replace(/\/$/, '');
      const spaUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/service/institution-judgment?workspace=field&tab=coverage';
      const TID_RE = /SVC-\d{8}-\d+/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业领域分析/.test(t);
      };
      const onConfig = () =>
        /\/service\/institution-judgment/.test(page.url()) &&
        /workspace=field/.test(page.url()) &&
        /tab=coverage/.test(page.url()) &&
        !/[?&]view=(result|processing)/.test(page.url());
      const pickLeaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构产业领域分析$/ });
      const expandSvcMenu = async () => {
        if (await pickLeaf().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async (siblingPath) => {
        await dismissBasket();
        await page.goto(spaUrl(siblingPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (await bodyIs404()) return false;
        await expandSvcMenu();
        const leaf = pickLeaf();
        if (!(await leaf.first().isVisible().catch(() => false))) return false;
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/service\/institution-judgment/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=field/);
        await expect(page).toHaveURL(/tab=coverage/);
        return !(await bodyIs404());
      };
      const ensureConfigSurface = async () => {
        await dismissBasket();
        if (/view=result|view=processing|[?&]task_id=/.test(page.url())) {
          await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!onConfig() || (await bodyIs404())) {
          if (await bodyIs404()) {
            await page.goto(spaUrl('/'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
            await page.goto(spaUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
          }
          if (!onConfig() || (await bodyIs404())) {
            const siblings = ['/service-portal/overview/overview', '/service-portal/overview', '/industry-center/search'];
            let ok = false;
            for (const s of siblings) {
              if (await enterViaSidebar(s)) {
                ok = true;
                break;
              }
            }
            if (!ok) throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入分析配置 url=' + page.url());
          }
        }
        if (await bodyIs404()) throw new Error('ENV-EDU-TTS-SVCZ-404-001: 入口不可用 ' + page.url());
      };
      const pickFirstOrg = async () => {
        await ensureConfigSurface();
        const oneSelected = page.getByText(/已选机构（[1-9]\d*\s*家）/).first();
        if (await oneSelected.isVisible().catch(() => false)) return;
        await expect(page.getByText(/已选机构（0\s*家）|未选择机构/).first()).toBeVisible({ timeout: 8000 });
        const pick = page.getByRole('button', { name: '选择机构' }).first();
        await pick.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first();
        await expect(dialog).toBeVisible({ timeout: 8000 });
        await dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)').first().click({ timeout: 5000 });
        await page.waitForTimeout(300);
        await dialog.locator('.arco-modal-footer button:visible').filter({ hasText: /^确定$/ }).last().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await expect(page.getByText(/已选机构（1\s*家）/).first()).toBeVisible({ timeout: 8000 });
      };
      const waitResultReady = async () => {
        const main = page.locator('main').first();
        for (let i = 0; i < 45; i++) {
          await page.waitForTimeout(i < 3 ? 600 : 1500);
          const body = ((await main.innerText().catch(() => '')) || '');
          const url = page.url();
          if (/view=result/.test(url) && /核心结论|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(body)) return true;
          if (/分析结果已生成/.test(body)) {
            const vb = page.getByRole('button', { name: '查看结果', exact: true }).first();
            if (await vb.isVisible().catch(() => false)) {
              await vb.click({ timeout: 8000 });
              await page.waitForTimeout(2000);
            }
          }
          if (/本次分析生成失败|分析失败|create 失败/.test(body)) {
            throw new Error('ENV-SVC-ORG-FIELD-ANALYSIS-FAIL：分析未成功进入结果');
          }
        }
        return false;
      };
      const openExistingResult = async () => {
        if (/view=result/.test(page.url())) {
          const main0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          if (/核心结论|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(main0)) return;
        }
        const recTab = page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })).first();
        await expect(recTab).toBeVisible({ timeout: 12000 });
        await recTab.click({ timeout: 8000 });
        await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(() => {});
        await page.waitForTimeout(1200);
        const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
        if (!TID_RE.test(mainRec)) {
          throw new Error('ENV-SVC-ORG-FIELD-NO-RECORDS：分析记录无历史任务，改走自含首发构造');
        }
        if (!/已完成/.test(mainRec)) {
          throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：分析记录无已完成行，改走自含首发构造');
        }
        const rows = page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ }).filter({ hasText: TID_RE });
        const rowN = await rows.count();
        if (!rowN) throw new Error('ENV-SVC-ORG-FIELD-NO-DONE-RECORD：未定位到已完成任务行');
        let opened = false;
        for (let i = 0; i < Math.min(rowN, 8) && !opened; i++) {
          const row = rows.nth(i);
          const resBtn = row.getByRole('button', { name: /查看结果/ }).first();
          if (!(await resBtn.count())) continue;
          if (await resBtn.isDisabled().catch(() => false)) continue;
          await resBtn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          for (let j = 0; j < 15; j++) {
            const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
            if (/view=result/.test(page.url()) || /核心结论|服务广度 TOP3|当前结果快照没有覆盖矩阵/.test(body)) {
              opened = true;
              break;
            }
            await page.waitForTimeout(1000);
          }
        }
        if (!opened) throw new Error('ENV-SVC-ORG-FIELD-VIEW-RESULT-UNREACHABLE：已完成行点「查看结果」未进入结果页');
      };
      const reachResultWithOrgs = async () => {
        await ensureConfigSurface();
        try {
          await openExistingResult();
        } catch (e) {
          const msg = String(e);
          if (!/NO-RECORDS|NO-DONE-RECORD|VIEW-RESULT-UNREACHABLE/.test(msg)) throw e;
          await ensureConfigSurface();
          await pickFirstOrg();
          const start = page.getByRole('button', { name: '开始分析' }).first();
          await expect(start).toBeEnabled({ timeout: 8000 });
          await start.click({ timeout: 10000 });
          if (!(await waitResultReady())) throw new Error('自含首发未达可看结果 url=' + page.url());
        }
      };
      await reachResultWithOrgs();
      const main = page.locator('main').first();
      const mainBefore = ((await main.innerText().catch(() => '')) || '');
      if (!/已选机构（[1-9]/.test(mainBefore) && !/org_ids/.test(page.url())) {
        throw new Error('前置失败：结果页未见已选机构回显（≥1 家）');
      }
      await expect(main.getByText(/核心结论|当前结果快照没有覆盖矩阵/).first()).toBeVisible({ timeout: 10000 });
      const back = main.getByRole('button', { name: '返回配置', exact: true }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
      await back.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      const covTab = page.locator('[role=tab][data-tab-key="coverage"]').or(page.getByRole('tab', { name: '产业领域', exact: true })).first();
      if (await covTab.count() && !(await page.getByText('分析配置').first().isVisible().catch(() => false))) {
        await covTab.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(1000);
      }
      globalThis.__func04114 = { clickedBack: true, resultHadOrgs: true };
  - note: 1、回到「分析配置」；2、已选机构仍保留（AC-US-SVC-ORG-01-03）
    assert: |-
      if (!globalThis.__func04114?.clickedBack) throw new Error('前置：未点击返回配置');
      const main = page.locator('main').first();
      let body = '';
      for (let i = 0; i < 12; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/分析配置/.test(body) && /选择机构|开始分析/.test(body)) break;
        if (/已选机构（[1-9]/.test(body)) break;
      }
      const url = page.url();
      const errs = [];
      if (/view=result/.test(url)) errs.push('仍停留在 view=result: ' + url);
      if (!/分析配置/.test(body) && !/选择机构/.test(body)) {
        errs.push('未见分析配置区（无「分析配置」/「选择机构」）');
      }
      const zeroSel =
        /已选机构（0\s*家）/.test(body) ||
        (await page.getByText(/已选机构（0\s*家）/).first().isVisible().catch(() => false));
      const needPick =
        /请先选择分析机构/.test(body) ||
        (await page.getByText('请先选择分析机构').first().isVisible().catch(() => false));
      const kept = /已选机构（[1-9]\d*\s*家）/.test(body);
      if (zeroSel) errs.push('已选机构变为 0 家');
      if (needPick) errs.push('出现「请先选择分析机构」');
      if (!kept) errs.push('配置区未见已选机构（≥1 家）回显');
      const start = page.getByRole('button', { name: '开始分析' }).first();
      if (!(await start.isVisible().catch(() => false))) errs.push('配置区未见「开始分析」');
      if (errs.length) {
        throw new Error(
          'D3-SVCORG-BACK-CONFIG-ORG-LOST: ' +
            errs.join('; ') +
            '（用例备注：现场返回配置后机构集丢失；产品修复后本脚本应转绿）'
        );
      }
      await expect(page.getByText(/已选机构（[1-9]\d*\s*家）/).first()).toBeVisible({ timeout: 8000 });
      await expect(start).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  04114=结果态 actions「返回配置」→ 回 tab=coverage 分析配置且 org_ids/已选机构回显仍≥1 家（禁 0 家+「请先选择分析机构」）。
  前置优先分析记录已完成「查看结果」；无记录则自含选 1 家首发至结果（对齐 FUNC-04103/04113 入口 helper）。
  用例备注现场丢机构→预设红挂 ticket D3-SVCORG-BACK-CONFIG-ORG-LOST；绿则转 pass。
  catalog_path=/service/institution-judgment?workspace=field&tab=coverage；深链 404 时 sibling 侧栏补进（对齐 FUNC-04108）。
