id: FUNC-04122
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04122
priority: P1
tier: B
title: 异常-失败查看结果
entry_id: svc-org-field
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=field&tab=coverage
expect:
  - note: 1、页面出现失败说明
    assert: |-
      const main = page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录', exact: true }).click();
      await expect(main.getByTestId('svc-org-analysis-records')).toBeVisible({ timeout: 8000 });
      const failedRow = main.locator('tr').filter({
        has: main.getByRole('cell', { name: '失败', exact: true }),
      }).first();
      if ((await failedRow.count()) === 0) {
        throw new Error('ENV-SVC-ORG-FIELD-NO-FAILED-RECORD：分析记录无失败行（用例要求既有失败任务）');
      }
      await failedRow.getByRole('button', { name: '查看结果', exact: true }).click();
      await expect(
        main.getByText(/本次分析生成失败|分析生成失败|任务错误详情|失败说明/).first(),
      ).toBeVisible({ timeout: 8000 });
  - note: 2、不出现「分析结果已生成」
    assert: |-
      await expect(page.locator('main').first().getByText('分析结果已生成')).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
