id: FUNC-04195
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04195
priority: P0
tier: B
title: 主流程-未选机构时开始分析不创建任务
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: click
    target: |-
      await page.locator('main').getByRole('button', { name: '开始分析' }).first().click()
expect:
  - note: 提示「请先选择分析机构」
    assert: |-
      await expect(page.locator('.arco-message').filter({ hasText: '请先选择分析机构' })).toBeVisible()
  - note: 仍停留在分析配置
    assert: |-
      await expect(page.locator('main').getByText('产业领域')).toBeVisible()
      await expect(page.locator('main').getByRole('button', { name: '开始分析' }).first()).toBeVisible()
      await expect(page).not.toHaveURL(/view=processing/)
on_fail: 截图 + 抄 X-Trace-Id
