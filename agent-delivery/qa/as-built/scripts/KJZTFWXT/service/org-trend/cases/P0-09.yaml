expect:
  - note: 已进入结果态——结果壳含「服务机构新增数量趋势」且「市场热度与趋势研判」面板在趋势图下方（用例步骤 1「定位研判面板」前置承载；allow_skip 已保证有图例/年序列）
    assert: |-
      await page.waitForTimeout(800);
      const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      let url0 = page.url(); let body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!(/view=result/.test(url0) && /服务机构新增数量趋势/.test(body0))) {
        const recTab = page.locator('[role=tab][data-tab-key="records"]');
        if (await recTab.count()) { await recTab.click({ timeout: 8000 }); await page.waitForTimeout(1200) }
        const vr = page.getByRole('button', { name: '查看结果' }).first();
        await expect(vr).toBeVisible({ timeout: 12000 }); await vr.click({ timeout: 8000 }); await page.waitForTimeout(2500);
        url0 = page.url(); body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      }
      if (!(/view=result/.test(url0) && /服务机构新增数量趋势/.test(body0))) throw new Error('未到达结果壳 url=' + url0 + ' body=' + body0.slice(0, 240));
      if (/当前结果快照没有年序列/.test(body0) || /暂无趋势序列，无法给出热度研判/.test(body0)) throw new Error('结果壳仍无年序列/研判诚实空（allow_skip 前置应已挡；环境漂移）');
      if (!(await page.locator('[data-testid="svc-org-heat-panel"]').count())) throw new Error('结果壳未见「市场热度与趋势研判」面板（svc-org-heat-panel），研判面板定位失败');
      console.log('[P0-09 observed] 结果壳已达，研判面板在')
  - note: 研判面板展示主领域斜率与波动特征描述、热度星级与文字评级（用例预期 1；allow_skip 已保证有图例/年序列——评级区含斜率/波动文案 + a-rate 星级 + 文字评级 tag，星级为演示态规则只核呈现不核数值）
    assert: |-
      const panel = page.locator('[data-testid="svc-org-heat-panel"]');
      const pTxt = ((await panel.innerText().catch(() => '')) || '');
      if (/暂无趋势序列，无法给出热度研判/.test(pTxt) || /当前结果快照没有年序列/.test(pTxt)) throw new Error('研判仍诚实空（allow_skip 前置应已挡；环境漂移）');
      const rating = panel.locator('.svc-org-heat__rating').first();
      const rTxt = ((await rating.innerText().catch(() => '')) || '');
      const hasSlope = /(斜率|上升|下降|走势|波动|平缓|增长|回落)/.test(rTxt);
      const stars = await panel.locator('.arco-rate, .arco-icon-star-fill, .arco-icon-star').count();
      const hasLabel = /热度/.test(rTxt);
      console.log('[P0-09 observed] 评级区=' + rTxt.replace(/\n/g, ' / ').slice(0, 200) + ' stars_like=' + stars);
      if (!hasSlope) throw new Error('评级区未见斜率/波动特征描述：' + rTxt.slice(0, 160) + '——预期「主领域斜率与波动特征描述」未承载');
      if (stars < 1 && !hasLabel) throw new Error('评级区既无星级也无文字评级——预期「热度星级与文字评级」未承载')
  - note: 每条研判含「依据」行且引用数值与图表数据一致（用例预期 2；allow_skip 已保证有图例/年序列——依据行随 payload basis 原样展示，行内须含数值；「与图表数据一致」ECharts canvas 数值 DOM 不可直读，以依据行数值存在 + observed 记录承载，具体数值不钉死）
    assert: |-
      const panel2 = page.locator('[data-testid="svc-org-heat-panel"]');
      const pTxt2 = ((await panel2.innerText().catch(() => '')) || '');
      if (/暂无趋势序列，无法给出热度研判/.test(pTxt2) || /当前结果快照没有年序列/.test(pTxt2)) throw new Error('研判仍诚实空（allow_skip 前置应已挡；环境漂移）');
      const basisZone = panel2.locator('.svc-org-heat__basis');
      const basisCount = await basisZone.locator('div').count();
      console.log('[P0-09 observed] 依据行 count=' + basisCount + '；X3 代理证据：引用数值与图表一致 canvas DOM 不可直读，observed 不钉死');
      if (basisCount < 1) throw new Error('有评级但未见「依据」行（svc-org-heat__basis 空）——预期「每条研判含依据行」未承载');
      const bTxt = ((await basisZone.first().innerText().catch(() => '')) || '');
      if (!/\d/.test(bTxt)) throw new Error('依据行无数值引用：' + bTxt.slice(0, 160) + '——预期「引用数值」未承载')
  - note: 热度评级旁必有未闭合口径标识（用例预期 3；D1 missing 语义：M_SVC_ORG_MARKET_HEAT 未入库，走 GAP-SVC-ORG-HEAT 红问号只显治理引用不显伪 8 件套；另有 Q-SVCCHAIN-02 待确认 badge + 面板卡头「演示口径」note 三重承载；allow_skip 已保证有图例/年序列时与 expect-1/2 同跑）
    assert: |-
      const body3 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (/当前结果快照没有年序列/.test(body3)) throw new Error('仍无年序列（allow_skip 前置应已挡；环境漂移）');
      const wrap = page.locator('[data-review-metric="GAP-SVC-ORG-HEAT"]').first();
      const wrapVisible = (await wrap.count()) && (await wrap.isVisible().catch(() => false));
      if (!wrapVisible) throw new Error('评级旁未见未闭合口径标识（GAP-SVC-ORG-HEAT 红问号）——D9 D1 missing 治理入口缺失');
      const q = wrap.locator('button.metric-spec-card.is-missing');
      if (!(await q.count())) throw new Error('红问号按钮形态异常（button.metric-spec-card.is-missing）');
      const ariaQ = (await q.first().getAttribute('aria-label')) || '';
      if (!/指标未登记/.test(ariaQ)) throw new Error('红问号 aria 异常：' + ariaQ);
      let pendingVisible = false; const pending = wrap.locator('.perm-pending-badge');
      if (await pending.count()) pendingVisible = await pending.first().isVisible().catch(() => false);
      if (!pendingVisible) { const p2 = page.locator('[aria-label*="Q-SVCCHAIN-02"]').first(); pendingVisible = (await p2.count()) && (await p2.isVisible().catch(() => false)); }
      const note = page.locator('main').getByText('演示口径：评级判读算法待定义');
      const noteVisible = (await note.count()) && (await note.first().isVisible().catch(() => false));
      console.log('[P0-09 observed] 口径标识三重承载：红问号=true pending(Q-SVCCHAIN-02)=' + pendingVisible + ' 演示口径note=' + noteVisible);
      if (!pendingVisible) throw new Error('热度评级旁未见未闭合口径 badge（Q-SVCCHAIN-02 待确认角标）');
      if (!noteVisible) throw new Error('未见「演示口径：评级判读算法待定义」note——演示态口径声明缺失')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6；allow_skip 前置图例不可见 → n/a 归 ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD（证据 scout-p009-heat.json + env-gate G6，非产品缺陷）；图例可见后实跑红（无斜率波动描述 / 无星级评级 / 无依据行 / 口径标识缺失）按 D3 或 D9 挂缺陷单
