id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00665
priority: P1
tier: B
title: 切换主领域重算不残留；对比曲线≤3 条且图例开关只影响可见性
story: US-SVC-ORG-04
entry_id: svc-org-trend
allow_skip: true
allow_skip_target: '.svc-org-trend__legend button'
ticket: ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD
skip_reason: >-
  本条深验（切换重算不残留 / 对比≤3 / 图例可见性）均依赖结果快照年序列才有可见折线、对比候选与图例。
  对齐 org-field P0-07/08：allow_skip_target=.svc-org-trend__legend button——
  goto 深链结果壳后 5s 图例按钮不可见 → runner 记 n/a（合法环境债，禁止断言内 SKIP throw→fail）。
  当前诚实空（ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD：scout-p011-switch.json——
  结果壳在、主领域 IndustryCatalogSelect 可开 15+ 项、重新分析可达；对比无候选可开；legend 不渲染）。
  年序列到位、图例按钮可见后不触发 skip，四条 expect 全量机跑。
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已完成一次有效分析、结果态可见（env-gate G7）
  - 无头实勘 scout-p011-switch.json（诚实空分支 → 预期 verdict=n/a；有序列时图例可见转实跑）
locators:
  result_deeplink: /service/institution-judgment?workspace=trend&tab=records&view=result&demo_state=result
  view_result: button「查看结果」
  result_shell: 文案「服务机构新增数量趋势」+ data-testid=svc-org-trend-board
  main_industry: .svc-org-analysis-context--result .industry-catalog-select .arco-select-view（P7 点可见 view）
  dropdown_option: .arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option
  reanalyze: button「重新分析」（结果态 as-built；用例文案「开始分析」= D1）
  compare_select: '[data-testid=svc-org-trend-compare]'
  compare_tag: .svc-org-trend__filters .arco-tag
  legend: .svc-org-trend__legend button
  limit_note: 文案「已达上限：最多同时对比 3 个领域」
  honest_empty: 当前结果快照没有年序列
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=records&view=result&demo_state=result
    note: 深链结果壳（P8 自含）；allow_skip 在本步后探测图例按钮——诚实空 5s 不可见→n/a；有序列则继续 expect
expect:
  - note: 结果壳可达且主领域可切——「重新分析」在屏；切换主领域后 URL 带 industry= 且不自动起任务（用例步骤 1 前置；as-built CTA=「重新分析」；选项须对实勘可达，无可选项则门控红+ticket 禁止假绿）
    assert: |-
      await page.waitForTimeout(800);
      const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      let url0 = page.url(); let body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!(/view=result/.test(url0) && /服务机构新增数量趋势/.test(body0))) {
        const recTab = page.locator('[role=tab][data-tab-key="records"]');
        if (await recTab.count()) { await recTab.click({ timeout: 8000 }); await page.waitForTimeout(1200) }
        const vr = page.getByRole('button', { name: '查看结果' }).first();
        await expect(vr).toBeVisible({ timeout: 12000 }); await vr.click({ timeout: 8000 }); await page.waitForTimeout(2500);
        url0 = page.url(); body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      }
      if (!(/view=result/.test(url0) && /服务机构新增数量趋势/.test(body0))) throw new Error('未到达结果壳 url=' + url0 + ' body=' + body0.slice(0, 240));
      await expect(page.getByRole('button', { name: '重新分析' }).first()).toBeVisible({ timeout: 8000 });
      const host = page.locator('.svc-org-analysis-context--result .industry-catalog-select').first();
      if (!(await host.count())) throw new Error('结果态未见主领域 IndustryCatalogSelect（.svc-org-analysis-context--result），无法切换主领域');
      const beforeLabel = ((body0.match(/主领域[：:]([^\n]+)/) || [])[1] || '').trim();
      // P7：点可见 .arco-select-view，禁止点隐藏 input；选项 selector 对齐 P0-13
      const view = host.locator('.arco-select-view').first();
      if (await view.count()) await view.click({ timeout: 8000 }); else await host.click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      let opts = page.locator(optSel);
      let texts = (await opts.allTextContents()).map((s) => s.trim()).filter(Boolean);
      if (texts.length < 2) {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
        if (await view.count()) await view.click({ timeout: 5000 }); else await host.click({ timeout: 5000 });
        await page.waitForTimeout(1200);
        opts = page.locator(optSel);
        texts = (await opts.allTextContents()).map((s) => s.trim()).filter(Boolean);
      }
      if (texts.length < 2) throw new Error('主领域下拉无可切换选项（门控，禁止假绿；ticket ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD / 控件异常）: ' + texts.length);
      let picked = texts.find((t) => t && t !== '全部' && !beforeLabel.includes(t)) || texts.find((t) => t !== '全部') || texts[0];
      await opts.filter({ hasText: picked }).first().click({ timeout: 5000 }); await page.waitForTimeout(800);
      if (!/industry=/.test(page.url())) throw new Error('切换主领域后 URL 未带 industry=（指纹未更新）: ' + page.url());
      if (/view=processing/.test(page.url())) throw new Error('切换主领域自动进入 processing（应显式点重新分析）');
      globalThis.__p11_picked = picked; globalThis.__p11_before = beforeLabel;
      console.log('[P0-11 observed] shell+switch ok before=' + beforeLabel + ' picked=' + picked + ' opts=' + texts.length)
  - note: 切换主领域后点击「重新分析」——趋势图与明细表按新领域重算且旧领域数据不残留（用例预期 1；allow_skip 已保证有图例/年序列）
    assert: |-
      const picked = globalThis.__p11_picked; const beforeLabel = globalThis.__p11_before || '';
      if (!picked) throw new Error('前置未记录切换后的主领域');
      await page.getByRole('button', { name: '重新分析' }).first().click({ timeout: 8000 });
      let done = false; let body = '';
      for (let i = 0; i < 40; i++) {
        await page.waitForTimeout(3000);
        const t = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        const u = page.url();
        if (/view=result/.test(u) && /服务机构新增数量趋势/.test(t) && !/可视化分析过程|生成中/.test(t)) { done = true; body = t; break }
        const vr = page.getByRole('button', { name: '查看结果' });
        if (await vr.count() && await vr.first().isVisible().catch(() => false)) { try { await vr.first().click({ timeout: 4000 }); await page.waitForTimeout(2000) } catch {} }
      }
      if (!done) throw new Error('重新分析 120s 未回到结果壳');
      if (/当前结果快照没有年序列/.test(body)) throw new Error('重算后仍无年序列（allow_skip 前置应已挡；环境漂移）');
      const boardTxt = ((await page.locator('[data-testid="svc-org-trend-board"]').innerText().catch(() => '')) || '');
      if (!boardTxt.includes(picked) && !new RegExp(picked.slice(0, 4)).test(boardTxt)) throw new Error('重算后结果板未见新主领域文案: ' + picked + ' board=' + boardTxt.slice(0, 200));
      if (beforeLabel && beforeLabel !== '全部' && boardTxt.includes('主领域：' + beforeLabel) && !boardTxt.includes(picked)) throw new Error('旧主领域文案残留: ' + beforeLabel);
      console.log('[P0-11 observed] reanalyze done; new domain reflected')
  - note: 对比曲线最多 3 条（主领域+对比≤3）；添满后再添加时入口禁用并提示（用例预期 2；as-built TREND_COMPARE_LIMIT=2 条对比）
    assert: |-
      const cmp = page.locator('[data-testid="svc-org-trend-compare"]');
      await expect(cmp).toBeVisible({ timeout: 8000 });
      const tagSel = page.locator('.svc-org-trend__filters .arco-tag');
      const addOne = async () => {
        const disabled = await cmp.evaluate((el) => el.classList.contains('arco-select-disabled') || !!el.querySelector('.arco-select-disabled'));
        if (disabled) return false;
        await cmp.click({ timeout: 5000 }); await page.waitForTimeout(500);
        const opts = page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option');
        const n = await opts.count();
        if (n < 1) { await page.keyboard.press('Escape').catch(() => {}); return false }
        await opts.first().click({ timeout: 5000 }); await page.waitForTimeout(600);
        return true;
      };
      let added = 0;
      for (let i = 0; i < 3; i++) {
        const ok = await addOne();
        if (!ok) break;
        added += 1;
      }
      const tags = await tagSel.count();
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      console.log('[P0-11 observed] compare tags=' + tags + ' added_attempts=' + added);
      if (tags > 2) throw new Error('对比领域 tag 超过 as-built 上限 2（合计曲线应≤3）: ' + tags);
      const atLimit = tags >= 2 || /已达上限|最多 3 个领域|最多同时对比/.test(body) || await cmp.evaluate((el) => el.classList.contains('arco-select-disabled') || !!el.querySelector('.arco-select-disabled') || /最多 3/.test(el.innerText || ''));
      if (!atLimit && tags < 2) throw new Error('对比候选不足 2，无法核验超限禁用（有图例前置下应为可测态）');
      const body2 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      const tip = /已达上限|最多同时对比|最多 3 个领域/.test(body2);
      const dis = await cmp.evaluate((el) => el.classList.contains('arco-select-disabled') || !!el.querySelector('.arco-select-disabled') || el.getAttribute('disabled') != null);
      if (!(dis || tip)) throw new Error('已达对比上限但入口未禁用且未见超限提示');
      const legendN = await page.locator('.svc-org-trend__legend button').count();
      if (legendN > 3) throw new Error('可见曲线（图例按钮）超过 3 条: ' + legendN);
      console.log('[P0-11 observed] limit ok tip=' + tip + ' disabled=' + dis + ' legendN=' + legendN)
  - note: 点击图例开关关闭一条曲线——只影响曲线可见性，不改已选对比领域集合（用例预期 3；末条不可关 as-built title「至少保留一条曲线」）
    assert: |-
      const legend = page.locator('.svc-org-trend__legend button');
      const n = await legend.count();
      if (n < 2) throw new Error('图例按钮 <2，无法在保留末条前提下关闭一条（allow_skip 前置应已保证 ≥1；本条需 ≥2）');
      const tagsBefore = (await page.locator('.svc-org-trend__filters .arco-tag').allTextContents()).map((s) => s.trim()).filter(Boolean);
      let target = null;
      for (let i = 0; i < n; i++) {
        const btn = legend.nth(i);
        if (await btn.isDisabled().catch(() => false)) continue;
        target = btn; break;
      }
      if (!target) throw new Error('图例无可点开关（可能仅剩末条 disabled）');
      const name = ((await target.innerText()) || '').replace(/\s+/g, ' ').trim();
      await target.click({ timeout: 5000 }); await page.waitForTimeout(500);
      const tagsAfter = (await page.locator('.svc-org-trend__filters .arco-tag').allTextContents()).map((s) => s.trim()).filter(Boolean);
      if (JSON.stringify(tagsBefore) !== JSON.stringify(tagsAfter)) throw new Error('图例开关改动了对比领域已选集合 before=' + tagsBefore.join(',') + ' after=' + tagsAfter.join(','));
      const typeAfter = await target.getAttribute('class') || '';
      console.log('[P0-11 observed] legend toggle name=' + name + ' tags_unchanged=' + tagsBefore.length + ' class=' + typeAfter.slice(0, 80));
      const still = await legend.count();
      if (still !== n) throw new Error('图例按钮数被改写（应为仅可见性）: ' + still + ' != ' + n)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6；图例按钮 5s 不可见 → allow_skip 前置命中 n/a 归 ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD（证据 fixtures/scout/scout-p011-switch.json + env-gate G6，非产品缺陷）；有序列实跑红（残留旧领域 / 超限未禁用 / 图例改集合 / 下拉零选项假绿）按 D3 挂缺陷单
as_built_note: |-
  蓝本 FUNC-00665（备选-切换领域与对比曲线；接旧 00291 部分；开放项 3「最后一条曲线不可经图例关闭与超限提示文案 observed」）。
  REWORK（验收 102e955e C6）：旧稿 expect-0 写稿自检假绿 vs 实跑「主领域下拉选项不足: 0」；expect-1/2/3 合法 SKIP throw 被 runner 记 fail。
  改口径对齐 org-field P0-07/08：allow_skip_target=.svc-org-trend__legend button + ticket ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD → 诚实空 runner 记 n/a（禁止断言内 SKIP Marker→fail）；深链结果壳 goto 使门控在结果态探测。
  expect-0：P7 点 .arco-select-view；选项 selector 含 .arco-select-popup-visible；限定 --result 宿主；无可选项门控红禁止假绿。不进 gold。
  D1：用例「开始分析」结果态 as-built=「重新分析」；对比上限 TREND_COMPARE_LIMIT=2；图例仅 view.visible.length>0 渲染。viewport 1920×1080@1。list 相对父键 2 空格缩进。
