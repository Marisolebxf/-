id: FUNC-04208
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04208
priority: P1
tier: B
title: 失败记录不能开结果
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: click
    assert: |-
      await page.getByRole('tablist', { name: '服务机构分析页签' }).getByRole('tab', { name: '分析记录' }).click()
expect:
  - note: 失败行的「查看结果」不可用
    assert: |-
      const failedRow = page.locator('main tr').filter({ hasText: '失败' }).first();
      await expect(failedRow).toBeVisible();
      await expect(failedRow.getByRole('button', { name: '查看结果' })).toBeDisabled();
  - note: 该行「查看过程」仍可用
    assert: |-
      const failedRow = page.locator('main tr').filter({ hasText: '失败' }).first();
      await expect(failedRow.getByRole('button', { name: '查看过程' })).toBeEnabled();
on_fail: 截图 + 抄 X-Trace-Id
