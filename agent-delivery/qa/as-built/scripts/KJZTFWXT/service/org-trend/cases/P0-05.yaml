id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00667
priority: P0
title: 分析记录呈现已完成任务且查看结果打开结果壳
story: US-SVC-ORG-04
entry_id: svc-org-trend
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G7 已完成任务可「查看结果」）
locators:
  tab_main: '[role=tab][data-tab-key=trend]'
  tab_records: '[role=tab][data-tab-key=records]'
  view_result: button「查看结果」
  back_config: button「返回配置」
  honest_empty: 当前结果快照没有年序列
  result_shell: 服务机构新增数量趋势
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 「分析记录」Tab 选中且呈现历史任务列表（含已完成与查看结果），与分析主 Tab 互斥
    assert: |-
      await page.goto('http://111.198.38.90:50892/service/institution-judgment?workspace=trend&tab=trend', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const mainTab = page.locator('[role=tab][data-tab-key="trend"]'); const recTab = page.locator('[role=tab][data-tab-key="records"]'); await expect(recTab).toBeVisible({ timeout: 8000 }); await recTab.click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(() => {}); await expect(page.getByRole('button', { name: '查看结果' }).first()).toBeVisible({ timeout: 12000 }); const recSel = await recTab.getAttribute('aria-selected'); const mainSel = await mainTab.getAttribute('aria-selected'); if (recSel !== 'true') throw new Error('分析记录未选中 aria=' + recSel); if (mainSel === 'true') throw new Error('主 Tab 仍 selected'); const body = ((await page.locator('main').first().innerText().catch(() => '')) || ''); if (!/已完成/.test(body)) throw new Error('分析记录未见已完成任务: ' + body.slice(0, 280))
  - note: 点「查看结果」直接打开既有结果壳（view=result），诚实空可接受；不断言有数折线；不重跑过程态
    assert: |-
      const viewBtn = page.getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await viewBtn.count())) throw new Error('无可用查看结果按钮'); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(2500); const url = page.url(); const body = ((await page.locator('main').first().innerText().catch(() => '')) || ''); if (/正在创建任务|可视化分析过程/.test(body) && !/view=result|服务机构新增数量趋势|当前结果快照没有年序列/.test(url + body)) throw new Error('疑似重跑过程态而非打开结果: ' + url); const reached = /view=result/.test(url) || /服务机构新增数量趋势|当前结果快照没有年序列|图表区诚实空|暂无趋势序列/.test(body); if (!reached) throw new Error('未到达结果壳 url=' + url + ' body=' + body.slice(0, 280))
  - note: 切回「服务机构新增趋势分析」后配置区仍可见
    assert: |-
      const back = page.locator('main').getByText('返回配置', { exact: true }).first(); if (await back.count() && await back.isVisible().catch(() => false)) { await back.click({ timeout: 8000 }); await page.waitForTimeout(1500) } else { await page.locator('[role=tab][data-tab-key="trend"]').click({ timeout: 8000 }); await page.waitForTimeout(1500) }; let body = ((await page.locator('main').first().innerText().catch(() => '')) || ''); if (!/分析配置|选择机构|开始分析|请先选择分析机构|已选机构/.test(body)) { await page.goto('http://111.198.38.90:50892/service/institution-judgment?workspace=trend&tab=trend', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); body = ((await page.locator('main').first().innerText().catch(() => '')) || '') }; if (!/分析配置/.test(body)) throw new Error('切回后未见分析配置: ' + body.slice(0, 280)); await expect(page.getByRole('button', { name: '开始分析', exact: true }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00667（分析记录/查看结果）；env-gate G7 已有已完成任务，优先点历史「查看结果」不新开跑。结果壳常诚实空「当前结果快照没有年序列 payload…图表区诚实空」（ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD），A 档不断言有数折线。切回优先「返回配置」。页头 Tab 内嵌追溯按钮污染 getByRole exact 名，改用 data-tab-key=trend/records（同 regional-compete P0-01）。00668 评审零泄漏本条未改用（记录链更稳）。A 档零 allow_skip。list 相对父键 2 空格缩进。
tier: A
