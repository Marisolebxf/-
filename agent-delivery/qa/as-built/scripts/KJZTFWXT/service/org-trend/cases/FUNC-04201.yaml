id: FUNC-04201
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04201
priority: P1
tier: B
title: 备选-分组全选
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 1、弹窗已选家数等于该组标题括号中的数量
    assert: |-
      const route = '/service/institution-judgment?workspace=trend&tab=trend';
      const main = page.locator('main').first();
      await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      const pick = main
        .locator('[data-testid="svc-org-open-picker"]')
        .or(main.getByRole('button', { name: '选择机构', exact: true }))
        .first();
      await expect(pick).toBeVisible({ timeout: 12000 });
      await pick.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const dialog = page
        .locator('[data-testid="svc-org-picker-modal"], .arco-modal')
        .filter({ hasText: '选择服务机构' })
        .first();
      await expect(dialog).toBeVisible({ timeout: 8000 });
      const groups = dialog.locator('.svc-org-picker-group');
      await expect(groups.first()).toBeVisible({ timeout: 12000 });
      let financeGroup = null;
      let targetSize = 0;
      const groupN = await groups.count();
      for (let g = 0; g < Math.min(groupN, 12); g++) {
        const group = groups.nth(g);
        const headTxt = ((await group.locator('.svc-org-picker-group__head strong').first().innerText().catch(() => '')) || '').trim();
        if (!headTxt.includes('金融服务')) continue;
        const m = headTxt.match(/[（(](\d+)[）)]/);
        targetSize = m ? parseInt(m[1], 10) : 0;
        financeGroup = group;
        break;
      }
      if (!financeGroup || targetSize < 1) {
        throw new Error('未见金融服务分组或括号数量');
      }
      const footer = dialog.locator('.svc-org-picker-footer__count').first();
      const parseCount = async () => {
        const txt = ((await footer.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = txt.match(/已选\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : -1;
      };
      const modalClear = dialog.locator('.svc-org-picker-footer').getByRole('button', { name: '清空', exact: true }).first();
      if ((await parseCount()) > 0 && (await modalClear.isVisible().catch(() => false))) {
        await modalClear.click({ timeout: 5000 });
        await page.waitForTimeout(500);
      }
      await expect(await parseCount()).toBe(0);
      const selectAllBtn = financeGroup
        .locator('.svc-org-picker-group__head')
        .getByRole('button', { name: '全选', exact: true })
        .first();
      await selectAllBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const countAfter = await parseCount();
      expect(countAfter).toBe(targetSize);
      await expect(footer).toContainText(String(targetSize));
on_fail: 截图 + 抄 X-Trace-Id
