steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=records&view=result&demo_state=result
    note: 深链结果壳（P8 自含）；allow_skip 在本步后探测图例按钮——诚实空 5s 不可见→n/a；有序列则继续 expect
expect:
  - note: 序列长度不足 3 年时显示「数据长度不足，暂不给出热度研判」且该评级区不显示星级（用例预期 1；allow_skip 已保证有图例/年序列；扫主领域候选命中 insufficient）
    assert: |-
      await page.waitForTimeout(800);
      const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      let url0 = page.url(); let body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!(/view=result/.test(url0) && /服务机构新增数量趋势/.test(body0))) {
        const recTab = page.locator('[role=tab][data-tab-key="records"]');
        if (await recTab.count()) { await recTab.click({ timeout: 8000 }); await page.waitForTimeout(1200) }
        const vr = page.getByRole('button', { name: '查看结果' }).first();
        await expect(vr).toBeVisible({ timeout: 12000 }); await vr.click({ timeout: 8000 }); await page.waitForTimeout(2500);
      }
      const panel = page.locator('[data-testid="svc-org-heat-panel"]');
      await expect(panel).toBeVisible({ timeout: 12000 });
      const MSG_I = '数据长度不足，暂不给出热度研判';
      const hitInPanel = async () => /数据长度不足，暂不给出热度研判/.test(((await panel.innerText().catch(() => '')) || ''));
      if (!(await hitInPanel())) {
        const sel = page.locator('.svc-org-analysis-context--result .industry-catalog-select, .industry-catalog-select').first();
        if (await sel.count()) {
          await sel.locator('.arco-select-view, .arco-select').first().click({ timeout: 8000 }).catch(async () => { await sel.click({ timeout: 8000 }); });
          await page.waitForTimeout(600);
          const opts = page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option');
          const n = await opts.count();
          for (let i = 0; i < Math.min(n, 15); i++) {
            await opts.nth(i).click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(400);
            const re = page.getByRole('button', { name: '重新分析' }).first();
            if (await re.count() && await re.isEnabled().catch(() => false)) { await re.click({ timeout: 8000 }).catch(() => {}); await page.waitForTimeout(2000); }
            if (await hitInPanel()) break;
            if (i < Math.min(n, 15) - 1) {
              await sel.locator('.arco-select-view, .arco-select').first().click({ timeout: 5000 }).catch(async () => { await sel.click({ timeout: 5000 }); });
              await page.waitForTimeout(400);
            }
          }
          await page.keyboard.press('Escape').catch(() => {});
        }
      }
      const pTxt = ((await panel.innerText().catch(() => '')) || '');
      console.log('[P0-14 observed] insufficient sweep panel=' + pTxt.replace(/\n/g, ' / ').slice(0, 240));
      if (!pTxt.includes(MSG_I)) throw new Error('未命中「数据长度不足，暂不给出热度研判」——需可构造 points.length<3 的领域（开放项 3 / 构造债）；当前 panel=' + pTxt.slice(0, 160));
      const rating = panel.locator('.svc-org-heat__rating').filter({ hasText: MSG_I }).first();
      const stars = await rating.locator('.arco-rate, .arco-icon-star-fill, .arco-icon-star').count();
      if (stars > 0) throw new Error('序列不足场景仍显示星级（伪评级）stars=' + stars);
  - note: 曲线全 0 时显示「该领域暂无服务供给活动」且不显示星级（用例预期 2；扫主领域/图例「无新增」命中 no_activity）
    assert: |-
      const panel = page.locator('[data-testid="svc-org-heat-panel"]');
      await expect(panel).toBeVisible({ timeout: 8000 });
      const MSG_Z = '该领域暂无服务供给活动';
      const hitZ = async () => /该领域暂无服务供给活动/.test(((await panel.innerText().catch(() => '')) || ''));
      if (!(await hitZ())) {
        const zeroLeg = page.locator('.svc-org-trend__legend button').filter({ hasText: '无新增' });
        if (await zeroLeg.count()) {
          /* 图例「无新增」仅标零线可见性；热度文案仍看主领域——改扫产业 */
        }
        const sel = page.locator('.svc-org-analysis-context--result .industry-catalog-select, .industry-catalog-select').first();
        if (await sel.count()) {
          await sel.locator('.arco-select-view, .arco-select').first().click({ timeout: 8000 }).catch(async () => { await sel.click({ timeout: 8000 }); });
          await page.waitForTimeout(600);
          const opts = page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option');
          const n = await opts.count();
          for (let i = 0; i < Math.min(n, 15); i++) {
            await opts.nth(i).click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(400);
            const re = page.getByRole('button', { name: '重新分析' }).first();
            if (await re.count() && await re.isEnabled().catch(() => false)) { await re.click({ timeout: 8000 }).catch(() => {}); await page.waitForTimeout(2000); }
            if (await hitZ()) break;
            if (i < Math.min(n, 15) - 1) {
              await sel.locator('.arco-select-view, .arco-select').first().click({ timeout: 5000 }).catch(async () => { await sel.click({ timeout: 5000 }); });
              await page.waitForTimeout(400);
            }
          }
          await page.keyboard.press('Escape').catch(() => {});
        }
      }
      const pTxt = ((await panel.innerText().catch(() => '')) || '');
      console.log('[P0-14 observed] no_activity sweep panel=' + pTxt.replace(/\n/g, ' / ').slice(0, 240));
      if (!pTxt.includes(MSG_Z)) throw new Error('未命中「该领域暂无服务供给活动」——需可构造全 0 年序列领域（开放项 3 / 构造债）；当前 panel=' + pTxt.slice(0, 160));
      const rating = panel.locator('.svc-org-heat__rating').filter({ hasText: MSG_Z }).first();
      const stars = await rating.locator('.arco-rate, .arco-icon-star-fill, .arco-icon-star').count();
      if (stars > 0) throw new Error('全 0 场景仍显示星级（伪评级）stars=' + stars);
      console.log('[P0-14 observed] no_activity ok, stars=0')
