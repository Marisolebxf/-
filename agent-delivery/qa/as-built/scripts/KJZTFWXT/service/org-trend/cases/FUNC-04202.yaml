id: FUNC-04202
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04202
priority: P1
tier: B
title: 备选-弹窗清空后取消
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: click
    target: |-
      const main = page.locator('main').first();
      async function openOrgPicker() {
        const pickBtn = main.getByRole('button', { name: '选择机构', exact: true });
        if (await pickBtn.count()) {
          await pickBtn.click({ timeout: 8000 });
          return;
        }
        const u = new URL(page.url());
        u.searchParams.set('open_compare_basket', '1');
        u.searchParams.set('cb_object_type', 'service_org');
        await page.goto(u.pathname + u.search);
        await page.waitForTimeout(1000);
      }
      await openOrgPicker();
  - action: click
    target: |-
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择分析服务/ }).first();
      await expect(dialog).toBeVisible({ timeout: 15000 });
      await dialog.getByRole('checkbox').first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
  - action: click
    target: |-
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择分析服务/ }).first();
      await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await expect(dialog).toBeHidden({ timeout: 12000 });
      await page.waitForTimeout(600);
  - action: evaluate
    target: |-
      const main = page.locator('main').first();
      let saved = '';
      const tag = main.locator('.svc-org-pick-tag').first();
      if (await tag.count()) {
        saved = ((await tag.innerText().catch(() => '')) || '').trim();
      } else {
        const body = ((await main.innerText().catch(() => '')) || '').trim();
        const m = body.match(/已选\s*(\d+)\s*家机构/);
        await expect(m, '配置区无机构回显').toBeTruthy();
        saved = body.slice(0, 120);
      }
      await page.evaluate((name) => { window.__func04202_savedOrg = name; }, saved);
  - action: click
    target: |-
      const main = page.locator('main').first();
      async function openOrgPicker() {
        const pickBtn = main.getByRole('button', { name: '选择机构', exact: true });
        if (await pickBtn.count()) {
          await pickBtn.click({ timeout: 8000 });
          return;
        }
        const u = new URL(page.url());
        u.searchParams.set('open_compare_basket', '1');
        u.searchParams.set('cb_object_type', 'service_org');
        await page.goto(u.pathname + u.search);
        await page.waitForTimeout(1000);
      }
      await openOrgPicker();
  - action: click
    target: |-
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择分析服务/ }).first();
      await expect(dialog).toBeVisible({ timeout: 15000 });
      const groupSelectAll = dialog.getByText('全选当前筛选结果', { exact: true });
      if (await groupSelectAll.count()) {
        await groupSelectAll.click({ timeout: 8000 });
      } else {
        await dialog.getByText('全选', { exact: true }).first().click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
  - action: click
    target: |-
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择分析服务/ }).first();
      const clearBtn = dialog.getByRole('button', { name: '清空', exact: true });
      if (await clearBtn.count()) {
        await clearBtn.first().click({ timeout: 8000 });
      } else {
        await dialog.getByText('清空', { exact: true }).first().click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
expect:
  - note: 1、清空后弹窗已选为 0 家
    assert: |-
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择分析服务/ }).first();
      await expect(dialog).toBeVisible({ timeout: 8000 });
      const body = ((await dialog.innerText().catch(() => '')) || '').trim();
      await expect(body).toMatch(/已选\s*0\s*家/);
  - note: 2、取消后配置区原机构仍在
    assert: |-
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择分析服务/ }).first();
      await dialog.getByRole('button', { name: '取消' }).click({ timeout: 8000 });
      await expect(dialog).toBeHidden({ timeout: 12000 });
      await page.waitForTimeout(600);
      const main = page.locator('main').first();
      const saved = await page.evaluate(() => window.__func04202_savedOrg || '');
      const tag = main.locator('.svc-org-pick-tag').first();
      if (await tag.count()) {
        const name = ((await tag.innerText().catch(() => '')) || '').trim();
        await expect(name).toBe(saved);
      } else {
        const body = ((await main.innerText().catch(() => '')) || '').trim();
        await expect(body).toContain(saved.slice(0, 20));
      }
on_fail: 截图 + 抄 X-Trace-Id
