id: FUNC-04206
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04206
priority: P1
tier: B
title: 备选-返回配置 · 回到分析配置
story: US-SVC-ORG-04
entry_id: svc-org-trend
preconditions:
  - 已打开一条已完成结果
  - 已进入服务机构新增趋势分析入口（catalog_path trend 工作区）
locators:
  tab_records: '[role=tab][data-tab-key=records]'
  view_result: button「查看结果」
  back_config: button「返回配置」
  config_shell: '[data-testid="svc-org-analysis-config"]'
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: click
    target: 分析记录
  - action: click
    target: 查看结果
  - action: click
    target: 返回配置
expect:
  - note: 前置：已完成结果壳；步骤：点击「返回配置」
    assert: |-
      const route = '/service/institution-judgment?workspace=trend&tab=trend';
      await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1500);
      const close = page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
        try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
      }
      let url0 = page.url();
      let body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!(/服务机构新增数量趋势/.test(body0) && /view=result/.test(url0))) {
        const recTab = page.locator('[role=tab][data-tab-key="records"]');
        await expect(recTab).toBeVisible({ timeout: 8000 });
        await recTab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const vr = page.getByRole('button', { name: '查看结果' }).first();
        await expect(vr).toBeVisible({ timeout: 12000 });
        await vr.click({ timeout: 8000 });
        await page.waitForTimeout(2500);
        url0 = page.url();
        body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      }
      const reached =
        /view=result/.test(url0) ||
        /服务机构新增数量趋势|当前结果快照没有年序列|图表区诚实空|暂无趋势序列/.test(body0);
      if (!reached) {
        throw new Error('前置未打开已完成结果 url=' + url0 + ' body=' + body0.slice(0, 280));
      }
      const back = page.getByRole('button', { name: '返回配置', exact: true }).first();
      if (!(await back.count()) || !(await back.isVisible().catch(() => false))) {
        const backTxt = page.locator('main').getByText('返回配置', { exact: true }).first();
        if (await backTxt.count() && await backTxt.isVisible().catch(() => false)) {
          await backTxt.click({ timeout: 8000 });
        } else {
          throw new Error('结果页未见「返回配置」 url=' + page.url());
        }
      } else {
        await back.click({ timeout: 8000 });
      }
      await page.waitForTimeout(1500);
      globalThis.__func04206BackDone = true;
  - note: 1、页面出现「分析配置」
    assert: |-
      if (!globalThis.__func04206BackDone) throw new Error('前置：未点击返回配置');
      const shell = page.locator('[data-testid="svc-org-analysis-config"]').first();
      const shellVis = await shell.isVisible().catch(() => false);
      const main = page.locator('main').first();
      const body = ((await main.innerText().catch(() => '')) || '');
      const hasHeading = /分析配置/.test(body);
      if (!shellVis && !hasHeading) {
        throw new Error(
          'D2-SVC-ORG-TREND-NO-CONFIG-SHELL：返回后未见「分析配置」壳（关评审后可能仅产业级联+开始分析，无旧壳文案） body=' +
            body.slice(0, 320)
        );
      }
      if (shellVis) {
        await expect(shell).toBeVisible({ timeout: 8000 });
      } else {
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      }
      const url = page.url();
      if (/view=processing/.test(url)) {
        throw new Error('返回配置后仍停在过程态: ' + url);
      }
  - note: 2、可见「开始分析」
    assert: |-
      if (!globalThis.__func04206BackDone) throw new Error('前置：未点击返回配置');
      await expect(page.getByRole('button', { name: '开始分析', exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例册 FUNC-04206（结果页点「返回配置」→ 分析配置壳 +「开始分析」可见）。
  前置同 FUNC-04204：分析记录「查看结果」或已在 view=result；结果诚实空可接受。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04206。D2：无「分析配置」文案/ testid 壳时 fail 并注明现网新壳。
