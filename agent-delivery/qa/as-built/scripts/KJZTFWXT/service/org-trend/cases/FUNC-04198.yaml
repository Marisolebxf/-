id: FUNC-04198
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04198
priority: P0
tier: B
title: 主流程-去掉已选标签
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: evaluate
    script: |-
      const main = page.locator('main').first();
      const pickBtn = main.getByRole('button', { name: '选择机构' });
      if (await pickBtn.count()) {
        await pickBtn.first().click();
      } else {
        const path =
          '/service/institution-judgment?workspace=trend&tab=trend&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=service_org&compare_picker_min=1&compare_picker_max=50';
        await page.goto(new URL(path, page.url()).toString());
      }
      const dialog = page.locator('.arco-modal:visible').last();
      await dialog.waitFor({ state: 'visible', timeout: 15000 });
      const box = dialog.locator('.arco-checkbox').first();
      await box.click();
      const orgName = ((await box.locator('xpath=ancestor::*[contains(@class,"arco-list-item") or contains(@class,"card")][1]').innerText().catch(() => '')) || (await dialog.getByText(/有限公司|研究院|中心/).first().innerText())).trim().split('\n')[0];
      globalThis.__p04198_org = orgName;
      await dialog.getByText(/已选 1 家/).waitFor({ state: 'visible', timeout: 8000 });
      await dialog.getByRole('button', { name: '确定' }).click();
      await dialog.waitFor({ state: 'hidden', timeout: 15000 });
      const shell = main.locator('[data-testid="svc-org-analysis-config"]').first();
      const tag = shell.locator('.svc-org-pick-tag, .arco-tag').filter({ hasText: orgName }).first();
      await tag.waitFor({ state: 'visible', timeout: 15000 });
  - action: evaluate
    script: |-
      const main = page.locator('main').first();
      const orgName = String(globalThis.__p04198_org || '').trim();
      const shell = main.locator('[data-testid="svc-org-analysis-config"]').first();
      const tag = shell.locator('.svc-org-pick-tag, .arco-tag').filter({ hasText: orgName }).first();
      await tag.locator('.arco-tag-close-btn').click();
expect:
  - note: 1、该机构不再出现在已选机构中
    assert: |-
      const main = page.locator('main').first();
      const orgName = String(globalThis.__p04198_org || '').trim();
      const shell = main.locator('[data-testid="svc-org-analysis-config"]').first();
      await expect(shell.locator('.svc-org-pick-tag, .arco-tag').filter({ hasText: orgName })).toHaveCount(0);
  - note: 2、已选机构变为 0 家
    assert: |-
      const main = page.locator('main').first();
      const shell = main.locator('[data-testid="svc-org-analysis-config"]').first();
      await expect(shell.locator('.svc-org-pick-tag, .arco-tag')).toHaveCount(0);
      const zeroLabel = shell.getByText(/已选机构（0 家）|已选 0 家机构/);
      if (await zeroLabel.count()) await expect(zeroLabel.first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
