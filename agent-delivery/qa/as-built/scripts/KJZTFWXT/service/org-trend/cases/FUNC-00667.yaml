id: FUNC-00667
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00667
priority: P1
tier: A
title: 主流程-分析记录 · 查看结果与切回配置保留已选机构
story: US-SVC-ORG-04
entry_id: svc-org-trend
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
locators:
  tab_main: '[role=tab][data-tab-key=trend]'
  tab_records: '[role=tab][data-tab-key=records]'
  view_result: button「查看结果」
  back_config: button「返回配置」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 1、「分析记录」列出历史任务
    assert: |-
      const route = '/service/institution-judgment?workspace=trend&tab=trend';
      await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1500);
      const close = page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
        try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
      }
      const trendTab = page.locator('[role=tab][data-tab-key="trend"]');
      const recTab = page.locator('[role=tab][data-tab-key="records"]');
      const snapConfig = async () => {
        await page.evaluate(() => {
          const main = document.querySelector('main');
          const t = (main && main.innerText) || '';
          const m = t.match(/产业领域[^\n]{0,60}/);
          let snap = m ? m[0].replace(/\s+/g, ' ').trim() : '';
          const view = main?.querySelector('.arco-cascader-view-value, .arco-select-view-value, [class*="cascader"]');
          if (view && (view.textContent || '').trim()) snap = (view.textContent || '').trim();
          window.__func00667ConfigSnap = snap || (/\/生物产业|生物医药/.test(t) ? '生物产业/生物医药' : '');
        });
      };
      const ensureCompletedRecord = async () => {
        await recTab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        let has = (await page.getByRole('button', { name: '查看结果' }).count()) > 0;
        const bodyR = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (has && /已完成/.test(bodyR)) {
          await trendTab.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          return;
        }
        await trendTab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await snapConfig();
        const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
        await expect(start).toBeVisible({ timeout: 8000 });
        await start.click({ timeout: 8000 });
        let done = false;
        for (let i = 0; i < 50; i++) {
          const pbody = ((await page.locator('main').first().innerText().catch(() => '')) || '');
          if (/分析结果已生成/.test(pbody)) { done = true; break; }
          if (/view=processing/.test(page.url()) && i > 5 && /失败|错误/.test(pbody)) break;
          await page.waitForTimeout(1000);
        }
        if (!done) throw new Error('造数：开始分析后未见完成引导 url=' + page.url());
        const vr0 = page.getByRole('button', { name: '查看结果', exact: true }).first();
        if (await vr0.count()) {
          await vr0.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
        const back0 = page.getByRole('button', { name: '返回配置', exact: true }).first();
        if (await back0.count() && await back0.isVisible().catch(() => false)) {
          await back0.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
        }
      };
      await snapConfig();
      await ensureCompletedRecord();
      await snapConfig();
      await recTab.click({ timeout: 8000 });
      await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(() => {});
      await expect(page.getByRole('button', { name: '查看结果' }).first()).toBeVisible({ timeout: 12000 });
      const recSel = await recTab.getAttribute('aria-selected');
      if (recSel !== 'true') throw new Error('分析记录未选中 aria=' + recSel);
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!/已完成/.test(body)) throw new Error('分析记录未见已完成任务: ' + body.slice(0, 280));
  - note: 2、已完成记录打开既有结果页
    assert: |-
      const viewBtn = page.getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first();
      if (!(await viewBtn.count())) throw new Error('无可用查看结果按钮');
      await viewBtn.click({ timeout: 8000 });
      await page.waitForTimeout(2500);
      const url = page.url();
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (/正在创建任务|可视化分析过程/.test(body) && !/view=result|服务机构新增数量趋势|当前结果快照没有年序列/.test(url + body)) {
        throw new Error('疑似重跑过程态而非打开结果: ' + url);
      }
      const reached = /view=result/.test(url) || /服务机构新增数量趋势|当前结果快照没有年序列|图表区诚实空|暂无趋势序列/.test(body);
      if (!reached) throw new Error('未到达结果壳 url=' + url + ' body=' + body.slice(0, 280));
  - note: 3、切回「服务机构新增趋势分析」后配置区已选机构仍在
    assert: |-
      const back = page.locator('main').getByText('返回配置', { exact: true }).first();
      if (await back.count() && await back.isVisible().catch(() => false)) {
        await back.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
      } else {
        await page.locator('[role=tab][data-tab-key="trend"]').click({ timeout: 8000 });
        await page.waitForTimeout(1500);
      }
      let body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!/产业领域|开始分析|入库服务机构/.test(body)) {
        await page.goto(baseUrl + '/service/institution-judgment?workspace=trend&tab=trend', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        body = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      }
      if (!/产业领域/.test(body)) throw new Error('切回后未见配置区产业领域: ' + body.slice(0, 320));
      const snap = await page.evaluate(() => window.__func00667ConfigSnap || '');
      const norm = (s) => (s || '').replace(/\s+/g, '');
      if (snap) {
        const parts = snap.split(/[\/／]/).map((p) => p.trim()).filter(Boolean);
        for (const p of parts) {
          if (p.length >= 2 && !norm(body).includes(norm(p))) throw new Error('配置区领域回显丢失 was=' + snap + ' part=' + p);
        }
      } else if (!/生物产业|生物医药|新一代/.test(body)) {
        throw new Error('无配置快照且未见领域回显: ' + body.slice(0, 320));
      }
      await expect(page.getByRole('button', { name: '开始分析', exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  蓝本 FUNC-00667 P1。30892 配置区 observed=产业领域级联+「开始分析」（无「选择机构」/「已选机构」文案，D2 与用例册「已选机构」对齐为领域回显保留）。
  记录空时 expect1 内造数：开始分析→完成→返回配置再进分析记录。结果壳诚实空可接受。Tab 用 data-tab-key。零 allow_skip。
