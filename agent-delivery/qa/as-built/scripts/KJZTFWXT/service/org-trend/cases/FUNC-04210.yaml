id: FUNC-04210
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04210
priority: P1
tier: B
title: 异常-返回配置重试
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 1、离开过程页
    assert: |-
      const catalogPath = '/service/institution-judgment?workspace=trend&tab=trend';
      const knownOrgId = '79bbcfc0e68027808f1f4caf1b6f0469';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = page.locator('main');
      globalThis.__p04210 = globalThis.__p04210 || { clickedBack: false };

      const openRecords = async () => {
        await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
        await page.waitForTimeout(600);
      };

      const openFailedFromRecords = async () => {
        await openRecords();
        const failRow = main.locator('tr').filter({ hasText: '失败' }).first();
        const proc = failRow.getByRole('button', { name: '查看过程' });
        if (!(await proc.count())) return false;
        if (!(await proc.first().isVisible().catch(() => false))) return false;
        await proc.first().click({ timeout: 10000 });
        await page.waitForTimeout(1000);
        return true;
      };

      const hydrateFailedProcess = async () => {
        const deep = `${catalogPath}&org_ids[]=${encodeURIComponent(knownOrgId)}`;
        await page.goto(toUrl(deep), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        const abortCreate = (route) => {
          const u = route.request().url();
          const m = route.request().method();
          if (m === 'POST' && /analysis|task|jobs/i.test(u)) return route.abort('failed');
          return route.continue();
        };
        await page.route('**/*', abortCreate);
        try {
          await main.getByRole('button', { name: '开始分析' }).click({ timeout: 10000 });
          await page.waitForTimeout(2500);
        } finally {
          await page.unroute('**/*', abortCreate);
        }
        const retryBtn = main.getByRole('button', { name: '返回配置重试' });
        if (await retryBtn.isVisible().catch(() => false)) return true;
        return false;
      };

      if (!globalThis.__p04210.clickedBack) {
        let onFailProcess = await openFailedFromRecords();
        if (!onFailProcess) onFailProcess = await hydrateFailedProcess();
        if (!onFailProcess) {
          throw new Error('修订 无失败任务且 hydrate 未进入失败过程页');
        }
        await main.getByRole('button', { name: '返回配置重试' }).click({ timeout: 10000 });
        globalThis.__p04210.clickedBack = true;
        await page.waitForTimeout(800);
      }

      await expect(main.getByRole('button', { name: '返回配置重试' })).toHaveCount(0);
      await expect(main.getByText('本次分析生成失败')).toHaveCount(0);
  - note: 2、能看到分析记录列表
    assert: |-
      if (!globalThis.__p04210?.clickedBack) throw new Error('前置：未点击返回配置重试');
      const main = page.locator('main');
      await expect(page.getByTestId('svc-org-analysis-records')).toBeVisible({ timeout: 15000 });
      await expect(page.getByRole('tab', { name: '分析记录' })).toHaveAttribute('aria-selected', 'true');
      await expect(main.getByRole('columnheader', { name: '任务号' })).toBeVisible();
      await expect(main.getByRole('columnheader', { name: '操作' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
