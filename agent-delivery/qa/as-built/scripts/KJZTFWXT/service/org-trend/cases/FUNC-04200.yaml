id: FUNC-04200
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04200
priority: P1
tier: A
title: 备选-配置区清空 · 清空已选机构
story: US-SVC-ORG-04
entry_id: svc-org-trend
preconditions:
  - 产业领域已选「生物」
  - 配置区已回显一家机构（D2：弹窗空名单时用深链 org_ids 回填，见 fixtures/testdata known_org_id）
locators:
  clear_btn: button「清空」
  config: '[data-testid="svc-org-analysis-config"]'
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 1、已选机构变为 0 家
    assert: |-
      const knownOrg = '79bbcfc0e68027808f1f4caf1b6f0469';
      const route = '/service/institution-judgment?workspace=trend&tab=trend';
      const bioIndustry = 'CL-SEI-02.INB2503';
      const deeplink =
        route + '&industry=' + encodeURIComponent(bioIndustry) + '&org_ids[]=' + knownOrg;
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (
          await close.count() &&
          (await close.first().isVisible().catch(() => false)) &&
          (await close.first().isEnabled().catch(() => false))
        ) {
          try {
            await close.first().click({ timeout: 1500 });
            await page.waitForTimeout(300);
          } catch {}
        }
      };
      const configShell = () => page.locator('[data-testid="svc-org-analysis-config"], main').first();
      const mainText = async () => ((await configShell().innerText().catch(() => '')) || '').trim();
      const industryBioOk = (txt) =>
        /产业领域/.test(txt) &&
        (/[^一-龥]生物[^一-龥]|^生物$|生物产业|生物医药/.test(txt) || /生物/.test(txt.split('产业领域')[1] || ''));
      const ensureBioIndustry = async () => {
        let body = await mainText();
        if (industryBioOk(body)) return;
        const flat = page.locator('main .industry-catalog-select.arco-select-view, main .industry-catalog-select').first();
        if (await flat.isVisible().catch(() => false)) {
          await flat.click({ timeout: 8000 });
          await page.waitForTimeout(600);
          const opt = page
            .locator('.arco-trigger-popup:visible .arco-select-option')
            .filter({ hasText: /^生物$/ })
            .or(page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /生物/ }))
            .first();
          if (await opt.count()) {
            await opt.click({ timeout: 5000 });
            await page.waitForTimeout(800);
            body = await mainText();
            if (industryBioOk(body)) return;
          }
          await page.keyboard.press('Escape').catch(() => {});
        }
        await page.goto(baseUrl + deeplink.split('&org_ids')[0], { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        body = await mainText();
        if (!industryBioOk(body) && !page.url().includes('INB2503') && !/生物/.test(body)) {
          throw new Error('前置：产业领域未选「生物」 body=' + body.slice(0, 280));
        }
      };
      const ensureOneOrg = async () => {
        if (/view=processing|view=result/.test(page.url())) {
          await page.goto(baseUrl + deeplink, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
        }
        await dismissBasket();
        await page.goto(baseUrl + deeplink, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2500);
        await expect(page.getByRole('tab', { name: '服务机构新增趋势分析', exact: true }).first()).toBeVisible({
          timeout: 12000,
        });
        await ensureBioIndustry();
        let body = await mainText();
        if (!body) throw new Error('ENV-SVC-ORG-TREND-EMPTY-MAIN：趋势主区无文案');
        const clrProbe = configShell().getByRole('button', { name: '清空', exact: true });
        if (!(await clrProbe.count())) {
          throw new Error(
            'D2-SVC-ORG-TREND-NO-CLEAR：配置区无「清空」（新壳仅产业级联+领域数，无已选机构/分析配置壳） body=' +
              body.slice(0, 220),
          );
        }
        const oneOk =
          /已选机构（1\s*家）/.test(body) ||
          body.includes(knownOrg.slice(0, 12)) ||
          page.url().includes(knownOrg);
        if (!oneOk) {
          const pick = configShell().getByRole('button', { name: '选择机构', exact: true }).first();
          if (!(await pick.isVisible().catch(() => false))) {
            throw new Error(
              'D2-SVC-ORG-TREND-NO-ORG-PICKER：配置区无「选择机构」且深链未回显一家机构 body=' + body.slice(0, 240),
            );
          }
          await pick.click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first();
          await expect(dialog).toBeVisible({ timeout: 8000 });
          const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
          if ((await checks.count()) < 1) throw new Error('ENV-SVC-ORG-TREND-NO-ORGS：弹窗与深链均无法回填一家机构');
          await checks.first().click({ timeout: 5000 });
          await dialog.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
          await page.waitForTimeout(1000);
          body = await mainText();
        }
        if (!/已选机构（1\s*家）/.test(body) && !page.url().includes(knownOrg)) {
          throw new Error('前置未满足一家机构：body=' + body.slice(0, 280));
        }
        const clr = configShell().getByRole('button', { name: '清空', exact: true }).first();
        if (!(await clr.isVisible().catch(() => false))) {
          throw new Error('D2：配置区未见「清空」按钮（无旧分析配置壳） body=' + body.slice(0, 240));
        }
        await clr.click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        globalThis.__p04200 = { knownOrg };
      };
      await ensureOneOrg();
      const bodyAfter = await mainText();
      const tags = configShell().locator('.arco-tag.svc-org-pick-tag');
      const tagN = await tags.count();
      const zeroOk =
        /已选机构（0\s*家）/.test(bodyAfter) ||
        ((/未选择机构/.test(bodyAfter) || /请先选择分析机构|请先确认分析条件/.test(bodyAfter)) &&
          !/已选机构（[1-9]/.test(bodyAfter));
      if (!zeroOk || tagN > 0) {
        throw new Error('清空后已选机构未归零 tagN=' + tagN + ' body=' + bodyAfter.slice(0, 320));
      }
      if (bodyAfter.includes(globalThis.__p04200.knownOrg) && /已选机构/.test(bodyAfter)) {
        throw new Error('清空后仍回显机构 id 片段');
      }
  - note: 2、产业领域仍为「生物」
    assert: |-
      if (!globalThis.__p04200) throw new Error('前置：未执行配置区清空');
      const body = ((await page.locator('[data-testid="svc-org-analysis-config"], main').first().innerText().catch(() => '')) || '').trim();
      const bioKept =
        (/产业领域/.test(body) && /生物/.test(body)) ||
        /生物产业|生物医药/.test(body) ||
        /industry=.*INB2503|INB2503/.test(page.url());
      if (!bioKept) {
        throw new Error('清空机构后产业领域非「生物」 url=' + page.url() + ' body=' + body.slice(0, 320));
      }
      if (/新一代信息技术/.test(body) && !/生物/.test(body)) {
        throw new Error('产业领域被切回非生物：' + body.slice(0, 280));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  FUNC-04200；步骤：产业领域「生物」+ 一家机构 → 配置区「清空」。生物产业深链 industry=CL-SEI-02.INB2503（scout-p011）或平铺下拉选「生物」；
  机构 D2：org_ids[]=testdata known_org_id 或弹窗选 1 家。2026-10-21 30892 关评审后无「分析配置」/「清空」/「已选机构」（仅产业级联+入库数/领域数）→ D2-SVC-ORG-TREND-NO-CLEAR。catalog_path entry-seed。
