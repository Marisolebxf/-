id: FUNC-04200
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04200
priority: P1
tier: B
title: 备选-配置区清空
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: evaluate
    note: 展开产业领域下拉
    script: |-
      const shell = page.getByTestId('svc-org-analysis-config');
      await expect(shell).toBeVisible({ timeout: 12000 });
      await shell.locator('.arco-cascader-view').first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
  - action: evaluate
    note: 选择「生物」
    script: |-
      const popup = page.locator('.arco-cascader-popup-visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const bio = popup.locator('.arco-cascader-option').filter({ hasText: /^生物$/ }).first();
      await expect(bio).toBeVisible({ timeout: 8000 });
      await bio.click({ timeout: 8000 });
      await page.waitForTimeout(400);
  - action: evaluate
    note: 选择机构并勾选一家后确定
    script: |-
      const shell = page.getByTestId('svc-org-analysis-config');
      const pick = shell.getByRole('button', { name: '选择机构', exact: true });
      await expect(pick.first()).toBeVisible({ timeout: 12000 });
      await pick.first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择服务/ }).first();
      await expect(dialog).toBeVisible({ timeout: 15000 });
      await dialog.getByRole('checkbox').first().click({ timeout: 8000 });
      await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await expect(dialog).toBeHidden({ timeout: 12000 });
      await page.waitForTimeout(600);
  - action: evaluate
    note: 点击配置区「清空」
    script: |-
      const shell = page.getByTestId('svc-org-analysis-config');
      const clr = shell.getByRole('button', { name: '清空', exact: true });
      await expect(clr.first()).toBeVisible({ timeout: 8000 });
      await clr.first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
expect:
  - note: 1、已选机构变为 0 家
    assert: |-
      const shell = page.getByTestId('svc-org-analysis-config');
      const body = ((await shell.innerText().catch(() => '')) || '').trim();
      const zeroOk =
        /已选机构（\s*0\s*家）/.test(body) ||
        (/未选择机构/.test(body) && !/已选机构（\s*[1-9]/.test(body));
      if (!zeroOk) {
        throw new Error('已选机构未归零 body=' + body.slice(0, 320));
      }
      await expect(shell.locator('.svc-org-pick-tag')).toHaveCount(0, { timeout: 5000 });
  - note: 2、产业领域仍为「生物」
    assert: |-
      const shell = page.getByTestId('svc-org-analysis-config');
      await expect(shell).toContainText('生物', { timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
