id: P0-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00659
priority: P0
tier: A
title: 开始分析门控与显式触发（空态引导文案 + 选机构后进 processing）
story: US-SVC-ORG-04
entry_id: svc-org-trend
preconditions:
  - 已登录 admin
  - 直达 trend 配置空态（无 org_ids / view）
locators:
  start: button「开始分析」
  pick: button「选择机构」
  empty_hint: 请先选择分析机构
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 未选机构时点击「开始分析」仍停留配置态，并给出先选机构引导文案（勿硬判 disabled）
    assert: |-
      await page.goto('http://111.198.38.90:50892/service/institution-judgment?workspace=trend&tab=trend', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); if (/org_ids|view=/.test(page.url())) { await page.goto('http://111.198.38.90:50892/service/institution-judgment?workspace=trend&tab=trend', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500) }; const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const main0 = page.locator('main').first(); const t0 = await main0.innerText().catch(() => ''); if (/已选机构（[1-9]/.test(t0 || '')) { const clr = main0.getByRole('button', { name: '清空' }); if (await clr.count()) { await clr.first().click({ timeout: 5000 }); await page.waitForTimeout(500) } }; await expect(page.getByText(/已选机构（0\s*家）|未选择机构/).first()).toBeVisible({ timeout: 8000 }); const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeVisible({ timeout: 8000 }); await start.click(); await page.waitForTimeout(800); await expect(page.getByText(/请先选择分析机构/).first()).toBeVisible({ timeout: 8000 }); if (/view=processing|view=result/.test(page.url())) throw new Error('空态点击开始分析不应进入过程/结果: ' + page.url())
  - note: 选定 1 家机构后显式点击「开始分析」进入 view=processing（不断言有数折线）
    assert: |-
      const close2 = page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(() => false) && await close2.first().isEnabled().catch(() => false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.getByRole('button', { name: '选择机构' }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const dialog = page.locator('.arco-modal:visible').filter({ hasText: '选择服务机构' }).first(); await expect(dialog).toBeVisible({ timeout: 8000 }); const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)'); if ((await checks.count()) < 1) throw new Error('机构弹窗无可勾选项'); await checks.first().click({ timeout: 5000 }); await page.waitForTimeout(300); await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 }); await page.waitForTimeout(1000); await expect(page.getByText(/已选机构（[1-9]\d*\s*家）/).first()).toBeVisible({ timeout: 8000 }); const start2 = page.getByRole('button', { name: '开始分析' }).first(); await expect(start2).toBeEnabled({ timeout: 8000 }); await start2.click(); await page.waitForTimeout(3500); const url = page.url(); const main = ((await page.locator('main').first().innerText().catch(() => '')) || ''); const processOk = /view=processing/.test(url) || /分析过程|生成中|任务状态|demo_state=processing/.test(main + url); if (!processOk) throw new Error('未进入 processing 态 url=' + url + ' main=' + main.slice(0, 240))
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  蓝本 FUNC-00659；D1：空态「开始分析」enabled=true，靠文案「请先选择分析机构」门控（D1-SVC-ORG-TREND-SOFT-START-GATE）；禁止 toBeDisabled。显式触发后须达 view=processing。禁止断言有数折线（ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD）。同条件单飞/当天复用深验归 00667。A 档零 allow_skip。list 相对父键 2 空格缩进。
