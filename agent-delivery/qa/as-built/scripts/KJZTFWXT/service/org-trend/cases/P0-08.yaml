skip_reason: >-
  本条深验（明细表机构名下钻画像抽屉 + 关闭后滚动保留）依赖结果快照年序列才有明细行与 svc-org-link。
  对齐同入口 P0-06/P0-07/P0-11：allow_skip_target=.svc-org-trend__legend button——
  goto 深链结果壳后 5s 图例按钮不可见 → runner 记 n/a（合法环境债，禁止断言内 SKIP throw→fail）。
