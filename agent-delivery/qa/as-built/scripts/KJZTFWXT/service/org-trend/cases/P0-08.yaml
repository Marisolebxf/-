  年序列到位、图例按钮可见后不触发 skip，三条 expect 全量机跑（画像抽屉内容归画像用例集，本条只核可达与返回）。
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已完成一次有效分析、结果态可见（env-gate G7；本条只读既有结果壳）
  - 无头实勘 scout-p008-detail.json（诚实空分支 → 预期 verdict=n/a；有序列时图例可见转实跑）
locators:
  result_deeplink: /service/institution-judgment?workspace=trend&tab=records&view=result&demo_state=result
  view_result: button「查看结果」
  legend: .svc-org-trend__legend button
  detail_zone: 文案「主领域年度明细」
  org_link: button.svc-org-link（aria-label=查看{机构名}画像，明细表「代表机构」列）
  profile_drawer: '.arco-drawer（机构画像抽屉，workspace 级挂载；内容归画像用例集）'
  drawer_close: .arco-drawer .arco-drawer-close-btn
  honest_empty: 暂无主领域年度明细 / 当前结果快照没有年序列
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=records&view=result&demo_state=result
    note: 深链结果壳（P8 自含）；allow_skip 在本步后探测图例按钮——诚实空 5s 不可见→n/a；有序列则继续 expect
expect:
  - note: 已进入结果态且明细区块呈现——结果壳含「服务机构新增数量趋势」与「主领域年度明细」（用例前置承载；allow_skip 已保证有图例/年序列）
    assert: |-
      await page.waitForTimeout(800);
      const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      let url0 = page.url(); let body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (!(/view=result/.test(url0) && /服务机构新增数量趋势/.test(body0))) {
        const recTab = page.locator('[role=tab][data-tab-key="records"]');
        if (await recTab.count()) { await recTab.click({ timeout: 8000 }); await page.waitForTimeout(1200) }
        const vr = page.getByRole('button', { name: '查看结果' }).first();
        await expect(vr).toBeVisible({ timeout: 12000 }); await vr.click({ timeout: 8000 }); await page.waitForTimeout(2500);
        url0 = page.url(); body0 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      }
      if (!(/view=result/.test(url0) && /服务机构新增数量趋势/.test(body0))) throw new Error('未到达结果壳 url=' + url0 + ' body=' + body0.slice(0, 240));
      if (/当前结果快照没有年序列/.test(body0)) throw new Error('结果壳仍无年序列（allow_skip 前置应已挡；环境漂移）');
      if (!(await page.locator('main').getByText('主领域年度明细').count())) throw new Error('结果壳未见「主领域年度明细」区块，下钻载体缺失');
      console.log('[P0-08 observed] 结果壳明细区块在；rows=' + (await page.locator('main table tbody tr').count().catch(() => 0)))
  - note: 点击明细表任一机构名打开机构画像抽屉（用例预期 1；allow_skip 已保证有图例/年序列；抽屉内容归画像用例集，只核可达）
    assert: |-
      const orgLinks = page.locator('main button.svc-org-link');
      if ((await orgLinks.count()) < 1) {
        const zoneTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (/暂无主领域年度明细|当前结果快照没有年序列/.test(zoneTxt)) throw new Error('明细表诚实空（allow_skip 前置应已挡；环境漂移）');
        throw new Error('有明细行但未见机构名按钮 svc-org-link——预期「点击机构名打开画像」入口缺失');
      }
      const link = orgLinks.first(); await link.scrollIntoViewIfNeeded(); await page.waitForTimeout(400);
      await link.click({ timeout: 6000 });
      await expect(page.locator('.arco-drawer').first()).toBeVisible({ timeout: 8000 });
      const dTxt = ((await page.locator('.arco-drawer').first().innerText().catch(() => '')) || '');
      console.log('[P0-08 observed] 画像抽屉已打开 title/首屏=' + dTxt.replace(/\n/g, ' / ').slice(0, 160) + '；抽屉内容归画像用例集，本条只核可达（开放项 3）')
  - note: 关闭抽屉后回到明细表且滚动位置保留（用例预期 2；allow_skip 已保证有图例/年序列；scrollY 前后差 ≤2px）
    assert: |-
      const links2 = page.locator('main button.svc-org-link');
      if ((await links2.count()) < 1) throw new Error('明细区无机构名按钮（allow_skip 前置应已挡；环境漂移）');
      const link2 = links2.first(); await link2.scrollIntoViewIfNeeded(); await page.waitForTimeout(400);
      await page.evaluate(() => window.scrollBy(0, -40)); await page.waitForTimeout(300);
      const y0 = await page.evaluate(() => window.scrollY);
      await link2.click({ timeout: 6000 });
      await expect(page.locator('.arco-drawer').first()).toBeVisible({ timeout: 8000 });
      await page.locator('.arco-drawer .arco-drawer-close-btn').first().click({ timeout: 5000 });
      await page.waitForTimeout(800);
      const y1 = await page.evaluate(() => window.scrollY);
      const zoneBack = await page.locator('main').getByText('主领域年度明细').count();
      console.log('[P0-08 observed] scrollY before=' + y0 + ' after=' + y1 + ' delta=' + Math.abs(y1 - y0) + ' 明细区块回归=' + (zoneBack > 0));
      if (!(await page.locator('.arco-drawer').first().isVisible().catch(() => false) === false)) throw new Error('关闭后抽屉仍可见——预期「关闭抽屉」未承载');
      if (!zoneBack) throw new Error('关闭后未见明细区块，返回态异常');
      if (Math.abs(y1 - y0) > 2) throw new Error('滚动位置未保留 before=' + y0 + ' after=' + y1 + '——预期「关闭后趋势图滚动位置保留」未承载')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6；allow_skip 前置图例不可见 → n/a 归 ENV-SVC-ORG-TREND-NO-SERIES-PAYLOAD（证据 scout-p008-detail.json + scout-p008-detail-empty.png + env-gate G6，非产品缺陷）；图例可见后实跑红（无 svc-org-link / 抽屉不开 / 滚动丢失）按 D3 挂缺陷单（画像抽屉内容缺失归画像用例集，不在本条挂票）
