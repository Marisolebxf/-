id: FUNC-00658
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00658
priority: P0
tier: B
title: 主流程-选择机构与回显
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 1、弹窗标题为「选择服务机构」
    assert: |-
      const main = page.locator('main').first();
      async function openOrgPicker() {
        const pickBtn = main.getByRole('button', { name: '选择机构', exact: true });
        if (await pickBtn.count()) {
          await pickBtn.first().click({ timeout: 12000 });
          return;
        }
        const basketBtn = main.getByRole('button', { name: '打开对比篮' });
        if (await basketBtn.count()) {
          await basketBtn.first().click({ timeout: 12000 });
          return;
        }
        const url = new URL(page.url());
        url.searchParams.set('open_compare_basket', '1');
        url.searchParams.set('compare_basket_mode', 'picker');
        url.searchParams.set('compare_object_type', 'service_org');
        url.searchParams.set('compare_picker_min', '1');
        url.searchParams.set('compare_picker_max', '50');
        await page.goto(url.toString(), { waitUntil: 'domcontentloaded' });
      }
      await openOrgPicker();
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择服务/ }).first();
      await expect(dialog).toBeVisible({ timeout: 15000 });
      await expect(dialog.getByText('选择服务机构').first()).toBeVisible({ timeout: 8000 });
  - note: 2、确定后配置区回显该已选机构
    assert: |-
      const main = page.locator('main').first();
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择服务/ }).first();
      const box = dialog.getByRole('checkbox').first();
      await box.click({ timeout: 8000 });
      const orgName = (await box.locator('xpath=ancestor::label[1]').innerText().catch(async () => '')).trim().split('\n')[0]?.trim() || '';
      await dialog.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
      await expect(dialog).toBeHidden({ timeout: 12000 });
      if (orgName) {
        await expect(main.getByText(orgName, { exact: false }).first()).toBeVisible({ timeout: 12000 });
      } else {
        await expect(main.getByText(/已选机构（\s*1\s*家）|来源：对比篮/).first()).toBeVisible({ timeout: 12000 });
      }
  - note: 3、取消后原先选中的机构仍在
    assert: |-
      const main = page.locator('main').first();
      const saved = (await main.locator('.svc-org-pick-tag').first().innerText().catch(async () => '')).trim();
      async function openOrgPicker() {
        const pickBtn = main.getByRole('button', { name: '选择机构', exact: true });
        if (await pickBtn.count()) {
          await pickBtn.first().click({ timeout: 12000 });
          return;
        }
        const basketBtn = main.getByRole('button', { name: /打开对比篮/ });
        if (await basketBtn.count()) {
          await basketBtn.first().click({ timeout: 12000 });
          return;
        }
        const url = new URL(page.url());
        url.searchParams.set('open_compare_basket', '1');
        url.searchParams.set('compare_basket_mode', 'picker');
        url.searchParams.set('compare_object_type', 'service_org');
        url.searchParams.set('compare_picker_min', '1');
        url.searchParams.set('compare_picker_max', '50');
        await page.goto(url.toString(), { waitUntil: 'domcontentloaded' });
      }
      await openOrgPicker();
      const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择服务/ }).first();
      await expect(dialog).toBeVisible({ timeout: 15000 });
      await dialog.getByRole('button', { name: '取消' }).click({ timeout: 8000 });
      await expect(dialog).toBeHidden({ timeout: 12000 });
      if (saved) {
        await expect(main.getByText(saved, { exact: false }).first()).toBeVisible({ timeout: 8000 });
      } else {
        const u = new URL(page.url());
        const ids = u.searchParams.getAll('org_ids[]');
        if (ids.length) {
          await expect(main.getByText(ids[0], { exact: false }).first()).toBeVisible({ timeout: 8000 });
        } else {
          throw new Error('取消后无法验证已选机构仍保留：配置区无标签且 URL 无 org_ids');
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
