      if (/当前结果快照没有年序列/.test(body)) throw new Error('仍无年序列（allow_skip 前置应已挡；环境漂移）');
      const canvas = page.locator('main canvas').first();
      if (!(await canvas.count())) throw new Error('有年序列/图例前置下未见趋势图 canvas，悬停载体缺失');
      const box = await canvas.boundingBox();
      if (!box) throw new Error('趋势图 canvas 不可定位（boundingBox=null）');
      let tip = null;
      for (const fx of [0.35, 0.45, 0.55, 0.65]) { for (const fy of [0.45, 0.55]) { await page.mouse.move(box.x + box.width * fx, box.y + box.height * fy, { steps: 6 }); await page.waitForTimeout(600); const cand = await page.evaluate(() => { const main = document.querySelector('main') || document.body; return [...main.querySelectorAll('div')].filter((d) => { const s = getComputedStyle(d); return s.position === 'absolute' && (s.pointerEvents === 'none' || +s.zIndex > 0) && (d.offsetWidth > 0 || d.offsetHeight > 0) && (d.innerText || '').trim().length > 0 && !d.querySelector('canvas'); }).map((d) => ({ text: (d.innerText || '').trim().slice(0, 200), cls: (d.className || '').toString().slice(0, 80) })); }); const hit = cand.find((t) => /\d{4}/.test(t.text) && /(新增|数量)/.test(t.text)); if (hit) { tip = hit; break; } } if (tip) break; }
