    assert: |-
      const body2 = ((await page.locator('main').first().innerText().catch(() => '')) || '');
      if (/当前结果快照没有年序列/.test(body2)) throw new Error('仍无年序列（allow_skip 前置应已挡；环境漂移）');
      const probe = await page.evaluate(() => { const main = document.querySelector('main') || document.body; let infoVisible = 0; const metricAria = []; const demoText = []; for (const el of main.querySelectorAll('.arco-icon-info-circle, .arco-icon-info, [aria-label*="M_SVC_ORG_NEW_COUNT"], [data-metric-id]')) { if (el.offsetWidth || el.offsetHeight) infoVisible++; const a = el.getAttribute('aria-label') || ''; const m = el.getAttribute('data-metric-id') || ''; if (/M_SVC_ORG_NEW_COUNT/.test(a + ' ' + m)) metricAria.push((a || m).slice(0, 60)); } for (const el of main.querySelectorAll('*')) { if (el.children.length) continue; const t = (el.textContent || '').trim(); if (/^演示/.test(t) && t.length < 40) demoText.push(t); } return { infoVisible, metricAria: metricAria.slice(0, 5), demoText: demoText.slice(0, 5) }; });
      console.log('[P0-07 observed] ⓘ/演示角标实勘=' + JSON.stringify(probe) + '（用例备注开放项 3：数据到位后按实勘记录、不硬断言防伪红；实跑后确实无 ⓘ 由人工按 D9 判定是否挂缺陷）')
