id: FUNC-04188
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04188
priority: P1
tier: B
title: 主流程-已选机构发起
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
expect:
  - note: 1、结果页出现「服务机构新增数量趋势」
    assert: |-
      const route = '/service/institution-judgment?workspace=trend&tab=trend';
      const knownOrg = '79bbcfc0e68027808f1f4caf1b6f0469';
      const deeplink = route + '&industry=INB1701&org_ids[]=' + knownOrg;
      const main = page.locator('main').first();
      const resetConfig = async () => {
        if (/view=processing|view=result/.test(page.url())) {
          await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
        }
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          try {
            await close.first().click({ timeout: 1500 });
            await page.waitForTimeout(300);
          } catch {}
        }
      };
      await resetConfig();
      await page.goto(baseUrl + route, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1500);
      async function openOrgPicker() {
        const pickBtn = main.getByRole('button', { name: '选择机构', exact: true });
        if (await pickBtn.isVisible().catch(() => false)) {
          await pickBtn.click({ timeout: 12000 });
          return true;
        }
        const basketBtn = main.getByRole('button', { name: /打开对比篮/ });
        if (await basketBtn.count() && (await basketBtn.first().isVisible().catch(() => false))) {
          await basketBtn.first().click({ timeout: 12000 });
          return true;
        }
        const url = new URL(page.url());
        url.searchParams.set('open_compare_basket', '1');
        url.searchParams.set('compare_basket_mode', 'picker');
        url.searchParams.set('compare_object_type', 'service_org');
        url.searchParams.set('compare_picker_min', '1');
        url.searchParams.set('compare_picker_max', '50');
        await page.goto(url.toString(), { waitUntil: 'domcontentloaded' });
        return true;
      }
      let orgReady =
        page.url().includes(knownOrg) ||
        /已选机构（\s*1\s*家）/.test((await main.innerText().catch(() => '')) || '');
      if (!orgReady) {
        const opened = await openOrgPicker();
        if (opened) {
          await page.waitForTimeout(800);
          const dialog = page.locator('.arco-modal:visible, [role="dialog"]').filter({ hasText: /选择服务|对比篮|服务机构/ }).first();
          if (await dialog.isVisible().catch(() => false)) {
            const checks = dialog.locator('.arco-checkbox:not(.arco-checkbox-disabled)');
            if ((await checks.count()) >= 1) {
              await checks.first().click({ timeout: 8000 });
              await page.waitForTimeout(300);
              const ok = dialog.getByRole('button', { name: '确定', exact: true });
              if (await ok.count()) await ok.click({ timeout: 8000 });
              else await dialog.getByRole('button', { name: /确定|完成|加入/ }).first().click({ timeout: 8000 });
              await page.waitForTimeout(1000);
            }
          }
        }
        orgReady =
          page.url().includes(knownOrg) ||
          /已选机构（\s*[1-9]\s*家）/.test((await main.innerText().catch(() => '')) || '');
        if (!orgReady) {
          await page.goto(baseUrl + deeplink, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
          orgReady = page.url().includes(knownOrg);
        }
        if (!orgReady) throw new Error('无法选定一家机构（无选择机构/对比篮且深链未生效）');
      }
      const start = page.getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start).toBeVisible({ timeout: 12000 });
      await start.click({ timeout: 15000 });
      let tid = null;
      for (let i = 0; i < 45; i++) {
        await page.waitForTimeout(1000);
        const u = page.url();
        const m = u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/);
        if (m) tid = m[1];
        const body = ((await page.locator('main').last().innerText().catch(() => '')) || '');
        if (/分析结果已生成/.test(body) && (await page.getByRole('button', { name: '查看结果', exact: true }).first().isVisible().catch(() => false))) break;
        if (/[?&]view=processing/.test(u) && /已完成/.test(body)) break;
      }
      if (!tid) {
        const m2 = page.url().match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/);
        tid = m2 ? m2[1] : null;
      }
      if (!tid) throw new Error('开始分析后未进入过程态: ' + page.url());
      const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(vr).toBeVisible({ timeout: 20000 });
      await vr.click({ timeout: 10000 });
      await page.waitForURL((u) => /[?&]view=result/.test(String(u)), { timeout: 20000 });
      await page.waitForTimeout(1500);
      const rbody = ((await page.locator('main').last().innerText().catch(() => '')) || '');
      await expect(page.getByText('服务机构新增数量趋势').first()).toBeVisible({ timeout: 12000 });
      globalThis.__p04188TaskId = tid;
  - note: 2、结果页可见「返回配置」
    assert: |-
      await expect(page.getByRole('button', { name: '返回配置', exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、结果页可见「重新分析」
    assert: |-
      await expect(page.getByRole('button', { name: '重新分析', exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
