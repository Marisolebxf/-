id: FUNC-04203
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04203
priority: P1
tier: B
title: 备选-搜索机构无匹配时不发起分析
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: click
    target: |-
      await page.locator('main').getByRole('button', { name: '选择机构' }).first().click()
  - action: click
    target: |-
      await expect(page.getByRole('dialog').filter({ hasText: '选择服务机构' })).toBeVisible()
  - action: fill
    target: |-
      await page.getByRole('dialog').getByPlaceholder('搜索机构名称 / 类型').fill('zzz_no_match_FUNC_04203')
expect:
  - note: 金融服务等分组名单不出现
    assert: |-
      const dlg = page.getByRole('dialog').filter({ hasText: '选择服务机构' })
      await expect(dlg).toBeVisible()
      await expect(dlg.getByText('金融服务', { exact: true })).toHaveCount(0)
      await expect(dlg.getByText('科技创新服务', { exact: true })).toHaveCount(0)
      await expect(dlg.getByText('咨询服务', { exact: true })).toHaveCount(0)
  - note: 页面不进入过程页
    assert: |-
      await expect(page).not.toHaveURL(/view=processing/)
      await expect(page.locator('main').getByRole('button', { name: '开始分析' }).first()).toBeVisible()
on_fail: 截图 + 抄 X-Trace-Id
