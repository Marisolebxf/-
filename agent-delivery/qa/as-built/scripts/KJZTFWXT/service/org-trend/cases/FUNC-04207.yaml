id: FUNC-04207
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04207
priority: P1
tier: B
title: 当天同机构再次开始分析应复用已有结果且不新建任务
entry_id: svc-org-trend
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=trend&tab=trend
  - action: click
    target: testid=svc-org-start-analysis
  - action: assert_visible
    target: 查看结果
  - action: click
    target: 查看结果
  - action: assert_visible
    target: 服务机构新增数量趋势
  - action: evaluate
    target: window.__qaTrendTaskId=new URL(location.href).searchParams.get('task_id')||''
  - action: click
    target: 返回配置
  - action: click
    target: testid=svc-org-start-analysis
expect:
  - note: 1、打开当天已有结果
    assert: |-
      const main = page.locator('main');
      const viewResult = main.getByRole('button', { name: '查看结果' });
      if (await viewResult.isVisible().catch(() => false)) {
        await viewResult.click();
      }
      await expect(main.getByText('服务机构新增数量趋势')).toBeVisible({ timeout: 120000 });
  - note: 2、不新增分析任务
    assert: |-
      const after = new URL(page.url()).searchParams.get('task_id') || '';
      const before = await page.evaluate(() => window.__qaTrendTaskId || '');
      await expect(after).toBe(before);
      await expect(page.locator('main')).not.toContainText('任务已创建，正在展示分析过程');
on_fail: 截图 + 抄 X-Trace-Id
