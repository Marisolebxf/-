id: FUNC-04315
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04315
priority: P1
tier: B
title: 空篮 · 管理对比篮打开系统篮浮层
story: US-SVC-ORG-08
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - 对比篮没有服务机构；评估页可见「管理对比篮」
locators:
  basket_empty_alert: '[data-testid="svc-org-cap-basket-empty"]'
  manage_btn: button「管理对比篮」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 空篮态点击「管理对比篮」（真实操作在 expect 内）
expect:
  - note: 1、浮层标题为「选择分析服务机构」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const countCapTags = async () =>
        page.locator('.svc-org-cap-compare__tags .arco-tag').count();
      const pickerScope = () =>
        page.locator('[data-system-surface-id="compare-basket"]').filter({ hasText: '选择分析服务机构' });
      const clearBasketViaPicker = async () => {
        const imp = page.locator('[data-testid="svc-org-cap-import-basket"]').first();
        if (await imp.isVisible().catch(() => false)) {
          await imp.click({ timeout: 8000 });
          await page.waitForTimeout(900);
        }
        const ret = page
          .locator('[data-testid="svc-org-cap-open-basket"]')
          .or(page.getByRole('button', { name: '返回对比篮', exact: true }))
          .first();
        await expect(ret).toBeVisible({ timeout: 8000 });
        await ret.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const scope = pickerScope();
        await expect(scope).toBeVisible({ timeout: 10000 });
        const clearBtn = scope.getByRole('button', { name: '清空对比篮', exact: true });
        await clearBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const modal = page.locator('.arco-modal:visible').filter({ hasText: '清空对比篮' }).last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        const okBtn = modal.getByRole('button', { name: '确定', exact: true }).or(modal.locator('.arco-btn-primary'));
        await okBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
      };
      const ensureEmptyOnCapPage = async () => {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        let tagN = await countCapTags();
        if (tagN >= 1) {
          await clearBasketViaPicker();
          tagN = await countCapTags();
        }
        if (tagN >= 1) {
          throw new Error('ENV-SVCCAP-BASKET-NOT-EMPTY-001：前置需空篮，当前 tags=' + tagN);
        }
        await expect(page.locator('[data-testid="svc-org-cap-basket-empty"]')).toBeVisible({ timeout: 8000 });
        const mgBtn = page.getByRole('button', { name: '管理对比篮', exact: true });
        await expect(mgBtn).toBeVisible({ timeout: 8000 });
        await mgBtn.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        globalThis.__func04315 = { pickerOpen: true };
      };
      await ensureEmptyOnCapPage();
      const scope = pickerScope();
      await expect(scope).toBeVisible({ timeout: 10000 });
      await expect(scope.getByText('选择分析服务机构', { exact: true }).first()).toBeVisible({ timeout: 10000 });
  - note: 2、「篮内服务机构」显示「对比篮暂无服务机构」
    assert: |-
      if (!globalThis.__func04315?.pickerOpen) throw new Error('前置：未打开选择分析服务机构浮层');
      const scope = page.locator('[data-system-surface-id="compare-basket"]').filter({ hasText: '选择分析服务机构' });
      await expect(scope).toBeVisible({ timeout: 8000 });
      await expect(scope.getByText('篮内服务机构').first()).toBeVisible({ timeout: 8000 });
      await expect(scope.getByText('对比篮暂无服务机构', { exact: true }).first()).toBeVisible({ timeout: 10000 });
  - note: 3、空态下有按钮「新增」
    assert: |-
      if (!globalThis.__func04315?.pickerOpen) throw new Error('前置：未打开选择分析服务机构浮层');
      const scope = page.locator('[data-system-surface-id="compare-basket"]').filter({ hasText: '选择分析服务机构' });
      await expect(scope).toBeVisible({ timeout: 8000 });
      const addBtn = scope.getByRole('button', { name: '新增', exact: true }).first();
      await expect(addBtn).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；无法清至空篮→ENV-SVCCAP-BASKET-NOT-EMPTY-001
as_built_note: >-
  用例册 FUNC-04315（空篮「管理对比篮」→系统篮 picker）。前置空篮：tags=0 直点；tags≥1 则 import→返回对比篮→清空确定→回 capability。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04315。零 allow_skip。
