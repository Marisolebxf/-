id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00672
priority: P0
tier: A
title: 技术力评价模型区五维名称与默认权重合计 100%
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=fail（本条只验配置态模型区，不测开始评估放行）
locators:
  model_heading: 「技术力评价模型」
  dims: 专利数量 / 研发投入 / 核心专家 / 成功案例 / 标准制定
  weight_sum: 「权重合计： 100% 已对齐」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
expect:
  - note: 区块标题为「技术力评价模型」且口径说明文案可见
    assert: |-
      await page.goto('http://111.198.38.90:50892/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('技术力评价模型', { exact: true }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/内置维度与招标一致/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/启停与权重只做|UI 门控|不在前端算分/).first()).toBeVisible({ timeout: 8000 })
  - note: 五维行齐全：专利数量/研发投入/核心专家/成功案例/标准制定
    assert: |-
      for (const n of ['专利数量','研发投入','核心专家','成功案例','标准制定']) await expect(page.getByText(n, { exact: true }).first()).toBeVisible({ timeout: 8000 })
  - note: 默认权重依次为 25/25/20/20/10 且权和=100，汇总「权重合计：100% 已对齐」
    assert: |-
      const spins = page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(5, { timeout: 8000 }); const vals = []; for (let i = 0; i < 5; i++) vals.push(String(await spins.nth(i).inputValue())); if (vals.join(',') !== '25,25,20,20,10') throw new Error('默认权重 ' + vals.join('/') + ' ≠ 25/25/20/20/10'); const sum = vals.reduce((a,b)=>a+Number(b),0); if (sum !== 100) throw new Error('权重和 ' + sum); await expect(page.getByText(/权重合计：\s*100%/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/已对齐/).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: env-gate overall=fail（篮内机构不足）但模型区可达；本条只测配置态五维+默认权重，禁止开始评估放行。实勘标题「技术力评价模型」；五维 aria-label=「*权重」；汇总文案「权重合计： 100% 已对齐」（冒号后空格）；默认 25/25/20/20/10 非均分。列表相对父键 2 空格缩进（runner 子集）。零 allow_skip。
