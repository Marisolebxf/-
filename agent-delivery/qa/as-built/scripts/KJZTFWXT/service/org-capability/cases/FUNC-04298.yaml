id: FUNC-04298
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04298
priority: P0
tier: A
title: 主流程-重新分析 · 新的一轮结果
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已用两家机构打开结果页；当前仍是这组机构
  - 已进入 capability 工作区（catalog_path）
locators:
  start_btn: '[data-testid="svc-org-start-eval"]'
  view_result: button「查看结果」
  reanalyze: button「重新分析」
  result_title: 「技术力横向对比结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 两家机构结果页→重新分析→新过程页「查看结果」（真实操作在 expect 内）
expect:
  - note: 前置两家机构进结果页；步骤 1 点击「重新分析」并进入新任务过程页（用例预期 1）
    assert: |-
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const mainLast = () => page.locator('main').last();
      const parseTaskId = (u) => {
        const m = String(u).match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/);
        return m ? m[1] : null;
      };
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const prepTwoOrgs = async () => {
        if (!page.url().includes('workspace=capability')) {
          await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        await closeBasket();
        const tags = page.locator('.svc-org-cap-compare__tags .arco-tag');
        const tagN = await tags.count();
        if (tagN < 2) throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：对比篮服务机构不足 2 家，tags=' + tagN);
        for (let i = 0; i < tagN; i++) {
          const cls = String((await tags.nth(i).getAttribute('class')) || '');
          if (cls.includes('arco-tag-checked')) {
            await tags.nth(i).click({ timeout: 4000 });
            await page.waitForTimeout(280);
          }
        }
        await tags.nth(0).click({ timeout: 5000 });
        await tags.nth(1).click({ timeout: 5000 });
        await page.waitForTimeout(500);
        const head = ((await page.locator('.svc-org-cap-compare__head').innerText()) || '').replace(/\s+/g, '');
        if (!head.includes('当前2家')) throw new Error('前置需勾选两家，计数行=' + head);
      };
      const reachResultPage = async () => {
        if (/[?&]view=result/.test(page.url()) && /task_id=SVC-/.test(page.url())) {
          const rb = ((await mainLast().innerText().catch(() => '')) || '');
          if (/技术力横向对比结果/.test(rb)) return parseTaskId(page.url());
        }
        await prepTwoOrgs();
        const start = page.locator('[data-testid="svc-org-start-eval"]').first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(1000);
          const body = ((await mainLast().innerText().catch(() => '')) || '');
          if (/分析结果已生成/.test(body) && await page.getByRole('button', { name: '查看结果', exact: true }).first().isVisible().catch(() => false)) break;
          if (/评估失败|任务失败/.test(body)) throw new Error('评估任务失败：' + body.slice(0, 200));
        }
        const vr0 = page.getByRole('button', { name: '查看结果', exact: true }).first();
        await expect(vr0).toBeVisible({ timeout: 12000 });
        await vr0.click({ timeout: 8000 });
        await page.waitForURL((u) => /[?&]view=result/.test(String(u)), { timeout: 20000 });
        await page.waitForTimeout(2000);
        await expect(page.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 15000 });
        const tid = parseTaskId(page.url());
        if (!tid) throw new Error('结果页未捕获 task_id: ' + page.url());
        return tid;
      };
      const tidBefore = await reachResultPage();
      const re = page.getByRole('button', { name: '重新分析', exact: true }).first();
      await expect(re).toBeVisible({ timeout: 8000 });
      await re.click({ timeout: 8000 });
      let tidAfter = null;
      for (let i = 0; i < 60; i++) {
        await page.waitForTimeout(1000);
        const u = page.url();
        const cand = parseTaskId(u);
        if (cand && cand !== tidBefore) { tidAfter = cand; break; }
        if (/[?&]view=processing/.test(u) && cand && cand !== tidBefore) tidAfter = cand;
        const pb = ((await mainLast().innerText().catch(() => '')) || '');
        if (tidAfter && tidAfter !== tidBefore && /已完成|分析结果已生成/.test(pb)) break;
      }
      if (!tidAfter) tidAfter = parseTaskId(page.url());
      if (!tidAfter) throw new Error('重新分析后未进入过程态或未捕获新任务 ID: ' + page.url());
      globalThis.__func04298 = { taskIdBefore: tidBefore, taskIdAfter: tidAfter };
      if (tidAfter === tidBefore) throw new Error('未进入新任务过程页，任务 ID 未变: ' + tidBefore);
      const url = page.url();
      if (!url.includes(tidAfter)) throw new Error('过程页 URL 未携带新任务 ' + tidAfter + ': ' + url);
      if (!/[?&]view=processing/.test(url)) throw new Error('重新分析后应停在过程页 view=processing: ' + url);
  - note: 2、过程页出现「分析结果已生成」（用例预期 2）
    assert: |-
      const st = globalThis.__func04298;
      if (!st?.taskIdAfter) throw new Error('前置：无新任务 ID');
      let pbody = '';
      let ok = false;
      for (let i = 0; i < 90; i++) {
        pbody = ((await page.locator('main').last().innerText().catch(() => '')) || '');
        if (/分析结果已生成/.test(pbody)) { ok = true; break; }
        if (/已完成/.test(pbody) && await page.getByRole('button', { name: '查看结果', exact: true }).first().isVisible().catch(() => false)) { ok = true; break; }
        if (/评估失败|任务失败/.test(pbody)) throw new Error('新任务失败：' + pbody.slice(0, 200));
        await page.waitForTimeout(1000);
      }
      if (!ok) throw new Error('新过程页未见「分析结果已生成」 任务=' + st.taskIdAfter + ' 片段=' + pbody.slice(0, 280));
      await expect(page.getByText('分析结果已生成', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '查看结果', exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、步骤 2 点「查看结果」后再次出现「技术力横向对比结果」（用例预期 3）
    assert: |-
      const st = globalThis.__func04298;
      if (!st?.taskIdAfter) throw new Error('前置：无新任务 ID');
      const uProc = page.url();
      if (!uProc.includes(st.taskIdAfter)) {
        throw new Error('点查看结果前 URL 应含新任务: ' + uProc);
      }
      const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await vr.click({ timeout: 8000 });
      await page.waitForURL((u) => /[?&]view=result/.test(String(u)), { timeout: 20000 });
      await page.waitForTimeout(2000);
      let rbody = ((await page.locator('main').last().innerText().catch(() => '')) || '');
      if (!/技术力横向对比结果/.test(rbody)) {
        for (let i = 0; i < 8; i++) {
          await page.waitForTimeout(1000);
          rbody = ((await page.locator('main').last().innerText().catch(() => '')) || '');
          if (/技术力横向对比结果/.test(rbody)) break;
        }
      }
      if (!/技术力横向对比结果/.test(rbody)) {
        throw new Error('新结果页未见「技术力横向对比结果」 url=' + page.url() + ' body=' + rbody.slice(0, 280));
      }
      await expect(page.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      if (!page.url().includes(st.taskIdAfter)) throw new Error('新结果页 task_id 应与重新分析任务一致: ' + page.url());
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例册 FUNC-04298（结果页两家机构「重新分析」→ 新过程页「查看结果」：新 task_id、分析结果已生成、技术力横向对比结果）。
  前置对齐 FUNC-04288 对比篮勾选 2 家；已在 view=result 则复用当前结果页。重新分析无二次询问。fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04298。
