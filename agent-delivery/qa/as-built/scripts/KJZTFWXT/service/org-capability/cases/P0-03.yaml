priority: P0
tier: A
title: 空态「开始评估」禁用
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入 capability 工作区；对象未齐（空态或不足 2 家）
locators:
  start: button「开始评估」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 仅核空态门控「开始评估」disabled，不带入/不放行
expect:
  - note: 空态「开始评估」为禁用态
    assert: |-
      await page.goto('http://111.198.38.90:50892/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const start = page.getByRole('button', { name: '开始评估' }).first(); await expect(start).toBeVisible({ timeout: 8000 }); await expect(start).toBeDisabled({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 00676 含空态 disabled + 选齐放行；本条 A 档仅断言空态「开始评估」disabled（scout empty_start_disabled=true）。禁止测带入后放行/发起——env-gate overall=fail（篮内服务机构小于 2）。ticket 备注 ENV-SVCCAP-BASKET-ORG-LT2-001（本条本身不 skip）。零 allow_skip。
