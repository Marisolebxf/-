id: FUNC-00671
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00671
priority: P0
tier: A
title: 主流程-入口与路由 · 菜单进入与页头双 Tab
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 系统正常；已登录 admin（runner 会话前置）
locators:
  tab_main: tab「服务机构技术力评估分析」（默认选中）
  tab_records: tab「分析记录」
  menu_leaf: 侧栏「服务机构技术力评估分析」
steps:
  - action: goto
    target: /service-portal/overview/overview
expect:
  - note: 1、从菜单进入「服务机构技术力评估分析」，路由为 capability 工作区直达态（workspace=capability、tab=capability）
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构技术力评估分析|技术力评价模型/.test(t);
      };
      const clickCapabilityMenu = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构技术力评估分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForTimeout(2500);
      };
      const ensureSidebarReady = async () => {
        const siblings = ['/service-portal/overview/overview', '/service-portal/overview'];
        for (const s of siblings) {
          await dismissBasket();
          await page.goto(spaUrl(s), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          if (!await bodyIs404()) return;
        }
        throw new Error('ENV-ENTRY-UNREACHABLE: 侧栏 sibling 均不可达 url=' + page.url());
      };
      await ensureSidebarReady();
      await clickCapabilityMenu();
      if (await bodyIs404()) {
        throw new Error('ENV-ENTRY-UNREACHABLE: 菜单进入技术力评估页失败 url=' + page.url());
      }
      await expect(page).toHaveURL(/\/service\/institution-judgment/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=capability/, { timeout: 8000 });
      await expect(page).toHaveURL(/tab=capability/, { timeout: 8000 });
  - note: 2、页标题为「服务机构技术力评估分析」
    assert: await expect(page).toHaveTitle(/服务机构技术力评估分析/)
  - note: 3、顶部为「服务机构技术力评估分析（选中）/ 分析记录」双 Tab，当前为技术力评估
    assert: |-
      const main = page.getByRole('tab', { name: '服务机构技术力评估分析', exact: true });
      const rec = page.getByRole('tab', { name: '分析记录', exact: true });
      await expect(main).toBeVisible({ timeout: 8000 });
      await expect(rec).toBeVisible({ timeout: 8000 });
      const aria = await main.getAttribute('aria-selected');
      const cls = (await main.getAttribute('class')) || '';
      if (aria !== 'true' && !cls.includes('active')) throw new Error('服务机构技术力评估分析 Tab 未选中');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  蓝本 FUNC-00671（菜单进入；P0-01 为深链对照）。entry-seed sibling /service-portal/overview/overview 本环境 SPA404 时回退 /service-portal/overview（同 org-trend FUNC-00656）。
  env-gate overall=fail 不影响本条（只验入口/双 Tab，不测开始评估）。勿与对比篮浮层 Tab 混淆。零 allow_skip。
