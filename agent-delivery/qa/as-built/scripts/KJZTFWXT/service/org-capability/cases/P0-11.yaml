  ① 开评审后 main 内两枚 button.trace-info-icon（服务机构分析工作区 / 技术力评价模型需求追溯）可见可点；弹层含来源锚点 US-SVC-ORG-*。
  ② 角标 button.metric-spec-card aria=「指标说明：服务机构技术力维度分」（配置态 ×1；结果态可 ×2 归 00677/P0-08）。
  ③ D1：用例写「点开指标说明角标的长提示」——现场「权重与阈值待甲方确认 / 只展示 Java 已算好的 score」全文挂并列 .perm-pending-badge aria（点开=「数据缺口说明」）；ⓘ 点开为 MetricSpecCard（M_SVC_ORG_TECH_SCORE + Q060 待甲方确认 + 只读 Java score / 禁止改绿）。脚本双核：badge aria 硬断预期③ + ⓘ 弹卡可读。
  互证：关评零泄漏归 P0-04/FUNC-00681。viewport 1920x1080@1。
