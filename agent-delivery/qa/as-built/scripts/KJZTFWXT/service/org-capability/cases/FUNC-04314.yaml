id: FUNC-04314
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04314
priority: P1
tier: B
title: 异常-空篮去检索 · 进入服务机构查询
story: US-SVC-ORG-08
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - 对比篮没有服务机构；评估页可见「去检索加入对比篮」
locators:
  go_search_btn: '[data-testid="svc-org-cap-go-search"]'
  basket_empty_alert: '[data-testid="svc-org-cap-basket-empty"]'
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 空篮态点击「去检索加入对比篮」（真实操作在 expect 内）
expect:
  - note: 1、左侧菜单当前为「服务机构查询」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const countCapTags = async () =>
        page.locator('.svc-org-cap-compare__tags .arco-tag').count();
      const pickerScope = () =>
        page.locator('[data-system-surface-id="compare-basket"]').filter({ hasText: '选择分析服务机构' });
      const clearBasketViaPicker = async () => {
        const imp = page.locator('[data-testid="svc-org-cap-import-basket"]').first();
        if (await imp.isVisible().catch(() => false)) {
          await imp.click({ timeout: 8000 });
          await page.waitForTimeout(900);
        }
        const ret = page
          .locator('[data-testid="svc-org-cap-open-basket"]')
          .or(page.getByRole('button', { name: '返回对比篮', exact: true }))
          .first();
        await expect(ret).toBeVisible({ timeout: 8000 });
        await ret.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const scope = pickerScope();
        await expect(scope).toBeVisible({ timeout: 10000 });
        const clearBtn = scope.getByRole('button', { name: '清空对比篮', exact: true });
        await clearBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const modal = page.locator('.arco-modal:visible').filter({ hasText: '清空对比篮' }).last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        const okBtn = modal.getByRole('button', { name: '确定', exact: true }).or(modal.locator('.arco-btn-primary'));
        await okBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
      };
      const ensureEmptyAndGoSearch = async () => {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        let tagN = await countCapTags();
        if (tagN >= 1) {
          await clearBasketViaPicker();
          tagN = await countCapTags();
        }
        if (tagN >= 1) {
          throw new Error('ENV-SVCCAP-BASKET-NOT-EMPTY-001：前置需空篮，当前 tags=' + tagN);
        }
        await expect(page.locator('[data-testid="svc-org-cap-basket-empty"]')).toBeVisible({ timeout: 8000 });
        const goBtn = page.locator('[data-testid="svc-org-cap-go-search"]').or(
          page.getByRole('button', { name: '去检索加入对比篮', exact: true })
        );
        await expect(goBtn.first()).toBeVisible({ timeout: 8000 });
        await goBtn.first().click({ timeout: 8000 });
        await page.waitForURL(/\/service-center\/search/, { timeout: 20000 });
        await page.waitForTimeout(1000);
        globalThis.__func04314 = { onSearch: true };
      };
      await ensureEmptyAndGoSearch();
      const menuItem = page
        .locator('.arco-menu-item, .layout-menu-item')
        .filter({ hasText: /^服务机构查询$/ })
        .first();
      await expect(menuItem).toBeVisible({ timeout: 10000 });
      const cls = (await menuItem.getAttribute('class')) || '';
      if (!/arco-menu-selected|selected/.test(cls)) {
        const selected = page
          .locator('.arco-menu-item.arco-menu-selected, .arco-menu-item-selected, .layout-menu-item.selected')
          .filter({ hasText: /^服务机构查询$/ });
        if (!(await selected.count()) || !(await selected.first().isVisible().catch(() => false))) {
          throw new Error('左侧菜单未选中「服务机构查询」，class=' + cls);
        }
      }
  - note: 2、页面出现「智能检索」
    assert: |-
      if (!globalThis.__func04314?.onSearch) throw new Error('前置：未进入服务机构查询');
      if (!/\/service-center\/search/.test(page.url())) {
        throw new Error('当前不在服务机构查询页：' + page.url());
      }
      const smartTab = page
        .locator('.enterprise-search-mode-tabs [role=tab], [role=tab]')
        .filter({ hasText: /^智能检索$/ })
        .first();
      await expect(smartTab).toBeVisible({ timeout: 10000 });
      const sel = await smartTab.getAttribute('aria-selected');
      const tabCls = (await smartTab.getAttribute('class')) || '';
      if (sel !== 'true' && !tabCls.includes('active')) {
        await expect(page.getByText('智能检索', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
  - note: 3、出现「篮内已有服务机构 0/50」
    assert: |-
      if (!globalThis.__func04314?.onSearch) throw new Error('前置：未进入服务机构查询');
      const basketLine = page.getByText(/篮内已有服务机构\s*0\s*\/\s*50/).first();
      await expect(basketLine).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；无法清至空篮→ENV-SVCCAP-BASKET-NOT-EMPTY-001
as_built_note: >-
  用例册 FUNC-04314（空篮「去检索加入对比篮」→服务机构查询 /service-center/search）。
  前置空篮：tags=0 直点；tags≥1 则 import→返回对比篮→清空确定→回 capability 再点 go-search（data-testid=svc-org-cap-go-search）。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04314。零 allow_skip。
