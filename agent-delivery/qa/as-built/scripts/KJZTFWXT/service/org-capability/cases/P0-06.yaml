id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00674
priority: P0
tier: A
title: 算分口径诚实性——权重变更后无本地即时重算，正式分数只呈现后端签发结果
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=fail（本条只测配置态等值比对与已完成结果回显，不发起评估）
  - 分析记录存在 ≥1 条已完成任务（2026-10-15 探针实证 2 条：SVC-20260907-003 / SVC-20260824-003）
locators:
  spin_row: 权重输入 [role=spinbutton] ×5（第1行=专利数量）
  rec_tab: tab「分析记录」
  done_row: 记录行状态「已完成」
  view_btn: 行操作「查看结果」
  result_title: 结果视图标题「技术力横向对比结果」
  honest_empty: 诚实空态「暂无技术力评估结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 记录配置态「模型区外」界面基线（真实操作在 expect[0] 内，相对初值等值判定）
  - action: evaluate
    note: 「专利数量」权重 25→40 后浏览得分/名次/图表区（真实操作在 expect[0] 内，验后还原）
  - action: evaluate
    note: 恢复「专利数量」权重 25（真实操作在 expect[1] 内）
  - action: evaluate
    note: 打开分析记录一条已完成评估结果浏览其数字（真实操作在 expect[2]/[3] 内）
expect:
  - note: 权重改 40 后界面无本地即时重算变化——「模型区外」全文与改前逐字等值且无图表节点新增（验后还原初值）
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const spins = page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(5, { timeout: 8000 }); const v0 = String(await spins.nth(0).inputValue()); const snap = () => page.evaluate(() => { const m = document.querySelector('main'); if (!m) return { text: '', canvas: -1 }; const c = m.cloneNode(true); c.querySelectorAll('.ent-section-panel').forEach((e) => e.remove()); return { text: (c.innerText || '').replace(/\s+/g, ' ').trim(), canvas: m.querySelectorAll('canvas').length } }); const a = await snap(); await spins.nth(0).fill('40'); await page.keyboard.press('Tab'); await page.waitForTimeout(1200); if (String(await spins.nth(0).inputValue()) !== '40') throw new Error('权重未改为 40'); const b = await snap(); if (a.text !== b.text) throw new Error('权重 40 后界面出现本地重算文本变化: [' + a.text.slice(0, 80) + '] → [' + b.text.slice(0, 80) + ']'); if (a.canvas !== b.canvas) throw new Error('图表节点数变化 ' + a.canvas + '→' + b.canvas); await spins.nth(0).fill(v0); await page.keyboard.press('Tab'); await page.waitForTimeout(500); if (String(await spins.nth(0).inputValue()) !== v0) throw new Error('还原失败')
  - note: 恢复 25 后配置态复原（五维默认权重与「权重合计： 100% 已对齐」回显；还原证据，合计边界校验归 00682）
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const spins = page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(5, { timeout: 8000 }); const v0 = String(await spins.nth(0).inputValue()); await spins.nth(0).fill('40'); await page.keyboard.press('Tab'); await page.waitForTimeout(600); await spins.nth(0).fill('25'); await page.keyboard.press('Tab'); await page.waitForTimeout(600); const vals = []; for (let i = 0; i < 5; i++) vals.push(String(await spins.nth(i).inputValue())); if (vals.join(',') !== '25,25,20,20,10') throw new Error('恢复后权重 ' + vals.join('/') + ' ≠ 25/25/20/20/10'); if (v0 !== '25' && String(await spins.nth(0).inputValue()) !== v0) throw new Error('初值 ' + v0 + ' 未还原'); await expect(page.getByText(/权重合计：\s*100%/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/已对齐/).first()).toBeVisible({ timeout: 8000 })
  - note: 打开一条已完成评估结果——结果按后端任务签发打开（URL 含 view=result&task_id=SVC-）且呈业务标题与诚实空态
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await page.getByRole('tab', { name: '分析记录', exact: true }).click({ timeout: 8000 }); await page.waitForTimeout(1500); await expect(page.getByText('已完成').first()).toBeVisible({ timeout: 8000 }); const vb = page.getByRole('button', { name: '查看结果' }); const view = (await vb.count()) ? vb.first() : page.getByText('查看结果', { exact: true }).first(); await view.click({ timeout: 5000 }); await page.waitForTimeout(2000); await expect(page).toHaveURL(/view=result/); await expect(page).toHaveURL(/task_id=SVC-/); await expect(page.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('暂无技术力评估结果').first()).toBeVisible({ timeout: 8000 })
  - note: 结果缺维度分不发明分——页面如实声明「未给出可排名的签发分」「不编优势文案」且无伪造图表节点（canvas=0）
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await page.getByRole('tab', { name: '分析记录', exact: true }).click({ timeout: 8000 }); await page.waitForTimeout(1500); const vb = page.getByRole('button', { name: '查看结果' }); const view = (await vb.count()) ? vb.first() : page.getByText('查看结果', { exact: true }).first(); await view.click({ timeout: 5000 }); await page.waitForTimeout(2000); await expect(page.getByText('暂无技术力评估结果').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('未给出可排名的签发分').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('不编优势文案').first()).toBeVisible({ timeout: 8000 }); const canvas = await page.locator('main canvas').count(); if (canvas !== 0) throw new Error('GET result 无分但结果视图出现图表节点 canvas=' + canvas)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00674（主流程-算分口径诚实性）。闸门判定：本条为配置态等值比对 + 已完成任务结果回显，不点「开始评估」，不受 ENV-SVCCAP-BASKET-ORG-LT2-001 限制（父裁 2026-10-15）。实勘（2026-10-15 headless 两轮，探针 scout-p006.json/_probe-p006.mjs，复用 P0-05 结论：spin 5 枚 / 对比篮关闭钮 / 点可见容器）：①「无变化」断言 = 改 40 前后克隆 main 删 .ent-section-panel 后 innerText 规范空白逐字等值（探针 equal=true，两轮文本一致 187 字符）+ canvas 计数不变（配置态 0，无图表区）；②恢复 25 后五维回 25/25/20/20/10 且合计「权重合计： 100% 已对齐」（探针 restore 实证）；③分析记录 tab 有 2 条已完成 tech_power 任务，「查看结果」打开 URL …tab=records&view=result&demo_state=result&task_id=SVC-20260907-003，结果视图业务标题「技术力横向对比结果」；④该 GET result 无 score 列表 → 页面诚实空态「暂无技术力评估结果」「未给出可排名的签发分」「不编优势文案」且 canvas=0——FUNC 预期 3「缺维度分不发明分」的实测形态，直接机检无需归票。注意：探针环境评审模式为开启态，「当前为后端签发分…不改绿」横幅属评审层，断言只锚业务态文案（标题/空态/不编文案），不依赖评审开关。expect#1 恢复验证仅作还原证据，合计边界校验归 00682。零 allow_skip。
