id: FUNC-04288
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04288
priority: P0
tier: A
title: 主流程-开始评估到结果 · 勾选两家后评估
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - 已进入 capability 工作区；对比篮已有服务机构（≥2）；五维启用且权重合计 100%
locators:
  org_tags: .svc-org-cap-compare__tags .arco-tag
  count_head: .svc-org-cap-compare__head
  start_btn: '[data-testid="svc-org-start-eval"]'
  view_result: button「查看结果」
  result_title: 结果视图标题「技术力横向对比结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 对比机构勾选两家→开始评估→过程页等待「分析结果已生成」（真实操作在 expect[0]）
  - action: evaluate
    note: 过程页点「查看结果」进入结果页（真实操作在 expect[1]）
expect:
  - note: 1、过程页出现「分析结果已生成」
    assert: |-
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const mainLast = () => page.locator('main').last();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const prepTwoOrgs = async () => {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        const spins = page.locator('[role=spinbutton]');
        await expect(spins).toHaveCount(5, { timeout: 8000 });
        const vals = [];
        for (let i = 0; i < 5; i++) vals.push(String(await spins.nth(i).inputValue()));
        if (vals.join(',') !== '25,25,20,20,10') throw new Error('前置权重 ' + vals.join('/') + ' ≠ 25/25/20/20/10');
        await expect(page.getByText(/权重合计：\s*100%/).first()).toBeVisible({ timeout: 8000 });
        const tags = page.locator('.svc-org-cap-compare__tags .arco-tag');
        const tagN = await tags.count();
        if (tagN < 2) throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：对比篮服务机构不足 2 家，当前 tags=' + tagN);
        for (let i = 0; i < tagN; i++) {
          const cls = String((await tags.nth(i).getAttribute('class')) || '');
          if (cls.includes('arco-tag-checked')) {
            await tags.nth(i).click({ timeout: 4000 });
            await page.waitForTimeout(280);
          }
        }
        await tags.nth(0).click({ timeout: 5000 });
        await tags.nth(1).click({ timeout: 5000 });
        await page.waitForTimeout(500);
        const head = ((await page.locator('.svc-org-cap-compare__head').innerText()) || '').replace(/\s+/g, '');
        if (!head.includes('当前2家')) throw new Error('勾选两家后计数行=' + head);
        const checked = await page.locator('.svc-org-cap-compare__tags .arco-tag-checked').count();
        if (checked !== 2) throw new Error('勾选两家后选中 tags=' + checked);
      };
      const clickStartAndWaitProcess = async () => {
        const start = page.locator('[data-testid="svc-org-start-eval"]').first();
        await expect(start).toBeVisible({ timeout: 8000 });
        if (await start.isDisabled()) {
          throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：已选 2 家但「开始评估」仍 disabled');
        }
        await start.click({ timeout: 15000 });
        let ok = false;
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(1000);
          const url = page.url();
          const body = ((await mainLast().innerText().catch(() => '')) || '');
          if (/分析结果已生成/.test(body)) {
            ok = true;
            break;
          }
          if (/view=processing/.test(url) && /已完成/.test(body) && /查看结果/.test(body)) {
            ok = true;
            break;
          }
          if (/评估失败|任务失败/.test(body)) throw new Error('评估任务失败：' + body.slice(0, 200));
        }
        if (!ok) throw new Error('过程页超时未见「分析结果已生成」 url=' + page.url());
        await expect(page.getByText('分析结果已生成', { exact: true }).first()).toBeVisible({ timeout: 8000 });
        if (!/view=processing/.test(page.url()) && !/task_id=SVC-/.test(page.url())) {
          throw new Error('未见过程态 URL（view=processing 或 task_id）：' + page.url());
        }
        globalThis.__func04288 = { url: page.url() };
      };
      await prepTwoOrgs();
      await clickStartAndWaitProcess();
  - note: 2、结果页标题为「技术力横向对比结果」
    assert: |-
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const mainLast = () => page.locator('main').last();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const prepTwoOrgs = async () => {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        const tags = page.locator('.svc-org-cap-compare__tags .arco-tag');
        const tagN = await tags.count();
        if (tagN < 2) throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：对比篮服务机构不足 2 家');
        for (let i = 0; i < tagN; i++) {
          const cls = String((await tags.nth(i).getAttribute('class')) || '');
          if (cls.includes('arco-tag-checked')) {
            await tags.nth(i).click({ timeout: 4000 });
            await page.waitForTimeout(280);
          }
        }
        await tags.nth(0).click({ timeout: 5000 });
        await tags.nth(1).click({ timeout: 5000 });
        await page.waitForTimeout(500);
      };
      const reachProcessReady = async () => {
        const start = page.locator('[data-testid="svc-org-start-eval"]').first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(1000);
          const body = ((await mainLast().innerText().catch(() => '')) || '');
          if (/分析结果已生成/.test(body) && await page.getByRole('button', { name: '查看结果', exact: true }).first().isVisible().catch(() => false)) return;
          if (/评估失败|任务失败/.test(body)) throw new Error('评估任务失败：' + body.slice(0, 200));
        }
        throw new Error('过程页超时未见可点的「查看结果」');
      };
      await prepTwoOrgs();
      await reachProcessReady();
      const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await vr.click({ timeout: 8000 });
      await page.waitForURL((u) => /[?&]view=result/.test(String(u)), { timeout: 20000 }).catch(() => {});
      await page.waitForTimeout(2000);
      await expect(page.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 15000 });
      if (!/task_id=SVC-/.test(page.url())) throw new Error('结果页 URL 缺 task_id：' + page.url());
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  金样 FUNC-04288（入口 B：对比机构 tag 勾选 2 家→开始评估→过程页「查看结果」→「技术力横向对比结果」）。
  对比机构=篮内 .arco-tag toggle（同 FUNC-00676）；开始评估 testid=svc-org-start-eval。过程壳 data-testid=svc-org-analysis-process。
  篮 tags<2 或 start 仍 disabled→ENV-SVCCAP-BASKET-ORG-LT2-001。两条 expect 各自自含 goto+前置（P8）。A 档零 allow_skip。
