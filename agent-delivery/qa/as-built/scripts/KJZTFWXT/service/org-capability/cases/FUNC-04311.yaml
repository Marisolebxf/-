id: FUNC-04311
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04311
priority: P1
tier: B
title: 备选-工作区隔离 · 不进兄弟页
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
locators:
  menu_leaf: 侧栏「服务机构技术力评估分析」
  model_heading: 主区「技术力评价模型」
steps:
  - action: goto
    target: /service-portal/overview/overview
expect:
  - note: 1、从菜单进入「服务机构技术力评估分析」后主区标题为「技术力评价模型」
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'https://edu.itic-sci.com/tts/svcz/').replace(/\/?$/, '/')).toString();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构技术力评估分析|技术力评价模型/.test(t);
      };
      const clickCapabilityMenu = async () => {
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^服务机构技术力评估分析$/ });
        if (!(await leaf().first().isVisible().catch(() => false))) {
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业服务链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForTimeout(2500);
      };
      const ensureSidebarReady = async () => {
        const siblings = ['/service-portal/overview/overview', '/service-portal/overview'];
        for (const s of siblings) {
          await dismissBasket();
          await page.goto(spaUrl(s), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          if (!await bodyIs404()) return;
        }
        throw new Error('ENV-ENTRY-UNREACHABLE: 侧栏 sibling 均不可达 url=' + page.url());
      };
      await ensureSidebarReady();
      await clickCapabilityMenu();
      if (await bodyIs404()) {
        throw new Error('ENV-ENTRY-UNREACHABLE: 菜单进入技术力评估页失败 url=' + page.url());
      }
      await expect(page).toHaveURL(/workspace=capability/, { timeout: 15000 });
      await expect(page).toHaveURL(/tab=capability/, { timeout: 8000 });
      const shell = page.getByTestId('svc-org-analysis-shell');
      await expect(shell).toBeVisible({ timeout: 12000 });
      const main = shell.getByRole('main');
      await expect(main.getByText('技术力评价模型', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、主区不是产业领域分析配置，也不是新增趋势分析配置
    assert: |-
      const shell = page.getByTestId('svc-org-analysis-shell');
      await expect(shell).toBeVisible({ timeout: 8000 });
      const main = shell.getByRole('main');
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const capTab = page.getByRole('tab', { name: '服务机构技术力评估分析', exact: true });
      await expect(capTab).toBeVisible({ timeout: 8000 });
      const sel = await capTab.getAttribute('aria-selected');
      const cls = (await capTab.getAttribute('class')) || '';
      if (sel !== 'true' && !cls.includes('active')) {
        throw new Error('当前页签不是服务机构技术力评估分析');
      }
      const fieldCfg = main.locator('.ent-section-panel, section').filter({ hasText: /分析配置/ }).filter({ hasText: /产业领域/ });
      if (await fieldCfg.count() && (await fieldCfg.first().isVisible().catch(() => false))) {
        throw new Error('主区仍为产业领域分析配置');
      }
      if (/分析配置/.test(body) && /产业领域/.test(body) && !/技术力评价模型/.test(body)) {
        throw new Error('主区文案呈产业领域分析配置态');
      }
      const trendLeak = /主领域年度|时间窗|趋势研判|新增趋势/.test(body);
      if (/分析配置/.test(body) && trendLeak && !/技术力评价模型/.test(body)) {
        throw new Error('主区仍为新增趋势分析配置');
      }
      if (await main.getByText('分析配置', { exact: true }).first().isVisible().catch(() => false)) {
        throw new Error('主区出现兄弟工作区「分析配置」壳，非技术力评价模型');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例册 FUNC-04311（菜单进入；主区技术力评价模型，非 field/trend 分析配置壳）。蓝本 FUNC-00671 侧栏补进。
  entry-seed sibling /service-portal/overview/overview。fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04311。零 allow_skip。
