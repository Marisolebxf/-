id: FUNC-04289
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04289
priority: P0
tier: A
title: 主流程-结果空态 · 没有签发分
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - env-gate overall=fail（只打开已完成任务结果视图，不点「开始评估」）
  - 分析记录存在 ≥1 条已完成任务
locators:
  rec_tab: tab「分析记录」
  view_btn: 「查看结果」
  result_section: 「技术力横向对比结果」
  honest_empty: 「暂无技术力评估结果」
  not_failure_hint: 不是任务失败
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 打开一条已完成评估的结果页（真实操作在 expect 内）
expect:
  - note: 1、出现「暂无技术力评估结果」
    assert: |-
      const base = (baseUrl || 'http://10.50.69.111:30892').replace(/\/?$/, '');
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      await page.goto(base + route, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) {
          await close.first().click();
          await page.waitForTimeout(300);
        }
      }
      await page.getByRole('tab', { name: '分析记录', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await expect(page.getByText('已完成').first()).toBeVisible({ timeout: 8000 });
      const vb = page.getByRole('button', { name: '查看结果' });
      const view = (await vb.count()) ? vb.first() : page.getByText('查看结果', { exact: true }).first();
      await view.click({ timeout: 5000 });
      await page.waitForTimeout(2000);
      await expect(page).toHaveURL(/view=result/);
      await expect(page).toHaveURL(/task_id=SVC-/);
      await expect(page.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('暂无技术力评估结果').first()).toBeVisible({ timeout: 8000 });
  - note: 2、文案标明不是任务失败
    assert: |-
      const base = (baseUrl || 'http://10.50.69.111:30892').replace(/\/?$/, '');
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      await page.goto(base + route, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) {
          await close.first().click();
          await page.waitForTimeout(300);
        }
      }
      await page.getByRole('tab', { name: '分析记录', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const vb = page.getByRole('button', { name: '查看结果' });
      const view = (await vb.count()) ? vb.first() : page.getByText('查看结果', { exact: true }).first();
      await view.click({ timeout: 5000 });
      await page.waitForTimeout(2000);
      await expect(page.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText(/不是任务失败/).first()).toBeVisible({ timeout: 8000 });
      const main = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/分析失败|任务执行失败|生成失败/.test(main) && !/不是任务失败/.test(main)) {
        throw new Error('结果页被当成失败终态：' + main.slice(0, 120));
      }
      await expect(page.getByRole('button', { name: '返回配置', exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '重新分析', exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  蓝本 FUNC-04289（主流程-结果空态·没有签发分）。entry-seed catalog_path；env-gate fail 不发起评估。
  前置=分析记录打开已完成 task 结果视图；阅读「技术力横向对比结果」区断言诚实空态与「不是任务失败」说明。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04289。零 allow_skip。
