id: P0-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00681
priority: P0
tier: A
title: 关闭内部评审模式后 main 零泄漏
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=fail（本条只测评审开关与关评审查泄漏，不测开始评估放行）
  - 可切换人设面板「内部评审模式」
locators:
  persona: button.persona-switch
  review_switch: .persona-menu button[role=switch][aria-label="内部评审模式"]
  trace_ws: button[aria-label="服务机构分析工作区需求追溯"]
  trace_model: button[aria-label="技术力评价模型需求追溯"]
  spec_btn: button[aria-label="指标说明：服务机构技术力维度分"]
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 人设面板开→关「内部评审模式」；关后扫 main 零泄漏
expect:
  - note: 开启内部评审后可见两枚需求追溯与指标说明角标（开态对照）
    assert: |-
      await page.goto('http://111.198.38.90:50892/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const persona = page.locator('button.persona-switch').first(); await persona.click({ timeout: 4000 }); await page.waitForTimeout(400); const sw = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); await expect(sw).toBeVisible({ timeout: 8000 }); if ((await sw.getAttribute('aria-checked')) !== 'true') { await sw.click({ timeout: 4000 }); await page.waitForTimeout(400) }; await page.keyboard.press('Escape'); await page.waitForTimeout(300); const main = page.locator('main').first(); await expect(main.locator('button[aria-label="服务机构分析工作区需求追溯"]').first()).toBeVisible({ timeout: 8000 }); await expect(main.locator('button[aria-label="技术力评价模型需求追溯"]').first()).toBeVisible({ timeout: 8000 }); await expect(main.locator('button[aria-label="指标说明：服务机构技术力维度分"]').first()).toBeVisible({ timeout: 8000 })
  - note: 关闭内部评审后 main 无追溯按钮/指标说明角标/内部编号字样（GAP-/Q0xx 等）
    assert: |-
      const persona = page.locator('button.persona-switch').first(); await persona.click({ timeout: 4000 }); await page.waitForTimeout(400); const sw = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); await expect(sw).toBeVisible({ timeout: 8000 }); if ((await sw.getAttribute('aria-checked')) === 'true') { await sw.click({ timeout: 4000 }); await page.waitForTimeout(400) }; await page.keyboard.press('Escape'); await page.waitForTimeout(300); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const persona2 = page.locator('button.persona-switch').first(); await persona2.click({ timeout: 4000 }); await page.waitForTimeout(400); const sw2 = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); if (await sw2.count() && (await sw2.getAttribute('aria-checked')) === 'true') { await sw2.click({ timeout: 4000 }); await page.waitForTimeout(400) }; await page.keyboard.press('Escape'); await page.waitForTimeout(300); const main = page.locator('main').first(); await expect(main.locator('button[aria-label*="需求追溯"]')).toHaveCount(0); await expect(main.locator('button[aria-label^="指标说明"]')).toHaveCount(0); await expect(main.locator('button[aria-label*="GAP-"]')).toHaveCount(0); const mainText = await main.innerText(); for (const bad of ['指标说明', '指标未登记', '需求追溯', 'metric_id', 'svc_tech_power_score', 'GAP-', 'Q-SVCCHAIN', '禁止改绿']) { if (mainText.includes(bad)) throw new Error('业务区泄漏: ' + bad) }; if (/Q0\d{2}/.test(mainText)) throw new Error('业务区泄漏 Q0xx: ' + (mainText.match(/Q0\d{2}/) || [''])[0])
  - note: 关评审后业务配置态仍在（五维权重区 + 主 Tab 选中；不测开始评估放行）
    assert: |-
      await expect(page.getByRole('tab', { name: '服务机构技术力评估分析', exact: true })).toBeVisible({ timeout: 8000 }); await expect(page.getByText('技术力评价模型', { exact: true }).first()).toBeVisible({ timeout: 8000 }); const spins = page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(5, { timeout: 8000 }); const vals = []; for (let i = 0; i < 5; i++) vals.push(String(await spins.nth(i).inputValue())); if (vals.join(',') !== '25,25,20,20,10') throw new Error('关评审后权重漂移 ' + vals.join('/'))
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 蓝本 FUNC-00681；env-gate overall=fail 只测评审开/关与零泄漏，禁止开始评估放行。开态对照两枚追溯+指标说明；关后 reload 若默认又开则再关一次；扫 main（对比篮浮层追溯不计）。内部字样清单含 Q060/Q-SVCCHAIN/metric_id/svc_tech_power_score/GAP-/Q0xx。H3「技术力评价模型」业务标题保留不计泄漏。零 allow_skip。
