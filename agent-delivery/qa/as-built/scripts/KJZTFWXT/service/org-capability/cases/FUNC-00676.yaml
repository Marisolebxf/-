id: FUNC-00676
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00676
priority: P0
tier: A
title: 主流程-开始评估门控 · 未选够不可开始
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - 已进入 capability 工作区；五维启用且权重合计 100%（配置态门控，不点「开始评估」放行）
locators:
  board: '[data-testid="svc-org-capability-board"]'
  org_tags: .svc-org-cap-compare__tags .arco-tag
  count_head: .svc-org-cap-compare__head
  start_btn: '[data-testid="svc-org-start-eval"] / button「开始评估」'
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 不勾选任何机构（真实操作在 expect[0]）
  - action: evaluate
    note: 只勾选一家机构（真实操作在 expect[1]）
expect:
  - note: 1、未勾选时「开始评估」不可用
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const spins = page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(5, { timeout: 8000 }); const vals = []; for (let i = 0; i < 5; i++) vals.push(String(await spins.nth(i).inputValue())); if (vals.join(',') !== '25,25,20,20,10') throw new Error('前置权重 ' + vals.join('/') + ' ≠ 25/25/20/20/10'); await expect(page.getByText(/权重合计：\s*100%/).first()).toBeVisible({ timeout: 8000 }); const tags = page.locator('.svc-org-cap-compare__tags .arco-tag'); const tagN = await tags.count(); if (!tagN) throw new Error('ENV: 对比篮服务机构为空，无法测机构勾选门控'); for (let i = 0; i < tagN; i++) { const cls = String((await tags.nth(i).getAttribute('class')) || ''); if (cls.includes('arco-tag-checked')) { await tags.nth(i).click({ timeout: 4000 }); await page.waitForTimeout(280) } }; const head0 = ((await page.locator('.svc-org-cap-compare__head').innerText()) || '').replace(/\s+/g, ''); if (!head0.includes('当前0家')) throw new Error('未勾选时计数行=' + head0); const checked0 = await page.locator('.svc-org-cap-compare__tags .arco-tag-checked').count(); if (checked0 !== 0) throw new Error('未勾选时选中 tags=' + checked0); const start = page.locator('[data-testid="svc-org-start-eval"]').first(); await expect(start).toBeVisible({ timeout: 8000 }); await expect(start).toBeDisabled({ timeout: 8000 })
  - note: 2、只勾选一家时「开始评估」仍不可用
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/service/institution-judgment?workspace=capability&tab=capability', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const tags = page.locator('.svc-org-cap-compare__tags .arco-tag'); const tagN = await tags.count(); if (!tagN) throw new Error('ENV: 对比篮服务机构为空，无法测机构勾选门控'); for (let i = 0; i < tagN; i++) { const cls = String((await tags.nth(i).getAttribute('class')) || ''); if (cls.includes('arco-tag-checked')) { await tags.nth(i).click({ timeout: 4000 }); await page.waitForTimeout(280) } }; await tags.nth(0).click({ timeout: 5000 }); await page.waitForTimeout(500); const head1 = ((await page.locator('.svc-org-cap-compare__head').innerText()) || '').replace(/\s+/g, ''); if (!head1.includes('当前1家')) throw new Error('勾选一家后计数行=' + head1); const checked1 = await page.locator('.svc-org-cap-compare__tags .arco-tag-checked').count(); if (checked1 !== 1) throw new Error('勾选一家后选中 tags=' + checked1); const start = page.locator('[data-testid="svc-org-start-eval"]').first(); await expect(start).toBeDisabled({ timeout: 8000 }); try { await tags.nth(0).click({ timeout: 3000 }); await page.waitForTimeout(300) } catch {}
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  蓝本 FUNC-00676（catalog 深链 entry-seed catalog_path；P0-03 为同 fid 序号脚本仅空态一条）。
  对比机构=篮内 .arco-tag 点选 toggle（非弹窗勾选）；门控只验 disabled，不点「开始评估」放行，与 ENV-SVCCAP-BASKET-ORG-LT2-001 一致（篮<2 仍禁）。
  两条 expect 自含 goto+关对比篮+前置五维 100%。零 allow_skip。
