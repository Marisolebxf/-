id: FUNC-04304
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04304
priority: P1
tier: A
title: 配置-权重偏离后 opt-in 按比例归一到 100%
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - 已进入 capability 工作区；五维均启用（配置态，不点「开始评估」）
locators:
  norm_btn: 「按比例归一到 100%」
  weight_tip: 启用维度权重合计须为 100%
  start_btn: '[data-testid="svc-org-start-eval"]'
  weight_sum: 「权重合计： 100% 已对齐」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 某一维权重改大→校验提示与开始评估门控→点击按比例归一（真实操作在 expect 内）
expect:
  - note: 1、某一维权重改大后出现「启用维度权重合计须为 100%」
    assert: |-
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const ensureFiveDimsOn = async () => {
        const panel = page.locator('.ent-section-panel', { hasText: '技术力评价模型' }).first();
        const cbs = panel.locator('.arco-checkbox');
        await expect(cbs).toHaveCount(5, { timeout: 8000 });
        for (let i = 0; i < 5; i++) {
          const cls = String((await cbs.nth(i).getAttribute('class')) || '');
          if (!cls.includes('arco-checkbox-checked')) {
            await cbs.nth(i).click({ timeout: 4000 });
            await page.waitForTimeout(350);
          }
        }
      };
      await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1200);
      await closeBasket();
      await ensureFiveDimsOn();
      const spins = page.locator('[role=spinbutton]');
      await expect(spins).toHaveCount(5, { timeout: 8000 });
      const targets = ['35', '25', '20', '20', '10'];
      for (let i = 0; i < 5; i++) {
        await spins.nth(i).fill(targets[i]);
        await page.keyboard.press('Tab');
        await page.waitForTimeout(350);
      }
      await page.waitForTimeout(400);
      const vals = [];
      for (let i = 0; i < 5; i++) vals.push(Number(await spins.nth(i).inputValue()));
      const sum = vals.reduce((a, b) => a + b, 0);
      if (sum === 100) throw new Error('权重和仍为 100，未制造偏离');
      if (vals.join(',') !== targets.join(',')) throw new Error('偏离态权重被改写: ' + vals.join('/') + ' ≠ ' + targets.join('/'));
      await expect(page.locator('.svc-org-cap-blockers').getByText(/启用维度权重合计须为\s*100%/).first()).toBeVisible({ timeout: 8000 });
      globalThis.__func04304 = { bumped: true, sum };
  - note: 2、「开始评估」不可用
    assert: |-
      const start = page.locator('[data-testid="svc-org-start-eval"]').first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await expect(start).toBeDisabled({ timeout: 8000 });
      if (!globalThis.__func04304?.bumped) throw new Error('前置 expect#1 未执行权重偏离');
  - note: 3、点击「按比例归一到 100%」后显示「100% 已对齐」
    assert: |-
      const norm = page.getByRole('button', { name: '按比例归一到 100%', exact: true }).first();
      await expect(norm).toBeVisible({ timeout: 8000 });
      await norm.click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const spins = page.locator('[role=spinbutton]');
      const vals = [];
      for (let i = 0; i < 5; i++) vals.push(Number(await spins.nth(i).inputValue()));
      const sum = vals.reduce((a, b) => a + b, 0);
      if (sum !== 100) throw new Error('归一后权重和=' + sum + '，vals=' + vals.join('/'));
      await expect(page.getByText(/权重合计：\s*100%/).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText(/100%\s*已对齐/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  FUNC-04304；步骤：五维启用→专利数量 25→35 制造偏离→校验「启用维度权重合计须为 100%」与开始评估 disabled→点 opt-in「按比例归一到 100%」→合计「100% 已对齐」且五维权和=100。
  catalog_path=entry-seed；env-gate fail 不发起评估。fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04304。零 allow_skip。
