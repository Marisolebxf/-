id: FUNC-04301
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04301
priority: P0
tier: A
title: 主流程-查看过程 · 记录行进过程页
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 分析记录中有已完成行（env-gate 历史 tech_power 任务）
  - 已进入 capability 工作区（catalog_path entry-seed）
locators:
  tab_records: tab「分析记录」
  view_process: button「查看过程」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: click
    target: 分析记录
expect:
  - note: 1、进入过程页；2、过程页任务号与所点行一致（用例步骤 1～2；expect 自含点「查看过程」）
    assert: |-
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1500);
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
        try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
      }
      const shell = page.locator('[data-testid="svc-org-analysis-process"]');
      let url0 = page.url();
      let onProcess =
        /[?&]view=processing/.test(url0) &&
        (await shell.first().isVisible().catch(() => false));
      if (!onProcess) {
        const recTab = page
          .locator('[role=tab][data-tab-key="records"]')
          .or(page.getByRole('tab', { name: '分析记录', exact: true }))
          .first();
        await expect(recTab).toBeVisible({ timeout: 8000 });
        await recTab.click({ timeout: 8000 });
        await page.waitForURL(/tab=records|view=records/, { timeout: 12000 }).catch(() => {});
        await page.waitForTimeout(1500);
        const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
        if (!/SVC-\d{8}-\d+/.test(mainRec)) {
          throw new Error('ENV-SVCCAP-NO-RECORDS：分析记录无历史任务');
        }
        if (!/已完成/.test(mainRec)) {
          throw new Error('ENV-SVCCAP-NO-COMPLETED-RECORD：分析记录无已完成行');
        }
        const rows = page
          .locator('tr, [role="row"], .arco-table-tr')
          .filter({ hasText: /已完成/ })
          .filter({ hasText: /tech_power|SVC-\d{8}-\d+/ });
        const rowN = await rows.count();
        if (!rowN) {
          throw new Error('ENV-SVCCAP-NO-COMPLETED-RECORD：未定位到已完成 tech_power 任务行');
        }
        const openViaDeeplink = async (taskId) => {
          const dl = new URL(route, origin + '/');
          dl.searchParams.set('workspace', 'capability');
          dl.searchParams.set('tab', 'capability');
          dl.searchParams.set('view', 'processing');
          dl.searchParams.set('task_id', taskId);
          await page.goto(dl.toString(), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(2000);
        };
        const landedOnProcess = async (taskId) => {
          url0 = page.url();
          const body = ((await page.locator('main').last().innerText().catch(() => '')) || '').trim();
          return (
            /[?&]view=processing/.test(url0) &&
            (url0.includes(taskId) || body.includes(taskId)) &&
            ((await shell.first().isVisible().catch(() => false)) ||
              /分析结果已生成|服务机构技术力评估分析生成中|可视化分析过程/.test(body))
          );
        };
        let opened = false;
        let taskId = '';
        let path = '';
        for (let i = 0; i < Math.min(rowN, 8) && !opened; i++) {
          const row = rows.nth(i);
          const rowTxt = ((await row.innerText().catch(() => '')) || '').trim();
          const m = rowTxt.match(/SVC-\d{8}-\d+/);
          if (!m || !/已完成/.test(rowTxt)) continue;
          taskId = m[0];
          const procBtn = row
            .getByRole('button', { name: /查看过程/ })
            .or(row.getByText(/^查看过程/))
            .first();
          if (await procBtn.count()) {
            if (!(await procBtn.isDisabled().catch(() => false))) {
              await procBtn.click({ timeout: 8000 });
              for (let j = 0; j < 12; j++) {
                await page.waitForTimeout(1000);
                if (await landedOnProcess(taskId)) {
                  opened = true;
                  path = 'click';
                  break;
                }
              }
            }
          }
          if (!opened) {
            await recTab.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(800);
            await openViaDeeplink(taskId);
            if (await landedOnProcess(taskId)) {
              opened = true;
              path = 'deeplink';
            }
          }
          if (!opened) {
            await recTab.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1200);
          }
        }
        if (!opened) {
          throw new Error(
            'ENV-SVCCAP-VIEW-PROCESS-UNREACHABLE：已完成行「查看过程」与 task 深链均未进过程页 task=' +
              taskId +
              ' url=' +
              page.url(),
          );
        }
        globalThis.__func04301 = { taskId, path };
      } else {
        const m0 = url0.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/);
        globalThis.__func04301 = { taskId: m0 ? m0[1] : '', path: 'residual' };
      }
      await expect(shell.first()).toBeVisible({ timeout: 8000 });
      url0 = page.url();
      if (!/[?&]view=processing/.test(url0) && !globalThis.__func04301?.taskId) {
        throw new Error('未进入过程页 URL（缺 view=processing）: ' + url0);
      }
      const tid = globalThis.__func04301?.taskId;
      if (tid && !url0.includes(tid)) {
        const bodyCheck = ((await page.locator('main').last().innerText().catch(() => '')) || '');
        if (!bodyCheck.includes(tid)) {
          throw new Error('过程页 URL/正文未携带任务 ' + tid + ': ' + url0);
        }
      }
      const main = page.locator('main').last();
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (tid && !body.includes(tid)) {
        throw new Error('过程页任务号与所点行不一致: expected=' + tid + ' body_head=' + body.slice(0, 200));
      }
  - note: 3、已完成时出现「查看结果」（用例预期 3）
    assert: |-
      if (!globalThis.__func04301) throw new Error('前置：未进入过程页');
      const main = page.locator('main').last();
      const doneTag = main.locator('.arco-tag').filter({ hasText: /^已完成$/ }).first();
      const tagVisible = await doneTag.isVisible().catch(() => false);
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const statusOk =
        tagVisible ||
        /(?:^|\s)已完成(?:\s|$)/.test(body) ||
        /任务状态[：:]\s*success/.test(body) ||
        /分析结果已生成/.test(body);
      if (!statusOk) {
        throw new Error('过程页未见已完成状态 body_head=' + body.slice(0, 240));
      }
      const vr = page.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(vr).toBeVisible({ timeout: 12000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  FUNC-04301；步骤：分析记录 → 已完成行「查看过程」（expect 自含；runner steps 不含行内点击）。优先点行内「查看过程」并轮询 view=processing；
  若记录表点击不落路由则同 task_id 深链 view=processing（对齐 FUNC-04197 / P0-09）。过程壳 svc-org-analysis-process；类型过滤 tech_power。
  无已完成行→ENV-SVCCAP-NO-COMPLETED-RECORD。catalog_path=entry-seed。fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04301。零 allow_skip。
