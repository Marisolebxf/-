id: FUNC-04313
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04313
priority: P1
tier: B
title: 备选-移除机构
entry_id: svc-org-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 前置入篮→从对比篮带入→返回对比篮→点第一家「移除」（真实操作在 expect 内）
expect:
  - note: 1、出现「已移除」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const spaUrl = (p) => new URL(p.startsWith('/') ? p : '/' + p, origin + '/').toString();
      const listOrgNames = async (ws) => {
        const names = [];
        const sels = ws.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const ensureBasketTags = async (minCount) => {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        let tagN = await page.locator('.svc-org-cap-compare__tags .arco-tag').count();
        if (tagN >= minCount) return tagN;
        await page.goto(spaUrl('/service-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        const joins = page.getByRole('button', { name: '加入对比篮', exact: true });
        const joinN = await joins.count();
        if (joinN < minCount) {
          throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：检索页可入篮不足 ' + minCount + ' 家');
        }
        for (let i = 0; i < minCount; i++) {
          await joins.nth(i).click({ timeout: 15000 });
          await page.waitForTimeout(700);
        }
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        tagN = await page.locator('.svc-org-cap-compare__tags .arco-tag').count();
        if (tagN < minCount) {
          throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：对比篮服务机构不足 ' + minCount + ' 家，tags=' + tagN);
        }
        return tagN;
      };
      await ensureBasketTags(2);
      const imp = page.locator('[data-testid="svc-org-cap-import-basket"]').first();
      await expect(imp).toBeVisible({ timeout: 8000 });
      await imp.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const ret = page
        .locator('[data-testid="svc-org-cap-open-basket"]')
        .or(page.getByRole('button', { name: '返回对比篮', exact: true }))
        .first();
      await expect(ret).toBeVisible({ timeout: 8000 });
      await ret.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const scope = page.locator('[data-system-surface-id="compare-basket"]').filter({ hasText: '选择分析服务机构' });
      await expect(scope).toBeVisible({ timeout: 10000 });
      await expect(scope.getByText('篮内服务机构').first()).toBeVisible({ timeout: 8000 });
      const beforeNames = await listOrgNames(scope);
      if (beforeNames.length < 2) {
        throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：篮内服务机构不足 2 家，列表=' + beforeNames.length);
      }
      const removedName = beforeNames[0];
      const remainNames = beforeNames.slice(1);
      await scope.getByRole('button', { name: '移除', exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(
        page.locator('.arco-message-content').filter({ hasText: '已移除' }).first(),
      ).toBeVisible({ timeout: 10000 });
      globalThis.__func04313 = { removedName, remainNames, pickerOpen: true };
  - note: 2、所点机构不再出现在「篮内服务机构」
    assert: |-
      if (!globalThis.__func04313?.pickerOpen) throw new Error('前置：未完成移除操作');
      const scope = page.locator('[data-system-surface-id="compare-basket"]').filter({ hasText: '选择分析服务机构' });
      await expect(scope).toBeVisible({ timeout: 8000 });
      await expect(scope.getByText(globalThis.__func04313.removedName, { exact: true })).toHaveCount(0);
  - note: 3、其余机构仍列出
    assert: |-
      if (!globalThis.__func04313?.remainNames?.length) throw new Error('前置：缺少 remainNames');
      const scope = page.locator('[data-system-surface-id="compare-basket"]').filter({ hasText: '选择分析服务机构' });
      await expect(scope).toBeVisible({ timeout: 8000 });
      for (const name of globalThis.__func04313.remainNames) {
        await expect(scope.getByText(name, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
