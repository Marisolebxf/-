id: FUNC-04313
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04313
priority: P1
tier: B
title: 备选-返回对比篮 · 单家移除
story: US-SVC-ORG-08
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - 已打开「返回对比篮」；篮内有多家服务机构
locators:
  import_btn: '[data-testid="svc-org-cap-import-basket"]'
  return_basket: '[data-testid="svc-org-cap-open-basket"]'
  basket_workspace: '[data-testid="service-org-compare-basket-workspace"]'
  remove_btn: button「移除」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 「从对比篮带入」→「返回对比篮」→点一家「移除」（真实操作在 expect 内）
expect:
  - note: 1、出现「已移除」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const listOrgNames = async (ws) => {
        const names = [];
        const sels = ws.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const openPickerAfterImport = async () => {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        const tagN = await page.locator('.svc-org-cap-compare__tags .arco-tag').count();
        if (tagN < 2) {
          throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：对比篮服务机构不足 2 家，当前 tags=' + tagN);
        }
        const imp = page.locator('[data-testid="svc-org-cap-import-basket"]').first();
        await expect(imp).toBeVisible({ timeout: 8000 });
        await imp.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const ret = page.locator('[data-testid="svc-org-cap-open-basket"]').or(page.getByRole('button', { name: '返回对比篮', exact: true })).first();
        await expect(ret).toBeVisible({ timeout: 8000 });
        await ret.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await expect(page.getByText('选择分析服务机构', { exact: true }).first()).toBeVisible({ timeout: 10000 });
        const ws = page.locator('[data-testid="service-org-compare-basket-workspace"]');
        await expect(ws).toBeVisible({ timeout: 8000 });
        await expect(ws.getByText('篮内服务机构').first()).toBeVisible({ timeout: 8000 });
        return ws;
      };
      const ws = await openPickerAfterImport();
      const panel = page.locator('.system-compare-panel:visible').last();
      const beforeNames = await listOrgNames(ws);
      if (beforeNames.length < 2) {
        throw new Error('篮内服务机构应多于 1 家，列表可见=' + beforeNames.length);
      }
      const removedName = beforeNames[0];
      const remainNames = beforeNames.slice(1);
      const rmBtn = panel.getByRole('button', { name: '移除', exact: true }).first();
      await expect(rmBtn).toBeVisible({ timeout: 8000 });
      await rmBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page.locator('.arco-message-content').filter({ hasText: '已移除' }).first()).toBeVisible({ timeout: 10000 });
      globalThis.__func04313 = { removedName, remainNames, wsReady: true };
  - note: 2、所点机构不再出现在「篮内服务机构」
    assert: |-
      if (!globalThis.__func04313?.wsReady) {
        throw new Error('前置 expect[0] 未执行，缺少 __func04313');
      }
      const { removedName } = globalThis.__func04313;
      const ws = page.locator('[data-testid="service-org-compare-basket-workspace"]');
      await expect(ws).toBeVisible({ timeout: 8000 });
      const names = [];
      const sels = ws.locator('[aria-label^="选择 "]');
      const selN = await sels.count();
      for (let i = 0; i < selN; i++) {
        const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
        const m = aria.match(/^选择\s+(.+)$/);
        if (m && m[1]) names.push(m[1].trim());
      }
      if (names.includes(removedName)) {
        throw new Error('移除后机构仍在篮内：' + removedName);
      }
  - note: 3、其余机构仍列出
    assert: |-
      if (!globalThis.__func04313?.wsReady) {
        throw new Error('前置 expect[0] 未执行，缺少 __func04313');
      }
      const { remainNames } = globalThis.__func04313;
      const ws = page.locator('[data-testid="service-org-compare-basket-workspace"]');
      await expect(ws).toBeVisible({ timeout: 8000 });
      const names = [];
      const sels = ws.locator('[aria-label^="选择 "]');
      const selN = await sels.count();
      for (let i = 0; i < selN; i++) {
        const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
        const m = aria.match(/^选择\s+(.+)$/);
        if (m && m[1]) names.push(m[1].trim());
      }
      for (const name of remainNames) {
        if (!names.includes(name)) {
          throw new Error('其余机构未列出：' + name + '；当前=' + names.join('、'));
        }
      }
      if (names.length !== remainNames.length) {
        throw new Error('篮内机构数不符：期望=' + remainNames.length + ' 实际=' + names.length);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；篮<2 家→ENV-SVCCAP-BASKET-ORG-LT2-001
as_built_note: >-
  前置=对比篮 tags≥2→「从对比篮带入」→「返回对比篮」→篮内服务机构区首行点「移除」
  （ServiceOrgCompareBasketPanel.remove + Message.success 已移除）。三条 expect：Toast / 被点机构不在列表 / 其余机构仍列。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04313。零 allow_skip。
