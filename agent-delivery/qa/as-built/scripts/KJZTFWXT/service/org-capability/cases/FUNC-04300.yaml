id: FUNC-04300
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04300
priority: P0
tier: B
title: 主流程-分析记录列
entry_id: svc-org-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: click
    target: 分析记录
expect:
  - note: 1、表头为任务、类型、状态、创建时间、操作
    assert: |-
      const panel = page.locator('main [data-testid="svc-org-analysis-records"]');
      await expect(panel).toBeVisible({ timeout: 15000 });
      const headers = ['任务', '类型', '状态', '创建时间', '操作'];
      for (const h of headers) {
        await expect(panel.locator('thead').getByText(h, { exact: true })).toBeVisible();
      }
  - note: 2、已完成行的操作是「查看过程」和「查看结果」
    assert: |-
      const panel = page.locator('main [data-testid="svc-org-analysis-records"]');
      const doneRow = panel.locator('.arco-table-body tr').filter({ hasText: '已完成' }).first();
      await expect(doneRow).toBeVisible({ timeout: 10000 });
      await expect(doneRow.getByRole('button', { name: '查看过程', exact: true })).toBeVisible();
      await expect(doneRow.getByRole('button', { name: '查看结果', exact: true })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
