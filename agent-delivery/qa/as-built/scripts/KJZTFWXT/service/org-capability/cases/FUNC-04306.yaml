id: FUNC-04306
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04306
priority: P1
tier: B
title: 备选-当天相同机构再次开始评估打开既有结果且不新增任务
entry_id: svc-org-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
expect:
  - note: 1、打开已有结果
    assert: |-
      const main = page.locator('main').last();
      const taskFromUrl = (u) => {
        const m = String(u).match(/[?&]task_id=(SVC-\d+-\d+)/);
        return m ? m[1] : '';
      };
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          if (await close.first().isVisible().catch(() => false)) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const prepWeights = async () => {
        const spins = main.locator('[role=spinbutton]');
        await expect(spins.first()).toBeVisible({ timeout: 8000 });
        const n = await spins.count();
        if (n < 5) throw new Error('五维权重不足 ' + n);
        await expect(main.getByText(/100%/).first()).toBeVisible({ timeout: 8000 });
      };
      const pickTwoOrgs = async () => {
        const tags = main.locator('.svc-org-cap-compare__tags .arco-tag');
        if (await tags.count() < 2) {
          throw new Error('对比篮服务机构不足 2 家');
        }
        for (let i = 0; i < await tags.count(); i++) {
          const cls = String((await tags.nth(i).getAttribute('class')) || '');
          if (cls.includes('arco-tag-checked')) {
            await tags.nth(i).click({ timeout: 4000 });
            await page.waitForTimeout(200);
          }
        }
        await tags.nth(0).click({ timeout: 5000 });
        await tags.nth(1).click({ timeout: 5000 });
        await page.waitForTimeout(400);
        const checked = await main.locator('.svc-org-cap-compare__tags .arco-tag-checked').count();
        if (checked !== 2) throw new Error('应勾选 2 家，当前 ' + checked);
      };
      const clickStart = async () => {
        const btn = main.getByRole('button', { name: '开始评估', exact: true }).first();
        await expect(btn).toBeVisible({ timeout: 8000 });
        await expect(btn).toBeEnabled({ timeout: 8000 });
        await btn.click({ timeout: 15000 });
      };
      const openResultFromRun = async () => {
        for (let i = 0; i < 60; i++) {
          await page.waitForTimeout(1000);
          const url = page.url();
          if (/[?&]view=result/.test(url) && taskFromUrl(url)) return taskFromUrl(url);
          const body = ((await main.innerText().catch(() => '')) || '');
          if (/分析结果已生成/.test(body)) {
            const viewBtn = main.getByRole('button', { name: '查看结果', exact: true }).first();
            if (await viewBtn.isVisible().catch(() => false)) {
              await viewBtn.click({ timeout: 8000 });
              await page.waitForURL((u) => /[?&]view=result/.test(String(u)), { timeout: 20000 });
              return taskFromUrl(page.url());
            }
          }
          if (/评估失败|任务失败/.test(body)) throw new Error('评估失败');
        }
        throw new Error('超时未见结果 url=' + page.url());
      };
      await closeBasket();
      await prepWeights();
      await pickTwoOrgs();
      await clickStart();
      const firstTask = await openResultFromRun();
      if (!firstTask) throw new Error('首发缺 task_id');
      await expect(main.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      const back = main.getByRole('button', { name: '返回配置', exact: true }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
      await back.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await pickTwoOrgs();
      globalThis.__func04306_firstTask = firstTask;
      globalThis.__func04306_posts = [];
      page.on('request', (r) => {
        try {
          if (r.method() === 'POST' && /\/tasks\/?(\?|$)/.test(r.url()) && !/\/list|\/running/.test(r.url())) {
            globalThis.__func04306_posts.push(r.url());
          }
        } catch {}
      });
      const postsBefore = globalThis.__func04306_posts.length;
      await clickStart();
      let secondTask = '';
      for (let i = 0; i < 45; i++) {
        await page.waitForTimeout(1000);
        const url = page.url();
        if (/[?&]view=result/.test(url)) {
          secondTask = taskFromUrl(url);
          if (secondTask && await main.getByText('技术力横向对比结果', { exact: true }).first().isVisible().catch(() => false)) break;
        }
        const body = ((await main.innerText().catch(() => '')) || '');
        if (/分析结果已生成/.test(body) && !/[?&]view=result/.test(page.url())) {
          const procTask = taskFromUrl(url);
          if (procTask && procTask !== firstTask) {
            throw new Error('进入新过程页 task=' + procTask + ' 非既有 ' + firstTask);
          }
          const viewBtn = main.getByRole('button', { name: '查看结果', exact: true }).first();
          if (await viewBtn.isVisible().catch(() => false)) {
            await viewBtn.click({ timeout: 8000 });
            await page.waitForURL((u) => /[?&]view=result/.test(String(u)), { timeout: 20000 });
            secondTask = taskFromUrl(page.url());
            break;
          }
        }
      }
      globalThis.__func04306_postsSecond = globalThis.__func04306_posts.length - postsBefore;
      if (!secondTask) secondTask = taskFromUrl(page.url());
      if (!/[?&]view=result/.test(page.url())) {
        throw new Error('再次开始未打开结果页');
      }
      await expect(main.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      if (secondTask !== firstTask) {
        throw new Error('应复用 task ' + firstTask + ' 实际 ' + secondTask);
      }
      globalThis.__func04306_secondTask = secondTask;
  - note: 2、不新增分析任务
    assert: |-
      const first = globalThis.__func04306_firstTask;
      const second = globalThis.__func04306_secondTask;
      if (!first || !second) throw new Error('前置未完成');
      if (second !== first) throw new Error('task_id 变化');
      const posts = globalThis.__func04306_postsSecond ?? -1;
      if (posts > 0) {
        throw new Error('第二次开始仍 POST 新建任务 ×' + posts);
      }
      await expect(page.locator('main').last().getByText('服务机构技术力评估分析生成中').first()).not.toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
