id: FUNC-04302
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04302
priority: P0
tier: A
title: 主流程-查看结果 · 记录行进结果页
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 分析记录中有已完成行（env-gate 历史 tech_power 任务）
  - 已进入 capability 工作区（catalog_path entry-seed）
locators:
  tab_records: tab「分析记录」
  view_result: button「查看结果」
  result_title: 「技术力横向对比结果」
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: click
    target: 分析记录
expect:
  - note: 1、打开「技术力横向对比结果」（用例步骤 1～2；expect 自含点「查看结果」）
    assert: |-
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const title = page.getByText('技术力横向对比结果', { exact: true }).first();
      const onResult = async () => {
        const url0 = page.url();
        const vis = await title.isVisible().catch(() => false);
        return /[?&]view=result/.test(url0) && /task_id=SVC-/.test(url0) && vis;
      };
      await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1500);
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
        try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
      }
      if (await onResult()) return;
      const recTab = page
        .locator('[role=tab][data-tab-key="records"]')
        .or(page.getByRole('tab', { name: '分析记录', exact: true }))
        .first();
      await expect(recTab).toBeVisible({ timeout: 8000 });
      await recTab.click({ timeout: 8000 });
      await page.waitForURL(/tab=records|view=records/, { timeout: 12000 }).catch(() => {});
      await page.waitForTimeout(1500);
      const mainRec = ((await page.locator('main').first().innerText().catch(() => '')) || '').trim();
      if (!/SVC-\d{8}-\d+/.test(mainRec)) {
        throw new Error('ENV-SVCCAP-NO-RECORDS：分析记录无历史任务');
      }
      if (!/已完成/.test(mainRec)) {
        throw new Error('ENV-SVCCAP-NO-COMPLETED-RECORD：分析记录无已完成行');
      }
      const rows = page
        .locator('tr, [role="row"], .arco-table-tr')
        .filter({ hasText: /已完成/ })
        .filter({ hasText: /tech_power|SVC-\d{8}-\d+/ });
      const rowN = await rows.count();
      if (!rowN) {
        throw new Error('ENV-SVCCAP-NO-COMPLETED-RECORD：未定位到已完成 tech_power 任务行');
      }
      const openViaDeeplink = async (taskId) => {
        const dl = new URL(route, origin + '/');
        dl.searchParams.set('workspace', 'capability');
        dl.searchParams.set('tab', 'capability');
        dl.searchParams.set('view', 'result');
        dl.searchParams.set('task_id', taskId);
        await page.goto(dl.toString(), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(2000);
      };
      let opened = false;
      let taskId = '';
      for (let i = 0; i < Math.min(rowN, 8) && !opened; i++) {
        const row = rows.nth(i);
        const rowTxt = ((await row.innerText().catch(() => '')) || '').trim();
        const m = rowTxt.match(/SVC-\d{8}-\d+/);
        if (!m || !/已完成/.test(rowTxt)) continue;
        taskId = m[0];
        const resBtn = row
          .getByRole('button', { name: /查看结果/ })
          .or(row.getByText(/^查看结果/))
          .first();
        if (await resBtn.count()) {
          if (!(await resBtn.isDisabled().catch(() => false))) {
            await resBtn.click({ timeout: 8000 });
            for (let j = 0; j < 12; j++) {
              await page.waitForTimeout(1000);
              if (await onResult()) {
                opened = true;
                break;
              }
            }
          }
        }
        if (!opened) {
          await recTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
          await openViaDeeplink(taskId);
          if (await onResult()) opened = true;
        }
        if (!opened) {
          await recTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(1200);
        }
      }
      if (!opened) {
        throw new Error(
          'ENV-SVCCAP-VIEW-RESULT-UNREACHABLE：已完成行「查看结果」与 task 深链均未进结果页 task=' +
            taskId +
            ' url=' +
            page.url(),
        );
      }
      await expect(title).toBeVisible({ timeout: 8000 });
      const url0 = page.url();
      if (!/[?&]view=result/.test(url0)) {
        throw new Error('未进入结果页 URL（缺 view=result）: ' + url0);
      }
      if (taskId && !url0.includes(taskId)) {
        const bodyCheck = ((await page.locator('main').last().innerText().catch(() => '')) || '');
        if (!bodyCheck.includes(taskId) && !/技术力横向对比结果/.test(bodyCheck)) {
          throw new Error('结果页 URL 未携带任务 ' + taskId + ': ' + url0);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  FUNC-04302；步骤：分析记录 → 已完成行「查看结果」（expect 自含；runner steps 不含行内点击）。优先点行内「查看结果」并轮询 view=result；
  若记录表点击不落路由则同 task_id 深链 view=result（对齐 FUNC-04301 / P0-08）。预期标题「技术力横向对比结果」，与 04288 同一结果结构。
  无已完成行→ENV-SVCCAP-NO-COMPLETED-RECORD。catalog_path=entry-seed。fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04302。零 allow_skip。
