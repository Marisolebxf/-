id: FUNC-04291
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04291
priority: P0
tier: A
title: 主流程-结果图型 · 只有排名列表
story: US-SVC-ORG-06
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - env-gate overall=fail（只打开已完成任务结果视图，不点「开始评估」）
  - 分析记录存在 ≥1 条已完成任务；GET result 无 dimension_scores（无维度分）
locators:
  rec_tab: tab「分析记录」
  view_btn: 「查看结果」
  result_title: 「技术力横向对比结果」
  chart_switch: '[data-testid="svc-org-cap-chart-switch"]'
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 已打开无维度分的结果页；看结果标题旁图型选项（真实操作在 expect 内）
expect:
  - note: 1、只有「排名列表」一项（无维度分时不出现雷达图选项）
    assert: |-
      const base = (baseUrl || 'http://10.50.69.111:30892').replace(/\/?$/, '');
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      await page.goto(base + route, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) {
          await close.first().click();
          await page.waitForTimeout(300);
        }
      }
      await page.getByRole('tab', { name: '分析记录', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await expect(page.getByText('已完成').first()).toBeVisible({ timeout: 8000 });
      const vb = page.getByRole('button', { name: '查看结果' });
      const view = (await vb.count()) ? vb.first() : page.getByText('查看结果', { exact: true }).first();
      await view.click({ timeout: 5000 });
      await page.waitForTimeout(2000);
      await expect(page).toHaveURL(/view=result/);
      await expect(page).toHaveURL(/task_id=SVC-/);
      await expect(page.getByText('技术力横向对比结果', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const sw = page.locator('[data-testid="svc-org-cap-chart-switch"]');
      await expect(sw).toBeVisible({ timeout: 8000 });
      const radios = sw.locator('input[type=radio]');
      const radioN = await radios.count();
      if (radioN !== 1) throw new Error('图型选项 radio 数量=' + radioN + '，预期仅 1 项「排名列表」');
      const val = String(await radios.first().getAttribute('value'));
      if (val !== 'ranking') throw new Error('唯一图型 value=' + val + ' ≠ ranking');
      const labelBtns = sw.locator('label.arco-radio-button');
      const labelN = await labelBtns.count();
      if (labelN !== 1) throw new Error('图型选项可见项数=' + labelN + '，预期仅 1 项「排名列表」');
      const labelTxt = String(await labelBtns.first().innerText()).replace(/\s+/g, '').trim();
      if (labelTxt !== '排名列表') throw new Error('图型文案=' + labelTxt + ' ≠ 排名列表');
      if (await sw.getByText('雷达图', { exact: true }).count()) {
        throw new Error('无维度分结果页不应出现「雷达图」图型选项');
      }
      if (await sw.locator('input[value=radar]').count()) {
        throw new Error('无 dimension_scores 却渲染雷达 radio');
      }
      const checkedVal = await sw.locator('input[type=radio]:checked').first().getAttribute('value');
      if (checkedVal !== 'ranking') throw new Error('默认选中=' + checkedVal + ' ≠ ranking');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  蓝本 FUNC-04291（主流程-结果图型·只有排名列表）。entry-seed catalog_path；env-gate fail 不发起评估。
  前置=分析记录打开无 dimension_scores 结果；结果标题旁 [data-testid=svc-org-cap-chart-switch] 仅 1 个 ranking radio、文案「排名列表」、无雷达分支（scout-p008 / P0-08 同源）。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04291。零 allow_skip。
