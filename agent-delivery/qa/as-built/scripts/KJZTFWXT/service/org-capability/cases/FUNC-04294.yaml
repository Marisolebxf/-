id: FUNC-04294
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04294
priority: P0
tier: A
title: 主流程-对比篮回填 · 确定两家
story: US-SVC-ORG-08
entry_id: svc-org-capability
preconditions:
  - 已登录 admin（runner 会话前置）
  - 已进入 capability 工作区；系统对比篮服务机构 ≥2 家（不点「开始评估」）
locators:
  import_btn: '[data-testid="svc-org-cap-import-basket"]'
  return_basket: '[data-testid="svc-org-cap-open-basket"]'
  picker_title: 选择分析服务机构
  basket_workspace: '[data-testid="service-org-compare-basket-workspace"]'
  org_tags: .svc-org-cap-compare__tags .arco-tag
  count_head: .svc-org-cap-compare__head
  model_panel: .ent-section-panel（技术力评价模型）
steps:
  - action: goto
    target: /service/institution-judgment?workspace=capability&tab=capability
  - action: evaluate
    note: 已「从对比篮带入」→「返回对比篮」→浮层只保留两家→确定（真实操作在 expect 内）
expect:
  - note: 1、浮层关闭
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const prepImport = async () => {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        await closeBasket();
        const tags = page.locator('.svc-org-cap-compare__tags .arco-tag');
        const tagN = await tags.count();
        if (tagN < 2) {
          throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001：对比篮服务机构不足 2 家，当前 tags=' + tagN);
        }
        const imp = page.locator('[data-testid="svc-org-cap-import-basket"]').first();
        await expect(imp).toBeVisible({ timeout: 8000 });
        await imp.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const ret = page.locator('[data-testid="svc-org-cap-open-basket"]').or(page.getByRole('button', { name: '返回对比篮', exact: true })).first();
        await expect(ret).toBeVisible({ timeout: 8000 });
        await ret.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await expect(page.getByText('选择分析服务机构').first()).toBeVisible({ timeout: 10000 });
        const ws = page.locator('[data-testid="service-org-compare-basket-workspace"]');
        await expect(ws).toBeVisible({ timeout: 8000 });
        return ws;
      };
      const keepTwoChecked = async (ws) => {
        const countChecked = async () => await ws.locator('.arco-checkbox.arco-checkbox-checked').count();
        let n = await countChecked();
        while (n > 2) {
          await ws.locator('.arco-checkbox.arco-checkbox-checked').last().click({ timeout: 5000 });
          await page.waitForTimeout(280);
          n = await countChecked();
        }
        while (n < 2) {
          const next = ws.locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)').first();
          await expect(next).toBeVisible({ timeout: 8000 });
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(280);
          n = await countChecked();
        }
        if (n !== 2) throw new Error('浮层勾选数=' + n + '，预期保留 2 家');
      };
      const ws = await prepImport();
      await keepTwoChecked(ws);
      const confirm = page.locator('[data-testid="compare-basket-action-bar"]').getByRole('button', { name: '确定', exact: true }).last();
      await expect(confirm).toBeEnabled({ timeout: 8000 });
      await confirm.click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      await expect(page.getByText('选择分析服务机构').first()).toBeHidden({ timeout: 8000 });
      const panelOpen = page.locator('.system-compare-panel[data-panel-open="true"], .system-compare-panel:visible').filter({ hasText: '选择分析服务机构' });
      if (await panelOpen.count() && await panelOpen.first().isVisible().catch(() => false)) {
        throw new Error('点确定后选择浮层仍可见');
      }
      globalThis.__func04294 = { done: true };
  - note: 2、对比机构当前为 2 家
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/?$/, '') : 'http://10.50.69.111:30892';
      const route = '/service/institution-judgment?workspace=capability&tab=capability';
      if (!globalThis.__func04294?.done) {
        await page.goto(origin + route, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click().catch(() => {});
          await page.waitForTimeout(300);
        }
        const tags = page.locator('.svc-org-cap-compare__tags .arco-tag');
        if ((await tags.count()) < 2) throw new Error('ENV-SVCCAP-BASKET-ORG-LT2-001');
        await page.locator('[data-testid="svc-org-cap-import-basket"]').first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.locator('[data-testid="svc-org-cap-open-basket"]').first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const ws = page.locator('[data-testid="service-org-compare-basket-workspace"]');
        let n = await ws.locator('.arco-checkbox.arco-checkbox-checked').count();
        while (n > 2) {
          await ws.locator('.arco-checkbox.arco-checkbox-checked').last().click();
          await page.waitForTimeout(250);
          n = await ws.locator('.arco-checkbox.arco-checkbox-checked').count();
        }
        while (n < 2) {
          await ws.locator('.arco-checkbox:not(.arco-checkbox-checked):not(.arco-checkbox-disabled)').first().click();
          await page.waitForTimeout(250);
          n = await ws.locator('.arco-checkbox.arco-checkbox-checked').count();
        }
        await page.locator('[data-testid="compare-basket-action-bar"]').getByRole('button', { name: '确定', exact: true }).last().click({ timeout: 8000 });
        await page.waitForTimeout(1000);
      }
      const head = ((await page.locator('.svc-org-cap-compare__head').innerText()) || '').replace(/\s+/g, '');
      if (!head.includes('当前2家')) throw new Error('对比机构计数行=' + head + '，预期含 当前2家');
      const checked = await page.locator('.svc-org-cap-compare__tags .arco-tag-checked').count();
      if (checked !== 2) throw new Error('对比机构选中 tags=' + checked + '，预期 2');
  - note: 3、仍停在「技术力评价模型」，没有过程页
    assert: |-
      const url = page.url();
      if (/view=processing/.test(url)) throw new Error('误入过程页 url=' + url);
      if (/view=result/.test(url) && /task_id=SVC-/.test(url)) throw new Error('误入结果页 url=' + url);
      const proc = page.locator('[data-testid="svc-org-analysis-process"]');
      if (await proc.count() && await proc.first().isVisible().catch(() => false)) {
        throw new Error('出现过程壳，未停在评价模型配置态');
      }
      const panel = page.locator('.ent-section-panel', { hasText: '技术力评价模型' }).first();
      await expect(panel).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('技术力评价模型').first()).toBeVisible({ timeout: 8000 });
      const start = page.locator('[data-testid="svc-org-start-eval"]').first();
      await expect(start).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；篮<2 家→ENV-SVCCAP-BASKET-ORG-LT2-001
as_built_note: >-
  蓝本 FUNC-04294（浮层确定回填两家，不发起评估）。前置=对比篮 tags≥2→「从对比篮带入」→「返回对比篮」
  （testid=svc-org-cap-open-basket）→系统篮 picker「选择分析服务机构」+ workspace 勾选保留 2 家→确定写 org_ids[]。
  三条 expect：浮层关闭 / head 当前2家+2 枚 tag-checked / 仍见技术力评价模型且无 view=processing|result 过程壳。
  fid=ZNFWJQ-KJZTFWXT-v1.0-FUNC-04294。零 allow_skip。
