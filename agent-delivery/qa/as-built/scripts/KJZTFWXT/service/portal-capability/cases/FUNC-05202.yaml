id: FUNC-05202
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05202
priority: P1
tier: B
title: 备选-页签往返产业仍在
entry_id: svc-portal-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/capability-rank
  - action: evaluate
    note: 选择产业「海洋」
    target: |-
      const main = page.locator('main');
      const view = main.locator('.svc-portal-industry-cascader .arco-cascader-view').first();
      await view.click({ timeout: 8000 });
      const menu = page.locator('.svc-portal-industry-cascader-menu').last();
      await menu.waitFor({ state: 'visible', timeout: 8000 });
      const row = menu.locator('.arco-cascader-list-item').filter({ hasText: '海洋产业' }).first();
      await row.locator('.arco-cascader-list-item-label').click({ timeout: 8000 });
      await expect(main.locator('.svc-portal-section-title').filter({ hasText: /海洋/ }).first()).toBeVisible({ timeout: 15000 });
  - action: click
    target: 全球服务机构概况
  - action: evaluate
    note: 等待概况页
    target: |-
      await page.waitForURL(/\\/service-portal\\/overview/, { timeout: 10000 });
  - action: click
    target: 服务机构技术能力
  - action: evaluate
    note: 等待回到技术能力页
    target: |-
      await page.waitForURL(/\\/service-portal\\/capability-rank/, { timeout: 10000 });
expect:
  - note: 1、产业选择仍为「海洋」
    assert: |-
      const cascader = page.locator('main .svc-portal-industry-cascader .arco-cascader-view').first();
      await expect(cascader).toContainText('海洋', { timeout: 15000 });
  - note: 2、主标题为「服务机构技术能力」
    assert: |-
      await expect(page.locator('main').getByRole('heading', { name: '服务机构技术能力' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
