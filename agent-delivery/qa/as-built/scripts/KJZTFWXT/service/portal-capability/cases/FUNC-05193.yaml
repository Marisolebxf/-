id: FUNC-05193
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05193
priority: P1
tier: B
title: 主流程-产业链选项随产业变化
entry_id: svc-portal-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/capability-rank
expect:
  - note: 新一代信息技术下产业链为 6 个（附录B）
    assert: |-
      await page.getByLabel('产业集群与产业筛选').click();
      await page.locator('.arco-cascader-list-column').nth(0).getByText('新一代信息技术').click();
      const col2 = page.locator('.arco-cascader-list-column').nth(1);
      await expect(col2.locator('.arco-cascader-option')).toHaveCount(6);
  - note: 生物下产业链为 2 个（附录C）
    assert: |-
      await page.getByLabel('产业集群与产业筛选').click();
      await page.locator('.arco-cascader-list-column').nth(0).getByText(/^生物/).first().click();
      const col2 = page.locator('.arco-cascader-list-column').nth(1);
      await expect(col2.locator('.arco-cascader-option')).toHaveCount(2);
on_fail: 截图 + 抄 X-Trace-Id
