id: FUNC-05198
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05198
priority: P0
tier: B
title: 主流程-技术力五维标签
entry_id: svc-portal-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/capability-rank
  - action: click
    target: 分析画像
expect:
  - note: 技术力五维含 cases、experts、patents
    assert: |-
      const drawer = page.locator('.arco-drawer');
      await expect(drawer.getByText('cases', { exact: true })).toBeVisible();
      await expect(drawer.getByText('experts', { exact: true })).toBeVisible();
      await expect(drawer.getByText('patents', { exact: true })).toBeVisible();
  - note: 技术力五维含 standards、rdInvestment
    assert: |-
      const drawer = page.locator('.arco-drawer');
      await expect(drawer.getByText('standards', { exact: true })).toBeVisible();
      await expect(drawer.getByText('rdInvestment', { exact: true })).toBeVisible();
  - note: 五个标签各有数值
    assert: |-
      const drawer = page.locator('.arco-drawer');
      await expect(drawer.locator('div').filter({ has: drawer.getByText('cases', { exact: true }) }).getByText('1', { exact: true })).toBeVisible();
      await expect(drawer.locator('div').filter({ has: drawer.getByText('experts', { exact: true }) }).getByText('0', { exact: true })).toBeVisible();
      await expect(drawer.locator('div').filter({ has: drawer.getByText('patents', { exact: true }) }).getByText('0', { exact: true })).toBeVisible();
      await expect(drawer.locator('div').filter({ has: drawer.getByText('standards', { exact: true }) }).getByText('0', { exact: true })).toBeVisible();
      await expect(drawer.locator('div').filter({ has: drawer.getByText('rdInvestment', { exact: true }) }).getByText('1 万元', { exact: true })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
