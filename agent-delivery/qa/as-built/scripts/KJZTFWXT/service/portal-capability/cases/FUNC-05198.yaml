id: FUNC-05198
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05198
priority: P1
tier: B
title: 主流程-技术力五维标签
entry_id: svc-portal-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/capability-rank
  - action: click
    target: |-
      await page.getByText('在库/返回', { exact: false }).first().waitFor({ state: 'visible', timeout: 20000 })
      const profileBtn = page.locator('main').getByRole('button', { name: '分析画像' }).first()
      await profileBtn.scrollIntoViewIfNeeded()
      await profileBtn.click({ timeout: 20000 })
expect:
  - note: 1、技术力五维含 cases、experts、patents
    assert: |-
      await expect(page.getByText('cases', { exact: true })).toBeVisible()
      await expect(page.getByText('experts', { exact: true })).toBeVisible()
      await expect(page.getByText('patents', { exact: true })).toBeVisible()
  - note: 2、技术力五维含 standards、rdInvestment
    assert: |-
      await expect(page.getByText('standards', { exact: true })).toBeVisible()
      await expect(page.getByText('rdInvestment', { exact: true })).toBeVisible()
  - note: 3、五个标签各有数值
    assert: |-
      await page.getByText('技术力五维').waitFor({ state: 'visible', timeout: 15000 })
      for (const label of ['cases', 'experts', 'patents', 'standards', 'rdInvestment']) {
        const tag = page.getByText(label, { exact: true })
        await expect(tag).toBeVisible()
        const row = tag.locator('xpath=ancestor::*[self::div or self::li or self::tr][1]')
        await expect(row).toContainText(/\d+\.?\d*/, { timeout: 10000 })
      }
on_fail: 截图 + 抄 X-Trace-Id
