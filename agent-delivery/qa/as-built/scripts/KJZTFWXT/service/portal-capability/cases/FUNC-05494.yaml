id: FUNC-05494
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05494
priority: P0
tier: B
title: 主流程-分析画像抽屉区块
entry_id: svc-portal-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/capability-rank
  - action: wait
    for: 榜单加载
    timeout_ms: 1500
  - action: click
    target: 按钮 分析画像
expect:
  - note: 抽屉标题为「机构画像」加该行机构名
    assert: |-
      const main = page.locator('main');
      const orgName = ((await main.locator('.svc-portal-org__name').first().textContent()) ?? '').trim();
      if (!orgName) throw new Error('无法读取榜单行机构名');
      const drawer = page.locator('.arco-drawer');
      await expect(drawer).toBeVisible({ timeout: 20000 });
      await expect(drawer).toContainText('机构画像');
      await expect(drawer).toContainText(orgName);
  - note: 区块依次为基本信息、领域覆盖细分、技术力五维、近三年新增服务记录
    assert: |-
      const drawer = page.locator('.arco-drawer');
      await expect(drawer).toBeVisible({ timeout: 20000 });
      const sections = drawer.locator('section.svc-drawer-section');
      await expect(sections).toHaveCount(4, { timeout: 20000 });
      const titles = ['基本信息', '领域覆盖细分', '技术力五维', '近三年新增服务记录'];
      for (let i = 0; i < titles.length; i++) {
        await expect(sections.nth(i)).toContainText(titles[i]);
      }
      const drawerText = ((await drawer.textContent()) ?? '').replace(/\s+/g, ' ');
      let last = -1;
      for (const t of titles) {
        const idx = drawerText.indexOf(t);
        if (idx < 0 || idx <= last) throw new Error(`区块顺序不符: ${t}`);
        last = idx;
      }
on_fail: 截图 + 抄 X-Trace-Id
