id: FUNC-05205
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05205
priority: P1
tier: B
title: 备选-关闭机构画像
entry_id: svc-portal-capability
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/capability-rank
  - action: wait
    for: 榜单加载
    timeout_ms: 1500
  - action: evaluate
    note: 记录首行机构名供关闭后断言
    assert: |-
      await page.locator('main .svc-portal-org__name').first().waitFor({ state: 'visible', timeout: 15000 });
      const orgName = (await page.locator('main .svc-portal-org__name').first().innerText()).trim();
      await page.evaluate((name) => { window.__FUNC05205_orgName = name; }, orgName);
  - action: click
    target: 按钮 分析画像
  - action: click
    target: |-
      const drawer = page.locator('.arco-drawer-open');
      await drawer.waitFor({ state: 'visible', timeout: 10000 });
      await drawer.locator('.arco-drawer-close-btn').click({ timeout: 10000 });
      if (await drawer.isVisible()) await page.keyboard.press('Escape');
      await expect(drawer).toBeHidden({ timeout: 10000 });
expect:
  - note: 机构画像抽屉关闭
    assert: |-
      await expect(page.locator('.arco-drawer-open')).toHaveCount(0);
      await expect(page.getByText('基本信息')).not.toBeVisible();
  - note: 该行机构仍在榜单中
    assert: |-
      const orgName = await page.evaluate(() => window.__FUNC05205_orgName);
      await expect(page.locator('main .svc-portal-org__name').filter({ hasText: orgName }).first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
