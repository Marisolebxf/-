id: FUNC-04992
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04992
priority: P0
tier: B
title: 默认结论条
entry_id: svc-portal-industry
preconditions:
  - 已登录（runner 会话前置）
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
expect:
  - note: 1、结论条以「全部产业」起头
    assert: |-
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      const strip = page.locator('main .ent-judgment-strip, main .svc-portal-conclusion').first();
      await expect(strip).toBeVisible({ timeout: 15000 });
      const txt = ((await strip.innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/^「全部产业」/.test(txt)) {
        throw new Error('结论条未以「全部产业」起头: ' + txt.slice(0, 160));
      }
  - note: 2、结论条写明本包络不按产业切片
    assert: |-
      const strip = page.locator('main .ent-judgment-strip, main .svc-portal-conclusion').first();
      const txt = ((await strip.innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/本包络不按产业切片/.test(txt)) {
        throw new Error('结论条未写明本包络不按产业切片: ' + txt.slice(0, 160));
      }
  - note: 3、结论条以「待核验」收尾
    assert: |-
      const strip = page.locator('main .ent-judgment-strip, main .svc-portal-conclusion').first();
      const txt = ((await strip.innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/待核验[。.]?$/.test(txt)) {
        throw new Error('结论条未以「待核验」收尾: ' + txt.slice(0, 200));
      }
on_fail: 截图 + X-Trace-Id
