id: FUNC-05004
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05004
priority: P1
tier: B
title: 刷新后保留选择
story: US-SVC-PT-02
entry_id: svc-portal-industry
preconditions:
  - 已打开服务机构产业分布
locators:
  industry: .svc-portal-filter input[placeholder="全部产业"]
  chain: .svc-portal-filter input[placeholder="全部产业链"]
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 选择产业「生物」；选择产业链「生物医药与生命健康」；刷新页面
expect:
  - note: 1、产业仍显示「生物」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业分布|全部产业/.test(t);
      };
      const readIndustry = async () => {
        const filter = page.locator('.svc-portal-filter').first();
        const ind = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业"]') }).first();
        const indVal = ((await filter.locator('input[placeholder="全部产业"]').first().inputValue().catch(() => '')) || '').trim();
        const indView = ((await ind.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        return indVal + indView;
      };
      const assertIndustryBio = async (phase) => {
        const combined = await readIndustry();
        if (!/生物/.test(combined)) {
          throw new Error('[' + phase + '] 产业未保持「生物」；combined=' + combined);
        }
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链 industry-distribution SPA404，无法验刷新保留选择 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      const filter = page.locator('.svc-portal-filter').first();
      await expect(filter).toBeVisible({ timeout: 8000 });
      const ind = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业"]') }).first();
      await ind.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物' }).first().click();
      await page.waitForTimeout(800);
      const chainSel = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业链"]') }).first();
      await chainSel.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物医药与生命健康' }).first().click();
      await page.waitForTimeout(800);
      await assertIndustryBio('选产业链后');
      await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 20000 });
      await expect(page.locator('.svc-portal-filter').first()).toBeVisible({ timeout: 15000 });
      await assertIndustryBio('刷新后');
  - note: 2、产业链仍显示「生物医药与生命健康」
    assert: |-
      const readChain = async () => {
        const filter = page.locator('.svc-portal-filter').first();
        const chainView = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业链"]') }).first();
        const chainVal = ((await filter.locator('input[placeholder="全部产业链"]').first().inputValue().catch(() => '')) || '').trim();
        const chainTxt = ((await chainView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        return chainVal + chainTxt;
      };
      const combined = await readChain();
      if (!/生物医药与生命健康/.test(combined)) {
        throw new Error('刷新后产业链未保持「生物医药与生命健康」；combined=' + combined);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  深链 catalog_path=/service-portal/industry-distribution。选产业「生物」+产业链「生物医药与生命健康」后 reload，
  .svc-portal-filter 两路 Arco Select 回显应保持（US-SVC-PT-02 刷新保留）。edu tts/svcz SPA404→ENV-EDU-TTS-SVCZ-404-001。
