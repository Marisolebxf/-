id: FUNC-05004
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05004
priority: P1
tier: B
title: 刷新后保留选择
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: click
    note: 选择产业「生物」
    assert: |-
      const main = page.locator('main');
      await main.locator('.arco-cascader-view').first().click({ timeout: 15000 });
      const popup = page.locator('.arco-cascader-popup:visible');
      await popup.locator('.arco-cascader-column').first().getByText('生物', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
  - action: click
    note: 选择产业链「生物医药与生命健康」
    assert: |-
      const main = page.locator('main');
      await main.locator('.arco-cascader-view').nth(1).click({ timeout: 15000 });
      const popup = page.locator('.arco-cascader-popup:visible');
      await popup.locator('.arco-cascader-column').first().getByText('生物医药与生命健康', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
  - action: reload
expect:
  - note: 1、产业仍显示「生物」
    assert: |-
      const main = page.locator('main');
      const industryView = main.locator('.arco-cascader-view').first();
      await expect(industryView).toContainText('生物', { timeout: 20000 });
  - note: 2、产业链仍显示「生物医药与生命健康」
    assert: |-
      const main = page.locator('main');
      const chainView = main.locator('.arco-cascader-view').nth(1);
      await expect(chainView).toContainText('生物医药与生命健康', { timeout: 20000 });
on_fail: 截图 + 抄 X-Trace-Id
