id: FUNC-05004
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05004
priority: P1
tier: B
title: 刷新后保留选择
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 选择产业「生物」；选择产业链「生物医药与生命健康」；刷新页面
expect:
  - note: 1、产业仍显示「生物」
    assert: |-
      const main = page.locator('main');
      const cascader = () => main.locator('.arco-cascader-view').first();
      const cascaderText = async () =>
        ((await cascader().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      const pickCascader = async () => {
        await cascader().click({ timeout: 15000 });
        await page.waitForTimeout(400);
        const popup = page.locator('.arco-trigger-popup:visible');
        await popup.locator('.arco-cascader-option').filter({ hasText: '生物' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await popup.locator('.arco-cascader-option').filter({ hasText: '生物医药' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 20000 });
      await pickCascader();
      let text = await cascaderText();
      if (!/生物/.test(text)) {
        throw new Error('选级联后产业未含「生物」；text=' + text);
      }
      await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
      await expect(cascader()).toBeVisible({ timeout: 20000 });
      text = await cascaderText();
      if (!/生物/.test(text)) {
        throw new Error('刷新后产业未含「生物」；text=' + text);
      }
  - note: 2、产业链仍显示「生物医药与生命健康」
    assert: |-
      const main = page.locator('main');
      const text = ((await main.locator('.arco-cascader-view').first().innerText().catch(() => '')) || '')
        .replace(/\s+/g, ' ')
        .trim();
      if (!/生物医药/.test(text)) {
        throw new Error('刷新后产业链未含「生物医药与生命健康」；text=' + text);
      }
on_fail: 截图 + 抄 X-Trace-Id
