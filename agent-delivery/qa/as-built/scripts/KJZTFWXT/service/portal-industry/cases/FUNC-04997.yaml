id: FUNC-04997
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04997
priority: P0
tier: B
title: 主流程-产业下拉选项
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 展开产业下拉
expect:
  - note: 1、选项共 15 个，名称见附录 C
    assert: |-
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      const expected = [
        '新一代信息技术',
        '生物',
        '新能源',
        '新材料',
        '高端装备',
        '智能网联新能源汽车',
        '绿色环保',
        '低空经济与空天',
        '传统与创意',
        '海洋',
        '未来制造',
        '未来信息',
        '未来能源',
        '未来空间',
        '未来健康',
      ];
      const filter = page.locator('.svc-portal-filter');
      await expect(filter.getByText('产业集群 / 产业')).toBeVisible({ timeout: 15000 });
      const cascader = page.locator('.svc-portal-industry-cascader .arco-cascader-view').first();
      await expect(cascader).toBeVisible({ timeout: 15000 });
      await cascader.click({ timeout: 15000 });
      const menu = page.locator('.svc-portal-industry-cascader-menu');
      await expect(menu).toBeVisible({ timeout: 15000 });
      const col = menu.locator('.arco-cascader-list-column').first();
      await expect(col).toBeVisible({ timeout: 15000 });
      const opts = col.locator('.arco-cascader-option');
      await expect(opts.first()).toBeVisible({ timeout: 15000 });
      const n = await opts.count();
      const norm = (t) => (t || '').replace(/\s+/g, ' ').trim().replace(/（[^）]*）$/, '');
      if (n !== 15) {
        const preview = [];
        for (let i = 0; i < Math.min(n, 20); i++) {
          preview.push(norm(await opts.nth(i).innerText()));
        }
        throw new Error('产业下拉选项应为 15 个，实际 count=' + n + ' labels=' + JSON.stringify(preview));
      }
      const texts = [];
      for (let i = 0; i < 15; i++) {
        texts.push(norm(await opts.nth(i).innerText()));
      }
      for (let i = 0; i < expected.length; i++) {
        if (texts[i] !== expected[i]) {
          throw new Error(
            '产业下拉选项顺序/文案不符：第' + (i + 1) + '项期望「' + expected[i] + '」实际「' + texts[i] + '」；全集=' + JSON.stringify(texts),
          );
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
