id: FUNC-04998
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04998
priority: P0
tier: B
title: 产业链初始禁用
story: US-SVC-PT-02
entry_id: svc-portal-industry
preconditions:
  - 已打开服务机构产业分布
  - 产业为全部产业
locators:
  industry: .svc-portal-filter input[placeholder="全部产业"]
  chain: .svc-portal-filter .arco-select-view（placeholder 全部产业链）
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 点击产业链下拉
expect:
  - note: 1、产业链下拉保持禁用
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业分布|全部产业/.test(t);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: catalog_path /service-portal/industry-distribution SPA404，无法验产业链禁用 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      await expect(page.locator('input[placeholder="全部产业"]')).toBeVisible({ timeout: 8000 });
      const filter = page.locator('.svc-portal-filter').first();
      await expect(filter).toBeVisible({ timeout: 8000 });
      const chain = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业链"]') }).first();
      await expect(chain).toBeVisible({ timeout: 8000 });
      const dis = await chain.evaluate((el) => el.className.includes('disabled'));
      if (!dis) throw new Error('未选产业时产业链下拉应禁用（arco-select-disabled）');
  - note: 2、不出现产业链选项
    assert: |-
      const filter = page.locator('.svc-portal-filter').first();
      const chain = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业链"]') }).first();
      try { await chain.click({ timeout: 1500 }); } catch {}
      await page.waitForTimeout(400);
      const chainOpts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      const n = await chainOpts.count();
      if (n > 0) {
        const preview = [];
        for (let i = 0; i < Math.min(n, 5); i++) {
          preview.push(((await chainOpts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
        }
        throw new Error('产业链禁用态点击后仍出现选项 count=' + n + ' labels=' + JSON.stringify(preview));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  深链 entry-seed catalog_path /service-portal/industry-distribution。筛选条 ServicePortalShell +
  IndustryCatalogSelect（chainDisabled 逻辑：!industryId）。占位「全部产业链」。断言模式对齐 FUNC-01308 / portal 姊妹条。
