id: FUNC-04998
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04998
priority: P1
tier: B
title: 主流程-产业链初始禁用
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 产业为全部产业（同册05003清除）
    target: |-
      const main = page.locator('main');
      const filter = main.locator('.svc-portal-filter').first();
      await filter.waitFor({ state: 'visible', timeout: 15000 });
      const cascader = filter.locator('.arco-cascader').first();
      const clearIcon = cascader.locator('.arco-icon-hover, .arco-cascader-clear-icon, .arco-icon-close').first();
      if (await clearIcon.isVisible().catch(() => false)) {
        await clearIcon.click({ timeout: 5000 });
        await page.waitForTimeout(600);
      }
  - action: evaluate
    note: 点击产业链下拉
    target: |-
      const main = page.locator('main');
      const filter = main.locator('.svc-portal-filter').first();
      const chainSelect = filter.locator('.arco-select').filter({ hasText: '全部产业链' }).first();
      if (await chainSelect.count()) {
        await chainSelect.locator('.arco-select-view').click({ timeout: 5000 });
        return;
      }
      const chainView = filter.locator('.arco-select-view').filter({ hasText: '全部产业链' }).first();
      if (await chainView.count()) {
        await chainView.click({ timeout: 5000 });
      }
expect:
  - note: 1、产业链下拉保持禁用
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      const filter = main.locator('.svc-portal-filter').first();
      await expect(filter).toBeVisible({ timeout: 8000 });
      await expect(filter.getByText('产业集群 / 产业')).toBeVisible();
      await expect(main.getByText(/全部产业/).first()).toBeVisible({ timeout: 8000 });
      const chainSelect = filter.locator('.arco-select').filter({ hasText: '全部产业链' }).first();
      await expect(chainSelect).toHaveCount(1, { timeout: 8000 });
      await expect(chainSelect).toHaveClass(/arco-select-disabled/);
  - note: 2、不出现产业链选项
    assert: |-
      const main = page.locator('main');
      const filter = main.locator('.svc-portal-filter').first();
      const chainSelect = filter.locator('.arco-select').filter({ hasText: '全部产业链' }).first();
      if (await chainSelect.count()) {
        try {
          await chainSelect.locator('.arco-select-view').click({ timeout: 1500 });
        } catch {}
      }
      await page.waitForTimeout(400);
      const chainOpts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      await expect(chainOpts).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
