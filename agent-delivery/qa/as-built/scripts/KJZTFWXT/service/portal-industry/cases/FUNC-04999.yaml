id: FUNC-04999
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04999
priority: P0
tier: B
title: 选定生物后产业链下拉两项
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 选择产业「生物」；展开产业链下拉
expect:
  - note: 1、产业链下拉变为可选
    assert: |-
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      const filter = page.locator('.svc-portal-filter').first();
      await expect(filter).toBeVisible({ timeout: 8000 });
      const cascader = filter.locator('.svc-portal-industry-cascader').first();
      await expect(cascader).toBeVisible({ timeout: 8000 });
      await cascader.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const popup = page.locator('.arco-trigger-popup:visible');
      const col1 = popup.locator('.arco-cascader-panel-column').first();
      const bio = col1.locator('.arco-cascader-option').filter({ hasText: '生物' }).first();
      await expect(bio).toBeVisible({ timeout: 8000 });
      await bio.click();
      await page.waitForTimeout(500);
      const col2 = popup.locator('.arco-cascader-panel-column').nth(1);
      await expect(col2).toBeVisible({ timeout: 8000 });
      const enabled = col2.locator('.arco-cascader-option:not(.arco-cascader-option-disabled)');
      await expect(enabled.first()).toBeVisible({ timeout: 8000 });
  - note: 2、选项共 2 个，名称见附录 D
    assert: |-
      const popup = page.locator('.arco-trigger-popup:visible');
      let col2 = popup.locator('.arco-cascader-panel-column').nth(1);
      if (!(await col2.isVisible().catch(() => false))) {
        const filter = page.locator('.svc-portal-filter').first();
        await filter.locator('.svc-portal-industry-cascader').first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const p2 = page.locator('.arco-trigger-popup:visible');
        await p2.locator('.arco-cascader-panel-column').first().locator('.arco-cascader-option').filter({ hasText: '生物' }).first().click();
        await page.waitForTimeout(500);
        col2 = p2.locator('.arco-cascader-panel-column').nth(1);
      }
      await expect(col2).toBeVisible({ timeout: 8000 });
      const opts = col2.locator('.arco-cascader-option:not(.arco-cascader-option-disabled)');
      await expect(opts.first()).toBeVisible({ timeout: 8000 });
      const n = await opts.count();
      const expected = ['生物医药与生命健康', '高端医疗器械'];
      if (n !== 2) {
        const preview = [];
        for (let i = 0; i < Math.min(n, 10); i++) {
          preview.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
        }
        throw new Error('「生物」下产业链选项应为 2 个，实际 count=' + n + ' labels=' + JSON.stringify(preview));
      }
      const texts = [];
      for (let i = 0; i < 2; i++) {
        texts.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      for (let i = 0; i < expected.length; i++) {
        if (texts[i] !== expected[i]) {
          throw new Error(
            '产业链选项顺序/文案不符：第' + (i + 1) + '项期望「' + expected[i] + '」实际「' + texts[i] + '」；全集=' + JSON.stringify(texts),
          );
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
