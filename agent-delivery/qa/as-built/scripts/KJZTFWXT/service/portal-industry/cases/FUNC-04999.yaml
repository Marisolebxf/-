id: FUNC-04999
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04999
priority: P0
tier: B
title: 主流程-选定生物后的产业链
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: click
    assert: |-
      const main = page.locator('main');
      await main.locator('.arco-cascader-view').first().click();
      const popup = page.locator('.arco-cascader-popup');
      await popup.locator('.arco-cascader-column').first().getByText('生物', { exact: true }).click();
  - action: click
    assert: |-
      const main = page.locator('main');
      await main.locator('.arco-cascader-view').nth(1).click();
expect:
  - note: 产业链下拉变为可选
    assert: |-
      const main = page.locator('main');
      await expect(main.locator('.arco-cascader-view').nth(1).locator('input')).toBeEnabled();
  - note: 选项共 2 个，名称见附录 D
    assert: |-
      const chainCol = page.locator('.arco-cascader-popup .arco-cascader-column').last();
      await expect(chainCol.locator('.arco-cascader-option')).toHaveCount(2);
      await expect(chainCol.getByText('生物医药与生命健康', { exact: true })).toBeVisible();
      await expect(chainCol.getByText('高端医疗器械', { exact: true })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
