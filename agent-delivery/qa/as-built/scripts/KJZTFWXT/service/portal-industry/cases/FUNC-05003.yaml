id: FUNC-05003
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05003
priority: P1
tier: B
title: 备选-清除产业选择
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
expect:
  - note: 1、产业恢复占位「全部产业」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible();
      const filter = main.locator('.svc-portal-filter').first();
      const cascader = filter.locator('.arco-cascader-view').first();
      await cascader.click();
      const popup = page.locator('.arco-cascader-popup:visible');
      await expect(popup).toBeVisible({ timeout: 8000 });
      const col0 = popup.locator('.arco-cascader-column').first();
      await col0.locator('.arco-cascader-option, li').filter({ hasText: /^生物/ }).first().click();
      const col1 = popup.locator('.arco-cascader-column').nth(1);
      await expect(col1).toBeVisible({ timeout: 8000 });
      await col1.locator('.arco-cascader-option, li').filter({ hasText: /生物医药与生命健康|生物医药/ }).first().click();
      await page.waitForTimeout(500);
      await expect(cascader).toContainText(/生物/);
      await cascader.hover();
      const clearIcon = cascader.locator('.arco-icon-close').first();
      if (!(await clearIcon.isVisible().catch(() => false))) {
        throw new Error('30892 产业集群级联无 allowClear 清除图标');
      }
      await clearIcon.click();
      await page.waitForTimeout(600);
      await expect(filter).toContainText('全部产业');
  - note: 2、产业链恢复禁用，占位为「全部产业链」
    assert: |-
      const main = page.locator('main');
      const filter = main.locator('.svc-portal-filter').first();
      await expect(filter).toContainText('全部产业链');
      const chainSel = filter.locator('.arco-select-view').filter({ hasText: '全部产业链' }).first();
      if (await chainSel.count()) {
        await expect(chainSel).toHaveClass(/disabled/);
      }
  - note: 3、结论条改回以「全部产业」起头
    assert: |-
      const strip = page.locator('main .ent-judgment-strip, main .svc-portal-conclusion, main .judgment-strip').first();
      await expect(strip).toBeVisible({ timeout: 8000 });
      const txt = (await strip.innerText()).trim();
      if (!txt.startsWith('全部产业') && !/^「全部产业/.test(txt)) {
        throw new Error('清除后结论条未以「全部产业」起头: ' + txt.slice(0, 120));
      }
on_fail: 截图 + 抄 X-Trace-Id
