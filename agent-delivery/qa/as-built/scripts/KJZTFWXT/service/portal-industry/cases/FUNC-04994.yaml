priority: P1
tier: B
title: 主流程-六类分布悬停
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
expect:
  - note: 提示中含服务类型、家数与占比
    assert: |-
      const main = page.locator('main');
      const sectionTitle = main.getByText('类型分析 · 六类服务分布');
      await expect(sectionTitle).toBeVisible();
      const chart = sectionTitle.locator('xpath=ancestor::*[contains(@class,"section") or contains(@class,"Panel")][1]').locator('canvas').first();
      await chart.hover({ position: { x: 40, y: 40 } });
      const tip = page.locator('div').filter({ hasText: /%/ }).filter({ hasText: /家/ }).last();
      await expect(tip).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
