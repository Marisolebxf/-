id: FUNC-04990
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04990
priority: P0
tier: B
title: 三张指标卡
story: US-SVC-PT-02
entry_id: svc-portal-industry
preconditions:
  - 已登录（runner 会话前置）
locators:
  kpi_grid: .svc-portal-kpi-grid
  kpi_card: .svc-portal-kpi
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 进入服务机构产业分布页，核对三张指标卡
expect:
  - note: 1、三张卡标题依次为六类合计、覆盖环节数、最厚环节
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业分布/.test(t);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: catalog_path /service-portal/industry-distribution SPA404，无法验三张指标卡 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      const grid = page.locator('.svc-portal-kpi-grid');
      await expect(grid).toBeVisible({ timeout: 15000 });
      const cards = grid.locator('.svc-portal-kpi');
      await expect(cards).toHaveCount(3, { timeout: 8000 });
      const expected = ['六类合计', '覆盖环节数', '最厚环节'];
      for (let i = 0; i < expected.length; i++) {
        const label = cards.nth(i).locator('.svc-portal-kpi__label').first();
        await expect(label).toContainText(expected[i], { timeout: 8000 });
      }
  - note: 2、最厚环节名称为「研发与科研合作」
    assert: |-
      const thick = page.locator('.svc-portal-kpi').filter({
        has: page.locator('.svc-portal-kpi__label').filter({ hasText: '最厚环节' }),
      }).first();
      await expect(thick).toBeVisible({ timeout: 8000 });
      const value = thick.locator('.svc-portal-kpi__value').first();
      const raw = (await value.innerText()).replace(/\s+/g, ' ').trim();
      if (raw.includes('暂无')) {
        throw new Error('ENV-SVC-IND-KPI: stages 无正覆盖，最厚环节为暂无，无法验「研发与科研合作」');
      }
      await expect(value).toContainText('研发与科研合作', { timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/service-portal/industry-distribution；edu.itic-sci.com/tts/svcz 现 SPA404（ENV-EDU-TTS-SVCZ-404-001）。
  三 KPI 在 .svc-portal-kpi-grid；最厚环节预期「研发与科研合作」。不钉死家次数。
