id: FUNC-05001
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05001
priority: P1
tier: B
title: 选定产业链后结论条
entry_id: svc-portal-industry
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 选择产业「生物」
    assert: |-
      const main = page.locator('main');
      await main.locator('.svc-portal-industry-cascader .arco-cascader-view').first().click({ timeout: 15000 });
      await page.waitForTimeout(400);
      const popup = page.locator('.arco-cascader-popup:visible');
      await popup.locator('.arco-cascader-column').first().getByText('生物', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
  - action: evaluate
    note: 选择产业链「生物医药与生命健康」
    assert: |-
      const popup = page.locator('.arco-cascader-popup:visible');
      await popup.locator('.arco-cascader-column').nth(1).getByText('生物医药与生命健康', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
expect:
  - note: 1、结论条以「生物医药与生命健康」起头
    assert: |-
      const strip = page.locator('main .ent-judgment-strip, main .svc-portal-conclusion').first();
      await expect(strip).toBeVisible({ timeout: 15000 });
      const txt = ((await strip.innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/^「生物医药与生命健康/.test(txt)) {
        throw new Error('结论条未以「生物医药与生命健康」起头: ' + txt.slice(0, 160));
      }
  - note: 2、结论条仍写明本包络不按产业切片
    assert: |-
      const strip = page.locator('main .ent-judgment-strip, main .svc-portal-conclusion').first();
      const txt = ((await strip.innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/本包络不按产业切片/.test(txt)) {
        throw new Error('结论条未写明本包络不按产业切片: ' + txt.slice(0, 160));
      }
on_fail: 截图 + 抄 X-Trace-Id
