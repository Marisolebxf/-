id: FUNC-05002
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05002
priority: P1
tier: B
title: 选定产业链后指标卡不变
story: US-SVC-PT-02
entry_id: svc-portal-industry
preconditions:
  - 已打开服务机构产业分布
  - 产业为全部产业
locators:
  kpi_grid: .svc-portal-kpi-grid
  industry: .svc-portal-filter input[placeholder="全部产业"]
  chain: .svc-portal-filter input[placeholder="全部产业链"]
steps:
  - action: goto
    target: /service-portal/industry-distribution
  - action: evaluate
    note: 记下全部产业下六类合计；选择产业「生物」与产业链「生物医药与生命健康」
expect:
  - note: 1、六类合计家次与记下的相同
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          try { await close.first().click({ timeout: 2000 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyIs404 = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/服务机构产业分布|全部产业/.test(t);
      };
      const readTotal = async () => {
        const totalKpi = page.locator('.svc-portal-kpi').filter({
          has: page.locator('.svc-portal-kpi__label').filter({ hasText: '六类合计' }),
        }).first();
        await expect(totalKpi).toBeVisible({ timeout: 15000 });
        const raw = ((await totalKpi.locator('.svc-portal-kpi__value').first().innerText()) || '').replace(/\s+/g, ' ').trim();
        if (raw.includes('暂无')) {
          throw new Error('ENV-SVC-IND-KPI: 六类合计为暂无，无法比对产业链筛选前后不变');
        }
        return raw;
      };
      await dismissBasket();
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链 industry-distribution SPA404，无法验指标不切片 url=' + page.url());
      }
      await expect(page).toHaveURL(/service-portal\/industry-distribution/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '服务机构产业分布', level: 1 }).first()).toBeVisible({ timeout: 15000 });
      await expect(page.locator('.svc-portal-kpi-grid')).toBeVisible({ timeout: 15000 });
      const recordedTotal = await readTotal();
      const filter = page.locator('.svc-portal-filter').first();
      await expect(filter).toBeVisible({ timeout: 8000 });
      const ind = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业"]') }).first();
      await ind.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物' }).first().click();
      await page.waitForTimeout(800);
      const chain = filter.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部产业链"]') }).first();
      await chain.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物医药与生命健康' }).first().click();
      await page.waitForTimeout(800);
      const afterTotal = await readTotal();
      if (afterTotal !== recordedTotal) {
        throw new Error('选定产业链后六类合计变化：记下「' + recordedTotal + '」现「' + afterTotal + '」');
      }
  - note: 2、最厚环节名称仍为「研发与科研合作」
    assert: |-
      const thick = page.locator('.svc-portal-kpi').filter({
        has: page.locator('.svc-portal-kpi__label').filter({ hasText: '最厚环节' }),
      }).first();
      await expect(thick).toBeVisible({ timeout: 8000 });
      const value = thick.locator('.svc-portal-kpi__value').first();
      const raw = (await value.innerText()).replace(/\s+/g, ' ').trim();
      if (raw.includes('暂无')) {
        throw new Error('ENV-SVC-IND-KPI: 最厚环节为暂无，无法验「研发与科研合作」');
      }
      await expect(value).toContainText('研发与科研合作', { timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  深链 catalog_path=/service-portal/industry-distribution。全部产业下记下 .svc-portal-kpi 六类合计数值，
  选产业「生物」+产业链「生物医药与生命健康」后 KPI 不随产业链切片（Q-SVCCHAIN-03 包络语义）。不钉死具体家次。
  edu tts/svcz SPA404→ENV-EDU-TTS-SVCZ-404-001。
