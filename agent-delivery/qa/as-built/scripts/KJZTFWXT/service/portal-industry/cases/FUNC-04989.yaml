      const main = page.locator('main');
      const names = [
        '全球服务机构概况',
        '服务机构产业分布',
        '服务机构区域分布',
        '服务机构技术能力',
        '深圳产业服务介绍',
      ];
      const tabs = main.getByRole('tab');
      await expect(tabs).toHaveCount(5);
      for (let i = 0; i < names.length; i++) {
        await expect(tabs.nth(i)).toContainText(names[i]);
      }
