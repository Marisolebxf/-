id: FUNC-04790
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04790
priority: P1
tier: B
title: 主流程-统一评价框架
entry_id: svc-sz
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: click
    target: 开始分析
  - action: click
    target: 查看结果
expect:
  - note: 标题为「产业服务链统一评价框架」
    assert: |-
      const close = page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && (await close.first().isVisible().catch(() => false))) {
        try {
          await close.first().click({ timeout: 1500 });
          await page.waitForTimeout(300);
        } catch {}
      }
      const drawer = page.locator('.arco-drawer');
      await expect(drawer.getByText('产业服务链统一评价框架', { exact: false }).first()).toBeVisible({ timeout: 15000 });
  - note: 口径写明同一产业、同一统计周期、同一指标口径
    assert: |-
      const drawer = page.locator('.arco-drawer');
      const text = ((await drawer.innerText().catch(() => '')) || '').replace(/\s+/g, '');
      if (!/同一.*产业/.test(text) || !/同一.*统计周期/.test(text) || !/同一.*指标口径/.test(text)) {
        throw new Error('抽屉未见完整框架口径说明: ' + text.slice(0, 300));
      }
  - note: 出现「框架口径待甲方确认」
    assert: |-
      await expect(page.locator('.arco-drawer').getByText('框架口径待甲方确认', { exact: false })).toBeVisible();
  - note: 说明当前结果快照未带框架字段
    assert: |-
      await expect(page.locator('.arco-drawer').getByText(/结果快照.*未带.*框架字段/, { exact: false })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
