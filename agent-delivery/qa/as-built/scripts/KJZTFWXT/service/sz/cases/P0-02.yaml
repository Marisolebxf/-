id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01284
priority: P0
tier: A
title: 分析配置区齐备且产业集群下拉 15 短名与 placeholder
story: US-SVC-ECO-06
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass
  - 已进入 shenzhen 工作区且配置区可见
locators:
  config: 分析配置
  cluster_select: placeholder「选择产业集群」/ .industry-catalog-select
  start: button「开始分析」
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
expect:
  - note: 分析配置区含产业集群选择框（占位「选择产业集群」）与「开始分析」按钮
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: '开始分析', exact: true })).toBeVisible({ timeout: 8000 })
  - note: 产业集群下拉选项共 15 个且与现场短名清单一致（D1-SVCSZ-CLUSTER-SHORT-NAME）
    assert: |-
      await page.locator('.industry-catalog-select, .arco-select').filter({ has: page.locator('input[placeholder="选择产业集群"]') }).first().click({ timeout: 8000 }); await page.waitForTimeout(600); const opts=page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option'); const texts=(await opts.allTextContents()).map(t=>t.trim().replace(/\s+/g,' ')).filter(Boolean); const need=['新一代信息技术','生物','新能源','新材料','高端装备','智能网联新能源汽车','绿色环保','低空经济与空天','传统与创意','海洋','未来制造','未来信息','未来能源','未来空间','未来健康']; const noise=['外资企业','高新技术企业','小微企业','上市企业','专精特新','小巨人','链主龙头']; const clean=texts.filter(t=>!noise.includes(t)); if (clean.length!==15) throw new Error('去噪后产业集群选项数 '+clean.length+' ≠15 实见='+texts.join(',')); for (const k of need) { if (!clean.some(t=>t===k||t.includes(k))) throw new Error('缺产业集群短名: '+k+' / 实见 '+clean.join(',')) }; await page.keyboard.press('Escape')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: env-gate overall=pass；01284 只验配置区+下拉，勿硬点「开始分析」disabled（D1-SVCSZ-SOFT-START-GATE 软文案门控）。产业集群跟现场短名（生物/海洋/传统与创意/未来制造…），禁用例附录全名（D1-SVCSZ-CLUSTER-SHORT-NAME）。下拉 DOM 可能混入对比篮企业类型残影，断言前关对比篮并以 noise 去噪后认 15。placeholder=选择产业集群；selector=.industry-catalog-select。禁结果态/起任务；禁兄弟 workspace=chain/graph 断言。A 档零 allow_skip；列表 2 空格缩进。
