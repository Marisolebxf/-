id: FUNC-04801
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04801
priority: P1
tier: B
title: 备选-重新分析
entry_id: svc-sz
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: click
    target: 分析记录
  - action: click
    target: 查看结果
    options:
      first: true
  - action: evaluate
    assert: |-
      const bar = page.locator('[data-testid="svc-eco-sz-result-bar"]');
      await bar.waitFor({ state: 'visible', timeout: 30000 });
      await bar.locator('.arco-cascader-view').click();
      const popup = page.locator('.arco-cascader-popup-visible').last();
      await popup.locator('.arco-cascader-option').filter({ hasText: '海洋' }).first().click({ timeout: 15000 });
      await bar.getByRole('button', { name: '重新分析' }).click({ timeout: 15000 });
      await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 90000 });
      await page.locator('main').getByRole('button', { name: '查看结果' }).click({ timeout: 30000 });
      await expect(bar).toBeVisible({ timeout: 30000 });
expect:
  - note: 1、新结果页已经打开，不再停在过程页
    assert: |-
      await expect(page.getByRole('button', { name: '查看结果' })).toBeHidden({ timeout: 30000 });
      await expect(page.getByText('深圳服务链现状分析生成中')).not.toBeVisible()
  - note: 2、产业领域回显「海洋」
    assert: |-
      const bar = page.locator('[data-testid="svc-eco-sz-result-bar"]');
      await expect(bar.locator('.arco-cascader-view')).toContainText('海洋', { timeout: 15000 })
  - note: 3、结果页有「统一评价框架」
    assert: |-
      await expect(page.locator('main').getByText('统一评价框架')).toBeVisible({ timeout: 30000 })
on_fail: 截图 + 抄 X-Trace-Id
