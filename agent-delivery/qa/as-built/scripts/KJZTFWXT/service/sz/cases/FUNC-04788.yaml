id: FUNC-04788
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04788
priority: P0
tier: B
title: 主流程-按产业发起并看到结果
entry_id: svc-sz
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: evaluate
    assert: |-
      const cfg = page.locator('[data-testid="svc-eco-analysis-config"]');
      await cfg.waitFor({ state: 'visible', timeout: 15000 });
      await cfg.locator('.arco-cascader-view').first().click();
      await page.locator('.arco-cascader-list-column').first().getByText('新一代信息技术', { exact: true }).click({ timeout: 15000 });
      await cfg.locator('[data-testid="svc-eco-start-analysis"]').click();
      await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 90000 });
      await page.locator('main').getByRole('button', { name: '查看结果' }).click({ timeout: 30000 });
expect:
  - note: 1、结果页出现「统一评价框架」
    assert: |-
      await expect(page.locator('main').getByText('统一评价框架')).toBeVisible({ timeout: 30000 })
  - note: 2、结果页出现「横向对比分析」
    assert: |-
      await expect(page.locator('main').getByText('横向对比分析')).toBeVisible({ timeout: 30000 })
on_fail: 截图 + 抄 X-Trace-Id
