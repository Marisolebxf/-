id: FUNC-04806
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04806
priority: P1
tier: B
title: 备选-过程页回记录
entry_id: svc-sz
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: click
    target: 开始分析
expect:
  - note: 1、进入分析记录列表
    assert: |-
      await page.waitForURL(/view=processing/, { timeout: 60000 });
      await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 90000 });
      const main = page.locator('main');
      const taskText = await main.getByText(/SVC-\d{8}-\d+/).first().textContent();
      const taskId = taskText?.match(/SVC-\d{8}-\d+/)?.[0];
      if (!taskId) throw new Error('task id not found');
      await page.evaluate((id) => { sessionStorage.setItem('__qa04806TaskId', id); }, taskId);
      await main.getByRole('button', { name: '查看分析记录' }).click({ timeout: 30000 });
      await page.waitForURL(/tab=records/, { timeout: 15000 });
      await expect(page.getByRole('tab', { name: '分析记录' })).toBeVisible();
      await expect(page.locator('[data-testid="svc-eco-analysis-records"]').getByText('任务号')).toBeVisible();
  - note: 2、列表中有本次任务
    assert: |-
      const taskId = await page.evaluate(() => sessionStorage.getItem('__qa04806TaskId'));
      if (!taskId) throw new Error('missing task id');
      await expect(page.locator('[data-testid="svc-eco-analysis-records"]').getByText(taskId).first()).toBeVisible();
  - note: 3、该行状态为「已完成」
    assert: |-
      const taskId = await page.evaluate(() => sessionStorage.getItem('__qa04806TaskId'));
      const row = page.locator('[data-testid="svc-eco-analysis-records"] .arco-table-tbody tr').filter({ hasText: taskId }).first();
      await expect(row.getByText('已完成', { exact: true })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
