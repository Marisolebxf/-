priority: P0
tier: B
title: 指标数值旁角标齐备且梯队仪表盘与结论梯队描述一致（无城市场景走诚实空分支）
story: US-SVC-ECO-06
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（D4-SVCSZ-RESULT-VIA-HISTORY：分析记录 ≥1 条 type=shenzhen 已完成可「查看结果」）
  - 结果态必须经历史「查看结果」，禁默认 fresh 起任务
  - 评审模式为开启态（ⓘ/待确认角标随评审挂点渲染，勘察默认开；本条只读消费不切换）
locators:
  tab_records: tab「分析记录」（或 [data-tab-key=records]）
  view_result: button「查看结果」
  framework: data-testid=svc-eco-sz-framework
  metric_list: data-testid=svc-eco-sz-metric-list / li.svc-eco-sz-metric-row
  compare_metrics: data-testid=svc-eco-sz-compare-metrics / .arco-checkbox
  info_badge: button.metric-spec-card[aria-label^="指标说明："]（svg arco-icon-info-circle；完整度项为 question 形态归 P0-10）
  pending_badge: span.perm-pending-badge（aria 含「待核验/待甲方确认」+ Q 引用）
  mock_badge: span[aria-label="Mock 数据"]（MockBadge/IconExperiment，随部署 USE_MOCK 开关挂摘）
  metric_hook: '[data-review-metric]'（ReviewMetricBadges 容器属性=metric_id）
  compare_grid: data-testid=svc-eco-sz-compare-grid（有城市场景时图表）
  compare_empty: data-testid=svc-eco-sz-compare-empty（无城市场景诚实空）
  tier_section: data-testid=svc-eco-sz-tier（showTier=有城市图表且快照自带梯队/结论才渲染）
  tier_label: data-testid=svc-eco-sz-tier-label（无 gauge_value 时梯队标签形态）
  tier_gauge: .svc-eco-tier__gauge（ECharts gauge 仪表盘）
  conclusions: data-testid=svc-eco-sz-conclusions（结论 ul）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: evaluate
    note: 切「分析记录」→ type=shenzhen 已完成行「查看结果」进结果态（expect[0] 自含操作）
  - action: screenshot
    note: 结果态基线（框架卡+对比区）
  - action: evaluate
    note: 逐项核对对比区与框架清单指标项角标（expect[1] 自含）
  - action: screenshot
    note: 指标项角标形态
  - action: evaluate
    note: 浏览梯队区渲染形态（expect[2] 自含）
  - action: screenshot
    note: 梯队仪表盘或诚实空
  - action: evaluate
    note: 核对梯队描述与仪表盘一致性（expect[3] 自含）
  - action: screenshot
    note: 终态画面
expect:
  - note: 进结果态（P8 自含重置·双入口）——先 goto 重置页面态；若 SPA 已恢复历史结果态（框架卡可见）直接短路消费；否则切「分析记录」Tab 点 type=shenzhen 已完成行「查看结果」进结果态（D4-SVCSZ-RESULT-VIA-HISTORY，不 fresh 起任务），框架壳与对比区可达
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const fw0=page.locator('[data-testid="svc-eco-sz-framework"]'); const already=(await fw0.count())>0 && await fw0.first().isVisible().catch(()=>false); if (already) { await page.evaluate(()=>{ window.__p013Entry='stale-result（goto 后 SPA 恢复历史结果态，直接短路消费，P8）'; }, null) } else { const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })); await expect(rec.first()).toBeVisible({ timeout: 8000 }); await rec.first().click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1000); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/shenzhen/.test(body)) throw new Error('分析记录未见 type=shenzhen'); if (!/已完成/.test(body)) throw new Error('分析记录未见已完成'); const row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /shenzhen/ }).filter({ hasText: /已完成/ }).filter({ has: page.getByRole('button', { name: /查看结果/ }) }).first(); if (!(await row.count())) throw new Error('无 type=shenzhen 已完成可查看结果行'); const viewBtn=row.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); let url=page.url(); let body2=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/view=processing/.test(url) && /查看结果/.test(body2)) { const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await vr.count()) { await vr.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url(); body2=((await page.locator('main').first().innerText().catch(()=>''))||'') } }; if (/正在创建任务/.test(body2) && !/view=result|统一评价框架/.test(url+body2)) throw new Error('疑似 fresh 起任务/过程态而非历史结果: '+url); const shellOk=/view=result/.test(url) || (await fw0.count()>0) || /统一评价框架/.test(body2); if (!shellOk) throw new Error('未达结果态框架壳 url='+url+' body='+body2.slice(0,280)) }; const cmp0=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmp0.first()).toBeVisible({ timeout: 8000 }); const bn0=await cmp0.locator('.arco-checkbox').count(); if (bn0!==3) throw new Error('对比可选项 '+bn0+' ≠3（前置基线）')
  - note: 对比指标数值旁必有信息角标与待确认角标（步骤 1/预期 1）——对比区 3 个指标项逐项 ⓘ（指标说明按钮 info-circle）+ 待确认角标（aria 含待核验/待甲方确认）+ 挂点 data-review-metric=正确 metric_id；模拟数据角标按部署双分支（渲染态断齐备 / USE_MOCK=false 关闭态记 observed 不造伪）；框架清单 3 个可比项同挂点补强
    assert: |-
      const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }; const cmp=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmp.first()).toBeVisible({ timeout: 8000 }); const boxes=cmp.locator('.arco-checkbox'); const bn=await boxes.count(); if (bn!==3) throw new Error('对比可选项 '+bn+' ≠3'); const METRIC_OF={}; METRIC_OF['服务机构数量']='M_SVC_SZ_SCALE'; METRIC_OF['平均技术力得分']='M_SVC_ORG_TECH_SCORE'; METRIC_OF['服务网络密度']='M_SVC_RELATION_DENSITY'; const keys=Object.keys(METRIC_OF); const audit=[]; for (let i=0;i<bn;i++) { const b=boxes.nth(i); const t=(((await b.innerText().catch(()=>''))||'').replace(/\s+/g,'')); const mid=keys.find((k)=>t.includes(k)); if (!mid) throw new Error('对比区出现框架清单外指标项: '+t); const infoN=await b.locator('button.metric-spec-card[aria-label^="指标说明："]').count(); if (infoN<1) throw new Error(mid+' 项缺 ⓘ 信息角标（指标说明按钮）'); const svgCls=String(await b.locator('button.metric-spec-card svg').first().getAttribute('class').catch(()=>'')||''); if (!/info-circle/.test(svgCls)) throw new Error(mid+' ⓘ 图标非 info-circle: '+(svgCls||'(无)')); const pendN=await b.locator('span.perm-pending-badge').count(); if (pendN<1) throw new Error(mid+' 项缺待确认角标（perm-pending-badge）'); const pendAria=String(await b.locator('span.perm-pending-badge').first().getAttribute('aria-label').catch(()=>'')||''); if (!/待(核验|甲方确认)/.test(pendAria)) throw new Error(mid+' 待确认角标 aria 不含待核验/待甲方确认: '+pendAria.slice(0,80)); const hook=await b.evaluate((el)=>{ const g=el.querySelector('[data-review-metric]'); return g?g.getAttribute('data-review-metric'):null }); if (hook!==METRIC_OF[mid]) throw new Error(mid+' data-review-metric '+(hook||'(无)')+' ≠ '+METRIC_OF[mid]); const mockN=await b.locator('span[aria-label="Mock 数据"]').count(); audit.push({ metric: mid, info: infoN, pending: pendN, mock: mockN, hook: hook }) }; const mockTotal=audit.reduce((s,a)=>s+a.mock,0); let mockNote; if (mockTotal>=3) { mockNote='mock 角标齐备（部署 USE_MOCK=true 渲染态）' } else if (mockTotal===0) { mockNote='MockBadge 未渲染（50892 部署 USE_MOCK=false，模拟角标随部署开关统一挂摘非指标级 D4）——observed' } else { throw new Error('mock 角标部分渲染 '+mockTotal+'/3（三项形态不一致）') }; const list=page.locator('[data-testid="svc-eco-sz-metric-list"]'); await expect(list.first()).toBeVisible({ timeout: 8000 }); const lis=list.locator('li'); const fwAudit=[]; for (let j=0;j<(await lis.count());j++) { const li=lis.nth(j); const lt=((await li.innerText().catch(()=>''))||''); if (lt.includes('服务链完整度')) continue; const mid2=keys.find((k)=>lt.includes(k)); if (!mid2) continue; const infoN2=await li.locator('button.metric-spec-card[aria-label^="指标说明："]').count(); if (infoN2<1) throw new Error('框架清单 '+mid2+' 缺 ⓘ 信息角标'); const pendN2=await li.locator('span.perm-pending-badge').count(); if (pendN2<1) throw new Error('框架清单 '+mid2+' 缺待确认角标'); fwAudit.push(mid2) }; if (fwAudit.length!==3) throw new Error('框架清单可比项核对数 '+fwAudit.length+' ≠3'); await page.evaluate((v)=>{ window.__p013Badges=v; }, JSON.stringify({ audit, fwAudit, mockNote }))
  - note: 梯队仪表盘显示深圳梯队位置并带待确认角标（步骤 2/预期 2）——有城市场景：梯队区渲染、标题「梯队位置与结论」、Q-SVCCHAIN-04 待确认角标在位、gauge/梯队标签择一呈现（mock 双分支同预期 1）；无城市场景（本环境实态）：compare-empty 诚实空 + 梯队区/梯队标签结构性零渲染 + 正文无「第X梯队/梯队位置」伪词（无数据不合成伪梯队）
    assert: |-
      const grid=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const empty=page.locator('[data-testid="svc-eco-sz-compare-empty"]'); const tierSec=page.locator('[data-testid="svc-eco-sz-tier"]'); const hasGrid=(await grid.count())>0 && await grid.first().isVisible().catch(()=>false); const tierN=await tierSec.count(); const tierVis=tierN>0 && await tierSec.first().isVisible().catch(()=>false); let branch; if (hasGrid) { if (tierVis) { const headTxt=((await tierSec.first().innerText().catch(()=>''))||''); if (!/梯队位置与结论/.test(headTxt)) throw new Error('梯队区标题非「梯队位置与结论」: '+headTxt.slice(0,80)); const pendB=await tierSec.first().locator('span.perm-pending-badge').count(); if (pendB<1) throw new Error('梯队区缺待确认角标（Q-SVCCHAIN-04）'); const pendAria=String(await tierSec.first().locator('span.perm-pending-badge').first().getAttribute('aria-label').catch(()=>'')||''); if (!/Q-SVCCHAIN-04/.test(pendAria)) throw new Error('梯队区待确认角标未挂 Q-SVCCHAIN-04: '+pendAria.slice(0,100)); const mockN=await tierSec.first().locator('span[aria-label="Mock 数据"]').count(); const gaugeOk=await tierSec.first().locator('.svc-eco-tier__gauge').count(); const labelOk=await page.locator('[data-testid="svc-eco-sz-tier-label"]').count(); if (!gaugeOk && !labelOk) throw new Error('梯队区既无仪表盘也无梯队标签（深圳梯队位置未呈现）'); branch='有据：梯队区渲染（gauge='+gaugeOk+' label='+labelOk+'），Q-SVCCHAIN-04 待确认角标在位'+(mockN>0?'，mock 角标在位':'，mock 未渲染（USE_MOCK=false）——observed') } else { branch='有城市场景但快照未带梯队/结论字段：showTier 不满足、区块缺位为诚实态（只认快照自带不合成梯队）——observed' } } else { const hasEmpty=(await empty.count())>0 && await empty.first().isVisible().catch(()=>false); if (!hasEmpty) throw new Error('无城市场景未见 compare-empty 诚实空'); const et=((await empty.first().innerText().catch(()=>''))||''); if (!/无城市场景|无法绘制对比图/.test(et)) throw new Error('诚实空文案不符现场: '+et.slice(0,120)); if (tierN!==0) throw new Error('无城市场景下梯队区仍渲染（tier DOM='+tierN+'），疑似合成伪梯队'); const labelN=await page.locator('[data-testid="svc-eco-sz-tier-label"]').count(); if (labelN!==0) throw new Error('无城市场景下出现梯队标签（伪梯队位置）'); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/第[一二三]梯队|梯队位置/.test(body)) throw new Error('无城市场景正文出现梯队词（伪梯队描述）'); branch='无据：compare-empty 诚实空 + 梯队区/梯队标签结构性零渲染、正文无伪梯队词——observed（scout-p013-r1 四条历史任务均此态）' }; await page.evaluate((v)=>{ window.__p013Tier=v; }, branch)
  - note: 梯队描述与仪表盘呈现一致（步骤 3/预期 3）——有城市场景：梯队标签文本 / ECharts gauge 中心文本（formatter 求值，echarts 不可读时降级标签承载）/ 结论区梯队行三处一致；无城市场景：结论区零 DOM，未渲染即无可比对记 observed，不造伪一致性
    assert: |-
      const tierSec2=page.locator('[data-testid="svc-eco-sz-tier"]'); const grid2=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const hasGrid2=(await grid2.count())>0 && await grid2.first().isVisible().catch(()=>false); const tierVis2=(await tierSec2.count())>0 && await tierSec2.first().isVisible().catch(()=>false); let note3; if (hasGrid2 && tierVis2) { let label=null; const labelEl=page.locator('[data-testid="svc-eco-sz-tier-label"]'); if (await labelEl.count()) { label=(((await labelEl.first().innerText().catch(()=>''))||'').split('\n')[0]||'').trim() } const gaugeText=await page.evaluate(()=>{ try { const root=document.querySelector('[data-testid="svc-eco-sz-tier"]'); if (!root) return null; const ec=window.echarts; if (!ec||!ec.getInstanceByDom) return null; const nodes=root.querySelectorAll('div'); for (const nd of nodes) { const inst=ec.getInstanceByDom(nd); if (!inst) continue; const opt=inst.getOption()||{}; const s=(opt.series||[])[0]; if (!s||s.type!=='gauge') continue; const det=Array.isArray(s.detail)?s.detail[0]:s.detail; const datum=(s.data||[])[0]||{}; if (det&&typeof det.formatter==='function') return String(det.formatter({ value: datum.value })) } return null } catch (e) { return null } }); if (gaugeText==null && label==null) throw new Error('有据分支：梯队标签与仪表盘中心文本均不可读，一致性无从核'); if (gaugeText!=null && label!=null && gaugeText!==label) throw new Error('仪表盘中心文本「'+gaugeText+'」与梯队标签「'+label+'」不一致'); const concl=page.locator('[data-testid="svc-eco-sz-conclusions"]'); const conclN=await concl.count(); if (conclN>0) { const lines=((await concl.first().innerText().catch(()=>''))||'').split('\n').map((s)=>s.trim()).filter(Boolean); const ref=label!=null?label:gaugeText; const hit=lines.some((ln)=>ln.includes(ref)); if (!hit) throw new Error('结论区梯队描述未含仪表盘梯队词「'+ref+'」: '+lines.slice(0,5).join('|')); note3='有据：标签/仪表盘中心文本/结论梯队行一致（'+ref+'）' } else { note3='有据：仪表盘与标签一致；快照未带结论行——observed' } } else { const conclN2=await page.locator('[data-testid="svc-eco-sz-conclusions"]').count(); if (conclN2!==0) throw new Error('梯队区未渲染但结论区出现 DOM（描述与仪表盘脱节呈现）'); note3='无据：梯队区与结论区均零渲染，未渲染即无可比对——observed' }; await page.evaluate((v)=>{ window.__p013Consist=v; }, note3)
