id: FUNC-04800
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04800
priority: P1
tier: B
title: 备选-结果页改产业不重算
entry_id: svc-sz
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: evaluate
    assert: |-
      await page.locator('main').getByRole('tab', { name: '分析记录' }).click({ timeout: 15000 });
      const viewResult = page.locator('main').getByRole('button', { name: '查看结果' }).first();
      await viewResult.waitFor({ state: 'visible', timeout: 30000 });
      await viewResult.click();
      await expect(page.locator('[data-testid="svc-eco-sz-result-bar"]')).toBeVisible({ timeout: 30000 });
      await expect(page.locator('main').getByText('当前结果快照无城市场景，无法绘制对比图')).toBeVisible({ timeout: 30000 });
  - action: evaluate
    assert: |-
      const bar = page.locator('[data-testid="svc-eco-sz-result-bar"]');
      await bar.locator('.arco-cascader-view').click();
      await page.locator('.arco-cascader-panel .arco-cascader-list-column').first().getByText('海洋', { exact: true }).click({ timeout: 15000 });
expect:
  - note: 1、对比区仍是无法绘制对比图的原快照
    assert: |-
      await expect(page.locator('main').getByText('当前结果快照无城市场景，无法绘制对比图')).toBeVisible({ timeout: 30000 })
  - note: 2、不进入新的过程页
    assert: |-
      await expect(page.getByText('深圳服务链现状分析生成中')).toHaveCount(0)
      await expect(page.locator('[data-testid="svc-eco-sz-result-bar"]')).toBeVisible()
on_fail: 截图 + 抄 X-Trace-Id
