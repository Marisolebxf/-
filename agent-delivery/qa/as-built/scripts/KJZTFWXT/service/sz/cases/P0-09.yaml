id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01290
priority: P0
tier: B
title: 框架卡指标清单逐项含就绪度标注且与对比图表指标集一致
story: US-SVC-ECO-05
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（D4-SVCSZ-RESULT-VIA-HISTORY：分析记录 ≥1 条 type=shenzhen 已完成可「查看结果」）
  - 结果态必须经历史「查看结果」，禁默认 fresh 起任务
  - 评审模式为开启态（就绪度标注随评审挂点渲染，勘察默认开；本条只读消费不切换）
locators:
  tab_records: tab「分析记录」（或 [data-tab-key=records]）
  view_result: button「查看结果」
  framework: data-testid=svc-eco-sz-framework
  metric_list: data-testid=svc-eco-sz-metric-list / li.svc-eco-sz-metric-row
  spec_card: li 内 button.metric-spec-card（aria-label 指标说明：…；完整度项 aria-label=指标未登记：服务链完整度）
  spec_pop: .arco-popover:visible（弹卡含 指标ID/口径定义/就绪度 区块）
  compare_metrics: data-testid=svc-eco-sz-compare-metrics / .arco-checkbox
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
expect:
  - note: 切「分析记录」Tab；列表含 type=shenzhen 已完成与可点「查看结果」，点开进结果态（D4-SVCSZ-RESULT-VIA-HISTORY，不 fresh 起任务）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })); await expect(rec.first()).toBeVisible({ timeout: 8000 }); await rec.first().click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1000); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/shenzhen/.test(body)) throw new Error('分析记录未见 type=shenzhen'); if (!/已完成/.test(body)) throw new Error('分析记录未见已完成'); const row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /shenzhen/ }).filter({ hasText: /已完成/ }).filter({ has: page.getByRole('button', { name: /查看结果/ }) }).first(); if (!(await row.count())) throw new Error('无 type=shenzhen 已完成可查看结果行'); const viewBtn=row.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); let url=page.url(); let body2=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/view=processing/.test(url) && /查看结果/.test(body2)) { const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await vr.count()) { await vr.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url(); body2=((await page.locator('main').first().innerText().catch(()=>''))||'') } }; if (/正在创建任务/.test(body2) && !/view=result|统一评价框架/.test(url+body2)) throw new Error('疑似 fresh 起任务/过程态而非历史结果: '+url); const fw=page.locator('[data-testid="svc-eco-sz-framework"]'); const shellOk=/view=result/.test(url) || (await fw.count()>0) || /统一评价框架/.test(body2); if (!shellOk) throw new Error('未达结果态框架壳 url='+url+' body='+body2.slice(0,280))
  - note: 指标清单逐项含就绪度标注（用例预期 1 译作 as-built 弹卡就绪度区块：点开三项可用指标 ⓘ 弹卡均含「就绪度」四行区块且指标定义行如实「已登记/草稿语级待核验」；服务链完整度项为未登记治理引用，不显伪就绪度）
    assert: |-
      const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }; const list=page.locator('[data-testid="svc-eco-sz-metric-list"]'); await expect(list.first()).toBeVisible({ timeout: 8000 }); const lis=list.locator('li'); const liN=await lis.count(); if (liN!==4) throw new Error('指标清单行数 '+liN+' ≠4'); const names=[]; for (let i=0;i<liN;i++) { names.push((((await lis.nth(i).innerText().catch(()=>''))||'').split('\n')[0]||'').trim()) }; const need=['服务机构数量','平均技术力得分','服务网络密度','服务链完整度']; for (const k of need) { if (!names.some(n=>n===k)) throw new Error('指标清单缺项: '+k+' 实见='+names.join(',')) }; const cards=list.locator('button.metric-spec-card'); const cardN=await cards.count(); if (cardN!==4) throw new Error('就绪度/info 触发卡数 '+cardN+' ≠4'); const closePop=async ()=>{ await page.keyboard.press('Escape').catch(()=>{}); await page.waitForTimeout(250); }; const readPop=async ()=>{ const pops=page.locator('.arco-popover:visible, .arco-trigger-popup:visible, .arco-tooltip:visible'); const texts=[]; const pn=await pops.count(); for (let j=0;j<pn;j++) { const el=pops.nth(j); if (!(await el.isVisible().catch(()=>false))) continue; const t=((await el.innerText().catch(()=>''))||'').trim(); if (t) texts.push(t.replace(/\s+/g,' ')) } return texts }; const results=[]; for (let i=0;i<cardN;i++) { const card=cards.nth(i); await card.scrollIntoViewIfNeeded().catch(()=>{}); await card.click({ timeout: 8000 }); await page.waitForTimeout(1500); const texts=await readPop(); const joined=texts.join(' \n '); const item={ name: names[i], joined: joined, hasSpec: /指标ID|口径定义/.test(joined), hasReadiness: /就绪度/.test(joined) && /指标定义/.test(joined) && /结构支撑/.test(joined) && /源映射/.test(joined) && /数据接入/.test(joined), defLine: ((joined.match(/指标定义\s*[^\n]{0,60}/) || [])[0] || '').trim() }; results.push(item); await closePop() }; await page.evaluate((v)=>{ window.__p009Cards=v; }, JSON.stringify(results.map(({joined, ...rest})=>rest))); const avail=results.filter(r=>r.name!=='服务链完整度'); for (const r of avail) { if (!r.hasSpec) throw new Error(r.name+' 弹卡无 8 件套区（指标ID/口径定义）'); if (!r.hasReadiness) throw new Error(r.name+' 弹卡无就绪度四行区块（指标定义/结构支撑/源映射/数据接入）'); if (!/已登记|待核验|待甲方确认/.test(r.defLine)) throw new Error(r.name+' 指标定义行无就绪度语级（已登记/待核验）: '+r.defLine) }; const comp=results.find(r=>r.name==='服务链完整度'); if (!comp) throw new Error('缺服务链完整度项'); if (!/未登记/.test(comp.joined) || !/GAP-/.test(comp.joined)) throw new Error('完整度项弹卡未见「未登记 + GAP-* 治理引用」: '+(comp.joined||'(空)').slice(0,200)); if (comp.hasReadiness) throw new Error('完整度项不应显伪就绪度四行区块'); const d1Levels=results.map(r=>r.name+'='+(r===comp?'未登记（GAP 治理引用）':'已登记（口径待核验）')).join('；'); await page.evaluate((v)=>{ window.__p009D1Levels=v; }, d1Levels)
  - note: 框架卡指标集与对比图表指标集一致（三个可用指标名逐一同名出现在对比指标区；服务链完整度不出现在对比可选项中）
    assert: |-
      const list=page.locator('[data-testid="svc-eco-sz-metric-list"]'); const lis=list.locator('li'); const names=[]; for (let i=0;i<(await lis.count());i++) { names.push((((await lis.nth(i).innerText().catch(()=>''))||'').split('\n')[0]||'').trim()) }; const availNames=names.filter(n=>n && n!=='服务链完整度'); if (availNames.length!==3) throw new Error('可用指标数 '+availNames.length+' ≠3: '+availNames.join(',')); const cmp=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmp.first()).toBeVisible({ timeout: 8000 }); const boxes=cmp.locator('.arco-checkbox'); const boxN=await boxes.count(); if (boxN!==3) throw new Error('对比指标可选项数 '+boxN+' ≠3'); const boxLabels=[]; for (let i=0;i<boxN;i++) { boxLabels.push((((await boxes.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,'')).trim()) }; for (const k of availNames) { if (!boxLabels.some(b=>b===k)) throw new Error('对比指标区缺框架清单指标: '+k+'（对比区='+boxLabels.join(',')+'）') }; for (const b of boxLabels) { if (!availNames.some(k=>k===b)) throw new Error('对比指标区出现框架清单外指标: '+b) }; const cmpTxt=((await cmp.first().innerText().catch(()=>''))||''); if (/服务链完整度/.test(cmpTxt)) throw new Error('服务链完整度不应出现在对比可选项中'); if (/完整度/.test(cmpTxt)) throw new Error('对比可选项混入完整度字样: '+cmpTxt.slice(0,200))
allow_empty: false
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；就绪度弹卡抓不到时先核 fixtures/scout/scout-p009-r5-speccard.json 口径（弹卡文本实测可读）再判红
as_built_note: env-gate overall=pass；01290 B 档。结果态经历史「查看结果」（D4-SVCSZ-RESULT-VIA-HISTORY），本环境 open 后结果快照无城市场景但框架卡元数据完整可用（scout-b32-s1 / scout-p009-r1~r5 实证）。D1-SVCSZ-READINESS-IN-SPECCARD：用例预期 1「指标清单逐项含就绪度标注（机构数量已登记、平均技术力草稿、网络密度草稿）」as-built 形态=清单行常显为指标短名+ⓘ metric-spec-card（按钮 aria-label=指标说明：…），就绪度不在行内明文，点 ⓘ 弹 MetricSpecCard 内含「就绪度」四行区块（指标定义/结构支撑/源映射/数据接入）——三项可用指标指标定义行均如实「已登记，口径待甲方确认（开放项 Q-SVC-010/Q060/Q062）」，与用例「机构数量已登记」吻合；「平均技术力草稿/网络密度草稿」的 D1 语级在现场弹卡中以「已登记，口径待甲方确认（开放项 Q060/Q062）+ 口径定义文本内 D1 draft/待核验、禁止改绿」承载（弹卡正文含 D1 draft 字样，见 r5 row1 口径定义），脚本按 as-built 语级断言（已登记/待核验语级 + 就绪度四行区块结构），不钉死 aligned/draft 英文枚举——用例英文枚举与现场中文语级的映射归治理口径（metric seed），不在 UI 层伪判。服务链完整度项 as-built=aria-label「指标未登记：服务链完整度」红治理引用弹卡（指标ID 未登记（治理引用：GAP-SVC-SZ-CHAIN-COMPLETENESS）），不显伪就绪度（D1 missing 归 01291 深验，本条只验其存在与非伪）。observed：① 本条打开的结果为共享账号历史任务（本环境三条 SVC-2026 09/08 已完成），结果快照均无城市场景——但框架卡为评价框架元数据渲染不依赖城市场景（scout-b32-s1 实证 compare_empty=1 时 framework/metric-list/compare-metrics 均完整），无 D4 skip 理由；② 弹卡容器 DOM 中同名文本多份（teleport 挂载残影），readPop 合并全部可见弹层文本后判关键词，免疫重复挂载；③ 评审开关本条不动（勘察默认开、就绪度随评审挂点渲染），关闭后零泄漏归 01302 域。P2 跨 tick（点卡后 1500ms 再读弹层）；P3 对比篮可见才关；P7 弹卡点按钮本体；P8 steps 自含 goto 重置。「生物」黑名单不用（本条不起任务）。B 档零 allow_skip（历史结果链路实测通）。列表 2 空格缩进。
