id: FUNC-04792
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04792
priority: P1
tier: B
title: 服务链完整度标明不参与后续对比图
entry_id: svc-sz
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: evaluate
    script: |-
      const main = page.locator('main');
      await main.locator('.arco-cascader-view').click();
      await page.getByRole('menuitem', { name: '新一代信息技术' }).click();
  - action: click
    target: 开始分析
  - action: evaluate
    script: |-
      const viewResult = page.locator('main').getByRole('button', { name: '查看结果' });
      await viewResult.waitFor({ state: 'visible', timeout: 120000 });
      await expect(page.locator('main').getByText('分析结果已生成')).toBeVisible({ timeout: 120000 });
  - action: click
    target: 查看结果
expect:
  - note: 该行标注「不参与后续对比图」
    assert: |-
      await expect(page.locator('main').getByText('不参与后续对比图')).toBeVisible()
  - note: 说明中有「不输出伪完整度分数」
    assert: |-
      await expect(page.locator('main').getByText('不输出伪完整度分数')).toBeVisible()
on_fail: 截图 + 抄 X-Trace-Id
