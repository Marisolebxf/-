id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01292
priority: P0
tier: B
title: 对比指标可选项与框架清单一致且默认全选可用指标、完整度不可选
story: US-SVC-ECO-06
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（D4-SVCSZ-RESULT-VIA-HISTORY：分析记录 ≥1 条 type=shenzhen 已完成可「查看结果」）
  - 结果态必须经历史「查看结果」，禁默认 fresh 起任务
  - 评审模式为开启态（勘察默认开；本条只读消费不切换）
locators:
  tab_records: tab「分析记录」（或 [data-tab-key=records]）
  view_result: button「查看结果」
  framework: data-testid=svc-eco-sz-framework
  metric_list: data-testid=svc-eco-sz-metric-list / li.svc-eco-sz-metric-row
  compare_metrics: data-testid=svc-eco-sz-compare-metrics / .arco-checkbox（勾选态类 .arco-checkbox-checked）
  compare_caliber: 对比区演示口径段（含「服务链完整度不参与对比」）
  compare_grid: data-testid=svc-eco-sz-compare-grid（有城市场景时图表）
  compare_empty: data-testid=svc-eco-sz-compare-empty（无城市场景诚实空）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
expect:
  - note: 切「分析记录」Tab；点 type=shenzhen 已完成行「查看结果」进结果态（D4-SVCSZ-RESULT-VIA-HISTORY，不 fresh 起任务），框架壳可达
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })); await expect(rec.first()).toBeVisible({ timeout: 8000 }); await rec.first().click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1000); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/shenzhen/.test(body)) throw new Error('分析记录未见 type=shenzhen'); if (!/已完成/.test(body)) throw new Error('分析记录未见已完成'); const row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /shenzhen/ }).filter({ hasText: /已完成/ }).filter({ has: page.getByRole('button', { name: /查看结果/ }) }).first(); if (!(await row.count())) throw new Error('无 type=shenzhen 已完成可查看结果行'); const viewBtn=row.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); let url=page.url(); let body2=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/view=processing/.test(url) && /查看结果/.test(body2)) { const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await vr.count()) { await vr.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url(); body2=((await page.locator('main').first().innerText().catch(()=>''))||'') } }; if (/正在创建任务/.test(body2) && !/view=result|统一评价框架/.test(url+body2)) throw new Error('疑似 fresh 起任务/过程态而非历史结果: '+url); const fw=page.locator('[data-testid="svc-eco-sz-framework"]'); const shellOk=/view=result/.test(url) || (await fw.count()>0) || /统一评价框架/.test(body2); if (!shellOk) throw new Error('未达结果态框架壳 url='+url+' body='+body2.slice(0,280))
  - note: 可选项与框架说明卡指标清单一致、均为可用指标（步骤 1/预期 1）——对比指标可选项恰为框架清单三项可用指标逐一同名，第四项完整度不在其中且不可选
    assert: |-
      const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }; const list=page.locator('[data-testid="svc-eco-sz-metric-list"]'); await expect(list.first()).toBeVisible({ timeout: 8000 }); const lis=list.locator('li'); const liN=await lis.count(); if (liN!==4) throw new Error('框架清单行数 '+liN+' ≠4'); const names=[]; for (let i=0;i<liN;i++) { names.push((((await lis.nth(i).innerText().catch(()=>''))||'').split('\n')[0]||'').trim()) }; const need=['服务机构数量','平均技术力得分','服务网络密度','服务链完整度']; for (const k of need) { if (!names.some(n=>n===k)) throw new Error('框架清单缺项: '+k+' 实见='+names.join(',')) }; const cmp=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmp.first()).toBeVisible({ timeout: 8000 }); const boxes=cmp.locator('.arco-checkbox'); const boxN=await boxes.count(); if (boxN!==3) throw new Error('对比指标可选项 '+boxN+' ≠3'); const boxLabels=[]; for (let i=0;i<boxN;i++) { boxLabels.push((((await boxes.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,'')).trim()) }; const avail=names.filter(n=>n && n!=='服务链完整度'); for (const k of avail) { if (!boxLabels.some(b=>b===k)) throw new Error('对比可选项缺框架清单可用指标: '+k+'（可选项='+boxLabels.join(',')+'）') }; for (const b of boxLabels) { if (!avail.some(k=>k===b)) throw new Error('对比可选项出现框架清单外指标: '+b) }; const cmpTxt=((await cmp.first().innerText().catch(()=>''))||''); if (/完整度/.test(cmpTxt)) throw new Error('完整度混入对比可选项区: '+cmpTxt.replace(/\n/g,'|').slice(0,200)); await page.evaluate((v)=>{ window.__p011Boxes=v; }, JSON.stringify({ labels: boxLabels, liNames: names }))
  - note: 服务链完整度不出现在可选项中（步骤 1/预期 2）——完整度不可选形态承载为对比区 4th 项缺位 + 区级口径段「服务链完整度不参与对比」明示排除，指标清单行内同步标「不参与后续对比图」
    assert: |-
      const list2=page.locator('[data-testid="svc-eco-sz-metric-list"]'); const lis2=list2.locator('li'); let compLi=null; for (let i=0;i<(await lis2.count());i++) { if ((((await lis2.nth(i).innerText().catch(()=>''))||'').includes('服务链完整度'))) { compLi=lis2.nth(i); break } }; if (!compLi) throw new Error('前置缺失：未定位完整度行'); const liTxt=((await compLi.innerText().catch(()=>''))||''); if (!/不参与后续对比图/.test(liTxt)) throw new Error('完整度行未见「不参与后续对比图」标注: '+liTxt.replace(/\n/g,'|').slice(0,140)); if (await compLi.locator('.arco-checkbox').count()) throw new Error('完整度行内出现可选 checkbox（应不可选）'); const cmp2=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmp2.first()).toBeVisible({ timeout: 8000 }); const boxes2=cmp2.locator('.arco-checkbox'); const bn=await boxes2.count(); if (bn!==3) throw new Error('可选项数 '+bn+' ≠3（完整度应缺位）'); const cal=page.locator('[data-testid="svc-eco-sz-compare-caliber"]'); const calTxt=((await cal.first().innerText().catch(()=>''))||'').replace(/\s+/g,''); if (!calTxt) throw new Error('未见 svc-eco-sz-compare-caliber 口径段（scout-b32-s1 实证字段）'); if (!/服务链完整度不参与对比/.test(calTxt)) throw new Error('对比区口径段未见「服务链完整度不参与对比」: '+calTxt.slice(0,200)); await page.evaluate((v)=>{ window.__p011Excl=v; }, calTxt.slice(0,160))
  - note: 默认全部可用指标勾选（步骤 2/预期 3）——三项可用指标默认全部 checked（as-built 勾选态类 .arco-checkbox-checked）
    assert: |-
      const cmp3=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmp3.first()).toBeVisible({ timeout: 8000 }); const total=await cmp3.locator('.arco-checkbox').count(); if (total!==3) throw new Error('可选项 '+total+' ≠3'); const checked=await cmp3.locator('.arco-checkbox-checked').count(); if (checked!==3) throw new Error('默认勾选 '+checked+' / 3 ≠全选（应默认全选可用指标）'); const checkedLabels=[]; const boxes3=cmp3.locator('.arco-checkbox'); for (let i=0;i<total;i++) { const b=boxes3.nth(i); const cls=String(await b.getAttribute('class')||''); if (/arco-checkbox-checked/.test(cls)) { checkedLabels.push((((await b.innerText().catch(()=>''))||'').replace(/\s+/g,'')).trim()) } }; if (checkedLabels.length!==3) throw new Error('已勾选项数 '+checkedLabels.length+' ≠3'); await page.evaluate((v)=>{ window.__p011Default=v; }, JSON.stringify({ checkedLabels }))
  - note: 图区跟城市场景双分支（observed 补强，不与 01294/01303 重复判定）——有城市场景则分组图渲染且序列=默认全选三项，无城市场景诚实空文案可见不绘伪图
    assert: |-
      const grid=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const empty=page.locator('[data-testid="svc-eco-sz-compare-empty"]'); const hasGrid=(await grid.count())>0 && await grid.first().isVisible().catch(()=>false); const hasEmpty=(await empty.count())>0 && await empty.first().isVisible().catch(()=>false); let note=''; if (hasGrid) { const chartTxt=await page.evaluate(()=>{ const root=document.querySelector('[data-testid="svc-eco-sz-compare-grid"]'); if (!root) return ''; const nodes=root.querySelectorAll('div'); for (const nd of nodes) { try { const ec=window.echarts; if (!ec||!ec.getInstanceByDom) continue; const inst=ec.getInstanceByDom(nd); if (!inst) continue; const opt=inst.getOption()||{}; const sers=(opt.series||[]).map(s=>String((s&&s.name)||'')); const legs=(opt.legend&&opt.legend[0]&&opt.legend[0].data)||[]; return sers.join(',')+'|'+legs.join(',') } catch (e) {} } return root.innerText||'' }); if (!/服务机构数量|平均技术力得分|服务网络密度/.test(String(chartTxt))) throw new Error('图区已渲染但序列未见默认三项: '+String(chartTxt).slice(0,160)); if (/完整度/.test(String(chartTxt))) throw new Error('图区序列混入完整度: '+String(chartTxt).slice(0,160)); note='grid 渲染且序列=默认全选三项、无完整度' } else if (hasEmpty) { const et=((await empty.first().innerText().catch(()=>''))||''); if (!/无城市场景|无法绘制对比图/.test(et)) throw new Error('诚实空文案不符现场: '+et.slice(0,160)); note='compare_empty 诚实空（无城市场景不绘伪图），默认全选形态留待有城市场景复核' } else { throw new Error('未见对比图亦未见诚实空') }; await page.evaluate((v)=>{ window.__p011Chart=v; }, note)
allow_empty: false
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；默认勾选断言红时先核 fixtures/scout/scout-b32-s2-metric-toggles.json 口径（checkbox_checked=3 实证）；弹层/浮层遮挡先关对比篮再读态（P3）；勿把勾选态判定挂 input:checked（Arco 受控类名口径）
as_built_note: env-gate overall=pass；01292 B 档。结果态经历史「查看结果」（D4-SVCSZ-RESULT-VIA-HISTORY），框架卡元数据渲染不依赖城市场景（scout-b32-s1 实证 compare_empty=1 时 metric-list/compare-metrics 完整），默认勾选断言不依赖城市数据。D1 译法（用例步骤「浏览默认勾选态」as-built 形态）：Arco checkbox 勾选态挂类名 .arco-checkbox-checked（scout-b32-s2 探针口径 compare_checkbox_checked=3），禁用 input:checked 口径。预期 1「可选项与框架清单一致、均为可用指标」+ 预期 2「完整度不可选」合并译作：对比区可选项恰=框架清单三项可用指标逐一同名（双向核对）+ 完整度在对比区零出现（第 4 项缺位）+ 区级演示口径段「演示口径：柱值只认当前 GET result 城市场景；缺城不补列，缺值显示『无数据』，不用 0 填充。服务链完整度不参与对比。」明示排除 + 框架清单完整度行内「不参与后续对比图」标注（与 01291/P0-10 排除视角互证，本条从可选项构成视角复验，不算吞判定：01291 主断红问号治理引用形态与不参与渲染，本条主断可选项集合与默认勾选）。预期 3「默认全部可用指标勾选」= 三项 checked 全选（scout-b32-s2 compare_checkbox_checked=3 / r2 sets 实证）。observed：① 本条打开共享账号历史任务结果（SVC-2026 09/08 三条已完成），无 D4 skip 理由；② 本环境 GET result 无城市场景，图区双分支走 compare-empty 诚实空（「当前结果快照无城市场景，无法绘制对比图。」scout-b32-s1 实证），图区序列分支留作有城市场景复核口径（expect[4] 补强不判 skip）；③ 对比篮系统级浮层可见才关（P3）；弹卡/浮层遮挡不涉本条主断。P2 跨 tick（进结果态 3000ms 后再读态）；P7 无下拉操作；P8 steps 自含 goto 重置（承接上条遗留弹层/URL 参数）。「生物」黑名单不用（本条不起任务）。B 档零 allow_skip（历史结果链路实测通）。列表 2 空格缩进。
