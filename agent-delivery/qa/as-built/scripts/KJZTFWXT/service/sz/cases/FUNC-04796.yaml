id: FUNC-04796
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04796
priority: P1
tier: B
title: 主流程-分析记录列表
entry_id: svc-sz
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
expect:
  - note: 1、表头为任务、类型、状态、创建时间、操作
    assert: |-
      await page.getByRole('tab', { name: '分析记录' }).click();
      const table = page.locator('.arco-table');
      await expect(table.getByText('任务', { exact: true }).first()).toBeVisible();
      await expect(table.getByText('类型', { exact: true }).first()).toBeVisible();
      await expect(table.getByText('状态', { exact: true }).first()).toBeVisible();
      await expect(table.getByText('创建时间', { exact: true }).first()).toBeVisible();
      await expect(table.getByText('操作', { exact: true }).first()).toBeVisible();
  - note: 2、已有行的状态为「已完成」
    assert: |-
      await expect(page.locator('.arco-table tbody').getByText('已完成').first()).toBeVisible();
  - note: 3、操作有「查看过程」和「查看结果」
    assert: |-
      const body = page.locator('.arco-table tbody').first();
      await expect(body.getByRole('button', { name: '查看过程' }).first()).toBeVisible();
      await expect(body.getByRole('button', { name: '查看结果' }).first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
