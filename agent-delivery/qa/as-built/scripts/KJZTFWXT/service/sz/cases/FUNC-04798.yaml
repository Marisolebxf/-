id: FUNC-04798
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04798
priority: P1
tier: B
title: 备选-未选产业仍可发起
entry_id: svc-sz
preconditions:
  - 产业领域为未选
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: evaluate
    assert: |-
      const wrap = page.locator('.industry-catalog-select').first();
      await wrap.locator('.arco-select-view').hover();
      const clear = wrap.locator('.arco-select-view-clear-btn, .arco-icon-hover').first();
      await clear.click({ force: true, timeout: 8000 });
      await expect(wrap.locator('.arco-select-view-value')).toHaveText('', { timeout: 5000 });
  - action: click
    target: 开始分析
expect:
  - note: 1、过程页分析对象为「产业领域：未选择（深圳现状跟产业走，*）」
    assert: |-
      await page.waitForURL(/view=processing/, { timeout: 60000 });
      await expect(page.getByText('产业领域：未选择（深圳现状跟产业走，*）')).toBeVisible();
  - note: 2、页面停在过程页，不自动进入结果
    assert: |-
      await expect(page).toHaveURL(/view=processing/);
      await expect(page.getByRole('button', { name: '查看结果' })).toBeVisible();
      await expect(page).not.toHaveURL(/view=result/);
on_fail: 截图 + 抄 X-Trace-Id
