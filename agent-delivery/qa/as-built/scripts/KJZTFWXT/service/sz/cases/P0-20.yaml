as_built_note: |-
  env-gate overall=pass；01305 B 档实跑（非 skip，任务书分支①）。异常构造口径（写前探针 _probe-p020.mjs/_probe-p020.json/probe-p020-failed-state.png/probe-p020-after-retry.png，2026-10-15）：无后端控制权无法真断链，经 Playwright route.abort('connectionreset') 拦截创建任务 POST（glob **/topicAsync/topic/v1/analysis/tasks* + 方法 POST + 尾段正则精确匹配，/tasks/list 与 /tasks/running 轮询 continue 不误伤，探针 aborted 恰 1）——脚本内 route 拦截属测试工具合法模拟网络异常，非改业务环境；结束 unroute 恢复并复查拦截计数归零（防污染同 context 后续请求，P8 同义）。探针结论：断链可触发、失败态可稳定复现 → 不援引用例备注「失败态需构造异常触发，本轮不判 Fail（开放项 3）」skip，按预期断言实跑判 pass/fail（父单双分支走分支①全链断言，graph P0-29 同型同落局）。
