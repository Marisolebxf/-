  - note: 预期①——失败时结果区呈局部错误提示（页面壳内 alert 承载，非空白/白屏；用例原文「结果区」——配置态无独立结果容器，失败发生在创建任务阶段，对比图表本未创建，局部=非整页替换非白屏，探针截图 probe-p020-failed-state.png 佐证）；文案不钉死：Network Error/失败/异常/错误类现场命中，traceId 随 run observed 记录；未拦到 POST=断链未生效探针失败即红
