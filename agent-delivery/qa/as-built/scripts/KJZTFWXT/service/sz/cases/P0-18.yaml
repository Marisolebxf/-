      for (let i=0;i<12;i++) { const uu=page.url(); if (/[?&]view=result/.test(uu)) break; const bb=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(bb)) { const vr2=page.getByRole('button', { name: '查看结果', exact: true }).first(); if (await vr2.count()) { await vr2.click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1500); continue } } await page.waitForTimeout(1000) }
      const u3=page.url();
      if (!/[?&]view=result/.test(u3)) throw new Error('查看结果后未落结果态: '+u3);
      if (!u3.includes(wantId)) throw new Error('结果态 task_id 非「'+wantId+'」: '+u3);
      let rb='';
      for (let i=0;i<10;i++) { rb=((await page.locator('main').first().innerText().catch(()=>''))||''); if (rb.includes('统一评价框架')) break; await page.waitForTimeout(1000) }
