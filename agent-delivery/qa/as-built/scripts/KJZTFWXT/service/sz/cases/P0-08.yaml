id: P0-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01288
priority: P0
tier: B
title: 同条件单飞——任务在跑期间重复点击「开始分析」被拦截，会话内仅创建 1 条任务、记录无重复行
story: US-SVC-ECO-06
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G2 选齐后开始分析 enabled；G5 历史查看结果）
  - 本环境 user_id=guest 共享账号，并行会话可能同时起任务；本条断言全部锚定本会话 POST 计数与本条 task_id，免疫他端噪声
locators:
  cluster_select: .industry-catalog-select / placeholder「选择产业集群」（P7 点可见容器）
  cluster_option: .arco-trigger-popup:visible .arco-select-option（「新一代信息技术」）
  start_btn: button「开始分析」（getByRole exact，避开粘性提示文案「再点击开始分析」）
  process_shell: main 含「可视化分析过程」/「深圳服务链现状分析生成中」
  done_marker: 过程页「分析结果已生成」引导文案
  tab_records: tab「分析记录」（或 [data-tab-key=records]）
  records_row: tr 含 task_id（已完成 / shenzhen / 查看过程查看结果）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
expect:
  - note: 发起一次分析进过程态，并在任务在跑窗口内以同条件立即复点「开始分析」制造重复发起尝试（步骤 1/2 译作：选定后点「开始分析」+ 在跑时同条件再点）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('未见「开始分析」按钮'); if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）'); if (!page.__p008Counted) { page.__p008Posts=0; page.on('request', (r)=>{ if (r.method()==='POST' && /\/analysis\/tasks\/?(\?|$)/.test(r.url())) page.__p008Posts++; }); page.__p008Counted=true; } await start.first().click({ timeout: 8000 }); let secondLanded=false; try { const second=page.getByRole('button', { name: '开始分析', exact: true }); if (await second.count() && await second.first().isVisible().catch(()=>false) && await second.first().isEnabled().catch(()=>false)) { await second.first().click({ timeout: 600 }); secondLanded=true } } catch {} await page.evaluate((v)=>{ window.__p008SecondLanded=v; }, secondLanded); let tid=null; const pollUrl=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (/[?&]view=processing/.test(u) && m) return m[1] } return null }; tid=await pollUrl(6000); if (!tid && page.__p008Posts===0) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false)) { await s2.first().click({ timeout: 8000 }); tid=await pollUrl(12000) } } if (!tid) throw new Error('点击开始分析后未进入过程态: '+page.url()+' posts='+page.__p008Posts); await page.evaluate((v)=>{ window.__p008TaskId=v; }, tid); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/可视化分析过程|生成中/.test(body)) throw new Error('过程态未见过程壳/生成中标识'); if (!body.includes(tid)) throw new Error('过程页未见任务 ID '+tid); if (!/产业领域：\s*新一代信息技术/.test(body)) throw new Error('过程页分析对象非新一代信息技术')
  - note: 同条件重复发起不重复起任务——完成停过程页后本会话创建请求仅 1 次、过程页无「开始分析」重复发起入口、停在本条任务过程页（拦截生效）
    assert: |-
      const tid=(await page.evaluate(()=>window.__p008TaskId))||null; if (!tid) throw new Error('前置缺失：未捕获本条任务 ID'); let body=''; for (let i=0;i<10;i++) { body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body)) break; await page.waitForTimeout(1000) } if (!/分析结果已生成/.test(body)) throw new Error('未见完成引导文案（单飞结果断言前置）'); const posts=page.__p008Posts||0; if (posts!==1) throw new Error('本会话创建请求数='+posts+'（期望 1）——任务在跑期间同条件重复发起未被拦截，出现重复创建'); const startN=await page.getByRole('button', { name: '开始分析', exact: true }).count(); if (startN!==0) throw new Error('过程页仍存在「开始分析」入口 ×'+startN+'（在跑期间重复发起入口未移除）'); const u=page.url(); if (!/[?&]view=processing/.test(u) || !u.includes(tid)) throw new Error('未停在本条任务过程页: '+u)
  - note: 「分析记录」中本条任务仅出现 1 行且如实「已完成」——重复发起未产生第二条同条件任务行
    assert: |-
      const tid2=(await page.evaluate(()=>window.__p008TaskId))||''; if (!tid2) throw new Error('前置缺失：未捕获本条任务 ID'); const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })); await expect(rec.first()).toBeVisible({ timeout: 8000 }); await rec.first().click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(2500); const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; let ok=false; let rowCount=-1; for (let i=0;i<10 && !ok;i++) { const rows=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid2 }); rowCount=await rows.count(); if (rowCount===1) { const rt=((await rows.first().innerText().catch(()=>''))||''); ok=/已完成/.test(rt) && /shenzhen/.test(rt) } if (!ok) await page.waitForTimeout(1000) } if (rowCount!==1) throw new Error('记录中本条任务 '+tid2+' 出现 '+rowCount+' 行（期望恰好 1 行；重复起任务或记录重复）'); if (!ok) throw new Error('本条任务行状态非「已完成/shenzhen」'); const posts2=page.__p008Posts||0; if (posts2!==1) throw new Error('记录核对期本会话创建请求数='+posts2+'（期望 1）')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若会话内出现 2 次创建请求，先核 fixtures/scout/scout-p007-net.json 口径排除共享账号并行噪声（他端任务不进本页 POST 计数），确为本页操作重复发起则记红挂缺陷单（单飞拦截缺失）
as_built_note: env-gate overall=pass；01288 B 档。实勘依据 scout-p007-s7/s8、scout-p007-second-inb1701、scout-p007-net：单飞拦截 as-built 形态=入口守势——发起后主 Tab 即切过程页（view=processing），配置区整体卸载（start_btn_n=0）、无「重新分析」按钮（rerun_btn_n=0），前端每 ~4s 轮询 GET /analysis/tasks/running 维持在跑感知；实测在跑窗口仅 ~1s（s7 t≈1s 已 done）。D1 译法：用例步骤「任务在跑时以同条件再次点击开始分析」译作首发点击后立即（600ms 窗口）同条件补点一次，拦截判据=会话级 POST /api/topicAsync/topic/v1/analysis/tasks 计数恰为 1（page.on 请求监听，regex 排除 /list 与 /running；仅计本页请求，免疫 guest 共享账号他端噪声）+ 过程页「开始分析」入口 0 残留 + 记录中本条 task_id 恰 1 行；补点被过程态切换/toast 吞掉属预期拦截形态（secondLanded 仅记 window.__p008SecondLanded 备诊，不单独判红）。完成后再发起属当天复用域（01300/Q-ANALYSIS-01；P0-07 已 observed 同日同条件仍新建任务 SVC-20261015-016），本条不判。observed：user_id=guest 共享账号，并行会话同时作业（P0-07 期间出现非本条创建的 011/014/015）；expect[0] 诚实重试仅当无任何创建请求且 URL 仍无 view= 且按钮仍可用时再点，避免人为制造第 2 次 POST。P2 跨 tick（点击后轮询至稳态）；P3 对比篮可见才关；P7 点可见容器；P8 steps 自含 goto 重置。「生物」短名黑名单不用。B 档零 allow_skip（创建链路实测通，无 skip 理由）。列表 2 空格缩进。
