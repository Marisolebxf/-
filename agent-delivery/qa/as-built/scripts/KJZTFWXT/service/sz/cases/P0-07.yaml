id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01287
priority: P0
tier: B
title: 显式触发「开始分析」创建异步任务进过程态、分析记录新增、停过程页待显式查看结果
story: US-SVC-ECO-06
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（G1 登录深链 / G2 选齐后开始分析 enabled / G5 历史查看结果）
  - 本环境 user_id=guest 为共享账号，并行会话可能同时起任务（见 as_built_note observed；无同条件拦截，实测重复创建仍放行）
locators:
  cluster_select: .industry-catalog-select / placeholder「选择产业集群」（P7 点可见容器）
  cluster_option: .arco-trigger-popup:visible .arco-select-option（「新一代信息技术」）
  start_btn: button「开始分析」（getByRole exact，避开粘性提示文案「再点击开始分析」）
  process_shell: main 含「可视化分析过程」/「深圳服务链现状分析生成中」
  task_line: 过程页「任务 ID … 分析对象 产业领域：新一代信息技术」
  tab_records: tab「分析记录」（或 [data-tab-key=records]）
  records_row: tr 含 task_id（已完成 / shenzhen / 查看过程查看结果）
  view_process_btn: 记录行 button「查看过程」
  view_result_btn: button「查看结果」（exact，引导空态出口）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
expect:
  - note: 选定「新一代信息技术」后点击「开始分析」，任务发起并进入计算过程态（URL view=processing&task_id=SVC-*，过程壳与分析对象正确）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); await sel.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显: "'+echo+'"'); const start=page.getByRole('button', { name: '开始分析', exact: true }); if (!await start.count()) throw new Error('未见「开始分析」按钮'); if (!await start.first().isEnabled()) throw new Error('「开始分析」不可用（env-gate G2 应 enabled）'); let hit=null; const pollUrl=async (ms) => { for (let i=0;i<Math.ceil(ms/1000);i++) { await page.waitForTimeout(1000); const u=page.url(); if (/[?&]view=processing/.test(u)) { const m=u.match(/[?&]task_id=(SVC-\d{8}-\d{1,4})/); if (m) return m[1] } } return null }; await start.first().click({ timeout: 8000 }); hit=await pollUrl(8000); if (!hit) { const s2=page.getByRole('button', { name: '开始分析', exact: true }); if (await s2.count() && await s2.first().isVisible().catch(()=>false) && await s2.first().isEnabled().catch(()=>false) && !/[?&]view=/.test(page.url())) { await s2.first().click({ timeout: 8000 }); hit=await pollUrl(12000) } } if (!hit) { const cfgSnap=((await page.locator('[data-testid="svc-eco-analysis-config"]').innerText().catch(()=>''))||'').replace(/\n/g,' | ').slice(0,200); throw new Error('点击开始分析后未进入过程态（含 1 次诚实重试）: '+page.url()+' | config: '+cfgSnap) } await page.evaluate((v)=>{ window.__p007TaskId=v; }, hit); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/可视化分析过程|生成中/.test(body)) throw new Error('过程态未见过程壳/生成中标识'); if (!body.includes(hit)) throw new Error('过程页未见任务 ID '+hit); if (!/产业领域：\s*新一代信息技术/.test(body)) throw new Error('过程页分析对象非新一代信息技术')
  - note: 切到「分析记录」Tab，出现本条新建任务的对应记录且状态如实为「已完成」
    assert: |-
      const tid=(await page.evaluate(()=>window.__p007TaskId))||null; if (!tid) throw new Error('前置缺失：未捕获本条新建任务 ID'); const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })); await expect(rec.first()).toBeVisible({ timeout: 8000 }); await rec.first().click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(2500); const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; let ok=false; for (let i=0;i<10 && !ok;i++) { const row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid }).first(); if (await row.count()) { const rt=((await row.innerText().catch(()=>''))||''); ok=/已完成/.test(rt) && /shenzhen/.test(rt) } if (!ok) { const esc=String(tid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); ok=new RegExp(esc+'[\\s\\S]{0,200}?(shenzhen[\\s\\S]{0,80}?已完成|已完成[\\s\\S]{0,80}?shenzhen)').test(body) } if (!ok) await page.waitForTimeout(1000) } if (!ok) throw new Error('分析记录未见新任务 '+tid+' 的已完成行')
  - note: 未显式查看结果前停过程页引导空态（「分析结果已生成」+「查看结果」出口，不自动跳转结果态、不渲染结果区）
    assert: |-
      const tid2=(await page.evaluate(()=>window.__p007TaskId))||''; if (!tid2) throw new Error('前置缺失：未捕获本条新建任务 ID'); let row2=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid2 }).first(); if (!await row2.count()) { const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })); await rec.first().click({ timeout: 8000 }); await page.waitForTimeout(2000); row2=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: tid2 }).first() } const procBtn=row2.getByRole('button', { name: /查看过程/ }).first(); await procBtn.click({ timeout: 8000 }); await page.waitForTimeout(2000); let body=''; for (let i=0;i<10;i++) { body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body)) break; await page.waitForTimeout(1000) } if (!/分析结果已生成/.test(body)) throw new Error('完成后未见「分析结果已生成」引导文案（引导空态缺失）'); if (!body.includes(tid2)) throw new Error('过程页任务 ID 缺失'); const vr=page.getByRole('button', { name: '查看结果', exact: true }); if (!await vr.count()) throw new Error('未见「查看结果」按钮（引导空态出口缺失）'); const u3=page.url(); if (!/[?&]view=processing/.test(u3)) throw new Error('完成后应停过程页等待显式查看结果，实际 URL: '+u3); if (/[?&]view=result/.test(u3)) throw new Error('不应自动跳转结果态: '+u3); if (await page.locator('[data-testid="svc-eco-sz-framework"]').count()) throw new Error('未显式查看结果前不应渲染结果态框架卡')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若当天同条件复用直接开结果态记红归 01300 域
as_built_note: env-gate overall=pass；01287 B 档（显式触发面，P0-06 已验不自动起任务的本条补显式发起）。实勘（_probe-p007.mjs / scout-p007-*，探针用「新能源」预验、runner 主路径按任务书用「新一代信息技术」）：选定→点开始分析（exact 避开粘性提示）→ POST /api/topicAsync/topic/v1/analysis/tasks 200 → URL view=processing&demo_state=processing&task_id=SVC-YYYYMMDD-NNN，~1s 完成，记录表新增行置顶，toast「任务已创建，正在展示分析过程」。D1：用例预期 3「未生成结果前结果区呈引导空态」as-built = 生成结束停过程页呈「分析结果已生成」引导 + 显式「查看结果」出口、不自动跳转结果态（过程壳原文「须点查看结果后才读取 GET result；不会自动跳转」）；结果态深验归 01289/01294（D4-SVCSZ-RESULT-VIA-HISTORY）。任务 ID 跨 expect 经 window.__p007TaskId 传递（runner 每 expect 独立函数作用域）。预期 3 经记录行「查看过程」直达本条任务过程页断言：从记录 Tab 点主 Tab 回「最新任务」过程页，共享环境下最新≠本条时会有并发歧义（实勘 S8 回到的是 processing view 非配置区）。observed：① user_id=guest 共享账号，并行会话同时作业（探针期间出现非本条创建的 SVC-20261015-011/014/015，另有 r2 首次点击被吞的瞬时红），故 expect[1] 加 1 次诚实重试（仅当 URL 仍无 view= 且按钮仍可见可用时再点，非伪造绿）；实测同日同条件重复发起无拦截、仍新建任务（当天复用语义归 01300/Q-ANALYSIS-01）。② 记录页存在 SVC-20261015-011 分析对象=未选择（疑空态软门控可被绕过起任务，归 01286/P0-03 域不在本条判定）。P2 跨 tick（点击后轮询 URL/正文至稳态）；P3 对比篮可见才关；P7 点可见容器；P8 steps 自含 goto 重置。「生物」短名黑名单不用。B 档零 allow_skip（创建链路实测通，无 skip 理由）。列表 2 空格缩进。
