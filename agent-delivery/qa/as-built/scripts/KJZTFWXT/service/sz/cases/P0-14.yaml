  - action: screenshot
    note: 结果态基线（结论/梯队区或诚实空）
  - action: evaluate
    note: 浏览结论区三组构成（expect[1] 自含）
  - action: screenshot
    note: 结论区构成或无结论区形态
  - action: evaluate
    note: 核对优势/短板结论引用数值与图表一致（expect[2] 自含）
  - action: screenshot
    note: 结论数值引用形态
  - action: evaluate
    note: 取消「服务机构数量」构造指标集合变化并核对结论响应（expect[3] 自含）
  - action: screenshot
    note: 集合变化后结论区或负断言形态
  - action: evaluate
    note: 还原全选默认态（expect[3] 尾部自含，P8）
  - action: screenshot
    note: 还原默认态
