locators:
  tab_records: tab「分析记录」（或 [data-tab-key=records]）
  view_result: button「查看结果」
  compare_metrics: data-testid=svc-eco-sz-compare-metrics / .arco-checkbox（勾选态类 .arco-checkbox-checked；定位单项用容器内枚举 innerText 匹配，勿 locator.locator 查自身）
