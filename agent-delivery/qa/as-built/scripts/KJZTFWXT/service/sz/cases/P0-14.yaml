  - note: 结论区三组构成（步骤 1/预期 1）——有城市场景：梯队/结论区渲染（标题「梯队位置与结论」）、结论 ul ≥1 行，优势（优势/领先）/短板（短板/落后）/梯队描述（梯队词行或 gauge/标签）三组软核对（快照结论数据形态，只认快照自带不合成，缺组记 observed 不判红）；无城市场景（本环境实态）：compare-empty 诚实空 + 结论区/梯队区结构性零渲染 + 正文无优势/短板伪结论词（未完成对比不可识别优势短板梯队，零渲染不造伪）
    assert: |-
      const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }; const grid=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const empty=page.locator('[data-testid="svc-eco-sz-compare-empty"]'); const tierSec=page.locator('[data-testid="svc-eco-sz-tier"]'); const concl=page.locator('[data-testid="svc-eco-sz-conclusions"]'); const hasGrid=(await grid.count())>0 && await grid.first().isVisible().catch(()=>false); let branch; if (hasGrid) { const tierVis=(await tierSec.count())>0 && await tierSec.first().isVisible().catch(()=>false); if (tierVis) { const headTxt=((await tierSec.first().innerText().catch(()=>''))||''); if (!/梯队位置与结论/.test(headTxt)) throw new Error('梯队/结论区标题非「梯队位置与结论」: '+headTxt.slice(0,80)); const ulN=await concl.count(); if (ulN>0) { const lines=((await concl.first().innerText().catch(()=>''))||'').split('\n').map((s)=>s.trim()).filter(Boolean); if (!lines.length) throw new Error('结论 ul 存在但无可读行'); const adv=lines.filter((l)=>/优势|领先/.test(l)); const short=lines.filter((l)=>/短板|落后/.test(l)); const tierLn=lines.filter((l)=>/梯队/.test(l)); const gaugeN=await tierSec.first().locator('.svc-eco-tier__gauge').count(); const labelN=await page.locator('[data-testid="svc-eco-sz-tier-label"]').count(); const missing=[]; if (!adv.length) missing.push('优势'); if (!short.length) missing.push('短板'); if (!tierLn.length && gaugeN===0 && labelN===0) missing.push('梯队描述'); branch='有据：结论区渲染 '+lines.length+' 行；三组构成'+(missing.length ? '缺 '+missing.join('/')+' 组（快照结论数据形态，只认快照自带不合成）——observed' : '（优势/短板/梯队齐备）'); await page.evaluate((v)=>{ window.__p014Groups=v; }, JSON.stringify({ lines: lines.slice(0,8), adv: adv.length, short: short.length, tierLine: tierLn.length, gauge: gaugeN, label: labelN })) } else { const secTxt=((await tierSec.first().innerText().catch(()=>''))||''); if (!/当前快照未给出可与本图核对的结论/.test(secTxt)) throw new Error('结论 ul 缺失且未见诚实占位文案: '+secTxt.slice(0,160)); branch='有据：有梯队区但快照未带结论行，诚实占位「当前快照未给出可与本图核对的结论。」——observed' } } else { branch='有城市场景但快照未带梯队/结论（showTier 不满足）：结论区结构性零渲染为诚实态（只认快照自带不合成）——observed' } } else { const hasEmpty=(await empty.count())>0 && await empty.first().isVisible().catch(()=>false); if (!hasEmpty) throw new Error('无城市场景未见 compare-empty 诚实空'); const et=((await empty.first().innerText().catch(()=>''))||''); if (!/无城市场景|无法绘制对比图/.test(et)) throw new Error('诚实空文案不符现场: '+et.slice(0,120)); if (await concl.count()) throw new Error('无城市场景下结论区出现 DOM（未完成对比却渲染结论，疑似伪结论）'); if (await tierSec.count()) throw new Error('无城市场景下梯队/结论区仍渲染（疑似伪结论合成）'); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/优势|短板/.test(body)) throw new Error('无城市场景正文出现优势/短板伪结论词: '+body.replace(/\n/g,'|').slice(0,200)); branch='无据：compare-empty 诚实空 + 结论区/梯队区结构性零渲染 + 正文无优势/短板伪结论词（未完成对比不可识别优势短板梯队，零渲染不造伪）——observed（scout-p013-r1 四条历史任务均此态）' }; await page.evaluate((v)=>{ window.__p014GroupsBranch=v; }, branch)
  - note: 优势/短板结论全部引用图表当前数值、无图外数值（步骤 2/预期 2）——有据：结论行数值 token 逐一对 echarts 柱值集合（含优势/短板关键词行必含 ≥1 数值且属图内）；无据（本环境实态）：结论区零 DOM，未渲染即无可核对，负断言不造伪结论，记 observed
    assert: |-
      const grid2=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const concl2=page.locator('[data-testid="svc-eco-sz-conclusions"]'); const hasGrid2=(await grid2.count())>0 && await grid2.first().isVisible().catch(()=>false); const ulN2=await concl2.count(); let note2; if (hasGrid2 && ulN2>0) { const nums=await page.evaluate(()=>{ const out=[]; const root=document.querySelector('[data-testid="svc-eco-sz-compare-grid"]'); if (!root) return out; for (const nd of root.querySelectorAll('div')) { try { const ec=window.echarts; if (!ec||!ec.getInstanceByDom) continue; const inst=ec.getInstanceByDom(nd); if (!inst) continue; const opt=inst.getOption()||{}; for (const s of (opt.series||[])) { for (const d of (s.data||[])) { const v=(d&&typeof d==='object')?d.value:d; if (v!=null&&Number.isFinite(Number(v))) out.push(String(Number(v))) } } } catch (e) {} } return out }); if (!nums.length) throw new Error('有据分支：图表数值不可读（echarts 实例缺失），引用一致性无从核'); const lines=((await concl2.first().innerText().catch(()=>''))||'').split('\n').map((s)=>s.trim()).filter(Boolean); for (const ln of lines) { const tokens=(ln.match(/-?\d+(?:\.\d+)?/g)||[]); if (/优势|短板/.test(ln) && !tokens.length) throw new Error('优势/短板结论行未引用数值: '+ln.slice(0,120)); for (const tk of tokens) { if (!nums.includes(String(Number(tk)))) throw new Error('结论引用图外数值「'+tk+'」: '+ln.slice(0,120)+'（图内='+nums.join(',')+'）') } }; note2='有据：结论行数值全部引用图内当前数值（优势/短板行必含图内数值引用），无图外数值' } else if (!hasGrid2) { if (await concl2.count()) throw new Error('无城市场景出现结论 DOM（伪结论）'); note2='无据：结论区零 DOM，未渲染即无可核对——observed' } else { note2='有城市场景但无结论行（诚实占位/零渲染），无可核对数值——observed' }; await page.evaluate((v)=>{ window.__p014Ref=v; }, note2)
  - note: 指标集合变化后结论随图表同步刷新（步骤 3/预期 3）——取消「服务机构数量」→ URL 即时 sz_metrics=tech,density；有据：scale 结论文行随集合移除 + 剩余结论行数值 ⊆ 新图柱值集合（filterSzConclusions 按 metricKey+图内数值双过滤的机制复验）；无据（本环境实态）：勾选变化不造伪结论（结论区/梯队区保持零渲染、正文无优势/短板词）；尾部 P8 还原全选、URL 参数清空
    assert: |-
      const close3=page.locator('button[aria-label="关闭对比篮"]'); if (await close3.count() && await close3.first().isVisible().catch(()=>false)) { try { await close3.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }; const cmpA=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmpA.first()).toBeVisible({ timeout: 8000 }); const findBoxA=async (name)=>{ const bs=cmpA.locator('.arco-checkbox'); const n=await bs.count(); for (let i=0;i<n;i++) { const t=(((await bs.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,'')); if (t.includes(name)) return bs.nth(i) } return null }; const orgA=await findBoxA('服务机构数量'); if (!orgA) throw new Error('未定位「服务机构数量」checkbox'); const clsA=String(await orgA.getAttribute('class')||''); if (!/arco-checkbox-checked/.test(clsA)) throw new Error('前置：服务机构数量非勾选态（基线异常）'); const grid3=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const hasGrid3=(await grid3.count())>0 && await grid3.first().isVisible().catch(()=>false); const concl3=page.locator('[data-testid="svc-eco-sz-conclusions"]'); let before=null; if (hasGrid3 && (await concl3.count())>0) { before=((await concl3.first().innerText().catch(()=>''))||'').split('\n').map((s)=>s.trim()).filter(Boolean) }; await orgA.click({ timeout: 5000 }); await page.waitForTimeout(1200); const pm=(page.url().match(/sz_metrics=([^&]*)/)||[])[1]||null; if (!pm) throw new Error('取消单项后 URL 未见 sz_metrics（集合变化未生效）: '+page.url()); const setA=decodeURIComponent(pm).split(',').map((s)=>s.trim()).sort().join(','); if (setA!=='density,tech') throw new Error('取消单项后 sz_metrics 组合 '+setA+' ≠ density,tech'); let note3; const hasGrid3b=(await grid3.count())>0 && await grid3.first().isVisible().catch(()=>false); const ulNb=await concl3.count(); if (!hasGrid3b) { if (ulNb) throw new Error('无城市场景勾选变化后结论区出现 DOM（勾选变化造伪结论）'); const tierN3=await page.locator('[data-testid="svc-eco-sz-tier"]').count(); if (tierN3) throw new Error('无城市场景勾选变化后梯队/结论区渲染（造伪结论）'); const body3=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/优势|短板/.test(body3)) throw new Error('勾选变化后正文出现优势/短板伪结论词: '+body3.replace(/\n/g,'|').slice(0,200)); note3='无据：勾选变化不造伪结论（结论区/梯队区保持零渲染、正文无优势/短板词）——observed' } else { if (ulNb>0) { const after=((await concl3.first().innerText().catch(()=>''))||'').split('\n').map((s)=>s.trim()).filter(Boolean); if (before) { const scaleBefore=before.filter((l)=>/服务机构数量|机构数量/.test(l)); for (const ln of scaleBefore) { if (after.includes(ln)) throw new Error('取消指标后其结论行未随集合移除: '+ln.slice(0,120)) }; if (!scaleBefore.length) { note3=(after.join('§')===before.join('§')) ? '有据：无 scale 结论文行，结论集合不变为机制正确（filterSzConclusions 按 metricKey/图内数值过滤）——observed' : '有据：指标集合变化后结论随图表同步刷新' } else { note3='有据：scale 结论行随集合移除，结论随图表同步刷新' } } else { note3='有据：结论区于集合变化后出现（上步无行），按新集合渲染——observed' }; const nums3=await page.evaluate(()=>{ const out=[]; const root=document.querySelector('[data-testid="svc-eco-sz-compare-grid"]'); if (!root) return out; for (const nd of root.querySelectorAll('div')) { try { const ec=window.echarts; if (!ec||!ec.getInstanceByDom) continue; const inst=ec.getInstanceByDom(nd); if (!inst) continue; const opt=inst.getOption()||{}; for (const s of (opt.series||[])) { for (const d of (s.data||[])) { const v=(d&&typeof d==='object')?d.value:d; if (v!=null&&Number.isFinite(Number(v))) out.push(String(Number(v))) } } } catch (e) {} } return out }); if (nums3.length) { for (const ln of after) { for (const tk of (ln.match(/-?\d+(?:\.\d+)?/g)||[])) { if (!nums3.includes(String(Number(tk)))) throw new Error('集合变化后结论引用图外数值「'+tk+'」: '+ln.slice(0,120)) } } } } else { note3='有据：集合变化后结论行被全部过滤（诚实清空/占位），无伪结论保留——observed' } }; const orgB=await findBoxA('服务机构数量'); if (!orgB) throw new Error('未定位「服务机构数量」checkbox（还原）'); const clsB=String(await orgB.getAttribute('class')||''); if (!/arco-checkbox-checked/.test(clsB)) { await orgB.click({ timeout: 5000 }); await page.waitForTimeout(1000) }; const boxes4=page.locator('[data-testid="svc-eco-sz-compare-metrics"] .arco-checkbox'); let checked4=0; for (let i=0;i<await boxes4.count();i++) { const cls=String(await boxes4.nth(i).getAttribute('class')||''); if (/arco-checkbox-checked/.test(cls)) checked4++ }; if (checked4!==3) throw new Error('还原全选失败 '+checked4+' /3（P8）'); if (/sz_metrics=/.test(page.url())) throw new Error('还原后 URL 仍带 sz_metrics: '+page.url()); await page.evaluate((v)=>{ window.__p014SetChange=v; }, JSON.stringify({ szMetrics: setA, note: note3, restored: true }))
