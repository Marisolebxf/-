id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01286
priority: P0
tier: A
title: 未选产业集群时开始分析门控（空态软文案 + 选齐后 enabled）
story: US-SVC-ECO-06
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass
  - 已进入 shenzhen 工作区且配置区可见
locators:
  cluster_select: .industry-catalog-select / placeholder「选择产业集群」
  start: button「开始分析」
  soft_hint: 请先确认产业条件…
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
expect:
  - note: 空态见软门控引导文案「请先确认…」（勿硬判「开始分析」disabled；D1-SVCSZ-SOFT-START-GATE）；不进 processing
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; if (/view=processing|view=result/.test(page.url())) { await page.goto('http://111.198.38.90:50892/service/chain-analysis?workspace=shenzhen&tab=shenzhen', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } }; await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); const sel=page.locator('.industry-catalog-select').first(); const viewTxt=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||(await sel.innerText().catch(()=>''))||'').trim().replace(/\s+/g,' '); if (viewTxt && !/选择产业集群|^$/.test(viewTxt) && /新一代|生物|新能源|新材料|高端装备|智能网联|绿色环保|低空|传统与创意|海洋|未来/.test(viewTxt)) { await sel.hover(); await page.waitForTimeout(200); const clr=page.locator('.industry-catalog-select .arco-select-view-clear-btn, .industry-catalog-select .arco-select-clear-icon'); if (await clr.count()) { await clr.first().click({ force: true }); await page.waitForTimeout(800) } }; await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 }); const start=page.getByRole('button', { name: '开始分析', exact: true }).first(); await expect(start).toBeVisible({ timeout: 8000 }); const panel=((await page.locator('.svc-eco-panel').first().innerText().catch(()=>''))||''); if (!/请先确认产业条件|请先选择|再点击「开始分析」|不会自动创建任务/.test(panel)) throw new Error('空态未见软门控引导文案: '+panel.slice(0,240)); if (/view=processing|view=result/.test(page.url())) throw new Error('空态不应进过程/结果: '+page.url())
  - note: 选定「新一代信息技术」后「开始分析」enabled（勿点开始分析起任务；结果态走历史 D4-SVCSZ-RESULT-VIA-HISTORY）
    assert: |-
      const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false) && await close2.first().isEnabled().catch(()=>false)) { try { await close2.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const sel=page.locator('.industry-catalog-select').first(); await sel.click({ timeout: 8000 }); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1000); const start2=page.getByRole('button', { name: '开始分析', exact: true }).first(); await expect(start2).toBeEnabled({ timeout: 8000 }); const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim(); if (!/新一代信息技术/.test(echo)) throw new Error('选定后未回显短名: '+echo); if (/view=processing|view=result/.test(page.url())) throw new Error('选定后不应自动进过程/结果: '+page.url())
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: env-gate overall=pass；01286 A 档：空态「开始分析」非 disabled（勿 toBeDisabled），靠「请先确认产业条件，再点击「开始分析」…」软文案（D1-SVCSZ-SOFT-START-GATE）；本条不点空态/选齐后开始分析（勿起任务等结果，结果态走历史 D4-SVCSZ-RESULT-VIA-HISTORY；显式触发归 01287）。选定「新一代信息技术」后 enabled 可断言；选后粘性提示可仍可见。对照 shortboard P0-04/00688（shortboard 可点进 processing，本条禁止）。对比篮可见才关。禁兄弟 workspace=chain/graph 断言。A 档零 allow_skip；列表 2 空格缩进。
