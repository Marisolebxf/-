    assert: |-
      const cmpE=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmpE.first()).toBeVisible({ timeout: 8000 }); const findBoxE=async (name)=>{ const bs=cmpE.locator('.arco-checkbox'); const n=await bs.count(); for (let i=0;i<n;i++) { const t=(((await bs.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,'')); if (t.includes(name)) return bs.nth(i) } return null }; const orgE=await findBoxE('服务机构数量'); if (!orgE) throw new Error('未定位「服务机构数量」checkbox（构造组合）'); const clsE=String(await orgE.getAttribute('class')||''); if (!/arco-checkbox-checked/.test(clsE)) throw new Error('前置：构造组合前应处全选态'); await orgE.click({ timeout: 5000 }); await page.waitForTimeout(1000); const pmE=(page.url().match(/sz_metrics=([^&]*)/)||[])[1]||null; if (!pmE) throw new Error('选定组合后 URL 未见 sz_metrics: '+page.url()); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(3500); const closeF=page.locator('button[aria-label="关闭对比篮"]'); if (await closeF.count() && await closeF.first().isVisible().catch(()=>false)) { try { await closeF.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }; const pmF=(page.url().match(/sz_metrics=([^&]*)/)||[])[1]||null; if (!pmF) throw new Error('刷新后 URL 丢失 sz_metrics（勾选持久化缺失）: '+page.url()); const setF=decodeURIComponent(pmF).split(',').map((s)=>s.trim()).sort().join(','); if (setF!=='density,tech') throw new Error('刷新后组合漂移: '+setF+' ≠ density,tech'); const cmpG=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmpG.first()).toBeVisible({ timeout: 8000 }); const boxesG=cmpG.locator('.arco-checkbox'); const totalG=await boxesG.count(); if (totalG!==3) throw new Error('刷新后可选项 '+totalG+' ≠3'); let checkedG=0; let orgCheckedG=false; let techCheckedG=false; let densCheckedG=false; for (let i=0;i<totalG;i++) { const cls=String(await boxesG.nth(i).getAttribute('class')||''); const t=(((await boxesG.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,'')); if (/arco-checkbox-checked/.test(cls)) { checkedG++; if (t.includes('服务机构数量')) orgCheckedG=true; if (t.includes('平均技术力得分')) techCheckedG=true; if (t.includes('服务网络密度')) densCheckedG=true } } if (orgCheckedG) throw new Error('刷新后服务机构数量勾选复活（应保留取消态）'); if (!(techCheckedG&&densCheckedG)) throw new Error('刷新后技术力/密度勾选未保留'); if (checkedG!==2) throw new Error('刷新后勾选数 '+checkedG+' ≠2'); const gridG=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const emptyG=page.locator('[data-testid="svc-eco-sz-compare-empty"]'); const hasGridG=(await gridG.count())>0 && await gridG.first().isVisible().catch(()=>false); let noteG=''; if (hasGridG) { const chartTxtG=await page.evaluate(()=>{ const root=document.querySelector('[data-testid="svc-eco-sz-compare-grid"]'); if (!root) return ''; const nodes=root.querySelectorAll('div'); for (const nd of nodes) { try { const ec=window.echarts; if (!ec||!ec.getInstanceByDom) continue; const inst=ec.getInstanceByDom(nd); if (!inst) continue; const opt=inst.getOption()||{}; const sers=(opt.series||[]).map((s)=>String((s&&s.name)||'')); const legs=(opt.legend&&opt.legend[0]&&opt.legend[0].data)||[]; return sers.join(',')+'|'+legs.join(',') } catch (e) {} } return root.innerText||'' }); if (/服务机构数量/.test(String(chartTxtG))) throw new Error('刷新后图表序列仍含服务机构数量: '+String(chartTxtG).slice(0,160)); if (!/平均技术力得分|服务网络密度/.test(String(chartTxtG))) throw new Error('刷新后图表未见保留组合序列: '+String(chartTxtG).slice(0,160)); noteG='grid 序列=保留组合' } else { const hasEmptyG=(await emptyG.count())>0 && await emptyG.first().isVisible().catch(()=>false); if (!hasEmptyG) throw new Error('刷新后无城市场景未见 compare-empty 诚实空'); noteG='诚实空随组合保留' }; await page.evaluate((v)=>{ window.__p012Persist=v; }, JSON.stringify({ szMetrics: setF, checked: checkedG, chart: noteG }))
