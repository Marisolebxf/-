0=cmp.locator('.arco-checkbox'); const total0=await boxes0.count(); if (total0!==3) throw new Error('对比可选项 '+total0+' ≠3'); let checked0=0; for (let i=0;i<total0;i++) { const cls=String(await boxes0.nth(i).getAttribute('class')||''); if (/arco-checkbox-checked/.test(cls)) checked0++ } if (checked0!==3) throw new Error('前置基线：默认全选 '+checked0+' /3 不成立'); if (/sz_metrics=/.test(page.url())) throw new Error('前置基线：默认态 URL 已带 sz_metrics 残留: '+page.url())
