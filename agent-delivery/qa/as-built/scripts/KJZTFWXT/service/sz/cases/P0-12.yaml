    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
  - action: evaluate
    note: 切「分析记录」→ type=shenzhen 已完成行「查看结果」进结果态（expect[0] 自含操作）
  - action: screenshot
    note: 结果态默认全选基线
  - action: evaluate
    note: 取消「服务机构数量」→ URL sz_metrics=tech,density（expect[1] 自含）
  - action: screenshot
    note: 取消单项后勾选与URL即时反映
  - action: evaluate
    note: 重新勾选「服务机构数量」→ 全选回显（expect[2] 自含）
  - action: screenshot
    note: 重新勾选后回显
  - action: evaluate
    note: 再取消构造组合 tech,density 后 reload 验持久化（expect[3] 自含）
  - action: screenshot
    note: 刷新后组合与勾选保留
  - action: evaluate
    note: 还原全选默认态（expect[4] 自含，P8）
  - action: screenshot
    note: 还原默认态
