ator('[data-testid="svc-eco-sz-compare-empty"]'); const noneB=page.locator('[data-testid="svc-eco-sz-compare-none"]'); const hasGridB=(await gridB.count())>0 && await gridB.first().isVisible().catch(()=>false); let chartNoteB=''; if (hasGridB) { const chartTxtB=await page.evaluate(()=>{ const root=document.querySelector('[data-testid="svc-eco-sz-compare-grid"]'); if (!root) return ''; const nodes=root.querySelectorAll('div'); for (const nd of nodes) { try { const ec=window.echarts; if (!ec||!ec.getInstanceByDom) continue; const inst=ec.getInstanceByDom(nd); if (!inst) continue; const opt=inst.getOption()||{}; const sers=(opt.series||[]).map((s)=>String((s&&s.name)||'')); const legs=(opt.legend&&opt.legend[0]&&opt.legend[0].data)||[]; return sers.join(',')+'|'+legs.join(',') } catch (e) {} } return root.innerText||'' }); if (/服务机构数量/.test(String(chartTxtB))) throw new Error('取消后图表序列仍含服务机构数量: '+String(chartTxtB).slice(0,160)); if (!/平均技术力得分|服务网络密度/.test(String(chartTxtB))) throw new Error('取消后图表未见剩余两项序列: '+String(chartTxtB).slice(0,160)); chartNoteB='grid 序列即时剔除服务机构数量、保留 tech/density' } else { const hasEmptyB=(await emptyB.count())>0 && await emptyB.first().isVisible().catch(()=>false); if (!hasEmptyB) throw new Error('无城市场景未见 compare-empty 诚实空'); const etB=((await emptyB.first().innerText().catch(()=>''))||''); if (!/无城市场景|无法绘制对比图/.test(etB)) throw new Error('诚实空文案不符现场: '+etB.slice(0,120)); const noneVisB=(await noneB.count())>0 && await noneB.first().isVisible().catch(()=>false); if (noneVisB) throw new Error('未全取消却出现「请至少选择一个对比指标」提示（越界渲染，全取消分支归 01303）'); chartNoteB='无城市场景诚实空（序列层留待有城市场景复核），即时反映由 sz_metrics+勾选态承载' }; await page.evaluate((v)=>{ window.__p012Uncheck=v; }, JSON.stringify({ checked: checkedB, szMetrics: setB, chart: chartNoteB }))
