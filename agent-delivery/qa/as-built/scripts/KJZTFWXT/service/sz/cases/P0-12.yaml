as_built_note: env-gate overall=pass；01293 B 档零 allow_skip（scout-b32-s2 实证交互链路通）。结果态经历史「查看结果」（D4-SVCSZ-RESULT-VIA-HISTORY）。D1 译法一（预期 1「指标增减即时反映到图表」）：本环境 GET result 无城市场景（scout-b32-s1 compare_grid=0/compare_empty=1），图表序列层走双分支——有城市场景验 echarts 序列集合随勾选剔除/保留该项，无城市场景验诚实空不渲染空轴且不出全取消越界提示，「即时反映」的状态层真源=URL sz_metrics 参数 + checkbox checked 态即时更新（scout-b32-s2 uncheck#1 后 url 即时现 sz_metrics=tech,density、checked=2 实证）；序列层断言留待有城市场景复核记 observed（同 P0-11 expect[4] 口径）。D1 译法二（预期 2「刷新后勾选保留」）：持久化机制=URL 参数驱动（reload 后 sz_metrics=tech,density 保留、勾选态=2；scout-b32-s2 after_reload 同机制实证 uncheck-all 后 sz_metrics=- 与 checked=0 跨 reload 保留）。D1 译法三（预期 3「重新勾选后回显正确」）：recheck 后三项全选回显 + sz_metrics 参数清除回默认态（scout-b32-s2 recheck#1 url_sz_metrics=null 实证）。边界划界：全取消异常分支（「请至少选一个对比指标」提示 + 保留上次图形）归 01303，本条组合始终 ≥2 项、compare-none 以不可见负面断言划界不吞判定；与 01292/P0-11 划界（P0-11 主断可选项构成与默认勾选静态态，本条主断增减交互与持久化动态态，expect[0] 默认全选仅作前置基线校验）。Arco checkbox 勾选态挂类名 .arco-checkbox-checked（禁 input:checked）；定位单项 checkbox 用容器内枚举 innerText 匹配 + 读自身 class（P0-11 教训勿 locator.locator 查自身）。observed：① 本条打开共享账号历史任务结果（SVC-2026 09/08 三条已完成任一，scout-b32-s1 实证 002）；② 本环境无城市场景，图区走 compare-empty 诚实空，序列层双分支留待有城市场景复核；③ 无城市场景下结论区/梯队区无 DOM（scout-b32-s1 conclusions_ul=0/tier_section=0），本条不涉；④ 恢复全选后 URL 参数消失（scout-b32-s2 restored_url_param=null 实证）。P2 跨 tick（每次 click 后 1000ms 再读态、reload 后 3500ms）；P7 无下拉操作；P8 steps 自含 goto 重置 + expect[4] 收尾还原全选（URL 参数态还原，下一条虽自带 goto 仍不残留）。「生物」黑名单不用（本条不起任务）。列表 2 空格缩进。
