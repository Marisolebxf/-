  ① 同路由三 workspace 参数区分——现场通过：/service/chain-analysis 同一路由，workspace=chain/graph/shenzhen 各自落位且 tab 同步；chain title=「服务链短板分析 - 科技专题服务系统」、graph title=「服务链图谱分析 - 科技专题服务系统」（D1 记档：用例步骤 1 沿旧名「全链路短板分析」，现场菜单/页头 Tab 名=「服务链短板分析」；备注「兄弟 Tab 菜单名执行时记录」→ expect[1]/[3] console.log 采 [role=tab] 名单记 observed，对比篮浮层 Tab（企业/产业/服务机构/区域）混采如实记录）。
  ② 深圳侧产业集群与分析任务不被兄弟工作区操作覆盖——承载面拆解：本条纯草稿隔离（只选条件不起任务，规避 guest 共享账号当天复用缺陷票 D3-SVCSZ-SAME-DAY-REUSE-MISSING 干扰）；「不被覆盖」正向 = 兄弟页零泄漏（expect[1]/[3]：chain/graph URL 不携带 sz industry 参数与 task_id/view=、正文无「分析结果已生成/生成中」、配置区完整）+ 往返 0 POST（expect[5]，01287 互证：任务只在「开始分析」显式触发创建，页面空态文案自证「切换产业或 workspace 不会自动创建任务」）；「分析任务不被覆盖」任务侧由服务端记录可找回承载（P0-17/18 实证记录 Tab 查看结果链路、chain 侧 P0-14 附证记录含本会话任务），本条不重复起任务验证。备注口径「生态包三 Tab 共享产业领域上下文（field），同 field 一致不算串扰」——故不断言兄弟页产业回显 ≠「新一代信息技术」（共享 field 属正常语义，chain/graph 配置区自有产业下拉）。
  ③ 两次切回后产业集群选定均保留——现场不保留：探针实证 URL 直切 chain/graph 后再 goto 回 sz，两次回显均空、URL industry= 均丢（back1/back2 cluster_kept=false×2）——与 chain 侧 D3-SVCSHORT-WS-SWITCH-STATE-LOST（P0-14 实测菜单切换丢态）/ graph 侧 D3-SVCGRAPH-WS-SWITCH-STATE-LOST 同根因：产业/任务参数纯 URL query 驱动，跨工作区切换 query 重置后无草稿存储，三工作区同形态=生态包共享层缺陷。保留断言按用例口径写（expect[2]/[4]，红即缺陷显性化）；runner 每条 expect 独立 try/catch——expect[2] 红不阻断 expect[3]~[5] 续跑（chain P0-14「设计红 1/6 其余全绿」同款形态），graph 侧隔离与 0 POST 互证仍出完整证据。
