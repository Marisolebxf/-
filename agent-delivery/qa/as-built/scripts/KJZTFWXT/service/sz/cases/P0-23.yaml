# P0-23（FUNC-01304 异常-无数据柱位占位；kind=GAP）
# 落局：本环境历史结果无城市场景（compare-empty 诚实空）→ 无法自然出现「某城某指标缺值」柱位；
# 经 Playwright route.fulfill 在首包「查看结果」前挂窄 pattern
#   **/topicAsync/topic/v1/analysis/tasks/*/result*（禁宽 glob **/tasks*——会误伤 GET …/tasks/{id} 与 /events，致 hit=0）
# 注入 cities（深圳有值、北京三指标全缺；resultAssetId=null）后：
#   compare-grid 可见 + canvas≥1 + 诚实空消失；
# 生产包无 window.echarts、vue CE 不暴露 option → 柱顶「无数据」canvas 文案不可机读；
# 机检三联：① UI 消费注入（grid/canvas/空态消失）② 同源 parse（selfcheck missingValue 同款）北京 value===null 且 !==0
#   ③ 区级口径文案「缺值显示「无数据」，不用 0 填充」在屏；
# 源码 buildSzCompareBarOption：value==null → label/tooltip「无数据」（serviceEcoCompare.selfcheck 已单测 null≠0）。
# 写前探针 _probe-p023n.json：首包 hit=1 grid=true canvas=3；reload 亦可再命中。
# 不援引用例备注「本轮不判 Fail（开放项 3）」skip——构造路径可复现，B 档零 allow_skip（对齐 P0-20/22）。
id: P0-23
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01304
priority: P2
tier: B
title: 异常-无数据柱位占位——某城市某指标缺值时柱位「无数据」占位且不以 0 填充
story: US-SVC-ECO-06
entry_id: svc-sz
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass（D4-SVCSZ-RESULT-VIA-HISTORY：分析记录 ≥1 条 type=shenzhen 已完成可「查看结果」）
  - 结果态必须经历史「查看结果」，禁默认 fresh 起任务；本环境快照无城市场景——缺值柱位经 route.fulfill 注入 cities 构造（测试工具合法模拟，非改业务环境；结束 unroute）
  - 写前探针实证（fixtures/scout/_probe-p023n.json）：首包挂窄 result route 后点「查看结果」hit=1 + grid + canvas=3；口径含「无数据」；同源 parse 北京 null≠0
locators:
  tab_records: tab「分析记录」（或 [data-tab-key=records]）
  view_result: button「查看结果」
  compare: data-testid=svc-eco-sz-compare
  compare_caliber: data-testid=svc-eco-sz-compare-caliber（演示口径含「缺值显示「无数据」」）
  compare_grid: data-testid=svc-eco-sz-compare-grid（有城市场景时图表）
  compare_empty: data-testid=svc-eco-sz-compare-empty（无城市场景诚实空）
  result_get: GET **/topicAsync/topic/v1/analysis/tasks/*/result*（route.fulfill 注入点；须在首包「查看结果」前挂）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=shenzhen&tab=shenzhen
    note: 自含重置（P8）；首包挂 route→查看结果注入 + 缺值断言 + unroute 均自含 expect
  - action: evaluate
    note: 挂窄 result route 后点「查看结果」首包注入缺值 cities（expect[0]）
  - action: screenshot
    note: 注入后对比图区（grid+canvas）
  - action: evaluate
    note: 缺值=null≠0 同源 parse + 口径文案（expect[1]）
  - action: screenshot
    note: 终态
  - action: evaluate
    note: unroute 收尾（expect[2]，P8）
expect:
  - note: 前置+构造（用例前置「已进入结果态」+步骤「构造某城市某指标无数据」）——切「分析记录」定位 type=shenzhen|深圳 已完成行；对齐探针 _probe-p023n：先挂 context.route('**/topicAsync/topic/v1/analysis/tasks/*/result*')（窄 pattern，不误伤 GET …/tasks/{id} 与 /events），仅 GET fulfill 注入 cities（北京三指标缺、深圳有值；resultAssetId=null）；再点「查看结果」使首包 GET 命中注入（同任务复点不重拉 result，故必须首包拦截）；断言 hit≥1 + grid 可见 + empty 不可见 + canvas≥1（D4 历史进结果，不 fresh 起任务）
    assert: |-
      await page.waitForTimeout(1200);
      const close=page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true }));
      await expect(rec.first()).toBeVisible({ timeout: 12000 });
      await rec.first().click({ timeout: 12000 });
      await page.waitForURL(/tab=records/, { timeout: 12000 }).catch(()=>{});
      await page.waitForTimeout(2000);
      let body=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (!/shenzhen|深圳/.test(body) || !/已完成/.test(body)) {
        await page.reload({ waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2500);
        await rec.first().click({ timeout: 12000 }).catch(()=>{});
        await page.waitForTimeout(2000);
        body=((await page.locator('main').first().innerText().catch(()=>''))||'');
      }
      if (!/已完成/.test(body)) throw new Error('分析记录未见已完成');
      const typeRe=/shenzhen|深圳/;
      let row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: typeRe }).filter({ hasText: /已完成/ }).filter({ has: page.getByRole('button', { name: /查看结果/ }) }).first();
      if (!(await row.count())) {
        row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /已完成/ }).filter({ has: page.getByRole('button', { name: /查看结果/ }) }).first();
      }
      if (!(await row.count())) throw new Error('无已完成可查看结果行（type=shenzhen/深圳 或任意已完成）');
      await row.scrollIntoViewIfNeeded().catch(()=>{});
      const viewBtn=row.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first();
      await expect(viewBtn).toBeVisible({ timeout: 12000 });
      await expect(viewBtn).toBeEnabled({ timeout: 12000 });
      const injectCities=[
        { city: '深圳', scale: 9, tech: 80, density: 0.4 },
        { city: '全国平均', scale: 5, tech: 70, density: 0.3 },
        { city: '北京' },
        { city: '上海', scale: 7, tech: 75, density: 0.35 },
        { city: '广州', scale: 6, tech: 72, density: 0.32 },
      ];
      globalThis.__p023InjectCities=injectCities;
      let hit=0;
      const reqLog=[];
      const ROUTE_PAT='**/topicAsync/topic/v1/analysis/tasks/*/result*';
      await page.context().unroute(ROUTE_PAT).catch(()=>{});
      await page.context().route(ROUTE_PAT, async (route) => {
        const req=route.request();
        reqLog.push(req.method()+' '+req.url().slice(0,180));
        if (req.method()!=='GET') return route.continue();
        hit++;
        return route.fulfill({
          status: 200,
          contentType: 'application/json',
          body: JSON.stringify({
            code: 0, msg: 'ok', ok: true,
            data: {
              taskId: 'SVC-P023-INJECT',
              userId: 'guest',
              analysisType: 'shenzhen',
              status: 'success',
              targetParams: JSON.stringify({ analysis_fp: 'svc|shenzhen|INB1701', industry: 'INB1701', workspace: 'shenzhen', viewed: true }),
              resultData: JSON.stringify({ cities: injectCities }),
              resultAssetId: null,
              errorMsg: null,
            },
          }),
        });
      });
      await viewBtn.click({ timeout: 12000 });
      await page.waitForTimeout(4500);
      let url=page.url();
      let body2=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (/view=processing/.test(url) && /查看结果/.test(body2)) {
        const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first();
        if (await vr.count() && await vr.isVisible().catch(()=>false)) { await vr.click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url(); body2=((await page.locator('main').first().innerText().catch(()=>''))||'') }
      }
      if (/正在创建任务/.test(body2) && !/view=result|统一评价框架|对比指标/.test(url+body2)) throw new Error('疑似 fresh 起任务/过程态而非历史结果: '+url);
      for (let i=0;i<8 && hit<1;i++) { await page.waitForTimeout(500) }
      if (hit<1) throw new Error('GET result 未被 fulfill（hit='+hit+' req='+JSON.stringify(reqLog).slice(0,300)+'）——须在首包「查看结果」前挂窄 **/tasks/*/result*（宽 **/tasks* 会误伤 task/events）');
      const close2=page.locator('button[aria-label="关闭对比篮"]');
      if (await close2.count() && await close2.first().isVisible().catch(()=>false) && await close2.first().isEnabled().catch(()=>false)) { try { await close2.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }
      const grid=page.locator('[data-testid="svc-eco-sz-compare-grid"]');
      const empty=page.locator('[data-testid="svc-eco-sz-compare-empty"]');
      await expect(grid.first()).toBeVisible({ timeout: 12000 });
      if ((await empty.count())>0 && await empty.first().isVisible().catch(()=>false)) throw new Error('注入城市场景后诚实空仍可见（构造未生效）');
      const canvasN=await page.locator('[data-testid="svc-eco-sz-compare"] canvas').count();
      if (canvasN<1) throw new Error('注入后对比图 canvas=0（柱位未渲染）');
      globalThis.__p023After={ hit, canvasN, url: page.url() };
      globalThis.__p023RoutePat=ROUTE_PAT;
      console.log('[P0-23 observed] 首包注入构造成功 after='+JSON.stringify(globalThis.__p023After)+' req='+JSON.stringify(reqLog).slice(0,200));
  - note: 用例预期「无数据柱位显示「无数据」占位、不以 0 填充」——① 区级口径文案在屏（data-testid=svc-eco-sz-compare-caliber 含「缺值显示「无数据」」+「不用 0 填充」）；② 同源 parse（对齐 svcSzCompareModel / serviceEcoCompare.selfcheck missingValue）：注入 payload 中北京三指标 value===null 且 !==0，深圳 scale===9（有值对照）；③ 生产包柱顶「无数据」绘于 canvas（无 window.echarts 可读实例），机检以构造 UI 消费 + 同源 null 契约 + 口径文案三联承载，源码 label/tooltip formatter 闭包与 selfcheck 互证
    assert: |-
      if (!(globalThis.__p023After && globalThis.__p023After.hit>=1 && globalThis.__p023After.canvasN>=1)) throw new Error('缺值断言前置：expect[0] 注入构造成功标记缺失（防假绿）');
      const cal=page.locator('[data-testid="svc-eco-sz-compare-caliber"]');
      await expect(cal.first()).toBeVisible({ timeout: 8000 });
      const ct=((await cal.first().innerText().catch(()=>''))||'');
      if (!/缺值显示「无数据」|缺值显示『无数据』/.test(ct)) throw new Error('口径文案未见「缺值显示「无数据」」: '+ct.slice(0,120));
      if (!/不用 0 填充|不用0填充/.test(ct.replace(/\s+/g,''))) throw new Error('口径文案未见「不用 0 填充」: '+ct.slice(0,120));
      const cities=globalThis.__p023InjectCities;
      if (!Array.isArray(cities) || !cities.length) throw new Error('注入 cities 缺失（expect[0] 未就位）');
      const CITY_CANON=[
        { id: 'sz', name: '深圳', aliases: ['深圳','shenzhen','sz'] },
        { id: 'nat', name: '全国平均', aliases: ['全国平均','全国','national','national_avg'] },
        { id: 'bj', name: '北京', aliases: ['北京','beijing','bj'] },
        { id: 'sh', name: '上海', aliases: ['上海','shanghai'] },
        { id: 'gz', name: '广州', aliases: ['广州','guangzhou','gz'] },
      ];
      const METRICS=[
        { key: 'scale', name: '服务机构数量' },
        { key: 'tech', name: '平均技术力得分' },
        { key: 'density', name: '服务网络密度' },
      ];
      const numOf=(v)=>{ if (typeof v==='number' && Number.isFinite(v)) return v; if (typeof v==='string' && v.trim()!=='') { const n=Number(v); if (Number.isFinite(n)) return n } return null };
      const matchCity=(raw)=>{ const t=String(raw??'').trim(); const lower=t.toLowerCase(); for (const c of CITY_CANON) { if (c.name===t || c.aliases.some((a)=>a.toLowerCase()===lower)) return c.id } return null };
      const map={};
      for (const row of cities) {
        const id=matchCity(row.city||row.name||row.id);
        if (!id) continue;
        if (!map[id]) map[id]={};
        for (const m of METRICS) {
          const n=numOf(row[m.key]);
          if (n!=null) map[id][m.key]=n;
        }
      }
      const bj=map.bj||{};
      for (const m of METRICS) {
        const v=bj[m.key]??null;
        if (v!==null) throw new Error('北京 '+m.key+' 应为 null（缺值），实为 '+v+'——应以「无数据」占位而非有值');
        if (v===0) throw new Error('北京 '+m.key+' 为 0（禁止用 0 填充缺值）');
      }
      const szScale=map.sz && (map.sz.scale??null);
      if (szScale!==9) throw new Error('对照：深圳 scale 应为 9（有值），实为 '+szScale);
      if (Object.keys(map).length<2) throw new Error('parse 城市场景过少: '+Object.keys(map).join(','));
      globalThis.__p023Parse={ cities: Object.keys(map), bj: { scale: bj.scale??null, tech: bj.tech??null, density: bj.density??null }, szScale };
      console.log('[P0-23 observed] 缺值契约 parse='+JSON.stringify(globalThis.__p023Parse)+' caliber_ok=1');
  - note: 收尾 unroute（P8）——解除 GET result 拦截，避免污染同 context 后续脚本；复查路由已卸
    assert: |-
      const pat=globalThis.__p023RoutePat||'**/topicAsync/topic/v1/analysis/tasks/*/result*';
      await page.context().unroute(pat).catch(()=>{});
      console.log('[P0-23 observed] unroute OK after='+JSON.stringify(globalThis.__p023After));
allow_empty: false
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；hit=0 先核是否首包前挂了窄 **/tasks/*/result*（宽 **/tasks* 误伤 task/events）+ resultAssetId 是否 null；注入后仍诚实空=fulfill 包络未消费；北京 parse 非 null=注入 cities 被改写；弹层遮挡先关对比篮；与 P0-05/01294（五城市结构）划界——本条专测缺值占位异常分支
as_built_note: |-
  env-gate overall=pass；01304 B 档零 allow_skip（探针 _probe-p023n 实证首包构造通）。结果态经历史「查看结果」（D4-SVCSZ-RESULT-VIA-HISTORY）。
  红因纪要：宽 glob `**/topicAsync/topic/v1/analysis/tasks*` 会拦截 GET …/tasks/{id} 与 /events，破坏进结果链 → hit=0；修稿=窄 `**/tasks/*/result*` + 首包「查看结果」前挂 route（同任务复点不重拉）+ resultAssetId=null。
  D4 环境：本环境 GET result 无城市场景 → 自然态无法出现「某城某指标缺值」柱位；用例备注「需构造，本轮不判 Fail（开放项 3）」——本条不 skip，按测试工具构造（route.fulfill 注入 cities，非改业务仓/非改后端）。
  D1 构造口径：注入 payload=selfcheck missingValue 扩展五城（北京三指标键缺失→parse 得 null；深圳 scale=9 有值对照）。
  D1 机检三联（柱顶 canvas「无数据」不可直读）：① UI 消费=grid 可见 + empty 消失 + canvas≥1；② 同源 parse 北京三指标 null 且 !==0（禁 0 填充）；③ 口径文案 caliber 含「缺值显示「无数据」」「不用 0 填充」。源码 `buildSzCompareBarOption` label/tooltip：`value==null?'无数据':…` + serviceEcoCompare.selfcheck missingValue 互证。
  划界：P0-05/01294=五城市列与图结构；P0-22/01303=全取消指标提示；本条=缺值占位异常。P2 跨 tick（查看结果后 4.5s）；P8 expect[2] unroute + steps 自含 goto。viewport 1920×1080@1。用例优先级 P2、脚本 id 母表顺延 P0-23。列表 2 空格缩进。
