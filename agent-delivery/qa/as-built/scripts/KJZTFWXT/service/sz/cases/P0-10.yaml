expect:
  - note: 切「分析记录」Tab；点 type=shenzhen 已完成行「查看结果」进结果态（D4-SVCSZ-RESULT-VIA-HISTORY，不 fresh 起任务），框架壳可达
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const rec=page.locator('[role=tab][data-tab-key="records"]').or(page.getByRole('tab', { name: '分析记录', exact: true })); await expect(rec.first()).toBeVisible({ timeout: 8000 }); await rec.first().click({ timeout: 8000 }); await page.waitForURL(/tab=records/, { timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(1000); const body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (!/shenzhen/.test(body)) throw new Error('分析记录未见 type=shenzhen'); if (!/已完成/.test(body)) throw new Error('分析记录未见已完成'); const row=page.locator('tr, [role="row"], .arco-table-tr').filter({ hasText: /shenzhen/ }).filter({ hasText: /已完成/ }).filter({ has: page.getByRole('button', { name: /查看结果/ }) }).first(); if (!(await row.count())) throw new Error('无 type=shenzhen 已完成可查看结果行'); const viewBtn=row.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); await viewBtn.click({ timeout: 8000 }); await page.waitForTimeout(3000); let url=page.url(); let body2=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/view=processing/.test(url) && /查看结果/.test(body2)) { const vr=page.getByRole('button', { name: /查看结果/ }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (await vr.count()) { await vr.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(2500); url=page.url(); body2=((await page.locator('main').first().innerText().catch(()=>''))||'') } }; if (/正在创建任务/.test(body2) && !/view=result|统一评价框架/.test(url+body2)) throw new Error('疑似 fresh 起任务/过程态而非历史结果: '+url); const fw=page.locator('[data-testid="svc-eco-sz-framework"]'); const shellOk=/view=result/.test(url) || (await fw.count()>0) || /统一评价框架/.test(body2); if (!shellOk) throw new Error('未达结果态框架壳 url='+url+' body='+body2.slice(0,280))
  - note: 完整度项为红问号形态（步骤 1/预期 1）——行内「服务链完整度 | 不参与后续对比图」标注可见，角标按钮 aria-label=指标未登记：服务链完整度 且图标为 question 形态，挂 data-review-metric=GAP-SVC-SZ-CHAIN-COMPLETENESS 治理引用
    assert: |-
      const close2=page.locator('button[aria-label="关闭对比篮"]'); if (await close2.count() && await close2.first().isVisible().catch(()=>false)) { try { await close2.first().click({ timeout: 1200 }); await page.waitForTimeout(250) } catch {} }; const list=page.locator('[data-testid="svc-eco-sz-metric-list"]'); await expect(list.first()).toBeVisible({ timeout: 8000 }); const lis=list.locator('li'); let compLi=null; const n=await lis.count(); for (let i=0;i<n;i++) { const t=((await lis.nth(i).innerText().catch(()=>''))||''); if (t.includes('服务链完整度')) { compLi=lis.nth(i); break } }; if (!compLi) throw new Error('指标清单未见服务链完整度项'); const liTxt=((await compLi.innerText().catch(()=>''))||''); if (!/不参与后续对比图/.test(liTxt)) throw new Error('完整度行未见「不参与后续对比图」标注: '+liTxt.replace(/\n/g,'|').slice(0,140)); const qbtn=compLi.locator('button.metric-spec-card[aria-label="指标未登记：服务链完整度"]'); if (!(await qbtn.count())) throw new Error('完整度项未见 aria-label=指标未登记：服务链完整度 的角标按钮'); await expect(qbtn.first()).toBeVisible({ timeout: 5000 }); const iconCls=String(await qbtn.first().locator('svg').first().getAttribute('class').catch(()=>'')||''); if (!/question/.test(iconCls)) throw new Error('完整度角标图标非问号形态 svg class='+(iconCls||'(无)')); const gapAttr=await compLi.evaluate((el)=>{ const g=el.querySelector('[data-review-metric]'); return g?g.getAttribute('data-review-metric'):null }); if (!gapAttr || !/^GAP-/.test(gapAttr)) throw new Error('完整度行 data-review-metric 非 GAP-* 治理引用: '+gapAttr); if (!/GAP-SVC-SZ-CHAIN-COMPLETENESS/.test(gapAttr)) throw new Error('GAP 引用非 GAP-SVC-SZ-CHAIN-COMPLETENESS: '+gapAttr); await page.evaluate((v)=>{ window.__p010Form=v; }, JSON.stringify({ icon: iconCls, gap: gapAttr }))
  - note: 点红问号详情仅显治理引用、不显伪指标卡（步骤 2/预期 1 后半）——弹卡为「未登记 + GAP-SVC-SZ-CHAIN-COMPLETENESS」短卡：无就绪度区块、无「指标定义 已登记」伪语级、无口径定义/源表/更新频率/版本伪 8 件套内容
    assert: |-
      const list2=page.locator('[data-testid="svc-eco-sz-metric-list"]'); const lis2=list2.locator('li'); let compLi2=null; for (let i=0;i<(await lis2.count());i++) { if ((((await lis2.nth(i).innerText().catch(()=>''))||'').includes('服务链完整度'))) { compLi2=lis2.nth(i); break } }; if (!compLi2) throw new Error('前置缺失：未定位完整度行'); const qbtn2=compLi2.locator('button.metric-spec-card[aria-label="指标未登记：服务链完整度"]').first(); await qbtn2.scrollIntoViewIfNeeded().catch(()=>{}); await qbtn2.click({ timeout: 8000 }); await page.waitForTimeout(1500); const pops=page.locator('.arco-popover:visible, .arco-trigger-popup:visible, .arco-tooltip:visible'); const texts=[]; const pn=await pops.count(); for (let j=0;j<pn;j++) { const el=pops.nth(j); if (!(await el.isVisible().catch(()=>false))) continue; const t=((await el.innerText().catch(()=>''))||'').trim(); if (t) texts.push(t.replace(/\s+/g,' ')) }; const joined=texts.join(' \n '); if (!joined) throw new Error('点红问号后未见弹卡文本'); if (!/未登记/.test(joined)) throw new Error('弹卡未见「未登记」: '+joined.slice(0,200)); if (!/GAP-SVC-SZ-CHAIN-COMPLETENESS/.test(joined)) throw new Error('弹卡未见治理引用 GAP-SVC-SZ-CHAIN-COMPLETENESS: '+joined.slice(0,200)); if (/就绪度/.test(joined)) throw new Error('完整度弹卡不应显就绪度区块（伪就绪度）'); if (/指标定义\s*已登记/.test(joined)) throw new Error('完整度弹卡显「指标定义 已登记」伪语级'); if (/口径定义/.test(joined)) throw new Error('完整度弹卡不应显口径定义（伪 8 件套）'); if (/更新频率|源表 demo_/.test(joined)) throw new Error('完整度弹卡显伪源表/更新频率: '+joined.slice(0,200)); await page.evaluate((v)=>{ window.__p010Pop=v; }, joined.slice(0,260)); await page.keyboard.press('Escape').catch(()=>{}); await page.waitForTimeout(300)
  - note: 完整度不参与图表与结论渲染且框架卡说明排除原因（步骤 3/预期 2）——框架卡含「服务链完整度算法未入指标库…不送入后续城市对比图」排除说明；对比指标可选项恰 3 项且无完整度；图表有城市场景则序列/图例无完整度、无城市场景跟现场诚实空；结论区存在则无完整度数值、不存在记 observed
    assert: |-
      const fw=page.locator('[data-testid="svc-eco-sz-framework"]'); await expect(fw.first()).toBeVisible({ timeout: 8000 }); const fwTxt=((await fw.first().innerText().catch(()=>''))||''); if (!/服务链完整度算法未入指标库/.test(fwTxt)) throw new Error('框架卡未见完整度排除原因说明（算法未入指标库）: '+fwTxt.replace(/\n/g,'|').slice(0,260)); if (!/不把它送入后续城市对比图|不参与后续对比图/.test(fwTxt)) throw new Error('框架卡未说明完整度不参与后续对比: '+fwTxt.replace(/\n/g,'|').slice(0,260)); const cmp=page.locator('[data-testid="svc-eco-sz-compare-metrics"]'); await expect(cmp.first()).toBeVisible({ timeout: 8000 }); const boxes=cmp.locator('.arco-checkbox'); const bn=await boxes.count(); if (bn!==3) throw new Error('对比指标可选项 '+bn+' ≠3'); const blabels=[]; for (let i=0;i<bn;i++) { blabels.push((((await boxes.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,'')).trim()) }; for (const b of blabels) { if (/完整度/.test(b)) throw new Error('对比可选项混入完整度: '+b) }; const grid=page.locator('[data-testid="svc-eco-sz-compare-grid"]'); const empty=page.locator('[data-testid="svc-eco-sz-compare-empty"]'); const hasGrid=(await grid.count())>0 && await grid.first().isVisible().catch(()=>false); const hasEmpty=(await empty.count())>0 && await empty.first().isVisible().catch(()=>false); let chartNote=''; if (hasGrid) { const chartTxt=await page.evaluate(()=>{ const root=document.querySelector('[data-testid="svc-eco-sz-compare-grid"]'); if (!root) return ''; const nodes=root.querySelectorAll('div'); for (const nd of nodes) { try { const ec=window.echarts; if (!ec||!ec.getInstanceByDom) continue; const inst=ec.getInstanceByDom(nd); if (!inst) continue; const opt=inst.getOption()||{}; const sers=(opt.series||[]).map(s=>String((s&&s.name)||'')); const legs=(opt.legend&&opt.legend[0]&&opt.legend[0].data)||[]; return sers.join(',')+'|'+legs.join(',') } catch (e) {} } return root.innerText||'' }); if (/完整度/.test(String(chartTxt))) throw new Error('对比图序列/图例混入完整度: '+String(chartTxt).slice(0,180)); chartNote='grid 图表序列/图例无完整度' } else if (hasEmpty) { const et=((await empty.first().innerText().catch(()=>''))||''); if (!/无城市场景|无法绘制对比图/.test(et)) throw new Error('诚实空文案不符现场: '+et.slice(0,160)); chartNote='compare_empty 诚实空（无城市场景不绘伪图）' } else { throw new Error('未见对比图亦未见诚实空') }; const body=((await page.locator('main').first().innerText().catch(()=>''))||''); let conclNote=''; if (/优势|短板|结论/.test(body)) { if (/完整度[^\n]{0,8}[\d.]+/.test(body)) throw new Error('结论区出现完整度数值渲染'); conclNote='结论区存在且无完整度数值' } else { conclNote='本环境无结论区 DOM（诚实空链路），未渲染即未参与——observed' }; await page.evaluate((v)=>{ window.__p010Excl=v; }, chartNote+'；'+conclNote)
allow_empty: false
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；弹卡抓不到时先核 fixtures/scout/scout-p009-r5-speccard.json row4 口径（短卡文本实测可读）再判红；图标/GAP 属性断言红时先 dump 该 li outerHTML 归因（形态变更记 D1/D2 勿径直判产品缺陷）
as_built_note: env-gate overall=pass；01291 B 档（P0-09 实证完整度项存在与非伪，本条深验红问号/未登记形态与「不参与渲染」）。结果态经历史「查看结果」（D4-SVCSZ-RESULT-VIA-HISTORY）。D1 译法（用例预期 1「完整度项为红问号，详情仅显治理引用、不显伪指标卡」）：as-built 红问号 = 指标清单第 4 行 li 文本「服务链完整度 | 不参与后续对比图」+ 角标 button.metric-spec-card aria-label=「指标未登记：服务链完整度」+ svg question 形态 + 挂 data-review-metric=GAP-SVC-SZ-CHAIN-COMPLETENESS（shortboard 入口 P0-07 同口径）；点开弹卡为短卡「指标ID 未登记（治理引用：GAP-SVC-SZ-CHAIN-COMPLETENESS）计算公式 未登记 源系统 未登记 可用性 未登记」（scout-p009-r5 row4 实证），断言不显就绪度区块/口径定义/伪语级——「未登记」占位字段本身属诚实形态不判红。D1 译法（预期 2「完整度不参与图表与结论渲染，框架卡说明排除原因」）：框架卡排除原因段=「服务链完整度算法未入指标库，本页不输出伪完整度分数，也不把它送入后续城市对比图。」；对比可选项恰 3 项（与 P0-09 指标集一致断言互证，本条从完整度排除视角复验）；图表双分支——本环境 GET result 无城市场景走 compare_empty 诚实空（「当前结果快照无城市场景，无法绘制对比图。」），有图分支留 ECharts series/legend 无完整度断言（复用 P0-05 instance 读法）；结论区：scout-b32-s1 实勘 conclusions_ul=0/tier_section=0（本环境无结论区 DOM，未渲染即未参与），有结论区时断言无「完整度+数值」形态。诚实口径：完整度 D1 missing（算法未定义，Q-SVCCHAIN-04）诚实排除不判 Fail（用例备注原口径），本条断言的是诚实排除形态成立而非缺陷。observed：① 本条打开共享账号历史任务结果（框架卡元数据渲染不依赖城市场景，P0-09 已证 compare_empty=1 时 metric-list 完整）；② 弹卡容器 DOM 同名文本多份（teleport 残影），readPop 合并全部可见弹层文本后判关键词，免疫重复挂载。P2 跨 tick（点卡后 1500ms 再读弹层）；P3 对比篮可见才关；P7 弹卡点按钮本体；P8 steps 自含 goto 重置；评审开关本条不动（红问号随评审挂点渲染，关闭后零泄漏归 01302 域）。「生物」黑名单不用（本条不起任务）。B 档零 allow_skip（历史结果链路实测通）。列表 2 空格缩进。
