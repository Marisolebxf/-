id: FUNC-05300
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05300
priority: P1
tier: B
title: 备选-清空产业
entry_id: svc-portal-shenzhen
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: wait
    timeout_ms: 1200
  - action: evaluate
    note: 展开产业下拉并选择「生物」（同册 05290 前置）
    assert: |-
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('ENV-ENTRY-UNREACHABLE: /service-portal/shenzhen SPA404 url=' + page.url());
      }
      await expect(page.getByRole('heading', { name: '深圳产业服务介绍', level: 1 }).first()).toBeVisible({ timeout: 20000 });
      const main = page.locator('main');
      await page.keyboard.press('Escape').catch(() => {});
      const cascader = main.locator('.svc-portal-industry-cascader .arco-cascader-view').first();
      await cascader.click({ timeout: 10000 });
      const popup = page.locator('.arco-cascader-popup:visible');
      await popup.waitFor({ state: 'visible', timeout: 10000 });
      const bioItem = popup.locator('.arco-cascader-column').first().locator('.arco-cascader-list-item').filter({ hasText: /^生物/ }).first();
      await expect(bioItem).toBeVisible({ timeout: 8000 });
      const strictTick = bioItem.locator('.arco-checkbox, .arco-radio').first();
      if (await strictTick.count()) {
        await strictTick.click();
      } else {
        await bioItem.locator('.arco-cascader-list-item-label').click();
      }
      await page.keyboard.press('Escape');
      await page.waitForTimeout(800);
      await expect(main).toContainText('「生物', { timeout: 15000 });
  - action: evaluate
    note: 点击产业下拉上的清空
    assert: |-
      const main = page.locator('main');
      const cascaderView = main.locator('.svc-portal-industry-cascader .arco-cascader-view').first();
      await expect(cascaderView).toBeVisible({ timeout: 8000 });
      const clearBtn = main.locator('.svc-portal-industry-cascader .arco-cascader-view-clear-btn').first();
      if (await clearBtn.isVisible().catch(() => false)) {
        await clearBtn.click({ force: true, timeout: 5000 });
      } else {
        await cascaderView.click({ timeout: 8000 });
        const popup = page.locator('.arco-cascader-popup:visible');
        await popup.waitFor({ state: 'visible', timeout: 10000 });
        const allItem = popup.locator('.arco-cascader-column').first().locator('.arco-cascader-list-item').filter({ hasText: /^全部产业$/ }).first();
        await expect(allItem).toBeVisible({ timeout: 8000 });
        const tick = allItem.locator('.arco-checkbox, .arco-radio').first();
        if (await tick.count()) {
          await tick.click();
        } else {
          await allItem.locator('.arco-cascader-list-item-label').click();
        }
        await page.keyboard.press('Escape');
      }
      await page.waitForTimeout(800);
expect:
  - note: 1、产业占位回到「全部产业」
    assert: |-
      const main = page.locator('main');
      const cascader = main.locator('.svc-portal-industry-cascader .arco-cascader-view').first();
      await expect(cascader).toBeVisible({ timeout: 8000 });
      await expect(cascader).toContainText('全部产业', { timeout: 15000 });
  - note: 2、结论上下文为「全部产业」
    assert: |-
      await expect(page.locator('main')).toContainText('「全部产业」为上下文', { timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
