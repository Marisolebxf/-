id: FUNC-05289
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05289
priority: P1
tier: B
title: 主流程-产业下拉 15 项
entry_id: svc-portal-shenzhen
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: evaluate
    note: 展开产业下拉
expect:
  - note: 1、选项共 15 个
    assert: |-
      await expect(page.getByRole('heading', { name: '深圳产业服务介绍', level: 1 }).first()).toBeVisible({ timeout: 20000 });
      const cascader = page.locator('main .svc-portal-industry-cascader .arco-cascader-view').first();
      await expect(cascader).toBeVisible({ timeout: 15000 });
      await cascader.click({ timeout: 15000 });
      const menu = page.locator('.svc-portal-industry-cascader-menu:visible, .arco-cascader-popup:visible').last();
      await expect(menu).toBeVisible({ timeout: 15000 });
      const col = menu.locator('.arco-cascader-list-column, .arco-cascader-panel-column').first();
      await expect(col.locator('.arco-cascader-option, .arco-cascader-list-item')).toHaveCount(15);
  - note: 2、名称与顺序见附录 A
    assert: |-
      const expected = [
        '新一代信息技术',
        '生物',
        '新能源',
        '新材料',
        '高端装备',
        '智能网联新能源汽车',
        '绿色环保',
        '低空经济与空天',
        '传统与创意',
        '海洋',
        '未来制造',
        '未来信息',
        '未来能源',
        '未来空间',
        '未来健康',
      ];
      const menu = page.locator('.svc-portal-industry-cascader-menu:visible, .arco-cascader-popup:visible').last();
      await expect(menu).toBeVisible({ timeout: 8000 });
      const col = menu.locator('.arco-cascader-list-column, .arco-cascader-panel-column').first();
      const opts = col.locator('.arco-cascader-option, .arco-cascader-list-item');
      const norm = (t) => (t || '').replace(/\s+/g, ' ').trim().replace(/（[^）]*）$/, '');
      const texts = [];
      for (let i = 0; i < 15; i++) {
        texts.push(norm(await opts.nth(i).innerText()));
      }
      for (let i = 0; i < expected.length; i++) {
        if (texts[i] !== expected[i]) {
          throw new Error(
            '产业下拉顺序不符：第' + (i + 1) + '项期望「' + expected[i] + '」实际「' + texts[i] + '」；全集=' + JSON.stringify(texts),
          );
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
