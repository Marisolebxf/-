id: FUNC-05293
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05293
priority: P1
tier: B
title: 主流程-区排行条形
entry_id: svc-portal-shenzhen
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: scroll
    target: 区排行
expect:
  - note: 横向条共 9 个区，名称与顺序见附录 C
    assert: |-
      await expect(page.locator('main .svc-portal-chart--sz')).toBeVisible({ timeout: 20000 })
      const envelope = await page.evaluate(async () => {
        const res = await fetch('/svc/topic/v1/service-portal/shenzhen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        })
        if (!res.ok) return null
        return res.json()
      })
      if (!envelope) throw new Error('深圳统计 API 无响应')
      const topDown = await page.evaluate((env) => {
        const rows = []
        for (const item of env.districts ?? []) {
          const name = String(item.name ?? '').trim()
          const level = String(item.geo_level ?? '')
          if (!name) continue
          if (level && level !== 'sz_district') continue
          if (item.count == null) continue
          rows.push({ name, count: Number(item.count) })
        }
        rows.sort((a, b) => a.count - b.count)
        return rows.map((r) => r.name)
      }, envelope)
      const visualTopDown = [...topDown].reverse()
      const expected = ['南山区', '宝安区', '龙岗区', '福田区', '龙华区', '光明区', '罗湖区', '坪山区', '盐田区']
      if (visualTopDown.length !== 9 || !expected.every((name, i) => visualTopDown[i] === name)) {
        throw new Error('区排行 9 区顺序不符: ' + JSON.stringify(visualTopDown))
      }
  - note: 最上为南山区
    assert: |-
      const envelope = await page.evaluate(async () => {
        const res = await fetch('/svc/topic/v1/service-portal/shenzhen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        })
        if (!res.ok) return null
        return res.json()
      })
      if (!envelope) throw new Error('深圳统计 API 无响应')
      const topName = await page.evaluate((env) => {
        const rows = []
        for (const item of env.districts ?? []) {
          const name = String(item.name ?? '').trim()
          const level = String(item.geo_level ?? '')
          if (!name) continue
          if (level && level !== 'sz_district') continue
          if (item.count == null) continue
          rows.push({ name, count: Number(item.count) })
        }
        rows.sort((a, b) => a.count - b.count)
        const data = rows.map((r) => r.name)
        return String(data[data.length - 1] ?? '')
      }, envelope)
      if (topName !== '南山区') {
        throw new Error('最上区应为南山区，实际: ' + topName)
      }
  - note: 说明为「只排 Java 已给区行，不发明其余区。」
    assert: |-
      await expect(page.locator('main .svc-portal-region-caption')).toContainText('只排 Java 已给区行，不发明其余区。')
on_fail: 截图 + 抄 X-Trace-Id
