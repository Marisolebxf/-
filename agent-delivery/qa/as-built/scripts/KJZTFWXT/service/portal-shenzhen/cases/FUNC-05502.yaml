steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: scroll
    target: |-
      page.locator('main').getByText('居首')
expect:
  - note: 结论条写出居首的区名
    assert: |-
      await expect(page.locator('main')).toContainText('区居首')
