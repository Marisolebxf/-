id: FUNC-05505
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05505
priority: P1
tier: B
title: 主流程-进入分析侧画像
entry_id: svc-portal-shenzhen
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: evaluate
    note: 点击任一重点机构卡片（同册05497前置）
    assert: |-
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('ENV-ENTRY-UNREACHABLE: /service-portal/shenzhen SPA404 url=' + page.url());
      }
      await expect(page.getByRole('heading', { name: '深圳产业服务介绍', level: 1 }).first()).toBeVisible({ timeout: 20000 });
      const main = page.locator('main');
      await main.getByText('重点产业服务机构').scrollIntoViewIfNeeded();
      await main.getByText('广州合一健康科技有限公司').first().click({ timeout: 15000 });
      await page.waitForTimeout(600);
      await expect(page.getByText('进入分析侧画像')).toBeVisible({ timeout: 15000 });
  - action: evaluate
    note: 1.点击「进入分析侧画像」
    assert: |-
      const target = page.getByRole('button', { name: '进入分析侧画像' }).or(page.getByText('进入分析侧画像', { exact: true }));
      await target.first().click({ timeout: 10000 });
expect:
  - note: 浏览器标题为「服务机构产业领域分析」
    assert: |-
      await expect(page).toHaveTitle(/服务机构产业领域分析/, { timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
