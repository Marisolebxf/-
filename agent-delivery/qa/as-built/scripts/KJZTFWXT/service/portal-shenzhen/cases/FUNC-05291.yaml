id: FUNC-05291
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05291
priority: P1
tier: B
title: 主流程-产业链下拉
entry_id: svc-portal-shenzhen
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/shenzhen?industry=CL-SEI-01
  - action: evaluate
    note: 1.展开产业链下拉
    run: |-
      await page.locator('main .svc-portal-industry-cascader .arco-cascader-view').first().click();
      const menu = page.locator('.svc-portal-industry-cascader-menu');
      await menu.waitFor({ state: 'visible', timeout: 15000 });
      await menu.locator('.arco-cascader-column').first().locator('.arco-cascader-option').filter({ hasText: '新一代信息技术' }).first().hover();
      await menu.locator('.arco-cascader-column').nth(1).locator('.arco-cascader-option').first().waitFor({ state: 'visible', timeout: 15000 });
expect:
  - note: 1、选项共 6 个
    assert: |-
      await page.locator('main .svc-portal-industry-cascader .arco-cascader-view').first().click();
      const menu = page.locator('.svc-portal-industry-cascader-menu');
      await menu.waitFor({ state: 'visible', timeout: 15000 });
      await menu.locator('.arco-cascader-column').first().locator('.arco-cascader-option').filter({ hasText: '新一代信息技术' }).first().hover();
      const chainCol = menu.locator('.arco-cascader-column').nth(1);
      await expect(chainCol.locator('.arco-cascader-option')).toHaveCount(6, { timeout: 15000 });
  - note: 2、名称与顺序见附录 B
    assert: |-
      const expected = [
        '半导体与集成电路',
        '人工智能与应用',
        '新型网络与通信',
        '超高清视频与显示',
        '智能终端',
        '软件与信息服务',
      ];
      const menu = page.locator('.svc-portal-industry-cascader-menu');
      const opts = menu.locator('.arco-cascader-column').nth(1).locator('.arco-cascader-option');
      for (let i = 0; i < expected.length; i += 1) {
        await expect(opts.nth(i)).toContainText(expected[i], { timeout: 15000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
