id: FUNC-05497
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05497
priority: P0
tier: B
title: 主流程-机构详情抽屉
entry_id: svc-portal-shenzhen
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service-portal/shenzhen
  - action: evaluate
    target: 点击任一重点机构卡片
  - action: click
    target: 广州合一健康科技有限公司
expect:
  - note: 机构详情抽屉打开
    assert: |-
      await expect(page.locator('.arco-drawer')).toBeVisible({ timeout: 15000 });
  - note: 板块依序为机构概况、当前规模、业务服务领域、业务分布区域
    assert: |-
      const drawer = page.locator('.arco-drawer').last();
      const text = await drawer.innerText();
      const i1 = text.indexOf('机构概况');
      const i2 = text.indexOf('当前规模');
      const i3 = text.indexOf('业务服务领域');
      const i4 = text.indexOf('业务分布区域');
      if (i1 < 0 || i2 < 0 || i3 < 0 || i4 < 0) {
        throw new Error(`缺少板块标题: 概况@${i1} 规模@${i2} 领域@${i3} 区域@${i4}`);
      }
      if (!(i1 < i2 && i2 < i3 && i3 < i4)) {
        throw new Error(`板块顺序不对: ${i1}, ${i2}, ${i3}, ${i4}`);
      }
on_fail: 截图 + 抄 X-Trace-Id
