steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=records&view=result&demo_state=result&task_id=SVC-20260903-001
    note: 历史「查看结果」深链（九月种子，P0-06/10/28 同款；hang 空下 allow_skip 探测 svc-eco-clip-focus 5s 不可见 → n/a；修复后探测通过续跑全链）
expect:
  - note: 结果态已呈现且存在可聚焦机构——过滤区/聚焦下拉可见、下拉候选≥1（focusCandidates=isOrg）、G6 在屏且 hang 空诚实空态不可见（前置「画布存在可聚焦机构」机检锚）
    assert: |-
      await expect(page.getByText('服务生态关系图谱').first()).toBeVisible({ timeout: 8000 });
      const focus = page.locator('[data-testid="svc-eco-clip-focus"]').first();
      if (!(await focus.count())) throw new Error('D3-SVCGRAPH-FOCUS-MISSING: 结果态无聚焦下拉（svc-eco-clip-focus；画布非空仍缺=结构性缺失）');
      await expect(focus).toBeVisible({ timeout: 6000 });
      const g6 = page.locator('[data-testid="svc-eco-g6-graph"]').first();
      await expect(g6).toBeVisible({ timeout: 8000 });
      const empty = page.locator('[data-testid="svc-eco-empty-canvas"]').first();
      if ((await empty.count()) && (await empty.isVisible().catch(() => false))) {
        throw new Error('D4/回归：G6 在屏但 hang 空空态仍可见（互斥态异常）');
      }
      const close0 = page.locator('button[aria-label="关闭对比篮"]');
      if ((await close0.count()) && (await close0.first().isVisible().catch(() => false))) {
        try { await close0.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
      }
      const view = focus.locator('.arco-select-view').first();
      await view.click({ timeout: 4000 });
      await page.waitForTimeout(400);
      const opts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      const n = await opts.count();
      if (n < 1) throw new Error('聚焦下拉无候选机构（focusCandidates 空，无可聚焦机构）');
      globalThis.__p012OptCount = n;
      globalThis.__p012FirstOpt = ((await opts.first().innerText().catch(() => '')) || '').trim();
      const aria = ((await g6.locator('[role="img"]').first().getAttribute('aria-label').catch(() => '')) || '');
      const m = /(\d+)\s*个节点/.exec(aria);
      if (!m || +m[1] < 1) throw new Error('画布无节点可聚焦（aria-label 须含「N 个节点」且 N≥1）: ' + aria);
      globalThis.__p012BaseNodes = +m[1];
      const em = /(\d+)\s*条边|(\d+)\s*条关系/.exec(aria);
      globalThis.__p012BaseEdges = em ? +(em[1] || em[2]) : null;
      const readChecks = async (sel) => {
        const boxes = page.locator(sel + ' label.arco-checkbox');
        const c = await boxes.count();
        const out = [];
        for (let i = 0; i < c; i++) {
          const el = boxes.nth(i);
          const t = ((await el.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          const on = ((await el.getAttribute('class').catch(() => '')) || '').includes('arco-checkbox-checked');
          out.push({ t, on });
        }
        return out;
      };
      globalThis.__p012Nk = await readChecks('[data-testid="svc-eco-clip-node-kinds"]');
      globalThis.__p012Et = await readChecks('[data-testid="svc-eco-clip-edge-types"]');
      await page.keyboard.press('Escape').catch(() => {});
      await page.waitForTimeout(200);
      console.log('[P0-12 observed] focus ready opts=' + n + ' first=' + String(globalThis.__p012FirstOpt).slice(0, 40) + ' baseNodes=' + globalThis.__p012BaseNodes);
  - note: 选定一个聚焦机构后仅显示该机构的 1 度邻域——URL 写入 eco_focus；画布 aria 节点数 ≤ 聚焦前且 ≥1；相对全网缩小（或全网仅 1 度规模时节点数不变但 eco_focus 已写）
    assert: |-
      const focus = page.locator('[data-testid="svc-eco-clip-focus"]').first();
      const view = focus.locator('.arco-select-view').first();
      await view.click({ timeout: 4000 });
      await page.waitForTimeout(400);
      const opts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      if ((await opts.count()) < 1) throw new Error('聚焦下拉无选项可点');
      const pickName = ((await opts.first().innerText().catch(() => '')) || '').trim();
      await opts.first().click({ timeout: 4000 });
      await page.waitForTimeout(800);
      const url = page.url();
      const fm = /eco_focus=([^&]+)/.exec(url);
      if (!fm || !fm[1]) throw new Error('D3-SVCGRAPH-FOCUS-NOT-APPLIED: 选定聚焦后 URL 未写 eco_focus: ' + url.slice(0, 160));
      globalThis.__p012FocusId = decodeURIComponent(fm[1]);
      globalThis.__p012PickName = pickName;
      const g6 = page.locator('[data-testid="svc-eco-g6-graph"]').first();
      await expect(g6).toBeVisible({ timeout: 6000 });
      const aria = ((await g6.locator('[role="img"]').first().getAttribute('aria-label').catch(() => '')) || '');
      const m = /(\d+)\s*个节点/.exec(aria);
      if (!m || +m[1] < 1) throw new Error('聚焦后画布无可见邻域节点: ' + aria);
      const after = +m[1];
      const base = Number(globalThis.__p012BaseNodes || 0);
      if (base > 0 && after > base) throw new Error('聚焦后节点数反增（期望 1 度邻域 ≤ 全网）: base=' + base + ' after=' + after);
      if (base > after + 0) {
        /* 典型：全网收缩到 1 度邻域 */
      } else if (base === after && base > 1) {
        console.log('[P0-12 warn] 聚焦后节点数未变（可能全网本即该机构 1 度规模）base=after=' + after);
      }
      globalThis.__p012FocusNodes = after;
      const viewText = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (pickName && viewText && !viewText.includes(pickName.slice(0, Math.min(6, pickName.length)))) {
        console.log('[P0-12 warn] 触发器回显与所选名不完全一致 view=' + viewText.slice(0, 40) + ' pick=' + pickName.slice(0, 40));
      }
      console.log('[P0-12 observed] focus applied eco_focus=' + globalThis.__p012FocusId + ' nodes ' + base + '→' + after + ' pick=' + pickName.slice(0, 40));
  - note: 清除聚焦后恢复全网且过滤条件不变——eco_focus 清参；画布节点数回到聚焦前基线；节点类型/边类型勾选态与聚焦前一致
    assert: |-
      const focus = page.locator('[data-testid="svc-eco-clip-focus"]').first();
      const clearBtn = focus.locator('.arco-select-clear-icon, .arco-icon-close, [class*="clear"]').first();
      if (await clearBtn.count()) {
        try { await clearBtn.click({ timeout: 2000 }); } catch {
          await focus.hover();
          await page.waitForTimeout(200);
          await clearBtn.click({ timeout: 2000 });
        }
      } else {
        /* allow-clear 图标偶发需 hover；回退：再选 placeholder 路径不可靠 → setClipFocus(undefined) 等价 patchQuery */
        await page.evaluate(() => {
          const u = new URL(location.href);
          u.searchParams.delete('eco_focus');
          history.replaceState(null, '', u.toString());
        });
        await page.reload({ waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        throw new Error('D3-SVCGRAPH-FOCUS-CLEAR-MISSING: 聚焦下拉无 clear 图标（allow-clear 失效）；已尝试 URL 清参作对照，需产品修 clear');
      }
      await page.waitForTimeout(800);
      const url = page.url();
      if (/eco_focus=/.test(url)) throw new Error('D3-SVCGRAPH-FOCUS-NOT-CLEARED: 清除聚焦后 URL 仍含 eco_focus: ' + url.slice(0, 160));
      const g6 = page.locator('[data-testid="svc-eco-g6-graph"]').first();
      await expect(g6).toBeVisible({ timeout: 6000 });
      const aria = ((await g6.locator('[role="img"]').first().getAttribute('aria-label').catch(() => '')) || '');
      const m = /(\d+)\s*个节点/.exec(aria);
      if (!m) throw new Error('清除聚焦后画布 aria 无节点数: ' + aria);
      const restored = +m[1];
      const base = Number(globalThis.__p012BaseNodes || 0);
      if (base > 0 && restored !== base) {
        throw new Error('清除聚焦后未恢复全网节点数: base=' + base + ' restored=' + restored + ' aria=' + aria);
      }
      const readChecks = async (sel) => {
        const boxes = page.locator(sel + ' label.arco-checkbox');
        const c = await boxes.count();
        const out = [];
        for (let i = 0; i < c; i++) {
          const el = boxes.nth(i);
          const t = ((await el.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          const on = ((await el.getAttribute('class').catch(() => '')) || '').includes('arco-checkbox-checked');
          out.push({ t, on });
        }
        return out;
      };
      const nk = await readChecks('[data-testid="svc-eco-clip-node-kinds"]');
      const et = await readChecks('[data-testid="svc-eco-clip-edge-types"]');
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      if (!same(nk, globalThis.__p012Nk || [])) {
        throw new Error('清除聚焦后节点类型勾选态变化（过滤条件应不变）: before=' + JSON.stringify(globalThis.__p012Nk) + ' after=' + JSON.stringify(nk));
      }
      if (!same(et, globalThis.__p012Et || [])) {
        throw new Error('清除聚焦后边类型勾选态变化（过滤条件应不变）: before=' + JSON.stringify(globalThis.__p012Et) + ' after=' + JSON.stringify(et));
      }
      console.log('[P0-12 observed] focus cleared restoredNodes=' + restored + ' filters unchanged');
