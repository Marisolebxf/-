id: FUNC-04504
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04504
priority: P1
tier: B
title: 主流程-过程页查看分析记录
entry_id: svc-chain-graph
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
  - action: evaluate
    target: |-
      const cfg = page.locator('[data-testid="svc-eco-analysis-config"]');
      await cfg.locator('.arco-cascader-view').click();
      await page.locator('.arco-cascader-popup:visible').locator('.arco-cascader-option-label').filter({ hasText: /^新一代信息技术/ }).first().click({ timeout: 15000 });
  - action: click
    target: 开始分析
expect:
  - note: 1、打开「分析记录」列表
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByRole('button', { name: '查看分析记录' })).toBeVisible({ timeout: 90000 });
      const bodyText = await main.innerText();
      const m = bodyText.match(/任务 ID\\s*(SVC-[A-Za-z0-9-]+)/);
      const taskNo = m ? m[1] : '';
      await page.evaluate((id) => { window.__qaFunc04504TaskNo = id; }, taskNo);
      await main.getByRole('button', { name: '查看分析记录' }).click();
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(records).toBeVisible({ timeout: 15000 });
      const table = records.locator('.arco-table');
      for (const h of ['任务', '类型', '状态', '创建时间', '操作']) {
        await expect(table.getByText(h, { exact: true }).first()).toBeVisible();
      }
  - note: 2、列表含刚产生的任务
    assert: |-
      const taskNo = await page.evaluate(() => window.__qaFunc04504TaskNo);
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(records.locator('.arco-table tbody tr').first()).toBeVisible({ timeout: 15000 });
      if (taskNo) {
        await expect(records.getByText(taskNo, { exact: false })).toBeVisible();
      }
  - note: 3、该行状态为「已完成」
    assert: |-
      const taskNo = await page.evaluate(() => window.__qaFunc04504TaskNo);
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      const row = taskNo
        ? records.locator('.arco-table tbody tr').filter({ hasText: taskNo }).first()
        : records.locator('.arco-table tbody tr').first();
      await expect(row.getByText('已完成')).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
