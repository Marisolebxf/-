      if (sizeTxt !== '0/0') throw new Error('空过滤态统计规模行非 0/0: "' + sizeTxt + '"（clipEmpty 与 visibleStats 同源 clipped——空过滤态应 0 节点 0 边，E>0 与空态判定矛盾=同源断裂）');
