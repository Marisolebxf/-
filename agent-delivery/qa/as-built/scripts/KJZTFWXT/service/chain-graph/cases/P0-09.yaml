# P0-09（FUNC-00715 主流程-画布自由探索 · 拖拽缩放平移）
# 落局：D4 环境债 skip（ENV-SVCGRAPH-HANG-EMPTY-001）——G6 画布挂 v-if="!parsed.empty && !clipEmpty"，
# hang 空下 SvcEcoRelationGraph 不渲染（探针 _probe-p009 g6Count=0 / emptyVisible=true / interact.attempted=false），
# 用例前置「关系网络图已呈现」不可达，拖拽/缩放/平移无可探索对象。
