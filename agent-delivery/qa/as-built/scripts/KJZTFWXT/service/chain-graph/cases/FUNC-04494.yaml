steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
  - action: click
    assert: |-
      const main = page.locator('main');
      await main.locator('.svc-portal-industry-cascader .arco-cascader-view').click();
      await page.locator('.svc-portal-industry-cascader-menu').getByText('新一代信息技术').click();
