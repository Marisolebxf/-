    assert: |-
      const domainRow = page.locator('.arco-form-item').filter({
        has: page.locator('.arco-form-item-label', { hasText: '产业领域' }),
      });
      await domainRow.locator('.arco-select-view').click();
      await page.getByRole('option', { name: /新一代信息技术/ }).click();
      await page.getByRole('button', { name: '开始分析' }).click();
      await expect(page.getByRole('button', { name: '查看结果' })).toBeVisible({ timeout: 120000 });
      await page.getByRole('button', { name: '查看结果' }).click();
      await expect(
        page.getByText('当前 hang 无可见点边。滤镜②切过去仍可空画；不造对端点，不用排名表冒充图谱。')
      ).toBeVisible({ timeout: 120000 });
