id: FUNC-04501
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04501
priority: P1
tier: B
title: 主流程-分析记录列
entry_id: svc-chain-graph
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
  - action: evaluate
    target: |-
      const cfg = page.locator('[data-testid="svc-eco-analysis-config"]');
      await cfg.locator('.arco-cascader-view').click();
      await page.locator('.arco-cascader-panel').getByText('新一代信息技术', { exact: true }).click();
  - action: click
    target: 分析记录
expect:
  - note: 表头为「任务」「类型」「状态」「创建时间」「操作」
    assert: |-
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      const table = records.locator('.arco-table');
      for (const h of ['任务', '类型', '状态', '创建时间', '操作']) {
        await expect(table.getByText(h, { exact: true }).first()).toBeVisible();
      }
  - note: 行上有「查看过程」与「查看结果」
    assert: |-
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      const table = records.locator('.arco-table');
      await expect(table.getByRole('button', { name: '查看过程' }).first()).toBeVisible();
      await expect(table.getByRole('button', { name: '查看结果' }).first()).toBeVisible();
  - note: 已有行状态为「已完成」
    assert: |-
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      await expect(records.getByText('已完成').first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
