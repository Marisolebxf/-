as_built_note: D4 环境债（ENV-SVCGRAPH-HANG-EMPTY-001，与 P0-06/07 同票，fresh 实测后未重复长探）——本条前置「先后完成两次有效分析（模式①与②）」实测结论：历史 records 仅模式①任务（_probe-p008-fresh 对 SVC-20260903/0902/0823-001 三条深链普查 radio 全=「① 仅机构」，模式②历史不存在，优先历史深链对比路线不可用）；fresh 起一次模式②分析（新一代信息技术+② 机构+关联主体 → 开始分析 → 查看结果，任务 SVC-20260915-014，证据 _probe-p008-fresh.json + probe-p008-mode2-result.png）链路通但结果仍 hang 空（0 点 0 边、图例全不渲染）→ allow_skip 探测「投资」5s 不可见 → n/a，不判 Fail、不假绿。探测锚沿用 P0-06/07 同款「投资」（四类关系公共图例，修复后在两模式结果态均可见 → 本条自动转实；全页面无「投资」侧边栏误匹配词）。expect[0]/[1] 以结果壳图谱滤镜 radio 回显态作模式①/②锚点（as-built 代理口径：探针实证 radio 选中态与任务分析模式一致）；expect[2] 图例三类主体按附录 A.2 目标态口径；expect[3] 构成纯度 manual。模式②深链用探针实测原样 URL（含 industry/eco_filter 参数，减少与实测现场的变量）；当日任务有清理风险已在 preconditions 声明，届时 n/a 待环境侧补模式②种子任务后转实。评审模式横幅与图例/radio 无耦合，本条不动评审开关（P3 不适用结果态断言）。列表 2 空格缩进。
