id: FUNC-04491
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04491
priority: P0
tier: B
title: 主流程-过程页对象与耗时
entry_id: svc-chain-graph
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
expect:
  - note: 1、状态为「已完成」
    assert: |-
      await page.locator('.arco-select-view').first().click();
      await page.getByText('新一代信息技术', { exact: true }).click();
      await page.getByText('① 仅机构', { exact: true }).click();
      await page.getByRole('button', { name: '开始分析' }).click();
      await expect(page.getByText('已完成')).toBeVisible({ timeout: 120000 });
  - note: 2、分析对象为「产业领域：新一代信息技术」
    assert: |-
      await expect(page.getByText('产业领域：新一代信息技术')).toBeVisible();
  - note: 3、已用时间有读数
    assert: |-
      await expect(page.getByText(/已用.*\d/)).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
