id: FUNC-04488
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04488
priority: P0
tier: B
title: 主流程-入口A到结果页
entry_id: svc-chain-graph
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
expect:
  - note: 过程页出现「分析结果已生成」
    assert: |-
      const domainRow = page.locator('.arco-form-item').filter({ hasText: '产业领域' });
      await domainRow.locator('.arco-cascader-view').click();
      await page.getByText('新一代信息技术', { exact: true }).click();
      await page.getByText('① 仅机构').click();
      await page.getByRole('button', { name: '开始分析' }).click();
      await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 180000 });
  - note: 过程页写明不会自动跳转
    assert: |-
      await expect(page.getByText(/不会自动跳转/)).toBeVisible();
  - note: 结果页出现「服务生态关系图谱」
    assert: |-
      await page.getByRole('button', { name: '查看结果' }).click();
      await expect(page.getByText('服务生态关系图谱')).toBeVisible({ timeout: 60000 });
on_fail: 截图 + 抄 X-Trace-Id
