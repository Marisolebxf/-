id: FUNC-04503
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04503
priority: P0
tier: B
title: 主流程-记录查看过程
entry_id: svc-chain-graph
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph&industry=CL-SEI-01
  - action: click
    target: 分析记录
expect:
  - note: 1、出现「可视化分析过程」
    assert: |-
      const records = page.locator('[data-testid="svc-eco-analysis-records"]');
      const row = records.locator('tr').filter({ hasText: '已完成' }).first();
      await expect(row).toBeVisible({ timeout: 15000 });
      const taskNo = (await row.locator('td').first().innerText()).trim();
      await row.getByRole('button', { name: '查看过程', exact: true }).click();
      await expect(page.locator('main').getByText('可视化分析过程')).toBeVisible({ timeout: 15000 });
      await page.evaluate((id) => { window.__qaFunc04503TaskNo = id; }, taskNo);
  - note: 2、任务号与所点行一致
    assert: |-
      const taskNo = await page.evaluate(() => window.__qaFunc04503TaskNo);
      await expect(page.locator('main')).toContainText(taskNo);
  - note: 3、状态为「已完成」
    assert: |-
      await expect(page.locator('main').getByText('已完成', { exact: true }).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
