id: FUNC-04490
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04490
priority: P1
tier: B
title: 主流程-刷新保留条件
entry_id: svc-chain-graph
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
  - action: wait
    ms: 1200
  - action: click
    target: 产业领域
    locator: |-
      page.locator('main [data-testid="svc-eco-analysis-context"] .arco-cascader-view').first()
  - action: click
    target: 新一代信息技术
    locator: |-
      page.locator('.arco-cascader-dropdown .arco-cascader-column').first().getByText('新一代信息技术', { exact: true })
  - action: click
    target: ① 仅机构
    locator: |-
      page.locator('main [data-testid="svc-eco-analysis-context"]').getByRole('radio', { name: '① 仅机构' })
  - action: reload
expect:
  - note: 1、产业领域仍为「新一代信息技术」
    assert: |-
      await page.waitForURL(/workspace=graph/, { timeout: 15000 });
      await expect(page.locator('main [data-testid="svc-eco-analysis-context"]')).toContainText('新一代信息技术', { timeout: 15000 });
  - note: 2、图谱滤镜仍为「① 仅机构」
    assert: |-
      await expect(page.locator('main [data-testid="svc-eco-analysis-context"]').locator('.arco-radio-checked').filter({ hasText: '① 仅机构' })).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
