# P0-29（FUNC-00731 异常-分析失败态局部错误与重试）
# 落局：任务书分支①——route.abort 断链可触发（写前探针 _probe-p029 实证 aborted=1、
# 失败态 .arco-alert Network Error+traceId 在屏、配置壳/产业回显/模式全保留、重试 POST 200 落
# view=processing task_id=SVC-20260915-080、unroute 污染检查归零）→ 全链断言实跑，不援引
# 「本轮不判 Fail，开放项 3」skip；与姊妹仓 chain-shortboard P0-17（FUNC-00706）同构——
# graph/chain 共用 useSvcAnalysisJob，失败态承载同为壳层 a-alert type=error（errorMessage+
# errorTraceId），「开始分析」即重试承载（无独立重试文案，D1 记档）。
id: P0-29
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00731
priority: P1
tier: B
title: 异常-分析失败（断链）——失败时页面壳内呈局部错误提示、重试入口有效，页面壳与配置（产业集群+分析模式）保留（route.abort 模拟断链）
story: US-SVC-ECO-03
entry_id: svc-chain-graph
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass；graph 配置态合法选齐后「开始分析」enabled（g2 实证；本入口 POST 200 稳定，今日 P0-22/24/25/26/27 等实证）
  - 无后端控制权无法真断链——异常经 Playwright route.abort 拦截创建任务 POST 模拟（脚本内 route 拦截属测试工具合法模拟网络异常，非改业务环境）；结束 unroute 恢复，防污染同 context 后续请求
  - 写前探针实证（fixtures/scout/_probe-p029.json，2026-10-15）：断链可触发（aborted=1）+ 失败态形态同 P0-17（壳层 .arco-alert Network Error/traceId 在屏非白屏）+ 配置壳全保留 + 重试 POST 200 落 view=processing + 污染检查归零——走分支①全链断言
  - 本环境 user_id=guest 共享账号，并行会话可能同时起任务；本条 POST 拦截计数只读本条 context 内 route 命中，断言锚定本会话捕获 task_id，免疫他端噪声
locators:
  cluster_select: .industry-catalog-select（P7 点可见 view 容器，选项挂 .arco-trigger-popup:visible）
  start_btn: 'button「开始分析」（getByRole exact；data-testid=svc-eco-start-analysis，配置区 CTA）'
  failed_alert: 失败态局部错误承载（现场 .arco-alert 错误态「Network Error / traceId」形态；文案不钉死硬期望，命中现场记 observed）
  retry_entry: 失败态「重试」入口（as-built：无独立「重试」文案，「开始分析」失败态后仍可用即重试路径，D1 记录不判 Fail）
  config_skeleton: 「服务链图谱分析」「分析配置」配置区骨架 + .industry-catalog-select 产业集群选择器 + 图谱滤镜①②单选（graph 特有配置，与 chain P0-17 差异点）
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
    note: 自含重置进 graph 配置态（P8）；拦截断链、失败态断言、unroute 重试三段链式推进（动作自含 expect[0..4]，runner 顺序求值共享同一 page）
expect:
  - note: 前置成立（用例前置「已选定产业集群与分析模式」）——选定「新一代信息技术」回显、分析模式选中态在（默认① 仅机构，互斥单选由 P0-03 承载本条只确认选中）；随后安装 route 拦截（仅创建任务 POST 精确尾段，不误伤 tasks/list 与 tasks/running 轮询），显式点「开始分析」，POST 恰被拒 1 次（断链语义 connectionreset）
    assert: |-
      const close=page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(()=>false) && await close.first().isEnabled().catch(()=>false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} };
      if (/view=processing|view=result/.test(page.url())) { await page.goto('https://edu.itic-sci.com/tts/svcz/service/chain-analysis?workspace=graph&tab=graph', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000) };
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByPlaceholder('选择产业集群')).toBeVisible({ timeout: 8000 });
      const sel=page.locator('.industry-catalog-select').first();
      await sel.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const echo=((await sel.locator('.arco-select-view-value').first().innerText().catch(()=>''))||'').trim();
      if (!/新一代信息技术/.test(echo)) throw new Error('前置失败：选定后未回显: "'+echo+'"');
      const radioChecked=page.locator('main .arco-radio.arco-radio-checked').first();
      if (!(await radioChecked.count())) throw new Error('前置失败：分析模式无选中态（用例前置「已选定分析模式」；默认① 或 ② 均可）');
      globalThis.__p029Mode=((await radioChecked.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim();
      globalThis.__p029Echo=echo;
      globalThis.__p029Aborted=0;
      await page.context().route('**/topicAsync/topic/v1/analysis/tasks*', (route) => {
        const req=route.request();
        if (req.method()==='POST' && /\/topicAsync\/topic\/v1\/analysis\/tasks\/?(\?|$)/.test(req.url())) { globalThis.__p029Aborted++; return route.abort('connectionreset'); }
        return route.continue();
      });
      const start=page.getByRole('button', { name: '开始分析', exact: true });
      if (!await start.count()) throw new Error('未见「开始分析」按钮');
      if (!await start.first().isEnabled()) throw new Error('前置失败：「开始分析」不可用（env-gate g2 应 enabled）');
      await start.first().click({ timeout: 8000 });
      await page.waitForTimeout(5000);
  - note: 预期①——失败时图表容器区呈局部错误提示（页面壳内 alert 承载，非空白/白屏；文案不钉死：Network Error/失败/异常/错误类现场命中，traceId 随 run observed 记录）；未拦到 POST=断链未生效探针失败即红
    assert: |-
      const aborted=globalThis.__p029Aborted||0;
      if (aborted<1) throw new Error('创建任务 POST 未被拦截（aborted='+aborted+'）——断链未生效，失败形态不可复现');
      const alert=page.locator('.arco-alert').filter({ hasText: /Network Error|失败|异常|错误/ }).first();
      const n=await alert.count();
      if (n<1) throw new Error('失败时未见局部错误提示（.arco-alert 无 Network Error/失败/异常/错误类文案）——若整页空白/白屏/吞错，归 D3-SVCGRAPH-FAILURE-STATE-MISSING');
      if (!(await alert.isVisible().catch(()=>false))) throw new Error('失败态错误提示不可见');
      globalThis.__p029FailText=((await alert.innerText().catch(()=>''))||'').trim();
  - note: 预期②——失败态提供重试入口且页面壳与配置保留：配置区骨架（服务链图谱分析/分析配置/开始分析/图谱滤镜——graph 特有滤镜区）在场、产业集群回显保留、选择器在场、分析模式选中态保留（graph 与 chain 差异断言点）、URL 停配置态不漂移任务态；「开始分析」仍可见可用（重试入口承载，无独立重试文案 D1 记档）
    assert: |-
      const main=((await page.locator('main').first().innerText().catch(()=>''))||'');
      for (const k of ['服务链图谱分析','分析配置','开始分析','图谱滤镜']) { if (!main.includes(k)) throw new Error('页面壳缺失: '+k+'（失败致壳丢失/白屏归 D3-SVCGRAPH-FAILURE-STATE-MISSING）') }
      if (!(await page.locator('.industry-catalog-select').first().count())) throw new Error('产业集群选择器丢失（配置未保留）');
      const echo=((await page.locator('.industry-catalog-select .arco-select-view-value').first().innerText().catch(()=>''))||'').trim();
      if (!/新一代信息技术/.test(echo)) throw new Error('失败态产业筛选回显丢失: "'+echo+'"');
      const radioChecked=page.locator('main .arco-radio.arco-radio-checked').first();
      if (!(await radioChecked.count())) throw new Error('失败态分析模式选中态丢失（配置未保留）');
      const modeAfter=((await radioChecked.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim();
      if (modeAfter!==String(globalThis.__p029Mode||'')) throw new Error('失败态分析模式选中态漂移: "'+globalThis.__p029Mode+'" → "'+modeAfter+'"');
      const u=page.url();
      if (!/workspace=graph/.test(u)) throw new Error('失败态 URL 漂离 graph 工作区: '+u);
      if (/view=processing|view=result/.test(u)) throw new Error('失败态 URL 漂移任务态: '+u);
      const start=page.getByRole('button', { name: '开始分析', exact: true });
      if (!(await start.count())) throw new Error('重试承载缺失：「开始分析」按钮丢失');
      if (!(await start.first().isEnabled())) throw new Error('重试承载失效：「开始分析」失败态后不可用');
  - note: 步骤②——unroute 恢复网络后点重试承载（「开始分析」）：POST 重新发出未被拦（成功落 view=processing 捕获 task_id，graph 指纹 analysis_fp=svc|graph|），局部错误提示消失，页面壳与配置仍在（重试有效闭环）；abort 仍挂则再现失败态（双分支口径：本条走解除分支断言恢复，abort 保持分支形态由 expect[1..2] 已验同构）
    assert: |-
      await page.context().unroute('**/topicAsync/topic/v1/analysis/tasks*');
      globalThis.__p029Aborted=0;
      await page.waitForTimeout(800);
      const start=page.getByRole('button', { name: '开始分析', exact: true });
      if (!(await start.count()) || !(await start.first().isEnabled())) throw new Error('重试前置失败：「开始分析」不可用');
      await start.first().click({ timeout: 8000 });
      let retryUrl=page.url(); let retryTask=null; let landed=false;
      for (let i=0;i<15;i++) { await page.waitForTimeout(1000); retryUrl=page.url(); if (/view=processing|view=result/.test(retryUrl)) { const m=/[?&]task_id=(SVC-\d{8}-\d{1,4})/.exec(retryUrl); if (m) retryTask=m[1]; landed=true; break } }
      const aborted2=globalThis.__p029Aborted||0;
      if (aborted2>0) throw new Error('unroute 未生效仍有拦截 ×'+aborted2+'（污染检查失败）');
      if (!landed) throw new Error('重试后未进任务态（view=processing/result 未命中 15s）: '+retryUrl);
      globalThis.__p029RetryTask=retryTask;
      if (!/analysis_fp=svc\|graph\|/.test(retryUrl)) throw new Error('重试 URL 未带 graph 工作区指纹 analysis_fp=svc|graph|: '+retryUrl);
      const main=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (/新一代信息技术/.test(main)===false) throw new Error('重试后产业上下文丢失');
      if (/产业领域：新一代信息技术/.test(main)===false) throw new Error('重试过程页未见「产业领域：新一代信息技术」分析对象');
  - note: 收尾留证——重试任务完成后停引导态（分析结果已生成）或已落结果态；失败态 alert 清除；失败态 alert 文案/traceId 与重试 task_id 落 scout observed（用例备注「observed-执行时记录」口径：失败发生在创建任务阶段，详情/统计子块未创建无可采文案，失败提示子块文案随 run observed 落盘）
    assert: |-
      let body=''; let url=page.url();
      for (let i=0;i<30;i++) { await page.waitForTimeout(2000); body=((await page.locator('main').first().innerText().catch(()=>''))||''); url=page.url(); if (/分析结果已生成/.test(body) || /view=result/.test(url)) break }
      const done=(/分析结果已生成/.test(body) || /view=result/.test(url));
      if (!done) throw new Error('重试任务 '+String(globalThis.__p029RetryTask)+' 60s 未见完成引导态/结果态: '+url);
      const alertN=await page.locator('.arco-alert').filter({ hasText: /Network Error/ }).count().catch(()=>0);
      if (alertN>0 && await page.locator('.arco-alert').filter({ hasText: /Network Error/ }).first().isVisible().catch(()=>false)) throw new Error('成功后 Network Error 提示仍在（重试成功未清失败态）');
      console.log('[P0-29 observed] 断链失败态="'+String(globalThis.__p029FailText||'').replace(/\n/g,' / ')+'" 重试 task_id='+String(globalThis.__p029RetryTask)+' 模式保留="'+String(globalThis.__p029Mode)+'" 终态 url='+url);
      try { const fs=await import('node:fs'); const pt=await import('node:path'); const fp=pt.join(process.cwd(),'agent-delivery/qa/as-built/scripts/KJZTFWXT/service/chain-graph/fixtures/scout/_probe-p029-run.json'); fs.writeFileSync(fp, JSON.stringify({ at:new Date().toISOString(), fail_alert:globalThis.__p029FailText||'', mode_kept:globalThis.__p029Mode||'', retry_task:globalThis.__p029RetryTask||null, retry_url:url, retry_body_head:(body||'').slice(0,300) }, null, 2)); } catch(e) {}
on_fail: 截图 + 抄失败态 alert 内 traceId + C1~C6 分类；若失败时整页空白/无提示（吞错）或失败态丢页面壳/配置（产业回显/模式选中态）→ 红挂缺陷票 D3-SVCGRAPH-FAILURE-STATE-MISSING（与 D3-SVCSHORT-FAILURE-STATE-MISSING 同族，本入口独立票号）；unroute 污染检查红归本条脚本缺陷即刻修稿
as_built_note: |-
  env-gate overall=pass；00731 B 档实跑（非 skip，任务书分支①）。异常构造口径（写前探针 _probe-p029.mjs/_probe-p029.json/probe-p029-failed-state.png，2026-10-15）：无后端控制权无法真断链，经 Playwright route.abort('connectionreset') 拦截创建任务 POST（glob **/topicAsync/topic/v1/analysis/tasks* + 方法 POST + 尾段正则精确匹配，/tasks/list 与 /tasks/running 轮询 continue 不误伤，探针 aborted 恰 1）——脚本内 route 拦截属测试工具合法模拟网络异常，非改业务环境；结束 unroute 恢复并复查拦截计数归零（防污染同 context 后续请求，P8 同义）。探针结论：断链可触发、失败态可稳定复现 → 不援引用例备注「本轮不判 Fail，开放项 3」skip，按预期断言实跑判 pass/fail（父单双分支走分支①全链断言）。
  失败态 as-built 形态（探针实证，与姊妹仓 chain-shortboard P0-17/FUNC-00706 同构）：graph/chain 共用 useSvcAnalysisJob（lumen-ui-topic ServiceChainAnalysisWorkspace.vue + useIndustryAnalysisJob.ts：createJob catch → extractIndustryErrorState → errorMessage/errorTraceId + Message.error），POST 被拒后页面非白屏——页面壳内可见 .arco-alert 错误态「Network Error / traceId：26625873…」（v-if="job.view!=='processing' && job.errorMessage" 壳层承载，置于主区顶部），配置区骨架（分析配置/产业领域/图谱滤镜①②/开始分析）/产业集群回显/模式选中态全保留，URL 停配置态（仅 industry=INB1701）不漂移任务态。
  预期①译法：用例写「失败时图表容器呈局部错误提示」——现场承载=页面壳内 .arco-alert（配置态无独立图表容器，关系网络图本未创建；局部=非整页替换非白屏，探针截图佐证）。文案不钉死硬期望（任务书口径）：断言认 .arco-alert + /Network Error|失败|异常|错误/ 宽词，命中现场文案与 traceId 记 run observed。用例功能点溯源「展示关联图谱构建失败提示」——POST 被拒时图谱未开始构建，失败提示由壳层 alert 承载，语义同源不矛盾。
  预期②译法：用例写「失败态提供重试入口且页面壳与配置保留」——现场无独立「重试」按钮文案，重试入口=「开始分析」按钮失败态后仍可用（unroute 恢复后再点即成功落 view=processing，探针实证 SVC-20260915-080）；无独立重试文案承载记 D1（与 P0-17 同族——「开始分析」即重试承载，不判 Fail）；「页面壳与配置保留」graph 特有断言=骨架四项（含图谱滤镜，chain 无此配置区）+ .industry-catalog-select + 产业回显 + 模式选中态不漂移（与 P0-17 差异点：graph 配置区多分析模式单选）+ URL 停配置态 + workspace=graph 不漂移。
  步骤②「点重试」译法：unroute 解除断链后点重试承载——POST 重新发出（拦截计数归零）→ view=processing + task_id 捕获 + graph 工作区指纹 analysis_fp=svc|graph| 在 URL（graph 专属佐证）+ 过程页「产业领域：新一代信息技术」上下文保留 + Network Error alert 清除。父单双分支口径：abort 仍挂→再现失败态（形态与 expect[1..2] 已验同构不重复断言）；abort 解除→可恢复（本条主断言）。
  「详情加载失败与统计失败子块文案 observed-执行时记录」（用例备注）：本环境失败发生在创建任务阶段（POST 被拒），详情/统计面板未创建（统计面板挂结果态 view=result，本条不进结果态——结果态判定归 P0-06/22 不吞并），无详情/统计失败子块文案可采；失败提示子块文案（Network Error/traceId）已随 run observed 落盘（P0-17 同款口径）。
  「本轮不判 Fail，开放项 3」（用例备注）：指失败态不可人工构造时本轮不判——本条经 route.abort 已稳定复现失败态（探针 aborted=1 可复现），故按预期断言实跑判 pass/fail；若现场对 abort 呈吞错/白屏形态（预期①断言红）则挂缺陷票 D3-SVCGRAPH-FAILURE-STATE-MISSING（防御票，探针实证未命中该形态）。
  user_id=guest 共享账号：本条三段操作（选产业/拦截点发起/恢复后重试）POST 拦截计数只读本条 context 内 route 命中，不与他端会话互扰；同指纹当日新建不受 D3-SVCGRAPH-SAME-DAY-REUSE-MISSING 影响（startAnalysis(false)→forceCreate 路径显式点击总创建，探针 retry POST 200 实证）。评审模式 alert 同屏不撞车（评审文案不含 Network Error/失败/异常/错误宽词，探针 error_like_nodes 实证两 alert 并存可 filter 区分）；本条不动评审开关（失败态链路与评审层无耦合）。对比篮可见才关。viewport 1920×1080@1（runner 默认+fixtures 口径）。列表 2 空格缩进。
