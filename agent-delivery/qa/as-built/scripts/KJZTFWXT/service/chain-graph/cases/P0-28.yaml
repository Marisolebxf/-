  - note: 步骤③+预期③（刷新保留）——刷新页面后过滤器勾选项保留：URL eco_nk/eco_et 参数值与刷新前逐字一致（URL query 为持久化主通道，clipSelection 读 query 优先）；两组 checkbox 勾选态与刷新前逐项一致（被取消项仍未选中、保持项仍选中）；统计面板规模行 N/E 与刷新前一致（同过滤态同数据重算稳定）；参数丢失或勾选态回全 → 红挂 D3-SVCGRAPH-FILTER-NOT-PERSISTED
    assert: |-
      const sizeOf = async () => {
        const t = (((await page.locator('strong[data-testid="svc-eco-visible-size"]').first().innerText().catch(() => '')) || '')).replace(/\s+/g, '');
        const m = /^(\d+)\/(\d+)$/.exec(t);
        if (!m) throw new Error('统计面板规模行不可解析: ' + t);
        return { N: +m[1], E: +m[2] };
      };
      const readGrp = async (sel) => {
        const boxes = page.locator(sel).first().locator('label.arco-checkbox');
        const n = await boxes.count();
        const items = [];
        for (let i = 0; i < n; i++) {
          const c = (await boxes.nth(i).getAttribute('class')) || '';
          const t = ((await boxes.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          items.push({ text: t, checked: /arco-checkbox-checked/.test(c) });
        }
        return items;
      };
      const before = {
        nk: ((/[?&]eco_nk=([^&]*)/.exec(page.url()) || [])[1]) || null,
        et: ((/[?&]eco_et=([^&]*)/.exec(page.url()) || [])[1]) || null,
      };
      const sizeBefore = await sizeOf();
      await page.reload({ waitUntil: 'domcontentloaded' });
      await page.waitForLoadState('networkidle', { timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(2500);
      const close = page.locator('button[aria-label="关闭对比篮"]');
      if (await close.count() && await close.first().isVisible().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {} }
      const u = page.url();
      const afterNk = ((/[?&]eco_nk=([^&]*)/.exec(u) || [])[1]) || null;
      const afterEt = ((/[?&]eco_et=([^&]*)/.exec(u) || [])[1]) || null;
      const errs = [];
      if (before.nk !== afterNk) errs.push('eco_nk 刷新后变化: ' + before.nk + ' → ' + afterNk);
      if (before.et !== afterEt) errs.push('eco_et 刷新后变化: ' + before.et + ' → ' + afterEt);
      const nodeAfter = await readGrp('[data-testid="svc-eco-clip-node-kinds"]');
      const edgeAfter = await readGrp('[data-testid="svc-eco-clip-edge-types"]');
      const cmp = (name, beforeItems, afterItems) => {
        if (!beforeItems) return;
        if (afterItems.length !== beforeItems.length) { errs.push(name + '勾选组刷新后项数变化: ' + beforeItems.length + '→' + afterItems.length); return; }
        for (let i = 0; i < beforeItems.length; i++) {
          if (beforeItems[i].checked !== afterItems[i].checked) errs.push(name + '第' + (i + 1) + '项「' + (afterItems[i].text || beforeItems[i].text) + '」勾选态刷新后变化: ' + beforeItems[i].checked + '→' + afterItems[i].checked);
        }
      };
      cmp('节点类型', globalThis.__p028NodeItemsAfter, nodeAfter);
      cmp('边类型', globalThis.__p028EdgeItemsAfter, edgeAfter);
      const sizeAfterReload = await sizeOf();
      if (sizeAfterReload.N !== sizeBefore.N || sizeAfterReload.E !== sizeBefore.E) errs.push('刷新后统计规模行漂移: ' + JSON.stringify(sizeBefore) + '→' + JSON.stringify(sizeAfterReload) + '（同过滤态应重算稳定）');
      if (errs.length) throw new Error('D3-SVCGRAPH-FILTER-NOT-PERSISTED: ' + errs.join('; '));
      console.log('[P0-28 observed] 刷新保留通过 eco_nk=' + afterNk + ' eco_et=' + afterEt + ' 两组勾选态逐项一致 规模行=' + JSON.stringify(sizeAfterReload));
