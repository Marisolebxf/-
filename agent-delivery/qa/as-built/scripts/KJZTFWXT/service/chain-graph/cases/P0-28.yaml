      } else {
        const first = eBoxes.nth(0);
        const firstTxt = ((await first.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        await first.click({ timeout: 6000 });
        await page.waitForTimeout(800);
        const cls = (await eBoxes.nth(0).getAttribute('class')) || '';
        if (/arco-checkbox-checked/.test(cls)) throw new Error('取消边类型「' + firstTxt + '」后勾选态未翻转（P2 跨 tick 后仍选中，过滤未生效）');
        const u = page.url();
        const mE = /[?&]eco_et=([^&]*)/.exec(u);
        if (!mE) throw new Error('D3-SVCGRAPH-FILTER-NOT-PERSISTED: 取消边类型后 URL 未出现 eco_et 参数（过滤状态不进 URL，刷新保留机制失效）: ' + u);
        const keptKeys = decodeURIComponent(mE[1]).split(',').filter(Boolean);
        if (keptKeys.length !== eCnt - 1) throw new Error('eco_et 项数异常: ' + keptKeys.length + '（应=组项数-1=' + (eCnt - 1) + '，值=' + mE[1] + '）');
        const bTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '');
        if (!/统计范围\s*=\s*当前过滤后的可见子网/.test(bTxt)) throw new Error('统计面板未注明统计范围（预期②声明文案「统计范围 = 当前过滤后的可见子网」缺失）');
        const sizeAfter = await sizeOf();
        if (sizeAfter.E > globalThis.__p028SizeBeforeEdge.E) throw new Error('取消一类边类型后关系边数反增: E ' + globalThis.__p028SizeBeforeEdge.E + '→' + sizeAfter.E + '（统计未随过滤重算或重算错误）');
        globalThis.__p028EdgeUnchecked = firstTxt;
        globalThis.__p028EtParam = decodeURIComponent(mE[1]);
        globalThis.__p028EdgeItemsAfter = await (async () => { const items = []; for (let i = 0; i < eCnt; i++) { const c = (await eBoxes.nth(i).getAttribute('class')) || ''; const t = ((await eBoxes.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim(); items.push({ text: t, checked: /arco-checkbox-checked/.test(c) }); } return items; })();
        console.log('[P0-28 observed] 取消边类型「' + firstTxt + '」 eco_et=' + mE[1] + ' 规模行 ' + JSON.stringify(globalThis.__p028SizeBeforeEdge) + '→' + JSON.stringify(sizeAfter) + ' 统计范围声明在屏');
      }
  - note: 步骤②+预期①（节点类型过滤）——取消一类节点类型后：过滤立即生效（checkbox 勾选态翻转 + URL 即时出现 eco_nk 参数且项数=组项数-1）；统计面板随过滤重算（规模行节点数 N 不增；不取严格减少——边类型先过滤可能已把该类节点 degree 归 0 移出子网，严格断言有连锁假红风险，记档）并注明统计范围；组内仅 1 项时如实跳过记 observed（同步骤①回落设计）；eco_nk 不进 URL → 红挂 D3-SVCGRAPH-FILTER-NOT-PERSISTED
