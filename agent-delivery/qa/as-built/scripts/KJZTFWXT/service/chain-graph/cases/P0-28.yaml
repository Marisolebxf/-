      await expect(page.getByText('服务生态关系图谱').first()).toBeVisible({ timeout: 8000 });
      const filters = page.locator('[data-testid="svc-eco-clip-filters"]').first();
      if (!(await filters.count())) throw new Error('D3-SVCGRAPH-FILTER-MISSING: 结果态无过滤区容器（svc-eco-clip-filters；画布非空结果态仍缺=结构性缺失）');
      await expect(filters).toBeVisible({ timeout: 6000 });
      const nGrp = filters.locator('[data-testid="svc-eco-clip-node-kinds"]').first();
      const eGrp = filters.locator('[data-testid="svc-eco-clip-edge-types"]').first();
      if (!(await nGrp.count()) || !(await eGrp.count())) throw new Error('D3-SVCGRAPH-FILTER-MISSING: 过滤区缺节点类型/边类型勾选组（svc-eco-clip-node-kinds / svc-eco-clip-edge-types）');
      const readGrp = async (g) => {
        const boxes = g.locator('label.arco-checkbox');
        const n = await boxes.count();
        const items = [];
        for (let i = 0; i < n; i++) {
          const el = boxes.nth(i);
          const cls = (await el.getAttribute('class')) || '';
          const txt = ((await el.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          items.push({ text: txt, checked: /arco-checkbox-checked/.test(cls) });
        }
        return items;
      };
      globalThis.__p028NodeItems = await readGrp(nGrp);
      globalThis.__p028EdgeItems = await readGrp(eGrp);
      if (!(globalThis.__p028EdgeItems.length && globalThis.__p028NodeItems.length)) throw new Error('过滤勾选组渲染但组内 0 项（presentEdges/presentKinds 空，与画布非空前提矛盾）');
      const u0 = page.url();
      if (/[?&]eco_nk=/.test(u0) || /[?&]eco_et=/.test(u0)) throw new Error('初始态 URL 已带 eco_nk/eco_et 过滤参数（应全选清参）: ' + u0);
      for (const it of [...globalThis.__p028NodeItems, ...globalThis.__p028EdgeItems]) {
        if (!it.checked) throw new Error('初始态存在未勾选项「' + it.text + '」（默认应全类型展示）');
