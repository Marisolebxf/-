id: P0-22
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00723
priority: P0
tier: B
title: 变更条件重析——变更产业集群后显式「开始分析」按新条件重算，旧任务/旧产业数据零残留（变更只更新草稿不自动起任务，与 00710/00711 互证）
story: US-SVC-ECO-03
entry_id: svc-chain-graph
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - env-gate overall=pass；fresh 起任务链路通（P0-19/_probe-p019b 实证 POST 200 → ~1s 完成停过程页引导态「分析结果已生成」→「查看结果」进结果态）
  - 本条改集群重析属不同指纹（analysis_fp=svc|graph|{industryId} 随产业变化，新一代信息技术 INB1701 → 新能源新 ID），不受 D3-SVCGRAPH-SAME-DAY-REUSE-MISSING（同指纹当日复用缺失）影响——改指纹再发起为合法新建
  - 结果画布 hang 空（ENV-SVCGRAPH-HANG-EMPTY-001 仍挂）→ 结果态断言走双分支：有据验新任务重算渲染；无据验诚实空态 + 旧 task_id/旧产业零残留（URL/正文/画布），不造伪数据不盲 skip
  - 本环境 user_id=guest 共享账号，并行会话可能同时起任务；本条断言锚定本会话 POST 计数与本会话 task_id，免疫他端噪声
locators:
  cluster_select: .industry-catalog-select（P7 点可见 view 容器，选项挂 .arco-trigger-popup:visible；改选「新能源」须排除「智能网联新能源汽车」误匹配——hasNotText 汽车）
  mode_radio_2: 图谱滤镜「② 机构+关联主体」（.arco-radio，选中 .arco-radio-checked；draft 返回配置后实测保留）
  start_btn: 按钮「开始分析」（getByRole exact，避开粘性提示「再点击开始分析」）
  view_result_btn: 过程页引导态「查看结果」（getByRole exact）
  back_btn: 结果态「返回配置重新分析」
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
    note: 自含重置进 graph 配置态（P8）
  - action: evaluate
    target: expect 内自含：首发（新一代信息技术+模式②）→ 查看结果进结果态（用例前置「结果态可见」）→ 返回配置改选「新能源」（应只更新草稿 0 POST）→ 显式重析（新指纹合法新建、过程页按新条件重算）→ 查看结果验新结果态与零残留；POST 计数 = expect[0] 内 page.on('request') Node 侧监听（globalThis 跨导航存活，精确匹配 POST /topicAsync/topic/v1/analysis/tasks，排除 tasks/list）
expect:
  - note: 前置「已完成一次有效分析、结果态可见」——fresh 首发（新一代信息技术+模式②）停过程页引导态后「查看结果」落首发结果态（服务生态关系图谱壳 + 返回配置重新分析按钮 + URL task_id=首发任务）
    assert: |-
      await page.waitForTimeout(1500);
      globalThis.__p022Posts=[];
      page.on('request', (r)=>{ if (r.method()==='POST' && /\/topicAsync\/topic\/v1\/analysis\/tasks\/?(\?|$)/.test(r.url())) globalThis.__p022Posts.push(r.url().slice(0,120)); });
      const close0=page.locator('button[aria-label="关闭对比篮"]');
      if (await close0.count() && await close0.first().isVisible().catch(()=>false)) { try { await close0.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      const sel=page.locator('.industry-catalog-select').first();
      await sel.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await page.getByText('② 机构+关联主体', { exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const radio1=page.locator('main .arco-radio.arco-radio-checked').first();
      if (!/②/.test((await radio1.innerText().catch(()=>''))||'')) throw new Error('模式②未选中');
      const start=page.getByRole('button', { name: '开始分析', exact: true }).first();
      if (!(await start.isEnabled())) throw new Error('合法条件后开始分析不可点');
      await start.click({ timeout: 8000 });
      await page.waitForURL((u)=>String(u).includes('view=processing'), { timeout: 15000 });
      let body='';
      for (let i=0;i<10;i++) { body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body)) break; await page.waitForTimeout(1000) }
      if (!/分析结果已生成/.test(body)) throw new Error('首发未停过程页完成引导态: '+page.url());
      const mA=/task_id=(SVC-[0-9-]+)/.exec(page.url());
      if (!mA) throw new Error('未捕获首发任务 ID: '+page.url());
      globalThis.__p022TaskA=mA[1];
      if ((globalThis.__p022Posts||[]).length<1) throw new Error('首发 POST 未捕获（计数='+((globalThis.__p022Posts||[]).length)+'）');
      const vr=page.getByRole('button', { name: '查看结果', exact: true }).first();
      await vr.click({ timeout: 8000 });
      await page.waitForTimeout(2200);
      const u0=page.url();
      if (!/view=result/.test(u0)) throw new Error('查看结果后未落结果态: '+u0);
      if (!u0.includes(globalThis.__p022TaskA)) throw new Error('首发结果态 task_id 异常: '+u0);
      const b0=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (!/服务生态关系图谱/.test(b0)) throw new Error('结果壳标题缺失（前置「结果态可见」未达成）');
      if (!/返回配置重新分析/.test(b0)) throw new Error('结果态「返回配置重新分析」按钮缺失');
  - note: 变更产业集群（新一代信息技术→新能源）只更新草稿不自动起任务——回显「新能源」、URL 不进 view=processing/result、任务创建 POST 增量 0（与 00710/00711「变更不自动触发」互证）
    assert: |-
      const back=page.getByRole('button', { name: /返回配置重新分析|返回配置/ }).first();
      await back.click({ timeout: 8000 });
      await page.waitForTimeout(2000);
      const close1=page.locator('button[aria-label="关闭对比篮"]');
      if (await close1.count() && await close1.first().isVisible().catch(()=>false)) { try { await close1.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      const u1=page.url();
      if (/view=processing|view=result/.test(u1)) throw new Error('返回配置后仍在任务/结果态: '+u1);
      const b1=((await page.locator('main').first().innerText().catch(()=>''))||'');
      if (!/分析配置/.test(b1)) throw new Error('配置区缺失（变更条件前置失败）');
      const postsBefore=(globalThis.__p022Posts||[]).length;
      const sel=page.locator('.industry-catalog-select').first();
      await sel.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option').filter({ hasText: '新能源' }).filter({ hasNotText: '汽车' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const selVal=(((await page.locator('.industry-catalog-select .arco-select-view-value').first().innerText().catch(()=>''))||'')).trim().replace(/\s+/g,'');
      if (selVal!=='新能源') throw new Error('变更后选择器未回显「新能源」: '+selVal);
      const u2=page.url();
      if (/view=processing|view=result/.test(u2)) throw new Error('变更条件即自动进过程/结果态（应只更新草稿）: '+u2);
      const delta=(globalThis.__p022Posts||[]).length-postsBefore;
      if (delta!==0) throw new Error('变更条件自动起任务 POST ×'+delta+'（应 0 次，只更新草稿；与 00710/00711 互证）');
      globalThis.__p022UrlAfterChange=u2;
  - note: 显式「开始分析」等完成——不同指纹合法新建（新 task_id ≠ 首发）、URL 不残留旧产业指纹 INB1701、过程页分析对象按新条件重算（产业领域：新能源）且旧条件/旧任务零残留；全程任务创建 POST 恰 2 次（首发+重析，变更阶段 0 次）
    assert: |-
      const start=page.getByRole('button', { name: '开始分析', exact: true }).first();
      if (!(await start.isEnabled())) throw new Error('变更条件后开始分析不可点（前置失败）');
      await start.click({ timeout: 8000 });
      await page.waitForURL((u)=>String(u).includes('view=processing'), { timeout: 15000 });
      let body='';
      for (let i=0;i<10;i++) { body=((await page.locator('main').first().innerText().catch(()=>''))||''); if (/分析结果已生成/.test(body)) break; await page.waitForTimeout(1000) }
      if (!/分析结果已生成/.test(body)) throw new Error('重析未停过程页完成引导态: '+page.url());
      const mB=/task_id=(SVC-[0-9-]+)/.exec(page.url());
      if (!mB) throw new Error('未捕获重析任务 ID: '+page.url());
      globalThis.__p022TaskB=mB[1];
      const errs=[];
      if (mB[1]===String(globalThis.__p022TaskA||'')) errs.push('重析落点仍为旧任务 '+mB[1]+'（改产业集群=不同指纹应合法新建）');
      if (/INB1701/.test(page.url())) errs.push('重析 URL 残留旧产业指纹 INB1701: '+page.url());
      if (!/产业领域：新能源/.test(body)) errs.push('过程页未见「产业领域：新能源」分析对象（未按新条件重算）');
      if (/产业领域：新一代信息技术/.test(body)) errs.push('过程页残留旧条件「产业领域：新一代信息技术」');
      if (String(globalThis.__p022TaskA||'') && body.includes(String(globalThis.__p022TaskA))) errs.push('过程页残留旧任务 ID '+globalThis.__p022TaskA);
      if ((globalThis.__p022Posts||[]).length!==2) errs.push('任务创建 POST 总数='+((globalThis.__p022Posts||[]).length)+'，应恰 2（首发+重析两次显式发起，变更阶段 0）');
      if (errs.length) throw new Error(errs.join('; '));
  - note: 新结果态按新条件重算且上一条件数据不残留——「查看结果」落重析任务结果壳（task_id=新任务）；画布双分支：有据→四类关系图例+统计区呈现（重算出新图）；无据（hang 空环境债）→诚实空态文案在屏；两分支共守：URL/正文零残留旧 task_id、零残留旧产业指纹 INB1701 与「产业领域：新一代信息技术」，不造伪数据
    assert: |-
      const vr=page.getByRole('button', { name: '查看结果', exact: true }).first();
      await vr.click({ timeout: 8000 });
      await page.waitForTimeout(2600);
      const close3=page.locator('button[aria-label="关闭对比篮"]');
      if (await close3.count() && await close3.first().isVisible().catch(()=>false)) { try { await close3.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }
      const u=page.url();
      const b=((await page.locator('main').first().innerText().catch(()=>''))||'');
      const errs=[];
      if (!/view=result/.test(u)) errs.push('未落结果态: '+u);
      if (globalThis.__p022TaskB && !u.includes(String(globalThis.__p022TaskB))) errs.push('结果态 task_id 非重析任务 '+globalThis.__p022TaskB+': '+u);
      if (!/服务生态关系图谱/.test(b)) errs.push('结果壳标题缺失');
      if (!/返回配置重新分析/.test(b)) errs.push('结果态「返回配置重新分析」按钮缺失');
      if (String(globalThis.__p022TaskA||'') && u.includes(String(globalThis.__p022TaskA))) errs.push('结果态 URL 残留旧任务 '+globalThis.__p022TaskA);
      if (/INB1701/.test(u)) errs.push('结果态 URL 残留旧产业指纹 INB1701');
      if (String(globalThis.__p022TaskA||'') && b.includes(String(globalThis.__p022TaskA))) errs.push('结果态正文残留旧任务 '+globalThis.__p022TaskA);
      if (/产业领域：新一代信息技术/.test(b)) errs.push('结果态正文残留旧条件「产业领域：新一代信息技术」');
      if (errs.length) throw new Error(errs.join('; '));
      const legend=page.getByText('投资', { exact: true }).first();
      const hasData=await legend.isVisible().catch(()=>false);
      if (hasData) {
        for (const w of ['合作','竞争','人才流动']) { await expect(page.getByText(w, { exact: true }).first()).toBeVisible({ timeout: 4000 }); }
        await expect(page.getByText(/网络统计|规模与密度/).first()).toBeVisible({ timeout: 4000 });
        globalThis.__p022Branch='data';
      } else {
        const honest=/无可见点边|子网过小|不计算统计值|无服务机构|不输出影响力评分/;
        if (!honest.test(b)) throw new Error('画布无数据且未见诚实空态文案（hang 空/统计空应诚实说明，不造伪数据）: '+b.slice(0,200));
        globalThis.__p022Branch='honest_empty';
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类；若「新能源」组合起任务异常（POST 非 200/过程页报错，非本条断言红），先核对 toast 与响应码，属环境组合问题则记 observed 并按父单口径换「新材料」做一次诚实重试
as_built_note: |-
  D1 as-built 口径差 + 双分支执行口径（无独立缺陷票；结果画布受 ENV-SVCGRAPH-HANG-EMPTY-001 约束走诚实空分支）。用例 00723 前置/步骤/预期 vs 现场口径：
  ① 前置「已完成一次有效分析、结果态可见」——expect[0] fresh 构造（新一代信息技术+模式②，P0-19/_probe-p019b 同款链路 POST 200 → ~1s 完成停引导态「分析结果已生成」）后显式「查看结果」落首发结果态（服务生态关系图谱壳），不依赖历史种子。
  ② 步骤「变更产业集群或分析模式」——取变更产业集群分支（新一代信息技术→新能源）：改指纹后 analysis_fp=svc|graph|{新产业ID} 变化，「开始分析」为合法新建，不受 D3-SVCGRAPH-SAME-DAY-REUSE-MISSING（同指纹当日复用缺失）影响；下拉点选用 hasNotText「汽车」排除「智能网联新能源汽车」误匹配（15 项含两者，P7 点可见 view 容器）。「变更只更新草稿不自动起任务」= 用例备注与 00710/00711 互证点：expect[1] 断言改选后 URL 不进 view=processing/result + 任务创建 POST 增量 0（draft=1 态实测保留产业/模式，_probe-p019b s3）。
  ③ 预期「图谱与统计数据按新条件重算」——过程侧强证据：重析过程页「分析对象 产业领域：新能源」且不残留「产业领域：新一代信息技术」（_probe-p019c 实证过程页分析对象行结构同构）；重析 URL industry/analysis_fp 为新产业（不残留 INB1701）。结果侧双分支：有据（四类关系图例可见）→ 断言图例+统计区重算呈现；无据（ENV-SVCGRAPH-HANG-EMPTY-001 hang 空，当前环境大概率）→ 断言诚实空态文案（无可见点边/子网过小/不计算统计值/无服务机构/不输出影响力评分任一）在屏，不造伪数据不盲 skip。
  ④ 预期「上一条件的数据不残留」——三重 absent 断言：URL 与正文零残留首发 task_id（含查看结果后结果态复检）；URL 零残留 INB1701（industry= 与 analysis_fp= 同查）；正文零残留「产业领域：新一代信息技术」。分析记录列表中旧任务行属历史记录语义（00725），不作残留判定。
  执行口径：全部动作自含 expect[0..3] assert（runner 顺序求值共享同一 page）；POST 监听 = expect[0] 内 page.on('request') Node 侧 globalThis 数组跨 expect 存活，精确匹配尾段 /analysis/tasks 排除 tasks/list，恰 2 次（首发+重析）。task_id/新产业 ID 每轮 fresh 变化不钉死硬期望，命中现场记 observed（expect[1] 落 __p022UrlAfterChange、expect[3] 落 __p022Branch）。对比篮浮层遮挡按 P0-19/20/21 同款先关；本条不动评审开关（重析链路与评审无耦合）。共享账号 guest 若遇非本条瞬时异常按父单加一次诚实重试并记 observed。viewport 1920×1080@1（runner 默认+fixtures 口径）。列表 2 空格缩进。
