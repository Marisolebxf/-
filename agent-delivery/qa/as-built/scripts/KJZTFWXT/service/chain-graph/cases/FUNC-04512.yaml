id: FUNC-04512
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-04512
priority: P1
tier: B
title: 备选-页签往返保留条件
entry_id: svc-chain-graph
preconditions: []
locators: {}
steps:
  - action: goto
    target: /service/chain-analysis?workspace=graph&tab=graph
  - action: evaluate
    target: |-
      const cfg = page.locator('[data-testid="svc-eco-analysis-config"]');
      await cfg.waitFor({ state: 'visible', timeout: 15000 });
      await cfg.locator('.arco-cascader-view').click();
      await page.locator('.arco-cascader-popup:visible').locator('.arco-cascader-option-label').filter({ hasText: /^新一代信息技术/ }).first().click({ timeout: 15000 });
  - action: evaluate
    target: |-
      const shell = page.locator('[data-testid="svc-eco-analysis-shell"]');
      await shell.getByRole('tab', { name: '分析记录' }).click({ timeout: 15000 });
      await page.waitForURL(/tab=records/, { timeout: 15000 });
  - action: evaluate
    target: |-
      const shell = page.locator('[data-testid="svc-eco-analysis-shell"]');
      await shell.getByRole('tab', { name: '服务链图谱分析' }).click({ timeout: 15000 });
      await page.waitForURL(/tab=graph/, { timeout: 15000 });
expect:
  - note: 回到分析配置
    assert: |-
      const cfg = page.locator('[data-testid="svc-eco-analysis-config"]');
      await expect(cfg).toBeVisible({ timeout: 15000 });
      await expect(cfg.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 15000 });
  - note: 产业领域仍为「新一代信息技术」
    assert: |-
      await expect(page.locator('main [data-testid="svc-eco-analysis-context"] .svc-eco-context__industry')).toContainText('新一代信息技术', { timeout: 15000 });
  - note: 未进入过程页
    assert: |-
      await expect(page.locator('main').getByText('可视化分析过程')).toHaveCount(0);
      await expect(page.locator('main').getByText('生成中')).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
