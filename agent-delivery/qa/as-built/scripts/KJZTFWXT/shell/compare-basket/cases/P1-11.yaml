id: P1-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00507
priority: P1
title: 画像 Drawer 查看对比篮先关 Drawer 再展开浮层
story: US-ENT-CMP-07
entry_id: shell-compare-basket
preconditions:
- 画像快览 Drawer 含查看对比篮
locators:
  drawer: .arco-drawer
  view_basket: 查看对比篮
steps:
- action: goto
  target: /enterprise/search
- action: click
  target: 打开画像 Drawer → 查看对比篮
expect:
- note: Drawer 先完成关闭
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(1000); const portrait = page.getByRole('button', { name: /查看画像|企业画像/ }).first(); if (!(await portrait.count())) throw new Error('无画像入口'); await portrait.click({ timeout: 8000 }); await expect(page.locator('.arco-drawer:visible').first()).toBeVisible({ timeout: 8000 }); const vb = page.locator('.arco-drawer:visible').getByRole('button', { name: /查看对比篮|打开对比篮/ }); if (!(await vb.count())) throw new Error('Drawer 内无查看对比篮'); await vb.first().click({ timeout: 8000 }); await page.waitForTimeout(1000); const drawerStill = await page.locator('.arco-drawer:visible').count(); if (drawerStill) throw new Error('Drawer 未先关闭')
- note: 随后系统浮层展开且二者不叠加
  assert: |-
    await expect(page.locator('.system-compare-panel')).toBeVisible({ timeout: 8000 }); if (await page.locator('.arco-drawer:visible').count()) throw new Error('Drawer 与对比篮叠加')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: Drawer 无查看对比篮入口时 Pass-N/A（observed）
tier: B
