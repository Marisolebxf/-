id: P0-15
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00495
priority: P0
title: 空篮仅显示来源说明与去企业查询主操作
story: US-ENT-CMP-05
entry_id: shell-compare-basket
preconditions:
- 篮内为空（清空或新会话）
locators:
  empty_cta: 去企业查询
steps:
- action: goto
  target: /enterprise/search
- action: click
  target: 打开对比篮；若非空则清空确认
- action: evaluate
  note: 核对空态 CTA 与来源说明、无推荐列表
expect:
- note: 空态主操作为「去企业查询」
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); const panel = page.locator('.system-compare-panel'); await expect(panel).toBeVisible({ timeout: 8000 }); if (await panel.locator('.ent-compare-item-card').count()) { await panel.getByRole('button', { name: '清空对比篮' }).click({ timeout: 8000 }); const m = page.locator('.arco-modal:visible'); await m.getByRole('button', { name: /确定|确认|清空/ }).last().click({ timeout: 8000 }).catch(async () => { await m.locator('button.arco-btn-primary').last().click({ timeout: 8000 }) }); await page.waitForTimeout(1000) } await expect(panel.getByRole('button', { name: /去企业查询/ }).or(panel.getByText('去企业查询')).first()).toBeVisible({ timeout: 8000 })
- note: 空态含来源说明
  assert: |-
    const panel = page.locator('.system-compare-panel'); const txt = await panel.innerText(); if (!/(企业查询|重点企业|总览|画像|加入)/.test(txt)) throw new Error('空态未见来源说明类文案')
- note: 无推荐企业列表
  assert: |-
    const panel = page.locator('.system-compare-panel'); if (await panel.locator('.ent-compare-item-card').count()) throw new Error('空态仍有企业卡片')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 清空会改会话数据；执行后可再加回企业。来源说明措辞 observed。
tier: B
