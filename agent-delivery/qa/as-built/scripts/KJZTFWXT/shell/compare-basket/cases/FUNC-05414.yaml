id: FUNC-05414
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05414
priority: P0
title: 企业行点移除后从篮内消失
story: US-ENT-CMP-02
entry_id: shell-compare-basket
tier: A
preconditions:
  - 对比篮已打开
  - 企业页至少 1 家
locators:
  panel: .system-compare-panel
  enterprise_tab: '#compare-basket-tab-enterprise'
  card: .ent-compare-item-card
  remove: button[aria-label="移除"]
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
  - action: evaluate
    note: 点企业行「移除」；行消失、计数与提示在 expect 判定
expect:
  - note: 前置开篮并点「移除」；无二次确认弹框
    assert: |-
      const hostPath = '/enterprise/search';
      if (!page.url().includes(hostPath)) throw new Error('未在宿主页: ' + page.url());
      const parseEntCount = (text) => {
        const m = (text || '').replace(/\s+/g, ' ').match(/企业[^\d]*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : null;
      };
      const openPanel = async () => {
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) return panel;
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (await dock.count()) await dock.first().click({ timeout: 10000 });
        else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 10000 });
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      const seedFromAddModal = async (panel) => {
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        const modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        let joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        if (!(await joinBtns.count())) {
          const search = modal.getByPlaceholder(/企业名称|搜索/).first();
          if (await search.count()) {
            await search.fill('科技');
            await page.waitForTimeout(400);
            const go = modal.getByRole('button', { name: /搜索|查询/ }).first();
            if (await go.count()) await go.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1200);
          }
          joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        }
        if (!(await joinBtns.count())) throw new Error('ENV-SHELL-COMPARE-ADD-MODAL-001：新增弹层无「加入对比篮」');
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const close = modal.getByRole('button', { name: '取消' }).first();
        if (await close.count()) await close.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      };
      const seedFromEnterpriseSearch = async () => {
        const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
        await page.goto(origin + '/enterprise/enterprise-search', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        const clearBtn = page.locator('.enterprise-search-history-row button').filter({ hasText: '清空' }).first();
        if (await clearBtn.isVisible().catch(() => false)) {
          await clearBtn.click({ timeout: 4000 }).catch(() => {});
          await page.waitForTimeout(500);
        }
        const main = page.locator('main');
        const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
        if (await recSection.count()) {
          const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({
            has: page.getByRole('button', { name: '查看画像', exact: true }),
          });
          for (let i = 0; i < await cards.count(); i++) {
            const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
            if (await btn.count() && (await btn.isVisible().catch(() => false))) {
              await btn.click({ timeout: 8000 });
              await page.waitForTimeout(700);
              break;
            }
          }
        }
        await page.goto(origin + hostPath, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      };
      let panel = await openPanel();
      let entTab = panel.locator('#compare-basket-tab-enterprise');
      await entTab.click({ timeout: 5000 }).catch(() => {});
      await page.waitForTimeout(400);
      let cards = panel.locator('.ent-compare-item-card');
      let n = await cards.count();
      if (n < 1) {
        await seedFromAddModal(panel).catch(() => {});
        n = await panel.locator('.ent-compare-item-card').count();
      }
      if (n < 1) {
        await seedFromEnterpriseSearch();
        panel = await openPanel();
        entTab = panel.locator('#compare-basket-tab-enterprise');
        await entTab.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
        n = await panel.locator('.ent-compare-item-card').count();
      }
      if (n < 1) throw new Error('ENV-SHELL-COMPARE-BASKET-EMPTY-001：无法满足企业页至少 1 家');
      const countBefore = parseEntCount(await entTab.innerText());
      const firstCard = panel.locator('.ent-compare-item-card').first();
      const nameEl = firstCard.locator('.ent-compare-item-card__name');
      const targetName = (await nameEl.count())
        ? (await nameEl.first().innerText()).trim()
        : ((await firstCard.innerText()) || '').split('\n')[0].trim();
      if (!targetName) throw new Error('无法读取待移除企业名');
      const removeBtn = firstCard.getByRole('button', { name: '移除', exact: true });
      await expect(removeBtn).toBeVisible({ timeout: 8000 });
      globalThis.__func05414 = { targetName, countBefore, beforeLen: n };
      await removeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const confirmModals = page.locator('.arco-modal:visible').filter({
        has: page.getByRole('button', { name: '确定', exact: true }),
      });
      for (let i = 0; i < (await confirmModals.count()); i++) {
        const m = confirmModals.nth(i);
        if (!(await m.isVisible().catch(() => false))) continue;
        const t = (await m.innerText()).replace(/\s+/g, ' ');
        if (/确认|是否|清空/.test(t)) {
          throw new Error('企业行移除不应出现二次确认弹框：' + t.slice(0, 120));
        }
      }
  - note: 该企业行从列表消失；企业页签计数减 1
    assert: |-
      const st = globalThis.__func05414 || {};
      if (!st.targetName) throw new Error('前置：未完成移除点击');
      const panel = page.locator('.system-compare-panel');
      const entTab = panel.locator('#compare-basket-tab-enterprise');
      const parseEntCount = (text) => {
        const m = (text || '').replace(/\s+/g, ' ').match(/企业[^\d]*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : null;
      };
      const listNames = async () => {
        const names = [];
        const cards = panel.locator('.ent-compare-item-card');
        for (let i = 0; i < (await cards.count()); i++) {
          const card = cards.nth(i);
          if (!(await card.isVisible().catch(() => false))) continue;
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        return names;
      };
      const afterNames = await listNames();
      const stillThere = afterNames.some((n) => n.includes(st.targetName) || st.targetName.includes(n));
      if (stillThere) throw new Error('移除后企业行仍在列表：' + st.targetName);
      if (typeof st.beforeLen === 'number' && afterNames.length >= st.beforeLen) {
        throw new Error(`列表条数应减 1：前 ${st.beforeLen} 后 ${afterNames.length}`);
      }
      const countAfter = parseEntCount(await entTab.innerText());
      if (typeof st.countBefore === 'number' && countAfter !== null && countAfter !== st.countBefore - 1) {
        throw new Error(`企业页签计数应减 1：前 ${st.countBefore} 后 ${countAfter}`);
      }
  - note: 提示「已移出对比篮」
    assert: |-
      await expect(page.locator('.arco-message-content').filter({ hasText: '已移出对比篮' }).first()).toBeVisible({
        timeout: 10000,
      });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: catalog=app-shell#system-compare-basket；goto /enterprise/search。系统对比篮企业 Tab 行内「移除」无确认框（与 05390 行按钮可见性分开）。机检=行消失+企业 N/50−1+Message「已移出对比篮」。空篮经「新增→加入对比篮」或 enterprise-search 推荐卡入篮（改会话数据）。
