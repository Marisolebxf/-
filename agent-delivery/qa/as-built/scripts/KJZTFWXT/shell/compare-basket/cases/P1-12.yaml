- note: 不显示为空篮
  assert: 'true'
- note: 重试后篮内容恢复
  assert: 'true'
allow_skip: 无法稳定模拟断网/424 时 Pass-N/A（实勘宿主页曾见 424+重试，属宿主非篮恢复）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 断链降级依赖网络模拟；本轮不强制机检。
tier: B
