id: FUNC-05417
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05417
priority: P0
title: 新增弹窗里移出后按钮回到加入
story: US-ENT-CMP-01
entry_id: shell-compare-basket
tier: A
preconditions:
  - 对比篮已打开
  - 新增列表里有一行已是「移出对比篮」
locators:
  panel: .system-compare-panel
  add_modal: '[data-testid="compare-basket-add-modal"]'
  enterprise_tab: '#compare-basket-tab-enterprise'
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
  - action: evaluate
    note: 用例步骤 1–2（点「新增」→点「移出对比篮」）在 expect 内执行
expect:
  - note: 前置：对比篮已打开且新增弹层存在「移出对比篮」行
    assert: |-
      const hostPath = '/enterprise/search';
      if (!page.url().includes(hostPath)) throw new Error('未在宿主页: ' + page.url());
      const parseEntCount = (text) => {
        const m = (text || '').replace(/\s+/g, ' ').match(/企业[^\d]*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : null;
      };
      const openPanel = async () => {
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) return panel;
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (await dock.count()) await dock.first().click({ timeout: 10000 });
        else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 10000 });
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      const openAddModal = async (panel) => {
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        let modal = page.locator('[data-testid="compare-basket-add-modal"]');
        if (!(await modal.count())) modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        return modal;
      };
      const ensureRemoveRow = async (modal) => {
        let removeBtns = modal.getByRole('button', { name: '移出对比篮', exact: true });
        if (await removeBtns.count()) return removeBtns.first();
        let joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        if (!(await joinBtns.count())) {
          const search = modal.getByPlaceholder(/企业名称|输入企业名称/).first();
          if (await search.count()) {
            await search.fill('科技');
            await page.waitForTimeout(500);
          }
          await page.waitForTimeout(1200);
          joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        }
        if (!(await joinBtns.count())) throw new Error('ENV-SHELL-COMPARE-ADD-REMOVE-001：新增弹层无可用行');
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(600);
        removeBtns = modal.getByRole('button', { name: '移出对比篮', exact: true });
        if (!(await removeBtns.count())) throw new Error('加入后仍无「移出对比篮」行');
        return removeBtns.first();
      };
      const panel = await openPanel();
      const entTab = panel.locator('#compare-basket-tab-enterprise');
      await entTab.click({ timeout: 5000 }).catch(() => {});
      await page.waitForTimeout(300);
      const modal = await openAddModal(panel);
      await ensureRemoveRow(modal);
      const beforeTab = parseEntCount(await entTab.innerText());
      const beforeCards = await panel.locator('.ent-compare-item-card').count();
      const before = beforeTab != null ? beforeTab : beforeCards;
      await page.evaluate((n) => sessionStorage.setItem('qa_func05417_entBefore', String(n)), before);
      const removeBtn = modal.getByRole('button', { name: '移出对比篮', exact: true }).first();
      const row = removeBtn.locator('xpath=ancestor::*[contains(@class,"arco-list-item") or contains(@class,"grid")][1]').first();
      let rowJoin = row.getByRole('button', { name: '加入对比篮', exact: true });
      if (!(await rowJoin.count())) rowJoin = modal.getByRole('button', { name: '加入对比篮', exact: true });
      globalThis.__func05417 = { removeBtn, rowJoinHint: rowJoin };
      await page.evaluate(() => sessionStorage.setItem('qa_func05417_modalReady', '1'));
  - note: 点击「移出对比篮」后该行按钮回到「加入对比篮」
    assert: |-
      if (await page.evaluate(() => sessionStorage.getItem('qa_func05417_modalReady')) !== '1') {
        throw new Error('前置：新增弹层未就绪');
      }
      let modal = page.locator('[data-testid="compare-basket-add-modal"]');
      if (!(await modal.isVisible().catch(() => false))) {
        const panel = page.locator('.system-compare-panel');
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        modal = page.locator('[data-testid="compare-basket-add-modal"]');
        if (!(await modal.count())) modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
      }
      let removeBtn = modal.getByRole('button', { name: '移出对比篮', exact: true }).first();
      if (!(await removeBtn.count())) {
        const join = modal.getByRole('button', { name: '加入对比篮', exact: true }).first();
        if (!(await join.count())) throw new Error('无「移出对比篮」可点行');
        await join.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        removeBtn = modal.getByRole('button', { name: '移出对比篮', exact: true }).first();
      }
      const panel2 = page.locator('.system-compare-panel');
      const entTab2 = panel2.locator('#compare-basket-tab-enterprise');
      const parseEntCount2 = (text) => {
        const m = (text || '').replace(/\s+/g, ' ').match(/企业[^\d]*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : null;
      };
      const tabBefore = parseEntCount2(await entTab2.innerText());
      const cardsBefore = await panel2.locator('.ent-compare-item-card').count();
      const entBeforeClick = tabBefore != null ? tabBefore : cardsBefore;
      await page.evaluate((n) => sessionStorage.setItem('qa_func05417_entBefore', String(n)), entBeforeClick);
      const removeBefore = await modal.getByRole('button', { name: '移出对比篮', exact: true }).count();
      await removeBtn.scrollIntoViewIfNeeded();
      await removeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      let removeAfter = await modal.getByRole('button', { name: '移出对比篮', exact: true }).count();
      if (removeAfter >= removeBefore) {
        await page.waitForTimeout(800);
        removeAfter = await modal.getByRole('button', { name: '移出对比篮', exact: true }).count();
      }
      if (removeAfter >= removeBefore) {
        throw new Error('点击后「移出对比篮」未减少: before=' + removeBefore + ' after=' + removeAfter);
      }
      const joinAfter = await modal.getByRole('button', { name: '加入对比篮', exact: true }).count();
      if (joinAfter < 1) throw new Error('移出后弹层无「加入对比篮」');
      await page.evaluate(() => sessionStorage.setItem('qa_func05417_clicked', '1'));
  - note: 提示已移出该企业
    assert: |-
      if (await page.evaluate(() => sessionStorage.getItem('qa_func05417_clicked')) !== '1') throw new Error('未执行移出点击');
      const msg = page.locator('.arco-message');
      if (await msg.filter({ hasText: /已移出/ }).count()) return;
      const body = await page.locator('body').innerText();
      if (!/已移出/.test(body)) throw new Error('未见「已移出」提示');
  - note: 企业页签计数减少
    assert: |-
      if (await page.evaluate(() => sessionStorage.getItem('qa_func05417_clicked')) !== '1') throw new Error('未执行移出点击');
      const before = parseInt(await page.evaluate(() => sessionStorage.getItem('qa_func05417_entBefore') || ''), 10);
      if (Number.isNaN(before)) throw new Error('缺少前置计数 sessionStorage');
      const panel = page.locator('.system-compare-panel');
      const entTab = panel.locator('#compare-basket-tab-enterprise');
      const txt = ((await entTab.innerText()) || '').replace(/\s+/g, ' ');
      const m = txt.match(/企业[^\d]*(\d+)\s*\/\s*50/);
      const afterTab = m ? parseInt(m[1], 10) : null;
      const afterCards = await panel.locator('.ent-compare-item-card').count();
      const after = afterTab != null ? afterTab : afterCards;
      if (after >= before) throw new Error('企业计数未减少: before=' + before + ' after=' + after + ' tab=' + txt);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: catalog=app-shell#system-compare-basket；goto /enterprise/search。新增弹层 data-testid=compare-basket-add-modal；行按钮「移出对比篮」→「加入对比篮」；成功提示 implementation「已移出「企业名」」≈用例「已移出该企业」。与 05392 对称；无二次确认。前置无移出行时先加入一家再测移出（改会话数据）。
