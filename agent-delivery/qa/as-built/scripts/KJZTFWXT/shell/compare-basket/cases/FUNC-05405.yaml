id: FUNC-05405
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05405
priority: P1
title: 新增企业里点详情打开画像快览
story: US-ENT-CMP-02
entry_id: shell-compare-basket
tier: B
preconditions:
  - 新增企业弹窗已打开
locators:
  panel: .system-compare-panel
  add_modal: '[data-testid="compare-basket-add-modal"]'
  enterprise_tab: '#compare-basket-tab-enterprise'
  detail_link: button「详情」
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
  - action: evaluate
    note: 点「新增」→点一行「详情」；快览抽屉在 expect 判定
expect:
  - note: 前置：对比篮已打开且新增弹层可见，点首行「详情」打开快览
    assert: |-
      const hostPath = '/enterprise/search';
      if (!page.url().includes(hostPath)) throw new Error('未在宿主页: ' + page.url());
      const openPanel = async () => {
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) return panel;
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (await dock.count()) await dock.first().click({ timeout: 10000 });
        else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 10000 });
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      const openAddModal = async (panel) => {
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        let modal = page.locator('[data-testid="compare-basket-add-modal"]');
        if (!(await modal.count())) modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        return modal;
      };
      const ensureDetailRow = async (modal) => {
        let detailBtns = modal.getByRole('button', { name: '详情', exact: true });
        if (!(await detailBtns.count())) {
          const search = modal.getByPlaceholder(/企业名称|输入企业名称/).first();
          if (await search.count()) {
            await search.fill('科技');
            await page.waitForTimeout(500);
          }
          await page.waitForTimeout(1200);
          detailBtns = modal.getByRole('button', { name: '详情', exact: true });
        }
        if (!(await detailBtns.count())) throw new Error('ENV-SHELL-COMPARE-ADD-DETAIL-001：新增弹层无「详情」行');
        return detailBtns.first();
      };
      const panel = await openPanel();
      const entTab = panel.locator('#compare-basket-tab-enterprise');
      await entTab.click({ timeout: 5000 }).catch(() => {});
      await page.waitForTimeout(300);
      const modal = await openAddModal(panel);
      const detailBtn = await ensureDetailRow(modal);
      await detailBtn.scrollIntoViewIfNeeded();
      await detailBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      if (/enterprise\/[^/?#]+/.test(page.url()) && !page.url().includes('/enterprise/search')) {
        throw new Error('D3·新增「详情」深链跳转全页，非抽屉快览；url=' + page.url());
      }
      const wrongDetail = page.locator('.arco-drawer:visible').filter({ hasText: '企业详情' }).last();
      if (await wrongDetail.count() && (await wrongDetail.isVisible().catch(() => false))) {
        throw new Error('D3·「详情」直接打开「企业详情」抽屉，非「企业画像快览」');
      }
      const quickDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(quickDrawer).toBeVisible({ timeout: 12000 });
      globalThis.__func05405 = { quickDrawerReady: true };
  - note: 1、抽屉标题为「企业画像快览」
    assert: |-
      if (!globalThis.__func05405?.quickDrawerReady) throw new Error('前置：未打开画像快览');
      const quickDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(quickDrawer).toBeVisible({ timeout: 8000 });
      await expect(quickDrawer.locator('.arco-drawer-header, .arco-drawer-title').first()).toContainText('企业画像快览');
  - note: 2、抽屉内有「加入对比」
    assert: |-
      if (!globalThis.__func05405?.quickDrawerReady) throw new Error('前置：未打开画像快览');
      const quickDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(quickDrawer).toBeVisible({ timeout: 8000 });
      const joinCompare = quickDrawer.getByRole('button', { name: '加入对比', exact: true });
      await expect(joinCompare).toBeVisible({ timeout: 8000 });
  - note: 3、抽屉内有「查看详情」
    assert: |-
      if (!globalThis.__func05405?.quickDrawerReady) throw new Error('前置：未打开画像快览');
      const quickDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(quickDrawer).toBeVisible({ timeout: 8000 });
      const viewDetail = quickDrawer.getByRole('button', { name: '查看详情', exact: true });
      await expect(viewDetail).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: catalog=app-shell#system-compare-basket；goto /enterprise/search。步骤=对比篮「新增」弹层首行「详情」。机检=快览抽屉标题+「加入对比」+「查看详情」（不点「查看详情」下一页，与 05420 分步）。新增弹层 data-testid=compare-basket-add-modal；点详情后弹层关闭为 implementation。登录与关评审由 runner 前置。
