preconditions:
- 已勾选 1～N 家企业
locators:
  task: 重点企业领域分布分析
steps:
- action: goto
  target: /enterprise/search
- action: click
  target: 打开对比篮 → 勾选 → 发起分析 → 领域分布 → 下一步
expect:
- note: 进入领域分布分析配置页且分析对象为本次勾选企业
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); const panel = page.locator('.system-compare-panel'); await panel.locator('.ent-compare-item-card__check').first().click({ timeout: 8000 }); await panel.getByRole('button', { name: '发起分析' }).click({ timeout: 8000 }); const modal = page.locator('.arco-modal:visible').filter({ hasText: '选择分析任务' }).first(); await modal.getByText('重点企业领域分布分析').first().click({ timeout: 8000 }); await modal.getByRole('button', { name: '下一步：前往配置' }).click({ timeout: 8000 }); await page.waitForTimeout(2500); await expect(page).toHaveURL(/key-enterprise|domain|compare-basket|analysis_type/i)
- note: 目标页显示「来自对比篮 · X 家」且非本次勾选企业不进入对象集
  assert: 'await expect(page.getByText(/来自对比篮/).first()).toBeVisible({ timeout: 12000 })'
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 领域页内部归 KEYDOM；本条只验分发到达。
tier: B
