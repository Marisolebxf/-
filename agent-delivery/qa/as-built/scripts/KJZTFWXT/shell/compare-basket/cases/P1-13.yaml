id: P1-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00509
priority: P1
title: 关闭任务浮层后留在对比篮且状态不变
story: US-ENT-CMP-03
entry_id: shell-compare-basket
preconditions:
- 已勾选且任务浮层已打开
locators:
  cancel: 取消
  panel: .system-compare-panel
steps:
- action: goto
  target: /enterprise/search
- action: click
  target: 打开篮→勾选→发起分析→取消
expect:
- note: 留在对比篮浮层
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); const panel = page.locator('.system-compare-panel'); await panel.locator('.ent-compare-item-card__check').first().click({ timeout: 8000 }); await panel.getByRole('button', { name: '发起分析' }).click({ timeout: 8000 }); const modal = page.locator('.arco-modal:visible').filter({ hasText: '选择分析任务' }).first(); await expect(modal).toBeVisible({ timeout: 8000 }); await modal.getByRole('button', { name: '取消' }).click({ timeout: 8000 }); await page.waitForTimeout(500); await expect(page.locator('.system-compare-panel')).toBeVisible({ timeout: 8000 })
- note: 篮内容、筛选和勾选不变
  assert: |-
    const panel = page.locator('.system-compare-panel'); await expect(panel.getByText(/已选\s*[1-9]\d*\s*家/)).toBeVisible({ timeout: 5000 }); if (!(await panel.locator('.ent-compare-item-card').count())) throw new Error('取消后篮内容丢失')
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
