id: FUNC-05413
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05413
priority: P0
title: 选定产业周期分析并前往配置，页面标题为产业周期分析
story: US-ENT-CMP-03
entry_id: shell-compare-basket
tier: A
preconditions:
  - 产业页至少 1 个对象
locators:
  panel: .system-compare-panel
  industry_tab: '#compare-basket-tab-industry'
  launch: 发起分析
  modal: .arco-modal.analysis-picker-modal
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
expect:
  - note: 前置与主流程：勾选 1 个产业对象→发起分析→产业周期分析→下一步前往配置
    assert: |-
      const hostPath = '/enterprise/search';
      if (!page.url().includes(hostPath)) throw new Error('未在宿主页: ' + page.url());
      const parseIndCount = (text) => {
        const m = (text || '').replace(/\s+/g, ' ').match(/产业[^\d]*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : null;
      };
      const openPanel = async () => {
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) return panel;
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (await dock.count()) await dock.first().click({ timeout: 10000 });
        else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 10000 });
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      const clampCompareLayerInViewport = async () => {
        await page.evaluate(() => {
          for (const k of Object.keys(localStorage)) {
            if (k.includes('gkx-system-compare-layer-position')) localStorage.removeItem(k);
          }
          const layer = document.querySelector('.system-compare-layer[data-panel-open="true"]');
          if (layer instanceof HTMLElement) {
            layer.style.right = '24px';
            layer.style.top = '80px';
            layer.style.left = 'auto';
            layer.style.bottom = 'auto';
          }
        });
        await page.waitForTimeout(200);
      };
      const industryWorkspace = (panel) => panel.locator('#compare-basket-panel-industry');
      const clickIndustryTab = async () => {
        await clampCompareLayerInViewport();
        await page.evaluate(() => {
          const tab = document.getElementById('compare-basket-tab-industry');
          if (!tab) throw new Error('产业 Tab 不存在');
          tab.click();
        });
        await page.waitForTimeout(500);
      };
      const selectOneIndustryCard = async () => {
        const picked = await page.evaluate(() => {
          const ws = document.getElementById('compare-basket-panel-industry');
          if (!ws) return false;
          const cards = ws.querySelectorAll('.grid > div');
          for (const card of cards) {
            const tag = card.querySelector('.arco-tag');
            const tagTxt = (tag?.textContent || '').replace(/\s+/g, '');
            if (tagTxt !== '产业') continue;
            const cb =
              card.querySelector('.arco-checkbox') ||
              card.querySelector('input[type="checkbox"]');
            if (cb instanceof HTMLElement) {
              cb.click();
              return true;
            }
          }
          return false;
        });
        return picked;
      };
      const seedIndustryFromAdd = async (panel) => {
        const ws = industryWorkspace(panel);
        const addBtn = ws.getByRole('button', { name: '新增' }).first();
        await addBtn.click({ timeout: 10000 });
        const modal = page.locator('[data-testid="compare-basket-add-modal"]').or(page.locator('.arco-modal:visible').last());
        await expect(modal.first()).toBeVisible({ timeout: 10000 });
        await page.waitForTimeout(1200);
        const joinBtns = modal.first().getByRole('button', { name: '加入对比篮', exact: true });
        const nJoin = await joinBtns.count();
        if (nJoin < 1) throw new Error('ENV-SHELL-COMPARE-IND-ADD-001：新增弹层无「加入对比篮」');
        for (let j = 0; j < Math.min(nJoin, 6); j++) {
          await joinBtns.nth(j).click({ timeout: 10000 });
          await page.waitForTimeout(600);
          panel = page.locator('.system-compare-panel');
          await clickIndustryTab();
          if (await selectOneIndustryCard()) {
            const closeOk = modal.first().getByRole('button', { name: '取消' }).first();
            if (await closeOk.count()) await closeOk.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(300);
            return;
          }
        }
        const close = modal.first().getByRole('button', { name: '取消' }).first();
        if (await close.count()) await close.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(300);
      };
      let panel = await openPanel();
      await clickIndustryTab();
      const indTab = panel.getByRole('tab', { name: /^产业\s/ });
      let indCount = parseIndCount(await indTab.innerText().catch(() => ''));
      if (indCount != null && indCount < 1) {
        await seedIndustryFromAdd(panel);
        panel = page.locator('.system-compare-panel');
        await clickIndustryTab();
      }
      const ws = industryWorkspace(panel);
      await expect(ws).toBeVisible({ timeout: 8000 });
      const cancel = ws.getByRole('button', { name: '取消选择' });
      if (await cancel.count() && !(await cancel.isDisabled())) {
        await cancel.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      let picked = await selectOneIndustryCard();
      if (!picked) {
        await seedIndustryFromAdd(panel);
        panel = page.locator('.system-compare-panel');
        await clickIndustryTab();
        picked = await selectOneIndustryCard();
      }
      if (!picked) throw new Error('ENV-SHELL-COMPARE-IND-INDUSTRY-TYPE-001：产业 Tab 无「产业」类型对象（周期分析需产业非产业链）');
      await page.waitForTimeout(400);
      const selLine = ws.getByText(/已选\s*1\s*个对象/).first();
      await expect(selLine).toBeVisible({ timeout: 8000 });
      const launch = ws.getByRole('button', { name: '发起分析' });
      if (await launch.isDisabled()) throw new Error('勾选 1 个产业对象后发起分析仍 disabled');
      await launch.click({ timeout: 8000 });
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '选择分析任务' }).first();
      await expect(modal).toBeVisible({ timeout: 10000 });
      const cycleLabel = modal.locator('label').filter({ hasText: '产业周期分析' }).first();
      await expect(cycleLabel).toBeVisible({ timeout: 8000 });
      await cycleLabel.click({ timeout: 10000 });
      await page.waitForTimeout(400);
      const nextBtn = modal.getByRole('button', { name: '下一步：前往配置' });
      await expect(nextBtn).toBeEnabled({ timeout: 8000 });
      await nextBtn.click({ timeout: 10000 });
      await page.waitForLoadState('domcontentloaded');
      await page.waitForTimeout(1500);
  - note: 页面标题为「产业周期分析」
    assert: |-
      const titleText = '产业周期分析';
      const tab = page.getByRole('tab', { name: titleText }).first();
      if (await tab.count()) {
        await expect(tab).toBeVisible({ timeout: 12000 });
      } else {
        const h = page.getByRole('heading', { name: titleText }).first();
        if (await h.count()) await expect(h).toBeVisible({ timeout: 12000 });
        else await expect(page.getByText(titleText, { exact: true }).first()).toBeVisible({ timeout: 12000 });
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: catalog=app-shell#system-compare-basket；goto /enterprise/search。产业 Tab 选「产业」标签对象（非产业链）→任务浮层选 cycle→ok「下一步：前往配置」→/industry-center/diagnosis?workspace=cycle&tab=cycle（buildIndustryAnalysisUrl）。本条只验页标题「产业周期分析」，不验地址栏与页内来源标记（用例备注）。空篮经产业「新增」入篮（改会话数据）。
