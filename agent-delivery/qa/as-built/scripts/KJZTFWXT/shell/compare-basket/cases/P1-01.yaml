id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00497
priority: P1
title: 任务与对比篮浮层互斥展开且业务状态不丢失
story: US-ENT-CMP-06
entry_id: shell-compare-basket
preconditions:
- 系统任务入口可见
locators:
  task_entry: 系统任务入口
  basket: 对比篮入口
steps:
- action: goto
  target: /enterprise/search
- action: click
  target: 对比篮 ↔ 任务入口往返
expect:
- note: 打开对比篮时任务面板自动收起为入口
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const taskBtn = page.getByRole('button', { name: /任务|我的任务/ }).first(); if (!(await taskBtn.count())) throw new Error('无系统任务入口'); await taskBtn.click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(500); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); await expect(page.locator('.system-compare-panel')).toBeVisible({ timeout: 8000 })
- note: 再次打开任务时对比篮自动收起
  assert: |-
    const taskBtn = page.getByRole('button', { name: /任务|我的任务/ }).first(); await taskBtn.click({ timeout: 8000 }); await page.waitForTimeout(600); const panelVisible = await page.locator('.system-compare-panel').isVisible().catch(()=>false); if (panelVisible) { const disp = await page.locator('.system-compare-panel').evaluate((el) => getComputedStyle(el).display); if (disp !== 'none') throw new Error('打开任务后对比篮未收起') }
- note: 两次往返后篮内筛选与勾选保持不变
  assert: |-
    const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); await expect(page.locator('.system-compare-panel')).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 任务入口隐藏（无可见任务）时 Pass-N/A
as_built_note: 任务入口文案以现场为准 observed。
tier: B
