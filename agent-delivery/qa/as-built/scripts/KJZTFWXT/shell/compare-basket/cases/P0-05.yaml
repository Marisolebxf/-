id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00485
priority: P0
title: 企业类型筛选生效且重置文案正确
story: US-ENT-CMP-02
entry_id: shell-compare-basket
preconditions:
- 篮内含至少两种企业类型（不足则 allow_skip）
locators:
  type_select: .arco-select-view（全部企业类型）
  reset: button「重置」
steps:
- action: goto
  target: /enterprise/search
- action: click
  target: 打开对比篮
- action: click
  target: 全部企业类型
- action: click
  target: 任一类型选项
- action: click
  target: 重置
expect:
- note: 列表仅显示该类型企业
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); const panel = page.locator('.system-compare-panel'); await expect(panel).toBeVisible({ timeout: 8000 }); const tr = panel.locator('.arco-select-view').filter({ hasText: /全部企业类型/ }).first(); await tr.click({ timeout: 8000 }); await page.waitForTimeout(500); const opts = page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li'); const oc = await opts.count(); if (!oc) throw new Error('类型下拉无选项'); await opts.first().click({ timeout: 8000 }); await page.waitForTimeout(600); await expect(panel.getByRole('button', { name: '重置' })).toBeVisible({ timeout: 5000 }); if (await panel.getByText('清空筛选', { exact: true }).count()) throw new Error('不应出现清空筛选文案')
- note: 重置后名称与企业类型恢复默认值且列表恢复全量
  assert: |-
    const panel = page.locator('.system-compare-panel'); await panel.getByRole('button', { name: '重置' }).click({ timeout: 8000 }); await page.waitForTimeout(600); await expect(panel.locator('.arco-select-view').filter({ hasText: /全部企业类型/ }).first()).toBeVisible({ timeout: 8000 }); const ph = await panel.getByPlaceholder('按企业名称搜索').inputValue(); if (ph) throw new Error('重置后名称搜索未清空: ' + ph)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 类型清单以现场为准（observed）；恢复动作仅「重置」。
allow_skip: 篮内不足两种类型或下拉无选项时 Pass-N/A
tier: A
