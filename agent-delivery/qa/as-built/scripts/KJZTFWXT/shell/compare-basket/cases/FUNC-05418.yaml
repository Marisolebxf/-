id: FUNC-05418
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05418
priority: P0
title: 企业页全选当前筛选结果已选等于列出全部
story: US-ENT-CMP-02
entry_id: shell-compare-basket
tier: A
preconditions:
  - 企业页至少 1 家
  - 没有用名称或类型滤掉行
locators:
  panel: .system-compare-panel
  enterprise_tab: '#compare-basket-tab-enterprise'
  card: .ent-compare-item-card
  select_all: checkbox aria-label「全选当前筛选结果」
  action_bar: '[data-testid="compare-basket-action-bar"]'
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
  - action: evaluate
    note: 无筛选状态下点「全选当前筛选结果」；已选计数在 expect 判定
expect:
  - note: 前置开篮、清筛选与取消选择后点击全选
    assert: |-
      const hostPath = '/enterprise/search';
      if (!page.url().includes(hostPath)) throw new Error('未在宿主页: ' + page.url());
      const openPanel = async () => {
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) return panel;
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (await dock.count()) await dock.first().click({ timeout: 10000 });
        else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 10000 });
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      const seedFromAddModal = async (panel) => {
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        const modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        let joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        if (!(await joinBtns.count())) {
          const search = modal.getByPlaceholder(/企业名称|搜索/).first();
          if (await search.count()) {
            await search.fill('科技');
            await page.waitForTimeout(400);
            const go = modal.getByRole('button', { name: /搜索|查询/ }).first();
            if (await go.count()) await go.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1200);
          }
          joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        }
        if (!(await joinBtns.count())) throw new Error('ENV-SHELL-COMPARE-ADD-MODAL-001：新增弹层无「加入对比篮」');
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const close = modal.getByRole('button', { name: '取消' }).first();
        if (await close.count()) await close.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      };
      const seedFromEnterpriseSearch = async () => {
        const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
        await page.goto(origin + '/enterprise/enterprise-search', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        const clearBtn = page.locator('.enterprise-search-history-row button').filter({ hasText: '清空' }).first();
        if (await clearBtn.isVisible().catch(() => false)) {
          await clearBtn.click({ timeout: 4000 }).catch(() => {});
          await page.waitForTimeout(500);
        }
        const main = page.locator('main');
        const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
        if (await recSection.count()) {
          const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({
            has: page.getByRole('button', { name: '查看画像', exact: true }),
          });
          for (let i = 0; i < await cards.count(); i++) {
            const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
            if (await btn.count() && (await btn.isVisible().catch(() => false))) {
              await btn.click({ timeout: 8000 });
              await page.waitForTimeout(700);
              break;
            }
          }
        }
        await page.goto(origin + hostPath, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      };
      const countListedEntCards = async (panel) => {
        const cards = panel.locator('.ent-compare-item-card');
        let n = 0;
        for (let i = 0; i < (await cards.count()); i++) {
          if (await cards.nth(i).isVisible().catch(() => false)) n += 1;
        }
        return n;
      };
      let panel = await openPanel();
      let entTab = panel.locator('#compare-basket-tab-enterprise');
      await entTab.click({ timeout: 5000 }).catch(() => {});
      await page.waitForTimeout(400);
      let listN = await countListedEntCards(panel);
      if (listN < 1) {
        await seedFromAddModal(panel).catch(() => {});
        listN = await countListedEntCards(panel);
      }
      if (listN < 1) {
        await seedFromEnterpriseSearch();
        panel = await openPanel();
        entTab = panel.locator('#compare-basket-tab-enterprise');
        await entTab.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
        listN = await countListedEntCards(panel);
      }
      if (listN < 1) throw new Error('ENV-SHELL-COMPARE-BASKET-EMPTY-001：无法满足企业页至少 1 家');
      const search = panel.getByPlaceholder('按企业名称搜索');
      if (await search.count()) {
        await search.fill('');
        await page.waitForTimeout(400);
      }
      const resetBtn = panel.getByRole('button', { name: '重置', exact: true });
      if (await resetBtn.count() && !(await resetBtn.isDisabled())) {
        await resetBtn.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(500);
      }
      listN = await countListedEntCards(panel);
      if (listN < 1) throw new Error('重置筛选后企业列表为空');
      const cancel = panel.getByRole('button', { name: '取消选择', exact: true });
      if (await cancel.count() && !(await cancel.isDisabled())) {
        await cancel.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      const selectAll = panel
        .getByRole('checkbox', { name: '全选当前筛选结果' })
        .or(panel.locator('[aria-label="全选当前筛选结果"]'));
      await expect(selectAll.first()).toBeVisible({ timeout: 8000 });
      await selectAll.first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      globalThis.__func05418 = { listN };
  - note: 底栏「已选」家数等于当前列出的企业行数
    assert: |-
      const st = globalThis.__func05418 || {};
      if (typeof st.listN !== 'number') throw new Error('前置：未完成全选点击');
      const panel = page.locator('.system-compare-panel');
      const bar = panel.locator('[data-testid="compare-basket-action-bar"]');
      await expect(bar).toBeVisible({ timeout: 8000 });
      const selLine = bar.getByText(/已选\s*\d+\s*家/).first();
      await expect(selLine).toBeVisible({ timeout: 8000 });
      const selTxt = ((await selLine.innerText()) || '').replace(/\s+/g, ' ');
      const m = selTxt.match(/已选\s*(\d+)\s*家/);
      if (!m) throw new Error('底栏未见「已选 N 家」: ' + selTxt);
      const selected = parseInt(m[1], 10);
      if (selected !== st.listN) {
        throw new Error(`底栏已选应为 ${st.listN} 家，实际 ${selected} 家（列出 ${st.listN} 行）`);
      }
      globalThis.__func05418.barSelected = selected;
  - note: 标题行「当前已选择」家数与底栏相同
    assert: |-
      const st = globalThis.__func05418 || {};
      if (typeof st.barSelected !== 'number') throw new Error('前置：底栏已选未校验');
      const panel = page.locator('.system-compare-panel');
      const headerText = ((await panel.innerText()) || '').replace(/\s+/g, ' ');
      const hm = headerText.match(/当前已选择\s*(\d+)\s*家企业/);
      if (!hm) throw new Error('标题区未见「当前已选择 N 家企业」');
      const headerN = parseInt(hm[1], 10);
      if (headerN !== st.barSelected) {
        throw new Error(`标题当前已选择应为 ${st.barSelected} 家，实际 ${headerN} 家（底栏 ${st.barSelected}）`);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: catalog=app-shell#system-compare-basket；goto /enterprise/search。全选为 CompareBasketActionBar a-checkbox（aria-label「全选当前筛选结果」）。机检=无筛选下列出行数 N → 全选后底栏「已选 N 家」与标题「当前已选择 N 家企业」一致。空篮入篮同 FUNC-05390。登录与关评审由 runner 前置。A 档零 allow_skip。
