id: FUNC-05420
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05420
priority: P0
title: 画像里点查看详情页面标题为企业详情
story: US-ENT-CMP-02
entry_id: shell-compare-basket
tier: A
preconditions:
  - 企业页至少 1 家
locators:
  panel: .system-compare-panel
  enterprise_tab: '#compare-basket-tab-enterprise'
  portrait_button: button「查看画像」
  view_detail: .arco-drawer:visible button「查看详情」
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
  - action: evaluate
    note: 点「查看画像」再点「查看详情」；标题在 expect 判定
expect:
  - note: 前置开篮≥1 家，点该行「查看画像」后点「查看详情」
    assert: |-
      const hostPath = '/enterprise/search';
      if (!page.url().includes(hostPath)) throw new Error('未在宿主页: ' + page.url());
      const openPanel = async () => {
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) return panel;
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (await dock.count()) await dock.first().click({ timeout: 10000 });
        else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 10000 });
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      const seedFromAddModal = async (panel) => {
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        const modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        let joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        if (!(await joinBtns.count())) {
          const search = modal.getByPlaceholder(/企业名称|搜索/).first();
          if (await search.count()) {
            await search.fill('科技');
            await page.waitForTimeout(400);
            const go = modal.getByRole('button', { name: /搜索|查询/ }).first();
            if (await go.count()) await go.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1200);
          }
          joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        }
        if (!(await joinBtns.count())) throw new Error('ENV-SHELL-COMPARE-ADD-MODAL-001：新增弹层无「加入对比篮」');
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const close = modal.getByRole('button', { name: '取消' }).first();
        if (await close.count()) await close.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      };
      const seedFromEnterpriseSearch = async () => {
        const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
        await page.goto(origin + '/enterprise/enterprise-search', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        const clearBtn = page.locator('.enterprise-search-history-row button').filter({ hasText: '清空' }).first();
        if (await clearBtn.isVisible().catch(() => false)) {
          await clearBtn.click({ timeout: 4000 }).catch(() => {});
          await page.waitForTimeout(500);
        }
        const main = page.locator('main');
        const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
        if (await recSection.count()) {
          const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({
            has: page.getByRole('button', { name: '查看画像', exact: true }),
          });
          for (let i = 0; i < await cards.count(); i++) {
            const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
            if (await btn.count() && (await btn.isVisible().catch(() => false))) {
              await btn.click({ timeout: 8000 });
              await page.waitForTimeout(700);
              break;
            }
          }
        }
        await page.goto(origin + hostPath, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      };
      const parseEntCount = (text) => {
        const m = (text || '').replace(/\s+/g, ' ').match(/企业[^\d]*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : null;
      };
      const basketHasEnterprise = async (panel) => {
        const entTab = panel.locator('#compare-basket-tab-enterprise');
        await entTab.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
        const entN = parseEntCount(await entTab.innerText());
        const empty = await panel.getByText('对比篮暂无企业').first().isVisible().catch(() => false);
        const n = await panel.locator('.ent-compare-item-card').count();
        return !empty && entN !== null && entN >= 1 && n >= 1;
      };
      let panel = await openPanel();
      for (let attempt = 0; attempt < 3 && !(await basketHasEnterprise(panel)); attempt += 1) {
        await seedFromAddModal(panel).catch(() => {});
        panel = await openPanel();
        if (await basketHasEnterprise(panel)) break;
        await seedFromEnterpriseSearch();
        panel = await openPanel();
      }
      if (!(await basketHasEnterprise(panel))) {
        throw new Error('ENV-SHELL-COMPARE-BASKET-EMPTY-001：无法满足企业页至少 1 家');
      }
      const entTab = panel.locator('#compare-basket-tab-enterprise');
      const firstCard = panel.locator('.ent-compare-item-card').first();
      await expect(firstCard).toBeVisible({ timeout: 8000 });
      const portraitBtn = firstCard.getByRole('button', { name: '查看画像', exact: true });
      await expect(portraitBtn).toBeVisible({ timeout: 8000 });
      await portraitBtn.scrollIntoViewIfNeeded().catch(() => {});
      const urlBefore = page.url();
      await portraitBtn.evaluate((el) => el.click());
      await page.waitForTimeout(1500);
      if (page.url() !== urlBefore && /\/development\/enterprise\//.test(page.url())) {
        throw new Error('D3·篮内「查看画像」深链至详情页，无快览可点「查看详情」；url=' + page.url());
      }
      const mainAfter = ((await page.locator('main').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/401|Request failed/i.test(mainAfter) && /企业画像/.test(mainAfter)) {
        throw new Error(
          'D3·edu 篮内「查看画像」跳转全页企业画像且 API 401，无「企业画像快览」抽屉（与 05403/05420 不符；同环境 search 01472 快览可绿）',
        );
      }
      const wrongDetail = page.locator('.arco-drawer:visible').filter({ hasText: '企业详情' }).last();
      if (await wrongDetail.isVisible().catch(() => false)) {
        throw new Error('D3·「查看画像」直接打开「企业详情」抽屉，非「企业画像快览」');
      }
      const quickDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(quickDrawer).toBeVisible({ timeout: 12000 });
      await expect(quickDrawer.locator('.arco-drawer-header, .arco-drawer-title').first()).toContainText('企业画像快览');
      const detailBtn = quickDrawer.getByRole('button', { name: '查看详情', exact: true });
      await expect(detailBtn).toBeVisible({ timeout: 8000 });
      await detailBtn.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      globalThis.__func05420_afterDetail = true;
  - note: 1、页面标题为「企业详情」
    assert: |-
      if (!globalThis.__func05420_afterDetail) throw new Error('前置：未点击「查看详情」');
      const detailDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业详情' }).last();
      if (await detailDrawer.count() && (await detailDrawer.isVisible().catch(() => false))) {
        await expect(detailDrawer.locator('.arco-drawer-header, .arco-drawer-title').first()).toContainText('企业详情');
        return;
      }
      const mainHay = ((await page.locator('main').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const docTitle = await page.title();
      if (/企业详情/.test(docTitle) || mainHay.includes('企业详情')) {
        const h1 = page.getByRole('heading', { name: '企业详情' });
        if (await h1.count()) {
          await expect(h1.first()).toBeVisible({ timeout: 8000 });
          return;
        }
        if (mainHay.includes('企业详情')) return;
      }
      const quickStill = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      if (await quickStill.isVisible().catch(() => false)) {
        throw new Error('点击「查看详情」后仍为「企业画像快览」，未见「企业详情」标题');
      }
      throw new Error('未识别「企业详情」页面标题；url=' + page.url() + ' title=' + docTitle);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: catalog=app-shell#system-compare-basket；goto /enterprise/search。edu tts/svcz 篮内「查看画像」navigate 全页「企业画像」且 API 401，无「企业画像快览」抽屉（D3，同 key-domain 01708/01814 类；search 01472 快览可绿）。目标态=篮内 ElementProfile 快览→「查看详情」→标题「企业详情」。空篮入篮同 FUNC-05414。登录与关评审由 runner 前置。A 档零 allow_skip。
