id: P1-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00502
priority: P1
title: 分发后返回对比篮时筛选勾选与滚动位置恢复
story: US-ENT-CMP-03
entry_id: shell-compare-basket
preconditions:
- 已设置筛选并勾选
locators:
  reopen: 打开对比篮调整对象
steps:
- action: evaluate
  note: 筛+勾 → 评估分发 → 打开对比篮调整对象返回
expect:
- note: 返回后筛选、勾选与滚动位置恢复为分发前状态
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); const panel = page.locator('.system-compare-panel'); await panel.locator('.ent-compare-item-card__check').first().click({ timeout: 8000 }); const selBefore = await panel.getByText(/已选\s*\d+\s*家/).first().innerText(); await panel.getByRole('button', { name: '发起分析' }).click({ timeout: 8000 }); const modal = page.locator('.arco-modal:visible').filter({ hasText: '选择分析任务' }).first(); await modal.getByText('技术力评估').first().click({ timeout: 8000 }); await modal.getByRole('button', { name: '下一步：前往配置' }).click({ timeout: 8000 }); await page.waitForTimeout(2500); const reopen = page.getByRole('button', { name: /打开对比篮调整对象|返回对比篮/ }); if (await reopen.count()) await reopen.first().click({ timeout: 8000 }); else { const d2 = page.getByRole('button', { name: /打开对比篮/ }); if (await d2.count()) await d2.first().click({ timeout: 8000 }) } await expect(page.locator('.system-compare-panel')).toBeVisible({ timeout: 10000 }); await expect(page.locator('.system-compare-panel').getByText(/已选\s*\d+\s*家/)).toBeVisible({ timeout: 5000 })
- note: 篮内企业未被清空
  assert: const n = await page.locator('.system-compare-panel .ent-compare-item-card').count(); if (!n) throw new Error('返回后篮被清空')
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
