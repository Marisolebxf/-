id: P0-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00487
priority: P0
title: 底部操作栏构成与顺序正确且短列表不上推
story: US-ENT-CMP-02
entry_id: shell-compare-basket
preconditions:
  - 已登录 admin（业务页且 URL 不含 /login 则不重复登录）
  - 篮内已加载企业列表
  - env-gate overall=pass
locators:
  entry: button「对比篮」或 aria「打开对比篮」(.system-compare-dock)
  panel: .system-compare-panel
  bar: '[data-testid="compare-basket-action-bar"]'
  list: .ent-compare-basket-list
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
  - action: wait
    for: .system-compare-panel 可见
  - action: evaluate
    note: 核对操作栏构成顺序与分隔线；短列表栏贴底；列表区滚动栏位固定
expect:
  - note: 操作栏顺序为全选当前筛选结果、已选 X 家、取消选择、分隔线、发起分析、加入招引候选、加入培育候选
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); const panel = page.locator('.system-compare-panel'); await expect(panel).toBeVisible({ timeout: 8000 }); const bar = panel.locator('[data-testid="compare-basket-action-bar"]'); await expect(bar).toBeVisible({ timeout: 8000 }); const kids = await bar.evaluate((el) => [...el.children].map((c) => ({ text: ((c.innerText || c.textContent || '').trim().replace(/\s+/g, ' ')), className: String(c.className || ''), tag: c.tagName.toLowerCase() }))); const texts = kids.map((k) => k.text); const findIdx = (re) => texts.findIndex((t) => re.test(t)); const iAll = findIdx(/^全选当前筛选结果$/); const iSel = findIdx(/^已选\s*\d+\s*家$/); const iCancel = findIdx(/^取消选择$/); const iDiv = kids.findIndex((k) => !k.text && /w-px|h-5/.test(k.className)); const iLaunch = findIdx(/发起分析/); const iAttr = findIdx(/加入招引候选/); const iCult = findIdx(/加入培育候选/); if ([iAll, iSel, iCancel, iDiv, iLaunch, iAttr, iCult].some((i) => i < 0)) throw new Error('操作栏缺项 kids=' + JSON.stringify(texts)); if (!(iAll < iSel && iSel < iCancel && iCancel < iDiv && iDiv < iLaunch && iLaunch < iAttr && iAttr < iCult)) throw new Error('操作栏顺序异常 idx=' + JSON.stringify({ iAll, iSel, iCancel, iDiv, iLaunch, iAttr, iCult })); await expect(bar.getByRole('button', { name: '发起分析' })).toBeVisible({ timeout: 5000 }); await expect(bar.getByRole('button', { name: '加入招引候选' })).toBeVisible({ timeout: 5000 }); await expect(bar.getByRole('button', { name: '加入培育候选' })).toBeVisible({ timeout: 5000 }); globalThis.__p008 = { ok: true };
  - note: 短列表时操作栏仍贴浮层底部（栏下无大块留白，不上推至中部）
    assert: |-
      const panel = page.locator('.system-compare-panel'); const bar = panel.locator('[data-testid="compare-basket-action-bar"]'); const search = panel.getByPlaceholder('按企业名称搜索'); const nameLoc = panel.locator('.ent-compare-item-card__name'); const n0 = ((await nameLoc.first().innerText()) || '').trim(); if (!n0) throw new Error('篮内无企业名'); const probe = n0.slice(0, Math.min(6, n0.length)); await search.fill(probe); await page.waitForTimeout(700); const cards = await panel.locator('.ent-compare-item-card').count(); if (!cards) throw new Error('短列表过滤后无卡 probe=' + probe); const geo = await panel.evaluate((el) => { const b = el.querySelector('[data-testid="compare-basket-action-bar"]'); const list = el.querySelector('.ent-compare-basket-list'); if (!b || !list) throw new Error('缺 bar/list'); const pr = el.getBoundingClientRect(); const br = b.getBoundingClientRect(); const lr = list.getBoundingClientRect(); return { gapBelow: pr.bottom - br.bottom, listToBar: br.top - lr.bottom, panelH: pr.height, barTop: br.top, barInList: list.contains(b) }; }); if (geo.gapBelow > 80) throw new Error('短列表上推：栏下留白过大 gapBelow=' + geo.gapBelow); if (geo.listToBar < 0 || geo.listToBar > 40) throw new Error('栏未紧随列表 listToBar=' + geo.listToBar); if (geo.barInList) throw new Error('操作栏不应落在列表滚动区内'); await search.fill(''); await page.waitForTimeout(600);
  - note: 列表纵向滚动时操作栏 Y 不变；仅中部列表区为滚动容器
    assert: |-
      const panel = page.locator('.system-compare-panel'); const bar = panel.locator('[data-testid="compare-basket-action-bar"]'); await expect(bar.getByRole('button', { name: '发起分析' })).toBeVisible({ timeout: 5000 }); const before = await bar.evaluate((el) => el.getBoundingClientRect().top); const scrollMeta = await panel.evaluate((el) => { const list = el.querySelector('.ent-compare-basket-list'); if (!list) return { err: 'no list' }; const cs = getComputedStyle(list); const y0 = list.scrollTop; list.scrollTop = list.scrollHeight; return { overflowY: cs.overflowY, flexGrow: cs.flexGrow, scrollH: list.scrollHeight, clientH: list.clientHeight, scrolled: list.scrollTop !== y0, scrollTop: list.scrollTop }; }); if (scrollMeta.err) throw new Error(scrollMeta.err); if (!/auto|scroll/.test(scrollMeta.overflowY || '')) throw new Error('列表非纵向滚动容器 overflowY=' + scrollMeta.overflowY); await page.waitForTimeout(300); const after = await bar.evaluate((el) => el.getBoundingClientRect().top); if (Math.abs(after - before) > 2) throw new Error('滚动后操作栏位移 before=' + before + ' after=' + after); const outside = await panel.evaluate((el) => { const list = el.querySelector('.ent-compare-basket-list'); const b = el.querySelector('[data-testid="compare-basket-action-bar"]'); return !!(list && b && !list.contains(b)); }); if (!outside) throw new Error('操作栏落入列表节点内');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘 bar=data-testid=compare-basket-action-bar；子节点序=全选/已选N家/取消选择/w-px分隔/发起分析/加入招引候选/加入培育候选。短列表过滤后栏仍贴 panel 底（gapBelow≈30，listToBar≈12）。列表 overflow:auto 且 bar 在 list 外 shrink-0。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
