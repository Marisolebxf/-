id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00503
priority: P1
title: 对比篮浮层内不出现分析结论类内容
story: US-ENT-CMP-03
entry_id: shell-compare-basket
preconditions:
- 浮层已展开且篮内有企业
locators:
  panel: .system-compare-panel
steps:
- action: goto
  target: /enterprise/search
- action: click
  target: 打开对比篮与任务浮层浏览
expect:
- note: 无评分、雷达图、排名、指标矩阵、差距分析或风险结论
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/search', { waitUntil: 'domcontentloaded' }); await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(()=>{}); await page.waitForTimeout(800); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 8000 }); const panel = page.locator('.system-compare-panel'); const txt = await panel.innerText(); for (const bad of ['综合得分','雷达图','排名第','差距分析','风险结论','指标矩阵']) { if (txt.includes(bad)) throw new Error('篮内出现结论类文案: ' + bad) } await panel.locator('.ent-compare-item-card__check').first().click({ timeout: 5000 }).catch(()=>{}); await panel.getByRole('button', { name: '发起分析' }).click({ timeout: 8000 }).catch(()=>{}); const modal = page.locator('.arco-modal:visible').filter({ hasText: '选择分析任务' }); if (await modal.count()) { const mt = await modal.first().innerText(); for (const bad of ['综合得分','雷达图','差距分析']) { if (mt.includes(bad)) throw new Error('任务浮层出现结论: ' + bad) } await modal.getByRole('button', { name: '取消' }).click().catch(()=>{}) }
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
