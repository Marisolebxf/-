id: FUNC-05395
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-05395
priority: P0
title: 产业页签列表搜索占位与行按钮
story: US-ENT-CMP-07
entry_id: shell-compare-basket
tier: A
preconditions:
  - 对比篮已打开
  - 产业页至少 1 个对象
locators:
  panel: .system-compare-panel
  industry_tab: '#compare-basket-tab-industry'
  search: placeholder 按产业或产业链名称搜索
steps:
  - action: goto
    target: /enterprise/search
  - action: click
    target: 打开对比篮
expect:
  - note: 前置：对比篮已打开，产业页至少 1 个对象
    assert: |-
      const hostPath = '/enterprise/search';
      if (!page.url().includes(hostPath)) throw new Error('未在宿主页: ' + page.url());
      const parseIndCount = (text) => {
        const m = (text || '').replace(/\s+/g, ' ').match(/产业[^\d]*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : null;
      };
      const openPanel = async () => {
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) return panel;
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (await dock.count()) await dock.first().click({ timeout: 10000 });
        else await page.getByRole('button', { name: /^对比篮$/ }).first().click({ timeout: 10000 });
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      const seedIndustryFromAdd = async (panel) => {
        const addBtn = panel.getByRole('button', { name: '新增' }).first();
        await addBtn.click({ timeout: 8000 });
        const modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        const search = modal.getByPlaceholder(/产业或产业链名称/).first();
        if (await search.count()) {
          await search.fill('电子');
          await page.waitForTimeout(400);
          const go = modal.getByRole('button', { name: /搜索|查询/ }).first();
          if (await go.count()) await go.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(1200);
        }
        let joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        if (!(await joinBtns.count())) throw new Error('ENV-SHELL-COMPARE-IND-ADD-001：新增弹层无「加入对比篮」');
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(700);
        const close = modal.getByRole('button', { name: '取消' }).first();
        if (await close.count()) await close.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      };
      let panel = await openPanel();
      let indTab = panel.locator('#compare-basket-tab-industry');
      await indTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      let indCount = parseIndCount(await indTab.innerText());
      let viewBtns = panel.getByRole('button', { name: '查看对象', exact: true });
      let nRows = await viewBtns.count();
      if ((indCount != null && indCount < 1) || nRows < 1) {
        await seedIndustryFromAdd(panel);
        panel = page.locator('.system-compare-panel');
        indTab = panel.locator('#compare-basket-tab-industry');
        await indTab.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        indCount = parseIndCount(await indTab.innerText());
        viewBtns = panel.getByRole('button', { name: '查看对象', exact: true });
        nRows = await viewBtns.count();
      }
      if (nRows < 1 && (indCount == null || indCount < 1)) {
        throw new Error('ENV-SHELL-COMPARE-IND-EMPTY-001：产业页至少 1 个对象');
      }
      await page.evaluate(() => sessionStorage.setItem('qa_func05395_indReady', '1'));
  - note: 区块标题为「篮内产业对象」
    assert: |-
      const panel = page.locator('.system-compare-panel');
      await expect(panel.getByText('篮内产业对象').first()).toBeVisible({ timeout: 8000 });
      const cls = (await panel.locator('#compare-basket-tab-industry').getAttribute('class')) || '';
      if (!/active/.test(cls)) throw new Error('产业页签未激活: ' + cls);
  - note: 搜索占位为「按产业或产业链名称搜索」
    assert: |-
      const panel = page.locator('.system-compare-panel');
      const search = panel.getByPlaceholder('按产业或产业链名称搜索');
      await expect(search.first()).toBeVisible({ timeout: 8000 });
      await expect(search.first()).toHaveAttribute('placeholder', '按产业或产业链名称搜索');
  - note: 行上有「查看对象」「移除」
    assert: |-
      const panel = page.locator('.system-compare-panel');
      const viewBtn = panel.getByRole('button', { name: '查看对象', exact: true }).first();
      await expect(viewBtn).toBeVisible({ timeout: 8000 });
      const row = viewBtn.locator('xpath=ancestor::div[contains(@class,"rounded")][1]');
      await expect(row.getByRole('button', { name: '移除', exact: true })).toBeVisible({ timeout: 8000 });
  - note: 对象旁标「产业」或「产业链」；底栏有「发起分析」「全选当前筛选结果」
    assert: |-
      const panel = page.locator('.system-compare-panel');
      const tags = panel.locator('.arco-tag').filter({ hasText: /^(产业|产业链)$/ });
      if (await tags.count() < 1) throw new Error('未见对象类型「产业」或「产业链」标签');
      const bar = panel
        .locator('[data-testid="compare-basket-action-bar"]')
        .filter({ hasNot: page.getByRole('button', { name: '加入招引候选' }) })
        .first();
      await bar.scrollIntoViewIfNeeded().catch(() => {});
      await expect(bar).toBeVisible({ timeout: 8000 });
      await expect(bar.getByRole('button', { name: '发起分析' })).toBeVisible({ timeout: 8000 });
      await expect(bar.getByText('全选当前筛选结果', { exact: true })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: catalog=app-shell#system-compare-basket；goto /enterprise/search。产业 Tab #compare-basket-tab-industry；IndustryCompareBasketPanel 标题「篮内产业对象」、搜索 placeholder、行按钮「查看对象」「移除」。scout 2026-10-14 产业 3~4/50。空篮经产业 Tab「新增」入篮（会改会话数据）。
