  - note: 2、含「业务语义」「更新时间」「当前时间状态」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('业务语义')).toBeVisible();
      await expect(main.getByText('更新时间')).toBeVisible();
      await expect(main.getByText('当前时间状态')).toBeVisible();
  - note: 3、业务语义为「暂无已发布关系说明」
    assert: |-
      await expect(page.getByText('暂无已发布关系说明')).toBeVisible();
