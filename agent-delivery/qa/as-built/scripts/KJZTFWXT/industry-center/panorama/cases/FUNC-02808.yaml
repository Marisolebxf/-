id: FUNC-02808
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02808
priority: P1
tier: B
title: 备选-选回所属产业链
entry_id: chain-panorama
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/panorama
  - action: evaluate
    note: 同册02807清空所属产业链后选回「半导体与集成电路」
expect:
  - note: 1、主标题恢复为「半导体与集成电路全景图谱」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      const hintClose = page.locator('.industry-topic-default-hint .arco-alert-close-btn');
      if (await hintClose.count()) {
        const hintVis = await hintClose.first().isVisible().catch(() => false);
        if (hintVis) await hintClose.first().click({ timeout: 3000 }).catch(() => {});
      }
      await expect(page).toHaveURL(/\/industry-center\/panorama/, { timeout: 15000 });
      const ctx = page.locator('[data-testid="panorama-analysis-context"]');
      await expect(ctx).toBeVisible({ timeout: 15000 });
      const read = async (loc) =>
        ((await loc.getAttribute('title')) || (await loc.innerText()) || '').replace(/\s+/g, ' ').trim();
      const chainField = ctx.locator('.arco-form-item').filter({ hasText: '所属产业链' }).first();
      await expect(chainField).toBeVisible({ timeout: 10000 });
      const chainView = chainField.locator('.arco-select-view').first();
      await expect(chainView).toBeVisible({ timeout: 8000 });
      const chainBefore = await read(chainView);
      if (!/半导体与集成电路/.test(chainBefore)) {
        throw new Error('前置：所属产业链非默认「半导体与集成电路」，现场=' + chainBefore);
      }
      await chainView.hover({ timeout: 8000 });
      const clearBtn = chainField.locator(
        '.arco-select-clear-icon, .arco-select-view-clear-btn, .arco-icon-hover[title="Close"]',
      ).first();
      if (!(await clearBtn.isVisible().catch(() => false))) {
        await chainView.click({ timeout: 8000 });
        await page.keyboard.press('Escape');
        await chainView.hover({ timeout: 8000 });
      }
      await expect(clearBtn).toBeVisible({ timeout: 8000 });
      await clearBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const chainEmpty = await read(chainView);
      if (/半导体与集成电路/.test(chainEmpty)) {
        throw new Error('前置：清空所属产业链失败，现场=' + chainEmpty);
      }
      await expect(page.locator('#panorama-workspace-title')).toHaveText('新一代信息技术全景图谱', {
        timeout: 10000,
      });
      await chainView.click({ timeout: 8000 });
      const dropdown = page.locator('.arco-select-dropdown:visible').last();
      await expect(dropdown).toBeVisible({ timeout: 10000 });
      await dropdown.locator('.arco-select-option').filter({ hasText: /^半导体与集成电路$/ }).first().click({
        timeout: 8000,
      });
      await page.waitForTimeout(800);
      await expect(page.locator('#panorama-workspace-title')).toHaveText('半导体与集成电路全景图谱', {
        timeout: 15000,
      });
  - note: 2、「开始分析」不再出现
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' })).toHaveCount(0, { timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
