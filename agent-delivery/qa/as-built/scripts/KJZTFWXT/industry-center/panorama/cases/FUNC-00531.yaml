id: FUNC-00531
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00531
priority: P0
title: 侧栏进入产业链全景图谱路由与页标题正确
entry_id: chain-panorama
tier: A
preconditions:
  - 系统可访问；已登录 admin
locators:
  menu_group: 侧栏分组「产业链分析」
  menu_leaf: 侧栏项「产业链全景图谱」（落点 /industry-center/panorama）
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 展开「产业链分析」并点「产业链全景图谱」；路由与页标题在 expect 判定
expect:
  - note: 地址路径为 /industry-center/panorama
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const leafItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^产业链全景图谱$/ });
      const expandChainGroup = async () => {
        if (await leafItem().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      await dismissBasket();
      await expandChainGroup();
      const leaf = leafItem();
      await expect(leaf.first()).toBeVisible({ timeout: 10000 });
      await leaf.first().click({ timeout: 10000 });
      await page.waitForURL(/\/industry-center\/panorama/, { timeout: 15000 });
      await expect(page).toHaveURL(/\/industry-center\/panorama/);
  - note: 浏览器标题以「产业链全景图谱」开头
    assert: |-
      await expect(page).toHaveTitle(/^产业链全景图谱/);
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: 路由 catalog_path /industry-center/panorama；侧栏类先 goto sibling /industry-center/search（overview 联调 404，不可用）再点 menu_leaf「产业链全景图谱」。侧栏项为 div.arco-menu-item；已展开时勿再点「产业链分析」标题以免折叠。现场 document.title 常为「产业链全景图谱 - 科技专题服务系统」，用例预期「以产业链全景图谱开头」用 ^ 前缀判定。主区 H1/筛选壳不在本条预期。对比篮可见才关。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
