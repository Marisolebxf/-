id: FUNC-02791
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02791
priority: P1
tier: B
title: 主流程-所属产业链选项
entry_id: chain-panorama
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/panorama
  - action: evaluate
    target: |-
      const chainItem = page
        .locator('main .arco-form-item')
        .filter({ has: page.getByText('所属产业链', { exact: true }) });
      await chainItem.locator('.arco-select-view').click();
      await page.locator('.arco-select-dropdown:visible').waitFor({ timeout: 10000 });
expect:
  - note: 1、选项共 6 个（名称见附录C）
    assert: |-
      const dropdown = page.locator('.arco-select-dropdown:visible');
      const options = dropdown.locator('.arco-select-option');
      await expect(options).toHaveCount(6);
      const appendixC = [
        '半导体与集成电路',
        '人工智能与应用',
        '新型网络与通信',
        '超高清视频与显示',
        '智能终端',
        '软件与信息服务',
      ];
      for (const name of appendixC) {
        await expect(options.filter({ hasText: name })).toHaveCount(1);
      }
      await expect(options.filter({ hasText: '工业互联网' })).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
