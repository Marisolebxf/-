id: FUNC-02807
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02807
priority: P1
tier: B
title: 备选-清空所属产业链
entry_id: chain-panorama
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/panorama
expect:
  - note: 1、所属产业链为空
    assert: |-
      const read = async (loc) =>
        ((await loc.getAttribute('title')) || (await loc.innerText()) || '').replace(/\s+/g, ' ').trim();
      await expect(page).toHaveURL(/\/industry-center\/panorama/, { timeout: 15000 });
      await page.waitForTimeout(2500);
      const ctx = page.locator('[data-testid="panorama-analysis-context"]');
      await expect(ctx).toBeVisible({ timeout: 15000 });
      const chainField = ctx.locator('.arco-form-item').filter({ hasText: '所属产业链' }).first();
      await expect(chainField).toBeVisible({ timeout: 10000 });
      const chainView = chainField.locator('.arco-select-view').first();
      await chainView.scrollIntoViewIfNeeded();
      const chainBefore = await read(chainView);
      if (!/半导体与集成电路/.test(chainBefore)) {
        throw new Error('前置：所属产业链非「半导体与集成电路」: ' + chainBefore);
      }
      await chainView.hover();
      const clearBtn = chainField.locator('.arco-select-clear-icon').first();
      await expect(clearBtn).toBeVisible({ timeout: 8000 });
      await clearBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      const chainAfter = await read(chainView);
      if (/半导体与集成电路/.test(chainAfter)) {
        throw new Error('清除后所属产业链仍有值: ' + chainAfter);
      }
      await expect(chainField.locator('input[placeholder="请选择产业链"]')).toBeVisible({ timeout: 5000 });
  - note: 2、主标题变为「新一代信息技术全景图谱」
    assert: |-
      await expect(page.locator('#panorama-workspace-title')).toHaveText('新一代信息技术全景图谱', {
        timeout: 10000,
      });
  - note: 3、出现「开始分析」
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
