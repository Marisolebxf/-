id: P1-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00544
priority: P1
title: 内部评审模式开启显追溯与角标、关闭后零泄漏
story: US-CHAIN-PANORAMA-04
entry_id: chain-panorama
preconditions:
- 顶部人设面板「内部评审模式」开关可用
locators:
  persona: button.persona-switch
  review: aria-label「内部评审模式」
  traces: 分析对象/产业链结构可视化/节点深度下钻与动态演进 需求追溯
steps:
- action: goto
  target: /industry-center/panorama
- action: click
  target: 人设面板→开/关内部评审模式
expect:
- note: 开启后页头与区块旁出现需求追溯按钮与口径提示角标
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/panorama', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(300) }; await page.locator('button.persona-switch').first().click(); await page.waitForTimeout(500); const sw = page.locator('[aria-label="内部评审模式"]'); await expect(sw).toBeVisible({ timeout: 8000 }); if ((await sw.getAttribute('aria-checked')) !== 'true') { await sw.click(); await page.waitForTimeout(600) }; await page.keyboard.press('Escape'); await page.waitForTimeout(400); for (const a of ['分析对象需求追溯','产业链结构可视化需求追溯','节点深度下钻与动态演进需求追溯']) await expect(page.locator(`[aria-label="${a}"]`)).toHaveCount(1, { timeout: 8000 }); await expect(page.locator('[aria-label*="Q062"], .perm-pending-badge').first()).toBeVisible({ timeout: 8000 })
- note: 角标提示为待甲方确认口径的临时默认值说明
  assert: |-
    const badge = page.locator('[aria-label*="口径待甲方确认"], [aria-label*="Q062"]').first(); const aria = await badge.getAttribute('aria-label'); if (!aria || !/待甲方确认|临时默认/.test(aria)) throw new Error('角标文案不符: ' + aria)
- note: 关闭后主区无追溯按钮、角标及内部编号字样
  assert: |-
    await page.locator('button.persona-switch').first().click(); await page.waitForTimeout(400); const sw = page.locator('[aria-label="内部评审模式"]'); if ((await sw.getAttribute('aria-checked')) === 'true') { await sw.click(); await page.waitForTimeout(600) }; await page.keyboard.press('Escape'); await page.waitForTimeout(400); if (await page.locator('[aria-label*="需求追溯"]').count()) throw new Error('关闭评审后仍有需求追溯按钮'); if (await page.locator('.perm-pending-badge, [aria-label*="Q062"]').count()) throw new Error('关闭评审后仍有口径角标'); const t = await page.locator('main').innerText(); for (const x of ['Q062','TRACE-','US-CHAIN','GAP-','metric_id']) { if (t.includes(x)) throw new Error('业务态泄漏: ' + x) }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 必须用 aria-label=内部评审模式（禁 first() 盲点，菜单内另有付费权益 switch）；操作前关对比篮减遮挡。
tier: B
