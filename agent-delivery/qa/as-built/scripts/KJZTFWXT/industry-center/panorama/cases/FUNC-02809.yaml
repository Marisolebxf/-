id: FUNC-02809
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02809
priority: P1
tier: B
title: 异常-开始分析未生成
entry_id: chain-panorama
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/panorama
expect:
  - note: 1、「数据截至」已改为「2026-10-18 · 当前状态」；2、「开始分析」可见
    assert: |-
      const ctx = page.locator('main [data-testid="panorama-analysis-context"]');
      await ctx.waitFor({ state: 'visible', timeout: 10000 });
      const closeHint = page.locator('main .industry-topic-default-hint .arco-alert-close-btn');
      if (await closeHint.count()) await closeHint.first().click().catch(() => {});
      const chainRow = ctx.locator('.policy-analysis-filter-row__field').filter({ hasText: '所属产业链' });
      const chainView = chainRow.locator('.arco-select-view');
      await chainView.hover();
      await page.waitForTimeout(300);
      const clearIcon = chainRow.locator('.arco-select-clear-icon');
      if (await clearIcon.isVisible().catch(() => false)) {
        await clearIcon.click({ timeout: 5000 });
        await page.waitForTimeout(400);
      }
      const asOfRow = ctx.locator('.policy-analysis-filter-row__field').filter({ hasText: '数据截至' });
      await asOfRow.locator('.arco-select-view').click();
      const opt = page.locator('.arco-select-dropdown .arco-select-option').filter({ hasText: '当前状态' }).first();
      await opt.waitFor({ state: 'visible', timeout: 8000 });
      await opt.click();
      await page.waitForTimeout(600);
      const asOfLabel = ((await asOfRow.locator('.arco-select-view').innerText()) || '').replace(/\s+/g, ' ').trim();
      if (!/·\s*当前状态/.test(asOfLabel)) throw new Error('数据截至未含当前状态: ' + asOfLabel);
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await start.click({ timeout: 8000, force: true });
      await page.waitForTimeout(500);
      const toast = page.locator('.arco-message, .arco-message-list').filter({ hasText: '尚未选择分析对象' });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
  - note: 2、页面仍为全景图谱，不出现「产业链全景图谱生成中」
    assert: |-
      await expect(page.locator('#panorama-workspace-title')).toBeVisible();
      await expect(page.getByText('产业链全景图谱生成中')).not.toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
