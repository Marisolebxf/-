id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00538
priority: P0
title: 动态演进三子块齐备且默认呈现最新快照
story: US-CHAIN-PANORAMA-04
entry_id: chain-panorama
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入页面；图谱已加载（默认秒开最新快照）
locators:
  evo: heading「动态演进」
  subs: .arco-radio-button「当前状态 / 状态对比 / 演进时间轴」
  snapshot: .arco-select-view title「最新快照」
  view_time: .arco-select-view title「YYYY-MM-DD · 当前状态」
steps:
  - action: goto
    target: /industry-center/panorama
  - action: evaluate
    note: 浏览动态演进构成与默认快照选中态
expect:
  - note: 区块含当前状态、状态对比、演进时间轴三子块
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/panorama', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible().catch(() => false)) { await cb.first().click().catch(() => {}); await page.waitForTimeout(300) }; await expect(page.getByRole('heading', { name: '动态演进' })).toBeVisible({ timeout: 8000 }); for (const n of ['当前状态', '状态对比', '演进时间轴']) { const r = page.locator('.arco-radio-button').filter({ hasText: new RegExp('^' + n + '$') }).first(); await expect(r).toBeVisible({ timeout: 8000 }) }
  - note: 快照列表含「最新快照」与「当前状态」条目
    assert: |-
      await expect(page.locator('.arco-select-view').filter({ hasText: '最新快照' }).first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view').filter({ hasText: '最新快照' }).first()).toHaveAttribute('title', '最新快照'); await expect(page.getByText(/\d{4}-\d{2}-\d{2} · 当前状态/).first()).toBeVisible({ timeout: 8000 }); const vt = page.locator('.arco-select-view').filter({ hasText: /\d{4}-\d{2}-\d{2} · 当前状态/ }).first(); await expect(vt).toBeVisible({ timeout: 8000 }); const title = (await vt.getAttribute('title')) || ''; if (!/\d{4}-\d{2}-\d{2} · 当前状态/.test(title)) throw new Error('查看时间 title 异常: ' + title)
  - note: 默认选中当前状态子块且数据截至为最新快照；无实时更新类声明
    assert: |-
      const cur = page.locator('.arco-radio-button').filter({ hasText: /^当前状态$/ }).first(); const cls = (await cur.getAttribute('class')) || ''; if (!cls.includes('arco-radio-checked')) throw new Error('默认未选中当前状态: ' + cls); await expect(page.locator('.arco-select-view').filter({ hasText: '最新快照' }).first()).toBeVisible({ timeout: 8000 }); const t = await page.locator('main').innerText(); if (/实时更新|实时同步刷新/.test(t)) throw new Error('出现实时更新类声明')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 三子块为 arco-radio-button；默认「当前状态」=arco-radio-checked；单快照时「状态对比/演进时间轴」=arco-radio-disabled（alert 提示，仍算齐备可见）。查看时间 Select title 形如「2026-10-13 · 当前状态」（日期以现场为准）。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
