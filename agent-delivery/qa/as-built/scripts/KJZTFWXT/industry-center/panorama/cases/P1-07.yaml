id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00545
priority: P1
title: 清空产业选择后保持空态且不静默写回默认推荐
story: US-CHAIN-PANORAMA-01
entry_id: chain-panorama
preconditions:
- 已进入页面；产业已选任一值
locators:
  cluster: aria-label「集群」
  clear: arco-select-clear-icon
steps:
- action: goto
  target: /industry-center/panorama
- action: evaluate
  note: hover 集群→点清除；核对不写回默认
expect:
- note: 产业条件置空后页面保持空态
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/panorama', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(300) }; const cluster = page.locator('.arco-select-view[aria-label="集群"]').first(); await cluster.hover(); await page.waitForTimeout(300); const clear = page.locator('.arco-select-view[aria-label="集群"] .arco-select-clear-icon, .arco-select[aria-label="集群"] .arco-icon-close, .arco-select-clear-icon'); if (!(await clear.count())) throw new Error('SKIP: 集群无清除图标'); await clear.first().click({ force: true }); await page.waitForTimeout(1000); const title = await cluster.getAttribute('title'); if (title && title.includes('新一代信息技术')) throw new Error('清空后仍显示默认集群'); await expect(page.getByText(/选择分析对象|请先选择|条件已修改|全景图谱/).first()).toBeVisible({ timeout: 8000 })
- note: 不静默写回默认推荐产业
  assert: |-
    await page.waitForTimeout(1500); const title = await page.locator('.arco-select-view[aria-label="集群"]').getAttribute('title'); if (title === '新一代信息技术') throw new Error('静默写回默认推荐产业'); const t = await page.locator('main').innerText(); if (/条件已修改/.test(t) && !t.includes('开始分析')) { /* 脏标提示须显式分析，符合 I2-12 */ }
allow_skip: 集群无清除控件时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: I2-12 下清空后图谱可能仍显示上次已应用结果（非静默写回筛选）；空态指筛选条件，不以旧图谱消失为唯一判据。
tier: B
