id: P1-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00542
priority: P1
title: 复合环节 L1 子链展开与返回
story: US-CHAIN-PANORAMA-03
entry_id: chain-panorama
preconditions:
- 已进入页面；图谱已加载
locators:
  drill: 下钻内部结构
steps:
- action: goto
  target: /industry-center/panorama
- action: evaluate
  note: 定位复合节点下钻入口；无则 SKIP
expect:
- note: 复合节点提供下钻内部结构动作且子链级呈现子级节点与关系
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/panorama', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(300) }; await page.getByText('结构列表', { exact: true }).click(); await page.waitForTimeout(700); const drill = page.getByText('下钻内部结构'); if (!(await drill.count())) throw new Error('SKIP: 未见下钻内部结构入口（本轮无稳定复合节点）'); await drill.first().click(); await page.waitForTimeout(1000); const t = await page.locator('main').innerText(); if (!/环节|关系|节点/.test(t)) throw new Error('子链级未见节点/关系')
- note: 返回后恢复该节点选中、高亮、详情与原视口
  assert: |-
    const back = page.getByText(/返回上级|返回/); if (!(await back.count())) throw new Error('SKIP: 无返回上级'); await back.first().click(); await page.waitForTimeout(800); await expect(page.getByText(/关联企业|主流技术路线|全景图谱/).first()).toBeVisible({ timeout: 8000 })
- note: 无子结构的叶子环节不提供下钻入口
  assert: |-
    await page.getByText('光刻胶配套（空节点）', { exact: false }).first().click().catch(()=>{}); await page.waitForTimeout(500); const t = await page.locator('main').innerText(); if (t.includes('下钻内部结构') && t.includes('光刻胶配套')) { /* 若叶子仍有入口记缺陷，不发明通过 */ }
  manual: true
allow_skip: 现场无「下钻内部结构」稳定入口时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 本轮结构列表/详情未稳定见到「下钻内部结构」；复合节点集合 observed。
tier: B
