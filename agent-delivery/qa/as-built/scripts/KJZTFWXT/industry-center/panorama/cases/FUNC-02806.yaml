id: FUNC-02806
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02806
priority: P1
title: 改数据截至后出现开始分析且图谱仍为上次结果
story: US-CHAIN-PANORAMA-01
entry_id: chain-panorama
tier: A
preconditions:
  - 筛选为默认已选
  - 画布可见「集成电路设计」
locators:
  data_as_of_input: 'input[placeholder="请选择数据截至"]'
  dirty_banner: 条件已修改…开始分析
  start_analysis: button「开始分析」
steps:
  - action: goto
    target: /industry-center/panorama
  - action: evaluate
    note: 展开数据截至并选「2026-10-18 · 当前状态」；脏标与画布在 expect 判定
expect:
  - note: 前置：默认已选且图谱画布可见环节「集成电路设计」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const read = async (loc) =>
        ((await loc.getAttribute('title')) || (await loc.innerText()) || '').replace(/\s+/g, ' ').trim();
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/panorama/, { timeout: 15000 });
      await page.waitForTimeout(2500);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业链全景图谱 SPA 404 ' + page.url());
      }
      if (!bodyGate.trim()) {
        throw new Error('ENV-EDU-TTS-SVCZ-BLANK-001: 页面 body 空白 ' + page.url());
      }
      const ctx = page.locator('[data-testid="panorama-analysis-context"]');
      await expect(ctx).toBeVisible({ timeout: 15000 });
      const objectSelects = ctx.locator('.industry-cluster-select .arco-select-view');
      if ((await objectSelects.count()) < 2) throw new Error('前置：分析对象下拉不足 2 个');
      const left = await read(objectSelects.nth(0));
      const right = await read(objectSelects.nth(1));
      if (!/新一代信息技术/.test(left) || !/新一代信息技术/.test(right)) {
        throw new Error('前置：分析对象非默认已选 left=' + left + ' right=' + right);
      }
      const chain = ctx.locator('.industry-catalog-select .arco-select-view, .industry-catalog-select').first();
      const chainVal = await read(chain);
      if (!/半导体与集成电路/.test(chainVal)) {
        throw new Error('前置：所属产业链非默认已选: ' + chainVal);
      }
      const asOfInput = ctx.locator('input[placeholder="请选择数据截至"]').first();
      const snapView = asOfInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
      const snapVal = await read(snapView);
      if (!/最新快照/.test(snapVal)) {
        throw new Error('前置：数据截至非默认「最新快照」: ' + snapVal);
      }
      const graphRadio = page.locator('.arco-radio-button').filter({ hasText: /^图谱$/ }).first();
      await expect(graphRadio).toBeVisible({ timeout: 8000 });
      const graphCls = (await graphRadio.getAttribute('class')) || '';
      if (!graphCls.includes('arco-radio-checked')) {
        await page.getByText('图谱', { exact: true }).click();
        await page.waitForTimeout(500);
      }
      await expect(page.locator('canvas').first()).toBeVisible({ timeout: 10000 });
      await page.getByText('结构列表', { exact: true }).click();
      await page.waitForTimeout(600);
      await expect(page.getByText('集成电路设计').first()).toBeVisible({ timeout: 8000 });
      await page.getByText('图谱', { exact: true }).click();
      await page.waitForTimeout(400);
      globalThis.__func02806_ready = true;
  - note: 1、出现「开始分析」；2、警告含「条件已修改」且说明图谱仍为上次已应用结果
    assert: |-
      if (!globalThis.__func02806_ready) throw new Error('前置：默认筛选或画布环节未就绪');
      const DIRTY = '条件已修改，图谱仍为上次已应用结果。确认后请点「开始分析」。';
      const wantSnap = '2026-10-18 · 当前状态';
      const ctx = page.locator('[data-testid="panorama-analysis-context"]');
      const asOfInput = ctx.locator('input[placeholder="请选择数据截至"]').first();
      const snapView = asOfInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
      await snapView.scrollIntoViewIfNeeded();
      await snapView.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible');
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opt = pop.locator('.arco-select-option').filter({ hasText: wantSnap }).first();
      if (!(await opt.count())) {
        const labels = await pop.locator('.arco-select-option').allTextContents();
        throw new Error('数据截至缺少「' + wantSnap + '」，现场: ' + JSON.stringify(labels));
      }
      await opt.click();
      await page.waitForTimeout(800);
      const start = page.getByRole('button', { name: '开始分析' });
      await expect(start.first()).toBeVisible({ timeout: 8000 });
      await expect(start.first()).toBeEnabled({ timeout: 8000 });
      const mainText = ((await page.locator('main').innerText()) || '').replace(/\s+/g, ' ');
      if (!/条件已修改/.test(mainText)) {
        throw new Error('警告未含「条件已修改」，main 摘要: ' + mainText.slice(0, 200));
      }
      if (!/上次已应用结果|仍为上次/.test(mainText)) {
        throw new Error('警告未说明图谱仍为上次已应用结果，main 摘要: ' + mainText.slice(0, 200));
      }
      const alert = page.locator('.arco-alert').filter({ hasText: /条件已修改/ }).first();
      if (await alert.count()) {
        await expect(alert).toContainText(/条件已修改/, { timeout: 5000 });
      }
  - note: 3、画布仍可见「集成电路设计」（上次已应用图谱未清）
    assert: |-
      if (!globalThis.__func02806_ready) throw new Error('前置：未完成改数据截至');
      await expect(page.locator('canvas').first()).toBeVisible({ timeout: 8000 });
      await page.getByText('结构列表', { exact: true }).click();
      await page.waitForTimeout(600);
      await expect(page.getByText('集成电路设计').first()).toBeVisible({ timeout: 8000 });
      await expect(
        page.getByText(/当前产业链图谱包含 \d+ 个链位环节和 \d+ 条关系，按上游、中游、下游展示/),
      ).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/panorama；I2-12 脏条件：改 data_as_of 从「最新快照」→「2026-10-18 · 当前状态」
  （panorama-analysis-context 内 placeholder=请选择数据截至 的 .arco-select-view，同 FUNC-02792）。
  脏标文案=testdata page.dirty_banner；须显式「开始分析」enabled。画布 G6 不可 OCR，环节「集成电路设计」借结构列表对照（同 FUNC-00535）。
  对比篮可见才关。登录与关内部评审由 runner 前置。A 档零 allow_skip。
  2026-10-20 edu.itic-sci.com/tts/svcz 机跑未见 analysis-context（同批 02788），ledger blocked 待环境恢复复跑。
