id: FUNC-02806
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02806
priority: P1
tier: B
title: 备选-修改数据截至
entry_id: chain-panorama
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/panorama
expect:
  - note: 前置：筛选为默认已选，画布可见「集成电路设计」
    assert: |-
      await expect(page).toHaveURL(/\/industry-center\/panorama/, { timeout: 15000 });
      await page.waitForTimeout(2000);
      const ctx = page.locator('[data-testid="panorama-analysis-context"]');
      await expect(ctx).toBeVisible({ timeout: 15000 });
      const ctxText = ((await ctx.innerText()) || '').replace(/\s+/g, ' ');
      if (!/新一代信息技术/.test(ctxText)) throw new Error('前置：分析对象非默认');
      if (!/半导体与集成电路/.test(ctxText)) throw new Error('前置：所属产业链非默认');
      if (!/最新快照/.test(ctxText)) throw new Error('前置：数据截至非「最新快照」');
      await page.getByText('图谱', { exact: true }).click();
      await page.waitForTimeout(400);
      await expect(page.locator('canvas').first()).toBeVisible({ timeout: 10000 });
      await page.getByText('结构列表', { exact: true }).click();
      await page.waitForTimeout(500);
      await expect(page.getByText('集成电路设计').first()).toBeVisible({ timeout: 8000 });
      await page.getByText('图谱', { exact: true }).click();
      await page.waitForTimeout(400);
  - note: 1、出现「开始分析」
    assert: |-
      const wantSnap = '2026-10-19 · 当前状态';
      const ctx = page.locator('[data-testid="panorama-analysis-context"]');
      const asOfInput = ctx.locator('input[placeholder="请选择数据截至"]').first();
      const snapView = asOfInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
      await snapView.scrollIntoViewIfNeeded();
      await snapView.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible');
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opt = pop.locator('.arco-select-option').filter({ hasText: wantSnap }).first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      await opt.click();
      await page.waitForTimeout(800);
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeEnabled({ timeout: 8000 });
  - note: 2、警告写明图谱仍为上次已应用结果
    assert: |-
      const mainText = ((await page.locator('main').innerText()) || '').replace(/\s+/g, ' ');
      if (!/条件已修改/.test(mainText)) {
        throw new Error('警告未含「条件已修改」: ' + mainText.slice(0, 240));
      }
      if (!/仍为上次已应用结果|上次已应用结果/.test(mainText)) {
        throw new Error('警告未说明图谱仍为上次已应用结果: ' + mainText.slice(0, 240));
      }
  - note: 3、画布仍可见「集成电路设计」
    assert: |-
      await page.getByText('图谱', { exact: true }).click();
      await page.waitForTimeout(600);
      await expect(page.locator('canvas').first()).toBeVisible({ timeout: 10000 });
      await page.getByText('结构列表', { exact: true }).click();
      await page.waitForTimeout(500);
      await expect(page.getByText('集成电路设计').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
