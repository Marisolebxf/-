id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00539
priority: P1
title: 切换历史快照后图谱按所选快照呈现
story: US-CHAIN-PANORAMA-04
entry_id: chain-panorama
preconditions:
- 快照列表含至少两个条目
locators:
  snapshot: 最新快照下拉
steps:
- action: goto
  target: /industry-center/panorama
- action: evaluate
  note: 展开快照列表；若仅一条则 SKIP
expect:
- note: 图谱与结构摘要按所选快照呈现
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/panorama', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(300) }; const snap = page.locator('.arco-select-view').filter({ hasText: '最新快照' }).first(); await snap.click(); await page.waitForTimeout(500); const opts = page.locator('.arco-trigger-popup:visible .arco-select-option'); const n = await opts.count(); if (n < 2) { await page.keyboard.press('Escape'); throw new Error('SKIP: 快照不足两条，无法切换') }; await opts.nth(1).click(); await page.waitForTimeout(1500); await expect(page.getByText(/当前产业链图谱包含 \d+ 个链位环节|条件已修改|全景图谱/).first()).toBeVisible({ timeout: 8000 })
- note: 快照选中态回显当前选择
  assert: |-
    const t = await page.locator('main').innerText(); if (!/当前状态|最新快照|\d{4}-\d{2}-\d{2}/.test(t)) throw new Error('快照选中态未见回显')
allow_skip: 仅一个已发布快照时 Pass-N/A（本轮单快照）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘「当前产业链仅有一个已发布时间状态」；对比/时间轴 disabled；本条预期常走 allow_skip。
tier: B
