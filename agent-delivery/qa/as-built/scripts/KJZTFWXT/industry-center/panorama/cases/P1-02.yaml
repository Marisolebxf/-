id: P1-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00540
priority: P1
title: 图谱与结构列表互斥切换且切回后结构保留
story: US-CHAIN-PANORAMA-02
entry_id: chain-panorama
preconditions:
- 已进入页面且图谱已加载
locators:
  graph: 图谱
  list: 结构列表
steps:
- action: goto
  target: /industry-center/panorama
- action: click
  target: 结构列表
- action: click
  target: 图谱
expect:
- note: 两视图互斥，同一时刻仅一态呈现
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/panorama', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(300) }; await page.getByText('结构列表', { exact: true }).click(); await page.waitForTimeout(700); const checked = page.locator('.arco-radio-button.arco-radio-checked'); await expect(checked.filter({ hasText: '结构列表' })).toHaveCount(1); await expect(page.locator('.arco-radio-button.arco-radio-checked').filter({ hasText: /^图谱$/ })).toHaveCount(0)
- note: 结构列表以列表形式展示当前发布结构，环节数与图谱口径一致
  assert: |-
    await expect(page.getByText('环节').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('关系').first()).toBeVisible({ timeout: 8000 }); const sum = (await page.locator('main').innerText()).match(/当前产业链图谱包含 (\d+) 个链位环节/); if (sum && Number(sum[1]) < 1) throw new Error('摘要环节数异常')
- note: 进入结构列表后演进控件与变化标识不呈现
  assert: |-
    const t = await page.locator('main').innerText(); if (t.includes('动态演进') && t.includes('演进时间轴')) throw new Error('结构列表仍见演进控件'); if (await page.locator('[aria-label="放大"]').count()) throw new Error('结构列表仍见图控放大')
- note: 切回图谱后结构呈现与选中态保留
  assert: |-
    await page.getByText('图谱', { exact: true }).click(); await page.waitForTimeout(700); await expect(page.locator('canvas').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('heading', { name: /全景图谱/ })).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/当前产业链图谱包含 \d+ 个链位环节/)).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 结构性检查 4 点；列表列构成 observed。
tier: B
