id: FUNC-02890
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02890
priority: P1
tier: B
title: 主流程-当天复用
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 02888 首次完成分析并准备当天复用前置（判定在 expect）
expect:
  - note: 1、提示「今日已分析过相同条件，已打开结果」
    assert: |-
      const main = () => page.locator('main').first();
      const pickSelect = async (ariaLabel, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const box = main().locator('.industry-cluster-select').first();
        const trigger = box.locator(`.arco-select-view[aria-label="${ariaLabel}"]`).first();
        await trigger.scrollIntoViewIfNeeded();
        await trigger.click({ timeout: 12000 });
        await page.waitForTimeout(600);
        const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible').last();
        const opt = popup.locator('.arco-select-option').filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 12000 });
        await opt.click({ timeout: 12000 });
        await page.waitForTimeout(500);
      };
      const pickCycleConfig = async () => {
        await pickSelect('集群', '新一代信息技术');
        await pickSelect('产业', '半导体与集成电路');
        const timeTrigger = main().locator('.diagnosis-config-identity .arco-select-view').first();
        await timeTrigger.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const timePopup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible').last();
        await timePopup.locator('.arco-select-option').filter({ hasText: '近5年' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(300);
        const marketRow = main().locator('tr').filter({ hasText: '市场规模' }).first();
        const marketInput = marketRow.locator('input').first();
        await marketInput.scrollIntoViewIfNeeded();
        await marketInput.click();
        await marketInput.fill('');
        await marketInput.fill('88000');
        await page.waitForTimeout(200);
      };
      const failHint = () => main().getByText(/ADS_SERIES_UNAVAILABLE|分析生成失败|任务失败|本次分析生成失败/);
      const reuseToast = () => page.locator('.arco-message').filter({ hasText: '今日已分析过相同条件，已打开结果' });
      const openResultFromProcess = async () => {
        if (await reuseToast().first().isVisible({ timeout: 3000 }).catch(() => false)) {
          return;
        }
        if (await failHint().first().isVisible({ timeout: 3000 }).catch(() => false)) {
          throw new Error('ENV-CYCLE-ANALYSIS-FAIL: 分析未成功，无法测当天复用');
        }
        if (await page.getByRole('heading', { name: '产业周期分析结果' }).isVisible({ timeout: 3000 }).catch(() => false)) {
          return;
        }
        const done = page.getByText('分析结果已生成');
        if (await done.isVisible({ timeout: 120000 }).catch(() => false)) {
          await page.getByRole('button', { name: '查看分析结果' }).click({ timeout: 15000 });
        } else if (await page.getByText('产业周期分析生成中').isVisible({ timeout: 5000 }).catch(() => false)) {
          if (await failHint().first().isVisible({ timeout: 120000 }).catch(() => false)) {
            throw new Error('ENV-CYCLE-ANALYSIS-FAIL: 过程页失败');
          }
          await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 120000 });
          await page.getByRole('button', { name: '查看分析结果' }).click({ timeout: 15000 });
        }
        await expect(page.getByRole('heading', { name: '产业周期分析结果' })).toBeVisible({ timeout: 20000 });
      };
      const readTaskId = async () => {
        const text = await main().innerText();
        const m = text.match(/任务 ID[：:\s]+([A-Z0-9-]+)/i);
        if (!m) throw new Error('未读到任务 ID');
        return m[1];
      };
      const countHistoryRows = async () => {
        await page.locator('.industry-workspace-tabs').getByText('诊断记录', { exact: true }).click({ timeout: 10000 });
        await expect(main().getByRole('heading', { name: '诊断记录' })).toBeVisible({ timeout: 15000 });
        await page.waitForTimeout(800);
        return main().locator('.arco-table-body .arco-table-tr').count();
      };

      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 15000 });
      await pickCycleConfig();
      await page.getByRole('button', { name: '开始分析' }).click({ timeout: 10000 });
      await openResultFromProcess();
      const firstTaskId = await readTaskId();
      await page.getByRole('button', { name: '按此配置新建分析' }).click({ timeout: 15000 });
      await expect(main().getByRole('heading', { name: '分析配置' })).toBeVisible({ timeout: 15000 });
      const historyBefore = await countHistoryRows();
      await page.locator('.industry-workspace-tabs').getByText('产业周期分析', { exact: true }).click({ timeout: 10000 });
      await expect(main().getByRole('heading', { name: '分析配置' })).toBeVisible({ timeout: 15000 });
      await pickCycleConfig();
      await page.getByRole('button', { name: '开始分析' }).click({ timeout: 10000 });
      await openResultFromProcess();
      globalThis.__func02890 = { firstTaskId, historyBefore };
      await expect(reuseToast().first()).toBeVisible({ timeout: 15000 });
  - note: 2、打开的是已有任务的结果页
    assert: |-
      if (!globalThis.__func02890) throw new Error('前置：未完成当天复用点击');
      await expect(page.getByRole('heading', { name: '产业周期分析结果' })).toBeVisible({ timeout: 20000 });
      const main = () => page.locator('main').first();
      const text = await main().innerText();
      const m = text.match(/任务 ID[：:\s]+([A-Z0-9-]+)/i);
      if (!m || m[1] !== globalThis.__func02890.firstTaskId) {
        throw new Error(`任务 ID 不一致：期望 ${globalThis.__func02890.firstTaskId} 实际 ${m?.[1] ?? '无'}`);
      }
  - note: 3、诊断记录不新增任务
    assert: |-
      if (!globalThis.__func02890) throw new Error('前置：未完成当天复用点击');
      const main = () => page.locator('main').first();
      await page.locator('.industry-workspace-tabs').getByText('诊断记录', { exact: true }).click({ timeout: 10000 });
      await expect(main().getByRole('heading', { name: '诊断记录' })).toBeVisible({ timeout: 15000 });
      await page.waitForTimeout(800);
      const after = await main().locator('.arco-table-body .arco-table-tr').count();
      if (after !== globalThis.__func02890.historyBefore) {
        throw new Error(`诊断记录条数变化：复用前 ${globalThis.__func02890.historyBefore} 复用后 ${after}`);
      }
on_fail: 截图 + 抄 X-Trace-Id
