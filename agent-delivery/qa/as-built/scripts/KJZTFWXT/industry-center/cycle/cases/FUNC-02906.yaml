id: FUNC-02906
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02906
priority: P0
title: 诊断记录表头与类型列正确
story: US-CHAIN-DIAG-07
entry_id: chain-cycle
tier: A
preconditions:
  - 已打开产业周期分析
locators:
  records_tab: tab「诊断记录」
  status_filter: 任务状态
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 点「诊断记录」Tab，表头与类型列在 expect
expect:
  - note: 前置：产业周期分析页可见并已切到「诊断记录」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const route = '/industry-center/diagnosis?workspace=cycle&tab=cycle';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      await dismissBasket();
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      globalThis.__func02906 = { recordsReady: true };
  - note: 1、表头为任务、类型、状态、创建时间、操作
    assert: |-
      if (!globalThis.__func02906?.recordsReady) throw new Error('前置：诊断记录 Tab 未打开');
      const main = page.locator('main.content-shell-layout, main').first();
      const headerText = await main.locator('thead, .arco-table-header').first().innerText().catch(() => '');
      const required = ['任务', '类型', '状态', '创建时间', '操作'];
      const missing = required.filter((h) => !headerText.includes(h));
      if (missing.length) {
        throw new Error('表头缺列：' + missing.join('、') + '；thead=' + headerText.replace(/\s+/g, ' ').slice(0, 200));
      }
      const body = await main.innerText().catch(() => '');
      if (!/任务状态|全部状态/.test(body)) {
        throw new Error('诊断记录区未见「任务状态」筛选');
      }
      if (/分析对象|对象筛选|时间筛选|创建时间范围/.test(body)) {
        throw new Error('现场出现用例未声明的对象/时间筛选（备注：仅任务状态）');
      }
  - note: 2、类型列出现「产业周期分析」
    assert: |-
      if (!globalThis.__func02906?.recordsReady) throw new Error('前置：诊断记录 Tab 未打开');
      const main = page.locator('main.content-shell-layout, main').first();
      const body = await main.innerText().catch(() => '');
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const hasTaskRow = TID_RE.test(body) || (await main.getByRole('button', { name: '查看结果' }).count()) > 0;
      if (!hasTaskRow && !/暂无|无记录|空/.test(body)) {
        throw new Error('ENV-CHAIN-CYCLE-NO-RECORDS-001：诊断记录未见历史任务行');
      }
      if (!/产业周期分析/.test(body)) {
        throw new Error('类型列未见「产业周期分析」');
      }
      const typeCells = main.locator('tbody tr, .arco-table-tr').filter({ hasText: '产业周期分析' });
      if ((await typeCells.count()) < 1 && hasTaskRow) {
        throw new Error('表格行内未见类型「产业周期分析」');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle。步骤=点 Tab「诊断记录」（非侧栏）。
  用例备注：筛选仅「任务状态」，无对象/时间筛选（机检扫 main 文案防回归）。作废 00558 的对象/类型/时间筛选预期不对齐现场。
  空列表→ENV-CHAIN-CYCLE-NO-RECORDS-001。登录关评审 runner 前置。A 档零 allow_skip。
