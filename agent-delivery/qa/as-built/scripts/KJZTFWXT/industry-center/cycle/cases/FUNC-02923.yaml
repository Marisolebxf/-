id: FUNC-02923
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02923
priority: P1
title: 诊断记录删除取消后任务仍在列表
story: US-CHAIN-DIAG-07
entry_id: chain-cycle
tier: B
preconditions:
  - 诊断记录至少有一条任务（assert 自含）
locators:
  records_tab: tab「诊断记录」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 诊断记录→任一带「删除」行→弹框「取消」；任务仍在列表
expect:
  - note: 前置并点取消关闭删除弹框
    assert: |-
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main.content-shell-layout, main').first();
      const recordsSection = () => main().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
      const recordsTable = () => recordsSection().locator('.arco-table').first();
      const recordsPagination = () => recordsSection().locator('.arco-pagination').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const scrollRecordActions = async () => {
        const bodies = recordsSection().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const readTotalFromPagination = async () => {
        const pg = recordsPagination();
        if (!(await pg.count()) || !(await pg.isVisible().catch(() => false))) return null;
        const t = (await pg.innerText().catch(() => '')).replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const pickDeletableRow = async () => {
        await scrollRecordActions();
        const rows = recordsTable().locator('tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
          if (!TID_RE.test(rowText)) continue;
          if (!/产业周期分析/.test(rowText)) continue;
          let del = row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
          if (!(await del.count())) del = row.getByRole('button', { name: '删除', exact: true }).last();
          if (!(await del.count())) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollRecordActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          const tidM = rowText.match(TID_RE);
          if (!tidM) continue;
          return { del, tid: tidM[0] };
        }
        return null;
      };
      const pickWithPagination = async () => {
        for (let guard = 0; guard < 20; guard++) {
          const hit = await pickDeletableRow();
          if (hit) return hit;
          const pag = recordsPagination();
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=cycle/);
      await expect(page).toHaveURL(/tab=cycle/);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-ENTRY-UNREACHABLE: 产业周期分析 SPA 404 ' + page.url());
      }
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await expect(recordsSection()).toBeVisible({ timeout: 8000 });
      const recBody = await recordsSection().innerText().catch(() => '');
      if (!TID_RE.test(recBody) && !/暂无|无记录/.test(recBody)) {
        throw new Error('ENV-CHAIN-CYCLE-NO-RECORDS-001：诊断记录未见 CHAIN 任务行');
      }
      const totalBefore = await readTotalFromPagination();
      if (totalBefore == null || totalBefore < 1) {
        throw new Error('ENV-CHAIN-CYCLE-PAGINATION-001：诊断记录分页未展示「共 N 条」或条数为 0');
      }
      const picked = await pickWithPagination();
      if (!picked) {
        throw new Error('环境闸门 ENV-CHAIN-CYCLE-NO-DELETABLE-001：诊断记录无带「删除」的任务行（前置 1 不满足）');
      }
      globalThis.__func02923 = { tid: picked.tid, totalBefore, cancelled: false };
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      await expect(modal.getByText('删除分析记录', { exact: false }).first()).toBeVisible({ timeout: 5000 });
      const modalBody = (await modal.innerText().catch(() => '')).replace(/\s+/g, ' ');
      if (!/不再显示|列表/.test(modalBody)) {
        throw new Error('弹框文案未说明删除后列表不再显示：' + modalBody.slice(0, 120));
      }
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      const okBtn = modal.getByRole('button', { name: '确定', exact: true });
      await expect(okBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 15000 });
      globalThis.__func02923.cancelled = true;
  - note: 1、弹框标题为「删除分析记录」；2、文案写明删除后列表不再显示；3、该任务编号仍在列表中
    assert: |-
      if (!globalThis.__func02923?.cancelled) throw new Error('前置：未完成删除取消');
      const expectedTid = globalThis.__func02923.tid;
      const totalBefore = globalThis.__func02923.totalBefore;
      const recordsSection = () =>
        page.locator('main.content-shell-layout, main').first().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
      const recordsPagination = () => recordsSection().locator('.arco-pagination').first();
      const readTotalFromPagination = async () => {
        const pg = recordsPagination();
        if (!(await pg.count()) || !(await pg.isVisible().catch(() => false))) return null;
        const t = (await pg.innerText().catch(() => '')).replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const esc = expectedTid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const bodyAfter = (await recordsSection().innerText().catch(() => '')).replace(/\s+/g, ' ');
      if (!new RegExp(esc).test(bodyAfter)) {
        throw new Error('取消删除后任务编号不在诊断记录：' + expectedTid);
      }
      const rowStill = recordsSection().locator('tbody tr, .arco-table-tr').filter({ hasText: expectedTid });
      await expect(rowStill.first()).toBeVisible({ timeout: 8000 });
      const totalAfter = await readTotalFromPagination();
      if (totalAfter == null) {
        throw new Error('ENV-CHAIN-CYCLE-PAGINATION-001：取消后分页未展示「共 N 条」');
      }
      if (totalAfter !== totalBefore) {
        throw new Error('取消删除后列表条数变化：前=' + totalBefore + ' 后=' + totalAfter + ' tid=' + expectedTid);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle；诊断记录 Tab→任一带「删除」行→Modal「删除分析记录」→「取消」→任务 CHAIN 编号仍在、共 N 条不变。非破坏性；确定路径归 02924。登录关评审 runner 前置。B 档零 allow_skip。
