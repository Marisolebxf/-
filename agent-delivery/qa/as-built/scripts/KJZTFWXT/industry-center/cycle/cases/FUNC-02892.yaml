id: FUNC-02892
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02892
priority: P0
title: 集群下拉给出全部集群选项
story: US-CHAIN-DIAG-01
entry_id: chain-cycle
tier: A
preconditions:
  - 已打开产业周期分析
locators:
  cluster: .arco-select-view[aria-label="集群"]
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 侧栏进入产业周期分析后展开集群下拉；选项个数与附录 A 在 expect 判定
expect:
  - note: 前置：产业周期分析页可见且集群下拉可点
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const leafItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^产业周期分析$/ });
      const expandChainGroup = async () => {
        if (await leafItem().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterCyclePage = async () => {
        await dismissBasket();
        await expandChainGroup();
        const leaf = leafItem();
        await expect(leaf.first()).toBeVisible({ timeout: 10000 });
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=cycle/);
        await expect(page).toHaveURL(/tab=cycle/);
      };
      await enterCyclePage();
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      const cluster = page.locator('.arco-select-view[aria-label="集群"]').first();
      await expect(cluster).toBeVisible({ timeout: 8000 });
      globalThis.__func02892_onPage = true;
  - note: 1、选项共 15 个，名称见附录 A
    assert: |-
      if (!globalThis.__func02892_onPage) throw new Error('前置：未打开产业周期分析');
      const want = [
        '新一代信息技术',
        '生物产业',
        '新能源',
        '新材料',
        '高端装备',
        '智能网联新能源汽车',
        '绿色环保',
        '低空经济与空天',
        '传统与创意产业',
        '海洋产业',
        '未来制造（智能机器人）',
        '未来信息（光载信息、AI 底层生态）',
        '未来能源',
        '未来空间',
        '未来健康（合成生物、细胞基因、脑机工程）',
      ];
      const cluster = page.locator('.arco-select-view[aria-label="集群"]').first();
      await cluster.scrollIntoViewIfNeeded();
      await page.keyboard.press('Escape').catch(() => {});
      await cluster.click({ timeout: 8000 });
      await page.waitForTimeout(450);
      const pop = page.locator('.arco-trigger-popup:visible, .arco-select-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const count = await options.count();
      const got = [];
      for (let i = 0; i < count; i++) {
        got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      if (count !== 15) {
        throw new Error('集群选项应为 15 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error(
            '集群选项顺序/文案不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got),
          );
        }
      }
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·edu tts/svcz catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle；入口对齐 entry-seed：先 goto sibling /industry-center/search 再侧栏「产业链分析」→「产业周期分析」（深链 SPA 404 时仍可用侧栏落点）。用例「分析对象左侧下拉」= aria-label「集群」。15 项对齐用例册附录 A（02892）。点法 P7。登录关评审 runner 前置。A 档零 allow_skip。
