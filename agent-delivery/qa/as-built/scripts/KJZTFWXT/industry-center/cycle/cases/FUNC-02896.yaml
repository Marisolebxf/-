id: FUNC-02896
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02896
priority: P0
title: 市场增长率加减步进改值
story: US-CHAIN-DIAG-01
entry_id: chain-cycle
tier: A
preconditions:
  - 产业周期分析页默认态，市场增长率为 12.8
locators:
  growth_row: row「市场增长率」
  growth_spin: 市场增长率行 spinbutton
  step_up: 市场增长率行 .arco-input-number-step-button 第二个（加，mode=button 左减右加）
  step_down: 市场增长率行 .arco-input-number-step-button 首个（减）
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 点市场增长率行加号再点减号；步进与数值在 expect
expect:
  - note: 前置：产业周期分析页可见，市场增长率为 12.8
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=cycle/);
      await expect(page).toHaveURL(/tab=cycle/);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await page.getByRole('tab', { name: '产业周期分析' }).first().click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(400);
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      const growthRow = () => page.getByRole('row').filter({ hasText: '市场增长率' }).first();
      await expect(growthRow()).toBeVisible({ timeout: 8000 });
      const spin = () => growthRow().locator('[role=spinbutton]').first();
      const v0 = await spin().inputValue();
      if (v0 !== '12.8') throw new Error('前置市场增长率应为 12.8，实际=' + v0);
  - note: 1、点该行加号后数值为 13.3
    assert: |-
      const growthRow = () => page.getByRole('row').filter({ hasText: '市场增长率' }).first();
      const spin = () => growthRow().locator('[role=spinbutton]').first();
      const up = growthRow().locator('.arco-input-number-step-button').nth(1);
      await up.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const v1 = await spin().inputValue();
      if (v1 !== '13.3') throw new Error('加号后期望 13.3，实际=' + v1);
      if (await page.getByText('分析中', { exact: false }).first().isVisible().catch(() => false)) {
        throw new Error('仅改参数不应发起分析（出现分析中）');
      }
  - note: 2、再点该行减号后回到 12.8
    assert: |-
      const growthRow = () => page.getByRole('row').filter({ hasText: '市场增长率' }).first();
      const spin = () => growthRow().locator('[role=spinbutton]').first();
      const down = growthRow().locator('.arco-input-number-step-button').first();
      await down.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const v2 = await spin().inputValue();
      if (v2 !== '12.8') throw new Error('减号后期望回到 12.8，实际=' + v2);
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·edu tts/svcz entry-seed catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle。市场增长率行 Arco InputNumber
  step-button 首钮=加、次钮=减，步进 0.5（12.8→13.3→12.8）。用例附录：只改数值不发起分析。登录关评审 runner 前置。A 档零 allow_skip。
