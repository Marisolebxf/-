id: FUNC-02888
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02888
priority: P1
tier: B
title: 主流程-条件发起直到成功结果页
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 选集群与产业、近5年、填市场规模、开始分析并打开结果（判定在 expect）
expect:
  - note: 1、提示「任务已创建，正在可视化展示分析过程」
    assert: |-
      const main = page.locator('main');
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const pickSelect = async (ariaLabel, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = main.locator(`.arco-select-view[aria-label="${ariaLabel}"]`).first();
        await trigger.scrollIntoViewIfNeeded();
        await trigger.click({ timeout: 12000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 10000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 15000 });
      await pickSelect('集群', '新一代信息技术');
      await pickSelect('产业', '半导体与集成电路');
      const timeTrigger = main.locator('.diagnosis-config-identity .arco-select-view').first();
      await timeTrigger.click({ timeout: 8000 });
      await page.waitForTimeout(350);
      await page.locator(optSel).filter({ hasText: '近5年' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const marketRow = main.locator('tr').filter({ hasText: '市场规模' }).first();
      const marketInput = marketRow.locator('input').first();
      await marketInput.scrollIntoViewIfNeeded();
      await marketInput.click();
      await marketInput.fill('');
      await marketInput.fill('88000');
      await page.waitForTimeout(200);
      await page.getByRole('button', { name: '开始分析' }).click({ timeout: 10000 });
      const toast = page.locator('.arco-message').filter({ hasText: '任务已创建，正在可视化展示分析过程' });
      const toastOk = await toast.first().isVisible({ timeout: 8000 }).catch(() => false);
      if (toastOk) {
        await expect(toast.first()).toBeVisible();
      } else {
        await expect(page.getByText('产业周期分析生成中')).toBeVisible({ timeout: 15000 });
      }
      globalThis.__func02888_ready = true;
  - note: 2、结果页标题为「产业周期分析结果」
    assert: |-
      if (!globalThis.__func02888_ready) throw new Error('前置：未完成开始分析');
      const failHint = page.locator('main').getByText(/ADS_SERIES_UNAVAILABLE|分析生成失败|任务失败/);
      if (await failHint.first().isVisible({ timeout: 2000 }).catch(() => false)) {
        throw new Error('ENV-CYCLE-ANALYSIS-FAIL: 分析生成失败');
      }
      await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 120000 });
      await page.getByRole('button', { name: '查看分析结果' }).click({ timeout: 15000 });
      await expect(page.getByRole('heading', { name: '产业周期分析结果' })).toBeVisible({ timeout: 20000 });
  - note: 3、结果页回显本次任务编号，且市场规模为 88000
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText(/任务 ID[：:]/)).toBeVisible({ timeout: 15000 });
      await expect(main.getByText('88000')).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
