id: FUNC-00556
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00556
priority: P1
tier: B
title: 双 Tab 互切保留配置草稿且不自动分析
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 深链进入；草稿与 Tab 往返在 expect 中执行
expect:
  - note: 1、双页签均可见可互切
    assert: |-
      const main = () => page.locator('main.content-shell-layout, main').first();
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const pickSelect = async (aria, text) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = main().locator('.arco-select-view[aria-label="' + aria + '"]').first();
        await expect(view).toBeVisible({ timeout: 12000 });
        const shown = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (shown.includes(text)) return;
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const pickTimeRange = async (label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const block = main().getByText('分析时间范围').first();
        await expect(block).toBeVisible({ timeout: 8000 });
        const trigger = block.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
        const cur = ((await trigger.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (cur.includes(label)) return;
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        await page.locator(optSel).filter({ hasText: label }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      await expect(page).toHaveURL(/workspace=cycle/);
      await expect(page).toHaveURL(/tab=cycle/);
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 15000 });
      await pickSelect('集群', '新一代信息技术');
      await pickSelect('产业', '半导体与集成电路');
      await pickTimeRange('近3年');
      const spins = main().locator('[role=spinbutton]');
      await expect(spins).toHaveCount(4, { timeout: 8000 });
      await spins.nth(3).fill('77');
      await page.waitForTimeout(400);
      await expect(spins.nth(3)).toHaveValue('77');
      const industryText = ((await main().locator('.arco-select-view[aria-label="产业"]').first().innerText()) || '').replace(/\s+/g, ' ').trim();
      const timeBlock = main().getByText('分析时间范围').first();
      const timeText = ((await timeBlock.locator('xpath=following::*[contains(@class,"arco-select-view")][1]').innerText()) || '').replace(/\s+/g, ' ').trim();
      globalThis.__func00556 = {
        main,
        draft: { industryText, timeText, maturity: '77' },
      };
      await expect(page.getByRole('tab', { name: '产业周期分析' }).first()).toBeVisible();
      await expect(page.getByRole('tab', { name: '诊断记录' }).first()).toBeVisible();
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await expect(page.getByRole('tab', { name: '诊断记录' }).first()).toHaveAttribute('aria-selected', 'true');
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        return new Set(body.match(TID_RE) || []).size;
      };
      globalThis.__func00556.nBefore = await countChainRows();
      globalThis.__func00556.countChainRows = countChainRows;
  - note: 2、切回后对象、时间范围与周期参数草稿保留不重置
    assert: |-
      const ctx = globalThis.__func00556;
      if (!ctx?.draft) throw new Error('前置：未记录草稿');
      await page.getByRole('tab', { name: '产业周期分析' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(700);
      await expect(page.getByRole('tab', { name: '产业周期分析' }).first()).toHaveAttribute('aria-selected', 'true');
      await expect(ctx.main().getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(ctx.main().locator('.arco-select-view[aria-label="产业"]').first()).toContainText('半导体与集成电路', { timeout: 8000 });
      const timeTrigger = ctx.main().getByText('分析时间范围').first().locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
      await expect(timeTrigger).toContainText('近3年', { timeout: 8000 });
      await expect(ctx.main().locator('[role=spinbutton]').nth(3)).toHaveValue('77', { timeout: 8000 });
      const url = page.url();
      if (/view=result/.test(url) || /view=processing/.test(url)) {
        throw new Error('Tab 往返进入结果/过程态: ' + url);
      }
      const t = await ctx.main().innerText().catch(() => '');
      if (/可视化分析过程|产业周期分析生成中/.test(t)) {
        throw new Error('Tab 往返后出现分析过程，疑自动起任务');
      }
      ctx.draftVerified = true;
  - note: 3、页签往返不创建分析任务
    assert: |-
      const ctx = globalThis.__func00556;
      if (!ctx?.draftVerified) throw new Error('前置：草稿未验');
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = await ctx.countChainRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('诊断记录 CHAIN 条数增加：' + ctx.nBefore + ' -> ' + nAfter);
      }
      await expect(ctx.main().getByText('任务状态').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
