id: P0-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00546
priority: P0
title: 进入产业周期分析页路由与标题正确
entry_id: chain-cycle
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 经人设面板关闭内部评审模式（默认可能为开；默认态记 observed）
locators:
  h1: heading「产业周期分析」（level 1）
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: assert_url
    expect_contains: workspace=cycle
  - action: assert_visible
    target: heading 产业周期分析
expect:
  - note: 路由为 /industry-center/diagnosis 且 query 含 workspace=cycle&tab=cycle
    assert: |-
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/); await expect(page).toHaveURL(/workspace=cycle/); await expect(page).toHaveURL(/tab=cycle/)
  - note: 页标题为「产业周期分析」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page).toHaveTitle(/产业周期分析 - 科技专题服务系统/); await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: TRACE 目标态仅 ?tab=cycle，现场增量带 workspace=cycle（不判 Fail）。双 Tab 构成非本条对象。对比篮浮层可见才关。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
