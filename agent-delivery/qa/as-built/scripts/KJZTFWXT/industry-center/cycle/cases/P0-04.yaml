id: P0-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00553
priority: P0
title: 任务结果呈现回溯诊断预测结构与周期阶段报告
entry_id: chain-cycle
preconditions:
- 任务已完成且结果态可达（可从「诊断记录」恢复已完成任务）
locators:
  tab_records: tab「诊断记录」
  view_result: button「查看结果」
  result_title: 产业周期分析结果
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=cycle&tab=cycle
- action: click
  target: 诊断记录
- action: click
  target: 查看结果（已完成条目）
- action: wait
  for: 产业周期分析结果
expect:
- note: 结果以不可变快照呈现「回溯—诊断—预测」结构
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/diagnosis?workspace=cycle&tab=cycle', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1200); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('SKIP: 诊断记录无「查看结果」入口（无已完成任务）'); await view.click(); await page.waitForTimeout(2500); await expect(page.getByText('产业周期分析结果')).toBeVisible({ timeout: 12000 }); const t = await page.locator('main').innerText(); if (!/回溯/.test(t) || !/预测/.test(t)) throw new Error('结果未见回溯/预测结构词'); /* 「诊断」可能仅出现于 Tab/叙述降级文案，不单钉死独立区块标题 */
- note: 周期阶段判断与分析报告呈现
  assert: |-
    await expect(page.getByText('周期阶段').first()).toBeVisible({ timeout: 8000 }); const report = page.getByRole('button', { name: '查看报告' }); const hasReportBtn = await report.count(); const t = await page.locator('main').innerText(); if (!hasReportBtn && !/分析报告|报告/.test(t)) throw new Error('未见分析报告入口或报告文案')
- note: 结果顶栏回显冻结的时间范围与分析对象
  assert: |-
    const t = await page.locator('main').innerText(); if (!/分析对象/.test(t)) throw new Error('结果顶栏未见分析对象'); if (!/新一代信息技术|生物产业|INB/.test(t)) throw new Error('未见冻结分析对象回显')
allow_skip: 诊断记录无已完成周期任务时记 Pass-N/A + observed
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 实勘可从 CHAIN-*-已完成「查看结果」进入；现场含诚实降级（驱动因素/拐点未返回等），不伪造「已完成实时全网检索」。时间范围顶栏回显形态 observed（URL analysis_fp 含 timeRange）。
tier: A
