id: FUNC-02907
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02907
priority: P0
title: 诊断记录任务状态下拉四选项
story: US-CHAIN-DIAG-07
entry_id: chain-cycle
tier: A
preconditions:
  - 已打开诊断记录
locators:
  records_tab: tab「诊断记录」
  status_label: 任务状态
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 切诊断记录→展开「任务状态」，选项在 expect
expect:
  - note: 前置：产业周期分析页已切到「诊断记录」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const route = '/industry-center/diagnosis?workspace=cycle&tab=cycle';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      await dismissBasket();
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await expect(page.getByRole('tab', { name: '诊断记录' }).first()).toHaveAttribute('aria-selected', 'true');
      globalThis.__func02907 = { recordsReady: true };
  - note: 1、选项为「全部状态」「分析中」「已完成」「失败」，共 4 个
    assert: |-
      if (!globalThis.__func02907?.recordsReady) throw new Error('前置：诊断记录 Tab 未打开');
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      await page.keyboard.press('Escape').catch(() => {});
      const block = page.locator('text=任务状态').first();
      await expect(block).toBeVisible({ timeout: 8000 });
      const trigger = block.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(450);
      const pop = page.locator('.arco-trigger-popup:visible, .arco-select-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const count = await options.count();
      const got = [];
      for (let i = 0; i < count; i++) {
        got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      if (count !== 4) {
        throw new Error('任务状态选项应为 4 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      const want = ['全部状态', '分析中', '已完成', '失败'];
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error('任务状态选项不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got));
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle。步骤=诊断记录 Tab→「任务状态」标签后首个 .arco-select-view（P7，对齐 02894/02906）。
  选项口径=testdata records.status_filter 族：全部状态、分析中、已完成、失败（scout env-gate 诊断记录区实证）。登录关评审 runner 前置。A 档零 allow_skip。
