id: FUNC-02918
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02918
priority: P1
title: 诊断记录翻到第 2 页首行任务不同
story: US-CHAIN-DIAG-07
entry_id: chain-cycle
tier: B
preconditions:
  - 诊断记录总条数超过 10（assert 自含数据闸门）
locators:
  records_tab: tab「诊断记录」
  records_pagination: .diagnosis-records .arco-pagination
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 侧栏进入产业周期分析→诊断记录翻第 2 页；首行差异在 expect
expect:
  - note: 前置：产业周期分析页已切到「诊断记录」，且可翻到第 2 页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main.content-shell-layout, main').first();
      const leafItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^产业周期分析$/ });
      const expandChainGroup = async () => {
        if (await leafItem().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterCyclePage = async () => {
        await dismissBasket();
        await expandChainGroup();
        const leaf = leafItem();
        await expect(leaf.first()).toBeVisible({ timeout: 10000 });
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=cycle/);
        await expect(page).toHaveURL(/tab=cycle/);
      };
      const recordsSection = () => main().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
      const recordsTable = () => recordsSection().locator('.arco-table').first();
      const recordsPagination = () => recordsSection().locator('.arco-pagination').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const firstVisibleRowTaskId = async () => {
        const rows = recordsTable().locator('tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const m = t.match(TID_RE);
          if (m) return m[0];
        }
        return '';
      };
      const clickPageNum = async (num) => {
        const pag = recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const btn = pag.locator('.arco-pagination-item').filter({ hasText: new RegExp('^\\s*' + num + '\\s*$') }).first();
        if ((await btn.count()) > 0 && (await btn.isVisible().catch(() => false))) {
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(900);
          return;
        }
        if (num === 2) {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) && (await next.isVisible().catch(() => false))) {
            await next.click({ timeout: 8000 });
            await page.waitForTimeout(900);
            return;
          }
        }
        throw new Error('分页「' + num + '」不可点');
      };
      await dismissBasket();
      if (!/\/industry-center\/search/.test(page.url())) {
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      const bodyGate0 = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate0)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业查询 SPA 404 ' + page.url());
      }
      await enterCyclePage();
      await page.waitForTimeout(800);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await expect(page.getByRole('tab', { name: '诊断记录' }).first()).toHaveAttribute('aria-selected', 'true');
      await expect(recordsSection()).toBeVisible({ timeout: 8000 });
      const bodyRec = await recordsSection().innerText().catch(() => '');
      if (!TID_RE.test(bodyRec) && !/暂无|无记录/.test(bodyRec)) {
        throw new Error('ENV-CHAIN-CYCLE-NO-RECORDS-001：诊断记录未见 CHAIN 任务行');
      }
      const pag = recordsPagination();
      const page2Btn = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 =
        ((await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false))) ||
        (await pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').count()) > 0;
      if (!hasPage2) {
        throw new Error('数据闸门：诊断记录总条数未超过 10（默认每页 10 条），无法翻到第 2 页');
      }
      const taskPage1 = await firstVisibleRowTaskId();
      if (!taskPage1) {
        throw new Error('第 1 页首行未见任务编号 CHAIN-*');
      }
      globalThis.__func02918 = { taskPage1, recordsReady: true };
  - note: 1、点分页「2」后第 2 页首行任务编号与第 1 页首行不同
    assert: |-
      if (!globalThis.__func02918?.recordsReady) throw new Error('前置：诊断记录未就绪');
      const taskPage1 = globalThis.__func02918.taskPage1;
      const recordsSection = () =>
        page.locator('main.content-shell-layout, main').first().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
      const recordsTable = () => recordsSection().locator('.arco-table').first();
      const recordsPagination = () => recordsSection().locator('.arco-pagination').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const firstVisibleRowTaskId = async () => {
        const rows = recordsTable().locator('tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const m = t.match(TID_RE);
          if (m) return m[0];
        }
        return '';
      };
      const clickPageNum = async (num) => {
        const pag = recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const btn = pag.locator('.arco-pagination-item').filter({ hasText: new RegExp('^\\s*' + num + '\\s*$') }).first();
        if ((await btn.count()) > 0 && (await btn.isVisible().catch(() => false))) {
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(900);
          return;
        }
        if (num === 2) {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) && (await next.isVisible().catch(() => false))) {
            await next.click({ timeout: 8000 });
            await page.waitForTimeout(900);
            return;
          }
        }
        throw new Error('分页「' + num + '」不可点');
      };
      await clickPageNum(2);
      const pag = recordsPagination();
      const active = ((await pag.locator('.arco-pagination-item-active').first().innerText()) || '').trim();
      if (active !== '2') {
        throw new Error('翻页后当前页应为 2，现场 active=' + (active || '(空)'));
      }
      const taskPage2 = await firstVisibleRowTaskId();
      if (!taskPage2) {
        throw new Error('第 2 页首行未见任务编号 CHAIN-*');
      }
      if (taskPage2 === taskPage1) {
        throw new Error('第 2 页首行任务与第 1 页相同：' + taskPage2);
      }
      globalThis.__func02918.taskPage2 = taskPage2;
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle；入口对齐 entry-seed：goto sibling /industry-center/search
  再侧栏「产业链分析」→「产业周期分析」（深链冷启动 SPA 404）。步骤=Tab「诊断记录」→分页点「2」（a-table pageSize=10）。
  机检=第 1 页 tbody 首可见行 CHAIN 任务号 vs 第 2 页首行不同；无第 2 页→数据闸门（总条数≤10）。登录关评审 runner 前置。B 档零 allow_skip。
