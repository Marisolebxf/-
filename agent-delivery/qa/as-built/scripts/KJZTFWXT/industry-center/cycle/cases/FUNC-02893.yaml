id: FUNC-02893
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02893
priority: P0
title: 更换集群后产业下拉换成该集群下的产业
story: US-CHAIN-DIAG-01
entry_id: chain-cycle
tier: A
preconditions:
  - 已打开产业周期分析
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 集群选新一代信息技术→展开产业；改选生物产业→再展开产业（判定在 expect）
expect:
  - note: 前置：产业周期分析页可见
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const pickCluster = async (label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = page.locator('.arco-select-view[aria-label="集群"]').first();
        await trigger.scrollIntoViewIfNeeded();
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const readIndustryOptions = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        const industry = page.locator('.arco-select-view[aria-label="产业"]').first();
        await industry.scrollIntoViewIfNeeded();
        await industry.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const pop = page.locator('.arco-trigger-popup:visible, .arco-select-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const options = pop.locator('.arco-select-option');
        const count = await options.count();
        const got = [];
        for (let i = 0; i < count; i++) {
          got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
        }
        await page.keyboard.press('Escape').catch(() => {});
        return { count, got };
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      await pickCluster('新一代信息技术');
      globalThis.__func02893_helpers = { readIndustryOptions };
  - note: 1、新一代信息技术下产业共 7 个，名称见附录 B
    assert: |-
      const { readIndustryOptions } = globalThis.__func02893_helpers || {};
      if (!readIndustryOptions) throw new Error('前置：未打开产业周期分析或未选集群');
      const want = [
        '新一代信息技术',
        '半导体与集成电路',
        '人工智能与应用',
        '智能终端',
        '软件与信息服务',
        '新型网络与通信',
        '超高清视频与显示',
      ];
      const { count, got } = await readIndustryOptions();
      if (count !== 7) {
        throw new Error('新一代信息技术下产业应为 7 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error(
            '新一代信息技术下产业选项不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got),
          );
        }
      }
      globalThis.__func02893_itChecked = true;
  - note: 2、生物产业下为「生物」「生物医药与生命健康」「高端医疗器械」，共 3 个
    assert: |-
      if (!globalThis.__func02893_itChecked) throw new Error('前置：未完成新一代信息技术产业清单校验');
      const { readIndustryOptions } = globalThis.__func02893_helpers || {};
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      await page.keyboard.press('Escape').catch(() => {});
      const trigger = page.locator('.arco-select-view[aria-label="集群"]').first();
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const bio = page.locator(optSel).filter({ hasText: '生物产业' }).first();
      await expect(bio).toBeVisible({ timeout: 8000 });
      await bio.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const want = ['生物', '生物医药与生命健康', '高端医疗器械'];
      const { count, got } = await readIndustryOptions();
      if (count !== 3) {
        throw new Error('生物产业下产业应为 3 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error('生物产业下产业选项不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got));
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·edu tts/svcz entry-seed catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle。用例步骤=集群新一代信息技术→展开产业→集群改生物产业→再展开产业。
  左=集群 aria-label「集群」、右=产业 aria-label「产业」（testdata object.industry_aria/chain_aria）。选项对齐用例册附录 B（02893），与 panorama 02805 生物三项同口径。
  换集群清空产业、开始分析不可点归 02927，本脚本不检按钮。点法 P7：.arco-select-view + 可见 popup .arco-select-option。D4·2026-10-20 rewrite-FUNC-02893 edu tts/svcz 深链 SPA 404（ENV-EDU-TTS-SVCZ-404-001，与 02888 同根因）。登录关评审 runner 前置。A 档零 allow_skip。
