id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00561
priority: P1
title: 未选分析对象时开始分析被拦截
entry_id: chain-cycle
preconditions:
- 分析对象可清空
locators:
  industry: select 集群
  start: button 开始分析
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=cycle&tab=cycle
- action: evaluate
  note: 清空产业对象后点开始分析
expect:
- note: 对象未选时提交被拦截或按钮置灰
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=cycle&tab=cycle', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.locator('.arco-select-view[aria-label="集群"]').hover(); await page.evaluate(() => { const view = document.querySelector('.arco-select-view[aria-label="集群"]'); const icon = view && view.querySelector('span[class*=clear], .arco-select-view-clear'); if (icon) icon.dispatchEvent(new MouseEvent('click', { bubbles: true })); }); await page.waitForTimeout(500); const industry = (await page.locator('.arco-select-view[aria-label="集群"]').innerText()).trim(); if (industry) throw new Error('未能清空分析对象: ' + industry); const start = page.getByRole('button', { name: '开始分析' }).first(); const disabled = await start.isDisabled(); if (!disabled) { await start.click(); await page.waitForTimeout(1000); const t = await page.locator('body').innerText(); if (!/尚未选择分析对象|请选择分析对象|未选/.test(t)) throw new Error('未置灰且未见拦截提示') }
- note: 不创建任务且草稿保留可修正
  assert: |-
    if (/view=result/.test(page.url())) throw new Error('空对象提交进入了结果'); await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible(); await expect(page.locator('[role=spinbutton]').nth(1)).toHaveValue('12.8')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘清空后按钮仍 enabled，点击后提示「尚未选择分析对象」且不建任务（拦截非置灰）。
tier: B
