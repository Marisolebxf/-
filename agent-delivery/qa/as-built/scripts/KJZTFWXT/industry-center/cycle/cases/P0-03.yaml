id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00551
priority: P0
title: 显式开始分析创建任务且条件变更不自动起任务
entry_id: chain-cycle
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入产业周期分析页
  - 合法组合下「开始分析」enabled（env-gate g2：新一代信息技术 / INB1701）
locators:
  start: button「开始分析」
  cluster: .arco-select-view[aria-label="集群"]
  reset: button「重置参数」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 关闭对比篮浮层（若可见）后核开始分析 enabled；再切对象不点按钮
expect:
  - note: 合法组合落地「开始分析」enabled（lite：不深验过程/结果）
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeVisible({ timeout: 8000 }); await expect(start).toBeEnabled({ timeout: 8000 }); await start.click(); await page.waitForTimeout(2000); await expect(page).toHaveURL(/workspace=cycle/); if (/view=result/.test(page.url()) && !/task_id=/.test(page.url())) throw new Error('显式点击后出现无 task_id 的结果态: ' + page.url())
  - note: 仅变更对象不点「开始分析」时不自动跳 view=processing
    assert: |-
      await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=cycle&tab=cycle', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await page.locator('.arco-select-view[aria-label="集群"]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物产业' }).first().click(); await page.waitForTimeout(1000); if (/view=processing/.test(page.url())) throw new Error('切对象后自动进入 processing: ' + page.url()); await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: lite 金样：enabled + 未点不跳 processing；过程/结果深验归 P0-08/00552 与 P0-04。生物产业仅作切对象探测（黑名单，下级清空后开始分析常 disabled，属门控 observed）。同条件显式点击可能秒级复用且停留配置区（URL 可不含 view=）。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
