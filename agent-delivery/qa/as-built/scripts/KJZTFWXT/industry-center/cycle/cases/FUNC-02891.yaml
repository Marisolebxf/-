id: FUNC-02891
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02891
priority: P0
title: 改市场增长率后重新分析产生新的已完成结果
story: US-CHAIN-DIAG-02
entry_id: chain-cycle
tier: A
preconditions:
  - 已有一条已完成结果（assert 自含：诊断记录恢复或 02888 同款首次成功）
locators:
  rebuild: button「按此配置新建分析」
  start: button「开始分析」
  view_result: button「查看分析结果」
  growth_spin: role=spinbutton 第 2 行（市场增长率）
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 结果页按此配置新建→市场增长率改 21→开始分析→查看分析结果；三条预期在 expect
expect:
  - note: 前置到达成功结果并完成改参重跑（globalThis.__func02891）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const route = '/industry-center/diagnosis?workspace=cycle&tab=cycle';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const SAME_DAY = /今日已分析过相同条件，已打开结果/;
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const pickSelect = async (aria, text) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = page.locator('.arco-select-view[aria-label="' + aria + '"]').first();
        await expect(view).toBeVisible({ timeout: 8000 });
        const shown = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (shown.includes(text)) return;
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const pickTimeRange = async (label) => {
        const timeSel = page.locator('.arco-select-view').filter({ hasText: /近\d年/ }).first();
        await timeSel.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await page.locator(optSel).filter({ hasText: label }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const apply02888Config = async () => {
        await dismissBasket();
        await pickSelect('集群', '新一代信息技术');
        await pickSelect('产业', '半导体与集成电路');
        await pickTimeRange('近5年');
        await page.locator('[role=spinbutton]').nth(0).fill('88000');
        await page.waitForTimeout(300);
      };
      const readTaskId = async () => {
        const urlId = new URL(page.url()).searchParams.get('task_id');
        if (urlId && TID_RE.test(urlId)) return urlId;
        const body = await main().innerText().catch(() => '');
        const m = body.match(/任务 ID[：:]\s*(\S+)/) || body.match(TID_RE);
        return m ? (m[1] || m[0]) : '';
      };
      const isSuccessResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        if (/产业周期分析生成中|可视化分析过程/.test(t) && !/产业周期分析结果/.test(t)) return false;
        return await page.getByText('产业周期分析结果').first().isVisible().catch(() => false);
      };
      const openResultFromProcessing = async () => {
        const btn = main().getByRole('button', { name: /查看分析结果/ });
        for (let i = 0; i < 30; i++) {
          if (await isSuccessResult()) return;
          if (await btn.count() && (await btn.first().isVisible().catch(() => false))) {
            await btn.first().click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(800);
            if (await isSuccessResult()) return;
          }
          await page.waitForTimeout(i < 6 ? 500 : 1500);
        }
      };
      const waitSuccessAfterStart = async () => {
        let last = '';
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 500 : 2000);
          last = await main().innerText().catch(() => '');
          if (await isSuccessResult()) return;
          if (/分析结果已生成/.test(last)) {
            await openResultFromProcessing();
            if (await isSuccessResult()) return;
          }
          if (/分析失败|本次分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CHAIN-CYCLE-ANALYSIS-FAIL-001：分析失败，无法到达成功结果');
          }
        }
        if (/view=processing|可视化分析过程/.test(page.url() + last)) {
          throw new Error('ENV-CHAIN-CYCLE-ASYNC-NO-SUCCESS-001：分析长期停留过程态');
        }
        throw new Error('首次成功未在超时内到达结果：' + last.slice(0, 220));
      };
      const restoreCompletedIfNeeded = async () => {
        if (await isSuccessResult()) return true;
        await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const views = main().getByRole('button', { name: '查看结果' });
        const n = await views.count();
        for (let i = 0; i < Math.min(n, 8); i++) {
          let row = views.nth(i).locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = views.nth(i).locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const rt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!rt || !/已完成/.test(rt) || !/产业周期分析/.test(rt)) continue;
          await views.nth(i).click({ timeout: 15000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult()) return true;
          }
        }
        return false;
      };
      await dismissBasket();
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      if (!(await restoreCompletedIfNeeded())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await apply02888Config();
        const start0 = main().getByRole('button', { name: '开始分析' }).first();
        await expect(start0).toBeEnabled({ timeout: 20000 });
        await start0.click({ timeout: 15000 });
        await waitSuccessAfterStart();
      }
      const taskBefore = await readTaskId();
      if (!taskBefore) throw new Error('前置成功结果未见 CHAIN 任务标识');
      const rebuild = main().getByRole('button', { name: '按此配置新建分析', exact: true }).first();
      if (!(await rebuild.count()) || !(await rebuild.isVisible().catch(() => false))) {
        throw new Error('ENV-CHAIN-CYCLE-NO-REBUILD-001：结果页无「按此配置新建分析」');
      }
      await rebuild.scrollIntoViewIfNeeded().catch(() => {});
      await rebuild.click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      const urlAfterRebuild = page.url();
      if (/view=processing|view=result/.test(urlAfterRebuild)) {
        throw new Error('按此配置新建分析后仍停过程/结果 URL：' + urlAfterRebuild);
      }
      await page.getByRole('tab', { name: '产业周期分析' }).first().click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(800);
      const growth = page.locator('[role=spinbutton]').nth(1);
      await expect(growth).toBeVisible({ timeout: 8000 });
      await growth.fill('21');
      await page.waitForTimeout(400);
      const gv = await growth.inputValue();
      if (gv !== '21') throw new Error('市场增长率未改为 21，现场=' + gv);
      const start = main().getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 20000 });
      await start.click({ timeout: 15000 });
      let sawSameDay = false;
      let last = '';
      for (let i = 0; i < 90; i++) {
        await page.waitForTimeout(i < 4 ? 500 : 2000);
        last = await main().innerText().catch(() => '');
        if (SAME_DAY.test(last)) sawSameDay = true;
        const toast = page.locator('.arco-message, .arco-notification').filter({ hasText: SAME_DAY });
        if (await toast.count() && (await toast.first().isVisible().catch(() => false))) sawSameDay = true;
        if (sawSameDay) {
          throw new Error('改参后仍触发当天同条件复用（应产生新任务，见 02890）');
        }
        if (/分析结果已生成/.test(last)) {
          await openResultFromProcessing();
          if (await isSuccessResult()) break;
        }
        if (await isSuccessResult()) break;
        if (/分析失败|本次分析失败/.test(last) && !/可视化分析过程/.test(last)) {
          throw new Error('ENV-CHAIN-CYCLE-REANALYSIS-FAIL-001：改参重跑失败');
        }
      }
      if (!/分析结果已生成/.test(last) && !(await isSuccessResult())) {
        throw new Error('改参重跑超时未见「分析结果已生成」：' + last.slice(0, 240));
      }
      if (!(await isSuccessResult())) {
        await openResultFromProcessing();
      }
      const viewBtn = main().getByRole('button', { name: /查看分析结果/ }).first();
      if (!(await isSuccessResult())) {
        await expect(viewBtn).toBeVisible({ timeout: 15000 });
        await viewBtn.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
      }
      if (!(await isSuccessResult())) {
        throw new Error('点「查看分析结果」后仍未打开结果页');
      }
      const taskAfter = await readTaskId();
      globalThis.__func02891 = { taskBefore, taskAfter, growthValue: gv };
      if (!taskAfter) throw new Error('新结果页未见 CHAIN 任务标识');
  - note: 1、产生新的任务编号，与进入前那条不同
    assert: |-
      const ctx = globalThis.__func02891;
      if (!ctx) throw new Error('前置：未完成改参重跑');
      if (!ctx.taskBefore || !ctx.taskAfter) {
        throw new Error('任务 ID 缺失 before=' + ctx.taskBefore + ' after=' + ctx.taskAfter);
      }
      if (ctx.taskBefore === ctx.taskAfter) {
        throw new Error('改参后 task_id 未变化（仍为 ' + ctx.taskBefore + '）');
      }
      await expect(page.getByText('产业周期分析结果').first()).toBeVisible({ timeout: 12000 });
      await expect(page).toHaveURL(/view=result/, { timeout: 10000 });
  - note: 2、新任务状态为「已完成」；3、新结果页可以打开
    assert: |-
      const ctx = globalThis.__func02891;
      if (!ctx?.taskAfter) throw new Error('前置：无新任务 ID');
      const main = () => page.locator('main.content-shell-layout, main').first();
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const body = await main().innerText().catch(() => '');
      if (!body.includes(ctx.taskAfter)) {
        throw new Error('诊断记录未见新任务 ' + ctx.taskAfter);
      }
      const idx = body.indexOf(ctx.taskAfter);
      const slice = body.slice(Math.max(0, idx - 80), idx + 120);
      if (!/已完成/.test(slice)) {
        throw new Error('新任务行未见「已完成」状态：' + slice.replace(/\s+/g, ' ').slice(0, 160));
      }
      const openNew = main().getByRole('button', { name: '查看结果' }).filter({ has: page.getByText(ctx.taskAfter) });
      let opened = false;
      if (await openNew.count()) {
        await openNew.first().click({ timeout: 12000 }).catch(() => {});
        opened = true;
      } else {
        const views = main().getByRole('button', { name: '查看结果' });
        const n = await views.count();
        for (let i = 0; i < Math.min(n, 12); i++) {
          let row = views.nth(i).locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = views.nth(i).locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const rt = (await row.innerText().catch(() => '')) || '';
          if (rt.includes(ctx.taskAfter) && /已完成/.test(rt)) {
            await views.nth(i).click({ timeout: 12000 });
            opened = true;
            break;
          }
        }
      }
      if (!opened) throw new Error('诊断记录无法对新任务点「查看结果」');
      await page.waitForTimeout(1200);
      await expect(page.getByText('产业周期分析结果').first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle。前置=已完成结果（诊断记录恢复或 02888 同款首次成功）。步骤=结果页「按此配置新建分析」→市场增长率 spin 第2行填 21→「开始分析」→「分析结果已生成」→「查看分析结果」。机检=新 CHAIN≠原任务+诊断记录新行已完成+结果标题。改参仍同条件复用→fail（归 02890）。无 rebuild→ENV-CHAIN-CYCLE-NO-REBUILD-001；异步→ENV-CHAIN-CYCLE-ASYNC-NO-SUCCESS-001。D4·2026-10-20 rewrite-FUNC-02891 edu tts/svcz 深链 SPA 404（ENV-EDU-TTS-SVCZ-404-001，与 02888 同根因）。登录关评审 runner 前置。A 档零 allow_skip。
