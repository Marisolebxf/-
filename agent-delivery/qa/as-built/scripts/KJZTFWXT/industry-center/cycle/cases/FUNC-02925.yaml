id: FUNC-02925
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02925
priority: P1
tier: B
title: 备选-报告-下载报告
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
expect:
  - note: 1、得到一份可打开的报告文件
    assert: |-
      const main = page.locator('main').first();
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 10000 });
      await expect(main.locator('.diagnosis-records')).toBeVisible({ timeout: 10000 });
      const trigger = main.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
      await trigger.click({ timeout: 8000 });
      await page.locator('.arco-select-option').filter({ hasText: /^已完成$/ }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const row = main.locator('.arco-table tbody tr').filter({ hasText: '已完成' }).first();
      await row.scrollIntoViewIfNeeded();
      const bodies = main.locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
      const bn = await bodies.count();
      for (let i = 0; i < bn; i++) {
        await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
      }
      const btn = row.getByRole('button', { name: '下载报告', exact: true });
      await expect(btn).toBeVisible({ timeout: 8000 });
      await expect(btn).toBeEnabled({ timeout: 8000 });
      const downloadP = page.waitForEvent('download', { timeout: 20000 });
      const assetP = page.waitForResponse(
        (r) => /\/tasks\/[^/]+\/asset/.test(r.url()) && r.request().method() === 'GET',
        { timeout: 20000 },
      );
      await btn.click({ timeout: 10000 });
      const dl = await downloadP.catch(() => null);
      const resp = await assetP.catch(() => null);
      let ok = false;
      if (dl) {
        const name = dl.suggestedFilename();
        const path = await dl.path().catch(() => null);
        if (name || path) ok = true;
      }
      if (resp && resp.ok()) {
        const buf = await resp.body().catch(() => null);
        if (buf && buf.length > 0) ok = true;
      }
      await expect(ok).toBe(true);
on_fail: 截图 + 抄 X-Trace-Id
