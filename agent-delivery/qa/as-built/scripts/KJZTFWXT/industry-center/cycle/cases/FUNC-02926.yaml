id: FUNC-02926
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02926
priority: P1
tier: B
title: 异常-未选对象
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle&object_id=
  - action: evaluate
    note: 刚进入产业周期分析，未在下拉中重新点选，直接点开始分析（判定在 expect）
expect:
  - note: 前置：分析配置可见；诊断记录 CHAIN 基线条数已采样
    assert: |-
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await expect(page).toHaveURL(/workspace=cycle/);
      await expect(page).toHaveURL(/tab=cycle/);
      if (/view=result|view=processing/.test(page.url())) {
        await page.getByRole('tab', { name: '产业周期分析' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(600);
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nBefore = await countChainRows();
      await page.getByRole('tab', { name: '产业周期分析' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      globalThis.__func02926 = { nBefore, main, countChainRows };
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      const ctx = globalThis.__func02926;
      if (!ctx) throw new Error('前置：未采样诊断记录基线');
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.scrollIntoViewIfNeeded();
      const enabled = await start.isEnabled();
      await start.click({ timeout: 8000, force: !enabled });
      await page.waitForTimeout(600);
      const toast = page.locator('.arco-message-content, .arco-message').filter({
        hasText: /尚未选择分析对象|请先选择分析对象/,
      });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
      globalThis.__func02926.clicked = true;
  - note: 2、仍停在分析配置；3、诊断记录不新增任务
    assert: |-
      const ctx = globalThis.__func02926;
      if (!ctx?.clicked) throw new Error('前置：未点开始分析');
      const url = page.url();
      if (/view=result/.test(url) || /view=processing/.test(url)) {
        throw new Error('拦截后进入结果/过程态: ' + url);
      }
      const body = await ctx.main().innerText().catch(() => '');
      if (/分析结果已生成|可视化分析过程/.test(body)) {
        throw new Error('拦截后仍见分析过程/结果引导');
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = await ctx.countChainRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('诊断记录 CHAIN 条数增加：' + ctx.nBefore + ' -> ' + nAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id
