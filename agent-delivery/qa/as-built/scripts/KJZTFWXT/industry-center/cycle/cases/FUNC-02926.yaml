id: FUNC-02926
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02926
priority: P1
tier: B
title: 异常-未选对象-直接开始分析被拦住
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
expect:
  - note: 前置：分析配置可见；诊断记录 CHAIN 基线条数已采样；直接点「开始分析」
    assert: |-
      page.setDefaultTimeout(20000);
      const main = () => page.locator('main').first();
      await main().getByRole('heading', { level: 2, name: '分析配置' }).waitFor({ state: 'visible', timeout: 15000 });
      await page.getByRole('tab', { name: '诊断记录' }).click();
      await main().getByRole('columnheader', { name: '任务' }).waitFor({ state: 'visible', timeout: 15000 });
      const baseline = await main().locator('.arco-table-body .arco-table-tr').count();
      await page.getByRole('tab', { name: '产业周期分析' }).click();
      await main().getByRole('heading', { level: 2, name: '分析配置' }).waitFor({ state: 'visible', timeout: 15000 });
      page.__func02926 = { baseline, clicked: false };
      await page.getByRole('button', { name: '开始分析' }).click({ timeout: 8000 });
      page.__func02926.clicked = true;
      await page.waitForTimeout(800);
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      const ctx = page.__func02926;
      if (!ctx?.clicked) throw new Error('前置：未点开始分析');
      const toast = page.locator('.arco-message-content, .arco-message').filter({
        hasText: /尚未选择分析对象|请先选择分析对象/,
      });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
  - note: 2、仍停在分析配置
    assert: |-
      const ctx = page.__func02926;
      if (!ctx?.clicked) throw new Error('前置：未点开始分析');
      const url = page.url();
      if (/view=result|wait_view=/.test(url)) throw new Error('已离开分析配置进入结果或过程页');
      const main = page.locator('main').first();
      await expect(main.getByRole('heading', { level: 2, name: '分析配置' })).toBeVisible({ timeout: 8000 });
      await expect(main.getByRole('heading', { name: '产业周期分析结果' })).toHaveCount(0);
      await expect(main.getByRole('heading', { name: '产业周期分析生成中' })).toHaveCount(0);
  - note: 3、诊断记录不新增任务
    assert: |-
      const ctx = page.__func02926;
      if (!ctx?.clicked) throw new Error('前置：未点开始分析');
      const main = () => page.locator('main').first();
      await page.getByRole('tab', { name: '诊断记录' }).click();
      await main().getByRole('columnheader', { name: '任务' }).waitFor({ state: 'visible', timeout: 15000 });
      const after = await main().locator('.arco-table-body .arco-table-tr').count();
      if (after !== ctx.baseline) {
        throw new Error(`诊断记录条数变化：${ctx.baseline} → ${after}`);
      }
on_fail: 截图 + 抄 X-Trace-Id
