id: FUNC-02927
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02927
priority: P1
title: 换集群把产业清空后开始分析不能点
story: US-CHAIN-DIAG-01
entry_id: chain-cycle
tier: B
preconditions:
  - 已打开产业周期分析
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
  start: button「开始分析」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 集群改选「生物产业」（判定在 expect）
expect:
  - note: 前置：产业周期分析页可见；默认集群下产业有回显
    assert: |-
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const pickCluster = async (label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = page.locator('.arco-select-view[aria-label="集群"]').first();
        await trigger.scrollIntoViewIfNeeded();
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=cycle/);
      await expect(page).toHaveURL(/tab=cycle/);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      const clusterView = page.locator('.arco-select-view[aria-label="集群"]').first();
      await expect(clusterView).toContainText('新一代信息技术', { timeout: 8000 });
      const chainBefore = ((await page.locator('.arco-select-view[aria-label="产业"]').first().innerText()) || '').trim();
      if (!chainBefore) {
        throw new Error('前置：默认态产业（产业链）应有回显，实际为空');
      }
      await pickCluster('生物产业');
      await expect(clusterView).toContainText('生物产业', { timeout: 8000 });
      globalThis.__func02927 = { chainBefore };
  - note: 1、产业下拉变为空
    assert: |-
      const ctx = globalThis.__func02927;
      if (!ctx) throw new Error('前置：未完成集群切换');
      const chainView = page.locator('.arco-select-view[aria-label="产业"]').first();
      const chainText = ((await chainView.innerText()) || '').replace(/\s+/g, ' ').trim();
      const cls = (await chainView.getAttribute('class')) || '';
      const hasPlaceholder = /arco-select-view-has-placeholder/.test(cls);
      const looksEmpty =
        !chainText ||
        /请选择|未选/.test(chainText) ||
        hasPlaceholder;
      if (!looksEmpty) {
        throw new Error(
          '换集群后产业下拉应清空，实际 innerText=' +
            JSON.stringify(chainText) +
            ' classHasPlaceholder=' +
            hasPlaceholder,
        );
      }
      if (chainText === ctx.chainBefore || chainText === 'INB1701') {
        throw new Error('产业仍保留切换前回显: ' + chainText);
      }
      globalThis.__func02927.emptyChecked = true;
  - note: 2、「开始分析」不可点
    assert: |-
      if (!globalThis.__func02927?.emptyChecked) throw new Error('前置：未确认产业下拉为空');
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.scrollIntoViewIfNeeded();
      const disabled = await start.isDisabled();
      const cls = (await start.getAttribute('class')) || '';
      if (!disabled && !/arco-btn-disabled/.test(cls)) {
        await start.click({ timeout: 3000 }).catch(() => {});
        await page.waitForTimeout(600);
        const url = page.url();
        if (/view=result|view=processing/.test(url)) {
          throw new Error('产业为空时点击开始分析进入了过程/结果态: ' + url);
        }
        const toast = page.locator('.arco-message-content, .arco-message').filter({ hasText: /任务已创建/ });
        if (await toast.count()) {
          throw new Error('产业为空时点击开始分析却创建任务');
        }
        throw new Error('开始分析应不可点（disabled），实际 enabled 且点击未进入结果');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例步骤=仅把集群改成「生物产业」。换集群联动清空 aria-label「产业」（用例称产业链）；开始分析须 disabled（与 02926 未点选 toast 拦截、P1-07 清空集群拦截不同）。
  重新选产业后按钮恢复可点归 02888。catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle。P7 点 .arco-select-view。
  D4·edu tts/svcz 深链 SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
