id: FUNC-02898
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02898
priority: P1
tier: B
title: 主流程-结果摘要-周期阶段与市场规模
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 02888 配齐对象与参数并开始分析；用例步骤 1 打开该次结果页（点「查看分析结果」）
expect:
  - note: 1、「周期阶段」有阶段名称
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('分析配置')).toBeVisible({ timeout: 20000 });
      await page.keyboard.press('Escape').catch(() => {});
      const objSelect = main.locator('.industry-cluster-select');
      const selectViews = objSelect.locator('.arco-select-view');
      const selectCount = await selectViews.count();
      const pickOption = async (optionText) => {
        const popup = page.locator('.arco-select-dropdown:visible');
        await popup.getByText(optionText, { exact: true }).click({ timeout: 8000 });
      };
      if (selectCount >= 2) {
        await selectViews.nth(0).click({ timeout: 8000 });
        await pickOption('新一代信息技术');
      }
      const industryView = selectCount >= 2 ? selectViews.nth(1) : selectViews.first();
      await industryView.click({ timeout: 8000 });
      await pickOption('半导体与集成电路');
      const marketSpin = main.getByRole('spinbutton', { name: '市场规模参数' });
      await marketSpin.click();
      const marketInput = marketSpin.locator('input');
      await marketInput.fill('');
      await marketInput.fill('88000');
      await expect(marketInput).toHaveValue('88000', { timeout: 3000 });
      await page.getByRole('button', { name: '开始分析' }).click();
      const resultTitle = main.getByText('产业周期分析结果');
      const viewResult = page.getByRole('button', { name: '查看分析结果' });
      let opened = false;
      for (let i = 0; i < 90 && !opened; i++) {
        if (await resultTitle.isVisible().catch(() => false)) {
          opened = true;
          break;
        }
        if (await viewResult.isVisible().catch(() => false)) {
          await viewResult.click();
          opened = true;
          break;
        }
        if (await main.getByText('本次分析生成失败').isVisible().catch(() => false)) {
          throw new Error('修订 分析任务失败，无法打开结果页');
        }
        await page.waitForTimeout(1000);
      }
      await expect(resultTitle).toBeVisible({ timeout: 15000 });
      await expect(main.getByText(/导入|成长|成熟|衰退|蓄势/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、「市场规模」为 88000
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('88000').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
