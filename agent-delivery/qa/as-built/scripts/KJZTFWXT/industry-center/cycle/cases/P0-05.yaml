id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00547
priority: P0
title: 分析对象两级下拉回显联动且变更不自动起任务
entry_id: chain-cycle
preconditions:
- 已进入产业周期分析页
locators:
  industry: select aria-label「集群」
  chain: select aria-label「产业」
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=cycle&tab=cycle
- action: click
  target: 产业下拉改选「生物产业」
- action: evaluate
  note: 回看产业链联动与是否自动起任务
expect:
- note: 分析对象为产业与产业链两级下拉且选定后回显所选对象
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=cycle&tab=cycle', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await expect(page.locator('.arco-select-view[aria-label="集群"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view[aria-label="产业"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('新一代信息技术')
- note: 产业变更后产业链下拉联动刷新
  assert: |-
    await page.locator('.arco-select-view[aria-label="集群"]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物产业' }).first().click(); await page.waitForTimeout(800); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('生物产业'); const chainTxt = (await page.locator('.arco-select-view[aria-label="产业"]').innerText()).trim(); /* 联动后可空或换链，均算刷新 */ if (chainTxt === 'INB1701') throw new Error('产业已切生物产业但链仍锁定 INB1701，疑未联动')
- note: 对象变更不自动创建分析任务
  assert: |-
    const url = page.url(); if (/view=result/.test(url)) throw new Error('切对象后自动进入结果态'); const t = await page.locator('main').innerText(); if (/可视化分析过程/.test(t)) throw new Error('切对象后出现分析过程，疑自动起任务')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 现场 aria-label「集群/产业」对应用例「产业/产业链」；默认「新一代信息技术 / INB1701」。选项集合 observed。
tier: B
