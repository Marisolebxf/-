id: P1-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00559
priority: P1
title: 恢复历史任务复用同一任务不覆盖快照
entry_id: chain-cycle
preconditions:
- 诊断记录含至少一条已完成周期任务
locators:
  view_result: button 查看结果
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=cycle&tab=cycle
- action: click
  target: 诊断记录→查看结果
expect:
- note: 恢复进入对应 Tab 或不可变结果
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=cycle&tab=cycle', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('SKIP: 无已完成可恢复'); await view.click(); await page.waitForTimeout(2500); await expect(page.getByText('产业周期分析结果')).toBeVisible({ timeout: 12000 }); await expect(page).toHaveURL(/view=result|task_id=/)
- note: 复用同一任务、不新建不覆盖快照
  assert: |-
    const id = (page.url().match(/task_id=([^&]+)/)||[])[1]; if (!id) throw new Error('URL 无 task_id'); await expect(page.getByText(id).first()).toBeVisible({ timeout: 8000 })
- note: 结果顶栏回显快照中的分析对象、不显示「未选分析对象」
  assert: |-
    const t = await page.locator('main').innerText(); if (t.includes('未选分析对象') || t.includes('尚未选择分析对象')) throw new Error('恢复结果出现未选分析对象'); if (!/分析对象/.test(t)) throw new Error('未见分析对象回显')
allow_skip: 无已完成任务时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 恢复后配置区草稿是否受影响 observed。
tier: B
