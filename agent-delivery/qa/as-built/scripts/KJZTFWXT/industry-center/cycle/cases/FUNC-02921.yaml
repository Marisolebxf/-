id: FUNC-02921
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02921
priority: P1
tier: B
title: 过程完成后点查看分析记录进入诊断记录并见本任务
entry_id: chain-cycle
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 02888 同款配置并发起，等待「分析结果已生成」后点「查看分析记录」（逻辑在 expect）
expect:
  - note: 1、进入诊断记录
    assert: |-
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const optSel =
        '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const pickSelectByAria = async (aria, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = main().locator('.arco-select-view[aria-label="' + aria + '"]').first();
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const pickAnalysisObject = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        const cv = main().locator('.arco-cascader-view').first();
        if (await cv.isVisible().catch(() => false)) {
          await cv.click({ timeout: 8000 });
          await page.waitForTimeout(400);
          const pop = page.locator('.arco-trigger-popup:visible').last();
          await pop.getByText('新一代信息技术', { exact: true }).first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
          await pop.getByText('半导体与集成电路', { exact: true }).first().click({ timeout: 8000 });
          return;
        }
        await pickSelectByAria('集群', '新一代信息技术');
        await pickSelectByAria('产业', '半导体与集成电路');
      };
      const pickTimeRange = async (label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const block = main().getByText('分析时间范围').first();
        await expect(block).toBeVisible({ timeout: 8000 });
        const trigger = block.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
      };
      const configure02888 = async () => {
        await pickAnalysisObject();
        await pickTimeRange('近5年');
        const market = main().locator('[aria-label="市场规模参数"] input, [aria-label="市场规模参数"]').first();
        if ((await market.count()) > 0) {
          await market.fill('88000');
        } else {
          await main().locator('[role=spinbutton]').first().fill('88000');
        }
        await page.waitForTimeout(200);
      };
      const waitProcessDone = async () => {
        for (let i = 0; i < 120; i++) {
          await page.waitForTimeout(500);
          const t = await main().innerText().catch(() => '');
          const u = page.url();
          if (/分析结果已生成/.test(t)) {
            const tid = new URL(u).searchParams.get('task_id') || (t.match(TID_RE) || [])[0] || '';
            globalThis.__func02921TaskId = tid;
            return;
          }
          if (/本次分析生成失败|ADS_SERIES_UNAVAILABLE/.test(t) && !/产业周期分析生成中/.test(t)) {
            throw new Error('修订 过程页 ADS 失败，未见「分析结果已生成」');
          }
        }
        throw new Error('修订 120 轮内未见「分析结果已生成」');
      };
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 15000 });
      let body = await main().innerText().catch(() => '');
      if (/分析结果已生成/.test(body)) {
        globalThis.__func02921TaskId =
          new URL(page.url()).searchParams.get('task_id') || (body.match(TID_RE) || [])[0] || '';
      } else if (/产业周期分析结果/.test(body) && /view=result/.test(page.url())) {
        const rerun = page.getByRole('button', { name: '重新分析' }).first();
        if (await rerun.isVisible().catch(() => false)) {
          await rerun.click({ timeout: 8000 });
          await page.waitForTimeout(800);
          await configure02888();
          const start = page.getByRole('button', { name: '开始分析' }).first();
          await start.click({ timeout: 10000 });
          await waitProcessDone();
        } else {
          throw new Error('修订 已在结果页且无重新分析，无法回到过程完成态');
        }
      } else {
        await configure02888();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        if (await start.isDisabled()) throw new Error('修订 开始分析仍禁用，分析对象未选全');
        await start.click({ timeout: 10000 });
        await waitProcessDone();
      }
      await expect(main().getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
      const recordsBtn = page.getByRole('button', { name: '查看分析记录' }).first();
      await expect(recordsBtn).toBeVisible({ timeout: 8000 });
      await recordsBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1000);
      await expect(main().getByRole('heading', { name: '诊断记录', level: 2 })).toBeVisible({ timeout: 15000 });
      await expect(page.getByRole('tab', { name: '诊断记录' }).first()).toHaveAttribute('aria-selected', 'true');
  - note: 2、列表中有这条任务
    assert: |-
      const main = page.locator('main.content-shell-layout, main').first();
      const taskId = globalThis.__func02921TaskId;
      if (!taskId) throw new Error('修订 未捕获本任务编号');
      const row = main.locator('tbody tr, .arco-table-tr').filter({ hasText: taskId }).first();
      await expect(row).toBeVisible({ timeout: 10000 });
      await expect(row.getByText('产业周期分析')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
