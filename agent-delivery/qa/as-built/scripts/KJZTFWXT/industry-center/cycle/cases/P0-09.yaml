id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00554
priority: P0
title: 结果含预测摘要且重新分析不覆盖旧结果
entry_id: chain-cycle
preconditions:
- 已有一次完成任务结果
locators:
  view_result: button「查看结果」
  new_analysis: button「按此配置新建分析」或开始分析
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=cycle&tab=cycle
- action: click
  target: 诊断记录→查看结果
- action: evaluate
  note: 浏览预测内容后新建分析
expect:
- note: 未来产业预测含关键驱动因素、潜在拐点与决策摘要
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/diagnosis?workspace=cycle&tab=cycle', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('SKIP: 无已完成结果可恢复'); await view.click(); await page.waitForTimeout(2500); const t = await page.locator('main').innerText(); for (const w of ['关键驱动因素','潜在拐点','决策摘要']) { if (!t.includes(w)) throw new Error('缺预测块: ' + w) }
- note: 界面无「已完成实时全网检索」完成态表述且降级说明可见
  assert: |-
    const t = await page.locator('main').innerText(); if (t.includes('已完成实时全网检索')) throw new Error('出现禁止的实时全网检索完成态表述'); if (!/降级|未返回|不伪造|检索快照/.test(t)) throw new Error('未见诚实降级/快照说明')
- note: 重新分析生成新任务与新结果且旧结果内容不变
  assert: |-
    const oldId = (page.url().match(/task_id=([^&]+)/)||[])[1] || ''; const btn = page.getByRole('button', { name: /按此配置新建分析|重新分析|开始分析/ }).first(); if (!(await btn.count())) throw new Error('SKIP: 无重新分析入口'); await btn.click(); await page.waitForTimeout(1500); /* 旧任务仍可在诊断记录找回 */ await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(800); if (oldId) await expect(page.getByText(oldId).first()).toBeVisible({ timeout: 8000 })
allow_skip: 无已完成结果或无新建分析入口时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘结果常显示「驱动因素未返回/拐点未返回」仍算区块呈现；「按此配置新建分析」为现场重跑入口。
tier: B
