id: FUNC-02895
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02895
priority: P0
title: 四个产业关键参数的默认值和数据状态正确
story: US-CHAIN-DIAG-01
entry_id: chain-cycle
tier: A
preconditions:
  - 刚进入产业周期分析页，参数未被手工改过
locators:
  param_table: 产业关键参数表（四行 spinbutton + 数据状态列）
  spins: role=spinbutton ×4
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=cycle&tab=cycle
  - action: evaluate
    note: 打开产业关键参数表（默认分析配置区可见）
expect:
  - note: 前置：产业周期分析页与产业关键参数表可见
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=cycle/);
      await expect(page).toHaveURL(/tab=cycle/);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业周期分析 SPA 404 ' + page.url());
      }
      await page.getByRole('tab', { name: '产业周期分析' }).first().click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(400);
      await expect(page.getByRole('heading', { name: '产业周期分析', level: 1 })).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('产业关键参数').first()).toBeVisible({ timeout: 8000 });
      const spins = page.locator('[role=spinbutton]');
      await expect(spins).toHaveCount(4, { timeout: 8000 });
      for (const name of ['市场规模', '市场增长率', '利润率', '技术成熟度']) {
        await expect(page.getByText(name, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
  - note: 1、市场规模为空，占位为「空则提交时由 ADS 预填」
    assert: |-
      const s0 = page.locator('[role=spinbutton]').nth(0);
      const v0 = await s0.inputValue();
      if (v0 !== '') throw new Error('市场规模应空，实际=' + v0);
      const ph = await s0.getAttribute('placeholder');
      if (ph !== '空则提交时由 ADS 预填') throw new Error('市场规模 placeholder=' + ph);
  - note: 2、市场增长率为 12.8，利润率为 10.6，技术成熟度为 84
    assert: |-
      const spins = page.locator('[role=spinbutton]');
      const v1 = await spins.nth(1).inputValue();
      const v2 = await spins.nth(2).inputValue();
      const v3 = await spins.nth(3).inputValue();
      if (v1 !== '12.8' || v2 !== '10.6' || v3 !== '84') {
        throw new Error('默认数值不符：期望 12.8/10.6/84 实际 ' + [v1, v2, v3].join('/'));
      }
  - note: 3、四行数据状态均为「可用」
    assert: |-
      const main = page.locator('main.content-shell-layout, main').first();
      const tableText = await main.innerText().catch(() => '');
      for (const name of ['市场规模', '市场增长率', '利润率', '技术成熟度']) {
        const idx = tableText.indexOf(name);
        if (idx < 0) throw new Error('表内未见行名 ' + name);
        const slice = tableText.slice(idx, idx + 80);
        if (!/可用/.test(slice)) {
          throw new Error(name + ' 行数据状态非「可用」：' + slice.replace(/\s+/g, ' ').slice(0, 60));
        }
      }
      const availInTable = await main.locator('tr').filter({ hasText: /市场规模|市场增长率|利润率|技术成熟度/ }).filter({ hasText: '可用' }).count();
      if (availInTable < 4) {
        const avail = await page.getByText('可用', { exact: true }).count();
        if (avail < 4) throw new Error('数据状态「可用」不足 4，tr=' + availInTable + ' text=' + avail);
      }
  - note: 表下有「参数范围校验通过」（用例附录 D 说明）
    assert: |-
      await expect(page.getByText('参数范围校验通过').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·edu tts/svcz entry-seed catalog_path=/industry-center/diagnosis?workspace=cycle&tab=cycle。步骤=刚进入页打开产业关键参数表（默认分析配置区）。
  D4·2026-10-20 rewrite-FUNC-02895 edu tts/svcz 深链与 sibling /industry-center/search 均 SPA 404（ENV-EDU-TTS-SVCZ-404-001，与 02888/02893 同根因）。断言口径对齐 P0-02/scout 与用例附录 D。
  四行名=市场规模/市场增长率/利润率/技术成熟度；数据状态列「可用」对齐用例「周期参数默认启用」作废后口径。第1行 placeholder 实勘=空则提交时由 ADS 预填（scout.json）。
  登录关评审 runner 前置。A 档零 allow_skip。
