id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01163
priority: P0
title: 默认子面板门户内容标题与说明文案正确
entry_id: chain-maintenance
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入维护管理页（深链 /industry-center/maintenance；未点击任何分类）
locators:
  panel_h2: H2「门户内容（产业全景）」
  desc: 「IC-43 编辑 / 审核 / 发布 / 版本 · SPEC-CMS 五块」
steps:
  - action: goto
    target: /industry-center/maintenance
  - action: evaluate
    note: 关对比篮浮层后回读默认子面板 H2 与说明文案
expect:
  - note: 子面板 H2 为「门户内容（产业全景）」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page.getByRole('heading', { name: '门户内容（产业全景）', level: 2 })).toBeVisible({ timeout: 8000 })
  - note: 说明文案为「IC-43 编辑 / 审核 / 发布 / 版本 · SPEC-CMS 五块」
    assert: |-
      await expect(page.getByText('IC-43 编辑 / 审核 / 发布 / 版本 · SPEC-CMS 五块')).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: 无头实勘默认右栏 H2「门户内容（产业全景）」与同区说明「IC-43 编辑 / 审核 / 发布 / 版本 · SPEC-CMS 五块」并存（parent DIV 同段）。操作按钮可见性归 01165、禁用态归 01166；CMS 五块深验待子域轮次。对比篮浮层可见才关，非本条断言对象。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
