id: P0-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01162
priority: P0
title: 左侧导航三个分组标题依次正确
entry_id: chain-maintenance
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入维护管理页（深链 /industry-center/maintenance）
locators:
  group_h2: H2「内容运营」「图谱运营」「分析配置」（左栏三分组；顺序即 DOM 出现序）
steps:
  - action: goto
    target: /industry-center/maintenance
  - action: evaluate
    note: 关对比篮浮层后核对左侧三个分组 H2 名称与顺序
expect:
  - note: 三个分组标题依次为「内容运营」「图谱运营」「分析配置」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const groups = ['内容运营','图谱运营','分析配置']; for (const g of groups) { await expect(page.getByRole('heading', { name: g, level: 2 })).toBeVisible({ timeout: 8000 }) }; const order = await page.evaluate((groups) => [...document.querySelectorAll('h2')].map(h => (h.innerText||'').trim()).filter(t => groups.includes(t)), groups); if (order.join('|') !== groups.join('|')) throw new Error('分组顺序不符: ' + order.join(','))
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: 无头实勘 headings 含 H2「内容运营」→「图谱运营」→「分析配置」（其后为右栏「门户内容（产业全景）」等，断言 filter 仅三组）。分组内挂载分类归 01164（P1-01）；15 分类归 01161（P0-03）。对比篮浮层可见才关，非本条断言对象。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
