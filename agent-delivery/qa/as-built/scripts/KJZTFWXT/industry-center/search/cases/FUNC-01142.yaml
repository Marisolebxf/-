id: FUNC-01142
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01142
priority: P0
title: 侧栏进入产业查询路由与页标题正确
entry_id: chain-search
tier: A
preconditions:
  - 系统可访问；已登录 admin
locators:
  menu_group: 侧栏分组「产业链分析」
  menu_leaf: 侧栏项「产业查询」（落点 /industry-center/search）
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 展开「产业链分析」并点「产业查询」；路由与页标题在 expect 判定
expect:
  - note: 路由为 /industry-center/search
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const searchItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^产业查询$/ });
      const expandChainGroup = async () => {
        if (await searchItem().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      await dismissBasket();
      await expandChainGroup();
      const leaf = searchItem();
      await expect(leaf.first()).toBeVisible({ timeout: 10000 });
      await leaf.first().click({ timeout: 10000 });
      await page.waitForURL(/\/industry-center\/search/, { timeout: 15000 });
      await expect(page).toHaveURL(/\/industry-center\/search/);
  - note: 页标题为「产业查询」
    assert: |-
      await expect(page).toHaveTitle(/产业查询/);
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: 路由 catalog_path /industry-center/search；侧栏类先 goto sibling /industry-center/overview 再点 menu_leaf「产业查询」。侧栏项为 div.arco-menu-item；已展开时勿再点「产业链分析」标题以免折叠。现场 document.title 常为「产业查询 - 科技专题服务系统」，用例预期「页标题为产业查询」以 title 含该词判定。说明文案归 01143；三 Tab 构成归 01144。对比篮可见才关。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
