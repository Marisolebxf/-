id: FUNC-02711
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02711
priority: P0
tier: B
title: 名称排序下切换方向后首条再变化
entry_id: chain-search
preconditions:
  - 检索结果排序已是「名称」
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 重点产业检索结果→排序为「名称」→记录首条→点击「切换排序方向」
expect:
  - note: 1、首条与点击前不同
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const region = () => page.locator('[role=region][aria-label="产业查询结果"]');
      const getSortSelect = () => {
        const tools = region().locator('.industry-search-result-tools');
        const sortBar = tools.locator('.flex.shrink-0.items-center').filter({
          has: page.getByRole('button', { name: '切换排序方向' }),
        });
        return sortBar.locator('.arco-select').first();
      };
      const firstResultCard = () =>
        region().locator('.industry-search-result-list .industry-search-result-card').first();
      const getFirstCardName = async () => {
        const first = firstResultCard();
        await expect(first).toBeVisible({ timeout: 15000 });
        const name = ((await first.locator('h3').textContent({ timeout: 5000 })) || '')
          .replace(/\s+/g, ' ')
          .trim();
        if (!name) throw new Error('首条结果缺少名称 h3');
        return name;
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      if ((await page.getByText('抱歉，页面不存在').count()) > 0) {
        throw new Error('ENV-ENTRY-UNREACHABLE：产业查询深链不可用');
      }
      const smartTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^智能检索$/ }).first();
      await expect(smartTab).toBeVisible({ timeout: 10000 });
      const sAria = await smartTab.getAttribute('aria-selected');
      const sCls = (await smartTab.getAttribute('class')) || '';
      if (sAria !== 'true' && !sCls.includes('active')) {
        await smartTab.click();
        await page.waitForTimeout(400);
      }
      const chip = page.locator('.enterprise-search-hot-button').filter({ hasText: /^重点产业$/ }).first();
      await expect(chip).toBeVisible({ timeout: 8000 });
      await chip.scrollIntoViewIfNeeded().catch(() => {});
      await chip.click({ timeout: 8000 });
      const waitResult = async () => {
        const deadline = Date.now() + 25000;
        while (Date.now() < deadline) {
          await expect(region()).toBeVisible({ timeout: 5000 });
          const state = await region().getAttribute('data-search-state');
          const cardCount = await region()
            .locator('.industry-search-result-list .industry-search-result-card')
            .count();
          if ((state === 'result' || state === 'permission') && cardCount >= 2) return;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「重点产业」后未进入检索结果态');
      };
      await waitResult();
      const sortSelect = getSortSelect();
      await expect(sortSelect).toBeVisible({ timeout: 8000 });
      let toolsText = ((await region().locator('.industry-search-result-tools').innerText()) || '').replace(
        /\s+/g,
        ' ',
      );
      if (!toolsText.includes('名称')) {
        await sortSelect.click({ timeout: 8000 });
        await page.waitForTimeout(300);
        const pop = page.locator('.arco-trigger-popup:visible');
        await expect(pop).toBeVisible({ timeout: 8000 });
        const nameOpt = pop.locator('.arco-select-option').filter({ hasText: /^名称$/ }).first();
        await expect(nameOpt).toBeVisible({ timeout: 8000 });
        await nameOpt.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        toolsText = ((await region().locator('.industry-search-result-tools').innerText()) || '').replace(
          /\s+/g,
          ' ',
        );
        if (!toolsText.includes('名称')) {
          throw new Error('前置：排序应为「名称」，现场 tools=' + toolsText.slice(0, 120));
        }
      }
      const beforeToggle = await getFirstCardName();
      const toggleBtn = page.getByRole('button', { name: '切换排序方向' });
      await expect(toggleBtn).toBeVisible({ timeout: 8000 });
      await toggleBtn.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const afterToggle = await getFirstCardName();
      if (afterToggle === beforeToggle) {
        throw new Error(
          '首条应与点击前不同：点击前「' + beforeToggle + '」点击后仍为「' + afterToggle + '」',
        );
      }
on_fail: 截图 + 抄 X-Trace-Id
as_built_note: >-
  深链 /industry-center/search；前置同册 02691「重点产业」+ 02710 改排序「名称」；步骤点击 aria-label=切换排序方向；
  首条=.industry-search-result-card 首卡 h3。登录与关评审由 runner。
