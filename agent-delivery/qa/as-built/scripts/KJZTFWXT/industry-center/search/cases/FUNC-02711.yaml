id: FUNC-02711
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02711
priority: P0
title: 名称排序下切换方向后首条再变化
entry_id: chain-search
tier: A
preconditions:
  - 已搜出检索结果
  - 检索结果排序已是「名称」
locators:
  result_region: '[role=region][aria-label="产业查询结果"]'
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 出结果后排序选「名称」，记录切换前首条
expect:
  - note: 前置：检索结果且排序已为「名称」
    assert: |-
      const region = () => page.locator('[role=region][aria-label="产业查询结果"]');
      const getSortView = () =>
        region().locator('.industry-search-result-tools .arco-select .arco-select-view').first();
      const getFirstCardName = async () => {
        const first = region().locator('.industry-search-result-card').first();
        await expect(first).toBeVisible({ timeout: 10000 });
        const name = ((await first.locator('.industry-search-result-title h3').innerText()) || '')
          .replace(/\s+/g, ' ')
          .trim();
        if (!name) throw new Error('首条结果缺少名称 h3');
        return name;
      };
      const waitResult = async () => {
        const deadline = Date.now() + 25000;
        while (Date.now() < deadline) {
          await expect(region()).toBeVisible({ timeout: 5000 });
          const state = await region().getAttribute('data-search-state');
          const regionText = ((await region().innerText()) || '').replace(/\s+/g, ' ');
          if (state === 'result' || state === 'permission') return regionText;
          if (/产业查询返回\s*\d+\s*条/.test(regionText) || /高级筛选结果/.test(regionText)) return regionText;
          await page.waitForTimeout(400);
        }
        throw new Error('未进入检索结果态');
      };
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      let regionText = await waitResult();
      let state = await region().getAttribute('data-search-state');
      if (state !== 'result' && state !== 'permission' && !/产业查询返回|高级筛选结果/.test(regionText)) {
        const smartTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^智能检索$/ }).first();
        await expect(smartTab).toBeVisible({ timeout: 10000 });
        const chip = page.locator('.enterprise-search-hot-button').filter({ hasText: /^重点产业$/ }).first();
        await expect(chip).toBeVisible({ timeout: 8000 });
        await chip.click({ timeout: 8000 });
        regionText = await waitResult();
        state = await region().getAttribute('data-search-state');
      }
      if (/产业查询无匹配结果/.test(regionText) && /共\s*0\s*条/.test(regionText)) {
        throw new Error('前置：检索结果为空');
      }
      let n = null;
      const m2 = regionText.match(/产业查询返回\s*(\d+)\s*条/);
      const m1 = regionText.match(/检索结果[\s\S]{0,40}?共\s*(\d+)\s*条/);
      if (m2) n = parseInt(m2[1], 10);
      else if (m1) n = parseInt(m1[1], 10);
      if (n === null || Number.isNaN(n) || n < 2) {
        throw new Error('前置：至少 2 条结果才能验切换方向变首条');
      }
      const sortView = getSortView();
      await expect(sortView).toBeVisible({ timeout: 8000 });
      let triggerText = ((await sortView.innerText()) || '').replace(/\s+/g, ' ');
      if (!triggerText.includes('名称')) {
        await sortView.click({ timeout: 8000 });
        await page.waitForTimeout(250);
        const dropdown = page.locator('.arco-select-dropdown:visible').last();
        await expect(dropdown).toBeVisible({ timeout: 8000 });
        const nameOpt = dropdown.locator('.arco-select-option').filter({ hasText: /^名称$/ }).first();
        const optVisible = await nameOpt.isVisible().catch(() => false);
        if (optVisible) {
          await nameOpt.click({ timeout: 8000 });
        } else {
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
        }
        await page.waitForTimeout(900);
        triggerText = ((await sortView.innerText()) || '').replace(/\s+/g, ' ');
      }
      if (!triggerText.includes('名称')) {
        throw new Error('前置：排序应为「名称」，现场 trigger=' + triggerText);
      }
      globalThis.__func02711_firstBeforeToggle = await getFirstCardName();
      globalThis.__func02711_ready = true;
  - note: 1、首条与点击前不同
    assert: |-
      if (!globalThis.__func02711_ready) throw new Error('前置：未完成名称排序准备');
      const before = globalThis.__func02711_firstBeforeToggle;
      if (!before) throw new Error('缺少切换方向前首条名称');
      const sortDirBtn = page.getByRole('button', { name: '切换排序方向' });
      await expect(sortDirBtn).toBeVisible({ timeout: 8000 });
      await sortDirBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      const first = region.locator('.industry-search-result-card').first();
      await expect(first).toBeVisible({ timeout: 10000 });
      const after = ((await first.locator('.industry-search-result-title h3').innerText()) || '')
        .replace(/\s+/g, ' ')
        .trim();
      if (!after) throw new Error('切换后首条缺少名称');
      if (after === before) {
        throw new Error('名称排序切换方向后首条应变化：切换前「' + before + '」切换后仍为「' + after + '」');
      }
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
