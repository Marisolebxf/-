id: FUNC-02701
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02701
priority: P0
title: 已入篮产业移出后按钮改回加入
entry_id: chain-search
tier: A
preconditions:
  - 已执行 02700，「生物」按钮为移出
locators:
  result_region: '[role=region][aria-label="产业查询结果"]'
  recommend_list: .industry-search-recommendation-list
  recommend_card: .industry-search-recommendation-card
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 前置满足后点击「将生物移出对比篮」
expect:
  - note: 前置：推荐产业「生物」按钮为「将生物移出对比篮」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region).toBeVisible({ timeout: 10000 });
      const state = await region.getAttribute('data-search-state');
      if (state !== 'recommendation') {
        throw new Error('前置应为推荐产业 recommendation 态，实际 data-search-state=' + state);
      }
      const list = page.locator('.industry-search-recommendation-list');
      await expect(list).toBeVisible({ timeout: 8000 });
      const card = list.locator('.industry-search-recommendation-card').filter({ hasText: '生物' }).first();
      await expect(card).toBeVisible({ timeout: 8000 });
      const joinBtn = card.getByRole('button', { name: '将生物加入对比篮', exact: true });
      const removeBtn = card.getByRole('button', { name: '将生物移出对比篮', exact: true });
      if (await joinBtn.count()) {
        await joinBtn.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      }
      await expect(removeBtn).toBeVisible({ timeout: 8000 });
  - note: 步骤：点击「将生物移出对比篮」
    assert: |-
      const list = page.locator('.industry-search-recommendation-list');
      const card = list.locator('.industry-search-recommendation-card').filter({ hasText: '生物' }).first();
      await card.getByRole('button', { name: '将生物移出对比篮', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
  - note: 1、该按钮变回「将生物加入对比篮」
    assert: |-
      const list = page.locator('.industry-search-recommendation-list');
      const card = list.locator('.industry-search-recommendation-card').filter({ hasText: '生物' }).first();
      const joinBtn = card.getByRole('button', { name: '将生物加入对比篮', exact: true });
      await expect(joinBtn).toBeVisible({ timeout: 8000 });
      await expect(card.getByRole('button', { name: '将生物移出对比篮', exact: true })).toHaveCount(0);
  - note: 2、不出现确认弹层（用例备注无确认框）
    assert: |-
      const modal = page.locator('.arco-modal-wrapper:visible, .arco-popconfirm-popup:visible');
      const mc = await modal.count();
      if (mc > 0) {
        throw new Error('点击移出对比篮不应弹出确认层，现场可见弹层 ' + mc + ' 个');
      }
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/search；推荐态 data-search-state=recommendation。
  对比篮切换按钮 aria-label「将生物加入/移出对比篮」（IndustrySearchObjectCard，scout-base 一致）。
  前置若仍为加入态则先点加入（对称 02700）。无确认框。对比篮浮层可见才关。
  登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
