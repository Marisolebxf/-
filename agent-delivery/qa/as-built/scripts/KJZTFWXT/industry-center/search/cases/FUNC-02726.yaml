id: FUNC-02726
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02726
priority: P1
tier: B
title: 对象类型条件的比较符只有等于
entry_id: chain-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: click
    target: 高级筛选
  - action: evaluate
    note: 已把「对象类型」加入条件行并展开比较符（同册 02717/02718）
expect:
  - note: 1、选项只有「等于」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 12000 });
      await expect(fieldLib.getByRole('heading', { name: '高级筛选 · 字段库' })).toBeVisible({ timeout: 8000 });
      const selectedText = fieldLib.getByText(/已选 \d+ 个条件/);
      await expect(selectedText).toBeVisible({ timeout: 8000 });
      const selectedCount = ((await selectedText.innerText()) || '').match(/已选 (\d+) 个条件/);
      if (!selectedCount || selectedCount[1] === '0') {
        const objTypeTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '对象类型' }).first();
        await expect(objTypeTag).toBeVisible({ timeout: 8000 });
        await objTypeTag.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      }
      await expect(fieldLib.getByText('已选 1 个条件', { exact: true })).toBeVisible({ timeout: 8000 });
      const condRow = page.locator('.condition-builder').filter({ hasText: '对象类型' }).first();
      await expect(condRow).toBeVisible({ timeout: 8000 });
      const opSelect = condRow.locator('.condition-builder__op .arco-select-view');
      await expect(opSelect).toBeVisible({ timeout: 8000 });
      await opSelect.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = pop.locator('.arco-select-option');
      await expect(opts).toHaveCount(1);
      await expect(pop.getByText('等于', { exact: true })).toBeVisible();
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id
