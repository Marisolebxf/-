id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01145
priority: P0
title: 智能检索输入区构成与占位提示正确
entry_id: chain-search
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入产业查询页且当前为「智能检索」Tab（默认）
locators:
  search_input: textbox placeholder「输入产业、产业链、链位方向或同义词，例如“光刻”“低空交通”」
  search_btn: button「搜索」（class 含 arco-input-search-btn）
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 关闭对比篮浮层（若可见）后核智能检索占位与搜索按钮
expect:
  - note: 输入框占位含四类检索对象与示例词「光刻」「低空交通」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page.locator('.enterprise-search-mode-tabs [role=tab]').nth(0)).toHaveAttribute('aria-selected', 'true'); const input = page.getByPlaceholder(/输入产业、产业链、链位方向或同义词/); await expect(input).toBeVisible({ timeout: 8000 }); const ph = await input.getAttribute('placeholder'); if (!ph || !ph.includes('产业') || !ph.includes('产业链') || !ph.includes('链位方向') || !ph.includes('同义词') || !ph.includes('光刻') || !ph.includes('低空交通')) throw new Error('placeholder 不符: ' + ph)
  - note: 「搜索」按钮可见可点且为 arco-input-search-btn
    assert: |-
      const btn = page.getByRole('button', { name: '搜索', exact: true }); await expect(btn).toBeVisible({ timeout: 8000 }); await expect(btn).toBeEnabled(); const cls = (await btn.getAttribute('class')) || ''; if (!/arco-input-search-btn/.test(cls)) throw new Error('搜索按钮缺 arco-input-search-btn: ' + cls)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 实勘占位原文=「输入产业、产业链、链位方向或同义词，例如“光刻”“低空交通”」（中文弯引号包裹示例词）；搜索按钮 class 含 arco-input-search-btn。搜索触发归 01147（P0-04）。对比篮浮层可见才关。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
