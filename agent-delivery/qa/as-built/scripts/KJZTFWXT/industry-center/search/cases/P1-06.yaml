id: P1-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01158
priority: P1
title: 检索无命中时结果区呈现明确空态提示
entry_id: chain-search
preconditions:
- 已进入产业查询页；智能检索 Tab
locators:
  search_input: 智能检索 textbox
  search_btn: button「搜索」
  empty_hint: 产业查询无匹配结果 / 空结果不补演示数据
steps:
- action: goto
  target: /industry-center/search
- action: fill
  target: 检索框
  value: zzz_no_hit_xyz_99881
- action: click
  target: 搜索
- action: wait
  for: 空态
expect:
- note: 结果区呈现明确的空态提示
  assert: |-
    const box = page.getByPlaceholder(/输入产业、产业链、链位方向或同义词/); await box.fill('zzz_no_hit_xyz_99881'); await page.getByRole('button', { name: '搜索', exact: true }).click(); await page.waitForTimeout(800); const region = page.locator('[role=region][aria-label="产业查询结果"]'); await expect(region.getByText('产业查询无匹配结果')).toBeVisible({ timeout: 12000 }); await expect(region.getByText(/共 0 条|空结果不补演示数据/)).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 无命中词由执行期选定（fixtures.no_hit_keyword）；空态文案实勘为「产业查询无匹配结果」+「空结果不补演示数据」。
tier: B
