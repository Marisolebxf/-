id: FUNC-02709
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02709
priority: P0
title: 排序下拉选项个数正确
entry_id: chain-search
tier: A
preconditions:
  - 已搜出检索结果
locators:
  result_region: '[role=region][aria-label="产业查询结果"]'
  result_tools: .industry-search-result-tools
  sort_select: 结果工具条内 prefix「排序」的 Arco Select（邻接 aria-label=切换排序方向）
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 智能检索出结果后展开「排序」；选项个数在 expect 判定
expect:
  - note: 前置：已搜出检索结果（智能检索「光刻」）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业查询入口 SPA 404 ' + page.url());
      }
      const smartTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^智能检索$/ }).first();
      await expect(smartTab).toBeVisible({ timeout: 10000 });
      const sAria = await smartTab.getAttribute('aria-selected');
      const sCls = (await smartTab.getAttribute('class')) || '';
      if (sAria !== 'true' && !sCls.includes('active')) {
        await smartTab.click();
        await page.waitForTimeout(400);
      }
      const input = page.getByPlaceholder(/输入产业、产业链、链位方向或同义词/);
      await expect(input).toBeVisible({ timeout: 8000 });
      await input.fill('光刻');
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(800);
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region).toBeVisible({ timeout: 15000 });
      await expect(region.getByRole('heading', { name: '检索结果' })).toBeVisible({ timeout: 15000 });
      const text = ((await region.innerText()) || '').replace(/\s+/g, ' ');
      if (/产业查询无匹配结果/.test(text) && /共\s*0\s*条/.test(text)) {
        throw new Error('前置：光刻检索为空，无法验排序下拉');
      }
      let n = null;
      const m1 = text.match(/共\s*(\d+)\s*条/);
      const m2 = text.match(/产业查询返回\s*(\d+)\s*条/);
      if (m1) n = parseInt(m1[1], 10);
      else if (m2) n = parseInt(m2[1], 10);
      if (n === null || Number.isNaN(n) || n < 1) {
        throw new Error('前置：未能解析大于 0 的结果条数；片段=' + text.slice(0, 160));
      }
      globalThis.__func02709_hasResults = true;
  - note: 1、展开「排序」后选项为「目录推荐顺序」「名称」「最近更新」，共 3 个
    assert: |-
      if (!globalThis.__func02709_hasResults) throw new Error('前置：未搜出检索结果');
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      const tools = region.locator('.industry-search-result-tools');
      await expect(tools).toBeVisible({ timeout: 8000 });
      const sortBar = tools.locator('.flex.shrink-0.items-center').filter({
        has: page.getByRole('button', { name: '切换排序方向' }),
      });
      const sortSelect = sortBar.locator('.arco-select').first();
      await expect(sortSelect).toBeVisible({ timeout: 8000 });
      await sortSelect.locator('.arco-select-view').click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const pop = page.locator('.arco-trigger-popup:visible');
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const count = await options.count();
      if (count !== 3) {
        const labels = [];
        for (let i = 0; i < count; i++) {
          labels.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
        }
        throw new Error('排序选项应为 3 个，实际 count=' + count + ' labels=' + JSON.stringify(labels));
      }
      const want = ['目录推荐顺序', '名称', '最近更新'];
      const got = [];
      for (let i = 0; i < 3; i++) {
        got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error('排序选项顺序/文案不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got));
        }
      }
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/search；前置=智能检索「光刻」（testdata smart_search.keyword_primary）。
  排序=ResultToolbar a-select prefix「排序」，选项 industrySearchConfig sortOptions（目录推荐顺序/名称/最近更新）。
  选择器 scoped 在 region 内 sortBar（邻接切换排序方向按钮），口径对齐 FUNC-02710（P7）。登录与关内部评审由 runner 前置。A 档零 allow_skip。
  2026-10-20 edu.itic-sci.com/tts/svcz 机跑：goto /industry-center/search 落 SPA 404，ENV-EDU-TTS-SVCZ-404-001 → ledger blocked；断言与 locators 仍依 scout/env-gate G5+fixtures。
