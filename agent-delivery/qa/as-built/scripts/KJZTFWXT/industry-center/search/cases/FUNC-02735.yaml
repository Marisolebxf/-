id: FUNC-02735
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02735
priority: P1
title: 无命中时结果区给出空态文案
entry_id: chain-search
tier: B
preconditions:
  - 当前为「智能检索」Tab
locators:
  search_input: textbox placeholder 含「输入产业、产业链、链位方向或同义词」
  search_btn: button「搜索」（exact）
  result_region: '[role=region][aria-label="产业查询结果"]'
  empty_title: 产业查询无匹配结果
  empty_count: 共 0 条
  empty_hint: 空结果不补演示数据
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 输入无业务含义关键词并点「搜索」；三条空态预期在 expect 分步判定
expect:
  - note: 前置：智能检索 Tab；步骤：填入无命中词并搜索
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业查询入口 SPA 404 ' + page.url());
      }
      const smart = page.locator('.enterprise-search-mode-tabs [role=tab]').nth(0);
      await expect(smart).toBeVisible({ timeout: 10000 });
      const aria = await smart.getAttribute('aria-selected');
      const cls = (await smart.getAttribute('class')) || '';
      if (aria !== 'true' && !cls.includes('active')) {
        throw new Error('前置应为智能检索 Tab');
      }
      const noHit = 'zzz_no_hit_xyz_99881';
      const input = page.getByPlaceholder(/输入产业、产业链、链位方向或同义词/);
      await expect(input).toBeVisible({ timeout: 8000 });
      await input.fill(noHit);
      await expect(input).toHaveValue(noHit, { timeout: 5000 });
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(800);
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region).toBeVisible({ timeout: 15000 });
  - note: 1、出现「产业查询无匹配结果」
    assert: |-
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region.getByText('产业查询无匹配结果', { exact: true }).first()).toBeVisible({
        timeout: 12000,
      });
  - note: 2、结果为「共 0 条」
    assert: |-
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region.getByText(/共\s*0\s*条/).first()).toBeVisible({ timeout: 8000 });
  - note: 3、出现「空结果不补演示数据」
    assert: |-
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region.getByText('空结果不补演示数据', { exact: true }).first()).toBeVisible({
        timeout: 8000,
      });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  无命中词=fixtures/testdata.yaml smart_search.no_hit_keyword（scout-no-hit 实勘一致）。
  空态三件套：产业查询无匹配结果 + 共 0 条 + 空结果不补演示数据（检索结果 h2 区）。
  路由 catalog_path /industry-center/search。对比篮遮挡 dismiss。登录与关内部评审由 runner 前置。B 档零 allow_skip。
