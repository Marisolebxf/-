id: FUNC-02707
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02707
priority: P0
tier: B
title: 检索结果展开对象类型下拉选项为全部产业产业链共3个
entry_id: chain-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 智能检索「光刻」出结果后展开「对象类型」；选项在 expect 判定
expect:
  - note: 选项为「全部」「产业」「产业链」，共 3 个
    assert: |-
      const main = page.locator('main');
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      const input = main.getByPlaceholder(/输入产业、产业链、链位方向或同义词/);
      await expect(input).toBeVisible({ timeout: 8000 });
      await input.fill('光刻');
      const btn = main.getByRole('button', { name: '搜索', exact: true });
      await expect(btn).toBeEnabled();
      await btn.click();
      const region = main.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region.getByRole('heading', { name: '检索结果' })).toBeVisible({ timeout: 12000 });
      await expect(region.getByText(/产业查询返回 \d+ 条结果/)).toBeVisible({ timeout: 12000 });
      const tools = region.locator('.industry-search-result-tools');
      await expect(tools).toBeVisible({ timeout: 8000 });
      const typeRow = tools.filter({ hasText: '对象类型' });
      await expect(typeRow).toBeVisible({ timeout: 8000 });
      const selectView = typeRow.locator('.arco-select-view').first();
      await expect(selectView).toBeVisible({ timeout: 8000 });
      await selectView.click({ timeout: 8000 });
      const dropdown = page.locator('.arco-select-dropdown:visible');
      await expect(dropdown).toBeVisible({ timeout: 8000 });
      await expect(dropdown.getByText('全部', { exact: true })).toBeVisible();
      await expect(dropdown.getByText('产业', { exact: true })).toBeVisible();
      await expect(dropdown.getByText('产业链', { exact: true })).toBeVisible();
      const options = dropdown.locator('.arco-select-option');
      await expect(options).toHaveCount(3);
on_fail: 截图 + 抄 X-Trace-Id
