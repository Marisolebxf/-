id: P1-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01153
priority: P1
title: 切至查产业 Tab 后内容区切换为该面板
entry_id: chain-search
preconditions:
- 已进入产业查询页
locators:
  tab_industry: tab「查产业」
  industry_input: textbox placeholder 含「输入产业或产业链名称」
steps:
- action: goto
  target: /industry-center/search
- action: click
  target: 查产业
- action: evaluate
  note: 浏览内容区呈现（控件构成 observed）
expect:
- note: 内容区由智能检索面板切为「查产业」Tab 内容区
  assert: |-
    const mode = page.locator('[aria-label="检索模式"]'); await mode.getByRole('tab', { name: '查产业' }).click(); await page.waitForTimeout(600); await expect(mode.getByRole('tab', { name: '查产业' })).toHaveAttribute('aria-selected', 'true'); await expect(page).toHaveURL(/mode=industry/); await expect(page.getByPlaceholder(/输入产业或产业链名称/)).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder(/输入产业、产业链、链位方向或同义词/)).toHaveCount(0)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 查产业面板控件构成未深勘进预期；实勘 placeholder「输入产业或产业链名称，例如“生命健康”“集成电路产业链”」+ 示例 chip 不同——构成补用例待后续轮次。
tier: B
