id: FUNC-02730
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02730
priority: P1
tier: B
title: 空名称点确定时保存筛选模板对话框保持打开
entry_id: chain-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 高级筛选已选 1 条件、打开保存筛选模板、名称框为空、点击确定（前置+步骤）
expect:
  - note: 1、对话框保持打开
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').nth(2);
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      const objTypeTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '对象类型' }).first();
      await expect(objTypeTag).toBeVisible({ timeout: 8000 });
      await objTypeTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(fieldLib.getByText('已选 1 个条件', { exact: true })).toBeVisible({ timeout: 8000 });
      const saveBtn = page.getByRole('button', { name: '保存为查询方案' });
      await expect(saveBtn).toBeVisible({ timeout: 8000 });
      await saveBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '保存筛选模板' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      await expect(modal.getByText('保存筛选模板')).toBeVisible({ timeout: 8000 });
      const nameInput = modal.locator('input').first();
      await expect(nameInput).toBeVisible({ timeout: 5000 });
      const nameVal = await nameInput.inputValue().catch(() => '');
      if (nameVal.trim()) {
        await nameInput.fill('');
        await page.waitForTimeout(200);
      }
      await expect(nameInput).toHaveValue('', { timeout: 3000 });
      const okBtn = modal.locator('.arco-modal-footer .arco-btn-primary').filter({ hasText: '确定' });
      await expect(okBtn).toBeVisible({ timeout: 5000 });
      await okBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const dlg = page.getByRole('dialog').filter({ hasText: '保存筛选模板' });
      await expect(dlg).toBeVisible({ timeout: 8000 });
      await expect(dlg.getByPlaceholder('模板名称')).toBeVisible({ timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
