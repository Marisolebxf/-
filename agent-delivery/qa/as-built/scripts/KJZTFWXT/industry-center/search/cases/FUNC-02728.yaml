id: FUNC-02728
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02728
priority: P1
title: 使用查询方案套用集成电路进入检索结果
entry_id: chain-search
tier: B
preconditions:
  - 高级筛选已打开
  - 使用查询方案中有「集成电路」
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 高级筛选 Tab、使用查询方案点「集成电路」
expect:
  - note: 1、出现「检索结果」
    assert: |-
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForURL(/[?&]mode=advanced/, { timeout: 10000 });
      const usePlanBtn = page.getByRole('button', { name: /使用查询方案/ });
      await expect(usePlanBtn).toBeEnabled({ timeout: 10000 });
      await usePlanBtn.click({ timeout: 8000 });
      const planOpt = page.locator('.arco-dropdown-option').filter({ hasText: /^集成电路$/ }).first();
      await expect(planOpt).toBeVisible({ timeout: 8000 });
      await planOpt.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region).toBeVisible({ timeout: 15000 });
      await expect(region.getByRole('heading', { name: '检索结果' })).toBeVisible({ timeout: 15000 });
  - note: 2、摘要中出现「当前条件」
    assert: |-
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region.getByText('当前条件', { exact: true }).first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
