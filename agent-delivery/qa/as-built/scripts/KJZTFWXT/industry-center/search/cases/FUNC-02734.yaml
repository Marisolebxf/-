id: FUNC-02734
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02734
priority: P1
title: 管理态移除已存方案后方案消失且可空态
entry_id: chain-search
tier: B
preconditions:
  - 高级筛选已打开
  - 我的方案中有可清除的方案
  - 已点击「管理」
locators:
  tab_advanced: '.enterprise-search-mode-tabs [role=tab] → 高级筛选'
  plans_row: .enterprise-search-history-row（含「我的方案」）
  btn_manage: button.enterprise-search-history-action → 管理
  remove_btn: chip 内 button.arco-btn-status-danger（IconDelete）
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 造可删唯一方案 QA-DEL-FUNC-02734；管理态点移除；三条预期在 expect 分步判定
expect:
  - note: 前置：高级筛选 + 我的方案有可删方案 + 管理态
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const planName = 'QA-DEL-FUNC-02734';
      const plansRow = () =>
        page.locator('.enterprise-search-history-row').filter({ hasText: '我的方案' }).first();
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业查询入口 SPA 404 ' + page.url());
      }
      const advTab = page.locator('.enterprise-search-mode-tabs [role=tab]').filter({ hasText: /^高级筛选$/ }).first();
      await expect(advTab).toBeVisible({ timeout: 10000 });
      await advTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page).toHaveURL(/[?&]mode=advanced/);
      await expect(plansRow()).toBeVisible({ timeout: 10000 });
      const enterManage = async () => {
        const manageBtn = plansRow().getByRole('button', { name: '管理', exact: true });
        if ((await manageBtn.count()) > 0) {
          await manageBtn.click({ timeout: 8000 });
          await page.waitForTimeout(300);
        }
      };
      const deleteChipByName = async (name) => {
        const chip = plansRow().locator('.enterprise-search-history-tag').filter({ hasText: name }).first();
        if ((await chip.count()) === 0) return false;
        const del = chip.locator('button.arco-btn-status-danger').first();
        await expect(del).toBeVisible({ timeout: 8000 });
        await del.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        return true;
      };
      await enterManage();
      while (true) {
        const chips = plansRow().locator('.enterprise-search-history-tag');
        const n = await chips.count();
        if (n === 0) break;
        const first = chips.first();
        const del = first.locator('button.arco-btn-status-danger').first();
        if ((await del.count()) === 0) {
          await enterManage();
          continue;
        }
        await del.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const confirmModal = page.locator('.arco-modal:visible').filter({ hasText: /确认|确定/ });
        if (await confirmModal.count()) {
          const vis = await confirmModal.first().isVisible().catch(() => false);
          if (vis) throw new Error('移除方案出现确认框，与用例不符');
        }
      }
      const fieldLib = page.getByRole('region', { name: /产业高级筛选字段库|高级筛选字段库/ });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      const objTypeTag = fieldLib.locator('.fp-tags .arco-tag').filter({ hasText: '对象类型' }).first();
      await expect(objTypeTag).toBeVisible({ timeout: 8000 });
      await objTypeTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(fieldLib.getByText(/已选\s*1\s*个条件/)).toBeVisible({ timeout: 8000 });
      const saveBtn = page.getByRole('button', { name: '保存为查询方案' });
      await expect(saveBtn).toBeEnabled({ timeout: 8000 });
      await saveBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '保存筛选模板' }).first();
      await expect(modal).toBeVisible({ timeout: 8000 });
      await page.getByPlaceholder('模板名称').first().fill(planName);
      await modal.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(modal).toBeHidden({ timeout: 8000 });
      const chip = plansRow().locator('.enterprise-search-history-tag').filter({ hasText: planName }).first();
      await expect(chip).toBeVisible({ timeout: 10000 });
      await enterManage();
      await expect(chip.locator('button.arco-btn-status-danger').first()).toBeVisible({ timeout: 8000 });
      globalThis.__func02734_planName = planName;
      globalThis.__func02734_ready = true;
  - note: 1、点击移除不出现确认框
    assert: |-
      if (!globalThis.__func02734_ready) throw new Error('前置未就绪');
      const planName = globalThis.__func02734_planName;
      const plansRow = page.locator('.enterprise-search-history-row').filter({ hasText: '我的方案' }).first();
      const chip = plansRow.locator('.enterprise-search-history-tag').filter({ hasText: planName }).first();
      await expect(chip).toBeVisible({ timeout: 8000 });
      const del = chip.locator('button.arco-btn-status-danger').first();
      await del.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const confirmModal = page.locator('.arco-modal:visible').filter({ hasText: /确认|确定删除|是否.*移除/ });
      if (await confirmModal.count()) {
        const vis = await confirmModal.first().isVisible().catch(() => false);
        if (vis) throw new Error('点击方案移除后出现确认框');
      }
  - note: 2、我的方案不再显示该方案
    assert: |-
      const planName = globalThis.__func02734_planName;
      const plansRow = page.locator('.enterprise-search-history-row').filter({ hasText: '我的方案' }).first();
      const chip = plansRow.locator('.enterprise-search-history-tag').filter({ hasText: planName });
      await expect(chip).toHaveCount(0);
  - note: 3、出现暂无已保存方案空态文案
    assert: |-
      await expect(
        page.getByText('暂无已保存方案，可在下方高级筛选中「保存为查询方案」', { exact: true }),
      ).toBeVisible({ timeout: 8000 });
      const plansRow = page.locator('.enterprise-search-history-row').filter({ hasText: '我的方案' }).first();
      await expect(plansRow.locator('.enterprise-search-history-tag')).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/search；高级筛选 Tab「我的方案」Hub（SearchHub.vue planManageMode + deletePlan 无 Modal）。
  前置=清空全部已存方案后保存 disposable「QA-DEL-FUNC-02734」再进管理态（破坏性，对齐用例「可清除」）。
  移除=chip 内 arco danger IconDelete（同 FUNC-02722）。空态原文见 SearchHub.vue L401-402。
  登录与关内部评审由 runner 前置。B 档零 allow_skip。
