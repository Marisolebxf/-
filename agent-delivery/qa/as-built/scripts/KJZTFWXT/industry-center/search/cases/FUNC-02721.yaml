id: FUNC-02721
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02721
priority: P0
title: 从筛选结果编辑高级筛选回到字段库且条件仍在
entry_id: chain-search
tier: B
preconditions:
  - 已通过「重点产业」进入高级筛选结果
locators:
  hot_key_industry: button.enterprise-search-hot-button「重点产业」
  edit_btn: button 编辑高级筛选
  field_lib: region「高级筛选字段库」
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 重点产业进结果态、点「编辑高级筛选」；三条预期在 expect 分步判定
expect:
  - note: 1、回到「高级筛选 · 字段库」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/search/, { timeout: 15000 });
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业查询入口 SPA 404 ' + page.url());
      }
      const smartTab = page
        .locator('.enterprise-search-mode-tabs [role=tab]')
        .filter({ hasText: /^智能检索$/ })
        .first();
      await expect(smartTab).toBeVisible({ timeout: 10000 });
      const chip = page.locator('.enterprise-search-hot-button').filter({ hasText: /^重点产业$/ }).first();
      await expect(chip).toBeVisible({ timeout: 8000 });
      await chip.click();
      await page.waitForTimeout(1200);
      await expect(page).toHaveURL(/[?&]mode=advanced/, { timeout: 10000 });
      const deadline = Date.now() + 20000;
      let hasAdvTitle = false;
      while (Date.now() < deadline) {
        hasAdvTitle = (await page.getByText('高级筛选结果').count()) > 0;
        if (hasAdvTitle) break;
        await page.waitForTimeout(500);
      }
      if (!hasAdvTitle) {
        throw new Error('前置：点击重点产业后未进入高级筛选结果态');
      }
      const editBtn = page.getByRole('button', { name: /编辑高级筛选/ }).first();
      await expect(editBtn).toBeVisible({ timeout: 8000 });
      await editBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const fieldLib = page.getByRole('region', { name: /产业高级筛选字段库|高级筛选字段库/ });
      await expect(fieldLib).toBeVisible({ timeout: 10000 });
      await expect(fieldLib.getByRole('heading', { name: '高级筛选 · 字段库' })).toBeVisible({
        timeout: 8000,
      });
      globalThis.__func02721_ready = true;
  - note: 2、已选条件数大于 0
    assert: |-
      if (!globalThis.__func02721_ready) throw new Error('前置：编辑高级筛选回库未完成');
      const fieldLib = page.getByRole('region', { name: /产业高级筛选字段库|高级筛选字段库/ });
      const libText = ((await fieldLib.innerText()) || '').replace(/\s+/g, ' ');
      const mSelected = libText.match(/已选\s*(\d+)\s*个条件/);
      const nFromLabel = mSelected ? parseInt(mSelected[1], 10) : NaN;
      const applyBtn = page.getByRole('button', { name: /应用筛选/ }).first();
      const applyName = ((await applyBtn.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const mApply = applyName.match(/应用筛选[（(]\s*(\d+)/);
      const nFromBtn = mApply ? parseInt(mApply[1], 10) : NaN;
      const n = !Number.isNaN(nFromLabel) ? nFromLabel : nFromBtn;
      if (Number.isNaN(n) || n < 1) {
        throw new Error(
          '已选条件数应大于 0；字段库=' + libText.slice(0, 120) + '；应用按钮=' + applyName,
        );
      }
  - note: 3、「应用筛选」可点
    assert: |-
      if (!globalThis.__func02721_ready) throw new Error('前置：编辑高级筛选回库未完成');
      const applyBtn = page.getByRole('button', { name: /应用筛选/ }).first();
      await expect(applyBtn).toBeVisible({ timeout: 8000 });
      const disabled = await applyBtn.isDisabled().catch(() => true);
      if (disabled) {
        throw new Error('「应用筛选」应为可点击态，实际 disabled');
      }
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/search。前置与 02691 同：智能检索 Tab 点热门「重点产业」自动 apply 进结果态（非手点应用筛选）。
  结果态 Footer 主按钮 /编辑高级筛选/；回库后 h2「高级筛选 · 字段库」、已选计数与 应用筛选(N) 机检 N≥1。region 标签可为「高级筛选字段库」或「产业高级筛选字段库」。
  2026-10-20 edu.itic-sci.com/tts/svcz 机跑：goto 深链 SPA 404，ENV-EDU-TTS-SVCZ-404-001 → ledger blocked；断言仍依 scout/env-gate+02691/00465 模式。登录与关内部评审由 runner 前置。B 档零 allow_skip。
