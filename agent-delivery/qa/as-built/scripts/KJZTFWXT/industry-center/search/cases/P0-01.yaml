id: P0-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01142
priority: P0
title: 进入产业查询路由与页标题正确
entry_id: chain-search
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 经人设面板关闭内部评审模式（默认可能为开；默认态记 observed）
locators:
  menu: 菜单项「产业链分析」→「产业查询」
  title: document title「产业查询 - 科技专题服务系统」
  h1: heading「产业查询」（level 1）
steps:
  - action: goto
    target: /industry-center/search
  - action: assert_url
    expect_contains: /industry-center/search
  - action: assert_visible
    target: heading 产业查询
expect:
  - note: 路由为 /industry-center/search
    assert: |-
      await expect(page).toHaveURL(/\/industry-center\/search/)
  - note: 页标题为「产业查询」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page).toHaveTitle(/产业查询 - 科技专题服务系统/); await expect(page.getByRole('heading', { name: '产业查询', level: 1 })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 深链等价侧栏到达；document title 现场为「产业查询 - 科技专题服务系统」；主区 H1「产业查询」并存。说明文案归 01143（P0-06）；三 Tab 构成归 01144（P0-02）。对比篮浮层可见才关，非本条对象。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
