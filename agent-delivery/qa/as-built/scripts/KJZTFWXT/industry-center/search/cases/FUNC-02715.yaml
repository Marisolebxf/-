id: FUNC-02715
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02715
priority: P1
tier: B
title: 检索结果选入本页同类型后已选数增加且类型一致
entry_id: chain-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 热门场景重点产业出结果、勾首行可选、点选入本页同类型
expect:
  - note: 已选数量增加
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      const chip = page.locator('.enterprise-search-hot-button').filter({ hasText: /^重点产业$/ }).first();
      await expect(chip).toBeVisible({ timeout: 10000 });
      await chip.click();
      await page.waitForTimeout(1200);
      const region = page.locator('[role=region][aria-label="产业查询结果"]');
      await expect(region).toBeVisible({ timeout: 20000 });
      const regionText = ((await region.innerText()) || '').replace(/\s+/g, ' ');
      const totalM = regionText.match(/共\s*(\d+)\s*条/);
      const total = totalM ? parseInt(totalM[1], 10) : 0;
      if (total < 2) {
        throw new Error('重点产业结果不足 2 条，无法验证同类型批量选入：' + regionText.slice(0, 160));
      }
      const list = page.locator('.industry-search-result-list');
      await expect(list).toBeVisible({ timeout: 10000 });
      const boxes = list.locator('.arco-checkbox');
      const cbCount = await boxes.count();
      let picked = false;
      for (let i = 0; i < cbCount; i++) {
        const cb = boxes.nth(i);
        if (!(await cb.isVisible().catch(() => false))) continue;
        await cb.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(600);
        const bar = page.locator('.industry-search-selection-toolbar');
        if (await bar.getByText(/已选\s*1/).isVisible().catch(() => false)) {
          picked = true;
          break;
        }
        await cb.click({ timeout: 3000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      if (!picked) {
        throw new Error('结果区未找到可勾选一行（选择条未出现）');
      }
      const barBefore = page.locator('.industry-search-selection-toolbar');
      const beforeText = ((await barBefore.innerText()) || '').replace(/\s+/g, ' ');
      const typeM = beforeText.match(/已选\s*1\s*·\s*(产业|产业链)/);
      if (!typeM) {
        throw new Error('勾选后选择条未见类型标记：' + beforeText);
      }
      await page.evaluate((t) => { globalThis.__gkx02715Type = t; }, typeM[1]);
      const nBefore = 1;
      const sameTypeBtn = page.getByRole('button', { name: '选入本页同类型' });
      await expect(sameTypeBtn).toBeVisible({ timeout: 5000 });
      await sameTypeBtn.click();
      await page.waitForTimeout(800);
      const afterText = ((await barBefore.innerText()) || '').replace(/\s+/g, ' ');
      const afterM = afterText.match(/已选\s*(\d+)/);
      const nAfter = afterM ? parseInt(afterM[1], 10) : 0;
      if (nAfter <= nBefore) {
        throw new Error('选入本页同类型后已选数未增加；前=' + beforeText + ' 后=' + afterText);
      }
      await page.evaluate((n) => { globalThis.__gkx02715Count = n; }, nAfter);
  - note: 已选类型与最初勾选的行一致
    assert: |-
      const lockedType = await page.evaluate(() => globalThis.__gkx02715Type);
      const nAfter = await page.evaluate(() => globalThis.__gkx02715Count);
      if (!lockedType || !nAfter) {
        throw new Error('前置步骤未记录类型或已选数');
      }
      const bar = page.locator('.industry-search-selection-toolbar');
      const text = ((await bar.innerText()) || '').replace(/\s+/g, ' ');
      const re = new RegExp('已选\\s*' + nAfter + '\\s*·\\s*' + lockedType);
      if (!re.test(text)) {
        throw new Error('已选类型与首行不一致或计数不符：期望 ·' + lockedType + ' 实际=' + text);
      }
on_fail: 截图 + 抄 X-Trace-Id
