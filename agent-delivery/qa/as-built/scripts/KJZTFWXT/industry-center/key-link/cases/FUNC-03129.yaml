id: FUNC-03129
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03129
priority: P1
tier: B
title: 异常-未选对象
entry_id: chain-key-link
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: wait
    timeout_ms: 600
  - action: click
    target: 开始分析
expect:
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      await expect(
        page.locator('.arco-message').filter({ hasText: '尚未选择分析对象' }).first()
      ).toBeVisible({ timeout: 8000 });
  - note: 2、仍停留在「分析配置」
    assert: |-
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
