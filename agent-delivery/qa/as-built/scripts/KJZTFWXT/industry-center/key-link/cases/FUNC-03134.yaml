id: FUNC-03134
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03134
priority: P1
tier: B
title: 已完成行下载报告提示资产404且留诊断记录
entry_id: chain-key-link
preconditions:
  - 诊断记录中有一条已完成任务
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: evaluate
    note: 打开诊断记录 Tab，在已完成关键环节行点击「下载报告」
expect:
  - note: 1、提示「资产下载失败（HTTP 404）」
    assert: |-
      const main = () => page.locator('main').first();
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toBeVisible({ timeout: 15000 });
      await tab.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成/ }).filter({ hasText: /产业关键环节识别/ });
      await expect(rows.first()).toBeVisible({ timeout: 15000 });
      const row = rows.first();
      const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
      const bn = await bodies.count();
      for (let i = 0; i < bn; i++) {
        await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
      }
      let dl = row.locator('button, .arco-btn').filter({ hasText: /^下载报告$/ }).last();
      if (!(await dl.count())) dl = row.getByRole('button', { name: '下载报告', exact: true }).last();
      await expect(dl).toBeVisible({ timeout: 8000 });
      const toastRe = /资产下载失败.*HTTP\s*404|资产下载失败（HTTP 404）/;
      const toastPromise = page.waitForFunction(
        (reSrc) => {
          const re = new RegExp(reSrc);
          const nodes = document.querySelectorAll('.arco-message, .arco-message-content, .arco-message-list');
          for (const n of nodes) {
            const t = (n.textContent || '').replace(/\s+/g, ' ');
            if (re.test(t)) return t.match(re)?.[0] || t.slice(0, 80);
          }
          const body = (document.body?.innerText || '').replace(/\s+/g, ' ');
          if (re.test(body)) return body.match(re)?.[0] || 'body-match';
          return null;
        },
        toastRe.source,
        { timeout: 20000 },
      );
      await dl.click({ timeout: 15000 });
      const toastHit = await toastPromise;
      const toastText = typeof toastHit === 'string' ? toastHit : String(toastHit ?? '');
      if (!toastRe.test(toastText)) {
        throw new Error('失败提示文案不符：' + toastText.slice(0, 120));
      }
      globalThis.__func03134 = { clicked: true, toast: toastText };
      await expect(page.getByText(toastRe).first()).toBeVisible({ timeout: 3000 }).catch(() => {});
  - note: 2、仍停留在「诊断记录」
    assert: |-
      if (!globalThis.__func03134?.clicked) throw new Error('前置：未点击下载报告');
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toBeVisible({ timeout: 8000 });
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      if (/view=report/.test(page.url())) {
        throw new Error('误进入报告页 view=report：' + page.url());
      }
      await expect(page.locator('main').first().locator('tbody tr, .arco-table-tr').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
