id: P1-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00594
priority: P1
title: 恢复历史任务复用同一任务且结果回显快照对象
entry_id: chain-key-link
preconditions:
- 诊断记录含至少一条已完成关键环节任务
locators:
  view_result: button「查看结果」
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: click
  target: 诊断记录→查看结果
expect:
- note: 恢复进入对应 Tab 或不可变结果，不重建配置
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('ALLOW_SKIP: 无已完成任务'); await view.click(); await page.waitForTimeout(2500); await expect(page).toHaveURL(/view=result|task_id=/); await expect(page.getByText('产业关键环节识别结果')).toBeVisible({ timeout: 12000 })
- note: 复用同一任务、不新建不覆盖快照
  assert: |-
    if (!/task_id=CHAIN-/.test(page.url())) throw new Error('URL 未见 task_id 复用'); const t = await page.locator('main').innerText(); if (!/任务/.test(t)) throw new Error('结果未见任务标识')
- note: 结果顶栏回显快照中的分析对象、不显示「未选分析对象」
  assert: |-
    const t = await page.locator('main').innerText(); if (/未选分析对象/.test(t)) throw new Error('误显未选分析对象'); if (!/分析对象/.test(t)) throw new Error('未见分析对象回显')
allow_skip: 无已完成任务时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
