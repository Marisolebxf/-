id: FUNC-03133
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03133
priority: P1
title: 诊断记录确定删除后任务从列表消失
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 诊断记录中有一条可删任务（assert 自含；优先失败行）
locators:
  records_tab: tab「诊断记录」
  delete_button: button「删除」
  modal_ok: 弹框 button「确定」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节→诊断记录→可删行「删除」→Modal「确定」；toast 与列表在 expect
expect:
  - note: 前置并点确定删除一条可删任务
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const scrollRecordActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const selectStatusFailed = async () => {
        const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
        await page.keyboard.press('Escape').catch(() => {});
        const statusLabel = page.getByText('任务状态', { exact: false }).first();
        await expect(statusLabel).toBeVisible({ timeout: 8000 });
        let trigger = statusLabel.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
        if ((await trigger.count()) < 1) {
          trigger = page.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
        }
        await expect(trigger).toBeVisible({ timeout: 8000 });
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: /^失败$/ }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const pickDeletableRow = async (requireFailed) => {
        await scrollRecordActions();
        const rows = main().locator('tbody tr, .arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          if (!TID_RE.test(rowText)) continue;
          if (!/产业关键环节识别/.test(rowText)) continue;
          if (requireFailed && (!/失败/.test(rowText) || /已完成/.test(rowText))) continue;
          let del = row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
          if (!(await del.count())) del = row.getByRole('button', { name: '删除', exact: true }).last();
          if (!(await del.count())) continue;
          if (await del.isDisabled().catch(() => true)) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollRecordActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          const tidM = rowText.match(TID_RE);
          if (!tidM) continue;
          return { del, tid: tidM[0] };
        }
        return null;
      };
      const pickWithPagination = async (requireFailed) => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 20; guard++) {
          const hit = await pickDeletableRow(requireFailed);
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      await enterKeyLink();
      await openRecordsTab();
      const recBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!TID_RE.test(recBody) && !/暂无|无记录/.test(recBody)) {
        throw new Error('ENV-KEYLINK-NO-RECORDS-03133：诊断记录未见 CHAIN 任务行');
      }
      let picked = null;
      if (/失败/.test(recBody)) {
        await selectStatusFailed();
        picked = await pickWithPagination(true);
      }
      if (!picked) {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
        picked = await pickWithPagination(false);
      }
      if (!picked) {
        throw new Error('ENV-KEYLINK-NO-DELETABLE-03133：诊断记录无可见可点「删除」的关键环节任务');
      }
      globalThis.__func03133 = { tid: picked.tid, confirmed: false };
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      const ok = modal.getByRole('button', { name: '确定', exact: true });
      await expect(ok).toBeVisible({ timeout: 5000 });
      await ok.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(modal).toBeHidden({ timeout: 15000 });
      globalThis.__func03133.confirmed = true;
  - note: 1、提示「已删除」
    assert: |-
      if (!globalThis.__func03133?.confirmed) throw new Error('前置：未完成删除确定');
      const toast = page.locator('.arco-message-content, .arco-message').filter({ hasText: /已删除/ });
      await expect(toast.first()).toBeVisible({ timeout: 10000 });
  - note: 2、该任务不再出现在当前列表
    assert: |-
      if (!globalThis.__func03133?.confirmed) throw new Error('前置：未完成删除确定');
      const expectedTid = globalThis.__func03133.tid;
      const main = () => page.locator('main').first();
      const esc = expectedTid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const t0 = Date.now();
      while (Date.now() - t0 < 12000) {
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!new RegExp(esc).test(body)) break;
        await page.waitForTimeout(400);
      }
      const rowGone = main().locator('tbody tr, .arco-table-tr').filter({ hasText: expectedTid });
      await expect(rowGone).toHaveCount(0, { timeout: 8000 });
      const bodyAfter = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (new RegExp(esc).test(bodyAfter)) {
        throw new Error('确定删除后任务编号仍在诊断记录：' + expectedTid);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: >-
  D1·catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling 再侧栏进入。
  步骤=诊断记录→优先失败可删行「删除」→Modal「删除分析记录」→「确定」→toast 已删除、CHAIN 编号从当前列表消失。
  破坏性用例（取消路径见 FUNC-03132）。无 CHAIN 行→ENV-KEYLINK-NO-RECORDS-03133；无可删行→ENV-KEYLINK-NO-DELETABLE-03133。
  edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
