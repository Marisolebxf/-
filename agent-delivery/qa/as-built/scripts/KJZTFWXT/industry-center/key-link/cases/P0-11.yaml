id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00588
priority: P0
title: 关键环节分色标注与图谱高亮且证据缺失不补造
entry_id: chain-key-link
preconditions:
- 已打开关键环节识别成功结果
locators:
  legend: 关键环节 / 皇冠明珠
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: click
  target: 诊断记录→查看结果
expect:
- note: 「关键环节」与「皇冠明珠」以分色标注区分
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('ALLOW_SKIP: 无查看结果'); await view.click(); await page.waitForTimeout(2500); await expect(page.getByText('关键环节', { exact: true }).first()).toBeVisible({ timeout: 10000 }); await expect(page.getByText('皇冠明珠').first()).toBeVisible()
- note: 对应环节在图谱中高亮呈现
  assert: 'await expect(page.getByText(/全链路环节结构化展示|结构化图谱/).first()).toBeVisible({ timeout: 8000 })'
- note: 证据缺失的环节不补造关键标注
  assert: |-
    const t = await page.locator('main').innerText(); if (/关键环节数\s*0/.test(t) || /高端化\s*—/.test(t) || /暂无/.test(t)) { /* 诚实空态 */ return }; /* 有标注时不得出现演示伪数冒充 */ if (/演示数字|假数据/.test(t)) throw new Error('疑似补造')
allow_skip: 无已完成任务可恢复时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 图例可见即可；关键环节数 0 / 高端化 — 为诚实呈现。
tier: B
