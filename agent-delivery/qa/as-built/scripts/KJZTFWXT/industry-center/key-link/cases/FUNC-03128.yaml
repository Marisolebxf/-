id: FUNC-03128
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03128
priority: P1
title: 诊断记录已完成行查看报告打开报告且任务号一致
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 诊断记录中有一条已完成任务
locators:
  records_tab: tab「诊断记录」
  view_report: button「查看报告」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节→诊断记录→已完成行「查看报告」（判定在 expect）
expect:
  - note: 1、进入「产业关键环节识别报告」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      await enterKeyLink();
      await openRecordsTab();
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ });
      const n = await rows.count();
      if (n < 1) throw new Error('ENV-KEYLINK-NO-COMPLETED-03128：诊断记录无已完成行');
      let clicked = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/产业关键环节识别/.test(rowText)) continue;
        const m = rowText.match(TID_RE);
        if (!m) continue;
        const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
        if (!(await reportBtn.count()) || (await reportBtn.isDisabled().catch(() => true))) continue;
        globalThis.__func03128 = { taskId: m[0] };
        await reportBtn.click({ timeout: 15000, force: true });
        clicked = true;
        for (let j = 0; j < 28; j++) {
          await page.waitForTimeout(500);
          if (/view=report/.test(page.url()) && (await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false))) break;
        }
        if (/view=report/.test(page.url())) break;
        globalThis.__func03128 = undefined;
        clicked = false;
      }
      if (!clicked || !globalThis.__func03128?.taskId) {
        throw new Error('ENV-KEYLINK-NO-REPORT-03128：无已完成关键环节任务可点「查看报告」');
      }
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      globalThis.__func03128.readerReady = true;
      const body = ((await reader.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const h1 = reader.locator('h1').first();
      const hasTitle =
        (await h1.isVisible().catch(() => false) && /产业关键环节识别报告/.test(await h1.innerText().catch(() => ''))) ||
        /产业关键环节识别报告/.test(body);
      if (!hasTitle) {
        throw new Error('报告页未见「产业关键环节识别报告」，片段=' + body.slice(0, 200));
      }
      await expect(page.getByText('产业关键环节识别报告').first()).toBeVisible({ timeout: 8000 });
  - note: 2、报告中的任务号与该行相同
    assert: |-
      if (!globalThis.__func03128?.readerReady) throw new Error('前置：报告页未打开');
      const taskId = globalThis.__func03128.taskId || '';
      if (!taskId) throw new Error('ENV-KEYLINK-NO-TASK-ID-03128：未捕获列表任务号');
      const url = page.url();
      let urlId = '';
      try {
        urlId = new URL(url).searchParams.get('task_id') || '';
      } catch (_) {}
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      const body = ((await reader.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const urlOk = urlId === taskId || url.includes(taskId);
      const bodyOk = body.includes(taskId);
      if (!urlOk && !bodyOk) {
        throw new Error(
          '报告任务号与列表行不一致：列表=' +
            taskId +
            ' url=' +
            url.slice(0, 160) +
            ' report=' +
            body.slice(0, 220)
        );
      }
      if (urlId && urlId !== taskId) {
        throw new Error('URL task_id=' + urlId + ' 与列表行 ' + taskId + ' 不一致');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search 再侧栏进入。
  用例=诊断记录已完成行「查看报告」→「产业关键环节识别报告」+任务号与列表 CHAIN 行一致（对齐 cycle FUNC-02911 / key-link 03113 任务互证）。
  无已完成或报告钮不可用→ENV-KEYLINK-NO-COMPLETED-03128 / ENV-KEYLINK-NO-REPORT-03128。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
