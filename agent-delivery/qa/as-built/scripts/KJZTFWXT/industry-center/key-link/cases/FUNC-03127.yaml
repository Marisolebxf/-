id: FUNC-03127
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03127
priority: P1
title: 诊断记录筛选分析中空列表
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开「诊断记录」；当前没有进行中的任务（assert 自含）
locators:
  records_tab: tab「诊断记录」
  status_filter: 任务状态
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节→诊断记录→前置无分析中→选「分析中」；空列表在 expect
expect:
  - note: 前置：诊断记录 Tab；全部状态下无「分析中」任务行
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
        const bodyAfter = await main().innerText().catch(() => '');
        if (!/诊断记录|任务状态|全部状态/.test(bodyAfter)) {
          throw new Error('点「诊断记录」后未见任务状态区，url=' + page.url());
        }
      };
      const chainRows = () => main().locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
      const visibleChainTaskRows = async () => {
        const rows = chainRows();
        const n = await rows.count();
        let c = 0;
        for (let i = 0; i < n; i++) {
          if (await rows.nth(i).isVisible().catch(() => false)) c++;
        }
        return c;
      };
      const rowHasAnalyzingStatus = async (row) => {
        const rt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!TID_RE.test(rt)) return false;
        if (/分析中|进行中|排队|生成中|等待调度/.test(rt) && !/已完成|失败/.test(rt)) return true;
        if (/\t分析中\t|\s分析中\s/.test(rt)) return true;
        return false;
      };
      await enterKeyLink();
      await openRecordsTab();
      const rows = chainRows();
      const n = await rows.count();
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        if (!(await row.isVisible().catch(() => false))) continue;
        if (await rowHasAnalyzingStatus(row)) {
          throw new Error('ENV-KEYLINK-HAS-INPROGRESS-03127：全部状态下存在分析中任务，无法满足「当前没有进行中任务」前置');
        }
      }
      globalThis.__func03127 = { chainRows, TID_RE, main, visibleChainTaskRows };
  - note: 1、将「任务状态」选为「分析中」（用例步骤 1）
    assert: |-
      const ctx = globalThis.__func03127;
      if (!ctx) throw new Error('前置：诊断记录未就绪');
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      await page.keyboard.press('Escape').catch(() => {});
      const statusLabel = page.getByText('任务状态', { exact: false }).first();
      await expect(statusLabel).toBeVisible({ timeout: 8000 });
      let trigger = statusLabel.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
      if ((await trigger.count()) < 1) {
        trigger = page.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
      }
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(450);
      const opt = page.locator(optSel).filter({ hasText: /^分析中$/ }).first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      await opt.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const shown = ((await trigger.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/分析中/.test(shown)) {
        throw new Error('任务状态筛选未回显「分析中」：' + shown);
      }
      globalThis.__func03127.filterOk = true;
  - note: 1、列表没有任务行（不混入已完成/失败）
    assert: |-
      const ctx = globalThis.__func03127;
      if (!ctx?.filterOk) throw new Error('前置：未选「分析中」');
      await page.waitForTimeout(600);
      const visible = await ctx.visibleChainTaskRows();
      if (visible > 0) {
        const rows = ctx.chainRows();
        const n = await rows.count();
        const sample = [];
        for (let i = 0; i < Math.min(n, 5); i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          sample.push(((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').slice(0, 120));
        }
        throw new Error('筛「分析中」后应无 CHAIN 任务行，现场可见行数=' + visible + '；样例=' + sample.join(' | '));
      }
      const body = ((await ctx.main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (ctx.TID_RE.test(body)) {
        throw new Error('筛「分析中」后 main 仍含 CHAIN 任务编号');
      }
      if (/已完成|失败/.test(body) && /CHAIN-/.test(body)) {
        throw new Error('筛「分析中」后仍混入已结束任务文案');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search 再侧栏进入。
  步骤=诊断记录→全部状态下无分析中行（scout：勘察时没有进行中任务）→任务状态选「分析中」（P7 .arco-select-view，对齐 FUNC-03122/03124）。
  机检=筛后可见 CHAIN 行数=0、main 无 CHAIN-*；有进行中→ENV-KEYLINK-HAS-INPROGRESS-03127。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
