id: FUNC-03126
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03126
priority: P1
title: 诊断记录每页条数改 20
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开「诊断记录」；任务总数不少于 20 条（assert 自含进入与闸门）
locators:
  records_tab: tab「诊断记录」
  page_size_trigger: main 内 .arco-pagination .arco-select-view
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节→诊断记录→展开每页条数；选项与 20 行在 expect
expect:
  - note: 1、选项为 10 条/页、20 条/页、50 条/页，共 3 个
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const optSel = '.arco-select-dropdown:visible .arco-select-option, .arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
        const bodyAfter = await main().innerText().catch(() => '');
        if (!/诊断记录|任务状态|全部状态|共\s*\d+\s*条/.test(bodyAfter)) {
          throw new Error('点「诊断记录」后未见记录区，url=' + page.url());
        }
      };
      const parseTotal = async () => {
        const pag = main().locator('.arco-pagination').first();
        const t = ((await pag.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        if (m) return parseInt(m[1], 10);
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m2 = body.match(/共\s*(\d+)\s*条/);
        return m2 ? parseInt(m2[1], 10) : 0;
      };
      const pageSizeTrigger = () => main().locator('.arco-pagination .arco-select-view').first();
      await enterKeyLink();
      await openRecordsTab();
      const total = await parseTotal();
      if (total < 20) {
        throw new Error('ENV-CHAIN-KEYLINK-RECORDS-LT20-001：诊断记录共 ' + total + ' 条，不足 20 无法验每页 20 行');
      }
      globalThis.__func03126 = { total };
      const trigger = pageSizeTrigger();
      if (!(await trigger.count())) {
        const byText = main().getByText(/\d+\s*条\/页/);
        if (!(await byText.count())) throw new Error('诊断记录分页底栏未见每页条数控件');
        await byText.first().click({ timeout: 8000 });
      } else {
        await trigger.click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      const options = page.locator(optSel);
      await expect(options.first()).toBeVisible({ timeout: 8000 });
      const n = await options.count();
      const labels = [];
      for (let i = 0; i < n; i++) {
        labels.push(((await options.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim());
      }
      const normalized = labels.map((t) => t.replace(/\s/g, ''));
      const want = ['10条/页', '20条/页', '50条/页'];
      if (normalized.length !== 3) {
        throw new Error('每页条数选项应为 3 个，现场 ' + normalized.length + ' 个：' + labels.join(' | '));
      }
      for (const w of want) {
        if (!normalized.includes(w)) {
          throw new Error('缺少选项「' + w + '」，现场：' + labels.join('、'));
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
      await page.waitForTimeout(300);
  - note: 2、当前页显示 20 行
    assert: |-
      if (!globalThis.__func03126?.total || globalThis.__func03126.total < 20) {
        throw new Error('前置：诊断记录总数未通过 20 条闸门');
      }
      const main = () => page.locator('main').first();
      const optSel = '.arco-select-dropdown:visible .arco-select-option, .arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const recordsTable = () => main().locator('table, .arco-table').first();
      const countTaskRows = async () => {
        const rows = recordsTable().locator('tbody .arco-table-tr, tbody tr');
        let c = 0;
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const txt = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          if (txt && !/暂无数据|暂无记录/.test(txt)) c++;
        }
        return c;
      };
      const pageSizeTrigger = () => main().locator('.arco-pagination .arco-select-view').first();
      const pickPageSize = async (label) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const trigger = pageSizeTrigger();
        if (!(await trigger.count())) {
          await main().getByText(/\d+\s*条\/页/).first().click({ timeout: 8000 });
        } else {
          await trigger.click({ timeout: 8000 });
        }
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      await expect(recordsTable()).toBeVisible({ timeout: 8000 });
      await pickPageSize('20');
      const triggerText = pageSizeTrigger().count()
        ? ((await pageSizeTrigger().innerText().catch(() => '')) || '').replace(/\s/g, '')
        : ((await main().getByText(/\d+\s*条\/页/).first().innerText().catch(() => '')) || '').replace(/\s/g, '');
      if (!triggerText.includes('20') || !triggerText.includes('条/页')) {
        throw new Error('每页条数未切到 20 条/页，现场「' + triggerText + '」');
      }
      let rows = await countTaskRows();
      for (let i = 0; i < 8 && rows < 20; i++) {
        await page.waitForTimeout(500);
        rows = await countTaskRows();
      }
      if (rows !== 20) {
        throw new Error('当前页应展示 20 行，现场 tbody 数据行数=' + rows);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search 再侧栏「产业关键环节识别」。
  用例=诊断记录 Tab→分页每页条数（10/20/50）→选 20→当前页 20 行（tbody 非空数据行计数，对齐 cycle FUNC-02919）。
  总条数<20→ENV-CHAIN-KEYLINK-RECORDS-LT20-001。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
