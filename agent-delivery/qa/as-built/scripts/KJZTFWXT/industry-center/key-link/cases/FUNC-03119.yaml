id: FUNC-03119
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03119
priority: P1
title: 结果页按此配置新建分析回到配置且对象仍在
story: US-CHAIN-DIAG-04
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开一条成功结果
locators:
  rebuild: button「按此配置新建分析」
  config_heading: heading「分析配置」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 成功结果页点「按此配置新建分析」；三条预期在 expect
expect:
  - note: 前置打开成功结果并点击「按此配置新建分析」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
      };
      const isKeyLinkResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t) || (await page.getByText('产业关键环节识别结果').first().isVisible().catch(() => false));
      };
      const openFromRecords = async () => {
        await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ }).filter({ hasText: /产业关键环节识别/ });
        const n = await rows.count();
        if (n < 1) {
          throw new Error('ENV-KEYLINK-NO-RESULT-03119：诊断记录无已完成关键环节任务');
        }
        for (let i = 0; i < Math.min(n, 10); i++) {
          const view = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
          if (!(await view.count()) || (await view.isDisabled().catch(() => true))) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isKeyLinkResult()) return true;
          }
        }
        return false;
      };
      await enterKeyLink();
      await assertNotSpa404('landing');
      if (!(await isKeyLinkResult())) {
        if (!(await openFromRecords())) {
          throw new Error('ENV-KEYLINK-NO-RESULT-03119：无法打开成功结果页');
        }
      }
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 20000 });
      const resultBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      let expectCluster = '';
      let expectSegment = '';
      const obj = resultBody.match(/分析对象[：:]\s*([^\n]+)/);
      if (obj) {
        const parts = obj[1].split(/[/／]/).map((s) => s.trim()).filter(Boolean);
        if (parts[0]) expectCluster = parts[0];
        if (parts[1]) expectSegment = parts[1];
      }
      if (!expectCluster) {
        const alt = resultBody.match(/(新一代信息技术|生物产业|集成电路)[^\n]{0,40}(半导体|集成电路|软件)/);
        if (alt) {
          expectCluster = alt[1];
          expectSegment = alt[2];
        }
      }
      const rebuild = main().getByRole('button', { name: '按此配置新建分析', exact: true }).first();
      if (!(await rebuild.count()) || !(await rebuild.isVisible().catch(() => false))) {
        throw new Error('ENV-KEYLINK-NO-REBUILD-03119：结果页无「按此配置新建分析」');
      }
      await rebuild.scrollIntoViewIfNeeded().catch(() => {});
      await rebuild.click({ timeout: 15000 });
      await page.waitForTimeout(900);
      globalThis.__func03119 = { expectCluster, expectSegment, resultSnippet: resultBody.slice(0, 500) };
  - note: 1、回到「分析配置」；3、可见「开始分析」；不自动创建新任务
    assert: |-
      if (!globalThis.__func03119) throw new Error('前置：未从结果页点按此配置新建分析');
      const url = page.url();
      if (/view=result|view=processing|demo_state=processing|tab=records/.test(url)) {
        throw new Error('按此配置新建后应回到分析配置 Tab，非结果/记录/生成 URL：' + url);
      }
      const main = () => page.locator('main').first();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/产业关键环节识别结果/.test(body) && !/分析配置/.test(body)) {
        throw new Error('按此配置新建后不应停在结果页');
      }
      if (/可视化分析过程|生成中/.test(body)) {
        throw new Error('按此配置新建后不应自动进入生成中（不自动创建新任务）');
      }
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      const configTab = page.getByRole('tab', { name: '产业关键环节识别' }).first();
      await expect(configTab).toHaveAttribute('aria-selected', 'true');
      const startBtn = page.getByRole('button', { name: '开始分析' }).first();
      await expect(startBtn).toBeVisible({ timeout: 8000 });
      if (await startBtn.isDisabled().catch(() => false)) {
        throw new Error('回到配置后「开始分析」应可见且可点（未自动起任务）');
      }
  - note: 2、下拉回显该结果的分析对象
    assert: |-
      if (!globalThis.__func03119) throw new Error('前置：无结果页对象快照');
      const main = () => page.locator('main').first();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const cluster = page.locator('.arco-select-view[aria-label="集群"]').first();
      await expect(cluster).toBeVisible({ timeout: 8000 });
      const clusterText = ((await cluster.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!clusterText || /请选择|未选/.test(clusterText)) {
        throw new Error('分析对象（集群）未回显：「' + clusterText + '」');
      }
      const industry = page.locator('.arco-select-view[aria-label="产业"]').first();
      await expect(industry).toBeVisible({ timeout: 8000 });
      const industryText = ((await industry.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!industryText || /请选择|未选/.test(industryText)) {
        throw new Error('分析对象（产业）未回显：「' + industryText + '」');
      }
      const segment = page.locator('.arco-select-view.industry-catalog-select').first();
      if (await segment.count()) {
        const segText = ((await segment.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (!segText || /请选择|未选/.test(segText)) {
          throw new Error('所属产业链未回显：「' + segText + '」');
        }
      }
      if (!/新一代信息技术|生物|集成电路/.test(clusterText)) {
        throw new Error('分析对象（集群）回显不符合结果：「' + clusterText + '」');
      }
      if (!/新一代信息技术|生物|集成电路|半导体/.test(industryText)) {
        throw new Error('分析对象（产业）回显不符合结果：「' + industryText + '」');
      }
      if (await segment.count()) {
        const segText = ((await segment.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (!/半导体|集成电路/.test(segText)) {
          throw new Error('所属产业链回显不符合结果：「' + segText + '」');
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search 再侧栏进入。
  步骤=成功结果页「按此配置新建分析」（≠诊断记录「复制配置」03118）→ h2 分析配置 + 产业关键环节识别 Tab 选中 + 集群/产业/所属产业链非空与结果互证 + 「开始分析」可见 + 无生成中/结果 URL（不自动创建新任务）。
  无已完成→ENV-KEYLINK-NO-RESULT-03119；无按钮→ENV-KEYLINK-NO-REBUILD-03119。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
