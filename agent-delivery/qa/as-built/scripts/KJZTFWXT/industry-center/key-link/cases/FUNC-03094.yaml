id: FUNC-03094
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03094
priority: P0
title: 注册识别因子权重只读且合计通过
story: US-CHAIN-DIAG-04
entry_id: chain-key-link
tier: B
preconditions:
  - 已进入产业关键环节识别页
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进入关键环节页→点权重加减与行首选择（判定在 expect）
expect:
  - note: 1、权重依次为 34%、33%、33%
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await expect(leaf().first()).toBeVisible({ timeout: 10000 });
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await expect(page.getByText('注册识别因子').first()).toBeVisible({ timeout: 12000 });
      };
      await enterKeyLink();
      const want = ['34', '33', '33'];
      const names = ['附加值率', '技术壁垒', '市场集中度'];
      for (let i = 0; i < 3; i++) {
        const row = page.getByRole('row').filter({ hasText: names[i] }).first();
        await expect(row).toBeVisible({ timeout: 8000 });
        const spin = row.locator('[role=spinbutton]').first();
        const v = await spin.inputValue();
        if (v !== want[i]) throw new Error(names[i] + ' 权重应为 ' + want[i] + '%，实际=' + v);
      }
      globalThis.__func03094_vals = want.slice();
  - note: 2、权重与行首选择均不能改
    assert: |-
      const names = ['附加值率', '技术壁垒', '市场集中度'];
      const before = globalThis.__func03094_vals || ['34', '33', '33'];
      const checksBefore = [];
      for (let i = 0; i < 3; i++) {
        const row = page.getByRole('row').filter({ hasText: names[i] }).first();
        const spin = row.locator('[role=spinbutton]').first();
        await expect(spin).toBeDisabled();
        const steps = row.locator('.arco-input-number-step-button');
        for (let j = 0; j < Math.min(await steps.count(), 2); j++) {
          await steps.nth(j).click({ timeout: 5000, force: true }).catch(() => {});
          await page.waitForTimeout(150);
        }
        const afterW = await spin.inputValue();
        if (afterW !== before[i]) {
          throw new Error(names[i] + ' 点击加减钮后权重变化 ' + before[i] + '→' + afterW);
        }
        const box = row.locator('.arco-checkbox').first();
        const input = box.locator('input[type=checkbox]').first();
        const st = await input.evaluate((el) => ({ checked: el.checked, disabled: el.disabled }));
        checksBefore.push(st.checked);
        if (!st.disabled) throw new Error('第' + (i + 1) + '个行首选择应 disabled');
        await box.locator('.arco-checkbox-target, input[type=checkbox]').first().click({ timeout: 5000, force: true }).catch(() => box.click({ force: true }));
        await page.waitForTimeout(200);
        const st2 = await input.evaluate((el) => ({ checked: el.checked, disabled: el.disabled }));
        if (!st2.disabled) throw new Error('第' + (i + 1) + '个行首选择点击后应仍 disabled');
        if (st.checked !== st2.checked) {
          throw new Error('第' + (i + 1) + '个行首选择点击后勾选状态变化');
        }
      }
  - note: 3、显示「权重合计：100% · 校验通过」
    assert: |-
      await expect(page.getByText(/权重合计：100%\s*·\s*校验通过/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
