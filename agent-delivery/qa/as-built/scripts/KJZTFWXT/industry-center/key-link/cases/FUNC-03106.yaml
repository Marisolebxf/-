id: FUNC-03106
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03106
priority: P0
title: 点击设计环节后环节详情暂无说明
story: US-CHAIN-DIAG-04
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开一条成功结果
locators:
  stage_design: 全链路环节「设计」圆点
  detail_section: text「环节详情」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 打开成功结果后点击环节「设计」（判定在 expect）
expect:
  - note: 前置：已打开「产业关键环节识别结果」页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        return false;
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const gotoCatalog = async () => {
        await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
          waitUntil: 'domcontentloaded',
          timeout: 60000,
        });
        await page.waitForTimeout(1000);
        await recover404Shell();
        await assertNotSpa404('catalog-goto');
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        await recover404Shell();
        const onTargetOk = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!(onTargetOk()) || (await bodyIs404())) {
          await gotoCatalog().catch(() => {});
          if (!(onTargetOk()) || (await bodyIs404())) {
            if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
              await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(800);
              await recover404Shell();
            }
            await assertNotSpa404('search-sibling');
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            if (await leaf().first().isVisible().catch(() => false)) {
              await leaf().first().click({ timeout: 10000 });
              await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
              await recover404Shell();
            } else {
              await gotoCatalog();
            }
            await assertNotSpa404('sidebar');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({ timeout: 12000 });
      };
      const isKeyLinkResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t) || (await page.getByText('产业关键环节识别结果').first().isVisible().catch(() => false));
      };
      const openFromRecords = async () => {
        await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rows = page.locator('tr').filter({ hasText: '产业关键环节识别' }).filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 10); i++) {
          const view = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
          if (!(await view.count())) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isKeyLinkResult()) return true;
          }
        }
        return false;
      };
      await enterKeyLink();
      await assertNotSpa404('landing');
      if (!(await isKeyLinkResult())) {
        if (!(await openFromRecords())) {
          throw new Error('ENV-KEYLINK-NO-RESULT-001：诊断记录无已完成关键环节任务可打开结果');
        }
      }
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 20000 });
  - note: 1、点击环节「设计」
    assert: |-
      const clickDesign = await page.evaluate(() => {
        const pickNode = (name) => {
          const cands = [...document.querySelectorAll('main div')].filter((el) => {
            const t = (el.textContent || '').replace(/\s+/g, ' ').trim();
            if (!t.includes(name) || !/高端化/.test(t)) return false;
            const r = el.getBoundingClientRect();
            return r.width >= 70 && r.width <= 130 && r.height >= 70 && r.height <= 130;
          });
          cands.sort((a, b) => a.getBoundingClientRect().width - b.getBoundingClientRect().width);
          return cands[0] || null;
        };
        const el = pickNode('设计');
        if (!el) return { err: '未定位到「设计」环节圆点' };
        el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
        el.click();
        return { ok: true };
      });
      if (clickDesign.err) throw new Error(clickDesign.err);
      await page.waitForTimeout(600);
  - note: 1、「环节详情」为「该环节暂无详情说明」
    assert: |-
      await expect(page.getByText('环节详情', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      const detailBlock = page.locator('main').filter({ hasText: '环节详情' }).first();
      await expect(detailBlock.getByText('该环节暂无详情说明').first()).toBeVisible({ timeout: 10000 });
      const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
      const body = norm(await page.locator('main').first().innerText().catch(() => ''));
      const idx = body.indexOf('环节详情');
      const slice = idx >= 0 ? body.slice(idx, idx + 48) : body.slice(0, 120);
      if (!/环节详情[\s\S]{0,40}该环节暂无详情说明/.test(body)) {
        throw new Error('环节详情区未显示「该环节暂无详情说明」，摘要: ' + slice);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  用例步骤=点击全链路「设计」圆点；预期=区块「环节详情」文案「该环节暂无详情说明」（scout-result 与 edu 诚实空态一致；研发/制造/销售/服务同文案见用例互指）。
  前置=诊断记录已完成「查看结果」；无记录抛 ENV-KEYLINK-NO-RESULT-001。路由 sibling /industry-center/search + 侧栏 menu_leaf，落点 catalog_path。登录关评审 runner 前置。B 档零 allow_skip。
