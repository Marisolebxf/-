id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00585
priority: P0
title: 任务成功后结果呈现全链路图谱与五标准化环节
entry_id: chain-key-link
preconditions:
- 诊断记录存在至少一条已完成关键环节任务（否则 allow_skip）
locators:
  tab_records: tab「诊断记录」
  view_result: button「查看结果」
  result_title: 产业关键环节识别结果
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: click
  target: 诊断记录
- action: click
  target: 查看结果（已完成条目）
- action: wait
  for: 产业关键环节识别结果
expect:
- note: 结果顶栏为「{分析对象} · 产业关键环节识别结果」口径（现场标题「产业关键环节识别结果」+ 分析对象回显）
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1200); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('ALLOW_SKIP: 诊断记录无「查看结果」'); await view.click(); await page.waitForTimeout(2500); await expect(page.getByText('产业关键环节识别结果')).toBeVisible({ timeout: 12000 }); const t = await page.locator('main').innerText(); if (!/分析对象/.test(t)) throw new Error('结果未见分析对象回显')
- note: 图谱为完整全链路结构化图谱，不被截断为仅关键节点列表
  assert: |-
    await expect(page.getByText(/全链路环节结构化展示/).first()).toBeVisible({ timeout: 8000 }); const t = await page.locator('main').innerText(); if (!/研发/.test(t) || !/服务/.test(t)) throw new Error('未见全链路端点环节')
- note: 研发、设计、制造、销售、服务五个标准化环节可见且顺序正确
  assert: |-
    const t = await page.locator('main').innerText(); const order = ['研发','设计','制造','销售','服务']; let last = -1; for (const s of order) { const i = t.indexOf(s); if (i < 0) throw new Error('缺环节 ' + s); if (i < last) throw new Error('环节顺序错乱于 ' + s); last = i }
allow_skip: 诊断记录无已完成关键环节任务时记 Pass-N/A + observed
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 优先经「诊断记录→查看结果」验收。现场常见诚实降级（高端化 —、关键环节数 0、暂无代表企业），不升 Fail。勿写周期结果正向。
tier: A
