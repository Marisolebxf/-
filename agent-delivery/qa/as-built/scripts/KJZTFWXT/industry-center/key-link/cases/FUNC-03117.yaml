id: FUNC-03117
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03117
priority: P0
tier: B
title: 同一天同一组对象再次开始分析打开已有结果
entry_id: chain-key-link
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: evaluate
    note: 03088 首次成功→03119 回配置→03117 再次开始；两条预期在 expect
expect:
  - note: 1、提示「今日已分析过相同条件，已打开结果」
    assert: |-
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const HINT = '今日已分析过相同条件，已打开结果';
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const pickSelect = async (trigger, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 12000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const pickIfNeeded = async (trigger, label) => {
        const cur = ((await trigger.innerText().catch(() => '')) || '').replace(/\s+/g, '');
        if (cur.includes(label)) return;
        await pickSelect(trigger, label);
      };
      const applyNewEnergy = async () => {
        const identity = main().locator('.diagnosis-config-identity');
        const cluster = identity.locator('.arco-select-view[aria-label="集群"]').first();
        const industry = identity.locator('.arco-select-view[aria-label="产业"]').first();
        const chainItem = identity.locator('.arco-form-item').filter({ hasText: '所属产业链' });
        const chainView = chainItem.locator('.arco-select-view').first();
        await pickIfNeeded(cluster, '新能源');
        await pickIfNeeded(industry, '新能源');
        await page.waitForTimeout(400);
        await pickIfNeeded(chainView, '新能源');
      };
      const isResultView = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t);
      };
      const taskIdFromPage = async () => {
        const q = new URL(page.url()).searchParams.get('task_id') || '';
        if (TID_RE.test(q)) return q;
        const b = await main().innerText().catch(() => '');
        return (b.match(TID_RE) || [])[0] || '';
      };
      const firstRunToResult = async () => {
        if (await isResultView()) return;
        await applyNewEnergy();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 5 ? 800 : 1500);
          const t = await main().innerText().catch(() => '');
          if (t.includes(HINT) && (await isResultView())) return;
          if (await isResultView()) return;
          if (/产业关键环节识别生成中/.test(t)) {
            const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
            if (await viewBtn.isVisible().catch(() => false)) {
              await viewBtn.click({ timeout: 10000 });
              await page.waitForTimeout(1500);
            }
          }
          if (/分析失败|INPUT_OBJECT_INVALID/.test(t) && i > 8) {
            throw new Error('首次分析失败，无法造当天成功前置');
          }
        }
        throw new Error('首次分析未到达成功结果页');
      };
      await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({ timeout: 15000 });
      await firstRunToResult();
      const taskFirst = await taskIdFromPage();
      if (!taskFirst) throw new Error('首次成功未见任务号');
      const newFrom = page.getByRole('button', { name: '按此配置新建分析' }).first();
      await expect(newFrom).toBeVisible({ timeout: 12000 });
      await newFrom.click({ timeout: 10000 });
      await page.waitForTimeout(1000);
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 12000 });
      await applyNewEnergy();
      const start2 = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start2).toBeEnabled({ timeout: 20000 });
      const msgLoc = page.locator('.arco-message-content, .arco-message-list .arco-message').filter({ hasText: HINT });
      const msgWait = msgLoc.first().waitFor({ state: 'visible', timeout: 20000 }).catch(() => null);
      await start2.click({ timeout: 15000 });
      await msgWait;
      let sawHint = false;
      for (let i = 0; i < 35; i++) {
        await page.waitForTimeout(i === 0 ? 100 : 400);
        if (await msgLoc.count()) {
          if (await msgLoc.first().isVisible().catch(() => false)) sawHint = true;
        }
        const body = await main().innerText().catch(() => '');
        if (body.includes(HINT)) sawHint = true;
        if (sawHint && (await isResultView())) break;
      }
      if (!sawHint) {
        await expect(msgLoc.first()).toBeVisible({ timeout: 3000 });
      }
      globalThis.__func03117 = { taskFirst, sawHint };
  - note: 2、打开的任务号与当天已成功的那次相同
    assert: |-
      const ctx = globalThis.__func03117;
      if (!ctx?.taskFirst) throw new Error('缺少首次任务号');
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 15000 });
      const q = new URL(page.url()).searchParams.get('task_id') || '';
      const body = await main().innerText().catch(() => '');
      const taskSecond = (TID_RE.test(q) ? q : '') || (body.match(TID_RE) || [])[0] || '';
      if (taskSecond && taskSecond !== ctx.taskFirst) {
        throw new Error('任务号不一致：' + ctx.taskFirst + ' vs ' + taskSecond);
      }
      if (!taskSecond && !body.includes(ctx.taskFirst)) {
        throw new Error('结果页未见原任务号 ' + ctx.taskFirst);
      }
on_fail: 截图 + 抄 X-Trace-Id
