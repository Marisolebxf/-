id: FUNC-03117
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03117
priority: P0
title: 同一天同一组对象再次开始分析打开已有结果
story: US-CHAIN-DIAG-03
entry_id: chain-key-link
tier: B
preconditions:
  - 当天已用「新能源 / 新能源 / 新能源」成功分析过（assert 自含首次到达成功结果）
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
  segment: .arco-select-view.industry-catalog-select
  start: button「开始分析」
  same_day_hint: 今日已分析过相同条件，已打开结果
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 新能源三级首次成功→回填同条件→再次开始分析；两条预期在 expect
expect:
  - note: 1、提示「今日已分析过相同条件，已打开结果」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const HINT = /今日已分析过相同条件，已打开结果/;
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await expect(leaf().first()).toBeVisible({ timeout: 10000 });
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          await assertNotSpa404('sidebar');
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const pickSelect = async (trigger, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      const applyNewEnergy = async () => {
        await dismissBasket();
        await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await pickSelect(page.locator('.arco-select-view[aria-label="集群"]').first(), '新能源');
        await pickSelect(page.locator('.arco-select-view[aria-label="产业"]').first(), '新能源');
        const chainView = page.locator('.industry-catalog-select .arco-select-view').first();
        await expect(chainView).toBeVisible({ timeout: 8000 });
        await pickSelect(chainView, '新能源');
      };
      const isKeyLinkResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t) || (await page.getByText('产业关键环节识别结果').first().isVisible().catch(() => false));
      };
      const extractTaskId = () => {
        const fromUrl = new URL(page.url()).searchParams.get('task_id') || '';
        if (fromUrl && TID_RE.test(fromUrl)) return fromUrl;
        const body = main().innerText().catch(() => '');
        return body.then((b) => (b.match(TID_RE) || [])[0] || '');
      };
      const openFromViewBtn = async () => {
        const btn = page.getByRole('button', { name: '查看分析结果' }).first();
        if (await btn.isVisible().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          await page.waitForTimeout(2000);
        }
      };
      const waitSuccessAfterStart = async () => {
        let last = '';
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 600 : 1500);
          last = await main().innerText().catch(() => '');
          if (await isKeyLinkResult()) return { sameDayHint: HINT.test(last) };
          const toast = page.locator('.arco-message, .arco-notification').filter({ hasText: HINT });
          if (await toast.count() && (await toast.first().isVisible().catch(() => false)) && (await isKeyLinkResult())) {
            return { sameDayHint: true };
          }
          if (/今日已分析过相同条件/.test(last) && (await isKeyLinkResult())) return { sameDayHint: true };
          if (/分析结果已生成/.test(last)) {
            await openFromViewBtn();
            if (await isKeyLinkResult()) return { sameDayHint: HINT.test(last) };
          }
          if (/分析失败|INPUT_OBJECT_INVALID/.test(last) && i >= 10) {
            throw new Error('ENV-KEYLINK-ASYNC-FAIL-001：新能源组合无法完成分析');
          }
        }
        throw new Error('首次分析未在超时内到达成功结果：' + last.slice(0, 220));
      };
      const reachTodaySuccessOnce = async () => {
        if (await isKeyLinkResult()) return { sameDayHint: HINT.test(await main().innerText().catch(() => '')) };
        await applyNewEnergy();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 8; i++) {
          await page.waitForTimeout(500);
          const last = await main().innerText().catch(() => '');
          if (HINT.test(last) && (await isKeyLinkResult())) return { sameDayHint: true };
        }
        return await waitSuccessAfterStart();
      };
      const backToConfigTab = async () => {
        const newFrom = page.getByRole('button', { name: '按此配置新建分析' }).first();
        const back = page.getByRole('button', { name: '返回配置' }).first();
        if (await newFrom.isVisible().catch(() => false)) {
          await newFrom.click({ timeout: 10000 });
        } else if (await back.isVisible().catch(() => false)) {
          await back.click({ timeout: 10000 });
        } else {
          await page.getByRole('tab', { name: '产业关键环节识别' }).first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(1200);
        await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 12000 });
        await dismissBasket();
      };
      await enterKeyLink();
      await assertNotSpa404('after-enter');
      await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({ timeout: 12000 });
      await reachTodaySuccessOnce();
      const taskFirst = await extractTaskId();
      if (!taskFirst) throw new Error('首次成功未见 CHAIN 任务标识');
      await backToConfigTab();
      await applyNewEnergy();
      const start2 = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start2).toBeEnabled({ timeout: 20000 });
      await start2.click({ timeout: 15000 });
      let sawHint = false;
      let last = '';
      const hintRe = /今日已分析过相同条件/;
      const toastHint = () =>
        page.locator('.arco-message, .arco-notification').filter({ hasText: hintRe });
      try {
        await expect(toastHint().first()).toBeVisible({ timeout: 12000 });
        sawHint = true;
      } catch {
        /* toast may clear before poll */
      }
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        last = await main().innerText().catch(() => '');
        if (hintRe.test(last)) sawHint = true;
        if (await toastHint().count() && (await toastHint().first().isVisible().catch(() => false))) sawHint = true;
        if (sawHint && (await isKeyLinkResult())) break;
        if (await isKeyLinkResult() && sawHint) break;
      }
      globalThis.__func03117 = { taskFirst, sawHint, lastBody: last };
      if (!sawHint) {
        await expect(toastHint().first()).toBeVisible({ timeout: 3000 });
      }
  - note: 2、打开的任务号与当天已成功的那次相同
    assert: |-
      const ctx = globalThis.__func03117;
      if (!ctx) throw new Error('前置：未完成二次开始分析');
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 15000 });
      const taskSecond =
        new URL(page.url()).searchParams.get('task_id') ||
        (await main().innerText().catch(() => '')).match(TID_RE)?.[0] ||
        '';
      if (ctx.taskFirst && taskSecond && ctx.taskFirst !== taskSecond) {
        throw new Error('同条件当天复用 task_id 不一致：' + ctx.taskFirst + ' vs ' + taskSecond);
      }
      if (!taskSecond && ctx.taskFirst) {
        const body = await main().innerText().catch(() => '');
        if (!body.includes(ctx.taskFirst)) {
          throw new Error('结果页未见原任务号 ' + ctx.taskFirst);
        }
      }
      const body = await main().innerText().catch(() => ctx.lastBody || '');
      if (/产业关键环节识别生成中/.test(body) && !/产业关键环节识别结果/.test(body)) {
        throw new Error('二次开始后仍停生成中页，未打开已有结果');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search 再侧栏进入。
  指纹=新能源/新能源/新能源（对齐用例前置与 FUNC-03098）。步骤=再次选齐同组→「开始分析」→当天复用提示+同一 CHAIN task_id。
  前置自含：当天尚无成功则首次发起至结果。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
