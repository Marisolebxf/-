id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00580
priority: P0
title: 切换分析对象下级联动且不自动创建任务
entry_id: chain-key-link
preconditions:
- 已进入产业关键环节识别页
locators:
  cluster: aria-label=集群
  chain: aria-label=产业
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: evaluate
  note: 切集群为生物产业→回读下级→切回默认
expect:
- note: 产业链选项随产业联动、细分产业随产业链联动，已选值回显正确
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.locator('.arco-select-view[aria-label="集群"]').click(); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物产业' }).first().click(); await page.waitForTimeout(1200); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('生物产业'); await page.locator('.arco-select-view[aria-label="产业"]').click(); await page.waitForTimeout(500); const opts = await page.locator('.arco-trigger-popup:visible .arco-select-option').count(); if (opts < 1) throw new Error('生物产业下产业链选项空'); await page.keyboard.press('Escape'); await page.getByRole('button', { name: '重置参数' }).click(); await page.waitForTimeout(1000); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('新一代信息技术')
- note: 对象变更后不自动创建分析任务
  assert: |-
    await page.locator('.arco-select-view[aria-label="集群"]').click(); await page.waitForTimeout(300); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物产业' }).first().click(); await page.waitForTimeout(800); if (/view=result|view=processing/.test(page.url())) throw new Error('切对象后自动进过程/结果'); await expect(page).toHaveURL(/workspace=key_link/)
- note: 对象变更不产生诊断记录条目（不自动跳诊断记录）
  assert: |-
    await expect(page.getByRole('tab', { name: '产业关键环节识别' })).toHaveAttribute('aria-selected', 'true'); if (/tab=records|view=records/.test(page.url())) throw new Error('切对象后跳进诊断记录')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 联动刷新过程态 observed；切生物产业后下级未齐时常禁用开始分析。
tier: B
