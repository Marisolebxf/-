id: FUNC-03125
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03125
priority: P1
title: 诊断记录翻到第 2 页首行任务不同
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 诊断记录总条数超过 10（assert 自含数据闸门）
locators:
  records_tab: tab「诊断记录」
  records_pagination: .diagnosis-records .arco-pagination
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节→诊断记录→点页码 2；首行差异与表头在 expect
expect:
  - note: 前置：产业关键环节识别已切「诊断记录」，且可翻到第 2 页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const recordsSection = () => main().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
      const recordsTable = () => recordsSection().locator('.arco-table, table').first();
      const recordsPagination = () => recordsSection().locator('.arco-pagination').first();
      const firstVisibleRowTaskId = async () => {
        const table = recordsTable();
        const rows = table.locator('tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const m = t.match(TID_RE);
          if (m) return m[0];
        }
        return '';
      };
      await enterKeyLink();
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      await expect(recordsSection()).toBeVisible({ timeout: 8000 });
      const bodyRec = await recordsSection().innerText().catch(() => '');
      if (!TID_RE.test(bodyRec) && !/暂无|无记录/.test(bodyRec)) {
        throw new Error('ENV-KEYLINK-NO-RECORDS-03125：诊断记录未见 CHAIN 任务行');
      }
      const pag = recordsPagination();
      const page2Btn = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 =
        ((await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false))) ||
        (await pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').count()) > 0;
      if (!hasPage2) {
        throw new Error('数据闸门：诊断记录总条数未超过 10（默认每页 10 条），无法翻到第 2 页');
      }
      const taskPage1 = await firstVisibleRowTaskId();
      if (!taskPage1) {
        throw new Error('第 1 页首行未见任务编号 CHAIN-*');
      }
      globalThis.__func03125 = { taskPage1, recordsReady: true };
  - note: 1、点页码「2」后首行任务号与第 1 页不同
    assert: |-
      if (!globalThis.__func03125?.recordsReady) throw new Error('前置：诊断记录未就绪');
      const taskPage1 = globalThis.__func03125.taskPage1;
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main').first();
      const recordsSection = () => main().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
      const recordsTable = () => recordsSection().locator('.arco-table, table').first();
      const recordsPagination = () => recordsSection().locator('.arco-pagination').first();
      const firstVisibleRowTaskId = async () => {
        const rows = recordsTable().locator('tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const m = t.match(TID_RE);
          if (m) return m[0];
        }
        return '';
      };
      const clickPageNum = async (num) => {
        const pag = recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const btn = pag.locator('.arco-pagination-item').filter({ hasText: new RegExp('^\\s*' + num + '\\s*$') }).first();
        if ((await btn.count()) > 0 && (await btn.isVisible().catch(() => false))) {
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(900);
          return;
        }
        if (num === 2) {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) && (await next.isVisible().catch(() => false))) {
            await next.click({ timeout: 8000 });
            await page.waitForTimeout(900);
            return;
          }
        }
        throw new Error('分页「' + num + '」不可点');
      };
      await clickPageNum(2);
      const pag = recordsPagination();
      const active = ((await pag.locator('.arco-pagination-item-active').first().innerText()) || '').trim();
      if (active !== '2') {
        throw new Error('翻页后当前页应为 2，现场 active=' + (active || '(空)'));
      }
      const taskPage2 = await firstVisibleRowTaskId();
      if (!taskPage2) {
        throw new Error('第 2 页首行未见任务编号 CHAIN-*');
      }
      if (taskPage2 === taskPage1) {
        throw new Error('第 2 页首行任务与第 1 页相同：' + taskPage2);
      }
      globalThis.__func03125.taskPage2 = taskPage2;
  - note: 2、表头仍为任务、类型、状态、创建时间、操作
    assert: |-
      if (!globalThis.__func03125?.taskPage2) throw new Error('前置：未完成翻页');
      const main = page.locator('main').first();
      const headers = ['任务', '类型', '状态', '创建时间', '操作'];
      const table = main().locator('table, .arco-table').first();
      if (await table.count()) {
        const thTexts = await table.locator('thead th, thead .arco-table-th').allInnerTexts();
        const joined = thTexts.join(' ');
        for (const h of headers) {
          if (!joined.includes(h)) throw new Error('翻页后表头缺列「' + h + '」；thead=' + joined.replace(/\s+/g, ' '));
        }
      } else {
        const body = await main().innerText().catch(() => '');
        for (const h of headers) {
          if (!body.includes(h)) throw new Error('翻页后表头缺列「' + h + '」；main=' + body.replace(/\s+/g, ' ').slice(0, 320));
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search 再侧栏进入（对齐 FUNC-03112/03121）。
  步骤=Tab「诊断记录」→分页点「2」（a-table pageSize=10）。机检=第 1 页 tbody 首可见行 CHAIN 任务号 vs 第 2 页首行不同；翻页后表头五列不变。
  无第 2 页→数据闸门（总条数≤10）。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
