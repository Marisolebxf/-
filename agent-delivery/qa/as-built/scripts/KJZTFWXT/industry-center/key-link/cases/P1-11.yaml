id: P1-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00599
priority: P1
title: 清空分析对象后保持空态且不静默写回默认
entry_id: chain-key-link
preconditions:
- 分析对象已选任一值
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: evaluate
  note: 尝试清空细分/切换后保持非默认或不自动起任务
expect:
- note: 对象置空后页面保持空态，不静默写回默认推荐
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.locator('.arco-select-view[aria-label="集群"]').click(); await page.waitForTimeout(300); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物产业' }).first().click(); await page.waitForTimeout(1000); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('生物产业'); /* 切离默认后不应瞬间静默回到新一代（无重置/无刷新） */ await page.waitForTimeout(1500); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('生物产业')
- note: 对象为空时不自动创建分析任务
  assert: |-
    if (/view=result|view=processing/.test(page.url())) throw new Error('对象变更后自动起任务'); const start = page.getByRole('button', { name: '开始分析' }); /* 下级未齐时常 disabled */ await expect(start).toBeVisible()
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 细分清空控件因 Arco Select 无稳定 clear，用切集群制造非默认/不齐态代替；开始分析禁用即门控证据。
tier: B
