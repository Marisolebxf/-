id: FUNC-03132
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03132
priority: P1
title: 删除分析记录取消后任务仍在诊断记录
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 诊断记录中有一条任务
locators:
  records_tab: tab「诊断记录」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节→诊断记录→任一行「删除」→Modal→「取消」；判定在 expect
expect:
  - note: 1、弹出标题为「删除分析记录」的对话框
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          if (await bodyIs404()) {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog-sibling-404');
          } else {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            if (await leaf().first().isVisible().catch(() => false)) {
              await leaf().first().click({ timeout: 10000 });
              await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
              await assertNotSpa404('sidebar');
            } else {
              await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              await page.waitForTimeout(1000);
              await assertNotSpa404('direct-catalog');
            }
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const scrollRecordActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const pickDeletableRow = async () => {
        await scrollRecordActions();
        const rows = main().locator('tbody tr, .arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 25); i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!TID_RE.test(rowText)) continue;
          if (!/产业关键环节识别/.test(rowText)) continue;
          const tidM = rowText.match(TID_RE);
          if (!tidM) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollRecordActions();
          let del = row.getByRole('button', { name: '删除', exact: true }).first();
          if (!(await del.count())) {
            del = row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
          }
          if (!(await del.count()) || (await del.isDisabled().catch(() => true))) continue;
          if (!(await del.isVisible().catch(() => false))) continue;
          return { del, tid: tidM[0] };
        }
        return null;
      };
      await enterKeyLink();
      await openRecordsTab();
      const recBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!TID_RE.test(recBody)) {
        throw new Error('ENV-KEYLINK-NO-RECORDS-03132：诊断记录未见 CHAIN 任务行');
      }
      const picked = await pickDeletableRow();
      if (!picked) {
        const delTotal = await main().getByRole('button', { name: '删除', exact: true }).count();
        if (delTotal === 0) {
          throw new Error('DEF-KEYLINK-DELETE-UI-001: 有任务行但操作列无「删除」');
        }
        throw new Error('ENV-KEYLINK-NO-DELETABLE-03132：诊断记录无可点「删除」的关键环节任务行');
      }
      globalThis.__func03132 = { tid: picked.tid, modalReady: false };
      await picked.del.click({ timeout: 15000 });
      await page.waitForTimeout(450);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 10000 });
      await expect(modal.locator('.arco-modal-title').filter({ hasText: '删除分析记录' }).first()).toBeVisible();
      globalThis.__func03132.modalReady = true;
  - note: 2、取消后该任务仍在列表中
    assert: |-
      if (!globalThis.__func03132?.modalReady) throw new Error('前置：未打开删除分析记录弹框');
      const expectedTid = globalThis.__func03132.tid;
      const main = () => page.locator('main').first();
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 5000 });
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const rowStill = main().locator('tbody tr, .arco-table-tr').filter({ hasText: expectedTid });
      await expect(rowStill.first()).toBeVisible({ timeout: 8000 });
      const bodyAfter = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!bodyAfter.includes(expectedTid)) {
        throw new Error('取消删除后任务不在诊断记录列表：' + expectedTid);
      }
      const msgDeleted = page.locator('.arco-message-content, .arco-message').filter({ hasText: /已删除/ });
      if (await msgDeleted.count() && (await msgDeleted.first().isVisible().catch(() => false))) {
        throw new Error('取消后不应出现「已删除」提示');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search（404 时深链 catalog，不改 catalog_path）。
  步骤=诊断记录 Tab→任一带 CHAIN 编号的关键环节行「删除」→Modal 标题「删除分析记录」→「取消」→任务 ID 仍在。非破坏性（确定删除见 FUNC-03133）。
  无任务行→ENV-KEYLINK-NO-RECORDS-03132；有行无删→DEF-KEYLINK-DELETE-UI-001 / ENV-KEYLINK-NO-DELETABLE-03132。备注列「删除后列表不再显示」未写入机检（预期列仅标题+取消仍在）。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
