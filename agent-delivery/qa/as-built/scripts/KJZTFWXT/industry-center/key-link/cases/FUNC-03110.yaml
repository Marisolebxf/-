id: FUNC-03110
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03110
priority: P0
tier: B
title: 开始分析后停在生成页且五阶段完成
entry_id: chain-key-link
preconditions: []
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
  segment: .arco-select-view.industry-catalog-select
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: wait
    for: 分析配置主区
    timeout_ms: 15000
  - action: evaluate
    note: 分析对象与产业链选齐→开始分析→等待生成页完成（不点查看分析结果；前置动作在 expect-1）
expect:
  - note: 1、当前页为「产业关键环节识别生成中」
    assert: |-
      const main = () => page.locator('main').first();
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const pickSelect = async (trigger, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({ timeout: 15000 });
      await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(400);
      await pickSelect(page.locator('.arco-select-view[aria-label="集群"]').first(), '新一代信息技术');
      await pickSelect(page.locator('.arco-select-view[aria-label="产业"]').first(), '半导体与集成电路');
      const seg = page.locator('.arco-select-view.industry-catalog-select').first();
      await expect(seg).toBeVisible({ timeout: 8000 });
      await pickSelect(seg, '半导体与集成电路');
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 20000 });
      await start.click({ timeout: 15000 });
      let last = '';
      let ready = false;
      for (let i = 0; i < 120; i++) {
        await page.waitForTimeout(i < 8 ? 500 : 800);
        last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/分析失败|本次分析生成失败|INPUT_OBJECT_INVALID/.test(last) && i >= 8) {
          throw new Error('ENV-KEYLINK-ASYNC-FAIL：所选组合分析失败');
        }
        if (/今日已分析过相同条件/.test(last)) {
          throw new Error('ENV-KEYLINK-PRECOND-03110：当天已用该组对象成功分析，无法测生成页');
        }
        if (/产业关键环节识别结果/.test(last)) {
          throw new Error('ENV-KEYLINK-PRECOND-03110：未停在生成页，已自动进入结果页');
        }
        const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
        if ((await viewBtn.isVisible().catch(() => false)) && /产业关键环节识别生成中/.test(last)) {
          ready = true;
          break;
        }
      }
      if (!ready) {
        throw new Error('未到生成页完成态，末态=' + last.slice(0, 280));
      }
      await expect(main().getByText('产业关键环节识别生成中').first()).toBeVisible({ timeout: 5000 });
  - note: 2、五个阶段均显示「已完成」（附录E）
    assert: |-
      const stages = [
        '任务提交与产业链对象冻结',
        '全链路环节结构化拆解（研发/设计/制造/销售/服务）',
        '基于附加值率、技术壁垒、市场集中度计算高端化指数',
        '关键环节智能标注与竞争格局/代表企业/技术趋势归纳',
        '结果可信性校验与分析报告组装',
      ];
      const main = () => page.locator('main').first();
      for (const title of stages) {
        const step = main().locator('.arco-steps-item').filter({ hasText: title }).first();
        await expect(step).toBeVisible({ timeout: 5000 });
        await expect(step).toContainText('已完成');
      }
  - note: 3、可见「查看分析结果」
    assert: |-
      const btn = page.getByRole('button', { name: '查看分析结果' }).first();
      await expect(btn).toBeVisible({ timeout: 10000 });
      await expect(btn).toBeEnabled();
on_fail: 截图 + 抄 X-Trace-Id
