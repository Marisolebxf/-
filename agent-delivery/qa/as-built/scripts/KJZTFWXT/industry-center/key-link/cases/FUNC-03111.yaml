id: FUNC-03111
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03111
priority: P0
title: 生成页查看分析记录回到诊断记录并见本任务
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 已停在「产业关键环节识别生成中」过程页（assert 自含：发起或复用至过程壳可见任务号）
locators:
  view_records: button「查看分析记录」
  records_tab: tab「诊断记录」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节→过程页→点「查看分析记录」；诊断记录与任务行在 expect
expect:
  - note: 1、进入「诊断记录」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
        const h1 = page.getByRole('heading', { name: '产业关键环节识别', level: 1 });
        if (!(await h1.isVisible().catch(() => false))) {
          await assertNotSpa404('h1-missing');
          throw new Error('ENV-KEYLINK-SHELL-001：未见产业关键环节识别页头');
        }
      };
      const pickSelect = async (trigger, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const configureTriple = async (combo) => {
        await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(400);
        await pickSelect(page.locator('.arco-select-view[aria-label="集群"]').first(), combo.cluster);
        await pickSelect(page.locator('.arco-select-view[aria-label="产业"]').first(), combo.chain);
        const seg = page.locator('.arco-select-view.industry-catalog-select').first();
        await expect(seg).toBeVisible({ timeout: 8000 });
        await pickSelect(seg, combo.segment);
      };
      const extractTaskId = (body, url) => {
        const fromUrl = new URL(url).searchParams.get('task_id') || '';
        if (fromUrl && TID_RE.test(fromUrl)) return fromUrl;
        const m = body.match(TID_RE);
        return m ? m[0] : '';
      };
      const onProcessShell = (body, url) =>
        /产业关键环节识别生成中/.test(body) ||
        /分析结果已生成/.test(body) ||
        /view=processing/.test(url) ||
        (TID_RE.test(body) && /可视化分析过程/.test(body));
      const tryRerunFromResult = async () => {
        const rerun = page
          .getByRole('button', { name: '重新分析' })
          .first()
          .or(page.getByRole('button', { name: '按此配置新建分析' }).first());
        if (!(await rerun.isVisible().catch(() => false))) return false;
        await rerun.click({ timeout: 10000 });
        await page.waitForTimeout(1000);
        return true;
      };
      const ensureProcessPage = async () => {
        await enterKeyLink();
        let body = await main().innerText().catch(() => '');
        let url = page.url();
        if (onProcessShell(body, url)) {
          const tid = extractTaskId(body, url);
          if (tid) {
            globalThis.__func03111 = { taskId: tid, readyRecords: false };
            return;
          }
        }
        if (/产业关键环节识别结果/.test(body) && !/产业关键环节识别生成中/.test(body)) {
          if (!(await tryRerunFromResult())) {
            throw new Error('ENV-KEYLINK-DAY-REUSE-001：已在结果页且无重跑入口，无法回到生成页');
          }
        }
        const combos = [
          { cluster: '新一代信息技术', chain: 'INB1701', segment: '半导体与集成电路' },
          { cluster: '新材料', chain: '新材料', segment: '新材料' },
          { cluster: '低空经济与空天', chain: '低空经济与空天', segment: '低空经济与空天' },
        ];
        for (const combo of combos) {
          await configureTriple(combo);
          const start = page.getByRole('button', { name: '开始分析' }).first();
          if (await start.isDisabled()) continue;
          await start.click({ timeout: 12000 });
          for (let i = 0; i < 90; i++) {
            await page.waitForTimeout(i < 8 ? 500 : 700);
            body = await main().innerText().catch(() => '');
            url = page.url();
            const tid = extractTaskId(body, url);
            if (onProcessShell(body, url) && tid) {
              globalThis.__func03111 = { taskId: tid, readyRecords: false };
              return;
            }
            if (/分析失败|INPUT_OBJECT_INVALID/.test(body) && i >= 10) break;
            if (/今日已分析过相同条件/.test(body) && /产业关键环节识别结果/.test(body)) {
              if (await tryRerunFromResult()) {
                await configureTriple(combo);
                const s2 = page.getByRole('button', { name: '开始分析' }).first();
                if (await s2.isEnabled()) await s2.click({ timeout: 12000 });
              }
              break;
            }
          }
          if (globalThis.__func03111?.taskId) return;
        }
        await assertNotSpa404('proc-miss');
        throw new Error('ENV-KEYLINK-PROC-03111-001：未能在过程页捕获任务号');
      };
      await ensureProcessPage();
      const snap = globalThis.__func03111;
      if (!snap?.taskId) throw new Error('前置：过程页无 taskId');
      const procBody = await main().innerText().catch(() => '');
      if (!/产业关键环节识别生成中/.test(procBody) && !/分析结果已生成/.test(procBody) && !/可视化分析过程/.test(procBody)) {
        throw new Error('前置：未见「产业关键环节识别生成中」过程壳');
      }
      const recordsBtn = page.getByRole('button', { name: '查看分析记录' }).first();
      await expect(recordsBtn).toBeVisible({ timeout: 8000 });
      await recordsBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      const urlAfter = page.url();
      if (!/tab=records|view=records/.test(urlAfter)) {
        const bodyAfter = await main().innerText().catch(() => '');
        if (!/诊断记录/.test(bodyAfter) || !/任务状态|全部状态/.test(bodyAfter)) {
          throw new Error('点「查看分析记录」后未见诊断记录区，url=' + urlAfter);
        }
      }
      globalThis.__func03111.readyRecords = true;
  - note: 2、列表中能看到本次任务号
    assert: |-
      if (!globalThis.__func03111?.readyRecords) throw new Error('前置：未进入诊断记录');
      const main = page.locator('main').first();
      const body = await main.innerText().catch(() => '');
      const taskId = globalThis.__func03111.taskId || '';
      if (!taskId) throw new Error('ENV-KEYLINK-NO-TASK-ID-03111：无 taskId');
      if (!body.includes(taskId)) {
        throw new Error('诊断记录列表未见本任务 ' + taskId + '；main=' + body.replace(/\s+/g, ' ').slice(0, 280));
      }
      const row = main.locator('tbody tr, .arco-table-tr').filter({ hasText: taskId }).first();
      if ((await row.count()) < 1) {
        throw new Error('表格行内未见任务编号 ' + taskId);
      }
      if (!/产业关键环节识别/.test(await row.innerText().catch(() => ''))) {
        throw new Error('任务行未见类型「产业关键环节识别」');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；goto sibling /industry-center/search 再侧栏进入。
  用例前置=「产业关键环节识别生成中」过程壳；步骤=点「查看分析记录」（非「查看分析结果」）。openRecords→诊断记录 Tab aria-selected + 列表含 CHAIN 任务行。
  过程页无任务→配置合法三级组合发起；当天结果页→重新分析/按此配置新建分析。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
