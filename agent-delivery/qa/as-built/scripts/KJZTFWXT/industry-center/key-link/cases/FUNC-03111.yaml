id: FUNC-03111
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03111
priority: P0
title: 生成页查看分析记录回到诊断记录并见本任务
story: US-CHAIN-DIAG-07
entry_id: chain-key-link
tier: B
preconditions:
  - 已停在「产业关键环节识别生成中」过程页（脚本自含：重新分析或开始分析至过程壳）
locators:
  view_records: button「查看分析记录」
  records_tab: tab「诊断记录」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: wait
    for: 产业关键环节识别页头
    timeout_ms: 8000
  - action: evaluate
    note: 至过程页并点「查看分析记录」
expect:
  - note: 1、进入「诊断记录」
    assert: |-
      const main = page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const taskIdFrom = (text, url) => {
        const fromUrl = new URL(url).searchParams.get('task_id') || '';
        if (fromUrl && TID_RE.test(fromUrl)) return fromUrl;
        const m = text.match(TID_RE);
        return m ? m[0] : '';
      };
      const recordsBtn = page.getByRole('button', { name: '查看分析记录' }).first();
      if (!(await recordsBtn.isVisible().catch(() => false))) {
        const rerun = page.getByRole('button', { name: '重新分析' }).first();
        if (await rerun.isVisible().catch(() => false)) {
          await rerun.click({ timeout: 5000 });
        } else {
          await page.getByRole('button', { name: '开始分析' }).first().click({ timeout: 5000 });
        }
        await recordsBtn.waitFor({ state: 'visible', timeout: 5500 });
      }
      let body = await main.innerText().catch(() => '');
      const taskId = taskIdFrom(body, page.url());
      if (!taskId) throw new Error('过程壳未见 CHAIN 任务号');
      globalThis.__func03111 = { taskId, readyRecords: false };
      await recordsBtn.click({ timeout: 5000 });
      await page.waitForTimeout(400);
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toHaveAttribute('aria-selected', 'true', { timeout: 2500 });
      globalThis.__func03111.readyRecords = true;
  - note: 2、列表中能看到本次任务号
    assert: |-
      if (!globalThis.__func03111?.readyRecords) throw new Error('前置：未进入诊断记录');
      const main = page.locator('main').first();
      const body = await main.innerText().catch(() => '');
      const taskId = globalThis.__func03111.taskId || '';
      if (!taskId) throw new Error('无 taskId');
      if (!body.includes(taskId)) {
        throw new Error('诊断记录列表未见本任务 ' + taskId);
      }
      const row = main.locator('tbody tr, .arco-table-tr').filter({ hasText: taskId }).first();
      await expect(row).toBeVisible({ timeout: 3000 });
      if (!/产业关键环节识别/.test(await row.innerText().catch(() => ''))) {
        throw new Error('任务行未见类型「产业关键环节识别」');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  深链 catalog_path；过程壳无「查看分析记录」时先点重新分析或开始分析；点查看分析记录后进诊断记录 Tab 并断言 CHAIN 行。
