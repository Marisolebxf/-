id: P1-12
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00600
priority: P1
title: 结果数据不足时不补造标注与数值
entry_id: chain-key-link
preconditions:
- 已执行分析且结果数据不足（以现场为准）
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: click
  target: 诊断记录→查看结果
expect:
- note: 数据不足处为空值或「暂无数据」类诚实提示
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('ALLOW_SKIP: 无查看结果'); await view.click(); await page.waitForTimeout(2500); const t = await page.locator('main').innerText(); if (!/暂无|—|数据筹备中|暂无正式数据源|诚实降级|关键环节数\s*0/.test(t)) throw new Error('未见诚实空态提示（若本轮满数据则 observed）')
- note: 不出现演示数字、0 或推算值冒充正式结果
  assert: |-
    const t = await page.locator('main').innerText(); if (/演示数字|假数据|Mock正式/.test(t)) throw new Error('疑似演示冒充'); /* 「关键环节数 0」与「高端化 —」为诚实空，允许 */
allow_skip: 本轮结果满数据无空态时 Pass-N/A（记 observed）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘样例含关键环节数 0 / 高端化 — / 暂无代表企业，可直接核诚实空。
tier: B
