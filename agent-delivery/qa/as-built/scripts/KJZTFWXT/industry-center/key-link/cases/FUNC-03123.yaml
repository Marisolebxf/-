id: FUNC-03123
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03123
priority: P1
tier: B
title: 失败任务复制配置回到分析配置
entry_id: chain-key-link
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: wait
    for: 产业关键环节识别页就绪
    timeout_ms: 15000
expect:
  - note: 1.点击该行「复制配置」（前置：诊断记录 + 任务状态失败 + 存在失败行）
    assert: |-
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const recordsTab = main().getByRole('tab', { name: '诊断记录' }).first();
      await expect(recordsTab).toBeVisible({ timeout: 12000 });
      await recordsTab.click({ timeout: 10000 });
      await page.waitForTimeout(1000);
      await expect(recordsTab).toHaveAttribute('aria-selected', 'true');
      await expect(main().getByRole('heading', { name: '诊断记录', level: 2 })).toBeVisible({ timeout: 10000 });
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      await page.keyboard.press('Escape').catch(() => {});
      const trigger = main().locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const failOpt = page.locator(optSel).filter({ hasText: /^失败$/ }).first();
      await expect(failOpt).toBeVisible({ timeout: 8000 });
      await failOpt.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await expect(trigger).toContainText('失败');
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
      await page.waitForTimeout(800);
      const n = await rows.count();
      let clicked = false;
      for (let i = 0; i < Math.min(n, 20); i++) {
        const row = rows.nth(i);
        if (!(await row.isVisible().catch(() => false))) continue;
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/失败/.test(rowText) || !/产业关键环节识别/.test(rowText)) continue;
        const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
        if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
        await copyBtn.click({ timeout: 15000 });
        clicked = true;
        break;
      }
      if (!clicked) throw new Error('ENV-KEYLINK-NO-FAILED-03123：诊断记录无失败任务可点「复制配置」');
      await page.waitForTimeout(700);
      globalThis.__func03123 = { copied: true };
  - note: 1、回到「分析配置」
    assert: |-
      if (!globalThis.__func03123?.copied) throw new Error('前置：未点击复制配置');
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      const configTab = page.getByRole('tab', { name: '产业关键环节识别' }).first();
      await expect(configTab).toHaveAttribute('aria-selected', 'true');
  - note: 2、下拉回显该任务保存的对象
    assert: |-
      if (!globalThis.__func03123?.copied) throw new Error('前置：未点击复制配置');
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const objSlice = (body.split('分析对象')[1] || '').split('所属产业链')[0] || '';
      const objVal = objSlice.replace(/注册识别因子.*/s, '').trim();
      if (!objVal || /请选择|未选/.test(objVal)) {
        throw new Error('分析对象未回显：「' + objVal.slice(0, 60) + '」');
      }
      const chainSlice = (body.split('所属产业链')[1] || '').split('注册识别因子')[0] || '';
      const chainVal = chainSlice.trim();
      if (!chainVal || /请选择|未选/.test(chainVal)) {
        throw new Error('所属产业链未回显：「' + chainVal.slice(0, 60) + '」');
      }
  - note: 3、未进入结果页
    assert: |-
      if (!globalThis.__func03123?.copied) throw new Error('前置：未点击复制配置');
      const url = page.url();
      if (/view=result|demo_state=processing/.test(url)) {
        throw new Error('复制后不应进入结果或生成 URL：' + url);
      }
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/产业关键环节识别结果/.test(body) && !/分析配置/.test(body)) {
        throw new Error('复制后不应停在结果页');
      }
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
