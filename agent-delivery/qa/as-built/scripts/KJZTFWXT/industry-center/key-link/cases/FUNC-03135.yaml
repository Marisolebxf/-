id: FUNC-03135
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03135
priority: P1
title: 报告页「导出」不可点击
story: US-CHAIN-DIAG-04
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开一条已完成任务的报告
locators:
  records_tab: tab「诊断记录」
  view_report: button「查看报告」
  export_btn: button「导出」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: wait
    for: 关键环节页就绪
    timeout_ms: 2000
  - action: evaluate
    note: 诊断记录已完成行「查看报告」→定位「导出」；不可点在 expect
expect:
  - note: 前置：已打开一条已完成任务的产业关键环节识别报告（用例前置）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t);
      };
      const assertNotSpa404 = async (where) => {
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await page.waitForTimeout(1000);
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
        await assertNotSpa404('key-link-landing');
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      await enterKeyLink();
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ });
      const n = await rows.count();
      if (n < 1) throw new Error('ENV-KEYLINK-NO-COMPLETED-03135：诊断记录无已完成行');
      let clicked = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/产业关键环节识别/.test(rowText)) continue;
        if (!TID_RE.test(rowText)) continue;
        const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
        if (!(await reportBtn.count()) || (await reportBtn.isDisabled().catch(() => true))) continue;
        await reportBtn.click({ timeout: 15000, force: true });
        clicked = true;
        for (let j = 0; j < 28; j++) {
          await page.waitForTimeout(500);
          if (/view=report/.test(page.url()) && (await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false))) break;
        }
        if (/view=report/.test(page.url())) break;
        clicked = false;
      }
      if (!clicked) {
        throw new Error('ENV-KEYLINK-NO-REPORT-03135：无已完成关键环节任务可点「查看报告」');
      }
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      await expect(page.getByText('产业关键环节识别报告').first()).toBeVisible({ timeout: 8000 });
      globalThis.__func03135 = { readerReady: true };
  - note: 1、「导出」不可点击
    assert: |-
      if (!globalThis.__func03135?.readerReady) throw new Error('前置：报告页未打开');
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader).toBeVisible({ timeout: 8000 });
      const locked = reader.locator('[data-report-export-locked]').first();
      const exportByRole = reader.getByRole('button', { name: '导出' }).first();
      if (await locked.count() && (await locked.first().isVisible().catch(() => false))) {
        const exportBtn = locked.locator('button[data-report-download]').first();
        await expect(exportBtn).toBeVisible({ timeout: 5000 });
        await expect(exportBtn).toBeDisabled();
        const cls = (await exportBtn.getAttribute('class')) || '';
        if (!/arco-btn-disabled/.test(cls)) {
          throw new Error('「导出」未见 arco-btn-disabled，class=' + cls);
        }
      } else {
        await expect(exportByRole).toBeVisible({ timeout: 8000 });
        await expect(exportByRole).toBeDisabled();
        const cls = (await exportByRole.getAttribute('class')) || '';
        if (!/arco-btn-disabled/.test(cls)) {
          throw new Error('「导出」未见 disabled 态，class=' + cls);
        }
      }
      const unlocked = page.locator('[data-report-export-unlocked]');
      if (await unlocked.count() && (await unlocked.first().isVisible().catch(() => false))) {
        throw new Error('未付费 admin 环境出现可导出按钮（data-report-export-unlocked）');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=key_link&tab=key-link；edu 侧栏 sibling /industry-center/search 现 404，本条深链直达 catalog（探针 note，不改 forbidden）。
  用例=已完成任务报告页「导出」不可点（admin 未付费，不测文件落地；对齐 cycle 02916 / regional 02999 导出锁定）。
  机检=ReportExportButton data-report-export-locked + disabled 或 role 导出 isDisabled。无已完成→ENV-KEYLINK-NO-COMPLETED-03135 / ENV-KEYLINK-NO-REPORT-03135。
  edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
