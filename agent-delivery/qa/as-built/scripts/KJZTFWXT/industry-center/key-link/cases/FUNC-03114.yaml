id: FUNC-03114
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03114
priority: P0
tier: B
title: 选中新能源后分析对象与所属产业链选项个数
entry_id: chain-key-link
preconditions: []
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
  segment: .arco-select-view.industry-catalog-select
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: wait
    for: 分析配置主区
    timeout_ms: 15000
expect:
  - note: 1、第二个下拉为「新能源」和「新能源(L1)」，共 2 个
    assert: |-
      const main = () => page.locator('main').first();
      const optSel =
        '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const openSelect = async (trigger) => {
        await page.keyboard.press('Escape').catch(() => {});
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(450);
      };
      const pickSelect = async (trigger, label) => {
        await openSelect(trigger);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      const listOpenOptions = async () => {
        const opts = page.locator(optSel);
        await expect(opts.first()).toBeVisible({ timeout: 8000 });
        const n = await opts.count();
        const texts = [];
        for (let i = 0; i < n; i++) {
          texts.push(((await opts.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim());
        }
        return texts.filter(Boolean);
      };
      await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({
        timeout: 15000,
      });
      await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(400);
      await pickSelect(page.locator('.arco-select-view[aria-label="集群"]').first(), '新能源');
      const industryTrigger = page.locator('.arco-select-view[aria-label="产业"]').first();
      await openSelect(industryTrigger);
      const industryOpts = await listOpenOptions();
      if (industryOpts.length !== 2) {
        throw new Error('产业下拉选项数=' + industryOpts.length + '，现场=' + industryOpts.join(' | '));
      }
      const norm = (s) => s.replace(/（/g, '(').replace(/）/g, ')');
      const normalized = industryOpts.map(norm);
      for (const want of ['新能源', '新能源(L1)']) {
        if (!normalized.some((t) => norm(want) === t || t.includes(norm(want)))) {
          throw new Error('产业下拉缺「' + want + '」，现场=' + industryOpts.join(' | '));
        }
      }
      globalThis.__func03114_industryOpts = industryOpts;
  - note: 2、「所属产业链」只有「新能源」，共 1 个
    assert: |-
      if (!globalThis.__func03114_industryOpts) throw new Error('前置：未展开产业下拉');
      const optSel =
        '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const openSelect = async (trigger) => {
        await page.keyboard.press('Escape').catch(() => {});
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(450);
      };
      const pickSelectExact = async (trigger, exactLabel) => {
        await openSelect(trigger);
        const opts = page.locator(optSel);
        const n = await opts.count();
        let picked = false;
        for (let i = 0; i < n; i++) {
          const t = ((await opts.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          if (t === exactLabel) {
            await opts.nth(i).click({ timeout: 8000 });
            picked = true;
            break;
          }
        }
        if (!picked) throw new Error('未找到精确选项「' + exactLabel + '」');
        await page.waitForTimeout(900);
      };
      const listOpenOptions = async () => {
        const opts = page.locator(optSel);
        await expect(opts.first()).toBeVisible({ timeout: 8000 });
        const n = await opts.count();
        const texts = [];
        for (let i = 0; i < n; i++) {
          texts.push(((await opts.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim());
        }
        return texts.filter(Boolean);
      };
      const industryTrigger = page.locator('.arco-select-view[aria-label="产业"]').first();
      await pickSelectExact(industryTrigger, '新能源');
      await page.waitForTimeout(500);
      await expect(industryTrigger).toContainText('新能源', { timeout: 8000 });
      const seg = page.locator('.arco-select-view.industry-catalog-select').first();
      await expect(seg).toBeVisible({ timeout: 8000 });
      await openSelect(seg);
      const chainOpts = await listOpenOptions();
      if (chainOpts.length !== 1) {
        throw new Error('所属产业链选项数=' + chainOpts.length + '，现场=' + chainOpts.join(' | '));
      }
      if (!/^新能源$/.test(chainOpts[0].replace(/\s+/g, ' ').trim())) {
        throw new Error('所属产业链唯一项不是「新能源」，现场=' + chainOpts[0]);
      }
on_fail: 截图 + 抄 X-Trace-Id
