id: FUNC-03093
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03093
priority: P0
title: 注册识别因子表三行名称分组与数据状态
entry_id: chain-key-link
tier: B
preconditions:
  - 已进入产业关键环节识别页
locators:
  factor_section: 注册识别因子表
  metric_table: main 内指标表 tbody
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 侧栏进入页→定位「注册识别因子」表
expect:
  - note: 1、指标为附加值率、技术壁垒、市场集中度；2、分组均为「关键环节识别因子」；3、数据状态均为「可用」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await expect(leaf().first()).toBeVisible({ timeout: 10000 });
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          await assertNotSpa404('sidebar');
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
      };
      await enterKeyLink();
      await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('注册识别因子').first()).toBeVisible({ timeout: 8000 });
      const metrics = ['附加值率', '技术壁垒', '市场集中度'];
      const main = page.locator('main').first();
      const tableText = await main.innerText();
      for (const name of metrics) {
        await expect(main.getByText(name, { exact: true }).first()).toBeVisible({ timeout: 8000 });
        const idx = tableText.indexOf(name);
        if (idx < 0) throw new Error('注册识别因子表内未见「' + name + '」');
        const slice = tableText.slice(idx, idx + 120);
        if (!slice.includes('关键环节识别因子')) {
          throw new Error(name + ' 行分组非「关键环节识别因子」：' + slice.replace(/\s+/g, ' ').slice(0, 80));
        }
        if (!/可用/.test(slice)) {
          throw new Error(name + ' 行数据状态非「可用」：' + slice.replace(/\s+/g, ' ').slice(0, 80));
        }
      }
      const rowHits = await main
        .locator('tr')
        .filter({ hasText: /附加值率|技术壁垒|市场集中度/ })
        .filter({ hasText: '关键环节识别因子' })
        .filter({ hasText: '可用' })
        .count();
      if (rowHits < 3) {
        const avail = (tableText.match(/可用/g) || []).length;
        if (avail < 3) throw new Error('注册识别因子表「可用」不足 3，tr=' + rowHits + ' textAvail=' + avail);
      }
      const spins = main.locator('[role=spinbutton]');
      await expect(spins).toHaveCount(3, { timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  替换作废 00581/P0-03 中「三行名称+分组+数据状态」子集；权重/spin 只读见 FUNC-03094 等后续条。可见表名=附加值率/技术壁垒/市场集中度（testdata.weights）。
  catalog_path=entry-seed；edu 深链 SPA 404（D1），入口 sibling /industry-center/search + 侧栏「产业关键环节识别」，落点 URL 仍验 workspace=key_link&tab=key-link。登录关评审 runner 前置。B 档零 allow_skip。
