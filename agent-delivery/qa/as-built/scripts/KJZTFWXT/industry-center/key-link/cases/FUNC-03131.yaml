id: FUNC-03131
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03131
priority: P1
tier: B
title: 异常-失败任务行上查看结果/报告/下载均不可点
entry_id: chain-key-link
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=records
  - action: wait
    for: 诊断记录任务状态筛选就绪
    timeout_ms: 15000
expect:
  - note: 1、「查看结果」不可点击
    assert: |-
      const main = page.locator('main').first();
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const scrollActions = async () => {
        const bodies = main.locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const selectFailed = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = main.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
        await expect(trigger).toBeVisible({ timeout: 8000 });
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: /^失败$/ }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await expect(trigger).toContainText('失败');
      };
      const pickFailedRow = async () => {
        await scrollActions();
        const rows = main.locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/失败/.test(rt) || /已完成/.test(rt)) continue;
          if (!/产业关键环节识别/.test(rt)) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollActions();
          return row;
        }
        return null;
      };
      await expect(main.getByRole('tab', { name: '诊断记录' })).toHaveAttribute('aria-selected', 'true');
      await selectFailed();
      const row = await pickFailedRow();
      if (!row) throw new Error('ENV-KEYLINK-NO-FAILED-03131');
      const b = row.getByRole('button', { name: '查看结果', exact: true }).first();
      await expect(b).toBeVisible({ timeout: 8000 });
      await expect(b).toBeDisabled();
      await b.click({ timeout: 3000, force: true }).catch(() => {});
      await page.waitForTimeout(300);
  - note: 2、「查看报告」不可点击
