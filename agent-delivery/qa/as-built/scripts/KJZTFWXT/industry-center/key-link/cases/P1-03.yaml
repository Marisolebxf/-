id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00591
priority: P1
title: 分析对象上下文按合同跨工作区共享且不越界
entry_id: chain-key-link
preconditions:
- 可切到同路由兄弟工作区 bottleneck
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: goto
  target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
expect:
- note: 产业与产业链对象在共享合同的工作区之间保持一致
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(300) }; const c1 = await page.locator('.arco-select-view[aria-label="集群"]').getAttribute('title'); const ch1 = await page.locator('.arco-select-view[aria-label="产业"]').getAttribute('title'); await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const c2 = await page.locator('.arco-select-view[aria-label="集群"]').getAttribute('title').catch(()=>null); const ch2 = await page.locator('.arco-select-view[aria-label="产业"]').getAttribute('title').catch(()=>null); if (c2 && c1 && c2 !== c1) throw new Error('集群共享不一致 ' + c1 + ' vs ' + c2); if (ch2 && ch1 && ch2 !== ch1) throw new Error('产业链共享不一致 ' + ch1 + ' vs ' + ch2); /* 仅核对共享回显，不写瓶颈正向业务 */
- note: 切回本页后对象不被重置
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page).toHaveURL(/workspace=key_link/); await expect(page.getByRole('heading', { name: '产业关键环节识别' })).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toBeVisible()
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 只验共享/回切；禁止断言瓶颈结果或配置细节正向。
tier: B
