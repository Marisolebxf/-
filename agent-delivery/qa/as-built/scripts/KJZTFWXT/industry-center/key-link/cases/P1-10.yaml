id: P1-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00598
priority: P1
title: 已有成功结果时重新分析可强制重跑
entry_id: chain-key-link
preconditions:
- 当天已有同条件成功结果；结果页可见重跑入口
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: click
  target: 诊断记录→查看结果→按此配置新建分析
expect:
- note: 点击后强制重新创建任务执行分析
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('ALLOW_SKIP: 无查看结果'); await view.click(); await page.waitForTimeout(2500); const rebuild = page.getByRole('button', { name: '按此配置新建分析' }).or(page.getByRole('button', { name: '重新分析' })); if (!(await rebuild.count())) throw new Error('ALLOW_SKIP: 无重跑入口'); await rebuild.first().click(); await page.waitForTimeout(2000); await expect(page).toHaveURL(/workspace=key_link/)
- note: 既有结果在重跑期间仍可从诊断记录访问
  assert: |-
    await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); await expect(page.getByRole('button', { name: '查看结果' }).first()).toBeVisible({ timeout: 8000 })
allow_skip: 无重跑入口或无历史结果时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 用例「重新分析」现场落「按此配置新建分析」。
tier: B
