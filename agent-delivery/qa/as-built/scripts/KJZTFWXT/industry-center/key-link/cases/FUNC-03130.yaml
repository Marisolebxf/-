id: FUNC-03130
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03130
priority: P1
title: 异常-未选产业链
entry_id: chain-key-link
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进关键环节并选生物产业、生物医药与生命健康
expect:
  - note: 1、「所属产业链」为空
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = page.locator('main');
      const pickCascader = async (labels) => {
        const view = main.locator('.arco-cascader-view').first();
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        for (const label of labels) {
          const opt = page.locator('.arco-cascader-panel-column').last().locator('.arco-cascader-option').filter({ hasText: label }).first();
          await expect(opt).toBeVisible({ timeout: 8000 });
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
      };
      const leaf = page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
      if (!(await leaf.first().isVisible().catch(() => false))) {
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) await sub.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
      }
      await leaf.first().click({ timeout: 10000 });
      await page.waitForURL(/\/industry-center\/diagnosis.*workspace=key_link.*tab=key-link/, { timeout: 20000 });
      await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({ timeout: 12000 });
      await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(400);
      await pickCascader(['生物产业', '生物医药与生命健康']);
      const chainView = main.locator('.arco-select-view.industry-catalog-select').first();
      await expect(chainView).toBeVisible({ timeout: 8000 });
      const chainTxt = ((await chainView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      const empty = !chainTxt || /^请选择/.test(chainTxt) || chainTxt === '所属产业链';
      if (!empty) {
        throw new Error('所属产业链应为空，实际回显：「' + chainTxt + '」');
      }
  - note: 2、「开始分析」不可点击
    assert: |-
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.scrollIntoViewIfNeeded();
      await expect(start).toBeDisabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
