id: FUNC-03130
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03130
priority: P1
title: 异常-未选产业链
entry_id: chain-key-link
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: wait
    for: 分析配置就绪
    timeout_ms: 12000
  - action: evaluate
    note: 第一个下拉选「生物产业」
    assert: |-
      const main = page.locator('main');
      await expect(page.getByRole('heading', { name: '产业关键环节识别', level: 1 })).toBeVisible({ timeout: 15000 });
      const objectItem = main.locator('.diagnosis-config-identity .arco-form-item').filter({ hasText: '分析对象' }).first();
      await expect(objectItem).toBeVisible({ timeout: 10000 });
      const pickInObject = async (index, label) => {
        const cascaders = objectItem.locator('.arco-cascader-view');
        if ((await cascaders.count()) > index) {
          await cascaders.nth(index).click({ timeout: 8000 });
          await page.waitForTimeout(350);
          const opt = page.locator('.arco-cascader-panel-column').last().locator('.arco-cascader-option').filter({ hasText: label }).first();
          await expect(opt).toBeVisible({ timeout: 8000 });
          await opt.click({ timeout: 8000 });
        } else {
          const view = objectItem.locator('.arco-select-view').nth(index);
          await view.click({ timeout: 8000 });
          await page.waitForTimeout(350);
          const dropdown = page.locator('.arco-select-dropdown:visible').last();
          await dropdown.locator('.arco-select-option').filter({ hasText: label }).first().click({ timeout: 8000 });
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(450);
      };
      await pickInObject(0, '生物产业');
  - action: evaluate
    note: 第二个下拉选「生物医药与生命健康」
    assert: |-
      const main = page.locator('main');
      const objectItem = main.locator('.diagnosis-config-identity .arco-form-item').filter({ hasText: '分析对象' }).first();
      const pickInObject = async (index, label) => {
        const cascaders = objectItem.locator('.arco-cascader-view');
        if ((await cascaders.count()) > index) {
          await cascaders.nth(index).click({ timeout: 8000 });
          await page.waitForTimeout(350);
          const opt = page.locator('.arco-cascader-panel-column').last().locator('.arco-cascader-option').filter({ hasText: label }).first();
          await expect(opt).toBeVisible({ timeout: 8000 });
          await opt.click({ timeout: 8000 });
        } else {
          const view = objectItem.locator('.arco-select-view').nth(index);
          await view.click({ timeout: 8000 });
          await page.waitForTimeout(350);
          const dropdown = page.locator('.arco-select-dropdown:visible').last();
          await dropdown.locator('.arco-select-option').filter({ hasText: label }).first().click({ timeout: 8000 });
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(500);
      };
      await pickInObject(1, '生物医药与生命健康');
expect:
  - note: 1、「所属产业链」为空
    assert: |-
      const main = page.locator('main');
      const chainItem = main.locator('.arco-form-item').filter({ hasText: '所属产业链' });
      const chainView = chainItem.locator('.arco-select-view').first();
      await expect(chainView).toBeVisible({ timeout: 8000 });
      const chainTxt = ((await chainView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      const empty =
        !chainTxt ||
        /^请选择/.test(chainTxt) ||
        chainTxt === '所属产业链' ||
        /请选择所属产业链/.test(chainTxt);
      if (!empty) {
        throw new Error('所属产业链应为空，实际回显：「' + chainTxt + '」');
      }
  - note: 2、「开始分析」不可点击
    assert: |-
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.scrollIntoViewIfNeeded();
      await expect(start).toBeDisabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
