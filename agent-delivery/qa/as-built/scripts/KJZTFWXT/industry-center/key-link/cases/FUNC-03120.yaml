id: FUNC-03120
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03120
priority: P1
title: 报告页「返回分析结果」回到结果且任务号不变
story: US-CHAIN-DIAG-04
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开一条成功任务的产业关键环节识别报告
locators:
  view_report: button「查看报告」
  back_to_result: button「返回分析结果」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 成功结果→查看报告→点「返回分析结果」；预期在 expect
expect:
  - note: 前置：打开成功结果报告并记录任务号（用例步骤 1）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
      };
      const isKeyLinkResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t) || (await page.getByText('产业关键环节识别结果').first().isVisible().catch(() => false));
      };
      const openFromRecords = async () => {
        await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rows = page.locator('tr').filter({ hasText: '产业关键环节识别' }).filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 10); i++) {
          const view = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
          if (!(await view.count())) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isKeyLinkResult()) return true;
          }
        }
        return false;
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      await enterKeyLink();
      await assertNotSpa404('landing');
      if (!(await isKeyLinkResult())) {
        if (!(await openFromRecords())) {
          throw new Error('ENV-KEYLINK-NO-RESULT-001：诊断记录无已完成关键环节任务可打开结果');
        }
      }
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 20000 });
      const taskBefore = new URL(page.url()).searchParams.get('task_id') || '';
      const bodyBefore = await main().innerText().catch(() => '');
      const idFromBody =
        (bodyBefore.match(/任务 ID[：:]\s*(\S+)/) || [])[1] ||
        (bodyBefore.match(/任务[：:]\s*(\S+)/) || [])[1] ||
        taskBefore;
      const reportBtn = main().getByRole('button', { name: '查看报告' }).first();
      await expect(reportBtn).toBeVisible({ timeout: 8000 });
      await expect(reportBtn).toBeEnabled({ timeout: 8000 });
      await reportBtn.click({ timeout: 15000 });
      await page.waitForTimeout(800);
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      await expect(reader).toBeVisible({ timeout: 8000 });
      globalThis.__func03120 = { taskBefore: taskBefore || idFromBody, idFromBody };
  - note: 1、回到「产业关键环节识别结果」
    assert: |-
      const ctx = globalThis.__func03120;
      if (!ctx?.taskBefore && !ctx?.idFromBody) throw new Error('前置：未打开报告页');
      const main = () => page.locator('main').first();
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      const back = reader.locator('[data-report-back], button').filter({ hasText: '返回分析结果' }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
      await back.click({ timeout: 15000 });
      await page.waitForTimeout(900);
      for (let k = 0; k < 24; k++) {
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/产业关键环节识别结果/.test(body)) break;
        if (k === 23) {
          throw new Error('点击「返回分析结果」后未回到结果页，url=' + page.url() + ' body=' + body.slice(0, 320));
        }
        await page.waitForTimeout(500);
      }
      const readerGone = await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false);
      if (readerGone) {
        throw new Error('仍停留在只读报告壳，未离开 view=report');
      }
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 15000 });
      await expect(page).toHaveURL(/view=result/, { timeout: 20000 }).catch(() => {});
  - note: 2、任务号与该报告所属任务相同
    assert: |-
      const ctx = globalThis.__func03120;
      const expected = ctx?.taskBefore || ctx?.idFromBody;
      if (!expected) throw new Error('前置：未记录打开报告前任务编号');
      const urlTask = new URL(page.url()).searchParams.get('task_id') || '';
      const body = await page.locator('main').first().innerText().catch(() => '');
      const idLine =
        (body.match(/任务 ID[：:]\s*(\S+)/) || [])[1] ||
        (body.match(/任务[：:]\s*(\S+)/) || [])[1] ||
        urlTask;
      if (!idLine) throw new Error('回到结果页后未见任务编号，url=' + page.url());
      if (expected && idLine !== expected) {
        throw new Error('任务编号变化：打开报告前=' + expected + '，返回后=' + idLine);
      }
      if (urlTask && expected && urlTask !== expected) {
        throw new Error('URL task_id 与打开报告前不一致：' + urlTask + ' vs ' + expected);
      }
      await expect(page.getByText(idLine).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  用例=报告页点「返回分析结果」→「产业关键环节识别结果」+任务号与打开报告前一致（同 FUNC-02915 任务互证）。
  前置=诊断记录已完成「查看结果」→「查看报告」（同 FUNC-03109）；无记录 ENV-KEYLINK-NO-RESULT-001。
  路由 sibling /industry-center/search + catalog_path entry-seed；data-report-back + view=result。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
