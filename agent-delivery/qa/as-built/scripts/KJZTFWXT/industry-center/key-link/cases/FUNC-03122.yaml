id: FUNC-03122
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03122
priority: P1
tier: B
title: 备选-诊断记录
entry_id: chain-key-link
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=records
  - action: wait
    for: 诊断记录任务状态筛选就绪
    timeout_ms: 15000
expect:
  - note: 1、将「任务状态」选为「失败」（用例步骤 1）
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByRole('tab', { name: '诊断记录' })).toHaveAttribute('aria-selected', 'true');
      await expect(main.getByText('任务状态', { exact: false })).toBeVisible({ timeout: 10000 });
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      await page.keyboard.press('Escape').catch(() => {});
      const trigger = main.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const opt = page.locator(optSel).filter({ hasText: /^失败$/ }).first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      await opt.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await expect(trigger).toContainText('失败');
  - note: 1、列表中每条任务的状态都是「失败」
    assert: |-
      const main = page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const rows = main.locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
      const n = await rows.count();
      const bad = [];
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        if (!(await row.isVisible().catch(() => false))) continue;
        const rt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const id = (rt.match(TID_RE) || [])[0] || ('row' + i);
        if (/已完成|分析中|成功/.test(rt)) bad.push(id + ' 含非失败状态');
        else if (!/失败/.test(rt)) bad.push(id + ' 未见「失败」：' + rt.slice(0, 80));
      }
      if (bad.length) throw new Error('筛失败后行状态不符：' + bad.join('; '));
on_fail: 截图 + 抄 X-Trace-Id
