id: P1-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00593
priority: P1
title: 评审模式开启显示追溯与角标关闭后零泄漏
entry_id: chain-key-link
preconditions:
- 顶部人设面板内部评审模式开关可用
locators:
  persona: button.persona-switch
  review_switch: aria-label=内部评审模式
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: evaluate
  note: 开评审→关评审→刷新→检索泄漏字样
expect:
- note: 开启后三个追溯按钮可见可点
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.locator('button.persona-switch').click(); await page.waitForTimeout(400); const sw = page.locator('[aria-label="内部评审模式"]'); if ((await sw.getAttribute('aria-checked')) !== 'true') { await sw.click(); await page.waitForTimeout(400) }; await page.keyboard.press('Escape'); await page.waitForTimeout(300); await expect(page.locator('[aria-label="产业关键环节识别需求追溯"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('[aria-label="恢复诊断任务与结果需求追溯"]')).toBeVisible(); await expect(page.locator('[aria-label="分析对象上下文需求追溯"]')).toBeVisible()
- note: 治理角标与「指标说明」按钮评审态可见
  assert: |-
    await expect(page.locator('[aria-label*="GAP-CHAIN-DIAG-SEMANTICS"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('[aria-label^="指标说明"]').first()).toBeVisible()
- note: 关闭后页面无需求追溯按钮、无评审角标与指标说明字样泄漏
  assert: |-
    await page.locator('button.persona-switch').click(); await page.waitForTimeout(400); const sw = page.locator('[aria-label="内部评审模式"]'); if ((await sw.getAttribute('aria-checked')) === 'true') { await sw.click(); await page.waitForTimeout(400) }; await page.keyboard.press('Escape'); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(300) }; await expect(page.locator('[aria-label="产业关键环节识别需求追溯"]')).toHaveCount(0); await expect(page.locator('[aria-label*="GAP-CHAIN-DIAG"]')).toHaveCount(0); await expect(page.locator('[aria-label^="指标说明"]')).toHaveCount(0)
- note: 开关不改变分析对象、权重只读态、版本信息与页面操作
  assert: |-
    await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('新一代信息技术'); const spins = page.locator('[role=spinbutton]'); await expect(spins.nth(0)).toBeDisabled(); await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible()
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 默认常为评审开；结束后必须关评审（P3/P8）。系统浮层追溯不计入本页三按钮。
tier: B
