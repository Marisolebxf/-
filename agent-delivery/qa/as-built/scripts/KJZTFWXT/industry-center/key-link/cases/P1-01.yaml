id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00589
priority: P1
title: 结果支持按高端化指数升序降序切换
entry_id: chain-key-link
preconditions:
- 已打开关键环节识别成功结果
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: click
  target: 诊断记录→查看结果
expect:
- note: 切换后各环节按高端化指数升序排列
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('ALLOW_SKIP: 无查看结果'); await view.click(); await page.waitForTimeout(2500); const asc = page.getByRole('button', { name: /升序/ }).or(page.getByText('升序', { exact: true })); if (!(await asc.count())) throw new Error('ALLOW_SKIP: 现场无升序切换控件'); await asc.first().click(); await page.waitForTimeout(800)
- note: 切回后恢复降序排列
  assert: |-
    const desc = page.getByRole('button', { name: /降序/ }).or(page.getByText('降序', { exact: true })); if (!(await desc.count())) throw new Error('ALLOW_SKIP: 现场无降序切换控件'); await desc.first().click()
allow_skip: 现场无排序切换控件时 Pass-N/A（用例备注已允许）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 2026-10-14 结果态未见升序/降序控件 → 预期 allow_skip。
tier: B
