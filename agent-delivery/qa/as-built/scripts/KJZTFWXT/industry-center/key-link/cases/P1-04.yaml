id: P1-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00592
priority: P1
title: 诊断记录列出本工作空间历史任务且可过滤
entry_id: chain-key-link
preconditions:
- 已进入产业关键环节识别页
locators:
  tab: tab「诊断记录」
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=key_link&tab=key-link
- action: click
  target: 诊断记录
expect:
- note: 列表列出本工作空间历史任务且关键环节类型可辨识
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/diagnosis?workspace=key_link&tab=key-link', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1200); await expect(page).toHaveURL(/tab=records|view=records/); const t = await page.locator('main').innerText(); if (!/产业关键环节识别/.test(t) && !/暂无|空/.test(t)) throw new Error('诊断记录未见关键环节类型或空态'); if (/产业周期分析/.test(t) && !/产业关键环节识别/.test(t)) throw new Error('疑似仅混入周期类型')
- note: 过滤条件含对象、诊断类型、状态、时间
  assert: |-
    const t = await page.locator('main').innerText(); if (!/任务状态|全部状态|状态/.test(t)) throw new Error('未见状态过滤'); /* 对象/类型/时间过滤控件形态 observed */
- note: 无匹配记录时列表空态占位不报错
  assert: await expect(page.locator('main')).toBeVisible(); /* 有数据时列表渲染；空态不抛错即可 */
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘有 CHAIN-*-产业关键环节识别-已完成 多条；过滤细目 observed。
tier: B
