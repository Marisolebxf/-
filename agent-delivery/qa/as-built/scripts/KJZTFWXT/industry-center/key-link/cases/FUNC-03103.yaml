id: FUNC-03103
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03103
priority: P0
title: 结果页全链路五环节顺序与衔接
story: US-CHAIN-DIAG-04
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开一条产业关键环节识别成功结果
locators:
  full_chain_section: text「全链路环节结构化展示」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 打开成功结果后定位「全链路环节结构化展示」（判定在 expect）
expect:
  - note: 前置：已打开「产业关键环节识别结果」页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const body = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/抱歉，页面不存在/.test(body) || (/\b404\b/.test(body) && !/产业关键环节识别结果/.test(body))) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const gotoCatalog = async () => {
        await page.goto(toUrl('/industry-center/diagnosis?workspace=key_link&tab=key-link'), {
          waitUntil: 'domcontentloaded',
          timeout: 60000,
        });
        await page.waitForTimeout(1000);
        await assertNotSpa404('catalog-goto');
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget()) {
          await gotoCatalog();
          if (!onTarget()) {
            if (!/\/industry-center\/search/.test(page.url())) {
              await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(800);
            }
            await assertNotSpa404('search-sibling');
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            if (await leaf().first().isVisible().catch(() => false)) {
              await leaf().first().click({ timeout: 10000 });
              await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            } else {
              await gotoCatalog();
            }
            await assertNotSpa404('sidebar');
          }
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
      };
      const isKeyLinkResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t) || (await page.getByText('产业关键环节识别结果').first().isVisible().catch(() => false));
      };
      const openFromRecords = async () => {
        await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rows = page.locator('tr').filter({ hasText: '产业关键环节识别' }).filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 10); i++) {
          const view = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
          if (!(await view.count())) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isKeyLinkResult()) return true;
          }
        }
        return false;
      };
      await enterKeyLink();
      await assertNotSpa404('landing');
      if (!(await isKeyLinkResult())) {
        if (!(await openFromRecords())) {
          throw new Error('ENV-KEYLINK-NO-RESULT-001：诊断记录无已完成关键环节任务可打开结果');
        }
      }
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 20000 });
  - note: 1、定位「全链路环节结构化展示」可见
    assert: |-
      await expect(page.getByText('全链路环节结构化展示').first()).toBeVisible({ timeout: 10000 });
  - note: 2、从左到右为研发、设计、制造、销售、服务（五环节顺序）
    assert: |-
      const order = ['研发', '设计', '制造', '销售', '服务'];
      const xs = await page.evaluate((names) => {
        const pickNode = (name) => {
          const cands = [...document.querySelectorAll('main div')].filter((el) => {
            const t = (el.textContent || '').replace(/\s+/g, ' ').trim();
            if (!t.includes(name) || !/高端化/.test(t)) return false;
            const r = el.getBoundingClientRect();
            return r.width >= 70 && r.width <= 130 && r.height >= 70 && r.height <= 130;
          });
          cands.sort((a, b) => a.getBoundingClientRect().width - b.getBoundingClientRect().width);
          return cands[0] || null;
        };
        const out = [];
        for (const name of names) {
          const el = pickNode(name);
          if (!el) return { err: '缺环节节点 ' + name };
          out.push({ name, x: el.getBoundingClientRect().left });
        }
        for (let i = 1; i < out.length; i++) {
          if (out[i].x <= out[i - 1].x) return { err: '环节横向顺序错乱于 ' + out[i].name, xs: out };
        }
        return { ok: true, xs: out };
      }, order);
      if (xs.err) throw new Error(xs.err + (xs.xs ? ' ' + JSON.stringify(xs.xs) : ''));
  - note: 3、相邻环节之间标有「衔接」（四段）
    assert: |-
      const bridges = page.getByText('衔接', { exact: true });
      const n = await bridges.count();
      if (n < 4) {
        const t = await page.locator('main').innerText().catch(() => '');
        const m = (t.match(/衔接/g) || []).length;
        if (m < 4) throw new Error('相邻环节未见足够「衔接」标签，dom=' + n + ' text=' + m);
      }
      await expect(bridges.first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  用例步骤=定位「全链路环节结构化展示」；预期=五环节 LR 顺序 + 相邻「衔接」（G6 edge labelText，IndustryKeyLinkGraph.vue）。
  前置=诊断记录首条已完成「查看结果」；无记录抛 ENV-KEYLINK-NO-RESULT-001。edu 现场 /industry-center/search 与 diagnosis 深链均 SPA「抱歉，页面不存在」（同 FUNC-03102），assertNotSpa404 读 body 抛 ENV-EDU-TTS-SVCZ-404-001。路由 catalog_path entry-seed；登录关评审 runner 前置。B 档零 allow_skip。
