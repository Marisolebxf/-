id: FUNC-03103
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03103
priority: P0
tier: B
title: 结果页全链路五环节顺序与衔接
entry_id: chain-key-link
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=key_link&tab=key-link
  - action: evaluate
    note: 打开一条成功结果（同册 03113 / 03088；实际逻辑在 expect 首条）
expect:
  - note: 1、从左到右为研发、设计、制造、销售、服务
    assert: |-
      const main = () => page.locator('main').first();
      const isResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t);
      };
      if (!(await isResult())) {
        const openFromRecords = async () => {
          await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 10000 });
          await page.waitForTimeout(1200);
          const rows = page
            .locator('tr')
            .filter({ hasText: '产业关键环节识别' })
            .filter({ hasText: /已完成|成功/ });
          const n = await rows.count();
          for (let i = 0; i < Math.min(n, 12); i++) {
            const view = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
            if (!(await view.count())) continue;
            await view.click({ timeout: 12000, force: true });
            for (let j = 0; j < 30; j++) {
              await page.waitForTimeout(500);
              if (await isResult()) return true;
            }
          }
          return false;
        };
        if (!(await openFromRecords())) {
          await page.getByRole('tab', { name: '产业关键环节识别' }).first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
          const pickCascader = async (nth, optionText) => {
            const casc = main().locator('.arco-cascader-view').nth(nth);
            await casc.click({ timeout: 8000 });
            await page.waitForTimeout(400);
            const opt = page
              .locator('.arco-cascader-option-label, .arco-cascader-option')
              .filter({ hasText: optionText })
              .first();
            await opt.click({ timeout: 8000 });
            await page.waitForTimeout(500);
          };
          await pickCascader(0, '新能源');
          await pickCascader(1, '新能源');
          await main().locator('.arco-select-view').first().click({ timeout: 8000 });
          await page.locator('.arco-select-option').filter({ hasText: /^新能源$/ }).first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
          await main().getByRole('button', { name: '开始分析' }).click({ timeout: 12000 });
          for (let i = 0; i < 40; i++) {
            await page.waitForTimeout(500);
            if (await isResult()) break;
            const viewBtn = page.getByRole('button', { name: '查看分析结果' });
            if (await viewBtn.isVisible().catch(() => false)) {
              await viewBtn.click({ timeout: 8000 });
              break;
            }
          }
          for (let j = 0; j < 30; j++) {
            await page.waitForTimeout(500);
            if (await isResult()) break;
          }
        }
      }
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 20000 });
      await expect(page.getByText('全链路环节结构化展示').first()).toBeVisible({ timeout: 10000 });
      const order = ['研发', '设计', '制造', '销售', '服务'];
      const graph = page.locator('.diagnosis-key-link-graph').first();
      await expect(graph).toBeVisible({ timeout: 20000 });
      const text = ((await graph.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      let last = -1;
      for (const name of order) {
        const idx = text.indexOf(name);
        if (idx < 0) throw new Error('全链路区未见环节「' + name + '」');
        if (idx <= last) throw new Error('环节横向顺序错乱于「' + name + '」');
        last = idx;
      }
      for (const name of order) {
        await expect(graph.getByText(name, { exact: true }).first()).toBeVisible();
      }
  - note: 2、相邻环节之间标有「衔接」
    assert: |-
      const graphRoot = page.locator('.diagnosis-key-link-graph').first();
      await expect(graphRoot).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(2500);
      const domHits = await graphRoot.getByText('衔接', { exact: true }).count();
      if (domHits >= 4) return;
      throw new Error(
        'G6 edge labelText「衔接」不在 DOM（domHits=' +
          domHits +
          '），Playwright 无法稳定断言四段衔接标签',
      );
on_fail: 截图 + 抄 X-Trace-Id
