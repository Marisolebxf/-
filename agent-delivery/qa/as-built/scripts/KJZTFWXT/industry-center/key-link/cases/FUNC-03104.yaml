id: FUNC-03104
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03104
priority: P0
title: 结果页五环节高端化占位
story: US-CHAIN-DIAG-04
entry_id: chain-key-link
tier: B
preconditions:
  - 已打开一条产业关键环节识别成功结果
locators:
  stage_nodes: 全链路五环节圆点（研发/设计/制造/销售/服务）
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 定位五个环节圆点并核对「高端化 —」（判定在 expect）
expect:
  - note: 前置：已打开「产业关键环节识别结果」页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业关键环节识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业关键环节识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterKeyLink = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=key_link/.test(page.url()) &&
          /tab=key-link/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业关键环节识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await expect(leaf().first()).toBeVisible({ timeout: 10000 });
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          await assertNotSpa404('sidebar');
        }
        await expect(page).toHaveURL(/workspace=key_link/);
        await expect(page).toHaveURL(/tab=key-link/);
      };
      const isKeyLinkResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业关键环节识别结果/.test(t) || (await page.getByText('产业关键环节识别结果').first().isVisible().catch(() => false));
      };
      const openFromRecords = async () => {
        await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rows = page.locator('tr').filter({ hasText: '产业关键环节识别' }).filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 10); i++) {
          const view = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
          if (!(await view.count())) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isKeyLinkResult()) return true;
          }
        }
        return false;
      };
      await enterKeyLink();
      await assertNotSpa404('landing');
      if (!(await isKeyLinkResult())) {
        if (!(await openFromRecords())) {
          throw new Error('ENV-KEYLINK-NO-RESULT-001：诊断记录无已完成关键环节任务可打开结果');
        }
      }
      await expect(page.getByText('产业关键环节识别结果').first()).toBeVisible({ timeout: 20000 });
  - note: 1、五个环节均显示「高端化 —」（定位五个环节圆点）
    assert: |-
      const stages = ['研发', '设计', '制造', '销售', '服务'];
      const check = await page.evaluate((names) => {
        const pickNode = (name) => {
          const cands = [...document.querySelectorAll('main div')].filter((el) => {
            const t = (el.textContent || '').replace(/\s+/g, ' ').trim();
            if (!t.includes(name)) return false;
            const r = el.getBoundingClientRect();
            return r.width >= 70 && r.width <= 130 && r.height >= 70 && r.height <= 130;
          });
          cands.sort((a, b) => a.getBoundingClientRect().width - b.getBoundingClientRect().width);
          return cands[0] || null;
        };
        for (const name of names) {
          const el = pickNode(name);
          if (!el) return { err: '缺环节圆点 ' + name };
          const t = (el.textContent || '').replace(/\s+/g, ' ').trim();
          if (!/高端化\s*[—\-–]/.test(t)) {
            return { err: name + ' 圆点未显示「高端化 —」', text: t.slice(0, 80) };
          }
        }
        return { ok: true };
      }, stages);
      if (check.err) throw new Error(check.err + (check.text ? ' 片段=' + check.text : ''));
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const dashHits = (body.match(/高端化\s*[—\-–]/g) || []).length;
      if (dashHits < 5) {
        throw new Error('主区「高端化 —」占位不足 5 处，实际=' + dashHits);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  用例步骤=定位五个环节圆点；预期=研发/设计/制造/销售/服务 均显式「高端化 —」（scout-result 与 edu 现场诚实降级一致）。
  前置=诊断记录首条已完成「查看结果」；无记录抛 ENV-KEYLINK-NO-RESULT-001。路由 catalog_path entry-seed sibling 侧栏进入。登录关评审 runner 前置。B 档零 allow_skip。
