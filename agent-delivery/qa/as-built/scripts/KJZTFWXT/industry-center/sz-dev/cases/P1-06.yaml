id: P1-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00772
priority: P1
title: 分析记录 Tab 与发展分析 Tab 互斥切换且切回条件保持
entry_id: chain-sz-dev
preconditions:
- 已进入页面；已选中产业并勾选目标
locators:
  tab_dev: tab「深圳产业发展分析」
  tab_rec: tab「分析记录」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: click
  target: 分析记录再切回
expect:
- note: 记录区与配置区互斥呈现，不叠加
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.locator('main .arco-select-view').first().click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click(); await page.waitForTimeout(500); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(700); await expect(page.getByRole('tab', { name: '分析记录' })).toHaveAttribute('aria-selected', 'true'); await expect(page.getByText('任务状态').first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('main input[placeholder="请选择产业"]')).toHaveCount(0); await page.getByRole('tab', { name: '深圳产业发展分析' }).click(); await page.waitForTimeout(700); await expect(page.getByRole('tab', { name: '深圳产业发展分析' })).toHaveAttribute('aria-selected', 'true'); await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 })
- note: 切回后已选产业等配置条件保持
  assert: const ind = page.locator('main .arco-select-view').first(); await expect(ind).toContainText('新一代信息技术')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 记录区构成归 00773。
tier: B
