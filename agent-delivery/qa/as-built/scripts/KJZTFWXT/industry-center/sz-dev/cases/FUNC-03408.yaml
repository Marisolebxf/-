id: FUNC-03408
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03408
priority: P1
tier: B
title: 从已完成记录打开成功结果
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: click
    target: 「分析记录」
  - action: wait
    timeout_ms: 1500
  - action: click
    target: 「全部状态」
  - action: click
    target: 「已完成」
  - action: wait
    timeout_ms: 1500
  - action: click
    target: button 查看结果
expect:
  - note: 打开该任务的成功结果页
    assert: |-
      await expect(page.locator('main').getByText('深圳产业发展分析结果')).toBeVisible()
  - note: 页内有来源依据与发展路径
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('来源依据')).toBeVisible();
      await expect(main.getByText('发展路径')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
