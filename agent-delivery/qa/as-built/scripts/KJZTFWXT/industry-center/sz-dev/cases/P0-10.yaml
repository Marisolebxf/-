id: P0-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00763
priority: P0
title: 成功结果页顶部来源依据快照构成完整
entry_id: chain-sz-dev
preconditions:
- 已有一条成功的深圳产业发展分析结果
locators:
  tab_rec: tab「分析记录」
  view: button「查看结果」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: click
  target: 分析记录→查看结果
expect:
- note: 顶部呈现来源依据快照，含独特优势、差距、劣势三类摘要
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await view.count()) || await view.isDisabled()) throw new Error('SKIP: 无成功结果可查看（开放项 1）'); await view.click(); await page.waitForTimeout(2500); const t = await page.locator('main').innerText(); if (!/独特优势|差距|劣势|来源依据/.test(t)) throw new Error('未见来源依据三类摘要')
allow_skip: 无成功结果时 Pass-N/A（开放项 1）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 勘察无成功结果；按目标态编写。
tier: B
