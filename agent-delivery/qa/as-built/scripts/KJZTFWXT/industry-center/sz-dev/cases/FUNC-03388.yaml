id: FUNC-03388
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03388
priority: P0
title: 已完成记录打开成功结果页
entry_id: chain-sz-dev
tier: A
preconditions:
  - 已进入深圳产业发展分析页
  - 分析记录里有一条状态为「已完成」的记录
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 点击「分析记录」；在已完成记录上点「查看结果」
expect:
  - note: 页内出现标题「深圳产业发展分析结果」
    assert: |-
      const recTab = page.getByRole('tab', { name: '分析记录' });
      await expect(recTab).toBeVisible({ timeout: 10000 });
      await recTab.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const doneRow = page.locator('main tr').filter({ hasText: '已完成' }).filter({ hasText: '深圳产业发展分析' });
      await expect(doneRow.first()).toBeVisible({ timeout: 10000 });
      const viewBtn = doneRow.first().getByRole('button', { name: '查看结果' });
      await expect(viewBtn).toBeEnabled({ timeout: 5000 });
      await viewBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await expect(page.locator('main h3').filter({ hasText: '深圳产业发展分析结果' })).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
