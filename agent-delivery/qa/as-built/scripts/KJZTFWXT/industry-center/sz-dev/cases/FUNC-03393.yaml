id: FUNC-03393
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03393
priority: P1
tier: B
title: 取消一项发展目标后仍可以开始分析
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 同册03389：选择一个产业；选择一条未置灰的对比来源
  - action: evaluate
    note: 用例步骤：取消「技术」
expect:
  - note: 1、「技术」变为未选
    assert: |-
      const devRow = page.locator('[data-testid="shenzhen-development-context-row"]');
      await expect(devRow).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(2000);
      const selects = devRow.locator('.arco-select-view');
      await expect(selects.first()).toBeVisible({ timeout: 10000 });
      const indView = selects.nth(0);
      const indTxt = ((await indView.innerText().catch(() => '')) || '').trim();
      if (!indTxt || /请选择/.test(indTxt)) {
        await indView.click({ timeout: 15000, force: true });
        await page.waitForTimeout(600);
        const popup = page.locator('.arco-trigger-popup:visible');
        await expect(popup).toBeVisible({ timeout: 12000 });
        const indOpt = popup
          .locator('.arco-select-option:not(.arco-select-option-disabled)')
          .filter({ hasText: '新一代信息技术' });
        if ((await indOpt.count()) > 0) {
          await indOpt.first().click();
        } else {
          await popup.locator('.arco-select-option:not(.arco-select-option-disabled)').first().click();
        }
        await page.waitForTimeout(1000);
      }
      const sourceView = selects.nth(1);
      const sourceTxt = ((await sourceView.innerText().catch(() => '')) || '').trim();
      if (!sourceTxt || sourceTxt.includes('请显式选择')) {
        await sourceView.click({ timeout: 15000, force: true });
        await page.waitForTimeout(800);
        const opt = page
          .locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)')
          .filter({ hasNotText: 'PDF' });
        if ((await opt.count()) < 1) {
          throw new Error('BLOCKED: 绑定下拉无有效对比结果');
        }
        await opt.first().click();
        await page.waitForTimeout(1000);
      }
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 15000 });
      const tech = page.locator('main label.arco-checkbox').filter({ hasText: /^技术$/ }).first();
      await expect(tech).toBeVisible({ timeout: 8000 });
      const isChecked = async (el) => el.evaluate((e) => e.classList.contains('arco-checkbox-checked'));
      if (await isChecked(tech)) {
        await tech.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      }
      await expect(tech).not.toHaveClass(/arco-checkbox-checked/);
  - note: 2、「开始分析」仍可点击
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 10000 });
on_fail: 截图 + X-Trace-Id
