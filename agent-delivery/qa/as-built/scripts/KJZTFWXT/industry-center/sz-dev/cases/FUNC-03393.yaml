id: FUNC-03393
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03393
priority: P1
title: 取消一项发展目标后仍可以开始分析
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已选产业并绑定一条有效对比来源
  - 「开始分析」可点
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 选产业与有效对比来源，再取消「技术」
expect:
  - note: 前置：产业与有效绑定齐备后「开始分析」可点
    assert: |-
      const devRow = page.locator('[data-testid="shenzhen-development-context-row"]');
      await expect(devRow).toBeVisible({ timeout: 15000 });
      const indView = devRow.locator('.industry-catalog-select .arco-select-view').first();
      const indTxt = ((await indView.innerText().catch(() => '')) || '').trim();
      if (!indTxt || /请选择/.test(indTxt)) {
        await indView.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const indOpt = page
          .locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)')
          .first();
        await expect(indOpt).toBeVisible({ timeout: 10000 });
        await indOpt.click();
        await page.waitForTimeout(1000);
      }
      const sourceItem = devRow.locator('.arco-form-item').filter({ hasText: '有效的深圳产业情况分析对比结果' });
      const sourceView = sourceItem.locator('.arco-select-view').first();
      const sourceTxt = ((await sourceView.innerText().catch(() => '')) || '').trim();
      if (!sourceTxt || sourceTxt.includes('请显式选择')) {
        await sourceView.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const opt = page
          .locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)')
          .filter({ hasNotText: 'PDF' });
        if ((await opt.count()) < 1) throw new Error('ENV-CHAIN-SZ-DEV-NO-VALID-BIND: 绑定下拉无有效条目');
        await opt.first().click();
        await page.waitForTimeout(1000);
      }
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 15000 });
  - note: 1、「技术」变为未选
    assert: |-
      const tech = page.locator('main label.arco-checkbox').filter({ hasText: /^技术$/ }).first();
      await expect(tech).toBeVisible({ timeout: 8000 });
      const isChecked = async (el) => el.evaluate((e) => e.classList.contains('arco-checkbox-checked'));
      if (await isChecked(tech)) {
        await tech.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      }
      if (await isChecked(tech)) throw new Error('取消「技术」后仍为选中');
  - note: 2、「开始分析」仍可点击
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
