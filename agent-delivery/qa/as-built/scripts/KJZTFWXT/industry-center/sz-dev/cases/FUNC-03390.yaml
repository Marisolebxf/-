id: FUNC-03390
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03390
priority: P0
title: 分析对象下拉给出全部 15 个可选产业（附录A）
entry_id: chain-sz-dev
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 展开分析对象下拉
    assert: |-
      await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
      await page
        .waitForResponse((r) => r.url().includes('/catalog') && r.request().method() === 'GET' && r.ok(), {
          timeout: 25000,
        })
        .catch(() => {});
      const devRow = page.locator('main [data-testid="shenzhen-development-context-row"]');
      await expect(devRow).toBeVisible({ timeout: 20000 });
      const select = devRow.locator('.industry-catalog-select.arco-select').first();
      await expect(select).toBeVisible({ timeout: 10000 });
      const view = select.locator('.arco-select-view');
      await view.scrollIntoViewIfNeeded();
      await view.click({ timeout: 10000 });
      const input = view.locator('input');
      if (await input.count()) {
        await input.click({ timeout: 5000 });
        await input.press('ArrowDown');
      }
      const popup = page.locator('.arco-select-dropdown:not(.arco-select-dropdown-hidden), .arco-trigger-popup:visible').last();
      await expect(popup).toBeVisible({ timeout: 10000 });
expect:
  - note: 1、可选产业共 15 个，名称见附录A
    assert: |-
      const expected = [
        '新一代信息技术',
        '生物',
        '新能源',
        '新材料',
        '高端装备',
        '智能网联新能源汽车',
        '绿色环保',
        '低空经济与空天',
        '传统与创意',
        '海洋',
        '未来制造',
        '未来信息',
        '未来能源',
        '未来空间',
        '未来健康',
      ];
      const devRow = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const select = devRow.locator('.industry-catalog-select.arco-select').first();
      const view = select.locator('.arco-select-view');
      let popup = page.locator('.arco-select-dropdown:not(.arco-select-dropdown-hidden)').last();
      if (!(await popup.isVisible().catch(() => false))) {
        await view.click({ timeout: 10000 });
        const input = view.locator('input');
        if (await input.count()) {
          await input.click();
          await input.press('ArrowDown');
        }
        popup = page.locator('.arco-select-dropdown:not(.arco-select-dropdown-hidden), .arco-trigger-popup:visible').last();
      }
      await expect(popup).toBeVisible({ timeout: 10000 });
      const options = await popup.locator('.arco-select-option').allTextContents();
      const normalized = [...new Set(options.map((t) => t.trim().replace(/\s+/g, ' ')).filter(Boolean))];
      if (normalized.length !== 15) {
        throw new Error('分析对象产业选项应为 15 个，实际 ' + normalized.length + '：' + normalized.join('、'));
      }
      const missing = expected.filter((name) => !normalized.includes(name));
      const extra = normalized.filter((name) => !expected.includes(name));
      if (missing.length || extra.length) {
        throw new Error(
          '产业选项与附录 A 不一致；缺失：' + (missing.join('、') || '无') +
          '；多余：' + (extra.join('、') || '无') +
          '；现场：' + normalized.join('、')
        );
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id
