id: P0-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00766
priority: P0
title: 成功结果页发展路径至少两套且不足时诚实标注
entry_id: chain-sz-dev
preconditions:
- 已有一条成功的发展分析结果
locators:
  view: button「查看结果」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: click
  target: 分析记录→查看结果
expect:
- note: 发展路径至少两套，条目带「针对」标签与适用条件
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await view.count()) || await view.isDisabled()) throw new Error('SKIP: 无成功结果（开放项 1）'); await view.click(); await page.waitForTimeout(2500); const t = await page.locator('main').innerText(); if (!/发展路径|路径/.test(t)) throw new Error('未见发展路径区'); if (!t.includes('针对') && !/不完整|不足|暂无/.test(t)) throw new Error('路径条目未见「针对」且无不足标注')
- note: 可靠路径不足两套时标注不完整、不伪造路径
  assert: |-
    const t = await page.locator('main').innerText(); /* 有 ≥2 路径或诚实不足标注均可 */ if (/不完整|不足两套|暂无足够|无法提供/.test(t)) { /* 诚实标注 OK */ } else { const pathHits = (t.match(/路径\s*[一二三四五1-9]|方案\s*[一二三四五1-9]|第[一二三四五]套/g) || []).length; if (pathHits < 1 && !/发展路径/.test(t)) throw new Error('路径区空且无诚实标注') }
allow_skip: 无成功结果时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 不足两套边界需构造（开放项 2）。
tier: B
