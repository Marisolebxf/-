id: FUNC-03395
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03395
priority: P1
tier: B
title: 对比来源与产业不一致时分析失败且不打开成功结果
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 选「生物」→选与生物不一致的可点来源→「开始分析」→等待过程结束
expect:
  - note: 1、过程以失败结束并给出失败说明
    assert: |-
      const devRow = () => page.locator('[data-testid="shenzhen-development-context-row"]');
      const main = () => page.locator('main').first();
      const indView = () => devRow().locator('.arco-select-view').first();
      const bindView = () => devRow().locator('.arco-select-view').nth(1);
      const bindOptions = () =>
        page.locator('.arco-select-dropdown:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option');

      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 20000 });
      await expect(devRow()).toBeVisible({ timeout: 10000 });
      await page.waitForTimeout(1200);

      const pickIndustryBio = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const cur = ((await indView().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (cur.includes('生物')) return;
        const openInd = devRow().getByText('请选择产业');
        if (await openInd.isVisible().catch(() => false)) {
          await openInd.click({ timeout: 15000 });
        } else {
          await indView().click({ timeout: 15000 });
        }
        await page.waitForTimeout(400);
        const opt = page
          .locator('.arco-trigger-popup:visible .arco-select-option')
          .filter({ hasText: /^生物$/ })
          .first();
        await expect(opt).toBeVisible({ timeout: 10000 });
        await opt.click({ timeout: 10000 });
        await expect(indView()).toContainText('生物', { timeout: 8000 });
        await page.waitForTimeout(1200);
      };

      const pickMismatchedSource = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(250);
        const openBind = devRow().getByText('请显式选择有效结构化结果');
        if (await openBind.isVisible().catch(() => false)) {
          await openBind.click({ timeout: 15000 });
        } else {
          await bindView().click({ timeout: 15000 });
        }
        await page.waitForTimeout(700);
        await expect(bindOptions().first()).toBeVisible({ timeout: 15000 });
        const n = await bindOptions().count();
        for (let i = 0; i < n; i++) {
          const el = bindOptions().nth(i);
          const t = ((await el.innerText()) || '').replace(/\s+/g, ' ').trim();
          if (/无效|PDF|不可作为输入/.test(t)) continue;
          const disabled = await el.evaluate((e) => e.classList.contains('arco-select-option-disabled')).catch(() => false);
          if (disabled && !/产业不匹配/.test(t)) continue;
          if (/产业不匹配/.test(t) || !/生物/.test(t)) {
            await el.click({ timeout: 10000 });
            await page.waitForTimeout(600);
            return t;
          }
        }
        throw new Error('ENV-CHAIN-SZ-DEV-NO-MISMATCH-SOURCE-03395：生物下无可点的非生物对比来源');
      };

      const waitFailShell = async () => {
        let last = '';
        for (let i = 0; i < 120; i++) {
          await page.waitForTimeout(i < 6 ? 600 : 1200);
          last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const retry = page.getByRole('button', { name: '返回配置重试' }).first();
          if (await retry.isVisible().catch(() => false)) {
            if (/本次分析生成失败|任务状态：failed|分析失败|来源校验|失败/.test(last)) return last;
          }
          if (/深圳产业发展分析结果/.test(last) && !/生成中/.test(last)) {
            throw new Error('ENV-CHAIN-SZ-DEV-FAIL-03395：分析意外成功');
          }
        }
        throw new Error('ENV-CHAIN-SZ-DEV-NO-FAIL-PAGE-03395：超时未进入失败页，片段=' + last.slice(0, 240));
      };

      await pickIndustryBio();
      const sourceLabel = await pickMismatchedSource();
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 10000 });
      await start.scrollIntoViewIfNeeded();
      await start.click({ timeout: 15000 });
      globalThis.__func03395 = { started: true, sourceLabel, failBody: await waitFailShell() };
      await expect(page.getByRole('button', { name: '返回配置重试' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '查看分析记录' }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、不打开成功结果页
    assert: |-
      if (!globalThis.__func03395?.started) throw new Error('前置：未触发开始分析');
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toHaveCount(0);
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/深圳产业发展分析结果/.test(body) && !/生成中/.test(body)) {
        throw new Error('主区仍呈现成功结果标题');
      }
on_fail: 截图 + 抄 X-Trace-Id
