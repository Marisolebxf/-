id: FUNC-03416
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03416
priority: P0
title: 分析记录每页条数三档选项
story: US-CHAIN-SZ-05
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已打开「分析记录」（assert 自含进入与 Tab 切换）
locators:
  tab_rec: tab「分析记录」
  records_pagination: main 内 .arco-pagination
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 分析记录→展开每页条数；三档选项在 expect
expect:
  - note: 1、选项为 10 条/页、20 条/页、50 条/页，共 3 个
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=development&tab=development';
      const optSel = '.arco-select-dropdown:visible .arco-select-option, .arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业发展分析/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=development/.test(page.url()) &&
        /tab=development/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业发展分析$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const enterSzDev = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深圳产业发展分析深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=development/);
        await expect(page).toHaveURL(/tab=development/);
      };
      const recordsPagination = () => main().locator('.arco-pagination').first();
      const openPageSizeDropdown = async () => {
        const pag = recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const trigger = pag.locator('.arco-select-view').first();
        if (await trigger.count()) {
          await trigger.click({ timeout: 8000 });
        } else {
          const byText = pag.getByText(/\d+\s*条\/页/);
          if (!(await byText.count())) throw new Error('分析记录分页区未见每页条数控件');
          await byText.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(500);
      };
      await enterSzDev();
      const tab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      await expect(main().getByText('任务').first()).toBeVisible({ timeout: 8000 });
      await openPageSizeDropdown();
      const options = page.locator(optSel);
      await expect(options.first()).toBeVisible({ timeout: 8000 });
      const n = await options.count();
      const labels = [];
      for (let i = 0; i < n; i++) {
        labels.push(((await options.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim());
      }
      const normalized = labels.map((t) => t.replace(/\s/g, ''));
      const want = ['10条/页', '20条/页', '50条/页'];
      if (normalized.length !== 3) {
        throw new Error('每页条数选项应为 3 个，现场 ' + normalized.length + ' 个：' + labels.join(' | '));
      }
      for (const w of want) {
        if (!normalized.includes(w)) {
          throw new Error('缺少选项「' + w + '」，现场：' + labels.join('、'));
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03416=分析记录 Tab→展开每页条数→选项恰为 10/20/50 条/页共 3 项（不验翻页、不切换 pageSize）。
  catalog_path=entry-seed；导航对齐 FUNC-03411/03217。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
