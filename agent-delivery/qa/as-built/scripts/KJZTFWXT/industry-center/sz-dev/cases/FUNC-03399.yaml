id: FUNC-03399
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03399
priority: P0
tier: B
title: 主流程-结果态-完整对比抽屉区块标题
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 03388 经「分析记录」打开成功结果；1.点击「展开完整对比结果」
expect:
  - note: 1、抽屉标题为「来源对比结果（只读）」
    assert: |-
      const main = () => page.locator('main').first();
      const RESULT_TITLE = '深圳产业发展分析结果';
      const openSuccessFromRecords = async () => {
        const recordsTab = page.getByRole('tab', { name: '分析记录' }).first();
        await expect(recordsTab).toBeVisible({ timeout: 15000 });
        await recordsTab.click({ timeout: 10000 });
        await page.waitForTimeout(1000);
        await expect(recordsTab).toHaveAttribute('aria-selected', 'true');
        let rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '深圳产业发展分析' })
          .filter({ hasText: /已完成/ });
        let n = await rows.count();
        if (n < 1) {
          rows = main()
            .locator('tbody tr, .arco-table-tr')
            .filter({ hasText: '深圳产业发展分析' });
          n = await rows.count();
        }
        if (n < 1) {
          throw new Error('修订 blocked 分析记录无深圳产业发展分析任务');
        }
        let opened = false;
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const viewBtn = row.getByRole('button', { name: '查看结果' }).first();
          if (!(await viewBtn.count()) || (await viewBtn.isDisabled().catch(() => true))) continue;
          await viewBtn.click({ timeout: 15000, force: true });
          opened = true;
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) break;
          }
          if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) break;
          opened = false;
        }
        if (!opened) {
          throw new Error('修订 blocked 分析记录无已完成任务可点「查看结果」');
        }
        await expect(page.getByText(RESULT_TITLE).first()).toBeVisible({ timeout: 15000 });
      };
      await openSuccessFromRecords();
      const expandBtn = page.getByRole('button', { name: '展开完整对比结果' }).first();
      await expect(expandBtn).toBeVisible({ timeout: 10000 });
      await expandBtn.click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      await expect(drawer.getByText('来源对比结果（只读）').first()).toBeVisible({ timeout: 8000 });
      globalThis.__func03399 = { drawerReady: true };
  - note: 2、可见对比结果、对标研判、产业化潜力与发展阶段综合判断
    assert: |-
      if (!globalThis.__func03399?.drawerReady) throw new Error('前置：对比抽屉未打开');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('对比结果').first()).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('对标研判').first()).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('产业化潜力与发展阶段综合判断').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
