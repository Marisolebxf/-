id: P1-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00777
priority: P1
title: 刷新页面不自动带入最近一次对比结果
entry_id: chain-sz-dev
preconditions:
- 已进入页面；当前未绑定任何对比结果
locators:
  bind: select placeholder「请显式选择有效结构化结果」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: reload
- action: evaluate
  note: 回读绑定选择器
expect:
- note: 刷新后绑定选择器保持未绑定占位态，不自动带入最近一次对比结果
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb2 = page.locator('[aria-label="关闭对比篮"]'); if (await cb2.count() && await cb2.first().isVisible()) { await cb2.first().click(); await page.waitForTimeout(400) }; const ph = page.locator('main input[placeholder="请显式选择有效结构化结果"]'); await expect(ph).toBeVisible({ timeout: 8000 }); const bindTxt = (await page.locator('main .arco-select-view').nth(1).innerText()).trim(); if (/CHAIN-/.test(bindTxt)) throw new Error('刷新后静默继承绑定: ' + bindTxt)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: TRACE silent_inherit_latest_comparison=prohibited。
tier: B
