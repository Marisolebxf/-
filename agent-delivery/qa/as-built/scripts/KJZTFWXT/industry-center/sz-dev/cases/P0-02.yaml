id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00756
priority: P0
title: 分析对象产业下拉占位与选项加载正确
entry_id: chain-sz-dev
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 分析对象为初始未选态（脏会话已选产业时先再 goto；重置参数不清产业）
locators:
  industry: main .industry-catalog-select（placeholder「请选择产业」）
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 展开产业下拉并浏览选项
expect:
  - note: 未选产业时下拉呈引导占位提示「请选择产业」
    assert: |-
      await page.goto('http://111.198.38.90:50892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(() => false); if (v) { await closeB.first().click(); await page.waitForTimeout(400) } }; await page.goto('http://111.198.38.90:50892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); if (await closeB.count()) { const v2 = await closeB.first().isVisible().catch(() => false); if (v2) { await closeB.first().click(); await page.waitForTimeout(300) } }; const ind = page.locator('main .industry-catalog-select').filter({ has: page.locator('input[placeholder="请选择产业"]') }); await expect(ind.first()).toBeVisible({ timeout: 8000 }); const ph = await ind.locator('input').first().getAttribute('placeholder'); if (!ph || !ph.includes('请选择产业')) throw new Error('产业占位不符: ' + ph)
  - note: 下拉选项正常加载，含可选产业集群
    assert: |-
      const ind = page.locator('main .industry-catalog-select').filter({ has: page.locator('input[placeholder="请选择产业"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(500); const opts = page.locator('.arco-trigger-popup:visible .arco-select-option'); const n = await opts.count(); if (n < 10) throw new Error('产业选项过少: ' + n); await expect(opts.filter({ hasText: '新一代信息技术' }).first()).toBeVisible(); await expect(opts.filter({ hasText: '生物' }).first()).toBeVisible(); await page.keyboard.press('Escape')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 发展分析为**单级**产业 Select（class=industry-catalog-select，实勘 15 项）；对比册为集群+产业双级——勿混用。重置参数不清产业，须再 goto 回占位。切换回显归 00757。env-gate overall=partial（禁结果态；本条仅配置类）。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
