id: FUNC-03389
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03389
priority: P1
tier: B
title: 备选-操作区
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 选择一个产业；选择一条未置灰的对比来源；停留在配置页
    script: |-
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 15000 });
      const main = page.locator('main').first();
      const industryTrigger = main.locator('[data-testid="shenzhen-development-context-row"] .arco-cascader-view, [data-testid="shenzhen-development-context-row"] .arco-select-view').first();
      await industryTrigger.click({ timeout: 10000 });
      await page.waitForTimeout(400);
      const industryOpt = page.locator('.arco-trigger-popup:visible .arco-cascader-option, .arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first();
      await industryOpt.click({ timeout: 10000 });
      await page.waitForTimeout(700);
      const bindTrigger = main.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="请显式选择有效结构化结果"]') }).first();
      if (!(await bindTrigger.count())) {
        await main.getByPlaceholder('请显式选择有效结构化结果').click({ timeout: 10000 });
      } else {
        await bindTrigger.click({ timeout: 10000 });
      }
      await page.waitForTimeout(500);
      const enabled = page.locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)');
      const n = await enabled.count();
      if (n < 1) throw new Error('ENV-CHAIN-SZ-DEV-NO-VALID-BIND: 绑定下拉无未置灰条目');
      await enabled.first().click({ timeout: 10000 });
      await page.waitForTimeout(1200);
expect:
  - note: 1、页面仍是分析配置
    assert: |-
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toHaveCount(0);
      await expect(page).toHaveURL(/tab=development/, { timeout: 8000 });
  - note: 2、不出现「深圳产业发展分析生成中」
    assert: |-
      const url = page.url();
      if (/view=processing|demo_state=processing/.test(url)) {
        throw new Error('改条件后不应进入生成中 URL：' + url);
      }
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/深圳产业发展分析生成中/.test(body)) {
        throw new Error('不应自动出现「深圳产业发展分析生成中」');
      }
      if (/可视化分析过程/.test(body)) {
        throw new Error('不应自动进入可视化分析过程页');
      }
on_fail: 截图 + 抄 X-Trace-Id
