id: FUNC-03419
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03419
priority: P1
tier: B
title: 成功结果页展示叙述降级说明
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 同册03388：经「分析记录」打开成功结果；阅读结果页说明（前置与断言见 expect）
expect:
  - note: 前置：已打开一条成功结果（同册03388 步骤 1–2）
    assert: |-
      await page.locator('main').locator('.arco-tabs-nav-tab').filter({ hasText: '分析记录' }).click({ timeout: 10000 });
      await expect(page.locator('[data-frame-id="F-SZ-04"]')).toBeVisible({ timeout: 10000 });
      const main = page.locator('main').first();
      const statusSelect = main.locator('.diagnosis-records__filters .arco-select-view');
      await statusSelect.click({ timeout: 8000 });
      await page.getByRole('option', { name: '已完成' }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const successRow = main.locator('tbody tr').filter({ hasText: '深圳产业发展分析' }).filter({ hasText: '已完成' });
      if ((await successRow.count()) === 0) {
        throw new Error('修订 blocked：30892 分析记录筛选已完成后无成功记录');
      }
      const viewBtn = successRow.first().getByRole('button', { name: '查看结果' });
      await expect(viewBtn).toBeEnabled({ timeout: 8000 });
      await viewBtn.click({ timeout: 10000 });
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toBeVisible({ timeout: 15000 });
  - note: 1、页内有「叙述能力不可用，已按规则结果诚实降级。」
    assert: |-
      await expect(page.getByText('叙述能力不可用，已按规则结果诚实降级。').first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
