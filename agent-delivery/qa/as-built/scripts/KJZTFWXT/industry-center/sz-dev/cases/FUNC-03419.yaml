id: FUNC-03419
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03419
priority: P0
title: 成功结果页展示叙述降级说明
story: US-CHAIN-SZ-04
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已打开一条成功的深圳产业发展分析结果
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 经「分析记录」打开一条成功结果；阅读结果页说明（判定在 expect）
expect:
  - note: 前置：已进入「深圳产业发展分析结果」页
    assert: |-
      const recTab = page.getByRole('tab', { name: '分析记录' });
      await expect(recTab).toBeVisible({ timeout: 10000 });
      await recTab.click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const main = page.locator('main').first();
      const statusSelect = main.locator('.diagnosis-records__filters .arco-select-view');
      await statusSelect.click({ timeout: 8000 });
      await page.getByRole('option', { name: '已完成' }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const successRow = main.locator('tbody tr').filter({ hasText: '深圳产业发展分析' }).filter({ hasText: '已完成' });
      if (!(await successRow.count())) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 筛选已完成后无成功记录可打开');
      }
      const viewBtn = successRow.first().getByRole('button', { name: '查看结果' });
      if (await viewBtn.isDisabled()) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 已完成记录存在但「查看结果」仍为 disabled');
      }
      await viewBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toBeVisible({ timeout: 15000 });
  - note: 1、页内有「叙述能力不可用，已按规则结果诚实降级。」
    assert: |-
      const want = '叙述能力不可用，已按规则结果诚实降级。';
      await expect(page.getByText(want).first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
