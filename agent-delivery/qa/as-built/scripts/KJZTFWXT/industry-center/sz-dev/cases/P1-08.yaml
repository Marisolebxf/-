id: P1-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00774
priority: P1
title: 兄弟对比工作区与发展分析工作区互不串扰
entry_id: chain-sz-dev
preconditions:
- 已进入发展分析工作区；已选中产业并勾选目标
locators:
  tab_dev: tab「深圳产业发展分析」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: goto
  target: /industry-center/shenzhen?workspace=comparison&tab=comparison
- action: goto
  target: 切回 development
expect:
- note: 对比工作区呈现自身对比配置，无发展目标勾选与结果绑定控件
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=comparison&tab=comparison', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page).toHaveURL(/workspace=comparison/); await expect(page.getByRole('heading', { name: '深圳产业情况分析对比', level: 1 })).toBeVisible({ timeout: 8000 }); await expect(page.locator('input[placeholder*="Q016"]')).toBeVisible({ timeout: 8000 }); const t = await page.locator('main').innerText(); if (t.includes('发展目标') && t.includes('有效的深圳产业情况分析对比结果')) throw new Error('对比页仍呈发展分析绑定/目标控件'); if (await page.locator('input[placeholder="请显式选择有效结构化结果"]').count()) throw new Error('对比页出现发展绑定 placeholder')
- note: 切回后发展分析配置与已选条件恢复
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page).toHaveURL(/workspace=development/); await expect(page.getByRole('heading', { name: '深圳产业发展分析', level: 1 })).toBeVisible({ timeout: 8000 }); await expect(page.getByText('发展目标').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('有效的深圳产业情况分析对比结果').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 对比页正向归 chain-sz-compare；本条只核不互串。禁止对本条写对比正向功能断言。
tier: B
