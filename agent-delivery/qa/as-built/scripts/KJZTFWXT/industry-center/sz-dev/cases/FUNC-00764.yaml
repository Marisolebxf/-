id: FUNC-00764
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00764
priority: P0
title: 成功结果页完整对比以只读抽屉展开且关闭后不离开
entry_id: chain-sz-dev
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 经「分析记录」打开一条成功结果；点击「展开完整对比结果」
expect:
  - note: 完整对比以只读抽屉呈现，不可编辑
    assert: |-
      const recTab = page.getByRole('tab', { name: '分析记录' });
      await expect(recTab).toBeVisible({ timeout: 15000 });
      await recTab.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const statusSelect = page.locator('main .arco-select-view').first();
      await statusSelect.click({ timeout: 8000 });
      await page.locator('.arco-select-dropdown').getByText('已完成', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const empty = page.getByText('暂无数据');
      if (await empty.isVisible().catch(() => false)) {
        throw new Error('修订 blocked: 分析记录筛选已完成为空');
      }
      const viewBtn = page
        .locator('main')
        .getByRole('button', { name: '查看结果' })
        .filter({ hasNot: page.locator('.arco-btn-disabled') })
        .first();
      if (!(await viewBtn.count()) || (await viewBtn.isDisabled().catch(() => true))) {
        throw new Error('修订 blocked: 无可用「查看结果」打开成功结果');
      }
      await viewBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toBeVisible({ timeout: 20000 });
      const expandBtn = page.getByRole('button', { name: '展开完整对比结果' });
      await expect(expandBtn.first()).toBeVisible({ timeout: 10000 });
      await expandBtn.first().click({ timeout: 10000 });
      await page.waitForTimeout(600);
      await expect(page.getByText('来源对比结果（只读）')).toBeVisible({ timeout: 10000 });
      const drawer = page.locator('.arco-drawer:visible');
      await expect(drawer.first()).toBeVisible({ timeout: 10000 });
      const editable = drawer.locator(
        'input:not([readonly]):not([disabled]), textarea:not([readonly]):not([disabled])',
      );
      await expect(editable).toHaveCount(0);
  - note: 关闭抽屉后仍停留在发展结果页
    assert: |-
      const drawer = page.locator('.arco-drawer:visible');
      const closeBtn = drawer.locator('.arco-drawer-close-btn').first();
      await expect(closeBtn).toBeVisible({ timeout: 8000 });
      await closeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page.locator('.arco-drawer:visible')).toHaveCount(0, { timeout: 8000 });
      await expect(page).toHaveURL(/\/industry-center\/shenzhen/);
      await expect(page).toHaveURL(/workspace=development/);
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
