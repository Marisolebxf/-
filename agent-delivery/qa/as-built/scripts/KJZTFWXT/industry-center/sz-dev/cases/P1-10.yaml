id: P1-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00776
priority: P1
title: 关闭评审模式后全页零泄漏且业务态不变
entry_id: chain-sz-dev
preconditions:
- 评审模式为开启态
locators:
  review_toggle: switch aria-label「内部评审模式」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: evaluate
  note: 关评审；刷新；两 Tab 检索泄漏字样；回读业务态
expect:
- note: 关闭并刷新后两 Tab 无追溯控件、角标与评审字样泄漏
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const ps = page.locator('button.persona-switch'); if (!(await page.locator('.persona-menu').count())) { await ps.first().click({ timeout: 8000 }); await page.waitForTimeout(500) } const sw = page.locator(`.persona-menu button[role=switch][aria-label='内部评审模式']`).first(); await expect(sw).toBeVisible({ timeout: 8000 }); if ((await sw.getAttribute('aria-checked')) === 'true') { await sw.click(); await page.waitForTimeout(400) } await page.keyboard.press('Escape'); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page.locator('button[aria-label*="需求追溯"]')).toHaveCount(0); await expect(page.locator('button[aria-label*="GAP-"]')).toHaveCount(0); const txt = await page.locator('main').innerText(); for (const t of ['需求追溯', '系统分析任务交接', '指标未登记', '口径待甲方确认', 'metric_id', 'GAP-']) { if (txt.includes(t)) throw new Error('评审字样泄漏: ' + t) } await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(800); const t2 = await page.locator('main').innerText(); for (const w of ['需求追溯', '指标未登记', 'GAP-CHAIN']) { if (t2.includes(w)) throw new Error('记录 Tab 泄漏: ' + w) }
- note: 开关评审模式不改变产业、绑定、目标勾选与门禁业务态
  assert: |-
    await page.getByRole('tab', { name: '深圳产业发展分析' }).click(); await page.waitForTimeout(600); await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('发展目标').first()).toBeVisible(); await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible()
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 零泄漏词表见用例附录A。
tier: B
