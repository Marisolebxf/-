id: FUNC-03396
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03396
priority: P1
title: 失败页返回配置重试后回到分析配置且不自动开始
entry_id: chain-sz-dev
tier: B
preconditions:
  - 当前停在生成失败页（脚本自含：产业与绑定不一致触发失败）
locators:
  back_retry: button「返回配置重试」
  config_heading: heading「分析配置」level 2
  start: button「开始分析」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 构造生成失败页→点「返回配置重试」；配置与不自动开始在 expect
expect:
  - note: 前置：进入生成失败页并点击「返回配置重试」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=development&tab=development';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业发展分析/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=development/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业发展分析$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const ensureConfigPage = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
        }
        if (await bodyIs404() || !onTarget()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入深圳产业发展分析 ' + page.url());
        }
      };
      const ind = () => page.locator('main .industry-catalog-select').first();
      const bindView = () =>
        page
          .locator('main input[placeholder="请显式选择有效结构化结果"]')
          .locator('xpath=ancestor::div[contains(@class,"arco-select-view")]')
          .first();
      const pickIndustry = async (name) => {
        await ind().locator('.arco-select-view').first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: name }).first().click();
        await page.waitForTimeout(700);
      };
      const bindFirstEnabled = async () => {
        await bindView().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const en = page.locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)');
        if (!(await en.count())) throw new Error('ENV-CHAIN-SZ-DEV-NO-BIND-03396：无有效对比来源可选');
        await en.first().click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const isFailShell = async () => {
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const btn = page.getByRole('button', { name: '返回配置重试' }).first();
        const vis = await btn.isVisible().catch(() => false);
        return (
          vis &&
          (/本次分析生成失败|任务状态：failed|分析失败/.test(body) ||
            /深圳产业发展分析生成中/.test(body))
        );
      };
      const waitFailPage = async () => {
        let last = '';
        for (let i = 0; i < 120; i++) {
          await page.waitForTimeout(i < 6 ? 600 : 1200);
          last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (await isFailShell()) return last;
          if (/深圳产业发展分析结果/.test(last) && !/生成中/.test(last)) {
            throw new Error('ENV-CHAIN-SZ-DEV-FAIL-03396：分析意外成功，无法构造失败页');
          }
        }
        throw new Error('ENV-CHAIN-SZ-DEV-NO-FAIL-PAGE-03396：超时未进入生成失败页，片段=' + last.slice(0, 240));
      };
      const triggerMismatchFail = async () => {
        await ensureConfigPage();
        await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
        await pickIndustry('新一代信息技术');
        await bindFirstEnabled();
        await pickIndustry('生物');
        await page.waitForTimeout(500);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        if (await start.isEnabled().catch(() => false)) {
          await start.click({ timeout: 15000 });
          return await waitFailPage();
        }
        await pickIndustry('新能源');
        await page.waitForTimeout(400);
        if (await start.isEnabled().catch(() => false)) {
          await start.click({ timeout: 15000 });
          return await waitFailPage();
        }
        throw new Error('ENV-CHAIN-SZ-DEV-NO-FAIL-TRIGGER-03396：产业/绑定不一致仍无法点开始分析');
      };
      await triggerMismatchFail();
      const backRetry = page.getByRole('button', { name: '返回配置重试' }).first();
      await expect(backRetry).toBeVisible({ timeout: 8000 });
      await backRetry.click({ timeout: 15000 });
      await page.waitForTimeout(1200);
      globalThis.__func03396 = { clickedBack: true };
  - note: 1、打开分析配置
    assert: |-
      if (!globalThis.__func03396?.clickedBack) throw new Error('前置：未点击返回配置重试');
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('有效的深圳产业情况分析对比结果').first()).toBeVisible({ timeout: 8000 });
      await expect(page).toHaveURL(/tab=development/, { timeout: 8000 });
      const devTab = page.locator('[role=tab][data-tab-key="development"]').first();
      if (await devTab.count()) {
        await expect(devTab).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      } else {
        await expect(page.getByRole('tab', { name: '深圳产业发展分析' }).first()).toHaveAttribute('aria-selected', 'true');
      }
      if (await page.getByText('任务状态').first().isVisible().catch(() => false)) {
        throw new Error('返回后仍停留在分析记录筛选区，未打开分析配置');
      }
  - note: 2、不自动开始新的分析
    assert: |-
      if (!globalThis.__func03396?.clickedBack) throw new Error('前置：未点击返回配置重试');
      const url = page.url();
      if (/view=processing|demo_state=processing/.test(url)) {
        throw new Error('返回配置后不应停留在生成中 URL：' + url);
      }
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/深圳产业发展分析生成中|可视化分析过程/.test(body)) {
        throw new Error('返回配置后不应自动进入「深圳产业发展分析生成中」或过程页');
      }
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toHaveCount(0);
      await expect(page.getByRole('button', { name: '返回配置重试' })).toHaveCount(0);
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03396 用例=生成失败页 IndustryAnalysisProcessShell「返回配置重试」→ backToConfig 回发展 Tab 分析配置（现场产业/来源可能为空，不硬验回显）。
  前置自含：新一代信息技术+有效 CHAIN 绑定后改选生物/新能源再点开始，等 failed+「返回配置重试」。无绑定→ENV-CHAIN-SZ-DEV-NO-BIND-03396；无法触发→NO-FAIL-TRIGGER；超时→NO-FAIL-PAGE。
  catalog_path=entry-seed。edu SPA404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
