id: FUNC-03396
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03396
priority: P1
tier: B
title: 失败页返回配置重试后回到分析配置且不自动开始
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 03395 构造生成失败页→点击「返回配置重试」
    target: |-
      const main = () => page.locator('main').first();
      const devRow = () => main().locator('[data-testid="shenzhen-development-context-row"]');
      const noBind = () => {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-BIND-03396：无有效对比来源，无法构造生成失败页');
      };
      await main().getByRole('heading', { name: '分析配置' }).waitFor({ state: 'visible' });
      await devRow().locator('.arco-select-view').first().click();
      const industryOpt = page
        .locator('.arco-select-dropdown:visible .arco-select-option:not(.arco-select-option-disabled)')
        .filter({ hasText: '生物' })
        .first();
      if ((await industryOpt.count()) < 1) noBind();
      await industryOpt.click();
      await devRow().locator('.arco-select-view').nth(1).click();
      const dropdown = page.locator('.arco-select-dropdown:visible');
      await dropdown.waitFor({ state: 'visible', timeout: 10000 });
      const enabled = dropdown.locator('.arco-select-option:not(.arco-select-option-disabled)');
      const enabledCount = await enabled.count();
      if (enabledCount < 1) noBind();
      let onFailure = false;
      for (let i = 0; i < enabledCount && !onFailure; i += 1) {
        if (i > 0) {
          await devRow().locator('.arco-select-view').nth(1).click();
          await dropdown.waitFor({ state: 'visible' });
        }
        await enabled.nth(i).click();
        const startBtn = main().getByRole('button', { name: '开始分析' });
        if (!(await startBtn.isEnabled())) continue;
        await startBtn.click();
        const retryBtn = main().getByRole('button', { name: '返回配置重试' });
        try {
          await retryBtn.waitFor({ state: 'visible', timeout: 90000 });
          onFailure = true;
        } catch {
          onFailure = false;
        }
      }
      if (!onFailure) noBind();
      await main().getByRole('button', { name: '返回配置重试' }).click();
      await main().getByRole('heading', { name: '分析配置' }).waitFor({ state: 'visible' });
expect:
  - note: 1、打开分析配置
    assert: |-
      const main = () => page.locator('main').first();
      await expect(main().getByRole('heading', { name: '分析配置' })).toBeVisible();
      await expect(main().getByRole('button', { name: '开始分析' })).toBeVisible();
  - note: 2、不自动开始新的分析
    assert: |-
      const main = () => page.locator('main').first();
      await expect(main().getByText('深圳产业发展分析生成中')).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
