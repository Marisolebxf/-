id: FUNC-03401
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03401
priority: P1
tier: B
title: 从报告返回深圳产业发展分析结果页
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 前置打开报告（同册 03411）；用例步骤 1 点「返回分析结果」
expect:
  - note: 1、回到「深圳产业发展分析结果」页
    assert: |-
      const main = () => page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 15000 });
      await expect(main().getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(1200);
      const rows = main().locator('.arco-table-body .arco-table-tr').filter({ hasText: '深圳产业发展分析' }).filter({ hasText: /已完成|成功/ });
      const n = await rows.count();
      if (n < 1) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 分析记录无已完成任务，无法打开报告');
      }
      let opened = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
        if (!(await reportBtn.count()) || (await reportBtn.isDisabled().catch(() => true))) continue;
        await reportBtn.click({ timeout: 15000, force: true });
        opened = true;
        for (let j = 0; j < 28; j++) {
          await page.waitForTimeout(500);
          if (/view=report/.test(page.url()) && (await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false))) break;
        }
        if (/view=report/.test(page.url())) break;
        opened = false;
      }
      if (!opened) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 无已完成任务可打开报告');
      }
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      await expect(page.getByRole('button', { name: '返回分析结果' })).toBeVisible({ timeout: 15000 });
      await page.getByRole('button', { name: '返回分析结果' }).click({ timeout: 15000 });
      await page.waitForTimeout(800);
      await expect(main().getByRole('heading', { name: '深圳产业发展分析结果', level: 2 })).toBeVisible({ timeout: 25000 });
on_fail: 截图 + 抄 X-Trace-Id
