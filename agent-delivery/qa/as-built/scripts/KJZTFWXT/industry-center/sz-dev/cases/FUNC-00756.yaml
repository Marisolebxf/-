id: FUNC-00756
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00756
priority: P0
title: 分析对象产业下拉未选态占位提示与选项加载正确
entry_id: chain-sz-dev
tier: A
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 展开分析对象产业下拉并浏览选项
    script: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const sel = row.locator('.industry-catalog-select');
      await sel.waitFor({ state: 'visible', timeout: 10000 });
      await sel.locator('.arco-select-view-single, .arco-select-view').first().click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const opts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      await opts.first().waitFor({ state: 'visible', timeout: 10000 });
expect:
  - note: 未选产业时下拉呈引导占位提示「请选择产业」
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const ph = row.locator('.industry-catalog-select .arco-select-view input, .industry-catalog-select input').first();
      await expect(ph).toHaveAttribute('placeholder', /请选择产业/);
  - note: 下拉选项正常加载，含可选产业集群
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const sel = row.locator('.industry-catalog-select');
      let opts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      if ((await opts.count()) < 2) {
        await sel.locator('.arco-select-view-single, .arco-select-view').first().click({ timeout: 10000 });
        await page.waitForTimeout(600);
        opts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      }
      const n = await opts.count();
      if (n < 2) throw new Error('产业选项未加载或过少: ' + n);
      await expect(opts.filter({ hasText: '新一代信息技术' }).first()).toBeVisible({ timeout: 8000 });
      await expect(opts.filter({ hasText: '生物' }).first()).toBeVisible({ timeout: 8000 });
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id
