id: FUNC-00756
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00756
priority: P0
title: 分析对象产业下拉未选态占位提示与选项加载正确
entry_id: chain-sz-dev
tier: A
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 已选时先重置（同册03394）
    script: |-
      await page.getByRole('button', { name: '重置参数' }).click();
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const industrySelect = row.locator('.arco-select').first();
      const clear = industrySelect.locator('.arco-icon-hover, .arco-select-clear-icon');
      if (await clear.count()) {
        await clear.first().click();
      }
expect:
  - note: 未选产业时下拉呈引导占位提示「请选择产业」
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const industrySelect = row.locator('.arco-select').first();
      await expect(industrySelect).toContainText('请选择产业', { timeout: 15000 });
  - note: 下拉选项正常加载，含可选产业集群
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const industrySelect = row.locator('.arco-select').first();
      await industrySelect.locator('.arco-select-view').click({ timeout: 15000 });
      const opts = page.locator('.arco-select-dropdown:visible .arco-select-option');
      await expect(opts.first()).toBeVisible({ timeout: 15000 });
      const n = await opts.count();
      if (n < 2) throw new Error('产业选项未加载或过少: ' + n);
      await expect(opts.filter({ hasText: '新一代信息技术' }).first()).toBeVisible({ timeout: 8000 });
      await expect(opts.filter({ hasText: '生物' }).first()).toBeVisible({ timeout: 8000 });
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id
