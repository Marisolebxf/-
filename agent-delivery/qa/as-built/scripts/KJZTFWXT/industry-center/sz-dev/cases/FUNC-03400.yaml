id: FUNC-03400
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03400
priority: P0
tier: B
title: 成功结果页点击查看报告后展示报告标题与七节目录
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 前置：经分析记录在已完成任务上打开成功结果（同册 03388）；1.点击「查看报告」
expect:
  - note: 1、标题为「深圳产业发展分析报告」
    assert: |-
      const main = () => page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 15000 });
      await expect(main().getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(1200);
      const rows = main().locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 15000 }).catch(() => {});
      const count = await rows.count();
      let opened = false;
      for (let i = 0; i < count; i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/已完成/.test(rowText)) continue;
        const btn = row.getByRole('button', { name: '查看结果' }).first();
        if (await btn.isEnabled().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          opened = true;
          break;
        }
      }
      if (!opened) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK：分析记录仅失败任务或无已完成可点查看结果');
      }
      await expect(main().getByRole('heading', { name: '深圳产业发展分析结果', level: 2 })).toBeVisible({ timeout: 25000 });
      const reportBtn = main().getByRole('button', { name: '查看报告' }).first();
      await expect(reportBtn).toBeEnabled({ timeout: 15000 });
      await reportBtn.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      await expect(main().getByRole('heading', { name: '深圳产业发展分析报告', level: 2 })).toBeVisible({ timeout: 25000 });
  - note: 2、目录共 7 节，名称见附录A
    assert: |-
      const main = () => page.locator('main').first();
      const sections = ['报告身份', '执行摘要', '对象与范围', '关键发现', '证据与分析', '数据来源与生成说明', '局限性与使用边界'];
      for (const name of sections) {
        await expect(main().getByText(name, { exact: true }).first()).toBeVisible({ timeout: 15000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
