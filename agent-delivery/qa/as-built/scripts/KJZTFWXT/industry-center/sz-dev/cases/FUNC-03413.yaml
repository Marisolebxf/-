id: FUNC-03413
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03413
priority: P1
tier: B
title: 异常-已完成记录下载报告
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 同册03408 打开分析记录；用例步骤 1 在该条上点击「下载报告」
expect:
  - note: 1、得到报告文件，或出现失败提示
    assert: |-
      const main = page.locator('main');
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 12000 });
      await expect(main.getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 15000 });
      const statusSelect = main.locator('.diagnosis-records__filters .arco-select-view').first();
      await statusSelect.click({ timeout: 8000 });
      await page.waitForTimeout(350);
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      await page.locator(optSel).filter({ hasText: '已完成' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const row = main.locator('tbody tr').filter({ hasText: '已完成' }).first();
      await expect(row).toBeVisible({ timeout: 15000 });
      const downloadBtn = row.getByRole('button', { name: '下载报告' });
      await expect(downloadBtn).toBeEnabled({ timeout: 8000 });
      const downloadPromise = page.waitForEvent('download', { timeout: 10000 }).catch(() => null);
      await downloadBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const download = await downloadPromise;
      const msg = page.locator('.arco-message:visible');
      const hasMsg = await msg.filter({ hasText: /下载|失败|报告|错误/ }).first().isVisible({ timeout: 4000 }).catch(() => false);
      const hasMainFail = await main.getByText(/下载失败|报告.*失败|失败提示/).first().isVisible({ timeout: 2000 }).catch(() => false);
      expect(download !== null || hasMsg || hasMainFail).toBeTruthy();
  - note: 2、该记录状态仍为已完成
    assert: |-
      const main = page.locator('main');
      const row = main.locator('tbody tr').filter({ hasText: '已完成' }).first();
      await expect(row).toBeVisible({ timeout: 10000 });
      await expect(row.getByText('已完成')).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
