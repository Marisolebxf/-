id: FUNC-03410
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03410
priority: P0
title: 分析记录「复制配置」回显产业与对比来源
story: US-CHAIN-SZ-05
entry_id: chain-sz-dev
tier: B
preconditions:
  - 分析记录中至少有一条深圳产业发展分析任务
locators:
  tab_rec: tab「分析记录」
  copy_config: button「复制配置」
  start: button「开始分析」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 分析记录对任一条发展分析点「复制配置」；配置回显与不自动开始在 expect
expect:
  - note: 1、回到分析配置并回显该条产业与对比来源
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=development&tab=development';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业发展分析/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=development/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业发展分析$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const readIndustry = async () => {
        const view = page.locator('.arco-select-view[aria-label="产业"]').first();
        if (await view.count()) {
          return ((await view.getAttribute('title')) || (await view.innerText()) || '').replace(/\s+/g, ' ').trim();
        }
        const ph = page.locator('main input[placeholder="请选择产业"]').first();
        const viaPh = ph.locator('xpath=ancestor::div[contains(@class,"arco-select-view")]').first();
        return ((await viaPh.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      };
      const readBind = async () => {
        const bindInp = page.locator('main input[placeholder="请显式选择有效结构化结果"]');
        if (!(await bindInp.count())) return '';
        const bindView = bindInp.locator('xpath=ancestor::div[contains(@class,"arco-select-view")]').first();
        return ((await bindView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      };
      await dismissBasket();
      if (!onTarget() || (await bodyIs404())) {
        await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
      }
      if (!onTarget() || (await bodyIs404())) {
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (!(await bodyIs404())) await enterViaSidebar();
      }
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏均 SPA404，无法执行 03410 ' + page.url());
      }
      await expect(page).toHaveURL(/workspace=development/);
      const recTab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(recTab).toBeVisible({ timeout: 10000 });
      await recTab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(recTab).toHaveAttribute('aria-selected', 'true');
      const rows = main()
        .locator('tbody tr, .arco-table-tr')
        .filter({ hasText: '深圳产业发展分析' });
      const n = await rows.count();
      if (n < 1) {
        const bodyTxt = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/暂无数据/.test(bodyTxt)) {
          throw new Error('ENV-CHAIN-SZ-DEV-NO-RECORD-03410：分析记录空态，无发展分析任务可复制');
        }
        throw new Error('ENV-CHAIN-SZ-DEV-NO-RECORD-03410：未见深圳产业发展分析记录行');
      }
      let copied = false;
      for (let i = 0; i < Math.min(n, 16); i++) {
        const row = rows.nth(i);
        const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
        if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
        await copyBtn.click({ timeout: 15000 });
        copied = true;
        break;
      }
      if (!copied) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-COPY-03410：有记录行但「复制配置」均不可用（可能未保留可写回配置）');
      }
      await page.waitForTimeout(900);
      const devTab = page.locator('[role=tab][data-tab-key="development"]').first();
      if (await devTab.count()) {
        await expect(devTab).toHaveAttribute('aria-selected', 'true', { timeout: 12000 });
      } else {
        await expect(page.getByRole('tab', { name: '深圳产业发展分析' }).first()).toHaveAttribute('aria-selected', 'true');
      }
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      if (await page.getByText('任务状态').first().isVisible().catch(() => false)) {
        throw new Error('复制配置后仍见分析记录筛选，未回到发展分析配置区');
      }
      const industry = await readIndustry();
      const bindTxt = await readBind();
      globalThis.__func03410 = { industry, bindTxt };
  - note: 2、产业与对比来源已回显（非占位）
    assert: |-
      const snap = globalThis.__func03410;
      if (!snap) throw new Error('前置：未完成复制配置');
      const industry = (snap.industry || '').replace(/\s+/g, ' ').trim();
      if (!industry || /请选择产业|未选/.test(industry)) {
        throw new Error('产业未回显，现场=' + industry);
      }
      const bindTxt = (snap.bindTxt || '').replace(/\s+/g, ' ').trim();
      if (!bindTxt || /请显式选择有效结构化结果/.test(bindTxt)) {
        throw new Error('对比来源未回显，现场=' + bindTxt);
      }
      if (!/CHAIN-/.test(bindTxt)) {
        throw new Error('对比来源应含有效 CHAIN 绑定，现场=' + bindTxt);
      }
      await expect(page.getByText('有效的深圳产业情况分析对比结果').first()).toBeVisible({ timeout: 8000 });
  - note: 3、不自动开始分析
    assert: |-
      const url = page.url();
      if (/view=processing|demo_state=processing/.test(url)) {
        throw new Error('复制后不应进入生成中 URL：' + url);
      }
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/深圳产业发展分析生成中|可视化分析过程/.test(body)) {
        throw new Error('复制后不应自动进入生成过程页');
      }
      await expect(page).toHaveURL(/tab=development/, { timeout: 8000 });
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toHaveCount(0);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=entry-seed /industry-center/shenzhen?workspace=development&tab=development；用例=分析记录任一条（已完成/失败均可）「复制配置」→
  发展 Tab 分析配置区产业+有效对比来源(CHAIN)回显且非生成中/非结果页（copyHistoryConfig + patchQuery tab=development）。
  无记录/复制 disabled→ENV-CHAIN-SZ-DEV-NO-RECORD-03410 / NO-COPY-03410。edu SPA404→ENV-EDU-TTS-SVCZ-404-001。结果页「按此配置新建分析」见 03417。B 档零 allow_skip。
