id: FUNC-03417
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03417
priority: P1
tier: B
title: 结果页按此配置新建分析回到配置且不自动开始
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 1.点击「分析记录」；2.在已完成记录上点击「查看结果」
  - action: evaluate
    note: 1.点击「按此配置新建分析」
expect:
  - note: 1、回到分析配置并带回该次产业与对比来源
    assert: |-
      const main = () => page.locator('main').first();
      const RESULT_TITLE = '深圳产业发展分析结果';
      await page.waitForTimeout(600);
      const recTab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(recTab).toBeVisible({ timeout: 10000 });
      await recTab.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const filt = main().locator('.diagnosis-records__filters .arco-select-view').first();
      if (await filt.count()) {
        await filt.click({ timeout: 5000 });
        const doneOpt = page.locator('.arco-select-option').filter({ hasText: /^已完成$/ }).first();
        if (await doneOpt.count()) {
          await doneOpt.click({ timeout: 5000 });
          await page.waitForTimeout(1000);
        }
      }
      const viewBtn = main().getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('[disabled]') });
      if (!(await viewBtn.count())) {
        throw new Error('修订 blocked：分析记录无已完成可点「查看结果」，无法打开成功结果');
      }
      await viewBtn.first().click({ timeout: 10000 });
      await page.waitForTimeout(800);
      await expect(page.getByRole('heading', { name: RESULT_TITLE })).toBeVisible({ timeout: 15000 });
      const resultBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const readIndustry = async () => {
        const ph = main().locator('input[placeholder="请选择产业"]').first();
        if (await ph.count()) {
          const view = ph.locator('xpath=ancestor::div[contains(@class,"arco-select-view")]').first();
          return ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        }
        return ((await main().locator('.arco-select-view').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      };
      const readBind = async () => {
        const bindInp = main().locator('input[placeholder="请显式选择有效结构化结果"]');
        if (!(await bindInp.count())) return '';
        const bindView = bindInp.locator('xpath=ancestor::div[contains(@class,"arco-select-view")]').first();
        return ((await bindView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      };
      globalThis.__func03417 = {
        resultSnippet: resultBody.slice(0, 400),
        industryBefore: await readIndustry(),
        bindBefore: await readBind(),
      };
      const rebuild = main().getByRole('button', { name: '按此配置新建分析', exact: true }).first();
      await expect(rebuild).toBeVisible({ timeout: 10000 });
      await rebuild.click({ timeout: 15000 });
      await page.waitForTimeout(900);
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      await expect(page.getByRole('heading', { name: RESULT_TITLE })).toHaveCount(0);
      globalThis.__func03417.industryAfter = await readIndustry();
      globalThis.__func03417.bindAfter = await readBind();
  - note: 2、不自动开始分析
    assert: |-
      const snap = globalThis.__func03417;
      if (!snap) throw new Error('修订 blocked：未完成前置打开结果与点击新建');
      const industry = (snap.industryAfter || '').replace(/\s+/g, ' ').trim();
      if (!industry || /请选择产业|未选产业/.test(industry)) {
        throw new Error('修订 blocked：产业未回显，现场=' + industry);
      }
      const bindTxt = (snap.bindAfter || '').replace(/\s+/g, ' ').trim();
      if (!bindTxt || /请显式选择有效结构化结果/.test(bindTxt)) {
        throw new Error('修订 blocked：对比来源未回显，现场=' + bindTxt);
      }
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/深圳产业发展分析生成中|可视化分析过程/.test(body)) {
        throw new Error('修订 fail：不应自动进入生成过程页');
      }
      await expect(page).toHaveURL(/tab=development/, { timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
