id: FUNC-03398
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03398
priority: P0
tier: B
title: 成功结果页对象行回显分析对象与任务编号
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 经分析记录打开一条成功结果（同册 03388）
expect:
  - note: 打开该条成功结果
    assert: |-
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      const records = main.locator('.diagnosis-records');
      await expect(records).toBeVisible({ timeout: 15000 });
      const resetBtn = records.getByRole('button', { name: '重置筛选' });
      if (await resetBtn.isVisible().catch(() => false)) {
        await resetBtn.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      }
      await page.waitForTimeout(600);
      const viewBtn = records
        .locator('tbody tr')
        .filter({ hasText: '已完成' })
        .getByRole('button', { name: '查看结果' })
        .filter({ enabled: true })
        .first();
      if (!(await viewBtn.count())) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 分析记录无已完成且可查看结果的发展分析');
      }
      const row = viewBtn.locator('xpath=ancestor::tr[1]');
      const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const taskFromRow = (rowText.match(TID_RE) || [])[0] || '';
      await viewBtn.click({ timeout: 10000 });
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toBeVisible({ timeout: 20000 });
      globalThis.__func03398 = { taskFromRow };
  - note: 1、对象行同时给出分析对象与任务编号
    assert: |-
      const ctx = globalThis.__func03398;
      if (!ctx) throw new Error('前置：未打开成功结果页');
      const main = page.locator('main').first();
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const lineMatch = body.match(/对象[：:]\s*([^·\n]+?)\s*·\s*任务\s+(CHAIN-\d{8}-\d{3})/);
      if (!lineMatch) {
        throw new Error('结果页未见对象行「对象：… · 任务 CHAIN-*」：' + body.slice(0, 400));
      }
      const objectName = (lineMatch[1] || '').replace(/\s+/g, ' ').trim();
      const taskId = lineMatch[2] || '';
      const badObject = ['', '—', '-', '未选产业', '未选', '尚未选择', '暂无'];
      if (!objectName || badObject.includes(objectName)) {
        throw new Error('对象行分析对象为空或占位：「' + objectName + '」');
      }
      if (!/CHAIN-\d{8}-\d{3}/.test(taskId)) {
        throw new Error('对象行任务编号无效：' + taskId);
      }
      if (ctx.taskFromRow && ctx.taskFromRow !== taskId) {
        throw new Error('对象行任务编号与所点记录不一致：行=' + taskId + ' 记录=' + ctx.taskFromRow);
      }
      await expect(main.getByText(/对象[：:].*·\s*任务\s+CHAIN-\d{8}-\d{3}/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
