id: FUNC-03398
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03398
priority: P0
title: 成功结果页对象行回显分析对象与任务编号
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已有一条成功结果
locators:
  tab_rec: tab「分析记录」
  view_result: button「查看结果」（已完成行、非 disabled）
  object_row: 结果 SectionPanel 下「对象：… · 任务 …」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 打开一条成功结果；对象行与任务编号在 expect
expect:
  - note: 前置：经分析记录打开成功结果页（步骤 1）
    assert: |-
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = page.locator('main').first();
      const recTab = page.getByRole('tab', { name: '分析记录' });
      if (await recTab.count()) {
        await recTab.click({ timeout: 10000 });
        await page.waitForTimeout(600);
      }
      const records = main.locator('.diagnosis-records');
      await expect(records).toBeVisible({ timeout: 15000 });
      const statusSelect = records.locator('.diagnosis-records__filters .arco-select-view').first();
      await statusSelect.click({ timeout: 8000 });
      await page.locator('.arco-select-dropdown').getByText('已完成', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const tableText = ((await records.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/暂无数据|没有数据/.test(tableText)) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 分析记录无已完成成功结果');
      }
      const viewBtn = records
        .locator('tbody tr')
        .filter({ hasText: '深圳产业发展分析' })
        .getByRole('button', { name: '查看结果' })
        .filter({ enabled: true })
        .first();
      if (!(await viewBtn.count())) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 无可点的已完成「查看结果」');
      }
      let row = viewBtn.locator('xpath=ancestor::tr[1]');
      const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const taskFromRow = (rowText.match(TID_RE) || [])[0] || '';
      await viewBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toBeVisible({ timeout: 15000 });
      globalThis.__func03398 = { taskFromRow, url: page.url() };
  - note: 1、对象行同时给出分析对象与任务编号
    assert: |-
      const ctx = globalThis.__func03398;
      if (!ctx) throw new Error('前置：未打开成功结果页');
      const main = page.locator('main').first();
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const lineMatch = body.match(/对象[：:]\s*([^·\n]+?)\s*·\s*任务\s+(CHAIN-\d{8}-\d{3})/);
      if (!lineMatch) {
        throw new Error('结果页未见对象行「对象：… · 任务 CHAIN-*」片段：' + body.slice(0, 360));
      }
      const objectName = (lineMatch[1] || '').replace(/\s+/g, ' ').trim();
      const taskId = lineMatch[2] || '';
      const badObject = ['', '—', '-', '未选产业', '未选', '尚未选择', '暂无', '空'];
      if (!objectName || badObject.some((b) => objectName === b || objectName.startsWith(b))) {
        throw new Error('对象行分析对象为空或占位：「' + objectName + '」');
      }
      if (objectName.length < 2) {
        throw new Error('对象行分析对象过短：「' + objectName + '」');
      }
      if (!taskId || !/CHAIN-\d{8}-\d{3}/.test(taskId)) {
        throw new Error('对象行任务编号无效：' + taskId);
      }
      const urlTask = new URL(page.url()).searchParams.get('task_id') || '';
      if (urlTask && urlTask !== taskId) {
        throw new Error('对象行任务编号与 URL task_id 不一致：行=' + taskId + ' url=' + urlTask);
      }
      if (ctx.taskFromRow && ctx.taskFromRow !== taskId) {
        throw new Error('对象行任务编号与所点记录不一致：行=' + taskId + ' 记录=' + ctx.taskFromRow);
      }
      await expect(main.getByText(new RegExp('对象[：:].*' + taskId.replace(/[-]/g, '\\$&'))).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  结果顶栏对象行 UI 文案「对象：{产业名} · 任务 {taskId}」（IndustryShenzhenPage SectionPanel）。
  打开路径=分析记录已完成「查看结果」（同 03388/00763）。无已完成→ENV-CHAIN-SZ-DEV-NO-DONE-TASK。
  用例要求回显发起时产业，禁止「未选产业」。B 档零 allow_skip。
