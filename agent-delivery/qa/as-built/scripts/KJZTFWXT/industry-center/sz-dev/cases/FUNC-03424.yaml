id: FUNC-03424
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03424
priority: P1
title: 同产业对比来源点开始分析仍停配置
story: US-CHAIN-SZ-03
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已进入深圳产业发展分析页
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 选「新一代信息技术」与同产业来源 CHAIN-20260821-016 后点开始分析
expect:
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      const TASK = 'CHAIN-20260821-016';
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 15000 });
      const row = page.locator('[data-testid="shenzhen-development-context-row"]');
      await expect(row).toBeVisible({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await row.getByText('请选择产业').click({ timeout: 15000 });
      await page.waitForTimeout(400);
      await page
        .locator('.arco-trigger-popup:visible .arco-select-option')
        .filter({ hasText: '新一代信息技术' })
        .first()
        .click({ timeout: 10000 });
      await page.waitForTimeout(600);
      await row.getByText('请显式选择有效结构化结果').click({ timeout: 15000 });
      await page.waitForTimeout(400);
      const sameOpt = page
        .locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)')
        .filter({ hasText: TASK });
      if ((await sameOpt.count()) < 1) {
        throw new Error('ENV-CHAIN-SZ-DEV-03424: 绑定下拉无同产业来源 ' + TASK);
      }
      await sameOpt.first().click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.scrollIntoViewIfNeeded();
      await start.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const toast = page.locator('.arco-message-content, .arco-message').filter({ hasText: '尚未选择分析对象' });
      await expect(toast.first()).toBeVisible({ timeout: 10000 });
  - note: 2、仍停在「分析配置」
    assert: |-
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 8000 });
      await expect(page).toHaveURL(/tab=development/, { timeout: 8000 });
  - note: 3、不进入「深圳产业发展分析生成中」
    assert: |-
      const url = page.url();
      if (/view=processing|demo_state=processing/.test(url)) {
        throw new Error('不应进入生成中 URL：' + url);
      }
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toHaveCount(0);
      const main = page.locator('main').first();
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/深圳产业发展分析生成中/.test(body)) {
        throw new Error('不应进入「深圳产业发展分析生成中」');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
