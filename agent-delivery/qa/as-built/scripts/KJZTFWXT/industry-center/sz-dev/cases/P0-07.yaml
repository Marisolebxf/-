id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00755
priority: P0
title: 顶部双 Tab 构成与默认选中态正确
entry_id: chain-sz-dev
preconditions:
- 已进入深圳产业发展分析页
locators:
  tab_dev: tab「深圳产业发展分析」
  tab_rec: tab「分析记录」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: evaluate
  note: 读取顶部 Tab 构成与默认选中
expect:
- note: 顶部含「深圳产业发展分析」与「分析记录」两枚 Tab，顺序一致
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await expect(page.getByRole('tab', { name: '深圳产业发展分析' })).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('tab', { name: '分析记录' })).toBeVisible({ timeout: 8000 })
- note: 默认选中「深圳产业发展分析」，「分析记录」未选中
  assert: |-
    await expect(page.getByRole('tab', { name: '深圳产业发展分析' })).toHaveAttribute('aria-selected', 'true'); await expect(page.getByRole('tab', { name: '分析记录' })).toHaveAttribute('aria-selected', 'false')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 勿与对比篮系统级 tab（企业/产业/服务机构）混淆。
tier: B
