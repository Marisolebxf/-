id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00769
priority: P1
title: 同用户同条件同时仅允许一条分析任务在跑
entry_id: chain-sz-dev
preconditions:
- 已配置齐备同一条件
locators:
  start: button「开始分析」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: click
  target: 开始分析两次
expect:
- note: 同条件同时仅一条任务在跑，重复发起被拦截或复用
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.locator('main .arco-select-view').first().click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click(); await page.waitForTimeout(500); await page.locator('main .arco-select-view').nth(1).click({ timeout: 8000 }); await page.waitForTimeout(500); const en = page.locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)'); if (!(await en.count())) throw new Error('SKIP: 无有效绑定，无法构造单飞'); await en.first().click(); await page.waitForTimeout(500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('SKIP: 开始分析禁用'); await start.click(); await page.waitForTimeout(500); await start.click({ force: true }).catch(()=>{}); await page.waitForTimeout(1000)
allow_skip: 无法构造在跑双发时 Pass-N/A（开放项 2/3）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 口径见 Q-ANALYSIS-01。
tier: B
