id: FUNC-00778
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00778
priority: P0
title: 门禁未满足时开始分析任何触发方式均不发起任务
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已进入页面
  - 门禁未满足（如仅选产业未绑定结果）
locators:
  start: button「开始分析」
  industry: main .industry-catalog-select（placeholder「请选择产业」）
  bind: main input[placeholder="请显式选择有效结构化结果"]
  tab_config: tab「深圳产业发展分析」
  tab_rec: tab「分析记录」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 仅选产业；force click + Enter；回读分析记录
expect:
  - note: 禁用态下点击与回车均不创建任务、不跳转结果态
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=development&tab=development';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业发展分析/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=development/.test(page.url()) &&
        /tab=development/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业发展分析$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 15000 });
      };
      const ensureConfigPage = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          await dismissBasket();
        }
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
          await dismissBasket();
        }
        if (await bodyIs404() || !onTarget()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入深圳产业发展分析 ' + page.url());
        }
      };
      const selectIndustryOnly = async () => {
        const ind = page.locator('main .industry-catalog-select').filter({ has: page.locator('input[placeholder="请选择产业"]') }).first();
        const ph = await ind.locator('input').first().getAttribute('placeholder').catch(() => '');
        if (!(ph && ph.includes('请选择产业'))) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          await dismissBasket();
        }
        const ind2 = page.locator('main .industry-catalog-select').filter({ has: page.locator('input[placeholder="请选择产业"]') }).first();
        if (await ind2.count()) {
          await ind2.locator('.arco-select-view').first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
          await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click();
          await page.waitForTimeout(700);
          await expect(ind2).toContainText('新一代信息技术', { timeout: 8000 });
        } else {
          const view = page.locator('main .arco-select-view').first();
          await view.click({ timeout: 8000 });
          await page.waitForTimeout(400);
          await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click();
          await page.waitForTimeout(700);
        }
        const bindInp = page.locator('main input[placeholder="请显式选择有效结构化结果"]');
        if (await bindInp.count()) {
          const bindTxt = await bindInp.first().evaluate((el) => {
            const v = el.closest('.arco-select-view');
            return v ? (v.innerText || '').trim() : '';
          });
          if (/CHAIN-/.test(bindTxt)) throw new Error('前置已绑定对比结果，无法验禁用触发: ' + bindTxt);
        }
        await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
      };
      const readRecordCount = async () => {
        await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 8000 });
        await page.waitForTimeout(700);
        const before = ((await page.locator('main').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = before.match(/共\s*(\d+)\s*条/);
        return m ? Number(m[1]) : (before.includes('暂无数据') ? 0 : null);
      };
      await ensureConfigPage();
      await selectIndustryOnly();
      const n0 = await readRecordCount();
      await page.getByRole('tab', { name: '深圳产业发展分析' }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeDisabled({ timeout: 8000 });
      await start.click({ force: true }).catch(() => {});
      await page.waitForTimeout(400);
      await start.focus().catch(() => {});
      await page.keyboard.press('Enter');
      await page.waitForTimeout(900);
      const url = page.url();
      if (/view=result/.test(url) && !/demo_state=result/.test(url)) {
        throw new Error('禁用触发后进入结果态: ' + url);
      }
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const after = ((await page.locator('main').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const m2 = after.match(/共\s*(\d+)\s*条/);
      if (n0 != null && m2 && Number(m2[1]) > n0) {
        throw new Error('禁用触发后分析记录增加: ' + n0 + ' -> ' + m2[1]);
      }
  - note: 页面不静默代选产业或对比结果发起任务
    assert: |-
      await page.getByRole('tab', { name: '深圳产业发展分析' }).click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(500);
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
      const bindPh = page.locator('main input[placeholder="请显式选择有效结构化结果"]');
      if (await bindPh.count()) {
        await expect(bindPh.first()).toBeVisible({ timeout: 8000 });
      } else {
        const bindView = page.locator('main .arco-select-view').nth(1);
        const bindTxt = ((await bindView.innerText().catch(() => '')) || '').trim();
        if (/CHAIN-/.test(bindTxt)) throw new Error('疑似静默代选绑定: ' + bindTxt);
      }
      const ind = page.locator('main .industry-catalog-select').filter({ has: page.locator('input[placeholder="请选择产业"]') });
      if (await ind.count()) {
        await expect(ind.first()).toContainText('新一代信息技术', { timeout: 8000 });
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 门控与 FUNC-00761 同口径（仅产业+未绑定→开始分析 disabled）。禁用触发验 force click + Enter + 分析记录条数不增。深链 404 时侧栏 sibling /industry-center/search 回落。
