id: P1-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00771
priority: P1
title: 重新分析可对已有结果强制发起新一轮任务
entry_id: chain-sz-dev
preconditions:
- 当天已有同条件成功结果
locators:
  reanalyze: button「重新分析」或「按此配置新建分析」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: click
  target: 查看结果→重新分析
expect:
- note: 「重新分析」发起新一轮分析任务
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await view.count()) || await view.isDisabled()) throw new Error('SKIP: 无成功结果（开放项 1）'); await view.click(); await page.waitForTimeout(2000); const btn = page.getByRole('button', { name: /按此配置新建分析|重新分析/ }).first(); if (!(await btn.count())) throw new Error('SKIP: 无重新分析入口'); await btn.click(); await page.waitForTimeout(1500); const t = await page.locator('main').innerText(); const url = page.url(); if (!/任务|分析|development/.test(t + url)) throw new Error('新建分析后未见任务/配置回流呈现')
allow_skip: 无结果或无新建分析入口时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 入口文案执行时记录（可能同对比册「按此配置新建分析」）。
tier: B
