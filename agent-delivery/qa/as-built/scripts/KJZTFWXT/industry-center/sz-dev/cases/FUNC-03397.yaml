id: FUNC-03397
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03397
priority: P1
tier: B
title: 备选-生成失败-查看分析记录
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 同册03395构造失败页并立即点「查看分析记录」
    assert: |-
      const main = page.locator('main').first();
      const devRow = main.locator('[data-testid="shenzhen-development-context-row"]');
      await devRow.waitFor({ state: 'visible', timeout: 15000 });
      await devRow.locator('.arco-select-view').first().click();
      await page.locator('.arco-select-dropdown:visible .arco-select-option').filter({ hasText: /^生物$/ }).click();
      await expect(devRow.locator('.arco-select-view').first()).toContainText('生物', { timeout: 8000 });
      const sourceSelect = devRow.locator('.arco-form-item').filter({ hasText: '有效的深圳产业情况分析对比结果' }).locator('.arco-select-view');
      await sourceSelect.click();
      const dropdown = page.locator('.arco-select-dropdown:visible').last();
      const enabled = dropdown.locator('.arco-select-option:not(.arco-select-option-disabled)').filter({ hasNotText: 'PDF' });
      if ((await enabled.count()) === 0) throw new Error('BLOCKED: 无有效可点对比来源，无法构造生成失败页');
      await enabled.first().click();
      await page.getByRole('button', { name: '开始分析' }).click();
      const recordsBtn = main.getByRole('button', { name: '查看分析记录' });
      await recordsBtn.waitFor({ state: 'visible', timeout: 120000 });
      await recordsBtn.click();
expect:
  - note: 1、打开「分析记录」
    assert: |-
      await expect(page.getByRole('tab', { name: '分析记录', selected: true })).toBeVisible({ timeout: 15000 });
      await expect(page.locator('[data-frame-id="F-SZ-04"]').getByRole('heading', { name: '分析记录' })).toBeVisible();
  - note: 2、能看到任务状态与记录表
    assert: |-
      const frame = page.locator('[data-frame-id="F-SZ-04"]');
      await expect(frame.getByText('任务状态', { exact: true })).toBeVisible();
      await expect(frame.getByRole('columnheader', { name: '任务' })).toBeVisible();
      await expect(frame.getByRole('columnheader', { name: '状态' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
