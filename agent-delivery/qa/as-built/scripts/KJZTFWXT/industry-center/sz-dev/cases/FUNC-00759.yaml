id: FUNC-00759
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00759
priority: P0
title: 对比结果绑定选择器未绑定态占位与只读形态正确
entry_id: chain-sz-dev
tier: A
preconditions:
  - 已登录 admin
  - 已进入深圳产业发展分析页；绑定选择器为未绑定态（脏会话已绑定时再 goto 或重置参数）
locators:
  bind: main input[placeholder="请显式选择有效结构化结果"]
  bind_label: 有效的深圳产业情况分析对比结果
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 定位绑定选择器；读取占位；尝试键入
expect:
  - note: 未绑定时呈占位提示「请显式选择有效结构化结果」（原文见附录A）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=development&tab=development';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业发展分析/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=development/.test(page.url()) &&
        /tab=development/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业发展分析$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        const leaf = leafItem();
        await expect(leaf.first()).toBeVisible({ timeout: 10000 });
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 15000 });
      };
      const ensureUnbound = async () => {
        const inp = () => page.locator('main input[placeholder="请显式选择有效结构化结果"]');
        const bindView = () => page.locator('main .arco-select-view').nth(1);
        if (await inp().count() && (await inp().first().isVisible().catch(() => false))) return;
        const txt = ((await bindView().innerText().catch(() => '')) || '').trim();
        if (/CHAIN-/.test(txt)) {
          const reset = page.getByRole('button', { name: '重置参数' });
          if (await reset.count()) {
            await reset.first().click({ timeout: 8000 });
            await page.waitForTimeout(600);
          }
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
          await dismissBasket();
        }
        const txt2 = ((await bindView().innerText().catch(() => '')) || '').trim();
        if (/CHAIN-/.test(txt2)) throw new Error('绑定非未绑定态: ' + txt2);
      };
      await dismissBasket();
      await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1200);
      await dismissBasket();
      if (!onTarget() || (await bodyIs404())) {
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (!(await bodyIs404())) await enterViaSidebar();
      }
      if (await bodyIs404() || !onTarget()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无法进入深圳产业发展分析 ' + page.url());
      }
      await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1200);
      await dismissBasket();
      await ensureUnbound();
      await expect(page.getByText('有效的深圳产业情况分析对比结果').first()).toBeVisible({ timeout: 8000 });
      const inp = page.locator('main input[placeholder="请显式选择有效结构化结果"]');
      await expect(inp.first()).toBeVisible({ timeout: 8000 });
      const ph = await inp.first().getAttribute('placeholder');
      if (!ph || ph !== '请显式选择有效结构化结果') throw new Error('绑定占位不符: ' + ph);
      const viewTxt = await inp.first().evaluate((el) => {
        const v = el.closest('.arco-select-view');
        return v ? (v.innerText || '').trim() : '';
      });
      if (/CHAIN-/.test(viewTxt)) throw new Error('非未绑定态: ' + viewTxt);
  - note: 选择器为只读显式选择形态，不可自由键入
    assert: |-
      const inp = page.locator('main input[placeholder="请显式选择有效结构化结果"]').first();
      await expect(inp).toBeVisible({ timeout: 8000 });
      const ro = await inp.getAttribute('readonly');
      const roProp = await inp.evaluate((el) => el.readOnly);
      if (ro === null && !roProp) throw new Error('绑定 input 非 readonly');
      if (await inp.isEditable()) throw new Error('绑定 input 可编辑');
      await inp.fill('随便输入').catch(() => {});
      await page.waitForTimeout(200);
      const v = await inp.inputValue();
      if (v && v.includes('随便')) throw new Error('绑定允许自由键入: ' + v);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 绑定 input placeholder 与附录A一致；readonly（attr 空串 + readOnly=true）。脏绑定先重置参数再 goto。深链 404 时侧栏 sibling 回落（同 00757/00758）。A 档零 allow_skip。
