id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00764
priority: P0
title: 成功结果页完整对比以只读抽屉展开且关闭后不离开
entry_id: chain-sz-dev
preconditions:
- 已有一条成功的发展分析结果
locators:
  drawer: .arco-drawer
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: evaluate
  note: 打开成功结果→展开完整对比抽屉→关闭
expect:
- note: 完整对比以只读抽屉呈现，不可编辑
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('.arco-btn-disabled') }).first(); if (!(await view.count()) || await view.isDisabled()) throw new Error('SKIP: 无成功结果（开放项 1）'); await view.click(); await page.waitForTimeout(2000); const open = page.getByRole('button', { name: /完整对比|查看对比|对比详情/ }).first(); if (!(await open.count())) { const t = await page.locator('main').innerText(); if (!/完整对比|对比/.test(t)) throw new Error('SKIP: 未见完整对比入口'); } else { await open.click(); await page.waitForTimeout(800) } const drawer = page.locator('.arco-drawer:visible'); if (await drawer.count()) { const editable = drawer.locator('input:not([readonly]):not([disabled]), textarea:not([readonly])'); if (await editable.count()) throw new Error('对比抽屉含可编辑控件') }
- note: 关闭抽屉后仍停留在发展结果页
  assert: |-
    const close = page.locator('.arco-drawer-close-btn').first(); if (await close.count()) { await close.click(); await page.waitForTimeout(500) } await expect(page).toHaveURL(/industry-center\/shenzhen/); const t = await page.locator('main').innerText(); if (!/发展|结果|分析/.test(t)) throw new Error('关闭抽屉后离开发展结果页')
allow_skip: 无成功结果或无抽屉入口时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 抽屉断言限定 .arco-drawer（规约）。
tier: B
