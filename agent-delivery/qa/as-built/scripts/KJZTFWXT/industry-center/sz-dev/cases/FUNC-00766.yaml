id: FUNC-00766
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00766
priority: P0
title: 成功结果页发展路径至少两套且不足时诚实标注
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已有一条成功的发展分析结果
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 经「分析记录」打开一条成功结果；浏览发展路径区
expect:
  - note: 发展路径至少两套，条目带「针对」标签与适用条件
    assert: |-
      const tablist = page.getByRole('tablist', { name: '深圳产业分析页签' });
      await expect(tablist).toBeVisible({ timeout: 10000 });
      await tablist.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await expect(page.getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 10000 });
      const main = page.locator('main').first();
      const viewButtons = main.getByRole('button', { name: '查看结果' });
      const total = await viewButtons.count();
      let opened = false;
      for (let i = 0; i < total; i++) {
        const btn = viewButtons.nth(i);
        if (await btn.isEnabled()) {
          await btn.click({ timeout: 10000 });
          opened = true;
          break;
        }
      }
      if (!opened) {
        throw new Error('分析记录中无已完成的「查看结果」可点');
      }
      await expect(main.getByText('深圳产业发展分析结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(main.getByRole('heading', { name: '发展路径', level: 3 })).toBeVisible({ timeout: 10000 });
      const pathTable = main.getByRole('heading', { name: '发展路径' }).locator('xpath=following::table[1]');
      const rowCount = await pathTable.locator('tbody tr').count();
      if (rowCount >= 2) {
        for (const h of ['路径', '适用条件', '局限性', '针对']) {
          await expect(pathTable.locator('th').filter({ hasText: h }).first()).toBeVisible();
        }
        const rows = pathTable.locator('tbody tr');
        for (let i = 0; i < rowCount; i++) {
          const row = rows.nth(i);
          const cond = ((await row.locator('td').nth(1).innerText()) || '').trim();
          if (!cond) throw new Error('适用条件为空');
          const tagCount = await row.locator('td').nth(3).locator('.arco-tag').count();
          if (tagCount < 1) throw new Error('未见针对标签');
        }
      } else {
        const mainText = ((await main.innerText()) || '').replace(/\s+/g, ' ');
        if (!/不完整|不足|未返回|不伪造|暂无足够/.test(mainText)) {
          throw new Error('路径不足两套且无诚实标注');
        }
      }
  - note: 可靠路径不足两套时标注不完整、不伪造路径
    assert: |-
      const main = page.locator('main').first();
      const pathTable = main.getByRole('heading', { name: '发展路径' }).locator('xpath=following::table[1]');
      const rowCount = await pathTable.locator('tbody tr').count();
      const mainText = ((await main.innerText()) || '').replace(/\s+/g, ' ');
      if (rowCount >= 2) {
        if (/演示路径|伪造两套|占位路径/.test(mainText)) {
          throw new Error('多套路径区出现伪造文案');
        }
      } else {
        const emptyHint = main.locator('.arco-empty-description').filter({ hasText: /发展路径未返回|不伪造/ });
        const hasHonest = (await emptyHint.count()) > 0 || /不完整|不足两套|未返回|不伪造两套|无法提供/.test(mainText);
        if (!hasHonest) throw new Error('不足两套时未见不完整/不伪造标注');
        if (rowCount === 1) throw new Error('仅单套路径且无降级说明');
      }
on_fail: 截图 + 抄 X-Trace-Id
