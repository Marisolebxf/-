id: FUNC-00766
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00766
priority: P0
title: 成功结果页发展路径至少两套且不足时诚实标注
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已有一条成功的发展分析结果
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 经「分析记录」打开一条成功结果；浏览发展路径区
    script: |-
      const recTab = page.getByRole('tab', { name: '分析记录' });
      await expect(recTab).toBeVisible({ timeout: 10000 });
      await recTab.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const main = page.locator('main');
      const statusSelect = main.locator('.arco-select-view').first();
      await statusSelect.click({ timeout: 8000 });
      await page.getByRole('option', { name: '已完成' }).click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const doneRow = main.locator('tr').filter({ hasText: '已完成' }).filter({ hasText: '深圳产业发展分析' });
      if (!(await doneRow.count())) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 分析记录筛选已完成后无成功任务');
      }
      const viewBtn = doneRow.first().getByRole('button', { name: '查看结果' });
      await expect(viewBtn).toBeEnabled({ timeout: 5000 });
      await viewBtn.click({ timeout: 10000 });
      await page.waitForTimeout(2000);
expect:
  - note: 发展路径至少两套，条目带「针对」标签与适用条件
    assert: |-
      await expect(page.getByRole('heading', { name: '发展路径' })).toBeVisible({ timeout: 15000 });
      const pathTable = page.locator('main').getByRole('heading', { name: '发展路径' }).locator('xpath=following::table[contains(@class,"arco-table")][1]');
      const rowCount = await pathTable.locator('tbody tr').count();
      if (rowCount < 2) {
        const mainText = ((await page.locator('main').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const honest = /不完整|不足|未返回|不伪造|暂无足够/.test(mainText);
        if (!honest) {
          throw new Error('路径不足两套且无诚实标注（行数=' + rowCount + '）');
        }
      } else {
        for (const h of ['路径', '适用条件', '局限性', '针对']) {
          await expect(pathTable.locator('thead th').filter({ hasText: h }).first()).toBeVisible({ timeout: 5000 });
        }
        const rows = pathTable.locator('tbody tr');
        for (let i = 0; i < rowCount; i++) {
          const row = rows.nth(i);
          const cond = ((await row.locator('td').nth(1).innerText().catch(() => '')) || '').trim();
          if (!cond) throw new Error('第' + (i + 1) + '行适用条件为空');
          const targetCell = row.locator('td').nth(3);
          const targetTxt = ((await targetCell.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/针对/.test(targetTxt) && !(await targetCell.locator('.arco-tag').count())) {
            throw new Error('第' + (i + 1) + '行未见「针对」标签');
          }
        }
      }
  - note: 可靠路径不足两套时标注不完整、不伪造路径
    assert: |-
      const pathTable = page.locator('main').getByRole('heading', { name: '发展路径' }).locator('xpath=following::table[contains(@class,"arco-table")][1]');
      const rowCount = await pathTable.locator('tbody tr').count();
      const mainText = ((await page.locator('main').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (rowCount >= 2) {
        if (/演示路径|伪造|占位路径/.test(mainText)) {
          throw new Error('多套路径区出现伪造/演示文案');
        }
        const names = [];
        for (let i = 0; i < rowCount; i++) {
          const name = ((await pathTable.locator('tbody tr').nth(i).locator('td').first().innerText().catch(() => '')) || '').trim();
          if (name) names.push(name);
        }
        const uniq = new Set(names);
        if (uniq.size < 2 && names.length >= 2) {
          throw new Error('路径名重复，疑似伪造重复行');
        }
      } else {
        const empty = page.locator('.arco-empty').filter({ hasText: /发展路径未返回|不伪造/ });
        const hasHonest = (await empty.count()) > 0 || /不完整|不足两套|未返回|不伪造两套|无法提供/.test(mainText);
        if (!hasHonest) {
          throw new Error('不足两套时未见不完整/不伪造类诚实标注');
        }
        if (rowCount === 1) {
          throw new Error('仅展示单套路径且无降级说明，疑似伪造补足');
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
