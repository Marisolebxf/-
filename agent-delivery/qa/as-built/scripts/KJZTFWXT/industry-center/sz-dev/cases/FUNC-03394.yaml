id: FUNC-03394
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03394
priority: P1
tier: B
title: 重置参数后对比来源清空且开始分析不可用
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 分析记录点「复制配置」后点「重置参数」（同册 03410 + 本条步骤）
    script: |-
      const main = page.locator('main');
      await main.getByText('分析记录', { exact: true }).click();
      await page.waitForTimeout(800);
      const copy = main.getByRole('button', { name: '复制配置' }).first();
      const copyCount = await copy.count();
      if (copyCount === 0) throw new Error('D3: 分析记录无「复制配置」行，无法建立已绑定对比来源前置');
      await copy.click();
      await main.getByRole('heading', { name: '分析配置' }).waitFor({ timeout: 15000 });
      await page.waitForTimeout(500);
      const startBtn = main.getByRole('button', { name: '开始分析' });
      if (await startBtn.isEnabled()) {
        /* 已选产业并绑定有效对比来源 */
      } else {
        throw new Error('D3: 复制配置后「开始分析」仍不可用，无法建立前置');
      }
      await main.getByRole('button', { name: '重置参数' }).click();
      await page.waitForTimeout(400);
expect:
  - note: 1、对比来源恢复为未选占位
    assert: |-
      const main = page.locator('main');
      const sourceRow = main.locator('.arco-form-item').filter({ hasText: '有效的深圳产业情况分析对比结果' });
      const sourceView = sourceRow.locator('.arco-select-view');
      await expect(sourceView).toBeVisible();
      await expect(sourceRow.locator('.arco-select-view-value')).toHaveCount(0);
      const label = ((await sourceView.innerText()) || '').replace(/\s+/g, '');
      expect(label === '' || label.includes('请显式选择有效结构化结果')).toBe(true);
  - note: 2、「开始分析」不可点击
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('button', { name: '开始分析' })).toBeDisabled();
on_fail: 截图 + 抄 X-Trace-Id
