id: P0-14
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00778
priority: P0
title: 门禁未满足时开始分析任何触发方式均不发起任务
entry_id: chain-sz-dev
preconditions:
- 已进入页面；门禁未满足（如仅选产业未绑定）
locators:
  start: button「开始分析」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=development&tab=development
- action: evaluate
  note: 仅选产业；force click + Enter；回读记录
expect:
- note: 禁用态下点击与回车均不创建任务、不跳转结果态
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; await page.locator('main .arco-select-view').first().click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click(); await page.waitForTimeout(600); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(600); const before = await page.locator('main').innerText(); const m = before.match(/共\s*(\d+)\s*条/); const n0 = m ? Number(m[1]) : (before.includes('暂无数据') ? 0 : null); await page.getByRole('tab', { name: '深圳产业发展分析' }).click(); await page.waitForTimeout(500); const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeDisabled({ timeout: 8000 }); await start.click({ force: true }).catch(()=>{}); await page.waitForTimeout(400); await start.focus().catch(()=>{}); await page.keyboard.press('Enter'); await page.waitForTimeout(800); if (/view=result/.test(page.url()) && !/demo_state=result/.test(page.url())) throw new Error('禁用触发后进了结果态'); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(600); const after = await page.locator('main').innerText(); const m2 = after.match(/共\s*(\d+)\s*条/); if (n0 != null && m2 && Number(m2[1]) > n0) throw new Error('禁用触发后记录增加')
- note: 页面不静默代选产业或对比结果发起任务
  assert: |-
    await page.getByRole('tab', { name: '深圳产业发展分析' }).click(); await page.waitForTimeout(500); await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 }); const bindPh = page.locator('main input[placeholder="请显式选择有效结构化结果"]'); if (await bindPh.count()) { /* 仍未绑定占位 */ await expect(bindPh).toBeVisible() } else { const bindTxt = (await page.locator('main .arco-select-view').nth(1).innerText()).trim(); if (/CHAIN-/.test(bindTxt)) throw new Error('疑似静默代选绑定: ' + bindTxt) }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 门控状态机归 00761。
tier: B
