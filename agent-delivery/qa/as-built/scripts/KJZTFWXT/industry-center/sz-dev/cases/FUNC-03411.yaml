id: FUNC-03411
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03411
priority: P1
tier: B
title: 从已完成记录打开分析报告
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 前置：分析记录中有一条已完成的发展分析；1.在该条上点击「查看报告」
expect:
  - note: 1、打开该任务的分析报告
    assert: |-
      const main = () => page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 15000 });
      await expect(main().getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(1200);
      const rows = main().locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 15000 }).catch(() => {});
      const count = await rows.count();
      let opened = false;
      for (let i = 0; i < count; i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/已完成/.test(rowText)) continue;
        const btn = row.getByRole('button', { name: '查看报告' }).first();
        if (await btn.isEnabled().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          opened = true;
          break;
        }
      }
      if (!opened) {
        throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK：分析记录无已完成深圳发展分析，前置不满足');
      }
      await page.waitForTimeout(800);
      await expect(main().getByRole('heading', { name: '深圳产业发展分析报告', level: 2 })).toBeVisible({ timeout: 25000 });
on_fail: 截图 + 抄 X-Trace-Id
