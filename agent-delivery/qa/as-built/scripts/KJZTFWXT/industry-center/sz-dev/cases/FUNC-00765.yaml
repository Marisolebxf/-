title: 成功结果页三类建议与「针对」标签
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: click
    target: 分析记录
  - action: click
    target: 查看结果
expect:
  - note: 政策、技术、人才三类建议齐备
    assert: |-
      await expect(page.getByRole('heading', { name: '深圳产业发展分析结果' })).toBeVisible();
      const main = page.locator('main');
      await expect(main.getByText('政策', { exact: true }).first()).toBeVisible();
      await expect(main.getByText('技术', { exact: true }).first()).toBeVisible();
      await expect(main.getByText('人才', { exact: true }).first()).toBeVisible();
  - note: 建议条目带「针对」标签与适用条件
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('针对').first()).toBeVisible();
      await expect(main.getByText('适用条件').first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
