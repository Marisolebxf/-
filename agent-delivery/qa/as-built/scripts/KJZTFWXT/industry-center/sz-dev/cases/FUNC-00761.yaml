id: FUNC-00761
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00761
priority: P0
title: 「开始分析」按钮随门禁满足状态联动门控
entry_id: chain-sz-dev
tier: A
preconditions:
  - 已进入页面
  - 配置为初始空态
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
expect:
  - note: 初始态「开始分析」置灰禁用
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      await expect(row).toBeVisible({ timeout: 15000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
  - note: 仅配置产业时按钮仍为禁用态
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const industryCombo = row.getByRole('combobox').first();
      await industryCombo.click({ timeout: 8000 });
      const opt = page.locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)').first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      const picked = ((await opt.innerText()) || '').trim();
      await opt.click();
      await page.waitForTimeout(600);
      await expect(industryCombo).toContainText(picked.slice(0, 4), { timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
  - note: 产业与有效对比结果齐备后按钮恢复可用
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const bindCombo = row.getByRole('combobox').nth(1);
      await bindCombo.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const en = page.locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)');
      const n = await en.count();
      if (n < 1) throw new Error('ENV-CHAIN-SZ-DEV-NO-VALID-BIND: 绑定下拉无有效条目，无法验门控 enabled');
      await en.first().click();
      await page.waitForTimeout(600);
      await expect(bindCombo).not.toHaveText(/请显式选择/, { timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
