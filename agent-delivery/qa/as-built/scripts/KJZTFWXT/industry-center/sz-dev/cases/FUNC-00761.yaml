id: FUNC-00761
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00761
priority: P1
tier: B
title: 「开始分析」按钮随门禁满足状态联动门控
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
expect:
  - note: 初始态「开始分析」置灰禁用
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      await expect(row).toBeVisible({ timeout: 15000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
  - note: 仅配置产业时按钮仍为禁用态
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const industrySelect = row.locator('.arco-select-view').first();
      await industrySelect.click({ timeout: 8000 });
      const opt = page
        .locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)')
        .filter({ hasText: '生物' })
        .first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      const picked = ((await opt.innerText()) || '').trim();
      await opt.click();
      await page.waitForTimeout(800);
      await expect(industrySelect).toContainText(picked.slice(0, 2), { timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
  - note: 产业与有效对比结果齐备后按钮恢复可用
    assert: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      const bindSelect = row.locator('.arco-select-view').nth(1);
      await bindSelect.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const en = page.locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)');
      const n = await en.count();
      if (n < 1) throw new Error('修订 blocked: 绑定下拉无有效条目');
      await en.first().click();
      await page.waitForTimeout(800);
      await expect(bindSelect).not.toContainText('请显式选择', { timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
