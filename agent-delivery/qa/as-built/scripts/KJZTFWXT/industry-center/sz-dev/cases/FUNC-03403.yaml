id: FUNC-03403
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03403
priority: P1
title: 报告页点「付费」仍停留在报告页
story: US-CHAIN-SZ-04
entry_id: chain-sz-dev
tier: B
preconditions:
  - 已打开一条发展分析报告（assert 自含）
  - 当前账号未开通报告导出付费权益（edu admin 默认未付费）
locators:
  tab_rec: tab「分析记录」
  view_report: button「查看报告」
  paid_badge: '[data-paid-badge="required"]'
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 分析记录→查看报告→点「付费」；落点与无弹层在 expect
expect:
  - note: 1、仍停留在当前报告页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=development&tab=development';
      const REPORT_TITLE = '深圳产业发展分析报告';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业发展分析/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=development/.test(page.url()) &&
        /tab=development/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业发展分析$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      const openReportFromRecords = async () => {
        const recordsTab = page.getByRole('tab', { name: '分析记录' }).first();
        await expect(recordsTab).toBeVisible({ timeout: 10000 });
        await recordsTab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(recordsTab).toHaveAttribute('aria-selected', 'true');
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: '深圳产业发展分析' }).filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        if (n < 1) {
          throw new Error('ENV-CHAIN-SZ-DEV-NO-DONE-TASK: 分析记录无已完成深圳发展分析任务');
        }
        let clicked = false;
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
          if (!(await reportBtn.count()) || (await reportBtn.isDisabled().catch(() => true))) continue;
          await reportBtn.click({ timeout: 15000, force: true });
          clicked = true;
          for (let j = 0; j < 28; j++) {
            await page.waitForTimeout(500);
            if (/view=report/.test(page.url()) && (await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false))) break;
          }
          if (/view=report/.test(page.url())) break;
          clicked = false;
        }
        if (!clicked) {
          throw new Error('ENV-CHAIN-SZ-DEV-NO-REPORT: 无已完成任务可点「查看报告」');
        }
      };
      await dismissBasket();
      await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1000);
      if (await bodyIs404() || !onTarget()) {
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (!(await bodyIs404())) await enterViaSidebar();
      }
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏均 SPA404，无法打开报告 ' + page.url());
      }
      await expect(page).toHaveURL(/workspace=development/);
      await openReportFromRecords();
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      await expect(reader.locator('h1').filter({ hasText: REPORT_TITLE }).first()).toBeVisible({ timeout: 15000 });
      const locked = reader.locator('[data-report-export-locked]').first();
      await expect(locked).toBeVisible({ timeout: 8000 });
      const paidTag = locked.locator('[data-paid-badge="required"]').first();
      await expect(paidTag).toBeVisible({ timeout: 8000 });
      await expect(paidTag).toContainText('付费');
      const urlBefore = page.url();
      await paidTag.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page).toHaveURL(/view=report/, { timeout: 8000 });
      if (page.url() !== urlBefore && !/view=report/.test(page.url())) {
        throw new Error('点击「付费」后离开报告路由：' + page.url());
      }
      const readerAfter = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(readerAfter).toBeVisible({ timeout: 10000 });
      await expect(readerAfter.locator('h1').filter({ hasText: REPORT_TITLE }).first()).toBeVisible({ timeout: 8000 });
      const modal = page.locator('.arco-modal-wrapper:visible, .arco-drawer:visible');
      const modalN = await modal.count();
      for (let m = 0; m < modalN; m++) {
        const vis = await modal.nth(m).isVisible().catch(() => false);
        if (vis) {
          throw new Error('点击「付费」后出现弹层/抽屉（现场口径：无新页面、无弹层）');
        }
      }
      if (typeof context !== 'undefined' && context.pages) {
        const pc = context.pages().length;
        if (pc > 1) {
          throw new Error('点击「付费」后新开浏览器页签，count=' + pc);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03403=报告页 ReportExportButton 旁 data-paid-badge=required「付费」点击后仍 view=report+h1「深圳产业发展分析报告」；
  无 modal/drawer/新页签（对齐 FUNC-03018/用例备注「点击后没有新页面」）。前置=分析记录已完成→查看报告（同 03411）。
  无已完成→ENV-CHAIN-SZ-DEV-NO-DONE-TASK；报告不可用→ENV-CHAIN-SZ-DEV-NO-REPORT。catalog_path=entry-seed。edu 404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
