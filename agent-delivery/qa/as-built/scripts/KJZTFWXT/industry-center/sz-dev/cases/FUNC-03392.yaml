id: FUNC-03392
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03392
priority: P1
tier: B
title: 更换分析对象后对比来源列表按产业刷新且仍含置灰 PDF 项
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 选择「新一代信息技术」并展开对比来源；改选「生物」并再次展开对比来源
expect:
  - note: 1、第二次列表按「生物」刷新
    assert: |-
      await expect(page.getByText('有效的深圳产业情况分析对比结果').first()).toBeVisible({ timeout: 15000 });
      const indView = () => page.locator('main .industry-catalog-select .arco-select-view').first();
      const bindView = () => page.locator('main .arco-select-view').nth(1);
      const pickIndustry = async (name) => {
        const txt = ((await indView().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (txt.includes(name)) return;
        await page.keyboard.press('Escape').catch(() => {});
        await indView().click({ timeout: 12000 });
        await page.waitForTimeout(400);
        const opt =
          name === '生物'
            ? page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /^生物$/ }).first()
            : page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: name }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click();
        await expect(indView()).toContainText(name, { timeout: 8000 });
        await page.waitForTimeout(name === '生物' ? 1200 : 800);
      };
      const readBindOptions = async () => {
        const opts = page.locator('.arco-trigger-popup:visible .arco-select-option');
        await expect(opts.first()).toBeVisible({ timeout: 8000 });
        const n = await opts.count();
        const rows = [];
        for (let i = 0; i < n; i++) {
          const el = opts.nth(i);
          const text = ((await el.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          const disabled = await el.evaluate((e) => e.classList.contains('arco-select-option-disabled')).catch(() => false);
          rows.push({ text, disabled });
        }
        return rows;
      };
      const openBind = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(250);
        await bindView().click({ timeout: 12000 });
        await page.waitForTimeout(700);
        return readBindOptions();
      };
      const fingerprint = (rows) =>
        rows.map((r) => (r.disabled ? 'D:' : 'E:') + r.text).sort().join('|');
      await pickIndustry('新一代信息技术');
      const listIt = await openBind();
      await page.keyboard.press('Escape');
      await page.waitForTimeout(300);
      await pickIndustry('生物');
      const listBio = await openBind();
      await page.evaluate(
        (payload) => {
          document.documentElement.setAttribute('data-func03392-bio', payload.bio);
        },
        { bio: JSON.stringify(listBio) },
      );
      const fpIt = fingerprint(listIt);
      const fpBio = fingerprint(listBio);
      if (fpIt === fpBio) {
        throw new Error('对比来源未随产业刷新（IT 与 生物 选项指纹相同）');
      }
      const enabledBio = listBio.filter((r) => !r.disabled).map((r) => r.text);
      const enabledIt = listIt.filter((r) => !r.disabled).map((r) => r.text);
      if (enabledBio.length < 1) throw new Error('生物产业下无有效对比来源条目');
      if (enabledIt.length >= 1 && enabledBio.join('§') === enabledIt.join('§')) {
        throw new Error('有效对比来源条目未随产业变化');
      }
  - note: 2、仍含一条置灰的 PDF 项
    assert: |-
      let listBio = JSON.parse((await page.locator('html').getAttribute('data-func03392-bio')) || '[]');
      if (!listBio.length) {
        const bindView = () => page.locator('main .arco-select-view').nth(1);
        await page.keyboard.press('Escape').catch(() => {});
        await bindView().click({ timeout: 12000 });
        await page.waitForTimeout(700);
        const opts = page.locator('.arco-trigger-popup:visible .arco-select-option');
        const n = await opts.count();
        listBio = [];
        for (let i = 0; i < n; i++) {
          const el = opts.nth(i);
          const text = ((await el.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          const disabled = await el.evaluate((e) => e.classList.contains('arco-select-option-disabled')).catch(() => false);
          listBio.push({ text, disabled });
        }
      }
      const disabledRows = listBio.filter((r) => r.disabled);
      if (disabledRows.length < 1) throw new Error('生物产业对比来源下未见置灰无效项');
      const pdfFound = disabledRows.some((r) => /PDF|导出/.test(r.text) || /无效|不可作为输入/.test(r.text));
      if (!pdfFound) throw new Error('置灰项中未见 PDF/无效标注');
on_fail: 截图 + 抄 X-Trace-Id
