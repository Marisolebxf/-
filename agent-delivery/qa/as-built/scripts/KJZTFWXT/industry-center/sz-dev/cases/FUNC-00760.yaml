id: FUNC-00760
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00760
priority: P0
title: 绑定下拉含有效与置灰无效条目且无效不可选
entry_id: chain-sz-dev
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 展开绑定下拉；浏览条目；点置灰无效项；回读绑定值
expect:
  - note: 下拉同时含有效条目与置灰无效条目
    assert: |-
      const row = page.locator('[data-testid="shenzhen-development-context-row"]');
      await expect(row).toBeVisible({ timeout: 15000 });
      const indView = row.locator('.arco-select-view').first();
      const indLabel = ((await indView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!indLabel.includes('新一代信息技术')) {
        await indView.click({ timeout: 8000 });
        await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(600);
      }
      const bindView = row.locator('.arco-select-view').nth(1);
      await bindView.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popupOpts = page.locator('.arco-trigger-popup:visible .arco-select-option');
      await expect(popupOpts.first()).toBeVisible({ timeout: 8000 });
      const disabled = page.locator('.arco-trigger-popup:visible .arco-select-option.arco-select-option-disabled');
      const enabled = page.locator('.arco-trigger-popup:visible .arco-select-option:not(.arco-select-option-disabled)');
      const en = await enabled.count();
      const dis = await disabled.count();
      if (en < 1 || dis < 1) {
        throw new Error('D3: 未见有效+无效并存（有效=' + en + ' 无效=' + dis + '）');
      }
  - note: 无效条目带不可作为输入的标注（原文样例见附录A）
    assert: |-
      const invalidOpt = page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /不可作为输入|（无效）/ });
      await expect(invalidOpt.first()).toBeVisible({ timeout: 8000 });
      const txt = ((await invalidOpt.first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/PDF|导出/.test(txt) && !/无效/.test(txt)) {
        throw new Error('无效项文案不符附录A: ' + txt);
      }
  - note: 点击无效条目后绑定值不变
    assert: |-
      const row = page.locator('[data-testid="shenzhen-development-context-row"]');
      const bindView = row.locator('.arco-select-view').nth(1);
      const readBind = async () => {
        const viewTxt = ((await bindView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (/请显式选择有效结构化结果/.test(viewTxt) || !viewTxt) return 'UNBOUND';
        return viewTxt;
      };
      const before = await readBind();
      const inv = page.locator('.arco-trigger-popup:visible .arco-select-option.arco-select-option-disabled').first();
      await expect(inv).toBeVisible({ timeout: 8000 });
      await inv.click({ force: true });
      await page.waitForTimeout(500);
      const after = await readBind();
      if (before === 'UNBOUND' && after !== 'UNBOUND') {
        if (/无效|PDF|不可作为输入/.test(after)) throw new Error('无效项被绑定: ' + after);
      }
      if (before !== 'UNBOUND' && after !== before && /无效|PDF/.test(after)) {
        throw new Error('绑定值被无效项改变: ' + before + ' -> ' + after);
      }
on_fail: 截图 + 抄 X-Trace-Id
