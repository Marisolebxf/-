id: FUNC-00760
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00760
priority: P0
tier: B
title: 绑定下拉条目构成正确且无效条目不可选
entry_id: chain-sz-dev
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 同册03392：先选分析对象以便对比来源列表就绪
    script: |-
      const row = page.locator('main [data-testid="shenzhen-development-context-row"]');
      await row.waitFor({ state: 'visible', timeout: 20000 });
      const industrySelect = row.locator('.arco-select').first();
      await industrySelect.locator('.arco-select-view').scrollIntoViewIfNeeded();
      await industrySelect.locator('.arco-select-view').click({ timeout: 15000 });
      await page.locator('.arco-select-dropdown:visible .arco-select-option').filter({ hasText: '新一代信息技术' }).first().click({ timeout: 15000 });
      await expect(industrySelect).toContainText('新一代信息技术', { timeout: 10000 });
  - action: evaluate
    note: 等待绑定下拉加载有效对比结果条目
    script: |-
      const sourceField = page.locator('main .policy-analysis-filter-row__field').filter({ hasText: '有效的深圳产业情况分析对比结果' });
      const sourceSelect = sourceField.locator('.arco-select');
      await sourceSelect.locator('.arco-select-view').scrollIntoViewIfNeeded();
      await sourceSelect.locator('.arco-select-view').click({ timeout: 15000 });
      const panel = page.locator('.arco-select-dropdown:visible').last();
      const deadline = Date.now() + 25000;
      let validCount = 0;
      while (Date.now() < deadline) {
        validCount = await panel.locator('.arco-select-option:not(.arco-select-option-disabled)').count();
        if (validCount >= 1) break;
        await page.waitForTimeout(500);
      }
      if (validCount < 1) throw new Error('绑定下拉无有效对比条目，前置不成立');
      await page.keyboard.press('Escape');
  - action: evaluate
    note: 1.展开绑定下拉；3.点击一条置灰的无效条目；记录点击前绑定值
    script: |-
      const sourceField = page.locator('main .policy-analysis-filter-row__field').filter({ hasText: '有效的深圳产业情况分析对比结果' });
      const sourceSelect = sourceField.locator('.arco-select');
      await sourceSelect.locator('.arco-select-view').click({ timeout: 15000 });
      const panel = page.locator('.arco-select-dropdown:visible').last();
      const invalid = panel.locator('.arco-select-option').filter({ hasText: '不可作为输入' }).first();
      await expect(invalid).toBeVisible({ timeout: 10000 });
      const before = (await sourceSelect.innerText()).trim();
      await invalid.click({ force: true, timeout: 10000 });
      await page.waitForTimeout(400);
      const after = (await sourceSelect.innerText()).trim();
      if (before !== after) throw new Error('点击无效条目后绑定值变化: ' + before + ' -> ' + after);
      await page.evaluate(() => { window.__func00760_bind_before = before; });
      await page.keyboard.press('Escape');
expect:
  - note: 1、下拉同时含有效条目与置灰无效条目
    assert: |-
      const sourceField = page.locator('main .policy-analysis-filter-row__field').filter({ hasText: '有效的深圳产业情况分析对比结果' });
      const sourceSelect = sourceField.locator('.arco-select');
      await sourceSelect.locator('.arco-select-view').scrollIntoViewIfNeeded();
      await sourceSelect.locator('.arco-select-view').click({ timeout: 20000 });
      const panel = page.locator('.arco-select-dropdown:visible').last();
      const enabled = panel.locator('.arco-select-option:not(.arco-select-option-disabled)');
      const disabled = panel.locator('.arco-select-option-disabled, .arco-select-option[aria-disabled="true"]');
      await expect(enabled.first()).toBeVisible({ timeout: 15000 });
      await expect(disabled.first()).toBeVisible({ timeout: 15000 });
  - note: 2、无效条目带不可作为输入的标注（原文样例见附录A）
    assert: |-
      const panel = page.locator('.arco-select-dropdown:visible').last();
      const invalid = panel.locator('.arco-select-option').filter({ hasText: '（无效）导出 PDF 报告 · 不可作为输入' });
      await expect(invalid.first()).toBeVisible({ timeout: 10000 });
  - note: 3、点击无效条目后绑定值不变
    assert: |-
      const sourceField = page.locator('main .policy-analysis-filter-row__field').filter({ hasText: '有效的深圳产业情况分析对比结果' });
      const sourceSelect = sourceField.locator('.arco-select');
      const text = (await sourceSelect.innerText()).trim();
      const before = await page.evaluate(() => window.__func00760_bind_before || '');
      if (before && text !== before) throw new Error('绑定值变化: ' + before + ' -> ' + text);
      if (text.includes('（无效）导出 PDF 报告')) throw new Error('绑定值被设为无效条目: ' + text);
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id
