id: P0-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00759
priority: P0
title: 对比结果绑定选择器未绑定态占位与只读形态正确
entry_id: chain-sz-dev
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入发展分析页；绑定选择器为未绑定态（脏会话已绑定时先再 goto）
  - env-gate overall=partial（禁结果态；本条仅配置占位/只读）
locators:
  bind: main input[placeholder="请显式选择有效结构化结果"]（arco-select-view-input，readonly）
  bind_label: 有效的深圳产业情况分析对比结果
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=development&tab=development
  - action: evaluate
    note: 定位绑定选择器；尝试键入
expect:
  - note: 未绑定时呈占位提示「请显式选择有效结构化结果」（原文见附录A）
    assert: |-
      await page.goto('http://111.198.38.90:50892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(() => false); if (v) { await closeB.first().click(); await page.waitForTimeout(400) } }; await page.goto('http://111.198.38.90:50892/industry-center/shenzhen?workspace=development&tab=development', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); if (await closeB.count()) { const v2 = await closeB.first().isVisible().catch(() => false); if (v2) { await closeB.first().click(); await page.waitForTimeout(300) } }; await expect(page.getByText('有效的深圳产业情况分析对比结果').first()).toBeVisible({ timeout: 8000 }); const inp = page.locator('main input[placeholder="请显式选择有效结构化结果"]'); await expect(inp.first()).toBeVisible({ timeout: 8000 }); const ph = await inp.first().getAttribute('placeholder'); if (!ph || ph !== '请显式选择有效结构化结果') throw new Error('绑定占位不符: ' + ph); const viewTxt = await inp.first().evaluate((el) => { const v = el.closest('.arco-select-view'); return v ? (v.innerText || '').trim() : '' }); if (/CHAIN-/.test(viewTxt)) throw new Error('非未绑定态: ' + viewTxt)
  - note: 选择器为只读显式选择形态，不可自由键入
    assert: |-
      const inp = page.locator('main input[placeholder="请显式选择有效结构化结果"]').first(); await expect(inp).toBeVisible({ timeout: 8000 }); const ro = await inp.getAttribute('readonly'); const roProp = await inp.evaluate((el) => el.readOnly); if (ro === null && !roProp) throw new Error('绑定 input 非 readonly'); if (await inp.isEditable()) throw new Error('绑定 input 可编辑'); await inp.fill('随便输入').catch(() => {}); await page.waitForTimeout(200); const v = await inp.inputValue(); if (v && v.includes('随便')) throw new Error('绑定允许自由键入: ' + v)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 实勘 readonly（attr 空串 + readOnly=true）+ placeholder「请显式选择有效结构化结果」与附录A一致；下拉条目构成归 00760。env-gate overall=partial（禁结果态；本条仅配置类）。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
