id: FUNC-03789
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03789
priority: P1
tier: B
title: 主流程-报告页眉
entry_id: chain-report-deep
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/reports/CHAIN-20261021-002
expect:
  - note: 报告版本标签含日期与时间
    assert: |-
      await page.locator('main').getByText('产业链分析报告').waitFor({ state: 'visible', timeout: 60000 })
      await page.waitForURL(/view=report/, { timeout: 60000 })
      await expect(
        page.locator('main .report-toolbar__meta').getByText(/报告版本\s+\d{4}\.\d{2}\.\d{2}.+\d{1,2}:\d{2}/),
      ).toBeVisible()
  - note: 类型标签与该任务的分析类型名称一致
    assert: |-
      const meta = page.locator('main .report-toolbar__meta')
      const typeTag = meta.locator('.arco-tag').filter({ hasNotText: '报告版本' })
      await expect(typeTag.first()).toBeVisible()
      await expect(typeTag.first()).not.toHaveText(/^报告版本/)
  - note: 对象摘要与该任务的分析对象一致
    assert: |-
      const subject = page.locator('main .report-toolbar__meta > span').last()
      await expect(subject).toBeVisible()
      await expect(subject).not.toHaveText(/^$/)
on_fail: 截图 + 抄 X-Trace-Id
