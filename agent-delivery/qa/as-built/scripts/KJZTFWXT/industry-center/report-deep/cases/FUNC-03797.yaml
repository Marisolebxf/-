id: FUNC-03797
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03797
priority: P1
tier: B
title: 备选-目录定位
entry_id: chain-report-deep
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/reports/CHAIN-20261021-002
  - action: click
    assert: |-
      const toc = page.locator('nav.report-toc[aria-label="报告目录"]');
      await expect(toc).toBeVisible({ timeout: 30000 });
      const link = toc.locator('a[href="#report-section-executive-summary"]');
      await expect(link).toBeVisible();
      await link.evaluate((el) => (el as HTMLAnchorElement).click());
expect:
  - note: 「执行摘要」标题进入可视区域
    assert: |-
      const section = page.locator('#report-section-executive-summary');
      await section.scrollIntoViewIfNeeded();
      await expect(section.getByRole('heading', { name: '执行摘要' })).toBeVisible();
  - note: 地址带有该节的页内锚点
    assert: |-
      await expect(page).toHaveURL(/#report-section-executive-summary/);
on_fail: 截图 + 抄 X-Trace-Id
