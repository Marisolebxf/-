      const summaryHeading = page.getByRole('heading', { name: '执行摘要' }).last();
      await summaryHeading.scrollIntoViewIfNeeded();
      await expect(summaryHeading).toBeVisible();
  - note: 地址带有该节的页内锚点
    assert: |-
      await expect(page).toHaveURL(/#.+/)
