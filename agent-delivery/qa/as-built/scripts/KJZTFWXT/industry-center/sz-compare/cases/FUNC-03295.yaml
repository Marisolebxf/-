id: FUNC-03295
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03295
priority: P0
title: 企业行查看打开指标说明抽屉
story: US-CHAIN-SZ-01
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已进入分析配置
locators:
  weight_table: '[data-testid="shenzhen-compare-weight-table"]'
  enterprise_row: 四维模型「企业」行
  view_btn: 企业行「查看」
  drawer: .arco-drawer:visible
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
expect:
  - note: 1、抽屉标题为「企业 · 指标说明」
    assert: |-
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('四维模型（只读确认）').first()).toBeVisible({ timeout: 8000 });
      const table = page.locator('[data-testid="shenzhen-compare-weight-table"]');
      await expect(table).toBeVisible({ timeout: 8000 });
      const row = table.locator('tbody tr, .arco-table-tr').filter({ hasText: '企业' }).filter({ has: page.getByRole('button', { name: '查看' }) }).first();
      await expect(row).toBeVisible({ timeout: 8000 });
      const rt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!rt.includes('企业') || rt.includes('企业数')) {
        throw new Error('未定位到四维模型「企业」行: ' + rt.slice(0, 120));
      }
      await row.getByRole('button', { name: '查看' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const title = drawer.locator('.arco-drawer-title, .arco-drawer-header').first();
      await expect(title).toContainText('企业');
      await expect(title).toContainText('指标说明');
  - note: 2、抽屉内有「说明」和「支撑指标」
    assert: |-
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const t = await drawer.innerText();
      if (!t.includes('说明')) throw new Error('抽屉缺「说明」；片段: ' + t.slice(0, 400));
      if (!t.includes('支撑指标')) throw new Error('抽屉缺「支撑指标」；片段: ' + t.slice(0, 400));
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  四维模型表 data-testid=shenzhen-compare-weight-table；企业行 mini text「查看」→ IndustryMetricSpecDrawer
  标题「企业 · 指标说明」；抽屉含 descriptions「说明」与区块「支撑指标」。
