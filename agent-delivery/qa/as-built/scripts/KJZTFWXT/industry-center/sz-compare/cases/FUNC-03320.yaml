id: FUNC-03320
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03320
priority: P1
title: 结果页「带入发展分析」进入发展分析工作区
story: US-CHAIN-SZ-02
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已打开成功结果页
locators:
  bring_to_dev: button「带入发展分析」
  dev_h1: heading「深圳产业发展分析」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 分析记录打开已完成结果→点「带入发展分析」；发展页标题在 expect
expect:
  - note: 前置：成功结果页可见且「带入发展分析」可点
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const RESULT_TITLE = '深圳产业情况分析对比结果';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=comparison/.test(page.url()) &&
        /tab=comparison/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const enterSzCompare = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404() || !onTarget()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏(/industry-center/search)均 SPA404，无法执行 03320 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=comparison/);
        await expect(page).toHaveURL(/tab=comparison/);
      };
      const isResultPage = async () => {
        if (await page.getByRole('heading', { name: RESULT_TITLE, level: 1 }).isVisible().catch(() => false)) return true;
        if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) return true;
        const t = await main().innerText().catch(() => '');
        return new RegExp(RESULT_TITLE).test(t);
      };
      const openResultFromRecords = async () => {
        const tab = page.getByRole('tab', { name: '分析记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
        const rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '深圳产业情况分析对比' })
          .filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        if (n < 1) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-NO-DONE-TASK-03320：分析记录无已完成深圳对比任务');
        }
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const view = row.getByRole('button', { name: '查看结果' }).first();
          if (!(await view.count()) || (await view.isDisabled().catch(() => true))) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 28; j++) {
            await page.waitForTimeout(500);
            if (await isResultPage()) return;
          }
        }
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-RESULT-03320：已完成行「查看结果」不可用或未进入结果页');
      };
      await enterSzCompare();
      if (!(await isResultPage())) {
        await openResultFromRecords();
      }
      await expect(page.getByText(RESULT_TITLE).first()).toBeVisible({ timeout: 20000 });
      const bringBtn = page.getByRole('button', { name: '带入发展分析', exact: true }).first();
      if (!(await bringBtn.count()) || !(await bringBtn.isVisible().catch(() => false))) {
        const entry = main().locator('.industry-result-report-entry button').filter({ hasText: '带入发展分析' }).first();
        if (!(await entry.count()) || !(await entry.isVisible().catch(() => false))) {
          throw new Error('DEF-CHAIN-SZ-COMPARE-BRING-DEV-03320：结果页未见「带入发展分析」按钮');
        }
        await entry.click({ timeout: 12000 });
      } else {
        await bringBtn.click({ timeout: 12000 });
      }
      await page.waitForTimeout(1200);
      globalThis.__func03320 = { from: 'comparison-result' };
  - note: 1、页标题变为「深圳产业发展分析」（离开对比结果页）
    assert: |-
      if (!globalThis.__func03320) throw new Error('前置：未执行「带入发展分析」点击');
      const DEV_H1 = '深圳产业发展分析';
      const COMPARE_RESULT = '深圳产业情况分析对比结果';
      await expect(page).toHaveURL(/workspace=development/, { timeout: 15000 });
      await expect(page.getByRole('heading', { name: DEV_H1, level: 1 })).toBeVisible({ timeout: 15000 });
      const compareH1 = page.getByRole('heading', { name: COMPARE_RESULT, level: 1 });
      if (await compareH1.isVisible().catch(() => false)) {
        throw new Error('仍停留在对比结果页标题「' + COMPARE_RESULT + '」');
      }
      const devTab = page.getByRole('tab', { name: DEV_H1 }).first();
      if (await devTab.count() && (await devTab.isVisible().catch(() => false))) {
        await expect(devTab).toHaveAttribute('aria-selected', 'true');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=entry-seed /industry-center/shenzhen?workspace=comparison&tab=comparison；用例=对比成功结果页 IndustryResultReportEntry「带入发展分析」→ setTab(development) → h1「深圳产业发展分析」+ workspace=development（只核离开对比页，不验发展配置）。
  进结果优先分析记录「查看结果」（同 03310）；无已完成→ENV-CHAIN-SZ-COMPARE-NO-DONE-TASK-03320。edu SPA404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
