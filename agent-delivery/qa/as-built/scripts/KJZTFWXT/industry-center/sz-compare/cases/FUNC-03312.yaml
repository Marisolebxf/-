id: FUNC-03312
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03312
priority: P1
tier: B
title: 结果页「按此配置新建分析」回到配置并露出禁用的重新分析
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 分析记录进入成功结果页后点「按此配置新建分析」
expect:
  - note: 1、回到分析配置
    assert: |-
      const main = () => page.locator('main').first();
      const RESULT_TITLE = '深圳产业情况分析对比结果';
      const openResultFromRecords = async () => {
        const tab = page.getByRole('tab', { name: '分析记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1000);
        const rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '深圳产业情况分析对比' })
          .filter({ hasText: /已完成|成功/ });
        await expect(rows.first()).toBeVisible({ timeout: 15000 });
        const view = rows.first().getByRole('button', { name: '查看结果' }).first();
        await expect(view).toBeEnabled({ timeout: 8000 });
        await view.click({ timeout: 12000 });
        await expect(page.getByText(RESULT_TITLE).first()).toBeVisible({ timeout: 25000 });
      };
      await expect(page).toHaveURL(/workspace=comparison/);
      await openResultFromRecords();
      const newBtn = page.getByRole('button', { name: '按此配置新建分析' }).first();
      await expect(newBtn).toBeVisible({ timeout: 10000 });
      await newBtn.click({ timeout: 12000 });
      await page.waitForTimeout(1200);
      await expect(main().getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 15000 });
      await expect(main().locator('.diagnosis-config-toolbar, [data-testid="shenzhen-config-toolbar"]').first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByText(RESULT_TITLE).first()).not.toBeVisible({ timeout: 8000 });
      globalThis.__func03312Done = true;
  - note: 2、页面出现「重新分析」
    assert: |-
      if (!globalThis.__func03312Done) throw new Error('前置未完成');
      const rerun = page.locator('main').getByRole('button', { name: '重新分析' }).first();
      await expect(rerun).toBeVisible({ timeout: 10000 });
      globalThis.__func03312Rerun = rerun;
  - note: 3、「重新分析」为禁用
    assert: |-
      const rerun = globalThis.__func03312Rerun || page.locator('main').getByRole('button', { name: '重新分析' }).first();
      await expect(rerun).toBeDisabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
