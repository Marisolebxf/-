id: FUNC-00736
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00736
priority: P0
title: 切换产业后主体深圳与四维模型四行保持
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已进入页面；集群已选（默认新一代信息技术）
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
  subject: '[data-testid="shenzhen-compare-context-row"] input.arco-input[readonly]'
  weight_table: '[data-testid="shenzhen-compare-weight-table"]'
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 产业下拉先选一项再切至另一项（判定在 expect）
expect:
  - note: 1、切换产业后主体区域仍为「深圳」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const enterCompare = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/shenzhen/.test(page.url()) &&
          /workspace=comparison/.test(page.url()) &&
          /tab=comparison/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深圳对比深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      };
      const readSelect = async (loc) =>
        ((await loc.getAttribute('title')) || (await loc.innerText()) || '').replace(/\s+/g, ' ').trim();
      const pickIndustryNth = async (index) => {
        const industry = page.locator('.arco-select-view[aria-label="产业"]').first();
        await industry.scrollIntoViewIfNeeded();
        await industry.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const options = pop.locator('.arco-select-option');
        const count = await options.count();
        if (count < 2) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-INDUSTRY-OPTIONS: 产业选项不足 2 项，无法切换，count=' + count);
        }
        if (index >= count) throw new Error('产业选项 index 越界 index=' + index + ' count=' + count);
        await options.nth(index).click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      await enterCompare();
      const cluster = page.locator('.arco-select-view[aria-label="集群"]').first();
      const clusterLabel = await readSelect(cluster);
      if (!clusterLabel || /请选择/.test(clusterLabel)) {
        throw new Error('前置：集群未选，现场=' + clusterLabel);
      }
      await pickIndustryNth(0);
      await pickIndustryNth(1);
      const subject = page.locator('[data-testid="shenzhen-compare-context-row"] input.arco-input[readonly]').first();
      await expect(subject).toBeVisible({ timeout: 8000 });
      await expect(subject).toHaveValue('深圳');
      globalThis.__func00736_switched = true;
  - note: 2、切换产业后四维模型仍为 4 行
    assert: |-
      if (!globalThis.__func00736_switched) throw new Error('前置：未完成产业切换');
      await expect(page.getByText('四维模型（只读确认）').first()).toBeVisible({ timeout: 8000 });
      const table = page.locator('[data-testid="shenzhen-compare-weight-table"]');
      await expect(table).toBeVisible({ timeout: 8000 });
      const rows = table.locator('tbody tr');
      await expect(rows).toHaveCount(4, { timeout: 8000 });
      for (const name of ['企业', '专利', '政策', '人才']) {
        await expect(table.getByText(name, { exact: true }).first()).toBeVisible({ timeout: 5000 });
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 步骤按用例切换「产业」非「集群」；四维模型行数以 data-testid=shenzhen-compare-weight-table tbody tr 计数。集群默认新一代信息技术满足前置「已选集群」。
