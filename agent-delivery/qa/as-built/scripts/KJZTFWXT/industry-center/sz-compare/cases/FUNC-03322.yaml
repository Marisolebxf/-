id: FUNC-03322
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03322
priority: P1
title: 未选标杆时开始分析禁用且任务条数不变
story: US-CHAIN-SZ-01
entry_id: chain-sz-compare
tier: B
preconditions:
  - 标杆区域尚未选择
locators:
  tab_config: tab「深圳产业情况分析对比」
  tab_records: tab「分析记录」
  start: button「开始分析」
  benchmark_ph: input[placeholder*="Q016"]
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 记分析记录条数→只选产业不选标杆→尝试开始分析→再查记录条数（判定在 expect）
expect:
  - note: 前置：已选产业、标杆未选，并记住分析记录任务条数
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const BENCH_PH = 'Q016 未定，标杆清单为空；勿冒充沪/京/苏州';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=comparison/.test(page.url()) &&
        /tab=comparison/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const enterCompare = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404() || !onTarget()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏均 SPA404，无法执行 03322 ' + page.url());
        }
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      };
      const pickIndustryFirst = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="产业"]').first();
        await expect(view).toBeVisible({ timeout: 10000 });
        const cur = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (cur && !/请选择|请选/.test(cur)) return;
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opt = pop.locator('.arco-select-option').first();
        if (!(await opt.count())) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-03322：产业下拉无选项');
        }
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const benchmarkView = () =>
        page.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="' + BENCH_PH + '"]') }).first();
      const assertBenchmarkEmpty = async () => {
        const view = benchmarkView();
        await expect(view).toBeVisible({ timeout: 8000 });
        const tags = view.locator('.arco-tag');
        const tagCount = await tags.count();
        let tagText = '';
        for (let i = 0; i < tagCount; i++) {
          tagText += ((await tags.nth(i).innerText().catch(() => '')) || '').trim();
        }
        const phInput = view.locator('input[placeholder="' + BENCH_PH + '"]').first();
        const phVisible = await phInput.isVisible().catch(() => false);
        const emptyByPh = phVisible;
        const emptyByTags = tagCount === 0 || !tagText.replace(/\s/g, '');
        if (!emptyByPh && !emptyByTags) {
          throw new Error('前置要求标杆未选，现场 tags=' + tagCount + ' text=' + tagText.slice(0, 80));
        }
      };
      const readRecordCount = async () => {
        const recTab = page.locator('[role=tab][data-tab-key="records"]').first();
        if (await recTab.count()) {
          await recTab.click({ timeout: 10000 });
        } else {
          await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 10000 });
        }
        await page.waitForTimeout(900);
        await expect(page.getByText('任务状态').first()).toBeVisible({ timeout: 10000 });
        const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        if (m) return Number(m[1]);
        const rows = page.locator('.arco-table-body tr.arco-table-tr');
        const n = await rows.count();
        if (n >= 0) return n;
        throw new Error('ENV-CHAIN-SZ-COMPARE-03322：分析记录无法读取条数');
      };
      const goConfigTab = async () => {
        const cfgTab = page.locator('[role=tab][data-tab-key="comparison"]').first();
        if (await cfgTab.count()) {
          await cfgTab.click({ timeout: 10000 });
        } else {
          await page.getByRole('tab', { name: '深圳产业情况分析对比' }).first().click({ timeout: 10000 });
        }
        await page.waitForTimeout(700);
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 10000 });
      };
      await enterCompare();
      await pickIndustryFirst();
      await assertBenchmarkEmpty();
      const nBefore = await readRecordCount();
      await goConfigTab();
      globalThis.__func03322 = { nBefore };
  - note: 1、「开始分析」为禁用；2、页面提示须选择 1～5 个标杆区域
    assert: |-
      const st = globalThis.__func03322;
      if (!st || typeof st.nBefore !== 'number') throw new Error('前置：未记录分析记录条数');
      const main = () => page.locator('main').first();
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await expect(start).toBeDisabled({ timeout: 8000 });
      await start.click({ timeout: 3000 }).catch(() => {});
      await page.waitForTimeout(400);
      if (!/view=processing|view=result/.test(page.url())) {
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      } else {
        throw new Error('未选标杆点击开始分析后不应进入过程/结果态，url=' + page.url());
      }
      const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/请选择\s*1[～~\-—]5\s*个标杆区域/.test(t) && !/须选择\s*1[～~\-—]5\s*个标杆/.test(t)) {
        throw new Error('未见须选择 1～5 个标杆区域提示；现场=' + t.slice(0, 280));
      }
  - note: 3、分析记录任务条数与点击前相同
    assert: |-
      const st = globalThis.__func03322;
      if (!st || typeof st.nBefore !== 'number') throw new Error('前置：未记录分析记录条数');
      const main = () => page.locator('main').first();
      const recTab = page.locator('[role=tab][data-tab-key="records"]').first();
      if (await recTab.count()) {
        await recTab.click({ timeout: 10000 });
      } else {
        await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 10000 });
      }
      await page.waitForTimeout(900);
      const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const m = t.match(/共\s*(\d+)\s*条/);
      let nAfter = m ? Number(m[1]) : null;
      if (nAfter == null) {
        const rows = page.locator('.arco-table-body tr.arco-table-tr');
        nAfter = await rows.count();
      }
      if (nAfter !== st.nBefore) {
        throw new Error('未选标杆开始分析后任务条数变化：前=' + st.nBefore + ' 后=' + nAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  03322 异常·未选标杆：只选产业、标杆 Q016 空态→记分析记录条数→配置页验「开始分析」disabled + 文案「请选择 1～5 个标杆区域」→再查条数不变。
  入口 route=entry-seed catalog_path。edu 深链/侧栏 SPA404→ENV-EDU-TTS-SVCZ-404-001。与同批 00744/03306 共用入口 fallback 与条数读法。
