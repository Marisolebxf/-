id: FUNC-03288
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03288
priority: P0
tier: B
title: 主流程-开始分析至成功结果页
entry_id: chain-sz-compare
preconditions:
  - 已进入分析配置
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 集群「新一代信息技术」→产业「人工智能与应用」→标杆上海市、北京市→开始分析→必要时查看分析结果
expect:
  - note: 1、页面出现标题「深圳产业情况分析对比结果」
    assert: |-
      const RESULT_TITLE = '深圳产业情况分析对比结果';
      const main = () => page.locator('main').first();
      const pickSelect = async (ariaLabel, textRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = main().locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await expect(view).toBeVisible({ timeout: 15000 });
        const cur = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (textRe.test(cur)) return;
        await view.click({ timeout: 10000 });
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 10000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: textRe }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const pickBenchmarkCity = async (cityRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = main()
          .locator('[data-testid="shenzhen-benchmark-ready-check"] .arco-cascader-view')
          .first();
        await expect(view).toBeVisible({ timeout: 15000 });
        await view.click({ timeout: 10000 });
        await page.waitForTimeout(600);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 10000 });
        const popText = ((await pop.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const options = pop.locator('.arco-cascader-option, .arco-cascader-list-item, li[role="menuitem"]');
        const optionCount = await options.count();
        if (/Q016|标杆清单为空/.test(popText) && optionCount === 0) {
          throw new Error('修订 blocked 标杆级联无数据 Q016');
        }
        let opt = options.filter({ hasText: cityRe }).first();
        if (!(await opt.count())) {
          for (let col = 0; col < 4; col++) {
            const colOpt = pop.locator('.arco-cascader-column').nth(col).locator('li, .arco-cascader-option').filter({ hasText: cityRe }).first();
            if (await colOpt.count()) {
              await colOpt.click({ timeout: 8000 });
              await page.waitForTimeout(400);
              opt = pop.locator('.arco-cascader-option, .arco-cascader-list-item, li').filter({ hasText: cityRe }).first();
              break;
            }
            const any = pop.locator('.arco-cascader-column').nth(col).locator('li, .arco-cascader-option').first();
            if (await any.count()) await any.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(300);
            opt = pop.locator('.arco-cascader-option, .arco-cascader-list-item, li').filter({ hasText: cityRe }).first();
            if (await opt.count()) break;
          }
        }
        if (!(await opt.count())) {
          throw new Error('修订 blocked 标杆级联无「' + String(cityRe) + '」 optionCount=' + optionCount + ' pop=' + popText.slice(0, 80));
        }
        await opt.click({ timeout: 10000 });
        await page.waitForTimeout(500);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const openViewResultIfShown = async () => {
        const btn = page.getByRole('button', { name: '查看分析结果' }).first();
        if (await btn.isVisible().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          await page.waitForTimeout(1500);
        }
      };
      const waitResultTitle = async () => {
        for (let i = 0; i < 90; i++) {
          if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) return;
          const t = await main().innerText().catch(() => '');
          if (/分析结果已生成|不会自动跳转/.test(t)) await openViewResultIfShown();
          if (await page.getByRole('button', { name: '查看分析结果' }).isVisible().catch(() => false)) {
            await openViewResultIfShown();
          }
          await page.waitForTimeout(i < 5 ? 600 : 1200);
        }
        throw new Error('修订 fail 超时未见「' + RESULT_TITLE + '」');
      };
      await expect(page).toHaveURL(/workspace=comparison/, { timeout: 20000 });
      await expect(page).toHaveURL(/tab=comparison/);
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 15000 });
      await pickSelect('集群', /^新一代信息技术$/);
      await pickSelect('产业', /^人工智能与应用$/);
      await pickBenchmarkCity(/^上海市$/);
      await pickBenchmarkCity(/^北京市$/);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 10000 });
      await start.click({ timeout: 15000 });
      await openViewResultIfShown();
      await waitResultTitle();
      await expect(page.getByText(RESULT_TITLE).first()).toBeVisible({ timeout: 15000 });
  - note: 2、摘要中主体为深圳，标杆含上海市与北京市
    assert: |-
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      await expect(page.getByText('深圳产业情况分析对比结果').first()).toBeVisible();
      if (!/深圳/.test(body)) throw new Error('摘要未见主体深圳');
      if (!/上海市/.test(body)) throw new Error('摘要未见标杆上海市');
      if (!/北京市/.test(body)) throw new Error('摘要未见标杆北京市');
on_fail: 截图 + 抄 X-Trace-Id
