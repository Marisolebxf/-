id: FUNC-03306
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03306
priority: P0
title: 当天同条件再次开始分析不新增任务
entry_id: chain-sz-compare
tier: B
preconditions:
  - 当天已对「人工智能与应用」及上海市、北京市成功分析过
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 前置03288→记条数→回配置→同条件开始分析
expect:
  - note: 1、进入标题为「深圳产业情况分析对比结果」的页面
    assert: |-
      const RESULT_TITLE = '深圳产业情况分析对比结果';
      const main = () => page.locator('main').first();
      const pickSelectOption = async (ariaLabel, re) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = main().locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await expect(view).toBeVisible({ timeout: 12000 });
        const cur = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (re.test(cur)) return;
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: re }).first();
        if (!(await opt.count())) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-03306：选项不可用 ' + ariaLabel + ' ' + String(re));
        }
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      const pickBenchmarkCascader = async (cityLabel) => {
        const view = main().locator('[data-testid="shenzhen-benchmark-ready-check"] .arco-cascader-view').first();
        await expect(view).toBeVisible({ timeout: 12000 });
        const cur = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (cur.includes(cityLabel)) return;
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 10000 });
        const popText = ((await pop.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/暂无|无数据/.test(popText) || !popText.trim()) {
          await page.keyboard.press('Escape').catch(() => {});
          throw new Error('ENV-CHAIN-SZ-COMPARE-BENCHMARK-EMPTY-Q016：标杆清单空');
        }
        const hit = pop.getByText(cityLabel, { exact: true }).first();
        if (!(await hit.count())) {
          await page.keyboard.press('Escape').catch(() => {});
          throw new Error('ENV-CHAIN-SZ-COMPARE-BENCHMARK-03306：标杆无「' + cityLabel + '」');
        }
        await hit.click({ timeout: 8000 });
        await page.waitForTimeout(700);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
        const after = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!after.includes(cityLabel)) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-BENCHMARK-03306：标杆未回显「' + cityLabel + '」');
        }
      };
      const assertBenchmarksReady = async () => {
        const view = main().locator('[data-testid="shenzhen-benchmark-ready-check"] .arco-cascader-view').first();
        const t = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/上海市/.test(t) || !/北京市/.test(t)) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-BENCHMARK-03306：沪京标杆未选齐');
        }
        await expect(main().getByText('请选择 1～5 个标杆区域')).toHaveCount(0);
      };
      const selectSameConditions = async () => {
        await pickSelectOption('集群', /^新一代信息技术$/);
        await pickSelectOption('产业', /^人工智能与应用$/);
        await pickBenchmarkCascader('上海市');
        await pickBenchmarkCascader('北京市');
        await assertBenchmarksReady();
      };
      const openViewResultIfShown = async () => {
        for (const name of ['查看分析结果', '查看结果']) {
          const btn = page.getByRole('button', { name }).first();
          if (await btn.isVisible().catch(() => false)) {
            await btn.click({ timeout: 10000 });
            await page.waitForTimeout(1500);
          }
        }
      };
      const isResultPage = async () => {
        const h = page.getByRole('heading', { name: RESULT_TITLE });
        if (await h.first().isVisible().catch(() => false)) return true;
        if (await page.getByText(RESULT_TITLE, { exact: true }).first().isVisible().catch(() => false)) return true;
        return new RegExp(RESULT_TITLE).test(await main().innerText().catch(() => ''));
      };
      const waitForResult = async () => {
        let last = '';
        for (let i = 0; i < 60; i++) {
          await openViewResultIfShown();
          if (await isResultPage()) return;
          await page.waitForTimeout(i < 8 ? 600 : 1200);
          last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/不会自动跳转|今日已分析|当天已分析|分析结果已生成/.test(last)) {
            await openViewResultIfShown();
            if (await isResultPage()) return;
          }
        }
        throw new Error('开始分析后未进入结果页标题：' + last.slice(0, 280));
      };
      const runStartAnalysisOnce = async () => {
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeVisible({ timeout: 10000 });
        if (await start.isDisabled()) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-BENCHMARK-EMPTY-Q016：开始分析仍 disabled');
        }
        await start.click({ timeout: 15000 });
        await waitForResult();
      };
      const readRecordCount = async () => {
        await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 10000 });
        await page.waitForTimeout(1000);
        await expect(page.getByText('任务状态').first()).toBeVisible({ timeout: 12000 });
        const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        if (m) return Number(m[1]);
        const rows = page.locator('.arco-table-body tr.arco-table-tr');
        const n = await rows.count();
        if (n > 0) return n;
        if (/暂无数据/.test(t)) return 0;
        throw new Error('ENV-CHAIN-SZ-COMPARE-03306：分析记录无法读取条数');
      };
      const goConfigTab = async () => {
        await page.getByRole('tab', { name: '深圳产业情况分析对比' }).first().click({ timeout: 10000 });
        await page.waitForTimeout(800);
        await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      };
      await expect(page.getByRole('heading', { name: '深圳产业情况分析对比', level: 1 })).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(1200);
      await goConfigTab();
      await selectSameConditions();
      let nBefore = await readRecordCount();
      if (nBefore < 1) {
        await goConfigTab();
        await selectSameConditions();
        await runStartAnalysisOnce();
        await openViewResultIfShown();
        nBefore = await readRecordCount();
        if (nBefore < 1) throw new Error('前置未满足：03288 后分析记录仍无任务');
      }
      globalThis.__szcmp03306_nBefore = nBefore;
      await goConfigTab();
      await selectSameConditions();
      await runStartAnalysisOnce();
      await expect(page.getByRole('heading', { name: RESULT_TITLE })).toBeVisible({ timeout: 20000 });
  - note: 2、分析记录的任务条数与点击前相同
    assert: |-
      const nBefore = globalThis.__szcmp03306_nBefore;
      if (typeof nBefore !== 'number') throw new Error('前置：未记录点击前条数');
      const main = () => page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 10000 });
      await page.waitForTimeout(900);
      const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const m = t.match(/共\s*(\d+)\s*条/);
      let nAfter = m ? Number(m[1]) : null;
      if (nAfter == null) {
        const rows = page.locator('.arco-table-body tr.arco-table-tr');
        const n = await rows.count();
        if (n > 0) nAfter = n;
      }
      if (nAfter == null) throw new Error('分析记录无法读取条数');
      if (nAfter !== nBefore) {
        throw new Error('当天同条件再次开始分析后条数变化：前=' + nBefore + ' 后=' + nAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id
