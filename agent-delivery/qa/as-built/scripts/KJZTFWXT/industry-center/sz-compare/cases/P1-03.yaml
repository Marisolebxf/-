id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00745
priority: P1
title: 同用户同条件同时仅允许一条分析任务在跑
entry_id: chain-sz-compare
preconditions:
- 已选中同一产业；开始分析可点
locators:
  start: button「开始分析」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=comparison&tab=comparison
- action: click
  target: 开始分析两次
expect:
- note: 同条件同时仅一条任务在跑，重复发起被拦截或复用
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/shenzhen?workspace=comparison&tab=comparison', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('SKIP: 开始分析禁用，无法构造单飞（Q016/门控）'); await start.click(); await page.waitForTimeout(500); await start.click({ force: true }).catch(()=>{}); await page.waitForTimeout(1000); /* 无法稳定数在跑任务时至少不崩 */ const err = await page.locator('.arco-message-error').count(); void err
allow_skip: 开始分析禁用或无在跑任务构造条件时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 口径见 Q-ANALYSIS-01；现场常见无法构造在跑双发。
tier: B
