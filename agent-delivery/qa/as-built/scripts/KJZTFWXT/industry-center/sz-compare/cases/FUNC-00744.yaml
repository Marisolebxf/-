id: FUNC-00744
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00744
priority: P1
title: 重置后主体深圳保持、标杆清空且开始分析禁用
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已进入深圳产业情况分析对比配置页
  - 已点击「重置参数」（脚本内先选产业/标杆再重置以构造前置）
locators:
  reset: button「重置参数」
  subject: input.arco-input[readonly]
  benchmark_ph: input[placeholder*="标杆"]
  start: button「开始分析」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 选产业（可选标杆）→重置参数→读主体/标杆/开始分析
expect:
  - note: 重置后主体区域仍为「深圳」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const BENCH_PH = 'Q016 未定，标杆清单为空；勿冒充沪/京/苏州';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const enterCompare = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/shenzhen/.test(page.url()) &&
          /workspace=comparison/.test(page.url()) &&
          /tab=comparison/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深圳对比深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      };
      const pickIndustryFirst = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="产业"]').first();
        await expect(view).toBeVisible({ timeout: 10000 });
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opt = pop.locator('.arco-select-option').first();
        if (!(await opt.count())) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-00744：产业下拉无选项');
        }
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const benchmarkView = () =>
        page.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="' + BENCH_PH + '"]') }).first();
      const tryPickBenchmark = async () => {
        const view = benchmarkView();
        if (!(await view.count())) return false;
        await view.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        const pop = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible').last();
        const opt = pop.locator('.arco-select-option').first();
        if (!(await opt.count())) {
          await page.keyboard.press('Escape').catch(() => {});
          return false;
        }
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await page.keyboard.press('Escape').catch(() => {});
        return true;
      };
      const readSubjectShenzhen = async () => {
        const row = page.locator('[data-testid="shenzhen-compare-context-row"]').first();
        if (await row.count()) {
          const inp = row.locator('input.arco-input[readonly]').first();
          if (await inp.count()) {
            const v = (await inp.inputValue().catch(() => '')) || (await inp.getAttribute('value')) || '';
            return String(v).trim();
          }
        }
        const inputs = page.locator('main input.arco-input[readonly]');
        for (let i = 0; i < (await inputs.count()); i++) {
          const v = ((await inputs.nth(i).inputValue().catch(() => '')) || '').trim();
          if (v === '深圳') return v;
        }
        return '';
      };
      await enterCompare();
      await pickIndustryFirst();
      await tryPickBenchmark();
      await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const subject = await readSubjectShenzhen();
      if (subject !== '深圳') {
        throw new Error('重置后主体区域非「深圳」：读到=' + subject);
      }
  - note: 重置后标杆区域回到未选
    assert: |-
      const BENCH_PH = 'Q016 未定，标杆清单为空；勿冒充沪/京/苏州';
      const benchmarkView = () =>
        page.locator('.arco-select-view').filter({ has: page.locator('input[placeholder="' + BENCH_PH + '"]') }).first();
      const view = benchmarkView();
      await expect(view).toBeVisible({ timeout: 8000 });
      const phInput = view.locator('input[placeholder="' + BENCH_PH + '"]').first();
      const phVisible = await phInput.isVisible().catch(() => false);
      const tags = view.locator('.arco-tag');
      const tagCount = await tags.count();
      let tagText = '';
      for (let i = 0; i < tagCount; i++) {
        tagText += ((await tags.nth(i).innerText().catch(() => '')) || '').trim();
      }
      const emptyByPh = phVisible;
      const emptyByTags = tagCount === 0 || !tagText.replace(/\s/g, '');
      if (!emptyByPh && !emptyByTags) {
        throw new Error('重置后标杆未回到未选：tags=' + tagCount + ' tagText=' + tagText.slice(0, 80));
      }
  - note: 重置后「开始分析」为禁用
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeDisabled({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 前置在脚本内选产业（可选标杆）后点重置；主体 readonly=深圳、标杆空态、开始分析 disabled。route=entry-seed catalog_path。
