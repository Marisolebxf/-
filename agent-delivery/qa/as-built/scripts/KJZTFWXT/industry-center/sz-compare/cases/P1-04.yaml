id: P1-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00746
priority: P1
title: 当天已有同条件成功任务时再次进入直接打开结果
entry_id: chain-sz-compare
preconditions:
- 分析记录存在已完成任务
locators:
  tab_rec: tab「分析记录」
  view: button「查看结果」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=comparison&tab=comparison
- action: click
  target: 分析记录→查看结果
expect:
- note: 再次进入时直接打开该条件结果，不重复起跑
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/shenzhen?workspace=comparison&tab=comparison', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(1000); const view = page.getByRole('button', { name: '查看结果' }).first(); if (!(await view.count())) throw new Error('SKIP: 分析记录无已完成「查看结果」'); await view.click(); await page.waitForTimeout(2500); await expect(page.getByText('深圳产业情况分析对比结果')).toBeVisible({ timeout: 12000 }); if (!/view=result|task_id=/.test(page.url())) throw new Error('未进入结果 URL'); const t = await page.locator('main').innerText(); if (/正在创建任务|可视化分析过程/.test(t) && !/结果/.test(t)) throw new Error('疑似重复起跑而非打开结果')
allow_skip: 无已完成任务时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘可从 CHAIN-*-已完成恢复；结果含对比表/对标研判/诚实降级。用例「当天同条件自动打开」窄口径以记录恢复验证。
tier: B
