id: FUNC-03313
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03313
priority: P1
tier: B
title: 分析记录「复制配置」回显产业与标杆
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 分析记录对已完成行点「复制配置」
expect:
  - note: 1、回到分析配置
    assert: |-
      const main = () => page.locator('main').first();
      const cmpTab = () => page.locator('[role=tab][data-tab-key="comparison"]');
      const recTab = () => page.locator('[role=tab][data-tab-key="records"]');
      const readIndustryLabel = async () => {
        const indView = page.locator('.arco-select-view[aria-label="产业"]').first();
        if (await indView.count()) {
          return ((await indView.getAttribute('title')) || (await indView.innerText()) || '').replace(/\s+/g, ' ').trim();
        }
        const field = main().locator('.arco-form-item').filter({ hasText: /分析对象/ }).first();
        const views = field.locator('.arco-select-view');
        if ((await views.count()) >= 2) {
          return ((await views.nth(1).getAttribute('title')) || (await views.nth(1).innerText()) || '').replace(/\s+/g, ' ').trim();
        }
        return '';
      };
      const readBenchmarkTags = async () => {
        const benchField = main().locator('.arco-form-item').filter({ hasText: /标杆区域/ }).first();
        const tags = benchField.locator('.arco-tag');
        const n = await tags.count();
        const out = [];
        for (let i = 0; i < n; i++) {
          const t = ((await tags.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          if (t) out.push(t);
        }
        if (!out.length) {
          const cascader = benchField.locator('.arco-cascader-view').first();
          const t = ((await cascader.getAttribute('title')) || (await cascader.innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t && !/Q016|请选择|标杆清单/.test(t)) out.push(t);
        }
        return out;
      };
      const pickBenchmarkCities = async (cities) => {
        const bench = main().locator('.arco-form-item').filter({ hasText: /标杆区域/ }).first();
        await bench.locator('.arco-cascader-view').click({ timeout: 10000 });
        for (const city of cities) {
          const panel = page.locator('.arco-cascader-panel:visible');
          await panel.getByText(city, { exact: true }).last().click({ timeout: 10000 });
          await page.waitForTimeout(300);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const ensureCompletedTask = async () => {
        await cmpTab().click({ timeout: 10000 });
        await page.waitForTimeout(600);
        const cluster = main().locator('.arco-form-item').filter({ hasText: /分析对象/ }).first().locator('.arco-select-view').first();
        await cluster.click({ timeout: 10000 });
        await page.locator('.arco-select-dropdown:visible').last().getByText('新一代信息技术', { exact: true }).click({ timeout: 10000 });
        await page.waitForTimeout(400);
        await page.locator('.arco-select-view[aria-label="产业"]').first().click({ timeout: 10000 });
        await page.locator('.arco-select-dropdown:visible').last().getByText('人工智能与应用', { exact: true }).click({ timeout: 10000 });
        await page.waitForTimeout(400);
        await pickBenchmarkCities(['上海市', '北京市']);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        if (!(await start.isEnabled().catch(() => false))) return;
        await start.click({ timeout: 15000 });
        await page.waitForTimeout(1200);
        const viewResult = page.getByRole('button', { name: '查看分析结果' });
        if (await viewResult.first().isVisible().catch(() => false)) {
          await viewResult.first().click({ timeout: 15000 });
          await page.waitForTimeout(800);
        }
      };
      await expect(page).toHaveURL(/workspace=comparison/);
      await expect(recTab()).toBeVisible({ timeout: 10000 });
      await recTab().click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      let rows = main()
        .locator('tbody tr, .arco-table-tr')
        .filter({ hasText: '深圳产业情况分析对比' })
        .filter({ hasText: /已完成/ });
      if ((await rows.count()) < 1) {
        await ensureCompletedTask();
        await recTab().click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '深圳产业情况分析对比' })
          .filter({ hasText: /已完成/ });
      }
      if ((await rows.count()) < 1) throw new Error('ENV-CHAIN-SZ-COMPARE-NO-DONE-TASK-03313：分析记录无已完成深圳对比任务');
      const prefer = rows.filter({ hasText: /人工智能/ });
      const list = (await prefer.count()) > 0 ? prefer : rows;
      let copied = false;
      const total = await list.count();
      for (let i = 0; i < Math.min(total, 10); i++) {
        const row = list.nth(i);
        const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
        if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
        await copyBtn.click({ timeout: 15000 });
        await page.waitForTimeout(900);
        await expect(cmpTab()).toHaveAttribute('aria-selected', 'true', { timeout: 12000 });
        await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
        const start = page.getByRole('button', { name: '开始分析' }).first();
        if (await start.isEnabled().catch(() => false)) {
          copied = true;
          break;
        }
        await recTab().click({ timeout: 10000 });
        await page.waitForTimeout(600);
      }
      if (!copied) throw new Error('ENV-CHAIN-SZ-COMPARE-BENCH-INVALID-03313：已完成行复制后标杆仍无法识别');
      globalThis.__func03313 = {
        industry: await readIndustryLabel(),
        benchmarks: await readBenchmarkTags(),
      };
  - note: 2、产业名称和标杆城市都回显
    assert: |-
      const snap = globalThis.__func03313;
      if (!snap) throw new Error('前置：未完成复制配置');
      const industry = (snap.industry || '').replace(/\s+/g, ' ').trim();
      if (!industry || /请选择产业/.test(industry)) {
        throw new Error('产业未回显，现场=' + industry);
      }
      const benchmarks = Array.isArray(snap.benchmarks) ? snap.benchmarks : [];
      const mainTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const benchEcho = benchmarks.length > 0 ? benchmarks.join(' ') : mainTxt;
      if (!/(上海|北京)/.test(benchEcho)) {
        throw new Error('标杆城市未回显：tags=' + JSON.stringify(benchmarks));
      }
  - note: 3、「开始分析」可点击
    assert: |-
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await expect(start).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
