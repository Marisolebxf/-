id: FUNC-00743
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00743
priority: P1
tier: B
title: 备选-操作区
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 分析对象选产业一项后点击「重置参数」
expect:
  - note: 产业下拉回到「请选择产业」
    assert: |-
      const main = page.locator('main').first();
      const row = main.locator('[data-testid="shenzhen-compare-context-row"]');
      await expect(row).toBeVisible({ timeout: 15000 });
      const objectField = row.locator('.policy-analysis-filter-row__field').filter({ hasText: '分析对象' }).locator('.arco-select-view, .arco-cascader-view').first();
      await expect(objectField).toBeVisible({ timeout: 8000 });
      await objectField.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      let popup = page.locator('.arco-trigger-popup:visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const clusterOpt = popup.locator('.arco-select-option, .arco-cascader-option').filter({ hasText: '新一代信息技术' }).first();
      await expect(clusterOpt).toBeVisible({ timeout: 8000 });
      await clusterOpt.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      popup = page.locator('.arco-trigger-popup:visible').last();
      const industryOpt = popup.locator('.arco-select-option, .arco-cascader-option').filter({ hasText: '人工智能与应用' }).first();
      await expect(industryOpt).toBeVisible({ timeout: 8000 });
      await industryOpt.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(row).toContainText('人工智能与应用', { timeout: 5000 });
      await main.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(objectField).toContainText('请选择产业', { timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id
