id: FUNC-03324
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03324
priority: P1
tier: B
title: 分析记录已完成行下载报告失败时提示且状态不变
entry_id: chain-sz-compare
preconditions:
  - 分析记录里有已完成任务
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 03288 补已完成任务（若无）→分析记录点「下载报告」；失败提示与行状态在 expect
expect:
  - note: 1、页面给出失败提示
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const RESULT_TITLE = '深圳产业情况分析对比结果';
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=comparison/.test(page.url()) &&
        /tab=comparison/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const enterSzCompare = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404() || !onTarget()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-ENTRY-UNREACHABLE: 深链与侧栏均 SPA404，无法执行 03324 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=comparison/);
        await expect(page).toHaveURL(/tab=comparison/);
      };
      const pickSelect = async (ariaLabel, textRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = main().locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await expect(view).toBeVisible({ timeout: 15000 });
        const cur = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (textRe.test(cur)) return;
        await view.click({ timeout: 10000 });
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 10000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: textRe }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const pickBenchmarkCity = async (cityRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = main()
          .locator('[data-testid="shenzhen-benchmark-ready-check"] .arco-cascader-view')
          .first();
        await expect(view).toBeVisible({ timeout: 15000 });
        await view.click({ timeout: 10000 });
        await page.waitForTimeout(600);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 10000 });
        const options = pop.locator('.arco-cascader-option, .arco-cascader-list-item, li[role="menuitem"]');
        let opt = options.filter({ hasText: cityRe }).first();
        if (!(await opt.count())) {
          for (let col = 0; col < 4; col++) {
            const colOpt = pop.locator('.arco-cascader-column').nth(col).locator('li, .arco-cascader-option').filter({ hasText: cityRe }).first();
            if (await colOpt.count()) {
              await colOpt.click({ timeout: 8000 });
              await page.waitForTimeout(400);
              opt = pop.locator('.arco-cascader-option, .arco-cascader-list-item, li').filter({ hasText: cityRe }).first();
              break;
            }
          }
        }
        if (!(await opt.count())) {
          throw new Error('修订 blocked 标杆级联无「' + String(cityRe) + '」');
        }
        await opt.click({ timeout: 10000 });
        await page.waitForTimeout(500);
        await page.keyboard.press('Escape').catch(() => {});
      };
      const openViewResultIfShown = async () => {
        const btn = page.getByRole('button', { name: '查看分析结果' }).first();
        if (await btn.isVisible().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          await page.waitForTimeout(1500);
        }
      };
      const runGoldSampleIfNeeded = async () => {
        await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 15000 });
        await pickSelect('集群', /^新一代信息技术$/);
        await pickSelect('产业', /^人工智能与应用$/);
        await pickBenchmarkCity(/^上海市$/);
        await pickBenchmarkCity(/^北京市$/);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 10000 });
        await start.click({ timeout: 15000 });
        await openViewResultIfShown();
        for (let i = 0; i < 90; i++) {
          if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) return;
          const t = await main().innerText().catch(() => '');
          if (/分析结果已生成|不会自动跳转/.test(t)) await openViewResultIfShown();
          await page.waitForTimeout(i < 5 ? 600 : 1200);
        }
        throw new Error('修订 fail 03288 补任务超时未见结果页');
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '分析记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
        await expect(page.locator('[data-frame-id="F-SZ-04"]')).toBeVisible({ timeout: 10000 });
      };
      const doneRows = () =>
        main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '深圳产业情况分析对比' })
          .filter({ hasText: /已完成|成功/ });
      const scrollRecordActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const waitFailHint = async () => {
        for (let i = 0; i < 40; i++) {
          const errMsg = page.locator('.arco-message-error, .arco-message.list-item-error');
          if (await errMsg.count()) {
            const t = ((await errMsg.first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
            if (t) return t;
          }
          const msgNodes = page.locator('.arco-message, .arco-message-content, .arco-notification');
          const n = await msgNodes.count();
          for (let j = 0; j < n; j++) {
            const t = ((await msgNodes.nth(j).innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
            if (/报告下载失败|资产下载失败|下载报告失败|下载失败|HTTP\s*\d{3}/.test(t)) return t;
            if (/失败/.test(t) && /下载|报告|资产/.test(t)) return t;
          }
          await page.waitForTimeout(400);
        }
        return '';
      };
      await enterSzCompare();
      await openRecordsTab();
      await scrollRecordActions();
      let n = await doneRows().count();
      if (n < 1) {
        const cfgTab = page.getByRole('tab', { name: '深圳产业情况分析对比' }).first();
        await cfgTab.click({ timeout: 10000 });
        await page.waitForTimeout(800);
        await runGoldSampleIfNeeded();
        await openRecordsTab();
        await scrollRecordActions();
        n = await doneRows().count();
      }
      if (n < 1) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-DONE-TASK-03324：分析记录无已完成深圳对比任务');
      }
      let clicked = false;
      let taskId = '';
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = doneRows().nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const tidM = rowText.match(TID_RE);
        if (!tidM) continue;
        taskId = tidM[0];
        let dl = row.getByRole('button', { name: '下载报告', exact: true }).first();
        if (!(await dl.count())) dl = row.getByText(/^下载报告$/).first();
        if (!(await dl.count()) || (await dl.isDisabled().catch(() => true))) continue;
        await row.scrollIntoViewIfNeeded().catch(() => {});
        await scrollRecordActions();
        const assetRespPromise = page
          .waitForResponse(
            (r) => /\/tasks\/[^/]+\/asset/.test(r.url()) && r.request().method() === 'GET',
            { timeout: 25000 },
          )
          .catch(() => null);
        const downloadPromise = page.waitForEvent('download', { timeout: 12000 }).catch(() => null);
        await dl.click({ timeout: 15000, force: true });
        clicked = true;
        const assetResp = await assetRespPromise;
        const dlEvt = await downloadPromise;
        let toast = await waitFailHint();
        if (!toast && assetResp && !assetResp.ok()) {
          toast = '资产下载失败（HTTP ' + assetResp.status() + '）';
        }
        if (assetResp && assetResp.ok() && !toast) {
          throw new Error('点「下载报告」资产接口 HTTP ' + assetResp.status() + ' 成功但用例要求失败提示');
        }
        if (dlEvt && !toast) {
          throw new Error('点「下载报告」触发了文件下载但无失败提示');
        }
        if (!toast && !dlEvt && !assetResp) {
          throw new Error('点「下载报告」后无失败提示、无 download、无 asset 响应');
        }
        if (!toast) {
          throw new Error('点「下载报告」后未捕获失败提示');
        }
        globalThis.__func03324 = { clicked: true, taskId, toast };
        break;
      }
      if (!clicked) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-DOWNLOAD-03324：无已完成行可点「下载报告」');
      }
      const hint = globalThis.__func03324?.toast || '';
      if (!hint || !/失败|HTTP\s*\d{3}|下载/.test(hint)) {
        throw new Error('未捕获下载失败提示文案：' + String(hint).slice(0, 120));
      }
  - note: 2、该任务状态仍为「已完成」
    assert: |-
      const st = globalThis.__func03324;
      if (!st?.clicked || !st.taskId) throw new Error('前置：未完成下载报告点击');
      const recTab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(recTab).toHaveAttribute('aria-selected', 'true');
      const row = page
        .locator('main')
        .first()
        .locator('tbody tr, .arco-table-tr')
        .filter({ hasText: st.taskId })
        .filter({ hasText: '深圳产业情况分析对比' })
        .first();
      await expect(row).toBeVisible({ timeout: 10000 });
      const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/已完成|成功/.test(rowText)) {
        throw new Error('下载报告后任务状态不再是已完成：' + rowText.slice(0, 200));
      }
on_fail: 截图 + 抄 X-Trace-Id
