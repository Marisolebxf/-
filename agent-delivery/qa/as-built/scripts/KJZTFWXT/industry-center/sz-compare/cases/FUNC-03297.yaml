id: FUNC-03297
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03297
priority: P0
title: 政策行查看打开指标说明抽屉
story: US-CHAIN-SZ-01
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已进入分析配置
locators:
  policy_row: 政策行
  view_btn: 政策行「查看」
  drawer: .arco-drawer:visible
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 四维模型「政策」行「查看」→抽屉标题与说明/支撑指标（判定在 expect）
expect:
  - note: 1、抽屉标题为「政策 · 指标说明」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const enterCompare = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/shenzhen/.test(page.url()) &&
          /workspace=comparison/.test(page.url()) &&
          /tab=comparison/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深圳对比深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
        await expect(page.getByText('四维模型（只读确认）').first()).toBeVisible({ timeout: 8000 });
      };
      await enterCompare();
      const table = page.locator('[data-testid="shenzhen-compare-weight-table"]');
      await expect(table).toBeVisible({ timeout: 8000 });
      const row = table.getByRole('row').filter({ hasText: '政策' }).filter({ hasText: '对比四维' }).first();
      await expect(row).toBeVisible({ timeout: 8000 });
      await row.getByRole('button', { name: '查看' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const title = drawer.locator('.arco-drawer-title, .arco-drawer-header').first();
      const titleText = ((await title.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!titleText.includes('政策')) throw new Error('抽屉标题缺指标名：' + titleText);
      if (!titleText.includes('指标说明')) throw new Error('抽屉标题缺「指标说明」：' + titleText);
      globalThis.__func03297 = { drawerOpened: true };
  - note: 2、抽屉内有「说明」和「支撑指标」
    assert: |-
      if (!globalThis.__func03297?.drawerOpened) throw new Error('前置：未打开政策指标说明抽屉');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const t = await drawer.innerText();
      if (!t.includes('说明')) throw new Error('抽屉缺「说明」；片段: ' + t.slice(0, 360));
      if (!t.includes('支撑指标')) throw new Error('抽屉缺「支撑指标」；片段: ' + t.slice(0, 360));
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/shenzhen?workspace=comparison&tab=comparison（entry-seed）；四维表 data-testid=shenzhen-compare-weight-table。
  用例=「政策」行「查看」→ IndustryMetricSpecDrawer 标题「政策 · 指标说明」；抽屉含 descriptions「说明」与区块「支撑指标」（IndustryMetricSpecDrawer.vue）。
  edu 深链/侧栏 SPA404 标 ENV-EDU-TTS-SVCZ-404-001 同 FUNC-03294。登录关评审 runner 前置。B 档零 allow_skip。
