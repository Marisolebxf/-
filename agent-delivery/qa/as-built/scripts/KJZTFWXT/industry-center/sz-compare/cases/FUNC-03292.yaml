id: FUNC-03292
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03292
priority: P1
tier: B
title: 标杆区域下拉可选城市共 8 个
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 已进入分析配置且标杆未选，展开标杆区域下拉
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('分析配置')).toBeVisible();
      const row = main.locator('.policy-analysis-filter-row').filter({ hasText: '标杆区域' });
      await row.locator('.arco-cascader-view').click();
expect:
  - note: 可选城市共 8 个，名称见附录 A
    assert: |-
      const cities = ['北京市', '上海市', '杭州市', '成都市', '武汉市', '重庆市', '天津市', '宁波市'];
      const popup = page.locator('.arco-cascader-popup-visible').first();
      await popup.waitFor({ state: 'visible', timeout: 5000 }).catch(() => {});
      const labels = page.locator('.arco-cascader-popup-visible .arco-cascader-option-label');
      const n = await labels.count();
      if (n === 0) {
        throw new Error('修订 blocked：ENV-CHAIN-SZ-COMPARE-BENCHMARK-EMPTY-Q016 标杆清单空，无法验 8 城');
      }
      if (n !== 8) {
        throw new Error(`修订 blocked：标杆下拉选项 ${n} 个，非预期 8 城`);
      }
      for (const c of cities) {
        await expect(labels.filter({ hasText: c })).toHaveCount(1);
      }
on_fail: 截图 + 抄 X-Trace-Id
