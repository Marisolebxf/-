id: FUNC-03293
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03293
priority: P0
title: 四维模型表头共 7 列且列名与附录 A 一致
entry_id: chain-sz-compare
tier: A
preconditions:
  - 已进入分析配置
locators:
  weight_table: '[data-testid="shenzhen-compare-weight-table"]'
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 进入分析配置→读取四维模型表头列名（判定在 expect）
expect:
  - note: 前置：分析配置与四维模型（只读确认）表可见
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const enterCompare = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/shenzhen/.test(page.url()) &&
          /workspace=comparison/.test(page.url()) &&
          /tab=comparison/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深圳对比深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
        await expect(page.getByText('四维模型（只读确认）').first()).toBeVisible({ timeout: 8000 });
      };
      await enterCompare();
      const table = page.locator('[data-testid="shenzhen-compare-weight-table"]');
      await expect(table).toBeVisible({ timeout: 8000 });
      globalThis.__func03293_ready = true;
  - note: 1、列共 7 个，名称见附录 A（选择、指标名称、分组/维度、数据状态、权重、数据来源、指标说明）
    assert: |-
      if (!globalThis.__func03293_ready) throw new Error('前置：未进入四维模型表');
      const norm = (s) => ((s || '') + '').replace(/\s+/g, ' ').trim();
      const normCol = (s) => norm(s).replace(/\s*\/\s*/g, ' / ');
      const want = ['选择', '指标名称', '分组 / 维度', '数据状态', '权重', '数据来源', '指标说明'];
      const table = page.locator('[data-testid="shenzhen-compare-weight-table"]');
      const ths = table.locator('thead th, thead .arco-table-th, .arco-table-header .arco-table-th');
      const count = await ths.count();
      const got = [];
      for (let i = 0; i < count; i++) {
        got.push(norm(await ths.nth(i).innerText()));
      }
      if (count !== 7) {
        throw new Error('四维模型表头应为 7 列，实际 count=' + count + ' headers=' + JSON.stringify(got));
      }
      for (let i = 0; i < want.length; i++) {
        if (normCol(got[i]) !== normCol(want[i])) {
          throw new Error(
            '第 ' + (i + 1) + ' 列表头不符：期望「' + want[i] + '」实际「' + got[i] + '」；全部=' + JSON.stringify(got),
          );
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03293 四维模型列名；表 data-testid=shenzhen-compare-weight-table（与 03294/00739 同）。7 列对齐用例附录 A。
  路由 catalog_path + 侧栏回退与 03290/03294 同型。A 档零 allow_skip。
