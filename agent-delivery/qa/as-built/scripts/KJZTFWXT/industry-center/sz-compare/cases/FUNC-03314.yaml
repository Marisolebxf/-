id: FUNC-03314
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03314
priority: P1
title: 报告目录点击执行摘要定位正文标题
story: US-CHAIN-SZ-05
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已打开「深圳产业情况分析对比报告」
locators:
  report_toc: nav.report-toc
  toc_executive: nav.report-toc a（执行摘要）
  section_executive: '#report-section-executive-summary'
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 打开只读报告后点目录「执行摘要」；正文节标题在 expect
expect:
  - note: 前置：已打开「深圳产业情况分析对比报告」（用例步骤 1）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=comparison/.test(page.url()) &&
        /tab=comparison/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      await dismissBasket();
      await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1000);
      if (await bodyIs404() || !onTarget()) {
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (!(await bodyIs404())) await enterViaSidebar();
      }
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏(/industry-center/search)均 SPA404，无法执行 03314 ' + page.url());
      }
      await expect(page).toHaveURL(/workspace=comparison/);
      const recordsTab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(recordsTab).toBeVisible({ timeout: 10000 });
      await recordsTab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(recordsTab).toHaveAttribute('aria-selected', 'true');
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: '深圳产业情况分析对比' }).filter({ hasText: /已完成|成功/ });
      const n = await rows.count();
      if (n < 1) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-COMPLETED-03314：分析记录无已完成深圳对比任务');
      }
      let clicked = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
        if (!(await reportBtn.count()) || (await reportBtn.isDisabled().catch(() => true))) continue;
        await reportBtn.click({ timeout: 15000, force: true });
        clicked = true;
        for (let j = 0; j < 28; j++) {
          await page.waitForTimeout(500);
          if (/view=report/.test(page.url()) && (await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false))) break;
        }
        if (/view=report/.test(page.url())) break;
        clicked = false;
      }
      if (!clicked) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-REPORT-03314：无已完成任务可点「查看报告」');
      }
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      await expect(reader).toBeVisible({ timeout: 8000 });
      await expect(reader.getByText('深圳产业情况分析对比报告').first()).toBeVisible({ timeout: 8000 });
      const toc = reader.locator('nav.report-toc, nav[aria-label="报告目录"]').first();
      await expect(toc).toBeVisible({ timeout: 8000 });
      globalThis.__func03314 = { readerReady: true };
  - note: 1、点击目录「执行摘要」后正文出现标题「执行摘要」
    assert: |-
      if (!globalThis.__func03314?.readerReady) throw new Error('前置：报告页未打开');
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      const toc = reader.locator('nav.report-toc, nav[aria-label="报告目录"]').first();
      const tocLink = toc.locator('a').filter({ hasText: '执行摘要' }).first();
      await expect(tocLink).toBeVisible({ timeout: 8000 });
      await tocLink.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const section = reader.locator('#report-section-executive-summary');
      await expect(section).toBeVisible({ timeout: 8000 });
      await expect(
        section.locator('.report-section-heading__title h2, h2').filter({ hasText: '执行摘要' }).first()
      ).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  03314 专验报告目录点「执行摘要」→正文 h2「执行摘要」（#report-section-executive-summary，对齐 SystemReportReader / industryAnalysisReportShared）。
  前置同 03307：分析记录已完成行「查看报告」。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001；无已完成/报告钮→ENV-CHAIN-SZ-COMPARE-NO-COMPLETED-03314 / NO-REPORT-03314。
  登录关评审 runner 前置。B 档零 allow_skip。
