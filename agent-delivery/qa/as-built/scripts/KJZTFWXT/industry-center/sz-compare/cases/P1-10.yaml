id: P1-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00752
priority: P1
title: 关闭评审模式后全页零泄漏且业务态不变
entry_id: chain-sz-compare
preconditions:
- 评审模式为开启态
locators:
  review_toggle: switch aria-label「内部评审模式」
steps:
- action: goto
  target: /industry-center/shenzhen?workspace=comparison&tab=comparison
- action: evaluate
  note: 关评审；刷新；两 Tab 检索泄漏字样；回读业务态
expect:
- note: 关闭并刷新后两 Tab 无追溯控件、角标与评审字样泄漏
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/shenzhen?workspace=comparison&tab=comparison', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const ps = page.locator('button.persona-switch'); if (!(await page.locator('.persona-menu').count())) { await ps.first().click({ timeout: 8000 }); await page.waitForTimeout(500) } const sw = page.locator(`.persona-menu button[role=switch][aria-label='内部评审模式']`).first(); await expect(sw).toBeVisible({ timeout: 8000 }); if ((await sw.getAttribute('aria-checked')) === 'true') { await sw.click(); await page.waitForTimeout(400) } await page.keyboard.press('Escape'); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page.locator('button[aria-label*="需求追溯"]')).toHaveCount(0); await expect(page.locator('button[aria-label*="GAP-"]')).toHaveCount(0); const txt = await page.locator('main').innerText(); for (const t of ['需求追溯', '指标未登记', '标杆区域须就绪', 'metric_id', 'GAP-']) { if (txt.includes(t)) throw new Error('评审字样泄漏: ' + t) } if (/Q0\d{2}/.test(txt) && !txt.includes('Q016 未定')) { /* Q016 在业务占位文案中属业务态，允许 */ } await page.getByRole('tab', { name: '分析记录' }).click(); await page.waitForTimeout(800); const t2 = await page.locator('main').innerText(); for (const w of ['需求追溯', '指标未登记', 'GAP-CHAIN']) { if (t2.includes(w)) throw new Error('记录 Tab 泄漏: ' + w) }
- note: 开关评审模式不改变产业、标杆、维度与 Tab 业务态
  assert: |-
    await page.getByRole('tab', { name: '深圳产业情况分析对比' }).click(); await page.waitForTimeout(600); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('input[placeholder="Q016 未定，标杆清单为空；勿冒充沪/京/苏州"]')).toBeVisible(); await expect(page.locator('[role=spinbutton]')).toHaveCount(4)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 业务占位含「Q016 未定」不算评审泄漏；零泄漏词表见用例附录A。
tier: B
