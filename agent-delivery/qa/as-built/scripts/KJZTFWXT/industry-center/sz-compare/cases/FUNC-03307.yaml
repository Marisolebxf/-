id: FUNC-03307
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03307
priority: P0
title: 分析记录已完成行查看报告打开对比报告与七节目录
story: US-CHAIN-SZ-05
entry_id: chain-sz-compare
tier: B
preconditions:
  - 分析记录里有已完成任务
locators:
  records_tab: tab「分析记录」
  view_report: button「查看报告」
  report_toc: nav.report-toc
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 打开分析记录→已完成行「查看报告」；报告标题与附录 A 七节目录在 expect
expect:
  - note: 前置：打开「分析记录」并点一条已完成任务的「查看报告」（用例步骤 1–2）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const REPORT_TITLE = '深圳产业情况分析对比报告';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=comparison/.test(page.url()) &&
        /tab=comparison/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      await dismissBasket();
      await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1000);
      if (await bodyIs404() || !onTarget()) {
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (!(await bodyIs404())) await enterViaSidebar();
      }
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏(/industry-center/search)均 SPA404，无法执行 03307 ' + page.url());
      }
      await expect(page).toHaveURL(/workspace=comparison/);
      const recordsTab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(recordsTab).toBeVisible({ timeout: 10000 });
      await recordsTab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(recordsTab).toHaveAttribute('aria-selected', 'true');
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: '深圳产业情况分析对比' }).filter({ hasText: /已完成|成功/ });
      const n = await rows.count();
      if (n < 1) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-COMPLETED-03307：分析记录无已完成深圳对比任务');
      }
      let clicked = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
        if (!(await reportBtn.count()) || (await reportBtn.isDisabled().catch(() => true))) continue;
        await reportBtn.click({ timeout: 15000, force: true });
        clicked = true;
        for (let j = 0; j < 28; j++) {
          await page.waitForTimeout(500);
          if (/view=report/.test(page.url()) && (await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false))) break;
        }
        if (/view=report/.test(page.url())) break;
        clicked = false;
      }
      if (!clicked) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-REPORT-03307：无已完成任务可点「查看报告」');
      }
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      globalThis.__func03307 = { readerReady: true };
      await expect(reader).toBeVisible({ timeout: 8000 });
  - note: 1、页面标题为「深圳产业情况分析对比报告」
    assert: |-
      if (!globalThis.__func03307?.readerReady) throw new Error('前置：报告页未打开');
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader).toBeVisible({ timeout: 8000 });
      const body = ((await reader.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const h1 = reader.locator('h1').first();
      const hasTitle =
        (await h1.isVisible().catch(() => false) && new RegExp('深圳产业情况分析对比报告').test(await h1.innerText().catch(() => ''))) ||
        /深圳产业情况分析对比报告/.test(body);
      if (!hasTitle) {
        throw new Error('报告页未见「深圳产业情况分析对比报告」，片段=' + body.slice(0, 220));
      }
      await expect(page.getByText('深圳产业情况分析对比报告').first()).toBeVisible({ timeout: 8000 });
  - note: 2、报告目录共 7 项，名称见附录 A
    assert: |-
      if (!globalThis.__func03307?.readerReady) throw new Error('前置：报告页未打开');
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader.getByText('报告目录').first()).toBeVisible({ timeout: 8000 });
      const toc = reader.locator('nav.report-toc, nav[aria-label="报告目录"]').first();
      await expect(toc).toBeVisible({ timeout: 8000 });
      const tocText = await toc.innerText();
      const required = [
        '报告身份',
        '执行摘要',
        '对象与范围',
        '关键发现',
        '证据与分析',
        '数据来源与生成说明',
        '局限性与使用边界',
      ];
      const missing = required.filter((label) => !tocText.includes(label));
      if (missing.length) {
        throw new Error('报告目录缺节：' + missing.join('、') + '；目录片段=' + tocText.slice(0, 280));
      }
      if (required.filter((label) => tocText.includes(label)).length !== 7) {
        throw new Error('报告目录节数不为 7，目录=' + tocText.replace(/\s+/g, ' ').slice(0, 320));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  03307 专验分析记录已完成行「查看报告」→「深圳产业情况分析对比报告」+附录 A 七节目录（对齐 bottleneck FUNC-03205 / key-link 03128 报告 reader 模式）。
  入口 route=entry-seed catalog_path；无已完成或报告钮不可用→ENV-CHAIN-SZ-COMPARE-NO-COMPLETED-03307 / ENV-CHAIN-SZ-COMPARE-NO-REPORT-03307。
  edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。结果页「查看报告」同报告页（用例备注），本脚本只走分析记录路径。
