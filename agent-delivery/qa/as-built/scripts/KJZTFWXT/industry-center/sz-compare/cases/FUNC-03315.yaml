id: FUNC-03315
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03315
priority: P1
tier: B
title: 备选-生成过程
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    assert: |-
      const main = page.locator('main');
      await main.getByRole('tab', { name: '分析记录' }).click();
      await main.locator('.diagnosis-records').waitFor({ state: 'visible', timeout: 60000 });
      const copies = main.getByRole('button', { name: '复制配置' });
      const n = await copies.count();
      let copied = false;
      for (let i = 0; i < n; i += 1) {
        const btn = copies.nth(i);
        if (await btn.isEnabled()) {
          await btn.click();
          copied = true;
          break;
        }
      }
      if (!copied) throw new Error('无可用「复制配置」');
      await main.locator('.diagnosis-config-panel').waitFor({ state: 'visible', timeout: 60000 });
      const cascader = main.locator('.arco-cascader-view').first();
      await cascader.click();
      for (const city of ['上海市', '北京市']) {
        const item = main.getByRole('menuitem', { name: city, exact: true });
        await item.waitFor({ state: 'visible', timeout: 15000 });
        await item.click();
      }
      await page.keyboard.press('Escape');
      const rerun = main.getByRole('button', { name: '重新分析' });
      await rerun.waitFor({ state: 'visible', timeout: 60000 });
      await expect(rerun).toBeEnabled({ timeout: 60000 });
      await rerun.click();
expect:
  - note: 页面出现「生成中」
    assert: |-
      await expect(page.locator('main').getByText(/生成中/)).toBeVisible({ timeout: 60000 });
  - note: 可见「查看分析结果」
    assert: |-
      await expect(page.locator('main').getByRole('button', { name: '查看分析结果' })).toBeVisible({ timeout: 60000 });
  - note: 过程末项为「分析结果已生成」
    assert: |-
      await expect(page.locator('main').getByText('分析结果已生成').last()).toBeVisible({ timeout: 120000 });
on_fail: 截图 + 抄 X-Trace-Id
