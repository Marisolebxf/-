id: FUNC-03311
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03311
priority: P1
tier: B
title: 复制配置后重新分析进入新结果页
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 同册03288条件发起当日成功任务，再03313复制配置
expect:
  - note: 1、生成过程中出现一个新的任务号
    assert: |-
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const extractTaskId = (text) => {
        const m = (text || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const pickSelectOption = async (ariaLabel, label) => {
        await main().locator(`.arco-select-view[aria-label="${ariaLabel}"]`).first().click({ timeout: 10000 });
        await page
          .locator('.arco-select-dropdown:visible .arco-select-option')
          .filter({ hasText: new RegExp(`^${label}$`) })
          .first()
          .click({ timeout: 10000 });
        await page.waitForTimeout(300);
      };
      const pickIndustry = async () => {
        const clusterSel = main().locator('.arco-select-view[aria-label="集群"]');
        if (await clusterSel.isVisible().catch(() => false)) {
          await pickSelectOption('集群', '新一代信息技术');
        }
        await pickSelectOption('产业', '人工智能与应用');
      };
      const pickBenchmark = async (city) => {
        await main().locator('.arco-cascader-view').first().click({ timeout: 10000 });
        await page
          .locator('.arco-cascader-dropdown:visible .arco-cascader-panel-column')
          .first()
          .getByText(city, { exact: true })
          .click({ timeout: 10000 });
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
      };
      await pickIndustry();
      await pickBenchmark('上海市');
      await pickBenchmark('北京市');
      const startBtn = main().getByRole('button', { name: '开始分析' }).first();
      await expect(startBtn).toBeEnabled({ timeout: 15000 });
      await startBtn.click({ timeout: 15000 });
      await page.waitForTimeout(1500);
      const viewResult = page.getByRole('button', { name: '查看分析结果' }).first();
      if (await viewResult.isVisible().catch(() => false)) {
        await viewResult.click({ timeout: 10000 });
        await page.waitForTimeout(1500);
      }
      const recordsTab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(recordsTab).toBeVisible({ timeout: 10000 });
      await recordsTab.click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      const doneRow = main()
        .locator('tbody tr')
        .filter({ hasText: '已完成' })
        .first();
      await expect(doneRow).toBeVisible({ timeout: 20000 });
      const priorTaskId = extractTaskId(await doneRow.innerText().catch(() => ''));
      const copyBtn = doneRow.getByRole('button', { name: '复制配置' }).first();
      await expect(copyBtn).toBeEnabled({ timeout: 8000 });
      await copyBtn.click({ timeout: 15000 });
      await page.waitForTimeout(1000);
      await expect(main().getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      const rerun = main().getByRole('button', { name: '重新分析' }).first();
      await expect(rerun).toBeVisible({ timeout: 15000 });
      await expect(rerun).toBeEnabled({ timeout: 15000 });
      await rerun.click({ timeout: 15000 });
      await page.waitForTimeout(1000);
      let processTaskId = '';
      let prior = priorTaskId;
      let body = '';
      for (let i = 0; i < 60; i++) {
        await page.waitForTimeout(i < 5 ? 500 : 1200);
        body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        processTaskId = extractTaskId(page.url()) || extractTaskId(body) || processTaskId;
        if (processTaskId && prior && processTaskId !== prior) break;
        if (/分析结果已生成/.test(body) && processTaskId) break;
      }
      expect(processTaskId).toMatch(TID_RE);
      if (prior) expect(processTaskId).not.toBe(prior);
      globalThis.__func03311 = { priorTaskId: prior, processTaskId };
      await expect(main().getByText(/CHAIN-\d{8}-\d{3}/).first()).toBeVisible({ timeout: 10000 });
  - note: 2、结果页标题为「深圳产业情况分析对比结果」
    assert: |-
      const main = () => page.locator('main').first();
      const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
      await expect(viewBtn).toBeVisible({ timeout: 15000 });
      await expect(viewBtn).toBeEnabled({ timeout: 8000 });
      await viewBtn.click({ timeout: 15000 });
      await page.waitForTimeout(2000);
      await expect(page.getByText('深圳产业情况分析对比结果').first()).toBeVisible({ timeout: 25000 });
on_fail: 截图 + 抄 X-Trace-Id
