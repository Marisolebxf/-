id: FUNC-03311
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03311
priority: P1
title: 复制配置后重新分析并进入新结果页
story: US-CHAIN-SZ-01
entry_id: chain-sz-compare
tier: B
preconditions:
  - 复制配置后产业和标杆已回显
  - 「重新分析」可点
locators:
  records_tab: tab「分析记录」
  copy_config: button「复制配置」
  rerun: button「重新分析」
  view_analysis_result: button「查看分析结果」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 分析记录复制配置→点「重新分析」→过程页新任务号（判定在 expect）
expect:
  - note: 1、生成过程中出现一个新的任务号
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const GENERATING = '深圳产业情况分析对比生成中';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=comparison/.test(page.url()) &&
        /tab=comparison/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const enterSzCompare = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404() || !onTarget()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏均 SPA404，无法执行 03311 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=comparison/);
        await expect(page).toHaveURL(/tab=comparison/);
      };
      const extractTaskId = (text) => {
        const m = (text || '').match(TID_RE);
        return m ? m[0] : '';
      };
      const industryEchoed = async () => {
        const ind = page.locator('.arco-select-view[aria-label="产业"]').first();
        const txt = ((await ind.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        return txt && !/请选择产业/.test(txt);
      };
      const benchmarkEchoed = async () => {
        const mainTxt = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/标杆区域/.test(mainTxt) && /(national\s*\/|上海|北京|广州|杭州|苏州|shanghai|beijing)/i.test(mainTxt)) return true;
        const tags = page.locator('.arco-select-view-multiple .arco-tag, .arco-select-view .arco-tag');
        const n = await tags.count();
        for (let i = 0; i < Math.min(n, 8); i++) {
          const t = ((await tags.nth(i).innerText().catch(() => '')) || '').trim();
          if (t && t.length <= 12) return true;
        }
        return false;
      };
      await enterSzCompare();
      const tab = page.getByRole('tab', { name: '分析记录' }).first();
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      const rows = main()
        .locator('tbody tr, .arco-table-tr')
        .filter({ hasText: '深圳产业情况分析对比' })
        .filter({ hasText: /已完成|成功/ });
      const n = await rows.count();
      if (n < 1) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-DONE-TASK-03311：分析记录无已完成深圳对比任务');
      }
      let priorTaskId = '';
      let copied = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        priorTaskId = extractTaskId(rowText) || priorTaskId;
        const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
        if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
        await copyBtn.click({ timeout: 15000 });
        copied = true;
        break;
      }
      if (!copied) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-COPY-03311：无已完成行可点「复制配置」');
      }
      await page.waitForTimeout(800);
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      if (!(await industryEchoed())) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-ECHO-03311：复制配置后产业未回显');
      }
      if (!(await benchmarkEchoed())) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-ECHO-03311：复制配置后标杆未回显');
      }
      const rerun = page.getByRole('button', { name: '重新分析' }).first();
      if (!(await rerun.isVisible().catch(() => false))) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-RERUN-03311：复制配置后未见「重新分析」（需当日同指纹已有成功任务）');
      }
      await expect(rerun).toBeEnabled({ timeout: 15000 });
      await rerun.click({ timeout: 15000 });
      await page.waitForTimeout(800);
      let processTaskId = '';
      let sawGenerating = false;
      let last = '';
      for (let i = 0; i < 90; i++) {
        await page.waitForTimeout(i < 4 ? 600 : 1500);
        last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const urlId = extractTaskId(page.url());
        const bodyIds = last.match(new RegExp(TID_RE.source, 'g')) || [];
        processTaskId = urlId || (bodyIds.length ? bodyIds[bodyIds.length - 1] : processTaskId);
        if (new RegExp(GENERATING).test(last) || /可视化分析过程/.test(last)) sawGenerating = true;
        if (processTaskId && priorTaskId && processTaskId !== priorTaskId && sawGenerating) break;
        if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(last) && i >= 10 && !/分析结果已生成/.test(last)) {
          throw new Error('ENV-CHAIN-SZ-COMPARE-ASYNC-FAIL-03311：重新分析失败');
        }
        if (sawGenerating && /分析结果已生成/.test(last) && processTaskId) break;
      }
      if (!sawGenerating && !new RegExp(GENERATING).test(last)) {
        throw new Error('未见生成过程页，片段: ' + last.slice(0, 200));
      }
      if (!processTaskId) {
        throw new Error('生成过程中未见新任务号 CHAIN-*，片段: ' + last.slice(0, 200));
      }
      if (priorTaskId && processTaskId === priorTaskId) {
        throw new Error('生成过程任务号与复制来源相同，应为新任务：' + processTaskId);
      }
      globalThis.__func03311 = { priorTaskId, processTaskId, sawGenerating };
      await expect(main().getByText(new RegExp(GENERATING)).first()).toBeVisible({ timeout: 8000 });
  - note: 2、结果页标题为「深圳产业情况分析对比结果」
    assert: |-
      const snap = globalThis.__func03311;
      if (!snap) throw new Error('前置：未完成重新分析过程页');
      const RESULT_TITLE = '深圳产业情况分析对比结果';
      const main = () => page.locator('main').first();
      let body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/分析结果已生成/.test(body)) {
        for (let i = 0; i < 60; i++) {
          await page.waitForTimeout(1200);
          body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/分析结果已生成/.test(body)) break;
        }
      }
      const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
      await expect(viewBtn).toBeVisible({ timeout: 12000 });
      await expect(viewBtn).toBeEnabled({ timeout: 8000 });
      await viewBtn.click({ timeout: 15000 });
      await page.waitForTimeout(2000);
      const isResultPage = async () => {
        if (await page.getByRole('heading', { name: RESULT_TITLE, level: 1 }).isVisible().catch(() => false)) return true;
        if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) return true;
        return new RegExp(RESULT_TITLE).test(await main().innerText().catch(() => ''));
      };
      for (let i = 0; i < 40; i++) {
        if (await isResultPage()) break;
        await page.waitForTimeout(800);
      }
      await expect(page.getByText(RESULT_TITLE).first()).toBeVisible({ timeout: 20000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=entry-seed /industry-center/shenzhen?workspace=comparison&tab=comparison；用例=分析记录「复制配置」→配置区「重新分析」（submit forceRerun，无确认框）→过程页新 CHAIN 任务号→「查看分析结果」→「深圳产业情况分析对比结果」。
  「重新分析」仅 gateTodayTask 时可见。无已完成/无复制/无重新分析/产业标杆未回显→ENV-CHAIN-SZ-COMPARE-NO-*-03311。edu SPA404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
