id: FUNC-03316
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03316
priority: P1
tier: B
title: 备选-生成过程-从过程页查看分析记录
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: click
    target: 分析记录
  - action: wait
    timeout_ms: 2000
  - action: click
    target: 复制配置
  - action: wait
    timeout_ms: 2500
  - action: click
    target: 开始分析
  - action: wait
    timeout_ms: 2000
  - action: assert_visible
    target: 生成中
  - action: click
    target: 查看分析记录
  - action: wait
    timeout_ms: 2000
expect:
  - note: 进入分析记录列表
    assert: |-
      await expect(page.locator('main')).toContainText('分析记录');
      await expect(page.getByRole('columnheader', { name: '任务' })).toBeVisible();
      await expect(page.getByRole('columnheader', { name: '状态' })).toBeVisible();
  - note: 列表中有这次新产生的任务
    assert: |-
      const row = page.locator('main .arco-table tbody tr').first();
      await expect(row).toBeVisible({ timeout: 8000 });
      await expect(row).toContainText('CHAIN-');
      await expect(row).toContainText('已完成');
on_fail: 截图 + 抄 X-Trace-Id
