id: FUNC-03299
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03299
priority: P1
tier: B
title: 主流程-结果页条件摘要与所选产业标杆一致
entry_id: chain-sz-compare
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: wait
    timeout_ms: 1200
    for: 配置区渲染
expect:
  - note: 摘要中的对象为「人工智能与应用」
    assert: |-
      const main = page.locator('main');
      const clusterViews = main.locator('.industry-cluster-select .arco-select-view');
      const clusterText = await clusterViews.first().innerText().catch(() => '');
      if (!/新一代信息技术/.test(clusterText)) {
        await clusterViews.first().click({ timeout: 8000 });
        await page.locator('.arco-trigger-popup:visible').getByText('新一代信息技术', { exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(400);
      }
      await clusterViews.nth(1).click({ timeout: 8000 });
      await page.locator('.arco-trigger-popup:visible').getByText('人工智能与应用', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const benchmarkCascader = main.locator('.diagnosis-benchmark-field .arco-cascader-view').first();
      await benchmarkCascader.click({ timeout: 8000 });
      const popup = page.locator('.arco-trigger-popup:visible');
      for (const city of ['上海市', '北京市']) {
        const opt = popup.locator('.arco-cascader-option, .arco-cascader-list-item, li').filter({ hasText: city }).first();
        if (!(await opt.count())) throw new Error(`修订 blocked 标杆级联无「${city}」`);
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(300);
      }
      const startBtn = main.getByRole('button', { name: '开始分析' });
      await expect(startBtn).toBeEnabled({ timeout: 8000 });
      await startBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1000);
      const viewResult = main.getByRole('button', { name: '查看分析结果' });
      if (await viewResult.isVisible().catch(() => false)) {
        await viewResult.click({ timeout: 10000 });
      }
      const bodyText = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/请选择 1～5 个标杆区域/.test(bodyText) && !/深圳产业情况分析对比结果/.test(bodyText)) {
        throw new Error('修订 已发起仍为空结果壳');
      }
      await expect(main.getByRole('heading', { name: /深圳产业情况分析对比结果/ })).toBeVisible({ timeout: 30000 });
      const summaryLine = main.getByText(/^对象：/).first();
      await expect(summaryLine).toContainText('人工智能与应用', { timeout: 8000 });
  - note: 主体为深圳
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText(/^对象：/).first()).toContainText('主体：深圳', { timeout: 8000 });
  - note: 标杆含上海市与北京市
    assert: |-
      const main = page.locator('main');
      const summaryLine = main.getByText(/^对象：/).first();
      await expect(summaryLine).toContainText('上海市', { timeout: 8000 });
      await expect(summaryLine).toContainText('北京市', { timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
