id: FUNC-03317
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03317
priority: P1
title: 分析记录「重置筛选」恢复全部状态并列出已完成任务
story: US-CHAIN-SZ-05
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已打开「分析记录」
locators:
  tab_rec: '[role=tab][data-tab-key=records]'
  records_frame: '[data-frame-id="F-SZ-04"]'
  reset_filter: button「重置筛选」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 分析记录选「失败」后点「重置筛选」；状态与列表在 expect
expect:
  - note: 前置：进入分析记录，基线存在已完成行；选「失败」后已完成行不再列出
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const onTarget = () =>
        /\/industry-center\/shenzhen/.test(page.url()) &&
        /workspace=comparison/.test(page.url()) &&
        /tab=comparison/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
      };
      const enterSzCompare = async () => {
        await dismissBasket();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404() || !onTarget()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与侧栏均 SPA404，无法执行 03317 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=comparison/);
        await expect(page).toHaveURL(/tab=comparison/);
      };
      const statusSelect = () =>
        page
          .locator('.diagnosis-records__filters > div')
          .filter({ hasText: '任务状态' })
          .locator('.arco-select-view')
          .first();
      const readStatusLabel = async () => {
        const view = statusSelect();
        const title = await view.getAttribute('title');
        const val = view.locator('.arco-select-view-value').first();
        const inner = val.count ? ((await val.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim() : '';
        return (title || inner || ((await view.innerText()) || '').replace(/\s+/g, ' ').trim()).trim();
      };
      const pickStatus = async (label) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(150);
        const view = statusSelect();
        await expect(view).toBeVisible({ timeout: 8000 });
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const popup = page.locator('.arco-trigger-popup:visible').last();
        await expect(popup).toBeVisible({ timeout: 8000 });
        const opt = popup.locator('.arco-select-option').filter({ hasText: new RegExp('^\\s*' + label + '\\s*$') });
        await expect(opt.first()).toBeVisible({ timeout: 8000 });
        await opt.first().click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      const countDoneRows = async () => {
        const rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '深圳产业情况分析对比' })
          .filter({ hasText: /已完成|成功/ });
        let n = 0;
        for (let i = 0; i < (await rows.count()); i++) {
          if (await rows.nth(i).isVisible().catch(() => false)) n += 1;
        }
        return n;
      };
      await enterSzCompare();
      const recTab = page.locator('[role=tab][data-tab-key="records"]');
      await expect(recTab).toBeVisible({ timeout: 10000 });
      await recTab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(recTab).toHaveAttribute('aria-selected', 'true');
      const frame = page.locator('[data-frame-id="F-SZ-04"]');
      await expect(frame).toBeVisible({ timeout: 10000 });
      await expect(frame.getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 8000 });
      const baselineDone = await countDoneRows();
      if (baselineDone < 1) {
        throw new Error('ENV-CHAIN-SZ-COMPARE-NO-DONE-TASK-03317：分析记录无已完成深圳对比任务，无法验重置筛选');
      }
      await pickStatus('失败');
      const afterFailLabel = await readStatusLabel();
      if (!/失败/.test(afterFailLabel)) {
        throw new Error('选「失败」后任务状态未显示失败；当前「' + afterFailLabel + '」');
      }
      const doneAfterFail = await countDoneRows();
      if (doneAfterFail > 0) {
        throw new Error('筛「失败」后仍见已完成行 ' + doneAfterFail + ' 条');
      }
      globalThis.__func03317 = { baselineDone };
  - note: 1、任务状态回到「全部状态」；2、已完成任务重新出现在列表中
    assert: |-
      const st = globalThis.__func03317;
      if (!st || typeof st.baselineDone !== 'number') throw new Error('前置：未完成失败筛选');
      const frame = page.locator('[data-frame-id="F-SZ-04"]');
      await expect(frame).toBeVisible({ timeout: 8000 });
      const resetBtn = frame.getByRole('button', { name: '重置筛选' });
      await expect(resetBtn).toBeVisible({ timeout: 8000 });
      await resetBtn.click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const statusSelect = () =>
        page
          .locator('.diagnosis-records__filters > div')
          .filter({ hasText: '任务状态' })
          .locator('.arco-select-view')
          .first();
      const readStatusLabel = async () => {
        const view = statusSelect();
        const title = await view.getAttribute('title');
        const val = view.locator('.arco-select-view-value').first();
        const inner = val.count ? ((await val.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim() : '';
        return (title || inner || ((await view.innerText()) || '').replace(/\s+/g, ' ').trim()).trim();
      };
      const label = await readStatusLabel();
      if (!/全部状态/.test(label)) {
        throw new Error('重置筛选后任务状态应为「全部状态」，当前「' + label + '」');
      }
      const main = () => page.locator('main').first();
      const countDoneRows = async () => {
        const rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '深圳产业情况分析对比' })
          .filter({ hasText: /已完成|成功/ });
        let n = 0;
        for (let i = 0; i < (await rows.count()); i++) {
          if (await rows.nth(i).isVisible().catch(() => false)) n += 1;
        }
        return n;
      };
      const doneAfterReset = await countDoneRows();
      if (doneAfterReset < 1) {
        throw new Error('重置筛选后未见已完成任务行（基线 ' + st.baselineDone + ' 条）');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  F-SZ-04 分析记录区「重置筛选」= recordStatusFilter='all'（IndustryShenzhenPage）；双层 expect：基线有已完成 → 筛失败清空 → 重置回全部状态并恢复已完成行。
  无已完成→ENV-CHAIN-SZ-COMPARE-NO-DONE-TASK-03317。edu 深链/侧栏 SPA404→ENV-EDU-TTS-SVCZ-404-001。与同批 03308/03309 共用入口 fallback。
