id: FUNC-03294
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03294
priority: P0
title: 四维模型选择列勾选框不可勾上且点击后态不变
story: US-CHAIN-SZ-01
entry_id: chain-sz-compare
tier: B
preconditions:
  - 已进入分析配置
locators:
  weight_table: '[data-testid="shenzhen-compare-weight-table"]'
  select_checkbox: label.arco-checkbox[aria-label="对比维度只读启用"]
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 进入分析配置→点击「选择」列勾选框→断言 disabled 且 checked 态不变（用例「保持未选」=不可勾上改态）
expect:
  - note: 前置：深圳对比分析配置与四维模型表可见
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      const enterCompare = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/shenzhen/.test(page.url()) &&
          /workspace=comparison/.test(page.url()) &&
          /tab=comparison/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^深圳产业情况分析对比$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/shenzhen/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深圳对比深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
        await expect(page.getByText('四维模型（只读确认）').first()).toBeVisible({ timeout: 8000 });
      };
      await enterCompare();
      const table = page.locator('[data-testid="shenzhen-compare-weight-table"]');
      await expect(table).toBeVisible({ timeout: 8000 });
      globalThis.__func03294_ready = true;
  - note: 1、点击「选择」列勾选框后仍不可勾上（disabled；checked 态不变）
    assert: |-
      if (!globalThis.__func03294_ready) throw new Error('前置：未进入四维模型区');
      const table = page.locator('[data-testid="shenzhen-compare-weight-table"]');
      const boxes = table.locator('label.arco-checkbox[aria-label="对比维度只读启用"]');
      await expect(boxes).toHaveCount(4, { timeout: 8000 });
      for (let i = 0; i < 4; i++) {
        const box = boxes.nth(i);
        await box.scrollIntoViewIfNeeded().catch(() => {});
        const cls = (await box.getAttribute('class')) || '';
        if (!/arco-checkbox-disabled/.test(cls)) {
          throw new Error('第' + (i + 1) + '个选择列复选框应 disabled，class=' + cls);
        }
      }
      const first = boxes.first();
      const before = await first.evaluate((el) => el.classList.contains('arco-checkbox-checked'));
      const target = first.locator('.arco-checkbox-target, input[type=checkbox]').first();
      await target.click({ timeout: 5000, force: true }).catch(() => first.click({ force: true }));
      await page.waitForTimeout(250);
      const after = await first.evaluate((el) => el.classList.contains('arco-checkbox-checked'));
      if (before !== after) {
        throw new Error('点击后勾选态变化 before=' + before + ' after=' + after + '（应不可勾上/取消）');
      }
      if (!before && after) {
        throw new Error('勾选框被勾上，违反「保持未选」');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·选择列 checkbox aria-label=对比维度只读启用，class 含 arco-checkbox-disabled（IndustryShenzhenPage #select 模板 checked+disabled；scout.json）。
  用例「不能勾上/保持未选」=不可交互改 checked 态；若现场为默认 checked 演示态，以 disabled+点击后态不变为准（对齐 02920/03222）。
  edu 2026-10-20 深链/侧栏 SPA404 标 ENV-EDU-TTS-SVCZ-404-001 同 FUNC-00732。B 档零 allow_skip。
