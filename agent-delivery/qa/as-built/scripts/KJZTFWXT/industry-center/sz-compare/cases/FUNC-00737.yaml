id: FUNC-00737
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00737
priority: P0
title: 主体区域深圳只读锁定不可更改
entry_id: chain-sz-compare
tier: A
preconditions:
  - 系统可访问；已登录 admin
locators:
  subject_label: label「主体区域」
  subject_input: main input.arco-input[readonly] value=深圳
  subject_hint: alert「主体区域固定为「深圳」，不可更换。」
steps:
  - action: goto
    target: /industry-center/shenzhen?workspace=comparison&tab=comparison
  - action: evaluate
    note: 进入对比配置页；点击主体「深圳」；尝试改写与清空
expect:
  - note: 主体区域保持「深圳」，呈只读锁定态
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/shenzhen?workspace=comparison&tab=comparison';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/深圳产业情况分析对比/.test(t);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
      }
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深圳对比深链 SPA404，无法验主体只读 ' + page.url());
      }
      await expect(page).toHaveURL(/\/industry-center\/shenzhen/);
      await expect(page).toHaveURL(/workspace=comparison/);
      await expect(page.getByText('主体区域', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('主体区域固定为「深圳」，不可更换。').first()).toBeVisible({ timeout: 8000 });
      const candidates = page.locator('main input.arco-input');
      let subject = null;
      for (let i = 0; i < await candidates.count(); i++) {
        const el = candidates.nth(i);
        const v = await el.inputValue().catch(() => '');
        const ro = await el.getAttribute('readonly');
        if (v === '深圳' && ro !== null) {
          subject = el;
          break;
        }
      }
      if (!subject) throw new Error('未见只读主体「深圳」');
      await subject.click({ timeout: 5000 });
      await expect(subject).toHaveValue('深圳');
      if (await subject.isEditable()) throw new Error('主体 input 可编辑');
  - note: 输入其他地区名与清空均无法更改该值
    assert: |-
      const candidates = page.locator('main input.arco-input');
      let subject = null;
      for (let i = 0; i < await candidates.count(); i++) {
        const c = candidates.nth(i);
        if ((await c.inputValue().catch(() => '')) === '深圳') {
          subject = c;
          break;
        }
      }
      if (!subject) throw new Error('主体 input 丢失');
      await subject.click({ force: true }).catch(() => {});
      await subject.fill('北京').catch(() => {});
      await page.waitForTimeout(300);
      if ((await subject.inputValue()) !== '深圳') {
        throw new Error('主体被改写为 ' + (await subject.inputValue()));
      }
      await subject.fill('').catch(() => {});
      await page.waitForTimeout(300);
      if ((await subject.inputValue()) !== '深圳') {
        throw new Error('主体可被清空，当前值=' + (await subject.inputValue()));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 主体为 form-item「主体区域」下 readonly input value=深圳；旁 alert「主体区域固定为「深圳」，不可更换。」；route=catalog_path（entry-seed）。edu 2026-10-20 深链可能 SPA404，与 FUNC-00732 同瓶颈。
