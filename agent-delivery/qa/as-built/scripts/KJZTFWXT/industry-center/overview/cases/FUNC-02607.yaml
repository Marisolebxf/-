id: FUNC-02607
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02607
priority: P1
title: 点击移出对比篮后按钮回到加入对比篮
entry_id: chain-overview
tier: A
preconditions:
  - 按钮文案为「移出对比篮」
locators:
  join: button「加入对比篮」/「移出对比篮」
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 前置满足后点击「移出对比篮」
expect:
  - note: 前置：按钮文案为「移出对比篮」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/overview/, { timeout: 15000 });
      const join = page.getByRole('button', { name: /加入对比篮|移出对比篮/ }).first();
      await expect(join).toBeVisible({ timeout: 8000 });
      let label = (await join.innerText()).trim();
      if (label.includes('加入')) {
        await page.getByRole('button', { name: '加入对比篮', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
      }
      await expect(page.getByRole('button', { name: '移出对比篮', exact: true })).toBeVisible({ timeout: 8000 });
  - note: 步骤：点击「移出对比篮」
    assert: |-
      await page.getByRole('button', { name: '移出对比篮', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
  - note: 1、按钮文案变为「加入对比篮」
    assert: |-
      const joinBtn = page.getByRole('button', { name: '加入对比篮', exact: true });
      await expect(joinBtn).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '移出对比篮', exact: true })).toHaveCount(0);
  - note: 2、不出现确认弹层
    assert: |-
      const modal = page.locator('.arco-modal-wrapper:visible, .arco-popconfirm-popup:visible');
      const mc = await modal.count();
      if (mc > 0) {
        throw new Error('点击移出对比篮不应弹出确认层，现场可见弹层 ' + mc + ' 个');
      }
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/overview；深链进入。前置若仍为「加入对比篮」则先点加入再验移出态（与 02598 对称）。
  已入篮按钮完整文案「移出对比篮」（testdata join_button.names、scout-after-join.json）。现场无确认框（用例备注）。
  对比篮浮层可见才关；登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
