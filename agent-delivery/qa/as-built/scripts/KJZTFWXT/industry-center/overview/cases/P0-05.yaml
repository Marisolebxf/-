id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01131
priority: P0
title: 三 Tab 互斥切换同一时刻仅一个选中
entry_id: chain-overview
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入专题全景页（深链 /industry-center/overview）
locators:
  tablist: '[role=tablist][aria-label=专题全景视图]'
  tab_panorama: '#industry-overview-tab-panorama（现场无 data-tab-key）'
  tab_news: '#industry-overview-tab-news'
  tab_profile: '#industry-overview-tab-profile'
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 关闭对比篮浮层（若可见）后在专题全景视图 tablist 内依次点资讯/概况/全景，回读选中态互斥与内容区不叠加
expect:
  - note: 同一时刻仅一个 Tab 呈选中态
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const mode = page.locator('[aria-label="专题全景视图"]'); const tabs = mode.locator('[role=tab]'); await expect(tabs).toHaveCount(3, { timeout: 8000 }); const clickAndAssertOne = async (idx, label, urlRe) => { await tabs.nth(idx).click(); await page.waitForTimeout(500); await expect(mode.locator('[role=tab][aria-selected="true"]')).toHaveCount(1); const sel = tabs.nth(idx); const aria = await sel.getAttribute('aria-selected'); const cls = await sel.getAttribute('class'); if (aria !== 'true' && !(cls || '').includes('active')) throw new Error(label + ' 未选中'); const others = [0, 1, 2].filter((i) => i !== idx); for (const i of others) { const a = await tabs.nth(i).getAttribute('aria-selected'); const c = await tabs.nth(i).getAttribute('class'); if (a === 'true' || (c || '').includes('active')) throw new Error('切换到' + label + '后仍有其它 Tab 选中: idx=' + i) }; if (urlRe) await expect(page).toHaveURL(urlRe) }; await clickAndAssertOne(1, '产业资讯', /[?&]tab=news/); await clickAndAssertOne(2, '产业整体概况', /[?&]tab=profile/); await clickAndAssertOne(0, '产业链全景', /[?&]tab=panorama/)
  - note: 内容区不叠加呈现多个 Tab 内容
    assert: |-
      const mode = page.locator('[aria-label="专题全景视图"]'); const tabs = mode.locator('[role=tab]'); await tabs.nth(1).click(); await page.waitForTimeout(500); await expect(page.getByText('全部类型', { exact: true }).first()).toBeVisible({ timeout: 8000 }); if (await page.getByRole('button', { name: '进入全景图谱' }).isVisible().catch(() => false)) throw new Error('资讯态仍见进入全景图谱'); if (await page.getByText('关键指标', { exact: true }).first().isVisible().catch(() => false)) throw new Error('资讯态仍见关键指标'); await tabs.nth(2).click(); await page.waitForTimeout(500); await expect(page.getByText('关键指标', { exact: true }).first()).toBeVisible({ timeout: 8000 }); if (await page.getByRole('button', { name: '进入全景图谱' }).isVisible().catch(() => false)) throw new Error('概况态仍见进入全景图谱'); if (await page.getByText('全部类型', { exact: true }).first().isVisible().catch(() => false)) throw new Error('概况态仍见全部类型'); await tabs.nth(0).click(); await page.waitForTimeout(500); await expect(page.getByRole('button', { name: '进入全景图谱' })).toBeVisible({ timeout: 8000 }); if (await page.getByText('全部类型', { exact: true }).first().isVisible().catch(() => false)) throw new Error('全景态仍见全部类型'); if (await page.getByText('关键指标', { exact: true }).first().isVisible().catch(() => false)) throw new Error('全景态仍见关键指标')
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: 实勘主区三 Tab 在 [role=tablist][aria-label=专题全景视图]，优先查 data-tab-key 后确认现场无；稳定 id=industry-overview-tab-panorama/news/profile；选中靠 aria-selected=true + class 含 active。URL ?tab=news / profile / panorama。内容区互斥锚点：资讯见「全部类型」、概况见「关键指标」、全景见「进入全景图谱」；「Tab 内不再提供产业切换」三态皆可见不可作互斥锚。对比篮浮层另有系统级 tab，禁全页 getByRole('tab') 裸取。资讯/概况内容深验 observed（开放项 3）；切回归 01136（P1-02）；共用筛选归 01132（P0-09）。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
