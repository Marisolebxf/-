id: FUNC-02598
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02598
priority: P0
title: 点击加入对比篮后按钮改为移出对比篮
entry_id: chain-overview
tier: A
preconditions:
  - 产业链为「半导体与集成电路」
  - 按钮文案为「加入对比篮」
locators:
  chain: .industry-overview-chain-select
  join: button「加入对比篮」/「移出对比篮」
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 前置满足后点击「加入对比篮」
expect:
  - note: 前置：产业链为「半导体与集成电路」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/overview/, { timeout: 15000 });
      const chain = page.locator('.industry-overview-chain-select');
      await expect(chain).toBeVisible({ timeout: 8000 });
      const chainTxt = (await chain.innerText()).replace(/\s+/g, ' ');
      if (!/半导体与集成电路/.test(chainTxt)) {
        throw new Error('前置：产业链应为「半导体与集成电路」，实际：' + chainTxt);
      }
  - note: 前置：按钮文案为「加入对比篮」
    assert: |-
      const join = page.getByRole('button', { name: /加入对比篮|移出对比篮/ }).first();
      await expect(join).toBeVisible({ timeout: 8000 });
      let label = (await join.innerText()).trim();
      if (label.includes('移出')) {
        await join.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await expect(page.getByRole('button', { name: '加入对比篮' })).toBeVisible({ timeout: 8000 });
      }
      await expect(page.getByRole('button', { name: '加入对比篮', exact: true })).toBeVisible({ timeout: 8000 });
  - note: 步骤：点击「加入对比篮」
    assert: |-
      await page.getByRole('button', { name: '加入对比篮', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
  - note: 1、按钮文案变为「移出对比篮」
    assert: |-
      const removeBtn = page.getByRole('button', { name: '移出对比篮', exact: true });
      await expect(removeBtn).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '加入对比篮', exact: true })).toHaveCount(0);
  - note: 即时切换，无确认弹层
    assert: |-
      const modal = page.locator('.arco-modal-wrapper:visible, .arco-popconfirm-popup:visible');
      const mc = await modal.count();
      if (mc > 0) {
        throw new Error('点击加入对比篮不应弹出确认层，现场可见弹层 ' + mc + ' 个');
      }
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/overview；深链进入。默认 boot 产业链已为「半导体与集成电路」。
  若会话残留已入篮态，前置先点「移出对比篮」还原再验「加入对比篮」。已加入后完整文案「移出对比篮」（scout-after-join.json）。
  对比篮浮层可见才关；不写评审追溯进 assert。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
