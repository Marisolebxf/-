id: FUNC-02593
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02593
priority: P1
tier: B
title: 主流程-全景默认文案
entry_id: chain-overview
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/overview
  - action: wait
    timeout_ms: 2000
    for: 产业链全景 Tab 与快照加载
expect:
  - note: 标题为「半导体与集成电路产业链全景」
    assert: |-
      await expect(page.locator('.industry-overview-page').getByRole('heading', { name: '半导体与集成电路产业链全景' })).toBeVisible()
  - note: 说明为「默认展示 L1 子链；点击细分产业查看简介与企业列表，可继续结构下钻。」
    assert: |-
      await expect(page.locator('.industry-overview-page').getByText('默认展示 L1 子链；点击细分产业查看简介与企业列表，可继续结构下钻。')).toBeVisible()
  - note: 写明 6 个链位环节和 5 条关系
    assert: |-
      const panel = page.locator('.industry-overview-page');
      await expect(panel).toContainText('6 个链位环节');
      await expect(panel).toContainText('5 条关系');
on_fail: 截图 + 抄 X-Trace-Id
