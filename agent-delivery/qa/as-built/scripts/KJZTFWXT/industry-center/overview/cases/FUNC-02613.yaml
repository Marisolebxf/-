id: FUNC-02613
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02613
priority: P1
title: 产业资讯的类型选框给出固定类型
entry_id: chain-overview
tier: B
preconditions:
  - 当前为「产业资讯」
locators:
  tablist: '[aria-label="专题全景视图"]'
  tab_news: '#industry-overview-tab-news'
  news_type: '[aria-label="资讯类型"]'
  news_panel: '[data-frame-id="F-OV-02"]'
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 进入「产业资讯」并展开资讯类型选框，校验 4 项固定类型
expect:
  - note: 前置：当前为「产业资讯」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/overview/, { timeout: 15000 });
      const mode = page.locator('[aria-label="专题全景视图"]');
      await mode.getByRole('tab', { name: '产业资讯' }).click();
      await page.waitForTimeout(600);
      await expect(page).toHaveURL(/[?&]tab=news/, { timeout: 8000 });
      const newsTab = page.locator('#industry-overview-tab-news');
      const aria = await newsTab.getAttribute('aria-selected');
      const cls = await newsTab.getAttribute('class');
      if (aria !== 'true' && !(cls || '').includes('active')) {
        throw new Error('前置：「产业资讯」Tab 未选中');
      }
      await expect(page.locator('[data-frame-id="F-OV-02"]')).toBeVisible({ timeout: 10000 });
  - note: 1、展开类型选框后选项共 4 个：全部类型、政策、创新、产业
    assert: |-
      const expected = ['全部类型', '政策', '创新', '产业'];
      const typeSel = page.locator('[aria-label="资讯类型"]');
      await expect(typeSel).toBeVisible({ timeout: 8000 });
      await typeSel.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popup = page.locator('.arco-trigger-popup:visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const opts = popup.locator('.arco-select-option');
      const count = await opts.count();
      if (count !== 4) {
        throw new Error('资讯类型选项应为 4 个，实际 ' + count);
      }
      const labels = [];
      for (let i = 0; i < count; i++) {
        labels.push(((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      for (const name of expected) {
        if (!labels.includes(name)) {
          throw new Error('缺少类型选项「' + name + '」；实际：' + labels.join('、'));
        }
      }
      if (labels.join('|') !== expected.join('|')) {
        throw new Error('选项顺序或文案不符；期望 ' + expected.join('、') + '；实际 ' + labels.join('、'));
      }
      await page.keyboard.press('Escape');
      await page.waitForTimeout(300);
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/overview；资讯区 F-OV-02，类型筛选 aria-label=资讯类型（Arco Select 可见 view，P7）。
  固定四项与用例册附录及 lumen-ui-topic IndustryOverviewPage NEWS_TYPE_OPTIONS 一致；scout-tab-资讯 默认展示「全部类型」。
  登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
