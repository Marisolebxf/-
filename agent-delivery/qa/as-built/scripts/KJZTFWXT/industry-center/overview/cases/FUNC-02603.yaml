id: FUNC-02603
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02603
priority: P0
title: 发展历程空态
entry_id: chain-overview
tier: A
preconditions:
  - 已进入专题全景
locators:
  tablist: '[aria-label="专题全景视图"]'
  tab_profile: '#industry-overview-tab-profile'
  profile_panel: '[data-frame-id="F-OV-03"]'
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 点击「产业整体概况」，校验「发展历程」空态文案
expect:
  - note: 步骤：点击「产业整体概况」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/overview/, { timeout: 15000 });
      const mode = page.locator('[aria-label="专题全景视图"]');
      await mode.getByRole('tab', { name: '产业整体概况' }).click();
      await page.waitForTimeout(600);
      await expect(page).toHaveURL(/[?&]tab=profile/, { timeout: 8000 });
      const profTab = page.locator('#industry-overview-tab-profile');
      const aria = await profTab.getAttribute('aria-selected');
      const cls = await profTab.getAttribute('class');
      if (aria !== 'true' && !(cls || '').includes('active')) {
        throw new Error('点击后「产业整体概况」Tab 未选中');
      }
      const panel = page.locator('[data-frame-id="F-OV-03"]');
      await expect(panel).toBeVisible({ timeout: 10000 });
  - note: 1、「发展历程」为「暂无 CMS 历程，不以资讯冒充」
    assert: |-
      const panel = page.locator('[data-frame-id="F-OV-03"]');
      await expect(panel.getByRole('heading', { name: '发展历程', level: 2 })).toBeVisible({
        timeout: 8000,
      });
      const emptyDesc = panel.getByText('暂无 CMS 历程，不以资讯冒充', { exact: true });
      await expect(emptyDesc).toBeVisible({ timeout: 8000 });
      const timeline = panel.locator('.arco-timeline');
      const tlCount = await timeline.count();
      if (tlCount > 0) {
        const vis = await timeline.first().isVisible().catch(() => false);
        if (vis) throw new Error('无 CMS 历程稿时不应展示时间轴，现场可见 .arco-timeline');
      }
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/overview；概况区 data-frame-id=F-OV-03，Tab id=industry-overview-tab-profile，URL ?tab=profile。
  historyItems 为空时 a-empty description=「暂无 CMS 历程，不以资讯冒充」（IndustryOverviewPage.vue）；与「产业介绍」空态文案区分。
  登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
