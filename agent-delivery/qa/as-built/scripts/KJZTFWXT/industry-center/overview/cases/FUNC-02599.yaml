id: FUNC-02599
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02599
priority: P0
title: 产业资讯默认按全部类型列出并提供查看详情
entry_id: chain-overview
tier: A
preconditions:
  - 已进入专题全景
locators:
  tablist: '[aria-label="专题全景视图"]'
  tab_news: '#industry-overview-tab-news'
  news_type: '[aria-label="资讯类型"]'
  news_panel: '[data-frame-id="F-OV-02"]'
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 点击「产业资讯」Tab，校验类型默认与列表「查看详情」
expect:
  - note: 步骤：点击「产业资讯」进入资讯视图
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/overview/, { timeout: 15000 });
      const mode = page.locator('[aria-label="专题全景视图"]');
      await mode.getByRole('tab', { name: '产业资讯' }).click();
      await page.waitForTimeout(600);
      await expect(page).toHaveURL(/[?&]tab=news/, { timeout: 8000 });
      const newsTab = page.locator('#industry-overview-tab-news');
      const aria = await newsTab.getAttribute('aria-selected');
      const cls = await newsTab.getAttribute('class');
      if (aria !== 'true' && !(cls || '').includes('active')) {
        throw new Error('点击后「产业资讯」Tab 未选中');
      }
      await expect(page.locator('[data-frame-id="F-OV-02"]')).toBeVisible({ timeout: 10000 });
      await expect(page.getByRole('heading', { name: '产业资讯', level: 2 })).toBeVisible({
        timeout: 8000,
      });
  - note: 1、类型选框默认「全部类型」
    assert: |-
      const typeSel = page.locator('[aria-label="资讯类型"]');
      await expect(typeSel).toBeVisible({ timeout: 8000 });
      const typeTxt = (await typeSel.innerText()).replace(/\s+/g, ' ').trim();
      if (!typeTxt.includes('全部类型')) {
        throw new Error('资讯类型选框默认应为「全部类型」，实际：' + typeTxt);
      }
  - note: 2、列表中有「查看详情」（不钉死条数与标题）
    assert: |-
      const newsPanel = page.locator('[data-frame-id="F-OV-02"]');
      await expect(newsPanel).toBeVisible({ timeout: 8000 });
      const empty = newsPanel.getByText('当前筛选无事件', { exact: true });
      if (await empty.isVisible().catch(() => false)) {
        throw new Error('全部类型下资讯列表为空，无法验证「查看详情」');
      }
      const detailBtn = newsPanel.getByRole('button', { name: '查看详情' });
      await expect(detailBtn.first()).toBeVisible({ timeout: 10000 });
      const n = await detailBtn.count();
      if (n < 1) throw new Error('列表中应至少有一条「查看详情」，实际 count=' + n);
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  路由 catalog_path /industry-center/overview；资讯区 data-frame-id=F-OV-02，类型筛选 aria-label=资讯类型，默认 v-model=all 展示「全部类型」。
  列表 .industry-overview-news-timeline 内每条卡片 a-button「查看详情」；空态「当前筛选无事件」视为 FAIL（本环境应有 demo 资讯）。
  登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
