id: FUNC-02592
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02592
priority: P0
tier: B
title: 主流程-筛选区
entry_id: chain-overview
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 展开「产业链」选框
expect:
  - note: 1、选项共 6 个（名称见附录 A）
    assert: |-
      const expected = [
        '半导体与集成电路',
        '人工智能与应用',
        '新型网络与通信',
        '超高清视频与显示',
        '智能终端',
        '软件与信息服务',
      ];
      await expect(page).toHaveURL(/\/industry-center\/overview/, { timeout: 15000 });
      const chainView = page
        .locator('.industry-overview-context__label')
        .filter({ has: page.getByText('产业链', { exact: true }) })
        .locator('.arco-select-view');
      await expect(chainView).toBeVisible({ timeout: 15000 });
      await expect(chainView).toContainText('半导体与集成电路', { timeout: 15000 });
      await chainView.scrollIntoViewIfNeeded();
      await page.keyboard.press('Escape');
      await page.waitForTimeout(200);
      await chainView.click({ timeout: 15000, force: true });
      const popup = page.locator('.arco-select-dropdown:visible').last();
      await expect(popup).toBeVisible({ timeout: 10000 });
      const raw = await popup.locator('.arco-select-option').evaluateAll((nodes) =>
        nodes
          .map((n) => {
            const c = n.querySelector('.arco-select-option-content');
            const t = (c ? c.textContent : n.textContent) || '';
            return t.trim().replace(/\s+/g, ' ');
          })
          .filter(Boolean),
      );
      const normalized = [...new Set(raw)];
      if (normalized.length !== 6) {
        throw new Error('产业链选项个数应为 6，实际 ' + normalized.length + '：' + normalized.join('、'));
      }
      const missing = expected.filter((name) => !normalized.includes(name));
      const extra = normalized.filter((name) => !expected.includes(name));
      if (missing.length || extra.length) {
        throw new Error(
          '产业链选项与附录 A 不一致；缺失：' + (missing.join('、') || '无') +
          '；多余：' + (extra.join('、') || '无') +
          '；现场：' + normalized.join('、'),
        );
      }
on_fail: 截图 + 抄 X-Trace-Id
