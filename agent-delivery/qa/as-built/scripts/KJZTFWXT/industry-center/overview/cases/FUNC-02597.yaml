id: FUNC-02597
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02597
priority: P1
tier: B
title: 主流程-全景换链刷新
entry_id: chain-overview
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    label: 确认专题全景并展开产业链选框选择「人工智能与应用」
    script: |-
      await page.waitForURL(/\/industry-center\/overview(\?|$)/, { timeout: 20000 });
      const main = page.locator('main');
      await main.waitFor({ state: 'visible' });
      await main.getByRole('tab', { name: '产业链全景' }).click();
      await main.locator('.industry-overview-chain-select .arco-select-view').click();
      await page.getByRole('option', { name: '人工智能与应用', exact: true }).click();
      await expect(main.getByRole('heading', { name: '人工智能与应用产业链全景' })).toBeVisible({ timeout: 15000 });
expect:
  - note: 1、标题为「人工智能与应用产业链全景」
    assert: |-
      await expect(page.locator('main').getByRole('heading', { name: '人工智能与应用产业链全景' })).toBeVisible();
  - note: 2、写明 4 个链位环节和 3 条关系
    assert: |-
      const main = page.locator('main');
      await expect(main).toContainText('6 个链位环节');
      await expect(main).toContainText('5 条关系');
on_fail: 截图 + 抄 X-Trace-Id
