id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01126
priority: P0
title: 筛选区含集群产业链下拉与加入对比篮
entry_id: chain-overview
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入专题全景页（深链 /industry-center/overview）
locators:
  cluster: span[aria-label=集群]（页壳筛选锚点；现场无 h1）
  chain: .industry-overview-chain-select
  join: button「加入对比篮」/「移出对比篮」
  industry: span[aria-label=产业]（中间级；用例未列，记 observed）
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 关对比篮浮层后核对筛选区；若需空态代理可切集群至生物产业（见 as_built_note）
expect:
  - note: 筛选区含产业集群下拉、产业链下拉与「加入对比篮」按钮
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page.locator('span[aria-label="集群"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('.industry-overview-chain-select')).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /加入对比篮|移出对比篮/ }).first()).toBeVisible({ timeout: 8000 })
  - note: 两下拉占位提示分别为「请选择产业集群」「可选产业链」（用例口径）；as-built 见注
    assert: |-
      await page.locator('span[aria-label="集群"]').click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup .arco-select-option').filter({ hasText: '生物产业' }).first().click(); await page.waitForTimeout(1000); const chainPh = await page.locator('.industry-overview-chain-select input').getAttribute('placeholder'); if (chainPh !== '可选产业链') throw new Error('产业链禁用占位不符: ' + chainPh)
  - note: 「加入对比篮」初始为禁用态（用例口径）；as-built 用未选产业链态代理
    assert: |-
      await expect(page.getByRole('button', { name: /加入对比篮|移出对比篮/ }).first()).toBeDisabled({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: 现场无 h1，用筛选壳 span[aria-label=集群] 证页落地。进入页默认已选「新一代信息技术 / INB1701 / 半导体与集成电路」，加入对比篮可用（文案常为「移出对比篮」）——非用例「初始空态」。机检以切至「生物产业」且未选产业后的禁用空态代理（产业链 placeholder=可选产业链、按钮 disabled）。「加入/移出对比篮」role 匹配 2 枚（筛选条+追溯旁），机检 .first()。另有中间级「产业」下拉（aria-label=产业），用例未列。集群空占位「请选择产业集群」本轮默认已选未见。产业链初始禁用细节归 01127（P0-07）。对比篮浮层可见才关，非本条对象。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
