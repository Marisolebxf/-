id: FUNC-02591
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02591
priority: P0
title: 默认集群下产业右侧选框选项共 7 个
entry_id: chain-overview
tier: A
preconditions:
  - 已进入专题全景
  - 左侧选框为「新一代信息技术」
locators:
  cluster: span[aria-label=集群]
  industry: span[aria-label=产业]（P7 点可见 view）
  industry_popup: .arco-trigger-popup:visible .arco-select-option
steps:
  - action: goto
    target: /industry-center/overview
  - action: evaluate
    note: 确认集群为新一代信息技术后展开产业右侧选框；选项个数与附录 A 在 expect 判定
expect:
  - note: 1、选项共 7 个（名称见附录 A）
    assert: |-
      const expected = [
        '新一代信息技术',
        '半导体与集成电路',
        '人工智能与应用',
        '智能终端',
        '软件与信息服务',
        '新型网络与通信',
        '超高清视频与显示',
      ];
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      }
      await expect(page.locator('span[aria-label="集群"]')).toBeVisible({ timeout: 10000 });
      const clusterTxt = await page.locator('span[aria-label="集群"]').innerText();
      if (!/新一代信息技术/.test(clusterTxt)) {
        throw new Error('前置：左侧集群应为「新一代信息技术」，实际 ' + clusterTxt);
      }
      await expect(page.locator('span[aria-label="产业"]')).toBeVisible({ timeout: 8000 });
      await page.locator('span[aria-label="产业"]').click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popup = page.locator('.arco-trigger-popup:visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const options = await popup.locator('.arco-select-option').allTextContents();
      const normalized = [...new Set(options.map((t) => t.trim().replace(/\s+/g, ' ')).filter(Boolean))];
      if (normalized.length !== 7) {
        throw new Error('产业选项个数应为 7，实际 ' + normalized.length + '：' + normalized.join('、'));
      }
      const missing = expected.filter((name) => !normalized.includes(name));
      const extra = normalized.filter((name) => !expected.includes(name));
      if (missing.length || extra.length) {
        throw new Error(
          '产业选项与附录 A 不一致；缺失：' + (missing.join('、') || '无') +
          '；多余：' + (extra.join('、') || '无') +
          '；现场：' + normalized.join('、')
        );
      }
on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
as_built_note: >-
  用例步骤「展开产业后右侧选框」= 筛选区 aria-label 产业 的下拉（02589/02590 备注：左侧 a11y 名为集群）。
  默认集群「新一代信息技术」下产业 7 项与用例册附录 A、scout-industry-options 中链相关子集一致。
  路由 catalog_path /industry-center/overview。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
