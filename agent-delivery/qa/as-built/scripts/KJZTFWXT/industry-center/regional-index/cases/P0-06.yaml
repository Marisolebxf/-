id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00565
priority: P0
title: 评价区域多选去重与上限及汇总回显
entry_id: chain-regional-index
preconditions:
- 已进入页面；单产业 × 多区域；评审关闭
locators:
  region: .arco-select-view-multiple 评价区域
steps:
- action: goto
  target: /industry-center/regional?workspace=index&tab=index
- action: wait
  for: 区域默认「深圳市」或可展开选项
- action: click
  target: 区域下拉
- action: evaluate
  note: 勾选北京/杭州等并回读汇总
expect:
- note: 评价区域为多选且选项含广东省、深圳市、北京市、上海市、杭州市（以现场为准）
  assert: |-
    await page.goto('/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); const region = page.locator('.arco-select-view-multiple').first(); await expect(region).toBeVisible({ timeout: 8000 }); await region.click(); await page.waitForTimeout(700); const pop = page.locator('.arco-trigger-popup').filter({ hasText: /深圳|广东|北京/ }).last(); await expect(pop).toBeVisible({ timeout: 8000 }); for (const n of ['广东省','深圳市','北京市','上海市','杭州市']) await expect(pop.getByText(n, { exact: true }).first()).toBeVisible({ timeout: 5000 })
- note: 同一区域不可重复添加且所选区域在汇总回显
  assert: |-
    const pop = page.locator('.arco-trigger-popup').filter({ hasText: /深圳|北京/ }).last(); await pop.getByText('北京市', { exact: true }).first().click(); await page.waitForTimeout(400); await page.keyboard.press('Escape'); await page.waitForTimeout(500); await expect(page.getByText(/已计入/).first()).toBeVisible({ timeout: 8000 }); const sum = await page.locator('main').innerText(); if (!/北京/.test(sum) && !/深圳/.test(sum)) throw new Error('汇总未见区域回显')
- note: 区域数量限制 1–5、超上限不可再加
  assert: |-
    const region = page.locator('.arco-select-view-multiple').first(); await region.click(); await page.waitForTimeout(500); const pop = page.locator('.arco-trigger-popup').filter({ hasText: /深圳|广东|北京|上海|杭州/ }).last(); for (const n of ['广东省','上海市','杭州市']) { const o = pop.getByText(n, { exact: true }).first(); if (await o.count()) await o.click().catch(()=>{}) ; await page.waitForTimeout(200) } await page.keyboard.press('Escape'); await page.waitForTimeout(400); const tags = await region.locator('.arco-tag, .arco-select-view-value').count().catch(()=>0); const text = await region.innerText(); const named = ['广东','深圳','北京','上海','杭州'].filter(n => text.includes(n)); if (named.length > 5) throw new Error('区域超过 5: ' + text)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 默认已含深圳市；选项需点开 multi 下拉。区域对象不进对比篮（系统级）。若下拉瞬态「暂无数据」属加载竞态，应重试 wait。
tier: B
