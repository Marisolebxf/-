id: FUNC-02991
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02991
priority: P0
tier: B
title: 主流程-指标表列与默认六行
entry_id: chain-regional-index
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
expect:
  - note: 表头含计入、指标名称、分组 / 维度、数据状态、参数值或权重、数据来源、指标说明、操作
    assert: |-
      const table = page.locator('[data-testid="regional-index-weight-table"]');
      await expect(table.getByRole('columnheader', { name: '计入' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '指标名称' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '分组 / 维度' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '数据状态' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '参数值或权重' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '数据来源' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '指标说明' })).toBeVisible();
      await expect(table.getByRole('columnheader', { name: '操作' })).toBeVisible();
  - note: 默认六行名称见附录C
    assert: |-
      const table = page.locator('[data-testid="regional-index-weight-table"]');
      for (const name of ['企业商业化能力', '融资事件', '专利', '技术成熟度', '科研机构', '政策覆盖率']) {
        await expect(table.getByText(name, { exact: true })).toBeVisible();
      }
  - note: 权重依次为 16%、16%、16%、16%、16%、20%
    assert: |-
      const table = page.locator('[data-testid="regional-index-weight-table"]');
      const spins = table.locator('.arco-input-number input');
      await expect(spins).toHaveCount(6);
      const weights = ['16', '16', '16', '16', '16', '20'];
      for (let i = 0; i < weights.length; i++) {
        await expect(spins.nth(i)).toHaveValue(weights[i]);
      }
on_fail: 截图 + 抄 X-Trace-Id
