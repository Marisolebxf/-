id: FUNC-03015
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03015
priority: P1
title: 分析记录翻到第 2 页
entry_id: chain-regional-index
tier: B
preconditions:
  - 分析记录总数多于 10 条（assert 自含数据闸门）
locators:
  tab_records: tab「分析记录」
  records_pagination: .diagnosis-records .arco-pagination
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 分析记录 Tab→点分页「2」；列表换批与页大小在 expect
expect:
  - note: 前置：分析记录 Tab；总条数可翻到第 2 页；记下第 1 页首行 CHAIN 任务号
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const main = () => page.locator('main').first();
      const recordsTable = () => main().locator('.arco-table').first();
      const recordsPagination = () => main().locator('.arco-pagination').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const firstVisibleRowTaskId = async () => {
        const rows = recordsTable().locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const m = t.match(TID_RE);
          if (m) return m[0];
        }
        return '';
      };
      const bodyIs404 = async () => {
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(bodyGate);
      };
      const throwEnv404 = (where) => {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 @' + where + ' ' + page.url());
      };
      const enterViaSidebar = async () => {
        const u = new URL('/industry-center/search', baseUrl);
        await page.goto(u.toString(), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await dismissBasket();
        if (await bodyIs404()) throwEnv404('sibling-search');
        const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^区域产业指数评价$/ });
        const expandChain = async () => {
          if (await leaf().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await expandChain();
        await expect(leaf().first()).toBeVisible({ timeout: 10000 });
        await leaf().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
        await expect(page).toHaveURL(/workspace=index/);
        await expect(page).toHaveURL(/tab=index/);
      };
      await dismissBasket();
      if (await bodyIs404()) {
        await enterViaSidebar();
      }
      if (await bodyIs404()) throwEnv404('catalog-deep-link');
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      await expect(main().getByText('分析记录').first()).toBeVisible({ timeout: 8000 });
      const bodyRec = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!TID_RE.test(bodyRec)) {
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-RECORDS: 分析记录无 CHAIN 任务行');
      }
      const pag = recordsPagination();
      const page2Btn = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 =
        ((await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false))) ||
        (await pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').count()) > 0;
      if (!hasPage2) {
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-PAGE2-001：分析记录总条数未超过 10，无法翻到第 2 页');
      }
      const taskPage1 = await firstVisibleRowTaskId();
      if (!taskPage1) {
        throw new Error('第 1 页首行未见任务编号 CHAIN-*');
      }
      globalThis.__func03015 = {
        taskPage1,
        main,
        recordsTable,
        recordsPagination,
        TID_RE,
      };
  - note: 1、点页码「2」后列表换成另一批任务（第 2 页首行 CHAIN 与第 1 页首行不同）
    assert: |-
      const ctx = globalThis.__func03015;
      if (!ctx) throw new Error('前置：分析记录翻页未就绪');
      const clickPageNum = async (num) => {
        const pag = ctx.recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const btn = pag.locator('.arco-pagination-item').filter({ hasText: new RegExp('^\\s*' + num + '\\s*$') }).first();
        if ((await btn.count()) > 0 && (await btn.isVisible().catch(() => false))) {
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(900);
          return;
        }
        if (num === 2) {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) && (await next.isVisible().catch(() => false))) {
            await next.click({ timeout: 8000 });
            await page.waitForTimeout(900);
            return;
          }
        }
        throw new Error('分页「' + num + '」不可点');
      };
      await clickPageNum(2);
      const pag = ctx.recordsPagination();
      const active = ((await pag.locator('.arco-pagination-item-active').first().innerText()) || '').trim();
      if (active !== '2') {
        throw new Error('翻页后当前页应为 2，现场 active=' + (active || '(空)'));
      }
      const rows = ctx.recordsTable().locator('tbody tr, .arco-table-tr').filter({ hasText: ctx.TID_RE });
      let taskPage2 = '';
      const n = await rows.count();
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        if (!(await row.isVisible().catch(() => false))) continue;
        const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = t.match(ctx.TID_RE);
        if (m) {
          taskPage2 = m[0];
          break;
        }
      }
      if (!taskPage2) {
        throw new Error('第 2 页首行未见任务编号 CHAIN-*');
      }
      if (taskPage2 === ctx.taskPage1) {
        throw new Error('第 2 页首行任务与第 1 页相同：' + taskPage2);
      }
  - note: 2、页大小为 10 条/页（分页区回显 + 当前页可见 CHAIN 行数 ≤10）
    assert: |-
      const ctx = globalThis.__func03015;
      if (!ctx) throw new Error('前置：分析记录未就绪');
      const secText = ((await ctx.main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/10\s*条\s*\/\s*页/.test(secText)) {
        throw new Error('分页区未见「10 条/页」：' + secText.slice(0, 200));
      }
      const rows = ctx.recordsTable().locator('tbody tr, .arco-table-tr').filter({ hasText: ctx.TID_RE });
      let visible = 0;
      const n = await rows.count();
      for (let i = 0; i < n; i++) {
        if (await rows.nth(i).isVisible().catch(() => false)) visible++;
      }
      if (visible < 1) {
        throw new Error('第 2 页未见可见 CHAIN 任务行');
      }
      if (visible > 10) {
        throw new Error('当前页可见 CHAIN 行数超过 10：' + visible);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/regional?workspace=index&tab=index；edu 深链 404 时 sibling 侧栏进页（同 FUNC-03009）。步骤=Tab「分析记录」→分页点「2」（scout 默认 10 条/页）。
  机检=第 1 页 vs 第 2 页首可见行 CHAIN 不同；分页区含「10 条/页」且当前页可见 CHAIN 行≤10。无第 2 页→ENV-CHAIN-REGIONAL-INDEX-PAGE2-001。
  登录关评审 runner 前置。B 档零 allow_skip。不钉死总条数（用例注：现场曾为 19 条）。
