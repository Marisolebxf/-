id: FUNC-00564
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00564
priority: P0
tier: B
title: 主流程-产业选择：空态提示、未选提示与开始分析按钮态、选择回显
entry_id: chain-regional-index
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 已计入 6 项
    timeout_ms: 12000
  - action: evaluate
    note: 确保单产业模式；重置到产业未选空态（同册 03008 重置参数入口）
expect:
  - note: 未选产业时显示提示「单产业模式请选择 1 个产业」
    assert: |-
      await page.getByText('单产业 × 多区域', { exact: true }).first().click().catch(() => {});
      await page.waitForTimeout(400);
      await page.getByRole('button', { name: '重置参数' }).click().catch(() => {});
      await page.waitForTimeout(800);
      await expect(page.getByText('单产业模式请选择 1 个产业').first()).toBeVisible({ timeout: 8000 });
  - note: 未选产业时「开始分析」disabled 且不自动起任务
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeDisabled({ timeout: 8000 });
      if (/view=processing/.test(page.url())) throw new Error('未选产业却进入过程态: ' + page.url());
  - note: 产业下拉空态提示为「请选择产业」且选定后回显所选产业
    assert: |-
      const objectRow = page.locator('.policy-analysis-filter-row').filter({ hasText: '分析对象' }).first();
      await expect(objectRow.locator('input[placeholder="请选择产业"]').first()).toBeVisible({ timeout: 8000 });
      const industryView = objectRow.locator('.arco-select-view').nth(1);
      await industryView.click();
      await page.waitForTimeout(600);
      await page.locator('.arco-trigger-popup:visible .arco-select-option', { hasText: /^半导体与集成电路$/ }).first().click({ force: true });
      await page.waitForTimeout(1200);
      const indText = (await industryView.innerText()).trim();
      if (!indText || /请选择/.test(indText) || indText !== '半导体与集成电路') throw new Error('产业未回显半导体与集成电路: ' + indText);
on_fail: 截图 + 抄 X-Trace-Id
