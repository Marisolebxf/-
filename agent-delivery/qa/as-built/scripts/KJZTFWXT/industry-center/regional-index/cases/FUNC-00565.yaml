id: FUNC-00565
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00565
priority: P1
tier: B
title: 评价区域 1–5 多选、去重与汇总回显
entry_id: chain-regional-index
preconditions:
  - 已进入页面
  - 评价模式为「单产业 × 多区域」
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 评价区域（1–5）或已计入 6 项
    timeout_ms: 12000
expect:
  - note: 1、评价区域为多选且选项含广东省、深圳市、北京市、上海市、杭州市（以现场为准）
    assert: |-
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-ENTRY-UNREACHABLE: 区域产业指数评价 SPA 404 ' + page.url());
      }
      await expect(page.getByText('已计入 6 项').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('评价区域（1–5）', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const region = () =>
        page.locator('main .arco-form-item').filter({ has: page.getByText(/^评价区域/) }).locator('.arco-select-view').first();
      if (!(await region().evaluate((el) => el.className.includes('mult')))) {
        throw new Error('评价区域未呈多选');
      }
      await page.keyboard.press('Escape').catch(() => {});
      await region().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const popup = page.locator('.arco-trigger-popup:visible').first();
      await expect(popup).toBeVisible({ timeout: 5000 });
      for (const name of ['深圳市', '北京市', '上海市', '杭州市']) {
        await expect(popup.locator('.arco-select-option').filter({ hasText: name }).first()).toBeVisible({ timeout: 5000 });
      }
      await page.keyboard.press('Escape').catch(() => {});
      await page.waitForTimeout(300);
  - note: 2、同一区域不可重复添加且所选区域在汇总回显
    assert: |-
      await page.keyboard.press('Escape').catch(() => {});
      const region = () =>
        page.locator('main .arco-form-item').filter({ has: page.getByText(/^评价区域/) }).locator('.arco-select-view').first();
      const pick = async (name) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        await region().click({ timeout: 8000 });
        await page.waitForTimeout(350);
        const popup = page.locator('.arco-trigger-popup:visible').first();
        await expect(popup).toBeVisible({ timeout: 5000 });
        const opt = popup.locator('.arco-select-option').filter({ hasText: name }).first();
        await opt.click({ timeout: 5000 });
        await page.waitForTimeout(350);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const regionHas = async (name) => {
        const t = ((await region().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return t.includes(name);
      };
      for (const name of ['深圳市', '北京市', '杭州市']) {
        if (!(await regionHas(name))) await pick(name);
      }
      const tagN = await region().locator('.arco-tag').count();
      const regionText = ((await region().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (tagN < 3 && !/深圳市/.test(regionText)) throw new Error('勾选三城后区域回显不足');
      await expect(page.getByText(/深圳市.*北京市.*杭州市|深圳市、北京市、杭州市/).first()).toBeVisible({ timeout: 8000 });
      await pick('北京市');
      const beijingTags = await region().locator('.arco-tag').filter({ hasText: '北京市' }).count();
      if (beijingTags > 1) throw new Error('北京市出现重复 tag');
      if (beijingTags === 0) await pick('北京市');
      await expect(page.getByText(/深圳市.*杭州市/).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText(/北京市/).first()).toBeVisible({ timeout: 8000 });
  - note: 3、区域数量限制 1–5、超上限不可再加
    assert: |-
      await page.keyboard.press('Escape').catch(() => {});
      const region = () =>
        page.locator('main .arco-form-item').filter({ has: page.getByText(/^评价区域/) }).locator('.arco-select-view').first();
      const pick = async (name) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        await region().click({ timeout: 8000 });
        await page.waitForTimeout(350);
        const popup = page.locator('.arco-trigger-popup:visible').first();
        await expect(popup).toBeVisible({ timeout: 5000 });
        const opt = popup.locator('.arco-select-option').filter({ hasText: name }).first();
        await opt.click({ timeout: 5000 });
        await page.waitForTimeout(350);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
      };
      const regionHas = async (name) => {
        const t = ((await region().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return t.includes(name);
      };
      for (const name of ['深圳市', '北京市', '上海市', '杭州市', '武汉市']) {
        if (!(await regionHas(name))) await pick(name);
      }
      await expect(
        page.getByText(/深圳市.*北京市.*上海市.*杭州市.*武汉市|深圳市、北京市、上海市、杭州市、武汉市/).first(),
      ).toBeVisible({ timeout: 8000 });
      const tagN = await region().locator('.arco-tag').count();
      const regionText = ((await region().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const folded = /\+\d+\.\.\./.test(regionText);
      if (tagN > 5) throw new Error('可见 tag 超过 5: ' + tagN);
      if (tagN < 5 && !folded) throw new Error('加至上限后未达 5 城且无折叠: tag=' + tagN);
      const beforePick = ((await page.locator('main').innerText().catch(() => '')) || '').match(/未选产业 · ([^·]+) · 已计入/)?.[1] || '';
      const cityCount = beforePick.split('、').filter(Boolean).length;
      if (cityCount !== 5) throw new Error('汇总区域段应为 5 城，实际 ' + cityCount);
      await pick('合肥市');
      const afterPick = ((await page.locator('main').innerText().catch(() => '')) || '').match(/未选产业 · ([^·]+) · 已计入/)?.[1] || '';
      const afterCount = afterPick.split('、').filter(Boolean).length;
      if (afterCount > 5) throw new Error('超上限后汇总仍增至 ' + afterCount + ' 城');
      await expect(page.getByText('评价区域（1–5）', { exact: true }).first()).toBeVisible({ timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id
