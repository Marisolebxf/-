# P1-03（FUNC-00573 一键均分与权重非负数值校验）
# 落局：D3 skip（D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK）——env-gate overall=pass，
# 但切「当前未保存配置」后 spin 仍全 disabled（同 P0-07 2026-10-15 无头实勘
# after-custom spinDisabled=6/6）；一键均分不改变官方默认 16×5+20，填 0/负值/非法
# 均不可达。禁止假绿硬点 disabled。缺陷闭合且自定义态 spin 可写后：去掉
# allow_skip* / skip_reason / ticket，expect 全链转实（参照 P0-08/09 去 skip 路径）。
id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00573
priority: P1
title: 一键均分与权重非负数值校验
entry_id: chain-regional-index
tier: B
allow_skip: true
# 哨兵：与 P0-07 同债——着陆模板态启停必锁；runner goto 后 5s 探测未锁定 checkbox 不可见 → n/a。
# （spin 的 :not(.arco-input-number-disabled) 易误匹配仍 disabled 的 input，故不单独用 spin CSS。）
# 产品修好粘滞后须人工去掉本 allow_skip 块再 --only 转实（着陆仍模板锁，不能靠本 CSS 自转绿）。
allow_skip_target: 'main .arco-checkbox:not(.arco-checkbox-disabled)'
skip_reason: 'D3 产品缺陷 D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK——切「当前未保存配置」后 spin 仍全 disabled（同 P0-07 实勘 after-custom spinDisabled=6/6）；用例 00573 一键均分/填 0/拒负值非法字符均依赖可写权重，不可达；禁止假绿；缺陷闭合后去掉 allow_skip 转实。'
ticket: D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK
preconditions:
  - 已登录；env-gate overall=pass
  - 目标态需已切「当次自定义配置」/「当前未保存配置」且权重 spin 可写（当前粘滞只读，见 skip_reason）
  - 已计入指标 ≥1（着陆默认 6 项即可）
locators:
  template: 选择模板 → 当前未保存配置
  avg: button「一键均分」
  spins: main [role=spinbutton]
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
    note: 着陆后 allow_skip 探测未锁定 spin；粘滞现场 → n/a；闭合后去 skip 续跑 expect
  - action: wait
    for: 已计入 6 项
    timeout_ms: 12000
  - action: click
    target: 模板 → 当前未保存配置
  - action: evaluate
    note: 一键均分 + 填 0 + 拒负值/非法（机检以 expect 自含绝对 URL goto 为准）
expect:
  - note: 已计入指标权重均分且合计保持 100%（6 项时各项约 16.7%，显示精度以现场为准）
    assert: |-
      await page.goto('http://10.50.69.111:30892/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.locator('.arco-select-view').filter({ hasText: /区域产业指数官方模板|当前未保存配置/ }).first().click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup').getByText('当前未保存配置', { exact: true }).last().click({ force: true }); await page.waitForTimeout(900); const spins = page.locator('main [role=spinbutton]'); const n = Math.min(await spins.count(), 6); if (n < 1) throw new Error('无权重 spin'); const locked = await spins.first().evaluate(el => el.disabled || !!el.closest('.arco-input-number-disabled')).catch(()=>true); if (locked) throw new Error('自定义态权重仍锁定（D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK）'); await page.getByRole('button', { name: '一键均分' }).click(); await page.waitForTimeout(800); const vals = []; for (let i = 0; i < n; i++) vals.push(Number(await spins.nth(i).inputValue())); const sum = vals.reduce((a,b)=>a+b,0); if (Math.abs(sum - 100) > 1) throw new Error('均分后合计 ' + sum + ' vals=' + vals.join('/')); const max = Math.max(...vals), min = Math.min(...vals); if (max - min > 1) throw new Error('均分后离散过大: ' + vals.join('/'))
  - note: 单指标权重接受 0 等非负数值
    assert: |-
      await page.goto('http://10.50.69.111:30892/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.locator('.arco-select-view').filter({ hasText: /区域产业指数官方模板|当前未保存配置/ }).first().click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup').getByText('当前未保存配置', { exact: true }).last().click({ force: true }); await page.waitForTimeout(900); const spins = page.locator('main [role=spinbutton]'); const locked = await spins.first().evaluate(el => el.disabled || !!el.closest('.arco-input-number-disabled')).catch(()=>true); if (locked) throw new Error('自定义态权重仍锁定（D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK）'); await spins.first().fill('0'); await page.waitForTimeout(300); const v = await spins.first().inputValue(); if (v !== '0') throw new Error('未接受 0: ' + v)
  - note: 负值与非法字符被拒绝
    assert: |-
      await page.goto('http://10.50.69.111:30892/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.locator('.arco-select-view').filter({ hasText: /区域产业指数官方模板|当前未保存配置/ }).first().click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup').getByText('当前未保存配置', { exact: true }).last().click({ force: true }); await page.waitForTimeout(900); const spins = page.locator('main [role=spinbutton]'); const locked = await spins.first().evaluate(el => el.disabled || !!el.closest('.arco-input-number-disabled')).catch(()=>true); if (locked) throw new Error('自定义态权重仍锁定（D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK）'); await spins.first().fill('-1'); await page.waitForTimeout(200); const v = await spins.first().inputValue(); if (v.includes('-')) throw new Error('接受了负值: ' + v); await spins.first().fill('abc'); await page.waitForTimeout(200); const v2 = await spins.first().inputValue(); if (/[a-zA-Z]/.test(v2)) throw new Error('接受了非法字符: ' + v2)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  蓝本 FUNC-00573。D3 粘滞只读（ticket=D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK，同 P0-07）：
  切「当前未保存配置」后 spin 仍 disabled，一键均分不改官方默认 16×5+20，填 0/负值/非法不可达；
  官方模板默认非均分为 as-built 事实（用例备注开放项）。  expect 双层保留目标态机检；allow_skip 哨兵=未锁定 checkbox（同 P0-07，避开
  KEYENT 默认探测与易误匹配的 spin CSS）。assert 内 goto 用绝对 URL（runner 无 baseURL）。
  env-gate overall=pass。list 相对父键 2 空格缩进。
