id: FUNC-03018
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03018
priority: P1
title: 报告页点「付费」仍停留在报告页
entry_id: chain-regional-index
tier: B
preconditions:
  - 已打开区域产业指数评价报告（assert 自含）
  - 当前账号未开通报告导出付费权益（edu admin 默认未付费）
locators:
  tab_records: tab「分析记录」
  view_report: button「查看报告」
  paid_badge: '[data-paid-badge="required"]'
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 分析记录→查看报告→点「付费」；落点与无弹层在 expect
expect:
  - note: 1、仍停留在「区域产业指数评价报告」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const gate404 = async () => {
        await dismissBasket();
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      const openReportFromRecords = async () => {
        await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
        await page.waitForTimeout(1500);
        await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
        const rows = page.locator('tr').filter({ hasText: '已完成' });
        const n = await rows.count();
        if (!n) {
          throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK: 分析记录无已完成行');
        }
        for (let i = 0; i < Math.min(n, 10); i++) {
          const row = rows.nth(i);
          const rt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ');
          if (!/区域产业指数评价/.test(rt)) continue;
          const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
          if (!(await reportBtn.count())) continue;
          const disabled = await reportBtn.isDisabled().catch(() => true);
          if (disabled) continue;
          await reportBtn.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
          if (/view=report/.test(page.url())) return;
          for (let j = 0; j < 20; j++) {
            await page.waitForTimeout(400);
            if (/view=report/.test(page.url())) return;
          }
        }
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-REPORT: 已完成行「查看报告」均不可用或未进入 view=report');
      };
      await gate404();
      await openReportFromRecords();
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      await expect(reader.locator('h1').filter({ hasText: '区域产业指数评价报告' }).first()).toBeVisible({ timeout: 15000 });
      const locked = reader.locator('[data-report-export-locked]').first();
      await expect(locked).toBeVisible({ timeout: 8000 });
      const paidTag = locked.locator('[data-paid-badge="required"]').first();
      await expect(paidTag).toBeVisible({ timeout: 8000 });
      await expect(paidTag).toContainText('付费');
      const urlBefore = page.url();
      globalThis.__func03018_url = urlBefore;
      await paidTag.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page).toHaveURL(/view=report/, { timeout: 8000 });
      if (page.url() !== urlBefore && !/view=report/.test(page.url())) {
        throw new Error('点击「付费」后离开报告路由：' + page.url());
      }
      const readerAfter = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(readerAfter).toBeVisible({ timeout: 10000 });
      await expect(readerAfter.locator('h1').filter({ hasText: '区域产业指数评价报告' }).first()).toBeVisible({ timeout: 8000 });
      const modal = page.locator('.arco-modal-wrapper:visible, .arco-drawer:visible');
      const modalN = await modal.count();
      for (let m = 0; m < modalN; m++) {
        const vis = await modal.nth(m).isVisible().catch(() => false);
        if (vis) {
          throw new Error('点击「付费」后出现弹层/抽屉（现场口径：无新页面、无弹层）');
        }
      }
      const pagesBefore = 1;
      if (typeof context !== 'undefined' && context.pages) {
        const pc = context.pages().length;
        if (pc > pagesBefore) {
          throw new Error('点击「付费」后新开浏览器页签，count=' + pc);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: catalog_path=/industry-center/regional?workspace=index&tab=index。前置=分析记录已完成→查看报告（同02999）。步骤=报告 reader 内 data-paid-badge=required「付费」点击。主判=view=report+h1「区域产业指数评价报告」仍可见；无 arco-modal/drawer 可见弹层、无路由离开（D1：现场无新页面无弹层，不要求 Tooltip 文案）。无已完成→ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK；报告不可用→ENV-CHAIN-REGIONAL-INDEX-NO-REPORT。edu 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
