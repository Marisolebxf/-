id: FUNC-03023
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03023
priority: P1
tier: B
title: 失败记录「查看结果」不进入成功结果页
entry_id: chain-regional-index
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 点「分析记录」，在状态为失败的行点「查看结果」
    script: |-
      await page.getByRole('tab', { name: '分析记录' }).click();
      await page.waitForURL((url) => url.searchParams.get('tab') === 'records');
      const failRow = page.locator('main').getByRole('row').filter({ hasText: '失败' }).first();
      await failRow.waitFor({ state: 'visible' });
      const viewBtn = failRow.getByRole('button', { name: '查看结果' });
      if (!(await viewBtn.isDisabled())) {
        await viewBtn.click();
      }
expect:
  - note: 1、仍停留在分析记录
    assert: |-
      await expect(page).toHaveURL(/[?&]tab=records(?:&|$)/);
      await expect(page.locator('main').getByRole('heading', { name: '分析记录' })).toBeVisible();
  - note: 2、不进入「区域产业指数评价结果」
    assert: |-
      await expect(page.locator('main').getByRole('heading', { name: '区域产业指数评价结果' })).not.toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
