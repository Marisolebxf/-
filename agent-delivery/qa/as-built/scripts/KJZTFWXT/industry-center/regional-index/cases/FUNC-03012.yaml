id: FUNC-03012
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03012
priority: P1
title: 报告页「返回分析结果」回到结果页
entry_id: chain-regional-index
tier: B
preconditions:
  - 已打开区域产业指数评价报告（assert 自含）
locators:
  tab_records: tab「分析记录」
  view_report: button「查看报告」
  back_to_result: button「返回分析结果」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 分析记录→查看报告→点「返回分析结果」；预期在 expect
expect:
  - note: 1、回到「区域产业指数评价结果」
    assert: |-
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const gate404 = async () => {
        await dismissBasket();
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击「查看报告」后未进入只读报告页，url=' + page.url());
      };
      const openReportFromRecords = async () => {
        await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
        await page.waitForTimeout(1500);
        await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
        const rows = page.locator('tr').filter({ hasText: '已完成' });
        const n = await rows.count();
        if (!n) {
          throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK: 分析记录无已完成行');
        }
        for (let i = 0; i < Math.min(n, 10); i++) {
          const row = rows.nth(i);
          const rt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ');
          if (!/区域产业指数评价/.test(rt)) continue;
          const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
          if (!(await reportBtn.count())) continue;
          const disabled = await reportBtn.isDisabled().catch(() => true);
          if (disabled) continue;
          await reportBtn.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
          if (/view=report/.test(page.url())) return;
          for (let j = 0; j < 20; j++) {
            await page.waitForTimeout(400);
            if (/view=report/.test(page.url())) return;
          }
        }
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-REPORT: 已完成行「查看报告」均不可用或未进入 view=report');
      };
      await gate404();
      await openReportFromRecords();
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const reader = await waitReportReader();
      await expect(reader.locator('h1').filter({ hasText: '区域产业指数评价报告' }).first()).toBeVisible({ timeout: 15000 });
      const back = reader.locator('[data-report-back], button').filter({ hasText: '返回分析结果' }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
      await back.click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      for (let k = 0; k < 24; k++) {
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/区域产业指数评价结果/.test(body) && !/区域产业指数评价报告/.test(body.slice(0, 80))) break;
        if (k === 23) {
          throw new Error('点击「返回分析结果」后未回到结果页，url=' + page.url() + ' body=' + body.slice(0, 320));
        }
        await page.waitForTimeout(500);
      }
      const readerGone = await page.locator('.system-report-reader[data-report-readonly="true"]').isVisible().catch(() => false);
      if (readerGone) {
        throw new Error('仍停留在只读报告壳，未离开 view=report');
      }
      await expect(main().getByText('区域产业指数评价结果').first()).toBeVisible({ timeout: 15000 });
      const afterBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/区域产业指数评价报告/.test(afterBody) && !/区域产业指数评价结果/.test(afterBody)) {
        throw new Error('主区仍为报告态而非结果态');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: catalog_path=/industry-center/regional?workspace=index&tab=index。前置=分析记录已完成→查看报告（同02999）；步骤=报告 reader 内「返回分析结果」/data-report-back。主判=结果壳「区域产业指数评价结果」可见且只读报告 reader 不可见。无已完成→ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK；报告不可用→ENV-CHAIN-REGIONAL-INDEX-NO-REPORT。edu 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
