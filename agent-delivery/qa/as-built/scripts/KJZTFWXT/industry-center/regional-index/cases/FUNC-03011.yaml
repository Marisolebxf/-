id: FUNC-03011
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03011
priority: P1
tier: B
title: 备选-按此配置新建回到配置且条件一致
entry_id: chain-regional-index
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    target: 已计入 6 项
  - action: evaluate
    note: 同册02988打开成功结果页；用例步骤点「按此配置新建分析」
expect:
  - note: 1、回到分析配置
    assert: |-
      const main = page.locator('main');
      const pickSelectOption = async (optionText) => {
        const popup = page.locator('.arco-select-dropdown:visible').last();
        await popup.getByText(optionText, { exact: true }).click({ timeout: 8000 });
      };
      const summaryReady = await main.getByText(/生物 · 深圳市 · 已计入/).isVisible().catch(() => false);
      if (!summaryReady) {
        const objSelect = main.locator('.industry-cluster-select');
        const selectViews = objSelect.locator('.arco-select-view');
        const viewCount = await selectViews.count();
        if (viewCount >= 2) {
          await selectViews.nth(0).click({ timeout: 8000 });
          await pickSelectOption('生物产业');
          await selectViews.nth(1).click({ timeout: 8000 });
          await pickSelectOption('生物');
        } else {
          const cascader = main.locator('.arco-cascader-view').first();
          await cascader.click({ timeout: 8000 });
          const popup = page.locator('.arco-cascader-popup-visible, .arco-trigger-popup:visible').last();
          await popup.getByText('生物产业', { exact: true }).click({ timeout: 8000 });
          await popup.getByText('生物', { exact: true }).click({ timeout: 8000 });
        }
        await page.keyboard.press('Escape').catch(() => {});
        const regionSelect = main
          .locator('.policy-analysis-filter-row')
          .filter({ hasText: '评价区域（1–5）' })
          .locator('.arco-select-view')
          .first();
        await regionSelect.click({ timeout: 8000 });
        await page
          .locator('.arco-select-dropdown:visible .arco-select-option')
          .filter({ hasText: /^深圳市$/ })
          .first()
          .click({ timeout: 8000 });
        await page.keyboard.press('Escape').catch(() => {});
        await expect(main.getByText(/生物 · 深圳市 · 已计入/)).toBeVisible({ timeout: 8000 });
      }
      await page.getByRole('button', { name: '开始分析' }).click();
      const resultTitle = main.getByText('区域产业指数评价结果');
      const viewResult = page.getByRole('button', { name: '查看分析结果' });
      let onResult = false;
      for (let i = 0; i < 90 && !onResult; i++) {
        if (await resultTitle.isVisible().catch(() => false)) {
          onResult = true;
          break;
        }
        if (await viewResult.isVisible().catch(() => false)) {
          await viewResult.click();
          onResult = true;
          break;
        }
        if (await main.getByText('本次分析生成失败').isVisible().catch(() => false)) {
          throw new Error('修订 分析任务失败，无法打开成功结果');
        }
        await page.waitForTimeout(1000);
      }
      await expect(resultTitle).toBeVisible({ timeout: 20000 });
      const objLine = main.getByText(/对象：.+ · 任务/);
      await expect(objLine).toBeVisible({ timeout: 8000 });
      const objText = (await objLine.textContent()) || '';
      const snap = objText.match(/对象：(.+?) · (.+?) · 任务/);
      if (!snap) throw new Error('修订 无法解析结果页对象行');
      globalThis.__func03011 = { industry: snap[1].trim(), region: snap[2].trim() };
      await main.getByRole('button', { name: '按此配置新建分析' }).click({ timeout: 8000 });
      await expect(main.getByRole('heading', { name: '分析配置' })).toBeVisible({ timeout: 12000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 });
  - note: 2、产业与区域与该次结果一致
    assert: |-
      const main = page.locator('main');
      const snap = globalThis.__func03011;
      if (!snap?.industry || !snap?.region) {
        throw new Error('修订 缺少结果页产业区域快照');
      }
      const { industry, region } = snap;
      if (industry === '未选产业') {
        throw new Error(`修订 结果页产业未选，无法校验回显（${industry} · ${region}）`);
      }
      await expect(main.getByText(`${industry} · ${region}`)).toBeVisible({ timeout: 8000 });
      await expect(main.locator('.policy-analysis-filter-row').getByText(region, { exact: true })).toBeVisible({
        timeout: 8000,
      });
      const objSelect = main.locator('.industry-cluster-select');
      const selectViews = objSelect.locator('.arco-select-view');
      const viewCount = await selectViews.count();
      if (viewCount >= 2) {
        await expect(selectViews.nth(1)).toContainText(industry, { timeout: 8000 });
      } else {
        await expect(main.locator('.arco-cascader-view').first()).toContainText(industry, { timeout: 8000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
