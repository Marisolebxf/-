id: FUNC-03011
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03011
priority: P1
title: 结果页按此配置新建分析回到配置且产业区域与结果一致
entry_id: chain-regional-index
tier: B
preconditions:
  - 已打开一条成功结果（assert 自含）
locators:
  rebuild: button「按此配置新建分析」
  tab_config: tab「区域产业指数评价」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 成功结果页点「按此配置新建分析」；两条预期在 expect
expect:
  - note: 前置打开成功结果并点击「按此配置新建分析」
    assert: |-
      const main = () => page.locator('main').first();
      const isSuccessResult = async () => {
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/区域产业指数评价生成中|可视化分析过程/.test(body) && !/区域产业指数评价结果/.test(body)) {
          return false;
        }
        return await main().getByText('区域产业指数评价结果').first().isVisible().catch(() => false);
      };
      const openCompletedResult = async () => {
        await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
        await page.waitForTimeout(1500);
        await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
        const doneRow = page.locator('tr').filter({ hasText: '已完成' }).filter({ hasText: /CHAIN-\d{8}-\d{3}/ }).first();
        if (!(await doneRow.count())) {
          throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK: 分析记录无已完成行');
        }
        const rowText = ((await doneRow.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        let expectIndustry = '';
        let expectRegion = '';
        const cities = ['广东省', '深圳市', '北京市', '上海市', '杭州市', '广州市'];
        for (const c of cities) {
          if (rowText.includes(c)) {
            expectRegion = c;
            break;
          }
        }
        const rowInd = rowText.match(/(集成电路|传感器|人工智能|智能终端|软件与信息服务|生物医药|新材料|新能源|高端装备|海洋产业|[\u4e00-\u9fa5]{2,12}产业)/);
        if (rowInd) expectIndustry = rowInd[1];
        const viewBtn = doneRow.getByRole('button', { name: '查看结果' }).first();
        await expect(viewBtn).toBeVisible({ timeout: 8000 });
        await viewBtn.click({ timeout: 10000 });
        await page.waitForTimeout(2500);
        if (!(await isSuccessResult())) {
          throw new Error('打开结果页后未见「区域产业指数评价结果」');
        }
        const resultBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!expectIndustry) {
          const indFromResult = resultBody.match(/(集成电路|传感器|人工智能|智能终端|软件与信息服务|生物医药|新材料|新能源|高端装备|海洋产业|[\u4e00-\u9fa5]{2,12}产业)/);
          if (indFromResult) expectIndustry = indFromResult[1];
        }
        if (!expectRegion) {
          for (const c of cities) {
            if (resultBody.includes(c)) {
              expectRegion = c;
              break;
            }
          }
        }
        const summary = resultBody.match(/配置即时汇总[\s\S]{0,80}?([\u4e00-\u9fa5A-Za-z0-9、]+)\s*[·•]\s*(广东省|深圳市|北京市|上海市|杭州市|广州市)/);
        if (summary) {
          const sInd = summary[1].replace(/未选产业/g, '').trim();
          if (sInd && sInd !== '未选产业') expectIndustry = expectIndustry || sInd.split('、')[0];
          expectRegion = expectRegion || summary[2];
        }
        if (!expectRegion) {
          throw new Error('结果页未解析出评价区域快照');
        }
        if (!expectIndustry) {
          throw new Error('结果页未解析出产业快照（非「未选产业」），无法互证回填');
        }
        const rebuild = main().getByRole('button', { name: '按此配置新建分析', exact: true }).first();
        if (!(await rebuild.count()) || !(await rebuild.isVisible().catch(() => false))) {
          throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-REBUILD-001：结果页无「按此配置新建分析」');
        }
        await rebuild.scrollIntoViewIfNeeded().catch(() => {});
        await rebuild.click({ timeout: 15000 });
        await page.waitForTimeout(1500);
        globalThis.__func03011 = { expectIndustry, expectRegion, resultSnippet: resultBody.slice(0, 400) };
      };
      await openCompletedResult();
  - note: 1、回到分析配置
    assert: |-
      if (!globalThis.__func03011) throw new Error('前置：未从结果页点按此配置新建分析');
      const url = page.url();
      if (/view=processing|demo_state=processing/.test(url)) {
        throw new Error('按此配置新建后不应进入生成中 URL：' + url);
      }
      const main = () => page.locator('main').first();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/区域产业指数评价生成中|可视化分析过程/.test(body) && !/分析配置|已计入/.test(body)) {
        throw new Error('按此配置新建后不应停在生成中态');
      }
      if (/区域产业指数评价结果/.test(body) && !/开始分析/.test(body)) {
        throw new Error('按此配置新建后应离开结果页主态');
      }
      await expect(page).toHaveURL(/tab=index|workspace=index/, { timeout: 12000 });
      await expect(page.getByRole('tab', { name: '区域产业指数评价' }).first()).toHaveAttribute('aria-selected', 'true');
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 10000 });
  - note: 2、产业与区域与该次结果一致
    assert: |-
      if (!globalThis.__func03011?.expectIndustry) throw new Error('前置：无结果页产业区域快照');
      const expInd = globalThis.__func03011.expectIndustry;
      const expReg = globalThis.__func03011.expectRegion;
      const main = () => page.locator('main').first();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const objectField = main().locator('.policy-analysis-filter-row__field').filter({ hasText: '分析对象' }).first();
      await expect(objectField).toBeVisible({ timeout: 8000 });
      const industryView = objectField.locator('.arco-select-view, .arco-cascader-view').first();
      await expect(industryView).toBeVisible({ timeout: 8000 });
      const industryText = ((await industryView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!industryText || /请选择/.test(industryText)) {
        throw new Error('产业未按结果回显：「' + industryText + '」；结果快照「' + expInd + '」（缺陷候选同用例册备注）');
      }
      const regionField = main().locator('.policy-analysis-filter-row__field').filter({ hasText: '评价区域' }).first();
      await expect(regionField).toBeVisible({ timeout: 8000 });
      const regionView = regionField.locator('.arco-select-view').first();
      const regionText = ((await regionView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!regionText || /请选择/.test(regionText)) {
        throw new Error('评价区域未按结果回显：「' + regionText + '」');
      }
      const indOk = industryText.includes(expInd) || expInd.includes(industryText) || body.includes(expInd);
      if (!indOk) {
        throw new Error('产业与结果不一致：结果「' + expInd + '」配置「' + industryText + '」');
      }
      const regOk = regionText.includes(expReg) || body.includes(expReg);
      if (!regOk) {
        throw new Error('区域与结果不一致：结果「' + expReg + '」配置「' + regionText + '」');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
