id: FUNC-02994
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02994
priority: P0
title: 移除指标退出工作集并提示权重合计须100%
story: US-CHAIN-REG-01
entry_id: chain-regional-index
tier: B
preconditions:
  - 指标表至少两行（官方模板默认六行）
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 已计入 6 项
    timeout_ms: 12000
expect:
  - note: 1、该指标从工作集消失
    assert: |-
      const metricRow = (name) =>
        page.getByRole('row').filter({ hasText: name }).filter({ has: page.getByRole('button', { name: '移除' }) });
      const target = '企业商业化能力';
      const row = metricRow(target).first();
      await expect(row).toBeVisible({ timeout: 8000 });
      await row.getByRole('button', { name: '移除' }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(metricRow(target)).toHaveCount(0, { timeout: 8000 });
  - note: 2、出现「计入权重合计须为 100%」提示
    assert: |-
      await expect(page.getByText(/计入权重合计须为 100%/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
