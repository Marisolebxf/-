id: FUNC-02996
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02996
priority: P0
title: 添加指标下拉按四力分组列出库内六项
entry_id: chain-regional-index
tier: B
preconditions:
  - 已切到「当前未保存配置」
locators:
  template: 选择模板 → 当前未保存配置
  add: '.arco-select:has(input[placeholder="添加指标"])'
  popup: '.arco-trigger-popup:visible'
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进入指数页→切未保存配置→展开添加指标（判定在 expect）
expect:
  - note: 1、选项按商业力、技术力、学术力、支撑力分组
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const enterRegionalIndex = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=index/.test(page.url()) &&
          /tab=index/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            const u = new URL('/industry-center/search', baseUrl);
            await page.goto(u.toString(), { waitUntil: 'domcontentloaded', timeout: 60000 });
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^区域产业指数评价$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await expect(leaf().first()).toBeVisible({ timeout: 10000 });
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
        }
        await expect(page).toHaveURL(/workspace=index/);
        await expect(page).toHaveURL(/tab=index/);
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      await enterRegionalIndex();
      await expect(page.getByText('已计入 6 项').first()).toBeVisible({ timeout: 12000 });
      const tplView = page.locator('.arco-select-view').filter({ hasText: /区域产业指数官方模板|区域产业综合指数|当前未保存配置/ }).first();
      await expect(tplView).toBeVisible({ timeout: 10000 });
      const tplTxt = (await tplView.innerText()).replace(/\s+/g, ' ');
      if (!tplTxt.includes('当前未保存配置')) {
        await tplView.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await page.locator('.arco-trigger-popup').getByText('当前未保存配置', { exact: true }).last().click({ force: true });
        await page.waitForTimeout(900);
        await expect(page.locator('.arco-select-view').filter({ hasText: '当前未保存配置' }).first()).toBeVisible({ timeout: 8000 });
      }
      const addSel = page.locator('.arco-select').filter({ has: page.locator('input[placeholder="添加指标"]') }).first();
      if (!(await addSel.count())) throw new Error('无「添加指标」下拉（须当前未保存配置）');
      await addSel.click({ force: true });
      await page.waitForTimeout(600);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const popText = (await pop.innerText()).replace(/\s+/g, ' ');
      for (const g of ['商业力', '技术力', '学术力', '支撑力']) {
        if (!popText.includes(g)) throw new Error('添加指标弹层缺分组「' + g + '」，got=' + popText.slice(0, 120));
      }
      const structure = await pop.evaluate((el) => {
        const out = [];
        for (const node of el.querySelectorAll('.arco-select-group-title, .arco-select-option')) {
          if (node.classList.contains('arco-select-group-title')) {
            out.push({ kind: 'group', text: (node.textContent || '').trim() });
          } else {
            out.push({ kind: 'opt', text: ((node.textContent || '').trim().split('\n')[0] || '').trim() });
          }
        }
        return out;
      });
      if (structure.some((x) => x.kind === 'group')) {
        const groups = structure.filter((x) => x.kind === 'group').map((x) => x.text);
        for (const g of ['商业力', '技术力', '学术力', '支撑力']) {
          if (!groups.some((t) => t.includes(g))) throw new Error('DOM 分组标题缺「' + g + '」，groups=' + groups.join('|'));
        }
      }
      globalThis.__func02996 = { addPopupOpen: true };
  - note: 2、共 6 个指标，名称见附录D（营收、技术壁垒、高校论文、人才结构、服务机构、配套生态）
    assert: |-
      let pop = page.locator('.arco-trigger-popup:visible').last();
      if (!(await pop.count()) || !(await pop.isVisible().catch(() => false))) {
        const addSel = page.locator('.arco-select').filter({ has: page.locator('input[placeholder="添加指标"]') }).first();
        await addSel.click({ force: true });
        await page.waitForTimeout(600);
        pop = page.locator('.arco-trigger-popup:visible').last();
      }
      await expect(pop).toBeVisible({ timeout: 8000 });
      const expected = ['营收', '技术壁垒', '高校论文', '人才结构', '服务机构', '配套生态'];
      const opts = pop.locator('.arco-select-option');
      const n = await opts.count();
      if (n !== 6) throw new Error('添加指标可选项数 ' + n + ' ≠ 6（附录D）');
      const names = [];
      for (let i = 0; i < n; i++) {
        names.push(((await opts.nth(i).innerText()).trim().split('\n')[0] || '').trim());
      }
      for (const e of expected) {
        if (!names.includes(e)) throw new Error('缺库指标「' + e + '」，实际=' + names.join('、'));
      }
      await page.keyboard.press('Escape');
      await page.waitForTimeout(300);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 替换作废 00568/P0-08 旧判定；只验展开下拉的分组与 6 项库名（附录D），不点选进工作集。edu 深链 catalog_path 404，入口改 sibling_for_sidebar_entry 侧栏进页（entry-seed）。库叶名=营收/技术壁垒/…。登录关评审 runner 前置。B 档零 allow_skip。
