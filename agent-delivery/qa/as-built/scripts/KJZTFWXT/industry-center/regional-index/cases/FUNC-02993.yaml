id: FUNC-02993
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02993
priority: P0
title: 企业商业化能力行查看打开指标说明抽屉
story: US-CHAIN-REG-01
entry_id: chain-regional-index
tier: B
preconditions:
  - 指标表已显示「企业商业化能力」（官方模板默认六行）
locators:
  metric_row: 企业商业化能力行
  view_btn: 企业商业化能力行「查看」
  drawer: .arco-drawer:visible
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进入指数页→企业商业化能力行「查看」（判定在 expect）
expect:
  - note: 1、抽屉标题为「企业商业化能力 · 指标说明」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const enterRegionalIndex = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=index/.test(page.url()) &&
          /tab=index/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            const u = new URL('/industry-center/search', baseUrl);
            await page.goto(u.toString(), { waitUntil: 'domcontentloaded', timeout: 60000 });
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^区域产业指数评价$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await expect(leaf().first()).toBeVisible({ timeout: 10000 });
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
        }
        await expect(page).toHaveURL(/workspace=index/);
        await expect(page).toHaveURL(/tab=index/);
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      await enterRegionalIndex();
      await expect(page.getByText('已计入 6 项').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('企业商业化能力', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const row = page.getByRole('row').filter({ hasText: '企业商业化能力' }).first();
      await expect(row).toBeVisible({ timeout: 8000 });
      const view = row.getByRole('button', { name: '查看' }).first();
      await view.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const title = drawer.locator('.arco-drawer-title, .arco-drawer-header').first();
      const titleText = ((await title.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!titleText.includes('企业商业化能力')) throw new Error('抽屉标题缺指标名：' + titleText);
      if (!titleText.includes('指标说明')) throw new Error('抽屉标题缺「指标说明」：' + titleText);
      globalThis.__func02993 = { drawerOpened: true };
  - note: 2、抽屉内可见区块「指标来源」
    assert: |-
      if (!globalThis.__func02993?.drawerOpened) throw new Error('前置：未打开指标说明抽屉');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const t = await drawer.innerText();
      if (!t.includes('指标来源')) throw new Error('抽屉缺「指标来源」；片段: ' + t.slice(0, 320));
      const closeBtn = drawer.locator('.arco-drawer-close-btn').first();
      if (await closeBtn.count()) {
        await closeBtn.click({ timeout: 5000 });
      } else {
        await page.keyboard.press('Escape');
      }
      await page.waitForTimeout(500);
      await expect(page.locator('.arco-drawer:visible')).toHaveCount(0, { timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/regional?workspace=index&tab=index（entry-seed）；入口对齐 entry-seed：goto sibling /industry-center/search
  再侧栏「产业链分析」→「区域产业指数评价」（深链冷启动 SPA 404）。用例=指标表「企业商业化能力」行「查看」→
  IndustryMetricSpecDrawer 标题「{title} · 指标说明」；抽屉 .arco-drawer 内 a-descriptions 含「指标来源」。备注另字段（指标状态/权重状态/范围说明等）本条不验。
  模板竞态须 wait「已计入 6 项」。edu 深链 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
