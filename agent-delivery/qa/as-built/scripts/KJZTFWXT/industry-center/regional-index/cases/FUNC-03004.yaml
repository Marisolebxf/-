id: FUNC-03004
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03004
priority: P0
title: 分析记录任务状态下拉四选项
story: US-CHAIN-REG-05
entry_id: chain-regional-index
tier: B
preconditions:
  - 已打开「分析记录」（assert 自含）
locators:
  tab_records: tab「分析记录」
  status_filter: 任务状态
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 切分析记录→展开「任务状态」，选项在 expect
expect:
  - note: 前置：区域产业指数评价页已切到「分析记录」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      await dismissBasket();
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
      }
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      const main = page.locator('main').first();
      await expect(main.getByText('分析记录').first()).toBeVisible({ timeout: 8000 });
      globalThis.__func03004 = { recordsReady: true };
  - note: 1、选项为全部状态、分析中、已完成、失败，共 4 个
    assert: |-
      if (!globalThis.__func03004?.recordsReady) throw new Error('前置：分析记录 Tab 未打开');
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      await page.keyboard.press('Escape').catch(() => {});
      const block = page.locator('text=任务状态').first();
      await expect(block).toBeVisible({ timeout: 8000 });
      const trigger = block.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
      if ((await trigger.count()) < 1) {
        const fallback = page.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
        await expect(fallback).toBeVisible({ timeout: 8000 });
        await fallback.click({ timeout: 8000 });
      } else {
        await expect(trigger).toBeVisible({ timeout: 8000 });
        await trigger.click({ timeout: 8000 });
      }
      await page.waitForTimeout(450);
      const pop = page.locator('.arco-trigger-popup:visible, .arco-select-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const count = await options.count();
      const got = [];
      for (let i = 0; i < count; i++) {
        got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim());
      }
      if (count !== 4) {
        throw new Error('任务状态选项应为 4 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      const want = ['全部状态', '分析中', '已完成', '失败'];
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error('任务状态选项不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got));
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/regional?workspace=index&tab=index。步骤=分析记录 Tab→「任务状态」标签后首个 .arco-select-view（P7 fallback 对齐 03013/02907）。
  选项=testdata records.status_filter 族：全部状态、分析中、已完成、失败。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
