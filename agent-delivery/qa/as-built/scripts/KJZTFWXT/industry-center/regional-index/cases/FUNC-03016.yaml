id: FUNC-03016
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03016
priority: P1
tier: B
title: 备选-下载报告
entry_id: chain-regional-index
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 点「分析记录」Tab（同册 02997）
    script: |-
      await page.goto(new URL('/industry-center/regional?workspace=index&tab=records', baseUrl).href);
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '分析记录' })).toBeVisible();
  - action: evaluate
    note: 任务状态选「已完成」（同册 03013，定位已完成行）
    script: |-
      const main = page.locator('main');
      await main.locator('.arco-select-view').first().click();
      await page.getByRole('option', { name: '已完成' }).click();
      await expect(main.getByRole('button', { name: '下载报告' }).first()).toBeEnabled({ timeout: 10000 });
expect:
  - note: 1、得到可打开的报告文件
    assert: |-
      const main = page.locator('main');
      const dl = main.getByRole('button', { name: '下载报告' }).first();
      const downloadPromise = page.waitForEvent('download', { timeout: 15000 });
      await dl.click();
      const download = await downloadPromise;
      const path = await download.path();
      expect(path).toBeTruthy();
      const fs = require('fs');
      expect(fs.statSync(path).size).toBeGreaterThan(0);
on_fail: 截图 + 抄 X-Trace-Id
