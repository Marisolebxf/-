id: FUNC-03014
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03014
priority: P1
title: 分析记录任务状态筛「重置」回全部
entry_id: chain-regional-index
tier: B
preconditions:
  - 任务状态当前为「已完成」（assert 自含：先筛已完成再点重置）
locators:
  tab_records: tab「分析记录」
  status_filter: 任务状态
  reset_filter: .diagnosis-records__filters button「重置」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 分析记录 Tab→筛「已完成」→点「重置」；回显与列表在 expect
expect:
  - note: 前置：分析记录 Tab；「全部状态」下同时有已完成与失败行
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const chainRows = () => main().locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const statusTrigger = async () => {
        const statusLabel = page.getByText('任务状态', { exact: false }).first();
        await expect(statusLabel).toBeVisible({ timeout: 8000 });
        let trigger = statusLabel.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
        if ((await trigger.count()) < 1) {
          trigger = page.locator('.diagnosis-records__filters .arco-select-view').first();
        }
        if ((await trigger.count()) < 1) {
          trigger = page.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
        }
        return trigger;
      };
      await dismissBasket();
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
      }
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      await expect(main().getByText('分析记录').first()).toBeVisible({ timeout: 8000 });
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!TID_RE.test(body)) {
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-RECORDS: 分析记录无 CHAIN 任务行');
      }
      if (!/已完成/.test(body) || !/失败/.test(body)) {
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-FILTER-MIX-001：前置不满足（需同时有已完成与失败）');
      }
      await page.keyboard.press('Escape').catch(() => {});
      const trigger = await statusTrigger();
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(450);
      const optDone = page.locator(optSel).filter({ hasText: /^已完成$/ }).first();
      await expect(optDone).toBeVisible({ timeout: 8000 });
      await optDone.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const shownDone = ((await trigger.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/已完成/.test(shownDone)) {
        throw new Error('前置：任务状态未切到「已完成」：' + shownDone);
      }
      globalThis.__func03014 = { chainRows, TID_RE, main, statusTrigger, optSel };
  - note: 1、任务状态回到「全部状态」
    assert: |-
      const ctx = globalThis.__func03014;
      if (!ctx) throw new Error('前置：分析记录筛已完成未就绪');
      const filters = page.locator('.diagnosis-records__filters').first();
      const resetBtn = filters.getByRole('button', { name: '重置', exact: true });
      if (!(await resetBtn.count())) {
        throw new Error('分析记录筛选区未见「重置」按钮');
      }
      await resetBtn.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const trigger = await ctx.statusTrigger();
      const shown = ((await trigger.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/全部状态/.test(shown)) {
        throw new Error('重置后任务状态未回「全部状态」：' + shown);
      }
  - note: 2、列表重新同时含已完成和失败
    assert: |-
      const ctx = globalThis.__func03014;
      if (!ctx) throw new Error('前置：分析记录未就绪');
      const rows = ctx.chainRows();
      const n = await rows.count();
      if (n < 1) throw new Error('重置后未见 CHAIN 任务行');
      let hasDone = false;
      let hasFail = false;
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        if (!(await row.isVisible().catch(() => false))) continue;
        const rt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/已完成/.test(rt)) hasDone = true;
        if (/失败/.test(rt)) hasFail = true;
      }
      if (!hasDone || !hasFail) {
        const mainText = ((await ctx.main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').slice(0, 400);
        throw new Error(
          '重置后列表未同时含已完成与失败（done=' + hasDone + ' fail=' + hasFail + '）main=' + mainText,
        );
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/regional?workspace=index&tab=index。步骤=分析记录→任务状态选「已完成」（前置）→筛选区「重置」（≠配置区「重置参数」）。
  前置=全部状态下 main 同时含「已完成」「失败」，否则 ENV-CHAIN-REGIONAL-INDEX-FILTER-MIX-001。
  机检=重置后筛回显「全部状态」且当前页可见 CHAIN 行同时含已完成与失败。筛选=P7 点 .arco-select-view。登录关评审 runner 前置。B 档零 allow_skip。
