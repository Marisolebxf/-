id: FUNC-03022
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03022
priority: P1
title: 生成中取消任务回到配置且记录为失败
entry_id: chain-regional-index
tier: B
preconditions:
  - 所选条件当天尚未成功；已出现生成页（assert 自含：合法组合→开始分析→抢窗点「取消任务」）
locators:
  start: button「开始分析」
  cancel_task: button「取消任务」
  tab_index: tab「区域产业指数评价」
  tab_records: tab「分析记录」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 分析配置就绪
    timeout_ms: 12000
  - action: evaluate
    note: 配置产业→开始分析→点「取消任务」；三条预期在 expect
expect:
  - note: 1、离开生成页并回到分析配置
    assert: |-
      const main = () => page.locator('main').first();
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const industryLabel = '半导体与集成电路';
      const pickIndustry = async () => {
        await expect(page.getByText(/已计入\s*\d+\s*项/).first()).toBeVisible({ timeout: 15000 });
        await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        await page.keyboard.press('Escape').catch(() => {});
        const cluster = page.locator('.arco-select-view[aria-label="集群"]');
        if (await cluster.count() && (await cluster.first().isVisible().catch(() => false))) {
          await cluster.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
          const co = page.locator(optSel).filter({ hasText: /^新一代信息技术$/ }).first();
          if (await co.count()) await co.click({ force: true, timeout: 8000 });
          await page.waitForTimeout(500);
        }
        const industryTrigger = page.locator('.arco-select-view[aria-label="产业"]').first();
        await industryTrigger.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opt = page.locator(optSel).filter({ hasText: industryLabel }).first();
        await expect(opt).toBeVisible({ timeout: 10000 });
        await opt.click({ force: true, timeout: 8000 });
        await page.waitForTimeout(800);
        const indAfter = ((await industryTrigger.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (!indAfter.includes('集成电路')) {
          throw new Error('产业未选上：「' + indAfter + '」');
        }
        globalThis.__func03022 = { industryPicked: industryLabel };
      };
      const clickCancelAsap = async () => {
        return page.evaluate(() => {
          return new Promise((resolve) => {
            const doneSuccess = () => {
              const t = document.body.innerText || '';
              return (
                (/分析结果已生成/.test(t) || /区域产业指数评价结果/.test(t)) &&
                !Array.from(document.querySelectorAll('button')).some((b) => /取消任务/.test((b.textContent || '').trim()))
              );
            };
            const tryClick = () => {
              if (doneSuccess()) {
                resolve('instant_done');
                return true;
              }
              const btn = Array.from(document.querySelectorAll('button')).find((b) =>
                /取消任务/.test((b.textContent || '').trim()),
              );
              if (btn) {
                btn.click();
                resolve('ok');
                return true;
              }
              return false;
            };
            if (tryClick()) return;
            const deadline = Date.now() + 90000;
            const obs = new MutationObserver(() => {
              tryClick();
            });
            obs.observe(document.body, { childList: true, subtree: true });
            const tick = setInterval(() => {
              if (tryClick()) {
                clearInterval(tick);
                obs.disconnect();
              } else if (Date.now() > deadline) {
                clearInterval(tick);
                obs.disconnect();
                resolve('timeout');
              }
            }, 40);
          });
        });
      };
      const runCancelOnce = async () => {
        await pickIndustry();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        const cancelRace = clickCancelAsap();
        await start.click({ timeout: 10000 });
        await page.waitForTimeout(400);
        const cancelResult = await cancelRace;
        const url = page.url();
        const taskMatch = url.match(/task_id=([^&]+)/) || (await main().innerText().catch(() => '')).match(/CHAIN-\d{8}-\d{3}/);
        const taskId = taskMatch ? (taskMatch[1] || taskMatch[0]) : '';
        return { cancelResult, taskId, url };
      };
      let attempt = await runCancelOnce();
      if (attempt.cancelResult === 'instant_done') {
        const rerun = page.getByRole('button', { name: '重新分析' }).first().or(
          page.getByRole('button', { name: '返回配置重新分析' }).first(),
        );
        if (await rerun.isVisible().catch(() => false)) {
          await rerun.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          attempt = await runCancelOnce();
        }
      }
      if (attempt.cancelResult === 'instant_done') {
        throw new Error('ENV-CHAIN-REG-PROCESS-WINDOW-001: 分析瞬时完成，未见可点「取消任务」');
      }
      if (attempt.cancelResult === 'timeout') {
        throw new Error('ENV-CHAIN-REG-PROCESS-WINDOW-001: 90s 内未点到「取消任务」');
      }
      await page.waitForTimeout(1000);
      globalThis.__func03022 = {
        ...(globalThis.__func03022 || {}),
        cancelled: true,
        taskId: attempt.taskId,
      };
      const bodyAfter = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const urlAfter = page.url();
      if (/view=processing|demo_state=processing/.test(urlAfter) && /取消任务/.test(bodyAfter)) {
        throw new Error('点取消后仍停留在生成页');
      }
      if (/区域产业指数评价结果/.test(bodyAfter) && /view=result/.test(urlAfter)) {
        throw new Error('取消后误入「区域产业指数评价结果」');
      }
      await expect(page).toHaveURL(/tab=index|workspace=index/, { timeout: 12000 });
      await expect(page.getByRole('tab', { name: '区域产业指数评价' }).first()).toHaveAttribute('aria-selected', 'true');
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
      const industryView = page.locator('.arco-select-view[aria-label="产业"]').first();
      const indText = ((await industryView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/集成电路/.test(indText)) {
        throw new Error('取消后产业未保留：「' + indText + '」');
      }
  - note: 2、分析记录出现该次任务且状态为「失败」
    assert: |-
      if (!globalThis.__func03022?.cancelled) throw new Error('前置：未完成取消任务');
      const main = () => page.locator('main').first();
      const taskId = globalThis.__func03022.taskId || '';
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      let row = page.locator('tr').filter({ hasText: '失败' });
      if (taskId) {
        const byId = page.locator('tr').filter({ hasText: taskId });
        if (await byId.count()) row = byId.filter({ hasText: '失败' });
      }
      if (!(await row.count())) {
        row = page.locator('tr').filter({ hasText: /CHAIN-\d{8}-\d{3}/ }).filter({ hasText: '失败' });
      }
      await expect(row.first()).toBeVisible({ timeout: 20000 });
      const rowText = ((await row.first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/失败/.test(rowText)) {
        throw new Error('分析记录未见状态「失败」：' + rowText.slice(0, 160));
      }
      globalThis.__func03022.failRowOk = true;
  - note: 3、不进入「区域产业指数评价结果」
    assert: |-
      if (!globalThis.__func03022?.failRowOk) throw new Error('前置：分析记录失败行未通过');
      const main = () => page.locator('main').first();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const url = page.url();
      if (/view=result/.test(url) && /区域产业指数评价结果/.test(body)) {
        throw new Error('取消任务后仍进入成功结果页');
      }
      await expect(main().getByText('分析记录').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
