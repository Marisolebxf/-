id: FUNC-02990
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02990
priority: P0
title: 成功结果页展示叙述降级说明
story: US-CHAIN-REG-02
entry_id: chain-regional-index
tier: B
preconditions:
  - 已打开一条已完成任务的成功结果页（assert 自含：分析记录恢复或合法组合跑完并点「查看分析结果」）
locators:
  degrade_notice: text「叙述能力不可用，已按规则结果诚实降级。」
  result_title: text「区域产业指数评价结果」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 进入成功结果页并阅读标题下说明（机检在 expect）
expect:
  - note: 前置：已打开成功结果页（标题「区域产业指数评价结果」）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const route = '/industry-center/regional?workspace=index&tab=index';
      const main = () => page.locator('main').first();
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const gate404 = async () => {
        await dismissBasket();
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      const isSuccessResult = async () => {
        const t = await main().innerText().catch(() => '');
        if (/区域产业指数评价生成中|可视化分析过程/.test(t) && !/区域产业指数评价结果/.test(t)) return false;
        return /区域产业指数评价结果/.test(t) || (await page.getByText('区域产业指数评价结果').first().isVisible().catch(() => false));
      };
      const openFromViewBtn = async () => {
        const btn = page.getByRole('button', { name: '查看分析结果' }).first();
        if (await btn.isVisible().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          await page.waitForTimeout(2000);
        }
      };
      const restoreFromRecords = async () => {
        await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rows = page.locator('tr').filter({ hasText: '区域产业指数评价' }).filter({ hasText: '已完成' });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 6); i++) {
          const row = rows.nth(i);
          const view = row.getByRole('button', { name: /查看结果/ }).first();
          if (!(await view.count())) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 20; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult()) return true;
          }
        }
        return false;
      };
      const pickSelect = async (aria, text) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = page.locator('.arco-select-view[aria-label="' + aria + '"]').first();
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ force: true, timeout: 8000 });
        await page.waitForTimeout(700);
      };
      const freshSuccessResult = async () => {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await gate404();
        await expect(page.getByText('已计入 6 项').first()).toBeVisible({ timeout: 12000 });
        await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        await pickSelect('集群', '新一代信息技术');
        await pickSelect('产业', '集成电路');
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 15000 });
        await start.click({ timeout: 10000 });
        for (let i = 0; i < 120; i++) {
          await page.waitForTimeout(i < 4 ? 500 : 800);
          const t = await main().innerText().catch(() => '');
          if (/分析结果已生成/.test(t)) {
            await openFromViewBtn();
            if (await isSuccessResult()) return;
          }
          if (await isSuccessResult()) return;
          if (/分析失败|本次分析失败|INPUT_OBJECT_INVALID/.test(t) && i >= 10) {
            throw new Error('ENV-CHAIN-REG-ASYNC-FAIL-001：无法到达成功结果前置');
          }
        }
        throw new Error('ENV-CHAIN-REG-ASYNC-TIMEOUT-001：未见成功结果页');
      };
      await dismissBasket();
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await gate404();
      if (!(await isSuccessResult())) {
        if (!(await restoreFromRecords())) {
          await freshSuccessResult();
        }
      }
      await expect(page.getByText('区域产业指数评价结果').first()).toBeVisible({ timeout: 20000 });
      globalThis.__func02990 = { body: await main().innerText().catch(() => '') };
  - note: 1、结果页标题下显示「叙述能力不可用，已按规则结果诚实降级。」
    assert: |-
      const needle = '叙述能力不可用，已按规则结果诚实降级。';
      const body = globalThis.__func02990?.body || (await page.locator('main').first().innerText().catch(() => ''));
      if (!body.includes(needle)) {
        if (/区域产业综合指数|竞争力结果|决策摘要/.test(body) && !/叙述能力不可用/.test(body)) {
          throw new Error('ENV-CHAIN-REG-NARRATIVE-LIVE-001：叙述能力已返回，本用例验降级说明');
        }
        throw new Error('结果页标题下应出现叙述降级说明，实际摘要=' + JSON.stringify(body.slice(0, 320)));
      }
      await expect(page.getByText(needle).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/regional?workspace=index&tab=index（entry-seed）。用例步骤=阅读结果页标题下说明。
  成功结果壳常见诚实降级文案「叙述能力不可用，已按规则结果诚实降级。」（与 competitiveness/key-link 同族）。
  前置优先分析记录已完成→查看结果；否则新一代信息技术+集成电路+深圳市跑分析。edu 深链 404→ENV-EDU-TTS-SVCZ-404-001。
  登录关评审 runner 前置。B 档零 allow_skip。
