id: FUNC-02990
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02990
priority: P1
tier: B
title: 主流程-结果页-降级说明
entry_id: chain-regional-index
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    note: 已计入 6 项
  - action: evaluate
    note: 02988 金样至成功结果页（前置：已打开已完成任务结果页）
expect:
  - note: 显示「叙述能力不可用，已按规则结果诚实降级。」
    assert: |-
      const main = page.locator('main').first();
      const optSel =
        '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const pickSelect = async (ariaLabel, label) => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = main.locator(`.arco-select-view[aria-label="${ariaLabel}"]`).first();
        await trigger.scrollIntoViewIfNeeded();
        await trigger.click({ timeout: 12000 });
        await page.waitForTimeout(450);
        const opt = page.locator(optSel).filter({ hasText: label }).first();
        await expect(opt).toBeVisible({ timeout: 10000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const pickCascader = async (labels) => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = main.locator('.arco-cascader-view').first();
        await trigger.scrollIntoViewIfNeeded();
        await trigger.click({ timeout: 12000 });
        await page.waitForTimeout(400);
        for (const label of labels) {
          const opt = page
            .locator('.arco-trigger-popup:visible .arco-cascader-option')
            .filter({ hasText: label })
            .first();
          await expect(opt).toBeVisible({ timeout: 10000 });
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(350);
        }
      };
      const clusterSelect = main.locator('.arco-select-view[aria-label="集群"]').first();
      if (await clusterSelect.isVisible().catch(() => false)) {
        await pickSelect('集群', '生物产业');
        const industryTrigger = main.locator('.arco-select-view[aria-label="产业"]').first();
        const industryText = await industryTrigger.innerText().catch(() => '');
        if (!industryText.includes('生物')) {
          await pickSelect('产业', '生物');
        }
      } else {
        await pickCascader(['生物产业', '生物']);
      }
      const regionTrigger = main.locator('.arco-select-view').filter({ hasText: '深圳市' }).first();
      if (!(await regionTrigger.isVisible().catch(() => false))) {
        const regionField = main.locator('.arco-select-view').nth(1);
        await regionField.click({ timeout: 8000 });
        await page.locator(optSel).filter({ hasText: '深圳市' }).first().click({ timeout: 8000 });
      }
      await main.getByRole('button', { name: '开始分析' }).click({ timeout: 15000 });
      const resultHeading = page.getByRole('heading', { name: '区域产业指数评价结果' });
      const onResult = await resultHeading.isVisible({ timeout: 12000 }).catch(() => false);
      if (!onResult) {
        await expect(page.getByText('分析结果已生成')).toBeVisible({ timeout: 120000 });
        await page.getByRole('button', { name: '查看分析结果' }).click({ timeout: 15000 });
        await expect(resultHeading).toBeVisible({ timeout: 30000 });
      }
      await expect(main.getByText('叙述能力不可用，已按规则结果诚实降级。')).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
