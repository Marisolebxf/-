id: FUNC-02995
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02995
priority: P0
tier: B
title: 当前未保存配置下一键均分使权重相等且合计校验通过
entry_id: chain-regional-index
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 配置即时汇总
    timeout_ms: 2000
  - action: click
    target: button:一键均分
expect:
  - note: 1、已计入各项权重变为相等
    assert: |-
      const main = page.getByRole('main');
      if (!(await main.getByText('当前未保存配置').first().isVisible().catch(() => false))) {
        await main.locator('.arco-select-view').first().click({ timeout: 8000 });
        await main.getByText('当前未保存配置', { exact: true }).click({ timeout: 8000 });
      }
      await main.getByRole('button', { name: '一键均分' }).click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const wysiwyg = main.locator('[data-testid="regional-inline-wysiwyg"]');
      await expect(wysiwyg).toBeVisible({ timeout: 8000 });
      const weightCells = await wysiwyg.locator('table tbody tr td').allTextContents();
      const nums = weightCells
        .map((t) => t.trim())
        .filter((t) => /^\d+%$/.test(t))
        .map((t) => parseInt(t, 10));
      if (nums.length < 1) throw new Error('汇总区无权重百分比');
      const n = nums.length;
      const base = Math.floor(100 / n);
      const last = 100 - base * (n - 1);
      const baseCount = nums.filter((v) => v === base).length;
      const lastCount = nums.filter((v) => v === last).length;
      if (baseCount !== n - 1 || lastCount !== 1) {
        throw new Error(`均分后权重不符合整除均分: ${nums.join('/')}`);
      }
  - note: 2、出现「权重合计：100% · 校验通过」
    assert: |-
      await expect(page.getByRole('main').getByText('权重合计：100% · 校验通过')).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
