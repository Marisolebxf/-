# P0-09（FUNC-00569 配置即时汇总所见即所得）
# 落局：去裸 skip 转实（2026-10-15 无头实勘）——env-gate overall=pass；
# 初始汇总 / 选产业 / 增减区域 / 权重合计文案均可绿；汇总操作不进 processing。
# 「全部取消计入→已计入 0 项」不可达：自定义态 checkbox 全 disabled
# （D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK，债在 P0-07）；移除最多剩 1 项（末钮 disabled）。
# 本条以「移除→已计入 N-1」验证指标段汇总联动 + 无伪综合指数，不复用 allow_skip。
# assert 内 goto 用绝对 URL（runner context 无 baseURL）。
id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00569
priority: P0
title: 配置即时汇总随对象区域指标联动且不起任务
entry_id: chain-regional-index
tier: B
preconditions:
  - 已登录；env-gate overall=pass
  - 已进入指数评价配置页；评审关闭
locators:
  summary: 配置即时汇总区「未选产业 · 深圳市 · 已计入 6 项」
  industry: '.arco-select-view[aria-label="产业"]'
  region: '.arco-select-view-multiple'
  remove: 'main button「移除」'
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 未选产业 · 深圳市 · 已计入 6 项
    timeout_ms: 12000
  - action: evaluate
    note: 选产业/增减区域/移除验汇总联动（机检以 expect 自含绝对 URL goto 为准）
expect:
  - note: 初始态汇总为「未选产业 · 深圳市 · 已计入 6 项 · 权重合计 100%」（区域段勘察态，以现场为准）
    assert: |-
      await page.goto('http://111.198.38.90:50892/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await expect(page.getByText(/未选产业 · 深圳市 · 已计入 6 项/).first()).toBeVisible({ timeout: 12000 })
  - note: 对象 / 区域 / 已计入项数 / 权重合计随操作即时联动刷新
    assert: |-
      await page.goto('http://111.198.38.90:50892/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.locator('.arco-select-view[aria-label="产业"]').click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup .arco-select-option', { hasText: '集成电路' }).first().click({ force: true }); await page.waitForTimeout(1000); await expect(page.getByText(/集成电路 · 深圳市 · 已计入 6 项/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 }); const region = page.locator('.arco-select-view-multiple').first(); await region.click(); await page.waitForTimeout(600); const pop = page.locator('.arco-trigger-popup').filter({ hasText: /深圳|北京/ }).last(); await pop.getByText('北京市', { exact: true }).first().click(); await page.waitForTimeout(300); await page.keyboard.press('Escape'); await page.waitForTimeout(600); await expect(page.getByText(/已计入 6 项/).first()).toBeVisible({ timeout: 8000 }); const sum = await page.getByText(/已计入 6 项/).first().innerText(); if (!/北京/.test(sum)) throw new Error('增减区域后汇总未见北京回显: ' + sum)
  - note: 指标调整后汇总「已计入」联动刷新、不展示伪数值且不创建任务（用例「全部取消计入→0 项」因 D3 sticky 不可达，本条以移除验证已计入联动）
    assert: |-
      await page.goto('http://111.198.38.90:50892/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.locator('.arco-select-view[aria-label="产业"]').click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup .arco-select-option', { hasText: '集成电路' }).first().click({ force: true }); await page.waitForTimeout(800); const beforeTxt = await page.getByText(/已计入 \d+ 项/).first().innerText(); const beforeN = Number((beforeTxt.match(/已计入 (\d+) 项/) || [])[1] || 0); if (beforeN < 2) throw new Error('着陆已计入不足，无法验移除联动: ' + beforeTxt); const removeBtns = page.locator('button', { hasText: /^移除$/ }); if ((await removeBtns.count()) < 1) throw new Error('无移除按钮'); await removeBtns.last().click(); await page.waitForTimeout(700); const afterTxt = await page.getByText(/已计入 \d+ 项/).first().innerText(); const afterN = Number((afterTxt.match(/已计入 (\d+) 项/) || [])[1] || 0); if (afterN !== beforeN - 1) throw new Error('移除后已计入未联动: ' + beforeTxt + ' → ' + afterTxt); const body = await page.locator('body').innerText(); if (/伪综合指数|演示指数|综合指数\s*[1-9]\d{1,2}(\.\d+)?\s*$/m.test(body) && /伪造|演示/.test(body)) throw new Error('出现伪数值文案'); if (/view=processing/.test(page.url())) throw new Error('汇总/移除操作触发了任务')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  蓝本 FUNC-00569。初始汇总无「权重合计 100%」字面（选产业后出现「权重合计：100% · 校验通过」）；
  产业叶选「集成电路」汇总常显「半导体与集成电路」。区域增减回显于汇总中段（深圳市、北京市）。
  用例「取消计入一项 / 全部取消计入→0 项 / 调权重」依赖自定义态启停与 spin——现场粘滞只读
  （D3-CHAIN-REG-INDEX-CUSTOM-STICKY-LOCK，脚本债在 P0-07）；移除可点至剩 1 项（末钮 disabled），
  故本条不以 0 项为机检硬阈，改用移除验已计入联动 + 无伪指数 + 不进 processing。
  数值型综合指数不展示（开放项 / GAP-CHAIN-REG-METRICS）。env-gate overall=pass。
  list 相对父键 2 空格缩进。
