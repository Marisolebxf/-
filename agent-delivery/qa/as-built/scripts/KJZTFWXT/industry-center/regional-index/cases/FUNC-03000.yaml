id: FUNC-03000
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03000
priority: P0
title: 分析记录已完成任务复制配置回到分析配置
entry_id: chain-regional-index
tier: B
preconditions:
  - 分析记录中有已完成任务
locators:
  tab_records: tab「分析记录」
  copy_config: button「复制配置」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 分析记录已完成行点「复制配置」；toast/产业区域回显/未保存模板在 expect
expect:
  - note: 1、出现「已复制分析配置，可调整后重新分析」
    assert: |-
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const gate404 = async () => {
        await dismissBasket();
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      const pickCompletedRow = () =>
        page.locator('tr').filter({ hasText: '已完成' }).filter({ hasText: /CHAIN-\d{8}-\d{3}/ }).first();
      await gate404();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      const doneRow = pickCompletedRow();
      if (!(await doneRow.count())) {
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK: 分析记录无已完成行');
      }
      const rowText = ((await doneRow.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const tidMatch = rowText.match(/CHAIN-\d{8}-\d{3}/);
      const taskId = tidMatch ? tidMatch[0] : '';
      const viewBtn = doneRow.getByRole('button', { name: '查看结果' }).first();
      await expect(viewBtn).toBeVisible({ timeout: 8000 });
      await viewBtn.click({ timeout: 10000 });
      await page.waitForTimeout(2500);
      const resultBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      let expectIndustry = '';
      let expectRegion = '';
      const snap = resultBody.match(/([\u4e00-\u9fa5A-Za-z0-9]{2,12})\s*[·•]\s*(广东省|深圳市|北京市|上海市|杭州市|广州市)/);
      if (snap) {
        expectIndustry = snap[1];
        expectRegion = snap[2];
      }
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      let rowAgain = page.locator('tr').filter({ hasText: taskId || 'CHAIN-' }).filter({ hasText: '已完成' }).first();
      if (!(await rowAgain.count())) rowAgain = pickCompletedRow();
      const copyBtn = rowAgain.getByRole('button', { name: '复制配置' }).first();
      await expect(copyBtn).toBeVisible({ timeout: 8000 });
      await copyBtn.click({ timeout: 15000 });
      await page.waitForTimeout(800);
      const toast = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({ hasText: /已复制分析配置/ });
      await expect(toast.first()).toBeVisible({ timeout: 10000 });
      globalThis.__func03000 = { taskId, expectIndustry, expectRegion, toastOk: true };
  - note: 2、产业与区域按该任务回显；3、模板为「当前未保存配置」；汇总含已计入 6 项且权重校验通过
    assert: |-
      if (!globalThis.__func03000?.toastOk) throw new Error('前置：复制配置 toast 未通过');
      const main = () => page.locator('main').first();
      const url = page.url();
      if (/view=processing|demo_state=processing/.test(url)) {
        throw new Error('复制后不应进入生成中 URL：' + url);
      }
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/区域产业指数评价生成中|可视化分析过程/.test(body)) {
        throw new Error('复制后不应停在生成中态');
      }
      await expect(page).toHaveURL(/tab=index|workspace=index/, { timeout: 12000 });
      await expect(page.getByRole('tab', { name: '区域产业指数评价' }).first()).toHaveAttribute('aria-selected', 'true');
      await expect(page.locator('.arco-select-view').filter({ hasText: '当前未保存配置' }).first()).toBeVisible({ timeout: 12000 });
      const industryView = page.locator('.arco-select-view[aria-label="产业"]').first();
      await expect(industryView).toBeVisible({ timeout: 8000 });
      const industryText = ((await industryView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!industryText || /请选择|未选产业/.test(industryText)) {
        throw new Error('产业未按任务回显：「' + industryText + '」');
      }
      const regionBlock = page.locator('text=评价区域').first();
      await expect(regionBlock).toBeVisible({ timeout: 8000 });
      const regionView = regionBlock.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
      let regionText = '';
      if (await regionView.count()) {
        regionText = ((await regionView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      }
      if (!regionText) {
        const mainText = body;
        const regionFromSummary = mainText.match(/[·•]\s*(广东省|深圳市|北京市|上海市|杭州市|广州市)\s*[·•]/);
        regionText = regionFromSummary ? regionFromSummary[1] : '';
      }
      if (!regionText || /请选择/.test(regionText)) {
        throw new Error('评价区域未按任务回显：「' + regionText + '」');
      }
      const expInd = globalThis.__func03000?.expectIndustry;
      const expReg = globalThis.__func03000?.expectRegion;
      if (expInd && !industryText.includes(expInd) && !body.includes(expInd)) {
        throw new Error('产业回显与结果页快照不一致：结果「' + expInd + '」配置「' + industryText + '」');
      }
      if (expReg && !regionText.includes(expReg) && !body.includes(expReg)) {
        throw new Error('区域回显与结果页快照不一致：结果「' + expReg + '」配置「' + regionText + '」');
      }
      await expect(page.getByText(/已计入\s*6\s*项/).first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByText(/权重合计.*100%|校验通过/).first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/regional?workspace=index&tab=index。步骤=分析记录已完成行先「查看结果」快照产业·区域（可选）→回记录同 task「复制配置」→
  toast + tab=index + 模板「当前未保存配置」+ 产业/评价区域非空 + 已计入 6 项 + 权重校验通过 + 非生成中。
  无已完成→ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK。edu 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
