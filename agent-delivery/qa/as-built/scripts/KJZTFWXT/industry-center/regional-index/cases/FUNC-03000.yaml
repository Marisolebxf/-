id: FUNC-03000
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03000
priority: P1
tier: B
title: 已完成记录「复制配置」回到分析配置并回显
entry_id: chain-regional-index
preconditions:
  - 分析记录中有已完成任务
locators:
  tab_records: tab「分析记录」
  tab_index: tab「区域产业指数评价」
  copy_config: button「复制配置」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: click
    target: tab_records
  - action: click
    target: copy_config
    note: 首条已完成行「复制配置」（机检在 expect 定位行并点击）
expect:
  - note: 1、出现「已复制分析配置，可调整后重新分析」
    assert: |-
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const gate404 = async () => {
        await dismissBasket();
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      await gate404();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      const rows = page.locator('main tbody tr');
      const doneRow = rows.filter({ hasText: '已完成' }).filter({ hasText: /CHAIN-\d{8}-\d{3}/ }).first();
      if (!(await doneRow.count())) {
        const fallback = rows.filter({ hasText: '已完成' }).first();
        if (!(await fallback.count())) {
          throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK: 分析记录无已完成行');
        }
        globalThis.__func03000Row = fallback;
      } else {
        globalThis.__func03000Row = doneRow;
      }
      const row = globalThis.__func03000Row;
      await expect(row).toBeVisible({ timeout: 8000 });
      const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
      await expect(copyBtn).toBeVisible({ timeout: 8000 });
      await expect(copyBtn).toBeEnabled({ timeout: 8000 });
      await copyBtn.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const toast = page.locator('.arco-message').filter({ hasText: '已复制分析配置，可调整后重新分析' }).first();
      await expect(toast).toBeVisible({ timeout: 12000 });
      globalThis.__func03000 = true;
  - note: 2、产业与区域按该任务回显
    assert: |-
      if (!globalThis.__func03000) throw new Error('前置：未复制配置');
      await page.getByRole('tab', { name: '区域产业指数评价' }).click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(page).toHaveURL(/tab=index/, { timeout: 12000 });
      const main = page.locator('main').first();
      await expect(main.getByText('分析配置').first()).toBeVisible({ timeout: 10000 });
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/未选产业/.test(body) && /未选区域/.test(body)) {
        throw new Error('复制后产业与区域均未回显: ' + body.slice(0, 240));
      }
      if (/未选区域/.test(body)) {
        throw new Error('复制后区域未回显: ' + body.slice(0, 240));
      }
      if (!/·/.test(body)) {
        throw new Error('配置区未见对象汇总分隔: ' + body.slice(0, 240));
      }
      globalThis.__func03000Config = body;
  - note: 3、模板为「当前未保存配置」
    assert: |-
      if (!globalThis.__func03000Config) throw new Error('前置：未进入分析配置');
      const main = page.locator('main').first();
      await expect(main.getByText('当前未保存配置').first()).toBeVisible({ timeout: 10000 });
      await expect(main.getByText('当前为未保存的自定义配置').first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
