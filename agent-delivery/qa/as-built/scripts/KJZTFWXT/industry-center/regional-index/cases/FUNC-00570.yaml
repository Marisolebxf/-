id: FUNC-00570
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00570
priority: P0
title: 显式开始分析创建任务且切条件不自动起任务
entry_id: chain-regional-index
tier: A
preconditions:
  - 已选好产业与区域；模板默认权重合计 100%（实勘：集群新一代信息技术 + 产业集成电路 + 深圳市）
locators:
  industry: .arco-select-view[aria-label=产业]
  start: button「开始分析」
  mode_single: 单产业 × 多区域
  mode_multi: 多产业 × 单区域
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 已计入 6 项
    timeout_ms: 12000
  - action: evaluate
    note: 合法组合后显式点开始分析；回配置区切模式不提交；检索配置区主提交入口
expect:
  - note: 1、合法组合下「开始分析」enabled，显式点按后进入正式分析任务（URL 含 view=processing；lite 不深验过程 UI）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) await close.first().click({ timeout: 3000 }).catch(() => {});
        }
      };
      await dismissBasket();
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
      }
      await expect(page.getByText('已计入 6 项').first()).toBeVisible({ timeout: 12000 });
      await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(800);
      await page.locator('.arco-select-view[aria-label="产业"]').click();
      await page.waitForTimeout(600);
      await page.locator('.arco-trigger-popup:visible .arco-select-option', { hasText: /^集成电路$/ }).first().click({ force: true });
      await page.waitForTimeout(1200);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      const before = page.url();
      await start.click();
      await page.waitForTimeout(3000);
      await expect(page).toHaveURL(/view=processing/, { timeout: 15000 });
      if (before === page.url()) throw new Error('点击开始分析后 URL 未变化: ' + page.url());
  - note: 2、返回配置区仅变更评价模式、未点「开始分析」时不自动进入 view=processing
    assert: |-
      await page.goto(baseUrl + '/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(3500);
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count() && (await close.first().isVisible().catch(() => false))) {
        await close.first().click().catch(() => {});
      }
      await expect(page.getByText('已计入 6 项').first()).toBeVisible({ timeout: 12000 });
      await page.getByText('多产业 × 单区域', { exact: true }).first().click();
      await page.waitForTimeout(800);
      await page.getByText('单产业 × 多区域', { exact: true }).first().click();
      await page.waitForTimeout(800);
      if (/view=processing/.test(page.url())) {
        throw new Error('仅切换评价模式即进入过程态: ' + page.url());
      }
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、「开始分析」为配置区（main）唯一主提交类按钮（不含重置/保存模板等辅助动作）
    assert: |-
      const main = page.locator('main');
      const primary = main.getByRole('button', { name: /^(开始分析|提交分析|立即分析|生成分析)$/ });
      const visPrimary = [];
      for (let i = 0; i < await primary.count(); i++) {
        if (await primary.nth(i).isVisible().catch(() => false)) visPrimary.push((await primary.nth(i).innerText()).trim());
      }
      if (visPrimary.length !== 1 || visPrimary[0] !== '开始分析') {
        throw new Error('配置区主提交入口不符（应仅「开始分析」）: ' + JSON.stringify(visPrimary));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: catalog_path=/industry-center/regional?workspace=index&tab=index（entry-seed）。lite 任务创建=显式点击后进 view=processing（env-gate gold_process_trigger=allowed_lite）；唯一任务深验归 02988。未选产业 disabled 归 FUNC-00564。assert 内 goto 用 baseUrl 对齐 testdata。用例册标注取消金样，脚本仍 tier A 零 allow_skip。登录与关内部评审由 runner 会话前置。
