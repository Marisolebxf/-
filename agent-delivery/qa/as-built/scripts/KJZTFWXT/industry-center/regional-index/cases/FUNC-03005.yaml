id: FUNC-03005
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03005
priority: P1
title: 当天相同条件再次开始分析打开已有结果且不新增任务
story: US-CHAIN-REG-01
entry_id: chain-regional-index
tier: B
preconditions:
  - 当天已用生物产业和深圳市成功分析过（assert 自含首次到达成功结果页）
locators:
  cluster: '.arco-select-view[aria-label="集群"]'
  industry: '.arco-select-view[aria-label="产业"]'
  start: button「开始分析」
  records_tab: tab「分析记录」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: wait
    for: 已计入 6 项
    timeout_ms: 12000
  - action: evaluate
    note: 生物产业+生物+深圳市首次成功→同条件再次开始分析；三条预期在 expect
expect:
  - note: 1、直接打开已有的「区域产业指数评价结果」
    assert: |-
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const HINT_RE = /今日已分析过相同条件|已打开今天相同条件|已打开结果/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const gate404 = async () => {
        await dismissBasket();
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      const pickByAria = async (aria, labelRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        const trigger = page.locator('.arco-select-view[aria-label="' + aria + '"]').first();
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opt = page.locator(optSel).filter({ hasText: labelRe }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ force: true, timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const pickIndustryBio = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.locator('.arco-select-view[aria-label="产业"]').first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opts = page.locator(optSel);
        const bioExact = opts.filter({ hasText: /^生物$/ });
        if (await bioExact.count()) {
          await bioExact.first().click({ force: true });
          return '生物';
        }
        const bioMed = opts.filter({ hasText: /^生物医药$/ });
        if (await bioMed.count()) {
          await bioMed.first().click({ force: true });
          return '生物医药';
        }
        throw new Error('ENV-CHAIN-REG-BIO-INDUSTRY-001：生物产业下未见「生物」或「生物医药」选项');
      };
      const apply03005Config = async () => {
        await gate404();
        await expect(page.getByText(/已计入\s*6\s*项/).first()).toBeVisible({ timeout: 12000 });
        await page.getByRole('button', { name: '重置参数' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(800);
        await pickByAria('集群', /^生物产业$/);
        const industryPicked = await pickIndustryBio();
        await page.waitForTimeout(800);
        const body = await main().innerText().catch(() => '');
        if (!/深圳市/.test(body)) {
          throw new Error('评价区域未含深圳市（用例默认深圳市）');
        }
        return industryPicked;
      };
      const isSuccessResult = async () => {
        const body = await main().innerText().catch(() => '');
        const url = page.url();
        if (/区域产业指数评价结果/.test(body) || /view=result/.test(url)) {
          return await page.getByText('区域产业指数评价结果').first().isVisible().catch(() => false);
        }
        return false;
      };
      const openResultFromDone = async () => {
        const viewBtn = page.getByRole('button', { name: /查看分析结果|查看结果/ }).first();
        for (let i = 0; i < 40; i++) {
          await page.waitForTimeout(i < 6 ? 500 : 1500);
          if (await isSuccessResult()) return;
          const t = await main().innerText().catch(() => '');
          if (/分析结果已生成/.test(t) && (await viewBtn.isVisible().catch(() => false))) {
            await viewBtn.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1200);
            if (await isSuccessResult()) return;
          }
          if (/view=processing|区域产业指数评价生成中/.test(page.url() + t)) continue;
          if (/分析失败|INPUT_OBJECT_INVALID|对象无效/.test(t) && i >= 6) {
            throw new Error('ENV-CHAIN-REG-ASYNC-FAIL-001：生物+深圳分析失败');
          }
        }
        if (!(await isSuccessResult())) {
          throw new Error('ENV-CHAIN-REG-ASYNC-NO-SUCCESS-03005：首次分析未在超时内到达成功结果页');
        }
      };
      const extractTaskId = async () => {
        const fromUrl = new URL(page.url()).searchParams.get('task_id');
        if (fromUrl) return fromUrl;
        const body = await main().innerText().catch(() => '');
        const m = body.match(TID_RE);
        return m ? m[0] : '';
      };
      const reachTodaySuccessOnce = async () => {
        if (await isSuccessResult()) return;
        await apply03005Config();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        if (await start.isDisabled()) {
          throw new Error('ENV-CHAIN-REG-BIO-BLACKLIST-001：生物+深圳「开始分析」disabled');
        }
        await start.click({ timeout: 10000 });
        for (let i = 0; i < 16; i++) {
          await page.waitForTimeout(500);
          if (await isSuccessResult()) return;
          const t = await main().innerText().catch(() => '');
          if (HINT_RE.test(t) && (await isSuccessResult())) return;
        }
        if (!(await isSuccessResult())) {
          const rerun = page.getByRole('button', { name: /重新分析|返回配置重新分析/ }).first();
          if (await rerun.isVisible().catch(() => false)) {
            await rerun.click({ timeout: 8000 });
            await page.waitForTimeout(1200);
            await apply03005Config();
            await page.getByRole('button', { name: '开始分析' }).first().click({ timeout: 10000 });
          }
        }
        if (!(await isSuccessResult())) await openResultFromDone();
      };
      const backToConfigTab = async () => {
        const back = page.getByRole('button', { name: /返回配置|按此配置新建/ }).first();
        if (await back.isVisible().catch(() => false)) {
          await back.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
        } else {
          await page.getByRole('tab', { name: '区域产业指数评价' }).first().click({ timeout: 8000 });
          await page.waitForTimeout(1000);
        }
        await dismissBasket();
        await expect(page.getByText(/已计入\s*6\s*项/).first()).toBeVisible({ timeout: 12000 });
      };
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await gate404();
      await reachTodaySuccessOnce();
      const taskFirst = await extractTaskId();
      if (!taskFirst) throw new Error('首次成功未见 CHAIN 任务号');
      await backToConfigTab();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nBefore = await countChainRows();
      await page.getByRole('tab', { name: '区域产业指数评价' }).click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await apply03005Config();
      const start2 = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start2).toBeEnabled({ timeout: 25000 });
      await start2.click({ timeout: 15000 });
      let openedResult = false;
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        const t = await main().innerText().catch(() => '');
        const url = page.url();
        if (/区域产业指数评价生成中|可视化分析过程/.test(t) && !/区域产业指数评价结果/.test(t) && i >= 8) {
          throw new Error('二次开始仍进入新生成中页（用例要求直接打开已有结果）');
        }
        if (await isSuccessResult()) {
          openedResult = true;
          break;
        }
        if (HINT_RE.test(t) && /view=result|区域产业指数评价结果/.test(url + t)) {
          openedResult = true;
          break;
        }
      }
      globalThis.__func03005 = { taskFirst, nBefore, openedResult };
      if (!openedResult) {
        await expect(page.getByText('区域产业指数评价结果').first()).toBeVisible({ timeout: 12000 });
      }
  - note: 2、任务号与当天已成功的那次相同；3、不出现新的生成中页
    assert: |-
      const ctx = globalThis.__func03005;
      if (!ctx) throw new Error('前置：未完成二次开始分析');
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      await expect(page.getByText('区域产业指数评价结果').first()).toBeVisible({ timeout: 15000 });
      const url = page.url();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/区域产业指数评价生成中|可视化分析过程/.test(body) && !/区域产业指数评价结果/.test(body)) {
        throw new Error('二次开始后仍停生成中页，未打开已有结果');
      }
      if (/view=processing|demo_state=processing/.test(url) && !/view=result/.test(url)) {
        throw new Error('URL 仍为 processing，非已有结果：' + url);
      }
      const taskSecond =
        new URL(page.url()).searchParams.get('task_id') ||
        ((body.match(TID_RE) || [])[0]) ||
        '';
      if (ctx.taskFirst && taskSecond && ctx.taskFirst !== taskSecond) {
        throw new Error('同条件当天复用 task_id 不一致：' + ctx.taskFirst + ' vs ' + taskSecond);
      }
      if (ctx.taskFirst && !body.includes(ctx.taskFirst) && taskSecond !== ctx.taskFirst) {
        throw new Error('结果页未见原任务号 ' + ctx.taskFirst);
      }
      if (!/生物/.test(body) || !/深圳市/.test(body)) {
        throw new Error('结果页对象行应含生物与深圳市（用例：生物 · 深圳市）');
      }
  - note: 3、分析记录不新增任务（当天复用不新增 CHAIN）
    assert: |-
      const ctx = globalThis.__func03005;
      if (!ctx) throw new Error('前置：未完成二次开始分析');
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = await countChainRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('分析记录 CHAIN 条数增加：' + ctx.nBefore + ' -> ' + nAfter + '（当天复用应不新增）');
      }
      const body = await main().innerText().catch(() => '');
      if (ctx.taskFirst && !body.includes(ctx.taskFirst)) {
        throw new Error('分析记录列表未见原任务 ' + ctx.taskFirst);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/regional?workspace=index&tab=index（entry-seed）。指纹=生物产业/生物（或生物医药）/深圳市。
  步骤=当天首次成功→回填同条件→再次「开始分析」→直达「区域产业指数评价结果」且 task_id 不变、非新生成中、分析记录条数不增。Q-ANALYSIS-01。
  生物失败→ENV-CHAIN-REG-ASYNC-FAIL-001；无成功→ENV-CHAIN-REG-ASYNC-NO-SUCCESS-03005；edu 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
