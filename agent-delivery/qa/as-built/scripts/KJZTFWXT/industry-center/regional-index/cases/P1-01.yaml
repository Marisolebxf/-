id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00571
priority: P1
title: 重置参数恢复默认且不创建任务
entry_id: chain-regional-index
preconditions:
- 已修改模式/产业/区域/模板或权重
locators:
  reset: button「重置参数」
steps:
- action: goto
  target: /industry-center/regional?workspace=index&tab=index
- action: wait
  for: 已计入 6 项
- action: click
  target: 选产业后点重置参数
expect:
- note: 评价模式回「单产业 × 多区域」、产业置空
  assert: |-
    await page.goto('/industry-center/regional?workspace=index&tab=index', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(4500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.locator('.arco-select-view[aria-label="产业"]').click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup .arco-select-option').first().click({ force: true }); await page.waitForTimeout(800); await page.getByRole('button', { name: '重置参数' }).click(); await page.waitForTimeout(1200); await expect(page.locator('input[placeholder="请选择产业"]')).toBeVisible({ timeout: 8000 }); await expect(page.getByText('单产业 × 多区域').first()).toBeVisible()
- note: 模板回系统模板、指标回 6 项官方权重
  assert: |-
    await expect(page.getByText('区域产业指数官方模板').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/已计入 6 项/).first()).toBeVisible({ timeout: 8000 }); const spins = page.locator('main [role=spinbutton]'); const vals = []; for (let i = 0; i < Math.min(await spins.count(), 6); i++) vals.push(await spins.nth(i).inputValue()); if (vals.length === 6 && vals.join(',') !== '16,16,16,16,16,20') throw new Error('重置后权重 ' + vals.join('/'))
- note: 重置不创建任务、不写分析记录
  assert: |-
    if (/view=processing/.test(page.url())) throw new Error('重置进入过程态'); await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 重置后区域默认深圳市（实勘）。
tier: B
