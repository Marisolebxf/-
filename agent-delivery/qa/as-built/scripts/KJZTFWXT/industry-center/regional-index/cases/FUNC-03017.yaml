id: FUNC-03017
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03017
priority: P1
title: 报告页「导出」得到可打开的报告文件
entry_id: chain-regional-index
tier: B
preconditions:
  - 已打开区域产业指数评价报告（assert 自含）
  - 演示导出需开通人设「付费权益」（对齐 01903/02021）
locators:
  tab_records: tab「分析记录」
  view_report: button「查看报告」
  export_btn: '[data-report-export-unlocked] button[data-report-download]'
  paid_switch: switch「付费权益」
steps:
  - action: goto
    target: /industry-center/regional?workspace=index&tab=index
  - action: evaluate
    note: 分析记录→查看报告→开通付费→点「导出」；文件或已导出反馈在 expect
expect:
  - note: 1、得到可打开的报告文件（download 或导出成功反馈，且仍停留在报告页）
    assert: |-
      const main = () => page.locator('main').first();
      const reader = () => page.locator('.system-report-reader[data-report-readonly="true"]');
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const gate404 = async () => {
        await dismissBasket();
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业指数评价 SPA 404 ' + page.url());
        }
      };
      const waitReportReader = async () => {
        const r = reader();
        for (let i = 0; i < 36; i++) {
          if (await r.isVisible().catch(() => false)) return r;
          await page.waitForTimeout(500);
        }
        throw new Error('未进入只读报告页，url=' + page.url());
      };
      const openReportFromRecords = async () => {
        await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 10000 });
        await page.waitForTimeout(1500);
        await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
        const rows = page.locator('tr').filter({ hasText: '已完成' });
        const n = await rows.count();
        if (!n) {
          throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK: 分析记录无已完成行');
        }
        for (let i = 0; i < Math.min(n, 10); i++) {
          const row = rows.nth(i);
          const rt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ');
          if (!/区域产业指数评价/.test(rt)) continue;
          const reportBtn = row.getByRole('button', { name: '查看报告' }).first();
          if (!(await reportBtn.count())) continue;
          const disabled = await reportBtn.isDisabled().catch(() => true);
          if (disabled) continue;
          await reportBtn.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
          if (/view=report/.test(page.url())) return;
          for (let j = 0; j < 20; j++) {
            await page.waitForTimeout(400);
            if (/view=report/.test(page.url())) return;
          }
        }
        throw new Error('ENV-CHAIN-REGIONAL-INDEX-NO-REPORT: 已完成行「查看报告」均不可用或未进入 view=report');
      };
      const dismissBlockingModals = async () => {
        for (let i = 0; i < 3; i++) {
          const wrap = page.locator('.arco-modal-wrapper').filter({ has: page.locator('.arco-modal') });
          if (!(await wrap.count()) || !(await wrap.first().isVisible().catch(() => false))) break;
          await page.keyboard.press('Escape').catch(() => {});
          await page.waitForTimeout(250);
          const cancel = page.getByRole('button', { name: '取消', exact: true });
          if (await cancel.count() && (await cancel.first().isVisible().catch(() => false))) {
            await cancel.first().click({ timeout: 2000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const ensurePaidForExport = async () => {
        const reportUrl = page.url();
        const menuBtn = page.locator('button.persona-switch').first();
        const findPaidSwitch = async () => {
          for (const name of [/付费权益/, '付费权益（报告导出）']) {
            const sw = page.getByRole('switch', { name });
            if (await sw.count() && (await sw.first().isVisible().catch(() => false))) return sw.first();
          }
          return null;
        };
        await dismissBlockingModals();
        await menuBtn.scrollIntoViewIfNeeded().catch(() => {});
        await menuBtn.click({ timeout: 8000, force: true });
        await page.waitForTimeout(500);
        const paidSw = await findPaidSwitch();
        if (!paidSw) throw new Error('人设菜单未见付费权益 switch');
        if ((await paidSw.getAttribute('aria-checked')) !== 'true') {
          await paidSw.click({ timeout: 5000 });
          await page.waitForTimeout(600);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await dismissBlockingModals();
        const paidOk = await page.locator('button.persona-switch').first().getAttribute('data-paid');
        if (paidOk !== '1') {
          throw new Error('付费权益 switch 未生效（persona-switch data-paid≠1）');
        }
        if (!(await reader().locator('[data-report-export-unlocked]').count())) {
          await page.goto(reportUrl, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
          await waitReportReader();
        }
        if (!(await reader().locator('[data-report-export-unlocked]').count())) {
          throw new Error('付费已开但报告页仍为 data-report-export-locked');
        }
      };
      await gate404();
      await openReportFromRecords();
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      const r = await waitReportReader();
      await expect(r.locator('h1').filter({ hasText: '区域产业指数评价报告' }).first()).toBeVisible({ timeout: 15000 });
      const urlBeforeExport = page.url();
      await ensurePaidForExport();
      await dismissBlockingModals();
      const exportBtn = r.locator('[data-report-export-unlocked][data-report-download], [data-report-export-unlocked] button[data-report-download]').first();
      await expect(exportBtn).toBeVisible({ timeout: 12000 });
      if (await exportBtn.isDisabled().catch(() => true)) {
        throw new Error('付费已开但「导出」仍 disabled');
      }
      const downloadPromise = page.waitForEvent('download', { timeout: 20000 }).catch(() => null);
      await exportBtn.click({ timeout: 10000 });
      const dl = await downloadPromise;
      let fileOk = false;
      let detail = '';
      if (dl) {
        const name = dl.suggestedFilename();
        const path = await dl.path().catch(() => null);
        if (name || path) {
          fileOk = true;
          detail = 'download=' + (name || path);
        }
      }
      if (!fileOk) {
        const msg = page.locator('.arco-message').filter({ hasText: /报告已导出|导出成功|已导出/ });
        if (await msg.count() && (await msg.first().isVisible().catch(() => false))) {
          fileOk = true;
          detail = 'message=' + ((await msg.first().innerText().catch(() => '')) || '').slice(0, 80);
        }
      }
      if (!fileOk) {
        const locked = await r.locator('[data-report-export-locked]').first().isVisible().catch(() => false);
        const toast = ((await page.locator('.arco-message').innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        throw new Error(
          '点报告页「导出」后未得到可打开文件（无 download、无已导出提示）；url=' +
            page.url() +
            ' locked=' +
            locked +
            (toast ? ' toast=' + toast.slice(0, 100) : '') +
            '。用例册备注：未付费时无文件；付费后仍无则记缺陷',
        );
      }
      if (!/view=report/.test(page.url())) {
        throw new Error('导出后离开报告页：before=' + urlBeforeExport + ' after=' + page.url());
      }
      await expect(r).toBeVisible({ timeout: 8000 });
      await expect(r.locator('h1').filter({ hasText: '区域产业指数评价报告' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: catalog_path=/industry-center/regional?workspace=index&tab=index。前置=分析记录已完成→查看报告（同02999）。步骤=人设开通「付费权益」→ ReportExportButton data-report-export-unlocked 点「导出」。机检=Playwright download 或 Arco Message「报告已导出/导出成功」；仍 view=report + h1「区域产业指数评价报告」。未付费默认 locked（02999/02916 分工）；本条验可导出路径（对齐01903）。无已完成→ENV-CHAIN-REGIONAL-INDEX-NO-DONE-TASK；报告不可用→ENV-CHAIN-REGIONAL-INDEX-NO-REPORT。edu 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
