id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00604
priority: P0
title: 切换分析对象下级联动且不自动创建任务
entry_id: chain-bottleneck
preconditions:
- 已进入产业瓶颈堵点识别页
locators:
  cluster: select aria-label「集群」
  chain: select aria-label「产业」
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
- action: click
  target: 产业改选「生物产业」
expect:
- note: 产业链选项随产业联动（生物后链不再锁定 INB1701）
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; if ((await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).getAttribute('aria-selected')) !== 'true') { await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).click(); await page.waitForTimeout(800) }; await page.locator('.arco-select-view[aria-label="集群"]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /^生物产业$/ }).first().click(); await page.waitForTimeout(900); await expect(page.locator('.arco-select-view[aria-label="集群"]')).toContainText('生物产业'); const chainTxt = ((await page.locator('.arco-select-view[aria-label="产业"]').getAttribute('title')) || (await page.locator('.arco-select-view[aria-label="产业"]').innerText())).trim(); if (chainTxt === 'INB1701') throw new Error('产业已切生物产业但链仍锁定 INB1701，疑未联动')
- note: 对象变更后不自动创建分析任务
  assert: |-
    if (/view=result/.test(page.url())) throw new Error('切对象后自动进入结果态'); const t = await page.locator('main').first().innerText(); if (/可视化分析过程/.test(t)) throw new Error('切对象后出现分析过程')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 'D4: 生物列入黑名单，本条只验联动与不自动起任务，不点开始分析。'
tier: B
