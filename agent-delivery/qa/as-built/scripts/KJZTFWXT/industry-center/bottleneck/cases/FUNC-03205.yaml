id: FUNC-03205
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03205
priority: P0
tier: B
title: 主流程-报告：结果页「查看报告」与七节目录
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
expect:
  - note: 同册03208/03188 打开结果页并点「查看报告」
    assert: |-
      const main = () => page.locator('main').first();
      const onResult = async () =>
        /产业瓶颈堵点识别结果/.test(await main().innerText().catch(() => ''));
      const openRecords = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 15000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
      };
      const openResultFromRecords = async () => {
        await openRecords();
        const rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '产业瓶颈堵点识别' })
          .filter({ hasText: /已完成/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 15); i++) {
          const btn = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
          if (!(await btn.count()) || (await btn.isDisabled().catch(() => true))) continue;
          await btn.click({ timeout: 15000 });
          for (let j = 0; j < 40; j++) {
            await page.waitForTimeout(500);
            if (await onResult()) return true;
          }
        }
        return false;
      };
      const openResultViaCopyStart = async () => {
        await openRecords();
        const rows = main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: '产业瓶颈堵点识别' })
          .filter({ hasText: /已完成/ });
        if ((await rows.count()) < 1) return false;
        const copy = rows.first().getByRole('button', { name: '复制配置' }).first();
        if (!(await copy.count()) || (await copy.isDisabled().catch(() => true))) return false;
        await copy.click({ timeout: 15000 });
        await page.waitForTimeout(1000);
        const start = main().getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeVisible({ timeout: 15000 });
        await expect(start).toBeEnabled({ timeout: 15000 });
        await start.click({ timeout: 15000 });
        const viewResult = page.getByRole('button', { name: '查看分析结果' }).first();
        await expect(viewResult).toBeVisible({ timeout: 90000 });
        await viewResult.click({ timeout: 15000 });
        for (let j = 0; j < 40; j++) {
          await page.waitForTimeout(500);
          if (await onResult()) return true;
        }
        return false;
      };
      if (!(await onResult())) {
        if (!(await openResultFromRecords()) && !(await openResultViaCopyStart())) {
          throw new Error('BLOCKED-NO-RESULT: 诊断记录无已完成瓶颈任务，无法打开结果页');
        }
      }
      await expect(page.getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
      const reportBtn = main().getByRole('button', { name: '查看报告' }).first();
      await expect(reportBtn).toBeVisible({ timeout: 10000 });
      await expect(reportBtn).toBeEnabled({ timeout: 10000 });
      await reportBtn.click({ timeout: 15000 });
      await page.waitForTimeout(800);
      await expect(page).toHaveURL(/view=report/, { timeout: 20000 });
      await expect(page.locator('.system-report-reader[data-report-readonly="true"]')).toBeVisible({
        timeout: 20000,
      });
  - note: 1、可见「产业瓶颈堵点识别报告」
    assert: |-
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader).toBeVisible({ timeout: 10000 });
      await expect(reader.locator('h1').filter({ hasText: '产业瓶颈堵点识别报告' }).first()).toBeVisible({
        timeout: 10000,
      });
  - note: 2、目录 7 项名称见附录C
    assert: |-
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      const toc = reader.locator('nav[aria-label="报告目录"]').first();
      await expect(toc).toBeVisible({ timeout: 10000 });
      const tocText = await toc.innerText();
      const required = [
        '报告身份',
        '执行摘要',
        '对象与范围',
        '关键发现',
        '证据与分析',
        '数据来源与生成说明',
        '局限性与使用边界',
      ];
      const missing = required.filter((label) => !tocText.includes(label));
      if (missing.length) {
        throw new Error('报告目录缺节：' + missing.join('、'));
      }
      await expect(toc.getByText('报告目录').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
