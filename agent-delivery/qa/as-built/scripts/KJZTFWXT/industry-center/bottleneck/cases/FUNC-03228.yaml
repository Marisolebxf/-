id: FUNC-03228
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03228
priority: P0
title: 复制配置后重新分析并打开新结果页
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已对一条已完成任务点「复制配置」
  - 配置页可见「重新分析」
locators:
  records_tab: tab「诊断记录」
  copy_config: button「复制配置」
  rerun: button「重新分析」
  view_result: button「查看分析结果」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录复制配置→点「重新分析」→过程就绪→点「查看分析结果」（判定在 expect）
expect:
  - note: 1、进入「产业瓶颈堵点识别生成中」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const catalogPath = '/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck';
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(400);
          }
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
        await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const extractTaskId = (text, url) => {
        const fromUrl = (url || '').match(TID_RE);
        if (fromUrl) return fromUrl[0];
        const m = (text || '').match(TID_RE);
        return m ? m[0] : '';
      };
      await enterBottleneck();
      await openRecordsTab();
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /产业瓶颈堵点识别/ });
      const n = await rows.count();
      if (n < 1) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-ROW：诊断记录无瓶颈任务行，无法复制配置');
      }
      let priorTaskId = '';
      let copied = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/产业瓶颈堵点识别/.test(rowText)) continue;
        priorTaskId = extractTaskId(rowText, '');
        const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
        if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
        await copyBtn.click({ timeout: 15000 });
        copied = true;
        break;
      }
      if (!copied) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-COPY-03228：无瓶颈任务可点「复制配置」');
      }
      await page.waitForTimeout(800);
      const toastCopy = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({ hasText: /已复制分析配置/ });
      await expect(toastCopy.first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      const rerun = page.getByRole('button', { name: '重新分析' }).first();
      if (!(await rerun.isVisible().catch(() => false))) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-RERUN-03228：复制配置后配置区未见「重新分析」（需当日同指纹已有任务）');
      }
      await expect(rerun).toBeEnabled({ timeout: 15000 });
      await rerun.click({ timeout: 15000 });
      await page.waitForTimeout(800);
      const toastTask = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({
        hasText: /任务已创建|正在可视化展示分析过程/,
      });
      await toastTask.first().isVisible({ timeout: 8000 }).catch(() => {});
      let sawGenerating = false;
      let last = '';
      for (let i = 0; i < 90; i++) {
        await page.waitForTimeout(i < 4 ? 600 : 1500);
        last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/产业瓶颈堵点识别生成中|可视化分析过程/.test(last)) sawGenerating = true;
        if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(last) && i >= 10 && !/分析结果已生成/.test(last)) {
          throw new Error('ENV-CHAIN-BOTTLENECK-ASYNC-FAIL-03228：重新分析失败');
        }
        if (sawGenerating && /分析结果已生成/.test(last)) break;
      }
      globalThis.__func03228 = {
        sawGenerating,
        priorTaskId,
        processBody: last.slice(0, 320),
        url: page.url(),
      };
      if (!sawGenerating && !/产业瓶颈堵点识别生成中/.test(last)) {
        throw new Error('未见「产业瓶颈堵点识别生成中」过程页，片段: ' + last.slice(0, 180));
      }
      await expect(main().getByText(/产业瓶颈堵点识别生成中/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、过程页出现「分析结果已生成」
    assert: |-
      const snap = globalThis.__func03228;
      if (!snap) throw new Error('前置：未进入重新分析过程页');
      let body = snap.processBody || '';
      for (let i = 0; i < 60; i++) {
        body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/分析结果已生成/.test(body)) break;
        await page.waitForTimeout(1200);
      }
      snap.processBody = body;
      if (!/分析结果已生成/.test(body)) {
        throw new Error('过程页未见「分析结果已生成」，片段: ' + body.slice(0, 180));
      }
      await expect(page.getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
      const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
      await expect(viewBtn).toBeVisible({ timeout: 8000 });
      await expect(viewBtn).toBeEnabled({ timeout: 8000 });
      await viewBtn.click({ timeout: 15000 });
      await page.waitForTimeout(2000);
      globalThis.__func03228 = snap;
  - note: 3、结果页标题为「产业瓶颈堵点识别结果」
    assert: |-
      const snap = globalThis.__func03228;
      if (!snap) throw new Error('前置：未完成过程页');
      const main = page.locator('main').first();
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const url = page.url();
      if (!/产业瓶颈堵点识别结果/.test(body)) {
        throw new Error('结果页未见标题「产业瓶颈堵点识别结果」，片段: ' + body.slice(0, 220));
      }
      await expect(page.getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
      const newTaskId = (() => {
        const fromUrl = url.match(/CHAIN-\d{8}-\d{3}/);
        if (fromUrl) return fromUrl[0];
        const m = body.match(/CHAIN-\d{8}-\d{3}/g);
        return m && m.length ? m[m.length - 1] : '';
      })();
      if (snap.priorTaskId && newTaskId && snap.priorTaskId === newTaskId) {
        throw new Error('结果页任务 ID 与复制前相同（应为新任务）：' + newTaskId);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；steps goto 深链，404 时侧栏 /industry-center/search 兜底。
  用例步骤=诊断记录已完成行「复制配置」→配置区「重新分析」→过程页「查看分析结果」；「重新分析」仅 gateTodayTask 时可见（IndustryDiagnosisPage submit(true)）。
  预期=生成中过程页+「分析结果已生成」+结果标题；现场无确认框，toast「任务已创建…可视化展示分析过程」；新结果 task_id 应不同于复制来源行（若页面上可解析）。
  无已完成/无重新分析入口→ENV-CHAIN-BOTTLENECK-NO-DONE-TASK / NO-COPY-03228 / NO-RERUN-03228。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。A 档零 allow_skip。
