id: FUNC-03218
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03218
priority: P1
title: 诊断记录删除弹框点取消任务仍在
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 诊断记录中有任务（assert 自含）
locators:
  records_tab: tab「诊断记录」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→任一条「删除」→Modal「取消」；弹框文案与行仍在 expect
expect:
  - note: 前置并打开删除弹框（对一条瓶颈任务点「删除」）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck'), {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const scrollRecordActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const pickDeletable = async () => {
        await scrollRecordActions();
        const rows = main().locator('tbody tr, .arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          if (!TID_RE.test(rowText)) continue;
          if (!/产业瓶颈堵点识别/.test(rowText)) continue;
          let del = row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
          if (!(await del.count())) del = row.getByRole('button', { name: '删除', exact: true }).last();
          if (!(await del.count())) continue;
          if (await del.isDisabled().catch(() => true)) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollRecordActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          const tidM = rowText.match(TID_RE);
          if (!tidM) continue;
          return { del, tid: tidM[0], row };
        }
        return null;
      };
      const pickWithPagination = async () => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 20; guard++) {
          const hit = await pickDeletable();
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      await enterBottleneck();
      await openRecordsTab();
      const recBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!TID_RE.test(recBody) && !/暂无|无记录/.test(recBody)) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-RECORDS-03218：诊断记录未见 CHAIN 任务行');
      }
      const picked = await pickWithPagination();
      if (!picked) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-DELETE-03218：有任务但操作列无可见可点「删除」');
      }
      globalThis.__func03218 = { tid: picked.tid, cancelled: false };
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      globalThis.__func03218.modal = modal;
  - note: 1、弹框标题为「删除分析记录」
    assert: |-
      const modal = globalThis.__func03218?.modal;
      if (!modal) throw new Error('前置：删除弹框未打开');
      const title = modal.locator('.arco-modal-title, .arco-modal-header').first();
      await expect(title).toContainText('删除分析记录', { timeout: 5000 });
  - note: 2、正文写明删除后列表不再显示
    assert: |-
      const modal = globalThis.__func03218?.modal;
      if (!modal) throw new Error('前置：删除弹框未打开');
      const body = ((await modal.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/删除|不再显示|列表/.test(body)) {
        throw new Error('删除弹框正文未说明删除后列表不再显示：' + body.slice(0, 200));
      }
  - note: 3、在弹框点「取消」后该任务行仍在
    assert: |-
      const ctx = globalThis.__func03218;
      if (!ctx?.modal) throw new Error('前置：删除弹框未打开');
      const expectedTid = ctx.tid;
      const modal = ctx.modal;
      const cancel = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancel).toBeVisible({ timeout: 5000 });
      await cancel.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      ctx.cancelled = true;
      const main = () => page.locator('main').first();
      const esc = expectedTid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const rowStill = main().locator('tbody tr, .arco-table-tr').filter({ hasText: expectedTid });
      await expect(rowStill.first()).toBeVisible({ timeout: 8000 });
      const bodyAfter = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!new RegExp(esc).test(bodyAfter)) {
        throw new Error('取消删除后任务编号不在诊断记录：' + expectedTid);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；深链 goto + 404 时 sibling 侧栏（03214 同款）。
  步骤=诊断记录 Tab→任一条瓶颈任务「删除」→Modal 标题/正文→「取消」→CHAIN 编号仍在列表（非破坏性；确定删除见 FUNC-03219）。
  无 CHAIN 行→ENV-CHAIN-BOTTLENECK-NO-RECORDS-03218；无可删→ENV-CHAIN-BOTTLENECK-NO-DELETE-03218。
  edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
