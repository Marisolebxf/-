id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00605
priority: P0
title: 五个维度名称为技术人才市场需求资本政策
entry_id: chain-bottleneck
preconditions:
- 已进入产业瓶颈堵点识别页
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
expect:
- note: 五个维度名称为技术、人才、市场需求、资本、政策
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); if ((await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).getAttribute('aria-selected')) !== 'true') { await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).click(); await page.waitForTimeout(800) }; const t = await page.locator('main').first().innerText(); for (const w of ['技术','人才','市场需求','资本','政策']) { if (!t.includes(w)) throw new Error('缺维度名: ' + w) }
- note: 「资本」为独立维名，不出现「资金」第六维
  assert: |-
    const t = await page.locator('main').first().innerText(); const rows = (t.match(/五维诊断维度/g) || []).length; if (rows !== 5) throw new Error('五维诊断维度行数=' + rows); if (/\n\s*资金\s*\n/.test(t)) throw new Error('疑出现资金第六维')
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
