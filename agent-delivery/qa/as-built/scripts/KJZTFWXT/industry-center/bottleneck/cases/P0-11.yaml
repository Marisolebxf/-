  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1200); const view = page.getByRole('button', { name: '查看结果' }).filter({ hasNot: page.locator('[disabled]') }).first(); if (!(await view.count()) || await view.isDisabled()) throw new Error('SKIP: 无已完成可查看结果（失败行查看结果 disabled）'); await view.click(); await page.waitForTimeout(2500); const t = await page.locator('main').first().innerText(); if (!/成因|影响/.test(t)) throw new Error('未见成因/影响'); if (!/改进建议|建议/.test(t)) throw new Error('未见改进建议')
allow_skip: true
skip_reason: 诊断记录仅失败任务，查看结果全部 disabled，无已完成结果可进结果态
