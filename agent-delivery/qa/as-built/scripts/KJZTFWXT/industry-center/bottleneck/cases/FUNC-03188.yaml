id: FUNC-03188
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03188
priority: P0
title: 复制已完成配置后开始分析并打开成功结果页
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已登录
  - 诊断记录里至少有一条已完成任务
locators:
  records_tab: tab「诊断记录」
  copy_config: button「复制配置」
  start: button「开始分析」
  view_result: button「查看分析结果」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进瓶颈→诊断记录→已完成行复制配置→开始分析→查看分析结果（判定在 expect）
expect:
  - note: 1、进入「产业瓶颈堵点识别生成中」过程页；2、过程页出现「分析结果已生成」；3、结果页标题为「产业瓶颈堵点识别结果」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
            await assertNotSpa404('sidebar');
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
            await assertNotSpa404('direct-catalog-fallback');
          }
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
        await assertNotSpa404('bottleneck-landing');
        await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const isBottleneckResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业瓶颈堵点识别结果/.test(t) || (await page.getByText('产业瓶颈堵点识别结果').first().isVisible().catch(() => false));
      };
      const openFromViewBtn = async () => {
        const btn = page.getByRole('button', { name: '查看分析结果' }).first();
        if (await btn.isVisible().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          await page.waitForTimeout(2000);
        }
      };
      await enterBottleneck();
      await openRecordsTab();
      const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ });
      const n = await rows.count();
      if (n < 1) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK：诊断记录无已完成行，无法复制配置发起金样');
      }
      let clicked = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/产业瓶颈堵点识别/.test(rowText)) continue;
        const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
        if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
        await copyBtn.click({ timeout: 15000 });
        clicked = true;
        break;
      }
      if (!clicked) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-COPY-03188：无已完成瓶颈任务可点「复制配置」');
      }
      await page.waitForTimeout(800);
      const toast = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({ hasText: /已复制分析配置/ });
      await expect(toast.first()).toBeVisible({ timeout: 10000 });
      const configTab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
      await expect(configTab).toHaveAttribute('aria-selected', 'true');
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 20000 });
      await start.click({ timeout: 15000 });
      let sawGenerating = false;
      let sawReady = false;
      let last = '';
      for (let i = 0; i < 90; i++) {
        await page.waitForTimeout(i < 4 ? 600 : 1500);
        last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/产业瓶颈堵点识别生成中/.test(last)) sawGenerating = true;
        if (/分析结果已生成/.test(last)) sawReady = true;
        if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(last) && i >= 10) {
          throw new Error('ENV-CHAIN-BOTTLENECK-ASYNC-FAIL-03188：复制配置后分析失败');
        }
        if (sawReady) {
          await openFromViewBtn();
          if (await isBottleneckResult()) break;
        }
        if (await isBottleneckResult() && sawReady) break;
        if (/今日已分析过相同条件/.test(last) && (await isBottleneckResult())) {
          sawGenerating = sawGenerating || /生成中/.test(last);
          sawReady = true;
          break;
        }
      }
      globalThis.__func03188 = { sawGenerating, sawReady, last: last.slice(0, 280) };
      if (!sawGenerating && !/生成中/.test(last)) {
        throw new Error('未见「产业瓶颈堵点识别生成中」过程页，片段: ' + last.slice(0, 180));
      }
      if (!sawReady) {
        throw new Error('过程页未见「分析结果已生成」，片段: ' + last.slice(0, 180));
      }
      if (!(await isBottleneckResult())) {
        await openFromViewBtn();
      }
      await expect(page.getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；goto sibling /industry-center/search 再侧栏进入（edu 深链常 404）。
  金样步骤=诊断记录已完成行「复制配置」→「开始分析」→「查看分析结果」；预期=生成中过程页+「分析结果已生成」+结果标题。
  无已完成→ENV-CHAIN-BOTTLENECK-NO-DONE-TASK / ENV-CHAIN-BOTTLENECK-NO-COPY-03188。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。A 档零 allow_skip。
