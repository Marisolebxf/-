id: FUNC-03197
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03197
priority: P0
title: 技术行查看打开指标说明抽屉并可关闭
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已打开分析配置
locators:
  tech_row: 技术行
  view_btn: 技术行「查看」
  drawer: .arco-drawer:visible
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 技术行「查看」→关闭说明（判定在 expect）
expect:
  - note: 1、抽屉标题为「技术 · 指标说明」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const catalogPath = '/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck';
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      await enterBottleneck();
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('注册诊断维度').first()).toBeVisible({ timeout: 8000 });
      const row = page.getByRole('row').filter({ hasText: '技术' }).filter({ hasText: '技术供给快照' }).first();
      await expect(row).toBeVisible({ timeout: 8000 });
      const view = row.getByRole('button', { name: '查看' }).first();
      await view.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const title = drawer.locator('.arco-drawer-title, .arco-drawer-header').first();
      const titleText = ((await title.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!titleText.includes('技术')) throw new Error('抽屉标题缺指标名：' + titleText);
      if (!titleText.includes('指标说明')) throw new Error('抽屉标题缺「指标说明」：' + titleText);
      globalThis.__func03197 = { drawerOpened: true };
  - note: 2、当前输入为 20%
    assert: |-
      if (!globalThis.__func03197?.drawerOpened) throw new Error('前置：未打开技术指标说明抽屉');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const t = await drawer.innerText();
      if (!/当前输入[\s\S]*20\s*%/.test(t.replace(/\s+/g, ' '))) {
        throw new Error('抽屉「当前输入」应为 20%；片段: ' + t.slice(0, 480));
      }
  - note: 3、关闭后不再显示该抽屉
    assert: |-
      if (!globalThis.__func03197?.drawerOpened) throw new Error('前置：未打开技术指标说明抽屉');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const closeBtn = drawer.locator('.arco-drawer-close-btn').first();
      if (await closeBtn.count()) {
        await closeBtn.click({ timeout: 5000 });
      } else {
        await page.keyboard.press('Escape');
      }
      await page.waitForTimeout(500);
      await expect(page.locator('.arco-drawer:visible')).toHaveCount(0, { timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；steps goto 对齐 catalog_path；深链 SPA 404 时 fallback sibling /industry-center/search + 侧栏「产业瓶颈堵点识别」（同 FUNC-03191）。
  用例=注册诊断维度表「技术」行「查看」→ IndustryMetricSpecDrawer 标题「技术 · 指标说明」；抽屉含「当前输入」20%。
  备注列另字段（指标来源/支撑指标/说明正文等）本条仅验用例预期三列。登录关评审 runner 前置。A 档零 allow_skip。
