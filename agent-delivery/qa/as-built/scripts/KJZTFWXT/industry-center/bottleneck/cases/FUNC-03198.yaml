id: FUNC-03198
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03198
priority: P0
title: 复制配置后开始分析五阶段完成且不自动进结果
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已对一条已完成任务点过「复制配置」（脚本自含复制步骤）
locators:
  records_tab: tab「诊断记录」
  copy_config: button「复制配置」
  start: button「开始分析」
  rerun: button「重新分析」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→已完成行复制配置→开始分析→等过程页终态（判定在 expect）
expect:
  - note: 前置：复制配置后点「开始分析」，进入生成过程或触发重新分析
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const stages = [
        '任务提交与产业链对象冻结',
        '整合各环节技术/人才/资本/政策等时序数据',
        '基于技术成熟度、人才供给量、融资事件、政策覆盖率计算环节健康度',
        '瓶颈智能识别与卡脖子环节归因/改进建议生成',
        '结果可信性校验与分析报告组装',
      ];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck'), {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await page.waitForTimeout(1000);
        }
        if ((await bodyIs404()) && !onTarget()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          const leaf = page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(400);
          }
          if (await leaf.first().isVisible().catch(() => false)) {
            await leaf.first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
          }
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
        await assertNotSpa404('bottleneck-landing');
        await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const copyFromDoneRow = async () => {
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        if (n < 1) {
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK：诊断记录无已完成行，无法复制配置');
        }
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/产业瓶颈堵点识别/.test(rowText)) continue;
          const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
          if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
          await copyBtn.click({ timeout: 15000 });
          await page.waitForTimeout(800);
          const toast = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({ hasText: /已复制分析配置/ });
          await expect(toast.first()).toBeVisible({ timeout: 10000 });
          const configTab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
          await expect(configTab).toHaveAttribute('aria-selected', 'true');
          await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
          return;
        }
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-COPY-03198：无已完成瓶颈任务可点「复制配置」');
      };
      const isResultPage = async () => {
        const t = await main().innerText().catch(() => '');
        return (
          (/view=result/.test(page.url()) && /task_id=/.test(page.url())) ||
          ((await page.getByText('产业瓶颈堵点识别结果').first().isVisible().catch(() => false)) &&
            !/产业瓶颈堵点识别生成中/.test(t) &&
            !/分析结果已生成/.test(t))
        );
      };
      const allStagesDone = (body) => {
        for (const s of stages) {
          if (!body.includes(s)) return false;
          const idx = body.indexOf(s);
          const slice = body.slice(idx, idx + s.length + 48);
          if (!/已完成/.test(slice)) return false;
        }
        return true;
      };
      const tryRerun = async () => {
        const rerun = page.getByRole('button', { name: '重新分析' }).first();
        if (!(await rerun.isVisible().catch(() => false)) || (await rerun.isDisabled().catch(() => true))) return false;
        await rerun.click({ timeout: 12000 });
        await page.waitForTimeout(1200);
        return true;
      };
      const clickStartAnalysis = async () => {
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
      };
      await enterBottleneck();
      await openRecordsTab();
      await copyFromDoneRow();
      await clickStartAnalysis();
      let terminalBody = '';
      let terminalUrl = '';
      let sawGenerating = false;
      let rerunUsed = false;
      for (let i = 0; i < 120; i++) {
        await page.waitForTimeout(i < 6 ? 500 : 900);
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const url = page.url();
        if (/产业瓶颈堵点识别生成中|可视化分析过程/.test(body)) sawGenerating = true;
        if (/分析失败|本次分析生成失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(body) && i >= 12 && !/分析结果已生成/.test(body)) {
          throw new Error('ENV-CHAIN-BOTTLENECK-ASYNC-FAIL-03198：复制配置后分析失败');
        }
        if ((await isResultPage()) && !/分析结果已生成/.test(body) && !sawGenerating) {
          if (!rerunUsed && (await tryRerun())) {
            rerunUsed = true;
            continue;
          }
        }
        if (/今日已分析过相同条件/.test(body) && (await isResultPage())) {
          if (!rerunUsed && (await tryRerun())) {
            rerunUsed = true;
            sawGenerating = false;
            continue;
          }
        }
        if (/分析结果已生成/.test(body) && allStagesDone(body)) {
          terminalBody = body;
          terminalUrl = url;
          break;
        }
        if (allStagesDone(body) && /查看分析结果/.test(body) && !/产业瓶颈堵点识别结果/.test(body)) {
          terminalBody = body;
          terminalUrl = url;
          break;
        }
      }
      if (!terminalBody) {
        const tail = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').slice(0, 280);
        throw new Error('ENV-CHAIN-BOTTLENECK-PROC-03198-001：未等到五阶段均已完成的过程页终态，片段: ' + tail);
      }
      globalThis.__func03198 = { body: terminalBody, url: terminalUrl, sawGenerating };
      if (!sawGenerating && !/产业瓶颈堵点识别生成中/.test(terminalBody) && !/可视化分析过程/.test(terminalBody)) {
        throw new Error('未见生成过程页标识，片段: ' + terminalBody.slice(0, 200));
      }
  - note: 1、五个阶段名称见附录B，结束时均为已完成
    assert: |-
      const snap = globalThis.__func03198;
      if (!snap?.body) throw new Error('前置：未抓取过程页终态');
      const stages = [
        '任务提交与产业链对象冻结',
        '整合各环节技术/人才/资本/政策等时序数据',
        '基于技术成熟度、人才供给量、融资事件、政策覆盖率计算环节健康度',
        '瓶颈智能识别与卡脖子环节归因/改进建议生成',
        '结果可信性校验与分析报告组装',
      ];
      const body = snap.body;
      for (const s of stages) {
        if (!body.includes(s)) throw new Error('过程区缺少阶段「' + s + '」');
        const idx = body.indexOf(s);
        const slice = body.slice(idx, idx + s.length + 48);
        if (!/已完成/.test(slice)) {
          throw new Error('阶段「' + s + '」旁未见「已完成」：' + slice.slice(0, 90));
        }
      }
  - note: 2、出现「分析结果已生成」
    assert: |-
      const snap = globalThis.__func03198;
      if (!snap?.body) throw new Error('前置：未抓取过程页终态');
      if (!/分析结果已生成/.test(snap.body)) {
        throw new Error('过程页未见「分析结果已生成」');
      }
      await expect(page.getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
  - note: 3、页面不自动改为结果页；完成后按钮为「查看分析记录」「查看分析结果」
    assert: |-
      const snap = globalThis.__func03198;
      if (!snap?.body) throw new Error('前置：未抓取过程页终态');
      const t = snap.body;
      if (/产业瓶颈堵点识别结果/.test(t) && !/产业瓶颈堵点识别生成中/.test(t) && !/分析结果已生成/.test(t)) {
        throw new Error('生成结束不应自动进入「产业瓶颈堵点识别结果」页');
      }
      if (/view=result/.test(snap.url || page.url()) && /task_id=/.test(snap.url || page.url())) {
        const onResult = await page.getByText('产业瓶颈堵点识别结果').first().isVisible().catch(() => false);
        if (onResult && !/分析结果已生成/.test(t)) {
          throw new Error('终态 URL 已为结果页，违反「不自动进结果」');
        }
      }
      await expect(page.getByRole('button', { name: '查看分析记录' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '查看分析结果' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '查看分析结果' }).first()).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；steps goto 对齐 catalog_path，深链 404 时再侧栏 sibling 回落。
  步骤=诊断记录已完成行「复制配置」→「开始分析」（当天复用秒进结果时 assert 自点「重新分析」抢过程窗，对齐 03228 前置）。
  五阶段=用例附录B；终态=全阶段「已完成」+「分析结果已生成」+「查看分析记录/查看分析结果」可见且不自动进结果页（现场文案含「生成结束不会自动打开结果页」）。
  无已完成→ENV-CHAIN-BOTTLENECK-NO-DONE-TASK / NO-COPY-03198；过程窗未抓到→ENV-CHAIN-BOTTLENECK-PROC-03198-001。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。A 档零 allow_skip。
