id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00608
priority: P0
title: 只读版本信息四项呈现正确且不可编辑
entry_id: chain-bottleneck
preconditions:
- 已进入页；评审模式开启态可见版本区
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
expect:
- note: 维度版本与权重阈值版本文案正确
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); if ((await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).getAttribute('aria-selected')) !== 'true') { await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).click(); await page.waitForTimeout(800) }; await expect(page.getByText('维度版本')).toBeVisible({ timeout: 8000 }); const d = await page.locator('.arco-form-item').filter({ hasText: '维度版本' }).locator('input').inputValue(); const w = await page.locator('.arco-form-item').filter({ hasText: '权重阈值版本' }).locator('input').inputValue(); if (d !== '五维诊断配置 · 演示版') throw new Error('维度版本=' + d); if (w !== '固定演示版 · 正式口径待闭合') throw new Error('权重阈值版本=' + w)
- note: 模型版本与数据截至正确且四项只读
  assert: |-
    const m = await page.locator('.arco-form-item').filter({ hasText: '模型版本' }).locator('input').inputValue(); const data = await page.locator('.arco-form-item').filter({ hasText: '数据截至' }).locator('input').inputValue(); if (m !== 'bottleneck-model-v1') throw new Error('模型版本=' + m); if (data !== '由任务快照冻结') throw new Error('数据截至=' + data); for (const lab of ['维度版本','权重阈值版本','模型版本','数据截至']) { const input = page.locator('.arco-form-item').filter({ hasText: lab }).locator('input'); const ro = await input.getAttribute('readonly'); if (ro === null && !(await input.isDisabled())) throw new Error(lab + ' 非只读') }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 'D1: 版本值为 readonly input；Q054 演示口径。'
tier: B
