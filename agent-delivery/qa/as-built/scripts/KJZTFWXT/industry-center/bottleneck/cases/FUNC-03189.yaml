id: FUNC-03189
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03189
priority: P0
title: 侧栏进入产业瓶颈堵点识别页标题页签与地址正确
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已登录
locators:
  menu_group: 侧栏分组「产业链分析」
  menu_leaf: 侧栏项「产业瓶颈堵点识别」
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 点「产业链分析」展开→点「产业瓶颈堵点识别」；标题/页签/地址在 expect
expect:
  - note: 3、地址含 workspace=bottleneck 与 tab=bottleneck
    assert: |-
      const spaUrl = (p) =>
        new URL(p.startsWith('/') ? p : '/' + p, (baseUrl || 'http://10.50.69.111:30892/').replace(/\/?$/, '/')).toString();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(bodyGate);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const leafItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
      const expandChainGroup = async () => {
        if (await leafItem().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterBottleneckViaSidebar = async () => {
        await dismissBasket();
        await recover404Shell();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(spaUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
            await recover404Shell();
          }
          if (await bodyIs404()) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: sibling /industry-center/search 404 ' + page.url());
          }
          await expandChainGroup();
          const leaf = leafItem();
          await expect(leaf.first()).toBeVisible({ timeout: 10000 });
          await leaf.first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          if (await bodyIs404()) {
            await page.goto(spaUrl('/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别 SPA 404（侧栏与 catalog 深链均不可用） ' + page.url());
        }
        await expect(page).toHaveURL(/\/industry-center\/diagnosis/);
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      await enterBottleneckViaSidebar();
  - note: 1、页标题为「产业瓶颈堵点识别」
    assert: |-
      await expect(page).toHaveTitle(/产业瓶颈堵点识别 - 科技专题服务系统/);
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
  - note: 2、页签为「产业瓶颈堵点识别」（选中）与「诊断记录」
    assert: |-
      const mainTab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
      const recordsTab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(mainTab).toBeVisible({ timeout: 8000 });
      await expect(recordsTab).toBeVisible({ timeout: 8000 });
      await expect(mainTab).toHaveAttribute('aria-selected', 'true');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）。
  步骤=展开「产业链分析」→点「产业瓶颈堵点识别」；sibling /industry-center/search + spaUrl(baseUrl)。
  对齐 FUNC-03089 侧栏模式。登录关评审 runner 前置。A 档零 allow_skip。
