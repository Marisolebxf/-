id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00603
priority: P0
title: 分析对象三级下拉构成齐备且默认已选值正确
entry_id: chain-bottleneck
preconditions:
- 已进入产业瓶颈堵点识别页
- 配置为默认可读态（若链/细分空则本条会失败，属环境脏会话）
locators:
  cluster: select aria-label「集群」
  chain: select aria-label「产业」
  segment: industry-catalog-select
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
- action: evaluate
  note: 读取三级已选值（title 或可视文案）
expect:
- note: 分析对象区为三级：集群 / 产业 / 细分（industry-catalog-select）控件可见
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; if ((await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).getAttribute('aria-selected')) !== 'true') { await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).click(); await page.waitForTimeout(800) }; await expect(page.locator('.arco-select-view[aria-label="集群"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view[aria-label="产业"]')).toBeVisible({ timeout: 8000 }); await expect(page.locator('.industry-catalog-select').first()).toBeVisible({ timeout: 8000 })
- note: 三级已选值回显为新一代信息技术 / INB1701 / 半导体与集成电路（读 title 或 innerText）
  assert: |-
    const read = async (loc) => ((await loc.getAttribute('title')) || (await loc.innerText()) || '').replace(/\s+/g,' ').trim(); const cluster = page.locator('.arco-select-view[aria-label="集群"]'); const chain = page.locator('.arco-select-view[aria-label="产业"]'); const seg = page.locator('.industry-catalog-select .arco-select-view, .industry-catalog-select').first(); const c = await read(cluster); const h = await read(chain); const s = await read(seg); if (!/新一代信息技术/.test(c)) throw new Error('集群默认不符: ' + c); if (!/INB1701/.test(h)) throw new Error('产业默认不符: ' + h); if (!/半导体与集成电路/.test(s)) throw new Error('细分默认不符: ' + s)
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 'D1: aria-label「集群/产业」+ industry-catalog-select 对应用例「产业/产业链/细分产业」。脏会话链/细分空时本条应红（不 allow_skip）。'
tier: A
