id: FUNC-03192
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03192
priority: P0
title: 默认集群下分析对象产业下拉共 7 项（附录A）
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已打开默认分析配置
  - 分析对象左侧仍为「新一代信息技术」
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 确认左侧集群为新一代信息技术→展开产业下拉（判定在 expect）
expect:
  - note: 前置：分析配置可见且左侧集群为「新一代信息技术」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=bottleneck/);
      await expect(page).toHaveURL(/tab=bottleneck/);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate) && !/产业瓶颈堵点识别/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别 SPA 404 ' + page.url());
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      const read = async (loc) =>
        ((await loc.getAttribute('title')) || (await loc.innerText()) || '').replace(/\s+/g, ' ').trim();
      const cluster = page.locator('.arco-select-view[aria-label="集群"]').first();
      await expect(cluster).toBeVisible({ timeout: 8000 });
      const left = await read(cluster);
      if (!/新一代信息技术/.test(left)) {
        throw new Error('前置：分析对象左侧应为「新一代信息技术」，现场=' + left);
      }
      globalThis.__func03192_ready = true;
  - note: 1、选项共 7 个，名称见附录A
    assert: |-
      if (!globalThis.__func03192_ready) throw new Error('前置：未满足默认分析配置与集群条件');
      const want = [
        '新一代信息技术',
        '半导体与集成电路',
        '人工智能与应用',
        '智能终端',
        '软件与信息服务',
        '新型网络与通信',
        '超高清视频与显示',
      ];
      const industry = page.locator('.arco-select-view[aria-label="产业"]').first();
      await industry.scrollIntoViewIfNeeded();
      await industry.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const count = await options.count();
      const got = [];
      for (let i = 0; i < count; i++) {
        got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim().split('\n')[0].trim());
      }
      if (count !== 7) {
        throw new Error('产业下拉选项应为 7 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error(
            '产业下拉选项顺序/文案不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got),
          );
        }
      }
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；edu 侧栏兄弟 /industry-center/search 404，本条与 FUNC-03191 同走深链 goto。
  用例「分析对象下右侧下拉」= 现场 aria-label「产业」；左侧 aria-label「集群」默认新一代信息技术。
  7 项对齐用例册附录A（03192）。点法 P7：.arco-select-view[aria-label=产业] + .arco-trigger-popup .arco-select-option。
  登录关评审 runner 前置。A 档零 allow_skip。
