id: FUNC-03217
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03217
priority: P1
title: 诊断记录每页条数改为 20
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 已打开「诊断记录」页签（assert 自含进入与 Tab 切换）
locators:
  records_tab: tab「诊断记录」
  records_pagination: main 内 .arco-pagination
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→展开每页条数→选 20 条/页；选项与回显在 expect
expect:
  - note: 步骤 1=展开每页条数；预期 1=选项含 10 条/页、20 条/页、50 条/页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const optSel = '.arco-select-dropdown:visible .arco-select-option, .arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck'), {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      const recordsPagination = () => main().locator('.arco-pagination').first();
      const openPageSizeDropdown = async () => {
        const pag = recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const trigger = pag.locator('.arco-select-view').first();
        if (await trigger.count()) {
          await trigger.click({ timeout: 8000 });
        } else {
          const byText = pag.getByText(/\d+\s*条\/页/);
          if (!(await byText.count())) throw new Error('分页区未见每页条数控件');
          await byText.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(500);
      };
      await enterBottleneck();
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      await openPageSizeDropdown();
      const opts = page.locator(optSel);
      await expect(opts.first()).toBeVisible({ timeout: 8000 });
      const optText = ((await opts.allInnerTexts().catch(() => [])) || []).join(' ').replace(/\s+/g, ' ');
      for (const label of ['10 条/页', '20 条/页', '50 条/页']) {
        if (!optText.includes(label.replace(/\s/g, '')) && !new RegExp(label.replace(/\//, '\\/')).test(optText)) {
          const compact = optText.replace(/\s/g, '');
          const want = label.replace(/\s/g, '');
          if (!compact.includes(want)) {
            throw new Error('预期 1 失败：下拉未见「' + label + '」，现场=' + optText.slice(0, 160));
          }
        }
      }
      globalThis.__func03217 = { ready: true };
  - note: 步骤 2=选「20 条/页」；预期 2=分页条显示「20 条/页」
    assert: |-
      if (!globalThis.__func03217?.ready) throw new Error('前置：每页条数下拉未展开');
      const optSel = '.arco-select-dropdown:visible .arco-select-option, .arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const main = () => page.locator('main').first();
      const recordsPagination = () => main().locator('.arco-pagination').first();
      const opt20 = page.locator(optSel).filter({ hasText: /20\s*条\s*\/\s*页/ }).first();
      if (!(await opt20.count())) {
        const pag = recordsPagination();
        const trigger = pag.locator('.arco-select-view').first();
        if (await trigger.count()) await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      }
      const opt20b = page.locator(optSel).filter({ hasText: /20\s*条\s*\/\s*页/ }).first();
      if (!(await opt20b.count())) {
        throw new Error('每页条数下拉未见「20 条/页」');
      }
      await opt20b.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const pag = recordsPagination();
      const after = ((await pag.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/20\s*条\s*\/\s*页/.test(after)) {
        throw new Error('预期 2 失败：分页区未回显「20 条/页」，现场=' + after.slice(0, 120));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck；步骤=Tab「诊断记录」→展开每页条数→选「20 条/页」。
  机检=下拉含 10/20/50 且分页回显 20 条/页。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
