id: FUNC-03193
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03193
priority: P0
title: 默认条件下所属产业链下拉共 6 项（附录A）
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已打开默认分析配置
locators:
  chain_field: main .diagnosis-config-identity .arco-form-item
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 展开「所属产业链」下拉（判定在 expect）
expect:
  - note: 前置：分析配置可见；默认展示「半导体与集成电路」
    assert: |-
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=bottleneck/);
      await expect(page).toHaveURL(/tab=bottleneck/);
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      const chainItem = page.locator('main .diagnosis-config-identity .arco-form-item').filter({ hasText: '所属产业链' });
      const chainSeg = chainItem.locator('.arco-select-view');
      await expect(chainSeg).toBeVisible({ timeout: 12000 });
      await expect(chainSeg).toContainText('半导体与集成电路', { timeout: 8000 });
      globalThis.__func03193_ready = true;
  - note: 1、选项共 6 个，名称见附录A
    assert: |-
      if (!globalThis.__func03193_ready) throw new Error('前置：未满足默认分析配置');
      const want = [
        '半导体与集成电路',
        '人工智能与应用',
        '新型网络与通信',
        '超高清视频与显示',
        '智能终端',
        '软件与信息服务',
      ];
      const chainItem = page.locator('main .diagnosis-config-identity .arco-form-item').filter({ hasText: '所属产业链' });
      const chainSeg = chainItem.locator('.arco-select-view');
      await chainSeg.scrollIntoViewIfNeeded();
      await chainSeg.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option');
      const count = await options.count();
      const got = [];
      for (let i = 0; i < count; i++) {
        got.push(((await options.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim().split('\n')[0].trim());
      }
      if (count !== 6) {
        throw new Error('所属产业链下拉选项应为 6 个，实际 count=' + count + ' labels=' + JSON.stringify(got));
      }
      for (let i = 0; i < want.length; i++) {
        if (got[i] !== want[i]) {
          throw new Error(
            '所属产业链下拉选项顺序/文案不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(got),
          );
        }
      }
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；steps goto 对齐 catalog_path（同 FUNC-03191/03192 配置区用例）。
  用例「所属产业链」= 现场 .industry-catalog-select 内 Arco Select；默认半导体与集成电路（备注）。
  6 项对齐用例册附录A（03193）。点法 P7：.industry-catalog-select .arco-select-view + .arco-trigger-popup .arco-select-option。
  edu 侧栏 sibling 若 SPA 404 可记 note，本脚本不改用 forbidden_paths。登录关评审 runner 前置。A 档零 allow_skip。
