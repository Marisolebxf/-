id: P1-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00620
priority: P1
title: 诊断记录列表瓶颈类型可辨且可过滤
entry_id: chain-bottleneck
preconditions:
- 已进入页
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
- action: click
  target: 诊断记录
expect:
- note: 列表列出本工作空间历史任务且瓶颈类型可辨识
  assert: |-
    await page.goto('http://111.198.38.90:50892/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); await page.getByRole('tab', { name: '诊断记录' }).click(); await page.waitForTimeout(1200); await expect(page.getByText('诊断记录').first()).toBeVisible({ timeout: 8000 }); const t = await page.locator('main').first().innerText(); if (!/产业瓶颈堵点识别/.test(t)) throw new Error('列表未见瓶颈类型可辨识文案'); if (!/CHAIN-|暂无|无记录|空|共\s*\d+\s*条/.test(t)) throw new Error('未见任务行或空态')
- note: 过滤条件含状态/类型/时间口径且无错误 toast
  assert: |-
    const t = await page.locator('main').first().innerText(); if (!/状态|任务状态|全部状态/.test(t)) throw new Error('缺状态过滤'); if (!/类型|创建时间/.test(t)) throw new Error('缺类型或时间列'); const err = await page.locator('.arco-message-error').count(); if (err) throw new Error('诊断记录页有错误提示')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 'D1: 实勘 4 条失败任务，「查看结果」disabled 不在本条断言（见 P0-11）。'
tier: B
