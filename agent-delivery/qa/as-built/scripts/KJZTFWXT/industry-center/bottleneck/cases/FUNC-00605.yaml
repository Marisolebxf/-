id: FUNC-00605
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00605
priority: P0
title: 五维度名称与资本口径
entry_id: chain-bottleneck
tier: B
preconditions:
  - 已进入产业瓶颈堵点识别页
locators:
  config_tab: tab「产业瓶颈堵点识别」
  dim_table: 注册诊断维度表
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 侧栏进瓶颈页→配置页签→逐行读「指标名称」
expect:
  - note: 1、五个维度名称为技术、人才、市场需求、资本、政策
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          if (await bodyIs404()) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: sibling /industry-center/search 404 ' + page.url());
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          if (await leaf().first().isVisible().catch(() => false)) {
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 }).catch(() => {});
          } else {
            await page.goto(toUrl('/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck'), {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(1000);
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别 SPA 404 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      await enterBottleneck();
      const configTab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
      if ((await configTab.getAttribute('aria-selected')) !== 'true') {
        await configTab.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      }
      await expect(configTab).toHaveAttribute('aria-selected', 'true');
      await expect(page.getByText('注册诊断维度').first()).toBeVisible({ timeout: 12000 });
      const main = page.locator('main').first();
      const dimRows = main.locator('tbody tr, .arco-table-tr').filter({ hasText: '五维诊断维度' });
      const rowCount = await dimRows.count();
      if (rowCount !== 5) {
        throw new Error('注册诊断维度表「五维诊断维度」行数应为 5，实际=' + rowCount);
      }
      const want = ['技术', '人才', '市场需求', '资本', '政策'];
      const readName = async (row) => {
        const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        for (const w of want) {
          if (new RegExp('(^|\\s)' + w + '(\\s|$)').test(t)) return w;
        }
        const cells = row.locator('td');
        if (await cells.count()) {
          const c0 = ((await cells.nth(0).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (want.includes(c0)) return c0;
          const c1 = ((await cells.nth(1).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (want.includes(c1)) return c1;
        }
        return t.slice(0, 40);
      };
      const names = [];
      for (let i = 0; i < rowCount; i++) {
        names.push(await readName(dimRows.nth(i)));
      }
      globalThis.__func00605 = { names, rowCount };
      for (let i = 0; i < want.length; i++) {
        if (names[i] !== want[i]) {
          throw new Error('维度名称顺序不符：期望 ' + JSON.stringify(want) + ' 实际 ' + JSON.stringify(names));
        }
      }
  - note: 2、「资本」为独立维名，不出现「资金」拆出的第六维
    assert: |-
      const st = globalThis.__func00605;
      if (!st || !Array.isArray(st.names)) {
        throw new Error('前置：未读取注册诊断维度表指标名称');
      }
      const { names, rowCount } = st;
      if (!names.includes('资本')) {
        throw new Error('缺少独立维度名「资本」，现场=' + JSON.stringify(names));
      }
      if (names.includes('资金')) {
        throw new Error('疑出现「资金」作为第六维指标名称：' + JSON.stringify(names));
      }
      if (rowCount !== 5 || names.length !== 5) {
        throw new Error('维度行数应为 5，实际 rowCount=' + rowCount + ' names=' + JSON.stringify(names));
      }
      const main = page.locator('main').first();
      const fundRow = main.locator('tbody tr, .arco-table-tr').filter({ hasText: /^\\s*资金\\s*$/ });
      if (await fundRow.count()) {
        throw new Error('表内存在独立「资金」维度行');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；edu 深链常 404，goto sibling /industry-center/search 再侧栏进入。
  用例步骤「逐行读取维度名称」= 注册诊断维度表「指标名称」列（分组列为五维诊断维度，现场 5 行）。
  资本为第 4 维；禁止第六维「资金」。登录关评审 runner 前置。B 档。
