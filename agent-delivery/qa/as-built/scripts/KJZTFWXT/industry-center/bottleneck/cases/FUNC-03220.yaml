id: FUNC-03220
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03220
priority: P1
tier: B
title: 备选-开始分析-当天复用已有结果
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 同册03188/03207：当天已成功→回到配置→再点开始分析（逻辑在 expect）
expect:
  - note: 1、打开已有结果页
    assert: |-
      const main = () => page.locator('main').first();
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 15000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const openConfigTab = async () => {
        const tab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(800);
      };
      const recordTotal = async () => {
        const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = t.match(/共(\d+)条/);
        if (m) return Number(m[1]);
        return main().locator('tbody tr, .arco-table-tr').count();
      };
      const onResultPage = async () => {
        const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /产业瓶颈堵点识别结果/.test(t);
      };
      const openResultFromRecords = async () => {
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /产业瓶颈堵点识别/ }).filter({ hasText: /已完成/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const viewBtn = row.getByRole('button', { name: '查看结果' }).first();
          if (!(await viewBtn.count()) || (await viewBtn.isDisabled().catch(() => true))) continue;
          await viewBtn.click({ timeout: 15000 });
          await page.waitForTimeout(2500);
          if (await onResultPage()) return;
          await openRecordsTab();
        }
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK');
      };
      const copyConfigStartToResult = async () => {
        await openConfigTab();
        await openRecordsTab();
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /产业瓶颈堵点识别/ }).filter({ hasText: /已完成/ });
        let copied = false;
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
          if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
          await copyBtn.click({ timeout: 15000 });
          copied = true;
          break;
        }
        if (!copied) throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK');
        await page.waitForTimeout(800);
        const chainField = main().locator('.arco-form-item').filter({ hasText: '所属产业链' }).first();
        const sel = chainField.locator('.arco-select-view').first();
        if (await sel.count()) {
          const txt = ((await sel.innerText().catch(() => '')) || '').trim();
          if (!txt) {
            await sel.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(400);
            const opt = page.getByRole('option', { name: '半导体与集成电路' }).first();
            if (await opt.isVisible().catch(() => false)) {
              await opt.click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          }
        }
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
        let ready = false;
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 600 : 1200);
          const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/DIM_PACK_UNAVAILABLE|分析失败|INPUT_OBJECT_INVALID/.test(body) && i >= 8) {
            throw new Error('修订 前置分析失败：' + body.slice(0, 120));
          }
          if (/分析结果已生成/.test(body)) ready = true;
          if (await onResultPage()) return;
          if (ready) {
            const view = page.getByRole('button', { name: '查看分析结果' }).first();
            if (await view.isEnabled().catch(() => false)) {
              await view.click({ timeout: 12000 });
              await page.waitForTimeout(1500);
            }
            if (await onResultPage()) return;
          }
          if (/今日已分析过相同条件/.test(body) && (await onResultPage())) return;
        }
        if (!(await onResultPage())) {
          throw new Error('修订 前置未能打开结果页');
        }
      };
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 15000 });
      await openRecordsTab();
      try {
        await openResultFromRecords();
      } catch (e) {
        if (!String(e?.message || e).includes('NO-DONE-TASK')) throw e;
        await copyConfigStartToResult();
      }
      await expect(main().getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
      await main().getByRole('button', { name: '按此配置新建分析' }).click({ timeout: 15000 });
      await page.waitForTimeout(800);
      await expect(main().getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 15000 });
      await openRecordsTab();
      globalThis.__func03220Before = await recordTotal();
      await openConfigTab();
      const startAgain = page.getByRole('button', { name: '开始分析' }).first();
      await expect(startAgain).toBeEnabled({ timeout: 20000 });
      await startAgain.click({ timeout: 15000 });
      let opened = false;
      for (let i = 0; i < 60; i++) {
        await page.waitForTimeout(i < 6 ? 500 : 900);
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/尚未选择分析对象/.test(body) && i > 5) {
          throw new Error('修订 点开始分析仍提示尚未选择分析对象');
        }
        if (await onResultPage()) {
          opened = true;
          break;
        }
        if (/分析结果已生成/.test(body)) {
          const view = page.getByRole('button', { name: '查看分析结果' }).first();
          if (await view.isEnabled().catch(() => false)) {
            await view.click({ timeout: 12000 });
            await page.waitForTimeout(1200);
          }
          if (await onResultPage()) {
            opened = true;
            break;
          }
        }
      }
      if (!opened) {
        const tail = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').slice(0, 240);
        throw new Error('未见已有结果页，片段: ' + tail);
      }
      await expect(main().getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 15000 });
  - note: 2、诊断记录不新增任务
    assert: |-
      const main = () => page.locator('main').first();
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const recordTotal = async () => {
        const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = t.match(/共(\d+)条/);
        if (m) return Number(m[1]);
        return main().locator('tbody tr, .arco-table-tr').count();
      };
      await openRecordsTab();
      const after = await recordTotal();
      const before = globalThis.__func03220Before;
      if (typeof before !== 'number') {
        throw new Error('修订 缺少前置任务计数');
      }
      if (after !== before) {
        throw new Error(`修订 诊断记录条数变化 ${before}→${after}`);
      }
on_fail: 截图 + 抄 X-Trace-Id
