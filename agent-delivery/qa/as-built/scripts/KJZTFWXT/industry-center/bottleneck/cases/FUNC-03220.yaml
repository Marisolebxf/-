id: FUNC-03220
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03220
priority: P1
title: 当天已成功后再点开始分析应打开已有结果
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: B
preconditions:
  - 同一账号当天已有一条本页成功分析（assert 自含复制配置首次到达成功结果）
locators:
  copy_config: button「复制配置」
  start: button「开始分析」
  new_from_config: button「按此配置新建分析」
  same_day_hint: 今日已分析过相同条件，已打开结果
steps:
  - action: goto
    target: /industry-center/search
  - action: wait
    for: 侧栏 sibling 就绪
    timeout_ms: 1500
  - action: evaluate
    note: 首次成功→按此配置新建→再次开始分析；三条预期在 expect
expect:
  - note: 1、打开已有结果页（含当天复用提示，口径对齐关键环节/周期）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const HINT = /今日已分析过相同条件，已打开结果/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const assertNotSpa404 = async (where) => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t)) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别 SPA 404 @' + where + ' ' + page.url());
        }
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget()) {
          if (!/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await assertNotSpa404('sibling-search');
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await expect(leaf().first()).toBeVisible({ timeout: 10000 });
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          await assertNotSpa404('sidebar');
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
        await assertNotSpa404('bottleneck-landing');
        await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
      };
      const isBottleneckResult = async () => {
        const t = await main().innerText().catch(() => '');
        return /产业瓶颈堵点识别结果/.test(t) || (await page.getByText('产业瓶颈堵点识别结果').first().isVisible().catch(() => false));
      };
      const openFromViewBtn = async () => {
        const btn = page.getByRole('button', { name: '查看分析结果' }).first();
        if (await btn.isVisible().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          await page.waitForTimeout(2000);
        }
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
      };
      const copyConfigFromDoneRow = async () => {
        await openRecordsTab();
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /产业瓶颈堵点识别/ });
        const n = await rows.count();
        if (n < 1) {
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK：诊断记录无瓶颈任务行，无法满足当天成功前置');
        }
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/产业瓶颈堵点识别/.test(rowText)) continue;
          const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
          if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
          await copyBtn.click({ timeout: 15000 });
          await page.waitForTimeout(800);
          const toast = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({ hasText: /已复制分析配置/ });
          await expect(toast.first()).toBeVisible({ timeout: 10000 });
          await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
          return;
        }
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-COPY-03220：无已完成瓶颈任务可点「复制配置」');
      };
      const waitSuccessAfterStart = async () => {
        let last = '';
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 600 : 1500);
          last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (await isBottleneckResult()) return { sameDayHint: HINT.test(last) };
          const toast = page.locator('.arco-message, .arco-notification').filter({ hasText: HINT });
          if (await toast.count() && (await toast.first().isVisible().catch(() => false)) && (await isBottleneckResult())) {
            return { sameDayHint: true };
          }
          if (/分析结果已生成/.test(last)) {
            await openFromViewBtn();
            if (await isBottleneckResult()) return { sameDayHint: HINT.test(last) };
          }
          if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(last) && i >= 10) {
            throw new Error('ENV-CHAIN-BOTTLENECK-ASYNC-FAIL-03220：复制配置后分析无法完成');
          }
        }
        throw new Error('首次分析未在超时内到达成功结果：' + last.slice(0, 220));
      };
      const reachTodaySuccessOnce = async () => {
        if (await isBottleneckResult()) return { sameDayHint: HINT.test(await main().innerText().catch(() => '')) };
        await copyConfigFromDoneRow();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 8; i++) {
          await page.waitForTimeout(500);
          const last = await main().innerText().catch(() => '');
          if (HINT.test(last) && (await isBottleneckResult())) return { sameDayHint: true };
        }
        return await waitSuccessAfterStart();
      };
      const extractTaskId = async () => {
        const fromUrl = new URL(page.url()).searchParams.get('task_id') || '';
        if (fromUrl && TID_RE.test(fromUrl)) return fromUrl;
        const body = await main().innerText().catch(() => '');
        return (body.match(TID_RE) || [])[0] || '';
      };
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      const backToConfigFromResult = async () => {
        const newBtn = page.getByRole('button', { name: '按此配置新建分析' }).first();
        if (await newBtn.isVisible().catch(() => false)) {
          await newBtn.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
        } else {
          const back = page.getByRole('button', { name: '返回配置' }).first();
          if (await back.isVisible().catch(() => false)) {
            await back.click({ timeout: 10000 });
            await page.waitForTimeout(1200);
          } else {
            await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first().click({ timeout: 8000 });
            await page.waitForTimeout(1000);
          }
        }
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      };
      await enterBottleneck();
      await reachTodaySuccessOnce();
      if (!(await isBottleneckResult())) {
        await openFromViewBtn();
      }
      await expect(page.getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
      const taskFirst = await extractTaskId();
      if (!taskFirst) throw new Error('首次成功未见 CHAIN 任务标识');
      await backToConfigFromResult();
      await openRecordsTab();
      const nBefore = await countChainRows();
      await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      const start2 = page.getByRole('button', { name: '开始分析' }).first();
      if (!(await start2.isEnabled().catch(() => false))) {
        throw new Error('回到分析配置后「开始分析」不可用（对象未回填）');
      }
      await start2.click({ timeout: 15000 });
      let sawHint = false;
      let last = '';
      let sawNoObject = false;
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        last = await main().innerText().catch(() => '');
        const toast = page.locator('.arco-message, .arco-notification');
        const toastText = ((await toast.allInnerTexts().catch(() => [])) || []).join(' ');
        if (/尚未选择分析对象/.test(last + toastText)) sawNoObject = true;
        if (HINT.test(last + toastText)) sawHint = true;
        if (await toast.filter({ hasText: HINT }).count()) sawHint = true;
        if (sawHint && (await isBottleneckResult())) break;
        if (await isBottleneckResult() && (HINT.test(last) || sawHint)) {
          sawHint = true;
          break;
        }
      }
      if (sawNoObject && !(await isBottleneckResult())) {
        throw new Error('缺陷候选：二次开始提示「尚未选择分析对象」，未打开已有结果（用例备注 03220）');
      }
      globalThis.__func03220 = { taskFirst, nBefore, sawHint, lastBody: last };
      if (!sawHint && (await isBottleneckResult())) {
        sawHint = HINT.test(last);
      }
      if (!sawHint) {
        await expect(page.getByText('今日已分析过相同条件，已打开结果').first()).toBeVisible({ timeout: 8000 });
      }
  - note: 2、打开的任务与当天已成功的那次相同（同一 task_id / 结果页）
    assert: |-
      const ctx = globalThis.__func03220;
      if (!ctx) throw new Error('前置：未完成二次开始分析');
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      await expect(page.getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 15000 });
      const taskSecond =
        new URL(page.url()).searchParams.get('task_id') ||
        (await main().innerText().catch(() => '')).match(TID_RE)?.[0] ||
        '';
      if (ctx.taskFirst && taskSecond && ctx.taskFirst !== taskSecond) {
        throw new Error('同条件当天复用 task_id 不一致：' + ctx.taskFirst + ' vs ' + taskSecond);
      }
      if (!taskSecond && ctx.taskFirst) {
        const body = await main().innerText().catch(() => '');
        if (!body.includes(ctx.taskFirst)) {
          throw new Error('结果页未见原任务号 ' + ctx.taskFirst);
        }
      }
      const body = await main().innerText().catch(() => ctx.lastBody || '');
      if (/产业瓶颈堵点识别生成中/.test(body) && !/产业瓶颈堵点识别结果/.test(body)) {
        throw new Error('二次开始后仍停生成中页，未打开已有结果');
      }
  - note: 3、诊断记录不新增任务
    assert: |-
      const ctx = globalThis.__func03220;
      if (!ctx) throw new Error('前置：未完成二次开始分析');
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = await countChainRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('诊断记录 CHAIN 条数增加：' + ctx.nBefore + ' -> ' + nAfter + '（当天复用应不新增）');
      }
      const body = await main().innerText().catch(() => '');
      if (ctx.taskFirst && !body.includes(ctx.taskFirst)) {
        throw new Error('诊断记录列表未见原任务 ' + ctx.taskFirst);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；goto sibling /industry-center/search 再侧栏进入。
  前置自含=诊断记录已完成行「复制配置」→「开始分析」至成功结果（对齐 03188 指纹）。步骤=结果页「按此配置新建分析」→再点「开始分析」→当天复用+同一 CHAIN task_id+诊断记录条数不增。
  现场缺陷候选：二次开始仅提示「尚未选择分析对象」→ assert 显式 fail。无已完成→ENV-CHAIN-BOTTLENECK-NO-DONE-TASK / NO-COPY-03220。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
