id: FUNC-03199
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03199
priority: P0
title: 过程页查看分析记录进入诊断记录
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 过程页已出现「分析结果已生成」（assert 自含：复制配置发起或复用至该态）
locators:
  view_records: button「查看分析记录」
  records_tab: tab「诊断记录」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 过程页「分析结果已生成」→点「查看分析记录」；诊断记录 Tab 与表头在 expect
expect:
  - note: 1、页签切到「诊断记录」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const catalogPath = '/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck';
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
        await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const startFromCopyConfig = async () => {
        await openRecordsTab();
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        if (n < 1) {
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK：诊断记录无已完成行，无法复制配置发起过程页');
        }
        let clicked = false;
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/产业瓶颈堵点识别/.test(rowText)) continue;
          const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
          if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
          await copyBtn.click({ timeout: 15000 });
          clicked = true;
          break;
        }
        if (!clicked) {
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-COPY-03199：无已完成瓶颈任务可点「复制配置」');
        }
        await page.waitForTimeout(800);
        const toast = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({ hasText: /已复制分析配置/ });
        await expect(toast.first()).toBeVisible({ timeout: 10000 });
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
      };
      const tryRerunFromResult = async () => {
        const rerun = page
          .getByRole('button', { name: '重新分析' })
          .first()
          .or(page.getByRole('button', { name: '按此配置新建分析' }).first());
        if (!(await rerun.isVisible().catch(() => false))) return false;
        await rerun.click({ timeout: 10000 });
        await page.waitForTimeout(1000);
        return true;
      };
      const ensureReadyOnProcess = async () => {
        await enterBottleneck();
        let body = await main().innerText().catch(() => '');
        let url = page.url();
        if (/分析结果已生成/.test(body)) {
          globalThis.__func03199 = { readyRecords: false };
          return;
        }
        if (/产业瓶颈堵点识别结果/.test(body) && !/产业瓶颈堵点识别生成中/.test(body)) {
          if (!(await tryRerunFromResult())) {
            throw new Error('ENV-CHAIN-BOTTLENECK-DAY-REUSE-03199：已在结果页且无重跑入口');
          }
          body = await main().innerText().catch(() => '');
          url = page.url();
          if (/分析结果已生成/.test(body)) {
            globalThis.__func03199 = { readyRecords: false };
            return;
          }
        }
        const startBtn = page.getByRole('button', { name: '开始分析' }).first();
        const onConfig =
          /分析配置/.test(body) &&
          (await startBtn.isVisible().catch(() => false)) &&
          (await startBtn.isEnabled().catch(() => false));
        if (onConfig) {
          await startBtn.click({ timeout: 15000 });
        } else if (!/产业瓶颈堵点识别生成中/.test(body) && !/分析结果已生成/.test(body)) {
          await startFromCopyConfig();
        }
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 600 : 1500);
          body = await main().innerText().catch(() => '');
          url = page.url();
          if (/分析结果已生成/.test(body)) {
            globalThis.__func03199 = { readyRecords: false };
            return;
          }
          if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(body) && i >= 10) {
            throw new Error('ENV-CHAIN-BOTTLENECK-ASYNC-FAIL-03199：分析未达「分析结果已生成」');
          }
          if (/今日已分析过相同条件/.test(body) && /产业瓶颈堵点识别结果/.test(body)) {
            if (await tryRerunFromResult()) {
              const s = page.getByRole('button', { name: '开始分析' }).first();
              if (await s.isEnabled().catch(() => false)) await s.click({ timeout: 15000 });
            }
          }
        }
        throw new Error('过程页超时未见「分析结果已生成」，片段: ' + body.replace(/\s+/g, ' ').slice(0, 200));
      };
      await ensureReadyOnProcess();
      await expect(main().getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
      const recordsBtn = page.getByRole('button', { name: '查看分析记录' }).first();
      await expect(recordsBtn).toBeVisible({ timeout: 8000 });
      await recordsBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      const urlAfter = page.url();
      if (!/tab=records|view=records/.test(urlAfter)) {
        const bodyAfter = await main().innerText().catch(() => '');
        if (!/诊断记录/.test(bodyAfter) || !/任务状态|全部状态/.test(bodyAfter)) {
          throw new Error('点「查看分析记录」后未见诊断记录区，url=' + urlAfter);
        }
      }
      globalThis.__func03199 = globalThis.__func03199 || {};
      globalThis.__func03199.readyRecords = true;
  - note: 2、列表含任务、类型、状态、创建时间、操作
    assert: |-
      if (!globalThis.__func03199?.readyRecords) throw new Error('前置：未进入诊断记录');
      const main = page.locator('main').first();
      const headers = ['任务', '类型', '状态', '创建时间', '操作'];
      const table = main().locator('table').first();
      if (await table.count()) {
        const thTexts = await table.locator('thead th, thead .arco-table-th').allInnerTexts();
        const joined = thTexts.join(' ');
        for (const h of headers) {
          if (!joined.includes(h)) throw new Error('表头缺列「' + h + '」；thead=' + joined.replace(/\s+/g, ' '));
        }
      } else {
        const body = await main().innerText().catch(() => '');
        for (const h of headers) {
          if (!body.includes(h)) throw new Error('表头缺列「' + h + '」；main=' + body.replace(/\s+/g, ' ').slice(0, 320));
        }
      }
      const rows = main().locator('tbody tr, .arco-table-tr');
      const n = await rows.count();
      if (n < 1) {
        const body = await main().innerText().catch(() => '');
        if (/暂无数据/.test(body)) {
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-RECORDS-03199：诊断记录列表暂无数据行');
        }
        throw new Error('诊断记录未见表格数据行');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；steps goto 深链，enterBottleneck 深链优先、侧栏 /industry-center/search 兜底（同 FUNC-03191）。
  用例前置=过程页「分析结果已生成」；步骤=点「查看分析记录」（非「查看分析结果」）。机检=诊断记录 Tab aria-selected + 表头五列任务/类型/状态/创建时间/操作 + 至少一行列表。
  兜底=诊断记录已完成行复制配置→开始分析（同 FUNC-03188）；当天结果页→重新分析/按此配置新建分析。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
