id: FUNC-03199
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03199
priority: P0
title: 过程页查看分析记录进入诊断记录
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 过程页已出现「分析结果已生成」（assert 自含：复制配置发起或复用至该态）
locators:
  view_records: button「查看分析记录」
  records_tab: tab「诊断记录」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 过程页「分析结果已生成」→点「查看分析记录」；诊断记录 Tab 与表头在 expect
expect:
  - note: 1、页签切到「诊断记录」
    assert: |-
      const main = () => page.locator('main').first();
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 15000 });
      const reachProcessReady = async () => {
        let body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/分析结果已生成/.test(body)) return;
        const start = page.getByRole('button', { name: '开始分析' }).first();
        if (/分析配置/.test(body) && (await start.isEnabled().catch(() => false))) {
          await start.click({ timeout: 15000 });
          for (let i = 0; i < 60; i++) {
            await page.waitForTimeout(i < 4 ? 800 : 1500);
            body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
            if (/分析结果已生成/.test(body)) return;
            if (/本次分析生成失败|分析失败|DIM_PACK_UNAVAILABLE/.test(body) && i >= 8) break;
          }
        }
        const recordsTab = page.getByRole('tab', { name: '诊断记录' }).first();
        if (await recordsTab.isVisible().catch(() => false)) {
          await recordsTab.click({ timeout: 10000 });
          await page.waitForTimeout(800);
          const rows = main().locator('tbody tr, .arco-table-tr');
          for (let i = 0; i < Math.min(await rows.count(), 15); i++) {
            const row = rows.nth(i);
            const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
            if (!/产业瓶颈堵点识别/.test(rowText) || !/已完成|成功/.test(rowText)) continue;
            const view = row.getByRole('button', { name: '查看结果' }).first();
            if (await view.count()) {
              await view.click({ timeout: 12000 });
              await page.waitForTimeout(1200);
              body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
              if (/分析结果已生成/.test(body)) return;
            }
          }
        }
      };
      await reachProcessReady();
      const recordsBtn = page.getByRole('button', { name: '查看分析记录' }).first();
      await expect(recordsBtn).toBeVisible({ timeout: 12000 });
      await recordsBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      globalThis.__func03199 = { readyRecords: true };
  - note: 2、列表含任务、类型、状态、创建时间、操作
    assert: |-
      if (!globalThis.__func03199?.readyRecords) throw new Error('前置：未进入诊断记录');
      const main = page.locator('main').first();
      const headers = ['任务', '类型', '状态', '创建时间', '操作'];
      const table = main().locator('table').first();
      await expect(table).toBeVisible({ timeout: 10000 });
      const thTexts = await table.locator('thead th, thead .arco-table-th').allInnerTexts();
      const joined = thTexts.join(' ');
      for (const h of headers) {
        if (!joined.includes(h)) throw new Error('表头缺列「' + h + '」');
      }
      const n = await main().locator('tbody tr, .arco-table-tr').count();
      if (n < 1) throw new Error('诊断记录未见数据行');
on_fail: 截图 + X-Trace-Id + C1~C6
