id: FUNC-03190
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03190
priority: P0
title: 分析配置区展示对象、维度表与两个操作按钮
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已打开产业瓶颈堵点识别页
locators:
  tab_main: tab「产业瓶颈堵点识别」
  config_heading: 分析配置
  reset: button「重置参数」
  start: button「开始分析」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 停留在「产业瓶颈堵点识别」页签；配置区构成判定在 expect
expect:
  - note: 1、可见「分析配置」「分析对象」「所属产业链」「注册诊断维度」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          if (!/\/industry-center\/search/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          if (await bodyIs404()) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
          }
          const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
          const expandChain = async () => {
            if (await leaf().first().isVisible().catch(() => false)) return;
            const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
            if (await sub.count()) {
              await sub.first().click({ timeout: 8000 });
              await page.waitForTimeout(400);
            }
          };
          await expandChain();
          await leaf().first().click({ timeout: 10000 });
          await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      await enterBottleneck();
      const mainTab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
      if ((await mainTab.getAttribute('aria-selected')) !== 'true') {
        await mainTab.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      }
      await expect(mainTab).toHaveAttribute('aria-selected', 'true');
      const main = page.locator('main').first();
      await expect(main.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await expect(main.getByText('分析对象', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(main.getByText('所属产业链', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(main.getByText('注册诊断维度', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      globalThis.__func03190_ready = true;
  - note: 2、可见「重置参数」与「开始分析」
    assert: |-
      if (!globalThis.__func03190_ready) throw new Error('前置：未进入产业瓶颈堵点识别配置区');
      await expect(page.getByRole('button', { name: '重置参数' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、维度表上方有「以下指标只读，确认后即可生成分析。」
    assert: |-
      if (!globalThis.__func03190_ready) throw new Error('前置：未进入产业瓶颈堵点识别配置区');
      await expect(
        page.getByText('以下指标只读，确认后即可生成分析。').first(),
      ).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）。
  steps 深链 goto；expect 内深链 404 时回退 sibling /industry-center/search 侧栏点「产业瓶颈堵点识别」（03191 同款）。
  2026-10-20 edu 试跑：深链与侧栏均 404（ENV-EDU-TTS-SVCZ-404-001）。登录关评审 runner 前置。A 档零 allow_skip。
