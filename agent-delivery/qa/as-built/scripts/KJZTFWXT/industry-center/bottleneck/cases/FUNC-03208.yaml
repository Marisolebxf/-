id: FUNC-03208
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03208
priority: P0
title: 诊断记录「查看结果」打开历史结果
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 诊断记录中有已完成任务
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录 tab 内对已完成行点「查看结果」
expect:
  - note: 步骤 1=对已完成任务点「查看结果」；预期 1=进入「产业瓶颈堵点识别结果」
    assert: |-
      const main = () => page.locator('main').first();
      const extractTaskId = (rowText) => {
        const m = rowText.match(/CHAIN-\d{8}-\d{3}/);
        return m ? m[0] : null;
      };
      const recordsTab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(recordsTab).toBeVisible({ timeout: 15000 });
      await recordsTab.click({ timeout: 10000 });
      await page.waitForTimeout(1000);
      const rows = main()
        .locator('tbody tr, .arco-table-tr')
        .filter({ hasText: '产业瓶颈堵点识别' })
        .filter({ hasText: /已完成/ });
      const n = await rows.count();
      if (n < 1) {
        throw new Error('前置未满足：30892 诊断记录无已完成瓶颈任务');
      }
      let opened = false;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const taskId = extractTaskId(rowText);
        if (!taskId) continue;
        const view = row.getByRole('button', { name: '查看结果' }).first();
        if (!(await view.count()) || (await view.isDisabled().catch(() => true))) continue;
        await view.click({ timeout: 12000 });
        for (let j = 0; j < 30; j++) {
          await page.waitForTimeout(500);
          const body = await main().innerText().catch(() => '');
          if (/产业瓶颈堵点识别结果/.test(body)) {
            globalThis.__func03208 = { taskId };
            opened = true;
            break;
          }
        }
        if (opened) break;
      }
      if (!opened) {
        throw new Error('已完成行「查看结果」未进入结果页');
      }
      await expect(main().getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
  - note: 2、任务 ID 与所点行一致
    assert: |-
      const taskId = globalThis.__func03208?.taskId;
      if (!taskId) throw new Error('前置：未记录所点行任务 ID');
      const main = page.locator('main').first();
      const body = await main.innerText().catch(() => '');
      if (!body.includes(taskId)) {
        throw new Error('结果页任务 ID 与所点行不一致：' + taskId);
      }
on_fail: 截图 + X-Trace-Id
