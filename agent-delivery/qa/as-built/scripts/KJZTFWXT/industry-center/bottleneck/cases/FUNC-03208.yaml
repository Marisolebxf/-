id: FUNC-03208
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03208
priority: P1
tier: B
title: 诊断记录查看结果打开历史结果页
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→若无已完成则按金样复制配置并分析→对已完成行点「查看结果」
    target: |-
      const main = () => page.locator('main').first();
      const recordsTab = () => page.getByRole('tab', { name: '诊断记录' }).first();

      async function pickStatus(label) {
        const box = main().locator('.diagnosis-records__filters .arco-select-view').first();
        await box.click();
        await page.getByRole('option', { name: label }).click();
        await page.waitForTimeout(800);
      }

      async function findCompletedRow() {
        const rows = main().locator('tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const status = ((await row.locator('td').nth(2).innerText()) || '').trim();
          if (!status.includes('已完成')) continue;
          const btn = row.getByRole('button', { name: '查看结果' });
          if (await btn.isEnabled()) return row;
        }
        return null;
      }

      async function runGoldFromRecords() {
        await pickStatus('全部状态');
        await main().locator('tbody tr').first().getByRole('button', { name: '复制配置' }).click();
        await expect(page.getByText('已复制分析配置，可调整后重新分析')).toBeVisible({ timeout: 8000 });
        await main().getByRole('button', { name: '开始分析' }).click();
        await expect(main().getByText('分析结果已生成')).toBeVisible({ timeout: 120000 });
        await main().getByRole('button', { name: '查看分析结果' }).click();
        await expect(main.getByText('产业瓶颈堵点识别结果', { exact: true })).toBeVisible();
      }

      await recordsTab().click();
      await page.waitForURL(/tab=records/);
      await pickStatus('已完成');
      let row = await findCompletedRow();
      if (!row) {
        await runGoldFromRecords();
        await recordsTab().click();
        await page.waitForURL(/tab=records/);
        await pickStatus('已完成');
        row = await findCompletedRow();
        if (!row) throw new Error('诊断记录仍无已完成瓶颈任务');
      }

      const taskId = ((await row.locator('td').first().innerText()) || '').trim().split(/\s+/)[0];
      if (!taskId) throw new Error('未读到任务 ID');
      await page.evaluate((id) => {
        window.__func03208TaskId = id;
      }, taskId);
      await row.getByRole('button', { name: '查看结果' }).click();
      await expect(main().getByText('产业瓶颈堵点识别结果', { exact: true })).toBeVisible({ timeout: 15000 });
  - action: wait
    note: 结果页渲染
    target: 800ms
expect:
  - note: 1、进入「产业瓶颈堵点识别结果」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('产业瓶颈堵点识别结果', { exact: true })).toBeVisible();
  - note: 2、任务 ID 与所点行一致
    assert: |-
      const main = page.locator('main').first();
      const taskId = await page.evaluate(() => window.__func03208TaskId);
      await expect(main.getByText(`任务 ID：${taskId}`)).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
