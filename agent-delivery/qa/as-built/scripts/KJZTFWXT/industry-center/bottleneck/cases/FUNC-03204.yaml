id: FUNC-03204
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03204
priority: P1
tier: B
title: 主流程-结果页瓶颈标记
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→必要时复制配置并开始分析→查看结果→点带瓶颈环节
expect:
  - note: 1、「环节详情」出现「已入选瓶颈清单」
    assert: |-
      const main = () => page.locator('main').first();
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 15000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const openConfigTab = async () => {
        const tab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(600);
      };
      const doneRows = () =>
        main()
          .locator('tbody tr, .arco-table-tr')
          .filter({ hasText: /产业瓶颈堵点识别/ })
          .filter({ hasText: /已完成/ });
      const copyFromDoneRow = async () => {
        const rowSets = [doneRows(), main().locator('tbody tr, .arco-table-tr').filter({ hasText: /产业瓶颈堵点识别/ })];
        for (const rows of rowSets) {
          const n = await rows.count();
          for (let i = 0; i < Math.min(n, 15); i++) {
            const row = rows.nth(i);
            const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
            if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
            await copyBtn.click({ timeout: 15000 });
            await page.waitForTimeout(800);
            await expect(page.locator('.arco-message').filter({ hasText: /已复制分析配置/ }).first()).toBeVisible({
              timeout: 12000,
            });
            return;
          }
        }
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK');
      };
      const tryPickDefaultChain = async () => {
        const chainField = main().locator('.arco-form-item').filter({ hasText: '所属产业链' }).first();
        const sel = chainField.locator('.arco-select-view').first();
        if (await sel.count()) {
          await sel.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(400);
          const opt = page.getByRole('option', { name: '半导体与集成电路' }).first();
          if (await opt.isVisible().catch(() => false)) {
            await opt.click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
      };
      const waitProcessDone = async () => {
        for (let i = 0; i < 120; i++) {
          await page.waitForTimeout(i < 6 ? 500 : 900);
          const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/分析结果已生成/.test(body)) return;
          if (/分析失败|本次分析生成失败/.test(body) && i > 10) {
            throw new Error('ENV-CHAIN-BOTTLENECK-ASYNC-FAIL-03204');
          }
        }
        throw new Error('ENV-CHAIN-BOTTLENECK-ASYNC-TIMEOUT-03204');
      };
      const seedCompletedIfNeeded = async () => {
        await openRecordsTab();
        const viewEnabled = doneRows().getByRole('button', { name: '查看结果' }).first();
        if ((await viewEnabled.count()) && !(await viewEnabled.isDisabled().catch(() => true))) return;
        await openConfigTab();
        try {
          await copyFromDoneRow();
        } catch (e) {
          if (!String(e?.message || e).includes('NO-DONE-TASK')) throw e;
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-RESULT-03204');
        }
        await tryPickDefaultChain();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
        await waitProcessDone();
        await openRecordsTab();
      };
      const graphScope = () => {
        const board = main().locator('section, .arco-card').filter({ hasText: '多维度瓶颈综合分析' }).first();
        return board;
      };
      const graphHasBottleneckTag = async () => {
        const scope = graphScope();
        if (!(await scope.count())) return false;
        const txt = ((await scope.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        for (const name of ['研发', '设计', '制造', '销售', '服务']) {
          if (new RegExp(name + '[\\s\\S]{0,120}瓶颈|瓶颈[\\s\\S]{0,120}' + name).test(txt)) return true;
        }
        return (await scope.getByText('瓶颈', { exact: true }).count()) > 0;
      };
      const runFreshAnalysisFromRecords = async () => {
        await openRecordsTab();
        await copyFromDoneRow();
        await openConfigTab();
        await tryPickDefaultChain();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
        await waitProcessDone();
      };
      const clickViewResultOnDoneRow = async () => {
        const rows = doneRows();
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 15); i++) {
          const row = rows.nth(i);
          const viewBtn = row.getByRole('button', { name: '查看结果' }).first();
          if (!(await viewBtn.count()) || (await viewBtn.isDisabled().catch(() => true))) continue;
          await viewBtn.click({ timeout: 15000 });
          await page.waitForTimeout(1000);
          await expect(main().getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
          return;
        }
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-RESULT-03204');
      };
      const clickBottleneckSegment = async () => {
        const scope = (await graphScope().count()) ? graphScope() : main();
        const stageNames = ['研发', '设计', '制造', '销售', '服务'];
        for (const name of stageNames) {
          const row = scope.locator('*').filter({ hasText: name }).filter({ hasText: '瓶颈' });
          if ((await row.count()) && (await row.first().isVisible().catch(() => false))) {
            await row.first().click({ timeout: 12000 });
            await page.waitForTimeout(600);
            return;
          }
        }
        const tag = scope.getByText('瓶颈', { exact: true }).first();
        if (await tag.isVisible().catch(() => false)) {
          await tag.click({ timeout: 12000 });
          await page.waitForTimeout(600);
          return;
        }
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-BOTTLENECK-SEG-03204');
      };
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 15000 });
      await seedCompletedIfNeeded();
      await clickViewResultOnDoneRow();
      if (!(await graphHasBottleneckTag())) {
        await runFreshAnalysisFromRecords();
        await clickViewResultOnDoneRow();
      }
      if (!(await graphHasBottleneckTag())) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-BOTTLENECK-MARK-03204');
      }
      await clickBottleneckSegment();
      globalThis.__func03204 = { onResult: true };
      const detail = main()
        .locator('.diagnosis-panel--detail, section, .arco-card')
        .filter({ hasText: '环节详情' })
        .first();
      await expect(detail).toBeVisible({ timeout: 12000 });
      await expect(detail.getByText('已入选瓶颈清单').first()).toBeVisible({ timeout: 12000 });
on_fail: 截图 + 抄 X-Trace-Id
