id: FUNC-03200
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03200
priority: P1
tier: B
title: 主流程-结果页-结果摘要
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 同册03188/03198：诊断记录→已完成行复制配置→开始分析→过程页出现「查看分析结果」
    assert: |-
      const main = () => page.locator('main.content-shell-layout, main').first();
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 15000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const openConfigTab = async () => {
        const tab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(800);
      };
      const copyFromDoneRow = async () => {
        const rowSets = [
          main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成/ }).filter({ hasText: /产业瓶颈堵点识别/ }),
          main().locator('tbody tr, .arco-table-tr').filter({ hasText: /产业瓶颈堵点识别/ }).filter({ hasText: /已完成/ }),
        ];
        for (const rows of rowSets) {
          const n = await rows.count();
          for (let i = 0; i < Math.min(n, 15); i++) {
            const row = rows.nth(i);
            const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
            if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
            await copyBtn.click({ timeout: 15000 });
            await page.waitForTimeout(800);
            await expect(page.locator('.arco-message').filter({ hasText: /已复制分析配置/ }).first()).toBeVisible({
              timeout: 12000,
            });
            await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
            return true;
          }
        }
        return false;
      };
      const tryPickDefaultChain = async () => {
        const chainField = main().locator('.arco-form-item').filter({ hasText: '所属产业链' }).first();
        const sel = chainField.locator('.arco-select-view').first();
        if (await sel.count()) {
          await page.keyboard.press('Escape').catch(() => {});
          await sel.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(400);
          const opt = page.getByRole('option', { name: '半导体与集成电路' }).first();
          if (await opt.isVisible().catch(() => false)) {
            await opt.click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        }
      };
      const clickStartAnalysis = async () => {
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
      };
      const tryRerun = async () => {
        const rerun = page.getByRole('button', { name: '重新分析' }).first();
        if (!(await rerun.isVisible().catch(() => false)) || (await rerun.isDisabled().catch(() => true))) return false;
        await rerun.click({ timeout: 12000 });
        await page.waitForTimeout(1200);
        return true;
      };
      const seedCompletedIfEmpty = async () => {
        await openConfigTab();
        await tryPickDefaultChain();
        await clickStartAnalysis();
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 5 ? 600 : 900);
          const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/分析结果已生成/.test(body)) {
            const view = page.getByRole('button', { name: '查看分析结果' }).first();
            if (await view.isEnabled().catch(() => false)) {
              await view.click({ timeout: 12000 });
              await page.waitForTimeout(800);
            }
            break;
          }
          if (/尚未选择分析对象/.test(body) && i > 3) {
            throw new Error('修订 ENV-CHAIN-BOTTLENECK-NO-DONE-TASK');
          }
        }
        await openRecordsTab();
      };
      const waitProcessDone = async () => {
        let sawGenerating = false;
        for (let i = 0; i < 120; i++) {
          await page.waitForTimeout(i < 6 ? 500 : 900);
          const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/产业瓶颈堵点识别生成中|可视化分析过程/.test(body)) sawGenerating = true;
          if (/分析结果已生成/.test(body) && sawGenerating) return;
          if (/今日已分析过相同条件/.test(body) && (await tryRerun())) {
            sawGenerating = false;
            continue;
          }
          if (/分析结果已生成/.test(body) && !sawGenerating && i > 8 && (await tryRerun())) {
            sawGenerating = false;
            continue;
          }
          if (/分析失败|本次分析生成失败|DIM_PACK_UNAVAILABLE/.test(body) && i > 10 && !/分析结果已生成/.test(body)) {
            throw new Error('修订 过程页分析失败');
          }
        }
        const tail = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').slice(0, 240);
        throw new Error('修订 未见过程完成态：' + tail);
      };
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 15000 });
      let body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/分析结果已生成/.test(body)) {
        await expect(page.getByRole('button', { name: '查看分析结果' }).first()).toBeEnabled({ timeout: 8000 });
        return;
      }
      if (/产业瓶颈堵点识别结果/.test(body) && /view=result/.test(page.url())) {
        if (await tryRerun()) {
          await waitProcessDone();
          await expect(page.getByRole('button', { name: '查看分析结果' }).first()).toBeEnabled({ timeout: 8000 });
          return;
        }
      }
      await openRecordsTab();
      const copied = await copyFromDoneRow();
      if (!copied) {
        await seedCompletedIfEmpty();
        const again = await copyFromDoneRow();
        if (!again) throw new Error('修订 ENV-CHAIN-BOTTLENECK-NO-DONE-TASK');
      }
      await clickStartAnalysis();
      await waitProcessDone();
      await expect(page.getByText('分析结果已生成').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '查看分析结果' }).first()).toBeEnabled({ timeout: 8000 });
  - action: click
    target: 查看分析结果
expect:
  - note: 1、区块标题为「产业瓶颈堵点识别结果」
    assert: |-
      const main = () => page.locator('main').first();
      await expect(main().getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别结果' }).first()).toBeVisible({ timeout: 8000 }).catch(async () => {
        await expect(main().locator('.arco-card-header-title, h2, h3').filter({ hasText: '产业瓶颈堵点识别结果' }).first()).toBeVisible({
          timeout: 8000,
        });
      });
  - note: 2、可见「任务」与「任务 ID」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText(/^任务：/).first()).toBeVisible({ timeout: 10000 });
      await expect(main.getByText(/^任务 ID：/).first()).toBeVisible({ timeout: 10000 });
  - note: 3、可见「分析对象」
    assert: |-
      await expect(page.locator('main').first().getByText(/^分析对象：/).first()).toBeVisible({ timeout: 10000 });
  - note: 4、可见「叙述能力不可用，已按规则结果诚实降级。」
    assert: |-
      await expect(page.locator('main').first().getByText('叙述能力不可用，已按规则结果诚实降级。').first()).toBeVisible({
        timeout: 10000,
      });
on_fail: 截图 + 抄 X-Trace-Id
