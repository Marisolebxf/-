id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00617
priority: P1
title: 维度查看按钮可打开并关闭注册说明
entry_id: chain-bottleneck
preconditions:
- 已进入产业瓶颈堵点识别页
steps:
- action: goto
  target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
- action: click
  target: 查看
expect:
- note: 每维度「查看」可打开注册说明并可关闭
  assert: |-
    await page.goto('http://10.50.69.111:30892/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; if ((await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).getAttribute('aria-selected')) !== 'true') { await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).click(); await page.waitForTimeout(800) }; await expect(page.getByRole('button', { name: '查看' }).first()).toBeVisible({ timeout: 8000 }); await page.getByRole('button', { name: '查看' }).first().click(); await page.waitForTimeout(700); const close = page.locator('.arco-drawer-close-btn, .arco-modal-close-icon').first(); if (await close.count()) { await close.click(); await page.waitForTimeout(400) } else { await page.keyboard.press('Escape'); await page.waitForTimeout(400) }
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
