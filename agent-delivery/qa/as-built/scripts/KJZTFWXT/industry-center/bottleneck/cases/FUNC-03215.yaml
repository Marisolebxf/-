id: FUNC-03215
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03215
priority: P1
title: 诊断记录「重置」恢复任务状态至全部
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 已打开「诊断记录」（assert 自含 catalog/侧栏进入并切 Tab）
locators:
  records_tab: tab「诊断记录」
  status_filter: 任务状态
  reset_filter: button「重置」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→任务状态选「失败」→点「重置」；回显与列表在 expect
expect:
  - note: 前置：诊断记录 Tab；「全部状态」下同时有已完成与失败行
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const optSel = '.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const catalogPath = '/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck';
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      const chainRows = () => main().locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
      const statusTrigger = async () => {
        const statusLabel = page.getByText('任务状态', { exact: false }).first();
        await expect(statusLabel).toBeVisible({ timeout: 8000 });
        let trigger = statusLabel.locator('xpath=following::*[contains(@class,"arco-select-view")][1]');
        if ((await trigger.count()) < 1) {
          trigger = page.locator('.diagnosis-records__filters .arco-select-view').first();
        }
        if ((await trigger.count()) < 1) {
          trigger = page.locator('.arco-select-view').filter({ hasText: /全部状态|已完成|分析中|失败/ }).first();
        }
        return trigger;
      };
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
        const bodyAfter = await main().innerText().catch(() => '');
        if (!/诊断记录|任务状态|全部状态/.test(bodyAfter)) {
          throw new Error('点「诊断记录」后未见任务状态区，url=' + page.url());
        }
      };
      await enterBottleneck();
      await openRecordsTab();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!TID_RE.test(body)) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-RECORDS-03215：诊断记录无 CHAIN 任务行');
      }
      if (!/已完成/.test(body) || !/失败/.test(body)) {
        throw new Error('ENV-CHAIN-BOTTLENECK-FILTER-MIX-03215：前置不满足（全部状态下需同时有已完成与失败）');
      }
      await page.keyboard.press('Escape').catch(() => {});
      const trigger = await statusTrigger();
      await expect(trigger).toBeVisible({ timeout: 8000 });
      await trigger.click({ timeout: 8000 });
      await page.waitForTimeout(450);
      const optFail = page.locator(optSel).filter({ hasText: /^失败$/ }).first();
      await expect(optFail).toBeVisible({ timeout: 8000 });
      await optFail.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const shownFail = ((await trigger.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/失败/.test(shownFail)) {
        throw new Error('用例步骤 1：任务状态未切到「失败」：' + shownFail);
      }
      globalThis.__func03215 = { chainRows, TID_RE, main, statusTrigger };
  - note: 1、任务状态显示「全部状态」（用例步骤 2 点「重置」）
    assert: |-
      const ctx = globalThis.__func03215;
      if (!ctx) throw new Error('前置：诊断记录筛失败未就绪');
      const filters = page.locator('.diagnosis-records__filters').first();
      let resetBtn = filters.getByRole('button', { name: '重置', exact: true });
      if (!(await resetBtn.count())) {
        resetBtn = ctx.main().getByRole('button', { name: '重置', exact: true }).first();
      }
      if (!(await resetBtn.count())) {
        throw new Error('诊断记录筛选区未见「重置」按钮');
      }
      await resetBtn.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const trigger = await ctx.statusTrigger();
      const shown = ((await trigger.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/全部状态/.test(shown)) {
        throw new Error('重置后任务状态未回「全部状态」：' + shown);
      }
  - note: 2、列表同时能看到已完成和失败
    assert: |-
      const ctx = globalThis.__func03215;
      if (!ctx) throw new Error('前置：诊断记录未就绪');
      const rows = ctx.chainRows();
      const n = await rows.count();
      if (n < 1) throw new Error('重置后未见 CHAIN 任务行');
      let hasDone = false;
      let hasFail = false;
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        if (!(await row.isVisible().catch(() => false))) continue;
        const rt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/已完成|成功/.test(rt)) hasDone = true;
        if (/失败/.test(rt)) hasFail = true;
      }
      if (!hasDone || !hasFail) {
        const mainText = ((await ctx.main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').slice(0, 400);
        throw new Error(
          '重置后列表未同时含已完成与失败（done=' + hasDone + ' fail=' + hasFail + '）main=' + mainText,
        );
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；深链 goto + 404 时 sibling 侧栏（03214 同款）。
  步骤=诊断记录 Tab→任务状态选「失败」（用例步骤 1）→筛选区「重置」（≠配置区「重置参数」，对齐 key-link FUNC-03124 / regional FUNC-03014）。
  前置=全部状态下 main 同时含「已完成」「失败」，否则 ENV-CHAIN-BOTTLENECK-FILTER-MIX-03215 / NO-RECORDS-03215。
  机检=重置后 .arco-select-view 回显「全部状态」且当前页可见 CHAIN 行同时含已完成与失败。edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。登录关评审 runner 前置。B 档零 allow_skip。
