id: FUNC-03223
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03223
priority: P1
tier: B
title: 默认条件下未选对象点开始分析被拦截
entry_id: chain-bottleneck
preconditions:
  - 刚进入产业瓶颈堵点识别，未点「复制配置」
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck&object_id=&industry_id=
expect:
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      const main = () => page.locator('main.content-shell-layout, main').first();
      const back = page.getByRole('button', { name: '返回配置重试' });
      if (await back.isVisible().catch(() => false)) {
        await back.click({ timeout: 8000 });
        await page.waitForTimeout(700);
      }
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        return new Set(body.match(TID_RE) || []).size;
      };
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nBefore = await countChainRows();
      await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.scrollIntoViewIfNeeded();
      await start.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const toast = page.locator('.arco-message-content, .arco-message').filter({ hasText: '尚未选择分析对象' });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
      globalThis.__func03223 = { nBefore, main, countChainRows, clicked: true };
  - note: 2、仍停在分析配置
    assert: |-
      const ctx = globalThis.__func03223;
      if (!ctx?.clicked) throw new Error('前置：未点开始分析');
      const url = page.url();
      if (/view=result/.test(url) || /view=processing/.test(url)) {
        throw new Error('拦截后进入结果/过程态: ' + url);
      }
      const body = await ctx.main().innerText().catch(() => '');
      if (/分析结果已生成|可视化分析过程|产业瓶颈堵点识别生成中/.test(body)) {
        throw new Error('拦截后仍见分析过程/结果引导');
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first()).toHaveAttribute('aria-selected', 'true');
  - note: 3、诊断记录不新增任务
    assert: |-
      const ctx = globalThis.__func03223;
      if (!ctx?.clicked) throw new Error('前置：未点开始分析');
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = await ctx.countChainRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('诊断记录 CHAIN 条数增加：' + ctx.nBefore + ' -> ' + nAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id
