id: FUNC-03223
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03223
priority: P1
tier: B
title: 异常-开始分析-未选对象
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 记录诊断记录条数基线后回到分析配置
    script: |-
      await page.getByRole('tab', { name: '诊断记录' }).click();
      await page.waitForTimeout(400);
      const count = await page.locator('.arco-table-body tr.arco-table-tr').count();
      await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).click();
      await page.waitForTimeout(400);
      await page.evaluate((c) => {
        window.__func03223RecordBefore = c;
      }, count);
  - action: click
    target: 开始分析
expect:
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      await expect(
        page.locator('.arco-message').filter({ hasText: '尚未选择分析对象' }).first(),
      ).toBeVisible({ timeout: 8000 });
  - note: 2、仍停在分析配置
    assert: |-
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible();
      await expect(page).toHaveURL(/tab=bottleneck/);
      await expect(page.getByText('产业瓶颈堵点识别生成中')).not.toBeVisible();
  - note: 3、诊断记录不新增任务
    assert: |-
      await page.getByRole('tab', { name: '诊断记录' }).click();
      await page.waitForTimeout(500);
      const after = await page.locator('.arco-table-body tr.arco-table-tr').count();
      const before = await page.evaluate(() => window.__func03223RecordBefore ?? -1);
      if (after !== before) {
        throw new Error(`诊断记录条数变化：${before} → ${after}`);
      }
on_fail: 截图 + 抄 X-Trace-Id
