id: FUNC-03223
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03223
priority: P1
title: 默认条件下未选对象点开始分析被拦截
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: B
preconditions:
  - 刚进入产业瓶颈堵点识别，未点「复制配置」
locators:
  cluster: .arco-select-view[aria-label="集群"]
  industry: .arco-select-view[aria-label="产业"]
  segment: .arco-select-view.industry-catalog-select
  start: button「开始分析」
  config_tab: tab「产业瓶颈堵点识别」
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 进入分析配置，不复制配置、不点选下拉，直接开始分析（判定在 expect）
expect:
  - note: 前置：分析配置可见；诊断记录 CHAIN 基线条数已采样
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const catalogPath = '/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck';
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await enterBottleneck();
      await expect(page.getByRole('heading', { name: '产业瓶颈堵点识别', level: 1 })).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first()).toHaveAttribute('aria-selected', 'true');
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nBefore = await countChainRows();
      await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      globalThis.__func03223 = { nBefore, main, countChainRows };
  - note: 1、提示「尚未选择分析对象」
    assert: |-
      if (!globalThis.__func03223) throw new Error('前置：未进入分析配置');
      const TOAST = '尚未选择分析对象';
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await start.scrollIntoViewIfNeeded();
      await start.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const toast = page.locator('.arco-message-content, .arco-message').filter({ hasText: TOAST });
      await expect(toast.first()).toBeVisible({ timeout: 8000 });
      const badCreate = page.locator('.arco-message-content, .arco-message').filter({ hasText: /任务已创建/ });
      if (await badCreate.count()) {
        throw new Error('未选对象却出现任务已创建 toast');
      }
      globalThis.__func03223.clicked = true;
  - note: 2、仍停在分析配置；3、诊断记录不新增任务
    assert: |-
      const ctx = globalThis.__func03223;
      if (!ctx?.clicked) throw new Error('前置：未点开始分析');
      const url = page.url();
      if (/view=result/.test(url) || /view=processing/.test(url)) {
        throw new Error('拦截后进入结果/过程态: ' + url);
      }
      const body = await ctx.main().innerText().catch(() => '');
      if (/分析结果已生成|可视化分析过程|产业瓶颈堵点识别生成中/.test(body)) {
        throw new Error('拦截后仍见分析过程/结果引导: ' + body.slice(0, 200));
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first()).toHaveAttribute('aria-selected', 'true');
      await page.getByRole('tab', { name: '诊断记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = await ctx.countChainRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('诊断记录 CHAIN 条数增加：' + ctx.nBefore + ' -> ' + nAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例=刚进入页、未点「复制配置」、下拉展示默认名不算选中→直接「开始分析」。拦截 toast「尚未选择分析对象」；
  对齐 cycle 02926 / key-link 03129。诊断记录条数=main 内 CHAIN-\\d{8}-\\d{3} 去重。catalog_path=entry-seed；
  深链 goto + 404 时 sibling 侧栏。登录关评审 runner 前置。B 档零 allow_skip。
