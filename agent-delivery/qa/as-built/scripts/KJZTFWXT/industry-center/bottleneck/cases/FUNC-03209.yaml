id: FUNC-03209
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03209
priority: P1
tier: B
title: 诊断记录复制配置回到分析配置
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→若无已完成则按金样造一条→对已完成点「复制配置」
    target: |-
      const main = () => page.locator('main').first();
      const recordsTab = () => page.getByRole('tab', { name: '诊断记录' }).first();
      await recordsTab().click();
      await page.waitForURL(/tab=records/);

      async function pickStatus(label) {
        const box = main().locator('.diagnosis-records__filters .arco-select-view').first();
        await box.click();
        await page.getByRole('option', { name: label }).click();
        await page.waitForTimeout(600);
      }

      async function copyConfigEnabled() {
        const btn = main().getByRole('button', { name: '复制配置' }).first();
        return btn.isEnabled().catch(() => false);
      }

      await pickStatus('已完成');
      if (!(await copyConfigEnabled())) {
        await pickStatus('全部状态');
        if (!(await copyConfigEnabled())) {
          throw new Error('修订 无可用复制配置行，前置不满足');
        }
        await main().getByRole('button', { name: '复制配置' }).first().click();
        await page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first().click();
        await main().getByRole('button', { name: '开始分析' }).click();
        await expect(main().getByText('分析结果已生成')).toBeVisible({ timeout: 120000 });
        await main().getByRole('button', { name: '查看分析结果' }).click();
        await expect(main().getByText('产业瓶颈堵点识别结果', { exact: true })).toBeVisible();
        await recordsTab().click();
        await page.waitForURL(/tab=records/);
        await pickStatus('已完成');
      }

      await main().getByRole('button', { name: '复制配置' }).first().click();
      await expect(page.locator('.arco-message').getByText('已复制分析配置，可调整后重新分析')).toBeVisible({
        timeout: 8000,
      });
      await page.evaluate(() => {
        window.__func03209CopiedToast = true;
      });
expect:
  - note: 1、提示「已复制分析配置，可调整后重新分析」
    assert: |-
      const copied = await page.evaluate(() => window.__func03209CopiedToast === true);
      await expect(copied).toBe(true);
  - note: 2、页面回到「分析配置」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByRole('heading', { name: '分析配置' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
