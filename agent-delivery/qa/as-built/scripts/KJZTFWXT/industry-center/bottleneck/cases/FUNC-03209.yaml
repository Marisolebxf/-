id: FUNC-03209
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03209
priority: P0
title: 诊断记录「复制配置」回到分析配置并提示
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 诊断记录中有已完成任务
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录 tab 内对已完成行点「复制配置」
expect:
  - note: 1、提示「已复制分析配置，可调整后重新分析」
    assert: |-
      const main = () => page.locator('main').first();
      const recordsTab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(recordsTab).toBeVisible({ timeout: 15000 });
      await recordsTab.click({ timeout: 10000 });
      await page.waitForTimeout(800);
      const doneRow = main()
        .locator('tbody tr, .arco-table-tr')
        .filter({ hasText: '产业瓶颈堵点识别' })
        .filter({ hasText: '已完成' });
      if ((await doneRow.count()) < 1) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-DONE-TASK：30892 诊断记录无已完成瓶颈任务');
      }
      const copyBtn = doneRow.first().getByRole('button', { name: '复制配置' });
      await expect(copyBtn).toBeEnabled({ timeout: 8000 });
      await copyBtn.click({ timeout: 15000 });
      await page.waitForTimeout(500);
      const toast = page.locator('.arco-message').filter({ hasText: /已复制分析配置/ });
      await expect(toast.first()).toBeVisible({ timeout: 12000 });
      await expect(toast.first()).toContainText('可调整后重新分析', { timeout: 5000 });
  - note: 2、页面回到「分析配置」
    assert: |-
      const configTab = page.getByRole('tab', { name: '产业瓶颈堵点识别' }).first();
      await expect(configTab).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
on_fail: 截图 + X-Trace-Id
