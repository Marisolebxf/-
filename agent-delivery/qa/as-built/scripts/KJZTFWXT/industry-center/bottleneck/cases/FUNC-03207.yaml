id: FUNC-03207
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03207
priority: P1
tier: B
title: 主流程-结果页-按此配置新建分析回到配置
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 同册03208/03188：诊断记录打开成功结果页
    assert: |-
      const main = () => page.locator('main').first();
      const openRecordsTab = async () => {
        const tab = page.getByRole('tab', { name: '诊断记录' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(1200);
        await expect(tab).toHaveAttribute('aria-selected', 'true');
      };
      const onResultPage = async () => {
        const t = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /产业瓶颈堵点识别结果/.test(t) && /多维度瓶颈综合分析/.test(t);
      };
      const tryViewResultFromRecords = async () => {
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/产业瓶颈堵点识别/.test(rowText)) continue;
          const viewBtn = row.getByRole('button', { name: '查看结果' }).first();
          if (!(await viewBtn.count()) || (await viewBtn.isDisabled().catch(() => true))) continue;
          await viewBtn.click({ timeout: 15000 });
          await page.waitForTimeout(2500);
          if (await onResultPage()) return true;
          await openRecordsTab();
        }
        return false;
      };
      const copyConfigAndStart = async () => {
        const rows = main().locator('tbody tr, .arco-table-tr').filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        if (n < 1) {
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-RESULT-03207');
        }
        let clicked = false;
        for (let i = 0; i < Math.min(n, 12); i++) {
          const row = rows.nth(i);
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/产业瓶颈堵点识别/.test(rowText)) continue;
          const copyBtn = row.getByRole('button', { name: '复制配置' }).first();
          if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) continue;
          await copyBtn.click({ timeout: 15000 });
          clicked = true;
          break;
        }
        if (!clicked) {
          throw new Error('ENV-CHAIN-BOTTLENECK-NO-RESULT-03207');
        }
        await page.waitForTimeout(800);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 20000 });
        await start.click({ timeout: 15000 });
        let sawReady = false;
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 600 : 1500);
          const last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/分析结果已生成/.test(last)) sawReady = true;
          if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(last) && i >= 10) {
            throw new Error('修订 复制配置后分析失败');
          }
          if (sawReady) break;
          if (/今日已分析过相同条件/.test(last) && (await onResultPage())) {
            sawReady = true;
            break;
          }
        }
        if (!sawReady) {
          throw new Error('修订 过程页未见分析结果已生成');
        }
        const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
        if (await viewBtn.isVisible().catch(() => false)) {
          await viewBtn.click({ timeout: 15000 });
          await page.waitForTimeout(2500);
        }
      };
      await openRecordsTab();
      if (!(await tryViewResultFromRecords())) {
        await copyConfigAndStart();
      }
      await expect(page.getByText('产业瓶颈堵点识别结果').first()).toBeVisible({ timeout: 20000 });
  - action: evaluate
    note: 用例步骤1点「按此配置新建分析」
    assert: |-
      const main = () => page.locator('main').first();
      await main().getByRole('button', { name: '按此配置新建分析' }).click({ timeout: 15000 });
      await page.waitForTimeout(800);
expect:
  - note: 1、回到「分析配置」
    assert: |-
      await expect(page.locator('main').getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 15000 })
  - note: 2、可见「开始分析」
    assert: |-
      await expect(page.locator('main').getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 15000 })
on_fail: 截图 + 抄 X-Trace-Id
