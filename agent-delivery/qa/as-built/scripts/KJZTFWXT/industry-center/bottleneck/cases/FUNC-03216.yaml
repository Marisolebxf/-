id: FUNC-03216
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03216
priority: P1
tier: B
title: 诊断记录翻到第二页
entry_id: chain-bottleneck
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: click
    target: 诊断记录
  - action: evaluate
    note: 把每页条数设为「10 条/页」
    assert: |-
      const main = () => page.locator('main').first();
      await expect(main().getByRole('heading', { name: '诊断记录' })).toBeVisible({ timeout: 15000 });
      const loading0 = main().locator('.arco-table-loading, .arco-spin-loading').first();
      if (await loading0.isVisible().catch(() => false)) {
        await expect(loading0).toBeHidden({ timeout: 20000 });
      }
      const pagination = () => main().locator('.arco-table-pagination').first();
      await expect(pagination()).toBeVisible({ timeout: 15000 });
      const txt = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const totalM = txt.match(/共\s*(\d+)\s*条/);
      const total = totalM ? Number(totalM[1]) : 0;
      if (total <= 10) {
        throw new Error(`修订 blocked：诊断记录共${total}条，前置总数>10不满足，无法翻第2页`);
      }
      const sizeTrigger = pagination().locator('.arco-select-view').first();
      await expect(sizeTrigger).toBeVisible({ timeout: 8000 });
      await sizeTrigger.click({ timeout: 8000 });
      const opt10 = page
        .locator('.arco-trigger-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option')
        .filter({ hasText: /10\s*条\/页/ })
        .first();
      await expect(opt10).toBeVisible({ timeout: 8000 });
      await opt10.click({ timeout: 8000 });
      await expect(sizeTrigger).toContainText('10', { timeout: 8000 });
      const TID_RE = /CHAIN-\d{8}-\d{3}/g;
      const ids = [...new Set((txt.match(TID_RE) || []).slice(0, 10))];
      globalThis.__func03216 = { page1Ids: ids, total };
  - action: evaluate
    note: 点页码「2」
    assert: |-
      const main = () => page.locator('main').first();
      const pagination = () => main().locator('.arco-table-pagination').first();
      const page2 = pagination().locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      await expect(page2).toBeVisible({ timeout: 8000 });
      await page2.click({ timeout: 8000 });
      const loading = main().locator('.arco-table-loading, .arco-spin-loading').first();
      if (await loading.isVisible().catch(() => false)) {
        await expect(loading).toBeHidden({ timeout: 20000 });
      }
      await expect(pagination().locator('.arco-pagination-item-active')).toHaveText('2', { timeout: 10000 });
expect:
  - note: 1、当前页为第 2 页
    assert: |-
      const pagination = page.locator('main').first().locator('.arco-table-pagination').first();
      await expect(pagination.locator('.arco-pagination-item-active')).toHaveText('2', { timeout: 8000 });
  - note: 2、本页任务与第 1 页不是同一批
    assert: |-
      const main = page.locator('main').first();
      const text = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const page2Ids = [...new Set((text.match(/CHAIN-\d{8}-\d{3}/g) || []))];
      const page1Ids = globalThis.__func03216?.page1Ids || [];
      if (page1Ids.length < 1 || page2Ids.length < 1) {
        throw new Error('修订 blocked：未能读取两页任务 ID');
      }
      const overlap = page2Ids.filter((id) => page1Ids.includes(id));
      if (overlap.length === page2Ids.length && page2Ids.length === page1Ids.length) {
        throw new Error('第2页任务与第1页相同：' + page2Ids.join(','));
      }
      if (overlap.length >= Math.min(page1Ids.length, page2Ids.length)) {
        throw new Error('第2页与第1页任务重叠过多：' + overlap.join(','));
      }
on_fail: 截图 + 抄 X-Trace-Id
