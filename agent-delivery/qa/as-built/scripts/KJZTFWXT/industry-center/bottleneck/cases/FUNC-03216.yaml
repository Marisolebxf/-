id: FUNC-03216
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03216
priority: P1
title: 诊断记录翻到第二页
story: US-CHAIN-DIAG-07
entry_id: chain-bottleneck
tier: B
preconditions:
  - 每页为 10 条且诊断记录总数大于 10（assert 自含数据闸门）
locators:
  records_tab: tab「诊断记录」
  records_pagination: main 内 .arco-pagination
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 诊断记录→每页 10 条→点页码 2；当前页与换批在 expect
expect:
  - note: 步骤 1=每页条数设为「10 条/页」；前置记下第 1 页首行 CHAIN 且总条数可翻第 2 页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const optSel = '.arco-select-dropdown:visible .arco-select-option, .arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl('/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck'), {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      const recordsSection = () => main().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
      const recordsTable = async () => {
        const sec = recordsSection();
        if (await sec.count()) {
          const t = sec.locator('.arco-table, table').first();
          if (await t.count()) return t;
        }
        return main().locator('.arco-table').first();
      };
      const recordsPagination = () => main().locator('.arco-pagination').first();
      const firstVisibleRowTaskId = async (table) => {
        const tbl = table || (await recordsTable());
        const rows = tbl.locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const m = t.match(TID_RE);
          if (m) return m[0];
        }
        return '';
      };
      const setPageSize10 = async () => {
        const pag = recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const pagText = ((await pag.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/10\s*条\s*\/\s*页/.test(pagText)) return;
        const trigger = pag.locator('.arco-select-view').first();
        if (await trigger.count()) {
          await trigger.click({ timeout: 8000 });
        } else {
          const byText = pag.getByText(/\d+\s*条\/页/);
          if (!(await byText.count())) throw new Error('分页区未见每页条数控件');
          await byText.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(500);
        const opt10 = page.locator(optSel).filter({ hasText: /10\s*条\s*\/\s*页/ }).first();
        if (!(await opt10.count())) {
          throw new Error('每页条数下拉未见「10 条/页」');
        }
        await opt10.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const after = ((await pag.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/10\s*条\s*\/\s*页/.test(after)) {
          throw new Error('设为 10 条/页 后分页区未回显：' + after.slice(0, 120));
        }
      };
      await enterBottleneck();
      const tab = page.getByRole('tab', { name: '诊断记录' }).first();
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(tab).toHaveAttribute('aria-selected', 'true');
      const tbl = await recordsTable();
      await expect(tbl).toBeVisible({ timeout: 10000 });
      const bodyRec = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!TID_RE.test(bodyRec)) {
        throw new Error('ENV-CHAIN-BOTTLENECK-NO-RECORDS-03216：诊断记录未见 CHAIN 任务行');
      }
      await setPageSize10();
      const pag = recordsPagination();
      const page2Btn = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 =
        ((await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false))) ||
        (await pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').count()) > 0;
      if (!hasPage2) {
        throw new Error('ENV-CHAIN-BOTTLENECK-PAGE2-001：总条数未超过 10（10 条/页），无法翻到第 2 页');
      }
      const taskPage1 = await firstVisibleRowTaskId(tbl);
      if (!taskPage1) {
        throw new Error('第 1 页首行未见任务编号 CHAIN-*');
      }
      globalThis.__func03216 = { taskPage1 };
  - note: 步骤 2=点页码「2」；预期 1=当前页为第 2 页；预期 2=本页任务与第 1 页不是同一批
    assert: |-
      if (!globalThis.__func03216?.taskPage1) throw new Error('前置：诊断记录翻页未就绪');
      const taskPage1 = globalThis.__func03216.taskPage1;
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main').first();
      const recordsTable = async () => {
        const sec = main().locator('.diagnosis-records, [data-frame-id="F-DIAG-05"]').first();
        if (await sec.count()) {
          const t = sec.locator('.arco-table, table').first();
          if (await t.count()) return t;
        }
        return main().locator('.arco-table').first();
      };
      const recordsPagination = () => main().locator('.arco-pagination').first();
      const firstVisibleRowTaskId = async (table) => {
        const rows = table.locator('tbody tr, .arco-table-tr').filter({ hasText: TID_RE });
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          const m = t.match(TID_RE);
          if (m) return m[0];
        }
        return '';
      };
      const clickPageNum = async (num) => {
        const pag = recordsPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const btn = pag.locator('.arco-pagination-item').filter({ hasText: new RegExp('^\\s*' + num + '\\s*$') }).first();
        if ((await btn.count()) > 0 && (await btn.isVisible().catch(() => false))) {
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(900);
          return;
        }
        if (num === 2) {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) && (await next.isVisible().catch(() => false))) {
            await next.click({ timeout: 8000 });
            await page.waitForTimeout(900);
            return;
          }
        }
        throw new Error('分页「' + num + '」不可点');
      };
      await clickPageNum(2);
      const pag = recordsPagination();
      const active = ((await pag.locator('.arco-pagination-item-active').first().innerText()) || '').trim();
      if (active !== '2') {
        throw new Error('预期 1 失败：当前页应为 2，现场 active=' + (active || '(空)'));
      }
      const tbl = await recordsTable();
      const taskPage2 = await firstVisibleRowTaskId(tbl);
      if (!taskPage2) {
        throw new Error('第 2 页首行未见任务编号 CHAIN-*');
      }
      if (taskPage2 === taskPage1) {
        throw new Error('预期 2 失败：第 2 页首行任务与第 1 页相同：' + taskPage2);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck；步骤=Tab「诊断记录」→每页「10 条/页」→点页码「2」。
  机检=分页 active=2 且第 1 页 vs 第 2 页首可见行 CHAIN 不同。无第 2 页→ENV-CHAIN-BOTTLENECK-PAGE2-001；edu SPA 404→ENV-EDU-TTS-SVCZ-404-001。
  用例注：现场曾见共 15 条。B 档零 allow_skip。
