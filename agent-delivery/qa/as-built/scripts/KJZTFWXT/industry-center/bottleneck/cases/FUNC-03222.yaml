id: FUNC-03222
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03222
priority: P1
title: 注册诊断维度表选择列不可改且五行选中态不变
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: B
preconditions:
  - 已打开分析配置
locators:
  dim_table: 注册诊断维度表（选择列 checkbox）
  select_checkbox: label.arco-checkbox[aria-label="注册项只读启用"]
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 点某一行的选择框→断言 disabled 且五行 checked 态不变（判定在 expect）
expect:
  - note: 前置：分析配置与注册诊断维度表可见
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/产业瓶颈堵点识别/.test(t);
      };
      const catalogPath = '/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck';
      const enterBottleneck = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/diagnosis/.test(page.url()) &&
          /workspace=bottleneck/.test(page.url()) &&
          /tab=bottleneck/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (!(await bodyIs404())) {
            const leaf = () => page.locator('.arco-menu-item').filter({ hasText: /^产业瓶颈堵点识别$/ });
            const expandChain = async () => {
              if (await leaf().first().isVisible().catch(() => false)) return;
              const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
              if (await sub.count()) {
                await sub.first().click({ timeout: 8000 });
                await page.waitForTimeout(400);
              }
            };
            await expandChain();
            await expect(leaf().first()).toBeVisible({ timeout: 10000 });
            await leaf().first().click({ timeout: 10000 });
            await page.waitForURL(/\/industry-center\/diagnosis/, { timeout: 20000 });
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别深链与侧栏入口均不可用 ' + page.url());
        }
        await expect(page).toHaveURL(/workspace=bottleneck/);
        await expect(page).toHaveURL(/tab=bottleneck/);
      };
      await enterBottleneck();
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('注册诊断维度').first()).toBeVisible({ timeout: 8000 });
      const table = page.locator('[data-testid="bottleneck-registered-configuration"], .diagnosis-registered-table').first();
      await expect(table).toBeVisible({ timeout: 8000 });
  - note: 1、点某一行的选择框后选择框保持禁用；2、五行选中状态不变
    assert: |-
      const rowNames = ['技术', '人才', '市场需求', '资本', '政策'];
      const table = page.locator('[data-testid="bottleneck-registered-configuration"], .diagnosis-registered-table').first();
      let boxes = table.locator('label.arco-checkbox[aria-label="注册项只读启用"]');
      let n = await boxes.count();
      if (n < 5) {
        boxes = page.locator('label.arco-checkbox[aria-label="注册项只读启用"]');
        n = await boxes.count();
      }
      if (n < 5) throw new Error('选择列复选框不足 5，count=' + n);
      await expect(boxes).toHaveCount(5, { timeout: 8000 });
      const checkedBefore = [];
      for (let i = 0; i < 5; i++) {
        const box = boxes.nth(i);
        await box.scrollIntoViewIfNeeded().catch(() => {});
        const cls = (await box.getAttribute('class')) || '';
        if (!/arco-checkbox-disabled/.test(cls)) {
          throw new Error('第' + (i + 1) + '个选择列复选框应 disabled，class=' + cls);
        }
        checkedBefore.push(await box.evaluate((el) => el.classList.contains('arco-checkbox-checked')));
      }
      const clickIdx = 2;
      const target = boxes.nth(clickIdx);
      const hit = target.locator('.arco-checkbox-target, input[type=checkbox]').first();
      await hit.click({ timeout: 5000, force: true }).catch(() => target.click({ force: true }));
      await page.waitForTimeout(250);
      for (let i = 0; i < 5; i++) {
        const box = boxes.nth(i);
        const cls = (await box.getAttribute('class')) || '';
        if (!/arco-checkbox-disabled/.test(cls)) {
          throw new Error('点击后第' + (i + 1) + '个复选框应仍 disabled，class=' + cls);
        }
        const after = await box.evaluate((el) => el.classList.contains('arco-checkbox-checked'));
        if (after !== checkedBefore[i]) {
          throw new Error(
            rowNames[i] + ' 行选中态变化 before=' + checkedBefore[i] + ' after=' + after + '（点击行=' + rowNames[clickIdx] + '）',
          );
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·选择列 checkbox aria-label=注册项只读启用，checked+disabled（IndustryDiagnosisPage #select 模板）；用例步骤点「某一」行实勘点第 3 行「市场需求」。
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；enterBottleneck 深链优先、侧栏 sibling 回落（同 FUNC-03191）。登录关评审 runner 前置。B 档零 allow_skip。
