id: FUNC-03195
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03195
priority: P0
title: 注册诊断维度表列名完整
story: US-CHAIN-DIAG-05
entry_id: chain-bottleneck
tier: A
preconditions:
  - 已打开分析配置
locators:
  dim_section: 注册诊断维度
  dim_table: 含「指标名称」的注册诊断维度表
steps:
  - action: goto
    target: /industry-center/diagnosis?workspace=bottleneck&tab=bottleneck
  - action: evaluate
    note: 打开「注册诊断维度」表区（判定在 expect）
expect:
  - note: 1、表头为选择、指标名称、分组 / 维度、数据状态、权重、数据来源、指标说明
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/industry-center\/diagnosis/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=bottleneck/);
      await expect(page).toHaveURL(/tab=bottleneck/);
      const bodyGate = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/404|页面不存在|抱歉，页面不存在/.test(bodyGate) && !/产业瓶颈堵点识别/.test(bodyGate)) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 产业瓶颈堵点识别 SPA 404 ' + page.url());
      }
      await expect(page.getByText('分析配置').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('注册诊断维度').first()).toBeVisible({ timeout: 8000 });
      const EXPECT_HEADERS = [
        '选择',
        '指标名称',
        '分组 / 维度',
        '数据状态',
        '权重',
        '数据来源',
        '指标说明',
      ];
      const readDimTableHeaders = async () => {
        return await page.evaluate((expected) => {
          const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
          const matchRow = (headers) => {
            if (!headers || headers.length !== 7) return null;
            for (let i = 0; i < 7; i++) {
              if (headers[i] !== expected[i]) return null;
            }
            return headers;
          };
          const tables = [...document.querySelectorAll('table, .arco-table')];
          for (const table of tables) {
            if (!table.innerText.includes('指标名称') || !table.innerText.includes('技术')) continue;
            const headRow =
              table.querySelector('thead tr') ||
              table.querySelector('.arco-table-header .arco-table-tr') ||
              table.querySelector('.arco-table-tr');
            if (!headRow) continue;
            const cells = [...headRow.querySelectorAll('th, .arco-table-th')]
              .map((c) => norm(c.innerText))
              .filter(Boolean);
            if (cells.length < 7) continue;
            const matched = matchRow(cells.slice(0, 7));
            if (matched) return { ok: true, headers: matched, via: 'table' };
          }
          const anchor = (document.body.innerText || '').indexOf('注册诊断维度');
          const slice = anchor >= 0 ? document.body.innerText.slice(anchor, anchor + 480) : document.body.innerText;
          const seg = slice.split(/\n|\t/).map(norm).filter(Boolean);
          for (let start = 0; start < seg.length; start++) {
            if (seg[start] !== '选择') continue;
            const matched = matchRow(seg.slice(start, start + 7));
            if (matched) return { ok: true, headers: matched, via: 'text_proxy' };
          }
          return { ok: false, reason: '未找到七列表头', seg: seg.slice(0, 20) };
        }, EXPECT_HEADERS);
      };
      const dimTable = page.locator('.arco-table').filter({ has: page.getByText('指标名称', { exact: true }) }).first();
      if (await dimTable.count()) {
        await dimTable.scrollIntoViewIfNeeded().catch(() => {});
        await page.waitForTimeout(300);
      } else {
        await page.getByText('注册诊断维度').first().scrollIntoViewIfNeeded().catch(() => {});
      }
      await expect(page.getByText('指标名称', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const hdr = await readDimTableHeaders();
      if (!hdr || !hdr.ok) {
        throw new Error('注册诊断维度表头读取失败: ' + JSON.stringify(hdr));
      }
      if (hdr.headers.length !== 7) {
        throw new Error('表头列数非7: ' + JSON.stringify(hdr.headers));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  catalog_path=/industry-center/diagnosis?workspace=bottleneck&tab=bottleneck（entry-seed）；深链 goto 同 FUNC-03191–03194。
  用例「打开注册诊断维度表」= 分析配置区默认展示该表（scout 七列：选择/指标名称/分组 / 维度/数据状态/权重/数据来源/指标说明）。
  表定位：含「指标名称」且含「技术」行的 Arco 表；顺序严格七列。登录关评审 runner 前置。A 档零 allow_skip。
