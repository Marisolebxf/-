id: FUNC-03508
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03508
priority: P0
title: 只改产业或区域时不创建分析任务
story: US-CHAIN-REG-03
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已在分析配置
locators:
  industry: '.arco-select-view[aria-label="产业"]'
  records_tab: tab「分析记录」
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: wait
    for: 三大一级维度权重
    timeout_ms: 3500
  - action: evaluate
    note: 配置页选产业→打开分析记录记条数→改选产业（不点开始）→两条预期在 expect
expect:
  - note: 1、页面仍停留在分析配置，不进入生成中
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳（search 404） ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const onConfigPage = async () => {
        if (!/\/industry-center\/regional/.test(page.url()) || !/workspace=competitiveness/.test(page.url())) return false;
        if (/[?&]view=(processing|result|report)/.test(page.url())) return false;
        if (await bodyIs404()) return false;
        return await page.getByText('三大一级维度权重').first().isVisible().catch(() => false);
      };
      const ensureLand = async () => {
        await dismissBasket();
        if (!(await onConfigPage())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!(await onConfigPage())) {
          await enterViaSidebar().catch(() => {});
          await page.waitForTimeout(800);
        }
        if (!(await onConfigPage())) {
          if (await bodyIs404()) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价侧栏与 catalog 深链均 SPA404 ' + page.url());
          }
          throw new Error('竞争力配置页未着陆 url=' + page.url());
        }
        await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      };
      const pickSelect = async (ariaLabel, textRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await expect(view).toBeVisible({ timeout: 10000 });
        const raw = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (textRe.test(raw)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(500);
          const pop = page.locator('.arco-trigger-popup:visible').last();
          const opt = pop.locator('.arco-select-option').filter({ hasText: textRe });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(700);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('下拉未见选项 ' + textRe + '（' + ariaLabel + '）');
      };
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await ensureLand();
      await page.getByText('单产业 × 多区域', { exact: true }).first().click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(400);
      const clusterText = ((await page.locator('.arco-select-view[aria-label="集群"]').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/新一代信息技术/.test(clusterText)) {
        await pickSelect('集群', /^新一代信息技术$/);
      }
      await pickSelect('产业', /^半导体与集成电路$/);
      await page.waitForTimeout(500);
      await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nBefore = await countChainRows();
      await page.getByRole('tab', { name: '区域产业竞争力评价', exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await pickSelect('产业', /^人工智能与应用$/);
      await page.waitForTimeout(800);
      globalThis.__func03508 = { nBefore };
      await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 12000 });
      const url = page.url();
      if (/[?&]view=processing/.test(url)) {
        throw new Error('改选产业后误入 view=processing：' + url);
      }
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/区域产业竞争力评价生成中|可视化分析过程/.test(body) && !/三大一级维度权重/.test(body)) {
        throw new Error('改选产业后进入生成中页');
      }
      const shown = ((await page.locator('.arco-select-view[aria-label="产业"]').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/人工智能与应用/.test(shown)) {
        throw new Error('改选后产业未变为「人工智能与应用」：「' + shown + '」');
      }
  - note: 2、分析记录不因这次改选新增任务
    assert: |-
      const ctx = globalThis.__func03508;
      if (!ctx || ctx.nBefore === undefined) throw new Error('前置：未完成改选产业');
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const countChainRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = await countChainRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('分析记录 CHAIN 条数增加：' + ctx.nBefore + ' -> ' + nAfter + '（改选产业应不新增）');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  重写 01111 显式触发半段（Q-ANALYSIS-01：切条件不自动 create）。catalog_path=entry-seed competitiveness。
  步骤=配置页选半导体→记分析记录 CHAIN 数→改选人工智能与应用（不点开始）→仍见三大一级维度权重+记录条数不增。
  edu SPA404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
