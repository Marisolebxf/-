id: FUNC-03510
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03510
priority: P1
tier: B
title: 权重不接受负数
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 企业能力权重输入 -5 后离开该输入框（用例步骤 1–2）
    script: |-
      const main = page.locator('main');
      const table = main.locator('[data-testid="regional-competitiveness-weight-table"]');
      await expect(table).toBeVisible({ timeout: 15000 });
      const input = table.locator('tr').filter({ hasText: '企业能力' }).locator('input').first();
      await input.click();
      await input.fill('');
      await input.pressSequentially('-5', { delay: 50 });
      await main.getByText('三大一级维度权重').click();
expect:
  - note: 1、企业能力权重变为 0
    assert: |-
      const input = page.locator('main [data-testid="regional-competitiveness-weight-table"] tr').filter({ hasText: '企业能力' }).locator('input').first();
      await expect(input).toHaveValue('0');
on_fail: 截图 + 抄 X-Trace-Id
