id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01102
priority: P0
title: 单产业模式下产业仅可选中 1 个且呈现补选提示
entry_id: chain-regional-compete
preconditions:
- 已进入工作区；评价模式为「单产业 × 多区域」；评审关闭
locators:
  industry: .arco-select-view[aria-label=产业]
  hint: 单产业模式请选择 1 个产业
steps:
- action: goto
  target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
- action: click
  target: 选定 1 个产业后再尝试加选
expect:
- note: 产业仅可选中 1 个，尝试加选第 2 个不生效
  assert: |-
    await page.goto('/industry-center/regional?workspace=competitiveness&tab=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(3500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.getByText('单产业 × 多区域', { exact: true }).first().click(); await page.waitForTimeout(500); const ind = page.locator('.arco-select-view[aria-label="产业"]'); if (await ind.evaluate(el => el.className.includes('mult'))) throw new Error('单产业态产业呈多选'); await ind.click(); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '集成电路' }).first().click({ force: true }); await page.waitForTimeout(800); await expect(ind).toContainText('集成电路'); await ind.click(); await page.waitForTimeout(500); const opt2 = page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '传感器' }).first(); if (await opt2.count()) await opt2.click({ force: true }); await page.waitForTimeout(600); const t = await ind.innerText(); if (/传感器/.test(t) && /集成电路/.test(t)) throw new Error('单产业态同时保留两产业: ' + t); if (!/集成电路|传感器|人工智能|智能终端|软件/.test(t)) throw new Error('产业未回显: ' + t)
- note: 呈现提示「单产业模式请选择 1 个产业」
  assert: |-
    await page.getByRole('button', { name: '重置参数' }).click(); await page.waitForTimeout(800); await expect(page.getByText('单产业模式请选择 1 个产业').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 单产业态产业为 single select，换选会替换而非叠加。
tier: B
