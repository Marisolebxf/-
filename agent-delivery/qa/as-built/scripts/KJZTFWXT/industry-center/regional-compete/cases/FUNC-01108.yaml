id: FUNC-01108
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01108
priority: P1
tier: B
title: 权重合计为 100% 方可提交且不静默归一化
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 同册 03488 前置：生物产业/生物/深圳市，再改企业能力权重为 50（用例步骤 1）
expect:
  - note: 1、合计偏离 100% 时「开始分析」不可提交
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      const popup = () => page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible, .arco-cascader-panel:visible');
      const pickPopup = (name) => popup().getByText(name, { exact: true }).first();
      const ensureCombo = async () => {
        const objectHost = main.locator('[data-mount-host="CHAIN-REG-F01-OBJECT-CONTEXT"]');
        const needIndustry = await main.getByText('单产业模式请选择 1 个产业').isVisible().catch(() => false);
        const needRegion = await main.getByText(/请选择 1–5 个区域/).isVisible().catch(() => false);
        if (needIndustry) {
          const objCtrl = objectHost.locator('.arco-cascader-view, .arco-select-view').first();
          await objCtrl.click({ timeout: 8000 });
          const casc = page.locator('.arco-cascader-panel:visible');
          if (await casc.count()) {
            await casc.locator('.arco-cascader-option').filter({ hasText: '生物产业' }).first().click();
            await casc.locator('.arco-cascader-option').filter({ hasText: /^生物$/ }).first().click();
          } else {
            await pickPopup('生物产业').click();
            await objectHost.locator('.arco-select-view, .arco-cascader-view').first().click();
            await pickPopup('生物').click();
          }
        }
        if (needRegion) {
          await objectHost.locator('.arco-select-view').last().click({ timeout: 8000 });
          await pickPopup('深圳市').click();
        }
        await main.getByText('三大一级维度权重').click();
        await page.waitForTimeout(500);
        await expect(main.getByText('单产业模式请选择 1 个产业')).toHaveCount(0, { timeout: 8000 });
      };
      await ensureCombo();
      const weightTable = main.locator('[data-testid="regional-competitiveness-weight-table"]');
      const setWeight = async (label, val) => {
        const row = weightTable.getByRole('row').filter({ hasText: label }).first();
        const input = row.locator('input').first();
        await input.click({ timeout: 8000 });
        await input.fill(String(val));
        await input.press('Tab');
        await page.waitForTimeout(300);
      };
      await setWeight('企业能力', 50);
      globalThis.__func01108 = { deviated: true };
      await expect(main.getByText(/权重合计须为 100%|110%/).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
  - note: 2、偏离期间各维度权重保持所填值，不静默归一化
    assert: |-
      if (!globalThis.__func01108?.deviated) throw new Error('前置：权重偏离步骤未完成');
      const main = page.locator('main');
      const weightTable = main.locator('[data-testid="regional-competitiveness-weight-table"]');
      const readW = async (label) => {
        const row = weightTable.getByRole('row').filter({ hasText: label }).first();
        return String(await row.locator('input').first().inputValue());
      };
      const w1 = await readW('企业能力');
      const w2 = await readW('学术生态');
      const w3 = await readW('配套生态力');
      globalThis.__func01108.vals = { w1, w2, w3 };
      expect(w1).toBe('50');
      expect(w2).toBe('35');
      expect(w3).toBe('25');
  - note: 3、合计回到 100% 后恢复可提交
    assert: |-
      const main = page.locator('main');
      const weightTable = main.locator('[data-testid="regional-competitiveness-weight-table"]');
      const input = weightTable.getByRole('row').filter({ hasText: '企业能力' }).first().locator('input').first();
      await input.click({ timeout: 8000 });
      await input.fill('40');
      await input.press('Tab');
      await page.waitForTimeout(500);
      await expect(main.getByText(/权重合计：100%.*校验通过/).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
