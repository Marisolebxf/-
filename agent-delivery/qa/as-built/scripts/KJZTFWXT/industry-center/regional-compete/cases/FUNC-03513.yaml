id: FUNC-03513
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03513
priority: P1
title: 学术生态与配套生态力指标说明标题与行一致
entry_id: chain-regional-compete
tier: B
preconditions:
  - 维度表已展示
locators:
  academic_row: 学术生态行
  support_row: 配套生态力行
  view_btn: 维度行「查看」
  drawer: .arco-drawer:visible
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 学术生态行查看→关弹层→配套生态力行查看（判定在 expect）
expect:
  - note: 1、学术生态弹层标题为「学术生态 · 指标说明」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在|抱歉，页面不存在/.test(t) && !/三大一级维度权重/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const onConfig = () =>
        /\/industry-center\/regional/.test(page.url()) &&
        /workspace=competitiveness/.test(page.url()) &&
        /tab=competitiveness/.test(page.url());
      const leafItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
      const expandChainGroup = async () => {
        if (await leafItem().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const ensureMenuShell = async () => {
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (await bodyIs404()) await recover404Shell();
        }
      };
      const enterViaSidebar = async () => {
        await ensureMenuShell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳 ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const ensureLand = async () => {
        await dismissBasket();
        await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (!onConfig() || (await bodyIs404())) await enterViaSidebar();
        if (await bodyIs404()) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价侧栏与 catalog 深链均 SPA404 ' + page.url());
        }
        await page.getByText('三大一级维度权重').first().waitFor({ state: 'visible', timeout: 15000 });
      };
      const pickIndustry = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="产业"]').first();
        await expect(view).toBeVisible({ timeout: 12000 });
        const shown = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (/集成电路/.test(shown)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(500);
          const pop = page.locator('.arco-trigger-popup:visible').last();
          const opt = pop.locator('.arco-select-option').filter({ hasText: /^集成电路$/ });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(700);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('无法选择产业「集成电路」');
      };
      const dimRow = (name) =>
        page.locator('main table').first().locator('tbody tr').filter({ hasText: name }).filter({ hasText: '一级维度' }).first();
      const openDrawerFor = async (dimName) => {
        const row = dimRow(dimName);
        await expect(row).toBeVisible({ timeout: 8000 });
        await row.getByRole('button', { name: '查看' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const drawer = page.locator('.arco-drawer:visible').first();
        await expect(drawer).toBeVisible({ timeout: 10000 });
        return drawer;
      };
      const drawerTitle = async (drawer) =>
        ((await drawer.locator('.arco-drawer-title, .arco-drawer-header').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      const closeDrawer = async () => {
        const btn = page.locator('.arco-drawer:visible .arco-drawer-close-btn').first();
        if (await btn.isVisible().catch(() => false)) {
          await btn.click({ timeout: 8000 });
        } else {
          await page.keyboard.press('Escape').catch(() => {});
        }
        await page.waitForTimeout(500);
        await expect(page.locator('.arco-drawer:visible')).toHaveCount(0, { timeout: 8000 });
      };
      await ensureLand();
      await pickIndustry();
      await expect(page.locator('main table').first()).toBeVisible({ timeout: 10000 });
      const academicDrawer = await openDrawerFor('学术生态');
      const academicTitle = await drawerTitle(academicDrawer);
      if (!/学术生态/.test(academicTitle) || !/指标说明/.test(academicTitle)) {
        throw new Error('学术生态抽屉标题应为「学术生态 · 指标说明」，得：' + academicTitle);
      }
      await closeDrawer();
      globalThis.__func03513 = { academicOk: true };
  - note: 2、配套生态力弹层标题为「配套生态力 · 指标说明」
    assert: |-
      if (!globalThis.__func03513?.academicOk) throw new Error('前置：学术生态说明未通过或未关弹层');
      const dimRow = (name) =>
        page.locator('main table').first().locator('tbody tr').filter({ hasText: name }).filter({ hasText: '一级维度' }).first();
      const row = dimRow('配套生态力');
      await expect(row).toBeVisible({ timeout: 8000 });
      await row.getByRole('button', { name: '查看' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const titleText = ((await drawer.locator('.arco-drawer-title, .arco-drawer-header').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/配套生态力/.test(titleText) || !/指标说明/.test(titleText)) {
        throw new Error('配套生态力抽屉标题应为「配套生态力 · 指标说明」，得：' + titleText);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03513=选产业「集成电路」后维度表学术生态/配套生态力行「查看」→ IndustryMetricSpecDrawer 标题分别为
  「学术生态 · 指标说明」「配套生态力 · 指标说明」；中间关抽屉。栏目结构同 03504。catalog_path=entry-seed competitiveness。
