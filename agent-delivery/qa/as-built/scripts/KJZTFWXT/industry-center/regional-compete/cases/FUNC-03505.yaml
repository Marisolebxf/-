id: FUNC-03505
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03505
priority: P0
title: 分析记录列表表头五列且已完成行含全套操作
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已有至少一条竞争力分析记录
locators:
  tab_records: tab「分析记录」
  records_table: main table, .arco-table
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 侧栏进入竞争力工作区并点击「分析记录」（用例步骤 1；判定在 expect）
expect:
  - note: 1、表头为任务、类型、状态、创建时间、操作
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const HEADERS = ['任务', '类型', '状态', '创建时间', '操作'];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const recordsTab = () => page.locator('[role=tab][data-tab-key="records"]');
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await recover404Shell();
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (await bodyIs404()) await recover404Shell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳（search 404） ' + page.url());
        }
        await expandChainGroup();
        const leaf = leafItem();
        if (!(await leaf.first().isVisible().catch(() => false))) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 侧栏未见「区域产业竞争力评价」menu_leaf url=' + page.url());
        }
        await leaf.first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const ensureWorkzone = async () => {
        await dismissBasket();
        await recover404Shell();
        const onRegional = () => /\/industry-center\/regional/.test(page.url()) && /workspace=competitiveness/.test(page.url());
        if (!onRegional() || (await bodyIs404())) {
          await enterViaSidebar();
        }
        if (await bodyIs404()) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价着陆失败 ' + page.url());
        }
        await expect(recordsTab().first()).toBeVisible({ timeout: 15000 });
      };
      await ensureWorkzone();
      const rec = recordsTab();
      await expect(rec.first()).toBeVisible({ timeout: 10000 });
      await rec.first().click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      const recSelected =
        (await rec.first().getAttribute('aria-selected')) === 'true' ||
        ((await rec.first().getAttribute('class')) || '').includes('active');
      if (!recSelected) {
        throw new Error('分析记录 Tab 未选中，url=' + page.url());
      }
      const mainTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const hasChain = /CHAIN-\d{8}-\d{3}/.test(mainTxt);
      if (!hasChain) {
        throw new Error('ENV-CHAIN-REGIONAL-COMPETE-NO-RECORDS: 前置要求至少一条竞争力分析记录，当前列表无 CHAIN 任务');
      }
      const ths = page.locator('main .arco-table-th, main table thead th, main .arco-table-th-item');
      const thCount = await ths.count();
      const headerTexts = [];
      for (let i = 0; i < thCount; i++) {
        headerTexts.push(((await ths.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, '').trim());
      }
      const joined = headerTexts.join('|');
      for (const h of HEADERS) {
        if (!joined.includes(h) && !mainTxt.includes(h)) {
          throw new Error('表头缺「' + h + '」；th=' + headerTexts.join(',') + ' main片段=' + mainTxt.slice(0, 280));
        }
      }
      globalThis.__func03505 = { recordsReady: true };
  - note: 2、已完成行操作含查看结果、复制配置、查看报告、下载报告、删除
    assert: |-
      if (!globalThis.__func03505?.recordsReady) throw new Error('前置：未进入分析记录列表');
      const rows = page.locator('.arco-table-tbody .arco-table-tr, main table tbody tr');
      const n = await rows.count();
      let doneRow = null;
      for (let i = 0; i < n; i++) {
        const txt = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/已完成/.test(txt)) {
          doneRow = rows.nth(i);
          break;
        }
      }
      if (!doneRow) {
        throw new Error('ENV-CHAIN-REGIONAL-COMPETE-NO-DONE-TASK: 列表无「已完成」行，无法验行操作');
      }
      const OPS = ['查看结果', '复制配置', '查看报告', '下载报告', '删除'];
      for (const op of OPS) {
        const btn = doneRow.getByRole('button', { name: new RegExp('^' + op + '$') });
        const link = doneRow.getByRole('link', { name: new RegExp('^' + op + '$') });
        const hasBtn = (await btn.count()) && !(await btn.first().isDisabled().catch(() => false));
        const hasLink = await link.count();
        if (!hasBtn && !hasLink) {
          const rowTxt = ((await doneRow.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          throw new Error('已完成行缺操作「' + op + '」；行片段=' + rowTxt.slice(0, 320));
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03505=配置页 catalog_path 着陆→点击 Tab「分析记录」；表头五列任务/类型/状态/创建时间/操作（env-gate g5 2026-10-14）。
  已完成行五操作=查看结果/复制配置/查看报告/下载报告/删除（button 或 link）。无 CHAIN 行→ENV-CHAIN-REGIONAL-COMPETE-NO-RECORDS blocked；
  无已完成行→ENV-CHAIN-REGIONAL-COMPETE-NO-DONE-TASK blocked。edu 深链 SPA404→侧栏 search→区域产业竞争力评价（同 03503）。B 档零 allow_skip。
