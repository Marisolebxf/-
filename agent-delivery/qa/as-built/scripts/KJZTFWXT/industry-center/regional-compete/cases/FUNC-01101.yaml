id: FUNC-01101
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01101
priority: P0
tier: B
title: 两种评价模式单选互斥且切换后不静默保留非法对象组合
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: wait
    target: 评价模式
  - action: evaluate
    script: |-
      const main = page.locator('main');
      await main.getByText('单产业 × 多区域', { exact: true }).click();
      const objectRow = main.locator('[data-mount-host="CHAIN-REG-F01-OBJECT-CONTEXT"]');
      await objectRow.locator('.arco-select-view').first().click();
      await page.locator('.arco-select-dropdown:visible .arco-select-option').first().click();
      await objectRow.locator('.arco-select-view').last().click();
      const dropdown = page.locator('.arco-select-dropdown:visible');
      const options = dropdown.locator('.arco-select-option');
      const count = await options.count();
      for (let i = 0; i < Math.min(count, 2); i += 1) {
        await options.nth(i).click();
      }
      await main.getByText('多产业 × 单区域', { exact: true }).click();
expect:
  - note: 1、评价模式含「单产业 × 多区域」「多产业 × 单区域」两选项，同一时刻仅一态
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('单产业 × 多区域', { exact: true })).toBeVisible();
      await expect(main.getByText('多产业 × 单区域', { exact: true })).toBeVisible();
      await expect(main.locator('.analysis-rounded-radio .arco-radio-checked')).toHaveCount(1);
  - note: 2、切换后已选对象收窄或清空至新模式合法范围，不静默保留多产业 × 多区域组合
    assert: |-
      const main = page.locator('main');
      await expect(main.locator('.analysis-rounded-radio .arco-radio-checked')).toContainText('多产业 × 单区域');
      const objectRow = main.locator('[data-mount-host="CHAIN-REG-F01-OBJECT-CONTEXT"]');
      await expect(objectRow.getByText('分析对象（1–5）')).toBeVisible();
      await expect(objectRow.getByText('评价区域', { exact: true })).toBeVisible();
      await expect(objectRow.locator('.arco-select-view-multiple')).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
