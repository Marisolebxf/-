id: FUNC-01124
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01124
priority: P1
tier: B
title: 门禁未满足时开始分析禁用触发无效
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: press
    key: Enter
expect:
  - note: 1、禁用态下点击与回车均不创建任务、不跳转结果态
    assert: |-
      const btn = page.locator('main').getByRole('button', { name: '开始分析' });
      await expect(btn).toBeDisabled();
      await btn.click({ force: true });
      await btn.focus();
      await page.keyboard.press('Enter');
      await expect(page.getByText('区域产业竞争力评价生成中')).toHaveCount(0);
      await expect(page.getByText('区域产业竞争力评价结果')).toHaveCount(0);
  - note: 2、页面不静默代选对象或维度发起任务
    assert: |-
      await expect(page.locator('main').getByText('单产业模式请选择 1 个产业').first()).toBeVisible();
      await expect(page.locator('main').getByText('企业能力')).toBeVisible();
      await expect(page.locator('main').getByRole('button', { name: '开始分析' })).toBeDisabled();
      await page.locator('main').getByText('分析记录', { exact: true }).click();
      await expect(page.locator('main').getByRole('heading', { name: '分析记录' })).toBeVisible();
      await expect(page.getByText('区域产业竞争力评价生成中')).toHaveCount(0);
      await expect(page.getByText('区域产业竞争力评价结果')).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
