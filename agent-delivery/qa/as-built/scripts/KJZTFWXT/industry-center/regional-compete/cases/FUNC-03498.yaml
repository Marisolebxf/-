id: FUNC-03498
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03498
priority: P0
title: 按此配置新建分析回到配置页且不立刻创建新任务
entry_id: chain-regional-compete
tier: A
preconditions:
  - 已打开一条成功结果（assert 自含：集成电路+深沪→结果或当天复用）
locators:
  new_from_config_btn: button「按此配置新建分析」
  industry: '.arco-select-view[aria-label="产业"]'
  region_multi: main 内区域多选
  start: button「开始分析」
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: wait
    for: 评价模式文案可见
    timeout_ms: 3500
  - action: evaluate
    note: 打开成功结果→点「按此配置新建分析」；三条预期在 expect
expect:
  - note: 前置：打开集成电路+深圳市+上海市的成功结果页并捕获对象行与权重快照
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      if (/itic-sci\.com\/sso\/user\/login/.test(page.url())) {
        throw new Error('ENV-EDU-AUTH-SSO: runner 未落在 tts/svcz 业务域 ' + page.url());
      }
      const PROCESS_TITLE = '区域产业竞争力评价生成中';
      const RESULT_TITLE = '区域产业竞争力评价结果';
      const HINT = /今日已分析过相同条件，已打开结果/;
      const WEIGHT_LABELS = ['企业能力权重', '学术生态权重', '配套生态力权重'];
      const REGIONS = ['深圳市', '上海市'];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (!/\/industry-center\/search/.test(page.url())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) await recover404Shell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳（search 404） ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const ensureConfigLand = async () => {
        const onTarget = () =>
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=competitiveness/.test(page.url()) &&
          /tab=competitiveness/.test(page.url()) &&
          !/[?&]view=processing/.test(page.url()) &&
          !/[?&]view=result/.test(page.url());
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (await bodyIs404()) await recover404Shell();
        if (!onTarget() || (await bodyIs404())) {
          await enterViaSidebar().catch(() => {});
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 侧栏与 catalog 深链均 SPA404 ' + page.url());
        }
        await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      };
      const readWeights = async () => {
        const snap = {};
        for (const label of WEIGHT_LABELS) {
          const wrap = page.locator(`[aria-label="${label}"]`).first();
          const inp = wrap.locator('input').first();
          const v = ((await inp.inputValue().catch(() => '')) || (await inp.getAttribute('value')) || '').trim();
          snap[label] = v;
        }
        return snap;
      };
      const pickIndustryIc = async () => {
        const view = page.locator('.arco-select-view[aria-label="产业"]').first();
        await view.waitFor({ state: 'visible', timeout: 10000 });
        const shown = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (/集成电路/.test(shown)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
          const popup = page.locator('.arco-trigger-popup:visible').last();
          const opt = popup.locator('.arco-select-option').filter({ hasText: /^集成电路$/ });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(800);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('产业下拉未见「集成电路」');
      };
      const pickRegions = async (names) => {
        const regionMulti = page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|广东|请选择区域/ }).first();
        await regionMulti.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        for (const name of names) {
          const hit = pop.locator('.arco-select-option').filter({ hasText: new RegExp('^\\s*' + name + '\\s*$') });
          if (await hit.count()) {
            const selected = await hit.first().evaluate((el) => (el.className || '').includes('selected'));
            if (!selected) await hit.first().click({ force: true, timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(350);
          }
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(500);
        const shown = ((await regionMulti.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        for (const name of names) {
          if (!shown.includes(name) && !shown.includes(name.replace('市', ''))) {
            throw new Error('评价区域未含「' + name + '」：' + shown);
          }
        }
      };
      const isSuccessResult = async () => {
        if (!/[?&]view=result/.test(page.url())) return false;
        return await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false);
      };
      const waitSuccessAfterStart = async () => {
        for (let i = 0; i < 60; i++) {
          await page.waitForTimeout(i < 4 ? 500 : 2000);
          if (await isSuccessResult()) return;
          const last = await page.locator('main').innerText().catch(() => '');
          if (HINT.test(last) && (await isSuccessResult())) return;
          const vr = page.getByRole('button', { name: /查看分析结果|查看结果/ });
          if (await vr.count() && (await vr.first().isVisible().catch(() => false))) {
            await vr.first().click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(800);
          }
          if (/分析失败|INPUT_OBJECT_INVALID/.test(last)) {
            throw new Error('集成电路组合未到达成功结果');
          }
        }
        throw new Error('超时未打开成功结果：' + page.url());
      };
      const captureResultCtx = async (weightsBefore) => {
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const lineMatch = body.match(/对象[：:]\s*(.+?)\s*·\s*任务\s+(CHAIN-\d{8}-\d{3})/);
        if (!lineMatch) throw new Error('成功结果页未见对象行：' + body.slice(0, 350));
        const summary = (lineMatch[1] || '').trim();
        const regions = ['深圳市', '上海市', '杭州市', '北京市', '广东省'].filter(
          (n) => summary.includes(n) || summary.includes(n.replace('市', ''))
        );
        globalThis.__func03498 = {
          objectSummary: summary,
          taskId: lineMatch[2],
          weightsBefore: weightsBefore || null,
          regions: regions.length ? regions : REGIONS,
          postsAtResult: globalThis.__func03498CreatePosts || 0,
        };
      };
      const tryOpenExistingResult = async () => {
        const TID_RE = /CHAIN-\d{8}-\d{3}/;
        const openDeep = async (taskId) => {
          await page.goto(
            toUrl('/industry-center/regional?view=result&task_id=' + taskId + '&tab=competitiveness&workspace=competitiveness'),
            { waitUntil: 'domcontentloaded', timeout: 60000 }
          );
          await page.waitForTimeout(3500);
          await dismissBasket();
        };
        if (await isSuccessResult()) {
          await captureResultCtx(null);
          return true;
        }
        for (const tid of ['CHAIN-20260911-010', 'CHAIN-20260907-001', 'CHAIN-20260915-002']) {
          await openDeep(tid);
          if (await isSuccessResult()) {
            await captureResultCtx(null);
            return true;
          }
        }
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        await enterViaSidebar().catch(() => {});
        if (await bodyIs404()) return false;
        const recTab = page.getByRole('tab', { name: '分析记录', exact: true }).first();
        if (await recTab.isVisible().catch(() => false)) {
          await recTab.click({ timeout: 8000 });
          await page.waitForTimeout(2500);
        }
        const rows = page.locator('.arco-table-tbody .arco-table-tr, table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 15); i++) {
          const txt = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (!/已完成/.test(txt)) continue;
          const viewBtn = rows.nth(i).getByRole('button', { name: /查看结果/ });
          if (!(await viewBtn.count())) continue;
          await viewBtn.first().click({ timeout: 8000 });
          await page.waitForTimeout(3500);
          await dismissBasket();
          if (!/view=result/.test(page.url())) {
            const m = txt.match(TID_RE);
            if (m) await openDeep(m[0]);
          }
          if (await isSuccessResult()) {
            await captureResultCtx(null);
            return true;
          }
        }
        return false;
      };
      if (!globalThis.__func03498Hooked) {
        globalThis.__func03498Hooked = true;
        globalThis.__func03498CreatePosts = 0;
        page.on('response', (r) => {
          if (r.request().method() === 'POST' && /\/analysis\/tasks(\?|$)/.test(r.url()) && !/\/analysis\/tasks\/list/.test(r.url()) && r.status() < 400) {
            globalThis.__func03498CreatePosts++;
          }
        });
      }
      if (!(await tryOpenExistingResult())) {
      await ensureConfigLand();
      await pickIndustryIc();
      await pickRegions(REGIONS);
      const weightsBefore = await readWeights();
      const start = page.locator('main').getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start).toBeEnabled({ timeout: 20000 });
      const posts0 = globalThis.__func03498CreatePosts || 0;
      if (!(await isSuccessResult())) {
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 16; i++) {
          await page.waitForTimeout(400);
          if (await isSuccessResult()) break;
          if (HINT.test(await page.locator('main').innerText().catch(() => '')) && (await isSuccessResult())) break;
        }
        if (!(await isSuccessResult())) await waitSuccessAfterStart();
      }
      await captureResultCtx(weightsBefore);
      }
  - note: 1、点击「按此配置新建分析」后回到「分析配置」（可见三大一级维度权重），且不进入「区域产业竞争力评价生成中」
    assert: |-
      const ctx = globalThis.__func03498;
      if (!ctx) throw new Error('前置：未打开成功结果');
      const PROCESS_TITLE = '区域产业竞争力评价生成中';
      const btn = page.getByRole('button', { name: '按此配置新建分析' });
      await expect(btn.first()).toBeVisible({ timeout: 8000 });
      const posts0 = ctx.postsAtResult ?? globalThis.__func03498CreatePosts ?? 0;
      await btn.first().click({ timeout: 10000 });
      for (let i = 0; i < 8; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        const u = page.url();
        const mainTxt = await page.locator('main').innerText().catch(() => '');
        if (/[?&]view=processing/.test(u) || mainTxt.includes(PROCESS_TITLE)) {
          throw new Error('点击后进入过程态（不应立刻创建任务）：' + u);
        }
        if (await page.getByText('三大一级维度权重').first().isVisible().catch(() => false)) break;
      }
      await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 12000 });
      const posts1 = globalThis.__func03498CreatePosts || 0;
      if (posts1 > posts0) {
        throw new Error('点击后触发了新建分析 POST（增量=' + (posts1 - posts0) + '）');
      }
      if (/[?&]view=processing/.test(page.url())) {
        throw new Error('仍在 view=processing：' + page.url());
      }
      await expect(page.getByText(PROCESS_TITLE)).not.toBeVisible({ timeout: 2000 });
      ctx.postsAfterClick = posts1;
  - note: 2、产业与区域与结果对象行一致（禁止回到未选产业且区域只剩深圳市）
    assert: |-
      const ctx = globalThis.__func03498;
      if (!ctx || !ctx.objectSummary) throw new Error('前置：无对象行快照');
      const industryView = page.locator('.arco-select-view[aria-label="产业"]').first();
      const industryTxt = ((await industryView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      const industryNeedle = /集成电路|生物|传感器|人工智能/.exec(ctx.objectSummary)?.[0];
      if (industryNeedle && !industryTxt.includes(industryNeedle)) {
        throw new Error('配置页产业与结果不一致：现场「' + industryTxt + '」对象行「' + ctx.objectSummary + '」');
      }
      if (/未选产业|请选择产业/.test(industryTxt)) {
        throw new Error('D3：回到配置但产业未回填（曾现未选产业回归）');
      }
      const regionMulti = page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|广东|请选择区域/ }).first();
      const regionTxt = ((await regionMulti.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      for (const name of ctx.regions || ['深圳市', '上海市']) {
        if (!regionTxt.includes(name) && !regionTxt.includes(name.replace('市', ''))) {
          throw new Error('配置页区域缺少「' + name + '」：' + regionTxt + '；对象行=' + ctx.objectSummary);
        }
        if (!ctx.objectSummary.includes(name) && !ctx.objectSummary.includes(name.replace('市', ''))) {
          throw new Error('对象行未含区域「' + name + '」：' + ctx.objectSummary);
        }
      }
      if (/未选产业|请选择产业/.test(industryTxt)) {
        throw new Error('D3：回到配置但产业未回填（曾现未选产业回归）');
      }
  - note: 3、三大一级维度权重与进入结果前配置一致
    assert: |-
      const ctx = globalThis.__func03498;
      if (!ctx) throw new Error('前置：无结果上下文');
      const WEIGHT_LABELS = ['企业能力权重', '学术生态权重', '配套生态力权重'];
      if (ctx.weightsBefore) {
        for (const label of WEIGHT_LABELS) {
          const wrap = page.locator(`[aria-label="${label}"]`).first();
          const inp = wrap.locator('input').first();
          const now = ((await inp.inputValue().catch(() => '')) || '').trim();
          const was = String(ctx.weightsBefore[label] ?? '').trim();
          if (was && now && was !== now) {
            throw new Error('权重「' + label + '」与结果前不一致：was=' + was + ' now=' + now);
          }
        }
      }
      let total = 0;
      for (const label of WEIGHT_LABELS) {
        const wrap = page.locator(`[aria-label="${label}"]`).first();
        total += Number(((await wrap.locator('input').first().inputValue().catch(() => '0')) || '0'));
      }
      if (total !== 100) throw new Error('权重合计应为 100%，现场=' + total);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  结果态 IndustryResultReportEntry 按钮文案「按此配置新建分析」绑定 job.backToConfig（draft=1，不清组件内对象/权重态）。
  用例曾记 D3 回填丢失（未选产业+仅深圳）→ expect②③ 对齐对象行与进入结果前权重快照。指纹=单产业×多区域·集成电路·深+沪（env-gate 合法组合）。
  catalog_path=entry-seed competitiveness；A 档零 allow_skip。
