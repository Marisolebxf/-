id: FUNC-03511
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03511
priority: P1
title: 重置参数恢复默认权重且保留已选产业与区域
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已选定产业和至少一个区域
locators:
  industry: '.arco-select-view[aria-label="产业"]'
  reset: button「重置参数」
  enterprise_weight: spinbutton 企业能力（第 1 个）
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 企业能力权重改为 50 后点击「重置参数」（用例步骤 1–2）
expect:
  - note: 前置：选产业与至少一区域，改企业能力权重为 50 并点击重置参数
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳（search 404） ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const ensureLand = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=competitiveness/.test(page.url()) &&
          /tab=competitiveness/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!onTarget() || (await bodyIs404())) {
          await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价侧栏与 catalog 深链均 SPA404 ' + page.url());
        }
        await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      };
      const pickIndustry = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="产业"]').first();
        await expect(view).toBeVisible({ timeout: 12000 });
        const shown = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (/集成电路/.test(shown)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(500);
          const pop = page.locator('.arco-trigger-popup:visible').last();
          const opt = pop.locator('.arco-select-option').filter({ hasText: /^集成电路$/ });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(700);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('无法选择产业「集成电路」');
      };
      const regionMulti = () =>
        page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|杭州|广东|北京|请选择区域/ }).first();
      const ensureAtLeastOneRegion = async () => {
        const view = regionMulti();
        await expect(view).toBeVisible({ timeout: 10000 });
        let txt = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (/深圳/.test(txt)) return txt;
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: /^深圳市$/ }).first();
        if (await opt.count()) {
          await opt.click({ force: true, timeout: 8000 });
          await page.waitForTimeout(400);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
        txt = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (!/深圳|上海|杭州|北京|广东/.test(txt)) {
          throw new Error('前置：评价区域至少选一城，现场=' + txt);
        }
        return txt;
      };
      await ensureLand();
      await pickIndustry();
      const regionBefore = await ensureAtLeastOneRegion();
      const indBefore = ((await page.locator('.arco-select-view[aria-label="产业"]').first().innerText().catch(() => '')) || '')
        .replace(/\s+/g, ' ')
        .trim();
      const spins = page.locator('main [role=spinbutton]');
      await expect(spins).toHaveCount(3, { timeout: 8000 });
      await spins.nth(0).fill('50');
      await page.waitForTimeout(500);
      if (String(await spins.nth(0).inputValue()).trim() !== '50') {
        throw new Error('企业能力权重未改为 50');
      }
      globalThis.__func03511 = { indBefore, regionBefore };
      await page.getByRole('button', { name: '重置参数' }).click({ timeout: 10000 });
      await page.waitForTimeout(1000);
  - note: 1、三个权重回到 40、35、25
    assert: |-
      const spins = page.locator('main [role=spinbutton]');
      await expect(spins).toHaveCount(3, { timeout: 8000 });
      const vals = [];
      for (let i = 0; i < 3; i++) vals.push(Number(String(await spins.nth(i).inputValue()).trim()));
      const expectW = [40, 35, 25];
      if (vals.join('/') !== expectW.join('/')) {
        throw new Error('重置后权重应为 40/35/25，得 ' + vals.join('/'));
      }
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、已选产业仍在
    assert: |-
      if (!globalThis.__func03511?.indBefore) throw new Error('前置：产业快照缺失');
      const view = page.locator('.arco-select-view[aria-label="产业"]').first();
      await expect(view).toBeVisible({ timeout: 8000 });
      const now = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (/请选择产业/.test(now)) throw new Error('重置后产业被清空');
      if (!/集成电路/.test(now)) {
        throw new Error('重置后产业应仍为集成电路，现场=' + now);
      }
  - note: 3、已选区域仍在
    assert: |-
      if (!globalThis.__func03511?.regionBefore) throw new Error('前置：区域快照缺失');
      const view = page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|杭州|广东|北京|请选择区域/ }).first();
      await expect(view).toBeVisible({ timeout: 8000 });
      const now = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      const before = globalThis.__func03511.regionBefore;
      for (const token of ['深圳市', '上海市', '杭州市', '北京市', '广东省']) {
        if (before.includes(token) && !now.includes(token)) {
          throw new Error('重置后区域丢失「' + token + '」，before=' + before + ' now=' + now);
        }
      }
      if (!/深圳|上海|杭州|北京|广东/.test(now)) {
        throw new Error('重置后评价区域为空: ' + now);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03511=选产业「集成电路」+至少一评价区域→企业能力 spin 改 50→「重置参数」→权重回 40/35/25 且产业/区域保留（重写 01117 对象不清空半段）。
  catalog_path=entry-seed。B 档零 allow_skip。
