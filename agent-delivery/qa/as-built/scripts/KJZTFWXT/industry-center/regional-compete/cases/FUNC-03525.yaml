id: FUNC-03525
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03525
priority: P1
title: 条件无基础分时生成失败且不打开结果页
story: US-CHAIN-REG-03
entry_id: chain-regional-compete
tier: B
preconditions:
  - 评价模式为单产业
  - 产业为「人工智能与应用」
locators:
  start: button「开始分析」
  view_records: button「查看分析记录」
  back_retry: button「返回配置重试」
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 单产业×多区域、人工智能与应用、深圳+杭州→开始分析→失败过程页
expect:
  - note: 1、过程页出现「本次分析生成失败」（用例预期 1）
    assert: |-
      page.setDefaultTimeout(20000);
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const leafItem = () =>
        page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
      const expandChainGroup = async () => {
        if (await leafItem().first().isVisible().catch(() => false)) return;
        const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
        if (await sub.count()) {
          await sub.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const enterViaSidebar = async () => {
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (await bodyIs404()) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          if (await bodyIs404()) await recover404Shell();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳 ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const pickSelectOption = async (ariaLabel, re) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await expect(view).toBeVisible({ timeout: 10000 });
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: re }).first();
        if (!(await opt.count())) {
          throw new Error('ENV-CHAIN-REG-COMPETE-03525：选项不可用 ' + ariaLabel);
        }
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      const ensureRegions = async (names) => {
        const view = page
          .locator('main .arco-select-view-multiple')
          .filter({ hasText: /深圳|上海|杭州|广东|北京|请选择区域/ })
          .first();
        await expect(view).toBeVisible({ timeout: 10000 });
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        for (const name of names) {
          const opt = pop.locator('.arco-select-option').filter({ hasText: new RegExp('^\\s*' + name + '\\s*$') });
          if (await opt.count()) {
            const selected = await opt.first().evaluate((el) => (el.className || '').includes('selected'));
            if (!selected) await opt.first().click({ force: true });
            await page.waitForTimeout(300);
          }
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const isFailShell = async () => {
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /本次分析生成失败|分析失败|任务状态：failed/.test(body);
      };
      const waitFailPage = async () => {
        let last = '';
        for (let i = 0; i < 120; i++) {
          await page.waitForTimeout(i < 6 ? 600 : 1200);
          last = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (await isFailShell()) return last;
          if (/区域产业竞争力评价结果/.test(last) && !/生成中/.test(last) && !/本次分析生成失败/.test(last)) {
            throw new Error('ENV-CHAIN-REG-COMPETE-FAIL-03525：分析意外成功打开结果页，无法验无基础分失败');
          }
        }
        throw new Error('ENV-CHAIN-REG-COMPETE-NO-FAIL-PAGE-03525：超时未进入生成失败页，片段=' + last.slice(0, 280));
      };
      const ensureWorkzone = async () => {
        if (page.url().includes('/login')) {
          throw new Error('ENV-EDU-TTS-SVCZ-LOGIN-03525：会话未登录');
        }
        await dismissBasket();
        await recover404Shell();
        const onRegional = () =>
          /\/industry-center\/regional/.test(page.url()) && /workspace=competitiveness/.test(page.url());
        if (!onRegional() || (await bodyIs404())) {
          await enterViaSidebar();
        }
        if (await bodyIs404()) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!onRegional() || (await bodyIs404())) {
          await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域竞争力着陆失败 ' + page.url());
        }
        await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      };
      await ensureWorkzone();
      await page.getByText('单产业 × 多区域', { exact: true }).first().click().catch(() => {});
      await page.waitForTimeout(500);
      await pickSelectOption('产业', /^人工智能与应用$/);
      await ensureRegions(['深圳市', '杭州市']);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      if (await start.isDisabled()) {
        throw new Error('ENV-CHAIN-REG-COMPETE-NO-FAIL-TRIGGER-03525：无基础分组合仍无法点开始分析');
      }
      await start.click({ timeout: 15000 });
      const failBody = await waitFailPage();
      globalThis.__func03525 = { failBody: failBody.slice(0, 400) };
      await expect(page.getByText(/本次分析生成失败/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、可见「查看分析记录」和「返回配置重试」（用例预期 2）
    assert: |-
      if (!globalThis.__func03525) throw new Error('前置：未进入生成失败过程页');
      await expect(page.getByRole('button', { name: '查看分析记录' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '返回配置重试' }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、不自动打开结果页（用例预期 3）
    assert: |-
      if (!globalThis.__func03525) throw new Error('前置：未进入生成失败过程页');
      const url = page.url();
      if (/[?&]view=result/.test(url)) {
        throw new Error('失败场景不应自动打开结果页 URL=' + url);
      }
      const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/区域产业竞争力评价结果/.test(body) && !/本次分析生成失败/.test(body)) {
        throw new Error('失败场景不应展示成功结果页标题');
      }
      await expect(page.getByRole('heading', { name: '区域产业竞争力评价结果' })).toHaveCount(0);
      await expect(page.getByRole('button', { name: '查看分析结果' })).toHaveCount(0);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03525=无基础分失败：单产业×多区域、产业「人工智能与应用」、评价区域深圳市+杭州市→开始分析。
  预期=「本次分析生成失败」+「查看分析记录」「返回配置重试」可见且不自动 view=result/结果标题。
  意外成功→ENV-CHAIN-REG-COMPETE-FAIL-03525；超时→NO-FAIL-PAGE-03525；门控→NO-FAIL-TRIGGER-03525；404→ENV-EDU-TTS-SVCZ-404-001。
  catalog_path=entry-seed。B 档零 allow_skip。
