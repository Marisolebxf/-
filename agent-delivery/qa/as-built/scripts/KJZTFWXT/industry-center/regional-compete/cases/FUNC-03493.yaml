id: FUNC-03493
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03493
priority: P1
tier: B
title: 主流程-结果页排名明细表头与数据行
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 前置（同册03505/03488已完成记录）；1.打开排名明细
expect:
  - note: 1、表头为排名、区域、竞争力指数、企业能力、学术生态、配套生态力
    assert: |-
      const main = () => page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 15000 });
      await expect(main().getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(800);
      const rows = main().locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 20000 });
      const count = await rows.count();
      let opened = false;
      for (let i = 0; i < count; i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/已完成/.test(rowText)) continue;
        if (!/区域产业竞争力评价|竞争力/.test(rowText)) continue;
        const btn = row.getByRole('button', { name: '查看结果' }).first();
        if (await btn.isEnabled().catch(() => false)) {
          await btn.click({ timeout: 15000 });
          opened = true;
          break;
        }
      }
      if (!opened) {
        throw new Error('修订 分析记录无已完成竞争力任务可查看结果');
      }
      await expect(main().getByRole('heading', { name: '区域产业竞争力评价结果', level: 2 })).toBeVisible({
        timeout: 45000,
      });
      const rankHeading = main().getByRole('heading', { name: '排名明细', level: 3 });
      await rankHeading.scrollIntoViewIfNeeded();
      await expect(rankHeading).toBeVisible({ timeout: 15000 });
      if (await main().getByText('排名明细未返回', { exact: false }).isVisible().catch(() => false)) {
        throw new Error('ENV-GAP-CHAIN-REG-METRICS：排名明细未返回，无表头可验');
      }
      const rankSection = rankHeading.locator('xpath=ancestor::section[1]');
      const table = rankSection.locator('.arco-table').first();
      await expect(table).toBeVisible({ timeout: 15000 });
      for (const col of ['排名', '区域', '竞争力指数', '企业能力', '学术生态', '配套生态力']) {
        await expect(table.locator('.arco-table-th').filter({ hasText: col }).first()).toBeVisible({ timeout: 10000 });
      }
  - note: 2、至少有一行区域与指数
    assert: |-
      const main = () => page.locator('main').first();
      if (await main().getByText('排名明细未返回', { exact: false }).isVisible().catch(() => false)) {
        throw new Error('ENV-GAP-CHAIN-REG-METRICS：排名明细未返回，无表行可验');
      }
      const rankHeading = main().getByRole('heading', { name: '排名明细', level: 3 });
      const rankSection = rankHeading.locator('xpath=ancestor::section[1]');
      const rows = rankSection.locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 15000 });
      const count = await rows.count();
      if (count < 1) {
        throw new Error('ENV-GAP-CHAIN-REG-METRICS：排名明细无数据行');
      }
      let ok = false;
      for (let i = 0; i < count; i++) {
        const text = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/深圳市|上海市|杭州市|北京市|广东省/.test(text) && /\d+(\.\d+)?/.test(text)) {
          ok = true;
          break;
        }
      }
      if (!ok) {
        throw new Error('ENV-GAP-CHAIN-REG-METRICS：排名明细行未含区域与指数');
      }
on_fail: 截图 + 抄 X-Trace-Id
