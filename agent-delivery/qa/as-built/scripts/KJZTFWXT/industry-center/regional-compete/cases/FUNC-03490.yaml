id: FUNC-03490
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03490
priority: P0
tier: B
title: 成功结果页展示综合分、柱状排名与指数降序明细
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 前置（同册 03488/03505）打开成功结果；1.打开该结果页
    target: |-
      const main = () => page.locator('main').first();
      await page.getByRole('tab', { name: '分析记录' }).click({ timeout: 15000 });
      await expect(main().getByRole('heading', { name: '分析记录', level: 2 })).toBeVisible({ timeout: 20000 });
      await page.waitForTimeout(800);
      const rows = main().locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 20000 });
      const count = await rows.count();
      let opened = false;
      for (let i = 0; i < count; i++) {
        const row = rows.nth(i);
        const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/已完成/.test(rowText) || !/区域产业竞争力评价/.test(rowText)) continue;
        const btn = row.getByRole('button', { name: '查看结果' }).first();
        if (await btn.isEnabled().catch(() => false)) {
          await btn.click({ timeout: 10000 });
          opened = true;
          break;
        }
      }
      if (!opened) {
        throw new Error('修订 分析记录无已完成竞争力任务可查看结果');
      }
      await expect(main().getByRole('heading', { name: '区域产业竞争力评价结果', level: 2 })).toBeVisible({ timeout: 30000 });
expect:
  - note: 1、可见「区域竞争力综合分」
    assert: |-
      const main = () => page.locator('main').first();
      await expect(main().getByText('区域竞争力综合分', { exact: false }).first()).toBeVisible({ timeout: 20000 });
  - note: 2、可见「综合竞争力指数排名」柱状图
    assert: |-
      const main = () => page.locator('main').first();
      await expect(main().getByText('综合竞争力指数排名', { exact: false }).first()).toBeVisible({ timeout: 20000 });
      const chart = main().locator('canvas, .echarts-for-react, [class*="echarts"]').first();
      await expect(chart).toBeVisible({ timeout: 15000 });
  - note: 3、排名明细按竞争力指数从高到低
    assert: |-
      const main = () => page.locator('main').first();
      await expect(main().getByText('排名明细', { exact: false }).first()).toBeVisible({ timeout: 15000 });
      const table = main().locator('.arco-table').last();
      await expect(table).toBeVisible({ timeout: 15000 });
      const rows = table.locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 15000 });
      const count = await rows.count();
      if (count < 2) throw new Error('修订 排名明细不足两行，无法校验降序');
      const idxCol = 2;
      const values = [];
      for (let i = 0; i < count; i++) {
        const cell = rows.nth(i).locator('.arco-table-td').nth(idxCol);
        const raw = ((await cell.innerText().catch(() => '')) || '').trim();
        const num = parseFloat(raw.replace(/[^\d.-]/g, ''));
        if (!Number.isFinite(num)) throw new Error(`修订 竞争力指数不可解析: ${raw}`);
        values.push(num);
      }
      for (let i = 1; i < values.length; i++) {
        if (values[i] > values[i - 1]) {
          throw new Error(`修订 排名明细未按指数降序: ${values.join(', ')}`);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
