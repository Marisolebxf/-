id: FUNC-03506
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03506
priority: P0
title: 分析记录已完成任务复制配置回到分析配置
entry_id: chain-regional-compete
tier: B
preconditions:
  - 分析记录中有已完成任务
locators:
  tab_records: tab「分析记录」
  copy_config: button「复制配置」
  config_heading: h2「分析配置」
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 分析记录已完成行点「复制配置」；toast/配置回显在 expect
expect:
  - note: 1、提示「已复制分析配置，可调整后重新分析」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const REGION_NAMES = ['广东省', '深圳市', '北京市', '上海市', '杭州市'];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (!/\/industry-center\/search/.test(page.url())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) await recover404Shell();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
        await page.waitForTimeout(800);
      };
      const ensureRecordsTab = async () => {
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        const onRecords =
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=competitiveness/.test(page.url()) &&
          /tab=records/.test(page.url());
        if (!onRecords || (await bodyIs404())) {
          await enterViaSidebar();
          if (await bodyIs404()) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价侧栏仍 SPA404 ' + page.url());
          }
          await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 10000 });
          await page.waitForTimeout(1500);
          await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
        }
      };
      const parseObjectFromResultBody = (body) => {
        const lineMatch = body.match(/对象[：:]\s*(.+?)\s*·\s*任务\s+(CHAIN-\d{8}-\d{3})/);
        if (!lineMatch) return null;
        const objectSummary = (lineMatch[1] || '').trim();
        const taskId = lineMatch[2];
        const regions = REGION_NAMES.filter((r) => objectSummary.includes(r));
        return { objectSummary, taskId, regions };
      };
      const isSuccessResult = async () => {
        const t = await page.locator('main').first().innerText().catch(() => '');
        return /区域产业竞争力评价结果/.test(t) || (await page.getByText('区域产业竞争力评价结果').first().isVisible().catch(() => false));
      };
      const assertEnvReachable = async (where) => {
        if (!(await bodyIs404())) return;
        await recover404Shell();
        await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(1200);
        if (!(await bodyIs404())) return;
        await enterViaSidebar();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价不可达 @' + where + ' ' + page.url());
        }
      };
      await dismissBasket();
      await assertEnvReachable('start');
      await ensureRecordsTab();
      const rows = page.locator('.arco-table-tbody .arco-table-tr, table tbody tr').filter({ hasText: '区域产业竞争力评价' });
      const n = await rows.count();
      let snap = null;
      let targetRow = null;
      for (let i = 0; i < Math.min(n, 12); i++) {
        const row = rows.nth(i);
        const txt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (!/已完成/.test(txt)) continue;
        const view = row.getByRole('button', { name: '查看结果' }).first();
        if (!(await view.count()) || (await view.isDisabled().catch(() => true))) continue;
        await view.click({ timeout: 12000, force: true });
        for (let j = 0; j < 24; j++) {
          await page.waitForTimeout(500);
          if (await isSuccessResult()) break;
        }
        if (!(await isSuccessResult())) continue;
        const body = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        snap = parseObjectFromResultBody(body);
        if (snap) {
          targetRow = row;
          break;
        }
      }
      if (!snap || !targetRow) {
        throw new Error('ENV-CHAIN-REGIONAL-COMPETE-NO-DONE-TASK: 分析记录无可用已完成任务或结果无对象行');
      }
      await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
      let rowAgain = page
        .locator('.arco-table-tbody .arco-table-tr, table tbody tr')
        .filter({ hasText: snap.taskId })
        .first();
      if (!(await rowAgain.count())) {
        rowAgain = rows.filter({ hasText: '已完成' }).first();
      }
      const copyBtn = rowAgain.getByRole('button', { name: '复制配置' }).first();
      if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) {
        throw new Error('ENV-CHAIN-REGIONAL-COMPETE-NO-COPY-03506：已完成行「复制配置」不可用');
      }
      await copyBtn.click({ timeout: 15000, force: true });
      await page.waitForTimeout(800);
      let toastOk = false;
      const toastLoc = page.locator('.arco-message:visible, .arco-message-wrapper:visible').filter({ hasText: /已复制分析配置/ });
      if (await toastLoc.first().isVisible({ timeout: 8000 }).catch(() => false)) {
        toastOk = true;
      } else if (await page.getByText(/已复制分析配置，可调整后重新分析/).first().isVisible({ timeout: 4000 }).catch(() => false)) {
        toastOk = true;
      }
      if (!toastOk) {
        throw new Error('复制配置后未见 toast「已复制分析配置，可调整后重新分析」，url=' + page.url());
      }
      globalThis.__func03506 = { ...snap, toastOk: true };
  - note: 2、回到分析配置；3、产业和评价区域与该任务一致
    assert: |-
      if (!globalThis.__func03506?.toastOk) throw new Error('前置：复制配置 toast 未通过');
      const ctx = globalThis.__func03506;
      const url = page.url();
      if (/[?&]view=processing/.test(url)) {
        throw new Error('复制后不应进入生成中 URL：' + url);
      }
      const mainTxt = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (/区域产业竞争力评价生成中/.test(mainTxt)) {
        throw new Error('复制后不应停在生成中态');
      }
      await expect(page.getByRole('tab', { name: '区域产业竞争力评价' }).first()).toHaveAttribute('aria-selected', 'true');
      await expect(page.getByRole('heading', { name: '分析配置', level: 2 })).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 10000 });
      const industryView = page.locator('.arco-select-view[aria-label="产业"]').first();
      await expect(industryView).toBeVisible({ timeout: 8000 });
      const industryTxt = ((await industryView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!industryTxt || /请选择产业|未选产业/.test(industryTxt)) {
        throw new Error('产业未按任务回显：「' + industryTxt + '」');
      }
      const summary = ctx.objectSummary || '';
      const industryToken = summary.split(/[·•、,，]/)[0]?.trim() || '';
      if (industryToken && industryToken.length >= 2) {
        const hit =
          industryTxt.includes(industryToken) ||
          summary.includes(industryTxt) ||
          industryTxt.includes(industryToken.slice(0, Math.min(4, industryToken.length)));
        if (!hit) {
          throw new Error('产业回显与任务对象行不一致：配置「' + industryTxt + '」对象「' + summary + '」');
        }
      }
      const regionMulti = page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|北京|杭州|广东|请选择区域/ }).first();
      await expect(regionMulti).toBeVisible({ timeout: 8000 });
      const regionTxt = ((await regionMulti.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const regions = (ctx.regions && ctx.regions.length ? ctx.regions : ['深圳市']).slice(0, 5);
      for (const name of regions) {
        if (!regionTxt.includes(name) && !regionTxt.includes(name.replace('市', '')) && !summary.includes(name)) {
          throw new Error('评价区域未按任务回显，缺少「' + name + '」：配置「' + regionTxt + '」对象「' + summary + '」');
        }
      }
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=entry-seed /industry-center/regional?workspace=competitiveness&tab=competitiveness；goto sibling search 再侧栏进入（edu 深链常 SPA404）。
  步骤=分析记录已完成行先「查看结果」快照对象行→同 task「复制配置」→ toast「已复制分析配置，可调整后重新分析」+ tab=competitiveness 分析配置 + 产业/评价区域与对象行一致。
  无已完成或复制 disabled→ENV-CHAIN-REGIONAL-COMPETE-NO-DONE-TASK / NO-COPY-03506。edu SPA404→ENV-EDU-TTS-SVCZ-404-001。用例备注：toast 含「重新分析」字样但页上无同名按钮。B 档零 allow_skip。
