id: FUNC-03506
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03506
priority: P1
tier: B
title: 从已完成记录复制配置后回到分析配置并带出原条件
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: wait
    for: 评价模式文案可见
    timeout_ms: 4500
  - action: click
    target: 分析记录
expect:
  - note: 1、提示「已复制分析配置，可调整后重新分析」
    assert: |-
      const closeB = page.locator('[aria-label="关闭对比篮"]');
      if (await closeB.count() && (await closeB.first().isVisible().catch(() => false))) {
        await closeB.first().click().catch(() => {});
        await page.waitForTimeout(400);
      }
      const ensureCompleted = async () => {
        await page.locator('[role=tab][data-tab-key=records]').click();
        await page.waitForTimeout(1200);
        let copyBtn = page
          .locator('main tr')
          .filter({ hasText: '已完成' })
          .getByRole('button', { name: '复制配置' })
          .filter({ hasNot: page.locator('.arco-btn-disabled') })
          .first();
        if ((await copyBtn.count()) && !(await copyBtn.isDisabled().catch(() => true))) return copyBtn;
        await page.locator('[role=tab][data-tab-key=competitiveness]').click();
        await page.waitForTimeout(800);
        const clusterView = page.locator('main .arco-cascader-view').first();
        await clusterView.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await page.locator('.arco-trigger-popup:visible').getByText('生物产业', { exact: true }).click();
        await page.waitForTimeout(400);
        await page.locator('.arco-trigger-popup:visible').getByText('生物', { exact: true }).click();
        await page.waitForTimeout(600);
        const regionField = page.locator('main .arco-form-item').filter({ hasText: '评价区域' }).locator('.arco-select-view').first();
        await regionField.click();
        await page.waitForTimeout(400);
        for (const city of ['深圳市', '上海市', '杭州市']) {
          await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: city }).first().click();
          await page.waitForTimeout(200);
        }
        await page.keyboard.press('Escape');
        await page.waitForTimeout(400);
        await page.getByRole('button', { name: '开始分析' }).click();
        await page.waitForTimeout(1500);
        const viewResult = page.getByRole('button', { name: '查看分析结果' });
        if (await viewResult.isVisible().catch(() => false)) {
          await viewResult.click();
          await page.waitForTimeout(1500);
        }
        await page.locator('[role=tab][data-tab-key=records]').click();
        await page.waitForTimeout(1500);
        copyBtn = page
          .locator('main tr')
          .filter({ hasText: '已完成' })
          .getByRole('button', { name: '复制配置' })
          .filter({ hasNot: page.locator('.arco-btn-disabled') })
          .first();
        if (!(await copyBtn.count()) || (await copyBtn.isDisabled().catch(() => true))) {
          throw new Error('SKIP: 无已完成任务可复制（同册 03488 前置未造出）');
        }
        return copyBtn;
      };
      const copyBtn = await ensureCompleted();
      const srcRow = copyBtn.locator('xpath=ancestor::tr[1]');
      const rowText = ((await srcRow.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const regionOpts = ['广东省', '深圳市', '北京市', '上海市', '杭州市'];
      const rowRegions = regionOpts.filter((c) => rowText.includes(c));
      if (!rowRegions.length) throw new Error('已完成行未识别评价区域');
      await page.evaluate(
        ({ row, regions }) => {
          sessionStorage.setItem('func03506_row', row);
          sessionStorage.setItem('func03506_regions', JSON.stringify(regions));
        },
        { row: rowText, regions: rowRegions },
      );
      await copyBtn.click();
      await page.waitForTimeout(800);
      await expect(page.getByText('已复制分析配置，可调整后重新分析').first()).toBeVisible({ timeout: 12000 });
  - note: 2、回到分析配置
    assert: |-
      const cfgHeading = page.locator('main h2').filter({ hasText: '分析配置' });
      if (!(await cfgHeading.isVisible().catch(() => false))) {
        await page.locator('[role=tab][data-tab-key=competitiveness]').click();
        await page.waitForTimeout(800);
      }
      await expect(page.locator('main h2').filter({ hasText: '分析配置' })).toBeVisible({ timeout: 12000 });
      await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 });
  - note: 3、产业和评价区域与该任务一致
    assert: |-
      const rowText = await page.evaluate(() => sessionStorage.getItem('func03506_row') || '');
      const regions = JSON.parse((await page.evaluate(() => sessionStorage.getItem('func03506_regions'))) || '[]');
      if (!regions.length) throw new Error('未缓存复制行区域');
      const mainText = ((await page.locator('main.diagnosis-main').innerText()).trim() || '').replace(/\s+/g, ' ');
      const objectBlock = page.locator('main.diagnosis-main .policy-analysis-filter-row').first();
      const objectText = ((await objectBlock.innerText().catch(() => mainText)) || mainText).replace(/\s+/g, ' ');
      if (/生物/.test(rowText) && !/生物/.test(objectText)) throw new Error('产业未与任务行一致（生物）');
      if (/人工智能/.test(rowText) && !/人工智能/.test(objectText)) throw new Error('产业未与任务行一致');
      for (const city of regions) {
        if (!objectText.includes(city)) throw new Error('评价区域未回显「' + city + '」（与复制行不一致）');
      }
on_fail: 截图 + 抄 X-Trace-Id
