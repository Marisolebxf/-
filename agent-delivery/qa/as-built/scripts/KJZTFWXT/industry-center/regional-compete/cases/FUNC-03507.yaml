id: FUNC-03507
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03507
priority: P0
tier: B
title: 开始分析后过程页五段进度与离开恢复提示
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 配齐条件→开始分析/重新分析→过程页断言
expect:
  - note: 1、过程清单共 5 段，名称见附录A
    assert: |-
      const STAGES = [
        '任务提交与对象组合冻结',
        '校验三维一级权重合计',
        '计算企业能力/学术生态/配套生态力综合竞争力',
        '生成横向排名与短板识别',
        '结果可信性校验与版本边界标注',
      ];
      const main = () => page.locator('main').first();
      const pickSelectOption = async (ariaLabel, re) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = page.locator('main .arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await expect(view).toBeVisible({ timeout: 15000 });
        await view.click({ timeout: 8000 });
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: re }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const ensureRegions = async (names) => {
        const view = page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|杭州|广东|北京|请选择区域/ }).first();
        await expect(view).toBeVisible({ timeout: 15000 });
        await view.click({ timeout: 8000 });
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        for (const name of names) {
          const opt = pop.locator('.arco-select-option').filter({ hasText: new RegExp('^\\s*' + name + '\\s*$') });
          if (await opt.count()) {
            const selected = await opt.first().evaluate((el) => (el.className || '').includes('selected'));
            if (!selected) await opt.first().click({ force: true });
          }
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const leaveHintRe = (body) =>
        /可离开.*分析记录/.test(body) ||
        /离开当前页面.*分析记录/.test(body) ||
        /稍后可从分析记录恢复/.test(body) ||
        /分析过程中可离开当前页面/.test(body);
      await page.getByText('三大一级维度权重').first().waitFor({ state: 'visible', timeout: 20000 });
      await page.getByText('单产业 × 多区域', { exact: true }).first().click().catch(() => {});
      await page.waitForTimeout(500);
      await pickSelectOption('集群', /^生物产业$/);
      await pickSelectOption('产业', /^生物$/);
      await ensureRegions(['广东省', '深圳市', '北京市', '上海市', '杭州市']);
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
      const start = page.getByRole('button', { name: '开始分析' }).first();
      const rerun = page.getByRole('button', { name: '重新分析' }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      const launch = async () => {
        if (await rerun.isVisible().catch(() => false)) {
          await rerun.click({ timeout: 15000 });
        } else {
          await start.click({ timeout: 15000 });
        }
      };
      globalThis.__func03507 = { stagesOk: false, leaveHint: false, sawCancel: false };
      await launch();
      let body = '';
      for (let i = 0; i < 100; i++) {
        body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/今日已分析过相同条件/.test(body)) {
          await launch();
          continue;
        }
        const cancelVis = await page.getByRole('button', { name: '取消任务' }).first().isVisible().catch(() => false);
        if (cancelVis) globalThis.__func03507.sawCancel = true;
        if (leaveHintRe(body)) globalThis.__func03507.leaveHint = true;
        const stagesOk = STAGES.every((s) => body.includes(s));
        if (stagesOk) globalThis.__func03507.stagesOk = true;
        if (globalThis.__func03507.stagesOk && globalThis.__func03507.leaveHint && globalThis.__func03507.sawCancel) break;
        if (globalThis.__func03507.stagesOk && i >= 12 && !globalThis.__func03507.sawCancel && /分析结果已生成/.test(body)) break;
        await page.waitForTimeout(50);
      }
      if (!globalThis.__func03507.stagesOk) {
        throw new Error('过程清单缺少阶段，片段: ' + body.slice(0, 240));
      }
  - note: 2、提示可离开页面，稍后从分析记录恢复
    assert: |-
      if (!globalThis.__func03507?.stagesOk) throw new Error('前置：五段未就绪');
      if (!globalThis.__func03507.leaveHint) {
        throw new Error('未见离开页面并从分析记录恢复的提示（跑态窗口过短或未展示）');
      }
  - note: 3、可见「取消任务」和「查看分析记录」
    assert: |-
      if (!globalThis.__func03507?.leaveHint) throw new Error('前置：离开提示未通过');
      const main = () => page.locator('main').first();
      const recordsBtn = main().getByRole('button', { name: '查看分析记录' });
      const recordsText = main().getByText('查看分析记录', { exact: true });
      if (await recordsBtn.count()) {
        await expect(recordsBtn.first()).toBeVisible({ timeout: 8000 });
      } else {
        await expect(recordsText.first()).toBeVisible({ timeout: 8000 });
      }
      if (!globalThis.__func03507.sawCancel) {
        throw new Error('未见「取消任务」（任务可能已结束，无法在跑态验收）');
      }
on_fail: 截图 + 抄 X-Trace-Id
