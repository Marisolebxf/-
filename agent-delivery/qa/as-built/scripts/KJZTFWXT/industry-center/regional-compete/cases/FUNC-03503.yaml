id: FUNC-03503
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03503
priority: P0
title: 三大一级维度权重表默认态（三行可用、40/35/25、合计校验通过）
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已选好一个产业
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 选产业后查看「三大一级维度权重」表（用例步骤 1）
expect:
  - note: 1、三行依次为企业能力、学术生态、配套生态力，数据状态均为「可用」
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      const pickSelectOption = async (view) => {
        await view.click({ timeout: 8000, force: true });
        await page.waitForTimeout(400);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        const opt = pop.locator('.arco-select-option:not(.arco-select-option-disabled)').first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ force: true, timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const clusterView = main.locator('.arco-select-view[aria-label="集群"]');
      if (await clusterView.count()) {
        const clusterText = ((await clusterView.first().innerText().catch(() => '')) || '').trim();
        if (!clusterText || /请选择/.test(clusterText)) {
          await pickSelectOption(clusterView.first());
        }
      }
      const industryView = main.locator('.arco-select-view[aria-label="产业"]');
      await expect(industryView.first()).toBeVisible({ timeout: 10000 });
      const industryText = ((await industryView.first().innerText().catch(() => '')) || '').trim();
      if (!industryText || /请选择|请先选择/.test(industryText)) {
        await pickSelectOption(industryView.first());
      }
      await page.keyboard.press('Escape').catch(() => {});
      const table = main.locator('[data-testid="regional-competitiveness-weight-table"] .arco-table');
      await expect(table).toBeVisible({ timeout: 10000 });
      const DIMS = ['企业能力', '学术生态', '配套生态力'];
      for (const dim of DIMS) {
        const row = table.locator('tr').filter({ hasText: dim }).first();
        await expect(row).toBeVisible({ timeout: 8000 });
        await expect(row.getByText('可用')).toBeVisible({ timeout: 8000 });
      }
      globalThis.__func03503 = { tableReady: true };
  - note: 2、默认权重为 40、35、25
    assert: |-
      if (!globalThis.__func03503?.tableReady) throw new Error('前置：维度表未就绪');
      const labels = ['企业能力', '学术生态', '配套生态力'];
      const expectW = ['40', '35', '25'];
      for (let i = 0; i < 3; i++) {
        const spin = page.locator(`main [aria-label="${labels[i]}权重"]`);
        await expect(spin).toBeVisible({ timeout: 8000 });
        await expect(spin).toHaveValue(expectW[i], { timeout: 8000 });
      }
  - note: 3、文案为「权重合计：100% · 校验通过」
    assert: |-
      await expect(page.locator('main .diagnosis-weight-footer.is-ok')).toContainText('权重合计：100% · 校验通过', {
        timeout: 8000,
      });
on_fail: 截图 + X-Trace-Id + C1~C6
