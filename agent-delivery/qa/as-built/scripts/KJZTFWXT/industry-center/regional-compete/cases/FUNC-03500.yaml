id: FUNC-03500
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03500
priority: P0
title: 集群下拉 15 项且默认新一代信息技术
entry_id: chain-regional-compete
tier: B
preconditions:
  - 处于分析配置（单产业 × 多区域默认态）
locators:
  cluster: '.arco-select-view[aria-label="集群"]'
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 展开集群下拉，核对默认与 15 项（用例步骤 1）
expect:
  - note: 1、选项共 15 个，名称见附录 A；2、默认值为「新一代信息技术」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const EXPECT = [
        '新一代信息技术',
        '生物产业',
        '新能源',
        '新材料',
        '高端装备',
        '智能网联新能源汽车',
        '绿色环保',
        '低空经济与空天',
        '传统与创意产业',
        '海洋产业',
        '未来制造（智能机器人）',
        '未来信息（光载信息、AI 底层生态）',
        '未来能源',
        '未来空间',
        '未来健康（合成生物、细胞基因、脑机工程）',
      ];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (await bodyIs404()) {
          const home = page.getByRole('button', { name: '返回首页' });
          if (await home.count() && (await home.first().isVisible().catch(() => false))) {
            await home.first().click({ timeout: 8000 });
            await page.waitForTimeout(2000);
          }
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳（search 404） ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const ensureLand = async () => {
        await dismissBasket();
        const onTarget = () =>
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=competitiveness/.test(page.url()) &&
          /tab=competitiveness/.test(page.url());
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!onTarget() || (await bodyIs404())) {
          try {
            await enterViaSidebar();
          } catch (e) {
            if (await bodyIs404()) {
              throw new Error('ENV-EDU-TTS-SVCZ-404-001: 侧栏进入失败 ' + (e.message || e));
            }
            throw e;
          }
        }
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 主区 SPA404 ' + page.url());
        }
      };
      await ensureLand();
      const cluster = page.locator('.arco-select-view[aria-label="集群"]').first();
      await expect(cluster).toBeVisible({ timeout: 15000 });
      if (!(await cluster.isVisible().catch(() => false))) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 分析配置无集群选择器 ' + page.url());
      }
      const defaultTxt = ((await cluster.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      const titleAttr = ((await cluster.getAttribute('title')) || '').trim();
      const defaultOk =
        /新一代信息技术/.test(defaultTxt) ||
        titleAttr === '新一代信息技术' ||
        /新一代信息技术/.test(titleAttr);
      if (!defaultOk) {
        throw new Error('集群默认值不是「新一代信息技术」，innerText=' + defaultTxt + ' title=' + titleAttr);
      }
      await cluster.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const pop = page.locator('.arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const opts = await pop.locator('.arco-select-option').evaluateAll((els) =>
        els.map((e) => (e.innerText || '').replace(/\s+/g, ' ').trim()).filter(Boolean)
      );
      if (opts.length !== 15) {
        throw new Error('集群选项个数应为 15，实际 ' + opts.length + '：' + opts.join(' | '));
      }
      for (let i = 0; i < EXPECT.length; i++) {
        if (opts[i] !== EXPECT[i]) {
          throw new Error('第 ' + (i + 1) + ' 项期望「' + EXPECT[i] + '」，实际「' + opts[i] + '」');
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03500=配置页集群 Select（aria-label=集群）默认「新一代信息技术」；展开 .arco-trigger-popup 内 .arco-select-option 共 15 项，顺序与用例附录 A 一致。
  catalog 深链 SPA404 时侧栏 search→产业链分析→区域产业竞争力评价（同 03501）。edu 双路均 404→ENV-EDU-TTS-SVCZ-404-001 blocked。
  登录与关评审由 runner 前置。B 档零 allow_skip。
