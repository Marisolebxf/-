id: FUNC-03504
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03504
priority: P0
title: 企业能力行查看打开指标说明抽屉
entry_id: chain-regional-compete
tier: B
preconditions:
  - 维度表已展示
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
expect:
  - note: 1、标题为「企业能力 · 指标说明」
    assert: |-
      await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      const table = page.locator('[data-testid="regional-competitiveness-weight-table"]');
      await expect(table).toBeVisible({ timeout: 10000 });
      const row = table.locator('tbody tr').filter({ hasText: '企业能力' }).first();
      await expect(row).toBeVisible({ timeout: 8000 });
      await row.getByRole('button', { name: '查看' }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const titleText = ((await drawer.locator('.arco-drawer-title, .arco-drawer-header').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/企业能力/.test(titleText) || !/指标说明/.test(titleText)) {
        throw new Error('抽屉标题应为「企业能力 · 指标说明」，得：' + titleText);
      }
      globalThis.__func03504 = { drawerOpened: true };
  - note: 2、可见指标来源、指标状态、权重状态、范围说明
    assert: |-
      if (!globalThis.__func03504?.drawerOpened) throw new Error('前置：未打开企业能力指标说明抽屉');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const t = await drawer.innerText();
      for (const label of ['指标来源', '指标状态', '权重状态', '范围说明']) {
        if (!t.includes(label)) throw new Error('抽屉缺「' + label + '」；片段: ' + t.slice(0, 400));
      }
  - note: 3、说明写明链主与骨干企业能力
    assert: |-
      if (!globalThis.__func03504?.drawerOpened) throw new Error('前置：未打开企业能力指标说明抽屉');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const t = await drawer.innerText();
      if (!/链主/.test(t) || !/骨干/.test(t) || !/企业能力/.test(t)) {
        throw new Error('抽屉「说明」应含链主与骨干企业能力；片段: ' + t.slice(0, 520));
      }
on_fail: 截图 + X-Trace-Id
