id: FUNC-03522
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03522
priority: P1
title: 合计偏离 100% 的提示文案与开始分析禁用
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已选产业，默认权重合计为 100%
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 把企业能力权重改为 50（用例步骤 1）
expect:
  - note: 1、文案为「权重合计须为 100%，当前 110%」
    assert: |-
      const main = page.locator('main');
      await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      const industryView = main.locator('.arco-select-view[aria-label="产业"]').first();
      await expect(industryView).toBeVisible({ timeout: 12000 });
      const shown = ((await industryView.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/半导体与集成电路|集成电路/.test(shown)) {
        await industryView.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        const opt = pop.locator('.arco-select-option').filter({ hasText: /半导体与集成电路|^集成电路$/ });
        await expect(opt.first()).toBeVisible({ timeout: 8000 });
        await opt.first().click({ force: true, timeout: 8000 });
        await page.waitForTimeout(600);
        await page.keyboard.press('Escape').catch(() => {});
      }
      const regionField = main.locator('.policy-analysis-filter-row__field').filter({ hasText: '评价区域' }).locator('.arco-select-view').first();
      if (await regionField.count()) {
        const regionShown = ((await regionField.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (!regionShown || regionShown.includes('请选择')) {
          await regionField.click({ timeout: 8000 });
          await page.locator('.arco-trigger-popup:visible').last().getByText('深圳市').first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      }
      await expect(page.getByText(/权重合计：100%\s*·\s*校验通过/).first()).toBeVisible({ timeout: 10000 });
      const entWeight = main.getByRole('spinbutton', { name: '企业能力权重' });
      await expect(entWeight).toBeVisible({ timeout: 8000 });
      await entWeight.click();
      await entWeight.fill('50');
      await page.waitForTimeout(800);
      await expect(page.getByText(/权重合计须为 100%，当前 110%/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、「开始分析」不可点
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
