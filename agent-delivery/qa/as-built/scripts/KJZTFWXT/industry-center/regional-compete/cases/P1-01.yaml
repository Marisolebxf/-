id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01117
priority: P1
title: 重置参数恢复配置初始空态且门控回禁用
entry_id: chain-regional-compete
preconditions:
- 已进入工作区
locators:
  reset: button「重置参数」
steps:
- action: goto
  target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
- action: click
  target: 配置脏态后重置参数
expect:
- note: 重置后评价模式、对象、区域、维度与权重恢复初始空态
  assert: |-
    await page.goto('/industry-center/regional?workspace=competitiveness&tab=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(3500); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.locator('.arco-select-view[aria-label="产业"]').click(); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '集成电路' }).first().click({ force: true }); await page.waitForTimeout(800); await page.getByRole('button', { name: '重置参数' }).click(); await page.waitForTimeout(1200); await expect(page.locator('input[placeholder="请选择产业"]')).toBeVisible({ timeout: 8000 }); await expect(page.getByText('单产业 × 多区域').first()).toBeVisible(); await expect(page.getByText('单产业模式请选择 1 个产业').first()).toBeVisible({ timeout: 8000 })
- note: 重置后「开始分析」恢复置灰禁用
  assert: |-
    await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 }); if (/view=processing/.test(page.url())) throw new Error('重置进入过程态')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 重置后区域常回深圳市；三维权重回 40/35/25（非「空权重」）。
tier: B
