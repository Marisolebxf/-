id: FUNC-03535
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03535
priority: P1
tier: B
title: 同条件分析进行中从配置再次开始打开当前任务不另建
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 生物三城首发进过程→Tab 回配置→同条件再点开始（逻辑在 expect-1）
expect:
  - note: 1、提示「该条件已有任务正在执行，已打开当前任务」
    assert: |-
      const main = () => page.locator('main').first();
      const HINT = '该条件已有任务正在执行，已打开当前任务';
      const TODAY_HINT = /今日已分析过相同条件，已打开结果/;
      const pickSelect = async (ariaLabel, textRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        const view = main().locator(`.arco-select-view[aria-label="${ariaLabel}"]`).first();
        await view.waitFor({ state: 'visible', timeout: 15000 });
        const raw = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (textRe.test(raw)) return;
        await view.click({ timeout: 10000 });
        await page.waitForTimeout(500);
        const popup = page.locator('.arco-trigger-popup:visible').last();
        await popup.locator('.arco-select-option').filter({ hasText: textRe }).first().click({ force: true, timeout: 10000 });
        await page.waitForTimeout(600);
        await page.keyboard.press('Escape').catch(() => {});
      };
      const pickRegions = async (names) => {
        const regionMulti = main().locator('.arco-select-view-multiple').first();
        await regionMulti.click({ timeout: 10000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        for (const name of names) {
          await pop.getByText(name, { exact: true }).first().click({ force: true, timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(350);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
      };
      const applyBioConfig = async () => {
        await main().getByText('单产业 × 多区域', { exact: true }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(400);
        await pickSelect('集群', /^生物产业$/);
        await page.waitForTimeout(800);
        await pickSelect('产业', /^生物$/);
        await pickRegions(['深圳市', '上海市', '杭州市']);
        await expect(main().getByText('单产业模式请选择 1 个产业')).toHaveCount(0);
      };
      if (!globalThis.__func03535Hooked) {
        globalThis.__func03535Hooked = true;
        globalThis.__func03535CreatePosts = 0;
        page.on('response', (r) => {
          if (r.request().method() === 'POST' && /\/analysis\/tasks(\?|$)/.test(r.url()) && !/\/analysis\/tasks\/list/.test(r.url()) && r.status() < 400) {
            globalThis.__func03535CreatePosts++;
          }
        });
      } else {
        globalThis.__func03535CreatePosts = 0;
      }
      await expect(main().getByText('三大一级维度权重').first()).toBeVisible({ timeout: 20000 });
      await applyBioConfig();
      const startBtn = () => main().getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(startBtn()).toBeEnabled({ timeout: 25000 });
      await startBtn().click({ timeout: 15000 });
      let taskFirst = '';
      for (let i = 0; i < 45; i++) {
        await page.waitForTimeout(500);
        const u = page.url();
        const toast = ((await page.locator('.arco-message, .arco-message-content').allInnerTexts().catch(() => [])) || []).join(' ');
        const body = await main().innerText().catch(() => '');
        if (TODAY_HINT.test(body + toast)) {
          throw new Error('ENV-CHAIN-REG-COMPETE-TODAY-DONE-03535：当天已成功，无法构造分析中前置');
        }
        const m = u.match(/task_id=(CHAIN-\d{8}-\d{3})/);
        if (m) taskFirst = m[1];
        if (/[?&]view=processing/.test(u) && taskFirst) break;
        if (/区域产业竞争力评价生成中|可视化分析过程/.test(body) && taskFirst) break;
        if (/[?&]view=result/.test(u) && taskFirst && i >= 5) {
          throw new Error('ENV-CHAIN-REG-COMPETE-PROC-FAST-03535：首发过快完成');
        }
      }
      if (!taskFirst) throw new Error('ENV-CHAIN-REG-COMPETE-PROC-FAST-03535：未见在跑 task_id');
      globalThis.__func03535 = { taskFirst, postsAfterFirst: globalThis.__func03535CreatePosts || 0 };
      await page.getByRole('tab', { name: '区域产业竞争力评价', exact: true }).first().click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      await expect(main().getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      await applyBioConfig();
      globalThis.__func03535.postsBeforeSecond = globalThis.__func03535CreatePosts || 0;
      await expect(startBtn()).toBeEnabled({ timeout: 25000 });
      await startBtn().click({ timeout: 15000 });
      globalThis.__func03535.postsAfterSecond = globalThis.__func03535CreatePosts || 0;
      let sawHint = false;
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        const toast = page.locator('.arco-message, .arco-message-content, .arco-notification').filter({ hasText: HINT });
        if (await toast.count()) {
          await expect(toast.first()).toBeVisible({ timeout: 3000 });
          sawHint = true;
          break;
        }
        const body = await main().innerText().catch(() => '');
        if (body.includes(HINT)) {
          sawHint = true;
          break;
        }
        const u = page.url();
        if (taskFirst && /[?&]view=processing/.test(u) && u.includes(taskFirst)) {
          sawHint = true;
          break;
        }
      }
      globalThis.__func03535.sawHint = sawHint;
      if (!sawHint) {
        await expect(page.getByText(HINT).first()).toBeVisible({ timeout: 8000 });
      }
  - note: 2、打开的仍是正在执行的那条任务
    assert: |-
      const ctx = globalThis.__func03535;
      if (!ctx?.taskFirst) throw new Error('前置未完成');
      const main = () => page.locator('main').first();
      const u = page.url();
      const tidNow =
        new URL(u).searchParams.get('task_id') ||
        ((await main().innerText().catch(() => '')).match(/CHAIN-\d{8}-\d{3}/) || [])[0] ||
        '';
      if (tidNow) await expect(tidNow).toBe(ctx.taskFirst);
      const body = await main().innerText().catch(() => '');
      const onTaskShell =
        /[?&]view=processing/.test(u) ||
        /[?&]view=result/.test(u) ||
        /区域产业竞争力评价生成中|区域产业竞争力评价结果|可视化分析过程/.test(body);
      if (!onTaskShell) throw new Error('未打开在跑/结果壳');
      if (!tidNow) await expect(main().getByText(ctx.taskFirst).first()).toBeVisible({ timeout: 8000 });
  - note: 3、不另建新任务
    assert: |-
      const ctx = globalThis.__func03535;
      if (!ctx?.taskFirst) throw new Error('前置未完成');
      const delta = (ctx.postsAfterSecond || 0) - (ctx.postsBeforeSecond || 0);
      await expect(delta).toBe(0);
      await expect(ctx.postsAfterFirst || 0).toBeGreaterThanOrEqual(1);
on_fail: 截图 + 抄 X-Trace-Id
