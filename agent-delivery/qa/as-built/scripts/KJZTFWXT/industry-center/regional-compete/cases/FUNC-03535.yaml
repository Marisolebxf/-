id: FUNC-03535
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03535
priority: P1
title: 同条件分析进行中从配置再次开始打开当前任务不另建
story: US-CHAIN-REG-03
entry_id: chain-regional-compete
tier: B
preconditions:
  - 集群「生物产业」、产业「生物」，区域深圳市+上海市+杭州市（assert 自含）
  - 该条件已有任务处于分析中（assert 自含首发进过程态后回到配置）
locators:
  cluster: '.arco-select-view[aria-label="集群"]'
  industry: '.arco-select-view[aria-label="产业"]'
  start: button「开始分析」
  config_tab: tab「区域产业竞争力评价」
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 生物三城首发进过程→回配置→同条件再点开始；三条预期在 expect
expect:
  - note: 1、提示「该条件已有任务正在执行，已打开当前任务」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const HINT = /该条件已有任务正在执行，已打开当前任务/;
      const TODAY_HINT = /今日已分析过相同条件，已打开结果/;
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const onConfigReady = async () => {
        if (await bodyIs404()) return false;
        if (/[?&]view=(processing|result|report)/.test(page.url())) return false;
        return await page.getByText('三大一级维度权重').first().isVisible().catch(() => false);
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await recover404Shell();
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (await bodyIs404()) await recover404Shell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳（search 404） ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const ensureLand = async () => {
        await dismissBasket();
        await recover404Shell();
        if (!(await onConfigReady())) {
          if (await bodyIs404() || !/\/industry-center\/search/.test(page.url())) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价侧栏与 catalog 深链均 SPA404 ' + page.url());
        }
        await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      };
      const pickSelect = async (ariaLabel, textRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator(`.arco-select-view[aria-label="${ariaLabel}"]`).first();
        await view.waitFor({ state: 'visible', timeout: 8000 });
        const raw = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (textRe.test(raw)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
          const popup = page.locator('.arco-trigger-popup:visible').last();
          const opt = popup.locator('.arco-select-option').filter({ hasText: textRe });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(800);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('下拉未见选项 ' + textRe + '（' + ariaLabel + '）');
      };
      const pickRegions = async (names) => {
        const regionMulti = page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|杭州|请选择区域|广东/ }).first();
        await regionMulti.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        for (const name of names) {
          const hit = pop.getByText(name, { exact: true }).first();
          if (await hit.count()) await hit.click({ force: true, timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(350);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(500);
      };
      const applyBioConfig = async () => {
        await page.getByText('单产业 × 多区域', { exact: true }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await pickSelect('集群', /^生物产业$/);
        await page.waitForTimeout(600);
        await pickSelect('产业', /^生物$/);
        await page.waitForTimeout(600);
        await pickRegions(['深圳市', '上海市', '杭州市']);
      };
      if (!globalThis.__func03535Hooked) {
        globalThis.__func03535Hooked = true;
        globalThis.__func03535CreatePosts = 0;
        page.on('response', (r) => {
          if (r.request().method() === 'POST' && /\/analysis\/tasks(\?|$)/.test(r.url()) && !/\/analysis\/tasks\/list/.test(r.url()) && r.status() < 400) {
            globalThis.__func03535CreatePosts++;
          }
        });
      } else {
        globalThis.__func03535CreatePosts = 0;
      }
      const pollProcessing = async (ms) => {
        for (let i = 0; i < Math.ceil(ms / 400); i++) {
          await page.waitForTimeout(400);
          const body = await main().innerText().catch(() => '');
          const toastText = ((await page.locator('.arco-message, .arco-notification').allInnerTexts().catch(() => [])) || []).join(' ');
          if (TODAY_HINT.test(body + toastText)) {
            throw new Error('ENV-CHAIN-REG-COMPETE-TODAY-DONE-03535：当天已成功，无法构造「分析中」前置');
          }
          const u = page.url();
          const m = u.match(/task_id=(CHAIN-\d{8}-\d{3})/);
          if (/[?&]view=processing/.test(u) && m) return { tid: m[1], mode: 'processing' };
          if (/可视化分析过程/.test(body) && /生成中/.test(body) && m) return { tid: m[1], mode: 'processing' };
          if (/[?&]view=result/.test(u) && m && i >= 3) {
            throw new Error('ENV-CHAIN-REG-COMPETE-PROC-FAST-03535：首发过快完成，无法在分析中回到配置复点');
          }
          if (/分析失败|INPUT_OBJECT_INVALID/.test(body) && i >= 4) {
            throw new Error('ENV-CHAIN-REG-COMPETE-BIO-FAIL-03535：生物组合无法进过程态');
          }
        }
        return null;
      };
      const backToConfig = async () => {
        const cfgTab = page.getByRole('tab', { name: '区域产业竞争力评价', exact: true }).first();
        if (await cfgTab.isVisible().catch(() => false)) {
          await cfgTab.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
        } else {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        await dismissBasket();
        await recover404Shell();
        if (!(await onConfigReady())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
          await enterViaSidebar();
        }
        await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      };
      await ensureLand();
      await applyBioConfig();
      const start1 = main().getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start1).toBeEnabled({ timeout: 25000 });
      const postsAfterFirstClick = globalThis.__func03535CreatePosts || 0;
      await start1.click({ timeout: 15000 });
      const snap = await pollProcessing(16000);
      if (!snap) throw new Error('ENV-CHAIN-REG-COMPETE-PROC-FAST-03535：未见在跑过程态 task_id');
      globalThis.__func03535 = {
        taskFirst: snap.tid,
        postsAfterFirst: globalThis.__func03535CreatePosts || 0,
      };
      await backToConfig();
      await applyBioConfig();
      const postsBeforeSecond = globalThis.__func03535CreatePosts || 0;
      const start2 = main().getByRole('button', { name: '开始分析', exact: true }).first();
      await expect(start2).toBeEnabled({ timeout: 25000 });
      await start2.click({ timeout: 15000 });
      let sawHint = false;
      let last = '';
      for (let i = 0; i < 28; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        last = await main().innerText().catch(() => '');
        const toastText = ((await page.locator('.arco-message, .arco-message-content, .arco-notification').allInnerTexts().catch(() => [])) || []).join(' ');
        if (TODAY_HINT.test(last + toastText)) {
          throw new Error('D3-CHAIN-REG-COMPETE-SINGLEFLIGHT-03535：二次开始触发当天复用而非在跑单飞提示');
        }
        if (HINT.test(last + toastText)) sawHint = true;
        if (await page.locator('.arco-message, .arco-message-content, .arco-notification').filter({ hasText: HINT }).count()) sawHint = true;
        const u2 = page.url();
        const tid0 = globalThis.__func03535?.taskFirst || '';
        if (!sawHint && tid0 && /[?&]view=processing/.test(u2) && u2.includes(tid0)) {
          sawHint = true;
          globalThis.__func03535.hintViaNavigation = true;
        }
        if (sawHint) break;
      }
      globalThis.__func03535.postsBeforeSecond = postsBeforeSecond;
      globalThis.__func03535.postsAfterSecond = globalThis.__func03535CreatePosts || 0;
      globalThis.__func03535.sawHint = sawHint;
      globalThis.__func03535.lastBody = last;
      if (!sawHint) {
        await expect(page.getByText('该条件已有任务正在执行，已打开当前任务').first()).toBeVisible({ timeout: 8000 });
      }
  - note: 2、打开的仍是正在执行的那条任务（同一 task_id，过程或结果壳）
    assert: |-
      const ctx = globalThis.__func03535;
      if (!ctx?.taskFirst) throw new Error('前置：未完成二次开始分析');
      const main = () => page.locator('main').first();
      const u = page.url();
      const tidNow =
        new URL(u).searchParams.get('task_id') ||
        ((await main().innerText().catch(() => '')).match(/CHAIN-\d{8}-\d{3}/) || [])[0] ||
        '';
      if (tidNow && ctx.taskFirst !== tidNow) {
        throw new Error('二次打开 task_id 不一致：' + ctx.taskFirst + ' vs ' + tidNow);
      }
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const onProcessOrResult =
        /[?&]view=processing/.test(u) ||
        /[?&]view=result/.test(u) ||
        /可视化分析过程|区域产业竞争力评价生成中|区域产业竞争力评价结果/.test(body);
      if (!onProcessOrResult) {
        throw new Error('二次开始后未打开在跑/结果壳：' + u + ' body=' + body.slice(0, 180));
      }
      if (!body.includes(ctx.taskFirst) && !tidNow) {
        throw new Error('页面未见原任务 ID ' + ctx.taskFirst);
      }
  - note: 3、不另建新任务（会话内成功 create POST 增量为 0）
    assert: |-
      const ctx = globalThis.__func03535;
      if (!ctx?.taskFirst) throw new Error('前置：未完成二次开始分析');
      const delta = (ctx.postsAfterSecond || 0) - (ctx.postsBeforeSecond || 0);
      if (delta > 0) {
        throw new Error('同条件二次开始成功 create POST 增量=' + delta + '（应不另建任务）');
      }
      if ((ctx.postsAfterFirst || 0) < 1) {
        throw new Error('首发未见成功 create POST（监听异常）');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  重写 01118 单飞配置复点半段（过程页无第二颗「开始分析」；本条在配置 Tab 再点）。
  catalog_path=entry-seed competitiveness。指纹=生物产业/生物/深沪杭（对齐 03488/03507）。
  步骤=首发进过程→Tab 回配置→保持同条件→再点开始→Message 在跑单飞+同一 CHAIN+POST 不增。
  当天已成功→ENV-CHAIN-REG-COMPETE-TODAY-DONE-03535；过快完成→ENV-CHAIN-REG-COMPETE-PROC-FAST-03535；
  生物失败→ENV-CHAIN-REG-COMPETE-BIO-FAIL-03535；edu SPA404→ENV-EDU-TTS-SVCZ-404-001。Q-ANALYSIS-01。B 档零 allow_skip。
