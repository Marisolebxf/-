id: FUNC-01109
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01109
priority: P1
tier: B
title: 「一键均分」将已计入维度权重平均分配且合计回到 100%
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
expect:
  - note: 1、点按后已计入维度权重平均分配
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      const weightTable = main.locator('[data-testid="regional-competitiveness-weight-table"]');
      await expect(weightTable).toBeVisible({ timeout: 8000 });
      const setWeight = async (label, val) => {
        const row = weightTable.getByRole('row').filter({ hasText: label }).first();
        const input = row.locator('input').first();
        await input.click({ timeout: 8000 });
        await input.fill(String(val));
        await input.press('Tab');
        await page.waitForTimeout(300);
      };
      await setWeight('企业能力', 50);
      await setWeight('学术生态', 30);
      await setWeight('配套生态力', 20);
      await main.getByRole('button', { name: '一键均分' }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const readW = async (label) => {
        const row = weightTable.getByRole('row').filter({ hasText: label }).first();
        return Number(await row.locator('input').first().inputValue());
      };
      const w1 = await readW('企业能力');
      const w2 = await readW('学术生态');
      const w3 = await readW('配套生态力');
      if (w1 + w2 + w3 !== 100) throw new Error(`合计应为100，实际 ${w1}+${w2}+${w3}`);
      if (w1 !== 33 || w2 !== 33 || w3 !== 34) throw new Error(`均分后应为33/33/34，实际 ${w1}/${w2}/${w3}`);
      globalThis.__func01109 = { pass1: true };
  - note: 2、汇总「权重合计」回到 100%
    assert: |-
      if (!globalThis.__func01109?.pass1) throw new Error('前置：首次均分未完成');
      const main = page.locator('main');
      await expect(main.getByText(/权重合计：100%.*校验通过/).first()).toBeVisible({ timeout: 8000 });
  - note: 3、重复点按仍回到均分态
    assert: |-
      const main = page.locator('main');
      const weightTable = main.locator('[data-testid="regional-competitiveness-weight-table"]');
      const setWeight = async (label, val) => {
        const row = weightTable.getByRole('row').filter({ hasText: label }).first();
        const input = row.locator('input').first();
        await input.click({ timeout: 8000 });
        await input.fill(String(val));
        await input.press('Tab');
        await page.waitForTimeout(300);
      };
      await setWeight('企业能力', 60);
      await setWeight('学术生态', 25);
      await setWeight('配套生态力', 15);
      await main.getByRole('button', { name: '一键均分' }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const readW = async (label) => {
        const row = weightTable.getByRole('row').filter({ hasText: label }).first();
        return Number(await row.locator('input').first().inputValue());
      };
      const w1 = await readW('企业能力');
      const w2 = await readW('学术生态');
      const w3 = await readW('配套生态力');
      if (w1 + w2 + w3 !== 100) throw new Error(`重复均分合计应为100，实际 ${w1}+${w2}+${w3}`);
      if (w1 !== 33 || w2 !== 33 || w3 !== 34) throw new Error(`重复均分后应为33/33/34，实际 ${w1}/${w2}/${w3}`);
      await expect(main.getByText(/权重合计：100%.*校验通过/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
