id: FUNC-01109
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01109
priority: P0
title: 「一键均分」将已计入维度权重平均分配且合计回到 100%
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已进入工作区；三大维度已各选至少 1 项
locators:
  spins: main [role=spinbutton]
  avg: button「一键均分」
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 手动设置不均权重后点击「一键均分」（用例步骤 1–2）
expect:
  - note: 1、点按后已计入维度权重平均分配
    assert: |-
      const EQUAL = ['33', '33', '34'];
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      if (/itic-sci\.com\/sso\/user\/login/.test(page.url())) {
        throw new Error('ENV-EDU-AUTH-SSO: runner 未落在 tts/svcz 业务域 ' + page.url());
      }
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (!/\/industry-center\/search/.test(page.url())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) await recover404Shell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 无可用侧栏壳（search 404） ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const ensureLand = async () => {
        const onTarget = () =>
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=competitiveness/.test(page.url()) &&
          /tab=competitiveness/.test(page.url());
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (!onTarget() || (await bodyIs404())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (await bodyIs404()) await recover404Shell();
        if (!onTarget() || (await bodyIs404())) {
          await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价侧栏与 catalog 深链均 SPA404 ' + page.url());
        }
        const weightHdr = page.getByText('三大一级维度权重').first();
        if (!(await weightHdr.isVisible().catch(() => false))) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 配置区不可见（非 competitiveness 工作区） ' + page.url());
        }
        await expect(weightHdr).toBeVisible({ timeout: 5000 });
      };
      const pickIndustry = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="产业"]').first();
        await expect(view).toBeVisible({ timeout: 12000 });
        const shown = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (/集成电路/.test(shown)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(500);
          const pop = page.locator('.arco-trigger-popup:visible').last();
          const opt = pop.locator('.arco-select-option').filter({ hasText: /^集成电路$/ });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(700);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('无法选择产业「集成电路」');
      };
      const readSpins = async () => {
        const spins = page.locator('main [role=spinbutton]');
        await expect(spins).toHaveCount(3, { timeout: 8000 });
        const vals = [];
        for (let i = 0; i < 3; i++) vals.push(String(await spins.nth(i).inputValue()).trim());
        return vals;
      };
      const assertEqualSplit = (vals) => {
        const sorted = [...vals].sort((a, b) => Number(a) - Number(b));
        const exp = [...EQUAL].sort((a, b) => Number(a) - Number(b));
        if (sorted.join(',') !== exp.join(',')) {
          throw new Error('均分后权重应为 33/33/34，得 ' + vals.join('/'));
        }
      };
      await ensureLand();
      await pickIndustry();
      const spins = page.locator('main [role=spinbutton]');
      await spins.nth(0).fill('20');
      await spins.nth(1).fill('30');
      await spins.nth(2).fill('40');
      await page.waitForTimeout(500);
      await page.getByRole('button', { name: '一键均分' }).click();
      await page.waitForTimeout(800);
      const after1 = await readSpins();
      assertEqualSplit(after1);
      globalThis.__func01109 = { after1 };
  - note: 2、汇总「权重合计」回到 100%
    assert: |-
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
      const vals = [];
      const spins = page.locator('main [role=spinbutton]');
      for (let i = 0; i < 3; i++) vals.push(Number(await spins.nth(i).inputValue()));
      const sum = vals.reduce((a, b) => a + b, 0);
      if (sum !== 100) throw new Error('权重合计应为 100%，得 ' + sum);
  - note: 3、重复点按仍回到均分态
    assert: |-
      const EQUAL = ['33', '33', '34'];
      const assertEqualSplit = (vals) => {
        const sorted = [...vals].sort((a, b) => Number(a) - Number(b));
        const exp = [...EQUAL].sort((a, b) => Number(a) - Number(b));
        if (sorted.join(',') !== exp.join(',')) {
          throw new Error('重复均分后权重应为 33/33/34，得 ' + vals.join('/'));
        }
      };
      const readSpins = async () => {
        const spins = page.locator('main [role=spinbutton]');
        const vals = [];
        for (let i = 0; i < 3; i++) vals.push(String(await spins.nth(i).inputValue()).trim());
        return vals;
      };
      const spins = page.locator('main [role=spinbutton]');
      await spins.nth(0).fill('10');
      await spins.nth(1).fill('20');
      await spins.nth(2).fill('25');
      await page.waitForTimeout(500);
      await page.getByRole('button', { name: '一键均分' }).click();
      await page.waitForTimeout(800);
      const after2 = await readSpins();
      assertEqualSplit(after2);
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  01109=选产业「集成电路」后手动填不均权重→「一键均分」→ spin 33/33/34、文案「权重合计：100%」；
  再次改乱后重复点击仍收敛均分态。catalog_path=entry-seed。B 档零 allow_skip。
