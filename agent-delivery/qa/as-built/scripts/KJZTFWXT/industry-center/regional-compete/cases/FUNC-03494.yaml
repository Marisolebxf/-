id: FUNC-03494
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03494
priority: P0
title: 点击排名行联动高亮并可清除高亮
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已打开含上海市的成功结果
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 前置（同册03489）打开含上海市的成功结果；步骤1点上海市行、步骤2点清除高亮在 expect
expect:
  - note: 前置：已打开含上海市的排名明细成功结果
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const TARGET = '上海市';
      const HINT = /今日已分析过相同条件，已打开结果/;
      const root = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const isSuccessResult = async () => {
        const title = page.getByText('区域产业竞争力评价结果').first();
        if (await title.isVisible().catch(() => false)) return true;
        if (!/[?&]view=result/.test(page.url())) return false;
        return await title.isVisible().catch(() => false);
      };
      const shanghaiRankRow = () =>
        root()
          .locator('.arco-table-tbody .arco-table-tr')
          .filter({ hasText: TARGET })
          .first();
      const bodyHasShanghaiRows = async () => {
        if (!(await isSuccessResult())) return false;
        await expect(root().getByText('排名明细').first()).toBeVisible({ timeout: 8000 });
        const body = ((await root().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/排名明细[\s\S]{0,48}未返回/.test(body)) return false;
        const row = shanghaiRankRow();
        return (await row.count()) > 0 && (await row.isVisible().catch(() => false));
      };
      const pickSelect = async (ariaLabel, textRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await view.waitFor({ state: 'visible', timeout: 8000 });
        const raw = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (textRe.test(raw)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
          const popup = page.locator('.arco-trigger-popup:visible').last();
          const opt = popup.locator('.arco-select-option').filter({ hasText: textRe });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(800);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('下拉未见选项 ' + textRe + '（' + ariaLabel + '）');
      };
      const pickRegions = async (names) => {
        const regionMulti = page
          .locator('main .policy-analysis-filter-row__field')
          .filter({ hasText: '评价区域' })
          .locator('.arco-select-view-multiple')
          .first();
        await regionMulti.waitFor({ state: 'visible', timeout: 8000 });
        for (const name of names) {
          let picked = false;
          for (let attempt = 0; attempt < 4; attempt++) {
            await page.keyboard.press('Escape').catch(() => {});
            await page.waitForTimeout(200);
            await regionMulti.click({ timeout: 8000 });
            await page.waitForTimeout(500);
            const pop = page.locator('.arco-select-dropdown:visible, .arco-trigger-popup:visible').last();
            const opt = pop.locator('.arco-select-option').filter({ hasText: new RegExp('^\\s*' + name + '\\s*$') });
            if (await opt.count()) {
              await opt.first().click({ force: true, timeout: 8000 });
              await page.waitForTimeout(450);
            }
            const tags = ((await regionMulti.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
            if (tags.includes(name)) {
              picked = true;
              break;
            }
          }
          if (!picked) throw new Error('评价区域未选中 ' + name);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
      };
      const apply03489Config = async () => {
        await page.getByText('单产业 × 多区域', { exact: true }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await pickSelect('集群', /^生物产业$/);
        await page.waitForTimeout(600);
        await pickSelect('产业', /^生物$/);
        await page.waitForTimeout(600);
        await pickRegions(['深圳市', '上海市', '杭州市']);
      };
      const openResultFromProcessing = async () => {
        const btn = page.getByRole('button', { name: /查看分析结果|查看结果/ });
        for (let i = 0; i < 30; i++) {
          if (await isSuccessResult()) return;
          if (await btn.count() && (await btn.first().isVisible().catch(() => false))) {
            await btn.first().click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(800);
          }
          await page.waitForTimeout(i < 6 ? 500 : 1500);
        }
      };
      const waitSuccessAfterStart = async () => {
        let last = '';
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 500 : 2000);
          last = await root().innerText().catch(() => '');
          if (await isSuccessResult()) return;
          if (/分析结果已生成|生成结束/.test(last)) {
            await openResultFromProcessing();
            if (await isSuccessResult()) return;
          }
          if (/分析失败|本次分析失败|INPUT_OBJECT_INVALID|对象无效/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CHAIN-REG-COMPETE-BIO-FAIL-001：生物产业组合无法到达成功结果');
          }
        }
        throw new Error('未在超时内到达成功结果：' + (last || '').slice(0, 220));
      };
      const ensureConfig = async () => {
        await dismissBasket();
        if (!/\/industry-center\/regional/.test(page.url()) || !/workspace=competitiveness/.test(page.url())) {
          await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
        }
        if (!(await root().getByText('三大一级维度权重').first().isVisible().catch(() => false))) {
          await page.getByRole('tab', { name: '区域产业竞争力评价', exact: true }).first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(1000);
        }
        await expect(root().getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
      };
      await dismissBasket();
      let ok = await bodyHasShanghaiRows();
      if (!ok) {
        await ensureConfig();
        await apply03489Config();
        const start = root().getByRole('button', { name: '开始分析', exact: true }).first();
        await expect(start).toBeEnabled({ timeout: 25000 });
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 20; i++) {
          await page.waitForTimeout(i === 0 ? 400 : 600);
          const last = await root().innerText().catch(() => '');
          if (HINT.test(last) && (await isSuccessResult()) && (await bodyHasShanghaiRows())) {
            ok = true;
            break;
          }
          if (await isSuccessResult() && (await bodyHasShanghaiRows())) {
            ok = true;
            break;
          }
        }
        if (!ok) {
          await waitSuccessAfterStart();
          ok = await bodyHasShanghaiRows();
        }
      }
      if (!ok) {
        throw new Error('ENV-GAP-CHAIN-REG-SHANGHAI: 成功结果排名明细无「上海市」行');
      }
      globalThis.__func03494Ready = true;
  - note: 1、出现「清除高亮（上海市）」，柱状图突出上海市
    assert: |-
      if (!globalThis.__func03494Ready) throw new Error('前置：含上海市的结果未就绪');
      const TARGET = '上海市';
      const root = page.locator('main').first();
      const shRow = root.locator('.arco-table-tbody .arco-table-tr').filter({ hasText: TARGET }).first();
      await expect(shRow).toBeVisible({ timeout: 8000 });
      await shRow.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const clearBtn = root.getByRole('button', { name: new RegExp('清除高亮（' + TARGET + '）') });
      await expect(clearBtn.first()).toBeVisible({ timeout: 8000 });
      await expect(root.getByText('综合竞争力指数排名').first()).toBeVisible({ timeout: 8000 });
      const barPanel = root.locator('[data-testid="regional-comp-bar"]').first();
      if (await barPanel.count()) {
        await expect(barPanel.locator('canvas').first()).toBeVisible({ timeout: 8000 });
      }
      const clickedRow = shRow;
      const cls = String((await clickedRow.getAttribute('class')) || '');
      if (!/diagnosis-rank-row--leader|arco-table-tr-checked/.test(cls)) {
        const body = ((await root.innerText().catch(() => '')) || '').slice(0, 400);
        if (!new RegExp('清除高亮（' + TARGET + '）').test(body)) {
          throw new Error('点击后未见行高亮态：' + cls);
        }
      }
      globalThis.__func03494ClearBtn = true;
  - note: 2、清除后不再显示清除高亮
    assert: |-
      if (!globalThis.__func03494ClearBtn) throw new Error('前置：未进入高亮态');
      const root = page.locator('main').first();
      const clearBtn = root.getByRole('button', { name: /清除高亮/ }).first();
      await clearBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(root.getByRole('button', { name: /清除高亮/ })).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
