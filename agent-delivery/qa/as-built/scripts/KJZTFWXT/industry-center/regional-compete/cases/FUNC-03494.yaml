id: FUNC-03494
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03494
priority: P0
title: 点击排名行联动高亮并可清除高亮
entry_id: chain-regional-compete
tier: B
preconditions:
  - 已打开含上海市的成功结果
locators:
  rank_table: 排名明细表格（含区域列）
  clear_highlight_btn: 清除高亮（上海市）
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 侧栏进入区域产业竞争力评价并打开含上海市的成功结果
expect:
  - note: 前置：已打开含上海市的排名明细成功结果（非 empty）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const TARGET = '上海市';
      const HINT = /今日已分析过相同条件，已打开结果/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const root = () => page.locator('main.diagnosis-main').first();
      const isSuccessResult = async () => {
        if (!/[?&]view=result/.test(page.url())) return false;
        return await page.getByText('区域产业竞争力评价结果').first().isVisible().catch(() => false);
      };
      const rankTable = () =>
        root()
          .locator('.arco-table')
          .filter({ has: root().locator('th').filter({ hasText: '竞争力指数' }) })
          .first();
      const bodyHasShanghaiRows = async () => {
        const tbl = rankTable();
        if (!(await tbl.count())) return false;
        const body = ((await root().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/排名明细[\s\S]{0,48}未返回/.test(body)) return false;
        const rows = tbl.locator('.arco-table-tbody .arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const txt = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, '');
          if (txt.includes(TARGET.replace(/\s+/g, ''))) return true;
        }
        return false;
      };
      const pickSelect = async (ariaLabel, textRe) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await view.waitFor({ state: 'visible', timeout: 8000 });
        const raw = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (textRe.test(raw)) return;
        for (let i = 0; i < 8; i++) {
          await view.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
          const popup = page.locator('.arco-trigger-popup:visible').last();
          const opt = popup.locator('.arco-select-option').filter({ hasText: textRe });
          if (await opt.count()) {
            await opt.first().click({ force: true, timeout: 8000 });
            await page.waitForTimeout(800);
            await page.keyboard.press('Escape').catch(() => {});
            return;
          }
          await page.waitForTimeout(400);
        }
        throw new Error('下拉未见选项 ' + textRe + '（' + ariaLabel + '）');
      };
      const pickRegions = async (names) => {
        const regionMulti = page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|杭州|请选择区域|广东/ }).first();
        await regionMulti.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        for (const name of names) {
          const hit = pop.getByText(name, { exact: true }).first();
          if (await hit.count()) await hit.click({ force: true, timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(350);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(500);
      };
      const applyMultiRegionConfig = async () => {
        await page.getByText('单产业 × 多区域', { exact: true }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await pickSelect('集群', /^生物产业$/);
        await page.waitForTimeout(600);
        await pickSelect('产业', /^生物$/);
        await page.waitForTimeout(600);
        await pickRegions(['深圳市', '上海市', '杭州市']);
      };
      const openResultFromProcessing = async () => {
        const btn = page.getByRole('button', { name: /查看分析结果|查看结果/ });
        for (let i = 0; i < 30; i++) {
          if (await isSuccessResult()) return;
          if (await btn.count() && (await btn.first().isVisible().catch(() => false))) {
            await btn.first().click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(800);
          }
          await page.waitForTimeout(i < 6 ? 500 : 1500);
        }
      };
      const waitSuccessAfterStart = async () => {
        let last = '';
        for (let i = 0; i < 90; i++) {
          await page.waitForTimeout(i < 4 ? 500 : 2000);
          last = await page.locator('main').first().innerText().catch(() => '');
          if (await isSuccessResult()) return;
          if (/分析结果已生成|生成结束/.test(last)) {
            await openResultFromProcessing();
            if (await isSuccessResult()) return;
          }
          if (/分析失败|本次分析失败|INPUT_OBJECT_INVALID|对象无效/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CHAIN-REG-COMPETE-BIO-FAIL-001：生物产业组合无法到达成功结果');
          }
        }
        if (/view=processing|可视化分析过程|生成中/.test(page.url() + last)) {
          throw new Error('ENV-CHAIN-REG-COMPETE-ASYNC-NO-SUCCESS-001：分析长期停留过程态');
        }
        throw new Error('未在超时内到达成功结果：' + (last || '').slice(0, 220));
      };
      const openFromRecords = async () => {
        await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rows = page.locator('tr').filter({ hasText: '区域产业竞争力评价' }).filter({ hasText: /已完成|成功/ });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 12); i++) {
          const view = rows.nth(i).getByRole('button', { name: '查看结果' }).first();
          if (!(await view.count()) || (await view.isDisabled().catch(() => true))) continue;
          await view.click({ timeout: 12000, force: true });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult() && (await bodyHasShanghaiRows())) return true;
          }
          await ensureLand();
          await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
        }
        return false;
      };
      const openResultDeep = async (taskId) => {
        await page.goto(
          toUrl('/industry-center/regional?view=result&task_id=' + taskId + '&tab=competitiveness&workspace=competitiveness'),
          { waitUntil: 'domcontentloaded', timeout: 60000 }
        );
        await page.waitForTimeout(3500);
        await dismissBasket();
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (!/\/industry-center\/search/.test(page.url())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) await recover404Shell();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
        await page.waitForTimeout(800);
      };
      const ensureLand = async () => {
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        const onConfig =
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=competitiveness/.test(page.url()) &&
          /tab=competitiveness/.test(page.url()) &&
          (await page.getByText('三大一级维度权重').first().isVisible().catch(() => false));
        if (!onConfig) {
          await enterViaSidebar();
        }
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域产业竞争力评价侧栏仍 SPA404 ' + page.url());
        }
        await expect(page.getByText('三大一级维度权重').first()).toBeVisible({ timeout: 15000 });
        await expect(page).toHaveURL(/tab=competitiveness/, { timeout: 8000 });
      };
      await ensureLand();
      let ok = false;
      if (await isSuccessResult()) ok = await bodyHasShanghaiRows();
      if (!ok) {
        for (const tid of ['CHAIN-20260911-010', 'CHAIN-20260907-001']) {
          await openResultDeep(tid);
          if (await isSuccessResult() && (await bodyHasShanghaiRows())) {
            ok = true;
            break;
          }
        }
      }
      if (!ok) {
        await ensureLand();
        ok = await openFromRecords();
      }
      if (!ok) {
        await applyMultiRegionConfig();
        const start = page.locator('main').getByRole('button', { name: '开始分析', exact: true }).first();
        await expect(start).toBeEnabled({ timeout: 25000 });
        await start.click({ timeout: 15000 });
        for (let i = 0; i < 16; i++) {
          await page.waitForTimeout(i === 0 ? 400 : 600);
          const last = await page.locator('main').innerText().catch(() => '');
          if (HINT.test(last) && (await isSuccessResult()) && (await bodyHasShanghaiRows())) {
            ok = true;
            break;
          }
          if (await isSuccessResult() && (await bodyHasShanghaiRows())) {
            ok = true;
            break;
          }
        }
        if (!ok) {
          await waitSuccessAfterStart();
          ok = await bodyHasShanghaiRows();
        }
      }
      if (!ok) {
        throw new Error(
          'ENV-GAP-CHAIN-REG-SHANGHAI: 已完成任务结果中排名明细无「上海市」行，无法满足前置'
        );
      }
      await expect(root().getByText('排名明细').first()).toBeVisible({ timeout: 8000 });
      globalThis.__func03494Ready = true;
  - note: 1、在排名明细点击上海市所在行后出现「清除高亮（上海市）」，柱状图突出上海市
    assert: |-
      if (!globalThis.__func03494Ready) throw new Error('前置：含上海市的结果未就绪');
      const TARGET = '上海市';
      const root = page.locator('main.diagnosis-main').first();
      const tbl = root
        .locator('.arco-table')
        .filter({ has: root.locator('th').filter({ hasText: '竞争力指数' }) })
        .first();
      const rows = tbl.locator('.arco-table-tbody .arco-table-tr');
      const n = await rows.count();
      let rowIdx = -1;
      for (let i = 0; i < n; i++) {
        const txt = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, '');
        if (txt.includes('上海市')) {
          rowIdx = i;
          break;
        }
      }
      if (rowIdx < 0) throw new Error('排名明细未找到上海市行');
      await rows.nth(rowIdx).click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const clearBtn = root.getByRole('button', { name: new RegExp('清除高亮（' + TARGET + '）') });
      await expect(clearBtn.first()).toBeVisible({ timeout: 8000 });
      await expect(root.locator('[data-testid="regional-comp-bar"] canvas').first()).toBeVisible({ timeout: 8000 });
      const barProbe = await page.evaluate(() => {
        const panel = document.querySelector('[data-testid="regional-comp-bar"]');
        if (!panel) return { ok: false, reason: 'no-bar-panel' };
        const ec = window.echarts;
        if (!ec || !ec.getInstanceByDom) return { ok: null, via: 'no-echarts-global' };
        for (const nd of panel.querySelectorAll('div')) {
          const inst = ec.getInstanceByDom(nd);
          if (!inst) continue;
          const opt = inst.getOption() || {};
          const xs = (opt.xAxis || [])[0]?.data || [];
          const si = xs.findIndex((x) => String(x).includes('上海'));
          if (si < 0) return { ok: false, reason: 'shanghai-not-on-xaxis', xs: xs.slice(0, 8) };
          const series = (opt.series || [])[0];
          const datum = series?.data?.[si];
          const color =
            (datum && typeof datum === 'object' && datum.itemStyle && datum.itemStyle.color) || '';
          return { ok: String(color) === '#165DFF', shColor: String(color), via: 'echarts' };
        }
        return { ok: null, via: 'no-instance' };
      });
      if (barProbe.ok === false) {
        throw new Error('柱状图未突出上海市：' + JSON.stringify(barProbe));
      }
      const clickedRow = rows.nth(rowIdx);
      const cls = String((await clickedRow.getAttribute('class')) || '');
      if (!/diagnosis-rank-row--leader/.test(cls)) {
        throw new Error('点击后上海市行未带 leader 高亮 class：' + cls);
      }
      globalThis.__func03494ClearBtn = true;
  - note: 2、点击「清除高亮」后不再显示清除高亮按钮
    assert: |-
      if (!globalThis.__func03494ClearBtn) throw new Error('前置：未进入高亮态');
      const TARGET = '上海市';
      const root = page.locator('main.diagnosis-main').first();
      const clearBtn = root.getByRole('button', { name: /清除高亮/ });
      await clearBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(root.getByRole('button', { name: new RegExp('清除高亮（' + TARGET + '）') })).toHaveCount(0);
      const anyClear = root.getByRole('button', { name: /清除高亮/ });
      if ((await anyClear.count()) > 0) {
        const vis = await anyClear.first().isVisible().catch(() => false);
        if (vis) throw new Error('清除高亮后仍可见清除高亮按钮');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  03494=结果页排名明细点「上海市」→「清除高亮（上海市）」+ 柱状图 selectedSubject 联动（echarts 可读验 #165DFF，否则 leader 行 class + 清除按钮）。
  前置打开=侧栏 sibling /industry-center/search→区域产业竞争力评价（edu 直链 catalog 易 SPA404）+ 生物/深沪杭或分析记录或 view=result 种子。
  无上海市行→ ENV-GAP-CHAIN-REG-SHANGHAI blocked。落点 URL 仍验 tab=competitiveness&workspace=competitiveness。
