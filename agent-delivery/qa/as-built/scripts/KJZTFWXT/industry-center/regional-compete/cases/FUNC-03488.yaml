id: FUNC-03488
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03488
priority: P0
title: 单产业多区域配齐后开始分析，结束后能打开成功结果页
entry_id: chain-regional-compete
tier: A
preconditions:
  - 评价模式为「单产业 × 多区域」
  - 权重保持默认且合计为 100%
  - 当天该条件尚未成功过
locators:
  cluster: .arco-select-view[aria-label=集群]
  industry: .arco-select-view[aria-label=产业]
  start: button「开始分析」
  view_result: button「查看分析结果」
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 生物产业/生物/深沪杭→开始分析→查看分析结果；四条预期分层在 expect
expect:
  - note: 1、过程页标题为「区域产业竞争力评价生成中」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const PROCESS_TITLE = '区域产业竞争力评价生成中';
      const RESULT_TITLE = '区域产业竞争力评价结果';
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const t = ((await page.locator('body').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        return /404|页面不存在/.test(t) && !/区域产业竞争力评价/.test(t);
      };
      const onConfig = () =>
        /\/industry-center\/regional/.test(page.url()) &&
        /workspace=competitiveness/.test(page.url()) &&
        /tab=competitiveness/.test(page.url()) &&
        !/[?&]view=processing/.test(page.url()) &&
        !/[?&]view=result/.test(page.url());
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
      };
      const pickSelectOption = async (ariaLabel, re) => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        const view = page.locator('.arco-select-view[aria-label="' + ariaLabel + '"]').first();
        await expect(view).toBeVisible({ timeout: 10000 });
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: re }).first();
        if (!(await opt.count())) {
          throw new Error('ENV-CHAIN-REG-COMPETE-03488：选项不可用 ' + ariaLabel + ' ' + String(re));
        }
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(700);
      };
      const regionMulti = () =>
        page.locator('main .arco-select-view-multiple').filter({ hasText: /深圳|上海|杭州|广东|北京|请选择区域/ }).first();
      const ensureRegions = async (names) => {
        const view = regionMulti();
        await expect(view).toBeVisible({ timeout: 10000 });
        await view.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        for (const name of names) {
          const opt = pop.locator('.arco-select-option').filter({ hasText: new RegExp('^\\s*' + name + '\\s*$') });
          if (await opt.count()) {
            const selected = await opt.first().evaluate((el) => (el.className || '').includes('selected'));
            if (!selected) await opt.first().click({ force: true });
            await page.waitForTimeout(300);
          }
        }
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(400);
        const txt = ((await view.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        for (const name of names) {
          if (!txt.includes(name)) throw new Error('评价区域未含「' + name + '」，现场=' + txt);
        }
      };
      const isResultPage = async () => {
        if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) return true;
        return new RegExp(RESULT_TITLE).test(await main().innerText().catch(() => ''));
      };
      await dismissBasket();
      await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
      await page.waitForTimeout(1000);
      if (await bodyIs404() || !onConfig()) {
        await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
        await page.waitForTimeout(800);
        if (!(await bodyIs404())) await enterViaSidebar();
      }
      if (await bodyIs404()) {
        throw new Error('ENV-EDU-TTS-SVCZ-404-001: 区域竞争力深链与侧栏均 SPA404 ' + page.url());
      }
      await page.getByText('单产业 × 多区域', { exact: true }).first().click().catch(() => {});
      await page.waitForTimeout(600);
      await pickSelectOption('集群', /^生物产业$/);
      await pickSelectOption('产业', /^生物$/);
      await ensureRegions(['深圳市', '上海市', '杭州市']);
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
      const start = page.getByRole('button', { name: '开始分析' }).first();
      if (await start.isDisabled()) {
        throw new Error('ENV-CHAIN-REG-COMPETE-03488：生物/三区域配齐后「开始分析」仍 disabled');
      }
      await start.click({ timeout: 15000 });
      let sawProcess = false;
      for (let i = 0; i < 16; i++) {
        await page.waitForTimeout(i < 3 ? 500 : 800);
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (new RegExp(PROCESS_TITLE).test(body) || (/生成中/.test(body) && /区域产业竞争力/.test(body))) {
          sawProcess = true;
          break;
        }
        if (/今日已分析过相同条件/.test(body) && await isResultPage()) {
          throw new Error('ENV-CHAIN-REG-COMPETE-TODAY-DONE-03488：前置要求当天尚未成功，现场直开已有结果');
        }
        if (/view=processing/.test(page.url()) && /可视化分析过程/.test(body)) {
          sawProcess = true;
          break;
        }
      }
      if (!sawProcess) {
        const snap = ((await main().innerText().catch(() => '')) || '').slice(0, 240);
        if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(snap)) {
          throw new Error('ENV-CHAIN-REG-COMPETE-BIO-03488：生物产业开始分析失败（env-gate 黑名单域）');
        }
        throw new Error('未见过程页标题「' + PROCESS_TITLE + '」，片段: ' + snap);
      }
      globalThis.__func03488 = { started: true };
      await expect(main().getByText(new RegExp(PROCESS_TITLE)).first()).toBeVisible({ timeout: 12000 });
  - note: 2、生成结束不自动打开结果页
    assert: |-
      if (!globalThis.__func03488?.started) throw new Error('前置：未进入过程页');
      const RESULT_TITLE = '区域产业竞争力评价结果';
      const main = () => page.locator('main').first();
      const isResultPage = async () => {
        if (await page.getByText(RESULT_TITLE).first().isVisible().catch(() => false)) return true;
        return new RegExp(RESULT_TITLE).test(await main().innerText().catch(() => ''));
      };
      const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
      let ready = false;
      for (let i = 0; i < 120; i++) {
        await page.waitForTimeout(i < 6 ? 800 : 1500);
        const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/分析失败|INPUT_OBJECT_INVALID|DIM_PACK_UNAVAILABLE/.test(body) && i >= 10 && !/分析结果已生成/.test(body)) {
          throw new Error('ENV-CHAIN-REG-COMPETE-ASYNC-FAIL-03488：任务失败');
        }
        if (await isResultPage()) {
          throw new Error('生成结束自动打开结果页，违反用例预期②');
        }
        if (await viewBtn.isVisible().catch(() => false) || /分析结果已生成/.test(body)) {
          ready = true;
          break;
        }
      }
      if (!ready) {
        throw new Error('超时未见「查看分析结果」或「分析结果已生成」');
      }
      if (await isResultPage()) {
        throw new Error('就绪态仍已在结果页标题');
      }
      await expect(viewBtn).toBeVisible({ timeout: 12000 });
      globalThis.__func03488.viewReady = true;
  - note: 3、结果页标题为「区域产业竞争力评价结果」
    assert: |-
      if (!globalThis.__func03488?.viewReady) throw new Error('前置：过程页未就绪');
      const RESULT_TITLE = '区域产业竞争力评价结果';
      const viewBtn = page.getByRole('button', { name: '查看分析结果' }).first();
      await viewBtn.click({ timeout: 15000 });
      await page.waitForTimeout(2000);
      await expect(page.getByText(RESULT_TITLE).first()).toBeVisible({ timeout: 20000 });
      globalThis.__func03488.onResult = true;
  - note: 4、对象行包含「生物」
    assert: |-
      if (!globalThis.__func03488?.onResult) throw new Error('前置：未打开结果页');
      const main = () => page.locator('main').first();
      const body = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/生物/.test(body)) throw new Error('结果页对象行/主区未见「生物」');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  金样 03488；用例=生物产业+产业「生物」+深圳市/上海市/杭州市→开始分析→查看分析结果。
  四条 expect 对齐过程标题、不自动跳结果、结果标题、对象含生物。生物失败→ENV-CHAIN-REG-COMPETE-BIO-03488；
  当天复用直开结果→ENV-CHAIN-REG-COMPETE-TODAY-DONE-03488。catalog_path=entry-seed。A 档零 allow_skip。
