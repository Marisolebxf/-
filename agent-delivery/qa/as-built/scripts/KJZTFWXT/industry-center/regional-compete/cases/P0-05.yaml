id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01110
priority: P0
title: 开始分析按钮随必填条件满足状态联动门控
entry_id: chain-regional-compete
preconditions:
  - 已进入工作区；配置为初始空态
  - 内部评审模式关闭
  - env-gate g2_start_enabled_legal_combo pass（重置后 disabled；选集成电路后 enabled）
locators:
  start: getByRole('button', { name: '开始分析' }).first()
  reset: getByRole('button', { name: '重置参数' })
  industry: '.arco-select-view[aria-label="产业"]'
  close_basket: '[aria-label="关闭对比篮"]'
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: wait
    for: 评价模式文案可见
    timeout_ms: 3500
  - action: evaluate
    note: 关对比篮→重置空态 disabled→选集成电路 enabled
expect:
  - note: 重置参数后「开始分析」置灰禁用
    assert: |-
      const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(()=>false)) await closeB.first().click().catch(()=>{}); await page.getByRole('button', { name: '重置参数' }).click().catch(()=>{}); await page.waitForTimeout(800); const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeDisabled({ timeout: 8000 })
  - note: 选产业「集成电路」后「开始分析」恢复可用
    assert: |-
      await page.keyboard.press('Escape').catch(()=>{}); await page.waitForTimeout(200); const industry = page.locator('.arco-select-view[aria-label="产业"]').first(); await industry.click({ timeout: 5000 }); await page.waitForTimeout(600); const hit = page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: /^集成电路$/ }); if (!(await hit.count())) throw new Error('产业下拉未见「集成电路」'); await hit.first().click({ force: true }); await page.waitForTimeout(1200); await page.keyboard.press('Escape').catch(()=>{}); const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeEnabled({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 蓝本 FUNC-01110；对齐 env-gate g2：重置后 disabled，选「集成电路」后 enabled（合法组合=单产业×多区域+新一代信息技术/集成电路+默认深圳市）。门控主因=未选产业；三维固定+默认 40/35/25=100%。定位风格同 P0-01（关对比篮、aria-label、.first()）。list 相对父键 2 空格缩进。A 档零 allow_skip。
tier: A
