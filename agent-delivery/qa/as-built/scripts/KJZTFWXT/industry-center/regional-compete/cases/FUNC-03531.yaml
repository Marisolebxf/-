id: FUNC-03531
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03531
priority: P1
title: 分析记录失败行删除点取消任务仍在
entry_id: chain-regional-compete
tier: B
preconditions:
  - 分析记录中有失败任务
locators:
  tab_records: tab「分析记录」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /industry-center/search
  - action: evaluate
    note: 分析记录→失败行「删除」→Modal「取消」；弹框文案与行仍在 expect
expect:
  - note: 1、弹出框说明删除后列表不再显示
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const catalogPath = '/industry-center/regional?workspace=competitiveness&tab=competitiveness';
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      const main = () => page.locator('main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const bodyIs404 = async () => {
        const sorry = page.getByText('抱歉，页面不存在');
        if (await sorry.count() && (await sorry.first().isVisible().catch(() => false))) return true;
        const homeBtn = page.getByRole('button', { name: '返回首页' });
        if (await homeBtn.count() && (await homeBtn.first().isVisible().catch(() => false))) return true;
        return false;
      };
      const recover404Shell = async () => {
        if (!(await bodyIs404())) return;
        const home = page.getByRole('button', { name: '返回首页' });
        if (await home.count() && (await home.first().isVisible().catch(() => false))) {
          await home.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
      };
      const enterViaSidebar = async () => {
        const leafItem = () =>
          page.locator('.arco-menu-item').filter({ hasText: /^区域产业竞争力评价$/ });
        const expandChainGroup = async () => {
          if (await leafItem().first().isVisible().catch(() => false)) return;
          const sub = page.locator('.arco-menu-inline-header, .arco-menu-submenu-title').filter({ hasText: '产业链分析' });
          if (await sub.count()) {
            await sub.first().click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
        };
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        if (!/\/industry-center\/search/.test(page.url())) {
          await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(800);
        }
        if (await bodyIs404()) await recover404Shell();
        if (await bodyIs404()) {
          throw new Error('ENV-EDU-TTS-SVCZ-404-001: /industry-center/search SPA404，无法侧栏进入区域产业竞争力评价 ' + page.url());
        }
        await expandChainGroup();
        await expect(leafItem().first()).toBeVisible({ timeout: 10000 });
        await leafItem().first().click({ timeout: 10000 });
        await page.waitForURL(/\/industry-center\/regional/, { timeout: 20000 });
        await page.waitForTimeout(800);
      };
      const ensureRecordsTab = async () => {
        await dismissBasket();
        if (await bodyIs404()) await recover404Shell();
        const onRecords =
          /\/industry-center\/regional/.test(page.url()) &&
          /workspace=competitiveness/.test(page.url()) &&
          /tab=records/.test(page.url());
        if (!onRecords || (await bodyIs404())) {
          if (!/\/industry-center\/regional/.test(page.url()) || (await bodyIs404())) {
            await page.goto(toUrl(catalogPath), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
          }
          if (await bodyIs404()) {
            await page.goto(toUrl('/industry-center/search'), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(800);
            if (!(await bodyIs404())) await enterViaSidebar();
          }
          if (await bodyIs404()) {
            throw new Error('ENV-EDU-TTS-SVCZ-404-001: 深链与 /industry-center/search 均 SPA404，无法验失败行删除取消 ' + page.url());
          }
          await page.getByRole('tab', { name: '分析记录' }).first().click({ timeout: 10000 });
          await page.waitForTimeout(1500);
          await expect(page).toHaveURL(/tab=records/, { timeout: 12000 });
        }
      };
      const scrollRecordActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const pickFailDeletable = async () => {
        await scrollRecordActions();
        const rows = main()
          .locator('.arco-table-tbody .arco-table-tr, tbody tr')
          .filter({ hasText: '区域产业竞争力评价' });
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 25); i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          if (!/失败/.test(rowText)) continue;
          let del = row.getByRole('button', { name: '删除', exact: true }).first();
          if (!(await del.count())) {
            del = row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).first();
          }
          if (!(await del.count()) || (await del.isDisabled().catch(() => true))) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollRecordActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          const tidM = rowText.match(TID_RE);
          const tid = tidM ? tidM[0] : rowText.slice(0, 80);
          return { del, tid };
        }
        return null;
      };
      await ensureRecordsTab();
      const recBody = ((await main().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/失败/.test(recBody)) {
        throw new Error('ENV-CHAIN-REGIONAL-COMPETE-NO-FAIL-TASK: 前置要求分析记录中有失败任务');
      }
      const picked = await pickFailDeletable();
      if (!picked) {
        throw new Error('ENV-CHAIN-REGIONAL-COMPETE-NO-FAIL-DELETE-03531：有失败态但操作列无可见可点「删除」');
      }
      globalThis.__func03531 = { tid: picked.tid };
      await picked.del.click({ timeout: 15000 });
      await page.waitForTimeout(450);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 10000 });
      const body = ((await modal.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/删除后列表不再显示/.test(body)) {
        throw new Error('删除弹框正文未说明「删除后列表不再显示」：' + body.slice(0, 240));
      }
      globalThis.__func03531.modal = modal;
  - note: 2、点「取消」后该失败任务仍在列表中
    assert: |-
      const ctx = globalThis.__func03531;
      if (!ctx?.modal) throw new Error('前置：删除弹框未打开');
      const expectedTid = ctx.tid;
      const modal = ctx.modal;
      const cancel = modal.getByRole('button', { name: '取消', exact: true });
      const okBtn = modal.getByRole('button', { name: '确定', exact: true });
      await expect(cancel).toBeVisible({ timeout: 5000 });
      await expect(okBtn).toBeVisible({ timeout: 5000 });
      await cancel.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const main = () => page.locator('main').first();
      const TID_RE = /CHAIN-\d{8}-\d{3}/;
      if (TID_RE.test(expectedTid)) {
        await expect(main().locator('tbody tr, .arco-table-tr').filter({ hasText: expectedTid }).first()).toBeVisible({ timeout: 8000 });
      } else {
        const rows = main().locator('.arco-table-tbody .arco-table-tr, tbody tr').filter({ hasText: '区域产业竞争力评价' });
        let stillFail = false;
        const n = await rows.count();
        for (let i = 0; i < Math.min(n, 25); i++) {
          const txt = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/失败/.test(txt)) { stillFail = true; break; }
        }
        if (!stillFail) throw new Error('取消后失败任务行不在列表');
      }
      const msgDeleted = page.locator('.arco-message-content').filter({ hasText: /已删除/ });
      if (await msgDeleted.count() && (await msgDeleted.first().isVisible().catch(() => false))) {
        throw new Error('取消后不应出现「已删除」提示');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  catalog_path=entry-seed；步骤=分析记录 Tab→失败行「删除」→Modal 正文含「删除后列表不再显示」→「取消」→CHAIN 仍在（非破坏性；确定删除见 FUNC-03532）。
  无失败行→ENV-CHAIN-REGIONAL-COMPETE-NO-FAIL-TASK；失败行无删→ENV-CHAIN-REGIONAL-COMPETE-NO-FAIL-DELETE-03531。edu SPA404→ENV-EDU-TTS-SVCZ-404-001。B 档零 allow_skip。
