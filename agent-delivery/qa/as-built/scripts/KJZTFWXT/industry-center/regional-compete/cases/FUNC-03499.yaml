id: FUNC-03499
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-03499
priority: P0
tier: B
title: 当天相同条件再次开始分析打开已有结果
entry_id: chain-regional-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /industry-center/regional?workspace=competitiveness&tab=competitiveness
  - action: evaluate
    note: 同册03488/03489选生物产业、生物、深沪杭，记录分析记录条数并点击开始分析
    script: |-
      const main = page.locator('main');
      await main.getByText('三大一级维度权重').waitFor({ state: 'visible', timeout: 30000 });
      const clusterBox = main.locator('.industry-cluster-select .arco-select').first();
      const industryBox = main.locator('.industry-cluster-select .arco-select').nth(1);
      const regionRow = main.locator('.policy-analysis-filter-row').filter({ hasText: '评价区域（1–5）' });
      const regionView = regionRow.locator('.arco-select-view').first();
      const tabs = page.getByRole('tablist', { name: '区域产业评价页签' });

      async function openSelectAndPick(selectLocator, label) {
        await selectLocator.locator('.arco-select-view').click();
        const dropdown = page.locator('.arco-select-dropdown').filter({ visible: true }).last();
        await dropdown.waitFor({ state: 'visible', timeout: 10000 });
        await dropdown.locator('.arco-select-option').filter({ hasText: label }).first().click();
      }

      async function pickRegions(cities) {
        const clear = regionRow.locator('.arco-select-clear-icon');
        if ((await clear.count()) > 0 && (await clear.first().isVisible())) {
          await clear.first().click();
        }
        for (const city of cities) {
          await regionView.click();
          const dropdown = page.locator('.arco-select-dropdown').filter({ visible: true }).last();
          await dropdown.waitFor({ state: 'visible', timeout: 10000 });
          await dropdown.locator('.arco-select-option').filter({ hasText: city }).first().click();
        }
        const text = ((await regionView.innerText()) || '').replace(/\s+/g, ' ');
        for (const city of cities) {
          if (!text.includes(city)) throw new Error(`评价区域未选中 ${city}：${text}`);
        }
      }

      await openSelectAndPick(clusterBox, '生物产业');
      await expect(clusterBox.locator('.arco-select-view')).toContainText('生物产业', { timeout: 10000 });
      await openSelectAndPick(industryBox, '生物');
      await expect(industryBox.locator('.arco-select-view')).toContainText('生物', { timeout: 10000 });
      await pickRegions(['深圳市', '上海市', '杭州市']);
      await expect(main.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 10000 });

      await tabs.getByRole('tab', { name: '分析记录' }).click();
      await main.getByRole('heading', { name: '分析记录' }).waitFor({ state: 'visible', timeout: 15000 });
      await page.waitForTimeout(1000);
      const countBefore = await main.locator('.arco-table-body tr.arco-table-tr').count();
      await page.evaluate((n) => sessionStorage.setItem('__func03499_count', String(n)), countBefore);

      await tabs.getByRole('tab', { name: '区域产业竞争力评价' }).click();
      await main.getByText('分析配置').waitFor({ state: 'visible', timeout: 15000 });
      await expect(clusterBox.locator('.arco-select-view')).toContainText('生物产业', { timeout: 10000 });
      await expect(industryBox.locator('.arco-select-view')).toContainText('生物', { timeout: 10000 });
      const regionText = ((await regionView.innerText()) || '').replace(/\s+/g, ' ');
      for (const city of ['深圳市', '上海市', '杭州市']) {
        if (!regionText.includes(city)) throw new Error(`切回配置页后评价区域丢失 ${city}：${regionText}`);
      }
      await main.getByRole('button', { name: '开始分析' }).click();
expect:
  - note: 1、提示「今日已分析过相同条件，已打开结果」
    assert: |-
      await expect(
        page.locator('.arco-message-content, .arco-message').filter({ hasText: '今日已分析过相同条件，已打开结果' }).first(),
      ).toBeVisible({ timeout: 20000 });
  - note: 2、打开的是已有结果页
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('区域产业竞争力评价结果')).toBeVisible({ timeout: 20000 });
      await expect(main.getByText(/对象：.*生物/)).toBeVisible({ timeout: 10000 });
  - note: 3、分析记录不新增任务
    assert: |-
      const countBefore = Number(await page.evaluate(() => sessionStorage.getItem('__func03499_count')));
      if (!Number.isFinite(countBefore)) throw new Error('前置：未记录分析记录条数');
      const main = page.locator('main');
      const tabs = page.getByRole('tablist', { name: '区域产业评价页签' });
      await tabs.getByRole('tab', { name: '分析记录' }).click();
      await main.getByRole('heading', { name: '分析记录' }).waitFor({ state: 'visible', timeout: 15000 });
      await page.waitForTimeout(1000);
      const countAfter = await main.locator('.arco-table-body tr.arco-table-tr').count();
      if (countAfter !== countBefore) {
        throw new Error(`分析记录条数变化 ${countBefore} -> ${countAfter}`);
      }
on_fail: 截图 + 抄 X-Trace-Id
