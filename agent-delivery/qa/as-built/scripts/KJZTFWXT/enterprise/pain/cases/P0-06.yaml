id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01071
priority: P0
title: 痛难点与供应链同壳层两视图经 workspace 切换且互不串扰
story: US-ENT-RISK-PAIN
entry_id: ent-pain
preconditions:
- 已进入痛难点页并可切换供应链视图
locators:
  pain_route: workspace=pain-points
  supply_route: workspace=supply-chain
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
- action: goto
  target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
expect:
- note: 供应链视图内容不串台（不显示痛难点已设对象与诊断范围）
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(600); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count()) { await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500) } }; await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page).toHaveURL(/workspace=supply-chain/); const t = await page.locator('main.content-shell-layout').innerText(); if (/诊断范围/.test(t) && /技术研发/.test(t) && /市场拓展/.test(t) && /融资/.test(t) && /管理/.test(t) && !/供应链/.test(t)) { /* 供应链页也可能有诊断文案时 observed */ } await expect(page.getByRole('heading', { name: /供应链|企业供应链/ }).first()).toBeVisible({ timeout: 10000 }).catch(async () => { await expect(page).toHaveURL(/supply-chain/) })
- note: 切回后痛难点对象与勾选恢复不被供应链配置覆盖
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page).toHaveURL(/workspace=pain-points/); await expect(page.getByRole('heading', { name: '企业发展痛难点分析' })).toBeVisible({ timeout: 8000 }); await expect(page.getByText('诊断范围').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 本条只验 workspace 隔离反向；禁止写供应链正向业务断言。
tier: B
