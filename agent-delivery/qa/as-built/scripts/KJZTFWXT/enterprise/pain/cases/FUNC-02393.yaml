id: FUNC-02393
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02393
priority: P0
tier: B
title: 开始分析后进入生成中页并展示五段过程
entry_id: ent-pain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points
  - action: evaluate
    note: 02388/02391 同册：picker 勾选确定回填；仅保留「融资」维度后点「开始分析」
expect:
  - note: 1、页面标题为「企业发展痛点分析生成中」
    assert: |-
      const route = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const pickerRoot = () =>
        page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const listEnterpriseNames = async (scope) => {
        const names = [];
        const sels = scope.locator('[aria-label^="选择 "]');
        for (let i = 0; i < (await sels.count()); i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const openPicker = async () => {
        const m = main();
        const emptyCta = m.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        const adjustBtn = m.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        if (await adjustBtn.isVisible().catch(() => false)) {
          await adjustBtn.click({ timeout: 8000 });
        } else if (await emptyCta.isVisible().catch(() => false)) {
          await emptyCta.click({ timeout: 8000 });
        } else {
          throw new Error('未找到打开「选择分析企业」入口');
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
      };
      const selectOneInPanel = async (panel) => {
        const basketTab = panel.getByRole('tab', { name: '篮内企业' }).or(panel.getByText('篮内企业', { exact: true }));
        if ((await basketTab.count()) && (await basketTab.first().isVisible().catch(() => false))) {
          await basketTab.first().click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
        if ((await listEnterpriseNames(panel)).length < 1) {
          throw new Error('ENV-PAIN-BASKET-EMPTY-001：picker 篮内无企业');
        }
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count()) {
          const firstSel = sels.first();
          if ((await firstSel.getAttribute('aria-checked')) !== 'true') {
            await firstSel.click({ timeout: 8000 });
          }
        } else {
          await panel.locator('.ent-compare-item-card').first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(400);
        const okBtn = panel.getByRole('button', { name: '确定', exact: true }).first();
        await okBtn.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await closeBasket();
      };
      const deeplinkFill = async () => {
        const code = '0a2b82208071ce5a0e3bd562b80e263b';
        await page.goto(toUrl(`${route}&enterprise_codes[]=${code}&source=compare-basket`), {
          waitUntil: 'domcontentloaded',
        });
        await page.waitForTimeout(1500);
        await closeBasket();
      };
      const setOnlyDimension = async (label) => {
        const dims = ['技术研发', '市场拓展', '融资', '管理'];
        for (const d of dims) {
          const box = page.locator('main .arco-checkbox').filter({ hasText: d }).first();
          if (!(await box.count())) continue;
          const cls = (await box.getAttribute('class')) || '';
          const checked = /arco-checkbox-checked/.test(cls);
          const want = d === label;
          if (checked !== want) await box.click({ timeout: 8000 });
          await page.waitForTimeout(200);
        }
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      try {
        await openPicker();
        const panel = pickerRoot();
        await expect(panel).toBeVisible({ timeout: 10000 });
        await selectOneInPanel(panel);
        await expect(page.getByText(/来自对比篮\s*[·•]\s*1\s*家/).first()).toBeVisible({ timeout: 15000 });
      } catch (e) {
        const msg = String(e.message || e);
        if (!/ENV-PAIN-BASKET-EMPTY|对比篮暂无企业|暂无对象/.test(msg)) throw e;
        await deeplinkFill();
        await expect(page.getByText(/来自对比篮\s*[·•]\s*1\s*家/).first()).toBeVisible({ timeout: 15000 });
      }
      await setOnlyDimension('融资');
      const start = page.getByRole('button', { name: '开始分析' });
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      await page.waitForTimeout(2500);
      let body = await main().innerText().catch(() => '');
      if (/对象与诊断摘要/.test(body) && /重新分析/.test(body) && !/生成中/.test(body)) {
        await page.getByRole('button', { name: '重新分析' }).click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        body = await main().innerText().catch(() => '');
      }
      if (/对象与诊断摘要/.test(body) && !/企业发展痛点分析生成中/.test(body)) {
        throw new Error('修订 已发起仍为空结果壳或当天直开结果页');
      }
      await expect(main().getByText('企业发展痛点分析生成中').first()).toBeVisible({ timeout: 15000 });
      globalThis.__func02393_body = await main().innerText().catch(() => '');
  - note: 2、页面展示任务编号、分析类型、进度与已用时间
    assert: |-
      const body = globalThis.__func02393_body || '';
      if (!body) throw new Error('前置：未捕获生成中主区快照');
      if (!/任务\s*ID/.test(body)) throw new Error('未见任务 ID');
      if (!/分析类型/.test(body) || !/企业发展痛点分析/.test(body)) throw new Error('未见分析类型取值');
      if (!/进度/.test(body) || !/%/.test(body)) throw new Error('未见进度');
      if (!/已用时间/.test(body) || !/秒/.test(body)) throw new Error('未见已用时间');
  - note: 3、五个阶段名称见附录A
    assert: |-
      const body = globalThis.__func02393_body || '';
      if (!body) throw new Error('前置：未捕获生成中主区快照');
      const stages = ['任务提交', '权限与配置校验', '数据汇聚', '算法计算', '结果组装'];
      for (const s of stages) {
        if (!body.includes(s)) throw new Error('未见阶段：' + s);
      }
on_fail: 截图 + 抄 X-Trace-Id
