id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01086
priority: P1
title: 当前分析与最近分析两 Tab 往返后对象与维度勾选保留
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
preconditions:
- 已带入对象并勾选诊断维度
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
- action: click
  target: 最近分析
- action: click
  target: 当前分析
expect:
- note: 切回后对象与诊断范围勾选保留不重置
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('ALLOW_SKIP: 无企业'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500) }; const codes = page.url(); await page.getByRole('button', { name: '最近分析' }).or(page.getByRole('tab', { name: '最近分析' })).first().click(); await page.waitForTimeout(1000); await page.getByRole('button', { name: '当前分析' }).or(page.getByRole('tab', { name: '当前分析' })).first().click(); await page.waitForTimeout(1000); await expect(page.getByText(/来自对比篮|诊断范围/).first()).toBeVisible({ timeout: 8000 }); for (const d of ['技术研发','市场拓展','融资','管理']) await expect(page.getByText(d, { exact: true }).first()).toBeVisible({ timeout: 8000 })
- note: Tab 往返不触发新任务、不离开风险洞察壳层
  assert: |-
    await expect(page).toHaveURL(/\/enterprise\/risk/); await expect(page).toHaveURL(/workspace=pain-points/); if (/view=processing/.test(page.url()) && !/view=history/.test(page.url())) { /* 不应因 Tab 往返新建 processing */ }
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业时记 Pass-N/A
tier: B
