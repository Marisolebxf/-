id: FUNC-02401
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02401
priority: P0
title: 创建报告后出现报告任务过程
story: US-ENT-RISK-PAIN
entry_id: ent-pain
tier: A
preconditions:
  - 已打开成功结果；报告区状态为「未创建」（assert 自含）
locators:
  create_report: button「创建报告」
  report_modal: 弹层「企业发展痛难点建议报告任务」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points
  - action: evaluate
    note: 成功结果且报告未创建→点「创建报告」；任务弹层与报告区「生成中」在 expect
expect:
  - note: 1、出现「企业发展痛难点建议报告任务」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const MODAL_TITLE = '企业发展痛难点建议报告任务';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const isSuccessResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return /对象与诊断摘要/.test(t) && /发展痛难点分析建议报告/.test(t);
      };
      const reportSection = () =>
        main().locator('section, [class*="SectionPanel"], div').filter({ hasText: '发展痛难点分析建议报告' }).first();
      const hasUncreatedReport = async () => {
        const sec = reportSection();
        if (!(await sec.count())) {
          const t = await main().innerText().catch(() => '');
          return /发展痛难点分析建议报告/.test(t) && /未创建/.test(t) && !/已生成/.test(t);
        }
        const t = await sec.innerText().catch(() => '');
        return /未创建/.test(t) && !/已生成/.test(t);
      };
      const historyRoute = painRoute + '&view=history';
      const pickerRoot = () =>
        page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
      const basketEntCount = async () => {
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        let m = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        if (m) return parseInt(m[1], 10);
        m = dockLabel.match(/共\s*(\d+)\s*项/);
        if (m) return parseInt(m[1], 10);
        return 0;
      };
      const seedBasketFromSearchPage = async (min) => {
        const searchInput = page
          .getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ })
          .or(page.getByPlaceholder(/企业名|产业|资质/))
          .first();
        if (await searchInput.isVisible().catch(() => false)) {
          await searchInput.fill('科技');
          const searchBtn = page.getByRole('button', { name: '搜索', exact: true }).first();
          if (await searchBtn.isVisible().catch(() => false)) {
            await searchBtn.click({ timeout: 8000 });
            await page.waitForTimeout(1500);
          }
        }
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        let n = await basketEntCount();
        for (let round = 0; round < 5 && n < min; round++) {
          const btnN = await addBtns.count();
          let clicked = 0;
          for (let i = 0; i < btnN && n < min; i++) {
            const btn = addBtns.nth(i);
            if (!(await btn.isVisible().catch(() => false))) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForTimeout(700);
            clicked++;
            n = await basketEntCount();
          }
          if (!clicked) break;
        }
        return (await basketEntCount()) >= min;
      };
      const ensureBasketEnterprises = async (min) => {
        if ((await basketEntCount()) >= min) return;
        await page.goto(toUrl('/enterprise/enterprise-search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        if (await seedBasketFromSearchPage(min)) return;
        throw new Error('ENV-PAIN-BASKET-EMPTY-001');
      };
      const joinOneViaAddModal = async (panel) => {
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
        const addBtn = (await workspace.count())
          ? workspace.getByRole('button', { name: '新增', exact: true })
          : panel.getByRole('button', { name: '新增', exact: true });
        await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
        await addBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const modalRoot = page
          .locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible')
          .filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) })
          .last();
        await expect(modalRoot).toBeVisible({ timeout: 15000 });
        await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
        const joinBtns = modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(joinBtns.first()).toBeVisible({ timeout: 30000 });
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
      };
      const ensureBasketInPicker = async (panel, min) => {
        const sels = panel.locator('[aria-label^="选择 "]');
        if ((await sels.count()) >= min) return;
        await joinOneViaAddModal(panel);
        if ((await sels.count()) < min) throw new Error('ENV-PAIN-BASKET-EMPTY-001');
      };
      const ensureOneDimChecked = async () => {
        const dims = ['技术研发', '市场拓展', '融资', '管理'];
        for (const d of dims) {
          const box = page.locator('main .arco-checkbox').filter({ hasText: d }).first();
          if (!(await box.count())) continue;
          const cls = (await box.getAttribute('class')) || '';
          if (/arco-checkbox-checked/.test(cls)) return;
        }
        const first = page.locator('main .arco-checkbox').filter({ hasText: dims[0] }).first();
        await expect(first).toBeVisible({ timeout: 8000 });
        await first.click({ timeout: 8000 });
        await page.waitForTimeout(300);
      };
      const ensureFilled = async () => {
        await dismissBasket();
        if (await main().getByText(/来自对比篮/).first().isVisible().catch(() => false)) {
          await ensureOneDimChecked();
          return;
        }
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(painRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        const m = main();
        const emptyCta = m.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        const adjustBtn = m.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        if (await adjustBtn.isVisible().catch(() => false)) {
          await adjustBtn.click({ timeout: 8000 });
        } else {
          await emptyCta.click({ timeout: 8000 });
        }
        await page.waitForTimeout(800);
        let panel = pickerRoot();
        if (!(await panel.count()) || !(await panel.isVisible().catch(() => false))) {
          const pickerQs =
            'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50';
          await page.goto(toUrl(`${painRoute}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
          panel = pickerRoot();
        }
        await expect(panel).toBeVisible({ timeout: 10000 });
        const basketTab = panel.getByRole('tab', { name: '篮内企业' }).or(panel.getByText('篮内企业', { exact: true }));
        if ((await basketTab.count()) && (await basketTab.first().isVisible().catch(() => false))) {
          await basketTab.first().click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
        await ensureBasketInPicker(panel, 1);
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count()) {
          const firstSel = sels.first();
          if ((await firstSel.getAttribute('aria-checked')) !== 'true') {
            await firstSel.scrollIntoViewIfNeeded().catch(() => {});
            await firstSel.click({ timeout: 8000 });
          }
        } else {
          const card = panel.locator('.ent-compare-item-card').first();
          await expect(card).toBeVisible({ timeout: 8000 });
          await card.click({ timeout: 8000 });
        }
        const okBtn = panel.getByRole('button', { name: '确定', exact: true }).first();
        await expect(okBtn).toBeEnabled({ timeout: 8000 });
        await okBtn.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await dismissBasket();
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
        await ensureOneDimChecked();
      };
      const waitSuccessFromStart = async (rounds = 90) => {
        let last = '';
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(i < 4 ? 500 : 2000);
          last = await main().innerText().catch(() => '');
          if (await isSuccessResult()) return;
          if (/分析失败|本次分析失败/.test(last) && !/企业发展痛点分析生成中/.test(last)) {
            throw new Error('ENV-PAIN-ANALYSIS-FAIL-001');
          }
        }
        if (/view=processing|企业发展痛点分析生成中/.test(page.url() + last)) {
          throw new Error('ENV-PAIN-ASYNC-NO-SUCCESS-001');
        }
        throw new Error('分析未在超时内到达成功结果：' + last.slice(0, 220));
      };
      const rowOpenControl = (row, label) =>
        row
          .getByRole('button', { name: label })
          .or(row.getByRole('link', { name: label }))
          .first();
      const openResultFromRow = async (row) => {
        for (const label of ['预览结果', '恢复结果']) {
          const btn = rowOpenControl(row, label);
          if (!(await btn.count())) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
          await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 20000 }).catch(() => {});
          await page.waitForTimeout(600);
          return label;
        }
        return '';
      };
      const openViaHistory = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await dismissBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const n = await main().locator(rowSel).count();
        if (!n) return false;
        for (let i = 0; i < n; i++) {
          if (i > 0) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);
            await dismissBasket();
          }
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          await openResultFromRow(row);
          if (await isSuccessResult() && (await hasUncreatedReport())) return true;
        }
        return false;
      };
      const startViaBasket = async () => {
        await page.goto(toUrl(painRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await ensureFilled();
        const start = main().getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 15000 });
        await waitSuccessFromStart();
      };
      const reachUncreatedResult = async () => {
        await page.goto(toUrl(painRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        if (await isSuccessResult() && (await hasUncreatedReport())) return;
        if (await openViaHistory()) return;
        await startViaBasket();
        if (!(await isSuccessResult())) throw new Error('ENV-PAIN-ASYNC-NO-SUCCESS-001');
        if (!(await hasUncreatedReport())) {
          throw new Error('ENV-PAIN-REPORT-NOT-UNCREATED-001：报告区非「未创建」');
        }
      };
      const reportModal = () =>
        page
          .locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal, main')
          .filter({ hasText: MODAL_TITLE })
          .last();
      await dismissBasket();
      await reachUncreatedResult();
      await expect(page.getByText('发展痛难点分析建议报告').first()).toBeVisible({ timeout: 10000 });
      const createBtn = main().getByRole('button', { name: '创建报告', exact: true });
      if (!(await createBtn.count())) {
        throw new Error('ENV-PAIN-NO-CREATE-REPORT-001：未见「创建报告」');
      }
      await expect(createBtn.first()).toBeVisible({ timeout: 8000 });
      await createBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const modal = reportModal();
      await expect(modal).toBeVisible({ timeout: 12000 });
      const modalText = await modal.innerText().catch(() => '');
      if (!modalText.includes(MODAL_TITLE)) {
        throw new Error('未见「' + MODAL_TITLE + '」');
      }
      globalThis.__func02401 = { modalText, clicked: true };
  - note: 2、阶段含已提交、数据准备、内容组装、图表生成、报告生成
    assert: |-
      const ctx = globalThis.__func02401;
      if (!ctx || !ctx.clicked) throw new Error('前置：未点击创建报告');
      const STAGES = ['已提交', '数据准备', '内容组装', '图表生成', '报告生成'];
      let text = ctx.modalText || '';
      if (!text || text.length < 20) {
        const modal = page
          .locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal, main')
          .filter({ hasText: '企业发展痛难点建议报告任务' })
          .last();
        text = await modal.innerText().catch(() => '');
      }
      for (const stage of STAGES) {
        if (!text.includes(stage)) throw new Error('报告任务阶段缺少：' + stage);
      }
  - note: 3、报告区状态变为「生成中」
    assert: |-
      const main = () => page.locator('main.content-shell-layout, main').first();
      const sec = main().locator('section, [class*="SectionPanel"], div').filter({ hasText: '发展痛难点分析建议报告' }).first();
      let t = '';
      if (await sec.count()) {
        t = await sec.innerText().catch(() => '');
      } else {
        t = await main().innerText().catch(() => '');
      }
      if (!/生成中/.test(t)) {
        await page.waitForTimeout(1500);
        t = await main().innerText().catch(() => '');
      }
      if (!/发展痛难点分析建议报告/.test(t) || !/生成中/.test(t)) {
        throw new Error('报告区未见「生成中」：' + t.slice(0, 280));
      }
      await expect(main().getByText('生成中').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz entry-seed catalog_path=/enterprise/risk；goto workspace=pain-points&tab=pain-points。前置=成功结果且报告「未创建」（最近分析已完成行预览/恢复，或对比篮发起）。步骤=「创建报告」。机检=「企业发展痛难点建议报告任务」+五阶段（已提交/数据准备/内容组装/图表生成/报告生成）+报告区「生成中」。篮空→ENV-PAIN-BASKET-EMPTY-001；仅已生成→ENV-PAIN-REPORT-NOT-UNCREATED-001。登录关评审 runner 前置。A 档零 allow_skip。
