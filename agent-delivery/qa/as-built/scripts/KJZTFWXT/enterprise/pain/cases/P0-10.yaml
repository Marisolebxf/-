id: P0-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01076
priority: P0
title: 诊断范围区含四维度复选项且可自由组合勾选
story: US-ENT-RISK-PAIN
entry_id: ent-pain
preconditions:
- 已带入至少 1 家企业
locators:
  dims: 技术研发 / 市场拓展 / 融资 / 管理
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
- action: evaluate
  note: 回填对象后勾选组合
expect:
- note: 诊断范围区含技术研发、市场拓展、融资、管理四个复选项
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('ALLOW_SKIP: 无企业'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500) }; await expect(page.getByText('诊断范围').first()).toBeVisible({ timeout: 8000 }); for (const d of ['技术研发','市场拓展','融资','管理']) await expect(page.getByText(d, { exact: true }).first()).toBeVisible({ timeout: 8000 })
- note: 各复选项可自由勾选与取消且互不排斥
  assert: |-
    const tech = page.locator('.arco-checkbox').filter({ hasText: '技术研发' }).first(); const fin = page.locator('.arco-checkbox').filter({ hasText: '融资' }).first(); await tech.click(); await page.waitForTimeout(200); await fin.click(); await page.waitForTimeout(200); await expect(page.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业时记 Pass-N/A
as_built_note: 实勘默认四维全勾。
tier: B
