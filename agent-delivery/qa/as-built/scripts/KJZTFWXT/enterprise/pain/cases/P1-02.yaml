id: P1-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01087
priority: P1
title: 痛难点允许 1 至 50 家对象全部进入同一任务且不截断
story: US-ENT-RISK-OBJECT
entry_id: ent-pain
preconditions:
- 对比篮已集合 ≥6 家企业
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
- action: evaluate
  note: 勾选 6 家确定回填
expect:
- note: 1–50 家对象全部进入同一任务
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(900); const sels = page.locator('[aria-label^="选择 "]'); const n = Math.min(await sels.count(), 6); if (n < 6) throw new Error('ALLOW_SKIP: 可选企业不足 6'); for (let i = 0; i < n; i++) { await sels.nth(i).click(); await page.waitForTimeout(120) }; await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2000); const codes = (page.url().match(/enterprise_codes/g) || []).length; const t = await page.locator('main.content-shell-layout').innerText(); if (!/来自对比篮 · 6 家|管理全部对象（6 家）/.test(t) && codes < 1) throw new Error('未完整带入 6 家: ' + t.slice(0, 200))
- note: 不静默截断对象、不拆分为多个任务
  assert: |-
    await expect(page.getByText(/来自对比篮 · 6 家|管理全部对象（6 家）/).first()).toBeVisible({ timeout: 8000 }); if (/view=processing/.test(page.url())) throw new Error('回填不应直接拆出过程任务')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮不足 6 家时记 Pass-N/A
tier: B
