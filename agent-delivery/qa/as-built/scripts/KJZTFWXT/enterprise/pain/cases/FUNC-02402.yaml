id: FUNC-02402
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02402
priority: P0
title: 报告任务结束后点完成回到结果页
story: US-ENT-RISK-PAIN
entry_id: ent-pain
tier: A
preconditions:
  - 报告任务过程已打开（assert 自含：成功结果→创建报告→等待过程 UI）
locators:
  complete: button「完成」
  report_modal: 弹层「企业发展痛难点建议报告任务」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points
  - action: evaluate
    note: 等待报告过程结束→点「完成」（前置与两条预期在 expect）
expect:
  - note: 1、结束时当前阶段为「已完成」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const MODAL_TITLE = '企业发展痛难点建议报告任务';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const isSuccessResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return /对象与诊断摘要/.test(t) && /发展痛难点分析建议报告/.test(t);
      };
      const reportSection = () =>
        main().locator('section, [class*="SectionPanel"], div').filter({ hasText: '发展痛难点分析建议报告' }).first();
      const hasUncreatedReport = async () => {
        const sec = reportSection();
        let t = '';
        if (await sec.count()) t = await sec.innerText().catch(() => '');
        else t = await main().innerText().catch(() => '');
        return /发展痛难点分析建议报告/.test(t) && /未创建/.test(t) && !/已生成/.test(t);
      };
      const reportModal = () =>
        page
          .locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal, main')
          .filter({ hasText: MODAL_TITLE })
          .last();
      const rowOpenControl = (row, label) =>
        row
          .getByRole('button', { name: label })
          .or(row.getByRole('link', { name: label }))
          .first();
      const openResultFromRow = async (row) => {
        for (const label of ['预览结果', '恢复结果']) {
          const btn = rowOpenControl(row, label);
          if (!(await btn.count())) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
          await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 20000 }).catch(() => {});
          await page.waitForTimeout(600);
          return label;
        }
        return '';
      };
      const waitSuccessFromStart = async (timeoutMs = 120000) => {
        const t0 = Date.now();
        while (Date.now() - t0 < timeoutMs) {
          if (await isSuccessResult()) return;
          const body = await main().innerText().catch(() => '');
          if (/分析失败|本次分析失败/.test(body) && !/企业发展痛点分析生成中/.test(body)) {
            throw new Error('ENV-PAIN-ANALYSIS-FAIL-001');
          }
          await page.waitForTimeout(1200);
        }
        throw new Error('ENV-PAIN-ASYNC-NO-SUCCESS-001');
      };
      const ensureOneDimChecked = async () => {
        const dims = ['技术研发', '市场拓展', '融资', '管理'];
        for (const d of dims) {
          const box = page.locator('main .arco-checkbox').filter({ hasText: d }).first();
          if (!(await box.count())) continue;
          const cls = (await box.getAttribute('class')) || '';
          if (/arco-checkbox-checked/.test(cls)) return;
        }
        const first = page.locator('main .arco-checkbox').filter({ hasText: dims[0] }).first();
        await expect(first).toBeVisible({ timeout: 8000 });
        await first.click({ timeout: 8000 });
        await page.waitForTimeout(300);
      };
      const startViaBasket = async () => {
        await page.goto(toUrl(painRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        if (!(await main().getByText(/来自对比篮/).first().isVisible().catch(() => false))) {
          await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const sels = page.locator('[aria-label^="选择 "]');
          if ((await sels.count()) < 1) throw new Error('ENV-PAIN-BASKET-EMPTY-001');
          await sels.nth(0).click();
          await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          await dismissBasket();
        }
        await ensureOneDimChecked();
        const start = main().getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 15000 });
        await waitSuccessFromStart();
      };
      const openViaHistory = async () => {
        const historyRoute = painRoute + '&view=history';
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await dismissBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const n = await main().locator(rowSel).count();
        if (!n) return false;
        for (let i = 0; i < n; i++) {
          if (i > 0) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);
            await dismissBasket();
          }
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          await openResultFromRow(row);
          if (await isSuccessResult() && (await hasUncreatedReport())) return true;
        }
        return false;
      };
      const reachUncreatedResult = async () => {
        await page.goto(toUrl(painRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        if (await isSuccessResult() && (await hasUncreatedReport())) return;
        if (await openViaHistory()) return;
        await startViaBasket();
        if (!(await isSuccessResult())) throw new Error('ENV-PAIN-ASYNC-NO-SUCCESS-001');
        if (!(await hasUncreatedReport())) {
          throw new Error('ENV-PAIN-REPORT-NOT-UNCREATED-001：报告区非「未创建」，无法测创建→完成链');
        }
      };
      const openReportProcess = async () => {
        let modal = reportModal();
        if (await modal.isVisible().catch(() => false)) return;
        const resultUrl = page.url();
        const createBtn = main().getByRole('button', { name: '创建报告', exact: true });
        if (!(await createBtn.count())) throw new Error('ENV-PAIN-NO-CREATE-REPORT-001');
        await createBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        modal = reportModal();
        await expect(modal).toBeVisible({ timeout: 12000 });
        const tid = (resultUrl.match(/task_id=([^&]+)/) || [])[1] || '';
        globalThis.__func02402 = { resultUrl, taskId: tid, reportDone: false };
      };
      const waitReportStageCompleted = async (timeoutMs = 300000) => {
        const t0 = Date.now();
        let stableReady = 0;
        while (Date.now() - t0 < timeoutMs) {
          const modal = reportModal();
          if (!(await modal.isVisible().catch(() => false))) {
            await page.waitForTimeout(1500);
            continue;
          }
          const text = await modal.innerText().catch(() => '');
          const doneBtn = modal.getByRole('button', { name: '完成', exact: true });
          const btnReady = (await doneBtn.count()) && (await doneBtn.first().isEnabled().catch(() => false));
          const stagesOk = ['已提交', '数据准备', '内容组装', '图表生成', '报告生成'].every((s) => text.includes(s));
          const terminal = /已完成/.test(text) && stagesOk && btnReady && !/生成中|进行中|等待中/.test(text);
          if (terminal) {
            stableReady += 1;
            if (stableReady >= 2) {
              const prev = globalThis.__func02402 || {};
              globalThis.__func02402 = { ...prev, modalText: text, reportDone: true };
              return;
            }
          } else {
            stableReady = 0;
          }
          if (/失败|出错/.test(text) && !/报告生成/.test(text)) {
            throw new Error('ENV-PAIN-REPORT-FAIL-001：报告任务失败');
          }
          await page.waitForTimeout(2000);
        }
        throw new Error('ENV-PAIN-REPORT-ASYNC-TIMEOUT-001：报告过程未在时限内到「已完成」');
      };
      await dismissBasket();
      await reachUncreatedResult();
      await openReportProcess();
      await waitReportStageCompleted();
      const ctx = globalThis.__func02402;
      if (!ctx || !ctx.reportDone) throw new Error('前置：报告未到已完成');
      if (!/已完成/.test(ctx.modalText || '')) {
        throw new Error('结束时当前阶段非「已完成」：' + (ctx.modalText || '').slice(0, 320));
      }
  - note: 2、回到结果页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const MODAL_TITLE = '企业发展痛难点建议报告任务';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const reportModal = () =>
        page
          .locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal')
          .filter({ hasText: MODAL_TITLE })
          .last();
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const historyRoute = painRoute + '&view=history';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const activateResultTab = async () => {
        const tabCurrent = page.getByRole('tab', { name: '当前分析' });
        if (await tabCurrent.count()) {
          await tabCurrent.first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(2500);
        }
      };
      const readResultBody = async () => {
        await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 25000 }).catch(() => {});
        const body = await main().innerText().catch(() => '');
        return body;
      };
      const restoreFromHistory = async (taskId) => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await dismissBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const rows = main().locator(rowSel);
        const n = await rows.count();
        if (!n) return false;
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (taskId && !rowText.includes(taskId)) continue;
          if (!/已完成/.test(rowText)) continue;
          for (const label of ['预览结果', '恢复结果']) {
            const btn = row.getByRole('button', { name: label }).or(row.getByRole('link', { name: label })).first();
            if (!(await btn.count())) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForTimeout(2000);
            await activateResultTab();
            const body = await readResultBody().catch(() => '');
            if (/对象与诊断摘要/.test(body)) return true;
          }
        }
        return false;
      };
      const ensureResultShell = async (savedUrl, taskId) => {
        if (savedUrl && /view=result/.test(savedUrl)) {
          await page.goto(savedUrl, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        await dismissBasket();
        await activateResultTab();
        let body = await readResultBody().catch(() => '');
        if (/对象与诊断摘要/.test(body)) return body;
        if (taskId && (await restoreFromHistory(taskId))) {
          body = await readResultBody().catch(() => '');
          if (/对象与诊断摘要/.test(body)) return body;
        }
        throw new Error('ENV-PAIN-RESULT-SHELL-001：完成报告后结果区未加载');
      };
      const ctx = globalThis.__func02402;
      if (!ctx || !ctx.reportDone) throw new Error('前置：报告未完成');
      let modal = reportModal();
      if (await modal.isVisible().catch(() => false)) {
        const doneBtn = modal.getByRole('button', { name: '完成', exact: true });
        await expect(doneBtn.first()).toBeEnabled({ timeout: 8000 });
        await doneBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
      }
      modal = reportModal();
      await expect(modal).toBeHidden({ timeout: 12000 }).catch(async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(500);
      });
      await ensureResultShell(ctx.resultUrl || '', ctx.taskId || '');
      await expect(page).toHaveURL(/workspace=pain-points/);
      await expect(page).toHaveURL(/view=result/);
      await expect(main().getByRole('button', { name: '重新分析' }).first()).toBeVisible({ timeout: 10000 });
      const body = await main().innerText().catch(() => '');
      if (/企业发展痛难点建议报告任务/.test(body)) {
        throw new Error('仍在报告任务过程页');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；goto workspace=pain-points&tab=pain-points。前置=成功结果+「未创建」→「创建报告」打开过程。步骤=等报告到阶段「已完成」（五段+完成钮双稳）→「完成」。机检=已完成+view=result+「对象与诊断摘要」+「重新分析」；edu 点完成后深链空壳时按 task_id 历史恢复+切「当前分析」（同 02396）。用例备注：报告区仍可能「未创建」为缺陷候选，不作 Fail。报告超时→ENV-PAIN-REPORT-ASYNC-TIMEOUT-001。A 档零 allow_skip。
