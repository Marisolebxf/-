id: FUNC-02421
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02421
priority: P1
title: 失败任务点继续查看后展示失败说明
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: B
preconditions:
  - 最近分析中有一条状态为失败的痛点任务（assert 自含）
locators:
  continue_btn: button「继续查看」
  html_report_button: button「查看 HTML 报告」或 data-risk-history-open-html-report
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 最近分析→失败行「继续查看」；三条预期在 expect
expect:
  - note: 前置：定位失败行、校验该行 HTML 报告禁用并点击「继续查看」
    assert: |-
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const historyRoute = painRoute + '&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(350);
      };
      const openHistory = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        await scrollHistoryActions();
      };
      const isFailedPainRow = (rowText) =>
        /失败/.test(rowText) &&
        !/已取消/.test(rowText) &&
        /企业发展痛?点分析/.test(rowText) &&
        TID_RE.test(rowText);
      const pickFailedContinue = async () => {
        const n = await main().locator(rowSel).count();
        for (let i = 0; i < n; i++) {
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!isFailedPainRow(rowText)) continue;
          const cont = row.getByRole('button', { name: '继续查看' }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          const htmlBtn = row
            .locator('[data-risk-history-open-html-report], button:has-text("查看 HTML 报告")')
            .first();
          if ((await htmlBtn.count()) < 1) {
            throw new Error('失败行未见「查看 HTML 报告」按钮');
          }
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollHistoryActions();
          await expect(htmlBtn).toBeVisible({ timeout: 8000 });
          await expect(htmlBtn).toBeDisabled({ timeout: 8000 });
          const tidM = rowText.match(TID_RE);
          return { cont, htmlBtn, expectedTid: tidM ? tidM[0] : null };
        }
        return null;
      };
      await openHistory();
      const hit = await pickFailedContinue();
      if (!hit) {
        throw new Error('ENV-PAIN-NO-FAILED-ROW-001：最近分析无「失败+继续查看」的痛点任务行');
      }
      globalThis.__func02421 = { htmlDisabled: true, expectedTid: hit.expectedTid };
      await hit.cont.scrollIntoViewIfNeeded().catch(() => {});
      await hit.cont.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      globalThis.__func02421.ready = true;
  - note: 1、页面标题为「分析失败」
    assert: |-
      if (!globalThis.__func02421?.ready) throw new Error('前置：未点击继续查看');
      const main = page.locator('main.content-shell-layout, main').first();
      await expect(main.getByText('分析失败').first()).toBeVisible({ timeout: 12000 });
      const body = await main.innerText().catch(() => '');
      if (!/分析失败/.test(body)) {
        throw new Error('未见失败页标题「分析失败」：' + body.slice(0, 200));
      }
      if (/企业发展痛点分析生成中/.test(body) && !/分析失败/.test(body.split('\n').slice(0, 3).join('\n'))) {
        throw new Error('继续查看后仍在生成中页，非失败说明');
      }
  - note: 2、页面展示失败说明
    assert: |-
      if (!globalThis.__func02421?.ready) throw new Error('前置：未点击继续查看');
      const main = page.locator('main.content-shell-layout, main').first();
      const body = await main.innerText().catch(() => '');
      const hints = [
        '任务失败',
        '任务执行失败',
        '本次分析失败',
        '失败阶段',
        '错误',
        globalThis.__func02421?.expectedTid,
      ].filter(Boolean);
      const hasExplain = hints.some((h) => body.includes(String(h)));
      if (!hasExplain) {
        const sub = main.locator('.arco-result-subtitle, .arco-alert-content, .arco-alert-title').first();
        if (await sub.isVisible().catch(() => false)) {
          const t = await sub.innerText().catch(() => '');
          if (t && t.trim().length > 2) return;
        }
        throw new Error('失败页未见可辨别的失败说明文案：' + body.slice(0, 280));
      }
  - note: 3、「查看 HTML 报告」不可点击
    assert: |-
      if (!globalThis.__func02421?.htmlDisabled) {
        throw new Error('前置：未校验失败行 HTML 报告禁用态');
      }
      if (/view=report/.test(page.url())) {
        throw new Error('失败任务不应进入 view=report');
      }
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      if (await reader.isVisible().catch(() => false)) {
        throw new Error('失败任务不应打开只读 HTML 报告页');
      }
      const main = page.locator('main.content-shell-layout, main').first();
      const enabledHtml = main.locator(
        '[data-risk-history-open-html-report]:not(.arco-btn-disabled):not([disabled]), [data-risk-open-html-report]:not(.arco-btn-disabled):not([disabled])',
      );
      const n = await enabledHtml.count();
      for (let i = 0; i < n && i < 8; i++) {
        const b = enabledHtml.nth(i);
        if (!(await b.isVisible().catch(() => false))) continue;
        const name = await b.innerText().catch(() => '');
        if (/查看 HTML 报告/.test(name)) {
          throw new Error('失败态仍出现可点的「查看 HTML 报告」');
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；goto view=history。前置=最近分析有「失败+企业发展痛点分析+继续查看」行。步骤=点「继续查看」→ view=result 失败页（同 02422 restoreTask failed）。机检=标题「分析失败」+失败说明（subtitle/alert，不固定单句）+失败行 data-risk-history-open-html-report disabled 且未进 view=report。无失败行→ENV-PAIN-NO-FAILED-ROW-001。登录关评审 runner 前置。B 档零 allow_skip。
