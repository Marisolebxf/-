id: FUNC-02422
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02422
priority: P1
title: 失败页重试后进入新的生成中
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: B
preconditions:
  - 已打开「分析失败」页（assert 自含：最近分析失败行「继续查看」兜底）
locators:
  retry: button「重试」
  continue_btn: button「继续查看」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 失败页点「重试」；两条预期在 expect
expect:
  - note: 前置：进入分析失败页并点击「重试」
    assert: |-
      page.setDefaultTimeout(20000);
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const historyRoute = painRoute + '&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
      const procHint = /企业发展痛?点分析生成中|可视化分析过程/;
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(350);
      };
      const openHistory = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        await scrollHistoryActions();
      };
      const pickFailedContinue = async () => {
        const n = await main().locator(rowSel).count();
        for (let i = 0; i < n; i++) {
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (/已取消|已完成|处理中/.test(rowText)) continue;
          if (!/失败/.test(rowText)) continue;
          const cont = row.getByRole('button', { name: '继续查看' }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          const tidM = rowText.match(TID_RE);
          return { cont, expectedTid: tidM ? tidM[0] : null };
        }
        return null;
      };
      const taskIdFromPage = async () => {
        const fromUrl = new URL(page.url()).searchParams.get('task_id');
        if (fromUrl) return decodeURIComponent(fromUrl);
        const body = await main().innerText().catch(() => '');
        const m = body.match(TID_RE);
        return m ? m[0] : null;
      };
      await openHistory();
      const hit = await pickFailedContinue();
      if (!hit) {
        throw new Error('ENV-PAIN-NO-FAILED-ROW-001：最近分析无「失败+继续查看」行，无法进入分析失败页');
      }
      await hit.cont.scrollIntoViewIfNeeded().catch(() => {});
      await hit.cont.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const failBody = await main().innerText().catch(() => '');
      if (!/分析失败/.test(failBody)) {
        throw new Error('继续查看后非分析失败页：' + failBody.slice(0, 200));
      }
      if (/企业发展痛点分析生成中/.test(failBody) && !/分析失败/.test(failBody.split('\n')[0] || '')) {
        throw new Error('继续查看后仍在生成中，非失败页');
      }
      const taskBefore =
        (await taskIdFromPage()) || hit.expectedTid;
      if (!taskBefore) throw new Error('失败页未见 RISK 任务编号');
      const retry = main().getByRole('button', { name: '重试', exact: true });
      if (!(await retry.count())) throw new Error('失败页未见「重试」');
      await retry.first().scrollIntoViewIfNeeded().catch(() => {});
      await retry.first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      globalThis.__func02422 = { taskBefore, retried: true };
      await page.waitForURL(/view=processing/, { timeout: 25000 }).catch(() => {});
      const afterClick = await main().innerText().catch(() => '');
      if (/分析失败/.test(afterClick) && !procHint.test(afterClick)) {
        throw new Error('ENV-PAIN-RETRY-STUCK-FAIL-001：点重试后仍停失败页');
      }
  - note: 1、进入「企业发展痛点分析生成中」
    assert: |-
      if (!globalThis.__func02422?.retried) throw new Error('前置：未点击重试');
      const main = page.locator('main.content-shell-layout, main').first();
      await expect(main.getByText(/企业发展痛?点分析生成中/).first()).toBeVisible({ timeout: 20000 });
      const body = await main.innerText().catch(() => '');
      if (!/企业发展痛?点分析生成中/.test(body) && !/可视化分析过程/.test(body)) {
        throw new Error('重试后未见生成中标题：' + body.slice(0, 220));
      }
  - note: 2、任务编号是新的一条
    assert: |-
      const ctx = globalThis.__func02422;
      if (!ctx?.retried || !ctx.taskBefore) throw new Error('前置：未完成重试');
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const main = page.locator('main.content-shell-layout, main').first();
      const taskNow =
        new URL(page.url()).searchParams.get('task_id') ||
        (await main().innerText().catch(() => '')).match(TID_RE)?.[0] ||
        '';
      if (!taskNow) throw new Error('重试后生成中页未见 RISK 任务编号');
      if (taskNow === ctx.taskBefore) {
        throw new Error('重试后 task_id 未变化：' + taskNow);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；goto view=history。前置=失败行「继续查看」→分析失败页（同 02421 入口）。步骤=点「重试」。机检=生成中标题+task_id 与失败页不同。无失败行→ENV-PAIN-NO-FAILED-ROW-001；重试仍失败页→ENV-PAIN-RETRY-STUCK-FAIL-001。登录关评审 runner 前置。B 档零 allow_skip。
