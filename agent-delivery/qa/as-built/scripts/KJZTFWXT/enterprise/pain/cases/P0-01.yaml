id: P0-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01070
priority: P0
title: 路由直达痛难点分析页且页头与默认 Tab 正确
story: US-ENT-RISK-PAIN
entry_id: ent-pain
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 经人设面板关闭内部评审模式（默认态执行时 observed 记录）
locators:
  h1: heading「企业发展痛难点分析」
  tab_current: tab「当前分析」（class 含 active）
  tab_recent: tab「最近分析」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points
  - action: assert_url
    expect_contains: workspace=pain-points
  - action: assert_visible
    target: heading 企业发展痛难点分析
expect:
  - note: 路由为 /enterprise/risk 且 query 含 workspace=pain-points 与 tab=pain-points
    assert: |-
      await expect(page).toHaveURL(/\/enterprise\/risk/); await expect(page).toHaveURL(/workspace=pain-points/); await expect(page).toHaveURL(/tab=pain-points/)
  - note: 页标题为「企业发展痛难点分析」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page).toHaveTitle(/企业发展痛难点分析 - 科技专题服务系统/); await expect(page.getByRole('heading', { name: '企业发展痛难点分析' })).toBeVisible({ timeout: 8000 })
  - note: 页面为「当前分析/最近分析」双 Tab 且默认停留「当前分析」
    assert: |-
      const cur = page.getByRole('tab', { name: '当前分析' }).first(); const recent = page.getByRole('tab', { name: '最近分析' }).first(); await expect(cur).toBeVisible({ timeout: 8000 }); await expect(recent).toBeVisible({ timeout: 8000 }); const cls = (await cur.getAttribute('class')) || ''; if (!/\bactive\b/.test(cls) && (await cur.getAttribute('aria-selected')) !== 'true') throw new Error('默认 Tab 非当前分析 class=' + cls); if (/view=history/.test(page.url())) throw new Error('默认不应停在最近分析: ' + page.url())
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 供应链视图隔离归 01071；双 Tab 往返归 01086。对比篮浮层若遮挡主区，仅当「关闭对比篮」可见时再点。本文件 list 项相对父键缩进 2 空格（极简 YAML 解析器要求）。
tier: A
