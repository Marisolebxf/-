id: FUNC-02408
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02408
priority: P1
title: 生成中取消任务后回到配置且对象仍在
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: B
preconditions:
  - 生成中页已打开且该次对象已回填（assert 自含：恢复结果→重新分析或回填→开始分析抢窗点取消）
locators:
  cancel_task: button「取消任务」
  start: button「开始分析」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points
  - action: evaluate
    note: 生成中页点「取消任务」；三条预期在 expect
expect:
  - note: 前置：进入生成中并点击「取消任务」（无二次弹框）
    assert: |-
      page.setDefaultTimeout(20000);
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const historyRoute = painRoute + '&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const procHint = /企业发展痛?点分析生成中|可视化分析过程/;
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const inProcess = async () => {
        const t = await main().innerText().catch(() => '');
        return procHint.test(t) && /view=processing/.test(page.url());
      };
      const readObjectHint = async () => {
        const t = await main().innerText().catch(() => '');
        const fromBasket = t.match(/来自对比篮[^\n]*/);
        if (fromBasket) return fromBasket[0];
        const objLine = t.match(/分析对象[\s\S]{0,80}?([\u4e00-\u9fffA-Za-z0-9（）()·\s]{2,40}(?:有限公司|股份有限公司|集团))/);
        if (objLine && objLine[1]) return objLine[1].trim();
        const lines = t.split('\n').map((s) => s.trim()).filter(Boolean);
        for (const ln of lines) {
          if (/有限公司|股份|集团/.test(ln) && !/企业发展痛/.test(ln)) return ln;
        }
        return '';
      };
      const clickCancelAsap = async () => {
        return page.evaluate(() => {
          return new Promise((resolve) => {
            const failedUi = () => {
              const t = document.body.innerText || '';
              return /分析失败/.test(t) && !/取消任务/.test(t);
            };
            const tryClick = () => {
              if (failedUi()) {
                resolve('failed');
                return true;
              }
              const btn = Array.from(document.querySelectorAll('button')).find((b) =>
                /取消任务/.test((b.textContent || '').trim()),
              );
              if (btn) {
                btn.click();
                resolve('ok');
                return true;
              }
              return false;
            };
            if (tryClick()) return;
            const deadline = Date.now() + 90000;
            const obs = new MutationObserver(() => {
              tryClick();
            });
            obs.observe(document.body, { childList: true, subtree: true });
            const tick = setInterval(() => {
              if (tryClick()) {
                clearInterval(tick);
                obs.disconnect();
              } else if (Date.now() > deadline) {
                clearInterval(tick);
                obs.disconnect();
                resolve('timeout');
              }
            }, 40);
          });
        });
      };
      const waitCancelBtn = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          const cancel = page.getByRole('button', { name: '取消任务', exact: true });
          if ((await cancel.count()) && (await cancel.first().isVisible().catch(() => false))) {
            return cancel.first();
          }
          const body = await main().innerText().catch(() => '');
          if (/对象与诊断摘要/.test(body) && /重新分析/.test(body)) return null;
          await page.waitForTimeout(350);
        }
        return null;
      };
      const hasReanalyzeResult = async () => {
        const t = await main().innerText().catch(() => '');
        if (/企业发展痛点分析生成中/.test(t) && !/对象与诊断摘要/.test(t)) return false;
        return (
          (await page.getByText('对象与诊断摘要').first().isVisible().catch(() => false)) &&
          (await page.getByRole('button', { name: '重新分析' }).first().isVisible().catch(() => false))
        );
      };
      const openSuccessFromHistory = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const n = await main().locator(rowSel).count();
        for (let i = 0; i < n; i++) {
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          for (const label of ['恢复结果', '预览结果']) {
            const btn = row.getByRole('button', { name: label }).first();
            if (!(await btn.count())) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
            await page.waitForTimeout(800);
            if (await hasReanalyzeResult()) return true;
          }
        }
        return false;
      };
      const reachProcessViaReanalyze = async () => {
        if (!(await openSuccessFromHistory()) && !(await hasReanalyzeResult())) {
          throw new Error('ENV-PAIN-NO-SUCCESS-001');
        }
        globalThis.__func02408_objectHint = await readObjectHint();
        const reBtn = main().getByRole('button', { name: '重新分析', exact: true }).first();
        await expect(reBtn).toBeVisible({ timeout: 8000 });
        await reBtn.click({ timeout: 15000 });
        for (let i = 0; i < 30; i++) {
          await page.waitForTimeout(i < 6 ? 400 : 500);
          if (await inProcess()) return 'reanalyze';
        }
        if (await inProcess()) return 'reanalyze';
        throw new Error('ENV-PAIN-PROCESS-WINDOW-001');
      };
      const reachProcessViaStart = async () => {
        await page.goto(toUrl(painRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        if (!(await main().getByText(/来自对比篮/).first().isVisible().catch(() => false))) {
          throw new Error('ENV-PAIN-BASKET-EMPTY-001');
        }
        globalThis.__func02408_objectHint = await readObjectHint();
        const start = main().getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        const body0 = await main().innerText().catch(() => '');
        if (/已打开今天相同条件/.test(body0)) {
          throw new Error('ENV-PAIN-TODAY-REUSE-001');
        }
        const cancelRace = clickCancelAsap();
        await start.click({ timeout: 15000 });
        await page.waitForTimeout(400);
        const cancelResult = await cancelRace;
        if (cancelResult === 'ok') {
          globalThis.__func02408_cancelled = true;
          return 'start-race';
        }
        if (cancelResult === 'failed') {
          throw new Error('ENV-PAIN-PROCESS-WINDOW-001');
        }
        if (!(await inProcess())) {
          throw new Error('ENV-PAIN-PROCESS-WINDOW-001：开始分析后未进入生成中');
        }
        return 'start-process';
      };
      const clickCancelOnProcess = async () => {
        const cancelBtn = await waitCancelBtn(45000);
        if (!cancelBtn) {
          throw new Error('ENV-PAIN-PROCESS-WINDOW-001：过程页未见可点「取消任务」');
        }
        await expect(cancelBtn).toBeVisible({ timeout: 5000 });
        try {
          await cancelBtn.click({ timeout: 12000 });
        } catch {
          await cancelBtn.click({ timeout: 12000, force: true });
        }
        globalThis.__func02408_cancelled = true;
      };
      await page.goto(toUrl(painRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(600);
      await closeBasket();
      let path = null;
      try {
        path = await reachProcessViaReanalyze();
      } catch (e1) {
        try {
          path = await reachProcessViaStart();
        } catch (e2) {
          throw new Error('ENV-PAIN-ASYNC-NO-PROCESS-001: ' + String(e1.message || e1).slice(0, 80));
        }
      }
      if (path !== 'start-race') {
        await clickCancelOnProcess();
      }
      await page.waitForTimeout(1200);
      if (!globalThis.__func02408_cancelled) {
        throw new Error('前置：未点击取消任务');
      }
  - note: 1、回到当前分析配置
    assert: |-
      if (!globalThis.__func02408_cancelled) throw new Error('前置：未点击取消任务');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const body = await main().innerText().catch(() => '');
      const url = page.url();
      if (/view=processing/.test(url) && /取消任务/.test(body)) {
        throw new Error('点取消后仍停留在生成中页');
      }
      if (/企业发展痛点分析生成中/.test(body) && !/开始分析/.test(body)) {
        throw new Error('取消后仍在生成中标题页');
      }
      const onConfig =
        /诊断范围|数据与权限预检/.test(body) &&
        (await main().getByRole('button', { name: '开始分析' }).first().isVisible().catch(() => false));
      if (!onConfig) {
        throw new Error('未回到当前分析配置：' + body.replace(/\s+/g, ' ').slice(0, 220));
      }
      const curTab = page.getByRole('tab', { name: '当前分析' }).first();
      if (await curTab.count()) {
        const selected = await curTab.getAttribute('aria-selected').catch(() => null);
        if (selected === 'false') {
          await curTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
        }
      }
  - note: 2、提示「已取消任务，可重新配置后发起」
    assert: |-
      if (!globalThis.__func02408_cancelled) throw new Error('前置：未点击取消任务');
      const toastOk = await page
        .locator('.arco-message, .arco-notification, [role="alert"]')
        .filter({ hasText: /已取消任务，可重新配置后发起/ })
        .first()
        .isVisible({ timeout: 8000 })
        .catch(() => false);
      const bodyAfter = await page.locator('body').innerText().catch(() => '');
      if (!toastOk && !/已取消任务，可重新配置后发起/.test(bodyAfter)) {
        throw new Error('取消后未见提示「已取消任务，可重新配置后发起」');
      }
  - note: 3、分析对象仍显示
    assert: |-
      if (!globalThis.__func02408_cancelled) throw new Error('前置：未点击取消任务');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const body = await main().innerText().catch(() => '');
      const hint = globalThis.__func02408_objectHint || '';
      let entLead = hint.replace(/等\s*\d+\s*家.*$/, '').split(/[、，,]/)[0].trim();
      if (!entLead || /来自对比篮/.test(entLead)) {
        const m = body.match(
          /分析对象[\s\S]{0,120}?([\u4e00-\u9fffA-Za-z0-9（）()·\s]{2,40}(?:有限公司|股份有限公司|集团))/,
        );
        entLead = m && m[1] ? m[1].trim() : entLead;
      }
      const hasBasketTag = /来自对比篮/.test(body);
      const hasEnt =
        !!entLead &&
        body.includes(entLead) &&
        /分析对象/.test(body) &&
        !/请先在对比篮选择企业/.test(body);
      if (!hasBasketTag && !hasEnt) {
        throw new Error(
          '取消后分析对象未回显（无「来自对比篮」且无企业名）：' + body.replace(/\s+/g, ' ').slice(0, 220),
        );
      }
      if (hasBasketTag) {
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 8000 });
      } else if (entLead) {
        await expect(main().getByText(entLead).first()).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz entry-seed catalog_path=/enterprise/risk；goto workspace=pain-points&tab=pain-points。前置=成功结果「重新分析」或已回填「开始分析」+MutationObserver 抢「取消任务」。步骤=点「取消任务」（无二次弹框）。机检=当前分析配置+提示「已取消任务，可重新配置后发起」+分析对象仍显示（「来自对比篮」或企业名回显，2026-10-20 svcz 取消后常见仅企业名）。D4·2026-10-20 rewrite-FUNC-02408 svcz 4/4 expect 绿。无成功可恢复→ENV-PAIN-NO-SUCCESS-001；无过程窗→ENV-PAIN-PROCESS-WINDOW-001；篮空→ENV-PAIN-BASKET-EMPTY-001；当天复用→ENV-PAIN-TODAY-REUSE-001。登录与关评审由 runner 前置。B 档零 allow_skip。
