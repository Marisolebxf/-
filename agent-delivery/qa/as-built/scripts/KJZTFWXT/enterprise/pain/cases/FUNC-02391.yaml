id: FUNC-02391
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02391
priority: P0
tier: B
title: 勾选企业确定后对象区显示该企业且可开始分析
entry_id: ent-pain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: click
    target: 企业发展痛难点分析
  - action: wait
    timeout_ms: 1000
expect:
  - note: 1、对象区显示「来自对比篮 · 1 家」
    assert: |-
      const m = page.locator('main.content-shell-layout, main').first();
      const cta = m.getByRole('button', { name: '前往对比篮选择企业', exact: true });
      await expect(cta).toBeVisible({ timeout: 10000 });
      await cta.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const panel = () =>
        page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const listNamesInPanel = async (scope) => {
        const names = [];
        const cards = scope.locator('.ent-compare-item-card');
        for (let i = 0; i < (await cards.count()); i++) {
          const card = cards.nth(i);
          if (!(await card.isVisible().catch(() => false))) continue;
          const nameEl = card.locator('.ent-compare-item-card__name');
          const t = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (t) names.push(t);
        }
        return names;
      };
      let p = panel();
      await expect(p).toBeVisible({ timeout: 12000 });
      const basketTab = p.getByRole('tab', { name: '篮内企业' }).or(p.getByText('篮内企业', { exact: true }));
      if ((await basketTab.count()) && (await basketTab.first().isVisible().catch(() => false))) {
        await basketTab.first().click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      let names = await listNamesInPanel(p);
      if (names.length < 1) {
        const addTab = p.getByRole('tab', { name: /新增企业/ }).or(p.getByText('新增企业', { exact: true }));
        if ((await addTab.count()) && (await addTab.first().isVisible().catch(() => false))) {
          await addTab.first().click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        const join = p.getByRole('button', { name: '加入对比篮', exact: true }).first();
        await expect(join).toBeVisible({ timeout: 25000 });
        await join.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        if ((await basketTab.count()) && (await basketTab.first().isVisible().catch(() => false))) {
          await basketTab.first().click({ timeout: 5000 });
          await page.waitForTimeout(400);
        }
        p = panel();
        names = await listNamesInPanel(p);
      }
      if (names.length < 1) throw new Error('修订 blocked：对比篮无企业，无法勾选确定回填');
      globalThis.__func02391_ent = names[0];
      const sel = p.locator('[aria-label^="选择 "]').first();
      if (await sel.count()) {
        const aria = (await sel.getAttribute('aria-label')) || '';
        const mm = aria.match(/^选择\s+(.+)$/);
        if (mm && mm[1]) globalThis.__func02391_ent = mm[1].trim();
        if ((await sel.getAttribute('aria-checked')) !== 'true') await sel.click({ timeout: 8000 });
      } else {
        await p.locator('.ent-compare-item-card').first().click({ timeout: 8000 });
      }
      await page.waitForTimeout(300);
      const ok = p.getByRole('button', { name: '确定', exact: true }).first();
      await expect(ok).toBeEnabled({ timeout: 8000 });
      await ok.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await expect(page.getByText(/来自对比篮\s*[·•]\s*1\s*家/).first()).toBeVisible({ timeout: 10000 });
  - note: 2、对象区出现该企业名称
    assert: |-
      const ent = globalThis.__func02391_ent || '';
      if (!ent) throw new Error('未记录勾选企业名');
      const body = await page.locator('main.content-shell-layout, main').first().innerText();
      const idx = body.indexOf('分析对象');
      const slice = idx >= 0 ? body.slice(idx, idx + 600) : body.slice(0, 1200);
      if (!slice.includes(ent)) throw new Error('对象区未见企业名：' + ent);
  - note: 3、「开始分析」可点击
    assert: |-
      const dims = ['技术研发', '市场拓展', '融资', '管理'];
      for (const d of dims) {
        const box = page.locator('main .arco-checkbox').filter({ hasText: d }).first();
        if (!(await box.count())) continue;
        const cls = (await box.getAttribute('class')) || '';
        if (/arco-checkbox-checked/.test(cls)) break;
        await box.click({ timeout: 5000 });
        await page.waitForTimeout(200);
        break;
      }
      await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
