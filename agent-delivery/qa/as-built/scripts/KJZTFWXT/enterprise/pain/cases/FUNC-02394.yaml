id: FUNC-02394
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02394
priority: P1
tier: B
title: 主流程-结果摘要
entry_id: ent-pain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk
  - action: click
    target: 企业发展痛难点分析
  - action: click
    target: 前往对比篮选择企业
  - action: evaluate
    target: page.locator('.arco-modal .arco-table-body .arco-checkbox').first().click()
  - action: click
    target: 确定
  - action: click
    target: 开始分析
  - action: wait
    target: 对象与诊断摘要
    timeout: 180000
expect:
  - note: 1、摘要含分析对象、诊断方式、诊断维度、数据时间
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '对象与诊断摘要' })).toBeVisible();
      await expect(main.getByText('单企业诊断')).toBeVisible();
      await expect(main.getByText(/技术研发|市场拓展|融资|管理/)).toBeVisible();
      await expect(main.getByText(/\d{4}[-/年]\d{1,2}/)).toBeVisible();
  - note: 2、诊断方式为「单企业诊断」
    assert: |-
      await expect(page.locator('main').getByText('单企业诊断')).toBeVisible();
  - note: 3、分析对象为该次任务的企业
    assert: |-
      const main = page.locator('main');
      const objectLine = main.getByText('分析对象').locator('xpath=following-sibling::*[1]');
      await expect(objectLine).toBeVisible();
      await expect(objectLine).toHaveText(/[\u4e00-\u9fa5]{2,}/);
on_fail: 截图 + 抄 X-Trace-Id
