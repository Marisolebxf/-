id: FUNC-02398
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02398
priority: P1
tier: B
title: 主流程-集合结果：恢复多家已完成任务
entry_id: ent-pain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk
  - action: evaluate
    note: 在最近分析点击多家企业已完成行的「恢复结果」
expect:
  - note: 1、诊断方式为「企业集合共性诊断」
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const summarySliceFromBody = (body) => {
        const i = body.indexOf('对象与诊断摘要');
        return i >= 0 ? body.slice(i, i + 900) : '';
      };
      const isMultiEntSummary = (raw) => {
        const s = (raw || '').trim();
        if (!s) return false;
        const m = s.match(/等\s*(\d+)\s*家/);
        if (m && parseInt(m[1], 10) >= 2) return true;
        if (/、|，|,/.test(s)) {
          const parts = s.split(/、|，|,/).map((x) => x.trim()).filter(Boolean);
          return parts.length >= 2;
        }
        return false;
      };
      const isCollectionHistoryRow = (rowText) => {
        if (!/已完成/.test(rowText) || !/恢复结果/.test(rowText)) return false;
        const lines = rowText.split('\n').map((l) => l.trim()).filter(Boolean);
        const entLine =
          lines.find((l) => /等\s*\d+\s*家/.test(l)) ||
          lines.find((l) => (/、/.test(l) || /，/.test(l)) && l.length > 8 && !/企业发展痛点分析/.test(l));
        if (!entLine) return false;
        return isMultiEntSummary(entLine);
      };
      const ensureResultLoaded = async () => {
        const viewResult = page.getByRole('button', { name: '查看结果' });
        if (await viewResult.count()) {
          const vis = await viewResult.first().isVisible().catch(() => false);
          if (vis) {
            await viewResult.first().click({ timeout: 8000 });
            await page.waitForTimeout(1500);
          }
        }
        const tabCurrent = page.getByRole('tab', { name: '当前分析' });
        if (await tabCurrent.count()) {
          await tabCurrent.first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(2500);
        }
        await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 20000 });
        const body = await main().innerText().catch(() => '');
        if (!/对象与诊断摘要/.test(body)) {
          throw new Error('ENV-PAIN-RESULT-SHELL-001：恢复结果后主区未加载结果页');
        }
        return body;
      };
      const scanHistoryPage = async () => {
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const n = await main().locator(rowSel).count();
        let sawCollectionRow = false;
        for (let i = 0; i < n; i++) {
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!isCollectionHistoryRow(rowText)) continue;
          sawCollectionRow = true;
          const restore = row.getByRole('button', { name: '恢复结果' }).first();
          if (!(await restore.count())) continue;
          await restore.scrollIntoViewIfNeeded().catch(() => {});
          await restore.click({ timeout: 8000 });
          await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
          await page.waitForTimeout(1200);
          let body = '';
          try {
            body = await ensureResultLoaded();
          } catch (e) {
            if (String(e.message || e).includes('ENV-PAIN-RESULT-SHELL-001')) {
              await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(800);
              await closeBasket();
              continue;
            }
            throw e;
          }
          const slice = summarySliceFromBody(body);
          if (!/企业集合共性诊断/.test(slice)) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
            await closeBasket();
            continue;
          }
          if (!body.includes('共性问题 Top 5')) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
            await closeBasket();
            continue;
          }
          const objM = slice.match(/分析对象[：:]\s*([^\n]+)/);
          const objRaw = objM && objM[1] ? objM[1].trim() : '';
          if (!isMultiEntSummary(objRaw)) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
            await closeBasket();
            continue;
          }
          globalThis.__func02398_slice = slice;
          globalThis.__func02398_obj = objRaw;
          globalThis.__func02398_ready = true;
          return { ok: true, sawCollectionRow: true };
        }
        return { ok: false, sawCollectionRow };
      };
      const openViaHistoryRestore = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await closeBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        if (!(await main().locator(rowSel).count())) {
          throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
        }
        let sawAnyCollection = false;
        const pagers = main().locator('.arco-pagination-item:not(.arco-pagination-item-previous):not(.arco-pagination-item-next)');
        const pageCount = await pagers.count();
        const indices = pageCount > 0 ? Array.from({ length: pageCount }, (_, k) => k) : [0];
        for (const pi of indices) {
          if (pageCount > 0 && pi > 0) {
            await pagers.nth(pi).click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(900);
          }
          const r = await scanHistoryPage();
          if (r.sawCollectionRow) sawAnyCollection = true;
          if (r.ok) return;
          if (pageCount > 0) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
            await closeBasket();
          }
        }
        if (!sawAnyCollection) {
          throw new Error('ENV-PAIN-NO-COLLECTION-RESULT-001：历史中无多家企业已完成集合结果');
        }
        throw new Error('ENV-PAIN-RESULT-SHELL-001：恢复结果后主区未加载结果页');
      };
      await openViaHistoryRestore();
      if (!globalThis.__func02398_ready) throw new Error('前置：未到集合成功结果页');
      const slice = globalThis.__func02398_slice || '';
      if (!/诊断方式[：:]\s*企业集合共性诊断/.test(slice) && !/企业集合共性诊断/.test(slice)) {
        throw new Error('对象与诊断摘要区未见「企业集合共性诊断」');
      }
  - note: 2、页面有「共性问题 Top 5」
    assert: |-
      if (!globalThis.__func02398_ready) throw new Error('前置：未到集合成功结果页');
      await expect(page.getByText('共性问题 Top 5').first()).toBeVisible({ timeout: 10000 });
  - note: 3、分析对象含多家企业
    assert: |-
      if (!globalThis.__func02398_ready) throw new Error('前置：未到集合成功结果页');
      const objRaw = globalThis.__func02398_obj || '';
      const m = objRaw.match(/等\s*(\d+)\s*家/);
      if (m && parseInt(m[1], 10) >= 2) return;
      if (/、|，|,/.test(objRaw)) {
        const parts = objRaw.split(/、|，|,/).map((x) => x.trim()).filter(Boolean);
        if (parts.length >= 2) return;
      }
      throw new Error('分析对象未见多家企业：' + (objRaw || '(空)'));
on_fail: 截图 + 抄 X-Trace-Id
