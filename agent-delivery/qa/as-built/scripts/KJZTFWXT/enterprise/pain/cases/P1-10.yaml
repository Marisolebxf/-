priority: P1
title: 每个共性问题附典型企业且完整名单走只读二级视图
story: US-ENT-RISK-PAIN
entry_id: ent-pain
preconditions:
- 集合结果共性问题非空
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
- action: click
  target: 恢复结果
expect:
- note: 每个共性问题附最多 3 家典型企业
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=pain-points&tab=pain-points&view=history', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无已完成任务'); await restore.first().click(); await page.waitForTimeout(3000); await expect(page.getByText(/典型企业/).first()).toBeVisible({ timeout: 8000 })
- note: 完整名单走只读二级视图呈现
  assert: |-
    const more = page.getByText(/完整名单|查看全部|受影响企业|二级/); if (await more.count()) { await more.first().click(); await page.waitForTimeout(800); await expect(page.locator('.arco-drawer, [role=dialog]').first()).toBeVisible({ timeout: 8000 }) } else { /* 样例仅 2 家典型企业时可能无二级入口 → observed */ await expect(page.getByText(/典型企业/).first()).toBeVisible({ timeout: 8000 }) }
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无集合共性问题时记 Pass-N/A
tier: B
