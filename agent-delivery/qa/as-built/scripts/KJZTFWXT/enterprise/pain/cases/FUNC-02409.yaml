id: FUNC-02409
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02409
priority: P0
title: 最近分析已完成行按此配置新建回到当前分析并带回企业
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: A
preconditions:
  - 最近分析中有一条已完成且企业摘要为公司名的任务（assert 自含）
locators:
  rebuild: button「按此配置新建」
  start: button「开始分析」
  return_basket: button「返回对比篮」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 点击该行「按此配置新建」（前置与判定在 expect 自含）
expect:
  - note: 1、进入当前分析配置
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const configRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const pickEntSummaryFromRow = (rowText) => {
        const lines = rowText
          .split('\n')
          .map((s) => s.trim())
          .filter(Boolean);
        const dateIdx = lines.findIndex((l) => /^\d{4}-\d{2}-\d{2}/.test(l));
        if (dateIdx > 0) {
          const cand = lines[dateIdx - 1];
          if (cand && !/^企业发展痛点分析$/.test(cand) && !/^RISK-/.test(cand)) return cand;
        }
        const m = rowText.match(/企业发展痛点分析[\s\S]*?\n([^\n]+)\n\s*\d{4}-\d{2}-\d{2}/);
        return m && m[1] ? m[1].trim() : '';
      };
      const isCompanyNameSummary = (s) => {
        if (!s || /^[—–\-－]+$/.test(s)) return false;
        if (/^[0-9a-f]{32}$/i.test(s.replace(/\s+/g, ''))) return false;
        if (/^ENT-\d+/i.test(s)) return false;
        return /[\u4e00-\u9fff]/.test(s) || /有限公司|股份|集团/.test(s);
      };
      const leadFromSummary = (s) =>
        s
          .replace(/等\s*\d+\s*家.*$/, '')
          .split(/[、，,]/)[0]
          .trim();
      const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
      let opened = false;
      await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      await closeBasket();
      const n = await main().locator(rowSel).count();
      if (!n) throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
      for (let i = 0; i < n; i++) {
        if (i > 0) {
          await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await closeBasket();
        }
        const row = main().locator(rowSel).nth(i);
        const rowText = await row.innerText().catch(() => '');
        if (!/已完成/.test(rowText)) continue;
        const rowEnt = pickEntSummaryFromRow(rowText);
        if (!isCompanyNameSummary(rowEnt)) continue;
        const rebuild = row.getByRole('button', { name: '按此配置新建' }).first();
        if (!(await rebuild.count())) continue;
        await rebuild.scrollIntoViewIfNeeded().catch(() => {});
        await rebuild.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        const tabCurrent = page.getByRole('tab', { name: '当前分析' });
        if (await tabCurrent.count()) {
          await tabCurrent.first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
        }
        const url = page.url();
        if (/view=processing|view=result/.test(url)) {
          throw new Error('按此配置新建后不应自动进入过程/结果页：' + url);
        }
        const body = await main().innerText().catch(() => '');
        if (/最近分析[\s\S]*任务名称/.test(body) && /view=history/.test(url)) {
          continue;
        }
        globalThis.__func02409_rowEnt = rowEnt;
        globalThis.__func02409_lead = leadFromSummary(rowEnt);
        globalThis.__func02409_ready = true;
        opened = true;
        break;
      }
      if (!opened) {
        throw new Error('ENV-PAIN-NO-REBUILD-ROW-001：无「已完成+公司名企业摘要+按此配置新建」行可测');
      }
      await expect(page.getByRole('tab', { name: '当前分析' }).first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 10000 });
      const cfgBody = await main().innerText().catch(() => '');
      if (!/诊断范围|数据与权限预检|开始分析/.test(cfgBody)) {
        throw new Error('当前分析配置区未加载（缺诊断范围/开始分析等）');
      }
  - note: 2、对象区显示该企业
    assert: |-
      if (!globalThis.__func02409_ready) throw new Error('前置：未进入配置页');
      const rowEnt = globalThis.__func02409_rowEnt || '';
      const lead = globalThis.__func02409_lead || '';
      if (!rowEnt || !lead) throw new Error('前置：未记录列表企业摘要');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const body = await main().innerText().catch(() => '');
      const parts = rowEnt
        .split(/[、，,]/)
        .map((s) => s.replace(/等\s*\d+\s*家.*$/, '').trim())
        .filter((s) => s && !/^[—–\-－]+$/.test(s));
      const hitLead = lead && body.includes(lead);
      const hitMulti = parts.length >= 2 && parts.filter((p) => body.includes(p)).length >= 2;
      const hitSingle = parts.length === 1 && body.includes(parts[0]);
      const hitCollection = /等\s*\d+\s*家/.test(rowEnt) && hitLead;
      if (!(hitSingle || hitMulti || hitCollection || body.includes(rowEnt.slice(0, Math.min(16, rowEnt.length))))) {
        throw new Error('对象区未显示列表企业：行=' + rowEnt);
      }
      if (!/来自对比篮|返回对比篮/.test(body)) {
        throw new Error('对象区缺少对比篮来源提示（来自对比篮 / 返回对比篮）');
      }
  - note: 3、「开始分析」可点击
    assert: |-
      if (!globalThis.__func02409_ready) throw new Error('前置：未进入配置页');
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 10000 });
      const disabled = await start.isDisabled().catch(() => true);
      if (disabled) throw new Error('开始分析按钮不可用');
      const cls = (await start.getAttribute('class')) || '';
      if (/disabled|arco-btn-disabled/.test(cls)) throw new Error('开始分析带 disabled 态');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；history 筛已完成且企业摘要含中文公司名→点列表「按此配置新建」（非结果页「按此配置新建分析」）→当前分析配置+对象区带回企业+开始分析 enabled；不验自动开任务。无行→ENV-PAIN-NO-REBUILD-ROW-001。配置页 CTA「返回对比篮」。A 档零 allow_skip。
