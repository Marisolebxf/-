id: FUNC-02407
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02407
priority: P0
title: 处理中任务点继续查看后回到生成中页
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: A
preconditions:
  - 最近分析中有一条状态为处理中的痛点任务（assert 自含：无则重新分析→稍后查看兜底）
locators:
  continue_btn: button「继续查看」
  later: button「稍后查看」
  cancel: button「取消任务」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 最近分析→点该行「继续查看」；三条预期在 expect
expect:
  - note: 前置：定位处理中行并点击「继续查看」
    assert: |-
      page.setDefaultTimeout(20000);
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const historyRoute = painRoute + '&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
      const procHint = /企业发展痛?点分析生成中|可视化分析过程/;
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(350);
      };
      const openHistory = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        await scrollHistoryActions();
      };
      const openRecentTab = async () => {
        const tab = page.getByRole('tab', { name: '最近分析' }).first();
        if (await tab.isVisible().catch(() => false)) {
          await tab.click({ timeout: 8000, force: true });
          await page.waitForTimeout(900);
        } else {
          await openHistory();
        }
      };
      const readTaskHint = async () => {
        const u = page.url();
        const fromUrl = (u.match(/task_id=([^&]+)/) || [])[1];
        if (fromUrl) return decodeURIComponent(fromUrl);
        const body = await main().innerText().catch(() => '');
        const m = body.match(TID_RE);
        return m ? m[0] : null;
      };
      const inProcess = async () => procHint.test(await main().innerText().catch(() => '')) && /view=processing/.test(page.url());
      const waitLaterBtn = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          const b = page.getByRole('button', { name: '稍后查看', exact: true });
          if ((await b.count()) && (await b.first().isVisible().catch(() => false))) return b.first();
          if (!(await inProcess())) break;
          await page.waitForTimeout(250);
        }
        return null;
      };
      const findContinueRow = async (taskHint) => {
        await scrollHistoryActions();
        const n = await main().locator(rowSel).count();
        for (let i = 0; i < n; i++) {
          const row = main().locator(rowSel).nth(i);
          const txt = await row.innerText().catch(() => '');
          if (taskHint && !txt.includes(taskHint)) continue;
          if (taskHint && !/处理中/.test(txt)) continue;
          if (!taskHint && (!/处理中/.test(txt) || !/企业发展痛点分析/.test(txt))) continue;
          const cont = row.getByRole('button', { name: '继续查看', exact: true }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          return { cont, taskHint: taskHint || (txt.match(TID_RE) || [])[0], rowText: txt };
        }
        return null;
      };
      const pollContinueRow = async (taskHint, ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          const hit = await findContinueRow(taskHint);
          if (hit) return hit;
          await page.waitForTimeout(600);
          if (!/view=history/.test(page.url())) await openRecentTab();
          else await scrollHistoryActions();
        }
        return null;
      };
      const hasReanalyzeResult = async () => {
        const t = await main().innerText().catch(() => '');
        if (/企业发展痛点分析生成中/.test(t) && !/对象与诊断摘要/.test(t)) return false;
        return (
          (await page.getByText('对象与诊断摘要').first().isVisible().catch(() => false)) &&
          (await page.getByRole('button', { name: '重新分析' }).first().isVisible().catch(() => false))
        );
      };
      const openSuccessFromHistory = async () => {
        await openHistory();
        const n = await main().locator(rowSel).count();
        for (let i = 0; i < n; i++) {
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          for (const label of ['恢复结果', '预览结果']) {
            const btn = row.getByRole('button', { name: label }).first();
            if (!(await btn.count())) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
            await page.waitForTimeout(800);
            if (await hasReanalyzeResult()) return true;
          }
        }
        return false;
      };
      const seedProcessingViaReanalyze = async () => {
        if (!(await openSuccessFromHistory()) && !(await hasReanalyzeResult())) {
          throw new Error('ENV-PAIN-NO-RESTORE-ROW-001：无已完成可恢复行，无法造处理中任务');
        }
        const reBtn = main().getByRole('button', { name: '重新分析', exact: true }).first();
        await expect(reBtn).toBeVisible({ timeout: 8000 });
        await reBtn.click({ timeout: 15000 });
        for (let i = 0; i < 24; i++) {
          await page.waitForTimeout(i < 4 ? 400 : 500);
          if (await inProcess()) break;
        }
        if (!(await inProcess())) {
          throw new Error('ENV-PAIN-PROCESS-WINDOW-001：重新分析瞬时完成，未见过程窗');
        }
        const taskHint = await readTaskHint();
        const later = await waitLaterBtn(45000);
        if (!later) throw new Error('ENV-PAIN-PROCESS-WINDOW-001：过程页未见可点「稍后查看」');
        try {
          await later.click({ timeout: 12000 });
        } catch {
          await later.click({ timeout: 12000, force: true });
        }
        await page.waitForTimeout(1200);
        if (/view=processing/.test(page.url()) && procHint.test(await main().innerText().catch(() => ''))) {
          throw new Error('点稍后查看后仍停留生成中页');
        }
        if (!/view=history/.test(page.url())) await openRecentTab();
        const hit = await pollContinueRow(taskHint, 20000);
        if (!hit) {
          throw new Error('ENV-PAIN-NO-PROCESSING-ROW-001：稍后查看后最近分析无「处理中+继续查看」行');
        }
        return hit;
      };
      await openHistory();
      let hit = await findContinueRow(null);
      if (!hit) hit = await seedProcessingViaReanalyze();
      if (hit.rowText && !/处理中/.test(hit.rowText)) {
        throw new Error('任务行状态非「处理中」：' + hit.rowText.replace(/\s+/g, ' ').slice(0, 180));
      }
      globalThis.__func02407_tid = hit.taskHint;
      await hit.cont.scrollIntoViewIfNeeded().catch(() => {});
      try {
        await hit.cont.click({ timeout: 10000 });
      } catch {
        await hit.cont.click({ timeout: 10000, force: true });
      }
      await page.waitForTimeout(1200);
      globalThis.__func02407_ready = true;
  - note: 1、回到「企业发展痛点分析生成中」
    assert: |-
      if (!globalThis.__func02407_ready) throw new Error('前置：未点击继续查看');
      const main = page.locator('main.content-shell-layout, main').first();
      const body = await main.innerText().catch(() => '');
      if (/分析失败/.test(body) && !/生成中/.test(body)) {
        throw new Error('ENV-PAIN-NEWTASK-FAIL-001：继续查看后进入失败页而非生成中');
      }
      await expect(main.getByText('企业发展痛点分析生成中').first()).toBeVisible({ timeout: 12000 });
      if (!/view=processing/.test(page.url()) && !/企业发展痛点分析生成中/.test(body)) {
        throw new Error('继续查看后未回到过程页：' + page.url());
      }
  - note: 2、页面有「取消任务」
    assert: |-
      if (!globalThis.__func02407_ready) throw new Error('前置：未点击继续查看');
      await expect(page.getByRole('button', { name: '取消任务' }).first()).toBeVisible({ timeout: 8000 });
  - note: 3、页面有「稍后查看」
    assert: |-
      if (!globalThis.__func02407_ready) throw new Error('前置：未点击继续查看');
      await expect(page.getByRole('button', { name: '稍后查看' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；goto view=history。前置=列表「处理中+继续查看」或恢复已完成→重新分析→稍后查看+按 task_id 轮询造行。步骤=点「继续查看」。机检=生成中标题+取消任务+稍后查看。D4·2026-10-20 rewrite-FUNC-02407 svcz 4/4 expect 绿。无行→ENV-PAIN-NO-PROCESSING-ROW-001；无过程窗→ENV-PAIN-PROCESS-WINDOW-001。登录关评审 runner 前置。A 档零 allow_skip。
