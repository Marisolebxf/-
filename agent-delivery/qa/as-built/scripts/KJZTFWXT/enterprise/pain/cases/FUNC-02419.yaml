id: FUNC-02419
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02419
priority: P0
title: 空问题清单仍保留创建报告
story: US-ENT-RISK-PAIN
entry_id: ent-pain
tier: A
preconditions:
  - 已打开四维均为数据不足的成功结果（assert 自含：最近分析→恢复四维全「数据不足，暂不判断」且无命中项的任务）
locators:
  section_problem: 问题清单
  section_report: 发展痛难点分析建议报告
  create_report: button「创建报告」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 阅读问题清单和报告区（前置在 expect 自含）
expect:
  - note: 前置：四维均为数据不足的成功结果页已打开
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const fourDimSlice = (body) => {
        const start = body.indexOf('四维诊断');
        if (start < 0) return '';
        const tailMarkers = ['共性问题 Top 5', '问题清单', '发展痛难点分析建议报告'];
        let end = body.length;
        for (const m of tailMarkers) {
          const i = body.indexOf(m, start + 4);
          if (i >= 0 && i < end) end = i;
        }
        return body.slice(start, end);
      };
      const problemSlice = (body) => {
        const start = body.indexOf('问题清单');
        if (start < 0) return '';
        const tailMarkers = ['发展痛难点分析建议报告', '重新分析', '按此配置新建分析'];
        let end = body.length;
        for (const m of tailMarkers) {
          const i = body.indexOf(m, start + 4);
          if (i >= 0 && i < end) end = i;
        }
        return body.slice(start, end);
      };
      const reportSlice = (body) => {
        const start = body.indexOf('发展痛难点分析建议报告');
        if (start < 0) return '';
        return body.slice(start, start + 600);
      };
      const cardText = (slice, dim, dims) => {
        const i = slice.indexOf(dim);
        if (i < 0) return '';
        let end = slice.length;
        for (const d of dims) {
          if (d === dim) continue;
          const j = slice.indexOf(d, i + dim.length);
          if (j >= 0 && j < end) end = j;
        }
        return slice.slice(i, end);
      };
      const allDimsInsufficient = (slice) => {
        const dims = ['技术研发', '市场拓展', '融资', '管理'];
        for (const d of dims) {
          const card = cardText(slice, d, dims);
          if (!card) return false;
          if (/\d+\s*项/.test(card)) return false;
          if (!/数据不足/.test(card) || !/数据不足，暂不判断/.test(card)) return false;
        }
        return true;
      };
      const ensureResultBody = async () => {
        const tabCurrent = page.getByRole('tab', { name: '当前分析' });
        if (await tabCurrent.count()) {
          await tabCurrent.first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(2500);
        }
        await page.getByText('四维诊断').first().waitFor({ state: 'visible', timeout: 20000 }).catch(() => {});
        const body = await main().innerText().catch(() => '');
        if (!/四维诊断/.test(body)) {
          throw new Error('ENV-PAIN-RESULT-SHELL-001：恢复后结果区未加载（无四维诊断）');
        }
        return body;
      };
      const rowOpenControl = (row, label) =>
        row
          .getByRole('button', { name: label })
          .or(row.getByRole('link', { name: label }))
          .first();
      const openResultFromRow = async (row) => {
        for (const label of ['预览结果', '恢复结果']) {
          const btn = rowOpenControl(row, label);
          if (!(await btn.count())) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          return label;
        }
        return '';
      };
      const openAllInsufficientResult = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await closeBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const n = await main().locator(rowSel).count();
        if (!n) throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
        let shellSkips = 0;
        for (let i = 0; i < n; i++) {
          if (i > 0) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);
            await closeBasket();
          }
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          const via = await openResultFromRow(row);
          if (!via) continue;
          let body = '';
          try {
            body = await ensureResultBody();
          } catch (e) {
            if (String(e.message || e).includes('ENV-PAIN-RESULT-SHELL-001')) {
              shellSkips++;
              continue;
            }
            throw e;
          }
          const dimSlice = fourDimSlice(body);
          if (!dimSlice || !allDimsInsufficient(dimSlice)) continue;
          globalThis.__func02419 = {
            ready: true,
            body,
            problemSlice: problemSlice(body),
            reportSlice: reportSlice(body),
          };
          return;
        }
        if (shellSkips > 0 && shellSkips >= n - 1) {
          throw new Error('ENV-PAIN-RESULT-SHELL-001：恢复结果后主区未加载（仅返回配置壳层）');
        }
        throw new Error('ENV-PAIN-NO-ALL-INSUFF-001：历史中无四维均为数据不足的成功结果');
      };
      await openAllInsufficientResult();
      await expect(page.getByText('四维诊断').first()).toBeVisible({ timeout: 15000 });
  - note: 1、问题清单显示「当前维度没有可展示的共性问题」
    assert: |-
      const ctx = globalThis.__func02419;
      if (!ctx || !ctx.ready) throw new Error('前置：未到四维全数据不足结果页');
      let slice = ctx.problemSlice || '';
      if (!slice || slice.length < 8) {
        const body = await page.locator('main.content-shell-layout, main').first().innerText().catch(() => '');
        const start = body.indexOf('问题清单');
        slice = start >= 0 ? body.slice(start, start + 800) : body;
      }
      if (!/当前维度没有可展示的共性问题/.test(slice)) {
        throw new Error('问题清单未见空态文案「当前维度没有可展示的共性问题」：' + slice.slice(0, 220));
      }
      await expect(page.getByText('当前维度没有可展示的共性问题').first()).toBeVisible({ timeout: 8000 });
  - note: 2、报告区仍有「创建报告」
    assert: |-
      const ctx = globalThis.__func02419;
      if (!ctx || !ctx.ready) throw new Error('前置：未到四维全数据不足结果页');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const createBtn = main().getByRole('button', { name: '创建报告', exact: true });
      if (!(await createBtn.count())) {
        throw new Error('ENV-PAIN-NO-CREATE-REPORT-001：报告区未见「创建报告」');
      }
      await expect(createBtn.first()).toBeVisible({ timeout: 8000 });
      await expect(createBtn.first()).toBeEnabled({ timeout: 8000 });
  - note: 3、报告状态为「未创建」
    assert: |-
      const ctx = globalThis.__func02419;
      if (!ctx || !ctx.ready) throw new Error('前置：未到四维全数据不足结果页');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const sec = main()
        .locator('section, [class*="SectionPanel"], div')
        .filter({ hasText: '发展痛难点分析建议报告' })
        .first();
      let t = '';
      if (await sec.count()) {
        t = await sec.innerText().catch(() => '');
      } else {
        t = ctx.reportSlice || (await main().innerText().catch(() => ''));
      }
      if (!/发展痛难点分析建议报告/.test(t)) {
        throw new Error('未见报告区标题');
      }
      if (!/未创建/.test(t)) {
        throw new Error('报告区状态非「未创建」：' + t.slice(0, 280));
      }
      if (/已生成|生成中/.test(t)) {
        throw new Error('报告区不应为已生成/生成中：' + t.slice(0, 280));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz；view=history→已完成行预览/恢复→切「当前分析」进结果（edu 壳层需切 Tab，同 02396）。四维均「数据不足，暂不判断」且无命中项。机检=问题清单空态文案+「创建报告」+报告「未创建」。无全不足→ENV-PAIN-NO-ALL-INSUFF-001(blocked)；壳层→ENV-PAIN-RESULT-SHELL-001(blocked)。
