id: FUNC-02395
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02395
priority: P1
tier: B
title: 主流程-四维诊断
entry_id: ent-pain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk
  - action: click
    target: 企业发展痛难点分析
  - action: wait
    timeout_ms: 800
  - action: click
    target: 前往对比篮选择企业
  - action: wait
    timeout_ms: 1000
  - action: evaluate
    target: page.locator('.arco-modal .arco-table-body .arco-checkbox').first().click()
  - action: click
    target: 确定
  - action: wait
    timeout_ms: 800
  - action: click
    target: 开始分析
  - action: wait
    target: 四维诊断
    timeout: 180000
expect:
  - note: 1、四张卡标题为技术研发、市场拓展、融资、管理
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByRole('heading', { name: '四维诊断' })).toBeVisible();
      const body = await main.innerText();
      const start = body.indexOf('四维诊断');
      if (start < 0) throw new Error('未见四维诊断区块');
      let end = body.length;
      for (const m of ['共性问题 Top 5', '问题清单', '发展痛难点分析建议报告']) {
        const i = body.indexOf(m, start + 4);
        if (i >= 0 && i < end) end = i;
      }
      const slice = body.slice(start, end);
      for (const d of ['技术研发', '市场拓展', '融资', '管理']) {
        if (!slice.includes(d)) throw new Error('四维诊断区未见维度卡标题：' + d);
      }
  - note: 2、数据不足的卡显示「数据不足，暂不判断」
    assert: |-
      const main = page.locator('main').first();
      const body = await main.innerText();
      const start = body.indexOf('四维诊断');
      if (start < 0) throw new Error('未见四维诊断区块');
      let end = body.length;
      for (const m of ['共性问题 Top 5', '问题清单', '发展痛难点分析建议报告']) {
        const i = body.indexOf(m, start + 4);
        if (i >= 0 && i < end) end = i;
      }
      const slice = body.slice(start, end);
      if (!/数据不足，暂不判断/.test(slice)) {
        throw new Error('四维诊断区未见「数据不足，暂不判断」');
      }
      await expect(main.getByText('数据不足，暂不判断').first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
