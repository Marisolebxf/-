id: FUNC-02395
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02395
priority: P0
title: 数据不足的维度卡显示暂不判断
story: US-ENT-RISK-PAIN
entry_id: ent-pain
tier: A
preconditions:
  - 已打开四维里存在数据不足的成功结果（assert 自含：最近分析→恢复含「数据不足，暂不判断」的任务）
locators:
  section: 四维诊断
  open_result: button「预览结果」或「恢复结果」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 阅读「四维诊断」（前置在 expect 自含）
expect:
  - note: 前置：成功结果页已打开且四维区含至少一张数据不足卡
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const fourDimSlice = (body) => {
        const start = body.indexOf('四维诊断');
        if (start < 0) return '';
        const tailMarkers = ['共性问题 Top 5', '问题清单', '发展痛难点分析建议报告'];
        let end = body.length;
        for (const m of tailMarkers) {
          const i = body.indexOf(m, start + 4);
          if (i >= 0 && i < end) end = i;
        }
        return body.slice(start, end);
      };
      const rowOpenControl = (row, label) =>
        row
          .getByRole('button', { name: label })
          .or(row.getByRole('link', { name: label }))
          .first();
      const openResultFromRow = async (row) => {
        for (const label of ['预览结果', '恢复结果']) {
          const btn = rowOpenControl(row, label);
          if (!(await btn.count())) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
          await page.getByText('四维诊断').first().waitFor({ state: 'visible', timeout: 20000 }).catch(() => {});
          await page.waitForTimeout(800);
          return label;
        }
        return '';
      };
      const openViaHistoryRestore = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await closeBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const rows = main().locator(rowSel);
        const n = await rows.count();
        if (!n) throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
        for (let i = 0; i < n; i++) {
          if (i > 0) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);
            await closeBasket();
          }
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          const via = await openResultFromRow(row);
          if (!via) continue;
          const body = await main().innerText().catch(() => '');
          if (/view=result/.test(page.url()) && body.length < 80 && !/四维诊断/.test(body)) {
            throw new Error('ENV-PAIN-RESULT-SHELL-001：恢复结果后主区未加载（仅返回配置壳层）');
          }
          const slice = fourDimSlice(body);
          if (!slice || !/数据不足，暂不判断/.test(slice)) continue;
          globalThis.__func02395_slice = slice;
          globalThis.__func02395_ready = true;
          return;
        }
        throw new Error('ENV-PAIN-NO-INSUFF-DIM-001：历史中无含「数据不足，暂不判断」的成功结果');
      };
      await openViaHistoryRestore();
      await expect(page.getByText('四维诊断').first()).toBeVisible({ timeout: 15000 });
  - note: 1、四张卡标题为技术研发、市场拓展、融资、管理
    assert: |-
      if (!globalThis.__func02395_ready) throw new Error('前置：未到含数据不足的四维结果页');
      const slice = globalThis.__func02395_slice || '';
      for (const d of ['技术研发', '市场拓展', '融资', '管理']) {
        if (!slice.includes(d)) throw new Error('四维诊断区未见维度卡标题：' + d);
      }
  - note: 2、数据不足的卡显示「数据不足，暂不判断」
    assert: |-
      if (!globalThis.__func02395_ready) throw new Error('前置：未到含数据不足的四维结果页');
      const slice = globalThis.__func02395_slice || '';
      const dims = ['技术研发', '市场拓展', '融资', '管理'];
      const cardText = (dim) => {
        const i = slice.indexOf(dim);
        if (i < 0) return '';
        let end = slice.length;
        for (const d of dims) {
          if (d === dim) continue;
          const j = slice.indexOf(d, i + dim.length);
          if (j >= 0 && j < end) end = j;
        }
        return slice.slice(i, end);
      };
      let sawInsufficient = false;
      for (const d of dims) {
        const card = cardText(d);
        if (!card) throw new Error('无法切分维度卡：' + d);
        const isHit = /\d+\s*项/.test(card);
        const isInsufficient = /数据不足/.test(card) && !isHit;
        if (isInsufficient) {
          sawInsufficient = true;
          if (!/数据不足，暂不判断/.test(card)) {
            throw new Error('数据不足维度卡未见「数据不足，暂不判断」：' + d);
          }
        }
      }
      if (!sawInsufficient) throw new Error('前置：四维区未识别到数据不足维度卡');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz；view=history→已完成行「预览结果/恢复结果/link」→等 view=result+「四维诊断」。机检四标题+数据不足卡必含「数据不足，暂不判断」。2026-10-20 edu 实勘：恢复 RISK-20260910-002 后主区仅「返回配置」壳层→ENV-PAIN-RESULT-SHELL-001(blocked)。无数据不足样本→ENV-PAIN-NO-INSUFF-DIM-001。
