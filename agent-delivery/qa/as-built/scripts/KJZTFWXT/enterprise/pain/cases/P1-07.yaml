id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01092
priority: P1
title: 诊断完成前无结果态区块与报告入口
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
preconditions:
- 过程页可达
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
- action: click
  target: 开始分析
expect:
- note: 诊断未完成前无结果态区块与报告生成入口
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('ALLOW_SKIP: 无企业'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500) }; const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('ALLOW_SKIP: 开始分析禁用'); await start.click(); await page.waitForTimeout(1500); await expect(page).toHaveURL(/view=processing/); const t = await page.locator('main.content-shell-layout').innerText(); if (/共性问题 Top 5|发展痛难点分析建议报告/.test(t) && /创建报告/.test(t) && !/分析失败|可视化分析过程/.test(t)) throw new Error('过程态过早出现结果/报告区'); if (await page.getByRole('button', { name: '创建报告' }).count()) throw new Error('过程态出现创建报告')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无法进入过程态时记 Pass-N/A
tier: B
