id: FUNC-02414
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02414
priority: P1
title: 新增名单中打开详情后看到画像三块摘要
story: US-ENT-RISK-OBJECT
entry_id: ent-pain
tier: B
preconditions:
  - 已打开新增企业名单（assert 自含：选择分析企业→新增）
locators:
  overlay_title: 选择分析企业
  add_modal: data-testid=compare-basket-add-modal
  row_detail: button「详情」
  profile_drawer: .arco-drawer:visible 标题含「企业画像快览」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points
  - action: evaluate
    note: 选择分析企业→新增→点首行「详情」；快览三块摘要与名称在 expect 判定
expect:
  - note: 1、打开「企业画像快览」
    assert: |-
      const route = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') +
        (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const openPicker = async () => {
        const main = page.locator('main.content-shell-layout, main').first();
        const adjustBtn = main.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await adjustBtn.isVisible().catch(() => false)) {
          await adjustBtn.click({ timeout: 8000 });
        } else {
          await expect(emptyCta).toBeVisible({ timeout: 8000 });
          await emptyCta.click({ timeout: 8000 });
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 10000 });
      };
      const openAddEnterpriseModal = async (panel) => {
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
        const addBtn = (await workspace.count())
          ? workspace.getByRole('button', { name: '新增', exact: true })
          : panel.getByRole('button', { name: '新增', exact: true });
        await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
        const recommendWait = page
          .waitForResponse((r) => /recommend/i.test(r.url()) && r.request().method() === 'POST', { timeout: 25000 })
          .catch(() => null);
        await addBtn.first().click({ timeout: 8000 });
        await recommendWait;
        await page.waitForTimeout(500);
        const modalRoot = page.locator('[data-testid="compare-basket-add-modal"]').last();
        await expect(modalRoot).toBeVisible({ timeout: 15000 });
        await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
        const loadFail = modalRoot.getByText('名单读取失败', { exact: false });
        if (await loadFail.count() && (await loadFail.first().isVisible().catch(() => false))) {
          throw new Error('新增企业推荐接口失败（名单读取失败）');
        }
        const emptyHint = modalRoot.getByText('暂无对象', { exact: true });
        if (await emptyHint.count() && (await emptyHint.first().isVisible().catch(() => false))) {
          throw new Error('ENV-PAIN-ADD-LIST-EMPTY-001：新增企业名单为空');
        }
        return modalRoot;
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await closeBasket();
      await openPicker();
      const panel = page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      await expect(panel).toBeVisible({ timeout: 10000 });
      const modalRoot = await openAddEnterpriseModal(panel);
      const detailBtns = modalRoot.getByRole('button', { name: '详情', exact: true });
      await expect(detailBtns.first()).toBeVisible({ timeout: 20000 });
      const firstDetail = detailBtns.first();
      const row = firstDetail.locator('xpath=ancestor::tr[1]');
      const entName = ((await row.locator('td').first().innerText()) || '').trim();
      if (!entName) throw new Error('无法读取详情行企业名称');
      globalThis.__func02414_ent = entName;
      await firstDetail.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await expect(modalRoot).toBeHidden({ timeout: 10000 });
      const quickDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      const onDetailDeepLink =
        /\/development\/enterprise\//.test(page.url()) || /\/enterprise-center\/enterprise\//.test(page.url());
      const wrongDetailDrawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业详情' }).last();
      const hasQuick = (await quickDrawer.count()) && (await quickDrawer.isVisible().catch(() => false));
      if (!hasQuick) {
        const hasWrongDetail =
          (await wrongDetailDrawer.count()) && (await wrongDetailDrawer.isVisible().catch(() => false));
        if (onDetailDeepLink || hasWrongDetail) {
          throw new Error(
            'D3·用例要求「新增企业」详情打开「企业画像快览」；现场为详情深链/「企业详情」抽屉。url=' + page.url(),
          );
        }
        throw new Error('点击「详情」后未出现「企业画像快览」抽屉；url=' + page.url());
      }
      await expect(quickDrawer.locator('.arco-drawer-header, .arco-drawer-title').first()).toContainText('企业画像快览');
      globalThis.__func02414_quickOpen = true;
  - note: 2、快览含基础摘要、竞争力摘要、风险摘要
    assert: |-
      if (!globalThis.__func02414_quickOpen) throw new Error('前置：企业画像快览未打开');
      const drawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('基础摘要', { exact: true })).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('竞争力摘要', { exact: true })).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('风险摘要', { exact: true })).toBeVisible({ timeout: 8000 });
  - note: 3、快览上的企业名称与该行一致
    assert: |-
      if (!globalThis.__func02414_quickOpen) throw new Error('前置：企业画像快览未打开');
      const entName = globalThis.__func02414_ent || '';
      if (!entName) throw new Error('未记录列表行企业名称');
      const drawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const drawerText = (await drawer.innerText().catch(() => '')) || '';
      const shortName = (name) => {
        const s = String(name || '').trim();
        if (s.length <= 4) return s;
        return s.slice(0, Math.min(8, s.length));
      };
      const needle = shortName(entName);
      if (needle && !drawerText.includes(needle)) {
        throw new Error('画像快览未含所选企业「' + entName + '」（片段「' + needle + '」）');
      }
      if (!drawerText.includes(entName) && needle.length >= 4) {
        const alt = entName.replace(/\s+/g, '');
        const altText = drawerText.replace(/\s+/g, '');
        if (!altText.includes(alt)) {
          throw new Error('画像快览企业名与列表行不一致：行=' + entName);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk + workspace=pain-points&tab=pain-points。步骤=选择分析企业→「新增」推荐名单→首行「详情」；机检=弹层关闭+「企业画像快览」+三块摘要+企业名与行一致（对齐 search 01472 / key-domain 01730）。名单空→ENV-PAIN-ADD-LIST-EMPTY-001；详情跳深链/企业详情→D3 fail。登录与关评审由 runner 前置。B 档。
