id: FUNC-02414
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02414
priority: P1
tier: B
title: 备选-企业画像三块摘要
entry_id: ent-pain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk
  - action: evaluate
    note: 同册02388打开选择分析企业并进入新增企业名单后点击一行详情
expect:
  - note: 1、打开「企业画像快览」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      await page.goto(origin + painRoute, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 15000 });
      await page.waitForTimeout(600);
      const modal = page.locator('.arco-modal, .arco-drawer').filter({ hasText: '选择分析企业' }).last();
      await expect(modal).toBeVisible({ timeout: 10000 });
      const newTab = modal.getByRole('tab', { name: /^新增$/ }).first();
      if (!(await newTab.count())) {
        const alt = modal.getByText(/^新增$/).first();
        if (await alt.count()) await alt.click({ timeout: 8000 });
      } else {
        await newTab.click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      let detailBtn = modal.getByRole('button', { name: '详情' });
      if ((await detailBtn.count()) < 1) {
        detailBtn = modal.getByRole('button', { name: '查看画像' });
      }
      if ((await detailBtn.count()) < 1) {
        const body = await modal.innerText().catch(() => '');
        if (/暂无|没有.*企业|名单为空|0\s*家/.test(body)) throw new Error('ENV-PAIN-ADD-LIST-EMPTY-001');
        throw new Error('ENV-PAIN-ADD-LIST-EMPTY-001');
      }
      const row = detailBtn.first().locator('xpath=ancestor::tr | ancestor::li[contains(@class,\"list\")] | ancestor::div[contains(@class,\"item\")]').first();
      let rowName = '';
      if (await row.count()) {
        const txt = ((await row.innerText()) || '').replace(/\s+/g, ' ').trim();
        const m = txt.match(/[\u4e00-\u9fa5（）()·A-Za-z0-9]{2,60}有限公司/);
        rowName = m ? m[0] : '';
      }
      globalThis.__FUNC02414_ROW_NAME__ = rowName;
      await detailBtn.first().click({ timeout: 12000 });
      await page.waitForTimeout(500);
      await expect(page.getByText('企业画像快览').first()).toBeVisible({ timeout: 15000 });
  - note: 2、快览含基础摘要、竞争力摘要、风险摘要
    assert: |-
      const panel = page.locator('.arco-drawer, .arco-modal').filter({ hasText: '企业画像快览' }).last();
      await expect(panel.getByText('基础摘要').first()).toBeVisible({ timeout: 8000 });
      await expect(panel.getByText('竞争力摘要').first()).toBeVisible({ timeout: 8000 });
      await expect(panel.getByText('风险摘要').first()).toBeVisible({ timeout: 8000 });
  - note: 3、快览上的企业名称与该行一致
    assert: |-
      const name = globalThis.__FUNC02414_ROW_NAME__;
      if (!name) throw new Error('blocked:修订 未捕获名单行企业名称');
      const panel = page.locator('.arco-drawer, .arco-modal').filter({ hasText: '企业画像快览' }).last();
      await expect(panel.getByText(name, { exact: false }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
