id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01088
priority: P1
title: 六家以上对象按快照顺序显示前三家且其余收纳
story: US-ENT-RISK-OBJECT
entry_id: ent-pain
preconditions:
- 已带入 ≥6 家对象
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
expect:
- note: 对象区按快照顺序显示前三家
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; if (!(await page.getByText(/管理全部对象/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); const n = Math.min(await sels.count(), 6); if (n < 6) throw new Error('ALLOW_SKIP: 不足 6 家'); for (let i = 0; i < n; i++) await sels.nth(i).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2000) }; await expect(page.getByText(/来自对比篮 · 6 家/).first()).toBeVisible({ timeout: 8000 })
- note: 其余对象收纳进「管理全部对象」入口
  assert: 'await expect(page.getByText(/管理全部对象/).first()).toBeVisible({ timeout: 8000 })'
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 不足 6 家时记 Pass-N/A
as_built_note: 实勘摘要显前三家企业名 +「管理全部对象（6 家）」。
tier: B
