id: FUNC-02397
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02397
priority: P0
title: 问题卡片含优先级与四块说明
story: US-ENT-RISK-PAIN
entry_id: ent-pain
tier: A
preconditions:
  - 已打开问题清单非空的成功结果（assert 自含：最近分析→恢复含问题卡片的成功任务）
locators:
  section: 问题清单
  restore: button「恢复结果」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 阅读一条问题卡片（前置在 expect 自含）
expect:
  - note: 前置：成功结果页已打开且问题清单区至少一张非空问题卡
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitResultShell = async () => {
        const hasSummary = async () => {
          const t = await main().innerText().catch(() => '');
          return t.includes('对象与诊断摘要');
        };
        if (await hasSummary()) return;
        try {
          await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 8000 });
          return;
        } catch (_) {}
        const u = page.url();
        if (u.includes('view=history') && u.includes('task_id=')) {
          await page.goto(u.replace('view=history', 'view=result'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
          if (await hasSummary()) return;
        }
        await page.getByRole('tab', { name: '当前分析' }).click({ timeout: 4000 }).catch(async () => {
          await page.getByText('当前分析', { exact: true }).first().click({ timeout: 4000 }).catch(() => {});
        });
        await page.waitForTimeout(2000);
        await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 12000 });
      };
      const problemListSlice = (body) => {
        const markers = ['共性问题 Top 5', '问题清单'];
        let start = -1;
        for (const m of markers) {
          const i = body.indexOf(m);
          if (i >= 0 && (start < 0 || i < start)) start = i;
        }
        if (start < 0) return '';
        const end = body.indexOf('发展痛难点分析建议报告', start);
        return end >= 0 ? body.slice(start, end) : body.slice(start);
      };
      const extractFirstCard = (slice) => {
        const emptyOnly =
          slice.includes('当前维度没有可展示的共性问题') && !/阅读优先级/.test(slice);
        if (!slice || emptyOnly) return null;
        const priIdx = slice.search(/阅读优先级[：:]\s*(高|中|低)/);
        if (priIdx < 0) return null;
        const beforePri = slice.slice(0, priIdx);
        const lines = beforePri.split('\n').map((l) => l.trim()).filter(Boolean);
        const skip = new Set([
          '共性问题 Top 5',
          '问题清单',
          '全部',
          '技术研发',
          '市场拓展',
          '融资',
          '管理',
        ]);
        let title = '';
        for (let i = lines.length - 1; i >= 0; i--) {
          if (!skip.has(lines[i])) {
            title = lines[i];
            break;
          }
        }
        if (!title) return null;
        const afterPri = slice.slice(priIdx);
        const nextPri = afterPri.slice(24).search(/阅读优先级[：:]\s*(高|中|低)/);
        const cardBody = afterPri.slice(0, nextPri >= 0 ? nextPri + 24 : afterPri.length);
        return { title, card: title + '\n' + cardBody };
      };
      const rowOpenControl = (row, label) =>
        row
          .getByRole('button', { name: label })
          .or(row.getByRole('link', { name: label }))
          .first();
      const openResultFromRow = async (row) => {
        for (const label of ['预览结果', '恢复结果']) {
          const btn = rowOpenControl(row, label);
          if (!(await btn.count())) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          await waitResultShell();
          return label;
        }
        return '';
      };
      const openViaHistoryRestore = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await closeBasket();
        const rows = main().locator(rowSel);
        const n = await rows.count();
        if (!n) throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
        const four = ['命中依据', '成因', '行业最佳实践', '解决方向'];
        for (let i = 0; i < n; i++) {
          const rowText = await rows.nth(i).innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          if (i > 0) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);
            await closeBasket();
          }
          const row = main().locator(rowSel).nth(i);
          const via = await openResultFromRow(row);
          if (!via) continue;
          const body = await main().innerText().catch(() => '');
          const slice = problemListSlice(body);
          const parsed = extractFirstCard(slice);
          if (!parsed) continue;
          if (!four.every((k) => parsed.card.includes(k))) continue;
          globalThis.__func02397_ready = true;
          globalThis.__func02397_title = parsed.title;
          globalThis.__func02397_card = parsed.card;
          return;
        }
        throw new Error('ENV-PAIN-NO-PROBLEM-CARD-001：历史中无含问题卡片的成功结果');
      };
      await openViaHistoryRestore();
      await expect(page.getByText(/问题清单|共性问题 Top 5/).first()).toBeVisible({ timeout: 15000 });
  - note: 1、卡片含问题标题、阅读优先级、影响家数、典型企业
    assert: |-
      if (!globalThis.__func02397_ready) throw new Error('前置：未到含问题卡的结果页');
      const card = globalThis.__func02397_card || '';
      const title = globalThis.__func02397_title || '';
      if (!title || title.length < 2) throw new Error('问题卡片未见问题标题');
      if (!/阅读优先级[：:]\s*(高|中|低)/.test(card)) {
        throw new Error('问题卡片未见阅读优先级（高/中/低）');
      }
      if (!/影响\s*\d+\s*家/.test(card)) {
        throw new Error('问题卡片未见影响家数（影响 N 家）');
      }
      if (!/典型企业/.test(card)) {
        throw new Error('问题卡片未见典型企业');
      }
  - note: 2、卡片含命中依据、成因、行业最佳实践、解决方向
    assert: |-
      if (!globalThis.__func02397_ready) throw new Error('前置：未到含问题卡的结果页');
      const card = globalThis.__func02397_card || '';
      for (const k of ['命中依据', '成因', '行业最佳实践', '解决方向']) {
        if (!card.includes(k)) throw new Error('问题卡片缺四块标题：' + k);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz；最近分析已完成行「预览结果/恢复结果」→ wait 对象与诊断摘要（必要时 view=result 深链或切「当前分析」）。机检一条问题卡：标题+阅读优先级+影响家数+典型企业+四块标题直接展开。无历史/无问题卡→ENV-PAIN-HISTORY-EMPTY-001 / ENV-PAIN-NO-PROBLEM-CARD-001(blocked)。
