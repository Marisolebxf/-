id: FUNC-02396
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02396
priority: P0
title: 有命中的维度卡展示项数优先级与影响家数
story: US-ENT-RISK-PAIN
entry_id: ent-pain
tier: A
preconditions:
  - 已打开至少一维有命中项的成功结果（assert 自含：最近分析→恢复→当前分析，四维区含「N 项」）
locators:
  section: 四维诊断
  open_result: button「预览结果」或「恢复结果」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 阅读有命中项的维度卡（前置在 expect 自含）
expect:
  - note: 前置：成功结果页已打开且四维区至少一张有命中维度卡
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const fourDimSlice = (body) => {
        const start = body.indexOf('四维诊断');
        if (start < 0) return '';
        const tailMarkers = ['共性问题 Top 5', '问题清单', '发展痛难点分析建议报告'];
        let end = body.length;
        for (const m of tailMarkers) {
          const i = body.indexOf(m, start + 4);
          if (i >= 0 && i < end) end = i;
        }
        return body.slice(start, end);
      };
      const cardText = (slice, dim, dims) => {
        const i = slice.indexOf(dim);
        if (i < 0) return '';
        let end = slice.length;
        for (const d of dims) {
          if (d === dim) continue;
          const j = slice.indexOf(d, i + dim.length);
          if (j >= 0 && j < end) end = j;
        }
        return slice.slice(i, end);
      };
      const ensureResultBody = async () => {
        const tabCurrent = page.getByRole('tab', { name: '当前分析' });
        if (await tabCurrent.count()) {
          await tabCurrent.first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(2500);
        }
        await page.getByText('四维诊断').first().waitFor({ timeout: 20000 }).catch(() => {});
        const body = await main().innerText().catch(() => '');
        if (!/四维诊断/.test(body)) {
          throw new Error('ENV-PAIN-RESULT-SHELL-001：恢复后结果区未加载（无四维诊断）');
        }
        return body;
      };
      const rowOpenControl = (row, label) =>
        row
          .getByRole('button', { name: label })
          .or(row.getByRole('link', { name: label }))
          .first();
      const openResultFromRow = async (row) => {
        for (const label of ['预览结果', '恢复结果']) {
          const btn = rowOpenControl(row, label);
          if (!(await btn.count())) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          return label;
        }
        return '';
      };
      const openViaHistoryRestore = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await closeBasket();
        const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
        const rows = main().locator(rowSel);
        const n = await rows.count();
        if (!n) throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
        const dims = ['技术研发', '市场拓展', '融资', '管理'];
        for (let i = 0; i < n; i++) {
          if (i > 0) {
            await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);
            await closeBasket();
          }
          const row = main().locator(rowSel).nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          const via = await openResultFromRow(row);
          if (!via) continue;
          const body = await ensureResultBody();
          const slice = fourDimSlice(body);
          if (!slice) continue;
          for (const d of dims) {
            const card = cardText(slice, d, dims);
            if (!card || /数据不足，暂不判断/.test(card)) continue;
            if (!/\d+\s*项/.test(card)) continue;
            globalThis.__func02396_slice = slice;
            globalThis.__func02396_hitDim = d;
            globalThis.__func02396_hitCard = card;
            globalThis.__func02396_ready = true;
            return;
          }
        }
        throw new Error('ENV-PAIN-NO-HIT-DIM-001：历史中无含命中项的四维成功结果');
      };
      await openViaHistoryRestore();
      await expect(page.getByText('四维诊断').first()).toBeVisible({ timeout: 15000 });
  - note: 1、该卡展示项数与优先级
    assert: |-
      if (!globalThis.__func02396_ready) throw new Error('前置：未到含命中维度卡的结果页');
      const card = globalThis.__func02396_hitCard || '';
      const dim = globalThis.__func02396_hitDim || '';
      if (!/\d+\s*项/.test(card)) throw new Error('有命中维度卡未见项数（N 项）：' + dim);
      if (!/(高|中|低)/.test(card)) throw new Error('有命中维度卡未见优先级（高/中/低）：' + dim);
  - note: 2、该卡展示影响家数
    assert: |-
      if (!globalThis.__func02396_ready) throw new Error('前置：未到含命中维度卡的结果页');
      const card = globalThis.__func02396_hitCard || '';
      const dim = globalThis.__func02396_hitDim || '';
      if (!/影响\s*\d+\s*家/.test(card)) {
        throw new Error('有命中维度卡未见影响家数（影响 N 家）：' + dim);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz；最近分析→已完成行「预览结果/恢复结果」→切「当前分析」进 view=result（edu 仅改 query 时主区仍为空壳，需切 Tab）。机检命中维卡同卡含 N 项、优先级、影响 N 家。无列表/结果未加载/无命中样本→ENV-PAIN-HISTORY-EMPTY-001 / ENV-PAIN-RESULT-SHELL-001 / ENV-PAIN-NO-HIT-DIM-001(blocked)。
