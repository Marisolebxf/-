id: FUNC-02405
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02405
priority: P0
title: 已完成任务点恢复结果后打开该次结果
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: A
preconditions:
  - 最近分析中有一条已完成的痛点任务且企业摘要非「—」（assert 自含）
locators:
  restore: button「恢复结果」
  summary: 对象与诊断摘要
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 点击该行「恢复结果」（前置与判定在 expect 自含）
expect:
  - note: 1、打开该任务的结果页
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const pickEntSummaryFromRow = (rowText) => {
        const lines = rowText
          .split('\n')
          .map((s) => s.trim())
          .filter(Boolean);
        const dateIdx = lines.findIndex((l) => /^\d{4}-\d{2}-\d{2}/.test(l));
        if (dateIdx > 0) {
          const cand = lines[dateIdx - 1];
          if (cand && !/^企业发展痛点分析$/.test(cand) && !/^RISK-/.test(cand)) return cand;
        }
        const m = rowText.match(/企业发展痛点分析[\s\S]*?\n([^\n]+)\n\s*\d{4}-\d{2}-\d{2}/);
        return m && m[1] ? m[1].trim() : '';
      };
      const isInvalidRowSummary = (s) => !s || /^[—–\-－]+$/.test(s) || s === '—';
      const summarySliceFromBody = (body) => {
        const i = body.indexOf('对象与诊断摘要');
        return i >= 0 ? body.slice(i, i + 900) : '';
      };
      const pickAnalysisObject = (slice) => {
        const m = slice.match(/分析对象[：:]\s*([^\n]+)/);
        return m && m[1] ? m[1].trim() : '';
      };
      const ensureResultLoaded = async () => {
        const tabCurrent = page.getByRole('tab', { name: '当前分析' });
        if (await tabCurrent.count()) {
          await tabCurrent.first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(2500);
        }
        await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 20000 });
        const body = await main().innerText().catch(() => '');
        if (!/对象与诊断摘要/.test(body)) {
          throw new Error('ENV-PAIN-RESULT-SHELL-001：恢复结果后主区未加载结果页');
        }
        return body;
      };
      const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
      let opened = false;
      await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      await closeBasket();
      const n = await main().locator(rowSel).count();
      if (!n) throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
      for (let i = 0; i < n; i++) {
        if (i > 0) {
          await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await closeBasket();
        }
        const row = main().locator(rowSel).nth(i);
        const rowText = await row.innerText().catch(() => '');
        if (!/已完成/.test(rowText)) continue;
        const rowEnt = pickEntSummaryFromRow(rowText);
        if (isInvalidRowSummary(rowEnt)) continue;
        const restore = row.getByRole('button', { name: '恢复结果' }).first();
        if (!(await restore.count())) continue;
        await restore.scrollIntoViewIfNeeded().catch(() => {});
        await restore.click({ timeout: 8000 });
        await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
        await page.waitForTimeout(1200);
        let body = '';
        try {
          body = await ensureResultLoaded();
        } catch (e) {
          if (String(e.message || e).includes('ENV-PAIN-RESULT-SHELL-001')) continue;
          throw e;
        }
        globalThis.__func02405_rowEnt = rowEnt;
        globalThis.__func02405_analysisObj = pickAnalysisObject(summarySliceFromBody(body));
        globalThis.__func02405_ready = true;
        opened = true;
        break;
      }
      if (!opened) {
        throw new Error('ENV-PAIN-NO-RESTORE-ROW-001：无「已完成+恢复结果+有效企业摘要」行可测');
      }
      await expect(page.getByText('对象与诊断摘要').first()).toBeVisible({ timeout: 10000 });
  - note: 2、摘要中的企业与该行企业摘要一致
    assert: |-
      if (!globalThis.__func02405_ready) throw new Error('前置：未打开恢复结果页');
      const rowEnt = globalThis.__func02405_rowEnt || '';
      const analysisObj = globalThis.__func02405_analysisObj || '';
      if (!rowEnt) throw new Error('前置：未记录列表企业摘要');
      if (!analysisObj) throw new Error('对象与诊断摘要区未见分析对象取值');
      const leadFromRow = rowEnt.replace(/等\s*\d+\s*家.*$/, '').trim();
      const parts = rowEnt
        .split(/[、，,]/)
        .map((s) => s.replace(/等\s*\d+\s*家.*$/, '').trim())
        .filter((s) => s && !/^[—–\-－]+$/.test(s));
      const hitLead = leadFromRow && analysisObj.includes(leadFromRow);
      const hitAllParts = parts.length > 0 && parts.every((p) => analysisObj.includes(p));
      const hitCollection = /等\s*\d+\s*家/.test(rowEnt) && hitLead && (/等\s*\d+\s*家/.test(analysisObj) || hitAllParts);
      const hitMulti = parts.length >= 2 && parts.filter((p) => analysisObj.includes(p)).length >= 2;
      const hitSingle = parts.length === 1 && analysisObj.includes(parts[0]);
      if (!(hitSingle || hitMulti || hitCollection || (hitLead && analysisObj.includes(rowEnt.slice(0, Math.min(12, rowEnt.length)))))) {
        throw new Error('摘要分析对象与列表企业摘要不一致：行=' + rowEnt + '；摘要=' + analysisObj);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；goto view=history→筛已完成且企业摘要≠「—」→仅点「恢复结果」→切「当前分析」等对象与诊断摘要。机检结果页+分析对象与行企业摘要一致。无行→ENV-PAIN-NO-RESTORE-ROW-001；壳层→ENV-PAIN-RESULT-SHELL-001(skip行)。A 档零 allow_skip。
