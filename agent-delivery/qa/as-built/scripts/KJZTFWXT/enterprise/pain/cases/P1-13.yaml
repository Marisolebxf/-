id: P1-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01098
priority: P1
title: 最近分析列出痛难点任务且恢复复用同一任务不新建
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
preconditions:
- 已完成至少 1 次痛点分析
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
- action: click
  target: 恢复结果
expect:
- note: 任务列表含任务标识、分析类型、对象、时间与状态类字段
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=pain-points&tab=pain-points&view=history', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; const t = await page.locator('main.content-shell-layout').innerText(); for (const h of ['任务名称','分析类型','企业摘要','创建时间','状态']) { if (!t.includes(h)) throw new Error('缺列表列: ' + h) }; if (!/RISK-\d{8}-\d{3}/.test(t)) throw new Error('未见 RISK 任务标识')
- note: 任务类型字段可辨识痛难点任务（口径与发起弹窗一致）
  assert: 'await expect(page.getByText(''企业发展痛点分析'').first()).toBeVisible({ timeout: 8000 })'
- note: 恢复已完成任务复用同一任务不新建任务不覆盖旧任务快照
  assert: |-
    const before = await page.locator('main.content-shell-layout').innerText(); const id = (before.match(/RISK-\d{8}-\d{3}/) || [])[0]; const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无已完成可恢复'); await restore.first().click(); await page.waitForTimeout(3000); await expect(page).toHaveURL(/view=result/); if (id && !page.url().includes(id.replace('RISK-', 'RISK-')) && !page.url().includes(id)) { const t = await page.locator('main.content-shell-layout').innerText(); if (!t.includes(id)) throw new Error('恢复后未见原任务 ID') }; await expect(page).toHaveURL(/task_id=/)
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无历史任务时记 Pass-N/A
as_built_note: 类型列文案「企业发展痛点分析」；失败任务可「继续查看」。
tier: B
