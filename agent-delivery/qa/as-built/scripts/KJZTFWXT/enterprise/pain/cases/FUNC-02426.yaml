id: FUNC-02426
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02426
priority: P0
title: 结果页按此配置新建分析回到配置并带回对象与维度
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: A
preconditions:
  - 已打开一条成功结果（assert 自含：最近分析→恢复/预览已完成行）
locators:
  rebuild_result: button「按此配置新建分析」
  start: button「开始分析」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 成功结果页点「按此配置新建分析」；三条预期在 expect
expect:
  - note: 前置打开成功结果并点击「按此配置新建分析」
    assert: |-
      const painRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const historyRoute = painRoute + '&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const ALL_DIMS = ['技术研发', '市场拓展', '融资', '管理'];
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseSummaryMeta = (body) => {
        const objM = body.match(/分析对象[：:]\s*([^\n]+)/);
        const objLine = objM ? objM[1].trim() : '';
        const dimM = body.match(/诊断维度[：:]\s*([^\n]+)/);
        const dims = dimM
          ? dimM[1]
              .split(/[、，,]/)
              .map((s) => s.trim())
              .filter((d) => ALL_DIMS.includes(d))
          : [];
        let entCount = 0;
        const leadNames = [];
        if (/等\s*(\d+)\s*家/.test(objLine)) {
          entCount = parseInt(objLine.match(/等\s*(\d+)\s*家/)[1], 10);
          leadNames.push(objLine.replace(/等\s*\d+\s*家.*$/, '').split(/[、，,]/)[0].trim());
        } else if (objLine) {
          const parts = objLine.split(/[、，,]/).map((s) => s.trim()).filter(Boolean);
          entCount = parts.length;
          leadNames.push(...parts);
        }
        return { objLine, dims, entCount, leadNames };
      };
      const rowOpenControl = (row, label) =>
        row
          .getByRole('button', { name: label })
          .or(row.getByRole('link', { name: label }))
          .first();
      const isSuccessResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        if (/企业发展痛点分析生成中|可视化分析过程/.test(t) && !/对象与诊断摘要/.test(t)) return false;
        return await page.getByText('对象与诊断摘要').first().isVisible().catch(() => false);
      };
      const pickEntSummaryFromRow = (rowText) => {
        const lines = rowText
          .split('\n')
          .map((s) => s.trim())
          .filter(Boolean);
        const dateIdx = lines.findIndex((l) => /^\d{4}-\d{2}-\d{2}/.test(l));
        if (dateIdx > 0) {
          const cand = lines[dateIdx - 1];
          if (cand && !/^企业发展痛点分析$/.test(cand) && !/^RISK-/.test(cand)) return cand;
        }
        return '';
      };
      const isSingleCompanyRow = (s) => {
        if (!s || /[、，,]/.test(s) || /等\s*\d+\s*家/.test(s)) return false;
        if (/^[0-9a-f]{32}$/i.test(s.replace(/\s+/g, ''))) return false;
        return /[\u4e00-\u9fff]/.test(s) && /公司|集团|股份|科技|服务|有限/.test(s);
      };
      const openResultFromRow = async (row) => {
        for (const label of ['预览结果', '恢复结果']) {
          const btn = rowOpenControl(row, label);
          if (!(await btn.count())) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForURL(/view=result|task_id=/, { timeout: 15000 }).catch(() => {});
          await page.getByText('对象与诊断摘要').first().waitFor({ state: 'visible', timeout: 20000 }).catch(() => {});
          await page.waitForTimeout(800);
          if (await isSuccessResult()) return label;
        }
        return '';
      };
      const rowSel = '.arco-table-body .arco-table-tr, tbody tr';
      let opened = false;
      await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      await closeBasket();
      const n = await main().locator(rowSel).count();
      if (!n) throw new Error('ENV-PAIN-HISTORY-EMPTY-001：最近分析列表为空');
      const tryOrder = [];
      for (let i = 0; i < n; i++) tryOrder.push({ i, single: false });
      for (let i = 0; i < n; i++) {
        const row = main().locator(rowSel).nth(i);
        const rowText = await row.innerText().catch(() => '');
        if (/已完成/.test(rowText) && isSingleCompanyRow(pickEntSummaryFromRow(rowText))) {
          tryOrder.unshift({ i, single: true });
        }
      }
      const seen = new Set();
      const ordered = tryOrder.filter((x) => {
        if (seen.has(x.i)) return false;
        seen.add(x.i);
        return true;
      });
      for (const { i } of ordered) {
        if (opened) break;
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const row = main().locator(rowSel).nth(i);
        const rowText = await row.innerText().catch(() => '');
        if (!/已完成/.test(rowText)) continue;
        const via = await openResultFromRow(row);
        if (!via) continue;
        const body = await main().innerText().catch(() => '');
        if (/view=result/.test(page.url()) && body.length < 80 && !/对象与诊断摘要/.test(body)) {
          throw new Error('ENV-PAIN-RESULT-SHELL-001：结果页主区未加载');
        }
        const meta = parseSummaryMeta(body);
        if (!meta.objLine || meta.entCount < 1) continue;
        if (!meta.dims.length) continue;
        const rebuild = main().getByRole('button', { name: '按此配置新建分析', exact: true }).first();
        if (!(await rebuild.count()) || !(await rebuild.isVisible().catch(() => false))) continue;
        await rebuild.scrollIntoViewIfNeeded().catch(() => {});
        await rebuild.click({ timeout: 10000 });
        await page.waitForTimeout(2000);
        const tabCurrent = page.getByRole('tab', { name: '当前分析' });
        if (await tabCurrent.count()) {
          await tabCurrent.first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
        }
        const url = page.url();
        if (/view=processing|view=result/.test(url)) {
          throw new Error('结果页按此配置新建分析后不应仍停留在过程/结果 URL：' + url);
        }
        globalThis.__func02426 = { ready: true, meta, resultBody: body };
        opened = true;
      }
      if (!opened) {
        throw new Error('ENV-PAIN-NO-RESULT-REBUILD-001：无已完成成功结果或结果页无「按此配置新建分析」');
      }
      await expect(page.getByRole('tab', { name: '当前分析' }).first()).toBeVisible({ timeout: 10000 });
  - note: 1、进入当前分析配置
    assert: |-
      const ctx = globalThis.__func02426;
      if (!ctx || !ctx.ready) throw new Error('前置：未从结果页回到配置');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const url = page.url();
      if (/view=processing|view=result/.test(url)) {
        throw new Error('仍在过程/结果视图，非当前分析配置：' + url);
      }
      const body = await main().innerText().catch(() => '');
      if (!/诊断范围|数据与权限预检/.test(body)) {
        throw new Error('配置页缺诊断范围/预检区');
      }
      await expect(main().getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 10000 });
  - note: 2、对象区仍是该次企业并显示来自对比篮家数
    assert: |-
      const ctx = globalThis.__func02426;
      if (!ctx || !ctx.ready) throw new Error('前置：未从结果页回到配置');
      const meta = ctx.meta;
      const main = () => page.locator('main.content-shell-layout, main').first();
      const n = meta.entCount || 1;
      const body = await main().innerText().catch(() => '');
      const chipRe = new RegExp('来自对比篮\\s*[·•]\\s*' + n + '\\s*家');
      const manageRe = new RegExp('管理全部对象[（(]\\s*' + n + '\\s*家[）)]');
      const validRe = new RegExp('对象有效[：:]\\s*' + n + '\\s*/\\s*' + n);
      const hasChip = chipRe.test(body) || manageRe.test(body);
      const hasBasketCta =
        /返回对比篮/.test(body) &&
        (validRe.test(body) || (await main().getByRole('button', { name: '返回对比篮' }).first().isVisible().catch(() => false)));
      if (!hasChip && !hasBasketCta) {
        throw new Error(
          '对象区缺少对比篮来源（来自对比篮·' +
            n +
            ' 家 / 管理全部对象 / 返回对比篮+对象有效）：' +
            body.slice(0, 360)
        );
      }
      if (hasChip) {
        await expect(main().getByText(chipRe).or(main().getByText(manageRe)).first()).toBeVisible({ timeout: 8000 });
      } else {
        await expect(main().getByRole('button', { name: '返回对比篮' }).first()).toBeVisible({ timeout: 8000 });
        if (!validRe.test(body)) {
          throw new Error('对象区无「对象有效：' + n + '/' + n + '」佐证家数');
        }
      }
      const leads = (meta.leadNames || []).filter(Boolean);
      if (!leads.length && meta.objLine) {
        leads.push(meta.objLine.split(/[、，,]/)[0].replace(/等\s*\d+\s*家.*$/, '').trim());
      }
      const hit = leads.some((name) => name && body.includes(name));
      if (!hit) {
        throw new Error('对象区未带回结果页企业：期望含 ' + leads.join(' / ') + '；摘要=' + meta.objLine);
      }
  - note: 3、诊断范围勾选与结果一致且开始分析可点
    assert: |-
      const ctx = globalThis.__func02426;
      if (!ctx || !ctx.ready) throw new Error('前置：未从结果页回到配置');
      const dims = ctx.meta.dims || [];
      if (!dims.length) throw new Error('前置：未记录结果页诊断维度');
      const main = () => page.locator('main.content-shell-layout, main').first();
      for (const d of dims) {
        const box = main().locator('.arco-checkbox').filter({ hasText: d }).first();
        if (!(await box.count())) throw new Error('配置页未见维度「' + d + '」');
        const cls = (await box.getAttribute('class')) || '';
        if (!/arco-checkbox-checked/.test(cls)) {
          throw new Error('维度「' + d + '」未勾选（与结果页不一致）');
        }
        await expect(box).toBeVisible({ timeout: 8000 });
      }
      const start = main().getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 10000 });
      const disabled = await start.isDisabled().catch(() => true);
      if (disabled) throw new Error('开始分析按钮不可用');
      const cls = (await start.getAttribute('class')) || '';
      if (/disabled|arco-btn-disabled/.test(cls)) throw new Error('开始分析带 disabled 态');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；history 优先单企业已完成→恢复/预览结果→结果页点「按此配置新建分析」（非列表「按此配置新建」）→当前分析配置+对象区带回企业；来源文案=「来自对比篮·N家」或（2026-10-20 实勘）「返回对比篮」+预检「对象有效：N/N」。维度与结果摘要一致+开始分析 enabled。无行/无按钮→ENV-PAIN-NO-RESULT-REBUILD-001；壳层→ENV-PAIN-RESULT-SHELL-001。登录与关评审由 runner 前置。A 档零 allow_skip。
