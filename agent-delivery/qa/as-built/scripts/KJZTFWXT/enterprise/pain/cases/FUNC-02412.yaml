id: FUNC-02412
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02412
priority: P1
title: 清空对比篮时取消篮内企业仍在
story: US-ENT-RISK-OBJECT
entry_id: ent-pain
tier: B
preconditions:
  - 选择分析企业中至少有 1 家企业（assert 自含打开浮层）
locators:
  overlay_title: 选择分析企业
  clear_basket_btn: button「清空对比篮」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points
  - action: evaluate
    note: 打开选择分析企业后点「清空对比篮」→ 弹框点「取消」；标题、说明与名单在 expect 判定
expect:
  - note: 1、弹框标题为「清空对比篮」
    assert: |-
      const route = '/enterprise/risk?workspace=pain-points&tab=pain-points';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const visiblePanel = () =>
        page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const listEnterpriseNames = async (scope) => {
        const names = [];
        const cards = scope.locator('.ent-compare-item-card');
        for (let i = 0; i < (await cards.count()); i++) {
          const card = cards.nth(i);
          if (!(await card.isVisible().catch(() => false))) continue;
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = scope.locator('[aria-label^="选择 "]');
        for (let i = 0; i < (await sels.count()); i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const overlayEnterpriseCount = async (scope) => {
        const txt = (await scope.innerText()).replace(/\s+/g, ' ');
        const m = txt.match(/企业\s*(\d+)\s*\/\s*50/);
        if (m) return parseInt(m[1], 10);
        return (await listEnterpriseNames(scope)).length;
      };
      const ensureEnterpriseInPicker = async (panel) => {
        if ((await overlayEnterpriseCount(panel)) >= 1) return;
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
        const addBtn = (await workspace.count())
          ? workspace.getByRole('button', { name: '新增', exact: true })
          : panel.getByRole('button', { name: '新增', exact: true });
        await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
        await addBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const modalRoot = page
          .locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible')
          .filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) })
          .last();
        await expect(modalRoot).toBeVisible({ timeout: 15000 });
        await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
        const joinBtns = modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(joinBtns.first()).toBeVisible({ timeout: 30000 });
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
        if ((await overlayEnterpriseCount(panel)) < 1 && (await listEnterpriseNames(panel)).length < 1) {
          throw new Error('ENV-PAIN-BASKET-EMPTY-001：对比篮无企业可选');
        }
      };
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
      const basketEntCount = async () => {
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        let m = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        if (m) return parseInt(m[1], 10);
        m = dockLabel.match(/共\s*(\d+)\s*项/);
        if (m) return parseInt(m[1], 10);
        return 0;
      };
      const seedBasketFromSearchPage = async (min) => {
        const searchInput = page
          .getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ })
          .or(page.getByPlaceholder(/企业名|产业|资质/))
          .first();
        if (await searchInput.isVisible().catch(() => false)) {
          await searchInput.fill('科技');
          const searchBtn = page.getByRole('button', { name: '搜索', exact: true }).first();
          if (await searchBtn.isVisible().catch(() => false)) {
            await searchBtn.click({ timeout: 8000 });
            await page.waitForTimeout(1500);
          }
        }
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        let n = await basketEntCount();
        for (let round = 0; round < 5 && n < min; round++) {
          const btnN = await addBtns.count();
          let clicked = 0;
          for (let i = 0; i < btnN && n < min; i++) {
            const btn = addBtns.nth(i);
            if (!(await btn.isVisible().catch(() => false))) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForTimeout(700);
            clicked++;
            n = await basketEntCount();
          }
          if (!clicked) break;
        }
        return (await basketEntCount()) >= min;
      };
      const ensureBasketEnterprises = async (min) => {
        if ((await basketEntCount()) >= min) return;
        await page.goto(toUrl('/enterprise/enterprise-search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        if (await seedBasketFromSearchPage(min)) return;
        throw new Error('ENV-PAIN-BASKET-EMPTY-001：对比篮无企业可选');
      };
      const openPicker = async () => {
        const adjustBtn = main().getByRole('button', { name: '返回对比篮调整对象', exact: true });
        const emptyCta = main().getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await adjustBtn.isVisible().catch(() => false)) {
          await adjustBtn.click({ timeout: 8000 });
        } else if (await emptyCta.isVisible().catch(() => false)) {
          await emptyCta.click({ timeout: 8000 });
        } else {
          const pickerQs =
            'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50';
          await page.goto(toUrl(`${route}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
          await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 10000 });
          return;
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 10000 });
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await closeBasket();
      await ensureBasketEnterprises(1);
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await openPicker();
      let panel = (await visiblePanel().count()) ? visiblePanel() : page.locator('body');
      if ((await listEnterpriseNames(panel)).length < 1) {
        await ensureEnterpriseInPicker(panel);
      }
      panel = (await visiblePanel().count()) ? visiblePanel() : panel;
      const beforeNames = await listEnterpriseNames(panel);
      if (beforeNames.length < 1) throw new Error('ENV-PAIN-BASKET-EMPTY-001：对比篮无企业可选');
      globalThis.__func02412_before = beforeNames;
      const clearBtn = panel.getByRole('button', { name: '清空对比篮', exact: true });
      await expect(clearBtn.first()).toBeVisible({ timeout: 8000 });
      await clearBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '清空对比篮' }).last();
      await expect(modal).toBeVisible({ timeout: 10000 });
      await expect(modal.getByText('清空对比篮', { exact: true }).first()).toBeVisible();
      globalThis.__func02412_modal = modal;
  - note: 2、弹框说明此操作不会删除企业数据
    assert: |-
      const modal = globalThis.__func02412_modal;
      if (!modal) throw new Error('前置：清空对比篮弹框未打开');
      const bodyText = (await modal.innerText()).replace(/\s+/g, ' ');
      if (!/确认清空.*篮内.*企业|清空篮内.*全部.*企业|是否清空.*篮内/.test(bodyText)) {
        throw new Error('弹框未说明将清空篮内企业，正文：' + bodyText.slice(0, 160));
      }
      if (!bodyText.includes('不会删除企业数据')) {
        throw new Error('弹框未说明不会删除企业数据，正文：' + bodyText.slice(0, 160));
      }
  - note: 3、取消后该企业仍在篮内
    assert: |-
      const beforeNames = globalThis.__func02412_before;
      const modal = globalThis.__func02412_modal;
      if (!beforeNames?.length || !modal) throw new Error('前置：弹框或篮内名单未就绪');
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 8000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const panel = (await page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).count())
        ? page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last()
        : page.locator('body');
      const afterNames = [];
      const cards = panel.locator('.ent-compare-item-card');
      for (let i = 0; i < (await cards.count()); i++) {
        const card = cards.nth(i);
        if (!(await card.isVisible().catch(() => false))) continue;
        const nameEl = card.locator('.ent-compare-item-card__name');
        const name = (await nameEl.count())
          ? (await nameEl.first().innerText()).trim()
          : (await card.innerText()).split('\n')[0].trim();
        if (name) afterNames.push(name);
      }
      if (!afterNames.length) {
        const sels = panel.locator('[aria-label^="选择 "]');
        for (let i = 0; i < (await sels.count()); i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) afterNames.push(m[1].trim());
        }
      }
      if (afterNames.length !== beforeNames.length) {
        throw new Error(`取消后篮内企业数应保持 ${beforeNames.length}，实际 ${afterNames.length}`);
      }
      for (const name of beforeNames) {
        if (!afterNames.includes(name)) {
          throw new Error('取消后企业不在篮内：' + name);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz entry-seed catalog_path=/enterprise/risk + workspace=pain-points&tab=pain-points。Modal.confirm 标题「清空对比篮」、正文含确认清空篮内企业与「不会删除企业数据」（对齐 SUPPLY FUNC-02316 / KEYDOM 01721）。前置=dock 或浮层「新增→加入对比篮」补≥1 企业后开「选择分析企业」。篮空→ENV-PAIN-BASKET-EMPTY-001。确定清空见 FUNC-02424。登录与关评审由 runner 前置。B 档零 allow_skip。
