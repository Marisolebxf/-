id: P0-12
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01078
priority: P0
title: 条件满足后开始分析可用且为配置页唯一主提交入口
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
preconditions:
- 已带入 1 家合格企业并保留维度勾选
locators:
  start: 开始分析
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points
expect:
- note: 条件满足后「开始分析」呈可用态
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(()=>false); if (vis) await close.first().click() }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('ALLOW_SKIP: 无企业'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2000) }; await expect(page.getByRole('button', { name: '开始分析' })).toBeEnabled({ timeout: 8000 })
- note: 「开始分析」为配置页唯一主提交入口，预检区与标题栏无第二提交入口
  assert: |-
    const starts = page.getByRole('button', { name: '开始分析' }); if (await starts.count() !== 1) throw new Error('开始分析按钮数量异常: ' + await starts.count()); await expect(page.getByRole('button', { name: '发起分析' })).toHaveCount(0)
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业时记 Pass-N/A
as_built_note: 配置页主提交仅「开始分析」；系统篮「发起分析」属浮层入口不在配置页主区。
tier: B
