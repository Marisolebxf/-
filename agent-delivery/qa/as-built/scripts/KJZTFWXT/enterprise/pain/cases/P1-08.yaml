id: P1-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01093
priority: P1
title: 结果态仅在勾选维度内识别问题
story: US-ENT-RISK-PAIN
entry_id: ent-pain
preconditions:
- 部分维度组合任务结果可达（环境债未补齐前 allow_skip）
steps:
- action: goto
  target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
expect:
- note: 问题仅落在发起时勾选的维度内，未勾选维度的问题不出现
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=pain-points&tab=pain-points&view=history', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无已完成任务（ticket=ENV-PAIN-PARTIAL-DIM）'); await restore.first().click(); await page.waitForTimeout(3000); const t = await page.locator('main.content-shell-layout').innerText(); const m = t.match(/诊断维度：([^\n]+)/); if (!m) throw new Error('ALLOW_SKIP: 未见诊断维度摘要，无法核部分维度任务（ticket=ENV-PAIN-PARTIAL-DIM）'); const dims = m[1].trim(); await expect(page.getByText('四维诊断').or(page.getByText('共性问题 Top 5')).first()).toBeVisible({ timeout: 8000 }); if (!/技术研发|市场拓展|融资|管理/.test(dims)) throw new Error('维度摘要异常: ' + dims); const dimParts = dims.split('、').map((s) => s.trim()).filter(Boolean); if (dimParts.length >= 4) throw new Error('ALLOW_SKIP: 历史任务为四维全开，无部分维度专属结果可核跟随（ticket=ENV-PAIN-PARTIAL-DIM）'); /* 部分维度可达时：摘要维数 <4 即视为前置满足；细粒度「未勾选维问题不出现」仍 observed，专构任务补齐后加严 */
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: true
skip_reason: 环境债 ENV-PAIN-PARTIAL-DIM——现场历史多为四维全开；用例前置「部分维度组合（如技术研发+市场拓展）发起并完成」本环境不可构造/不可恢复，无法核「未勾选维问题不出现」；禁止用全维任务假绿结果跟随
ticket: ENV-PAIN-PARTIAL-DIM
as_built_note: |-
  D4 环境债：部分维度历史结果不可达（ticket=ENV-PAIN-PARTIAL-DIM）。
  assert 用 [^\n]+ 单行字符类（禁 YAML 折行打断正则）；全维摘要 → ALLOW_SKIP，勿假绿。
  蓝本 FUNC-01093 / P1-08；B 档不进 gold。
tier: B
