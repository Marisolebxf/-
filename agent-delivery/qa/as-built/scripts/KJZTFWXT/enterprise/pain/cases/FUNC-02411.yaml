id: FUNC-02411
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02411
priority: P1
title: 最近分析超过一页时打开第二页
story: US-ENT-RISK-PROCESS
entry_id: ent-pain
tier: A
preconditions:
  - 最近分析总数大于一页（assert 自含 goto view=history）
locators:
  tab_recent: tab「最近分析」
  page2: .arco-pagination-item「2」
  type_label: 企业发展痛点分析
steps:
  - action: goto
    target: /enterprise/risk?workspace=pain-points&tab=pain-points&view=history
  - action: evaluate
    note: 最近分析点分页「2」；两条预期在 expect
expect:
  - note: 1、列表换成另一页的任务
    assert: |-
      const historyRoute = '/enterprise/risk?workspace=pain-points&tab=pain-points&view=history';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const main = () => page.locator('main.content-shell-layout, main').first();
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const historyPagination = () => main().locator('.arco-pagination').first();
      const readTotalFromPagination = async () => {
        const pg = historyPagination();
        if (!(await pg.count()) || !(await pg.isVisible().catch(() => false))) return null;
        const t = (await pg.innerText().catch(() => '')).replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const readRowTaskIds = async () => {
        const rows = main().locator('.arco-table-body .arco-table-tr, table tbody tr');
        const n = await rows.count();
        const ids = [];
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const txt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
          if (!txt || /暂无/.test(txt)) continue;
          const m = txt.match(TID_RE);
          if (m) ids.push(m[0]);
        }
        return [...new Set(ids)];
      };
      const clickPageNum = async (num) => {
        const pag = historyPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const btn = pag.locator('.arco-pagination-item').filter({ hasText: new RegExp('^\\s*' + num + '\\s*$') }).first();
        if ((await btn.count()) > 0 && (await btn.isVisible().catch(() => false))) {
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        if (num === 2) {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) && (await next.isVisible().catch(() => false))) {
            await next.click({ timeout: 8000 });
            await page.waitForTimeout(1200);
            return;
          }
        }
        throw new Error('分页「' + num + '」不可点');
      };
      await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      await closeBasket();
      await expect(page.getByRole('tab', { name: '最近分析' }).first()).toBeVisible({ timeout: 10000 });
      const histBody = await main().innerText().catch(() => '');
      if (!/任务名称|分析类型|企业摘要/.test(histBody)) {
        throw new Error('ENV-PAIN-HISTORY-SHELL-001：最近分析列表区未加载');
      }
      const totalBefore = await readTotalFromPagination();
      const pag = historyPagination();
      const page2Btn = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 = (await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false));
      const hasNext =
        (await pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').count()) > 0;
      if (!hasPage2 && !hasNext) {
        throw new Error(
          '数据闸门：分页「2」不可见，最近分析未超过一页（ticket=ENV-PAIN-HISTORY-PAGE2-001）',
        );
      }
      const idsPage1 = await readRowTaskIds();
      if (!idsPage1.length) {
        throw new Error('ENV-PAIN-HISTORY-EMPTY-001：第 1 页未见 RISK 任务行');
      }
      globalThis.__func02411_idsPage1 = idsPage1;
      await clickPageNum(2);
      const active2 = ((await pag.locator('.arco-pagination-item-active').first().innerText()) || '').trim();
      if (active2 !== '2') {
        throw new Error('翻页后当前页应为 2，现场 active=' + (active2 || '(空)'));
      }
      const idsPage2 = await readRowTaskIds();
      if (!idsPage2.length) {
        throw new Error('点击分页「2」后未见 RISK 任务行');
      }
      const sameSet =
        idsPage1.length === idsPage2.length && idsPage1.every((id) => idsPage2.includes(id));
      if (sameSet && idsPage1.length >= 1) {
        throw new Error('第 2 页任务行与第 1 页完全相同，列表未换成另一页');
      }
      globalThis.__func02411_onPage2 = true;
  - note: 2、该页分析类型仍为「企业发展痛点分析」
    assert: |-
      if (!globalThis.__func02411_onPage2) throw new Error('前置：未到第 2 页');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const rows = main().locator('.arco-table-body .arco-table-tr, table tbody tr');
      const n = await rows.count();
      let checked = 0;
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        if (!(await row.isVisible().catch(() => false))) continue;
        const txt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
        if (!txt || /暂无/.test(txt)) continue;
        if (!/RISK-\d{8}-\d{3}/.test(txt)) continue;
        checked++;
        if (!/企业发展痛点分析/.test(txt)) {
          throw new Error('第 2 页任务行分析类型不是「企业发展痛点分析」：' + txt.slice(0, 120));
        }
        if (/企业供应链关系分析|技术力评估|综合竞争力评估/.test(txt)) {
          throw new Error('第 2 页混入了非痛难点分析类型：' + txt.slice(0, 120));
        }
      }
      if (!checked) {
        throw new Error('第 2 页未找到可校验的痛点任务行');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog_path=/enterprise/risk；goto view=history→点分页「2」。机检=active=2、第2页有RISK行且与第1页任务集不同、各行含「企业发展痛点分析」。不足一页→ENV-PAIN-HISTORY-PAGE2-001。登录关评审 runner 前置。A 档零 allow_skip。
