id: FUNC-01619
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01619
priority: P1
tier: B
title: 异常-零匹配清单空态
entry_id: ent-key-type
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=type
expect:
  - note: 1、文案为「当前搜索条件无匹配企业」
    assert: |-
      async function selectHotCityBeijing(main) {
        const cascader = main.locator('.arco-cascader-view').first();
        await expect(cascader).toBeVisible({ timeout: 10000 });
        await cascader.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const popup = page.locator('.arco-cascader-popup-visible').last();
        await expect(popup).toBeVisible({ timeout: 8000 });
        await popup.getByText('全国热门科创城市', { exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await popup.getByText('北京', { exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        await page.keyboard.press('Escape');
        await page.waitForTimeout(400);
      }
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '重点企业类型分析' }).first()).toBeVisible({
        timeout: 10000,
      });
      await selectHotCityBeijing(main);
      const regionEcho = ((await main.innerText()) || '').replace(/\s+/g, ' ');
      if (!/北京/.test(regionEcho)) {
        throw new Error('区域级联未选到北京，主区未含「北京」');
      }
      const listBtn = main.getByRole('button', { name: /查看.+清单/ }).first();
      await listBtn.scrollIntoViewIfNeeded();
      const listLbl = ((await listBtn.textContent()) || '').trim();
      const countM = listLbl.match(/（(\d+)）/);
      const listN = countM ? parseInt(countM[1], 10) : null;
      if (listN !== 0) {
        throw new Error(
          'D3·选北京后清单入口为「' + listLbl + '」，用例要求零匹配（入口应为 0）',
        );
      }
      await listBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      await expect(drawer.getByText('当前搜索条件无匹配企业').first()).toBeVisible({ timeout: 8000 });
  - note: 2、来源摘要家数为 0
    assert: |-
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const block = drawer.locator('div').filter({ hasText: '企业清单来源' }).first();
      await expect(block).toBeVisible({ timeout: 8000 });
      const txt = ((await block.innerText()) || '').replace(/\s+/g, ' ');
      const m = txt.match(/共\s*(\d+)\s*家/);
      if (!m) throw new Error('来源摘要未含「共 N 家」');
      expect(parseInt(m[1], 10)).toBe(0);
on_fail: 截图 + 抄 X-Trace-Id
