id: FUNC-00388
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00388
priority: P0
title: 勾选企业类型后筛选栏回显且看板仍展示指标卡
story: US-KEYENT-01
entry_id: ent-key-type
tier: A
preconditions:
  - 企业类型筛选为「全部类型」
locators:
  type_trigger: main 内 placeholder「全部」的企业类型 .arco-select-view
  type_option_live: 下拉「高企」（用例册「高新技术企业」）
  type_tag_live: 筛选栏 tag「高企」
  kpi_section: section 含三卡 KPI
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=type&view=type
  - action: evaluate
    note: 展开企业类型下拉并勾选现场选项「高企」（用例册高新技术企业）；回显与三卡在 expect 内判定
expect:
  - note: 1、前置为「全部类型」后勾选高新技术企业（30888 现场选项与 tag 文案「高企」），筛选栏出现该类型标签
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) { await close.first().click(); await page.waitForTimeout(300); }
      }
      await page.waitForURL(/key-enterprise-analysis/, { timeout: 10000 });
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '重点企业类型分析' }).first()).toBeVisible({ timeout: 8000 });
      const typeInp = main.getByPlaceholder('全部').last();
      await expect(typeInp).toBeVisible({ timeout: 8000 });
      if (await typeInp.inputValue()) throw new Error('企业类型非默认全部类型');
      const typeView = typeInp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
      await typeView.click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const opt = page.locator('.arco-select-option').filter({ hasText: /^高企$/ }).first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      await opt.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      await page.keyboard.press('Escape');
      await page.waitForTimeout(400);
      const tag = main.locator('.arco-tag').filter({ hasText: /^高企$/ }).first();
      await expect(tag).toBeVisible({ timeout: 8000 });
  - note: 2、勾选后「类型与区域分析」三卡（匹配企业数、覆盖企业类型数、覆盖区域数）仍在且可见
    assert: |-
      const kpiSection = page.locator('section').filter({ hasText: '匹配企业数' }).filter({ hasText: '覆盖区域数' }).first();
      await expect(kpiSection).toBeVisible({ timeout: 8000 });
      const names = ['匹配企业数', '覆盖企业类型数', '覆盖区域数'];
      for (const n of names) {
        await expect(kpiSection.getByText(n, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
      const txt = ((await kpiSection.innerText()) || '').replace(/\s+/g, ' ');
      if (!/匹配企业数[\s\S]*?\d+[\s\S]*?家/.test(txt)) {
        throw new Error('匹配企业数卡缺数值或单位「家」');
      }
      if (!/覆盖企业类型数[\s\S]*?\d+[\s\S]*?类/.test(txt)) {
        throw new Error('覆盖企业类型数卡缺数值或单位「类」');
      }
      if (!/覆盖区域数[\s\S]*?\d+[\s\S]*?个/.test(txt)) {
        throw new Error('覆盖区域数卡缺数值或单位「个」');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·30888 深链 /enterprise-center/key-enterprise-analysis?workspace=type&view=type（catalog /enterprise/... 404）。用例册勾选「高新技术企业」；现场下拉选项与筛选 tag 为「高企」。企业类型 placeholder「全部」空值=全部类型。三卡区 H2「产业与企业类型筛选」。登录与关内部评审由 runner 会话前置。
