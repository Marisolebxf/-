id: FUNC-01616
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01616
priority: P1
title: 当前账号在报告中的导出按钮为禁用
story: US-KEYENT-01
entry_id: ent-key-type
tier: B
preconditions:
  - 已进入重点企业类型分析页（admin 未开通付费导出权益）
locators:
  report_btn: button「生成 / 查看报告」（页头；用例册「查看 HTML 报告」D2）
  export_btn: button「导出」（只读报告工具栏）
  back_btn: button「返回分析结果」
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=type&view=type
  - action: evaluate
    note: 点页头报告入口进入只读报告；导出禁用断言在 expect
expect:
  - note: 报告内「导出」按钮为禁用
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) { await close.first().click(); await page.waitForTimeout(300); }
      }
      await expect(page.locator('main').getByRole('heading', { name: '重点企业类型分析' }).first()).toBeVisible({ timeout: 10000 });
      const reportBtn = page.getByRole('button', { name: /查看 HTML 报告|生成\s*\/\s*查看报告/ });
      await reportBtn.first().scrollIntoViewIfNeeded();
      await reportBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const bg = page.getByRole('button', { name: '后台继续' });
      if (await bg.isVisible().catch(() => false)) {
        await bg.click({ timeout: 5000 });
        await page.waitForTimeout(300);
      }
      if (!(await page.getByText('只读报告').count())) {
        const u = new URL(page.url());
        u.searchParams.set('demo_state', 'report');
        await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(600);
      }
      await expect(page.getByText('只读报告').first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '导出' })).toBeDisabled({ timeout: 8000 });
      await page.getByRole('button', { name: '返回分析结果' }).click({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D2·30888 页头 CTA「生成 / 查看报告」；点击先出异步生成弹层（非直开 HTML），关「后台继续」后以 demo_state=report 进入只读阅读态（同 EnterpriseKeyAnalysis.openHtmlReport 路由）。导出钮文案「导出」、未付费 disabled。D1 路由 /enterprise-center/key-enterprise-analysis?workspace=type&view=type。登录与关内部评审由 runner 会话前置。
