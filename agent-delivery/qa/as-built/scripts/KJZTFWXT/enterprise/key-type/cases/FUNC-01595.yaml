id: FUNC-01595
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01595
priority: P1
tier: B
title: 清单搜索「深圳」后来源摘要家数少于搜索前
entry_id: ent-key-type
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=type
  - action: evaluate
    note: 打开企业清单并在搜索框输入「深圳」；家数对比在 expect 内
expect:
  - note: 来源摘要中的家数少于输入前
    assert: |-
      async function readSourceTotal(drawer) {
        const block = drawer.locator('div').filter({ hasText: '企业清单来源' }).first();
        await expect(block).toBeVisible({ timeout: 8000 });
        const txt = ((await block.innerText()) || '').replace(/\s+/g, ' ');
        const m = txt.match(/共\s*(\d+)\s*家/);
        if (!m) throw new Error('来源摘要未含「共 N 家」: ' + txt.slice(0, 200));
        return parseInt(m[1], 10);
      }
      async function setDrawerKeyword(drawer, keyword) {
        const inp = drawer.locator('.arco-input-search input').first();
        await expect(inp).toBeVisible({ timeout: 8000 });
        const listResp = page.waitForResponse(
          (r) =>
            r.request().method() === 'POST' &&
            /key-analysis\/enterprise-list|enterprise-list/.test(r.url()) &&
            r.status() === 200,
          { timeout: 15000 },
        );
        await inp.click();
        await inp.fill(keyword);
        const resp = await listResp.catch(() => null);
        if (resp) {
          try {
            const body = await resp.json();
            const data = body?.data ?? body;
            const t = data?.total;
            if (typeof t === 'number' && t >= 0) {
              await expect
                .poll(async () => readSourceTotal(drawer), { timeout: 8000 })
                .toBe(t);
              return t;
            }
          } catch (_) {
            /* fall through */
          }
        }
        await page.waitForTimeout(500);
        return null;
      }
      await expect(page.getByRole('heading', { name: '重点企业类型分析', level: 1 })).toBeVisible({
        timeout: 10000,
      });
      let matchCount = 0;
      try {
        await expect
          .poll(
            async () => {
              const mainTxt = ((await page.locator('main').innerText()) || '').replace(/\s+/g, ' ');
              const m = mainTxt.match(/匹配企业数\s*(\d+)\s*家/);
              return m ? parseInt(m[1], 10) : 0;
            },
            { timeout: 20000 },
          )
          .toBeGreaterThan(0);
        const mainTxt = ((await page.locator('main').innerText()) || '').replace(/\s+/g, ' ');
        const m = mainTxt.match(/匹配企业数\s*(\d+)\s*家/);
        matchCount = m ? parseInt(m[1], 10) : 0;
      } catch (_) {
        throw new Error(
          '修订 blocked：默认深圳看板匹配企业数为 0，无法构造前置「企业清单已打开且有多行」',
        );
      }
      const listBtn = page.getByRole('button', { name: /查看企业清单/ }).first();
      await listBtn.scrollIntoViewIfNeeded();
      await listBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const profiles = drawer.getByRole('button', { name: '查看画像' });
      const beforeRows = await profiles.count();
      if (beforeRows < 2) {
        throw new Error('前置不满足：企业清单需有多行，当前可见行=' + beforeRows);
      }
      const searchInp = drawer.locator('.arco-input-search input').first();
      const kwBefore = ((await searchInp.inputValue()) || '').trim();
      if (kwBefore) {
        await setDrawerKeyword(drawer, '');
        await page.waitForTimeout(400);
      }
      const baselineTotal = await readSourceTotal(drawer);
      if (baselineTotal < 2) {
        throw new Error('前置不满足：来源摘要家数需≥2，当前=' + baselineTotal);
      }
      await setDrawerKeyword(drawer, '深圳');
      const empty = drawer.getByText('当前搜索条件无匹配企业');
      if (await empty.isVisible().catch(() => false)) {
        throw new Error('搜索「深圳」后为零匹配（归 FUNC-01618）');
      }
      const afterTotal = await readSourceTotal(drawer);
      if (afterTotal >= baselineTotal) {
        throw new Error(
          '来源摘要家数未少于输入前（输入前共 ' +
            baselineTotal +
            ' 家，输入「深圳」后共 ' +
            afterTotal +
            ' 家）',
        );
      }
on_fail: 截图 + 抄 X-Trace-Id
