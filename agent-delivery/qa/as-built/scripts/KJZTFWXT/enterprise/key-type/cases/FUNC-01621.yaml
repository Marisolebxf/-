id: FUNC-01621
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01621
priority: P1
title: 关闭企业详情后企业清单抽屉仍打开
entry_id: ent-key-type
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=type
  - action: evaluate
    note: 深链进入→打开企业清单→查看画像→关闭企业详情
expect:
  - note: 1、企业详情关闭
    assert: |-
      const closeBasket = page.locator('[aria-label="关闭对比篮"]');
      if (await closeBasket.count()) {
        const vis = await closeBasket.first().isVisible().catch(() => false);
        if (vis) {
          await closeBasket.first().click();
          await page.waitForTimeout(300);
        }
      }
      await expect(page.getByRole('heading', { name: '重点企业类型分析', level: 1 })).toBeVisible({ timeout: 15000 });
      const refreshBtn = page.getByRole('button', { name: '刷新' });
      if (await refreshBtn.isVisible().catch(() => false)) {
        await refreshBtn.click({ timeout: 5000 });
        await page.waitForTimeout(1500);
      }
      await page.waitForFunction(
        () => /查看.+清单/.test(document.body.innerText) && !document.body.innerText.includes('查看企业清单（0）'),
        { timeout: 15000 },
      ).catch(() => {});
      const listBtn = page.getByRole('button', { name: /查看.+清单/ }).first();
      await listBtn.scrollIntoViewIfNeeded();
      await listBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const listDrawer = page.locator('.arco-drawer:visible').first();
      await expect(listDrawer).toBeVisible({ timeout: 8000 });
      const profiles = listDrawer.getByRole('button', { name: '查看画像' });
      if ((await profiles.count()) < 1) {
        throw new Error('前置不满足：企业清单无企业行');
      }
      await profiles.first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const detailDrawer = page.locator('.arco-drawer:visible').filter({
        has: page.locator('.arco-drawer-header').filter({ hasText: '企业详情' }),
      }).last();
      await expect(detailDrawer).toBeVisible({ timeout: 12000 });
      const closeBtn = detailDrawer.locator('.arco-drawer-close-btn').first();
      await closeBtn.scrollIntoViewIfNeeded();
      await closeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(
        page.locator('.arco-drawer:visible').filter({
          has: page.locator('.arco-drawer-header').filter({ hasText: '企业详情' }),
        }),
      ).toHaveCount(0, { timeout: 10000 });
  - note: 2、企业清单抽屉仍打开
    assert: |-
      const listDrawer = page.locator('.arco-drawer:visible').filter({
        has: page.locator('.arco-drawer-header').filter({ hasText: '企业清单' }),
      }).first();
      await expect(listDrawer).toBeVisible({ timeout: 10000 });
      await expect(
        listDrawer.getByPlaceholder('搜索企业名称、统一社会信用代码、产业或区域'),
      ).toBeVisible({ timeout: 8000 });
      await expect(listDrawer.getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
