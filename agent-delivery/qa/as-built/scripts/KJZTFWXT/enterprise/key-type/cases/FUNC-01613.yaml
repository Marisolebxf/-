id: FUNC-01613
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01613
priority: P0
title: 企业详情舆情动态页签展示舆情或空态
story: US-KEYENT-04
entry_id: ent-key-type
tier: B
preconditions:
  - 企业详情已可从清单打开
locators:
  sidebar_entry: 侧栏 link「重点企业类型分析」
  list_btn: button 文案含「查看企业清单」
  list_drawer: .arco-drawer:visible（企业清单）
  profile_btn: 清单行 button「查看画像」
  detail_drawer: .arco-drawer:visible 标题「企业详情」
  tab_news: 企业详情抽屉 tab「舆情动态」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 打开企业清单→查看画像→舆情动态；内容与标题判定在 expect 内
expect:
  - note: 内容为舆情条目或「暂无舆情」；抽屉标题仍为「企业详情」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) { await close.first().click(); await page.waitForTimeout(300); }
      }
      await page.getByRole('link', { name: '重点企业类型分析', exact: true }).click();
      await page.waitForURL(/key-enterprise-analysis/, { timeout: 10000 });
      await expect(page.getByRole('heading', { name: '重点企业类型分析', level: 1 })).toBeVisible({ timeout: 10000 });
      const listBtn = page.getByRole('button', { name: /查看.+清单/ }).first();
      await listBtn.scrollIntoViewIfNeeded();
      await listBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const listDrawer = page.locator('.arco-drawer:visible').first();
      await expect(listDrawer).toBeVisible({ timeout: 8000 });
      const profiles = listDrawer.getByRole('button', { name: '查看画像' });
      if (await profiles.count() < 1) {
        throw new Error('前置不满足：企业清单无企业行');
      }
      await profiles.first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const detailDrawer = page.locator('.arco-drawer:visible').filter({ has: page.getByRole('tab', { name: '舆情动态' }) }).first();
      await expect(detailDrawer.getByRole('tab', { name: '工商概况' })).toBeVisible({ timeout: 12000 });
      await expect(detailDrawer.locator('.arco-drawer-header-title')).toHaveText('企业详情');
      const newsTab = detailDrawer.getByRole('tab', { name: '舆情动态' });
      await expect(newsTab).toBeVisible({ timeout: 8000 });
      await newsTab.scrollIntoViewIfNeeded();
      await newsTab.click({ timeout: 8000 });
      await expect(newsTab).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(detailDrawer.locator('.arco-drawer-header-title')).toHaveText('企业详情');
      await expect(detailDrawer.locator('.arco-drawer-content').first()).toBeVisible({ timeout: 8000 });
      const emptyNews = detailDrawer.getByText('暂无舆情', { exact: true }).first();
      const newsEntry = detailDrawer.getByText(/\s·\s*\d{4}-\d{2}-\d{2}/).first();
      await expect(emptyNews.or(newsEntry)).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 企业详情抽屉内容区为 `.arco-drawer-content`（无 `.arco-drawer-body`）。舆情无数据 a-empty「暂无舆情」；有数据时条目含「来源 · YYYY-MM-DD」行。登录与关内部评审由 runner 会话前置。
