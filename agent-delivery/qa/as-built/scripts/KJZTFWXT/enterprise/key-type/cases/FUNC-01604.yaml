id: FUNC-01604
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01604
priority: P1
title: 全选当前结果后已选家数大于零且可加入对比篮
story: US-KEYENT-04
entry_id: ent-key-type
tier: B
preconditions:
  - 企业清单已打开且有企业行
locators:
  sidebar_entry: 侧栏 link「重点企业类型分析」
  list_btn: button 文案含「查看企业清单」
  drawer: .arco-drawer:visible（企业清单）
  select_all: 抽屉 footer 文案「全选当前结果」
  selected_count: 文案「已选 N 家」
  add_compare_btn: 抽屉 footer button「加入对比篮」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 打开企业清单、点全选当前结果；已选家数与加入对比篮态在 expect 内
expect:
  - note: 1、已选家数大于 0；2、「加入对比篮」可点
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) { await close.first().click(); await page.waitForTimeout(300); }
      }
      await page.getByRole('link', { name: '重点企业类型分析', exact: true }).click();
      await page.waitForURL(/key-enterprise-analysis/, { timeout: 10000 });
      await expect(page.getByRole('heading', { name: '重点企业类型分析', level: 1 })).toBeVisible({ timeout: 10000 });
      const listBtn = page.getByRole('button', { name: /查看.+清单/ }).first();
      await listBtn.scrollIntoViewIfNeeded();
      await listBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const profiles = drawer.getByRole('button', { name: '查看画像' });
      if (await profiles.count() < 1) {
        throw new Error('前置不满足：企业清单无企业行');
      }
      const footer = drawer.locator('.arco-drawer-footer').first();
      await expect(footer).toBeVisible({ timeout: 8000 });
      const selectAll = footer.getByText('全选当前结果', { exact: true });
      await expect(selectAll).toBeVisible({ timeout: 8000 });
      await selectAll.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const selectedSpan = footer.locator('span').filter({ hasText: /已选\s+\d+\s*家/ }).first();
      await expect(selectedSpan).toBeVisible({ timeout: 8000 });
      const selectedText = ((await selectedSpan.innerText()) || '').replace(/\s+/g, ' ').trim();
      const m = selectedText.match(/已选\s+(\d+)\s*家/);
      if (!m) throw new Error('未读到已选家数文案: ' + selectedText);
      const n = parseInt(m[1], 10);
      if (!(n > 0)) throw new Error('全选后已选家数未大于 0: ' + selectedText);
      const addBtn = drawer.getByRole('button', { name: '加入对比篮', exact: true });
      await expect(addBtn).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 侧栏进入 key-enterprise-analysis；抽屉 footer 控件文案「全选当前结果」（非 testdata 旧称「全选当前筛选结果」）、「已选 N 家」、「加入对比篮」。不钉死 N；取消全选见 FUNC-01620。登录与关内部评审由 runner 会话前置。
