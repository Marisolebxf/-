id: FUNC-01614
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01614
priority: P1
tier: B
title: 主流程-详情风险
entry_id: ent-key-type
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=type
  - action: click
    target: 查看企业清单
  - action: wait
    timeout_ms: 2000
  - action: click
    target: button 查看画像
  - action: wait
    timeout_ms: 1200
  - action: click
    target: tab 风险信息
  - action: wait
    timeout_ms: 800
expect:
  - note: 1、展示司法案件、失信被执行人与被执行人的计数
    assert: |-
      const root = page.locator('body');
      const genericEmpty = root.getByText('暂无数据').first();
      if (await genericEmpty.isVisible().catch(() => false)) {
        throw new Error('风险信息页签仅通用空态，无司法案件/失信被执行人/被执行人计数（D3·Q020）');
      }
      await expect(root.getByText('司法案件').first()).toBeVisible({ timeout: 10000 });
      await expect(root.getByText('失信被执行人').first()).toBeVisible({ timeout: 8000 });
      const execLabel = root.locator('text=被执行人').filter({ hasNotText: '失信' });
      await expect(execLabel.first()).toBeVisible({ timeout: 8000 });
      const digit = /\d+/;
      const riskBlock = root.locator('.arco-tabs-content').last();
      const blockText = (await riskBlock.innerText().catch(() => '')) || (await root.innerText());
      if (!digit.test(blockText) || !/司法案件/.test(blockText)) {
        throw new Error('风险信息区未见可判定的计数数字');
      }
  - note: 2、抽屉标题仍为「企业详情」
    assert: |-
      await expect(page.getByRole('heading', { name: '企业详情' }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id
