id: P0-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00387
priority: P0
title: 勾选产业后筛选栏回显且看板按新条件刷新
story: US-KEYENT-01
entry_id: ent-key-type
preconditions:
- 产业筛选为「全部产业」
locators:
  industry_input: textbox name 全部产业（下拉触发器）
  industry_option: 下拉选项 checkbox（人工智能/集成电路/生物医药 等，任一）
  tag_echo: 筛选栏已选产业标签
steps:
- action: goto
  target: /enterprise/key-enterprise-analysis?view=type
- action: click
  target: 产业下拉
- action: click
  target: 任一产业选项（默认人工智能）
- action: click
  target: 收起下拉（点击面板外或输入框）
- action: wait
  for: 看板刷新完成
expect:
- note: 筛选栏回显已选产业标签
  assert: |-
    const tag = page.locator('.arco-tag', { hasText: '人工智能' }).first(); try { await expect(tag).toBeVisible({ timeout: 3000 }) } catch { const tr = page.locator('.arco-select-view').filter({ hasText: /全部产业|人工智能/ }).first(); await tr.click({ timeout: 8000 }); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup .arco-select-option, .arco-trigger-popup li').filter({ hasText: '人工智能' }).first().click({ timeout: 8000 }); await expect(tag).toBeVisible({ timeout: 6000 }) }
- note: 看板各区块按新条件刷新
  assert: |-
    await expect(page.getByRole('heading', { name: '类型与区域分析' })).toBeVisible({ timeout: 8000 }); await page.waitForTimeout(600)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 刷新后数值 observed 记录（默认态 KPI 可为 0）。
tier: B
