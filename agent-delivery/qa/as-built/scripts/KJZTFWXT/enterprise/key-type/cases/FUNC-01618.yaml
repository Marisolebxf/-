id: FUNC-01618
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01618
priority: P1
tier: B
title: 异常-清单搜索无匹配
entry_id: ent-key-type
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=type
  - action: evaluate
    note: 打开企业清单并在搜索框输入「不存在的企业XYZ」
    script: |-
      await page.getByRole('button', { name: /查看企业清单/ }).first().click({ timeout: 10000 });
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const inp = drawer.getByPlaceholder('搜索企业名称、统一社会信用代码、产业或区域');
      await inp.fill('不存在的企业XYZ');
      await page.waitForTimeout(1000);
expect:
  - note: 1、文案为「当前搜索条件无匹配企业」
    assert: |-
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer.getByText('当前搜索条件无匹配企业')).toBeVisible({ timeout: 15000 });
  - note: 2、来源摘要家数为 0
    assert: |-
      const drawer = page.locator('.arco-drawer:visible').first();
      const block = drawer.locator('div').filter({ hasText: '企业清单来源' }).first();
      await expect(block).toBeVisible({ timeout: 8000 });
      const text = (await block.innerText()).replace(/\s+/g, ' ');
      const m = text.match(/共\s*(\d+)\s*家/);
      if (!m) throw new Error('来源摘要未解析到家数：' + text);
      if (Number(m[1]) !== 0) throw new Error('来源摘要家数为 ' + m[1] + '，预期 0');
on_fail: 截图 + 抄 X-Trace-Id
