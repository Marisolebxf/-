id: FUNC-01597
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01597
priority: P1
title: 全国下第二级的选项个数正确
story: US-KEYENT-02
entry_id: ent-key-type
tier: B
preconditions:
  - 已进入类型分析页
locators:
  filter_heading: main 内「产业与企业类型筛选」
  region_cascader_view: main 内 [aria-label="选择区域"] 或 .sci-arco-cascader .arco-cascader-view（P7）
  cascade_quanguo: 级联第一级「全国」项（非「全国热门科创城市」）
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=type&view=type
  - action: evaluate
    note: 展开区域级联并点击「全国」；第二级 32 项与附录 F 在 expect 判定
expect:
  - note: 已进入重点企业类型分析页且筛选区可见
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) { await close.first().click(); await page.waitForTimeout(300); }
      }
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '重点企业类型分析' }).first()).toBeVisible({ timeout: 10000 });
      await expect(main.getByRole('heading', { name: '产业与企业类型筛选' }).first()).toBeVisible({ timeout: 8000 });
      await expect(main.locator('input[placeholder="全国热门科创城市 / 深圳 / 全部"]')).toBeVisible({ timeout: 8000 });
      await page.waitForResponse((r) => /region-scopes/i.test(r.url()) && r.status() === 200, { timeout: 12000 }).catch(() => null);
      await page.waitForTimeout(400);
  - note: 展开「全国」后第二级共 32 项，含「中国」及附录 F 省级行政区名称
    assert: |-
      const appendixF = ['中国', '北京市', '天津市', '河北省', '山西省', '内蒙古自治区', '辽宁省', '吉林省', '黑龙江省', '上海市', '江苏省', '浙江省', '安徽省', '福建省', '江西省', '山东省', '河南省', '湖北省', '湖南省', '广东省', '广西壮族自治区', '海南省', '重庆市', '四川省', '贵州省', '云南省', '西藏自治区', '陕西省', '甘肃省', '青海省', '宁夏回族自治区', '新疆维吾尔自治区'];
      const main = page.locator('main');
      let regionView = main.locator('[aria-label="选择区域"]').first();
      if ((await main.locator('[aria-label="选择区域"]').count()) < 1) {
        regionView = main.locator('.sci-arco-cascader .arco-cascader-view').first();
      }
      await regionView.scrollIntoViewIfNeeded();
      await regionView.click({ timeout: 8000 });
      await page.waitForTimeout(700);
      let panel = page.locator('.arco-cascader-list-column').first().locator('xpath=ancestor::*[contains(@class,"arco-trigger-popup") or starts-with(@id,"arco-cascader-popup")]').first();
      if (!(await panel.isVisible().catch(() => false))) {
        const combo = main.locator('.sci-arco-cascader').first();
        const popupId = await combo.getAttribute('aria-controls');
        if (!popupId) throw new Error('区域级联未暴露 aria-controls');
        panel = page.locator('#' + popupId);
      }
      await expect(panel).toBeVisible({ timeout: 8000 });
      const firstCol = panel.locator('.arco-cascader-list-column').first();
      await expect(firstCol).toBeVisible({ timeout: 8000 });
      const quanguoItem = firstCol.locator('.arco-cascader-list-item').filter({ hasText: /^全国$/ }).first();
      if (!(await quanguoItem.count())) {
        const sample = await firstCol.locator('.arco-cascader-list-item').allTextContents();
        throw new Error('第一级未见精确「全国」项，样本=' + sample.join('|'));
      }
      await quanguoItem.click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const secondCol = panel.locator('.arco-cascader-list-column').nth(1);
      await expect(secondCol).toBeVisible({ timeout: 8000 });
      const texts = (await secondCol.locator('.arco-cascader-list-item').allTextContents())
        .map((t) => t.replace(/\s+/g, '').trim())
        .filter(Boolean);
      if (texts.length === 1 && texts[0] === '全国') {
        throw new Error('D4·30888 region-scopes 未就绪（fallback 仅 china-all），全国第二级仅 1 项，用例预期 32 项省级列表');
      }
      if (texts.length !== 32) {
        throw new Error(`全国第二级项数为 ${texts.length}，预期 32；样本=${texts.slice(0, 8).join('、')}…`);
      }
      if (!texts.some((t) => t === '中国' || t.includes('中国'))) {
        throw new Error('全国第二级未见「中国」，实际=' + texts.join('、'));
      }
      for (const name of appendixF) {
        if (!texts.some((t) => t === name || t.includes(name))) {
          throw new Error(`全国第二级未见附录F「${name}」，实际=${texts.join('、')}`);
        }
      }
      const extras = texts.filter((t) => !appendixF.some((n) => t === n || t.includes(n)));
      if (extras.length) {
        throw new Error(`全国第二级出现附录F外项：${extras.join('、')}`);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D4·30888 POST topic/v1/search/meta/region-scopes 404，前端走 regionOptions fallback（全国第二级仅「全国」1 项）；用例预期 Q056 展开后 32 省。机检跟用例册：第一级 click 精确「全国」（禁止先 hover 误读默认热门城第二列 9 项）。登录与关内部评审由 runner 会话前置。
