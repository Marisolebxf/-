id: FUNC-01597
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01597
priority: P1
tier: B
title: 全国下第二级省级选项共 32 项
entry_id: ent-key-type
preconditions:
  - 已进入类型分析页
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=type
  - action: evaluate
    note: 展开区域级联并展开「全国」
expect:
  - note: 第二级共 32 项，含「中国」及省级行政区（名称见附录 F）
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('heading', { name: '重点企业类型分析' }).first()).toBeVisible({ timeout: 15000 });
      let regionTrigger = main.locator('[aria-label="选择区域"]').first();
      if ((await regionTrigger.count()) < 1) {
        regionTrigger = main.locator('input[placeholder*="全国热门科创城市"]').first();
      }
      await regionTrigger.scrollIntoViewIfNeeded();
      await regionTrigger.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const firstCol = page.locator('.arco-cascader-list-column').first();
      await expect(firstCol).toBeVisible({ timeout: 8000 });
      const quanguo = firstCol.locator('.arco-cascader-list-item').filter({ hasText: '全国' }).first();
      await quanguo.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const secondCol = page.locator('.arco-cascader-list-column').nth(1);
      await expect(secondCol).toBeVisible({ timeout: 8000 });
      const items = secondCol.locator('.arco-cascader-list-item');
      const count = await items.count();
      if (count !== 32) {
        const sample = await items.allTextContents();
        throw new Error(`全国第二级项数为 ${count}，预期 32；样本=${sample.slice(0, 8).join('|')}…`);
      }
      const texts = (await items.allTextContents())
        .map((t) => t.replace(/\s+/g, '').trim())
        .filter(Boolean);
      const appendixF = [
        '中国', '北京市', '天津市', '河北省', '山西省', '内蒙古自治区', '辽宁省', '吉林省', '黑龙江省',
        '上海市', '江苏省', '浙江省', '安徽省', '福建省', '江西省', '山东省', '河南省', '湖北省', '湖南省',
        '广东省', '广西壮族自治区', '海南省', '重庆市', '四川省', '贵州省', '云南省', '西藏自治区',
        '陕西省', '甘肃省', '青海省', '宁夏回族自治区', '新疆维吾尔自治区',
      ];
      for (const name of appendixF) {
        if (!texts.some((t) => t === name || t.includes(name))) {
          throw new Error(`全国第二级未见「${name}」，实际=${texts.join('、')}`);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
