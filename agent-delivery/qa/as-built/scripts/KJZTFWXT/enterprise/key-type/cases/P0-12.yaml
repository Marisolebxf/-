id: P0-12
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00391
priority: P0
title: 关闭企业清单抽屉后返回看板且筛选与洞察保持
story: US-KEYENT-04
entry_id: ent-key-type
preconditions:
- 企业清单抽屉已打开（承接 P0-05 态）
locators:
  drawer_close: .arco-drawer 关闭按钮（IconClose）
  filter_bar: 类型分析筛选区
  insight: heading 区域洞察
steps:
- action: goto
  target: /enterprise/key-enterprise-analysis?view=type
- action: click
  target: 查看企业清单（N）
- action: wait
  for: 抽屉打开
- action: click
  target: 抽屉关闭按钮
- action: wait
  for: 抽屉关闭
- action: evaluate
  note: 核对仍在类型分析页、筛选条件与区域洞察保持
expect:
- note: 抽屉关闭且仍在类型分析页
  assert: |-
    await page.getByRole('button', { name: /查看企业清单（\d+）/ }).click({ timeout: 8000 }); await expect(page.locator('.arco-drawer')).toBeVisible({ timeout: 8000 }); await page.locator('.arco-drawer-close-btn, .arco-drawer .arco-icon-close').first().click({ timeout: 8000 }); await expect(page.locator('.arco-drawer')).toBeHidden({ timeout: 8000 }); await expect(page).toHaveURL(/key-enterprise-analysis/)
- note: 筛选条件与区域洞察保持
  assert: |-
    await expect(page.getByRole('heading', { name: '区域洞察' })).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('全部产业').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
