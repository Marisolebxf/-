# 重点企业类型分析 · 金样脚本（仅 P0-01～P0-05，禁止改 id）
# 全量 P0/P1：同目录 scripts.yaml + coverage.md；执行提示词 prompts/.../full.md
system: KJZTFWXT
module: enterprise
function: key-type
entry_id: ent-key-type
base_url: "http://111.198.38.90:50892/"
route: /enterprise/key-enterprise-analysis
func_prefix: ZNFWJQ-KJZTFWXT-v1.0-FUNC
fixtures: ./fixtures/testdata.yaml
usm: agent-handoffs/产品整体定义/E-20_E-22-重点企业分析/
legacy_table: qa/test-cases/KJZTFWXT/enterprise-企业分析/KEYENT-重点企业类型分析/FUNC-重点企业类型分析-用例.md

scripts:
  - id: P0-01
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00046
    priority: P0
    title: 侧栏进入类型分析，URL 含 type，不落到领域看板
    story: US-KEYENT-01
    as_built_note: |
      现场入口=侧栏两个二级，不是页内「类型/领域」Tab。
      进入后 query 常见 workspace=type 与 view=type 同时存在。
      本环境 ent_review_mode 默认可能为 true；本条末关掉，避免挡住后续业务态断言。
    preconditions:
      - 可访问 base_url
      - 使用 fixtures 账号；若已在业务页且 URL 不含 /login 则跳过登录表单
    locators:
      login_user: { role: textbox, name: 请输入用户名 }
      login_pass: { role: textbox, name: 请输入密码 }
      login_btn: { role: button, name: 登录 }
      menu_group: { text: 企业分析 }
      menu_item: { text: 重点企业类型分析 }
      heading: { role: heading, name: 重点企业类型分析 }
      filter: { role: region, name: 类型分析筛选 }
      domain_empty: { text: 尚未选择分析对象 }
      domain_cta: { text: 前往对比篮选择企业 }
      persona: { role: button, note: 顶栏人设 aria-haspopup=menu }
      review_switch: { role: switch, name: 内部评审模式 }
      close_basket: { role: button, name: 关闭对比篮 }
    steps:
      - { id: S1, action: goto, url: "/" }
      - { id: S2, action: login_if_needed }
      - { id: S3, action: click, target: menu_item, note: 若企业分析未展开先点 menu_group；不要点「重点企业领域分析」 }
      - { id: S4, action: evaluate, note: 若「关闭对比篮」可见则点掉，避免浮层挡住主区 }
      - { id: S5, action: click, target: persona }
      - { id: S6, action: evaluate, note: 若 switch「内部评审模式」aria-checked=true 再点一次关掉；已关则不动 }
      - { id: S7, action: press, key: Escape }
      - { id: S8, action: snapshot, save: snapshot.yml }
      - { id: S9, action: screenshot, save: after-land.png }
    expect:
      - URL 含 /enterprise/key-enterprise-analysis，且 query 含 view=type 或 workspace=type
      - query 不得仅为 view=domain / workspace=domain
      - H1 为「重点企业类型分析」
      - 可见 region「类型分析筛选」
      - 主区不可见「尚未选择分析对象」「待选择分析对象」「前往对比篮选择企业」
    allow_empty: false
    on_fail: 截图 + 抄 X-Trace-Id（若有网络 5xx）+ 分类 C1/C2；落到领域空态=本条 FAIL

  - id: P0-02
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00048
    priority: P0
    title: 区域/时间/产业/企业类型四组筛选默认可见，产业与类型为全部
    story: US-KEYENT-01
    depends_on: [P0-01]
    as_built_note: |
      Wireframe「重置」现场无，不测、不 Fail。
      「类型分析筛选」是 aria-label，不是可见标题文字。
      若脏会话产业仍有 tag，点 tag 上 name=Close 清回「全部产业」再断言默认。
    locators:
      filter: { role: region, name: 类型分析筛选 }
      region: { name: 选择区域, note: 筛选栏 Cascader aria-label }
      year_start: { role: textbox, name: 开始年份 }
      year_end: { role: textbox, name: 结束年份 }
      industry: { role: textbox, name: 全部产业 }
      ent_type: { role: textbox, name: 全部类型 }
    steps:
      - { id: S1, action: evaluate, note: 若产业区已有 tag，点 Close 清回全部产业；本条测默认 }
      - { id: S2, action: assert_visible, target: filter }
      - { id: S3, action: snapshot, save: snapshot.yml }
      - { id: S4, action: screenshot, save: filters-default.png }
    expect:
      - region「类型分析筛选」内四组均为上标签下控件：区域、时间、产业、企业类型
      - 区域控件 aria-label「选择区域」，展示「全国热门科创城市 / 深圳 / 全部」（文案以现场为准，不把城市全集当预期）
      - 时间：开始年份、结束年份可编辑（默认值记 observed，常见 2022–2026）
      - 产业占位「全部产业」、企业类型占位「全部类型」（未勾选即全量）
      - 无「必须先选产业/类型」阻断页或必选校验弹层
      - 不要求出现「重置」
    allow_empty: false
    on_fail: 缺一组筛选=FAIL；出现必选校验弹层=FAIL（与现场口径冲突则记 C4）

  - id: P0-03
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00053
    priority: P0
    title: 类型与区域分析三张 KPI 可见，业务态无内部编号
    story: US-KEYENT-01
    depends_on: [P0-01]
    as_built_note: |
      KPI 接口可返回 0；0 家/0 类/0 个记 observed，不 Fail。
      ⓘ / 指标未登记 / Mock 角标仅内部评审；业务态主区不得出现 metric_id、GAP-、Q0xx、Mock 字样。
      顶部无「主导类型企业数/占比」卡。
    locators:
      section: { text: 类型与区域分析 }
      kpi_match: { text: 匹配企业数 }
      kpi_types: { text: 覆盖企业类型数 }
      kpi_regions: { text: 覆盖区域数 }
    steps:
      - { id: S1, action: evaluate, note: 确认 localStorage ent_review_mode 为 false；若为 true 则走人设关掉 }
      - { id: S2, action: assert_visible, target: section }
      - { id: S3, action: screenshot, save: kpi.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
    expect:
      - 可见区块标题「类型与区域分析」
      - 三卡名称与单位：匹配企业数（家）、覆盖企业类型数（类）、覆盖区域数（个）
      - 三卡均有数值（可为 0，写入 observed，禁止把具体家数当预期）
      - 业务态主区可见纯文本不含 metric_id、GAP-、Q0xx、Mock
      - 顶部不可见「主导类型企业数」或「主导类型企业占比」卡
    allow_empty: false
    on_fail: 缺卡=FAIL；0 家升 Fail=C4（脚本/执行口径错）

  - id: P0-04
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00054
    priority: P0
    title: 空间分布默认地图，列表与地图互斥，切换不丢筛选与洞察
    story: US-KEYENT-02
    depends_on: [P0-01]
    as_built_note: |
      空表「每页10条/查看画像」暂缓，有数据才记列结构 observed。
      当前默认 0 家可走空文案「当前区域暂无可展示对象」。
    locators:
      map_view: { role: button, name: 地图视图 }
      list_view: { role: button, name: 列表视图 }
      map: { name: 重点企业空间分布地图 }
      list_empty: { text: 当前区域暂无可展示对象 }
      filter: { role: region, name: 类型分析筛选 }
      insight: { role: heading, name: 区域洞察 }
    steps:
      - { id: S1, action: assert_visible, target: map, note: 默认应为地图；若已在列表先点回地图视图再断言默认 }
      - { id: S2, action: screenshot, save: map-default.png }
      - { id: S3, action: click, target: list_view }
      - { id: S4, action: wait, ms: 800 }
      - { id: S5, action: screenshot, save: list-view.png }
      - { id: S6, action: snapshot, save: snapshot.yml }
      - { id: S7, action: click, target: map_view }
      - { id: S8, action: wait, ms: 800 }
      - { id: S9, action: screenshot, save: map-again.png }
    expect:
      - 默认地图：可见「重点企业空间分布地图」或地图工具栏；列表空文案此时不可与地图同时铺开
      - 点「列表视图」后地图容器不可见；无数据时可见「当前区域暂无可展示对象」；有数据则出对象列表（列结构记 observed，不钉死条数）
      - 列表与地图互斥，不同时铺两套主工作区
      - 切回「地图视图」后地图再现、列表空文案不再占主工作区
      - 切换后顶部「类型分析筛选」仍在，当前区域名与「区域洞察」仍在（不重置）
    allow_empty: false
    on_fail: 两套主工作区同时铺开=FAIL；切视图丢掉筛选=FAIL

  - id: P0-05
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00057
    priority: P0
    title: 企业清单抽屉：来源、搜索、空态、全选与对比篮，不跳路由
    story: US-KEYENT-04
    depends_on: [P0-01]
    as_built_note: |
      入口文案为「查看企业清单（N）」，选类型后仍可能不是「查看高企清单」。
      抽屉标题形如「{区域}企业清单」；来源含「地图当前区域」与「企业类型：全部」。
      0 条即可判；有数据时名单记 observed，不钉死公司名。
    locators:
      open_list: { role: button, name: /查看企业清单/ }
      drawer_search: { role: textbox, name: 搜索企业名称、统一社会信用代码、产业或区域 }
      drawer_empty: { text: 当前搜索条件无匹配企业 }
      select_all: { role: checkbox, name: 全选当前结果 }
      add_basket: { role: button, name: 加入对比篮 }
      open_basket: { role: button, name: 打开对比篮 }
    steps:
      - { id: S1, action: click, target: open_list }
      - { id: S2, action: wait, ms: 1200 }
      - { id: S3, action: screenshot, save: after-drawer.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
      - { id: S5, action: press, key: Escape, note: 关闭抽屉 }
      - { id: S6, action: wait, ms: 500 }
      - { id: S7, action: assert_url, url_includes: /enterprise/key-enterprise-analysis }
    expect:
      - 右侧宽抽屉出现（.arco-drawer）；不跳到其它路由
      - 在 .arco-drawer 内：标题含当前区域名与「企业清单」（不钉死「深圳」）
      - 在 .arco-drawer 内：来源摘要含「地图当前区域」与「数据更新至」
      - 在 .arco-drawer 内：搜索框占位含企业名称、统一社会信用代码、产业或区域
      - 在 .arco-drawer 内：0 条时「当前搜索条件无匹配企业」；「全选当前结果」「加入对比篮」禁用；「打开对比篮」仍可点
      - 若有数据：空态文案可不出现，名单写入 observed，不钉死公司名与家数
      - 关闭后 URL 仍含 view=type 或 workspace=type；筛选与区域洞察仍在
    allow_empty: false
    on_fail: 抽屉断言取到抽屉外节点=C4；跳路由=FAIL
