# 重点企业类型分析金样冒烟（5 条，id 锁定禁改）
# 蓝本 = 用例册 v2.0（ZNFWJQ-KJZTFWXT-v1.0-FUNC-00379~00402，24 条）
# 金样映射（任务书 D-KEYENT-1 母表锁定）：P0-01=00379 · P0-02=00380 · P0-03=00381 · P0-04=00384 · P0-05=00386
# locator 基准 = 2026-10-14 50892 实勘（侧栏两个二级入口 / 筛选四组 textbox / KPI 三卡 SECTION /
#   地图工具栏四按钮 + 显示热力 switch + 图例四级 / 返回上一级 disabled / 查看企业清单（N）button）

scripts:
  - id: P0-01
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00379
    priority: P0
    title: 侧栏进入重点企业类型分析路由与标题正确
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions:
      - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
      - 经人设面板关闭内部评审模式（默认态执行时 observed 记录）
    locators:
      menu: '菜单项「企业分析」→「重点企业类型分析」（侧栏二级；现场无页内类型/领域 Tab）'
      h1: 'heading「重点企业类型分析」（level 1）'
      filter_region: 'region「类型分析筛选」内 textbox name「全国热门科创城市 / 深圳 / 全部」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_url
        expect_contains: /enterprise/key-enterprise-analysis
      - action: assert_visible
        target: heading 重点企业类型分析
      - action: assert_visible
        target: 类型分析筛选区
    expect:
      - note: 路由为重点企业类型分析页且地址参数含 view=type 或 workspace=type
        assert: "await expect(page).toHaveURL(/view=type/)"
      - note: 页面标题为「重点企业类型分析 - 科技专题服务系统」
        assert: "await expect(page).toHaveTitle(/重点企业类型分析 - 科技专题服务系统/)"
      - note: 主区呈现类型分析筛选区
        assert: "await expect(page.locator('section[aria-label=\"类型分析筛选\"]')).toBeVisible()"
    on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
    as_built_note: 侧栏「企业分析」下两个二级（类型/领域），无页内 Tab；隔离仅本条——不把领域看板（view=domain）当断言对象。

  - id: P0-02
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00380
    priority: P0
    title: 筛选区区域时间产业企业类型四组默认值正确
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions:
      - 已登录
      - 筛选区为默认条件（脏会话先还原：重新进入页面）
    locators:
      region_input: 'textbox name「全国热门科创城市 / 深圳 / 全部」'
      start_year: 'textbox name 开始年份（value）'
      end_year: 'textbox name 结束年份（value）'
      industry_input: 'textbox name 全部产业'
      type_input: 'textbox name 全部类型'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: evaluate
        note: 不改动任何筛选，核对四组标签与默认值（结构性检查 5 点）
    expect:
      - note: 筛选区含区域、时间、产业、企业类型四组标签与控件
        assert: "for (const t of ['区域','时间','产业','企业类型']) await expect(page.getByText(t, { exact: true }).first()).toBeVisible(); await expect(page.getByPlaceholder('开始年份').first()).toBeVisible(); await expect(page.getByPlaceholder('结束年份').first()).toBeVisible()"
      - note: 区域级联默认为「全国热门科创城市 / 深圳 / 全部」
        assert: "await expect(page.locator('span.sci-arco-cascader').first()).toBeVisible(); await expect(page.locator('input[placeholder=\"全国热门科创城市 / 深圳 / 全部\"]')).toHaveCount(1)"
      - note: 开始与结束年份默认为 2022 与 2026
        assert: "const ys = page.locator('input[placeholder=开始年份], input[placeholder=结束年份]'); if (await ys.count() < 2) throw new Error('年份输入位不足: ' + await ys.count()); const vals = []; for (const yi of await ys.elementHandles()) vals.push(await yi.inputValue ? '' : ''); const v1 = await ys.nth(0).inputValue(); const v2 = await ys.nth(1).inputValue(); if (v1 !== '2022' || v2 !== '2026') throw new Error('年份默认值 ' + v1 + '/' + v2 + ' ≠ 2022/2026')"
      - note: 产业默认为「全部产业」
        assert: "await expect(page.getByPlaceholder('全部产业').first()).toBeVisible()"
      - note: 企业类型默认为「全部类型」
        assert: "await expect(page.getByPlaceholder('全部类型').first()).toBeVisible()"
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: 区域层级名称以现场为准（observed 记录）；现场无「重置」按钮不测；结构性检查允许 5 点（用例册口径）。

  - id: P0-03
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00381
    priority: P0
    title: 类型与区域分析三张指标卡构成齐备且业务态干净
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions:
      - 已进入类型分析页
      - 内部评审模式关闭
    locators:
      section: 'section/heading「类型与区域分析」'
      card1: '指标卡 匹配企业数（单位 家）'
      card2: '指标卡 覆盖企业类型数（单位 类）'
      card3: '指标卡 覆盖区域数（单位 个）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_visible
        target: 区块标题 类型与区域分析
      - action: evaluate
        note: 核对三卡名称、顺序、数值展示位与单位；扫描主区无内部编号或样例数据字样（结构性检查 4 点）
    expect:
      - note: 区块标题为「类型与区域分析」
        assert: "await expect(page.getByRole('heading', { name: '类型与区域分析' })).toBeVisible()"
      - note: 三卡依次为匹配企业数、覆盖企业类型数、覆盖区域数
        assert: "for (const n of ['匹配企业数','覆盖企业类型数','覆盖区域数']) await expect(page.getByText(n, { exact: true }).first()).toBeVisible()"
      - note: 三卡均有数值展示位且单位为家、类、个
        assert: "const cards = page.locator('.metric-card, section .ant-card, [class*=kpi]').filter({ hasText: '匹配企业数' }); const main1 = page.locator('main').first(); for (const u of ['家','类','个']) await expect(main1.getByText(u, { exact: true }).first()).toBeVisible()"
      - note: 主区无内部编号或样例数据字样
        assert: "const txt = await page.locator('main').first().innerText(); for (const t of ['Q010','Q012','Q038','M_ENT_TYPE_COUNT','M_ENT_KEYPANO','mock_20260618']) { if (txt.includes(t)) throw new Error('业务态泄漏内部字样: ' + t) }"
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: 数值可为 0 不作通过判据（本轮实勘 0/0/0，observed 记录）；业务态 KPI 无 ⓘ 属正常（说明角标门控另条 00398~00400）。

  - id: P0-04
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00384
    priority: P0
    title: 地图与列表视图互斥切换不丢失筛选与洞察
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions:
      - 已进入类型分析页
      - 空间分布为地图视图（默认态）
    locators:
      list_btn: 'button「列表视图」'
      map_btn: 'button「地图视图」'
      map_container: '地图容器（.leaflet-container 或画布区）'
      insight_section: 'section「区域洞察」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 列表视图
      - action: wait
        for: 列表视图加载
      - action: evaluate
        note: 核对地图容器不再展示（互斥）；记录列表列结构（有数据时，observed）
      - action: click
        target: 地图视图
      - action: wait
        for: 地图恢复呈现
      - action: evaluate
        note: 核对往返切换后筛选条件与区域洞察保持
    expect:
      - note: 列表视图下地图容器不再展示，两视图互斥
        assert: "await page.getByRole('button', { name: '列表视图' }).click(); await page.waitForTimeout(800); if (await page.locator('.leaflet-container').count()) throw new Error('列表视图下地图容器仍在')"
      - note: 切回地图视图后地图恢复呈现
        assert: "await page.getByRole('button', { name: '地图视图' }).click(); await expect(page.locator('.leaflet-container').first()).toBeVisible({ timeout: 8000 })"
      - note: 往返切换后筛选条件与区域洞察保持
        assert: "await expect(page.getByRole('heading', { name: '区域洞察' })).toBeVisible(); await expect(page.getByPlaceholder('全部产业').first()).toBeVisible(); await expect(page.getByPlaceholder('全部类型').first()).toBeVisible()"
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: 列表有数据时列结构 observed 记录，不钉死条数；列表空态文案另条 00402（P1-09）。

  - id: P0-05
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00386
    priority: P0
    title: 企业清单抽屉打开后标题来源摘要与搜索框构成正确
    story: US-KEYENT-04
    entry_id: ent-key-type
    preconditions:
      - 区域洞察清单入口可见
    locators:
      list_btn: 'button「查看企业清单（N）」（N 以现场为准，含 0）'
      drawer: '.arco-drawer（企业清单）'
      drawer_title: '抽屉标题（当前区域 + 企业清单」'
      search_input: 'textbox placeholder「企业名称、统一社会信用代码、产业或区域」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 查看企业清单（N）
      - action: wait
        for: .arco-drawer 可见
      - action: assert_visible
        target: 抽屉标题
      - action: assert_visible
        target: 抽屉搜索框
      - action: evaluate
        note: 核对来源摘要（地图当前区域 + 数据更新信息）；有数据时名单 observed 记录
      - action: snapshot
    expect:
      - note: 右侧抽屉打开且标题含当前区域与「企业清单」
        assert: "const drawer = page.locator('.arco-drawer:visible'); await expect(drawer.first()).toBeVisible({ timeout: 8000 }); await expect(drawer.first().getByText('企业清单').first()).toBeVisible()"
      - note: 来源摘要含地图当前区域与数据更新信息
        assert: "const d = page.locator('.arco-drawer:visible').first(); await expect(d.getByText('地图当前区域').first()).toBeVisible(); await expect(d.getByText('数据更新至').first()).toBeVisible()"
      - note: 搜索框占位为「企业名称、统一社会信用代码、产业或区域」
        assert: "const dd = page.locator('.arco-drawer:visible').first(); await expect(dd.getByText('当前搜索条件无匹配企业').first()).toBeVisible(); const ph = await dd.locator('input').first().getAttribute('placeholder'); if (!ph || !ph.includes('企业名称')) throw new Error('抽屉搜索框 placeholder 不符: ' + ph)"
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: 有数据时名单 observed 记录，不钉死公司名；空态动作另条 00401（P1-08）。
