# 重点企业类型分析全量脚本（includes 金样 5 条 + 其余 19 条 = 24 条，与用例 1:1）
# 蓝本 = 用例册 v2.0（ZNFWJQ-KJZTFWXT-v1.0-FUNC-00379~00402）；func_id 全为新号段，无 00046~00061 旧号
# 执行顺序见 prompts/KJZTFWXT/enterprise/key-type/full.md
# 通用 locators（实勘 2026-10-14）：
#   筛选四组 textbox（区域级联 / 开始年份 / 结束年份 / 全部产业 / 全部类型）
#   视图切换 button 地图视图|列表视图；工具栏 放大/缩小/刷新/全屏 + switch 显示热力（默认 checked）
#   图例「企业数量强度」低/中/高/极高；返回上一级（单城态 disabled）；查看企业清单（N）button
#   评审开关 = 右上 persona 菜单内「内部评审模式」switch（SEARCH retro R8 同款）

includes: [gold.yaml]

scripts:
  # ========== 筛选交互组（产业/类型/洞察默认态） ==========
  - id: P0-06
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00382
    priority: P0
    title: 空间分布区默认呈现地图视图且提供切换入口
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [已进入类型分析页]
    locators:
      section: 'heading「重点企业空间分布」'
      map_btn: 'button 地图视图'
      list_btn: 'button 列表视图'
      map_container: '地图容器'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_visible
        target: 区块标题 重点企业空间分布
      - action: evaluate
        note: 核对主工作区默认呈现地图而非列表
      - action: assert_visible
        target: 地图视图与列表视图切换入口
    expect:
      - note: 区块标题为「重点企业空间分布」
        assert: "await expect(page.getByRole('heading', { name: '重点企业空间分布' })).toBeVisible()"
      - note: 主工作区默认呈现地图而非列表
        assert: "await expect(page.locator('.leaflet-container').first()).toBeVisible({ timeout: 10000 })"
      - note: 提供地图视图与列表视图切换入口
        assert: "await expect(page.getByRole('button', { name: '地图视图' })).toBeVisible(); await expect(page.getByRole('button', { name: '列表视图' })).toBeVisible()"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 与 00384（P0-04）分开验收：本条只验默认态，切换行为归 P0-04；工具栏构成与图例另条 00383（P0-07）。

  - id: P0-07
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00383
    priority: P0
    title: 地图工具栏四按钮热力开关默认态与图例四级齐备
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [已进入类型分析页]
    locators:
      toolbar: 'button 放大 / 缩小 / 刷新 / 全屏'
      heat_switch: 'switch「显示热力」'
      legend: '图例「企业数量强度」：低/中/高/极高'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 地图视图
      - action: assert_visible
        target: 工具栏四按钮
      - action: evaluate
        note: 核对热力开关默认 checked 与图例四级
    expect:
      - note: 工具栏含放大、缩小、刷新、全屏四个按钮
        assert: "await expect(page.locator('.leaflet-container').first()).toBeVisible({ timeout: 10000 }); for (const b of ['放大','缩小','刷新','全屏']) await expect(page.getByRole('button', { name: b, exact: true }).first()).toBeVisible()"
      - note: 「显示热力」开关默认为开启
        assert: "await expect(page.getByText('显示热力', { exact: true }).first()).toBeVisible(); await expect(page.locator('.arco-switch-checked').first()).toBeVisible()"
      - note: 图例含低、中、高、极高四级
        assert: "await expect(page.getByText('企业数量强度').first()).toBeVisible(); for (const lv of ['低','中','高','极高']) await expect(page.getByText(lv, { exact: true }).first()).toBeVisible()"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 热力行为与缩放行为另条（00393=P1-02 / 00394=P0-13）；本条只验构成与默认态。

  - id: P0-08
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00387
    priority: P0
    title: 勾选产业后筛选栏回显且看板按新条件刷新
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [产业筛选为「全部产业」]
    locators:
      industry_input: 'textbox name 全部产业（下拉触发器）'
      industry_option: '下拉选项 checkbox（人工智能/集成电路/生物医药 等，任一）'
      tag_echo: '筛选栏已选产业标签'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 产业下拉
      - action: click
        target: 任一产业选项（默认人工智能）
      - action: click
        target: 收起下拉（点击面板外或输入框）
      - action: wait
        for: 看板刷新完成
    expect:
      - note: 筛选栏回显已选产业标签
        assert: "const tag = page.locator('.arco-tag', { hasText: '人工智能' }).first(); try { await expect(tag).toBeVisible({ timeout: 3000 }) } catch { const tr = page.locator('.arco-select-view').filter({ hasText: /全部产业|人工智能/ }).first(); await tr.click(); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup .arco-select-option, .arco-trigger-popup li').filter({ hasText: '人工智能' }).first().click(); await expect(tag).toBeVisible({ timeout: 6000 }) }"
      - note: 看板各区块按新条件刷新
        assert: "await expect(page.getByRole('heading', { name: '类型与区域分析' })).toBeVisible(); await page.waitForTimeout(600)"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 刷新后数值 observed 记录（默认态 KPI 可为 0）。

  - id: P0-09
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00388
    priority: P0
    title: 勾选企业类型后筛选栏回显且看板按新条件刷新
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [企业类型筛选为「全部类型」]
    locators:
      type_input: 'textbox name 全部类型（下拉触发器）'
      type_option: '类型选项（外资企业/高新技术企业/小微企业/上市企业/专精特新/小巨人/链主龙头）'
      tag_echo: '筛选栏已选类型标签'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 企业类型下拉
      - action: click
        target: 任一类型选项（默认高新技术企业）
      - action: wait
        for: 看板刷新完成
      - action: snapshot
        note: 顺带记录选项清单构成（七类是否齐备，缺项记开放项）
    expect:
      - note: 筛选栏回显已选类型标签
        assert: "const tag = page.locator('.arco-tag', { hasText: '高新技术企业' }).first(); try { await expect(tag).toBeVisible({ timeout: 3000 }) } catch { const tr = page.locator('.arco-select-view').filter({ hasText: /全部类型|高新技术企业/ }).first(); await tr.click(); await page.waitForTimeout(600); await page.locator('.arco-trigger-popup .arco-select-option, .arco-trigger-popup li').filter({ hasText: '高新技术企业' }).first().click(); await expect(tag).toBeVisible({ timeout: 6000 }) }"
      - note: 看板各区块按新条件刷新
        assert: "const tr2 = page.locator('.arco-select-view').filter({ hasText: /全部类型|高新技术企业/ }).first(); await tr2.click(); await page.waitForTimeout(600); const opts = page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li'); const n = await opts.count(); if (!n) throw new Error('类型选项面板未打开'); const texts = []; for (let i = 0; i < n; i++) texts.push((await opts.nth(i).textContent()).trim()); for (const need of ['外资企业','高新技术企业','小微企业','上市企业','专精特新','小巨人','链主龙头']) { if (!texts.some(t => t === need)) throw new Error('七类缺项: ' + need + '，实见 ' + texts.join('/')) } await page.keyboard.press('Escape'); await page.waitForTimeout(400)"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 选项含七类口径见用例备注；缺项记开放项不升 Fail（observed）。取消行为另条 00392（P1-01）。

  - id: P0-10
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00385
    priority: P0
    title: 区域洞察展示当前区域家数结构区块与清单入口
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [已进入类型分析页]
    locators:
      insight: 'heading「区域洞察」'
      current_region: '「当前区域」+ 区域名'
      count: '「N 家」家数展示'
      structure: '区块「当前区域企业类型结构」'
      list_entry: 'button「查看企业清单（N）」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_visible
        target: 区域洞察区块
      - action: evaluate
        note: 核对当前区域名、家数、结构区块、清单入口文案与数量
    expect:
      - note: 区域洞察展示当前区域名称与企业家数（单位家）
        assert: "await expect(page.getByRole('heading', { name: '区域洞察' })).toBeVisible(); await expect(page.getByText('当前区域').first()).toBeVisible()"
      - note: 「当前区域企业类型结构」区块存在
        assert: "await expect(page.getByText('当前区域企业类型结构', { exact: true }).first()).toBeVisible()"
      - note: 清单入口文案含「查看企业清单」与数量
        assert: "await expect(page.getByRole('button', { name: /查看企业清单（\\d+/ })).toBeVisible()"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 家数 observed 记录（本轮实勘 0 家）；仅深圳市单城时无同级排行与区域×类型矩阵（observed 记录，as_built 口径）。

  # ========== 区域筛选组 ==========
  - id: P0-11
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00389
    priority: P0
    title: 区域级联切换后看板按新区域刷新且其余筛选保持
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [区域级联为默认值]
    locators:
      region_input: 'textbox name「全国热门科创城市 / 深圳 / 全部」'
      cascade_first: '级联第一层选项（全国热门科创城市 等）'
      cascade_second: '级联第二层（热门城市清单）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 区域级联
      - action: click
        target: 第一层「全国热门科创城市」
      - action: click
        target: 第二层任一热门城市
      - action: wait
        for: 看板刷新完成
      - action: evaluate
        note: 核对产业/类型/年份筛选保持不变
    expect:
      - note: 第二层展示热门城市选项
        assert: "const tr = page.locator('span.sci-arco-cascader').first(); await tr.click(); await page.waitForTimeout(600); const panel = page.locator('.arco-trigger-popup:visible').filter({ hasText: '全国热门科创城市' }).last(); await expect(panel).toBeVisible({ timeout: 5000 })"
      - note: 看板各区块按新区域刷新
        assert: "const panel2 = page.locator('.arco-trigger-popup:visible').filter({ hasText: '全国热门科创城市' }).last(); const group = panel2.locator('li, [class*=cascader-list-item], [class*=cascader-option]').filter({ hasText: '全国热门科创城市' }).first(); await group.click(); await page.waitForTimeout(600); const second = page.locator('.arco-trigger-popup:visible [class*=cascader-column]').nth(1); await expect(second).toBeVisible({ timeout: 5000 }); const leaf = second.locator('li, [class*=cascader-option]').filter({ hasText: '北京' }).first(); await leaf.click(); await page.waitForTimeout(1000); await expect(page.getByRole('heading', { name: '区域洞察' })).toBeVisible()"
      - note: 其余筛选条件保持不变
        assert: "await expect(page.getByPlaceholder('全部产业').first()).toBeVisible(); await expect(page.getByPlaceholder('全部类型').first()).toBeVisible()"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 层级名称以现场为准（observed 记录）；国家→区县下钻本轮不可验收（as-built）；页内可编辑区域控件仅筛选栏一处。

  - id: P0-12
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00391
    priority: P0
    title: 关闭企业清单抽屉后返回看板且筛选与洞察保持
    story: US-KEYENT-04
    entry_id: ent-key-type
    preconditions: [企业清单抽屉已打开（承接 P0-05 态）]
    locators:
      drawer_close: '.arco-drawer 关闭按钮（IconClose）'
      filter_bar: '类型分析筛选区'
      insight: 'heading 区域洞察'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 查看企业清单（N）
      - action: wait
        for: 抽屉打开
      - action: click
        target: 抽屉关闭按钮
      - action: wait
        for: 抽屉关闭
      - action: evaluate
        note: 核对仍在类型分析页、筛选条件与区域洞察保持
    expect:
      - note: 抽屉关闭且仍在类型分析页
        assert: "await page.getByRole('button', { name: /查看企业清单（\\d+）/ }).click(); await expect(page.locator('.arco-drawer')).toBeVisible({ timeout: 8000 }); await page.locator('.arco-drawer-close-btn, .arco-drawer .arco-icon-close').first().click(); await expect(page.locator('.arco-drawer')).toBeHidden({ timeout: 8000 }); await expect(page).toHaveURL(/key-enterprise-analysis/)"
      - note: 筛选条件与区域洞察保持
        assert: "await expect(page.getByRole('heading', { name: '区域洞察' })).toBeVisible(); await expect(page.getByPlaceholder('全部产业').first()).toBeVisible()"
    on_fail: 截图 + X-Trace-Id + C1~C6

  - id: P0-13
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00394
    priority: P2
    title: 地图放大与缩小按钮可改变地图视野
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [空间分布为地图视图]
    locators:
      zoom_in: 'button 放大'
      zoom_out: 'button 缩小'
      map_view: '地图视野（.leaflet-container / zoom 状态）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 放大按钮
      - action: wait
        for: 地图动画完成
      - action: evaluate
        note: 记录放大后视野状态
      - action: click
        target: 缩小按钮
      - action: wait
        for: 地图动画完成
      - action: evaluate
        note: 记录缩小后视野状态
    expect:
      - note: 放大后地图视野较操作前放大
        assert: "const readZoom = async () => { const urls = await page.evaluate(() => Array.from(document.querySelectorAll('.leaflet-tile-loaded[src*=\\\"TILEMATRIX=\\\"]')).map(i => i.src.match(/TILEMATRIX=(\\d+)/)?.[1]).filter(Boolean)); return urls.length ? Math.max(...urls.map(Number)) : null }; const before = await readZoom(); await page.getByRole('button', { name: '放大', exact: true }).click(); await page.waitForTimeout(1200); const after = await readZoom(); if (before == null || after == null) throw new Error('瓦片 TILEMATRIX 不可读（before=' + before + ', after=' + after + '），无法核验视野变化'); if (after <= before) throw new Error('放大后未变大: ' + before + '→' + after)"
      - note: 缩小后地图视野回退
        assert: "const readZoom2 = async () => { const urls = await page.evaluate(() => Array.from(document.querySelectorAll('.leaflet-tile-loaded[src*=\\\"TILEMATRIX=\\\"]')).map(i => i.src.match(/TILEMATRIX=(\\d+)/)?.[1]).filter(Boolean)); return urls.length ? Math.max(...urls.map(Number)) : null }; const cur = await readZoom2(); await page.getByRole('button', { name: '缩小', exact: true }).click(); await page.waitForTimeout(1200); const back = await readZoom2(); if (cur == null || back == null) throw new Error('瓦片 TILEMATRIX 不可读'); if (back >= cur) throw new Error('缩小后未回退: ' + cur + '→' + back)"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 视野变化幅度 observed 记录（zoom 级数或容器 data 属性）；用例优先级 P2，脚本编号按母表 P0-13 承载（编号与优先级独立）。旧工程曾以 P0-13=00394 承载同语义（编号巧合一致）。

  - id: P0-14
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00395
    priority: P1
    title: 当前区域为深圳市时返回上一级按钮呈禁用
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [区域级联为默认「深圳」]
    locators:
      drill_up: 'button「返回上一级」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_visible
        target: 返回上一级按钮
      - action: evaluate
        note: 核对按钮 disabled 状态（当前区域=深圳市）
    expect:
      - note: 「返回上一级」按钮可见
        assert: "await expect(page.getByRole('button', { name: '返回上一级' })).toBeVisible()"
      - note: 当前区域为深圳市时该按钮为禁用状态
        assert: "await expect(page.getByRole('button', { name: '返回上一级' })).toBeDisabled()"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 国家→区县下钻本轮不可验收（覆盖矩阵未覆盖行）；单城占位徽标「深圳市」observed 记录。

  # ========== 评审模式组 ==========
  - id: P0-15
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00398
    priority: P0
    title: 内部评审模式开关联动追溯显隐且关闭后零泄漏
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [顶部人设面板「内部评审模式」开关可用]
    locators:
      persona_menu: '右上角人设按钮（persona-menu）'
      review_switch: 'switch「内部评审模式」'
      trace_badge: '需求追溯按钮与角标（页头/指标区/地图旁）'
      badge_hint: '「口径待甲方确认，当前为团队临时默认值」提示'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: evaluate
        note: 记录开关默认状态（observed）；若为开先关（业务态基准）
      - action: click
        target: 打开顶部人设面板
      - action: click
        target: 开启内部评审模式
      - action: wait
        for: 评审元素渲染
      - action: assert_visible
        target: 需求追溯按钮与角标
      - action: evaluate
        note: 核对角标含待甲方确认提示
      - action: click
        target: 关闭内部评审模式
      - action: evaluate
        note: 核对主区无追溯按钮、角标及内部编号字样
    expect:
      - note: 开启后页头、指标区与地图旁出现需求追溯按钮与角标
        assert: "const ensureReviewOn = async () => { if (await page.locator('main [aria-label*='需求追溯']').count()) return; const menuOpen = await page.locator('.persona-menu').count(); if (!menuOpen) { await page.locator('button').filter({ hasText: /创新工作台/ }).first().click(); await page.waitForTimeout(600) } const sw = page.locator('.persona-menu').last().locator('[role=switch], .arco-switch').first(); const cls = await sw.getAttribute('class'); if (!/checked/.test(cls || '')) { await sw.click(); await page.waitForTimeout(1000) } }; await ensureReviewOn(); const traceCnt = await page.locator('main [aria-label*='需求追溯']').count(); if (!traceCnt) throw new Error('评审开后 main 无需求追溯按钮')"
      - note: 角标含「口径待甲方确认，当前为团队临时默认值」提示
