# 重点企业类型分析全量脚本（includes 金样 5 条 + 其余 19 条 = 24 条，与用例 1:1）
# 蓝本 = 用例册 v2.0（ZNFWJQ-KJZTFWXT-v1.0-FUNC-00379~00402）；func_id 全为新号段，无 00046~00061 旧号
# 执行顺序见 prompts/KJZTFWXT/enterprise/key-type/full.md
# 通用 locators（实勘 2026-10-14）：
#   筛选四组 textbox（区域级联 / 开始年份 / 结束年份 / 全部产业 / 全部类型）
#   视图切换 button 地图视图|列表视图；工具栏 放大/缩小/刷新/全屏 + switch 显示热力（默认 checked）
#   图例「企业数量强度」低/中/高/极高；返回上一级（单城态 disabled）；查看企业清单（N）button
#   评审开关 = 右上 persona 菜单内「内部评审模式」switch（SEARCH retro R8 同款）

includes: [gold.yaml]

scripts:
  # ========== 筛选交互组（产业/类型/洞察默认态） ==========
  - id: P0-06
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00382
    priority: P0
    title: 空间分布区默认呈现地图视图且提供切换入口
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [已进入类型分析页]
    locators:
      section: 'heading「重点企业空间分布」'
      map_btn: 'button 地图视图'
      list_btn: 'button 列表视图'
      map_container: '地图容器'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_visible
        target: 区块标题 重点企业空间分布
      - action: evaluate
        note: 核对主工作区默认呈现地图而非列表
      - action: assert_visible
        target: 地图视图与列表视图切换入口
    expect:
      - 区块标题为「重点企业空间分布」
      - 主工作区默认呈现地图而非列表
      - 提供地图视图与列表视图切换入口
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 与 00384（P0-04）分开验收：本条只验默认态，切换行为归 P0-04；工具栏构成与图例另条 00383（P0-07）。

  - id: P0-07
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00383
    priority: P0
    title: 地图工具栏四按钮热力开关默认态与图例四级齐备
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [已进入类型分析页]
    locators:
      toolbar: 'button 放大 / 缩小 / 刷新 / 全屏'
      heat_switch: 'switch「显示热力」'
      legend: '图例「企业数量强度」：低/中/高/极高'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 地图视图
      - action: assert_visible
        target: 工具栏四按钮
      - action: evaluate
        note: 核对热力开关默认 checked 与图例四级
    expect:
      - 工具栏含放大、缩小、刷新、全屏四个按钮
      - 「显示热力」开关默认为开启
      - 图例含低、中、高、极高四级
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 热力行为与缩放行为另条（00393=P1-02 / 00394=P0-13）；本条只验构成与默认态。

  - id: P0-08
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00387
    priority: P0
    title: 勾选产业后筛选栏回显且看板按新条件刷新
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [产业筛选为「全部产业」]
    locators:
      industry_input: 'textbox name 全部产业（下拉触发器）'
      industry_option: '下拉选项 checkbox（人工智能/集成电路/生物医药 等，任一）'
      tag_echo: '筛选栏已选产业标签'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 产业下拉
      - action: click
        target: 任一产业选项（默认人工智能）
      - action: click
        target: 收起下拉（点击面板外或输入框）
      - action: wait
        for: 看板刷新完成
    expect:
      - 筛选栏回显已选产业标签
      - 看板各区块按新条件刷新
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 刷新后数值 observed 记录（默认态 KPI 可为 0）。

  - id: P0-09
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00388
    priority: P0
    title: 勾选企业类型后筛选栏回显且看板按新条件刷新
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [企业类型筛选为「全部类型」]
    locators:
      type_input: 'textbox name 全部类型（下拉触发器）'
      type_option: '类型选项（外资企业/高新技术企业/小微企业/上市企业/专精特新/小巨人/链主龙头）'
      tag_echo: '筛选栏已选类型标签'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 企业类型下拉
      - action: click
        target: 任一类型选项（默认高新技术企业）
      - action: wait
        for: 看板刷新完成
      - action: snapshot
        note: 顺带记录选项清单构成（七类是否齐备，缺项记开放项）
    expect:
      - 筛选栏回显已选类型标签
      - 看板各区块按新条件刷新
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 选项含七类口径见用例备注；缺项记开放项不升 Fail（observed）。取消行为另条 00392（P1-01）。

  - id: P0-10
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00385
    priority: P0
    title: 区域洞察展示当前区域家数结构区块与清单入口
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [已进入类型分析页]
    locators:
      insight: 'heading「区域洞察」'
      current_region: '「当前区域」+ 区域名'
      count: '「N 家」家数展示'
      structure: '区块「当前区域企业类型结构」'
      list_entry: 'button「查看企业清单（N）」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_visible
        target: 区域洞察区块
      - action: evaluate
        note: 核对当前区域名、家数、结构区块、清单入口文案与数量
    expect:
      - 区域洞察展示当前区域名称与企业家数（单位家）
      - 「当前区域企业类型结构」区块存在
      - 清单入口文案含「查看企业清单」与数量
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 家数 observed 记录（本轮实勘 0 家）；仅深圳市单城时无同级排行与区域×类型矩阵（observed 记录，as_built 口径）。

  # ========== 区域筛选组 ==========
  - id: P0-11
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00389
    priority: P0
    title: 区域级联切换后看板按新区域刷新且其余筛选保持
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [区域级联为默认值]
    locators:
      region_input: 'textbox name「全国热门科创城市 / 深圳 / 全部」'
      cascade_first: '级联第一层选项（全国热门科创城市 等）'
      cascade_second: '级联第二层（热门城市清单）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 区域级联
      - action: click
        target: 第一层「全国热门科创城市」
      - action: click
        target: 第二层任一热门城市
      - action: wait
        for: 看板刷新完成
      - action: evaluate
        note: 核对产业/类型/年份筛选保持不变
    expect:
      - 第二层展示热门城市选项
      - 看板各区块按新区域刷新
      - 其余筛选条件保持不变
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 层级名称以现场为准（observed 记录）；国家→区县下钻本轮不可验收（as_built）；页内可编辑区域控件仅筛选栏一处。

  - id: P0-12
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00391
    priority: P0
    title: 关闭企业清单抽屉后返回看板且筛选与洞察保持
    story: US-KEYENT-04
    entry_id: ent-key-type
    preconditions: [企业清单抽屉已打开（承接 P0-05 态）]
    locators:
      drawer_close: '.arco-drawer 关闭按钮（IconClose）'
      filter_bar: '类型分析筛选区'
      insight: 'heading 区域洞察'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 查看企业清单（N）
      - action: wait
        for: 抽屉打开
      - action: click
        target: 抽屉关闭按钮
      - action: wait
        for: 抽屉关闭
      - action: evaluate
        note: 核对仍在类型分析页、筛选条件与区域洞察保持
    expect:
      - 抽屉关闭且仍在类型分析页
      - 筛选条件与区域洞察保持
    on_fail: 截图 + X-Trace-Id + C1~C6

  - id: P0-13
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00394
    priority: P2
    title: 地图放大与缩小按钮可改变地图视野
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [空间分布为地图视图]
    locators:
      zoom_in: 'button 放大'
      zoom_out: 'button 缩小'
      map_view: '地图视野（.leaflet-container / zoom 状态）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 放大按钮
      - action: wait
        for: 地图动画完成
      - action: evaluate
        note: 记录放大后视野状态
      - action: click
        target: 缩小按钮
      - action: wait
        for: 地图动画完成
      - action: evaluate
        note: 记录缩小后视野状态
    expect:
      - 放大后地图视野较操作前放大
      - 缩小后地图视野回退
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 视野变化幅度 observed 记录（zoom 级数或容器 data 属性）；用例优先级 P2，脚本编号按母表 P0-13 承载（编号与优先级独立）。旧工程曾以 P0-13=00394 承载同语义（编号巧合一致）。

  - id: P0-14
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00395
    priority: P1
    title: 当前区域为深圳市时返回上一级按钮呈禁用
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [区域级联为默认「深圳」]
    locators:
      drill_up: 'button「返回上一级」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: assert_visible
        target: 返回上一级按钮
      - action: evaluate
        note: 核对按钮 disabled 状态（当前区域=深圳市）
    expect:
      - 「返回上一级」按钮可见
      - 当前区域为深圳市时该按钮为禁用状态
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 国家→区县下钻本轮不可验收（覆盖矩阵未覆盖行）；单城占位徽标「深圳市」observed 记录。

  # ========== 评审模式组 ==========
  - id: P0-15
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00398
    priority: P0
    title: 内部评审模式开关联动追溯显隐且关闭后零泄漏
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [顶部人设面板「内部评审模式」开关可用]
    locators:
      persona_menu: '右上角人设按钮（persona-menu）'
      review_switch: 'switch「内部评审模式」'
      trace_badge: '需求追溯按钮与角标（页头/指标区/地图旁）'
      badge_hint: '「口径待甲方确认，当前为团队临时默认值」提示'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: evaluate
        note: 记录开关默认状态（observed）；若为开先关（业务态基准）
      - action: click
        target: 打开顶部人设面板
      - action: click
        target: 开启内部评审模式
      - action: wait
        for: 评审元素渲染
      - action: assert_visible
        target: 需求追溯按钮与角标
      - action: evaluate
        note: 核对角标含待甲方确认提示
      - action: click
        target: 关闭内部评审模式
      - action: evaluate
        note: 核对主区无追溯按钮、角标及内部编号字样
    expect:
      - 开启后页头、指标区与地图旁出现需求追溯按钮与角标
      - 角标含「口径待甲方确认，当前为团队临时默认值」提示
      - 关闭后主区无追溯按钮、角标及内部编号字样
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 开关默认状态 observed 记录；评审字样只进本条与 00399/00400（P1-06/P1-07 后续）；结束后必须确认开关已关。

  - id: P1-01
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00392
    priority: P1
    title: 移除已选企业类型标签后回到全部类型语义
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [企业类型已勾选至少一种（承接 P0-09 态）]
    locators:
      tag_remove: '已选类型标签的移除按钮（chip close）'
      type_input: 'textbox 全部类型'
    steps:
      - action: evaluate
        note: 处于已选类型态（承接 P0-09 或重新勾选高新技术企业）
      - action: click
        target: 已选类型标签移除按钮
      - action: wait
        for: 看板刷新完成
    expect:
      - 该类型标签从筛选栏移除
      - 类型条件回到「全部类型」语义
      - 看板按条件刷新
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 「全部类型」语义以触发器回显或等效默认态判定（形态 observed 记录）。

  - id: P1-02
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00393
    priority: P1
    title: 显示热力开关可关闭与重开且热力层随之变化
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions: [空间分布为地图视图, 热力开关为开启]
    locators:
      heat_switch: 'switch「显示热力」'
      heatmap_layer: '热力渲染层（DOM/canvas 类名含 heat）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 显示热力开关（关）
      - action: wait
        for: 地图重绘
      - action: evaluate
        note: 核对热力层移除
      - action: click
        target: 显示热力开关（开）
      - action: wait
        for: 地图重绘
      - action: evaluate
        note: 核对热力层恢复
    expect:
      - 关闭后地图热力层移除
      - 重开后热力层恢复呈现
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 渲染差异细节 observed 记录；无数据态热力层可能本就不可见——以开关状态与图层增删 DOM 判定，具体像素不核。

  - id: P1-03
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00390
    priority: P1
    title: 修改起止年份后看板按新时间条件刷新且状态保持
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [时间控件为默认年份 2022–2026]
    locators:
      start_year: 'textbox name 开始年份（面板触发器）'
      year_option: '年份面板选项（如 2023，非默认值）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 开始年份面板
      - action: click
        target: 任一非默认年份（如 2023）
      - action: wait
        for: 看板刷新完成
      - action: evaluate
        note: 核对筛选与视图状态未被重置（区域/产业/类型/视图保持）
    expect:
      - 开始与结束年份均可编辑
      - 看板各区块随新时间条件刷新
      - 筛选与视图状态不被重置
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 刷新后数值 observed 记录。

  # ========== 报告组 ==========
  - id: P1-04
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00396
    priority: P1
    title: 查看报告打开只读覆盖层含七节目录且可返回
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [页头「查看 HTML 报告」按钮可见]
    locators:
      report_btn: 'button「查看 HTML 报告」（页头）'
      overlay: '报告覆盖层'
      readonly_mark: '「只读」标注'
      toc: '目录七节：报告身份/执行摘要/对象与范围/关键发现/证据与分析/数据来源与生成说明/局限性'
      back_btn: 'button「返回分析结果」'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 查看 HTML 报告
      - action: wait
        for: 报告覆盖层打开
      - action: assert_visible
        target: 只读标注
      - action: evaluate
        note: 核对目录七节齐备（报告正文为演示内容，不当真实分析预期）
      - action: click
        target: 返回分析结果
      - action: wait
        for: 回到类型看板主区
    expect:
      - 报告以覆盖层打开且页面标注只读
      - 目录含报告身份、执行摘要、对象与范围、关键发现、证据与分析、数据来源与生成说明、局限性七节
      - 返回后回到类型看板主区
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 正文 Wave 0 Mock（演示内容 observed 记录不升 Fail）；下载禁用另条 00397（P1-05）。

  - id: P1-05
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00397
    priority: P1
    title: 未开通付费权益的账号在报告中下载入口禁用
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [账号未开通付费权益（admin 实勘「未付费」）]
    locators:
      report_btn: 'button 查看 HTML 报告'
      download_entry: '报告内下载入口（应 disabled）'
    steps:
      - action: goto
        target: /enterprise/key-enterprise-analysis?view=type
      - action: click
        target: 查看 HTML 报告
      - action: wait
        for: 报告打开
      - action: evaluate
        note: 核对下载入口 disabled 态；核对后点返回分析结果关闭
    expect:
      - 报告内下载入口呈禁用状态
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 页头徽标「未付费」实勘在位；与 P1-04 同链路先后执行减少开关。

  # ========== 评审模式组 ==========
  - id: P1-06
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00399
    priority: P1
    title: 覆盖企业类型数说明卡展示口径并标注待确认
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [内部评审模式已开启]
    locators:
      type_count_card: '指标卡「覆盖企业类型数」'
      spec_icon: '说明图标（ⓘ 类入口，评审态可见）'
      spec_card: '弹出指标说明卡'
      pending_mark: '口径待甲方确认标识'
    steps:
      - action: evaluate
        note: 开启内部评审模式（persona 菜单，承接 P0-15 口径）
      - action: click
        target: 覆盖企业类型数旁的指标说明图标
      - action: wait
        for: 说明卡弹出
      - action: assert_visible
        target: 指标说明卡
      - action: evaluate
        note: 核对卡内各类型企业数口径信息与待确认标识；核毕 Esc 关闭并关闭评审模式
    expect:
      - 弹出指标说明卡
      - 卡内展示各类型企业数的口径信息
      - 卡内含口径待甲方确认标识
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 唯一登记指标 M_ENT_TYPE_COUNT；同标题旁同类说明图标可复用本卡；结束后关闭评审模式防污染后续条目。

  - id: P1-07
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00400
    priority: P1
    title: 匹配企业数与覆盖区域数评审态呈未登记不伪造口径
    story: US-KEYENT-01
    entry_id: ent-key-type
    preconditions: [内部评审模式已开启]
    locators:
      match_card: '指标卡「匹配企业数」'
      region_card: '指标卡「覆盖区域数」'
      unreg_icon: '未登记图标（红问号类）'
      unreg_hint: '未入指标库提示'
    steps:
      - action: evaluate
        note: 开启内部评审模式
      - action: click
        target: 匹配企业数旁未登记图标
      - action: wait
        for: 提示/弹层出现
      - action: evaluate
        note: 核对仅显示未入指标库提示且无伪口径；关闭
      - action: click
        target: 覆盖区域数旁未登记图标
      - action: wait
