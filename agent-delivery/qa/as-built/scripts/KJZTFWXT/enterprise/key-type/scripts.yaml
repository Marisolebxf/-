# 重点企业类型分析 · P0/P1 全量（正向）
# P0-01～P0-05 以 gold.yaml 为准，禁止改那些 id。
system: KJZTFWXT
module: enterprise
function: key-type
entry_id: ent-key-type
base_url: "http://111.198.38.90:50892/"
route: /enterprise/key-enterprise-analysis
func_prefix: ZNFWJQ-KJZTFWXT-v1.0-FUNC
fixtures: ./fixtures/testdata.yaml
usm: agent-handoffs/产品整体定义/E-20_E-22-重点企业分析/
legacy_table: qa/test-cases/KJZTFWXT/KEYENT/FUNC-重点企业类型分析-用例.md
coverage: ./coverage.md
includes:
  - gold.yaml

shared_locators: &hub
  menu_group: { text: 企业分析 }
  menu_item: { text: 重点企业类型分析 }
  heading: { role: heading, name: 重点企业类型分析 }
  filter: { role: region, name: 类型分析筛选 }
  region: { name: 选择区域 }
  year_start: { role: textbox, name: 开始年份 }
  year_end: { role: textbox, name: 结束年份 }
  industry: { role: textbox, name: 全部产业 }
  ent_type: { role: textbox, name: 全部类型 }
  html_report: { role: button, name: 查看 HTML 报告 }
  map_view: { role: button, name: 地图视图 }
  list_view: { role: button, name: 列表视图 }
  map: { name: 重点企业空间分布地图 }
  map_toolbar: { role: toolbar, name: 地图工具栏 }
  heat: { role: switch, name: 显示热力 }
  legend: { role: group, name: 地图图例 }
  map_back: { role: button, name: 返回上一级 }
  insight: { role: heading, name: 区域洞察 }
  open_list: { role: button, name: /查看企业清单/ }
  persona: { role: button, note: 顶栏人设 aria-haspopup=menu }
  review_switch: { role: switch, name: 内部评审模式 }
  paid_switch: { role: switch, name: 付费权益（报告导出） }

scripts:
  # ── P0 其余 ──────────────────────────────────────────
  - id: P0-06
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00047
    priority: P0
    title: 页头标题、数据更新至与 HTML 报告入口
    story: US-KEYENT-01
    depends_on: [P0-01]
    as_built_note: HTML 报告为现场增量；日期记 observed，不钉死。
    locators:
      <<: *hub
    steps:
      - { id: S1, action: assert_visible, target: heading }
      - { id: S2, action: assert_visible, target: html_report }
      - { id: S3, action: screenshot, save: header.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
    expect:
      - H1 为「重点企业类型分析」
      - 可见「数据更新至」+日期（日期写入 observed，不钉死）
      - 「查看 HTML 报告」按钮可见可点
    allow_empty: false
    on_fail: 无页头或无报告入口=FAIL

  - id: P0-07
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00049
    priority: P0
    title: 区域级联可选范围，页内只有一处可编辑区域选择器
    story: US-KEYENT-02
    depends_on: [P0-01]
    as_built_note: |
      地图「深圳市」+「返回上一级」不是第二套筛选。
      城市全名清单不作为 Pass/Fail；缺第一层某一项记开放项。
    locators:
      <<: *hub
      level_global: { text: 全球 }
      level_national: { text: 全国 }
      level_hot: { text: 全国热门科创城市 }
    steps:
      - { id: S1, action: click, target: region }
      - { id: S2, action: wait, ms: 800 }
      - { id: S3, action: snapshot, save: region-level1.yml }
      - { id: S4, action: click, target: level_hot }
      - { id: S5, action: wait, ms: 800 }
      - { id: S6, action: snapshot, save: region-cities.yml }
      - { id: S7, action: screenshot, save: region-cascader.png }
      - { id: S8, action: press, key: Escape, note: 收起级联，避免改掉当前区域 }
    expect:
      - 第一层可见「全国热门科创城市」；「全球」「全国」「区域」缺一项记开放项，不单因缺一项 Fail 全条
      - 热门城市下可见一组城市（不少于 2 个，不把城市全名清单当预期）
      - 可编辑区域选择器只有筛选栏「选择区域」这一处；地图当前层名称+「返回上一级」不是第二套筛选
    allow_empty: false
    on_fail: 打不开级联=FAIL；城市层完全无选项=FAIL

  - id: P0-08
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00051
    priority: P0
    title: 产业多选勾选后回显并刷新看板
    story: US-KEYENT-01
    depends_on: [P0-01]
    testdata:
      industry: 人工智能
    as_built_note: 现场选项曾见集成电路/生物医药/人工智能/新能源/低空经济/量子信息/海洋经济/智能机器人；不把全集当预期。
    locators:
      <<: *hub
      opt_ai: { role: checkbox, name: 人工智能 }
    steps:
      - { id: S0, action: goto, url: "/enterprise/key-enterprise-analysis?workspace=type&view=type", note: 回到默认条件 }
      - { id: S1, action: click, target: industry }
      - { id: S2, action: wait, ms: 600 }
      - { id: S3, action: snapshot, save: industry-options.yml }
      - { id: S4, action: click, target: opt_ai }
      - { id: S5, action: press, key: Escape }
      - { id: S6, action: wait, ms: 1500 }
      - { id: S7, action: screenshot, save: after-industry.png }
      - { id: S8, action: snapshot, save: snapshot.yml }
    expect:
      - 下拉为多选勾选，可见若干产业名（含「人工智能」即可，不把选项全集当预期）
      - 勾选后筛选栏回显「人工智能」标签
      - 看板仍在：KPI「类型与区域分析」、空间分布、区域洞察仍可见（骨架或新值均可）
      - 家数记 observed，禁止钉死
    allow_empty: false
    on_fail: 勾选无回显=FAIL；整页白屏=C1

  - id: P0-09
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00052
    priority: P0
    title: 企业类型多选勾选后回显，可取消回到全部类型
    story: US-KEYENT-01
    depends_on: [P0-01]
    testdata:
      ent_type: 高新技术企业
    as_built_note: |
      现场另有专精特新/小巨人/链主龙头，缺项记开放项。
      取消勾选：点 tag 上 name=Close（Arco 英文）或再点复选框。
      Q010 判定规则不在业务态展开。
    locators:
      <<: *hub
      opt_gx: { role: checkbox, name: 高新技术企业 }
      tag_close: { role: button, name: Close, note: 筛选栏已选 tag 关闭 }
    steps:
      - { id: S1, action: click, target: ent_type }
      - { id: S2, action: wait, ms: 600 }
      - { id: S3, action: snapshot, save: type-options.yml }
      - { id: S4, action: click, target: opt_gx }
      - { id: S5, action: press, key: Escape }
      - { id: S6, action: wait, ms: 1500 }
      - { id: S7, action: screenshot, save: after-type.png }
      - { id: S8, action: click, target: tag_close, note: 取消勾选；若无 Close 则再打开下拉取消复选 }
      - { id: S9, action: wait, ms: 800 }
      - { id: S10, action: snapshot, save: snapshot.yml }
    expect:
      - 选项以勾选呈现；可见「高新技术企业」；外资企业/小微/上市/专精特新/小巨人/链主龙头缺项记开放项
      - 勾选后筛选栏回显该类型标签
      - 看板刷新（KPI/地图或列表/洞察仍在）
      - 取消后回到「全部类型」语义（占位再现或无类型 tag）
      - 无「必须选类型」阻断
    allow_empty: false
    on_fail: 无类型下拉=FAIL

  - id: P0-10
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00056
    priority: P0
    title: 区域洞察展示当前区域、家数、类型结构与清单入口
    story: US-KEYENT-02
    depends_on: [P0-01]
    as_built_note: |
      选高企后入口仍可能写「查看企业清单」而非「查看高企清单」。
      仅深圳市链时不出现同级排行或区域×类型矩阵。
    locators:
      <<: *hub
      current_region: { text: 当前区域 }
      type_struct: { text: 当前区域企业类型结构 }
    steps:
      - { id: S1, action: assert_visible, target: insight }
      - { id: S2, action: screenshot, save: insight.png }
      - { id: S3, action: snapshot, save: snapshot.yml }
    expect:
      - 可见「区域洞察」「当前区域」及区域名称（如深圳市，不钉死）
      - 家数带「家」，与 KPI 一样记 observed，禁止钉死
      - 可见「当前区域企业类型结构」（无柱/无切片时保持空结构，不编假占比）
      - 清单入口文案含「查看企业清单」与数量 N
      - 仅单城时不可见「同级区域分布」「同级排行」或「区域×类型」矩阵
    allow_empty: false
    on_fail: 无洞察区=FAIL；单城却出现同级排行=按 as-built 记，若出现则 FAIL

  - id: P0-11
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00059
    priority: P0
    title: 内部评审开显示追溯/角标，关闭后业务 DOM 零泄漏
    story: US-KEYENT-01
    depends_on: [P0-01]
    as_built_note: 评审字样只进本条与 P1-04/P1-05。Trace/ⓘ 为 hover 弹出，本条只核挂点按钮可见性。
    locators:
      <<: *hub
      trace_input: { role: button, name: 分析类型输入归属需求追溯 }
      trace_kpi: { role: button, name: 类型与区域分析需求追溯 }
      trace_map: { role: button, name: 重点企业空间分布需求追溯 }
      metric_help: { role: button, name: 指标说明：各类型企业数 }
      metric_unreg_match: { role: button, name: 指标未登记：匹配企业数 }
      metric_unreg_region: { role: button, name: 指标未登记：覆盖区域数 }
    steps:
      - { id: S1, action: click, target: persona }
      - { id: S2, action: evaluate, note: 若「内部评审模式」为开则点关；已关则保持关。再截业务态 }
      - { id: S3, action: press, key: Escape }
      - { id: S4, action: screenshot, save: review-off-before.png }
      - { id: S5, action: click, target: persona }
      - { id: S6, action: evaluate, note: 点开「内部评审模式」（当前必须为关→开） }
      - { id: S7, action: press, key: Escape }
      - { id: S8, action: screenshot, save: review-on.png }
      - { id: S9, action: snapshot, save: review-on.yml }
      - { id: S10, action: click, target: persona }
      - { id: S11, action: evaluate, note: 再关「内部评审模式」（当前必须为开→关） }
      - { id: S12, action: press, key: Escape }
      - { id: S13, action: screenshot, save: review-off-after.png }
    expect:
      - 评审关：主区不可见「需求追溯」、metric_id、GAP-、Q0xx、Mock 字样
      - 评审开：可见「分析类型输入归属需求追溯」「类型与区域分析需求追溯」「重点企业空间分布需求追溯」
      - 评审开：KPI 旁可见「指标说明：各类型企业数」或「指标未登记：匹配企业数/覆盖区域数」及待甲方确认入口
      - 追溯浮层若打开：含来源锚点/源文档/原文摘要即可，不把内部 ID 当业务预期
      - 再关后主区不再出现需求追溯、metric_id、GAP、Q0xx、Mock 字样
    allow_empty: false
    on_fail: 开关无效=FAIL；关闭后主区仍泄漏内部编号=FAIL

  # ── P1 ─────────────────────────────────────────────
  - id: P1-01
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00050
    priority: P1
    title: 起止年份可改且看板随时间条件刷新
    story: US-KEYENT-01
    depends_on: [P0-01]
    as_built_note: 现场默认 2022–2026，与线框「近3年」不必一致。禁止把具体家数当预期。
    locators:
      <<: *hub
      year_2023: { text: "2023", note: 年份面板内的年份，勿点页面其它 2023 }
    steps:
      - { id: S1, action: evaluate, note: 记录当前开始/结束年份与三张 KPI 展示到 observed }
      - { id: S2, action: click, target: year_start }
      - { id: S3, action: wait, ms: 600 }
      - { id: S4, action: click, target: year_2023, note: 选面板内已有年份；若开始已是 2023 则改结束年 }
      - { id: S5, action: wait, ms: 1500 }
      - { id: S6, action: screenshot, save: after-year.png }
      - { id: S7, action: snapshot, save: snapshot.yml }
    expect:
      - 起止年份可编辑
      - 改年后三区仍在（类型与区域分析 / 空间分布 / 区域洞察），随条件刷新（骨架或新值均可）
      - 禁止把具体家数当预期
    allow_empty: false
    on_fail: 年份不可改或改后白屏=FAIL

  - id: P1-02
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00055
    priority: P1
    title: 地图工具栏、热力开关、图例与当前层返回
    story: US-KEYENT-02
    depends_on: [P0-04]
    as_built_note: 国家/省/市下钻本轮数据空，不写成 Fail；默认市级「返回上一级」禁用。
    locators:
      <<: *hub
      zoom_in: { role: button, name: 放大 }
      zoom_out: { role: button, name: 缩小 }
      refresh: { role: button, name: 刷新 }
      fullscreen: { role: button, name: 全屏 }
    steps:
      - { id: S1, action: click, target: map_view, note: 确保在地图视图 }
      - { id: S2, action: assert_visible, target: map_toolbar }
      - { id: S3, action: click, target: heat, note: 关热力 }
      - { id: S4, action: wait, ms: 400 }
      - { id: S5, action: click, target: heat, note: 再开热力 }
      - { id: S6, action: screenshot, save: map-controls.png }
      - { id: S7, action: snapshot, save: snapshot.yml }
    expect:
      - 工具栏四按钮可见：放大、缩小、刷新、全屏（本条不强制进入全屏）
      - 「显示热力」开关可开可关（热力层变化记 observed）
      - 图例「企业数量强度」可见低/中/高/极高
      - 当前层名称可见（如深圳市，不钉死）；默认市级时「返回上一级」禁用
      - 无下钻数据不强制点进区县
    allow_empty: false
    on_fail: 缺工具栏或图例=FAIL；禁用的返回上一级被当成 Fail=C4

  - id: P1-03
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00058
    priority: P1
    title: 查看 HTML 报告打开只读页，未付费下载禁用，可返回
    story: US-KEYENT-01
    depends_on: [P0-06]
    as_built_note: |
      DEMO 口径。正文可含 Wave 0 Mock，不把「必须真实分析结果」当预期。
      未付费不要求产出文件；禁止按企业查询「创建导出任务+落盘文件」来判。
    locators:
      <<: *hub
      back: { role: button, name: 返回分析结果 }
      download: { role: button, name: 导出 }
      toc: { name: 报告目录 }
    steps:
      - { id: S0, action: click, target: persona }
      - { id: S1, action: evaluate, note: 若「付费权益（报告导出）」为开则关掉；已关则不动 }
      - { id: S2, action: press, key: Escape }
      - { id: S3, action: click, target: html_report }
      - { id: S4, action: wait, ms: 1200 }
      - { id: S5, action: screenshot, save: report.png }
      - { id: S6, action: snapshot, save: snapshot.yml }
      - { id: S7, action: click, target: back }
      - { id: S8, action: wait, ms: 800 }
      - { id: S9, action: assert_url, url_includes: /enterprise/key-enterprise-analysis }
    expect:
      - URL 可带 demo_state=report，且仍含 view=type 或 workspace=type
      - H1 含「重点企业类型分析报告」；可见「只读」（眉题「重点企业分析 · 只读报告」即可）
      - 目录含：报告身份、执行摘要、对象与范围、关键发现、证据与分析、数据来源与生成说明、局限性（现场「局限性与使用边界」，编号以现场为准）
      - 未付费时「导出」禁用；不要求 artifacts 文件，不得因无 PDF 判 Fail
      - 点「返回分析结果」后回到类型分析且主看板（筛选/KPI/空间分布）恢复
    allow_empty: false
    on_fail: 打不开报告=FAIL；把无文件当 Fail=C4（本条明确不要求文件）

  - id: P1-04
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00060
    priority: P1
    title: 覆盖企业类型数 ⓘ 打开各类型企业数说明卡
    story: US-KEYENT-01
    depends_on: [P0-11]
    as_built_note: |
      D1=draft D4=mock；不要求改绿。
      现场为 hover 弹出；点按钮或对「覆盖企业类型数」旁按钮 mouseenter。
      区块标题旁同类 ⓘ 可同卡。
    locators:
      <<: *hub
      kpi_types: { text: 覆盖企业类型数 }
      metric_help: { role: button, name: 指标说明：各类型企业数 }
    steps:
      - { id: S1, action: click, target: persona }
      - { id: S2, action: evaluate, note: 若「内部评审模式」为关则打开；已开则保持开 }
      - { id: S3, action: press, key: Escape }
      - { id: S4, action: evaluate, note: 在「覆盖企业类型数」卡内对 aria-label=指标说明：各类型企业数 的按钮 mouseenter/click }
      - { id: S5, action: wait, ms: 800 }
      - { id: S6, action: screenshot, save: metric-type-count.png }
      - { id: S7, action: snapshot, save: snapshot.yml }
    expect:
      - 弹出指标说明卡
      - 指标ID 为 M_ENT_TYPE_COUNT、中文名「各类型企业数」
      - 含口径/公式/源表或源系统/更新频率/版本中的可见项（不核八件套全文）
      - 可见「口径待甲方确认」及开放项 Q010（仅评审态）
      - 就绪度四行允许 draft/mock，不要求改绿
    allow_empty: false
    on_fail: 评审开仍无 ⓘ=FAIL

  - id: P1-05
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00061
    priority: P1
    title: 匹配企业数与覆盖区域数评审态为未登记，不伪造完整 8 件套
    story: US-KEYENT-01
    depends_on: [P1-04]
    as_built_note: |
      Wireframe 拟挂 TYPE_MATCH / REGIONAL_COUNT，现场未登记。
      拟用 ID 常见 M_ENT_KEYPANO_MATCH_COUNT / M_ENT_KEYPANO_REGIONAL_COUNT，记 observed。
    locators:
      <<: *hub
      unreg_match: { role: button, name: 指标未登记：匹配企业数 }
      unreg_region: { role: button, name: 指标未登记：覆盖区域数 }
    steps:
      - { id: S1, action: assert_visible, target: unreg_match }
      - { id: S2, action: evaluate, note: 对「指标未登记：匹配企业数」mouseenter/click，在说明卡内取文案 }
      - { id: S3, action: screenshot, save: unreg-match.png }
      - { id: S4, action: evaluate, note: 对「指标未登记：覆盖区域数」mouseenter/click }
      - { id: S5, action: screenshot, save: unreg-region.png }
      - { id: S6, action: snapshot, save: snapshot.yml }
    expect:
      - 两卡均有「指标未登记」入口，不是已登记 8 件套完整卡
