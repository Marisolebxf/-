      - 点开仅显示未入指标库提示且不展示伪口径
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 拟用编号 observed 记录；线框拟挂指标现场未登记（覆盖矩阵口径）；结束后关闭评审模式。

  # ========== 空态组 ==========
  - id: P1-08
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00401
    priority: P1
    title: 零匹配时清单抽屉空态且全选与对比篮动作状态正确
    story: US-KEYENT-04
    entry_id: ent-key-type
    preconditions:
      - 当前筛选无匹配企业（清单数量为 0）
    locators:
      list_btn: 'button「查看企业清单（0）」'
      empty_text: '抽屉列表区无匹配企业空态文案'
      select_all: '「全选当前筛选结果」控件'
      add_compare: '「加入对比篮」控件'
      basket_btn: '对比篮入口（系统级）'
    steps:
      - action: evaluate
        note: 构造零匹配态（默认 2022–2026/全部产业/全部类型若 N=0 直接用；否则改开始年份至无数据区间再还原）
      - action: click
        target: 查看企业清单（0）
      - action: wait
        for: 抽屉打开
      - action: evaluate
        note: 核对空态文案、全选与加入对比篮禁用态、对比篮入口可用
    expect:
      - 抽屉正常打开且列表区显示无匹配企业空态文案
      - 全选当前结果与加入对比篮呈禁用
      - 打开对比篮保持可用
    allow_skip: 正常筛选下无法构造零匹配（清单 N>0 且年份调整无效）时记 Pass-N/A 并 observed 说明
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 对比篮本身非本册验证对象（现共 8/10 项系统残留），仅验抽屉内动作状态。

  - id: P1-09
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00402
    priority: P1
    title: 无匹配企业时列表视图显示空态文案
    story: US-KEYENT-02
    entry_id: ent-key-type
    preconditions:
