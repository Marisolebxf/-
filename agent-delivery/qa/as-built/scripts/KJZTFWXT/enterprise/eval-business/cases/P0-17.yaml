id: P0-17
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00958
priority: P0
title: 仅一家企业时开始分析被拦截并说明需两家
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
preconditions:
- 评估对象区可回填企业
locators:
  start: 开始分析
steps:
- action: goto
  target: /enterprise/evaluation?workspace=business&mode=business
- action: click
  target: 浮层仅勾选 1 家确定
- action: click
  target: 开始分析
expect:
- note: 「开始分析」被拦截且无任务发起
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.getByRole('button', { name: '关闭对比篮' }); if (await closeB.count()) await closeB.first().click().catch(()=>{}); await page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('.arco-checkbox[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('无可选企业'); await sels.nth(0).click({ force: true }); await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 }); await page.waitForTimeout(1500); const before = page.url(); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) { /* 禁用即拦截 */ } else { await start.click(); await page.waitForTimeout(1500) }; if (/view=processing/.test(page.url())) throw new Error('仅 1 家仍进入过程态')
- note: 拦截提示说明至少需要 2 家企业
  assert: |-
    const t = await page.locator('body').innerText(); const disabled = await page.getByRole('button', { name: '开始分析' }).isDisabled(); if (!disabled && !/(2\s*家|两家|至少.*2)/.test(t)) throw new Error('未见两家门槛提示且按钮未禁用'); /* 形态 observed */
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 拦截形态为禁用或 Message 提示（observed）。
tier: B
