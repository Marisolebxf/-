id: FUNC-01895
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01895
priority: P0
title: 结果页四张摘要卡可见且各有数值
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已打开商业力评估结果（脚本可经「最近评估→恢复结果」直达）
locators:
  hist_tab: Tab「最近评估」
  restore_button: button「恢复结果」
  cards: 商业力最高得分 / 纳入评价企业 / 对象集平均得分 / 高可信企业
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 确保停留在商业力评估结果页；四张摘要卡判定在 expect
expect:
  - note: 1、可见商业力最高得分、纳入评价企业、对象集平均得分、高可信企业四张卡
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const summaryCardsReady = async () => {
        const t = await main().innerText().catch(() => '');
        const labels = ['商业力最高得分', '纳入评价企业', '对象集平均得分', '高可信企业'];
        if (!labels.every((l) => t.includes(l))) return false;
        return /商业力最高得分[\s\S]{0,40}\d+\s*分/.test(t)
          && /纳入评价企业[\s\S]{0,40}\d+\s*家/.test(t)
          && /对象集平均得分[\s\S]{0,40}\d+\s*分/.test(t)
          && /高可信企业[\s\S]{0,40}\d+\s*家/.test(t);
      };
      const openResultViaHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
        const restore = page.getByRole('button', { name: '恢复结果' });
        await restore.first().waitFor({ state: 'visible', timeout: 10000 });
        if ((await restore.count()) < 1) throw new Error('最近评估无已完成任务可「恢复结果」');
        await restore.first().click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 30000) {
          if (await summaryCardsReady()) return;
          if (/view=result/.test(page.url())) await page.waitForTimeout(800);
          else await page.waitForTimeout(500);
        }
        if (!(await summaryCardsReady())) throw new Error('恢复结果后未见四张摘要卡：' + page.url());
      };
      if (!(await summaryCardsReady())) {
        if (globalThis.__func01888_ready || globalThis.__func01889_ready) {
          await page.waitForTimeout(500);
        }
        if (!(await summaryCardsReady())) await openResultViaHistory();
      }
      await expect(main().getByRole('heading', { name: '商业力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      for (const label of ['商业力最高得分', '纳入评价企业', '对象集平均得分', '高可信企业']) {
        await expect(main().getByText(label, { exact: true }).first()).toBeVisible({ timeout: 10000 });
      }
  - note: 2、每张卡有数值（分/家，不钉死具体数）
    assert: |-
      const main = () => page.locator('main.app-main').first();
      const t = await main().innerText().catch(() => '');
      const checks = [
        { label: '商业力最高得分', re: /商业力最高得分[\s\S]{0,48}(\d+)\s*分/ },
        { label: '纳入评价企业', re: /纳入评价企业[\s\S]{0,48}(\d+)\s*家/ },
        { label: '对象集平均得分', re: /对象集平均得分[\s\S]{0,48}(\d+)\s*分/ },
        { label: '高可信企业', re: /高可信企业[\s\S]{0,48}(\d+)\s*家/ },
      ];
      for (const { label, re } of checks) {
        const m = t.match(re);
        if (!m) throw new Error('摘要卡「' + label + '」未见数值');
        const n = parseInt(m[1], 10);
        if (!Number.isFinite(n)) throw new Error('摘要卡「' + label + '」数值不可解析');
      }
      await expect(main().getByText(/\d+\s*分/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例前置「已打开商业力评估结果」：单跑经「最近评估→恢复结果」直达（同 FUNC-00944/P0-06；不重复发起链）。四卡文案与 fixtures/scout/probe-p006-result.json 一致。得分数值不钉死。D1·30888 路由 /enterprise-center/evaluation。登录与关内部评审由 runner 会话前置。tier B，无 allow_skip。
