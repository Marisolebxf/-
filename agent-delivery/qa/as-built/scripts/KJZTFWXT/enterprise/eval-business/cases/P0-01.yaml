id: P0-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00930
priority: P0
title: 侧栏进入商业力评估页路由与标题正确
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 经人设面板关闭内部评审模式
locators:
  h1: heading「企业商业力评估对比分析」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: assert_url
    expect_contains: workspace=business
  - action: assert_visible
    target: heading 企业商业力评估对比分析
expect:
  - note: 路由为企业评估页且携带 workspace=business 参数
    assert: await expect(page).toHaveURL(/workspace=business/)
  - note: 页标题为「企业商业力评估对比分析」
    assert: |-
      await expect(page).toHaveTitle(/企业商业力评估对比分析 - 科技专题服务系统/); await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1 现场同显 mode=business；同壳技术力/综合竞争力正向不在本条断言。本文件 list 项相对父键缩进 2 空格（极简 YAML 解析器要求）。
tier: A
