id: FUNC-01931
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01931
priority: P0
title: 对比篮切换到服务机构页签不发起商业力分析
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已打开对比篮（脚本自含打开系统对比篮面板）
locators:
  dock: button aria-label 含「打开对比篮」
  panel: .system-compare-panel
  service_tab: '#compare-basket-tab-service_org'
  enterprise_tab: '#compare-basket-tab-enterprise'
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 打开对比篮→点击「服务机构」页签；名单与未发起分析判定在 expect
expect:
  - note: 1、名单切换为服务机构；2、不出现「商业力评估结果」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const openCompareBasket = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        await expect(dockBtn).toBeVisible({ timeout: 12000 });
        await dockBtn.click({ timeout: 10000 });
        await page.waitForTimeout(600);
        const panel = page.locator('.system-compare-panel');
        await expect(panel).toBeVisible({ timeout: 10000 });
        return panel;
      };
      if (/view=result/.test(page.url())) {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
      }
      await dismissBasket();
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await dismissBasket();
      await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
      const urlBefore = page.url();
      const panel = await openCompareBasket();
      const entTab = panel.locator('#compare-basket-tab-enterprise');
      const svcTab = panel.locator('#compare-basket-tab-service_org');
      await expect(entTab).toBeVisible({ timeout: 8000 });
      await expect(svcTab).toBeVisible({ timeout: 8000 });
      await svcTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const svcClass = (await svcTab.getAttribute('class')) || '';
      if (!/active/.test(svcClass)) throw new Error('服务机构页签未激活');
      const panelText = await panel.innerText();
      if (!/篮内服务机构/.test(panelText)) {
        throw new Error('服务机构页签未见「篮内服务机构」标题');
      }
      if (/^篮内企业/m.test(panelText) || (/\b篮内企业\b/.test(panelText) && !/篮内服务机构/.test(panelText))) {
        throw new Error('名单未切换为服务机构（仍为企业列表）');
      }
      const hasServiceRows =
        /按机构名称搜索/.test(panelText) ||
        /查看画像/.test(panelText) ||
        /对比篮暂无服务机构/.test(panelText) ||
        /移除/.test(panelText);
      if (!hasServiceRows) throw new Error('服务机构页签未见服务机构名单或空态标识');
      const mainText = await main().innerText().catch(() => '');
      if (/商业力评估结果/.test(mainText)) throw new Error('主区出现「商业力评估结果」，疑似误发起分析');
      if (/view=result/.test(page.url()) && !/view=result/.test(urlBefore)) {
        throw new Error('切服务机构页签后 URL 进入结果视图：' + page.url());
      }
      await expect(main().getByRole('heading', { name: '商业力评估结果' })).toHaveCount(0);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01931：系统对比篮（.system-compare-panel）内点 #compare-basket-tab-service_org；服务机构名单标题「篮内服务机构」（对照企业 Tab「篮内企业」）。仅切 Tab 不得出现主区「商业力评估结果」或误入 view=result。30888 路由 /enterprise-center/evaluation；打开对比篮用 dock aria-label（用例「打开对比篮」）。服务机构 0 条时以空态「对比篮暂无服务机构」或搜索占位「按机构名称搜索」仍算服务机构名单。登录与关内部评审由 runner 会话前置。tier B，零 allow_skip。
