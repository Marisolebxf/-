id: P0-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00936
priority: P0
title: 对象回填后数据覆盖与可信度区出现五档可信度筛选Tab
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-business
preconditions:
- 已进入商业力评估页
- 可从浮层带入企业
locators:
  section: 数据覆盖与可信度
  tabs: 全部可信度/高可信/中可信/低可信/不可生成
steps:
- action: goto
  target: /enterprise/evaluation?workspace=business&mode=business
- action: click
  target: 前往对比篮选择企业
- action: click
  target: 勾选 2 家企业
- action: click
  target: 确定
- action: evaluate
  note: 回填 2 家后浏览数据覆盖与可信度区
expect:
- note: 「数据覆盖与可信度」区出现可信度筛选 Tab
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const closeB = page.getByRole('button', { name: '关闭对比篮' }); if (await closeB.count()) await closeB.first().click().catch(()=>{}); await page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('.arco-checkbox[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('可选企业不足'); await sels.nth(0).click({ force: true }); await sels.nth(1).click({ force: true }); await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 }); await page.waitForTimeout(2500); await expect(page.getByText('数据覆盖与可信度').first()).toBeVisible({ timeout: 8000 }); const main = await page.locator('main').innerText(); if (/预检未返回企业明细/.test(main)) throw new Error('ALLOW_SKIP: 预检失败无可信度 Tab'); if (!/全部可信度/.test(main)) throw new Error('ALLOW_SKIP: 数据覆盖区可见但无可信度筛选 Tab')
- note: Tab 含全部可信度、高可信、中可信、低可信、不可生成五档
  assert: |-
    for (const t of ['全部可信度','高可信','中可信','低可信','不可生成']) await expect(page.getByText(t, { exact: true }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: true
skip_reason: 合法对象回填后预检失败（「预检未返回企业明细」）导致「数据覆盖与可信度」区无五档筛选 Tab；env-gate overall=fail（coverage_tabs=[]），诚实 skip，不写假绿
ticket: ENV-EVAL-BUSINESS-PRECHECK-001
as_built_note: 2026-10-14 预检失败时仅见失败提示、无五档 Tab → Pass-N/A（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）；区块标题「数据覆盖与可信度」仍可见。
tier: B
