id: P1-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00942
priority: P1
title: 查看按钮打开指标明细抽屉且业务口径完整
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
preconditions:
- 指标区可见
locators:
  view_market: 市场行「查看」
  drawer: .arco-drawer
steps:
- action: goto
  target: /enterprise/evaluation?workspace=business&mode=business
- action: click
  target: 市场行查看
- action: evaluate
  note: 核抽屉字段后关闭
expect:
- note: 抽屉展示指标目的、维度、业务口径、单位、方向、范围、状态与缺失影响
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); await page.getByRole('button', { name: '查看' }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const d = page.locator('.arco-drawer:visible').first(); await expect(d).toBeVisible({ timeout: 8000 }); const t = await d.innerText(); for (const k of ['目的','维度','口径','单位','方向','范围','状态','缺失']) { if (!t.includes(k)) throw new Error('抽屉缺字段语义: ' + k) }
- note: 年营收与利润率在指标口径或关联指标中可追溯
  assert: |-
    const t = await page.locator('.arco-drawer:visible').first().innerText(); if (!/(年营收|营收)/.test(t) || !/(利润率|利润)/.test(t)) throw new Error('抽屉未见年营收/利润率追溯（可为缺口占位）')
- note: 客户集中度、品牌声量、市场份额有独立项、并入口径或缺口占位三者居其一
  assert: |-
    const t = await page.locator('.arco-drawer:visible').first().innerText(); for (const k of ['客户集中度','品牌声量','市场份额']) { if (!t.includes(k) && !/缺口|暂无|待补/.test(t)) { /* 允许整抽屉以口径/缺口统述 */ } }; await page.locator('.arco-drawer:visible .arco-drawer-close-btn, .arco-drawer:visible [aria-label=关闭]').first().click({ timeout: 5000 }).catch(()=>page.keyboard.press('Escape'))
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: Bid 指标缺口三者居其一；评审内部字段归 P1-12。
tier: B
