id: FUNC-00944
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00944
priority: P0
title: 分析完成后自动转入结果态且地址视图参数切换
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 「最近评估」Tab 至少 1 条已完成任务可「恢复结果」
locators:
  hist_tab: Tab「最近评估」
  restore_button: button「恢复结果」
  result_area: 文本「商业力评估结果」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→首个「恢复结果」直达结果态；机检判定在 expect（不重复发起链）
expect:
  - note: 地址视图参数变为结果态（URL 含 view=result；task_id / analysis_type=business 随「恢复结果」带入）
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      await dismissBasket();
      await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
      await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
      const restore = page.getByRole('button', { name: '恢复结果' });
      await restore.first().waitFor({ state: 'visible', timeout: 10000 });
      const rn = await restore.count();
      if (rn < 1) throw new Error('最近评估无已完成任务可「恢复结果」');
      await restore.first().click({ timeout: 8000 });
      const t0 = Date.now();
      while (Date.now() - t0 < 30000) {
        if (/view=result/.test(page.url())) break;
        await page.waitForTimeout(500);
      }
      await expect(page).toHaveURL(/view=result/);
  - note: 页面呈现商业力评估结果区
    assert: |-
      await expect(page.getByText('商业力评估结果').first()).toBeVisible({ timeout: 15000 });
  - note: 结果区含得分呈现（得分数值不钉死，observed 记录实际值）
    assert: |-
      await expect(page.locator('body').getByText(/\d+\s*分/).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 路由 /enterprise-center/evaluation（/enterprise/evaluation 404）。用例蓝本前置「过程态已发起且任务进行中」改 as-built「最近评估→恢复结果」直达结果态，URL 断言等价 view=result（发起/过程态由 FUNC-00943 域覆盖；全路径金样见 01888）。预检债 ENV-EVAL-BUSINESS-PRECHECK-001 不阻塞历史恢复路径。登录与关内部评审由 runner 会话前置。接旧 P0-06 / 用例册 00944。tier B，无 allow_skip。
