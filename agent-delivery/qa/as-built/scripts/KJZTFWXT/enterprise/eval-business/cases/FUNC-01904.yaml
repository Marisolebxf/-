id: FUNC-01904
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01904
priority: P1
title: 当天相同条件再次开始分析打开已有结果且不新增任务
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 当天已有相同企业与权重的成功结果；已按该条件回到配置页（脚本自含：先跑通 1 次分析→调整配置）
locators:
  start: button「开始分析」
  adjust: button「调整配置」
  same_day_hint: 已打开今天相同条件的评估结果
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 前置建立当天成功结果→调整配置→再次点「开始分析」；结果复用与最近评估条数判定在 expect
expect:
  - note: 1、打开已有商业力评估结果页；2、出现「已打开今天相同条件的评估结果」；3、任务 ID 与当天已成功那次相同；4、最近评估列表条数不增加
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const tidRe = /((?:DEMO-)?EVAL-\d{8}-\d+)/;
      const parseTid = (url) => {
        const m = (url || '').match(/task_id=((?:DEMO-)?EVAL-\d{8}-\d+)/);
        return m ? decodeURIComponent(m[1]) : null;
      };
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const adjustVisible = async () => {
        await main().scrollIntoViewIfNeeded().catch(() => {});
        const locs = [
          page.getByRole('button', { name: '调整配置', exact: true }),
          main().getByRole('button', { name: '调整配置', exact: true }),
          main().locator('button').filter({ hasText: /^调整配置$/ }),
        ];
        for (const loc of locs) {
          if (await loc.count() && await loc.first().isVisible().catch(() => false)) return loc.first();
        }
        return null;
      };
      const bodyResultReady = async () => {
        const url = page.url();
        if (!/view=result/.test(url) && !/view=processing/.test(url)) {
          const heading = main().getByRole('heading', { name: '商业力评估结果' });
          if (!(await heading.isVisible().catch(() => false))) return false;
        }
        const t = await main().innerText().catch(() => '');
        return /商业力评估结果/.test(t) && (/\d+\s*分/.test(t) || /对象[：:]\s*\d+\s*家/.test(t) || /商业力最高得分/.test(t));
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 ' + n);
      };
      const openAndFillObjects = async () => {
        await ensureBasketEnterprises(2);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        if (/enterprise_codes/.test(page.url())) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await closeBasket();
        }
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        if (!/enterprise_codes/.test(page.url())) {
          const openCta = page.getByRole('button', { name: /商业竞争力对标分析|前往对比篮选择企业|返回对比篮调整对象/ }).first();
          await expect(openCta).toBeVisible({ timeout: 10000 });
          await openCta.click({ timeout: 8000 });
          await page.waitForTimeout(800);
          await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 8000 });
          const sels = page.locator('[aria-label^="选择 "]');
          if (await sels.count() < 2) throw new Error('对比篮可选企业不足 2 家');
          await sels.nth(0).click({ force: true });
          await page.waitForTimeout(200);
          await sels.nth(1).click({ force: true });
          await page.waitForTimeout(200);
          await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
          await page.waitForTimeout(1500);
        }
        await closeBasket();
        const overlay = page.getByText('选择分析企业', { exact: true });
        if (await overlay.isVisible().catch(() => false)) {
          await page.keyboard.press('Escape');
          await page.waitForTimeout(400);
        }
        await expect(page).toHaveURL(/enterprise_codes/, { timeout: 10000 });
      };
      const clickStartAndWaitResult = async (maxMs) => {
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) {
          const mainText = await main().innerText().catch(() => '');
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）');
          throw new Error('配置页「开始分析」仍禁用');
        }
        await start.click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          if (await bodyResultReady()) return { ok: true, url: page.url() };
          const url = page.url();
          if (/view=result/.test(url) && await page.getByText('商业力评估结果').first().isVisible().catch(() => false)) {
            return { ok: true, url };
          }
          const showBtn = main().getByRole('button', { name: '查看评估结果' });
          if (await showBtn.isVisible().catch(() => false)) {
            await showBtn.click({ timeout: 8000 });
            await page.waitForTimeout(2000);
            if (await bodyResultReady()) return { ok: true, url: page.url() };
          }
          const tid = parseTid(url);
          if (tid && /view=processing/.test(url)) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=business&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return { ok: true, url: page.url() };
          }
          if (/评估失败|暂无评估结果/.test(await page.locator('body').innerText().catch(() => ''))) {
            throw new Error('分析终态失败：' + url);
          }
          await page.waitForTimeout(800);
        }
        return { ok: false, url: page.url() };
      };
      const clickRecentTab = async () => {
        const tablists = page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) });
        const list = (await tablists.count()) ? tablists.first() : page.locator('[role=tablist]').first();
        const recent = list.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recent).toBeVisible({ timeout: 10000 });
        await recent.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await expect(recent).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      };
      const countHistoryRows = async () => {
        const restore = page.getByRole('button', { name: '恢复结果' });
        const cont = page.getByRole('button', { name: '继续查看' });
        const rn = await restore.count();
        const cn = await cont.count();
        const tr = page.locator('main .arco-table-tr');
        const tn = await tr.count();
        if (rn + cn > 0) return rn + cn;
        if (tn > 0) return tn;
        const body = await page.locator('main').innerText().catch(() => '');
        const taskM = body.match(/(DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3,})/g);
        return taskM ? taskM.length : 0;
      };
      await openAndFillObjects();
      const fingerprintUrl = page.url();
      if (!/enterprise_codes/.test(fingerprintUrl)) throw new Error('配置页 URL 无 enterprise_codes，无法固化同条件指纹');
      const first = await clickStartAndWaitResult(180000);
      if (!first.ok) throw new Error('前置首次分析未到结果态（ticket=ENV-EVAL-BUSINESS-RESULT-SHELL-001）：' + first.url);
      await expect(page).toHaveURL(/view=result/, { timeout: 15000 });
      const baselineTid = parseTid(page.url()) || (tidRe.exec(await page.locator('body').innerText().catch(() => '')) || [])[1];
      if (!baselineTid) throw new Error('首次结果未见 task_id：' + page.url());
      let adjBtn = await adjustVisible();
      if (adjBtn) {
        try {
          await adjBtn.click({ timeout: 8000 });
        } catch {
          await adjBtn.click({ force: true, timeout: 8000 });
        }
        await page.waitForTimeout(1500);
      } else {
        await page.goto(fingerprintUrl, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
      }
      await closeBasket();
      const cfgBody = await main().innerText().catch(() => '');
      if (/暂未选择评估对象/.test(cfgBody)) {
        await page.goto(fingerprintUrl, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        if (/暂未选择评估对象/.test(await main().innerText().catch(() => ''))) {
          throw new Error('回到配置页后对象区仍为空（ticket=ENV-EVAL-BUSINESS-RESULT-SHELL-001）');
        }
      }
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await clickRecentTab();
      const histBeforeSecond = await countHistoryRows();
      await page.goto(fingerprintUrl, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      await closeBasket();
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 15000 });
      if (!/enterprise_codes/.test(page.url())) {
        await expect(page).toHaveURL(/enterprise_codes/, { timeout: 10000 });
      }
      const start2 = page.getByRole('button', { name: '开始分析' });
      await expect(start2).toBeEnabled({ timeout: 15000 });
      await start2.click({ timeout: 8000 });
      let sawHint = false;
      let sawNewProcessingTid = null;
      const t1 = Date.now();
      while (Date.now() - t1 < 45000) {
        const body = await page.locator('body').innerText().catch(() => '');
        if (/已打开今天相同条件的评估结果/.test(body)) sawHint = true;
        const toast = page.locator('.arco-message').filter({ hasText: /已打开今天相同条件的评估结果|相同条件的评估正在进行/ });
        if (await toast.count() && await toast.first().isVisible().catch(() => false)) sawHint = true;
        const u = page.url();
        const cur = parseTid(u);
        if (/view=processing/.test(u) && cur && cur !== baselineTid) sawNewProcessingTid = cur;
        if (await bodyResultReady()) break;
        if (/view=result/.test(u) && await page.getByText('商业力评估结果').first().isVisible().catch(() => false)) break;
        await page.waitForTimeout(500);
      }
      if (!(await bodyResultReady())) {
        const procTid = parseTid(page.url());
        if (/view=processing/.test(page.url()) && procTid === baselineTid) {
          const showBtn = main().getByRole('button', { name: '查看评估结果' });
          if (await showBtn.isVisible().catch(() => false)) {
            await showBtn.click({ timeout: 8000 });
            await page.waitForTimeout(2000);
          }
          await page.goto(toUrl(evalRoute + '&view=result&analysis_type=business&task_id=' + encodeURIComponent(baselineTid)), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
        }
        const tWait = Date.now();
        while (Date.now() - tWait < 120000 && !(await bodyResultReady())) {
          const showBtn = main().getByRole('button', { name: '查看评估结果' });
          if (await showBtn.isVisible().catch(() => false)) {
            await showBtn.click({ timeout: 8000 });
            await page.waitForTimeout(2000);
          }
          await page.waitForTimeout(800);
        }
        if (!(await bodyResultReady())) throw new Error('二次开始后未到结果态：' + page.url());
      }
      const finalTid = parseTid(page.url()) || (tidRe.exec(await page.locator('body').innerText().catch(() => '')) || [])[1];
      if (!finalTid) throw new Error('二次开始后未见 task_id：' + page.url());
      if (finalTid !== baselineTid) {
        throw new Error('任务 ID 变化（疑似新增任务）：基线 ' + baselineTid + ' 当前 ' + finalTid + '；processing新tid=' + sawNewProcessingTid);
      }
      if (sawNewProcessingTid) {
        throw new Error('二次开始进入新任务过程态 ' + sawNewProcessingTid + '（基线 ' + baselineTid + '）');
      }
      const bodyAfter = await page.locator('body').innerText().catch(() => '');
      if (!/已打开今天相同条件的评估结果/.test(bodyAfter) && !sawHint && finalTid !== baselineTid) {
        await expect(page.getByText('已打开今天相同条件的评估结果').first()).toBeVisible({ timeout: 5000 });
      }
      await expect(main().getByRole('heading', { name: '商业力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      if (parseTid(page.url()) && parseTid(page.url()) !== baselineTid) {
        throw new Error('URL task_id 与基线不一致');
      }
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await clickRecentTab();
      const histAfterSecond = await countHistoryRows();
      if (histAfterSecond > histBeforeSecond) {
        throw new Error('最近评估条数增加：二次前 ' + histBeforeSecond + ' 二次后 ' + histAfterSecond + '（基线任务 ' + baselineTid + '）');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01904 附录 E.5：同用户同条件当天商业力已成功→再次「开始分析」直达已有结果且 task_id 不变；现场 Message「已打开今天相同条件的评估结果」（对齐 FUNC-01789 技术力）。
  30888 路由 enterprise-center/evaluation?workspace=business&mode=business；前置 assert 内首次分析后回配置：优先「调整配置」，否则 goto 首次 enterprise_codes 深链（用例前置「已按该条件回到配置页」）。二次开始若 view=processing 且 task_id≠基线→失败。最近评估条数二次前后比对（对齐用例预期 2）。B 档零 allow_skip；预检 ENV-EVAL-BUSINESS-PRECHECK-001；空壳 ENV-EVAL-BUSINESS-RESULT-SHELL-001。登录与关内部评审由 runner 会话前置。
