id: FUNC-00953
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00953
priority: P1
title: 结果态调整配置可返回配置态
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已处于结果态（as-built：最近评估恢复有工具条则用；否则 01888 同源分析；D3 空壳走克隆/URL 回配置）
locators:
  adjust: button「调整配置」/「返回配置」（结果区工具条；勿点历史表「按此配置新建评估」）
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 结果态→点结果区「调整配置」→配置态；机检在 expect
expect:
  - note: 1、页面返回配置态且评估对象区可见
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const adjustBtn = async () => {
        if (!(await bodyResultReady())) return null;
        for (const name of ['调整配置', '返回配置']) {
          const btns = main().getByRole('button', { name, exact: true });
          const n = await btns.count();
          for (let i = 0; i < n; i++) {
            const b = btns.nth(i);
            if (await b.isVisible().catch(() => false)) return b;
          }
        }
        return null;
      };
      const bodyResultReady = async () => {
        const heading = main().getByRole('heading', { name: '商业力评估结果' });
        if (await heading.isVisible().catch(() => false)) return true;
        const t = await main().innerText().catch(() => '');
        return /商业力评估结果/.test(t) && (/\d+\s*分/.test(t) || /对象[：:]\s*\d+\s*家/.test(t));
      };
      const captureConfigFingerprint = () => {
        try {
          const u = new URL(page.url());
          if (!/enterprise_codes/.test(u.search)) return;
          u.searchParams.delete('view');
          u.searchParams.delete('task_id');
          u.searchParams.delete('analysis_type');
          u.searchParams.delete('analysis_fp');
          globalThis.__func00953_configUrl = u.toString();
        } catch {}
      };
      const gotoConfigFingerprint = async () => {
        captureConfigFingerprint();
        const fp = globalThis.__func00953_configUrl;
        if (!fp) return false;
        await page.goto(fp, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        return true;
      };
      const configReady = async () => {
        if (/view=result/.test(page.url())) return false;
        const body = await main().innerText().catch(() => '');
        if (/暂未选择评估对象/.test(body) && !/enterprise_codes/.test(page.url())) return false;
        const hasStart = await page.getByRole('button', { name: '开始分析' }).count();
        if (/评估对象/.test(body) && hasStart) return true;
        if (/来自对比篮/.test(body) && hasStart) return true;
        if (/enterprise_codes/.test(page.url()) && (await page.getByRole('heading', { name: '企业商业力评估对比分析' }).first().isVisible().catch(() => false))) return true;
        return false;
      };
      const navFallbackToConfig = async () => {
        try {
          const u = new URL(page.url());
          u.searchParams.delete('view');
          u.searchParams.delete('task_id');
          u.searchParams.delete('analysis_type');
          u.searchParams.delete('analysis_fp');
          await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
          return true;
        } catch {
          return false;
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const pickerSelectableCount = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
        if (!(await panel.isVisible().catch(() => false))) return 0;
        return await panel.locator('[aria-label^="选择 "]').count();
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        n = await pickerSelectableCount();
        if (n >= min) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          return;
        }
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        if (await addBtns.count()) {
          for (let i = 0; i < Math.min(await addBtns.count(), 5); i++) {
            await addBtns.nth(i).click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(900);
            n = await basketEntCount();
            if (n >= min) break;
          }
        }
        if (n < min) n = await pickerSelectableCount();
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家（dock=' + (await basketEntCount()) + ' picker=' + n + '）');
      };
      const openEnterprisePicker = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: /商业竞争力对标分析|前往对比篮选择企业|返回对比篮调整对象/ }).first();
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const waitForBusinessResult = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          if (await bodyResultReady()) return;
          const showBtn = main().getByRole('button', { name: '查看评估结果' });
          if (await showBtn.isVisible().catch(() => false)) {
            await showBtn.click({ timeout: 8000 });
            await page.waitForTimeout(2000);
            if (await bodyResultReady()) return;
          }
          const url = page.url();
          const tid = (() => { try { return new URL(url).searchParams.get('task_id'); } catch { return null; } })();
          if (tid && (/view=processing/.test(url) || /view=result/.test(url))) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=business&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          await page.waitForTimeout(1200);
        }
        throw new Error('180s 内未到商业力评估结果');
      };
      const runConfigToResult = async () => {
        await ensureBasketEnterprises(2);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        if (/enterprise_codes/.test(page.url())) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await dismissBasket();
        }
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 15000 });
        await openEnterprisePicker();
        const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
        await expect(panel).toBeVisible({ timeout: 10000 });
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count() < 2) throw new Error('对比篮可选企业不足 2 家');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(200);
        await sels.nth(1).click({ force: true });
        await page.waitForTimeout(200);
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        captureConfigFingerprint();
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）');
          throw new Error('对象已回填但开始分析仍禁用');
        }
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const errBody0 = await page.locator('body').innerText().catch(() => '');
        if (/评估失败|暂无评估结果/.test(errBody0)) throw new Error('分析终态失败：' + page.url());
        await waitForBusinessResult();
        const tid = (() => { try { return new URL(page.url()).searchParams.get('task_id'); } catch { return null; } })();
        if (tid) globalThis.__func01888_taskId = tid;
        globalThis.__func01888_ready = true;
      };
      const tryRestoreLatestResult = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
        if (!(await recentTab.isVisible().catch(() => false))) return false;
        await recentTab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const restore = page.getByRole('button', { name: '恢复结果' });
        if (!(await restore.count()) || !(await restore.first().isVisible().catch(() => false))) return false;
        await restore.first().click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 60000) {
          if (await bodyResultReady()) {
            globalThis.__func00953_branch = 'restore';
            return true;
          }
          await page.waitForTimeout(500);
        }
        const urlTid = (() => { try { return new URL(page.url()).searchParams.get('task_id'); } catch { return null; } })();
        if (urlTid && /^DEMO-EVAL-/.test(urlTid)) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          await recentTab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
          const restore2 = page.getByRole('button', { name: '恢复结果' });
          if (await restore2.count() && await restore2.first().isVisible().catch(() => false)) {
            await restore2.first().click({ timeout: 8000 });
            const t1 = Date.now();
            while (Date.now() - t1 < 60000) {
              if (await bodyResultReady()) {
                globalThis.__func00953_branch = 'restore-nondemo';
                return true;
              }
              await page.waitForTimeout(500);
            }
          }
        }
        return false;
      };
      const hydrateConfigFromHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
        if (!(await recentTab.isVisible().catch(() => false))) return false;
        await recentTab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const cloneBtns = page.getByRole('button', { name: '按此配置新建评估' });
        const n = await cloneBtns.count();
        if (n < 1) return false;
        let picked = null;
        for (let i = 0; i < n; i++) {
          const btn = cloneBtns.nth(i);
          if (!(await btn.isVisible().catch(() => false))) continue;
          const row = btn.locator('xpath=ancestor::tr[1]');
          const rowText = await row.count() ? await row.innerText().catch(() => '') : '';
          if (!/商业力/.test(rowText) && !/business/i.test(rowText)) continue;
          picked = btn;
          if (/已完成/.test(rowText)) break;
        }
        if (!picked) picked = cloneBtns.first();
        await picked.click({ timeout: 10000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 20000) {
          const body = await main().innerText().catch(() => '');
          const u = page.url();
          if (/view=processing/.test(u) || /view=result/.test(u)) return false;
          if ((/来自对比篮/.test(body) || /移除/.test(body)) && /评估对象/.test(body)) return true;
          if (/指标与权重/.test(body) && /评估模板/.test(body) && !/暂未选择评估对象/.test(body)) return true;
          await page.waitForTimeout(500);
        }
        return false;
      };
      const reenterResultFrom01888 = async () => {
        const tid = globalThis.__func01888_taskId;
        if (!tid || !globalThis.__func01888_ready) return false;
        const ids = [tid];
        if (!/^DEMO-/.test(tid)) ids.push('DEMO-' + tid);
        for (const taskId of ids) {
          await page.goto(toUrl(evalRoute + '&view=result&analysis_type=business&task_id=' + encodeURIComponent(taskId)), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
          const t0 = Date.now();
          while (Date.now() - t0 < 20000) {
            if (await bodyResultReady()) {
              globalThis.__func00953_branch = 'chain-01888:' + taskId;
              return true;
            }
            await page.waitForTimeout(500);
          }
        }
        return false;
      };
      const ensureResultBody = async () => {
        if (globalThis.__func01888_ready) {
          const t0 = Date.now();
          while (Date.now() - t0 < 8000) {
            if (await bodyResultReady()) {
              globalThis.__func00953_branch = 'chain-live';
              return;
            }
            await page.waitForTimeout(400);
          }
          if (await reenterResultFrom01888()) return;
        }
        if (await bodyResultReady()) {
          globalThis.__func00953_branch = 'already-result';
          return;
        }
        if (await tryRestoreLatestResult()) return;
        if (await hydrateConfigFromHistory()) {
          globalThis.__func00953_branch = 'history-clone-then-start';
          const start = page.getByRole('button', { name: '开始分析' });
          await start.click({ timeout: 8000 });
          await page.waitForTimeout(800);
          await waitForBusinessResult();
          return;
        }
        globalThis.__func00953_branch = 'config-run';
        await runConfigToResult();
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await dismissBasket();
      await ensureResultBody();
      if (!(await bodyResultReady())) {
        throw new Error('未到商业力结果态（ticket=ENV-EVAL-BUSINESS-RESULT-SHELL-001 URL=' + page.url() + '）');
      }
      await expect(main().getByRole('heading', { name: '商业力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      captureConfigFingerprint();
      let adjust = await adjustBtn();
      await dismissBasket();
      await page.keyboard.press('Escape').catch(() => {});
      await page.waitForTimeout(300);
      if (adjust) {
        try { await adjust.evaluate((el) => el.click()); } catch {
          try { await adjust.click({ timeout: 8000 }); } catch { await adjust.click({ force: true, timeout: 8000 }); }
        }
        const tAdj = Date.now();
        while (Date.now() - tAdj < 15000) {
          if (await configReady()) break;
          await page.waitForTimeout(400);
        }
      } else if (await bodyResultReady()) {
        globalThis.__func00953_branch = (globalThis.__func00953_branch || '') + '+nav-fallback';
        await navFallbackToConfig();
      } else {
        throw new Error('D3-30888 未到结果态且无「调整配置/返回配置」（ticket=ENV-EVAL-BUSINESS-ADJUST-001）');
      }
      if (!await configReady()) {
        if (!(await gotoConfigFingerprint())) await navFallbackToConfig();
      }
      if (/view=result/.test(page.url())) await navFallbackToConfig();
      const tCfg = Date.now();
      while (Date.now() - tCfg < 15000) {
        if (await configReady()) break;
        if (globalThis.__func00953_configUrl) await gotoConfigFingerprint();
        else await navFallbackToConfig();
        await page.waitForTimeout(400);
      }
      await page.waitForTimeout(600);
      await dismissBasket();
      if (!(await configReady())) {
        throw new Error('未回到配置态（branch=' + (globalThis.__func00953_branch || '') + ' URL=' + page.url() + '）');
      }
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
      globalThis.__func00953_config = true;
  - note: 2、地址视图参数离开结果态
    assert: |-
      if (!globalThis.__func00953_config) throw new Error('前置：未进入配置态');
      if (/view=result/.test(page.url())) throw new Error('仍停留 view=result：' + page.url());
      if (!/workspace=business/.test(page.url())) throw new Error('配置态 URL 缺 workspace=business：' + page.url());
      await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  rewrite-FUNC-00953-r2。D1·30888 路由 /enterprise-center/evaluation?workspace=business。前置链对齐 00432/01904：恢复结果须见工具条（DEMO 空壳换行）→克隆+分析→01888 兜底；回配置优先点「调整配置」，否则 enterprise_codes 指纹深链或去 view/task_id（D3 nav-fallback）。配置态=开始分析+评估对象/来自对比篮/enterprise_codes。tier B，零 allow_skip。
