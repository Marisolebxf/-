id: FUNC-00953
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00953
priority: P1
tier: B
title: 结果态调整配置可返回配置态
entry_id: ent-eval-business
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→恢复结果→点返回配置；机检在 expect
expect:
  - note: 页面返回配置态且评估对象区可见
    assert: |-
      await page.waitForTimeout(1500);
      const closeB = page.getByRole('button', { name: '关闭对比篮' });
      if (await closeB.count()) await closeB.first().click().catch(() => {});
      await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
      const restore = page.getByRole('button', { name: '恢复结果' });
      await restore.first().waitFor({ state: 'visible', timeout: 10000 });
      if ((await restore.count()) < 1) throw new Error('最近评估无已完成任务可「恢复结果」');
      await restore.first().click({ timeout: 8000 });
      const t0 = Date.now();
      while (Date.now() - t0 < 30000) {
        if (/view=result/.test(page.url())) break;
        await page.waitForTimeout(1500);
      }
      await expect(page).toHaveURL(/view=result/);
      const backCfg = page.getByRole('button', { name: '返回配置' });
      await backCfg.first().waitFor({ state: 'visible', timeout: 10000 });
      await backCfg.first().click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await expect(page.getByText('评估对象').first()).toBeVisible({ timeout: 8000 });
  - note: 地址视图参数离开结果态
    assert: |-
      await expect(page).not.toHaveURL(/view=result/);
on_fail: 截图 + 抄 X-Trace-Id
