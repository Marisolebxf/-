id: P0-16
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00947
priority: P0
title: 结果态诊断明细呈现各企业商业力诊断信息
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
preconditions:
  - 「最近评估」Tab 至少 1 条已完成任务可「恢复结果」（env-gate historical_results.pass=true；≥2 家对象）
  - 不重复发起链（预检/开始分析由 ENV-EVAL-BUSINESS-PRECHECK-001 域覆盖）
locators:
  hist_tab: Tab「最近评估」
  restore_button: button「恢复结果」
  diag_block: 文本「商业诊断与明细」（as-built；用例「诊断明细」）
  diag_col: 表头「诊断结论」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→首个「恢复结果」直达结果态后浏览诊断明细区块；机检判定在 expect
expect:
  - note: 诊断明细区块存在且按企业呈现
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const closeB = page.getByRole('button', { name: '关闭对比篮' }); if (await closeB.count()) await closeB.first().click().catch(()=>{}); await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 }); const restore = page.getByRole('button', { name: '恢复结果' }); await restore.first().waitFor({ state: 'visible', timeout: 10000 }); if ((await restore.count()) < 1) throw new Error('最近评估无已完成任务可「恢复结果」'); await restore.first().click({ timeout: 8000 }); const t0 = Date.now(); while (Date.now() - t0 < 30000) { if (/view=result/.test(page.url())) break; await page.waitForTimeout(1500); } await expect(page).toHaveURL(/view=result/); await expect(page.getByText(/商业诊断与明细/).first()).toBeVisible({ timeout: 15000 }); const main = await page.locator('main').first().innerText(); const i = main.indexOf('商业诊断与明细'); if (i < 0) throw new Error('未见商业诊断与明细'); const chunk = main.slice(i, i + 2500); const firms = [...chunk.matchAll(/[\u4e00-\u9fff\w]+(?:有限公司|股份有限公司|公司)/g)].map((m) => m[0]); const uniq = [...new Set(firms)]; if (uniq.length < 2) throw new Error('诊断区按企业呈现不足 2 家: ' + JSON.stringify(uniq))
  - note: 诊断内容含商业力优势与差距信息
    assert: |-
      await expect(page).toHaveURL(/view=result/); await expect(page.getByText(/商业诊断与明细/).first()).toBeVisible({ timeout: 10000 }); const main = await page.locator('main').first().innerText(); const i = main.indexOf('商业诊断与明细'); if (i < 0) throw new Error('未见商业诊断与明细'); const chunk = main.slice(i, i + 2500); if (!/诊断结论/.test(chunk)) throw new Error('诊断表未见「诊断结论」列'); if (!/(加强|提升|拓展|优势|差距|短板|弱项|强项|\(\s*0(?:\.0)?\s*\))/.test(chunk)) throw new Error('诊断区未见优势/差距类信息（结论文案不钉死）')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 2026-10-15 SKIP_FIELD 回炉去 allow_skip（tier B）——原案 allow_skip 无 skip_reason/ticket，且 assert 内 ALLOW_SKIP 会被 runner 判 fail 非 n/a。路径对齐 P0-06/P0-14/P0-15：最近评估→恢复结果直达 view=result（method-patch §3 闸门 5；probe-p006-result.json 实证「商业诊断与明细」+ 诊断结论列按企业行呈现，含「加强/提升/拓展」与维度(0.0)差距提示）。偏差 D1：用例「诊断明细」现场标题为「商业诊断与明细」（含子 Tab 经营诊断/营收趋势/行业对标）；诊断结论归算法库不钉死措辞；评估报告入口若可见仅 observed。发起链预检债仍记 ENV-EVAL-BUSINESS-PRECHECK-001，本条不依赖开始分析。
tier: B
