id: FUNC-00940
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00940
priority: P0
title: 权重调节钮可增减数值且非法输入不生效
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已进入商业力评估页
  - 已带入至少 2 家企业或默认配置态可调权重
locators:
  market_row: main [aria-label="选择指标：市场"] → ancestor tr
  market_weight: '[aria-label="市场权重"]'
  step_buttons: .arco-input-number-step-button
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 市场权重上调/下调与非法输入；判定在 expect 内自含（P2 跨 tick）
expect:
  - note: 上调后该指标权重数值增加
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const marketRow = () => page.locator('main [aria-label="选择指标：市场"]').locator('xpath=ancestor::tr[1]');
      const marketWeight = () => marketRow().locator('[aria-label="市场权重"]');
      const stepBtns = () => marketRow().locator('.arco-input-number-step-button');
      await dismissBasket();
      await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
      await expect(marketRow()).toBeVisible({ timeout: 8000 });
      await expect(marketWeight()).toBeEnabled({ timeout: 8000 });
      const v0 = Number(await marketWeight().inputValue());
      if (Number.isNaN(v0)) throw new Error('市场权重初值非数字');
      const btns = stepBtns();
      if (await btns.count() < 2) throw new Error('市场权重调节钮不足: ' + await btns.count());
      await btns.nth(0).click({ timeout: 8000 });
      await page.waitForTimeout(450);
      let v1 = Number(await marketWeight().inputValue());
      let upIdx = 0;
      let downIdx = 1;
      if (!(v1 > v0)) {
        await btns.nth(1).click({ timeout: 8000 });
        await page.waitForTimeout(450);
        v1 = Number(await marketWeight().inputValue());
        upIdx = 1;
        downIdx = 0;
      }
      if (!(v1 > v0)) throw new Error('上调未增加: ' + v0 + '→' + v1);
      await page.evaluate(({ u, d }) => { window.__qa00940_up = u; window.__qa00940_down = d; }, { u: upIdx, d: downIdx });
  - note: 下调后数值回落
    assert: |-
      const marketRow = () => page.locator('main [aria-label="选择指标：市场"]').locator('xpath=ancestor::tr[1]');
      const marketWeight = () => marketRow().locator('[aria-label="市场权重"]');
      const stepBtns = () => marketRow().locator('.arco-input-number-step-button');
      const downIdx = await page.evaluate(() => window.__qa00940_down);
      if (downIdx === undefined) throw new Error('缺少上调按钮索引');
      const v1 = Number(await marketWeight().inputValue());
      await stepBtns().nth(downIdx).click({ timeout: 8000 });
      await page.waitForTimeout(450);
      const v2 = Number(await marketWeight().inputValue());
      if (!(v2 < v1)) throw new Error('下调未回落: ' + v1 + '→' + v2);
  - note: 负数与小数输入不生效
    assert: |-
      const marketRow = () => page.locator('main [aria-label="选择指标：市场"]').locator('xpath=ancestor::tr[1]');
      const marketWeight = () => marketRow().locator('[aria-label="市场权重"]');
      const cur = String(await marketWeight().inputValue());
      const typeWeight = async (text) => {
        await marketWeight().click({ timeout: 8000 });
        await page.keyboard.press('Control+A');
        await page.keyboard.type(text, { delay: 40 });
        await page.keyboard.press('Tab');
        await page.waitForTimeout(400);
      };
      await typeWeight('-1');
      const a = String(await marketWeight().inputValue());
      await typeWeight('1.5');
      const b = String(await marketWeight().inputValue());
      if (a === '-1' || b === '1.5' || Number(a) < 0) throw new Error('非法输入生效: ' + a + '/' + b);
      await typeWeight(cur);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 路由 /enterprise-center/evaluation；市场行 checkbox aria「选择指标：市场」+ 权重 aria「市场权重」；step-button 在行级不在权重包装器内（observed 2026-10-19）。上调/下调索引自校准。登录与关内部评审由 runner 会话前置。接旧 P0-12 / 用例册 00940。
