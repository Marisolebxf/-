id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00943
priority: P0
title: 点击开始分析后进入过程态且任务标识正确
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
preconditions:
  - 已带入至少 2 家企业
  - 权重配置有效且「开始分析」可用
locators:
  start: button「开始分析」
  processing: 评估生成中 / 可视化分析过程
  result: 文本「商业力评估结果」+ task_id=EVAL-YYYYMMDD-NNN
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 浮层勾选 2 家确定回填；点开始分析后双分支判定（过程态 / 瞬时直达结果态），机检在 expect
expect:
  - note: 点击开始分析后双分支——甲：≤5s 出现过程态元素（生成中语义标题 / 可视化分析过程区块 / 取消任务·稍后查看·打开我的任务入口）→ 逐项断言 + 任务标识 EVAL-YYYYMMDD-NNN；乙：瞬时直达 view=result（附录 E 当天复用）→ 断言 URL 含 view=result + task_id=EVAL-YYYYMMDD-NNN + 结果壳可见；两分支均未命中才判失败
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.getByRole('button', { name: '关闭对比篮' }); if (await closeB.count()) await closeB.first().click().catch(()=>{}); const open = page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first(); await open.click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('.arco-checkbox[aria-label^="选择 "]'); const n = await sels.count(); if (n < 2) throw new Error('可选企业不足'); for (let i = 0; i < 2; i++) await sels.nth(i).click({ force: true }); await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 }); await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) { throw new Error('回填后开始分析禁用（环境闸门回退？）') }; await start.click(); let branch = null; const t0 = Date.now(); while (Date.now() - t0 < 5000) { const procEl = page.getByText(/评估生成中|商业力.*生成中|可视化分析过程/).first(); if (await procEl.isVisible().catch(() => false)) { branch = 'processing'; break } if (/view=result/.test(page.url())) { branch = 'result'; break } await page.waitForTimeout(300) } if (branch === 'processing') { await expect(page.getByText(/评估生成中|商业力.*生成中/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/可视化分析过程/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /取消任务/ }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /稍后查看/ }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /打开我的任务/ }).first()).toBeVisible({ timeout: 8000 }); let tid = /EVAL-\d{8}-\d{3}/.test(page.url()); if (!tid) { const txt = await page.locator('main').innerText().catch(() => ''); tid = /EVAL-\d{8}-\d{3}/.test(txt) } if (!tid) throw new Error('过程态未见 EVAL-YYYYMMDD-NNN 任务标识') } else if (branch === 'result') { const t1 = Date.now(); while (Date.now() - t1 < 30000 && !/view=result/.test(page.url())) await page.waitForTimeout(500); if (!/view=result/.test(page.url())) throw new Error('过程态超窗且未达 view=result'); if (!/task_id=EVAL-\d{8}-\d{3}/.test(page.url())) throw new Error('结果态 URL 缺 task_id=EVAL-YYYYMMDD-NNN：' + page.url()); await expect(page.getByText('商业力评估结果').first()).toBeVisible({ timeout: 15000 }); await expect(page.locator('body').getByText(/\d+\s*分/).first()).toBeVisible({ timeout: 15000 }) } else { throw new Error('双分支均未命中：5s 未捕到过程态元素且未直达 view=result') }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 双分支诚实断言（父裁决 2026-10-15 V2 回炉）——分支命中情况为执行时 observed（steps.md/截图判读）。偏差 D2：用例蓝本预期「过程态页面可观测」，现场 demo 任务近即时完成且同指纹当天复用时产品代码直达 view=result（EnterpriseEvaluationPage.tsx L587-602 附录 E 设计行为，非缺陷；V2 实跑实证 URL 直达 task_id=EVAL-20261015-001），过程态 5s 过窗不可达；建议回开用例修订单补「瞬时完成直达结果」分支口径。历史：10-14 闸门 fail（ENV-EVAL-BUSINESS-PRECHECK-001）→ 10-15 恢复（probe-p005-gate.json）→ V1 过程态实跑 pass → V2 当天复用直达结果 fail → 本版双分支。跨 tick 规约 P2（点击后先 5s 短窗轮询过程态，超窗转 30s 轮询 view=result）；无伪造进度百分比（过程态分支只断言区块与入口存在，不读任何百分比数字）；结果壳口径与 P0-06 一致（商业力评估结果 + N 分）
tier: B
