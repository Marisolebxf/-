id: FUNC-01889
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01889
priority: P0
title: 对比篮勾选两家企业发起分析进入商业力评估结果
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: A
preconditions:
  - 已进入商业力评估页；对比篮企业页签至少 2 家企业（脚本可自含入篮）
locators:
  dock: button aria-label 含「打开对比篮」
  panel: .system-compare-panel
  launch: button「发起分析」
  task_modal: .arco-modal:visible
  biz_task: 商业力评估 / 企业商业力评估对比分析
  next: button「下一步：前往配置」
  start: button「开始分析」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 打开对比篮→企业页签勾选 2 家→发起分析→选商业力→下一步→开始分析→等待结果；判定在 expect
expect:
  - note: 1、页面标题为「商业力评估结果」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 ' + n);
      };
      const bodyResultReady = async () => {
        const heading = main().getByRole('heading', { name: '商业力评估结果' });
        if (await heading.isVisible().catch(() => false)) return true;
        const t = await main().innerText().catch(() => '');
        return /商业力评估结果/.test(t) && (/\d+\s*分/.test(t) || /对象[：:]\s*\d+\s*家/.test(t));
      };
      const waitForBusinessResult = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          if (await bodyResultReady()) return;
          const showBtn = main().getByRole('button', { name: '查看评估结果' });
          if (await showBtn.isVisible().catch(() => false)) {
            await showBtn.click({ timeout: 8000 });
            await page.waitForTimeout(2000);
            if (await bodyResultReady()) return;
          }
          const url = page.url();
          const tid = (() => { try { return new URL(url).searchParams.get('task_id'); } catch { return null; } })();
          if (tid && (/view=processing/.test(url) || /view=result/.test(url))) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=business&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          const slice = await main().innerText().catch(() => '');
          if (/评估结果已生成/.test(slice) && (await showBtn.isVisible().catch(() => false))) {
            await showBtn.click({ timeout: 8000 });
            await page.waitForTimeout(2000);
            if (await bodyResultReady()) return;
          }
          await page.waitForTimeout(1200);
        }
        throw new Error('180s 内未到商业力评估结果：' + page.url());
      };
      const pickBizTask = async (modal) => {
        const candidates = ['商业力评估', '企业商业力评估对比分析'];
        for (const label of candidates) {
          const opt = modal.getByText(label, { exact: true }).first();
          if (await opt.count()) {
            await opt.click({ timeout: 8000 });
            return label;
          }
        }
        const radio = modal.getByRole('radio').filter({ hasText: /商业力/ }).first();
        if (await radio.count()) {
          await radio.click({ timeout: 8000 });
          return '商业力';
        }
        throw new Error('选择分析任务浮层未见商业力评估项');
      };
      const selectTwoInBasket = async (panel) => {
        const entTab = panel.getByRole('tab', { name: /企业/ }).first();
        if (await entTab.count() && await entTab.isVisible().catch(() => false)) {
          await entTab.click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count() < 2) throw new Error('对比篮企业页签可选不足 2 家');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(200);
        await sels.nth(1).click({ force: true });
        await page.waitForTimeout(200);
        globalThis.__func01889_selected = 2;
      };
      const runBasketLaunchToResult = async () => {
        await ensureBasketEnterprises(2);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        await expect(dockBtn).toBeVisible({ timeout: 10000 });
        await dockBtn.click({ timeout: 10000 });
        await page.waitForTimeout(1000);
        const panel = page.locator('.system-compare-panel');
        await expect(panel).toBeVisible({ timeout: 10000 });
        await selectTwoInBasket(panel);
        const launch = panel.getByRole('button', { name: '发起分析', exact: true });
        if (await launch.isDisabled()) throw new Error('勾选两家后「发起分析」仍不可点');
        await launch.click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        const modal = page.locator('.arco-modal:visible, .analysis-picker-modal').first();
        await expect(modal).toBeVisible({ timeout: 10000 });
        await expect(modal.getByText('选择分析任务', { exact: true }).first()).toBeVisible({ timeout: 8000 });
        await pickBizTask(modal);
        await page.waitForTimeout(400);
        const nextBtn = modal.getByRole('button', { name: '下一步：前往配置', exact: true });
        await expect(nextBtn).toBeEnabled({ timeout: 8000 });
        await nextBtn.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 15000 });
        const fillT0 = Date.now();
        while (Date.now() - fillT0 < 20000) {
          const txt = await main().innerText().catch(() => '');
          if (/来自对比篮/.test(txt) || /enterprise_codes/.test(page.url())) break;
          await page.waitForTimeout(500);
        }
        const start = page.getByRole('button', { name: '开始分析' });
        await expect(start).toBeVisible({ timeout: 10000 });
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）');
          throw new Error('配置页「开始分析」仍禁用');
        }
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const errBody0 = await page.locator('body').innerText().catch(() => '');
        if (/评估失败|暂无评估结果/.test(errBody0)) throw new Error('分析终态失败：' + page.url());
        await waitForBusinessResult();
        globalThis.__func01889_ready = true;
      };
      if (!globalThis.__func01889_ready) await runBasketLaunchToResult();
      await expect(main().getByRole('heading', { name: '商业力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      await expect(page.getByText('商业力评估结果').first()).toBeVisible({ timeout: 15000 });
  - note: 2、展示任务 ID
    assert: |-
      const main = () => page.locator('main.app-main').first();
      let tid = null;
      const url = page.url();
      try { tid = new URL(url).searchParams.get('task_id'); } catch {}
      if (!tid) {
        const t = await main().innerText().catch(() => '');
        const tm = t.match(/(?:DEMO-)?EVAL-\d{8}-\d{3,}/);
        if (tm) tid = tm[0];
      }
      if (!tid || !/^(?:DEMO-)?EVAL-\d{8}-\d{3,}$/.test(tid)) throw new Error('未见 EVAL-日期-序号 任务 ID：' + url);
      globalThis.__func01889_taskId = tid;
      await expect(main().getByText(tid).first()).toBeVisible({ timeout: 10000 });
  - note: 3、对象家数与所勾选企业数一致
    assert: |-
      const main = () => page.locator('main.app-main').first();
      const selected = globalThis.__func01889_selected || 2;
      const t = await main().innerText().catch(() => '');
      let m = t.match(/对象[：:]\s*(\d+)\s*家/);
      if (!m) m = t.match(/纳入评价企业[\s\S]{0,32}?(\d+)\s*家/);
      if (!m) m = t.match(/来自对比篮[^0-9]*(\d+)\s*家/);
      if (!m) throw new Error('结果页未解析对象家数');
      const n = parseInt(m[1], 10);
      if (n !== selected) throw new Error('对象家数 ' + n + ' 与勾选 ' + selected + ' 不一致');
      await expect(main().getByText(new RegExp(n + '\\s*家')).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  金样 01889：系统对比篮勾选 2 家→「发起分析」→「选择分析任务」选商业力（长标题「企业商业力评估对比分析」回退）→「下一步：前往配置」→「开始分析」至「商业力评估结果」。过程态点「查看评估结果」或 task_id 深链 view=result（对齐 FUNC-01888）。任务 ID 可为 DEMO-EVAL-YYYYMMDD-NNNNNN。D1·30888 路由 /enterprise-center/evaluation；打开对比篮用 dock aria-label（用例「打开对比篮」）。登录与关内部评审由 runner 会话前置。tier A 禁止 allow_skip。
