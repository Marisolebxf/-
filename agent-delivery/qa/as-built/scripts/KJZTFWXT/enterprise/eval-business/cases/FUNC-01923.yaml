id: FUNC-01923
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01923
priority: P1
title: 最近评估新建评估回到未选企业配置
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-business
tier: B
preconditions:
  - 位于最近评估 Tab
locators:
  tab_recent: tab「最近评估」
  tab_current: tab「当前分析」
  new_eval_btn: button「新建评估」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→点「新建评估」；当前分析空态与不增任务断言在 expect
expect:
  - note: 1、进入当前分析
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=business&mode=business';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/g;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const evalTablist = () =>
        page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) }).first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const clickRecentTab = async () => {
        const tablists = page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) });
        const list = (await tablists.count()) ? tablists.first() : page.locator('[role=tablist]').first();
        const recent = list.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recent).toBeVisible({ timeout: 10000 });
        await recent.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const countRecentTasks = async () => {
        const txt = await main().innerText().catch(() => '');
        const ids = txt.match(TID_RE) || [];
        const uniq = [...new Set(ids)];
        return { uniq: uniq.length, ids: uniq, txt };
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await closeBasket();
      const bodyGate = await page.locator('body').innerText().catch(() => '');
      if (/404|页面不存在/.test(bodyGate)) {
        throw new Error('入口 404（svcz 须用 catalog_path /enterprise/evaluation，勿用 enterprise-center）：' + page.url());
      }
      await expect(page.getByText('企业商业力评估对比分析', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      await clickRecentTab();
      await expect(page.getByRole('button', { name: '新建评估' }).first()).toBeVisible({ timeout: 10000 });
      const before = await countRecentTasks();
      await page.evaluate((d) => { window.__gkx_qa_01923 = d; }, { before, urlBefore: page.url() });
      const newBtn = page.getByRole('button', { name: '新建评估' }).first();
      await newBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      if (await main().getByText('任务名称', { exact: true }).count()) {
        const taskHdr = main().getByText('任务名称', { exact: true }).first();
        if (await taskHdr.isVisible().catch(() => false)) {
          throw new Error('点击新建评估后仍停留在最近评估列表');
        }
      }
      const mainText = await main().innerText().catch(() => '');
      if (/商业力评估结果/.test(mainText) && /view=result/.test(page.url())) {
        throw new Error('新建评估后仍停留在结果态：' + page.url());
      }
      if (!/评估模板/.test(mainText) || !/评估对象/.test(mainText)) {
        throw new Error('新建评估后未见配置页主区（片段=' + mainText.slice(0, 200).replace(/\s+/g, ' ') + '）');
      }
      const list = evalTablist();
      if (await list.count()) {
        const curTab = list.getByRole('tab', { name: '当前分析', exact: true });
        const curSel = await curTab.getAttribute('aria-selected').catch(() => null);
        if (curSel !== 'true' && !/评估模板/.test(mainText)) {
          throw new Error('当前分析 Tab 未选中且主区非配置态（aria-selected=' + curSel + '）');
        }
      }
  - note: 2、对象区为未选企业空态
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const mainText = await main().innerText().catch(() => '');
      const emptyGuide30888 =
        /暂未选择评估对象/.test(mainText) &&
        /(?:请先在对比篮|请在系统对比[篮库])/.test(mainText) &&
        /选择企业/.test(mainText);
      const emptyGuideEdu = /请先在对比篮选择企业/.test(mainText) && /进入企业评估配置/.test(mainText);
      if (!emptyGuide30888 && !emptyGuideEdu) {
        throw new Error('对象区未见对比篮选企空态引导（片段=' + mainText.slice(0, 320).replace(/\s+/g, ' ') + '）');
      }
      const filledBasket = /来自对比篮\s*·\s*\d+/.test(mainText) && !/暂未选择评估对象/.test(mainText);
      if (filledBasket) {
        throw new Error('新建评估后对象区仍显示已回填企业（应为空配置）');
      }
      const removeN = await main().locator('button[aria-label^="移除"]').count();
      if (removeN > 0) {
        throw new Error('对象区仍有移除钮（已选企业），应为空态');
      }
  - note: 3、不产生新的任务 ID
    assert: |-
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/g;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const evalTablist = () =>
        page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) }).first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const s = await page.evaluate(() => window.__gkx_qa_01923 || null);
      if (!s || !s.before) throw new Error('缺 expect1 落盘的历史任务快照');
      const u = page.url();
      if (/view=processing/.test(u)) {
        throw new Error('新建评估后误入过程态（不应发起分析）：' + u);
      }
      const urlTid = (() => { try { return new URL(u).searchParams.get('task_id'); } catch { return null; } })();
      if (urlTid && !/view=result|view=report/.test(u)) {
        throw new Error('配置页 URL 不应绑定历史 task_id：' + u);
      }
      await closeBasket();
      const list = evalTablist();
      if (await list.count()) {
        const recent = list.getByRole('tab', { name: '最近评估', exact: true });
        await recent.click({ timeout: 8000 });
        await page.waitForTimeout(1000);
      }
      const txt = await main().innerText().catch(() => '');
      const ids = txt.match(TID_RE) || [];
      const uniq = [...new Set(ids)];
      if (uniq.length > s.before.uniq) {
        throw new Error('最近评估任务 ID 数增加: ' + s.before.uniq + '→' + uniq.length);
      }
      const newIds = uniq.filter((id) => !s.before.ids.includes(id));
      if (newIds.length) {
        throw new Error('出现新任务 ID：' + newIds.join(', '));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01923 最近评估点「新建评估」→当前分析配置页 + 对象区空态；不产生新 task_id（历史 ID 集合前后比对 + 配置页非 view=processing）。D1·edu.itic-sci.com/tts/svcz entry-seed ent-eval-business：goto catalog_path /enterprise/evaluation?workspace=business&mode=business（/enterprise-center/evaluation 404）。对象空态双轨：30888「暂未选择评估对象」+对比[篮库]；edu 现场「请先在对比篮选择企业，再进入企业评估配置。」（testdata.object.empty_hint）。B 档零 allow_skip。
