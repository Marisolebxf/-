id: FUNC-01905
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01905
priority: P0
tier: B
title: 主流程-企业画像-查看画像打开企业画像快览
entry_id: ent-eval-business
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: click
    target: main
    script: |-
      await page.getByRole('menuitem', { name: '企业商业力评估对比分析' }).click()
      await page.waitForURL(/\/enterprise\/evaluation/)
  - action: click
    target: main
    script: |-
      await page.locator('main').getByText('前往对比篮选择企业').click()
  - action: click
    target: main
    script: |-
      await page.locator('main').getByRole('button', { name: '新增' }).click()
  - action: click
    target: main
    script: |-
      await page.locator('main').getByRole('button', { name: '加入对比篮' }).first().click()
  - action: click
    target: main
    script: |-
      await page.locator('main').getByRole('button', { name: '查看画像' }).first().click()
expect:
  - note: 1、标题为「企业画像快览」且含该企业名
    assert: |-
      await expect(page.locator('main').getByText('企业画像快览')).toBeVisible()
  - note: 2、含基础摘要、竞争力摘要、风险摘要
    assert: |-
      await expect(page.locator('main').getByText('基础摘要')).toBeVisible()
      await expect(page.locator('main').getByText('竞争力摘要')).toBeVisible()
      await expect(page.locator('main').getByText('风险摘要')).toBeVisible()
  - note: 3、有「加入对比」和「查看详情」
    assert: |-
      await expect(page.locator('main').getByRole('button', { name: '加入对比' })).toBeVisible()
      await expect(page.locator('main').getByRole('button', { name: '查看详情' })).toBeVisible()
on_fail: 截图 + 抄 X-Trace-Id
