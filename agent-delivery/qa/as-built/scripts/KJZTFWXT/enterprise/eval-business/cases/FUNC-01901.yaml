id: FUNC-01901
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01901
priority: P1
title: 稍后查看回到最近评估且任务仍在处理中
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 过程页可出现离开入口（规格「稍后查看」或 as-built「查看最近评估」）
  - 脚本内：优先回填两家→开始分析进过程窗；兜底最近评估→恢复结果→重新分析
locators:
  start: button「开始分析」
  view_later: button「稍后查看」
  view_recent_eval: button「查看最近评估」
  hist_tab: Tab「最近评估」
  continue_view: button「继续查看」
  restore: button「恢复结果」
  reanalyze: button「重新分析」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 过程页点离开→最近评估列表核对处理中与继续查看；机检在 expect
expect:
  - note: 1、进入「最近评估」列表
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const procHint = /商业力.*生成中|评估生成中|可视化分析过程/;
      const TID_RE = /((?:DEMO-)?EVAL-\d{8}-\d{3})/g;
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const readTidFromBody = async () => {
        const body = await main().innerText().catch(() => '');
        const m = body.match(/任务\s*ID[：:\s\t]*(DEMO-EVAL-\d{8}-\d{3}|EVAL-\d{8}-\d{3})/);
        if (m) return m[1];
        const u = page.url();
        const fromUrl = (u.match(/task_id=([^&]+)/) || [])[1];
        return fromUrl ? decodeURIComponent(fromUrl) : null;
      };
      const waitLaterBtn = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          const later = page.getByRole('button', { name: '稍后查看', exact: true });
          if ((await later.count()) && (await later.first().isVisible().catch(() => false)) && (await later.first().isEnabled().catch(() => false))) {
            return { kind: 'later', btn: later.first() };
          }
          const recent = page.getByRole('button', { name: '查看最近评估', exact: true });
          if ((await recent.count()) && (await recent.first().isVisible().catch(() => false)) && (await recent.first().isEnabled().catch(() => false))) {
            return { kind: 'recent_cta', btn: recent.first() };
          }
          const t = await page.locator('body').innerText().catch(() => '');
          const u = page.url();
          if (/当前评估任务不存在或已失效/.test(t) && /view=processing/.test(u)) {
            throw new Error('ENV-EVAL-BUSINESS-PROCESS-WINDOW-001: 过程态空壳且无离开钮（URL=' + u + '）');
          }
          if (/预检未返回企业明细/.test(t)) throw new Error('预检阻塞（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）');
          if (/view=result/.test(u) && /商业力评估结果/.test(t) && !(await page.getByText(procHint).first().isVisible().catch(() => false))) {
            return null;
          }
          await page.waitForTimeout(400);
        }
        return null;
      };
      const ensureBasketEnterprises = async (min) => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        const basketEntCount = async () => {
          if (!(await dockBtn.count())) return 0;
          const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
          const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
          return entM ? parseInt(entM[1], 10) : 0;
        };
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        let clicks = 0;
        while (n < min && clicks < min + 3) {
          const idx = Math.min(clicks, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          clicks++;
          n = await basketEntCount();
        }
        if (n < min) {
          if (await dockBtn.count()) {
            await dockBtn.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(800);
            const panel = page.locator('.system-compare-panel');
            if (await panel.isVisible().catch(() => false)) {
              n = await panel.locator('.ent-compare-item-card, [aria-label^="选择 "]').count();
            }
          }
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min);
      };
      const fillTwoAndStart = async () => {
        await ensureBasketEnterprises(2);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        const openCta = page.getByRole('button', { name: /商业竞争力对标分析|前往对比篮选择企业|返回对比篮调整对象/ }).first();
        await openCta.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const sels = page.locator('[aria-label^="选择 "]');
        if (await sels.count() < 2) throw new Error('对比篮可选企业不足 2 家');
        await sels.nth(0).click({ force: true });
        await sels.nth(1).click({ force: true });
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        const start = page.getByRole('button', { name: '开始分析' });
        const t0 = Date.now();
        while (Date.now() - t0 < 45000) {
          if (!(await start.isDisabled())) break;
          if (/预检未返回企业明细/.test(await main().innerText().catch(() => ''))) {
            throw new Error('ENV-EVAL-BUSINESS-PRECHECK-001');
          }
          await page.waitForTimeout(500);
        }
        if (await start.isDisabled()) throw new Error('开始分析仍禁用');
        await start.click({ timeout: 8000 });
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /商业力评估结果/.test(t) && /\d+\s*分/.test(t);
      };
      const isDemoShell = (tid) => /^DEMO-EVAL-/.test(tid || '');
      const reanalyzeVisible = async () => {
        await main().scrollIntoViewIfNeeded().catch(() => {});
        const candidates = [
          page.getByRole('button', { name: '重新分析', exact: true }),
          main().getByRole('button', { name: '重新分析', exact: true }),
          main().locator('button').filter({ hasText: /^重新分析$/ }),
        ];
        for (const loc of candidates) {
          if (await loc.count() && await loc.first().isVisible().catch(() => false)) return loc.first();
        }
        return null;
      };
      const openRecentTab = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await dismissBasket();
        const tab = page.getByRole('tab', { name: /最近评估/ }).first();
        if (await tab.isVisible().catch(() => false)) await tab.click({ timeout: 8000 });
        else await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
      };
      const listRecentTids = async () => {
        const body = await page.locator('body').innerText().catch(() => '');
        const ids = [...body.matchAll(TID_RE)].map((m) => m[1]);
        const uniq = [...new Set(ids)];
        const live = uniq.filter((id) => !isDemoShell(id));
        return live.length ? live : uniq;
      };
      const tryResultWithReanalyze = async () => {
        if ((await bodyResultReady()) && (await reanalyzeVisible())) return true;
        await openRecentTab();
        const restore = page.getByRole('button', { name: '恢复结果' });
        const nRestore = await restore.count();
        for (let i = 0; i < Math.min(nRestore, 3); i++) {
          await restore.nth(i).click({ timeout: 8000 });
          const t0 = Date.now();
          while (Date.now() - t0 < 25000) {
            if (await bodyResultReady() && (await reanalyzeVisible())) return true;
            await page.waitForTimeout(1000);
          }
          await openRecentTab();
        }
        for (const tid of await listRecentTids()) {
          await page.goto(toUrl(evalRoute + '&view=result&analysis_type=business&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
          await dismissBasket();
          if (await bodyResultReady() && (await reanalyzeVisible())) return true;
        }
        return false;
      };
      const enterProcessingViaReanalyze = async () => {
        if (!(await tryResultWithReanalyze())) return null;
        const reBtn = await reanalyzeVisible();
        if (!reBtn) return null;
        await expect(reBtn).toBeEnabled();
        try { await reBtn.click({ timeout: 8000 }); } catch { await reBtn.click({ force: true, timeout: 8000 }); }
        let retried = false;
        let leave = await waitLaterBtn(90000);
        if (!leave && !retried) {
          const again = await reanalyzeVisible();
          if (again) {
            try { await again.click({ timeout: 5000 }); } catch { await again.click({ force: true, timeout: 5000 }); }
          }
          retried = true;
          leave = await waitLaterBtn(30000);
        }
        return leave;
      };
      let leave = await enterProcessingViaReanalyze();
      if (!leave) {
        try {
          await fillTwoAndStart();
          leave = await waitLaterBtn(90000);
        } catch (e) {
          const msg = String(e && e.message ? e.message : e);
          if (!/ENV-GATE|对比篮/.test(msg)) throw e;
          leave = await enterProcessingViaReanalyze();
          if (!leave) throw new Error('ENV-EVAL-BUSINESS-PROCESS-WINDOW-001: ' + msg);
        }
      }
      if (!leave) {
        const body = await main().innerText().catch(() => '');
        if (/view=processing/.test(page.url()) && !/稍后查看|查看最近评估/.test(body)) {
          throw new Error('DEF-ENT-EVAL-BIZ-PROCESS-CTA-001: 过程态无离开钮（30888 as-built）');
        }
        throw new Error('ENV-EVAL-BUSINESS-PROCESS-WINDOW-001: 未见可点「稍后查看」/「查看最近评估」（URL=' + page.url() + '）');
      }
      const tidBefore = await readTidFromBody();
      await leave.btn.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const tEnd = Date.now();
      while (Date.now() - tEnd < 12000) {
        if (!/view=processing/.test(page.url()) && !(await page.getByText(procHint).first().isVisible().catch(() => false))) break;
        await page.waitForTimeout(400);
      }
      if (/view=processing/.test(page.url())) {
        throw new Error('点击离开后仍停留过程态：' + page.url());
      }
      const recentTab = page.getByRole('tab', { name: '最近评估', exact: true }).first();
      const tabSel = await recentTab.getAttribute('aria-selected').catch(() => '');
      if (tabSel !== 'true') await openRecentTab();
      await expect(recentTab).toHaveAttribute('aria-selected', 'true', { timeout: 10000 });
      await expect(page.getByText('最近评估', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.locator('main .arco-table, main [class*="table"]').first()).toBeVisible({ timeout: 10000 });
      globalThis.__func01901 = { tid: tidBefore, leaveKind: leave.kind };
  - note: 2、该任务状态为「处理中」
    assert: |-
      if (!globalThis.__func01901) throw new Error('前置未完成离开过程页');
      const main = page.locator('main.app-main').first();
      const body = await main.innerText().catch(() => '');
      if (!/处理中/.test(body)) {
        throw new Error('最近评估列表未见「处理中」状态：' + body.slice(0, 200));
      }
      const tid = globalThis.__func01901.tid;
      if (tid && !body.includes(tid)) {
        const top = body.match(/(DEMO-EVAL-\d{8}-\d{3}|EVAL-\d{8}-\d{3})/);
        if (!top) throw new Error('列表未见任务 ID，期望含 ' + tid);
      }
  - note: 3、该行出现「继续查看」，报告为 0 份
    assert: |-
      if (!globalThis.__func01901) throw new Error('前置未完成');
      const cont = page.getByRole('button', { name: '继续查看', exact: true });
      await expect(cont.first()).toBeVisible({ timeout: 10000 });
      const row = cont.first().locator('xpath=ancestor::tr[1]');
      const rowText = (await row.count()) ? await row.first().innerText().catch(() => '') : await page.locator('main').innerText().catch(() => '');
      if (!/0\s*份/.test(rowText) && !/报告[\s\S]{0,40}0\s*份/.test(rowText)) {
        const mainTxt = await page.locator('main').innerText().catch(() => '');
        const nearCont = mainTxt.split('继续查看')[0].slice(-120) + '继续查看';
        if (!/0\s*份/.test(nearCont)) {
          throw new Error('处理中行报告列未见 0 份（snippet=' + nearCont.slice(0, 80) + '）');
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: true
allow_skip_target: 最近评估
skip_reason: ENV-EVAL-BUSINESS-PROCESS-WINDOW-001——过程窗不可达（当天复用/瞬时完成/空壳）或 30888 缺规格「稍后查看」且「查看最近评估」不可点；预检债 ENV-EVAL-BUSINESS-PRECHECK-001。
ticket: ENV-EVAL-BUSINESS-PROCESS-WINDOW-001
as_built_note: |-
  01901 重写 00956/P1-11：用例要「稍后查看」→最近评估+处理中+继续查看+报告0份。路由 /enterprise-center/evaluation。D3·30888 过程页可能仅「查看最近评估」（DEF-ENT-EVAL-BIZ-PROCESS-CTA-001），脚本双轨点任一离开钮。不写「打开我的任务」。路径：最近评估→恢复结果/深链→重新分析抢窗优先；对比篮回填发起兜底。B 档 allow_skip+ticket。30888 机跑绿 2026-10-19 rewrite-FUNC-01901。
