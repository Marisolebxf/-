id: P1-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00956
priority: P1
title: 过程态稍后查看可离开且任务继续执行
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
preconditions:
  - 「最近评估」Tab 至少 1 条已完成任务可「恢复结果」（env-gate historical_results.pass=true）
  - 脚本内：优先最近评估→恢复结果→重新分析抢「稍后查看」窗（不重复发起链；发起链仅兜底）
locators:
  hist_tab: Tab「最近评估」
  restore: button「恢复结果」
  reanalyze: button「重新分析」
  later: button「稍后查看」
  my_tasks: button「打开我的任务，N 个进行中」
  processing: 商业力评估生成中 / 评估生成中 / 可视化分析过程
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
    note: 商业力配置着陆；allow_skip 探测「最近评估」5s（env-gate historical_results）
  - action: wait
    for: 工作区壳 settle
    timeout_ms: 1500
  - action: evaluate
    note: 进过程态后点「稍后查看」并核对我的任务入口计数，机检在 expect
expect:
  - note: 离开过程态且任务不被取消
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const closeB = page.getByRole('button', { name: '关闭对比篮' }); if (await closeB.count()) await closeB.first().click().catch(()=>{}); const bodyRes = async () => { const t = await page.locator('body').innerText().catch(() => ''); return /商业力评估结果/.test(t) && /\d+\s*分/.test(t) }; const waitBody = async (ms) => { const t = Date.now(); while (Date.now() - t < ms) { if (await bodyRes()) return true; await page.waitForTimeout(1000) } return await bodyRes() }; const parseMyN = (text) => { const m = String(text || '').match(/打开我的任务[，,]\s*(\d+)\s*个进行中/); return m ? Number(m[1]) : null }; const waitLater = async (ms) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { const later = page.getByRole('button', { name: /稍后查看/ }); if ((await later.count()) && (await later.first().isVisible().catch(() => false)) && (await later.first().isEnabled().catch(() => false))) return later.first(); const t = await page.locator('body').innerText().catch(() => ''); const u = page.url(); if (/当前评估任务不存在或已失效/.test(t) && /view=processing/.test(u)) throw new Error('ENV-EVAL-BUSINESS-PROCESS-WINDOW-001: 过程态空壳「任务不存在或已失效」且无稍后查看（URL=' + u + '）'); if (/预检未返回企业明细/.test(t)) throw new Error('重新分析后预检阻塞（ticket=ENV-EVAL-BUSINESS-PRECHECK-001，URL=' + u + '）'); if (/view=result/.test(u) && /商业力评估结果/.test(t) && !(await page.getByText(/商业力.*生成中|评估生成中|可视化分析过程/).first().isVisible().catch(() => false))) return null; await page.waitForTimeout(400) } return null }; let branch = null; await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 }); const restore = page.getByRole('button', { name: '恢复结果' }); await restore.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {}); if ((await restore.count()) < 1) throw new Error('最近评估无已完成任务可「恢复结果」'); await restore.first().click({ timeout: 8000 }); if (await waitBody(60000)) branch = 'restore'; if (!(await bodyRes())) { await page.getByText('当前分析', { exact: true }).first().click({ timeout: 5000 }).catch(() => {}); await page.waitForTimeout(800); const open = page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象|返回对比篮/ }).first(); if (!(await open.isVisible().catch(() => false))) throw new Error('无历史恢复结果且无对象入口（ticket=ENV-EVAL-BUSINESS-PROCESS-WINDOW-001）'); await open.click({ timeout: 8000 }); const sels = page.locator('[aria-label^="选择 "]'); await sels.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {}); await page.waitForTimeout(800); if ((await sels.count()) < 2) throw new Error('结果态不可达且可选企业不足（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(500); const okBtn = page.getByRole('button', { name: '确定' }).first(); await okBtn.scrollIntoViewIfNeeded().catch(() => {}); try { await okBtn.click({ timeout: 5000 }) } catch { try { await okBtn.click({ force: true, timeout: 5000 }) } catch { await okBtn.evaluate((el) => el.click()) } } await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('回填后开始分析禁用（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）'); await start.click(); branch = 'start'; const l0 = await waitLater(25000); if (l0) { const body0 = await page.locator('body').innerText().catch(() => ''); const n0 = parseMyN(body0); await l0.click({ timeout: 8000 }); await page.waitForTimeout(1500); const tEnd = Date.now(); while (Date.now() - tEnd < 12000) { if (!/view=processing/.test(page.url()) && !(await page.getByText(/商业力.*生成中|评估生成中|可视化分析过程/).first().isVisible().catch(() => false))) break; await page.waitForTimeout(400) } if (/view=processing/.test(page.url()) || await page.getByText(/商业力.*生成中|评估生成中|可视化分析过程/).first().isVisible().catch(() => false)) throw new Error('稍后查看后仍停留过程态：' + page.url()); globalThis.__p111 = { left: true, n_before: n0, branch: branch }; return } if (!(await bodyRes())) { const t1 = Date.now(); while (Date.now() - t1 < 60000) { if (await bodyRes()) break; await page.waitForTimeout(1000) } } } if (!(await bodyRes())) throw new Error('未达结果态无法经重新分析进过程态（branch=' + branch + '，ticket=ENV-EVAL-BUSINESS-PROCESS-WINDOW-001，URL=' + page.url() + '）'); const reBtn = page.getByRole('button', { name: '重新分析' }); if ((await reBtn.count()) < 1) throw new Error('结果态无「重新分析」按钮'); await expect(reBtn.first()).toBeEnabled(); try { await reBtn.first().click({ timeout: 8000 }) } catch { await reBtn.first().click({ force: true, timeout: 8000 }) }; branch = 'reanalyze'; let retried = false; let l1 = await waitLater(90000); if (!l1 && !retried) { const again = page.getByRole('button', { name: '重新分析' }); if (await again.count()) { try { await again.first().click({ timeout: 5000 }) } catch { try { await again.first().click({ force: true, timeout: 5000 }) } catch {} } } retried = true; l1 = await waitLater(30000) } if (!l1) throw new Error('ENV-EVAL-BUSINESS-PROCESS-WINDOW-001: 重新分析后未见可点「稍后查看」（当天复用/瞬时完成/过程空壳，retried=' + retried + '，URL=' + page.url() + '）'); const body1 = await page.locator('body').innerText().catch(() => ''); const n1 = parseMyN(body1); await l1.click({ timeout: 8000 }); await page.waitForTimeout(1500); const tEnd2 = Date.now(); while (Date.now() - tEnd2 < 12000) { if (!/view=processing/.test(page.url()) && !(await page.getByText(/商业力.*生成中|评估生成中|可视化分析过程/).first().isVisible().catch(() => false))) break; await page.waitForTimeout(400) } if (/view=processing/.test(page.url()) || await page.getByText(/商业力.*生成中|评估生成中|可视化分析过程/).first().isVisible().catch(() => false)) throw new Error('稍后查看后仍停留过程态：' + page.url()); globalThis.__p111 = { left: true, n_before: n1, branch: branch, url: page.url() }
  - note: 我的任务入口进行中计数不减少
    assert: |-
      const s = globalThis.__p111; if (!s || !s.left) throw new Error('ENV-EVAL-BUSINESS-PROCESS-WINDOW-001: 前置未完成稍后查看离开过程态'); const body = await page.locator('body').innerText().catch(() => ''); const myBtn = page.getByRole('button', { name: /打开我的任务/ }); const parseMyN = (text) => { const m = String(text || '').match(/打开我的任务[，,]\s*(\d+)\s*个进行中/); return m ? Number(m[1]) : null }; const nAfter = parseMyN(body); if (s.n_before != null && nAfter != null && nAfter < s.n_before) throw new Error('我的任务进行中计数减少：before=' + s.n_before + ' after=' + nAfter + ' URL=' + page.url()); if ((await myBtn.count()) >= 1) { await expect(myBtn.first()).toBeVisible({ timeout: 8000 }); const txt = (await myBtn.first().innerText().catch(() => '')).replace(/\s+/g, ' '); globalThis.__p111_my = { text: txt, n: nAfter } } else { const hint = page.getByText(/打开我的任务/); if ((await hint.count()) >= 1) await expect(hint.first()).toBeVisible({ timeout: 5000 }); else if (s.n_before == null && nAfter == null) { /* 离开后入口可能随视图消失：仅核对未减少（双方 null 视为不可观测，不假绿计数） */ } else throw new Error('离开过程态后未见「打开我的任务」入口且无法核对计数（URL=' + page.url() + '）') }
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: true
allow_skip_target: '最近评估'
skip_reason: ENV-EVAL-BUSINESS-PROCESS-WINDOW-001——恢复结果后「重新分析」当天复用/瞬时完成仍停 view=result，或过程空壳 view=processing 正文「任务不存在或已失效」无可点「稍后查看」/「打开我的任务」；顶栏 allow_skip+ticket 诚实 n/a，禁断言内裸 ALLOW_SKIP。着陆闸=「最近评估」Tab；过程窗=expect 内 90s+30s 抢「稍后查看」。
ticket: ENV-EVAL-BUSINESS-PROCESS-WINDOW-001
as_built_note: 2026-10-15 P1-11 SKIP_FIELD 回炉 §5.2——补 allow_skip+skip_reason+ticket+allow_skip_target「最近评估」；对齐 eval-tech P0-22 / 同目录 P1-10。路径：最近评估→恢复结果→「重新分析」抢过程窗点「稍后查看」离开 view=processing；发起链仅兜底。过程窗/预检失败抛 ENV-EVAL-BUSINESS-PROCESS-WINDOW-001 或 ENV-EVAL-BUSINESS-PRECHECK-001（非 ALLOW_SKIP 前缀）。我的任务进行中计数 before/after 在 expect1 落盘 globalThis.__p111。边界：取消任务 P1-10；重新分析进过程态 P1-09。
tier: B
