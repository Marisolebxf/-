id: FUNC-01896
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01896
priority: P0
title: 关键经营指标对比按企业展示六维分数
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已打开至少两家企业的商业力评估结果（as-built：最近评估→恢复结果）
locators:
  hist_tab: Tab「最近评估」
  restore_button: button「恢复结果」
  kpi_block: 文本「关键经营指标对比」
  dim_labels: 市场 / 产品 / 品牌 / 技术合作 / 产业链覆盖 / 关键环节参与
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 恢复结果后停留在「关键经营指标对比」；判定在 expect
expect:
  - note: 1、区标题为「关键经营指标对比」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const kpiBlockReady = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return t.includes('关键经营指标对比');
      };
      const openResultViaHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
        const restore = page.getByRole('button', { name: '恢复结果' });
        await restore.first().waitFor({ state: 'visible', timeout: 10000 });
        if ((await restore.count()) < 1) throw new Error('最近评估无已完成任务可「恢复结果」');
        await restore.first().click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 30000) {
          if (await kpiBlockReady()) return;
          await page.waitForTimeout(500);
        }
        if (!(await kpiBlockReady())) throw new Error('恢复结果后未见关键经营指标对比：' + page.url());
      };
      if (!(await kpiBlockReady())) {
        if (globalThis.__func01888_ready || globalThis.__func01889_ready) {
          await page.waitForTimeout(500);
        }
        if (!(await kpiBlockReady())) await openResultViaHistory();
      }
      await expect(page).toHaveURL(/view=result/);
      await expect(main().getByText('关键经营指标对比', { exact: true }).first()).toBeVisible({ timeout: 15000 });
      globalThis.__func01896_onResult = true;
  - note: 2、每家企业展示对比指标（用例六维分；30888 as-built 为年营收/利润率，六维见经营诊断表 FUNC-01898）
    assert: |-
      if (!globalThis.__func01896_onResult) throw new Error('前置：结果页关键经营指标对比未就绪');
      const main = () => page.locator('main.app-main').first();
      const full = await main().innerText().catch(() => '');
      const start = full.indexOf('关键经营指标对比');
      if (start < 0) throw new Error('未见关键经营指标对比');
      const end = full.indexOf('商业力加权排名', start);
      const block = end > start ? full.slice(start, end) : full.slice(start, start + 2200);
      const visInBlock = block.match(/当前可见\s*\d+\s*\/\s*\d+\s*家/);
      const kpiArea = visInBlock
        ? block.slice(block.indexOf(visInBlock[0]) + visInBlock[0].length)
        : block;
      const firmRe = /[\u4e00-\u9fffA-Za-z0-9（）()·]+(?:有限公司|股份有限公司|公司)/g;
      const firms = [...new Set([...kpiArea.matchAll(firmRe)].map((m) => m[0]))];
      const dimPatterns = [
        /市场\s*\d+\s*分/,
        /产品\s*\d+\s*分/,
        /品牌\s*\d+\s*分/,
        /技术合作\s*\d+\s*分/,
        /产业链覆盖\w*\s*\d+\s*分/,
        /关键环节参与\w*\s*\d+\s*分/,
      ];
      const withSixDims = firms.filter((name) => {
        const idx = kpiArea.indexOf(name);
        if (idx < 0) return false;
        const slice = kpiArea.slice(idx, idx + 420);
        return dimPatterns.every((re) => re.test(slice));
      });
      const withRevenueKpi = firms.filter((name) => {
        const idx = kpiArea.indexOf(name);
        if (idx < 0) return false;
        const slice = kpiArea.slice(idx, idx + 520);
        return /年营收/.test(slice) && /[\d.]+/.test(slice) && /利润率/.test(slice) && /[\d.]+/.test(slice);
      });
      const revenueStyle =
        /年营收/.test(kpiArea) &&
        /利润率/.test(kpiArea) &&
        withRevenueKpi.length >= 2;
      if (withSixDims.length >= 2) {
        globalThis.__func01896_kpiLayout = 'six_dim';
      } else if (revenueStyle) {
        globalThis.__func01896_kpiLayout = 'revenue_profit';
        if (withRevenueKpi.length < 2) {
          throw new Error('对比区年营收/利润率按企业展示不足 2 家（命中 ' + withRevenueKpi.length + '）');
        }
      } else {
        throw new Error(
          '对比区未见≥2 家六维分或年营收/利润率布局（六维 ' +
            withSixDims.length +
            ' 家，营收类 ' +
            withRevenueKpi.length +
            ' 家）'
        );
      }
  - note: 3、可见「当前可见」计数
    assert: |-
      if (!globalThis.__func01896_onResult) throw new Error('前置：结果页未就绪');
      const main = () => page.locator('main.app-main').first();
      const t = await main().innerText().catch(() => '');
      const m = t.match(/当前可见\s*(\d+)\s*\/\s*(\d+)\s*家/);
      if (!m) throw new Error('关键经营指标对比区未见「当前可见」计数');
      const vis = parseInt(m[1], 10);
      const total = parseInt(m[2], 10);
      if (!(vis >= 1 && total >= 2 && vis <= total)) {
        throw new Error('当前可见计数异常: ' + m[0]);
      }
      await expect(main().getByText(/当前可见\s*\d+\s*\/\s*\d+\s*家/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例前置「≥2 家评估结果」：单跑经「最近评估→恢复结果」直达（不重复发起链）。D1·用例预期「关键经营指标对比」展示商业力六维分；30888（2026-10-19）对比区仅年营收/利润率按企业并列，六维分在下方「商业诊断与明细→经营诊断」表（见 FUNC-01898），非本区块。脚本双轨：旧环境六维同行仍断言六维；30888 断言对比区年营收+利润率≥2 家。产业链覆盖/关键环节参与等六维文案在旧布局为缩写。登录与关内部评审由 runner 会话前置。tier B，无 allow_skip。
