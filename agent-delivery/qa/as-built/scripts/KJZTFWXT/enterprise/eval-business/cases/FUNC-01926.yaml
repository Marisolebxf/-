id: FUNC-01926
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01926
priority: P1
title: 最近评估可以翻到第二页
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-business
tier: B
preconditions:
  - 最近评估总条数大于第一页（现场 pageSize=10；用例册备注现场共 15 条）
locators:
  tab_recent: tab「最近评估」
  page2: .arco-pagination-item「2」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→读第 1 页任务 ID→点分页「2」；换批/总条数/模式断言在 expect
expect:
  - note: 1、列表换成另一批任务；2、总条数提示仍在；3、这些任务的模式为商业力评估
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const PAGE_SIZE = 10;
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const clickRecentTab = async () => {
        const tablists = page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) });
        const list = (await tablists.count()) ? tablists.first() : page.locator('[role=tablist]').first();
        const recent = list.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recent).toBeVisible({ timeout: 10000 });
        await recent.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await expect(recent).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      };
      const readTotalFromPagination = async () => {
        const pg = main().locator('.arco-pagination').first();
        if (!(await pg.count()) || !(await pg.isVisible().catch(() => false))) return null;
        const t = (await pg.innerText().catch(() => '')).replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const readRowTaskIds = async () => {
        return await page.evaluate((reSource) => {
          const re = new RegExp(reSource);
          const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
          const ids = [];
          const tables = [...document.querySelectorAll('main table, main .arco-table')];
          for (const table of tables) {
            const rows = [...table.querySelectorAll('tbody tr, .arco-table-body .arco-table-tr')];
            for (const row of rows) {
              const text = norm(row.innerText);
              const m = text.match(re);
              if (m) ids.push(m[0]);
            }
            if (ids.length) break;
          }
          return [...new Set(ids)];
        }, TID_RE.source);
      };
      const readRowModes = async () => {
        return await page.evaluate(() => {
          const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
          const modes = [];
          const tables = [...document.querySelectorAll('main table, main .arco-table')];
          for (const table of tables) {
            const rows = [...table.querySelectorAll('tbody tr, .arco-table-body .arco-table-tr')];
            for (const row of rows) {
              const text = norm(row.innerText);
              if (!/(?:DEMO-EVAL|EVAL-)\d{8}-\d+/.test(text)) continue;
              const cells = [...row.querySelectorAll('td, .arco-table-td')].map((c) => norm(c.innerText));
              const modeCell = cells.find((c) => /商业力评估|技术力评估/.test(c));
              if (modeCell) modes.push(modeCell);
              else if (/商业力评估/.test(text)) modes.push('商业力评估');
            }
            if (modes.length) break;
          }
          return modes;
        });
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 15000 });
      await clickRecentTab();
      await expect(page.getByRole('button', { name: '新建评估' }).first()).toBeVisible({ timeout: 10000 });
      const total = await readTotalFromPagination();
      if (total !== null && total <= PAGE_SIZE) {
        throw new Error('数据闸门：最近评估共 ' + total + ' 条不大于单页 ' + PAGE_SIZE + '，无法验翻页（ticket=ENV-EVAL-BUSINESS-HISTORY-PAGE2-001）');
      }
      const page2Btn = main().locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 = (await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false));
      if (!hasPage2) {
        if (total !== null && total > PAGE_SIZE) {
          throw new Error('产品异常：总数 ' + total + ' 超过单页但未见分页「2」（ticket=GAP-EVAL-HISTORY-PAGINATION-001）');
        }
        throw new Error('数据闸门：分页「2」不可见，最近评估未超过一页（ticket=ENV-EVAL-BUSINESS-HISTORY-PAGE2-001）');
      }
      const idsPage1 = await readRowTaskIds();
      if (!idsPage1.length) {
        throw new Error('第 1 页未见任务 ID 行（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
      }
      await page2Btn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await expect(page2Btn).toHaveClass(/arco-pagination-item-active/, { timeout: 8000 });
      const idsPage2 = await readRowTaskIds();
      if (!idsPage2.length) {
        throw new Error('点击分页「2」后未见任务行');
      }
      const overlap = idsPage1.filter((id) => idsPage2.includes(id));
      if (overlap.length) {
        throw new Error('第 2 页与第 1 页任务 ID 重叠: ' + overlap.join(', '));
      }
      const pg = main().locator('.arco-pagination').first();
      await expect(pg).toBeVisible({ timeout: 8000 });
      const tPg = (await pg.innerText().catch(() => '')).replace(/\s+/g, ' ');
      const mTotal = tPg.match(/共\s*(\d+)\s*条/);
      if (!mTotal) throw new Error('翻页后分页区未见「共 N 条」提示');
      const totalNow = parseInt(mTotal[1], 10);
      if (total !== null && total !== undefined && totalNow !== total) {
        throw new Error('翻页后总条数变化: ' + total + '→' + totalNow);
      }
      if (totalNow <= PAGE_SIZE) throw new Error('总条数 ' + totalNow + ' 不应仅一页');
      const modes = await readRowModes();
      if (!modes.length) throw new Error('第 2 页未见可读的「模式」列');
      const bad = modes.filter((m) => m !== '商业力评估');
      if (bad.length) {
        throw new Error('第 2 页存在非商业力评估模式: ' + bad.join(', '));
      }
      globalThis.__func01926_snap = { total, idsPage1, idsPage2 };
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01926 最近评估点分页「2」换批任务且总条数与模式列仍为商业力评估。对齐 eval-tech FUNC-01810；30888 路由 /enterprise-center/evaluation?workspace=business；表前端 pageSize=10，scout-gate-r2 曾观测 15 条可翻页。不足一页→ENV-EVAL-BUSINESS-HISTORY-PAGE2-001。登录与关内部评审由 runner 会话前置。tier B，无 allow_skip。
