id: FUNC-01902
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01902
priority: P0
title: 查看 HTML 报告打开只读报告并列出目录
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已打开成功商业力评估结果且报告入口可见（as-built：最近评估→恢复结果）
locators:
  report_entry: button「查看 HTML 报告」
  back_result: button「返回评估结果」
  export_btn: button「导出」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 结果态→点「查看 HTML 报告」；报告标题、操作钮与附录C 七节目录在 expect
expect:
  - note: 1、标题为「商业力评估报告」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const reportRoot = () => page.locator('[data-report-readonly="true"]').first();
      const waitReportShell = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (/view=report/.test(page.url()) && await reportRoot().isVisible().catch(() => false)) {
            const t = await reportRoot().innerText().catch(() => '');
            if (/报告目录/.test(t)) return true;
          }
          await page.waitForTimeout(500);
        }
        return false;
      };
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /商业力评估结果/.test(t) && /商业力最高得分/.test(t) && /\d+\s*分/.test(t);
      };
      const openRecentResult = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const restore = main().getByRole('button', { name: '恢复结果' }).first();
        if (!(await restore.isVisible().catch(() => false))) return false;
        await restore.click({ timeout: 8000 });
        await page.waitForTimeout(3500);
        if (!/view=result/.test(page.url())) {
          const tid = (/(?:EVAL|DEMO-EVAL)-\d{8}-\d+/.exec(await main().innerText().catch(() => '')) || [])[0];
          if (tid) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=business&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
          }
        }
        return await bodyResultReady();
      };
      const openHtmlReport = async () => {
        if (!(await bodyResultReady())) {
          const ok = await openRecentResult();
          if (!ok) throw new Error('最近评估无已完成商业力结果（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
        }
        await expect(main().getByText('评估报告').first()).toBeVisible({ timeout: 10000 });
        const entry = page.locator('[data-eval-open-html-report]').first();
        if (!(await entry.isVisible().catch(() => false))) {
          const btn = page.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
          await expect(btn).toBeVisible({ timeout: 10000 });
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await closeBasket();
          try { await btn.click({ timeout: 8000 }); } catch { await btn.click({ force: true, timeout: 8000 }); }
        } else {
          await entry.scrollIntoViewIfNeeded().catch(() => {});
          await closeBasket();
          try { await entry.click({ timeout: 8000 }); } catch { await entry.click({ force: true, timeout: 8000 }); }
        }
        let tNav = Date.now();
        while (Date.now() - tNav < 30000 && !/view=report/.test(page.url())) await page.waitForTimeout(400);
        if (!/view=report/.test(page.url())) {
          const tid = new URL(page.url()).searchParams.get('task_id') || (/(?:EVAL|DEMO-EVAL)-\d{8}-\d+/.exec(await main().innerText().catch(() => '')) || [])[0];
          if (!tid) throw new Error('无法打开报告且无 task_id：' + page.url());
          await page.goto(toUrl(evalRoute + '&view=report&analysis_type=business&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
        }
        if (!(await waitReportShell(90000))) {
          throw new Error('只读报告壳未就绪（ticket=ENV-EVAL-BUSINESS-REPORT-SHELL-001）：' + page.url());
        }
        globalThis.__func01902_report = true;
      };
      if (!globalThis.__func01902_report) await openHtmlReport();
      await expect(reportRoot()).toBeVisible({ timeout: 10000 });
      const h1 = ((await reportRoot().locator('h1').first().innerText().catch(() => '')) || '').trim();
      const titleOk = /商业力评估/.test(h1) && /报告/.test(h1);
      if (!titleOk && !(await reportRoot().getByText(/商业力评估报告/).count())) {
        throw new Error('报告 h1 未见商业力评估报告语义（h1=' + h1.slice(0, 100) + '）');
      }
      await expect(reportRoot().getByText(/企业评估\s*[·・]\s*只读报告/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、有「返回评估结果」和「导出」
    assert: |-
      if (!globalThis.__func01902_report) throw new Error('前置：报告页未打开');
      const reportRoot = page.locator('[data-report-readonly="true"]').first();
      await expect(reportRoot.getByRole('button', { name: '返回评估结果', exact: true })).toBeVisible({ timeout: 10000 });
      await expect(reportRoot.locator('.report-toolbar__actions').getByRole('button', { name: '导出', exact: true })).toBeVisible({ timeout: 10000 });
  - note: 3、报告目录共 7 节（附录C）
    assert: |-
      if (!globalThis.__func01902_report) throw new Error('前置：报告页未打开');
      const reportRoot = page.locator('[data-report-readonly="true"]').first();
      const toc = reportRoot.locator('nav[aria-label="报告目录"]');
      await expect(toc).toBeVisible({ timeout: 8000 });
      const linkCount = await toc.locator('a').count();
      const tocText = await toc.innerText().catch(() => '');
      const legacy9 = ['封面与报告身份', '决策摘要', '评估范围与方法', '综合结果', '模式分析', '优势、短板与差距', '改进方向', '数据质量与局限', '数据来源与生成说明'];
      const appendixCAliases = [
        ['报告身份', '封面与报告身份'],
        ['执行摘要', '决策摘要'],
        ['对象与范围', '评估范围与方法'],
        ['关键发现', '综合结果'],
        ['证据与分析', '模式分析'],
        ['数据来源与生成说明', '数据来源与生成说明'],
        ['局限性与使用边界', '数据质量与局限', '局限'],
      ];
      if (linkCount === 9) {
        const missL = legacy9.filter((s) => !tocText.includes(s));
        if (missL.length) throw new Error('legacy 9 节目录缺：' + missL.join('、'));
      } else if (linkCount >= 7) {
        const miss = appendixCAliases.filter((group) => !group.some((s) => tocText.includes(s))).map((g) => g[0]);
        if (miss.length) throw new Error('附录C 目录缺：' + miss.join('、') + '（links=' + linkCount + '）');
      } else {
        throw new Error('报告目录链接数为 ' + linkCount + '，预期 ≥7 或 legacy 9');
      }
      globalThis.__func01902_tocLinks = linkCount;
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01902 验结果态「查看 HTML 报告」→只读报告 +「返回评估结果」「导出」+报告目录（30888）。前置：最近评估→恢复结果。D1：h1 可能带对象摘要；断言限定 data-report-readonly。D1·2026-10-19 现场为 demo 九节目录，lumen 七节上线后走 appendixCAliases。B 档零 allow_skip。
