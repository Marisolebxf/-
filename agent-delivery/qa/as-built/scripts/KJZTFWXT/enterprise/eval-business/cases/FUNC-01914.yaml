id: FUNC-01914
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01914
priority: P1
title: 对比篮未勾选时查看引育名单禁用
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-business
tier: B
preconditions:
  - 对比篮已打开且篮内至少有 1 家企业、当前未勾选（脚本自含入篮与重置勾选）
locators:
  dock: button aria-label 含「打开对比篮」
  panel: .system-compare-panel
  view_lists: button「查看引育名单」
  reset: button「重置」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 打开系统对比篮→企业页签重置为未勾选→停留在对比篮；门控在 expect
expect:
  - note: 1、「查看引育名单」为禁用
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=business&mode=business';
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const waitBasketAtLeast = async (min, ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if ((await basketEntCount()) >= min) return true;
          await page.waitForTimeout(400);
        }
        return (await basketEntCount()) >= min;
      };
      const addFromVisibleCards = async (need) => {
        let added = 0;
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        const btnN = await addBtns.count();
        for (let i = 0; i < btnN && added < need; i++) {
          const btn = addBtns.nth(i);
          if (!(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          added++;
        }
        if (added < need) {
          const rec = page.locator('main section').filter({ hasText: '推荐企业' }).first();
          if (await rec.isVisible().catch(() => false)) {
            const cards = rec.locator('div').filter({ hasText: '推荐理由：' });
            for (let i = 0, c = await cards.count(); i < c && added < need; i++) {
              const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
              if (await btn.isVisible().catch(() => false)) {
                await btn.click({ timeout: 8000 });
                await page.waitForTimeout(700);
                added++;
              }
            }
          }
        }
        return added;
      };
      const seedFromAddModal = async (panel) => {
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        const modal = page.locator('.arco-modal:visible').last();
        await expect(modal).toBeVisible({ timeout: 10000 });
        const joinBtns = modal.getByRole('button', { name: '加入对比篮', exact: true });
        if (!(await joinBtns.count())) {
          const search = modal.getByPlaceholder(/企业名称|搜索/).first();
          if (await search.count()) {
            await search.fill('科技');
            await page.waitForTimeout(400);
            const go = modal.getByRole('button', { name: /搜索|查询/ }).first();
            if (await go.count()) await go.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(1200);
          }
        }
        const join2 = modal.getByRole('button', { name: '加入对比篮', exact: true });
        if (!(await join2.count())) return false;
        await join2.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const close = modal.getByRole('button', { name: '取消' }).first();
        if (await close.count()) await close.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
        return true;
      };
      const ensureBasketEnterprises = async (min) => {
        if ((await basketEntCount()) >= min) return;
        await page.goto(toUrl('/enterprise/enterprise-search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const searchInput = page
          .getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ })
          .or(page.getByPlaceholder(/企业名|产业|资质/))
          .first();
        if (await searchInput.isVisible().catch(() => false)) {
          await searchInput.fill('人工智能');
          const searchBtn = page.getByRole('button', { name: '搜索', exact: true }).first();
          if (await searchBtn.isVisible().catch(() => false)) {
            await searchBtn.click({ timeout: 8000 });
            await page.waitForTimeout(1200);
            await page.getByText('智能搜索结果', { exact: true }).first().waitFor({ state: 'visible', timeout: 25000 }).catch(() => {});
          }
        }
        let n = await basketEntCount();
        while (n < min) {
          const need = min - n;
          const clicked = await addFromVisibleCards(need);
          if (!clicked) break;
          await waitBasketAtLeast(min, 8000);
          n = await basketEntCount();
          if (n >= min) return;
        }
        if ((await basketEntCount()) >= min) return;
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (await dockBtn.count()) {
          await dockBtn.click({ timeout: 10000 }).catch(() => {});
          await page.waitForTimeout(800);
        }
        const panel = page.locator('.system-compare-panel');
        if (await panel.isVisible().catch(() => false)) {
          await panel.locator('#compare-basket-tab-enterprise').click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
          if ((await panel.locator('.ent-compare-item-card').count()) < min) {
            await seedFromAddModal(panel).catch(() => {});
          }
        }
        if ((await basketEntCount()) < min) {
          throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 ' + (await basketEntCount()) + '（edu 检索/推荐/新增入篮不可达，见 D4）');
        }
      };
      const ensureZeroSelection = async (panel) => {
        const entTab = panel.locator('#compare-basket-tab-enterprise').first();
        if (await entTab.count() && await entTab.isVisible().catch(() => false)) {
          await entTab.click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
        const cancelSel = panel.getByRole('button', { name: '取消选择' });
        if (await cancelSel.count() && !(await cancelSel.isDisabled())) {
          await cancelSel.click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
        const resetBtn = panel.getByRole('button', { name: '重置', exact: true });
        if (await resetBtn.count() && await resetBtn.isVisible().catch(() => false)) {
          await resetBtn.click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(500);
        }
        const checks = panel.locator('.ent-compare-item-card__check, [aria-label^="选择 "]');
        for (let i = 0; i < await checks.count(); i++) {
          const el = checks.nth(i);
          const pressed = await el.getAttribute('aria-pressed');
          const checked = await el.getAttribute('aria-checked');
          const cls = (await el.getAttribute('class')) || '';
          if (pressed === 'true' || checked === 'true' || /checked|selected|is-active/.test(cls)) {
            await el.click({ force: true });
            await page.waitForTimeout(200);
          }
        }
        const selLine = panel.getByText(/已选\s*\d+\s*家|当前已选择\s*\d+\s*家企业/).first();
        if (await selLine.count()) {
          const selTxt = ((await selLine.innerText()) || '').replace(/\s+/g, ' ');
          if (!/已选\s*0\s*家|当前已选择\s*0\s*家企业/.test(selTxt)) {
            throw new Error('对比篮应未勾选企业，文案：' + selTxt);
          }
        }
      };
      await ensureBasketEnterprises(1);
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await dismissBasket();
      const bodyGate = await page.locator('body').innerText().catch(() => '');
      if (/404|页面不存在/.test(bodyGate)) {
        throw new Error('入口 404（svcz 须用 catalog_path /enterprise/evaluation）：' + page.url());
      }
      await expect(page.getByText('企业商业力评估对比分析', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
      await expect(dockBtn).toBeVisible({ timeout: 10000 });
      await dockBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1000);
      const panel = page.locator('.system-compare-panel');
      await expect(panel).toBeVisible({ timeout: 10000 });
      await ensureZeroSelection(panel);
      const viewLists = panel.getByRole('button', { name: /查看引育名单/ }).first();
      await expect(viewLists).toBeVisible({ timeout: 8000 });
      await viewLists.scrollIntoViewIfNeeded().catch(() => {});
      globalThis.__func01914_panelReady = true;
      const dis = await viewLists.isDisabled();
      const cls = (await viewLists.getAttribute('class')) || '';
      if (dis || /arco-btn-disabled/.test(cls)) return;
      throw new Error('DEF-ENT-COMPARE-VIEW-LISTS-NO-GATE-001：未勾选时「查看引育名单」未禁用（对照底栏 noSelection 已禁「发起分析/加入招引/培育候选」）');
  - note: 2、点击不展开引育名单菜单
    assert: |-
      if (!globalThis.__func01914_panelReady) throw new Error('前置未打开对比篮或未重置为未勾选');
      const panel = page.locator('.system-compare-panel');
      const viewLists = panel.getByRole('button', { name: /查看引育名单/ }).first();
      const dis = await viewLists.isDisabled();
      const cls = (await viewLists.getAttribute('class')) || '';
      if (dis || /arco-btn-disabled/.test(cls)) return;
      await viewLists.click({ timeout: 3000, force: true }).catch(() => {});
      await page.waitForTimeout(600);
      const menuItem = page.getByText('查看招引候选名单', { exact: true });
      const menuVis = await menuItem.isVisible().catch(() => false);
      if (menuVis) throw new Error('未勾选仍可展开引育名单菜单');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例 01914：系统对比篮 .system-compare-panel「篮内企业」区 extra 内 Arco dropdown 触发器「查看引育名单」；前置篮内≥1 家、已选 0 家（对齐 01913/05391）。D1·edu tts/svcz 路由 catalog_path /enterprise/evaluation?workspace=business&mode=business（禁止 enterprise-center 404、禁止 entry-seed forbidden_paths）。入篮优先对比篮「新增」弹层，兜底 /enterprise/enterprise-search 推荐卡。D3·lumen-ui-topic EnterpriseCompareBasketView 未对 dropdown 绑 :disabled=noSelection（底栏 CompareBasketActionBar 已绑），机检未禁用报 DEF-ENT-COMPARE-VIEW-LISTS-NO-GATE-001。登录与关内部评审由 runner 会话前置。tier B，零 allow_skip。
