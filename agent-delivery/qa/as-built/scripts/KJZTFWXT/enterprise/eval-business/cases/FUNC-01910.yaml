id: FUNC-01910
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01910
priority: P1
tier: B
title: 全选当前筛选结果后已选家数与列表一致且确定可点
entry_id: ent-eval-business
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation
  - action: evaluate
    note: 开浮层→篮内≥2（同册01907新增入篮）→取消选择→点全选
expect:
  - note: 1、已选家数变为当前列表企业数
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=business&mode=business';
      const pickerRoot = () =>
        page
          .locator('.system-compare-panel:visible, .arco-modal:visible, .arco-drawer:visible, [role="dialog"]')
          .filter({ hasText: '选择分析企业' })
          .last();
      const listEnterpriseCount = async (scope) => {
        const cards = scope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        if (cardN > 0) return cardN;
        const sels = scope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        return selN > 0 ? selN : 0;
      };
      const parseSelectedCount = async (scope) => {
        const text = ((await scope.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = text.match(/已选\s*(\d+)\s*家/);
        if (m) return parseInt(m[1], 10);
        const liveM = text.match(/当前已选择\s*(\d+)\s*家企业/);
        if (liveM) return parseInt(liveM[1], 10);
        return null;
      };
      const openPicker = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        const main = page.locator('main');
        const cta = main.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first();
        await expect(cta).toBeVisible({ timeout: 10000 });
        await cta.click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      };
      const addOneViaNew = async (panel) => {
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
        const addBtn = (await workspace.count())
          ? workspace.getByRole('button', { name: '新增', exact: true })
          : panel.getByRole('button', { name: '新增', exact: true });
        await addBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const modalRoot = page
          .locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible')
          .filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) })
          .last();
        await expect(modalRoot).toBeVisible({ timeout: 15000 });
        await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
        const loadFail = modalRoot.getByText('名单读取失败', { exact: false });
        if (await loadFail.count() && (await loadFail.first().isVisible().catch(() => false))) {
          throw new Error('ENV-GATE:新增企业名单读取失败');
        }
        const joinBtns = modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(joinBtns.first()).toBeVisible({ timeout: 30000 });
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const modalStill = page.locator('.arco-modal:visible').filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) });
        if (await modalStill.count()) {
          const closeModal = modalStill.last().locator('.arco-modal-close-icon, button[aria-label="关闭"]').first();
          if (await closeModal.count() && (await closeModal.isVisible().catch(() => false))) {
            try {
              await closeModal.click({ timeout: 3000 });
              await page.waitForTimeout(400);
            } catch {}
          }
        }
        await page.waitForTimeout(600);
      };
      await openPicker();
      let panel = pickerRoot();
      await expect(panel).toBeVisible({ timeout: 10000 });
      let listN = await listEnterpriseCount(panel);
      while (listN < 2) {
        await addOneViaNew(panel);
        panel = pickerRoot();
        listN = await listEnterpriseCount(panel);
        if (listN < 2) {
          const retry = await listEnterpriseCount(panel);
          if (retry >= 2) {
            listN = retry;
            break;
          }
        }
      }
      if (listN < 2) throw new Error('ENV-GATE:篮内列表不足2家，当前' + listN);
      const clearBtn = panel.getByRole('button', { name: '取消选择', exact: true });
      if (await clearBtn.count() && !(await clearBtn.first().isDisabled())) {
        await clearBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
      }
      const selectAll = panel
        .getByRole('checkbox', { name: '全选当前筛选结果' })
        .or(panel.locator('[aria-label="全选当前筛选结果"]'));
      await expect(selectAll.first()).toBeVisible({ timeout: 8000 });
      await selectAll.first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      globalThis.__func01910_listN = listN;
      globalThis.__func01910_panel = true;
      const afterAll = await parseSelectedCount(panel);
      if (afterAll === null) throw new Error('全选后未见已选家数文案');
      if (afterAll !== listN) {
        throw new Error('全选后已选应为' + listN + '家，实际' + afterAll + '家');
      }
  - note: 2、「确定」变为可点
    assert: |-
      if (!globalThis.__func01910_panel) throw new Error('前置：全选步骤未完成');
      const panel = page
        .locator('.system-compare-panel:visible, .arco-modal:visible, .arco-drawer:visible, [role="dialog"]')
        .filter({ hasText: '选择分析企业' })
        .last();
      const okBtn = panel.getByRole('button', { name: '确定', exact: true });
      await expect(okBtn.first()).toBeVisible({ timeout: 8000 });
      await expect(okBtn.first()).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
