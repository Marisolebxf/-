id: FUNC-00955
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00955
priority: P1
tier: B
title: 过程态取消任务后终止分析且配置保留
entry_id: ent-eval-business
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation
  - action: evaluate
    note: 同册01888回填两家→开始分析→过程态点「取消任务」；机检在 expect
expect:
  - note: 1、任务终止且页面离开过程态
    assert: |-
      const evalRoute = '/enterprise/evaluation?workspace=business&mode=business';
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        let clicks = 0;
        while (n < min && clicks < min + 3) {
          const idx = Math.min(clicks, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          clicks++;
          n = await basketEntCount();
          if (n >= min) return;
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + ' 家，当前 ' + n);
      };
      const reachProcessing = async () => {
        await ensureBasketEnterprises(2);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        const openCta = page.getByRole('button', { name: /商业竞争力对标分析|前往对比篮选择企业|返回对比篮调整对象/ }).first();
        await expect(openCta).toBeVisible({ timeout: 10000 });
        await openCta.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 8000 });
        const sels = page.locator('[aria-label^="选择 "]');
        if ((await sels.count()) < 2) throw new Error('对比篮可选企业不足 2 家');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(200);
        await sels.nth(1).click({ force: true });
        await page.waitForTimeout(200);
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        const start = page.getByRole('button', { name: '开始分析' });
        const t0 = Date.now();
        while (Date.now() - t0 < 45000) {
          if (!(await start.isDisabled())) break;
          const t = await main().innerText();
          if (/预检未返回企业明细/.test(t)) throw new Error('开始分析禁用：预检未返回企业明细');
          await page.waitForTimeout(500);
        }
        if (await start.isDisabled()) throw new Error('对象已回填但开始分析仍禁用');
        await start.click({ timeout: 8000 });
        const procT0 = Date.now();
        while (Date.now() - procT0 < 60000) {
          const body = await main().innerText().catch(() => '');
          if (/view=processing/.test(page.url()) || /商业力评估生成中|评估生成中/.test(body)) return;
          if (/view=result/.test(page.url()) && Date.now() - procT0 > 5000) {
            throw new Error('任务过快完成，未进入过程态');
          }
          await page.waitForTimeout(300);
        }
        throw new Error('超时未进入过程态');
      };
      const clickCancel = async () => {
        const cancelBtn = page.getByRole('button', { name: '取消任务' }).first();
        if (!(await cancelBtn.isVisible().catch(() => false))) {
          throw new Error('过程页未见「取消任务」按钮');
        }
        await cancelBtn.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
      };
      if (!globalThis.__func00955_done) {
        await reachProcessing();
        await clickCancel();
        globalThis.__func00955_done = true;
      }
      const body = await main().innerText().catch(() => '');
      const url = page.url();
      if (/view=processing/.test(url) && /商业力评估生成中|评估生成中/.test(body)) {
        throw new Error('取消后仍在过程态');
      }
      if (/view=result/.test(url) && /商业力评估结果/.test(body)) {
        throw new Error('取消后误入结果态');
      }
      if (/商业力评估生成中/.test(body)) {
        throw new Error('取消后主区仍显示商业力评估生成中');
      }
  - note: 2、已回填对象与权重配置不被清空
    assert: |-
      if (!globalThis.__func00955_done) throw new Error('前置未完成');
      const main = page.locator('main.app-main').first();
      const body = await main.innerText().catch(() => '');
      if (/请先在对比篮选择企业/.test(body) && !/返回对比篮调整对象/.test(body)) {
        throw new Error('取消后对象区回到空态');
      }
      if (!/返回对比篮调整对象|来自对比篮/.test(body)) {
        throw new Error('取消后未见已回填对象标记');
      }
      if (!/权重合计/.test(body) || !/100/.test(body)) {
        throw new Error('取消后权重合计异常');
      }
      await expect(page.getByText('市场', { exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
