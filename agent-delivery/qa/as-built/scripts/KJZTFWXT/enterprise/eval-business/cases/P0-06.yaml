id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00944
priority: P0
title: 分析完成后自动转入结果态且地址视图参数切换
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
preconditions:
  - 环境健康（2026-10-15 探针：预检已恢复，回填 2 家后「开始分析」enabled）
  - 「最近评估」Tab 至少 1 条已完成任务可「恢复结果」（env-gate historical_results.pass=true）
locators:
  hist_tab: Tab「最近评估」
  restore_button: button「恢复结果」（每行已完成任务一个；2026-10-15 实勘 7 条）
  result_area: 文本「商业力评估结果」+ 得分呈现（数字+分）
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→首个「恢复结果」直达结果态；机检判定在 expect（不重复发起链）
expect:
  - note: 地址视图参数变为结果态（URL 含 view=result；task_id / analysis_type=business 随「恢复结果」带入）
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const closeB = page.getByRole('button', { name: '关闭对比篮' }); if (await closeB.count()) await closeB.first().click().catch(()=>{}); await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 }); const restore = page.getByRole('button', { name: '恢复结果' }); await restore.first().waitFor({ state: 'visible', timeout: 10000 }); const rn = await restore.count(); if (rn < 1) throw new Error('最近评估无已完成任务可「恢复结果」'); await restore.first().click({ timeout: 8000 }); const t0 = Date.now(); while (Date.now() - t0 < 30000) { if (/view=result/.test(page.url())) break; await page.waitForTimeout(1500); } await expect(page).toHaveURL(/view=result/)
  - note: 页面呈现商业力评估结果区
    assert: |-
      await expect(page.getByText('商业力评估结果').first()).toBeVisible({ timeout: 15000 })
  - note: 结果区含得分呈现（得分数值不钉死，observed 记录实际值）
    assert: |-
      await expect(page.locator('body').getByText(/\d+\s*分/).first()).toBeVisible({ timeout: 15000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 2026-10-15 A_SKIP 回炉改结果态实跑（tier B，无 allow_skip）——10-14 闸门 fail（ENV-EVAL-BUSINESS-PRECHECK-001）当日已恢复：fixtures/scout/probe-p006-result.json 回填 2 家后「开始分析」enabled、预检文案消失、「最近评估」7 条已完成可「恢复结果」。路径改走「最近评估 → 恢复结果」直达结果态（method-patch §3 闸门 5 historical_results.pass=true 依据），不重复发起链（发起/过程态由 P0-05 域覆盖）。偏差 D1：用例蓝本前置「过程态已发起且任务进行中」改 as-built「恢复历史已完成任务直达结果态」，URL 断言等价——view=result & task_id=EVAL-* & analysis_type=business 随恢复带入（analysis_fp 为指纹，不可手拼深链）；结果区含「调整配置 / 重新分析 / 评估报告」区块，结果细核归 00945~00947；得分数值不钉死（observed 2026-10-15：EVAL-20260910-002 商业力最高得分 73 分 / 对象集平均得分 50 分）。
tier: B
