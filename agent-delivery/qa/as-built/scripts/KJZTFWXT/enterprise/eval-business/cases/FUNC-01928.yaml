id: FUNC-01928
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01928
priority: P1
title: 处理中行继续查看回到该任务
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-business
tier: B
preconditions:
  - 最近评估有状态为处理中的任务（无则脚本内重新分析→离开兜底）
locators:
  recent_tab: tab「最近评估」
  continue_btn: button「继续查看」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→定位「处理中」行→点「继续查看」；过程/结果页与任务 ID 断言在 expect
expect:
  - note: 1、回到该任务的过程页或结果页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const TID_RE = /(DEMO-EVAL-\d{8}-\d{3}|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const procHint = /商业力.*生成中|评估生成中|可视化分析过程/;
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const pickProcessingContinueOnPage = async () => {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = await row.innerText().catch(() => '');
          if (!/处理中/.test(rowText)) continue;
          const cont = row.getByRole('button', { name: '继续查看' }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          const tidM = rowText.match(TID_RE);
          return { cont, expectedTid: tidM ? tidM[0] : null, rowText };
        }
        return null;
      };
      const pickProcessingContinue = async () => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 12; guard++) {
          await scrollHistoryActions();
          const hit = await pickProcessingContinueOnPage();
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      const openRecentTab = async () => {
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        await expect(tab).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      };
      const taskViewReady = async () => {
        const u = page.url();
        if (/view=processing|view=result/.test(u)) return true;
        const t = await main().innerText().catch(() => '');
        if (procHint.test(t)) return true;
        if (/商业力评估结果/.test(t) && /\d+\s*分/.test(t)) return true;
        if (/评估失败/.test(t)) return true;
        return false;
      };
      const waitLaterBtn = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          for (const name of ['稍后查看', '查看最近评估']) {
            const btn = page.getByRole('button', { name, exact: true });
            if ((await btn.count()) && (await btn.first().isVisible().catch(() => false)) && (await btn.first().isEnabled().catch(() => false))) {
              return btn.first();
            }
          }
          if (/预检未返回企业明细/.test(await main().innerText().catch(() => ''))) {
            throw new Error('预检阻塞（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）');
          }
          await page.waitForTimeout(400);
        }
        return null;
      };
      const readTid = async () => {
        const u = page.url();
        const fromUrl = (u.match(/task_id=([^&]+)/) || [])[1];
        if (fromUrl) return decodeURIComponent(fromUrl);
        const body = await main().innerText().catch(() => '');
        const m = body.match(TID_RE);
        return m ? m[0] : null;
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 ' + n);
      };
      const fillTwoAndStart = async () => {
        await ensureBasketEnterprises(2);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        const openCta = page.getByRole('button', { name: /商业竞争力对标分析|前往对比篮选择企业|返回对比篮调整对象/ }).first();
        await openCta.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const sels = page.locator('[aria-label^="选择 "]');
        if (await sels.count() < 2) throw new Error('对比篮可选企业不足 2 家');
        await sels.nth(0).click({ force: true });
        await sels.nth(1).click({ force: true });
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        const start = page.getByRole('button', { name: '开始分析' });
        const t0 = Date.now();
        while (Date.now() - t0 < 45000) {
          if (!(await start.isDisabled())) break;
          if (/预检未返回企业明细/.test(await main().innerText().catch(() => ''))) {
            throw new Error('预检阻塞（ticket=ENV-EVAL-BUSINESS-PRECHECK-001）');
          }
          await page.waitForTimeout(500);
        }
        if (await start.isDisabled()) throw new Error('开始分析仍禁用');
        await start.click({ timeout: 8000 });
      };
      const waitProcessingShell = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (/view=processing/.test(page.url())) return true;
          const t = await main().innerText().catch(() => '');
          if (procHint.test(t)) return true;
          if (/当前评估任务不存在或已失效/.test(t) && /view=processing/.test(page.url())) {
            throw new Error('ENV-EVAL-BUSINESS-PROCESS-WINDOW-001');
          }
          if (/view=result/.test(page.url()) && /商业力评估结果/.test(t)) return false;
          await page.waitForTimeout(500);
        }
        return /view=processing/.test(page.url()) || procHint.test(await main().innerText().catch(() => ''));
      };
      const reanalyzeFromResult = async () => {
        const rb = main().getByRole('button', { name: '重新分析', exact: true });
        if (!(await rb.count()) || !(await rb.first().isVisible().catch(() => false))) return false;
        await rb.first().click({ timeout: 8000 }).catch(() => rb.first().click({ force: true, timeout: 8000 }));
        if (await waitProcessingShell(90000)) {
          globalThis.__func01928_seedTid = await readTid();
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          await closeBasket();
          await openRecentTab();
          return true;
        }
        const leave = await waitLaterBtn(20000);
        if (leave) {
          await leave.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          await openRecentTab();
          return true;
        }
        return false;
      };
      const ensureProcessingInHistory = async () => {
        await scrollHistoryActions();
        const restores = main().getByRole('button', { name: '恢复结果' });
        const rn = await restores.count();
        for (let i = 0; i < Math.min(rn, 4); i++) {
          const btn = restores.nth(i);
          if (!(await btn.isVisible().catch(() => false))) continue;
          await btn.scrollIntoViewIfNeeded().catch(() => {});
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(2500);
          if (await reanalyzeFromResult()) return;
          await openRecentTab();
          await scrollHistoryActions();
        }
        if (/view=result/.test(page.url())) {
          if (await reanalyzeFromResult()) return;
        }
        try {
          await fillTwoAndStart();
        } catch (e) {
          const msg = String(e && e.message ? e.message : e);
          throw new Error('最近评估无处理中任务且无法发起过程窗（ticket=ENV-EVAL-BUSINESS-HISTORY-PROCESSING-001）：' + msg);
        }
        const inProc = await waitProcessingShell(120000);
        if (!inProc) {
          throw new Error('开始分析后未进入过程态（ticket=ENV-EVAL-BUSINESS-PROCESS-WINDOW-001）');
        }
        globalThis.__func01928_seedTid = await readTid();
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        await openRecentTab();
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await openRecentTab();
      let picked = await pickProcessingContinue();
      if (!picked) {
        await ensureProcessingInHistory();
        const tPoll = Date.now();
        while (Date.now() - tPoll < 20000 && !picked) {
          picked = await pickProcessingContinue();
          if (picked) break;
          await page.waitForTimeout(800);
        }
      }
      if (!picked && globalThis.__func01928_seedTid) {
        const seed = globalThis.__func01928_seedTid;
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!rowText.includes(seed)) continue;
          const cont = row.getByRole('button', { name: '继续查看' }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          picked = { cont, expectedTid: seed, rowText };
          break;
        }
      }
      if (!picked) {
        throw new Error('最近评估无状态为处理中的「继续查看」行（ticket=ENV-EVAL-BUSINESS-HISTORY-PROCESSING-001）');
      }
      if (!picked.expectedTid) {
        throw new Error('处理中行未见任务 ID（ticket=ENV-EVAL-BUSINESS-HISTORY-PROCESSING-001）');
      }
      globalThis.__func01928 = { expectedTid: picked.expectedTid };
      await picked.cont.scrollIntoViewIfNeeded().catch(() => {});
      await picked.cont.click({ timeout: 8000 });
      const tNav = Date.now();
      while (Date.now() - tNav < 45000 && !(await taskViewReady())) {
        await page.waitForTimeout(500);
      }
      if (!(await taskViewReady())) {
        throw new Error('点继续查看后未进入过程页或结果页：' + page.url());
      }
  - note: 2、任务 ID 与该行一致
    assert: |-
      const ctx = globalThis.__func01928;
      if (!ctx || !ctx.expectedTid) throw new Error('前置：未锚定处理中任务 ID');
      const expectedTid = ctx.expectedTid;
      const TID_RE = /(DEMO-EVAL-\d{8}-\d{3}|EVAL-\d{8}-\d{3})/;
      const u = page.url();
      const fromUrl = (u.match(/task_id=([^&]+)/) || [])[1];
      const urlTid = fromUrl ? decodeURIComponent(fromUrl) : null;
      if (urlTid && urlTid === expectedTid) return;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const body = await main().innerText().catch(() => '');
      if (body.includes(expectedTid)) return;
      const m = body.match(TID_RE);
      if (m && m[0] === expectedTid) return;
      throw new Error('任务 ID 不一致：行内 ' + expectedTid + ' URL=' + (urlTid || '无') + ' body=' + (m ? m[0] : '无'));
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01928 验「最近评估」处理中行「继续查看」→回到该任务过程页（view=processing/生成中文案）或结果页（view=result/商业力评估结果）；任务 ID 与行内一致。30888 路由 /enterprise-center/evaluation?workspace=business&mode=business。无处理中行时兜底：恢复结果→重新分析→「稍后查看」/「查看最近评估」→再点继续查看（对齐 01901 路径，不写打开我的任务）。与已取消行继续查看（eval-tech 01807）区分：本脚本行内须含「处理中」。B 档零 allow_skip。登录与关内部评审由 runner 会话前置。
