id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00933
priority: P0
title: 点击空态按钮打开选择分析企业浮层且构成正确
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-business
preconditions:
  - 已进入商业力评估页
  - 评估对象区为空（无 enterprise_codes；脏会话先清参重进）
  - 对比篮至少有企业（env-gate basket_count≥2；本环境可绿）
locators:
  cta: button「前往对比篮选择企业」
  overlay_title: 选择分析企业
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: click
    target: 前往对比篮选择企业
  - action: wait
    for: 浮层标题 选择分析企业
expect:
  - note: 浮层打开且标题为「选择分析企业」、副标题含从对比篮勾选与确定回填不发起分析的语义
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(1000); await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/从对比篮勾选/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/不会发起分析任务/).first()).toBeVisible({ timeout: 8000 })
  - note: 浮层含企业 Tab、名称搜索框与企业类型筛选
    assert: |-
      await expect(page.getByRole('tab', { name: /企业/ }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('按企业名称搜索')).toBeVisible({ timeout: 8000 }); await expect(page.getByPlaceholder('全部企业类型')).toBeVisible({ timeout: 8000 })
  - note: 企业列表含勾选框、查看画像与移除动作
    assert: |-
      const n = await page.locator('[aria-label^="选择 "]').count(); if (n < 1) throw new Error('对比篮无可选企业（aria-label^=选择）'); await expect(page.getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('[aria-label="移除"]').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: A 档零 allow_skip；关闭对比篮 hidden 不点；类型筛 as-built 为 placeholder「全部企业类型」。浮层直回填取代旧册对比篮六类型弹窗；点选企业用 aria-label^="选择 "，勿点「选择指标：」。
tier: A
