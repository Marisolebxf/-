id: FUNC-01922
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01922
priority: P1
tier: B
title: 备选-按此配置新建
entry_id: ent-eval-business
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→已完成行点「按此配置新建评估」
expect:
  - note: 1、回到当前分析配置
    assert: |-
      const main = () => page.locator('main').first();
      const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(recentTab).toBeVisible({ timeout: 15000 });
      await recentTab.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const cloneBtns = page.getByRole('button', { name: '按此配置新建评估' });
      const nClone = await cloneBtns.count();
      if (nClone < 1) {
        throw new Error('最近评估无「按此配置新建评估」（ENV-EVAL-BUSINESS-HISTORY-001）');
      }
      const nameRe = /[\u4e00-\u9fa5A-Za-z0-9（）()·&]+(?:股份有限公司|有限责任公司|有限公司)/g;
      let pickedBtn = cloneBtns.first();
      let rowNames = [];
      let rowCodes = [];
      for (let i = 0; i < nClone; i++) {
        const btn = cloneBtns.nth(i);
        if (!(await btn.isVisible().catch(() => false))) continue;
        const row = btn.locator('xpath=ancestor::tr[1]');
        const rowText = (await row.count() ? await row.innerText() : '') || '';
        if (!/已完成/.test(rowText)) continue;
        const names = [...rowText.matchAll(nameRe)].map((m) => m[0].trim());
        const codes = [...new Set([...(rowText.match(/[a-f0-9]{32}/gi) || [])].map((c) => c.toLowerCase()))];
        if (names.length > rowNames.length || codes.length > rowCodes.length) {
          pickedBtn = btn;
          rowNames = names;
          rowCodes = codes;
        }
        if (rowNames.length > 0) break;
      }
      await expect(pickedBtn).toBeEnabled({ timeout: 8000 });
      await pickedBtn.click({ timeout: 10000 });
      await page.waitForTimeout(500);
      const t0 = Date.now();
      while (Date.now() - t0 < 25000) {
        const body = await main().innerText().catch(() => '');
        const u = page.url();
        if (/view=result/.test(u) || (/商业力评估结果/.test(body) && !/指标与权重/.test(body))) break;
        const removeN = await main().locator('button[aria-label^="移除"]').count();
        if (removeN > 0) break;
        if (/返回对比篮调整对象/.test(body)) break;
        if (/来自对比篮/.test(body) && !/暂未选择评估对象|前往对比篮选择企业/.test(body)) break;
        if (rowNames.some((n) => body.includes(n))) break;
        if (rowCodes.some((c) => u.toLowerCase().includes(c) || body.toLowerCase().includes(c))) break;
        await page.waitForTimeout(500);
      }
      await page.evaluate(
        (d) => { window.__gkx_qa_01922 = d; },
        { rowNames, rowCodes },
      );
      const body = await main().innerText().catch(() => '');
      await expect(page.getByRole('tab', { name: '当前分析', exact: true })).toBeVisible({ timeout: 8000 });
      await expect(main().getByText('评估模板').first()).toBeVisible({ timeout: 8000 });
      await expect(main().getByText('指标与权重').first()).toBeVisible({ timeout: 8000 });
      if (!/评估对象/.test(body)) {
        throw new Error('未见评估对象区：' + page.url());
      }
  - note: 2、对象区带回该任务的企业
    assert: |-
      const s = await page.evaluate(() => window.__gkx_qa_01922 || null);
      const main = () => page.locator('main').first();
      const body = await main().innerText().catch(() => '');
      const url = page.url();
      const removeN = await main().locator('button[aria-label^="移除"]').count();
      if (removeN > 0) return;
      if (/返回对比篮调整对象/.test(body)) return;
      if (/来自对比篮/.test(body) && !/暂未选择评估对象|前往对比篮选择企业/.test(body)) return;
      const codes = [...new Set([...(url.match(/[a-f0-9]{32}/gi) || []), ...(body.match(/[a-f0-9]{32}/gi) || [])].map((c) => c.toLowerCase()))];
      if (s?.rowNames?.length && s.rowNames.some((n) => body.includes(n))) return;
      if (s?.rowCodes?.length && s.rowCodes.some((c) => codes.includes(c))) return;
      const hint = s?.rowNames?.length ? s.rowNames.slice(0, 2).join('、') : (s?.rowCodes?.join(',') || '');
      throw new Error('对象区仍空（ENV-EVAL-BUSINESS-HISTORY-002；行=' + hint + '）');
  - note: 3、不自动进入结果页
    assert: |-
      const u = page.url();
      const t = await page.locator('main').first().innerText().catch(() => '');
      if (/view=result/.test(u)) throw new Error('仍在结果 view：' + u);
      if (/商业力评估结果/.test(t) && !/指标与权重/.test(t)) {
        throw new Error('主区为商业力评估结果');
      }
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
