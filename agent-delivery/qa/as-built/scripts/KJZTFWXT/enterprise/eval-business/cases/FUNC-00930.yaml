id: FUNC-00930
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00930
priority: P0
title: 侧栏进入商业力评估页路由与标题正确
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: A
preconditions:
  - 系统正常；已登录且可访问企业分析侧栏
locators:
  sidebar_entry: 侧栏 link「企业商业力评估对比分析」
  h1: heading「企业商业力评估对比分析」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 侧栏「企业分析」下点商业力评估入口；导航与路由断言在 expect 内自含
expect:
  - note: 路由为企业评估页且携带 workspace=business 参数
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) { await close.first().click(); await page.waitForTimeout(300); }
      }
      const entryName = '企业商业力评估对比分析';
      let clicked = false;
      const tryClick = async () => {
        const link = page.getByRole('link', { name: entryName, exact: true });
        if (await link.count()) {
          await link.first().click({ timeout: 8000 });
          return true;
        }
        return false;
      };
      clicked = await tryClick();
      if (!clicked) {
        const search = page.getByRole('link', { name: '企业查询', exact: true });
        if (await search.count()) {
          await search.first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
          clicked = await tryClick();
        }
      }
      if (!clicked) throw new Error('侧栏未找到企业商业力评估对比分析入口');
      await page.waitForURL(/\/enterprise(\-center)?\/evaluation/, { timeout: 15000 });
      const u = page.url();
      if (!/workspace=business/.test(u)) throw new Error('URL 缺 workspace=business: ' + u);
  - note: 页标题为「企业商业力评估对比分析」
    assert: |-
      await page.waitForLoadState('domcontentloaded').catch(() => {});
      await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 10000 });
      const docTitle = await page.title();
      if (/企业商业力评估对比分析/.test(docTitle)) {
        await expect(page).toHaveTitle(/企业商业力评估对比分析 - 科技专题服务系统/);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 侧栏链文案「企业商业力评估对比分析」；路由常为 /enterprise/evaluation?workspace=business&mode=business（mode 同显形态，本条仅断言 workspace）。部分环境需先点「企业查询」才露出二级链。同壳技术力/综合竞争力正向不在本条。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
