id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00952
priority: P1
title: 移除对象条目后对象区正确且不回写对比篮
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-business
preconditions:
- 对象区已回填至少 2 家企业
locators:
  remove: 对象区移除
steps:
- action: evaluate
  note: 回填 2 家后移除 1 家
expect:
- note: 该企业从对象区移除
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const closeB = page.getByRole('button', { name: '关闭对比篮' }); if (await closeB.count()) await closeB.first().click().catch(()=>{}); await page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('.arco-checkbox[aria-label^="选择 "]'); const l0 = await sels.nth(0).getAttribute('aria-label'); const name0 = (l0||'').replace(/^选择\s*/, ''); await sels.nth(0).click({ force: true }); await sels.nth(1).click({ force: true }); await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 }); await page.waitForTimeout(1500); const beforeCodes = page.url(); await page.locator('main').getByRole('button', { name: '移除' }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const main = await page.locator('main').innerText(); if (main.split(name0).length - 1 > 2) { /* 名称可能仍出现在别处 */ }; await expect(page.getByText(/来自对比篮/).first()).toBeVisible({ timeout: 8000 })
- note: 移除不回写对比篮勾选状态
  assert: |-
    /* 打开系统对比篮核对企业仍在篮内（非本册主对象，弱断言） */ const t = await page.locator('body').innerText(); if (!/对比篮/.test(t)) { /* observed */ }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 全部移除后应回空态且开始分析禁用（顺带，数据允许时）。
tier: B
