id: FUNC-01897
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01897
priority: P0
title: 商业力加权排名条形展示各企业得分
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已打开至少两家企业的评估结果（as-built：最近评估→恢复结果）
locators:
  hist_tab: Tab「最近评估」
  restore_button: button「恢复结果」
  rank_block: 文本「商业力加权排名」
  ent_count_tag: 旁注「N 家企业」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 恢复结果后停留在「商业力加权排名」；判定在 expect
expect:
  - note: 1、区标题为「商业力加权排名」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const rankBlockReady = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return t.includes('商业力加权排名') && /\d+\s*家企业/.test(t);
      };
      const openResultViaHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
        const restore = page.getByRole('button', { name: '恢复结果' });
        await restore.first().waitFor({ state: 'visible', timeout: 10000 });
        if ((await restore.count()) < 1) throw new Error('最近评估无已完成任务可「恢复结果」');
        await restore.first().click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 30000) {
          if (await rankBlockReady()) return;
          await page.waitForTimeout(500);
        }
        if (!(await rankBlockReady())) throw new Error('恢复结果后未见商业力加权排名：' + page.url());
      };
      if (!(await rankBlockReady())) {
        if (globalThis.__func01888_ready || globalThis.__func01889_ready || globalThis.__func01896_onResult) {
          await page.waitForTimeout(500);
        }
        if (!(await rankBlockReady())) await openResultViaHistory();
      }
      await expect(page).toHaveURL(/view=result/);
      await expect(main().getByText('商业力加权排名', { exact: true }).first()).toBeVisible({ timeout: 15000 });
      globalThis.__func01897_onResult = true;
  - note: 2、每家企业有一条得分；3、旁注企业数
    assert: |-
      if (!globalThis.__func01897_onResult) throw new Error('前置：结果页商业力加权排名未就绪');
      const main = () => page.locator('main.app-main').first();
      const panel = await page.evaluate(() => {
        const headings = [...document.querySelectorAll('main *')].filter((el) => {
          const t = (el.textContent || '').trim();
          return t === '商业力加权排名' || (t.includes('商业力加权排名') && t.length < 24);
        });
        let section = headings[0]?.closest('section, [class*="SectionPanel"], .arco-card') || headings[0]?.parentElement;
        for (let i = 0; i < 6 && section; i++) {
          if (section.querySelector('canvas') || /家企业/.test(section.textContent || '')) break;
          section = section.parentElement;
        }
        const root = section || document.querySelector('main');
        const text = root?.innerText || '';
        const entTag = text.match(/(\d+)\s*家企业/);
        const canvas = root?.querySelector('canvas');
        const firmRe = /[\u4e00-\u9fffA-Za-z0-9（）()·]+(?:有限公司|股份有限公司|公司)/g;
        const firms = [...text.matchAll(firmRe)].map((m) => m[0]);
        const uniq = [...new Set(firms)];
        const scoresFromDiag = (() => {
          const full = document.querySelector('main')?.innerText || '';
          const i = full.indexOf('商业力综合得分');
          if (i < 0) return [];
          const chunk = full.slice(i, i + 4000);
          const legacy = [...chunk.matchAll(/(?:有限公司|股份有限公司|公司)\s+((?:\d+(?:\.\d+)?\s+){6})(\d+(?:\.\d+)?)/g)];
          if (legacy.length >= 2) {
            return legacy.map((m) => Number(m[2]));
          }
          const modern = [
            ...chunk.matchAll(
              /(?:有限公司|股份有限公司|公司)[\s\S]{0,160}?(\d+(?:\.\d+)?)\s*[\n\r\s]+(?:高可信|中可信|低可信|不可生成)/g,
            ),
          ];
          return modern.map((m) => Number(m[1]));
        })();
        return {
          entCount: entTag ? parseInt(entTag[1], 10) : 0,
          hasCanvas: !!canvas,
          hasRankHint: /按本次评估综合得分排序/.test(text),
          scoresFromDiag,
        };
      });
      if (!(panel.entCount >= 2)) throw new Error('旁注企业数不足 2：' + JSON.stringify(panel));
      await expect(main().getByText(new RegExp(panel.entCount + '\\s*家企业')).first()).toBeVisible({ timeout: 8000 });
      if (!panel.hasCanvas && !panel.hasRankHint) throw new Error('加权排名区未见条形图或排序说明');
      const scoreRows = panel.scoresFromDiag.filter((n) => Number.isFinite(n));
      if (scoreRows.length < 2) throw new Error('经营诊断表商业力综合得分不足 2 条: ' + JSON.stringify(scoreRows));
      if (scoreRows.length < panel.entCount) {
        throw new Error('旁注企业数多于可见综合得分条数: tag=' + panel.entCount + ' scores=' + scoreRows.length);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例前置「≥2 家评估结果」：单跑经「最近评估→恢复结果」直达。D1：旁注 Tag「N 家企业」+ 副文案「按本次评估综合得分排序」；条形图为 canvas。ECharts 标签不可 innerText 时，用经营诊断表「商业力综合得分」列核对每企一条分值（兼容旧六维同行与 30888 年营收/利润率/综合得分列布局）。不断言名次/降序（FUNC-00945/P0-14）。登录与关内部评审由 runner 会话前置。tier B，无 allow_skip。
