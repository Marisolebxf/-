id: P1-12
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00957
priority: P1
title: 评审模式开启显示追溯与内部字段关闭后零泄漏
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-business
preconditions:
- 人设面板内部评审模式开关可用
locators:
  persona: button.persona-switch
  review_switch: aria-label=内部评审模式
  trace: 企业评估需求集合需求追溯
steps:
- action: click
  target: 开启内部评审模式
- action: click
  target: 打开指标查看
- action: click
  target: 关闭内部评审模式
expect:
- note: 开启后「企业评估需求集合需求追溯」类按钮可见可点
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.locator('button.persona-switch').click({ timeout: 8000 }); await page.waitForTimeout(400); const sw = page.getByRole('switch', { name: '内部评审模式' }); await expect(sw).toBeVisible({ timeout: 8000 }); if ((await sw.getAttribute('aria-checked')) !== 'true') await sw.click(); await page.waitForTimeout(400); await page.keyboard.press('Escape'); await page.waitForTimeout(300); await expect(page.locator('[aria-label="企业评估需求集合需求追溯"]').first()).toBeVisible({ timeout: 8000 })
- note: 指标明细追加指标编号、公式、源表等内部字段
  assert: |-
    await page.getByRole('button', { name: '查看' }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const t = await page.locator('.arco-drawer:visible').first().innerText(); if (!/(指标编号|metric|公式|源表|M_ENT_)/i.test(t)) throw new Error('评审态抽屉未见内部字段'); await page.locator('.arco-drawer:visible .arco-drawer-close-btn').first().click({ timeout: 5000 }).catch(()=>page.keyboard.press('Escape'))
- note: 关闭后页面无追溯按钮与内部编号字样
  assert: |-
    await page.locator('button.persona-switch').click({ timeout: 8000 }); await page.waitForTimeout(400); const sw = page.getByRole('switch', { name: '内部评审模式' }); if ((await sw.getAttribute('aria-checked')) === 'true') await sw.click(); await page.waitForTimeout(400); await page.keyboard.press('Escape'); await page.waitForTimeout(400); if (await page.locator('[aria-label="企业评估需求集合需求追溯"]').count()) throw new Error('关闭评审后追溯按钮仍可见'); const main = await page.locator('main').innerText(); for (const bad of ['M_ENT_BUSINESS', 'GAP-', 'Q0']) { if (main.includes(bad)) throw new Error('关闭评审后泄漏: ' + bad) }
- note: 开关往返不改变指标、权重与对象配置
  assert: |-
    const spins = page.locator('main [role=spinbutton]'); const n = await spins.count(); if (n < 6) throw new Error('评审开关后指标数异常: ' + n); await expect(page.getByText('市场', { exact: true }).first()).toBeVisible()
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 结构性 4 点；行业特性调整现场无独立交互（开放项 1，随本条全页查找 observed）。P3：必须用 aria-label=内部评审模式。
tier: B
