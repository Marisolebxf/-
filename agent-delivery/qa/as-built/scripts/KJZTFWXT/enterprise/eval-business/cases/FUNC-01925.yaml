id: FUNC-01925
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01925
priority: P1
tier: B
title: 确定删除后该任务从最近评估消失
entry_id: ent-eval-business
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
expect:
  - note: 1、该任务 ID 不再出现在最近评估列表
    assert: |-
      const main = page.locator('main');
      await main.getByRole('button', { name: '前往对比篮选择企业' }).click();
      const panel = page.locator('.arco-modal, .arco-drawer').filter({ hasText: '选择分析企业' }).first();
      await panel.waitFor({ state: 'visible', timeout: 15000 });
      const boxes = panel.getByRole('checkbox');
      await boxes.nth(0).check();
      await boxes.nth(1).check();
      await panel.getByRole('button', { name: '确定' }).click();
      await main.getByRole('button', { name: '开始分析' }).click();
      await main.getByText('商业力评估结果').waitFor({ state: 'visible', timeout: 180000 });
      const idMatch = (await main.innerText()).match(/EVAL-\d{8}-\d+/);
      if (!idMatch) throw new Error('未在结果页捕获任务 ID');
      const tid = idMatch[0];
      await page.getByRole('tab', { name: '最近评估' }).click();
      await main.getByText('最近评估').waitFor({ state: 'visible', timeout: 15000 });
      const row = main.locator('tr').filter({ hasText: tid }).first();
      await row.getByRole('button', { name: '删除' }).click();
      await page.locator('.arco-modal').filter({ hasText: '删除分析记录' }).getByRole('button', { name: '确定' }).click();
      await expect(main).not.toContainText(tid);
on_fail: 截图 + 抄 X-Trace-Id
