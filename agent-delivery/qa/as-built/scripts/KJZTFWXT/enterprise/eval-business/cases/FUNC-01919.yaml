id: FUNC-01919
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01919
priority: P0
title: 营收趋势页签切换诊断区
story: US-ENT-EVAL-BIZ
entry_id: ent-eval-business
tier: B
preconditions:
  - 已打开评估结果（as-built：最近评估→恢复结果）
locators:
  hist_tab: Tab「最近评估」
  restore_button: button「恢复结果」
  diag_block: 文本「商业诊断与明细」
  trend_tab: tab「营收趋势」（tablist「商业诊断与明细分段」）
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 结果态→点「营收趋势」；判定在 expect
expect:
  - note: 1、「营收趋势」处于选中
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=business&mode=business';
      const main = () => page.locator('main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const scrollDiagIntoView = async () => {
        const h = page.getByText('商业诊断与明细', { exact: true }).first();
        if (await h.count()) {
          await h.scrollIntoViewIfNeeded().catch(() => {});
          await page.waitForTimeout(500);
        }
      };
      const resultReady = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return t.includes('商业诊断与明细') && t.includes('经营诊断');
      };
      const openResultViaHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
        let restore = page.getByRole('button', { name: '恢复结果' });
        if ((await restore.count()) < 1) restore = page.getByText('恢复结果', { exact: true });
        await restore.first().waitFor({ state: 'visible', timeout: 10000 });
        if ((await restore.count()) < 1) throw new Error('最近评估无已完成任务可「恢复结果」');
        await restore.first().click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 30000) {
          if (await resultReady()) break;
          await page.waitForTimeout(500);
        }
        if (!(await resultReady())) throw new Error('恢复结果后未见商业诊断与明细：' + page.url());
      };
      if (!(await resultReady())) {
        if (globalThis.__func01896_onResult || globalThis.__func01898_onResult) {
          await page.waitForTimeout(500);
        }
        if (!(await resultReady())) await openResultViaHistory();
      }
      await expect(page).toHaveURL(/view=result/);
      await scrollDiagIntoView();
      const tablist = page.getByRole('tablist', { name: '商业诊断与明细分段' });
      await expect(tablist).toBeVisible({ timeout: 12000 });
      const trendTab = tablist.getByRole('tab', { name: '营收趋势', exact: true });
      await trendTab.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(trendTab).toHaveAttribute('aria-selected', 'true');
      globalThis.__func01919_onResult = true;
  - note: 2、诊断区展示营收趋势内容
    assert: |-
      if (!globalThis.__func01919_onResult) throw new Error('前置：未切换到营收趋势页签');
      const main = () => page.locator('main.app-main').first();
      await expect(main().getByText('商业诊断与明细', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const tablist = page.getByRole('tablist', { name: '商业诊断与明细分段' });
      const trendTab = tablist.getByRole('tab', { name: '营收趋势', exact: true });
      await expect(trendTab).toHaveAttribute('aria-selected', 'true');
      const diagSection = await page.evaluate(() => {
        const headings = [...document.querySelectorAll('main *')].filter((el) => (el.textContent || '').trim() === '商业诊断与明细');
        let root = headings[0]?.closest('section, [class*="SectionPanel"], .arco-card') || headings[0]?.parentElement;
        for (let i = 0; i < 8 && root; i++) {
          if (root.querySelector('[role="tablist"]')) break;
          root = root.parentElement;
        }
        const panel = root || document.querySelector('main');
        const text = panel?.innerText || '';
        const hasTrendEmpty = /暂无连续年度营收数据|暂不绘制趋势|最近一期营业收入/.test(text);
        const hasCanvas = !!panel?.querySelector('canvas');
        const hasRevenueTable = /年营收|营业收入|营收趋势/.test(text) && !/商业力综合得分/.test(text.slice(text.indexOf('营收趋势')));
        const opsTabSelected = panel?.querySelector('[role="tab"][aria-selected="true"]')?.textContent?.includes('营收趋势');
        return { hasTrendEmpty, hasCanvas, hasRevenueTable, opsTabSelected, snippet: text.slice(0, 800) };
      });
      if (!diagSection.opsTabSelected) throw new Error('营收趋势 tab 未处于选中态');
      const trendContentOk = diagSection.hasTrendEmpty || diagSection.hasCanvas || diagSection.hasRevenueTable;
      if (!trendContentOk) {
        throw new Error('诊断区未见营收趋势内容（空态/图表/营收文案）：' + JSON.stringify(diagSection));
      }
      const emptyDesc = main().locator('.arco-empty').filter({ hasText: /营收|营业收入/ });
      const canvasInMain = main().locator('canvas');
      const emptyVis = (await emptyDesc.count()) > 0 && (await emptyDesc.first().isVisible().catch(() => false));
      const canvasVis = (await canvasInMain.count()) > 0 && (await canvasInMain.first().isVisible().catch(() => false));
      if (!emptyVis && !canvasVis && !diagSection.hasRevenueTable) {
        await expect(main().getByText(/暂无连续年度营收数据|最近一期营业收入/).first()).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例前置「已打开评估结果」：单跑经「最近评估→恢复结果」。30888 as-built 营收趋势页签多为 Arco Empty（暂无连续年度营收数据…最近一期营业收入）；有连续年度数据时可为图表 canvas——expect2 双路径。子 Tab 为 role=tab + tablist aria-label「商业诊断与明细分段」。登录与关内部评审由 runner 会话前置。tier B，无 allow_skip。
