id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00948
priority: P1
title: 两Tab可往返且返回当前分析后当次配置保留
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-business
preconditions:
- 已带入对象并调整过权重；或至少可切换 Tab
locators:
  tab_current: 当前分析
  tab_recent: 最近评估
steps:
- action: click
  target: 最近评估
- action: click
  target: 当前分析
expect:
- note: 「最近评估」以列表呈现历史评估任务
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const spin = page.locator('main [role=spinbutton]').first(); const w0 = await spin.inputValue(); await page.locator('main .arco-input-number-step-button').nth(0).click(); await page.waitForTimeout(300); const w1 = await spin.inputValue(); await page.getByRole('tab', { name: '最近评估' }).click({ timeout: 8000 }); await page.waitForTimeout(800); await expect(page.getByRole('tab', { name: '最近评估' })).toBeVisible(); /* 列表或空态均接受 */ await expect(page.locator('main')).toBeVisible()
- note: 返回后对象与权重保持原值
  assert: |-
    await page.getByRole('tab', { name: '当前分析' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const spin = page.locator('main [role=spinbutton]').first(); const w = await spin.inputValue(); if (!w) throw new Error('返回当前分析后权重丢失')
- note: 往返切换不产生新任务
  assert: if (/view=processing/.test(page.url())) throw new Error('Tab 往返意外进入过程态')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 现场两 Tab（非目标态四 Tab）；无历史时列表空态 observed。
tier: B
