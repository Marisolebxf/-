id: FUNC-01917
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01917
priority: P1
title: 保存个人模板时取消不改变当前模板
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-business
tier: B
preconditions:
  - 当前模板为商业力标准模板（脚本必要时从下拉重选）
locators:
  save_entry: button「保存为个人模板」
  modal_title: 保存为个人模板
  name_label: 个人模板名称
  modal_cancel: button「取消」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 打开保存模板对话框→校验文案→点取消；模板不变判定在 expect
expect:
  - note: 1、对话框含「个人模板名称」且计数 n/30；2、说明将保存模式、指标和权重；3、取消后仍为商业力标准模板
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=business&mode=business';
      const isStandardTemplate = (t) => /商业力标准模板|系统商业力模板\s*v1\.0/.test(t);
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const gotoEvalBusiness = async () => {
        if (!page.url().includes('/enterprise/evaluation') || !page.url().includes('workspace=business')) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
        }
        await closeBasket();
        await expect(page.getByRole('heading', { name: '企业商业力评估对比分析' }).first()).toBeVisible({ timeout: 12000 });
        const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
        if (await curTab.count()) {
          await curTab.first().click({ timeout: 5000 });
          await page.waitForTimeout(500);
        }
      };
      const templateTrigger = () =>
        page.locator('.arco-select-view').filter({ hasText: /商业力|模板|未保存|系统商业力/ }).first();
      const ensureStandardTemplate = async () => {
        const trg = templateTrigger();
        await expect(trg).toBeVisible({ timeout: 10000 });
        let closed = (await trg.innerText()).replace(/\s+/g, ' ').trim();
        if (isStandardTemplate(closed)) return closed;
        await trg.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const pop = page.locator('.arco-select-popup:visible, .arco-trigger-popup:visible').filter({ hasText: /系统模板|商业力标准|系统商业力/ }).last();
        await expect(pop).toBeVisible({ timeout: 10000 });
        const opt = pop.locator('.arco-select-option').filter({ hasText: /商业力标准模板|系统商业力模板\s*v1\.0/ }).first();
        if (!(await opt.count())) {
          await pop.getByText(/商业力标准模板|系统商业力模板\s*v1\.0/).first().click({ timeout: 8000 });
        } else {
          await opt.click({ timeout: 8000 });
        }
        await page.waitForTimeout(600);
        closed = (await templateTrigger().innerText()).replace(/\s+/g, ' ').trim();
        if (!isStandardTemplate(closed)) {
          throw new Error('前置未能切回商业力标准模板，实见：' + closed);
        }
        return closed;
      };
      await gotoEvalBusiness();
      const beforeTemplate = await ensureStandardTemplate();
      await page.getByRole('button', { name: '保存为个人模板' }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '保存为个人模板' }).first();
      await expect(modal).toBeVisible({ timeout: 8000 });
      const modalText = await modal.innerText();
      if (!modalText.includes('个人模板名称')) {
        throw new Error('对话框未见「个人模板名称」');
      }
      if (!/\d+\s*\/\s*30/.test(modalText)) {
        throw new Error('对话框未见 n/30 字数计数，实见：' + modalText.replace(/\s+/g, ' ').slice(0, 280));
      }
      if (!/将保存/.test(modalText) || !/指标/.test(modalText) || !/权重/.test(modalText)) {
        throw new Error('对话框缺少保存模式/指标/权重说明，实见：' + modalText.replace(/\s+/g, ' ').slice(0, 320));
      }
      await modal.getByRole('button', { name: '取消', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const stillOpen = page.locator('.arco-modal:visible').filter({ hasText: '保存为个人模板' });
      if (await stillOpen.count()) throw new Error('点取消后保存模板对话框仍打开');
      const afterTemplate = (await templateTrigger().innerText()).replace(/\s+/g, ' ').trim();
      if (!isStandardTemplate(afterTemplate)) {
        throw new Error('取消后模板应仍为商业力标准模板，实见：' + afterTemplate + '（取消前：' + beforeTemplate + '）');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例 01917 重写 00950 取消路径：「保存为个人模板」→ Arco 弹层校验「个人模板名称」+ show-word-limit n/30 + 说明将保存评估模式/指标选择/权重（EvalConfigPanel.vue）→「取消」关层且不收起态模板。前置非标准模板时从下拉重选「系统商业力模板 v1.0」（对应用例「商业力标准模板」，同 FUNC-01891）。路由 catalog_path /enterprise/evaluation?workspace=business&mode=business（svcz 上 /enterprise-center/evaluation 404）。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
