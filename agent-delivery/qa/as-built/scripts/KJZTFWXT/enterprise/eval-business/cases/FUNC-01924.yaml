id: FUNC-01924
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01924
priority: P1
title: 删除分析记录时取消则任务仍在
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-business
tier: B
preconditions:
  - 最近评估至少有一条任务（锚定首条可见「删除」行）
locators:
  recent_tab: tab「最近评估」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→记录任务 ID→点「删除」→弹框验标题/文案→点「取消」；行仍在 expect 判定
expect:
  - note: 1、提示框标题为「删除分析记录」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=business&mode=business';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const rowFromAnchor = (anchor) =>
        anchor.locator('xpath=ancestor::tr[1] | ancestor::*[contains(@class,"arco-table-tr")][1]').first();
      const deleteInRow = (row) => row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(500);
      };
      const pickHistoryDelete = async () => {
        await scrollHistoryActions();
        const rowAnchors = async (name) => {
          const btns = main().getByRole('button', { name, exact: true });
          const n = await btns.count();
          const out = [];
          for (let i = 0; i < n; i++) out.push(btns.nth(i));
          return out;
        };
        const anchors = [
          ...(await rowAnchors('恢复结果')),
          ...(await rowAnchors('继续查看')),
        ];
        for (const anchor of anchors) {
          if (!(await anchor.isVisible().catch(() => false))) continue;
          const row = rowFromAnchor(anchor);
          await row.scrollIntoViewIfNeeded().catch(() => {});
          let del = deleteInRow(row);
          if (!(await del.count())) {
            del = row.getByRole('button', { name: '删除', exact: true }).last();
          }
          if (!(await del.count())) continue;
          await del.scrollIntoViewIfNeeded().catch(() => {});
          await scrollHistoryActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          return { del, row };
        }
        const dels = main().getByRole('button', { name: '删除', exact: true });
        const dn = await dels.count();
        for (let i = 0; i < dn; i++) {
          const del = dels.nth(i);
          await del.scrollIntoViewIfNeeded().catch(() => {});
          if (!(await del.isVisible().catch(() => false))) continue;
          return { del, row: rowFromAnchor(del) };
        }
        return null;
      };
      const waitRecentList = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 20000) {
          const t = await main().innerText().catch(() => '');
          if (/删除/.test(t) || /恢复结果/.test(t) || /继续查看/.test(t)) return;
          if (/共\s*\d+\s*条/.test(t) && !/加载/.test(t)) return;
          if (/暂无|没有.*记录|空/.test(t)) return;
          await page.waitForTimeout(400);
        }
      };
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await closeBasket();
      await expect(page.getByText('企业商业力评估对比分析', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      const clickRecentTab = async () => {
        const tablists = page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) });
        const list = (await tablists.count()) ? tablists.first() : page.locator('[role=tablist]').first();
        const recent = list.getByRole('tab', { name: '最近评估', exact: true });
        if (await recent.count()) {
          await expect(recent).toBeVisible({ timeout: 10000 });
          await recent.click({ timeout: 8000 });
        } else {
          await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(800);
      };
      await clickRecentTab();
      await page.waitForTimeout(700);
      await waitRecentList();
      await scrollHistoryActions();
      let picked = await pickHistoryDelete();
      if (!picked) {
        await scrollHistoryActions();
        picked = await pickHistoryDelete();
      }
      const hasHistoryRow = (await main().getByRole('button', { name: '恢复结果' }).count()) > 0
        || (await main().getByRole('button', { name: '继续查看' }).count()) > 0
        || TID_RE.test(await main().innerText().catch(() => ''));
      if (!picked) {
        const mainText = await main().innerText().catch(() => '');
        if (/暂无数据|暂无|没有.*记录/.test(mainText) && !hasHistoryRow) {
          throw new Error('最近评估无可删除记录（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
        }
        const delTotal = await main().getByRole('button', { name: '删除', exact: true }).count();
        if (hasHistoryRow || delTotal === 0) {
          throw new Error('最近评估有历史行但操作列无「删除」按钮（ticket=DEF-ENT-EVAL-HISTORY-DELETE-UI-001）');
        }
        throw new Error('最近评估无可删除记录（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
      }
      const { del: delBtn, row } = picked;
      let rowText = (await row.count()) ? await row.innerText().catch(() => '') : '';
      if (!rowText || !TID_RE.test(rowText)) {
        rowText = await main().innerText().catch(() => '');
      }
      const tidM = rowText.match(TID_RE);
      if (!tidM) throw new Error('删除前行未见任务 ID（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
      globalThis.__func01924_tid = tidM[0];
      await delBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      await expect(modal.locator('.arco-modal-title').filter({ hasText: '删除分析记录' }).first()).toBeVisible();
      globalThis.__func01924_modalReady = true;
  - note: 2、文案写明删除后列表不再显示
    assert: |-
      if (!globalThis.__func01924_modalReady) throw new Error('前置：未打开删除弹框');
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 5000 });
      const bodyText = (await modal.innerText()).replace(/\s+/g, ' ');
      const explainsHidden =
        /不再显示|不再展示|列表.*不|删除后/.test(bodyText) || /删除.*记录/.test(bodyText);
      if (!explainsHidden) {
        throw new Error('弹框未说明删除后列表不再显示，正文：' + bodyText.slice(0, 200));
      }
  - note: 3、取消后该任务仍在列表
    assert: |-
      if (!globalThis.__func01924_modalReady) throw new Error('前置：未打开删除弹框');
      const expectedTid = globalThis.__func01924_tid;
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 5000 });
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const tableTaskIds = async () => {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        const ids = [];
        for (let i = 0; i < n; i++) {
          const txt = await rows.nth(i).innerText().catch(() => '');
          const m = txt.match(TID_RE);
          if (m) ids.push(m[0]);
        }
        if (ids.length) return ids;
        const body = await main().innerText().catch(() => '');
        const all = body.match(new RegExp(TID_RE.source, 'g')) || [];
        return [...new Set(all)];
      };
      const idsAfter = await tableTaskIds();
      if (!idsAfter.includes(expectedTid)) {
        throw new Error('取消删除后任务不在最近评估列表：' + expectedTid);
      }
      const rowStill = main().locator('table tbody tr').filter({ hasText: expectedTid });
      await expect(rowStill.first()).toBeVisible({ timeout: 5000 });
      const msgDeleted = page.locator('.arco-message-content').filter({ hasText: '已删除' });
      if (await msgDeleted.count() && await msgDeleted.first().isVisible().catch(() => false)) {
        throw new Error('取消后不应出现「已删除」提示');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  FUNC-01924 备选-删除取消（确定路径见 01925，本条非破坏性）。D1·edu tts/svcz entry-seed ent-eval-business（catalog_path /enterprise/evaluation?workspace=business&mode=business；enterprise-center 在该环境 404）。最近评估行「删除」→Modal「删除分析记录」→「取消」→任务 ID 仍在。D4·2026-10-20 rewrite-FUNC-01924 svcz 机跑 fail·ENV-EVAL-BUSINESS-HISTORY-001（admin 最近评估表「暂无数据」，删除弹框三条 expect 未触达；有历史无删除钮时改挂 DEF-ENT-EVAL-HISTORY-DELETE-UI-001，同 01925/01805）。非破坏性。登录与关内部评审由 runner 前置。B 档零 allow_skip。
