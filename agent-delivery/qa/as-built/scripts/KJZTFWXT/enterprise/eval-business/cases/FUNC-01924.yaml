id: FUNC-01924
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01924
priority: P1
tier: B
title: 备选-删除取消
entry_id: ent-eval-business
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=business&mode=business
  - action: evaluate
    note: 最近评估→首行「删除」→弹框「取消」
expect:
  - note: 1、提示框标题为「删除分析记录」
    assert: |-
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main').first();
      const rowFromAnchor = (anchor) =>
        anchor.locator('xpath=ancestor::tr[1] | ancestor::*[contains(@class,"arco-table-tr")][1]').first();
      const deleteInRow = (row) => row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const clickRecentTab = async () => {
        const recent = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recent).toBeVisible({ timeout: 15000 });
        await recent.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const pickHistoryDelete = async () => {
        await scrollHistoryActions();
        for (const name of ['恢复结果', '继续查看']) {
          const btns = main().getByRole('button', { name, exact: true });
          const n = await btns.count();
          for (let i = 0; i < n; i++) {
            const anchor = btns.nth(i);
            if (!(await anchor.isVisible().catch(() => false))) continue;
            const row = rowFromAnchor(anchor);
            let del = deleteInRow(row);
            if (!(await del.count())) del = row.getByRole('button', { name: '删除', exact: true }).last();
            if (!(await del.count()) || !(await del.isVisible().catch(() => false))) continue;
            await del.scrollIntoViewIfNeeded().catch(() => {});
            return { del, row };
          }
        }
        const dels = main().getByRole('button', { name: '删除', exact: true });
        const dn = await dels.count();
        for (let i = 0; i < dn; i++) {
          const del = dels.nth(i);
          if (!(await del.isVisible().catch(() => false))) continue;
          return { del, row: rowFromAnchor(del) };
        }
        return null;
      };
      const seedHistoryVia01888 = async () => {
        await page.getByRole('tab', { name: '当前分析', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 15000 });
        const modal = page.locator('.arco-modal').last();
        await expect(modal.getByText('选择分析企业').first()).toBeVisible({ timeout: 12000 });
        const cbs = modal.locator('tbody input[type=checkbox], .arco-checkbox input');
        let checked = 0;
        const cn = await cbs.count();
        for (let i = 0; i < cn && checked < 2; i++) {
          const cb = cbs.nth(i);
          if (!(await cb.isVisible().catch(() => false))) continue;
          await cb.check({ force: true }).catch(() => cb.click({ force: true }));
          checked++;
        }
        if (checked < 2) throw new Error('对比篮不足 2 家企业，无法造最近评估（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
        await modal.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const start = main().getByRole('button', { name: '开始分析', exact: true });
        await expect(start).toBeEnabled({ timeout: 12000 });
        await start.click({ timeout: 10000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          const body = await main().innerText().catch(() => '');
          const u = page.url();
          if (/view=result/.test(u) || /商业力评估结果/.test(body)) break;
          if (/稍后查看/.test(body)) {
            await page.getByRole('button', { name: '稍后查看', exact: true }).click({ timeout: 8000 }).catch(() => {});
            break;
          }
          await page.waitForTimeout(800);
        }
        await clickRecentTab();
        await page.waitForTimeout(1000);
      };
      await clickRecentTab();
      await page.waitForTimeout(700);
      let picked = await pickHistoryDelete();
      if (!picked) {
        const mainText = await main().innerText().catch(() => '');
        if (/暂无数据|暂无|没有.*记录/.test(mainText)) {
          await seedHistoryVia01888();
          picked = await pickHistoryDelete();
        }
      }
      if (!picked) {
        const mainText = await main().innerText().catch(() => '');
        if (/暂无数据|暂无|没有.*记录/.test(mainText)) {
          throw new Error('最近评估无可删除记录（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
        }
        throw new Error('最近评估有历史行但操作列无「删除」按钮（ticket=DEF-ENT-EVAL-HISTORY-DELETE-UI-001）');
      }
      const { del: delBtn, row } = picked;
      let rowText = (await row.count()) ? await row.innerText().catch(() => '') : '';
      if (!rowText || !TID_RE.test(rowText)) rowText = await main().innerText().catch(() => '');
      const tidM = rowText.match(TID_RE);
      if (!tidM) throw new Error('删除前行未见任务 ID（ticket=ENV-EVAL-BUSINESS-HISTORY-001）');
      await page.evaluate((tid) => { window.__func01924_tid = tid; }, tidM[0]);
      await delBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal-wrapper:not([style*="display: none"]) .arco-modal').filter({ hasText: '删除分析记录' }).last();
      await expect(modal).toBeVisible({ timeout: 8000 });
      await expect(modal.locator('.arco-modal-title').filter({ hasText: '删除分析记录' }).first()).toBeVisible();
      await page.evaluate(() => { window.__func01924_modalReady = true; });
  - note: 2、文案写明删除后列表不再显示
    assert: |-
      const ready = await page.evaluate(() => window.__func01924_modalReady);
      if (!ready) throw new Error('前置：未打开删除弹框');
      const modal = page.locator('.arco-modal-wrapper:not([style*="display: none"]) .arco-modal').filter({ hasText: '删除分析记录' }).last();
      await expect(modal).toBeVisible({ timeout: 5000 });
      const bodyText = (await modal.innerText()).replace(/\s+/g, ' ');
      if (!/删除后列表不再显示/.test(bodyText)) {
        throw new Error('弹框未说明删除后列表不再显示，正文：' + bodyText.slice(0, 200));
      }
  - note: 3、取消后该任务仍在列表
    assert: |-
      const expectedTid = await page.evaluate(() => window.__func01924_tid);
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main').first();
      const modal = page.locator('.arco-modal-wrapper:not([style*="display: none"]) .arco-modal').filter({ hasText: '删除分析记录' }).last();
      await expect(modal).toBeVisible({ timeout: 5000 });
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      await expect(main().locator('table tbody tr').filter({ hasText: expectedTid }).first()).toBeVisible({ timeout: 8000 });
      const body = await main().innerText().catch(() => '');
      if (!body.includes(expectedTid)) {
        throw new Error('取消删除后任务不在最近评估列表：' + expectedTid);
      }
on_fail: 截图 + 抄 X-Trace-Id
