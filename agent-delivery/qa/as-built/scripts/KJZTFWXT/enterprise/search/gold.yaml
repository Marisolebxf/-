# 企业查询金样冒烟（5 条，id 锁定禁改）
# 蓝本 = 用例册 v2.0（ZNFWJQ-KJZTFWXT-v1.0-FUNC-00438~00480）
# 金样映射：P0-01=00438 · P0-02=00439 · P0-03=00440 · P0-04=00443 · P0-05=00456
# locator 基准 = 2026-10-13 50892 实勘（三 tab / 示例与热门 chip / 长卡列表 / .arco-drawer 十页签 / button.metric-spec-card）

scripts:
  - id: P0-01
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00438
    priority: P0
    title: 侧栏进入企业查询默认智能搜索四层主视觉自上而下排布
    story: US-E1-SCH-03
    entry_id: ent-search
    preconditions:
      - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
      - 经人设面板确认内部评审模式已关闭（评审模式默认可能为开；默认态记 observed）
    locators:
      menu: '菜单项「企业分析」→「企业查询」'
      mode_tabs: 'tab 智能搜索 / 查企业 / 高级筛选（aria-selected）'
      search_input: 'textbox name 含「输入企业名、产业、资质、区域或专利关键词」'
      example_row: '「示例查询」行 chips（button：人工智能/集成电路/生物医药/新能源/高端装备）'
      hot_row: '「热门场景」行 chips（button：深圳高新技术企业 等 4 枚）'
      search_btn: 'button「搜索」（蓝色主视觉）'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: assert_url
        expect_contains: /enterprise/enterprise-search
      - action: assert_visible
        target: tab「智能搜索」
        state: selected
    expect:
      - note: 路由为企业查询页且智能搜索为选中态
        assert: "await expect(page).toHaveURL(/enterprise\\/enterprise-search/); await expect(page.getByRole('tab', { name: '智能搜索' })).toHaveAttribute('aria-selected', 'true')"
      - note: 顶部自上而下依次为检索模式、搜索框、示例查询、热门场景
        assert: "await expect(page.getByRole('tab', { name: '智能搜索' })).toBeVisible(); await expect(page.getByPlaceholder(/输入企业名、产业、资质、区域或专利关键词/)).toBeVisible(); await expect(page.getByText('示例查询')).toBeVisible(); await expect(page.getByText('热门场景')).toBeVisible()"
      - note: 示例查询与热门场景各占独立一行
        manual: true
      - note: 蓝色搜索主视觉可见
        assert: "await expect(page.getByRole('button', { name: '搜索', exact: true })).toBeVisible()"
    on_fail: 截图 + 抄 X-Trace-Id（网络面板可见时）+ C1~C6 分类
    as_built_note: 首层 tab 区同页还有系统级对比篮 tab（企业 5/50 等，class system-compare-tabs），非检索模式，勿混淆。

  - id: P0-02
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00439
    priority: P0
    title: 点击示例查询 chip 仅回填关键词不自动检索
    story: US-E1-SCH-03
    entry_id: ent-search
    preconditions:
      - 已进入企业查询初始态，可见示例查询
    locators:
      example_chip: 'button 人工智能（示例查询行，任一 chip）'
      search_input: 'textbox placeholder 含「输入企业名、产业」'
      empty_hint: '空态文案「输入关键词或选择热门场景后开始构造企业集合」'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: click
        target: 示例查询任一 chip（默认「人工智能」）
      - action: assert_visible
        target: 搜索框
        state: value=chip 词
    expect:
      - note: 搜索框回填该示例词
        assert: "await expect(page.getByPlaceholder(/输入企业名、产业、资质、区域或专利关键词/)).toHaveValue('人工智能')"
      - note: 页面维持初始引导态且无检索结果标题
        assert: "await expect(page.getByText('输入关键词或选择热门场景后开始构造企业集合')).toBeVisible(); await expect(page.getByText('智能搜索结果')).toHaveCount(0)"
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: chip 词单现场实勘为人工智能/集成电路/生物医药/新能源/高端装备；点后自动出结果判不通过（产品口径不自动提交）。清词回引导另条 P1-24。

  - id: P0-03
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00440
    priority: P0
    title: 智能搜索关键词检索后得到长卡片结果与命中条数
    story: US-E1-SCH-02
    entry_id: ent-search
    preconditions:
      - 已进入企业查询默认智能搜索
      - 搜索框已回填示例词（承接 P0-02 或手动填入「人工智能」）
    locators:
      search_btn: 'button「搜索」'
      result_title: '结果标题「智能搜索结果 · 命中 N 家企业」'
      card: '横向长卡片（含企业名称 button、经营状态、查看画像 button）'
      view_profile: 'button「查看画像」'
    steps:
      - action: fill
        target: 搜索框
        value: 人工智能
      - action: click
        target: 搜索按钮
      - action: wait
        for: 结果标题出现
      - action: assert_visible
        target: 智能搜索结果标题
      - action: assert_visible
        target: 任一结果长卡片
      - action: assert_visible
        target: 查看画像按钮
      - action: snapshot
    expect:
      - note: 结果标题为智能搜索结果且含命中条数
        assert: "await expect(page.getByText('智能搜索结果')).toBeVisible(); await expect(page.getByText(/命中 \\d+ 家企业/)).toBeVisible()"
      - note: 至少一张横向长卡片且含企业名称与经营状态
        assert: "await expect(page.getByRole('button', { name: '查看画像' }).first()).toBeVisible(); await expect(page.getByText('在营').first()).toBeVisible()"
      - note: 卡片含「查看画像」动作
        assert: "await expect(page.getByRole('button', { name: '查看画像' }).first()).toBeVisible()"
    allow_empty: false
    allow_skip: 明确空态且非服务错误时记 Pass-N/A（数据阻塞），须在 observed 记录空态文案
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: 命中条数不钉死（本轮实勘 4493，只记 observed）；名称是否含关键词不判（多字段命中）。匹配字段反馈另条 P1-15。

  - id: P0-04
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00443
    priority: P0
    title: 点击企业名称打开当前页画像抽屉且十页签齐全
    story: US-E1-SCH-05
    entry_id: ent-search
    preconditions:
      - 已有非空结果列表（承接 P0-03 结果态）
    locators:
      card_name: '结果卡企业名称 button（如「深圳市三通连接系统有限公司」；名称以现场为准不钉死）'
      drawer: '.arco-drawer（企业详情）'
      drawer_tabs: '抽屉内 tab：工商概况/主要团队/资质荣誉/知识产权/经营财务/供应链关系/关系图谱/舆情动态/风险信息/招投标'
    steps:
      - action: click
        target: 结果中任一企业名称
      - action: wait
        for: .arco-drawer 可见
      - action: assert_visible
        target: .arco-drawer
      - action: assert_url
        expect_not_contains: /detail 或其他路由变化（当前页不跳转）
      - action: snapshot
        target: .arco-drawer 内页签
    expect:
      - note: 抽屉在当前页打开且路由不变
        assert: "await expect(page.locator('.arco-drawer')).toBeVisible(); await expect(page).toHaveURL(/enterprise\\/enterprise-search/)"
      - note: 抽屉含企业头部且默认页签为「工商概况」
        assert: "await expect(page.locator('.arco-drawer')).toContainText('工商概况'); await expect(page.locator('.arco-drawer .arco-tabs-tab-active')).toContainText('工商概况')"
      - note: 页签共十项齐全（清单见用例册附录A）
        assert: "const drawer = page.locator('.arco-drawer'); for (const t of ['工商概况','主要团队','资质荣誉','知识产权','经营财务','供应链关系','关系图谱','舆情动态','风险信息','招投标']) { await expect(drawer.getByRole('tab', { name: t })).toBeVisible(); }"
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: 抽屉断言限定 .arco-drawer 容器；页签字段深度归画像模块（Q010）不核。「查看画像」入口另条 P1-04；关闭保留查询态由 P1-04 备注口径承载（本轮实勘：关抽屉后结果态保留）。

  - id: P0-05
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00456
    priority: P0
    title: 综合竞争力说明卡可打开且业务可见区无内部编号泄漏
    story: US-E1-SCH-05
    entry_id: ent-search
    preconditions:
      - 已有非空结果列表
      - 抽屉已关闭（承接 P0-04 关闭后状态）
      - 内部评审模式关闭（否则指标卡字段形态不同，见 as_built_note）
    locators:
      spec_btn: 'button.metric-spec-card（aria-label「指标说明：综合竞争力得分」，长卡竞争力列 ⓘ）'
      spec_pop: '.arco-popover（含「综合竞争力得分」中文指标名）'
    steps:
      - action: click
        target: 结果卡综合竞争力旁的指标说明入口（button.metric-spec-card）
      - action: wait
        for: 说明卡弹出（popover 可见）
      - action: assert_visible
        target: 说明卡中文指标名
      - action: press
        key: Escape
      - action: wait
        for: 说明卡关闭
      - action: evaluate
        note: 检查结果列表可见文本不含缺口编号前缀字样（GAP-/Q0xx）
    expect:
      - note: 弹出含中文指标名的说明卡
        assert: "await expect(page.locator('.arco-popover').filter({ hasText: '综合竞争力得分' }).first()).toBeVisible()"
      - note: 关闭后结果列表可见文本不含缺口编号前缀字样
        assert: "const listText = await page.locator('.enterprise-result-list, [class*=result]').first().innerText().catch(() => ''); if (listText) { if (/GAP-|Q0\\d/.test(listText)) { throw new Error('结果列表泄漏缺口编号前缀: ' + listText.slice(0, 200)); } }"
    on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
    as_built_note: 实勘说明卡内含「指标ID M_ENT_COMPETITIVENESS_SCORE」与 pending_data_lead(Q014) 字样——属说明卡内部字段；预期 2 只核「关闭后结果列表可见文本」，不含卡内。评审关闭且无说明入口时记备注不升问题（门控预期）。
