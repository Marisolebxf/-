# 企业查询 · 金样脚本（仅 P0-01～P0-05，禁止改 id）
# 全量 P0/P1：同目录 scripts.yaml + coverage.md；执行提示词 prompts/.../full.md
system: KJZTFWXT
module: enterprise
function: search
entry_id: ent-search
base_url: "http://111.198.38.90:50892/"
route: /enterprise/enterprise-search
func_prefix: ZNFWJQ-KJZTFWXT-v1.0-FUNC
fixtures: ./fixtures/testdata.yaml
usm: agent-handoffs/产品整体定义/E1-企业查询/
legacy_table: qa/test-cases/KJZTFWXT/enterprise-企业分析/SEARCH-企业查询/FUNC-企业查询-用例.md

scripts:
  - id: P0-01
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00003
    priority: P0
    title: 登录后企业查询默认智能搜索，四层主视觉可见
    story: US-E1-SCH-03
    preconditions:
      - 可访问 base_url
      - 使用 fixtures 账号；若已在业务页且 URL 不含 /login 则跳过登录表单
    locators:
      login_user: { role: textbox, name: 请输入用户名 }
      login_pass: { role: textbox, name: 请输入密码 }
      login_btn: { role: button, name: 登录 }
      menu_group: { text: 企业分析 }
      menu_item: { text: 企业查询 }
      tab_smart: { role: tab, name: 智能搜索 }
      tab_company: { role: tab, name: 查企业 }
      tab_advanced: { role: tab, name: 高级筛选 }
      search_box: { role: textbox, name: 输入企业名、产业、资质、区域或专利关键词，自动关联多字段匹配企业 }
      search_btn: { role: button, name: 搜索 }
      examples: { text: 示例查询 }
      hot: { text: 热门场景 }
    steps:
      - { id: S1, action: goto, url: "/" }
      - { id: S2, action: login_if_needed }
      - { id: S3, action: click, target: menu_item, note: 若已在企业查询可跳过 }
      - { id: S4, action: snapshot, save: snapshot.yml }
      - { id: S5, action: screenshot, save: after-land.png }
    expect:
      - URL 含 /enterprise/enterprise-search
      - tab 智能搜索 为 selected
      - 搜索框与「搜索」按钮可见
      - 可见「示例查询」与「热门场景」，且二者为独立区块（不要求像素对齐）
      - 自上而下能看到：检索模式 → 搜索框 → 示例查询 → 热门场景
    allow_empty: false
    on_fail: 截图 + 抄 X-Trace-Id（若有网络 5xx）+ 分类 C1/C2

  - id: P0-02
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00004
    priority: P0
    title: 点击示例查询只回填关键词，不自动出检索结果
    story: US-E1-SCH-03
    depends_on: [P0-01]
    locators:
      example_ai: { role: button, name: 人工智能 }
      search_box: { role: textbox, name: 输入企业名、产业、资质、区域或专利关键词，自动关联多字段匹配企业 }
      result_heading: { text: 智能搜索结果 }
    steps:
      - { id: S1, action: click, target: example_ai }
      - { id: S2, action: wait, ms: 800 }
      - { id: S3, action: screenshot, save: after-example-click.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
    expect:
      - 搜索框值为「人工智能」
      - 页面仍停在引导态：可见「示例查询」或「输入关键词或选择热门场景后开始构造企业集合」
      - 不可见「智能搜索结果」标题（未点搜索前）
    allow_empty: false
    on_fail: 若示例点击后自动出现结果列表 → FAIL（产品口径：不自动提交）

  - id: P0-03
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00002
    priority: P0
    title: 智能搜索「人工智能」返回长卡片结果（结构断言）
    story: US-E1-SCH-02
    depends_on: [P0-02]
    testdata:
      keyword: 人工智能
    locators:
      search_btn: { role: button, name: 搜索 }
      result_heading: { text: 智能搜索结果 }
    steps:
      - { id: S1, action: click, target: search_btn }
      - { id: S2, action: wait, text: 智能搜索结果, timeout_s: 20 }
      - { id: S3, action: screenshot, save: after-search.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
    expect:
      - 可见「智能搜索结果」
      - 可见「命中 N 家企业」或等价条数文案（N 为数字，不钉死具体值）
      - 至少 1 张结果卡：有企业名称按钮、可见「在营」或其它经营状态文案
      - 卡片为横向信息结构（可见法定代表人/成立/注册资本等字段标签之一即可）
      - 不因「前三家名称必须含人工智能」判 Fail（智能搜索允许多字段命中；名称命中记入 note）
    allow_empty:
      - 若明确空态「没有符合条件」且非 5xx → 记 C3 并在 result.note 写空态，本金样标 Blocked-数据 而非产品 Fail
    on_fail: 5xx/白屏=C1；打到 demo-*=C1 D12

  - id: P0-04
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00011
    priority: P0
    title: 打开第一家企业画像抽屉不跳路由，十页签名称冒烟
    story: US-E1-SCH-05
    depends_on: [P0-03]
    locators:
      first_name: { role: button, note: 结果列表第一家企业名称，从 snapshot 取 }
      drawer_tabs:
        - 工商概况
        - 主要团队
        - 资质荣誉
        - 知识产权
        - 经营财务
        - 供应链关系
        - 关系图谱
        - 舆情动态
        - 风险信息
        - 招投标
    steps:
      - { id: S1, action: click, target: first_name }
      - { id: S2, action: wait, ms: 1500 }
      - { id: S3, action: screenshot, save: after-drawer.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
    expect:
      - URL 仍含 /enterprise/enterprise-search（不跳到 /enterprise/:orgId 整页，除非产品已改口径——若跳整页记 C4 停测）
      - 抽屉/面板出现企业头部（名称与列表一致）
      - 十个页签名在 DOM 或可点击列表中均存在（默认选中「工商概况」）
      - 页签内字段深度不作为本条 Fail
    allow_empty: false
    on_fail: 跳路由=本条 FAIL；缺页签名称=FAIL；页内无数不 Fail

  - id: P0-05
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00009
    priority: P0
    title: 结果卡综合竞争力有指标说明入口；业务可见区无 GAP-* 字样泄漏
    story: US-E1-SCH-05
    depends_on: [P0-03]
    note: |
      本环境 localStorage ent_review_mode 可能已为 true。
      评审开：必须能点开「指标说明：综合竞争力得分」（或等价 ⓘ）。
      无论开关：主列表可见文本不得出现 GAP- 前缀；点开说明卡允许出现 metric 字段。
    locators:
      metric_help: { role: button, name: 指标说明：综合竞争力得分 }
    steps:
      - { id: S0, action: press, key: Escape, note: 若 P0-04 抽屉仍开，先关掉，否则挡住列表上的指标说明 }
      - { id: S1, action: evaluate, note: 读 localStorage ent_review_mode }
      - { id: S2, action: assert_visible, target: metric_help }
      - { id: S3, action: click, target: metric_help }
      - { id: S4, action: wait, ms: 800 }
      - { id: S5, action: screenshot, save: after-metric-card.png }
      - { id: S6, action: snapshot, save: snapshot.yml }
    expect:
      - 存在「指标说明：综合竞争力得分」或名称含「综合竞争力」的说明按钮
      - 点击后出现说明浮层/卡片（含中文指标名即可，不核对八件套全文）
      - 结果列表可见纯文本不含「GAP-」
    allow_empty: false
    on_fail: 无 ⓘ 且评审模式为 true → C1；评审关闭且无 ⓘ → 记 note 不升 C1（门控预期）
