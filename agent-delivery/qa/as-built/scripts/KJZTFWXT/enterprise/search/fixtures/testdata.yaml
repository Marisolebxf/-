# P0-20 / FUNC-00480 访客形态（实勘 2026-10-15 p0-20-recon.json）
# 未登录深链回 login；可测访客 = 评审开态锁态菜单「访客只读 VISIT L0」（非匿名）
guest_persona:
  label: 访客只读
  requires_review_on: true
  note: 切 VISIT 后检索词若进最近检索 → D3-ENTSEARCH-GUEST-RECENT-PERSIST

# 级联分组点击口径（P5：分组标题节点 pointer-events:none，回退父容器）
cascade_group_note: 分组标题（如「全国热门科创城市」）不可直接点击，点击目标为其父级分组容器
