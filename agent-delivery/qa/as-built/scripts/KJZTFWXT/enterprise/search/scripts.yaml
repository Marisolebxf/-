# 企业查询全量脚本（includes 金样 5 条 + 其余 36 条 = 41 条）
# 蓝本 = 用例册 v2.0（ZNFWJQ-KJZTFWXT-v1.0-FUNC-00438~00480）；func_id 全部为新号段
# 执行顺序见 prompts/KJZTFWXT/enterprise/search/full.md
# 通用 locators（结果态，实勘 2026-10-13）：
#   结果标题「智能搜索结果 · 命中 N 家企业」；长卡（企业名 button / 查看画像 / 引育候选 / 加入对比 / 行复选框）
#   工具区：导出当前结果 | 当前条件 chips | 结果内筛选（经营状态/企业规模/资质标签）| 排序 select | 选择区域级联
#   分页 .arco-pagination（共 N 条）；批量条「已选 N 家企业」+ 加入对比
#   抽屉 .arco-drawer 十页签；指标说明 button.metric-spec-card；对比篮浮层（系统级，Shell 角标）

includes: [gold.yaml]

scripts:
  # ========== 结果态连续组（P0-03 结果态直接复用） ==========
  - id: P0-06
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00444
    priority: P0
    title: 点击热门场景后切换高级筛选并立即得到结果
    story: US-E1-SCH-03
    entry_id: ent-search
    preconditions: [初始态可见热门场景]
    locators:
      hot_chip: 'button 深圳高新技术企业（热门场景行，任一）'
      adv_mode: 'tab 高级筛选（切后应选中）'
      result_title: '「高级筛选结果 · 命中 N 家企业」'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: click
        target: 热门场景任一 chip
      - action: wait
        for: 高级筛选结果标题或明确空态
    expect:
      - note: 页面切换为高级筛选且出现该场景条件摘要
        assert: "await expect(page.getByRole('tab', { name: '高级筛选' })).toHaveAttribute('aria-selected', 'true'); await expect(page.getByText('当前条件').first()).toBeVisible({ timeout: 8000 })"
      - note: 结果标题为高级筛选结果且含命中条数或明确空态
        assert: "const hasAdvResult = await page.getByText('高级筛选结果').count() > 0; if (hasAdvResult) { await expect(page.getByText(/命中 \\d+ 家企业/).first()).toBeVisible({ timeout: 8000 }); } else { await expect(page.getByText('未命中结果，可调整条件或切换高级筛选')).toBeVisible({ timeout: 8000 }); }"
      - note: 高级筛选页无蓝色搜索主视觉
        assert: "await expect(page.getByRole('button', { name: '搜索', exact: true })).toHaveCount(0)"
    allow_skip: 明确空态记 Pass-N/A（数据阻塞）
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: as-built 差异：点击立即检索，不待应用。场景条件摘要字段值 observed 记录。查企业下热门另条 P1-07。

  - id: P0-07
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00441
    priority: P0
    title: 查企业按名称关键词检索得到长卡片结果
    story: US-E1-SCH-01
    entry_id: ent-search
    preconditions: [已进入企业查询]
    locators:
      company_tab: 'tab 查企业'
      search_input: 'textbox（查企业模式占位指向企业名称）'
      result_title: '「查企业结果 · 命中 N 家企业」'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: click
        target: tab 查企业
      - action: fill
        target: 搜索框
        value: 科技
      - action: click
        target: 搜索
      - action: wait
        for: 查企业结果标题
    expect:
      - note: 搜索框占位提示指向企业名称关键词
        assert: "await expect(page.getByPlaceholder(/企业名称|企业名/).first()).toBeVisible({ timeout: 8000 })"
      - note: 结果标题为查企业结果且含命中条数
        assert: "await expect(page.getByText('查企业结果')).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/命中 \\d+ 家企业/).first()).toBeVisible({ timeout: 8000 })"
      - note: 至少一张横向长卡片含「查看画像」动作
        assert: "await expect(page.getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 8000 })"
    allow_skip: 明确空态记 Pass-N/A
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 命中条数不钉死；名称不含关键词不判（允许模糊）。热门企业 chip 另条 P1-13。

  - id: P0-08
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00449
    priority: P0
    title: 点击最近检索记录可恢复该次查询结果
    story: US-E1-SCH-03
    entry_id: ent-search
    preconditions: [已登录, 已执行过至少一次普通查询]
    locators:
      recent_row: '.enterprise-search-history-row（最近检索行）'
      recent_chip: '最近检索行内 chip button（如「人工智能」）'
      result_title: '「智能搜索结果 · 命中 N 家企业」'
      plan_entry_smart: '智能搜索区「查询方案」入口（应无）'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: fill
        target: 搜索框
        value: 人工智能
      - action: click
        target: 搜索
      - action: wait
        for: 结果标题出现
    expect:
      - note: 页面再次呈现该次检索的结果标题与命中条数
        assert: "await expect(page.getByText('智能搜索结果')).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/命中 \\d+ 家企业/).first()).toBeVisible({ timeout: 8000 })"
      - note: 智能搜索与查企业区无「查询方案」入口
        assert: "await expect(page.getByRole('button', { name: '使用查询方案' })).toHaveCount(0); await expect(page.getByRole('button', { name: '保存为查询方案' })).toHaveCount(0)"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 恢复直出结果（零额外操作）。最近记录清单内容 observed 记录。清空动作另条 P1-21；访客口径 00480 未脚本化。

  - id: P0-09
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00445
    priority: P0
    title: 高级筛选字段库与底部 Footer 构成齐备
    story: US-E1-SCH-04
    entry_id: ent-search
    preconditions: [已进入企业查询]
    locators:
      adv_tab: 'tab 高级筛选'
      field_lib: '字段库标签（企业所属地区/经营状态/企业规模/资质标签 等）'
      footer: '底边 Footer（保存为查询方案/使用查询方案/清空条件/应用筛选）'
      apply_btn: 'button 应用筛选'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: click
        target: tab 高级筛选
      - action: assert_visible
        target: 字段库区域
      - action: evaluate
        note: 无条件时点应用筛选，记录禁用/无结果两种形态之一
    expect:
      - note: 字段库呈现「企业所属地区」「经营状态」等字段标签
        assert: "await expect(page.locator('main').getByText(/企业所属地区/).first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('main').getByText(/经营状态/).first()).toBeVisible({ timeout: 8000 })"
      - note: Footer 含「保存为查询方案」「使用查询方案」「清空条件」「应用筛选」
        assert: "await expect(page.getByRole('button', { name: '保存为查询方案' })).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: '使用查询方案' })).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: '清空条件' })).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /应用筛选/ })).toBeVisible({ timeout: 8000 })"
      - note: 无条件时「应用筛选」为禁用或点击无结果
        assert: "const applyBtn = page.getByRole('button', { name: /应用筛选/ }).first(); const disabled = await applyBtn.isDisabled(); if (!disabled) { await applyBtn.click({ timeout: 8000 }); await page.waitForTimeout(1500); }"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 无条件应用两种现场形态均判通过（observed 记录）；字段库全量清单 observed 记录；收起展开 P1-17、编辑回字段库 P1-18。

  - id: P0-10
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00446
    priority: P0
    title: 高级筛选条件可逐项叠加并应用出结果
    story: US-E1-SCH-04
    entry_id: ent-search
    preconditions: [已进入高级筛选字段库]
    locators:
      field_region: '字段「企业所属地区」'
      region_picker: '地区级联选择器（省级节点）'
      field_status: '字段「经营状态」'
      status_opt: '经营状态选项（如 在营）'
      apply_btn: 'button 应用筛选'
      cond_count: '已选条件计数'
    steps:
      - action: goto
        target: /enterprise/enterprise-search?mode=advanced
      - action: click
        target: 字段 企业所属地区
      - action: select_option
        target: 地区选择器
        value: 任一省级节点
      - action: click
        target: 字段 经营状态
      - action: select_option
        target: 经营状态
        value: 在营
      - action: click
        target: 应用筛选
      - action: wait
        for: 高级筛选结果标题
    expect:
      - note: 应用前可见已选条件计数
        assert: "const mt10 = await page.locator('main').innerText(); if (!/已选 \\d+/.test(mt10)) throw new Error('已选条件计数未出现(文本级)')"
      - note: 应用后结果标题为高级筛选结果且含命中条数或明确空态
        assert: "const hasAdvResult = await page.getByText('高级筛选结果').count() > 0; if (hasAdvResult) { await expect(page.getByText(/命中 \\d+ 家企业/).first()).toBeVisible({ timeout: 8000 }); } else { await expect(page.getByText('未命中结果，可调整条件或切换高级筛选')).toBeVisible({ timeout: 8000 }); }"
      - note: 当前条件区含所设条件之一
        assert: "const condText = await page.getByText('当前条件').first().innerText().catch(() => page.locator('body').innerText()); if (!condText.includes('企业所属地区') && !condText.includes('经营状态')) { throw new Error('当前条件区未见所设条件'); }"
    allow_skip: 明确空态记 Pass-N/A
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 无条件组嵌套编辑器（Q036 裁剪不判不通过）。命中条数不钉死。

  - id: P0-11
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00447
    priority: P0
    title: 「企业所属地区」为全国省市区级联非死写深圳
    story: US-E1-SCH-04
    entry_id: ent-search
    preconditions: [已进入高级筛选字段库]
    locators:
      field_region: '字段「企业所属地区」'
      region_tree: '地区树/级联（省级选项列表）'
    steps:
      - action: goto
        target: /enterprise/enterprise-search?mode=advanced
      - action: click
        target: 字段 企业所属地区
      - action: wait
        for: 地区选择器展开
      - action: snapshot
        target: 地区选项列表
    expect:
      - note: 选项含至少两个省级名称
        assert: "const panel = page.locator('.arco-cascader-panel, .arco-cascader-panel-column, .arco-trigger-popup:visible .arco-cascader-list, .arco-select-popup:visible').first(); const opts = await panel.innerText(); const provinces = ['北京','上海','天津','重庆','河北','山西','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','海南','四川','贵州','云南','陕西','甘肃','青海','广西','西藏','宁夏','新疆','内蒙古']; if (provinces.filter(p => opts.includes(p)).length < 2) { throw new Error('省级选项不足两个: ' + opts.slice(0, 300)); }"
      - note: 非仅深圳区县作为唯一一层
        assert: "const panelText = await page.locator('.arco-cascader-panel, .arco-cascader-panel-column').first().innerText(); const provinces = ['广东省','江苏省','浙江省','山东省','四川省']; if (!provinces.some(p => panelText.includes(p))) { throw new Error('地区选择器未见省级节点（疑仅深圳区县一层）'); }"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 省市区级数与全量清单 observed 记录（Q037）。

  - id: P0-12
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00448
    priority: P0
    title: 查询方案仅保存高筛条件使用后可恢复
    story: US-E1-SCH-04
    entry_id: ent-search
    preconditions: [高级筛选已构造若干条件（承接 P0-10）]
    locators:
      save_plan: 'button 保存为查询方案'
      save_modal: '保存弹层（标题含「保存筛选模板」）'
      name_input: '弹层名称输入框'
      confirm_btn: 'button 确定'
      clear_btn: 'button 清空条件'
      use_plan: 'button 使用查询方案'
      plan_item: '方案列表项（qa-r2-1013）'
    steps:
      - action: goto
        target: /enterprise/enterprise-search?mode=advanced
      - action: evaluate
        note: 构造任一条件（如经营状态=在营）
      - action: click
        target: 保存为查询方案
      - action: fill
        target: 弹层名称输入框
        value: qa-r2-1013
      - action: click
        target: 确定
      - action: click
        target: 清空条件
      - action: click
        target: 使用查询方案
      - action: click
        target: 方案 qa-r2-1013
      - action: wait
        for: 条件恢复或结果直出
    expect:
      - note: 方案可保存并命名
        assert: "await page.locator('.arco-modal:visible, [role=dialog]:visible').first().waitFor({ state: 'visible', timeout: 8000 }); await expect(page.locator('.arco-modal:visible, [role=dialog]:visible').first()).toContainText(/保存|方案/); await expect(page.getByRole('button', { name: '确定' }).first()).toBeVisible({ timeout: 8000 })"
      - note: 使用后条件恢复为可识别状态（已选条件大于 0 或直接进入高级筛选结果）
        assert: "const hasCount = await page.getByText(/已选\\s*[1-9]\\d*\\s*(个条件|家企业)/).first().isVisible().catch(() => false); const hasResult = await page.locator('main').getByText(/智能搜索结果|高级筛选|命中/).first().isVisible().catch(() => false); if (!hasCount && !hasResult) { throw new Error('使用方案后既无已选条件计数也无高级筛选结果'); }"
      - note: 恢复内容不含关键词与企业名单
        manual: true
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: as-built 差异：使用方案直接应用可立即出结果。保存弹层标题含「保存筛选模板」。方案命名上限 observed 记录。

  - id: P0-13
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00450
    priority: P0
    title: 结果区四类排序均可切换
    story: US-E1-SCH-05
    entry_id: ent-search
    preconditions: [已有非空结果列表]
    locators:
      sort_select: '排序 select（默认 综合竞争力优先）'
      sort_options: '下拉选项：综合竞争力优先/有效专利数/最新营收/成立时间'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: fill
        target: 搜索框
        value: 人工智能
      - action: click
        target: 搜索
      - action: wait
        for: 结果标题出现
      - action: evaluate
        note: 处于结果态（智能搜索「人工智能」或最近检索恢复）
      - action: click
        target: 排序下拉
      - action: assert_visible
        target: 四类排序选项
      - action: click
        target: 排序下拉
      - action: click
        target: 任一产业选项（默认有效专利数）
      - action: wait
        for: 列表刷新
      - action: select_option
        target: 排序
        value: 最新营收
      - action: select_option
        target: 排序
        value: 成立时间
      - action: click
        target: 排序下拉
      - action: click
        target: 默认（综合竞争力优先）
    expect:
      - note: 排序选项含综合竞争力优先、有效专利数、最新营收、成立时间四类
        assert: "const sortSel = page.locator('.arco-select-view').filter({ hasText: '综合竞争力优先' }).first(); await sortSel.click({ timeout: 8000 }); await page.waitForTimeout(700); const opts = await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').allInnerTexts(); await page.keyboard.press('Escape'); for (const opt of ['综合竞争力优先', '有效专利数', '最新营收', '成立时间']) { if (!opts.some((o) => o.trim() === opt)) throw new Error('缺少排序选项: ' + opt); }"
      - note: 每次切换后仍可见结果列表或明确空态
        assert: "const listOrEmpty = await page.getByText(/命中 \\d+ 家企业|未命中结果，可调整条件或切换高级筛选/).first().isVisible(); if (!listOrEmpty) { throw new Error('切换排序后既无结果列表也无空态'); }"
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 排序数值严格单调性不核（observed 记录首卡名）。说明卡 P0-05；仅长卡形态 P1-20；排序方向 P1-23。

  - id: P0-14
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00458
    priority: P0
    title: 结果内再筛可施加、收窄且可清除恢复
    story: US-E1-SCH-05
    entry_id: ent-search
    preconditions: [已有非空结果列表]
    locators:
      refine_status: '结果内筛选 经营状态 select'
      refine_opt: '选项（如 吊销）'
      refine_chip: '当前条件 chip（可关闭）'
    steps:
      - action: goto
        target: /enterprise/enterprise-search
      - action: fill
        target: 搜索框
        value: 人工智能
      - action: click
        target: 搜索
      - action: wait
        for: 结果标题出现
      - action: evaluate
        note: 处于结果态
      - action: click
        target: 结果内筛选 经营状态
      - action: select_option
        target: 经营状态
        value: 任一非默认选项
      - action: wait
        for: 列表更新（结果态保持）
      - action: snapshot
        note: 记录再筛前后条数（observed）
      - action: click
        target: 清除该再筛条件（chip 关闭）
      - action: wait
        for: 列表恢复
    expect:
      - note: 施加后列表仍处结果态且条数变化可解释
        assert: "await page.waitForTimeout(800); const ok1 = await page.getByText(/命中 \\d+ 家企业/).first().isVisible().catch(() => false); const ok2 = await page.getByText(/未命中|无匹配/).first().isVisible().catch(() => false); if (!ok1 && !ok2) throw new Error('再筛后既无命中数也无未命中反馈');"
      - note: 清除后结果恢复再筛前范围
        assert: "await page.waitForTimeout(800); const ok1 = await page.getByText(/命中 \\d+ 家企业/).first().isVisible().catch(() => false); const ok2 = await page.getByText(/未命中|无匹配/).first().isVisible().catch(() => false); if (!ok1 && !ok2) throw new Error('再筛后既无命中数也无未命中反馈');; await expect(page.getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 8000 })"
    allow_skip: 再筛收不到 0 记 Pass-N/A（数据不足）
    on_fail: 截图 + X-Trace-Id + C1~C6
    as_built_note: 工具条含经营状态、企业规模、资质标签等再筛控件（构成顺带核对）。条数变化 observed 记录。局部空态另条 P1-09。

  - id: P0-15
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00462
    priority: P0
