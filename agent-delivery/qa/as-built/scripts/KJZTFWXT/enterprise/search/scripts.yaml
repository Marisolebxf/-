# 企业查询 · P0/P1 全量（正向）
# P0-01～P0-05 以 gold.yaml 为准，禁止改那些 id。
system: KJZTFWXT
module: enterprise
function: search
entry_id: ent-search
base_url: "http://111.198.38.90:50892/"
route: /enterprise/enterprise-search
func_prefix: ZNFWJQ-KJZTFWXT-v1.0-FUNC
fixtures: ./fixtures/testdata.yaml
usm: agent-handoffs/产品整体定义/E1-企业查询/
legacy_table: qa/test-cases/KJZTFWXT/SEARCH/FUNC-企业查询-用例.md
coverage: ./coverage.md
includes:
  - gold.yaml

shared_locators: &hub
  menu_item: { text: 企业查询 }
  tab_smart: { role: tab, name: 智能搜索 }
  tab_company: { role: tab, name: 查企业 }
  tab_advanced: { role: tab, name: 高级筛选 }
  search_btn: { role: button, name: 搜索 }
  smart_box: { role: textbox, name: 输入企业名、产业、资质、区域或专利关键词，自动关联多字段匹配企业 }
  company_box: { role: textbox, name: 输入企业名称关键词 }
  examples: { text: 示例查询 }
  hot: { text: 热门场景 }
  recent: { text: 最近检索 }
  recommend: { text: 推荐企业 }
  result_smart: { text: 智能搜索结果 }
  result_company: { text: 查企业结果 }
  result_advanced: { text: 高级筛选结果 }
  hit: { text: 命中 }
  view_profile: { role: button, name: 查看画像 }
  compare_basket: { role: button, name: 打开对比篮 }
  apply_filter: { role: button, name: /应用筛选/ }
  save_plan: { role: button, name: 保存为查询方案 }
  use_plan: { role: button, name: 使用查询方案 }
  clear_dsl: { role: button, name: 清空条件 }
  edit_advanced: { role: button, name: /编辑高级筛选/ }
  export_current: { role: button, name: 导出当前结果 }
  field_lib: { role: region, name: 高级筛选字段库 }
  region_field: { text: 企业所属地区 }
  region_placeholder: { text: 请选择所属地区 }
  region_toolbar: { role: combobox, name: 选择区域 }
  empty_guide: { text: 输入关键词或选择热门场景后开始构造企业集合 }
  empty_miss: { text: 未命中结果，可调整条件或切换高级筛选 }

scripts:
  # ── P0 其余正向 ──────────────────────────────────────────
  - id: P0-06
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00005
    priority: P0
    title: 点击热门场景进入高级筛选并带出结果
    story: US-E1-SCH-03
    depends_on: [P0-01]
    as_built_note: |
      applyScene：mode=advanced、立刻 hasSubmittedSearch 并检索，filterOpen=false。
      旧表「待应用、不直接出结果」不作 Fail。
    locators:
      <<: *hub
      hot_chip: { role: button, note: 热门场景区任一 chip，优先 fixtures.hot_scene_preferred }
    steps:
      - { id: S0, action: goto, url: "/enterprise/enterprise-search", note: 回到初始，避免沿用智能搜索结果态 }
      - { id: S1, action: click, target: hot_chip }
      - { id: S2, action: wait, text: 高级筛选结果, timeout_s: 20 }
      - { id: S3, action: screenshot, save: after-hot-scene.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
    expect:
      - tab「高级筛选」为 selected，或可见「高级筛选结果」
      - 可见「命中 N 家企业」（N 为数字）或明确空态「未命中结果」
      - 当前条件区出现与所选场景相关的条件摘要（不必钉死场景全名以外的字段值）
    allow_empty:
      - 明确空态且非 5xx → Blocked-数据，不升产品 Fail
    on_fail: 仍停在智能搜索引导且无条件/无结果 → FAIL；5xx=C1

  - id: P0-07
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00001
    priority: P0
    title: 查企业按名称关键词搜索，得到长卡片
    story: US-E1-SCH-01
    depends_on: [P0-01]
    testdata:
      keyword: 人工智能
    locators:
      <<: *hub
    steps:
      - { id: S0, action: goto, url: "/enterprise/enterprise-search" }
      - { id: S1, action: click, target: tab_company }
      - { id: S2, action: assert_visible, target: company_box }
      - { id: S3, action: fill, target: company_box, value: 人工智能 }
      - { id: S4, action: click, target: search_btn }
      - { id: S5, action: wait, text: 查企业结果, timeout_s: 20 }
      - { id: S6, action: screenshot, save: after-keyword.png }
      - { id: S7, action: snapshot, save: snapshot.yml }
    expect:
      - 搜索框占位/name 为「输入企业名称关键词」
      - 可见「查企业结果」与「命中 N 家企业」
      - 至少 1 张横向长卡片：企业名称按钮 + 法定代表人/成立/注册资本/区县 之一
      - 可见「查看画像」；不因名称必须含关键词判 Fail
    allow_empty:
      - 明确空态且非 5xx → Blocked-数据
    on_fail: 仍用智能搜索占位文案=FAIL；5xx=C1

  - id: P0-08
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00030
    priority: P0
    title: 最近检索可恢复刚才的智能搜索
    story: US-E1-SCH-03
    depends_on: [P0-03]
    locators:
      <<: *hub
      recent_ai: { role: button, name: /人工智能/, note: 最近检索标签，文案含关键词即可 }
    steps:
      - { id: S1, action: click, target: recent, note: 仅滚到可见；若已可见则跳过 }
      - { id: S2, action: snapshot, save: before-restore.yml }
      - { id: S3, action: click, target: recent_ai }
      - { id: S4, action: wait, text: 智能搜索结果, timeout_s: 20 }
      - { id: S5, action: screenshot, save: after-recent.png }
    expect:
      - 最近检索区可见含「人工智能」的记录（或当前模式最近记录）
      - 点击后再次出现结果标题与命中条数
      - 智能搜索/查企业 Hub 区不可见「保存为查询方案」（方案只在高筛）
    allow_empty: false
    on_fail: 搜过仍「暂无最近记录」=FAIL（登录态）

  - id: P0-09
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00007
    priority: P0
    title: 切换高级筛选后字段库与 Footer 可见
    story: US-E1-SCH-04
    depends_on: [P0-01]
    locators:
      <<: *hub
    steps:
      - { id: S0, action: goto, url: "/enterprise/enterprise-search" }
      - { id: S1, action: click, target: tab_advanced }
      - { id: S2, action: wait, text: 高级筛选, timeout_s: 10 }
      - { id: S3, action: screenshot, save: advanced-library.png }
      - { id: S4, action: snapshot, save: snapshot.yml }
    expect:
      - 可见标题「高级筛选 · 字段库」或 aria「高级筛选字段库」
      - 可见字段「企业所属地区」「经营状态」等（至少 2 个字段标签可点）
      - Footer 可见「保存为查询方案」「使用查询方案」「清空条件」「应用筛选」
      - 无条件时「应用筛选」禁用或点击无结果亦可（记 note）
      - 高筛页不要求蓝色示例/热门四层主视觉
    allow_empty: false
    on_fail: 切 Tab 无字段库=FAIL

  - id: P0-10
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00007
    priority: P0
    title: 叠加地区与经营状态后应用筛选出结果
    story: US-E1-SCH-04
    depends_on: [P0-09]
    locators:
      <<: *hub
      add_region: { text: 企业所属地区, note: 左侧字段库标签 }
      add_status: { text: 经营状态 }
      region_select: { text: 请选择所属地区 }
    steps:
      - { id: S1, action: click, target: add_region }
      - { id: S2, action: click, target: region_select }
      - { id: S3, action: click, target: { text: 广东省 }, note: 若无广东则点任一省级节点 }
      - { id: S4, action: press, key: Escape, note: 收起树，避免挡字段库 }
      - { id: S5, action: click, target: add_status }
      - { id: S6, action: click, target: { text: 在营 }, note: 条件行里的选项 }
      - { id: S7, action: click, target: apply_filter }
      - { id: S8, action: wait, text: 高级筛选结果, timeout_s: 20 }
      - { id: S9, action: screenshot, save: after-apply.png }
      - { id: S10, action: snapshot, save: snapshot.yml }
    expect:
      - 应用前可见「已选 N 个条件」且 N≥1
      - 应用后可见「高级筛选结果」与命中条数或明确空态
      - 「当前条件」可读（含地区或经营状态之一）
      - 不强制出现任意嵌套 AND/OR 分组编辑器（Q036）
    allow_empty:
      - 明确空态 → Blocked-数据
    on_fail: 点应用无反馈/白屏=C1

  - id: P0-11
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00036
    priority: P0
    title: 企业所属地区为全国级联，非仅深圳区县
    story: US-E1-SCH-04
    depends_on: [P0-09]
    locators:
      <<: *hub
      add_region: { text: 企业所属地区 }
      region_select: { text: 请选择所属地区 }
    steps:
      - { id: S0, action: goto, url: "/enterprise/enterprise-search" }
      - { id: S1, action: click, target: tab_advanced }
      - { id: S2, action: click, target: add_region }
      - { id: S3, action: click, target: region_select }
      - { id: S4, action: wait, ms: 1500 }
      - { id: S5, action: snapshot, save: region-tree.yml }
      - { id: S6, action: screenshot, save: region-tree.png }
    expect:
      - 下拉/级联中出现至少 2 个省级名称（如北京/广东/浙江/上海之一组）
      - 不是只有深圳区县（南山/福田等）作为唯一一层
    allow_empty: false
    on_fail: 树加载失败/只有深圳=FAIL 或 C1 视 Network

  - id: P0-12
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00034
    priority: P0
    title: 保存为查询方案后可再使用
    story: US-E1-SCH-04
    depends_on: [P0-10]
    as_built_note: |
      使用方案会直接 apply，可能立刻出结果。不强制「必须再点应用」。
    testdata:
      plan_name: as-built-qa-ent-search
    locators:
      <<: *hub
      plan_input: { role: textbox, name: 模板名称 }
      modal_ok: { role: button, name: 确定 }
    steps:
      - { id: S1, action: click, target: save_plan }
      - { id: S2, action: fill, target: plan_input, value: as-built-qa-ent-search }
      - { id: S3, action: click, target: modal_ok }
      - { id: S4, action: wait, ms: 800 }
      - { id: S5, action: click, target: clear_dsl }
      - { id: S6, action: click, target: use_plan }
      - { id: S7, action: click, target: { text: as-built-qa-ent-search } }
      - { id: S8, action: screenshot, save: after-plan.png }
      - { id: S9, action: snapshot, save: snapshot.yml }
    expect:
      - 保存弹层标题含「保存筛选模板」
      - 使用后条件回到可识别状态（已选条件>0 或直接「高级筛选结果」）
      - 不把智能搜索关键词当作方案内容恢复
    allow_empty: false
    on_fail: 保存按钮一直禁用且已有条件=FAIL

  - id: P0-13
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00009
    priority: P0
    title: 结果区四类排序均可切换
    story: US-E1-SCH-05
    depends_on: [P0-03]
    locators:
      sort: { role: combobox, name: /排序/ }
    steps:
      - { id: S0, action: press, key: Escape, note: 关掉抽屉 }
      - { id: S1, action: click, target: sort }
      - { id: S2, action: click, target: { text: 有效专利数 } }
      - { id: S3, action: wait, ms: 1500 }
      - { id: S4, action: click, target: sort }
      - { id: S5, action: click, target: { text: 最新营收 } }
      - { id: S6, action: wait, ms: 1500 }
      - { id: S7, action: click, target: sort }
      - { id: S8, action: click, target: { text: 成立时间 } }
      - { id: S9, action: wait, ms: 1500 }
      - { id: S10, action: click, target: sort }
      - { id: S11, action: click, target: { text: 综合竞争力优先 } }
      - { id: S12, action: screenshot, save: after-sorts.png }
    expect:
      - 排序选项含：综合竞争力优先、有效专利数、最新营收、成立时间
      - 每次切换后仍可见结果列表或明确空态，不白屏
      - 不核对排序数值是否严格单调
    allow_empty: false
    on_fail: 缺某一排序项=FAIL

  - id: P0-14
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00037
    priority: P0
    title: 结果内再筛可改变列表且可放宽
    story: US-E1-SCH-05
    depends_on: [P0-03]
    locators:
      status_refine: { role: combobox, name: 经营状态 }
    steps:
      - { id: S1, action: click, target: status_refine }
      - { id: S2, action: click, target: { text: 在营 } }
      - { id: S3, action: press, key: Escape }
      - { id: S4, action: wait, ms: 1200 }
      - { id: S5, action: screenshot, save: after-refine.png }
      - { id: S6, action: click, target: status_refine, note: 再打开后清除已选项（点已选 tag 关闭或清空） }
      - { id: S7, action: wait, ms: 1200 }
      - { id: S8, action: snapshot, save: snapshot.yml }
    expect:
      - 工具条可见「经营状态」「企业规模」「资质标签」占位之一
      - 施加再筛后列表仍在结果态（条数变化记 note，不钉死）
      - 清除后再筛后页面不卡死
    allow_empty: false
    on_fail: 无再筛控件=FAIL

  - id: P0-15
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00010
    priority: P0
    title: 命中超过一页时可翻到第 2 页
    story: US-E1-SCH-05
    depends_on: [P0-03]
    locators:
      page2: { role: listitem, name: "2", note: 分页「2」；或 button name=2 }
    steps:
      - { id: S1, action: evaluate, note: 从「命中 N 家企业」解析 N }
      - { id: S2, action: click, target: page2 }
      - { id: S3, action: wait, ms: 1500 }
      - { id: S4, action: screenshot, save: page-2.png }
    expect:
      - 分页区可见（Arco show-total）
      - 若 N>9：点第 2 页后仍有卡片，URL 仍含 enterprise-search
      - 不跨页记住勾选（本条不测勾选）
    allow_skip:
      - N≤9 → Pass-N/A，不 Fail
    on_fail: N>9 但无法翻页=FAIL

  - id: P0-16
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00010
    priority: P0
    title: 勾选本页至少两家后批量加入对比
    story: US-E1-SCH-05
    depends_on: [P0-03]
    as_built_note: 无「全选本页」按钮时逐项勾选复选框（aria-label 选择{企业名}）。
    locators:
      bulk_compare: { role: button, name: 加入对比 }
    steps:
      - { id: S1, action: click, target: { role: checkbox, note: 第一张卡复选框 } }
      - { id: S2, action: click, target: { role: checkbox, note: 第二张卡复选框 } }
      - { id: S3, action: assert_visible, target: { text: 已选 } }
      - { id: S4, action: click, target: bulk_compare }
      - { id: S5, action: wait, ms: 800 }
      - { id: S6, action: screenshot, save: after-bulk-compare.png }
    expect:
      - 勾选后出现「已选 N 家企业」条
      - 批量「加入对比」可点
      - 「打开对比篮」角标数字 ≥1（或不小于勾选数，去重后可更少）
    allow_empty: false
    on_fail: 无法勾选=FAIL

  - id: P0-17
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00045
    priority: P0
    title: 检索/地区请求走专题 Java 门面，不打 demo-*
    story: US-E1-SCH-04
    depends_on: [P0-03]
    steps:
      - { id: S1, action: network_assert, note: 汇总本页会话中 XHR/fetch }
      - { id: S2, action: screenshot, save: unused.png, note: 无 UI 变化可省略，保留 network.json }
    expect:
      - 存在 URL 含 `/topic` 或网关前缀的检索/元数据请求
      - 请求 Host/路径不含 demo-svc-platform / demo-algo / demo-svc-topic
      - 不出现整页白屏；若有错误 Alert 则文案可读
    allow_empty: false
    on_fail: 打到 demo-*=C1 D12；全 5xx=C1

  - id: P0-18
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00003
    priority: P0
    title: 三个检索 Tab 正向切换，各模式主区正确
    story: US-E1-SCH-03
    depends_on: [P0-01]
    locators:
      <<: *hub
    steps:
      - { id: S0, action: goto, url: "/enterprise/enterprise-search" }
      - { id: S1, action: click, target: tab_company }
      - { id: S2, action: assert_visible, target: company_box }
      - { id: S3, action: click, target: tab_advanced }
      - { id: S4, action: assert_visible, target: field_lib }
      - { id: S5, action: click, target: tab_smart }
      - { id: S6, action: assert_visible, target: smart_box }
      - { id: S7, action: screenshot, save: tabs.png }
    expect:
      - 查企业：占位「输入企业名称关键词」+「搜索」
      - 高级筛选：字段库，无智能搜索大输入框（page 变体）
      - 回到智能搜索：长占位文案 + 示例查询/热门场景可再现
    allow_empty: false
    on_fail: Tab 点不动或模式串台=FAIL

  # ── P1 正向 ─────────────────────────────────────────────
  - id: P1-01
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00006
    priority: P1
    title: 初始态展示推荐企业，动作仅查看画像/加入对比篮
    story: US-E1-SCH-08
    depends_on: [P0-01]
    locators:
      <<: *hub
    steps:
      - { id: S0, action: goto, url: "/enterprise/enterprise-search" }
      - { id: S1, action: wait, text: 推荐企业, timeout_s: 15 }
      - { id: S2, action: screenshot, save: recommend.png }
      - { id: S3, action: snapshot, save: snapshot.yml }
    expect:
      - 可见「推荐企业」分区与至少 1 张卡（名称按钮）
      - 卡上可见「查看画像」；对比动作为「加入对比篮」或「已在对比篮」
      - 不可见「以此查询」
      - 业务可见区无「Top30」机制长文案（评审开启时机制行允许存在，见 P1-02）
    allow_empty:
      - 推荐接口空且出现引导空态文案 → Blocked-数据
    on_fail: 初始态直接结果列表且无推荐、无引导空态=FAIL

  - id: P1-02
    func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00044
    priority: P1
    title: 推荐卡有单企理由；机制说明随评审开关
    story: US-E1-SCH-08
    depends_on: [P1-01]
    locators:
      review_switch: { role: switch, name: 内部评审模式 }
      persona: { role: button, note: 顶栏人设，aria-haspopup=menu }
    steps:
      - { id: S1, action: evaluate, note: 读 localStorage ent_review_mode }
      - { id: S2, action: snapshot, save: rec-review.yml }
      - { id: S3, action: click, target: persona }
      - { id: S4, action: click, target: review_switch, note: 若已开则先关再观察，再开 }
      - { id: S5, action: screenshot, save: rec-review.png }
    expect:
