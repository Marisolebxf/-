id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00444
priority: P0
title: 点击热门场景后切换高级筛选并立即得到结果
story: US-E1-SCH-03
entry_id: ent-search
preconditions:
- 初始态可见热门场景
locators:
  hot_chip: button 深圳高新技术企业（热门场景行，任一）
  adv_mode: tab 高级筛选（切后应选中）
  result_title: 「高级筛选结果 · 命中 N 家企业」
steps:
- action: goto
  target: /enterprise/enterprise-search
- action: click
  target: 热门场景任一 chip
- action: wait
  for: 高级筛选结果标题或明确空态
expect:
- note: 页面切换为高级筛选且出现该场景条件摘要
  assert: |-
    await expect(page.getByRole('tab', { name: '高级筛选' })).toHaveAttribute('aria-selected', 'true'); await expect(page.getByText('当前条件').first()).toBeVisible({ timeout: 8000 })
- note: 结果标题为高级筛选结果且含命中条数或明确空态
  assert: |-
    const hasAdvResult = await page.getByText('高级筛选结果').count() > 0; if (hasAdvResult) { await expect(page.getByText(/命中 \d+ 家企业/).first()).toBeVisible({ timeout: 8000 }); } else { await expect(page.getByText('未命中结果，可调整条件或切换高级筛选')).toBeVisible({ timeout: 8000 }); }
- note: 高级筛选页无蓝色搜索主视觉
  assert: 'await expect(page.getByRole(''button'', { name: ''搜索'', exact: true })).toHaveCount(0)'
allow_skip: 明确空态记 Pass-N/A（数据阻塞）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: as-built 差异：点击立即检索，不待应用。场景条件摘要字段值 observed 记录。查企业下热门另条 P1-07。
tier: B
