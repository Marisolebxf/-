id: P0-16
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00457
priority: P0
title: 勾选多家企业后出现已选条且可批量加入对比
story: US-E1-SCH-05
entry_id: ent-search
preconditions:
- 结果列表不少于 2 条
locators:
  row_checkbox: 长卡行复选框
  batch_bar: 「已选 N 家企业」+ 加入对比 button
  basket_badge: 对比篮角标（数量）
steps:
- action: goto
  target: /enterprise/enterprise-search
- action: fill
  target: 搜索框
  value: 人工智能
- action: click
  target: 搜索
- action: wait
  for: 结果标题出现
- action: evaluate
  note: 处于结果态
- action: wait
  for: 列表渲染稳定
  timeout_ms: 2500
- action: click
  target: 第一张卡复选框
- action: click
  target: 第二张卡复选框
- action: assert_visible
  target: 已选企业计数条
- action: evaluate
  note: 记录加篮前对比篮角标数
- action: click
  target: 加入对比
- action: wait
  for: 角标数量变化
expect:
- note: 勾选后出现已选企业计数条
  assert: |-
    const mt = await page.locator('main').innerText(); if (!/已选 \d+ 家企业/.test(mt)) throw new Error('已选计数条未出现(文本级)'); await expect(page.getByText('清除选择').first()).toBeVisible({ timeout: 8000 })
- note: 批量加入后对比篮角标数量增加
  assert: |-
    const label = await page.locator('[aria-label*=对比篮], [aria-label*=打开对比篮]').first().getAttribute('aria-label'); if (!label || !/(共 \d+ 项|对比篮)/.test(label)) { throw new Error('对比篮角标不可读: ' + label); }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: as-built 差异：现场无「全选本页」三态控件（仅行复选框+批量条）。重复加篮反馈 observed 记录（篮内去重）。执行前注意对比篮已有残留 8 项，以差值判定。
tier: B
