id: FUNC-00457
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00457
priority: P0
title: 勾选多家企业后出现已选条且可批量加入对比
story: US-E1-SCH-05
entry_id: ent-search
tier: B
preconditions:
  - 结果列表不少于 2 条（本条自含智能搜索「人工智能」）
locators:
  search_input: textbox「输入企业名、产业、资质、区域或专利关键词」
  search_btn: button「搜索」
  row_checkbox_1: main .arco-checkbox 第 2 个（第 1 个为「全选本页」）
  row_checkbox_2: main .arco-checkbox 第 3 个
  batch_bar: 文案「已选 N 家企业」与同行 button「加入对比」
  basket_dock: button aria-label 含「打开对比篮，共」
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: evaluate
    note: 勾选第 1、2 张结果卡复选框、批量条与对比篮见 expect（P2；勿用 steps 词表 nth0=全选本页）
expect:
  - note: 勾选后出现已选企业计数条
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      await expect(page.getByText('智能搜索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/)).toBeVisible({ timeout: 15000 });
      const rowCb = page.locator('main .arco-checkbox');
      if (await rowCb.count() < 3) throw new Error('结果行复选框不足 2 条（含全选本页）');
      await rowCb.nth(1).click({ timeout: 8000 });
      await page.waitForTimeout(350);
      await rowCb.nth(2).click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page.getByText(/已选\s*2\s*家企业/).first()).toBeVisible({ timeout: 8000 });
      const bulkBar = page.locator('div').filter({ hasText: /已选\s*2\s*家企业/ }).filter({ has: page.getByRole('button', { name: '加入对比' }) }).first();
      await expect(bulkBar).toBeVisible({ timeout: 8000 });
  - note: 批量加入后对比篮角标数量增加
    assert: |-
      const parseBasket = async () => {
        const btn = page.getByRole('button', { name: /打开对比篮/ }).first();
        await expect(btn).toBeVisible({ timeout: 8000 });
        const label = (await btn.getAttribute('aria-label')) || '';
        const m = label.match(/共\s*(\d+)\s*项/);
        if (!m) throw new Error('对比篮角标不可读: ' + label);
        return parseInt(m[1], 10);
      };
      const before = await parseBasket();
      const bulkBar = page.locator('div').filter({ hasText: /已选\s*2\s*家企业/ }).filter({ has: page.getByRole('button', { name: '加入对比' }) }).first();
      await bulkBar.getByRole('button', { name: '加入对比' }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      let after = before;
      for (let i = 0; i < 10; i++) {
        after = await parseBasket();
        if (after > before) break;
        await page.waitForTimeout(500);
      }
      if (after <= before) {
        throw new Error('批量加入后对比篮数量未增加 before=' + before + ' after=' + after);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 深链 /enterprise/enterprise-search。main 内 .arco-checkbox nth(0)=全选本页，nth(1)/nth(2)=前两张结果卡（runner 词表「第一张卡复选框」误指 nth0，本条在 assert 显式点选）。现场有全选本页；批量条无「清除选择」文案（01481 另条）。批量「加入对比」须用含已选计数条容器限定，避免点卡片行内同名按钮。
