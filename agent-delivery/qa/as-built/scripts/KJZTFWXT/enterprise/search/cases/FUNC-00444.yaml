id: FUNC-00444
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00444
priority: P1
tier: B
title: 主流程-热门场景进高筛
entry_id: ent-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: click
    target: 深圳高新技术企业
  - action: wait
    timeout_ms: 1500
expect:
  - note: 1、页面切换为高级筛选且出现该场景条件摘要
    assert: |-
      const main = page.getByRole('main');
      await expect(main.getByText('编辑高级筛选 （2）')).toBeVisible({ timeout: 30000 });
      await expect(main.getByText('当前条件')).toBeVisible({ timeout: 30000 });
      await expect(main.getByText('企业所属地区：深圳市')).toBeVisible({ timeout: 30000 });
      await expect(main.getByText('资质标签：高新技术企业')).toBeVisible({ timeout: 30000 });
  - note: 2、结果标题为高级筛选结果且含命中条数或明确空态
    assert: |-
      const main = page.getByRole('main');
      await expect(main.getByText('高级筛选结果')).toBeVisible({ timeout: 30000 });
      await expect(main.getByText('命中 0 家企业').or(main.getByText('未命中结果'))).toBeVisible({ timeout: 30000 });
  - note: 3、高级筛选页无蓝色搜索主视觉
    assert: |-
      const main = page.getByRole('main');
      await expect(main.getByPlaceholder(/输入企业名、产业、资质、区域或专利关键词/)).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
