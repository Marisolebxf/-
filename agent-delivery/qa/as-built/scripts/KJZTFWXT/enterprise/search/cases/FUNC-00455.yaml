id: FUNC-00455
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00455
priority: P1
tier: B
title: 检索与字典请求经专题 Java 门面且断链可读
entry_id: ent-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
expect:
  - note: 存在经专题服务网关的检索与元数据请求
    assert: |-
      const topicHits = [];
      const onReq = (req) => {
        const u = req.url();
        if (u.includes('/enterprise/topic/v1/')) topicHits.push(u);
      };
      page.on('request', onReq);
      try {
        await page.keyboard.press('Escape');
        const chip = page.locator('.enterprise-search-example-button').first();
        await expect(chip).toBeVisible({ timeout: 8000 });
        await chip.click();
        await page.waitForTimeout(300);
        const smartWait = page.waitForResponse((r) => r.url().includes('/enterprise/topic/v1/search/smart'), {
          timeout: 30000,
        });
        await page.getByRole('button', { name: '搜索', exact: true }).click();
        await smartWait;
        await expect(page.getByText('智能搜索结果').first()).toBeVisible({ timeout: 20000 });
        await page.getByRole('radio', { name: '高级筛选' }).click();
        await page.waitForTimeout(800);
        const metaOnAdvanced = page.waitForResponse((r) =>
          /\/enterprise\/topic\/v1\/search\/meta\//.test(r.url()),
        { timeout: 30000 });
        await metaOnAdvanced.catch(() => null);
        const libField = page.locator('main').getByText('企业所属地区', { exact: true }).first();
        await expect(libField).toBeVisible({ timeout: 10000 });
        await libField.click();
        await page.waitForTimeout(600);
        const regionTrigger = page.locator('main').getByText('请选择所属地区').first();
        await expect(regionTrigger).toBeVisible({ timeout: 15000 });
        const metaRegions = page.waitForResponse((r) =>
          r.url().includes('/enterprise/topic/v1/search/meta/regions'),
        { timeout: 30000 });
        await regionTrigger.click();
        await metaRegions;
        await page.waitForTimeout(400);
        const hasSearch = topicHits.some((u) => /\/enterprise\/topic\/v1\/search\/(smart|query|advanced)/.test(u));
        const hasMeta = topicHits.some((u) => /\/enterprise\/topic\/v1\/search\/meta\//.test(u));
        expect(hasSearch).toBe(true);
        expect(hasMeta).toBe(true);
        await page.evaluate((urls) => {
          window.__qaTopicHits = urls;
        }, topicHits);
      } finally {
        page.off('request', onReq);
      }
  - note: 请求目标不含演示环境服务域名
    assert: |-
      const topicHits = await page.evaluate(() => window.__qaTopicHits || []);
      const forbidden = ['30888', '30892', '50892', 'demo-svc', 'demo-platform'];
      const bad = topicHits.filter((u) => forbidden.some((f) => u.includes(f)));
      expect(bad.length).toBe(0);
  - note: 断链时页面有可读提示且无白屏
    assert: |-
      const ctx = page.context();
      await ctx.setOffline(true);
      try {
        await page.getByRole('radio', { name: '智能搜索' }).click();
        await page.waitForTimeout(400);
        await page.getByRole('button', { name: '搜索', exact: true }).click();
        await expect(
          page.getByText(/网络|失败|重试|请稍后再试|无法连接|异常|超时|offline/i).first(),
        ).toBeVisible({ timeout: 15000 });
        await expect(page.locator('main')).toBeVisible();
        await expect(page.getByText('智能搜索').first()).toBeVisible({ timeout: 8000 });
      } finally {
        await ctx.setOffline(false);
      }
on_fail: 截图 + 抄 X-Trace-Id
