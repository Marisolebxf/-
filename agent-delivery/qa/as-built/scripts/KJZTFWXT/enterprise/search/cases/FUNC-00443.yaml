id: FUNC-00443
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00443
priority: P0
title: 点击企业名称打开当前页画像抽屉且十页签齐全
story: US-E1-SCH-05
entry_id: ent-search
tier: A
preconditions:
  - 已有非空结果列表（本条 steps 自含智能搜索「人工智能」出结果）
locators:
  search_input: textbox name 含「输入企业名、产业、资质、区域或专利关键词」
  search_btn: button「搜索」
  result_card: main 内含「查看画像」的结果长卡片
  card_name_btn: 同卡内企业名称 button（含有限公司/股份/集团）
  drawer: .arco-drawer:visible
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 智能搜索结果与长卡片
    timeout_ms: 2000
  - action: evaluate
    note: 点结果卡企业名称开抽屉由 expect[0] assert 自含（避免误点「查企业」Tab 等文案）
expect:
  - note: 抽屉在当前页打开且路由不变
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      await expect(page.getByText('智能搜索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/)).toBeVisible({ timeout: 12000 });
      const card = page.locator('main').locator('[class*=result], [class*=card], .arco-list-item, article, li').filter({ has: page.getByRole('button', { name: '查看画像' }) }).first();
      await expect(card).toBeVisible({ timeout: 15000 });
      const nameBtn = card.locator('button').filter({ hasText: /有限公司|股份|集团|有限责任公司/ }).first();
      await expect(nameBtn).toBeVisible({ timeout: 8000 });
      const routeBefore = page.url();
      await nameBtn.click();
      const drawer = page.locator('.arco-drawer:visible').first();
      await drawer.waitFor({ state: 'visible', timeout: 12000 });
      await expect(page).toHaveURL(routeBefore);
  - note: 抽屉含企业头部且默认页签为「工商概况」
    assert: |-
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      await expect(drawer.locator('.arco-drawer-header')).toContainText('企业详情');
      await expect(drawer.getByText(/有限公司|股份|集团|有限责任公司/).first()).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByRole('tab', { name: '工商概况' })).toHaveAttribute('aria-selected', 'true');
  - note: 页签共十项齐全（清单见用例册附录A）
    assert: |-
      const drawer = page.locator('.arco-drawer:visible');
      for (const t of ['工商概况','主要团队','资质荣誉','知识产权','经营财务','供应链关系','关系图谱','舆情动态','风险信息','招投标']) {
        await expect(drawer.getByRole('tab', { name: t })).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 路由以 catalog 为准：/enterprise/enterprise-search。点名称开企业详情大抽屉（不跳路由）；与「查看画像」快览（01472）分条。企业名 button 与「查看画像」同卡内点名。十页签字段深度归 Q010。
