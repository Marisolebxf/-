id: FUNC-00450
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00450
priority: P0
title: 结果区四类排序均可切换
story: US-E1-SCH-05
entry_id: ent-search
tier: B
preconditions:
  - 已有非空结果列表（本条 steps 自含智能搜索「人工智能」出结果）
locators:
  search_input: textbox name 含「输入企业名、产业、资质、区域或专利关键词」
  search_btn: button「搜索」
  sort_select: 结果区排序 .arco-select-view（默认文案含综合竞争力优先）
  sort_popup: '[role=listbox]:visible [role=option]'
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 智能搜索结果与长卡片
    timeout_ms: 2000
  - action: evaluate
    note: 展开排序下拉与逐项切换由 expect assert 自含（P2 跨 tick）
expect:
  - note: 排序选项含综合竞争力优先、有效专利数、最新营收、成立时间四类
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      await expect(page.getByText('智能搜索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/)).toBeVisible({ timeout: 15000 });
      const getSortSel = () => page.locator('main .arco-select-view').filter({ hasText: /综合竞争力优先|有效专利数|最新营收|成立时间/ }).last();
      const sortSel = getSortSel();
      await expect(sortSel).toBeVisible({ timeout: 8000 });
      const triggerBefore = (await sortSel.innerText()).replace(/\s+/g, ' ');
      await sortSel.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const opts = await page.locator('[role=listbox]:visible [role=option]').allInnerTexts();
      await page.keyboard.press('Escape');
      await page.waitForTimeout(300);
      const norm = (s) => s.replace(/\s+/g, ' ').trim();
      for (const opt of ['综合竞争力优先', '有效专利数', '最新营收', '成立时间']) {
        const inOpts = opts.some((o) => norm(o) === opt || norm(o).includes(opt));
        const inTrigger = triggerBefore.includes(opt);
        if (!inOpts && !inTrigger) throw new Error('缺少排序选项: ' + opt + ' opts=' + JSON.stringify(opts.map(norm)));
      }
  - note: 每次切换后仍可见结果列表或明确空态
    assert: |-
      const sortSel = () => page.locator('main .arco-select-view').filter({ hasText: /综合竞争力优先|有效专利数|最新营收|成立时间/ }).last();
      const assertListOrEmpty = async () => {
        const hit = page.getByText(/命中\s*\d+\s*家企业/).first();
        const empty = page.getByText(/未命中结果，可调整条件|未命中结果/).first();
        const hitOk = (await hit.count()) > 0 && (await hit.isVisible().catch(() => false));
        const emptyOk = (await empty.count()) > 0 && (await empty.isVisible().catch(() => false));
        if (!hitOk && !emptyOk) throw new Error('切换排序后既无结果列表也无明确空态');
      };
      const pickSort = async (label) => {
        const sel = sortSel();
        await sel.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator('[role=listbox]:visible [role=option]').filter({ hasText: label }).first();
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await expect(sel).toContainText(label, { timeout: 8000 });
        await assertListOrEmpty();
      };
      for (const label of ['有效专利数', '最新营收', '成立时间', '综合竞争力优先']) {
        await pickSort(label);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 深链 /enterprise/enterprise-search。排序数值严格单调性不核（observed 记录首卡）。说明卡另条；仅长卡形态另条；排序方向另条（00461）。
