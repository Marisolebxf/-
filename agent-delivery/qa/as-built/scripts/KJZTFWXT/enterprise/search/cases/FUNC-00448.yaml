id: FUNC-00448
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00448
priority: P0
title: 查询方案仅保存高筛条件使用后可恢复
story: US-E1-SCH-04
entry_id: ent-search
tier: B
preconditions:
  - 高级筛选已构造若干条件（本条通过热门场景「国高企」置入高筛条件）
locators:
  hot_chip: 热门场景 国高企
  save_plan: button 保存为查询方案
  save_modal: 保存弹层（标题「保存为查询方案」）
  name_input: placeholder 输入方案名称
  confirm_btn: button 确定
  clear_btn: button 清空条件
  use_plan: button 使用查询方案
  plan_menuitem: menuitem 方案名
  plan_name: qa-func-00448-autotest
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: evaluate
    note: 热门场景构造条件、保存/清空/使用方案与分段断言由 expect assert 自含（对齐用例三步）
expect:
  - note: 方案可保存并命名
    assert: |-
      const planName = 'qa-func-00448-autotest';
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      const main = page.locator('main');
      const hotSection = main.filter({ hasText: '热门场景' });
      await hotSection.getByText('国高企', { exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const beforeSave = await main.innerText();
      if (!/已选\s*[1-9]\d*\s*个条件/.test(beforeSave) && !/应用筛选\s*[（(]\s*[1-9]/.test(beforeSave)) {
        throw new Error('保存前未见已构造的高筛条件');
      }
      const saveBtn = page.getByRole('button', { name: '保存为查询方案' });
      await expect(saveBtn).toBeEnabled({ timeout: 8000 });
      await saveBtn.click({ timeout: 8000 });
      const nameInput = page.getByPlaceholder('输入方案名称').first();
      await expect(nameInput).toBeVisible({ timeout: 8000 });
      await nameInput.fill(planName);
      await page.getByRole('button', { name: '确定' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(nameInput).toBeHidden({ timeout: 8000 });
      const savedToast = await page.getByText('查询方案已保存').first().isVisible().catch(() => false);
      if (!savedToast) {
        await page.getByRole('button', { name: '使用查询方案' }).click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await expect(page.getByRole('menuitem', { name: planName })).toBeVisible({ timeout: 8000 });
        await page.keyboard.press('Escape');
        await page.waitForTimeout(300);
      }
  - note: 使用后条件恢复为可识别状态（已选条件大于 0 或直接进入高级筛选结果）
    assert: |-
      const planName = 'qa-func-00448-autotest';
      await page.getByRole('button', { name: '清空条件' }).click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await page.getByRole('button', { name: '使用查询方案' }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await page.getByRole('menuitem', { name: planName }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const mainText = await page.locator('main').innerText();
      const hasCount = /已选\s*[1-9]\d*\s*个条件/.test(mainText) || /应用筛选\s*[（(]\s*[1-9]/.test(mainText);
      const hasResult = /高级筛选结果/.test(mainText) && (/命中\s*\d+\s*家企业/.test(mainText) || /未命中结果/.test(mainText));
      if (!hasCount && !hasResult) {
        throw new Error('使用方案后既无已选条件计数也无高级筛选结果');
      }
  - note: 恢复内容不含关键词与企业名单
    assert: |-
      const mainText = await page.locator('main').innerText();
      const relIdx = mainText.indexOf('条件关系');
      const footerIdx = mainText.indexOf('保存为查询方案');
      if (relIdx < 0 || footerIdx < 0 || footerIdx <= relIdx) {
        throw new Error('未见高筛条件编辑区（条件关系～Footer）');
      }
      const condSlice = mainText.slice(relIdx, footerIdx);
      if (/智能输入|关键词/.test(condSlice)) {
        throw new Error('恢复条件含智能输入/关键词：' + condSlice.slice(0, 160));
      }
      if (/企业名单/.test(condSlice)) {
        throw new Error('恢复条件含企业名单');
      }
      if (!/资质荣誉|国高企|经营状态|专精特新/.test(condSlice)) {
        throw new Error('恢复条件区未见高筛字段摘要：' + condSlice.slice(0, 160));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 路由 /enterprise/enterprise-search；保存弹层占位「输入方案名称」、标题「保存为查询方案」（用例册「保存筛选模板」为旧文案）。构造条件用热门场景 chip 置入字段库（新 DSL 编辑器，经营状态需完整填值才 enable 保存）。使用方案从 menuitem 点选，恢复后常为编辑态「已选 N 个条件」而非直出结果。
