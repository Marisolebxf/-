id: FUNC-01478
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01478
priority: P1
title: 结果内经营状态下拉共 4 个选项
story: US-E1-SCH-05
entry_id: ent-search
tier: B
preconditions:
  - 已有非空检索结果（本条 steps 自含智能搜索「人工智能」出结果）
locators:
  search_input: textbox 含「输入企业名、产业、资质、区域或专利关键词」
  search_btn: button「搜索」
  refine_status: 结果工具条 .arco-select-view 经营状态
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 智能搜索结果与命中条数
    timeout_ms: 2000
  - action: evaluate
    note: 展开经营状态下拉由 expect assert 自含（P2 跨 tick）
expect:
  - note: 展开「经营状态」下拉后选项共 4 个
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      const main = page.locator('main');
      await expect(page.getByText('智能搜索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/)).toBeVisible({ timeout: 12000 });
      const statusPh = main.locator('input[placeholder="经营状态"]');
      if ((await statusPh.count()) < 1) {
        throw new Error('结果内未见经营状态再筛控件');
      }
      const statusSel = main.locator('.arco-select-view').filter({ hasText: '经营状态' }).first();
      await expect(statusSel).toBeVisible({ timeout: 8000 });
      await statusSel.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popup = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const opts = popup.locator('[role=option], .arco-select-option');
      const texts = (await opts.allTextContents())
        .map((t) => t.replace(/\s+/g, '').trim())
        .filter(Boolean);
      const unique = [...new Set(texts)];
      if (unique.length !== 4) {
        throw new Error(`经营状态去重后选项数为 ${unique.length}，预期 4；实际=${unique.join('、')}（raw=${texts.join('|')}）`);
      }
      await page.evaluate((u) => { window.__qa_status_opts = u; }, unique);
  - note: 四项为在营、注销、迁出、吊销
    assert: |-
      const popup = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      if (!(await popup.isVisible().catch(() => false))) {
        const main = page.locator('main');
        const statusSel = main.locator('.arco-select-view').filter({ hasText: '经营状态' }).first();
        await statusSel.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      }
      const popup2 = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      await expect(popup2).toBeVisible({ timeout: 8000 });
      const expected = ['在营', '注销', '迁出', '吊销'];
      let unique = await page.evaluate(() => window.__qa_status_opts);
      if (!Array.isArray(unique) || unique.length !== 4) {
        const texts = (await popup2.locator('[role=option], .arco-select-option').allTextContents())
          .map((t) => t.replace(/\s+/g, '').trim())
          .filter(Boolean);
        unique = [...new Set(texts)];
      }
      if (unique.length !== 4) {
        throw new Error(`经营状态去重后项数 ${unique.length}，预期 4；实际=${unique.join('、')}`);
      }
      for (const name of expected) {
        if (!unique.some((t) => t === name || t.includes(name))) {
          throw new Error(`经营状态未见「${name}」，实际=${unique.join('、')}`);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 深链 /enterprise/enterprise-search（用例册 /enterprise/enterprise-search）。结果内再筛 placeholder 经营状态；全量即此 4 项（用例册备注）。
