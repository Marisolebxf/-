id: FUNC-01485
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01485
priority: P1
title: 对比篮浮层内清空无确认框并立刻变为空篮
entry_id: ent-search
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: evaluate
    note: 同册 00440 检索入篮并打开对比篮浮层，再点清空（前置见 01476/01484）
expect:
  - note: 标题变为「对比篮（0/50）」
    assert: |-
      const main = page.locator('main');
      await main.getByRole('button', { name: '人工智能', exact: true }).click({ timeout: 12000 });
      await main.getByRole('button', { name: '搜索', exact: true }).click({ timeout: 12000 });
      await expect(main.getByText(/智能搜索结果|命中.*企业/)).toBeVisible({ timeout: 20000 });
      const addBtn = main.getByRole('button', { name: '加入对比篮', exact: true }).first();
      if (await addBtn.isVisible().catch(() => false)) {
        await addBtn.click({ timeout: 8000 });
      } else {
        await main.locator('input[type="checkbox"]').first().check({ timeout: 8000 });
        await main.getByRole('button', { name: '加入对比', exact: true }).click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      const openBasket = main.getByRole('button', { name: /^对比篮/ }).first();
      await expect(openBasket).toBeVisible({ timeout: 8000 });
      await openBasket.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const panel = page.locator('main').locator('[class*="drawer"], [role="dialog"]').filter({ hasText: '对比篮' }).first();
      const scope = (await panel.count()) ? panel : main;
      await expect(scope.getByText(/对比篮（[1-9]\d*\/50）/)).toBeVisible({ timeout: 8000 });
      await scope.getByRole('button', { name: '清空', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(scope.getByText('对比篮（0/50）', { exact: true })).toBeVisible({ timeout: 8000 });
  - note: 出现「对比篮为空」
    assert: |-
      const main = page.locator('main');
      const panel = page.locator('main').locator('[class*="drawer"], [role="dialog"]').filter({ hasText: '对比篮' }).first();
      const scope = (await panel.count()) ? panel : main;
      await expect(scope.getByText('对比篮为空', { exact: true })).toBeVisible({ timeout: 8000 });
  - note: 可见「去检索」
    assert: |-
      const main = page.locator('main');
      const panel = page.locator('main').locator('[class*="drawer"], [role="dialog"]').filter({ hasText: '对比篮' }).first();
      const scope = (await panel.count()) ? panel : main;
      await expect(scope.getByRole('button', { name: '去检索', exact: true })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
