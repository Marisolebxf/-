id: FUNC-00473
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00473
priority: P1
title: 查企业不按信用代码等非名称字段命中
story: US-E1-SCH-01
entry_id: ent-search
tier: B
ticket: D3-ENTSEARCH-CREDIT-CODE-RECALL
preconditions:
  - 已进入企业查询
  - 已知统一社会信用代码（fixtures.boundary_non_name.credit_code / 现用名 boundary_non_name.current_name）
locators:
  company_tab: tab 查企业
  search_input: placeholder「输入企业名称关键词」
  search_btn: button「搜索」exact
  result_title: 「查企业结果 · 命中 N 家企业」
  empty_hint: 「未找到匹配企业」或「未命中结果，可调整条件或切换高级筛选」
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: click
    target: tab 查企业
  - action: fill
    target: textbox 输入企业名称关键词
    value: "91440300MA5GH32K8T"
  - action: click
    target: 搜索
  - action: wait
    for: 查企业结果或空态
    timeout_ms: 12000
expect:
  - note: 结果不因信用代码或曾用名命中该企业（仅输 USCC 时长卡区不出现对照现用名）
    assert: |-
      await page.waitForTimeout(1200);
      const main = page.locator('main');
      const notHit = '逆动科技（深圳）有限公司';
      const hasResultTitle = await main.getByText('查企业结果').first().isVisible().catch(() => false);
      const emptyAlt = await main.getByText(/未找到匹配企业|未命中结果/).first().isVisible().catch(() => false);
      if (!hasResultTitle && !emptyAlt) {
        throw new Error('查企业 USCC 检索后既无「查企业结果」也无空态提示');
      }
      const nameVisible = await main.getByText(notHit, { exact: false }).first().isVisible().catch(() => false);
      if (nameVisible) {
        throw new Error('仅输入信用代码仍命中对照现用名「' + notHit + '」，违反非名称字段召回边界');
      }
  - note: 返回空态或名称无关结果（命中 0 家须见未命中提示；有命中则不得含对照现用名长卡）
    assert: |-
      const main = page.locator('main');
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const notHit = '逆动科技（深圳）有限公司';
      const hitM = body.match(/命中\s*(\d+)\s*家企业/);
      const hitN = hitM ? Number(hitM[1]) : null;
      const emptyAlt = await main.getByText(/未找到匹配企业|未命中结果/).first().isVisible().catch(() => false);
      const viewProfile = main.getByRole('button', { name: '查看画像' });
      const hasProfile = (await viewProfile.count()) > 0 && (await viewProfile.first().isVisible().catch(() => false));
      if (hitN === 0 || (hitN === null && emptyAlt)) {
        if (!emptyAlt && hitN === 0) {
          throw new Error('命中 0 家但未出现未命中空态提示');
        }
        if (hasProfile) throw new Error('空态下仍可见「查看画像」结果卡');
        if (body.includes(notHit)) throw new Error('空态正文仍含对照现用名');
      } else if (hitN !== null && hitN > 0) {
        if (body.includes(notHit)) {
          throw new Error('非零命中且结果含对照现用名，非名称无关结果（命中 ' + hitN + ' 家）');
        }
      } else {
        throw new Error('无法判定查企业结果态：' + body.slice(0, 240));
      }
on_fail: 截图 + X-Trace-Id + C1~C6；USCC 仍召回现用名 = D3-ENTSEARCH-CREDIT-CODE-RECALL
as_built_note: >-
  D1·30888 路由 /enterprise/enterprise-search（用例册 enterprise-search 在此环境 404）。
  对照数据 fixtures.boundary_non_name（USCC 91440300MA5GH32K8T / 现用名逆动科技（深圳）有限公司）；曾用名样本现场未见，本条以信用代码支路承载用例「或」前置。
  30888 仅填 USCC 现场呈「未找到匹配企业」空态（无「查企业结果」标题）；50892 实勘曾命中现用名（p0-19-recon，D3 票保留）。断言跟 30888 空态/命中条数双口径，不因代码召回现用名假绿。
