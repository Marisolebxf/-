id: FUNC-01476
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01476
priority: P0
title: 推荐卡加入对比篮后提示且按钮变为已在对比篮
story: US-E1-SCH-05
entry_id: ent-search
tier: B
preconditions:
  - 推荐卡该按钮为「加入对比篮」
locators:
  rec_section: 「推荐企业」分区
  add_basket_btn: 推荐卡 button「加入对比篮」
steps:
  - action: goto
    target: /enterprise/enterprise-search
expect:
  - note: 出现「已加入对比篮」提示
    assert: |-
      await page.keyboard.press('Escape');
      await page.waitForTimeout(200);
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      const clearBtn = page.locator('.enterprise-search-history-row button').filter({ hasText: '清空' }).first();
      if (await clearBtn.isVisible().catch(() => false)) {
        await clearBtn.click({ timeout: 4000 });
        await page.waitForTimeout(600);
      }
      await expect(page.getByText('智能搜索结果')).toHaveCount(0);
      const main = page.locator('main');
      const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
      await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 12000 });
      const cards = recSection
        .locator('div')
        .filter({ hasText: '推荐理由：' })
        .filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
      const cardCount = await cards.count();
      if (cardCount < 1) throw new Error('推荐企业分区无推荐卡');
      let clickedIndex = -1;
      let addBtn = null;
      for (let i = 0; i < cardCount; i++) {
        const card = cards.nth(i);
        const btn = card.getByRole('button', { name: '加入对比篮', exact: true });
        if (await btn.count() && await btn.isVisible().catch(() => false)) {
          clickedIndex = i;
          addBtn = btn;
          break;
        }
      }
      if (!addBtn) {
        const inBtn = cards.first().getByRole('button', { name: /^(已在对比篮|已加入)$/, exact: true });
        if (await inBtn.count() && await inBtn.isVisible().catch(() => false)) {
          await inBtn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          clickedIndex = 0;
          addBtn = cards.nth(0).getByRole('button', { name: '加入对比篮', exact: true });
        }
      }
      if (!addBtn || clickedIndex < 0) throw new Error('未见可点的推荐卡「加入对比篮」按钮');
      await page.evaluate((idx) => sessionStorage.setItem('qa-func-01476-idx', String(idx)), clickedIndex);
      await addBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page.locator('.arco-message-content').filter({ hasText: '已加入对比篮' }).first()).toBeVisible({ timeout: 10000 });
  - note: 该按钮变为「已在对比篮」
    assert: |-
      const idxRaw = await page.evaluate(() => sessionStorage.getItem('qa-func-01476-idx'));
      const clickedIndex = idxRaw != null ? parseInt(idxRaw, 10) : -1;
      if (clickedIndex < 0) throw new Error('缺少本条会话标记的推荐卡序号');
      const main = page.locator('main');
      const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
      const cards = recSection
        .locator('div')
        .filter({ hasText: '推荐理由：' })
        .filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
      const targetCard = cards.nth(clickedIndex);
      await expect(targetCard).toBeVisible({ timeout: 8000 });
      const inBasketBtn = targetCard.getByRole('button', { name: /^(已在对比篮|已加入)$/, exact: true });
      await expect(inBasketBtn).toBeVisible({ timeout: 10000 });
      await expect(targetCard.getByRole('button', { name: '加入对比篮', exact: true })).toHaveCount(0);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 路由以 catalog 为准：/enterprise/enterprise-search。D2·入篮成功提示「已加入对比篮」；推荐卡按钮入篮后现场为「已加入」（用例册写「已在对比篮」）。移出后再加篮用「已在对比篮|已加入」识别在篮态。推荐卡用含「推荐理由：」+「查看画像」的卡片容器定位。
