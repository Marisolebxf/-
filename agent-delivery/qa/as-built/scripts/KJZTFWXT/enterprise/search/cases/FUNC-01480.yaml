id: FUNC-01480
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01480
priority: P1
title: 结果内资质标签下拉共 6 个选项
story: US-E1-SCH-05
entry_id: ent-search
tier: B
preconditions:
  - 已有非空检索结果（本条 steps 自含智能搜索「人工智能」出结果）
locators:
  search_input: textbox 含「输入企业名、产业、资质、区域或专利关键词」
  search_btn: button「搜索」
  refine_qual_tag: 结果工具条 .arco-select-view 资质荣誉（用例写资质标签，D1 跟现场）
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 智能搜索结果与命中条数
    timeout_ms: 2000
  - action: evaluate
    note: 展开资质标签下拉由 expect assert 自含（P2 跨 tick）
expect:
  - note: 展开「资质标签」下拉后选项共 6 个
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      const main = page.locator('main');
      await expect(page.getByText('智能搜索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/)).toBeVisible({ timeout: 12000 });
      const qualPh = main.locator('input[placeholder="资质荣誉"]');
      if ((await qualPh.count()) < 1) {
        throw new Error('结果内未见资质荣誉再筛控件（用例称资质标签）');
      }
      const qualSel = main.locator('.arco-select-view').filter({ hasText: '资质荣誉' }).first();
      await expect(qualSel).toBeVisible({ timeout: 8000 });
      await qualSel.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popup = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const opts = popup.locator('[role=option], .arco-select-option');
      const texts = (await opts.allTextContents())
        .map((t) => t.replace(/\s+/g, '').trim())
        .filter(Boolean);
      const unique = [...new Set(texts)];
      if (unique.length !== 6) {
        throw new Error(`资质标签去重后选项数为 ${unique.length}，预期 6；实际=${unique.join('、')}（raw=${texts.join('|')}）`);
      }
      await page.evaluate((u) => { window.__qa_qual_opts = u; }, unique);
  - note: 六项为专精特新、国高企、小巨人、链主龙头、独角兽、瞪羚
    assert: |-
      const popup = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      if (!(await popup.isVisible().catch(() => false))) {
        const main = page.locator('main');
        const qualSel = main.locator('.arco-select-view').filter({ hasText: '资质荣誉' }).first();
        await qualSel.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      }
      const popup2 = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      await expect(popup2).toBeVisible({ timeout: 8000 });
      const expected = ['专精特新', '国高企', '小巨人', '链主龙头', '独角兽', '瞪羚'];
      let unique = await page.evaluate(() => window.__qa_qual_opts);
      if (!Array.isArray(unique) || unique.length !== 6) {
        const texts = (await popup2.locator('[role=option], .arco-select-option').allTextContents())
          .map((t) => t.replace(/\s+/g, '').trim())
          .filter(Boolean);
        unique = [...new Set(texts)];
      }
      if (unique.length !== 6) {
        throw new Error(`资质标签去重后项数 ${unique.length}，预期 6；实际=${unique.join('、')}`);
      }
      for (const name of expected) {
        if (!unique.some((t) => t === name || t.includes(name))) {
          throw new Error(`资质标签未见「${name}」，实际=${unique.join('、')}`);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 深链 /enterprise/enterprise-search（用例册 /enterprise/enterprise-search）。用例写「资质标签」；现场再筛 placeholder/触发器为资质荣誉（同 FUNC-00458）。D3·30888 实勘资质荣誉下拉去重 7 项（多「上市」），与用例「全量即此 6 项」冲突，机跑预期红。
