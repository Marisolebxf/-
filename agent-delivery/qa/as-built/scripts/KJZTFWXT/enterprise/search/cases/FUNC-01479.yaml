id: FUNC-01479
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01479
priority: P1
title: 结果内企业规模下拉共 4 个选项
story: US-E1-SCH-05
entry_id: ent-search
tier: B
preconditions:
  - 已有非空检索结果（本条 steps 自含智能搜索「人工智能」出结果）
locators:
  search_input: textbox 含「输入企业名、产业、资质、区域或专利关键词」
  search_btn: button「搜索」
  refine_scale: 结果工具条 .arco-select-view 企业规模
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 智能搜索结果与命中条数
    timeout_ms: 2000
  - action: evaluate
    note: 展开企业规模下拉由 expect assert 自含（P2 跨 tick）
expect:
  - note: 展开「企业规模」下拉后选项共 4 个
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      const main = page.locator('main');
      await expect(page.getByText('智能搜索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/)).toBeVisible({ timeout: 12000 });
      const scalePh = main.locator('input[placeholder="企业规模"]');
      if ((await scalePh.count()) < 1) {
        throw new Error('结果内未见企业规模再筛控件');
      }
      const scaleSel = main.locator('.arco-select-view').filter({ hasText: '企业规模' }).first();
      await expect(scaleSel).toBeVisible({ timeout: 8000 });
      await scaleSel.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popup = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const opts = popup.locator('[role=option], .arco-select-option');
      const texts = (await opts.allTextContents())
        .map((t) => t.replace(/\s+/g, '').trim())
        .filter(Boolean);
      const unique = [...new Set(texts)];
      if (unique.length !== 4) {
        throw new Error(`企业规模去重后选项数为 ${unique.length}，预期 4；实际=${unique.join('、')}（raw=${texts.join('|')}）`);
      }
      await page.evaluate((u) => { window.__qa_scale_opts = u; }, unique);
  - note: 四项为大型、中型、小型、微型
    assert: |-
      const popup = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      if (!(await popup.isVisible().catch(() => false))) {
        const main = page.locator('main');
        const scaleSel = main.locator('.arco-select-view').filter({ hasText: '企业规模' }).first();
        await scaleSel.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      }
      const popup2 = page.locator('.arco-trigger-popup:visible, [role=listbox]:visible').first();
      await expect(popup2).toBeVisible({ timeout: 8000 });
      const expected = ['大型', '中型', '小型', '微型'];
      let unique = await page.evaluate(() => window.__qa_scale_opts);
      if (!Array.isArray(unique) || unique.length !== 4) {
        const texts = (await popup2.locator('[role=option], .arco-select-option').allTextContents())
          .map((t) => t.replace(/\s+/g, '').trim())
          .filter(Boolean);
        unique = [...new Set(texts)];
      }
      if (unique.length !== 4) {
        throw new Error(`企业规模去重后项数 ${unique.length}，预期 4；实际=${unique.join('、')}`);
      }
      for (const name of expected) {
        if (!unique.some((t) => t === name || t.includes(name))) {
          throw new Error(`企业规模未见「${name}」，实际=${unique.join('、')}`);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 深链 /enterprise/enterprise-search（用例册 /enterprise/enterprise-search）。结果内再筛 placeholder 企业规模。D2·2026-10-19 机跑现场下拉四项为规上、大型、中型、小微，与用例册大型/中型/小型/微型不一致；脚本按用例预期断言。
