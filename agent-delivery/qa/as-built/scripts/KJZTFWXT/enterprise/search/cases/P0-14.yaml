id: P0-14
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00458
priority: P0
title: 结果内再筛可施加、收窄且可清除恢复
story: US-E1-SCH-05
entry_id: ent-search
preconditions:
- 已有非空结果列表
locators:
  refine_status: 结果内筛选 经营状态 select
  refine_opt: 选项（如 吊销）
  refine_chip: 当前条件 chip（可关闭）
steps:
- action: goto
  target: /enterprise/enterprise-search
- action: fill
  target: 搜索框
  value: 人工智能
- action: click
  target: 搜索
- action: wait
  for: 结果标题出现
- action: evaluate
  note: 处于结果态
- action: click
  target: 结果内筛选 经营状态
- action: select_option
  target: 经营状态
  value: 任一非默认选项
- action: wait
  for: 列表更新（结果态保持）
- action: snapshot
  note: 记录再筛前后条数（observed）
- action: click
  target: 清除该再筛条件（chip 关闭）
- action: wait
  for: 列表恢复
expect:
- note: 施加后列表仍处结果态且条数变化可解释
  assert: |-
    await page.waitForTimeout(800); const ok1 = await page.getByText(/命中 \d+ 家企业/).first().isVisible().catch(() => false); const ok2 = await page.getByText(/未命中|无匹配/).first().isVisible().catch(() => false); if (!ok1 && !ok2) throw new Error('再筛后既无命中数也无未命中反馈');
- note: 清除后结果恢复再筛前范围
  assert: |-
    await page.waitForTimeout(800); const ok1 = await page.getByText(/命中 \d+ 家企业/).first().isVisible().catch(() => false); const ok2 = await page.getByText(/未命中|无匹配/).first().isVisible().catch(() => false); if (!ok1 && !ok2) throw new Error('再筛后既无命中数也无未命中反馈');; await expect(page.getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 8000 })
allow_skip: 再筛收不到 0 记 Pass-N/A（数据不足）
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 工具条含经营状态、企业规模、资质标签等再筛控件（构成顺带核对）。条数变化 observed 记录。局部空态另条 P1-09。
tier: B
