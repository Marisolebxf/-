id: FUNC-00447
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00447
priority: P0
tier: B
title: 主流程-地区字段全国级联
entry_id: ent-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: click
    target: tab 高级筛选
  - action: wait
    timeout_ms: 800
  - action: click
    target: 企业所属地区
  - action: wait
    timeout_ms: 500
expect:
  - note: 1、下拉第一列共 32 项（全量见附录C）
    assert: |-
      const main = page.locator('main').first();
      await main.locator('.arco-cascader-view').last().click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const panel = page.locator('main .arco-cascader-panel').last();
      await expect(panel).toBeVisible({ timeout: 10000 });
      const col = panel.locator('.arco-cascader-panel-column').first();
      const labels = col.locator('.arco-cascader-option-label');
      await expect(labels).toHaveCount(32, { timeout: 8000 });
  - note: 2、省级名称为 31 个
    assert: |-
      const panel = page.locator('main .arco-cascader-panel').last();
      const col = panel.locator('.arco-cascader-panel-column').first();
      const labels = col.locator('.arco-cascader-option-label');
      const texts = await labels.allTextContents();
      const provCount = texts.map((t) => t.trim()).filter((t) => t && t !== '中国').length;
      if (provCount !== 31) throw new Error(`省级名称 ${provCount} 个，预期 31 个`);
  - note: 3、同列另有「中国」
    assert: |-
      const panel = page.locator('main .arco-cascader-panel').last();
      const col = panel.locator('.arco-cascader-panel-column').first();
      await expect(col.getByText('中国', { exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
