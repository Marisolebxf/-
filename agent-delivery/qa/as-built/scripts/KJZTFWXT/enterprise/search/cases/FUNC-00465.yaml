id: FUNC-00465
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00465
priority: P1
title: 结果态「编辑高级筛选」可回到字段库且条件保留
story: US-E1-SCH-04
entry_id: ent-search
tier: B
preconditions:
  - 高级筛选已应用并处于结果态
locators:
  adv_tab: tab 高级筛选
  field_lib: region 高级筛选字段库
  edit_btn: button 编辑高级筛选（N）
  hot_chip: 热门场景 国高企
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: click
    target: tab 高级筛选
  - action: evaluate
    note: 构造高筛结果态、点编辑高级筛选与分段断言由 expect assert 自含（P2 跨 tick）
expect:
  - note: 页面回到字段库编辑态
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      const main = page.locator('main');
      const hotSection = main.filter({ hasText: '热门场景' });
      await hotSection.getByText('国高企', { exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const applyBtn = page.getByRole('button', { name: /应用筛选/ }).first();
      await expect(applyBtn).toBeVisible({ timeout: 8000 });
      if (await applyBtn.isEnabled()) {
        await applyBtn.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
      }
      const hasAdvResult = (await page.getByText('高级筛选结果').count()) > 0;
      const hasEmpty = (await page.getByText('未命中结果，可调整条件或切换高级筛选').count()) > 0;
      if (!hasAdvResult && !hasEmpty) {
        throw new Error('前置未进入高级筛选结果态（无结果标题也无空态文案）');
      }
      const editBtn = page.getByRole('button', { name: /编辑高级筛选/ }).first();
      await expect(editBtn).toBeVisible({ timeout: 8000 });
      await editBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('heading', { name: '高级筛选 · 字段库' })).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '保存为查询方案' })).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: /应用筛选/ }).first()).toBeVisible({ timeout: 8000 });
      const editGone = (await page.getByRole('button', { name: /编辑高级筛选/ }).count()) === 0;
      if (!editGone) {
        const stillResult = (await page.getByText('高级筛选结果').count()) > 0;
        if (stillResult) {
          throw new Error('点击编辑后仍处于结果态（编辑高级筛选仍可见且结果标题仍在）');
        }
      }
  - note: 先前已选条件保留
    assert: |-
      const mainText = await page.locator('main').innerText();
      const relIdx = mainText.indexOf('条件关系');
      const footerIdx = mainText.indexOf('保存为查询方案');
      if (relIdx < 0 || footerIdx < 0 || footerIdx <= relIdx) {
        throw new Error('回到编辑态后未见高筛条件区（条件关系～Footer）');
      }
      const condSlice = mainText.slice(relIdx, footerIdx);
      const hasCount = /已选\s*[1-9]\d*\s*个条件/.test(condSlice) || /应用筛选\s*[（(]\s*[1-9]/.test(mainText);
      const hasField = /国高企|资质荣誉|经营状态|专精特新/.test(condSlice);
      if (!hasCount && !hasField) {
        throw new Error('先前已选条件未保留：' + condSlice.slice(0, 200));
      }
      if (!/国高企/.test(condSlice) && !hasCount) {
        throw new Error('条件区未见置入的国高企摘要且无已选计数');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 路由 /enterprise/enterprise-search。结果态按钮文案「编辑高级筛选 （N）」机检用 /编辑高级筛选/。前置用热门场景「国高企」置入条件后点「应用筛选」进结果态（与 00444 同环境：chip 未必直出结果）。
