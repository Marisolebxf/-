id: FUNC-01481
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01481
priority: P1
tier: B
title: 勾选企业后点清除选择，已选条消失且复选框恢复未勾选
entry_id: ent-search
preconditions:
  - 结果页已勾选至少 1 家企业
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 结果标题出现
  - action: wait
    for: 列表渲染稳定
    timeout_ms: 2500
  - action: click
    target: 第一张卡复选框
  - action: assert_visible
    target: 已选企业计数条
  - action: click
    target: 清除选择
expect:
  - note: 「已选」计数条消失
    assert: |-
      await expect(page.locator('main').getByText(/已选 \d+ 家企业/)).toHaveCount(0, { timeout: 8000 })
  - note: 该卡复选框恢复未勾选
    assert: |-
      const firstCb = page.locator('main').locator('.arco-checkbox').first();
      await expect(firstCb).toBeVisible({ timeout: 5000 });
      const cls = (await firstCb.getAttribute('class')) ?? '';
      if (/arco-checkbox-checked/.test(cls)) throw new Error('首张卡复选框仍为选中态');
on_fail: 截图 + 抄 X-Trace-Id
