id: P1-18
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00465
priority: P1
title: 结果态「编辑高级筛选」可回到字段库且条件保留
story: US-E1-SCH-04
entry_id: ent-search
preconditions:
- 高级筛选已应用并处于结果态
locators:
  edit_btn: 「编辑高级筛选」按钮（与「应用筛选」原位互换）
  field_lib: 字段库
  cond_area: 已选条件区
steps:
- action: goto
  target: /enterprise/enterprise-search
- action: fill
  target: 搜索框
  value: 人工智能
- action: click
  target: 搜索
- action: wait
  for: 结果标题出现
- action: evaluate
  note: 处于高级筛选结果态（承接 P0-06/P0-10）
- action: click
  target: 编辑高级筛选
- action: wait
  for: 回到字段库
- action: assert_visible
  target: 字段库
- action: snapshot
  note: 记录先前条件保留情况
expect:
- note: 页面回到字段库编辑态
  assert: |-
    await expect(page.getByText('企业所属地区').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /应用筛选/ }).first()).toBeVisible({ timeout: 8000 })
- note: 先前已选条件保留
  assert: |-
    const bodyText = await page.locator('main, body').first().innerText(); if (!/已选\s*[1-9]\d*\s*(个条件|家企业)/.test(bodyText)) { throw new Error('回字段库后未见保留的已选条件计数'); }
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
