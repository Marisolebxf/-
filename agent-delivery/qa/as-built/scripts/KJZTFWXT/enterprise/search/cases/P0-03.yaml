id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00440
priority: P0
title: 智能搜索关键词检索后得到长卡片结果与命中条数
story: US-E1-SCH-02
entry_id: ent-search
tier: A
preconditions:
  - 已进入企业查询默认智能搜索
  - 搜索框可填入「人工智能」（env-gate overall=pass；G4 稳定非空命中；A 档禁止 skip）
locators:
  search_input: textbox name 含「输入企业名、产业、资质、区域或专利关键词」
  search_btn: button「搜索」
  result_title: 「智能搜索结果 · 命中 N 家企业」（N≥1，不钉死精确值）
  card: main 内横向长卡片（企业名 button + 在营 + 查看画像）
  view_profile: main button「查看画像」
  empty_hint: 未命中结果，可调整条件或切换高级筛选
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 非空结果长卡（main 查看画像）
    timeout_ms: 8000
  - action: snapshot
expect:
  - note: 结果标题为智能搜索结果且含非零命中条数（可见性，不钉死精确数字）
    assert: |-
      await page.keyboard.press('Escape'); await page.waitForTimeout(200); const closeB = page.locator('button[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {} } await page.getByRole('tab', { name: '智能搜索' }).click({ timeout: 8000 }).catch(() => {}); const input = page.getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ }).first(); await input.fill('人工智能'); await page.getByRole('button', { name: '搜索', exact: true }).click(); const titleOk = page.getByText(/智能搜索结果[\s·]*命中\s*[1-9]\d*\s*家企业/); const profile = page.locator('main').getByRole('button', { name: '查看画像' }).first(); try { await expect(titleOk.first()).toBeVisible({ timeout: 12000 }); await expect(profile).toBeVisible({ timeout: 12000 }); } catch { const empty = page.getByText('未命中结果，可调整条件或切换高级筛选'); if (await empty.isVisible().catch(() => false)) { const clear = page.getByRole('button', { name: '清空条件' }); if (await clear.count()) { await clear.first().click({ timeout: 3000 }).catch(() => {}); await page.waitForTimeout(400); } await input.fill('人工智能'); await page.getByRole('button', { name: '搜索', exact: true }).click(); } await expect(titleOk.first()).toBeVisible({ timeout: 20000 }); await expect(profile).toBeVisible({ timeout: 20000 }); }
  - note: 至少一张横向长卡片且含企业名称与经营状态
    assert: |-
      const main = page.locator('main'); await expect(main.getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 15000 }); await expect(main.getByText('在营').first()).toBeVisible({ timeout: 8000 }); await expect(main.getByRole('button').filter({ hasText: /有限公司|股份|集团/ }).first()).toBeVisible({ timeout: 8000 })
  - note: 卡片含「查看画像」动作
    assert: |-
      await expect(page.locator('main').getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: A 档零 allow_skip。父验收 fail 根因：串跑快照见「命中 0 家企业」+ 空态文案，旧断言 /命中/ 把 0 当通过故无「查看画像」。现改为 N≥1 标题 + main 内查看画像；空态则点「清空条件」后重搜。不钉死 4493。列表项须 2 空格缩进。
