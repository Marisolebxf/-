    const bodyText = await page.locator('main, body').first().innerText(); const bad = ['大模型', '意图识别', '自然语言理解', '语义理解', 'AI 生成', 'AI为您']; const hits = bad.filter(w => bodyText.includes(w)); if (hits.length > 0) { throw new Error('出现能力承诺文案: ' + hits.join(', ')); }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 出现承诺类文案判不通过（Q033 正向现状校验）。
