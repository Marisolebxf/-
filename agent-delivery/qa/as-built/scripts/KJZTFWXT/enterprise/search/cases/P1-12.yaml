preconditions:
- 已进入企业查询智能搜索模式
locators:
  page_text: 页面可见文本
steps:
- action: goto
  target: /enterprise/enterprise-search
- action: evaluate
  note: 扫描可见文本匹配「大模型」「意图识别」「自然语言理解」类承诺文案
