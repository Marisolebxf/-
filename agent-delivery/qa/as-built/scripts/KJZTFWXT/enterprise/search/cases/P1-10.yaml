locators:
  region_ctrl: 结果工具条「选择区域」控件（实勘形态：全国热门科创城市/深圳/全部 下拉）
steps:
- action: goto
  target: /enterprise/enterprise-search
- action: fill
  target: 搜索框
  value: 人工智能
- action: click
