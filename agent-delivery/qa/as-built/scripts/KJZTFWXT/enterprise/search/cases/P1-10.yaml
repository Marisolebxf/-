  assert: |-
    const panel = page.locator('.arco-cascader-panel, .arco-select-dropdown').first(); await expect(panel).toBeVisible({ timeout: 8000 }); const panelText = await panel.innerText(); if (!/全球|全国|区域|全国热门科创城市/.test(panelText)) { throw new Error('选择区域展开后无一级选项: ' + panelText.slice(0, 200)); }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘控件形态为「全国热门科创城市 / 深圳 / 全部」级联下拉；级联级数与选项清单 observed 记录（Q037）；选中后收窄行为 observed 记录。
