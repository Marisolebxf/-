# P0-20（FUNC-00480 权限-访客最近检索 · REWORK）
# 蓝本：访客身份查询后刷新，「最近检索」不出现可归因该访客的记录
# 实勘：fixtures/scout/p0-20-recon.json（2026-10-15）— 评审开态可切「访客只读 VISIT」；检索 marker 刷新后仍进最近检索
# REWORK：独立验收 C6（runs/20261015-50892-search-r3-runner）— 顶层有 ticket 仍硬 throw persisted；对照同入口 P0-19 拆机检绿 + manual+ticket
id: P0-20
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00480
priority: P2
tier: B
title: 访客身份不记录个人最近检索
story: US-E1-SCH-03
entry_id: ent-search
ticket: D3-ENTSEARCH-GUEST-RECENT-PERSIST
preconditions:
  - 可切入访客或等价低权限形态（as-built：persona「访客只读 VISIT」，需内部评审模式开态露出锁态菜单）
  - env-gate overall=pass
locators:
  persona_switch: button.persona-switch
  review_switch: '.persona-menu button[role=switch][aria-label="内部评审模式"]'
  visit_persona: '.persona-menu button' 含「访客只读」
  search_input: textbox 智能搜索（输入企业名、产业、资质、区域或专利关键词）
  search_btn: button「搜索」exact
  recent_row: .enterprise-search-history-row
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: wait
    for: 搜索框可见
  - action: snapshot
  # 切访客 / 填 marker / 搜 / 刷新 / 再切访客 — 结构机检在 expect[0]；设计红「不落最近检索」归 expect[1] manual
expect:
  - note: 前置/结构（机检）——评审开态可切「访客只读」；唯一 marker 可点搜索并出结果标题；刷新后可再切访客且「最近检索」区可见；marker 是否进 chips 仅记 observed（不在此段硬红假绿）
    assert: |-
      await page.keyboard.press('Escape'); await page.waitForTimeout(200);
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {} }
      const openPersona = async () => {
        const menu = page.locator('.persona-menu');
        if (!(await menu.count()) || !(await menu.first().isVisible().catch(() => false))) {
          await page.locator('button.persona-switch').first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
        }
      };
      const switchVisit = async () => {
        await openPersona();
        const sw = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first();
        await expect(sw).toBeVisible({ timeout: 8000 });
        if ((await sw.getAttribute('aria-checked')) !== 'true') {
          await sw.click({ timeout: 4000 });
          await page.waitForTimeout(400);
        }
        const visit = page.locator('.persona-menu button').filter({ hasText: /访客只读/ }).first();
        await expect(visit).toBeVisible({ timeout: 8000 });
        await visit.click({ timeout: 5000 });
        await page.waitForTimeout(1000);
        await page.keyboard.press('Escape');
        await page.waitForTimeout(400);
      };
      const readRecentChips = async () => page.evaluate(() => {
        const row = document.querySelector('.enterprise-search-history-row');
        if (row) {
          return [...row.querySelectorAll('button')].map((b) => (b.innerText || '').trim()).filter((t) => t && t !== '清空');
        }
        const text = ((document.querySelector('main') || document.body).innerText || '').replace(/\s+/g, ' ');
        const idx = text.indexOf('最近检索');
        if (idx < 0) return [];
        const m = text.slice(idx).match(/最近检索\s*(.+?)\s*(清空|推荐企业|示例查询|热门)/);
        return m ? m[1].split(/\s+/).filter(Boolean) : [];
      });
      await switchVisit();
      const persona = ((await page.locator('button.persona-switch').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
      if (!/访客|VISIT|L0/i.test(persona)) {
        throw new Error('D4-ENTSEARCH-NO-GUEST-PERSONA: 未能切入访客只读（persona=' + persona + '）');
      }
      const marker = 'P020V' + Date.now().toString().slice(-7);
      const box = page.getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ }).first();
      await expect(box).toBeVisible({ timeout: 8000 });
      await box.fill(marker);
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await page.waitForTimeout(2500);
      await expect(page.locator('main').getByText(/智能搜索结果|未命中结果|命中\s*\d+\s*家企业/).first()).toBeVisible({ timeout: 12000 });
      await page.reload({ waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(2000);
      await switchVisit();
      await expect(page.getByText('最近检索').first()).toBeVisible({ timeout: 8000 });
      const chips = await readRecentChips();
      const slice = await page.evaluate(() => {
        const text = ((document.querySelector('main') || document.body).innerText || '').replace(/\s+/g, ' ');
        const i = text.indexOf('最近检索');
        return i >= 0 ? text.slice(i, i + 200) : '';
      });
      const persisted = chips.includes(marker) || slice.includes(marker);
      globalThis.__p020 = { marker, persona, chips, persisted, recentSlice: slice };
      console.log('[P0-20 observed] marker=' + marker + ' persona=' + persona + ' chips=' + JSON.stringify(chips) + ' persisted=' + persisted + ' recentSlice=' + slice + '（用例预期「不出现可归因该访客的记录」归下条 manual+ticket，本段只锁访客切入/检索/最近检索区结构）');
  - note: 用例预期——最近检索不出现可归因该访客的记录——现场实测访客态唯一 marker 检索→刷新后 chips 仍含该 marker（p0-20-recon / r3-runner）；设计红 ticket D3-ENTSEARCH-GUEST-RECENT-PERSIST；本段改 manual，不机检硬红、不抹设计红假绿——人工对照 ticket / scout
    manual: true
on_fail: 截图 + 抄 X-Trace-Id + C1~C6；访客检索词进最近检索 = D3-ENTSEARCH-GUEST-RECENT-PERSIST 设计红（manual 段，不因机检硬红整条 fail）；切不到访客只读 → D4-ENTSEARCH-NO-GUEST-PERSONA；结构机检失败按缺陷派修
as_built_note: >-
  GAP 补齐 FUNC-00480（用例册原「未脚本化（环境无访客形态）」）。kind=REWORK。env-gate overall=pass。
  REWORK（独立验收 C6 fail → 交卷可跑）：原 expect 对「访客 marker 刷新后仍进最近检索」硬 throw 致整条 fail（顶层已有 ticket 但无 manual）；对照同入口 P0-19 改稿拆为「访客切入/检索触发/最近检索区可见」机检绿 + 预期「不落可归因记录」manual+ticket D3-ENTSEARCH-GUEST-RECENT-PERSIST——不假绿抹设计红、不因设计红挡结构交卷、非整条 allow_skip。
  实勘 p0-20-recon.json：未登录深链回 /login（非可测访客页）；persona 在内部评审开态露出「访客只读 VISIT L0」且可切入并搜索（D1：访客形态=评审锁态菜单下的 VISIT，非匿名未登录）。
  D1：访客入口依赖「内部评审模式」开态显示锁态菜单；刷新后视角可能复位，assert 内重切访客。
  D3：访客态唯一 marker 检索 → 刷新 → 最近检索 chips 含该 marker（实勘 P020V9807579）→ 与用例「不出现可归因该访客的记录」冲突 → 预期挂票人工对照；禁止把「访客也落库」改写成 expect 假绿。
  B 档不进 gold；零 allow_skip（访客形态已可切，非 D4 无入口）。viewport 1920×1080@1。列表 2 空格缩进。
