id: FUNC-00446
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00446
priority: P0
tier: B
title: 主流程-条件叠加与结果
entry_id: ent-search
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: click
    target: tab 高级筛选
  - action: wait
    timeout_ms: 800
expect:
  - note: 1、应用前可见已选条件计数
    assert: |-
      await page.keyboard.press('Escape');
      const main = page.locator('main').first();
      const editBtn = main.getByRole('button', { name: /编辑高级筛选/ }).first();
      if (await editBtn.isVisible().catch(() => false)) {
        await editBtn.click({ timeout: 10000 });
        await page.waitForTimeout(1000);
      }
      const fieldLib = page.getByRole('region', { name: '高级筛选字段库' });
      await expect(fieldLib).toBeVisible({ timeout: 15000 });
      const clearBtn = page.getByRole('button', { name: '清空条件' });
      if (await clearBtn.isVisible().catch(() => false)) {
        await clearBtn.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      }
      await fieldLib.getByText('企业所属地区', { exact: true }).first().click({ timeout: 10000 });
      await page.waitForTimeout(400);
      await fieldLib.getByText('请选择所属地区').first().click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const cascaderPanel = page.locator('.arco-cascader-panel').last();
      await expect(cascaderPanel).toBeVisible({ timeout: 8000 });
      await cascaderPanel.getByText('广东省', { exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await fieldLib.getByText('经营状态', { exact: true }).first().click({ timeout: 10000 });
      await page.waitForTimeout(400);
      const statusSelect = fieldLib.locator('.arco-select-view').last();
      await statusSelect.click({ timeout: 10000 });
      await page.waitForTimeout(500);
      const statusPop = page.locator('.arco-select-popup').last();
      await expect(statusPop).toBeVisible({ timeout: 8000 });
      await statusPop.getByText('在营', { exact: true }).first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page.getByRole('button', { name: /应用筛选\s*[（(]\s*[1-9]\d*\s*[）)]/ }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、应用后结果标题为高级筛选结果且含命中条数或明确空态
    assert: |-
      await page.getByRole('button', { name: /应用筛选/ }).first().click({ timeout: 10000 });
      await page.waitForTimeout(1500);
      const main = page.locator('main').first();
      await expect(main.getByText('高级筛选结果').first()).toBeVisible({ timeout: 20000 });
      const hit = main.getByText(/命中\s*\d+\s*家企业/);
      const empty = main.getByText('未命中结果');
      await expect(hit.or(empty)).toBeVisible({ timeout: 10000 });
  - note: 3、当前条件区含所设条件之一
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('当前条件').first()).toBeVisible({ timeout: 10000 });
      await expect(main.getByText(/广东省|在营|注销|迁出|吊销/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
