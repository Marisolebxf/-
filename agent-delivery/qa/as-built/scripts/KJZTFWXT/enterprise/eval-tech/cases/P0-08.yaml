id: P0-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00904
priority: P0
title: 勾选两家企业确定后对象区回填且预检门控可见
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
preconditions:
- 浮层可打开且对比篮≥2 家
steps:
- action: goto
  target: /enterprise/evaluation?workspace=technology&mode=technology
- action: evaluate
  note: 打开浮层勾选 2 家点确定
expect:
- note: 对象区回填已选企业条目
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('对比篮不足 2 家'); await sels.nth(0).click(); await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2500); await expect(page.getByText(/来自对比篮/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: '返回对比篮调整对象' })).toBeVisible({ timeout: 8000 })
- note: 地址追加所选企业参数与对比篮来源标记
  assert: await expect(page).toHaveURL(/enterprise_codes/); await expect(page).toHaveURL(/source=compare-basket/)
- note: 本环境预检失败后门控——「开始分析」保持禁用且可见预检未返回企业明细
  assert: |-
    const start = page.getByRole('button', { name: '开始分析' }); await page.waitForTimeout(500); if (!(await start.isDisabled())) throw new Error('预期预检失败后开始分析仍禁用'); const body = await page.locator('body').innerText(); if (!/预检未返回企业明细/.test(body)) throw new Error('未见预检失败文案')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  D3 偏差：用例期望回填后开始分析可用；env-gate fail 后本条断言 as-built 门控态（disabled+预检文案）。ticket=ENV-EVAL-TECH-PRECHECK-001。用例「恢复可用」待预检修复后再改回正向。
tier: B
