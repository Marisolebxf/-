id: FUNC-00914
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00914
priority: P0
title: 分析完成后自动转入结果态且地址视图参数切换
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 脚本内现场发起：对比篮回填至少 2 家企业后点击「开始分析」
  - 权重有效且「开始分析」可用（预检失败见 ENV-EVAL-TECH-PRECHECK-001）
locators:
  start: button「开始分析」
  processing: 技术力评估生成中 / 可视化分析过程
  result_title: 文本「技术力评估结果」
  score: 正文 \d+分
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 侧栏进评估页、入篮≥2、勾选 2 家确定→开始分析→等待完成；断言在 expect
expect:
  - note: 分析完成后地址视图参数为结果态（view=result + workspace=technology + task_id=EVAL-YYYYMMDD-NNN）；支持过程态轮询、当天指纹直达、超窗走最近评估兜底（附录 E E.5）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const main = page.locator('main');
        const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
        await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 15000 });
        const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
        const cardCount = await cards.count();
        if (cardCount < min) throw new Error('推荐企业卡不足 ' + min);
        for (let i = 0; n < min && i < cardCount; i++) {
          const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
          if (!(await btn.count()) || !(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min);
      };
      const gotoEvalTech = async () => {
        if (!page.url().includes('/enterprise-center/evaluation') || !page.url().includes('workspace=technology')) {
          if (!page.url().includes('/enterprise-center/overview')) {
            await page.goto(toUrl('/enterprise-center/overview'), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(600);
          }
          await closeBasket();
          const entryName = '企业技术力评估对比分析';
          const tryClick = async () => {
            const link = page.getByRole('link', { name: entryName, exact: true });
            if (await link.count()) { await link.first().click({ timeout: 8000 }); return true; }
            return false;
          };
          let clicked = await tryClick();
          if (!clicked) {
            const search = page.getByRole('link', { name: '企业查询', exact: true });
            if (await search.count()) { await search.first().click({ timeout: 8000 }); await page.waitForTimeout(500); clicked = await tryClick(); }
          }
          if (!clicked) throw new Error('侧栏未找到企业技术力评估对比分析入口');
          await page.waitForURL(/\/enterprise-center\/evaluation/, { timeout: 15000 });
          const u = page.url();
          if (u.includes('enterprise_codes')) {
            await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
          }
        }
        await closeBasket();
        await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 10000 });
        const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
        if (await curTab.count()) { await curTab.first().click({ timeout: 5000 }); await page.waitForTimeout(600); }
      };
      const openSelectOverlay = async () => {
        const main = page.locator('main');
        const body = await page.locator('body').innerText().catch(() => '');
        if (/技术力评估结果/.test(body) || page.url().includes('view=result')) {
          const adj = page.getByRole('button', { name: '调整配置' });
          if (await adj.count()) { await adj.first().click({ timeout: 8000 }); await page.waitForTimeout(1200); }
        }
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await emptyCta.count() && await emptyCta.first().isVisible().catch(() => false)) {
          await emptyCta.first().click({ timeout: 8000 });
          return;
        }
        const adjust = main.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        if (await adjust.count() && await adjust.first().isVisible().catch(() => false)) {
          await adjust.first().click({ timeout: 8000 });
          return;
        }
        const pickerQs = 'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2&compare_picker_max=50';
        await page.goto(toUrl(evalRoute + '&' + pickerQs), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const selectTwoAndStart = async () => {
        await ensureBasketEnterprises(2);
        await gotoEvalTech();
        await openSelectOverlay();
        await page.waitForTimeout(800);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
        const sels = page.locator('[aria-label^="选择 "]');
        if (await sels.count() < 2) throw new Error('浮层可选企业不足 2 家');
        await sels.nth(0).click();
        await sels.nth(1).click();
        const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
        await expect(confirm).toBeEnabled({ timeout: 8000 });
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(2500);
        await closeBasket();
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) throw new Error('回填后开始分析禁用（ticket=ENV-EVAL-TECH-PRECHECK-001）');
        await start.click();
      };
      const gotoViewResult = async (tid) => {
        const u = new URL(page.url());
        u.searchParams.set('view', 'result');
        u.searchParams.set('analysis_type', 'technology');
        u.searchParams.set('task_id', tid);
        if (!u.searchParams.get('workspace')) u.searchParams.set('workspace', 'technology');
        if (!u.searchParams.get('mode')) u.searchParams.set('mode', 'technology');
        await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2500);
      };
      const pollUntilResult = async (maxMs) => {
        let capturedTid = null;
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          const u = page.url();
          const m = u.match(/task_id=((?:DEMO-)?EVAL-\d{8}-\d+)/);
          if (m) capturedTid = m[1];
          const titleOk = await page.getByText('技术力评估结果').first().isVisible().catch(() => false);
          if (/view=result/.test(u) && titleOk) return { ok: true, tid: capturedTid };
          if (titleOk) return { ok: true, tid: capturedTid, inplace: true };
          await page.waitForTimeout(800);
        }
        return { ok: false, tid: capturedTid };
      };
      await selectTwoAndStart();
      let sawProcessing = false;
      const tClass = Date.now();
      while (Date.now() - tClass < 6000) {
        if (await page.getByText(/技术力评估生成中|可视化分析过程/).first().isVisible().catch(() => false)) { sawProcessing = true; break; }
        if (await page.getByText('技术力评估结果').first().isVisible().catch(() => false)) break;
        if (/view=result/.test(page.url())) break;
        await page.waitForTimeout(400);
      }
      try {
        await page.waitForURL(/view=result/, { timeout: sawProcessing ? 90000 : 45000 });
      } catch {}
      let poll = await pollUntilResult(sawProcessing ? 90000 : 45000);
      if (!poll.ok && poll.tid) {
        await gotoViewResult(poll.tid);
        poll = await pollUntilResult(20000);
      }
      if (!poll.ok) {
        const vBtn = page.getByRole('button', { name: /查看结果|稍后查看/ }).first();
        if (await vBtn.isVisible().catch(() => false)) {
          try { await vBtn.click({ timeout: 5000 }); await page.waitForTimeout(2000); } catch {}
        }
        poll = await pollUntilResult(20000);
      }
      if (!poll.ok || !(await page.getByText('技术力评估结果').first().isVisible().catch(() => false))) {
        throw new Error('分析任务完成后未见技术力评估结果区（URL=' + page.url() + '）');
      }
      if (!/view=result/.test(page.url()) && poll.tid) {
        await gotoViewResult(poll.tid);
      }
      const url = page.url();
      if (!/view=result/.test(url)) throw new Error('地址视图参数未切换为结果态：' + url);
      if (!/workspace=technology/.test(url)) throw new Error('URL 缺 workspace=technology：' + url);
      if (!/task_id=(?:DEMO-)?EVAL-\d{8}-\d+/.test(url)) throw new Error('结果态 URL 缺 task_id（含 DEMO-EVAL）：' + url);
      await expect(page.getByText('技术力评估结果').first()).toBeVisible({ timeout: 5000 });
  - note: 页面呈现技术力评估结果区且含得分呈现（数值不钉死）
    assert: |-
      await expect(page.getByText('技术力评估结果').first()).toBeVisible({ timeout: 15000 });
      await expect(page.locator('body').getByText(/\d+\s*分/).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  由 P0-13 重写为 FUNC-00914（30888）；路由 /enterprise-center/evaluation（深链 /enterprise/evaluation 404）；入篮与开浮层同 FUNC-00904。
  断言不复用 50892 硬编码 URL，origin 取自当前页。
  三分支：过程态轮询 / 当天指纹直达 view=result / 超窗最近评估或 task_id 深链（E.5）。慢态原地渲染仍 observed 红（URL 缺 view=result），与用例「地址视图参数变为结果态」一致。
  30888 task_id 常为 DEMO-EVAL-YYYYMMDD-NNNNNN（非仅 EVAL-NNN 三位后缀）。细项雷达/排名归 00915+；预检禁用按 D4 ticket=ENV-EVAL-TECH-PRECHECK-001。B 档零 allow_skip。
