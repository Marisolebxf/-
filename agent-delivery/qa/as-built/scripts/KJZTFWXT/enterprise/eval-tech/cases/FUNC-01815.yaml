id: FUNC-01815
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01815
priority: P1
title: 只回填一家企业时不能开始分析
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 对比篮至少有 1 家企业（脚本内可自补入篮）
locators:
  cta: button「多企业技术力对比分析」/「前往对比篮选择企业」
  confirm: button「确定」
  start: button「开始分析」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 浮层只勾选 1 家→确定；开始分析禁用与停留配置页判定在 expect
expect:
  - note: 1、「开始分析」为禁用
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const main = () => page.locator('main.app-main, main').first();
      const parseBasketCount = (text) => {
        const m = text.match(/来自对比篮\s*[·•]\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const recSection = page.locator('main section').filter({ hasText: '推荐企业' }).first();
        await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 15000 });
        const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
        const cardCount = await cards.count();
        if (cardCount < min) throw new Error('推荐企业卡不足 ' + min);
        for (let i = 0; n < min && i < cardCount; i++) {
          const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
          if (!(await btn.count()) || !(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const openSelectOverlay = async () => {
        const m = main();
        const cta = m.getByRole('button', { name: /多企业技术力对比分析|前往对比篮选择企业/ }).first();
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          return;
        }
        const adjust = m.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        if (await adjust.count() && await adjust.first().isVisible().catch(() => false)) {
          await adjust.first().click({ timeout: 8000 });
          return;
        }
        const pickerQs = 'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50';
        await page.goto(toUrl(evalRoute + '&' + pickerQs), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        if (await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false)) return;
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (await dockBtn.count()) {
          await dockBtn.click({ timeout: 10000 });
          await page.waitForTimeout(1000);
        }
      };
      const selectOneAndConfirm = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const adj = page.getByRole('button', { name: '调整配置' });
        if (await adj.count() && await adj.first().isVisible().catch(() => false)) {
          await adj.first().click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        }
        await openSelectOverlay();
        await page.waitForTimeout(800);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
        const sels = page.locator('[aria-label^="选择 "]');
        if (await sels.count() < 1) throw new Error('浮层可选企业不足 1 家');
        await sels.nth(0).click();
        await page.waitForTimeout(300);
        const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
        await expect(confirm).toBeEnabled({ timeout: 8000 });
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(3500);
        await closeBasket();
        const after = await main().innerText().catch(() => '');
        if (/暂未选择评估对象/.test(after)) throw new Error('确定后对象区仍为空态');
        const cnt = parseBasketCount(after);
        if (cnt !== null && cnt !== 1) throw new Error('应仅回填 1 家，当前来自对比篮 · ' + cnt + ' 家');
      };
      await ensureBasketEnterprises(1);
      await selectOneAndConfirm();
      const start = page.getByRole('button', { name: '开始分析' });
      await expect(start).toBeVisible({ timeout: 8000 });
      if (!(await start.isDisabled())) {
        const body = await page.locator('body').innerText().catch(() => '');
        if (/预检未返回企业明细/.test(body)) {
          throw new Error('开始分析未禁用但预检阻塞（与单家门槛叠加，ticket=ENV-EVAL-TECH-PRECHECK-001）');
        }
        throw new Error('仅回填 1 家时「开始分析」应为禁用');
      }
  - note: 2、页面仍停在当前分析（配置页，不进入过程/结果态）
    assert: |-
      const url = page.url();
      if (/view=processing/.test(url)) throw new Error('仅 1 家仍进入过程态：' + url);
      if (/view=result/.test(url)) throw new Error('仅 1 家仍进入结果态：' + url);
      await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 8000 });
      const main = page.locator('main.app-main, main').first();
      const t = await main.innerText().catch(() => '');
      if (/技术力评估结果/.test(t) && !/评估模板|数据覆盖与可信度/.test(t)) {
        throw new Error('页面似已切到结果态而非配置分析页');
      }
      const start = page.getByRole('button', { name: '开始分析' });
      if (!(await start.isDisabled())) throw new Error('配置页开始分析应保持禁用');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01815 异常·仅一家：浮层勾选 1 家→确定后「开始分析」禁用且不进入 view=processing/result。30888 路由 enterprise-center/evaluation；空态 CTA「多企业技术力对比分析」。家数读「来自对比篮 · N 家」应为 1。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。由 P0-17/00928 口径迁移至 FUNC-01815。
