id: FUNC-01803
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01803
priority: P0
title: 最近评估恢复结果打开该行技术力评估结果
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-tech
tier: B
preconditions:
  - 最近评估中有状态为已完成的记录（无则脚本真红 ticket=ENV-EVAL-TECH-HISTORY-001）
locators:
  recent_tab: tab「最近评估」
  restore_button: button「恢复结果」
  result_heading: 技术力评估结果
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 最近评估→记录该行任务 ID→点「恢复结果」；进入结果态与 task_id 一致断言在 expect
expect:
  - note: 1、进入「技术力评估结果」；2、任务 ID 与该行一致
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const taskIdFromUrl = () => {
        try {
          const tid = new URL(page.url()).searchParams.get('task_id');
          return tid ? decodeURIComponent(tid) : null;
        } catch { return null; }
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /技术力评估结果/.test(t) && /\d+\s*分/.test(t);
      };
      const waitResultBody = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await bodyResultReady()) return true;
          if (/view=result/.test(page.url()) && !(await bodyResultReady())) {
            const tid = taskIdFromUrl();
            if (tid && (Date.now() - t0) % 12000 < 1100) {
              await page.goto(toUrl(evalRoute + '&view=result&analysis_type=technology&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2000);
            }
          }
          await page.waitForTimeout(800);
        }
        return await bodyResultReady();
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const restore = main().getByRole('button', { name: '恢复结果' }).first();
      if (!(await restore.count()) || !(await restore.isVisible().catch(() => false))) {
        throw new Error('最近评估无已完成可「恢复结果」（ticket=ENV-EVAL-TECH-HISTORY-001）');
      }
      const row = restore.locator('xpath=ancestor::tr[1]');
      let rowText = (await row.count()) ? await row.innerText().catch(() => '') : '';
      if (!rowText || !TID_RE.test(rowText)) {
        rowText = await main().innerText().catch(() => '');
      }
      const tidM = rowText.match(TID_RE);
      if (!tidM) throw new Error('已完成行未见任务 ID（ticket=ENV-EVAL-TECH-HISTORY-001）');
      const expectedTid = tidM[0];
      await restore.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const tNav = Date.now();
      while (Date.now() - tNav < 45000 && !/view=result/.test(page.url())) {
        await page.waitForTimeout(500);
      }
      if (!(await waitResultBody(60000))) {
        throw new Error('恢复后未到技术力评估结果正文（ticket=ENV-EVAL-TECH-RESULT-SHELL-001）：' + page.url());
      }
      await expect(main().getByRole('heading', { name: '技术力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      const urlTid = taskIdFromUrl();
      if (!urlTid) throw new Error('恢复后 URL 缺 task_id：' + page.url());
      if (urlTid !== expectedTid) {
        const bodyTid = (TID_RE.exec(await main().innerText().catch(() => '')) || [])[0];
        if (bodyTid !== expectedTid && urlTid !== expectedTid) {
          throw new Error('任务 ID 不一致：行=' + expectedTid + ' url=' + urlTid + ' body=' + bodyTid);
        }
      }
      await expect(page).toHaveURL(new RegExp('task_id=' + encodeURIComponent(expectedTid).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01803 仅验「最近评估」已完成行「恢复结果」→技术力评估结果且 task_id 与该行一致（30888 路由 enterprise-center/evaluation）。不兜底现场发起（前置要求历史已完成）。空历史 ENV-EVAL-TECH-HISTORY-001；正文空壳 ENV-EVAL-TECH-RESULT-SHELL-001。B 档零 allow_skip。
