func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00924
priority: P1
title: 结果态重新分析发起新任务并回到过程态
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
preconditions:
  - 已处于结果态（脚本内：最近评估→恢复结果收口；禁无 analysis_fp 冷深链；发起链仅作兜底）
locators:
  restore: button「恢复结果」（最近评估 Tab）
  reanalyze: button「重新分析」
  processing: 技术力评估生成中 / 可视化分析过程
  task_id: task_id=EVAL-YYYYMMDD-NNN
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 先到结果态（优先最近评估→恢复结果），记录旧 task_id 后点「重新分析」，机检在 expect
expect:
  - note: 发起新任务且页面回到过程态
    assert: |-
      await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('button[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } const bodyRes = async () => { const t = await page.locator('body').innerText().catch(() => ''); return /技术力评估结果/.test(t) && /\d+\s*分/.test(t) }; const waitBody = async (ms) => { const t = Date.now(); while (Date.now() - t < ms) { if (await bodyRes()) return true; await page.waitForTimeout(1000) } return await bodyRes() }; let branch = null; const tab = page.getByRole('tab', { name: /最近评估/ }).first(); if (await tab.isVisible().catch(() => false)) { try { await tab.click({ timeout: 3000 }); await page.waitForTimeout(1500) } catch {} } const restore = page.getByRole('button', { name: '恢复结果' }); if ((await restore.count()) >= 1) { await restore.first().click({ timeout: 8000 }); if (await waitBody(60000)) branch = 'restore' } if (!(await bodyRes())) { await page.getByRole('tab', { name: /当前分析/ }).first().click({ timeout: 5000 }).catch(() => {}); await page.waitForTimeout(800); const open = page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象|返回对比篮/ }).first(); await open.click({ timeout: 8000 }); const sels = page.locator('[aria-label^="选择 "]'); await sels.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {}); await page.waitForTimeout(800); if ((await sels.count()) < 2) throw new Error('结果态不可达且可选企业不足（ticket=ENV-EVAL-TECH-PRECHECK-001）'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(500); const okBtn = page.getByRole('button', { name: '确定' }).first(); await okBtn.scrollIntoViewIfNeeded().catch(() => {}); try { await okBtn.click({ timeout: 5000 }) } catch { try { await okBtn.click({ force: true, timeout: 5000 }) } catch { await okBtn.evaluate((el) => el.click()) } } await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('回填后开始分析禁用（预检复发？ticket=ENV-EVAL-TECH-PRECHECK-001）'); await start.click(); const t0 = Date.now(); while (Date.now() - t0 < 5000) { if (/view=result/.test(page.url())) { branch = 'result'; break } if (await page.getByText(/技术力评估生成中|可视化分析过程/).first().isVisible().catch(() => false)) { branch = 'processing'; break } await page.waitForTimeout(300) } if (!(await bodyRes())) { const t1 = Date.now(); while (Date.now() - t1 < 90000) { if (/view=result/.test(page.url())) branch = 'result'; if (await bodyRes()) { branch = branch || 'inplace'; break } await page.waitForTimeout(1000) } } if (!(await bodyRes()) && /view=result/.test(page.url()) && /analysis_fp=/.test(page.url())) { await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); if (await waitBody(60000)) branch = 'reload_fp' } if (!(await bodyRes())) { await page.getByRole('tab', { name: /最近评估/ }).first().click({ timeout: 5000 }).catch(() => {}); await page.waitForTimeout(1500); if ((await restore.count()) < 1) throw new Error('结果内容未呈现且无「恢复结果」（branch=' + branch + '，ticket=ENV-EVAL-TECH-RESULT-SHELL-001）：' + page.url()); await restore.first().click({ timeout: 8000 }); if (!(await waitBody(60000))) throw new Error('恢复结果后仍无结果正文（ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）'); branch = 'restore2' } } if (!(await bodyRes())) throw new Error('未达结果态（branch=' + branch + '，ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）'); const prevTid = (page.url().match(/task_id=(EVAL-\d{8}-\d{3})/) || [])[1]; if (!prevTid) throw new Error('结果态 URL 缺旧 task_id：' + page.url()); const reBtn = page.getByRole('button', { name: '重新分析' }); await expect(reBtn.first()).toBeVisible({ timeout: 10000 }); await expect(reBtn.first()).toBeEnabled(); await page.waitForTimeout(800); try { await reBtn.first().click({ timeout: 8000 }) } catch { await reBtn.first().click({ force: true, timeout: 8000 }) } let hit = false; let newTid = null; const t2 = Date.now(); let retried = false; while (Date.now() - t2 < 90000) { const u = page.url(); const t = await page.locator('body').innerText().catch(() => ''); newTid = (u.match(/task_id=(EVAL-\d{8}-\d{3})/) || [])[1] || null; if (/预检未返回企业明细/.test(t)) throw new Error('重新分析后预检阻塞（ticket=ENV-EVAL-TECH-PRECHECK-001，URL=' + u + '）'); if (/view=processing/.test(u) || /技术力评估生成中|可视化分析过程/.test(t)) { hit = true; break } if (!retried && Date.now() - t2 > 8000 && /view=result/.test(u) && newTid === prevTid) { const again = page.getByRole('button', { name: '重新分析' }); if (await again.count()) { try { await again.first().click({ timeout: 5000 }) } catch { try { await again.first().click({ force: true, timeout: 5000 }) } catch {} } } retried = true } await page.waitForTimeout(500) } if (!hit) throw new Error('点重新分析后 90s 未回过程态（旧 tid=' + prevTid + '，retried=' + retried + '，URL=' + page.url() + '）'); await expect(page.getByText(/技术力评估生成中|可视化分析过程/).first()).toBeVisible({ timeout: 8000 }); if (!/view=processing/.test(page.url())) throw new Error('过程态 URL 缺 view=processing：' + page.url()); if (!/workspace=technology/.test(page.url())) throw new Error('过程态 URL 缺 workspace=technology：' + page.url()); newTid = (page.url().match(/task_id=(EVAL-\d{8}-\d{3})/) || [])[1] || newTid; if (!newTid) { const body = await page.locator('body').innerText().catch(() => ''); newTid = (body.match(/任务\s*ID[：:\s]*(EVAL-\d{8}-\d{3})/) || [])[1] || null } if (!newTid) throw new Error('过程态未见新 task_id（旧=' + prevTid + '，URL=' + page.url() + '）'); if (newTid === prevTid) throw new Error('过程态 task_id 未变化仍为 ' + prevTid + '：' + page.url()); globalThis.__p020 = { prevTid: prevTid, newTid: newTid, url: page.url() }
  - note: 新任务标识与前一任务不同
    assert: |-
      const s = globalThis.__p020; if (!s || !s.prevTid || !s.newTid) throw new Error('缺 expect1 落盘的 tid 对：' + JSON.stringify(s || null)); if (s.newTid === s.prevTid) throw new Error('新任务标识未变化仍为 ' + s.prevTid + '：' + s.url)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  实勘（2026-10-15T12:35Z / 12:41Z 无头 fixtures/scout/probe-p020.json + probe-p020b.json + probe-p020-after-reanalyze.png）：
  ①路径：最近评估→恢复结果出「技术力评估结果」+\d+分；button「重新分析」可见可点（count=1, enabled）。
  ②点后约 2~3s URL → view=processing&task_id=新 EVAL-…；正文「技术力评估生成中」+「可视化分析过程」；离开 view=result。
  ③新 tid ≠ 旧 tid（实勘 004→005、007→008）；同飞/单飞约束本条不越界断言（用例册备注）。
  ④自检加固：过程态轮询 90s；8s 仍停旧 result 则强制重点一次；tid 对在 expect1 落盘，expect2 只核捕获值（避免跨 expect 竞态）。
  ⑤编号：用例册回填列曾写 P1-09；本波 GAP 派单落盘 id=P0-20（coverage 备注；未改用例册）。
  ⑥闸门：env-gate overall=fail（配置态开始分析预检），本条主路径走历史「恢复结果」后再点重新分析（method-patch §3 闸门 5 + 独立实勘确认过程态可达）；发起链仅兜底，预检复发 throw ticket=ENV-EVAL-TECH-PRECHECK-001；空壳真红 ENV-EVAL-TECH-RESULT-SHELL-001。零 allow_skip，不假绿；不进 gold。
  ⑦边界：调整配置返回归 00923/P0-19；过程态取消/稍后查看归 00925/00926（仍不自动化）。
  格式：列表 2 空格缩进；assert 单行 |-，禁折叠块。
