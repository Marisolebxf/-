id: FUNC-00911
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00911
priority: P0
title: 一键平均分配将已选指标权重均分且和保持 100
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-tech
tier: B
preconditions:
  - 已带入至少 2 家企业
  - 5 项指标全选且权重为非均分状态（默认模板 20/25/20/15/20）
locators:
  avg_button: button「一键平均分配」
  metric_checkbox: label.arco-checkbox 含指标名
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 侧栏进页、对比篮≥2 并回填 2 家；一键均分与取消勾选组合断言在 expect
expect:
  - note: 5 项全选时均分后各项权重为 20，且权重合计为 100
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const main = page.locator('main');
        const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
        await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 15000 });
        const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
        const cardCount = await cards.count();
        if (cardCount < min) throw new Error('推荐企业卡不足 ' + min);
        for (let i = 0; n < min && i < cardCount; i++) {
          const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
          if (!(await btn.count()) || !(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const gotoEvalTechEmpty = async () => {
        if (!page.url().includes('/enterprise-center/overview')) {
          await page.goto(toUrl('/enterprise-center/overview'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(600);
        }
        await closeBasket();
        const entryName = '企业技术力评估对比分析';
        const tryClick = async () => {
          const link = page.getByRole('link', { name: entryName, exact: true });
          if (await link.count()) { await link.first().click({ timeout: 8000 }); return true; }
          return false;
        };
        let clicked = await tryClick();
        if (!clicked) {
          const search = page.getByRole('link', { name: '企业查询', exact: true });
          if (await search.count()) { await search.first().click({ timeout: 8000 }); await page.waitForTimeout(500); clicked = await tryClick(); }
        }
        if (!clicked) throw new Error('侧栏未找到企业技术力评估对比分析入口');
        await page.waitForURL(/\/enterprise-center\/evaluation/, { timeout: 15000 });
        const u = page.url();
        if (u.includes('enterprise_codes')) {
          await page.goto(toUrl('/enterprise-center/evaluation?workspace=technology&mode=technology'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
        }
        await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 10000 });
      };
      const ensureConfigEmpty = async () => {
        const main = page.locator('main');
        for (let i = 0; i < 4; i++) {
          const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
          if (await emptyCta.count() && await emptyCta.first().isVisible().catch(() => false)) return;
          const body = await page.locator('body').innerText().catch(() => '');
          if (/技术力评估结果/.test(body) || page.url().includes('view=result')) {
            const adj = page.getByRole('button', { name: '调整配置' });
            if (await adj.count()) { await adj.first().click({ timeout: 8000 }); await page.waitForTimeout(1200); continue; }
          }
          const tab = page.getByRole('tab', { name: /当前分析/ }).first();
          if (await tab.isVisible().catch(() => false)) { await tab.click({ timeout: 5000 }); await page.waitForTimeout(800); }
          if (/来自对比篮/.test(body) && !/请先在对比篮选择企业/.test(body)) {
            await gotoEvalTechEmpty();
            await page.waitForTimeout(600);
            continue;
          }
          break;
        }
      };
      const openSelectOverlay = async () => {
        const main = page.locator('main');
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await emptyCta.count() && await emptyCta.first().isVisible().catch(() => false)) {
          await emptyCta.first().scrollIntoViewIfNeeded().catch(() => {});
          await emptyCta.first().click({ timeout: 8000 });
          return;
        }
        const adjust = main.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        if (await adjust.count() && await adjust.first().isVisible().catch(() => false)) {
          await adjust.first().click({ timeout: 8000 });
          return;
        }
        const pickerQs = 'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2&compare_picker_max=50';
        await page.goto(toUrl(`/enterprise-center/evaluation?workspace=technology&mode=technology&${pickerQs}`), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        if (await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false)) return;
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        await expect(dockBtn).toBeVisible({ timeout: 10000 });
        await dockBtn.click({ timeout: 10000 });
        await page.waitForTimeout(1000);
      };
      const ensureTwoEnterprisesFilled = async () => {
        const mainText = await page.locator('main').innerText().catch(() => '');
        if (/来自对比篮/.test(mainText) && !/请先在对比篮选择企业/.test(mainText) && !/暂未选择评估对象/.test(mainText)) return;
        await openSelectOverlay();
        await page.waitForTimeout(1000);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
        const sels = page.locator('[aria-label^="选择 "]');
        if (await sels.count() < 2) throw new Error('浮层可选企业不足 2 家');
        await sels.nth(0).click();
        await page.waitForTimeout(200);
        await sels.nth(1).click();
        await page.waitForTimeout(300);
        const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
        await expect(confirm).toBeEnabled({ timeout: 8000 });
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await closeBasket();
      };
      const metricWeightInputs = () =>
        page.locator('table tbody tr').filter({ has: page.locator('.arco-checkbox-checked') }).locator('.arco-input-number input');
      const readWeights = async () => {
        const spins = metricWeightInputs();
        const n = await spins.count();
        const vals = [];
        for (let i = 0; i < n; i++) vals.push(Number(await spins.nth(i).inputValue()));
        return vals;
      };
      await ensureBasketEnterprises(2);
      await gotoEvalTechEmpty();
      await closeBasket();
      await ensureConfigEmpty();
      await closeBasket();
      await ensureTwoEnterprisesFilled();
      const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
      if (await curTab.count()) { await curTab.first().click({ timeout: 5000 }); await page.waitForTimeout(600); }
      await expect(metricWeightInputs()).toHaveCount(5, { timeout: 10000 });
      const before = await readWeights();
      if (before.join(',') !== '20,25,20,15,20') throw new Error('前置非均分权重异常: ' + before.join('/'));
      await page.getByRole('button', { name: '一键平均分配', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const after1 = await readWeights();
      if (after1.length !== 5 || after1.some((v) => v !== 20)) throw new Error('五维均分期望全 20，实见 ' + after1.join('/'));
      const sum1 = after1.reduce((a, b) => a + b, 0);
      if (sum1 !== 100) throw new Error('首次均分后权重和 ' + sum1);
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
  - note: 取消 1 项后均分各项为 25
    assert: |-
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const metricRowCb = (name) =>
        page.locator('table tbody tr').filter({ hasText: name }).locator('label.arco-checkbox').first();
      const metricWeightInputs = () =>
        page.locator('table tbody tr').filter({ has: page.locator('.arco-checkbox-checked') }).locator('.arco-input-number input');
      const readWeights = async () => {
        const spins = metricWeightInputs();
        const n = await spins.count();
        const vals = [];
        for (let i = 0; i < n; i++) vals.push(Number(await spins.nth(i).inputValue()));
        return vals;
      };
      await closeBasket();
      const coopCb = metricRowCb('技术合作');
      await coopCb.scrollIntoViewIfNeeded().catch(() => {});
      await expect(coopCb).toBeVisible({ timeout: 10000 });
      await coopCb.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const checked = await coopCb.locator('input[type=checkbox]').isChecked().catch(() => true);
      if (checked) throw new Error('技术合作取消勾选失败');
      await page.getByRole('button', { name: '一键平均分配', exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const after2 = await readWeights();
      if (after2.length !== 4 || after2.some((v) => v !== 25)) throw new Error('四维均分期望全 25，实见 ' + after2.join('/'));
  - note: 两次均分后权重和均为 100
    assert: |-
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      await closeBasket();
      const metricWeightInputs = () =>
        page.locator('table tbody tr').filter({ has: page.locator('.arco-checkbox-checked') }).locator('.arco-input-number input');
      const vals = [];
      const spins = metricWeightInputs();
      const n = await spins.count();
      for (let i = 0; i < n; i++) vals.push(Number(await spins.nth(i).inputValue()));
      const sum = vals.reduce((a, b) => a + b, 0);
      if (sum !== 100) throw new Error('第二次均分后权重和 ' + sum + '，各项 ' + vals.join('/'));
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  前置 2 家企业与 FUNC-00904 同路径（ensureConfigEmpty + picker 回填）。默认权重非均分 20/25/20/15/20（FUNC-00908）；取消勾选指标为「技术合作」（同 FUNC-00909）。权重读数限定 .arco-checkbox-checked 行。由 P0-12 重写为 FUNC-00911；禁止 50892 旧 URL。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
