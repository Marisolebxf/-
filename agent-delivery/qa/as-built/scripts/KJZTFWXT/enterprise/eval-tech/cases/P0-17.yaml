id: P0-17
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00928
priority: P0
title: 仅一家企业时开始分析被拦截
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
preconditions:
- 对比篮≥1 家
expect:
- note: 「开始分析」被拦截且无任务发起
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('对比篮无企业'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500); const start = page.getByRole('button', { name: '开始分析' }); if (!(await start.isDisabled())) { await start.click(); await page.waitForTimeout(1000) }; if (page.url().includes('view=processing')) throw new Error('仅 1 家仍进入过程态')
- note: 拦截表现为禁用或至少两家门槛提示
  assert: |-
    const t = await page.locator('body').innerText(); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) { /* 禁用即拦截 */ } else if (!/(至少|两家|2)/.test(t)) throw new Error('无两家门槛提示')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 本环境预检亦会使开始分析禁用；单家场景以不进入 view=processing 为准。
tier: B
