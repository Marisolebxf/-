id: FUNC-01792
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01792
priority: P0
title: 雷达对比对象 A 下拉选项数等于本次结果企业数
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 已打开至少两家企业的技术力评估结果（脚本内：最近评估→恢复结果；兜底对比篮发起分析）
locators:
  radar_title: 技术力多维雷达对比
  obj_a_label: 对比对象 A
  result_object_count: 对象：N 家
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 进入结果态后展开雷达左侧对比对象 A 下拉；选项数与结果企业数比对在 expect
expect:
  - note: 1、选项个数等于本次结果的企业数
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyResultReady = async () => {
        const t = await page.locator('body').innerText().catch(() => '');
        return /技术力评估结果/.test(t) && /\d+\s*分/.test(t) && /对比对象 A/.test(t);
      };
      const waitBody = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await bodyResultReady()) return true;
          await page.waitForTimeout(1000);
        }
        return await bodyResultReady();
      };
      const tryRestoreButtons = async () => {
        const restores = page.getByRole('button', { name: '恢复结果' });
        const n = await restores.count();
        for (let i = 0; i < n; i++) {
          await restores.nth(i).click({ timeout: 8000 });
          if (await waitBody(45000)) return true;
          const tab = page.getByRole('tab', { name: /最近评估/ }).first();
          if (await tab.isVisible().catch(() => false)) {
            await tab.click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(1200);
          }
        }
        return false;
      };
      const recoverFromRecentTab = async () => {
        const tab = page.getByRole('tab', { name: /最近评估/ }).first();
        if (!(await tab.isVisible().catch(() => false))) return false;
        await tab.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(1500);
        if (await tryRestoreButtons()) return true;
        const body = await page.locator('body').innerText().catch(() => '');
        const ids = [...body.matchAll(/EVAL-\d{8}-\d{3}/g)].map((m) => m[0]);
        for (const candidate of [...new Set(ids)]) {
          await page.goto(toUrl(evalRoute + '&view=result&analysis_type=technology&task_id=' + candidate), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
          if (await waitBody(45000)) return true;
        }
        return false;
      };
      const ensureResultState = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        if (await bodyResultReady()) return;
        const tab0 = page.getByRole('tab', { name: /最近评估/ }).first();
        if (await tab0.isVisible().catch(() => false)) {
          await tab0.click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(1500);
        }
        if (await tryRestoreButtons()) return;
        if (await recoverFromRecentTab()) return;
        throw new Error('未达含雷达对比对象的结果态（ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）');
      };
      const mainText = async () => await page.locator('main').innerText().catch(() => '');
      const parseResultEnterpriseCount = async () => {
        const t = await mainText();
        let m = t.match(/对象[：:]\s*(\d+)\s*家/);
        if (m) return parseInt(m[1], 10);
        m = t.match(/纳入评价企业[\s\S]{0,24}?(\d+)\s*家/);
        if (m) return parseInt(m[1], 10);
        const tag = page.locator('main').getByText(/\d+\s*家企业/).first();
        if (await tag.count()) {
          const tx = (await tag.innerText()) || '';
          const tm = tx.match(/(\d+)\s*家/);
          if (tm) return parseInt(tm[1], 10);
        }
        throw new Error('无法解析本次结果企业数');
      };
      const findRadarBlock = async () => {
        const main = page.locator('main');
        let objVisible = false;
        for (let i = 0; i < 45 && !objVisible; i++) {
          const el = main.getByText('对比对象 A', { exact: true }).first();
          if (await el.count() && await el.isVisible().catch(() => false)) { objVisible = true; break; }
          await page.mouse.wheel(0, 500);
          await page.waitForTimeout(500);
        }
        if (!objVisible) {
          const t = await main.innerText().catch(() => '');
          throw new Error('滚动后未见「对比对象 A」（可能结果仅 1 家企业无下拉）：' + t.slice(0, 120));
        }
        return main.locator('section, div').filter({ has: page.getByText('对比对象 A', { exact: true }) }).first();
      };
      await ensureResultState();
      await expect(page.getByRole('heading', { name: '技术力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      const entN = await parseResultEnterpriseCount();
      if (entN < 2) throw new Error('结果企业数不足 2：' + entN);
      const radarBlk = await findRadarBlock();
      await radarBlk.scrollIntoViewIfNeeded();
      await expect(radarBlk.getByText('对比对象 A', { exact: true })).toBeVisible({ timeout: 10000 });
      const objARow = radarBlk.locator('div').filter({ has: radarBlk.getByText('对比对象 A', { exact: true }) }).first();
      const selectA = objARow.locator('.arco-select-view').first();
      if (!(await selectA.count())) {
        const allInBlk = radarBlk.locator('.arco-select-view');
        if (await allInBlk.count() < 1) throw new Error('雷达区块未见 Arco Select');
        await allInBlk.first().click({ timeout: 8000 });
      } else {
        await selectA.click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      const pop = page.locator('.arco-trigger-popup:visible, .arco-select-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const options = pop.locator('.arco-select-option, li[role="option"]');
      const optCount = await options.count();
      if (optCount !== entN) {
        const names = (await options.allTextContents()).map((s) => s.trim()).filter(Boolean);
        throw new Error('对比对象 A 选项数 ' + optCount + ' ≠ 结果企业数 ' + entN + '；选项：' + names.join('、'));
      }
      await page.keyboard.press('Escape');
      await page.waitForTimeout(300);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01792 验雷达「对比对象 A」Arco Select 选项数 = 结果抬头「对象：N 家」（回退纳入评价企业/排名区 Tag）。选项含 disabled（当前对象 B）仍计入个数。结果态入口同 FUNC-01790（最近评估→恢复结果；DEMO task_id 深链空壳 ticket=ENV-EVAL-TECH-RESULT-SHELL-001）。B 档零 allow_skip。
