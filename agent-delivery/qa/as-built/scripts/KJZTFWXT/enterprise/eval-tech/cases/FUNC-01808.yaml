id: FUNC-01808
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01808
priority: P1
tier: B
title: 已取消记录不能打开 HTML 报告
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 点击「最近评估」Tab
    script: |-
      const tabs = page.locator('.enterprise-center-primary-tabs');
      const historyTab = tabs.getByText('最近评估', { exact: true });
      await expect(historyTab).toBeVisible({ timeout: 15000 });
      await historyTab.click({ timeout: 8000 });
      await expect(page.locator('main.diagnosis-main table')).toBeVisible({ timeout: 15000 });
      await page.waitForTimeout(500);
expect:
  - note: 1、该行「查看 HTML 报告」为禁用
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const pickCancelledRowBtn = async () => {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = await row.innerText().catch(() => '');
          if (!/已取消/.test(rowText)) continue;
          const htmlBtn = row.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
          if (await htmlBtn.count()) return htmlBtn;
        }
        return null;
      };
      let htmlBtn = await pickCancelledRowBtn();
      if (!htmlBtn) {
        const pag = main().locator('.arco-pagination');
        for (let guard = 0; guard < 15 && !htmlBtn; guard++) {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          const ok = await next.click({ timeout: 5000 }).then(() => true).catch(() => false);
          if (!ok) break;
          await page.waitForTimeout(1000);
          htmlBtn = await pickCancelledRowBtn();
        }
      }
      if (!htmlBtn) {
        throw new Error('最近评估无状态为已取消的记录（ticket=ENV-EVAL-TECH-HISTORY-CANCELLED-001）');
      }
      await htmlBtn.scrollIntoViewIfNeeded().catch(() => {});
      await expect(htmlBtn).toBeVisible({ timeout: 10000 });
      await expect(htmlBtn).toBeDisabled();
on_fail: 截图 + 抄 X-Trace-Id
