id: FUNC-01823
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01823
priority: P0
title: 指标与权重表列出附录F全部7列表头
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 已进入当前分析
locators:
  metrics_section: 指标与权重
  metric_table: 含「指标名称」表头的指标与权重表
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 当前分析→滚动到指标与权重表；七列表头断言在 expect
expect:
  - note: 1、表头共 7 列（列名见附录F）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const EXPECT_HEADERS = [
        '选择',
        '指标名称',
        '分组 / 维度',
        '数据状态',
        '权重',
        '数据来源',
        '指标说明',
      ];
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const ensureCurrentAnalysisTab = async () => {
        const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
        if (await curTab.count()) {
          await curTab.first().click({ timeout: 5000 });
          await page.waitForTimeout(600);
          await expect(curTab.first()).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
        }
      };
      const scrollToMetricsTable = async () => {
        const main = page.locator('main');
        for (let i = 0; i < 40; i++) {
          const table = page.locator('.arco-table').filter({ has: page.getByText('指标名称', { exact: true }) }).first();
          if (await table.count() && await table.isVisible().catch(() => false)) {
            await table.scrollIntoViewIfNeeded().catch(() => {});
            await page.waitForTimeout(300);
            return;
          }
          const hint = page.getByText('指标与权重').first();
          if (await hint.count() && await hint.isVisible().catch(() => false)) {
            await hint.scrollIntoViewIfNeeded().catch(() => {});
          }
          await main.evaluate((el) => { el.scrollTop += 400; }).catch(() => page.mouse.wheel(0, 500));
          await page.waitForTimeout(350);
        }
        throw new Error('滚动后未见指标与权重表（指标名称表头）');
      };
      const readMetricsTableHeaders = async () => {
        return await page.evaluate((expected) => {
          const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
          const matchRow = (headers) => {
            if (!headers || headers.length !== 7) return null;
            for (let i = 0; i < 7; i++) {
              if (headers[i] !== expected[i]) return null;
            }
            return headers;
          };
          const tables = [...document.querySelectorAll('table, .arco-table')];
          for (const table of tables) {
            if (!table.innerText.includes('指标名称') || !table.innerText.includes('技术人才')) continue;
            const headRow = table.querySelector('thead tr') || table.querySelector('.arco-table-header .arco-table-tr') || table.querySelector('.arco-table-tr');
            if (!headRow) continue;
            const cells = [...headRow.querySelectorAll('th, .arco-table-th')].map((c) => norm(c.innerText)).filter(Boolean);
            if (cells.length < 7) continue;
            const matched = matchRow(cells.slice(0, 7));
            if (matched) return { ok: true, headers: matched, via: 'table' };
          }
          const body = document.body.innerText || '';
          const anchor = body.indexOf('指标与权重');
          const slice = anchor >= 0 ? body.slice(anchor, anchor + 420) : body;
          const seg = slice.split(/\n|\t/).map(norm).filter(Boolean);
          const startIdx = seg.indexOf('选择');
          if (startIdx >= 0) {
            const matched = matchRow(seg.slice(startIdx, startIdx + 7));
            if (matched) return { ok: true, headers: matched, via: 'text_proxy' };
          }
          for (let start = 0; start < seg.length; start++) {
            if (seg[start] !== '选择') continue;
            const matched = matchRow(seg.slice(start, start + 7));
            if (matched) return { ok: true, headers: matched, via: 'text_proxy_scan' };
          }
          return { ok: false, reason: '未找到七列表头', seg: seg.slice(0, 18) };
        }, EXPECT_HEADERS);
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 15000 });
      await ensureCurrentAnalysisTab();
      await scrollToMetricsTable();
      await expect(page.getByText('指标名称', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      const hdr = await readMetricsTableHeaders();
      if (!hdr || !hdr.ok) throw new Error('指标与权重表头读取失败: ' + JSON.stringify(hdr));
      if (hdr.headers.length !== 7) throw new Error('表头列数非7: ' + JSON.stringify(hdr.headers));
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  FUNC-01823 主流程-指标列；仅验配置区指标与权重表附录F七列表头（不验行数据/权重值）。30888 深链 /enterprise-center/evaluation?workspace=technology&mode=technology；区块现场文案「技术力模型构建与参数自定义」+「指标与权重」，以表头「指标名称」定位表。scout 与附录F列名一致。B 档零 allow_skip。
