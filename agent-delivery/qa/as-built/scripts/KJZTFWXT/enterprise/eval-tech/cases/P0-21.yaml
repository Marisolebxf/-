    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('button[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } const bodyRes = async () => { const t = await page.locator('body').innerText().catch(() => ''); return /技术力评估结果/.test(t) && /\d+\s*分/.test(t) }; const waitBody = async (ms) => { const t = Date.now(); while (Date.now() - t < ms) { if (await bodyRes()) return true; await page.waitForTimeout(1000) } return await bodyRes() }; const waitCancel = async (ms) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { const cancel = page.getByRole('button', { name: /取消任务/ }); if ((await cancel.count()) && (await cancel.first().isVisible().catch(() => false)) && (await cancel.first().isEnabled().catch(() => false))) return cancel.first(); const t = await page.locator('body').innerText().catch(() => ''); if (/当前评估任务不存在或已失效/.test(t) && /view=processing/.test(page.url())) throw new Error('过程态空壳「任务不存在或已失效」且无取消任务（ticket=ENV-EVAL-TECH-PROCESS-WINDOW-001，URL=' + page.url() + '）'); if (/view=result/.test(page.url()) && /技术力评估结果/.test(t) && !(await page.getByText(/技术力评估生成中|可视化分析过程/).first().isVisible().catch(() => false))) return null; await page.waitForTimeout(120) } return null }; let branch = null; const tab = page.getByRole('tab', { name: /最近评估/ }).first(); if (await tab.isVisible().catch(() => false)) { try { await tab.click({ timeout: 3000 }); await page.waitForTimeout(1500) } catch {} } const restore = page.getByRole('button', { name: '恢复结果' }); if ((await restore.count()) >= 1) { await restore.first().click({ timeout: 8000 }); if (await waitBody(60000)) branch = 'restore' } if (!(await bodyRes())) { await page.getByRole('tab', { name: /当前分析/ }).first().click({ timeout: 5000 }).catch(() => {}); await page.waitForTimeout(800); const open = page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象|返回对比篮/ }).first(); if (!(await open.isVisible().catch(() => false))) throw new Error('无历史恢复结果且无对象入口（ticket=ENV-EVAL-TECH-PROCESS-WINDOW-001）'); await open.click({ timeout: 8000 }); const sels = page.locator('[aria-label^="选择 "]'); await sels.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {}); await page.waitForTimeout(800); if ((await sels.count()) < 2) throw new Error('结果态不可达且可选企业不足（ticket=ENV-EVAL-TECH-PRECHECK-001）'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(500); const okBtn = page.getByRole('button', { name: '确定' }).first(); await okBtn.scrollIntoViewIfNeeded().catch(() => {}); try { await okBtn.click({ timeout: 5000 }) } catch { try { await okBtn.click({ force: true, timeout: 5000 }) } catch { await okBtn.evaluate((el) => el.click()) } } await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('回填后开始分析禁用（ticket=ENV-EVAL-TECH-PRECHECK-001）'); await start.click(); branch = 'start'; const c0 = await waitCancel(25000); if (c0) { await c0.click({ timeout: 8000 }); await page.waitForTimeout(1500); if (/view=processing/.test(page.url()) || await page.getByText(/技术力评估生成中|可视化分析过程/).first().isVisible().catch(() => false)) throw new Error('取消后仍停留过程态：' + page.url()); globalThis.__p021_cancelled = true; return } if (!(await bodyRes())) { const t1 = Date.now(); while (Date.now() - t1 < 60000) { if (await bodyRes()) break; await page.waitForTimeout(1000) } } } if (!(await bodyRes())) throw new Error('未达结果态无法经重新分析进过程态（branch=' + branch + '，ticket=ENV-EVAL-TECH-PROCESS-WINDOW-001，URL=' + page.url() + '）'); const reBtn = page.getByRole('button', { name: '重新分析' }); await expect(reBtn.first()).toBeVisible({ timeout: 10000 }); await expect(reBtn.first()).toBeEnabled(); await reBtn.first().click({ timeout: 8000 }); branch = 'reanalyze'; const c1 = await waitCancel(30000); if (!c1) throw new Error('重新分析后 30s 未见可点「取消任务」（当天复用/瞬时完成/过程空壳？ticket=ENV-EVAL-TECH-PROCESS-WINDOW-001，URL=' + page.url() + '）'); await c1.click({ timeout: 8000 }); await page.waitForTimeout(1500); const tEnd = Date.now(); while (Date.now() - tEnd < 12000) { if (!/view=processing/.test(page.url()) && !(await page.getByText(/技术力评估生成中|可视化分析过程/).first().isVisible().catch(() => false))) break; await page.waitForTimeout(400) } if (/view=processing/.test(page.url()) || await page.getByText(/技术力评估生成中|可视化分析过程/).first().isVisible().catch(() => false)) throw new Error('取消后仍停留过程态：' + page.url()); globalThis.__p021_cancelled = true
  - note: 已回填对象与权重配置不被清空
    assert: |-
      if (!globalThis.__p021_cancelled) throw new Error('前置未完成取消（ticket=ENV-EVAL-TECH-PROCESS-WINDOW-001）'); await expect(page.getByText(/评估对象|来自对比篮|返回对比篮/).first()).toBeVisible({ timeout: 10000 }); const spin = page.locator('[role=spinbutton]'); if ((await spin.count()) < 1) throw new Error('取消后权重 spinbutton 缺失（配置被清空？）URL=' + page.url()); await expect(spin.first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 })
