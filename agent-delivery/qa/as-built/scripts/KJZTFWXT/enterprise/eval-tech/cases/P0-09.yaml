id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00913
priority: P0
title: 点击开始分析后进入过程态且任务标识正确
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
preconditions:
  - 已带入至少 2 家企业
  - 权重配置有效且「开始分析」可用（2026-10-15 复测 enabled；若预检复发见 as_built_note 回退）
locators:
  start: button「开始分析」
  processing: 技术力评估生成中 / 可视化分析过程
  result: 文本「技术力评估结果」+ task_id=EVAL-YYYYMMDD-NNN
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 浮层勾选 2 家确定回填；点开始分析后双分支判定（过程态 / 瞬时直达结果态），机检在 expect
expect:
  - note: 点击开始分析后双分支——甲：≤5s 出现过程态元素（技术力评估生成中标题 / 可视化分析过程区块 / 取消任务·稍后查看·打开我的任务入口）→ 逐项断言 + view=processing + workspace=technology + 任务标识 EVAL-YYYYMMDD-NNN；乙：瞬时直达 view=result → 断言 URL 含 view=result + task_id=EVAL-YYYYMMDD-NNN + 技术力结果壳可见；两分支均未命中才判失败
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('button[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } const open = page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first(); await open.click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); const n = await sels.count(); if (n < 2) throw new Error('可选企业不足'); await sels.nth(0).click(); await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 }); await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) { throw new Error('回填后开始分析禁用（预检复发？ticket=ENV-EVAL-TECH-PRECHECK-001）') }; await start.click(); let branch = null; const t0 = Date.now(); while (Date.now() - t0 < 5000) { const procEl = page.getByText(/技术力评估生成中|可视化分析过程/).first(); if (await procEl.isVisible().catch(() => false)) { branch = 'processing'; break } if (/view=result/.test(page.url())) { branch = 'result'; break } await page.waitForTimeout(300) } if (branch === 'processing') { await expect(page.getByText(/技术力评估生成中/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/可视化分析过程/).first()).toBeVisible({ timeout: 8000 }); if (!/view=processing/.test(page.url())) throw new Error('过程态 URL 缺 view=processing：' + page.url()); if (!/workspace=technology/.test(page.url())) throw new Error('过程态 URL 缺 workspace=technology：' + page.url()); await expect(page.getByRole('button', { name: /取消任务/ }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /稍后查看/ }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('button', { name: /打开我的任务/ }).first()).toBeVisible({ timeout: 8000 }); let tid = /EVAL-\d{8}-\d{3}/.test(page.url()); if (!tid) { const txt = await page.locator('main').innerText().catch(() => ''); tid = /EVAL-\d{8}-\d{3}/.test(txt) } if (!tid) throw new Error('过程态未见 EVAL-YYYYMMDD-NNN 任务标识') } else if (branch === 'result') { const t1 = Date.now(); while (Date.now() - t1 < 30000 && !/view=result/.test(page.url())) await page.waitForTimeout(500); if (!/view=result/.test(page.url())) throw new Error('过程态超窗且未达 view=result'); if (!/task_id=EVAL-\d{8}-\d{3}/.test(page.url())) throw new Error('结果态 URL 缺 task_id=EVAL-YYYYMMDD-NNN：' + page.url()); await expect(page.getByText('技术力评估结果').first()).toBeVisible({ timeout: 15000 }); await expect(page.locator('body').getByText(/\d+\s*分/).first()).toBeVisible({ timeout: 15000 }) } else { throw new Error('双分支均未命中：5s 未捕到过程态元素且未直达 view=result') }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  双分支模板移植自 business 壳已验收 P0-05（父单指令 2026-10-15），tech 壳文案差异以实勘为准：生成中语义=「技术力评估生成中」、结果壳标题=「技术力评估结果」、对象勾选沿用本壳 P0-07/P0-08 已验 locator（[aria-label^="选择 "] 免 force）、关对比篮保留 visible+enabled 门（r4 教训）。
  2026-10-15 无头实勘（scout/probe-p009.json）：甲分支真实命中——过程态含六阶段可视化清单（任务提交/权限与配置校验/企业数据汇聚/指标计算/可信度与可比性校验/结果图表组装），任务 EVAL-20261015-003 在 URL 与正文均可见，约 15~20s 后迁 view=result&analysis_type=technology（乙分支为兜底，沿 business 壳当天复用直达结果的 D2 先例）。蓝本 4 点全命中、无新增 as-built 偏差；无伪造进度百分比（过程态只断言区块与入口存在，不读进度数字）。
  回退口径：若回填后「开始分析」复现 disabled+「预检未返回企业明细」（ENV-EVAL-TECH-PRECHECK-001），本条按 D4 环境债 skip+ticket，不写假绿。
tier: B
