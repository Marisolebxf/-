id: FUNC-01829
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01829
priority: P1
tier: B
title: 备选-画像查看详情
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: click
    target: button 前往对比篮选择企业
  - action: wait
    timeout_ms: 800
  - action: click
    target: button 查看画像
  - action: wait
    timeout_ms: 800
  - action: click
    target: button 查看详情
  - action: wait
    timeout_ms: 1500
expect:
  - note: 1、页面标题为「企业详情」
    assert: |-
      await expect(page.getByRole('heading', { name: '企业详情' }).first()).toBeVisible({ timeout: 15000 })
  - note: 2、面包屑为「企业分析 / 对比篮 / 企业画像」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('企业分析', { exact: true }).first()).toBeVisible({ timeout: 15000 });
      await expect(main.getByText('对比篮', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(main.getByText('企业画像', { exact: true }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id
