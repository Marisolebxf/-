id: FUNC-01825
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01825
priority: P0
title: 最近评估行打开该技术力评估 HTML 报告
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-tech
tier: B
preconditions:
  - 最近评估中有已完成且报告可打开的记录（无则真红 ticket=ENV-EVAL-TECH-HISTORY-001）
locators:
  recent_tab: tab「最近评估」
  html_report_btn: button「查看 HTML 报告」
  report_title: 技术力评估报告
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 最近评估→记录该行任务 ID→点「查看 HTML 报告」；进入报告断言在 expect
expect:
  - note: 1、进入该任务的技术力评估报告
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const reportReady = async () => {
        const t = await page.locator('body').innerText().catch(() => '');
        if (!/只读报告/.test(t) || !/view=report/.test(page.url())) return false;
        return /技术力评估报告/.test(t) || /报告目录/.test(t) || /封面与报告身份/.test(t);
      };
      const waitReportBody = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await reportReady()) return true;
          const body = await main().innerText().catch(() => '');
          const u = page.url();
          if (/技术力评估结果/.test(body) && /\d+\s*分/.test(body)) {
            const open = main().locator('[data-eval-open-html-report]').first();
            const fallback = main().getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
            const btn = (await open.count()) && (await open.isVisible().catch(() => false)) ? open : fallback;
            if (await btn.isEnabled().catch(() => false)) {
              await btn.click({ timeout: 8000 }).catch(() => {});
              await page.waitForTimeout(2000);
            }
          }
          if (/view=report/.test(u) && /正在加载评估结果/.test(body)) {
            await page.waitForTimeout(1500);
            continue;
          }
          await page.waitForTimeout(800);
        }
        return await reportReady();
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const pickHistoryHtmlReport = async () => {
        const restores = main().getByRole('button', { name: '恢复结果' });
        const n = await restores.count();
        for (let i = 0; i < n; i++) {
          const restore = restores.nth(i);
          if (!(await restore.isVisible().catch(() => false))) continue;
          const row = restore.locator('xpath=ancestor::tr[1]');
          const htmlBtn = row.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
          if (!(await htmlBtn.count())) continue;
          if (!(await htmlBtn.isVisible().catch(() => false))) continue;
          if (!(await htmlBtn.isEnabled().catch(() => false))) continue;
          return { entry: htmlBtn, row };
        }
        const attrBtn = main().locator('[data-eval-history-open-html-report]:not(.arco-btn-disabled)').first();
        if (await attrBtn.count() && await attrBtn.isVisible().catch(() => false) && await attrBtn.isEnabled().catch(() => false)) {
          return { entry: attrBtn, row: attrBtn.locator('xpath=ancestor::tr[1]') };
        }
        return null;
      };
      const picked = await pickHistoryHtmlReport();
      if (!picked) {
        throw new Error('最近评估无可点的「查看 HTML 报告」（ticket=ENV-EVAL-TECH-HISTORY-001）');
      }
      const { entry, row } = picked;
      let rowText = (await row.count()) ? await row.innerText().catch(() => '') : '';
      if (!rowText || !TID_RE.test(rowText)) {
        rowText = await main().innerText().catch(() => '');
      }
      const tidM = rowText.match(TID_RE);
      if (!tidM) throw new Error('已完成行未见任务 ID（ticket=ENV-EVAL-TECH-HISTORY-001）');
      const expectedTid = tidM[0];
      await entry.scrollIntoViewIfNeeded().catch(() => {});
      await entry.click({ timeout: 8000 });
      await page.waitForTimeout(2000);
      const tNav = Date.now();
      while (Date.now() - tNav < 30000 && !/view=report/.test(page.url())) {
        await page.waitForTimeout(500);
      }
      if (!/view=report/.test(page.url())) {
        throw new Error('点击后未到 view=report：' + page.url());
      }
      if (!(await waitReportBody(90000))) {
        const hint = (await page.locator('body').innerText().catch(() => '')).replace(/\s+/g, ' ').slice(0, 500);
        throw new Error('报告正文未就绪 url=' + page.url() + '（ticket=ENV-EVAL-TECH-RESULT-SHELL-001）：' + hint);
      }
      await expect(page.getByText('企业评估 · 只读报告').first()).toBeVisible({ timeout: 5000 });
      await expect(page.getByText(/报告目录/).first()).toBeVisible({ timeout: 5000 });
      const body = await main().innerText().catch(() => '');
      const srcM = body.match(/来源任务[：:]\s*(\S+)/);
      const urlTid = (() => {
        try {
          const u = new URL(page.url());
          return u.searchParams.get('task_id') ? decodeURIComponent(u.searchParams.get('task_id')) : null;
        } catch { return null; }
      })();
      if (srcM && srcM[1] !== expectedTid && urlTid !== expectedTid) {
        throw new Error('报告任务与历史行不一致：行=' + expectedTid + ' 来源=' + (srcM[1] || '') + ' url=' + urlTid);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01825 验「最近评估」已完成行「查看 HTML 报告」→只读报告（30888 enterprise-center/evaluation；URL view=report&task_id&report_id=REPORT-*）。D1：现场 h1/报告名为「技术力评估 · N家企业 · …报告」+目录「封面与报告身份」等 9 节（非用例/P0-16 文案「技术力评估报告」七节）；判定用「企业评估·只读报告」+报告目录。按钮与「恢复结果」同行锚定。任务 ID 对齐行内 DEMO-EVAL/EVAL-*。空历史 ENV-EVAL-TECH-HISTORY-001。B 档零 allow_skip。
