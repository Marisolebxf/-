id: FUNC-00902
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00902
priority: P0
title: 未选对象时空态引导且开始分析禁用
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
tier: A
preconditions:
  - 已进入技术力评估页且未选择评估对象
locators:
  object_empty_hint: text「暂未选择评估对象」
  guide: text 含对比篮选企引导
  start: button「开始分析」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 侧栏进入技术力评估页；空态与开始分析禁用断言在 expect 内自含
expect:
  - note: 对象区显示前往对比篮选择企业的空态引导
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const gotoEvalTech = async () => {
        if (!page.url().includes('/enterprise-center/overview')) {
          await page.goto(toUrl('/enterprise-center/overview'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(600);
        }
        await closeBasket();
        const entryName = '企业技术力评估对比分析';
        const tryClick = async () => {
          const link = page.getByRole('link', { name: entryName, exact: true });
          if (await link.count()) {
            await link.first().scrollIntoViewIfNeeded().catch(() => {});
            await link.first().click({ timeout: 8000 });
            return true;
          }
          return false;
        };
        let clicked = await tryClick();
        if (!clicked) {
          const search = page.getByRole('link', { name: '企业查询', exact: true });
          if (await search.count()) {
            await search.first().click({ timeout: 8000 });
            await page.waitForTimeout(500);
            clicked = await tryClick();
          }
        }
        if (!clicked) throw new Error('侧栏未找到企业技术力评估对比分析入口');
        await page.waitForURL(/\/enterprise-center\/evaluation/, { timeout: 15000 });
        const u = page.url();
        if (u.includes('enterprise_codes')) {
          const bare = toUrl('/enterprise-center/evaluation?workspace=technology&mode=technology');
          await page.goto(bare, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
        }
        await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 10000 });
      };
      await gotoEvalTech();
      await closeBasket();
      await expect(page.getByText('评估对象', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('暂未选择评估对象', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText(/对比篮.*选择企业|前往对比篮选择企业/).first()).toBeVisible({ timeout: 8000 });
  - note: 「开始分析」为禁用态
    assert: |-
      const start = page.getByRole('button', { name: '开始分析' });
      await expect(start).toBeVisible({ timeout: 8000 });
      if (!(await start.isDisabled())) throw new Error('空态开始分析未禁用');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  D2·30888 空态无 CTA 按钮「前往对比篮选择企业」，改为文案「暂未选择评估对象」+「请在系统对比篮中选择企业」；路由 /enterprise-center/evaluation（/enterprise/evaluation 深链 404）。用例「前往对比篮…」语义用 regex 覆盖新旧措辞。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。由 P0-05 重写为 FUNC-00902。
