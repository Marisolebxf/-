id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00907
priority: P0
title: 评估模板区呈现系统/我的/当次自定义三组
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-tech
preconditions:
- 已进入技术力评估页
- 内部评审模式关闭
locators:
  template_select: .arco-select-view 标题含技术力标准模板
steps:
- action: goto
  target: /enterprise/evaluation?workspace=technology&mode=technology
- action: evaluate
  note: 打开 .arco-select-view（含技术力标准模板）断言三组
expect:
- note: 模板区分系统模板、我的模板、当次自定义配置三组
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const trg = page.locator('.arco-select-view').filter({ hasText: /技术力|模板|未保存/ }).first(); await trg.click({ timeout: 8000 }); await page.waitForTimeout(600); const pop = page.locator('.arco-trigger-popup:visible').last(); const txt = await pop.innerText(); for (const g of ['系统模板','我的模板','当次自定义配置']) { if (!txt.includes(g)) throw new Error('模板分组缺失: ' + g + ' / 实见 ' + txt.slice(0, 200)) }
- note: 系统模板名为「技术力标准模板」
  assert: |-
    const pop = page.locator('.arco-trigger-popup:visible').last(); await expect(pop.getByText('技术力标准模板').first()).toBeVisible({ timeout: 8000 })
- note: 当次自定义配置初始为「当前未保存配置」
  assert: |-
    const pop = page.locator('.arco-trigger-popup:visible').last(); await expect(pop.getByText('当前未保存配置').first()).toBeVisible({ timeout: 8000 }); await page.keyboard.press('Escape')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 我的模板计数随账号变化，observed。
tier: A
