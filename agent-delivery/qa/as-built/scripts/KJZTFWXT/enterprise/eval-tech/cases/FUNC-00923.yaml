id: FUNC-00923
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00923
priority: P1
tier: B
title: 备选-调整配置返回
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 同册01803进入结果态后点击「调整配置」；断言在 expect
expect:
  - note: 1、页面返回配置态且评估对象区可见
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=technology&mode=technology';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /技术力评估结果/.test(t) && /\d+\s*分/.test(t);
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const restore = page.getByRole('button', { name: '恢复结果' }).first();
      await expect(restore).toBeVisible({ timeout: 10000 });
      await restore.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const tNav = Date.now();
      while (Date.now() - tNav < 45000 && !/view=result/.test(page.url()) && !(await bodyResultReady())) {
        await page.waitForTimeout(500);
      }
      if (!await bodyResultReady()) {
        const t0 = Date.now();
        while (Date.now() - t0 < 30000 && !(await bodyResultReady())) await page.waitForTimeout(800);
      }
      await expect(main().getByRole('button', { name: '调整配置' })).toBeVisible({ timeout: 15000 });
      await main().getByRole('button', { name: '调整配置' }).click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await expect(main().getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 15000 });
      await expect(main()).toContainText('评估对象');
  - note: 2、地址视图参数离开结果态
    assert: |-
      await expect(page).not.toHaveURL(/view=result/);
on_fail: 截图 + 抄 X-Trace-Id
