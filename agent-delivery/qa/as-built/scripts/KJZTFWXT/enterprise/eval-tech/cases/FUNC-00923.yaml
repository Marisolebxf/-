id: FUNC-00923
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00923
priority: P1
title: 结果态调整配置可返回配置态
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 已处于结果态（脚本内：最近评估→恢复结果；DEMO 空壳则换行 EVAL 任务）
locators:
  restore: button「恢复结果」
  adjust: button「调整配置」
  config_object: 评估对象
  start: button「开始分析」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 结果态→点「调整配置」→配置态；机检在 expect
expect:
  - note: 页面返回配置态且评估对象区可见
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /技术力评估结果/.test(t) && /\d+\s*分/.test(t);
      };
      const waitResultBody = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await bodyResultReady()) return true;
          if (/view=result/.test(page.url())) {
            const tid = (() => { try { return new URL(page.url()).searchParams.get('task_id'); } catch { return null; } })();
            if (tid && (Date.now() - t0) % 12000 < 1100) {
              await page.goto(toUrl(evalRoute + '&view=result&analysis_type=technology&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2000);
            }
          }
          await page.waitForTimeout(800);
        }
        return await bodyResultReady();
      };
      const restoreLatestResult = async () => {
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        if (!(await tab.isVisible().catch(() => false))) return false;
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const restore = main().getByRole('button', { name: '恢复结果' });
        if (!(await restore.count()) || !(await restore.first().isVisible().catch(() => false))) return false;
        await restore.first().click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        return await waitResultBody(60000);
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      let branch = null;
      if (await restoreLatestResult()) branch = 'restore';
      if (!(await bodyResultReady())) {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        if (await restoreLatestResult()) branch = 'restore2';
      }
      const urlTid = (() => { try { return new URL(page.url()).searchParams.get('task_id'); } catch { return null; } })();
      if (await bodyResultReady() && urlTid && /^DEMO-EVAL-/.test(urlTid) && !(await main().getByRole('button', { name: '调整配置' }).first().isVisible().catch(() => false))) {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        if (await restoreLatestResult()) branch = (branch || '') + '+nondemo';
      }
      if (!(await bodyResultReady())) throw new Error('未达结果态（ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）');
      await expect(main().getByRole('heading', { name: '技术力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      const adjust = main().getByRole('button', { name: '调整配置' });
      if (!(await adjust.count()) || !(await adjust.first().isVisible().catch(() => false))) {
        throw new Error('结果态未见「调整配置」（URL=' + page.url() + '）');
      }
      await expect(adjust.first()).toBeEnabled({ timeout: 8000 });
      await adjust.first().scrollIntoViewIfNeeded().catch(() => {});
      try { await adjust.first().click({ timeout: 8000 }); } catch { await adjust.first().click({ force: true, timeout: 8000 }); }
      const tAdj = Date.now();
      while (Date.now() - tAdj < 15000) {
        const body = await main().innerText().catch(() => '');
        if (!/view=result/.test(page.url()) && /评估对象/.test(body) && (await page.getByRole('button', { name: '开始分析' }).count())) break;
        if (/评估对象/.test(body) && !(await main().getByRole('heading', { name: '技术力评估结果' }).count())) break;
        await page.waitForTimeout(400);
      }
      await page.waitForTimeout(800);
      await expect(main().getByText('评估对象').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
      if (await main().getByRole('heading', { name: '技术力评估结果' }).count()) {
        throw new Error('仍停留结果标题区（URL=' + page.url() + '）');
      }
      if (await main().getByRole('button', { name: '调整配置' }).count()) {
        throw new Error('配置态仍见「调整配置」：' + page.url());
      }
  - note: 地址视图参数离开结果态
    assert: |-
      if (/view=result/.test(page.url())) throw new Error('仍停留 view=result：' + page.url());
      if (/view=processing/.test(page.url())) throw new Error('误入 view=processing：' + page.url());
      if (/view=report/.test(page.url())) throw new Error('误入 view=report：' + page.url());
      if (!/workspace=technology/.test(page.url())) throw new Error('配置态 URL 缺 workspace=technology：' + page.url());
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  FUNC-00923 结果态「调整配置」→配置态；30888 enterprise-center/evaluation。结果入口对齐 FUNC-01803（最近评估→恢复结果+waitResultBody）；DEMO-EVAL 空壳无调整配置时重试恢复。D1·配置 CTA「返回对比篮/多企业技术力对比分析」。由 P0-19 重写；零 allow_skip。
