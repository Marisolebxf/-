id: FUNC-01816
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01816
priority: P1
title: 保存为个人模板时取消仍留在配置页
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 已进入当前分析配置页（脚本自含对象回填）
locators:
  save_template: button「保存为个人模板」
  modal_title: .arco-modal-title「保存为个人模板」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 回填对象→点保存为个人模板→取消；对话框与配置页断言在 expect
expect:
  - note: 1、对话框标题为「保存为个人模板」；2、名称旁显示 30 字上限；3、取消后对话框关闭且仍在配置页
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const recSection = main().locator('section').filter({ hasText: '推荐企业' }).first();
        if (await recSection.getByText('推荐企业', { exact: true }).isVisible().catch(() => false)) {
          const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
          const cardCount = await cards.count();
          for (let i = 0; n < min && i < cardCount; i++) {
            const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
            if (!(await btn.count()) || !(await btn.isVisible().catch(() => false))) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForTimeout(700);
            n = await basketEntCount();
          }
        }
        if (n < min) {
          const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
          await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
          while (n < min) {
            const idx = Math.min(n, await addBtns.count() - 1);
            await addBtns.nth(idx).click({ timeout: 8000 });
            await page.waitForTimeout(700);
            n = await basketEntCount();
            if (n < min && idx >= await addBtns.count() - 1) break;
          }
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const objectFingerprint = async () => {
        const t = await main().innerText().catch(() => '');
        const urlNow = page.url();
        const tagCount = await main().locator('.arco-tag').count();
        const codes = (urlNow.match(/enterprise_codes/g) || []).length;
        return {
          tagCount,
          codes,
          fromBasket: /来自对比篮/.test(t) || /source=compare-basket/.test(urlNow),
          empty: /暂未选择评估对象/.test(t),
          snippet: t.slice(0, 500),
        };
      };
      const openSelectOverlay = async () => {
        const ctaNew = main().getByRole('button', { name: '多企业技术力对比分析', exact: true });
        const ctaOld = main().getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await ctaNew.count() && await ctaNew.first().isVisible().catch(() => false)) {
          await ctaNew.first().click({ timeout: 8000 });
          return;
        }
        if (await ctaOld.count() && await ctaOld.first().isVisible().catch(() => false)) {
          await ctaOld.first().click({ timeout: 8000 });
          return;
        }
        const adjust = main().getByRole('button', { name: '返回对比篮调整对象', exact: true });
        if (await adjust.count() && await adjust.first().isVisible().catch(() => false)) {
          await adjust.first().click({ timeout: 8000 });
          return;
        }
        const pickerQs = 'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2&compare_picker_max=50';
        await page.goto(toUrl(evalRoute + '&' + pickerQs), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        if (await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false)) return;
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (await dockBtn.count()) {
          await dockBtn.click({ timeout: 10000 });
          await page.waitForTimeout(1000);
        }
      };
      const ensureConfigWithObjects = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
        if (await curTab.count()) { await curTab.first().click({ timeout: 5000 }); await page.waitForTimeout(600); }
        const body0 = await main().innerText().catch(() => '');
        if (/技术力评估结果/.test(body0) || page.url().includes('view=result')) {
          const adj = page.getByRole('button', { name: '调整配置' });
          if (await adj.count()) { await adj.first().click({ timeout: 8000 }); await page.waitForTimeout(1200); }
        }
        let fp = await objectFingerprint();
        if (fp.empty) {
          await openSelectOverlay();
          await page.waitForTimeout(1000);
          await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
          const sels = page.locator('[aria-label^="选择 "]');
          if (await sels.count() < 2) throw new Error('浮层可选企业不足 2 家');
          await sels.nth(0).click();
          await page.waitForTimeout(200);
          await sels.nth(1).click();
          await page.waitForTimeout(300);
          const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
          await expect(confirm).toBeEnabled({ timeout: 8000 });
          await confirm.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          await closeBasket();
          fp = await objectFingerprint();
        }
        if (fp.empty) throw new Error('回填后对象区仍为空');
        if (!fp.fromBasket && fp.tagCount < 1 && !/有限公司|股份有限公司/.test(fp.snippet)) {
          throw new Error('对象区未见已选企业标记');
        }
      };
      await ensureBasketEnterprises(2);
      await ensureConfigWithObjects();
      const saveBtn = page.getByRole('button', { name: '保存为个人模板', exact: true });
      await saveBtn.first().scrollIntoViewIfNeeded().catch(() => {});
      await expect(saveBtn.first()).toBeVisible({ timeout: 10000 });
      await saveBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const modal = page.locator('.arco-modal:visible').filter({ has: page.locator('.arco-modal-title', { hasText: '保存为个人模板' }) }).last();
      await expect(modal).toBeVisible({ timeout: 10000 });
      await expect(modal.locator('.arco-modal-title').filter({ hasText: '保存为个人模板' }).first()).toBeVisible();
      const modalText = (await modal.innerText()).replace(/\s+/g, ' ');
      if (!/\/30/.test(modalText) && !/30\s*字/.test(modalText) && !/上限\s*30/.test(modalText)) {
        throw new Error('名称旁未见 30 字上限提示，片段：' + modalText.slice(0, 120));
      }
      const nameInput = modal.getByPlaceholder(/模板名称|便于识别|个人模板名称/);
      await expect(nameInput.first()).toBeVisible({ timeout: 8000 });
      let cancelBtn = modal.locator('.arco-modal-footer').getByRole('button', { name: '取消', exact: true });
      if (!(await cancelBtn.count())) {
        cancelBtn = page.getByRole('button', { name: '取消', exact: true }).last();
      }
      await expect(cancelBtn).toBeVisible({ timeout: 8000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 8000 });
      const currentTab = page.getByRole('tab', { name: '当前分析', exact: true }).first();
      if (await currentTab.count()) {
        await expect(currentTab).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      }
      await expect(page.getByRole('button', { name: '保存为个人模板', exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('指标名称', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      if (page.url().includes('view=result') || page.url().includes('view=processing')) {
        throw new Error('取消后不应离开配置页，URL=' + page.url());
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例 01816；保存模板 Modal 标题「保存为个人模板」，名称计数现场为「个人模板名称x/30」（同 P1-05/00920）。30888 路由 enterprise-center/evaluation；前置对象回填同 FUNC-00919（推荐卡入篮+picker）。D1·配置区标题为「技术力模型构建与参数自定义」，取消后仍验表头「指标名称」。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
