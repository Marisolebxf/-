id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00901
priority: P0
title: 同壳商业力与综合竞争力 mode 隔离且配置不串扰
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
preconditions:
- 本条只验隔离反向，不展开兄弟功能正向用例
steps:
- action: goto
  target: /enterprise/evaluation?workspace=technology&mode=technology
expect:
- note: 两者分别进入各自工作台且地址含各自 mode 值
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); await expect(page).toHaveURL(/mode=business/); await expect(page.getByRole('heading', { name: /商业力/ })).toBeVisible({ timeout: 8000 }); await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); await expect(page).toHaveURL(/mode=competitiveness/); await expect(page.getByRole('heading', { name: /综合竞争力/ })).toBeVisible({ timeout: 8000 })
- note: 技术力页与两工作台的对象、模板、权重配置互不串扰
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); await expect(page).toHaveURL(/mode=technology/); await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' })).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view').filter({ hasText: /技术力标准模板/ }).first()).toBeVisible({ timeout: 8000 }); const biz = await page.getByText('商业力标准模板').count(); const comp = await page.getByText(/综合竞争力标准模板|竞争力标准模板/).count(); if (biz || comp) throw new Error('技术力页串入兄弟模板文案')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 仅验 mode 隔离；商业力/综合竞争力正向各自册承载。
tier: B
