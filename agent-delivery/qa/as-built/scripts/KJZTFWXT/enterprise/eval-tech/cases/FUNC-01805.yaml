id: FUNC-01805
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01805
priority: P1
tier: B
title: 备选-删除取消
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 切换「最近评估」→ 点「删除」→ 弹框点「取消」
expect:
  - note: 弹出框说明删除后列表不再显示
    assert: |-
      const tablists = page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) });
      const list = (await tablists.count()) ? tablists.first() : page.locator('[role=tablist]').first();
      const recent = list.getByRole('tab', { name: '最近评估', exact: true });
      await expect(recent).toBeVisible({ timeout: 15000 });
      await recent.click({ timeout: 8000 });
      await expect(recent).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      await expect(page.getByRole('button', { name: '新建评估' }).first()).toBeVisible({ timeout: 15000 });
      const historyMain = page.locator('main');
      const row = historyMain.locator('tbody tr').filter({ has: page.getByRole('button', { name: '删除' }) }).first();
      await expect(row).toBeVisible({ timeout: 15000 });
      const taskId = (await row.locator('td').nth(1).innerText()).trim();
      await page.evaluate((id) => { window.__func01805RowTaskId = id; }, taskId);
      await row.getByRole('button', { name: '删除' }).click();
      const dialog = page.getByRole('dialog');
      await expect(dialog).toBeVisible({ timeout: 8000 });
      await expect(dialog).toContainText(/删除|不再显示|列表/);
      await page.evaluate(() => { window.__func01805DeleteDialogOk = true; });
      await dialog.getByRole('button', { name: '取消' }).click();
  - note: 该行仍留在列表中
    assert: |-
      const taskId = await page.evaluate(() => window.__func01805RowTaskId);
      const historyMain = page.locator('main');
      const row = historyMain.locator('tbody tr').filter({ hasText: taskId }).first();
      await expect(row).toBeVisible();
      await expect(row.getByRole('button', { name: '删除' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
