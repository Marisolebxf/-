expect:
  - note: 页面返回配置态且评估对象区可见
    assert: |-
      await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('button[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } const bodyRes = async () => { const t = await page.locator('body').innerText().catch(() => ''); return /技术力评估结果/.test(t) && /\d+\s*分/.test(t) }; const waitBody = async (ms) => { const t = Date.now(); while (Date.now() - t < ms) { if (await bodyRes()) return true; await page.waitForTimeout(1000) } return await bodyRes() }; let branch = null; const tab = page.getByRole('tab', { name: /最近评估/ }).first(); if (await tab.isVisible().catch(() => false)) { try { await tab.click({ timeout: 3000 }); await page.waitForTimeout(1500) } catch {} } const restore = page.getByRole('button', { name: '恢复结果' }); if ((await restore.count()) >= 1) { await restore.first().click({ timeout: 8000 }); if (await waitBody(60000)) branch = 'restore' } if (!(await bodyRes())) { await page.getByRole('tab', { name: /当前分析/ }).first().click({ timeout: 5000 }).catch(() => {}); await page.waitForTimeout(800); const open = page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象|返回对比篮/ }).first(); await open.click({ timeout: 8000 }); const sels = page.locator('[aria-label^="选择 "]'); await sels.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {}); await page.waitForTimeout(800); if ((await sels.count()) < 2) throw new Error('结果态不可达且可选企业不足（ticket=ENV-EVAL-TECH-PRECHECK-001）'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(500); const okBtn = page.getByRole('button', { name: '确定' }).first(); await okBtn.scrollIntoViewIfNeeded().catch(() => {}); try { await okBtn.click({ timeout: 5000 }) } catch { try { await okBtn.click({ force: true, timeout: 5000 }) } catch { await okBtn.evaluate((el) => el.click()) } } await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('回填后开始分析禁用（预检复发？ticket=ENV-EVAL-TECH-PRECHECK-001）'); await start.click(); const t0 = Date.now(); while (Date.now() - t0 < 5000) { if (/view=result/.test(page.url())) { branch = 'result'; break } if (await page.getByText(/技术力评估生成中|可视化分析过程/).first().isVisible().catch(() => false)) { branch = 'processing'; break } await page.waitForTimeout(300) } if (!(await bodyRes())) { const t1 = Date.now(); while (Date.now() - t1 < 90000) { if (/view=result/.test(page.url())) branch = 'result'; if (await bodyRes()) { branch = branch || 'inplace'; break } await page.waitForTimeout(1000) } } if (!(await bodyRes()) && /view=result/.test(page.url()) && /analysis_fp=/.test(page.url())) { await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); if (await waitBody(60000)) branch = 'reload_fp' } if (!(await bodyRes())) { await page.getByRole('tab', { name: /最近评估/ }).first().click({ timeout: 5000 }).catch(() => {}); await page.waitForTimeout(1500); if ((await restore.count()) < 1) throw new Error('结果内容未呈现且无「恢复结果」（branch=' + branch + '，ticket=ENV-EVAL-TECH-RESULT-SHELL-001）：' + page.url()); await restore.first().click({ timeout: 8000 }); if (!(await waitBody(60000))) throw new Error('恢复结果后仍无结果正文（ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）'); branch = 'restore2' } } if (!(await bodyRes())) throw new Error('未达结果态（branch=' + branch + '，ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）'); const adjust = page.getByRole('button', { name: '调整配置' }); await expect(adjust.first()).toBeVisible({ timeout: 10000 }); await expect(adjust.first()).toBeEnabled(); await adjust.first().click({ timeout: 8000 }); await page.waitForTimeout(2000); await expect(page.getByText('评估对象').first()).toBeVisible({ timeout: 10000 }); await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 }); if (await page.getByRole('button', { name: '调整配置' }).count()) throw new Error('点调整配置后仍见「调整配置」（未离开结果壳）：' + page.url())
  - note: 地址视图参数离开结果态
    assert: |-
      if (/view=result/.test(page.url())) throw new Error('仍停留 view=result：' + page.url()); if (/view=processing/.test(page.url())) throw new Error('误入 view=processing：' + page.url()); if (/view=report/.test(page.url())) throw new Error('误入 view=report：' + page.url()); if (!/workspace=technology/.test(page.url())) throw new Error('配置态 URL 缺 workspace=technology：' + page.url())
