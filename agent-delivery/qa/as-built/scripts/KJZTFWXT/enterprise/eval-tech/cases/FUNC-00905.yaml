id: FUNC-00905
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00905
priority: P1
title: 浮层未勾选时取消选择与确定禁用
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
tier: B
preconditions:
  - 对比篮至少 2 家企业（脚本自含入篮）
locators:
  cta: button「多企业技术力对比分析」（30888；旧「前往对比篮选择企业」回退）
  overlay_title: 选择分析企业
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 对比篮≥2、开浮层测按钮门控；断言在 expect 内自含
expect:
  - note: 未勾选时「取消选择」与「确定」均为禁用态且浮层不关闭
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, await addBtns.count() - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(800);
          n = await basketEntCount();
          if (n < min && idx >= await addBtns.count() - 1) break;
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const gotoEvalTech = async () => {
        if (!page.url().includes('/enterprise-center/evaluation') || !page.url().includes('workspace=technology')) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
        }
        await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 10000 });
      };
      const openSelectOverlay = async () => {
        const main = page.locator('main');
        const ctaNew = main.getByRole('button', { name: '多企业技术力对比分析', exact: true });
        const ctaOld = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await ctaNew.count() && await ctaNew.first().isVisible().catch(() => false)) {
          await ctaNew.first().click({ timeout: 8000 });
          return;
        }
        if (await ctaOld.count() && await ctaOld.first().isVisible().catch(() => false)) {
          await ctaOld.first().click({ timeout: 8000 });
          return;
        }
        const adjust = main.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        if (await adjust.count() && await adjust.first().isVisible().catch(() => false)) {
          await adjust.first().click({ timeout: 8000 });
          return;
        }
        const pickerQs =
          'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2&compare_picker_max=50';
        await page.goto(toUrl(`${evalRoute}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const overlayScope = () => {
        const dlg = page.locator('.arco-modal, .arco-drawer, [role="dialog"]').filter({ hasText: '选择分析企业' });
        return dlg.count().then((c) => (c ? dlg.last() : page.locator('body')));
      };
      await ensureBasketEnterprises(2);
      await gotoEvalTech();
      await closeBasket();
      await openSelectOverlay();
      await page.waitForTimeout(1000);
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      const overlay = await overlayScope();
      const clear = overlay.getByRole('button', { name: '取消选择', exact: true });
      const ok = overlay.getByRole('button', { name: '确定', exact: true });
      if (!(await clear.isDisabled())) throw new Error('未勾选时取消选择应禁用');
      if (!(await ok.isDisabled())) throw new Error('未勾选时确定应禁用');
      await page.waitForTimeout(300);
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 5000 });
  - note: 「取消选择」可清空当前勾选
    assert: |-
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const dlg = page.locator('.arco-modal, .arco-drawer, [role="dialog"]').filter({ hasText: '选择分析企业' });
      const overlay = (await dlg.count()) ? dlg.last() : page.locator('body');
      const rowPickers = async () => {
        let sels = overlay.locator('[aria-label^="选择 "]');
        if (await sels.count() >= 2) return sels;
        const boxes = overlay.locator('.arco-checkbox');
        if (await boxes.count() >= 2) return boxes;
        throw new Error('浮层可选企业不足 2 家');
      };
      const rows = await rowPickers();
      await rows.nth(0).click();
      await page.waitForTimeout(200);
      await rows.nth(1).click();
      await page.waitForTimeout(400);
      const clear = overlay.getByRole('button', { name: '取消选择', exact: true });
      const ok = overlay.getByRole('button', { name: '确定', exact: true });
      if (await clear.isDisabled()) throw new Error('勾选后取消选择仍禁用');
      if (await ok.isDisabled()) throw new Error('勾选后确定仍禁用');
      await clear.click();
      await page.waitForTimeout(500);
      if (!(await ok.isDisabled())) throw new Error('取消选择后确定应回到禁用（勾选已清空）');
  - note: 清空后「确定」回到禁用且对象区无回填
    assert: |-
      const dlg = page.locator('.arco-modal, .arco-drawer, [role="dialog"]').filter({ hasText: '选择分析企业' });
      const overlay = (await dlg.count()) ? dlg.last() : page.locator('body');
      const ok = overlay.getByRole('button', { name: '确定', exact: true });
      if (!(await ok.isDisabled())) throw new Error('清空后确定应禁用');
      await overlay.getByRole('button', { name: '取消', exact: true }).click();
      await page.waitForTimeout(500);
      const body = await page.locator('body').innerText();
      if (/来自对比篮/.test(body) && !/暂未选择评估对象/.test(body)) throw new Error('对象区被回填');
      if (page.url().includes('enterprise_codes')) throw new Error('URL 不应含 enterprise_codes 回填');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  D1·30888 路由 enterprise-center/evaluation；空态 CTA「多企业技术力对比分析」或 picker 深链开浮层（同 FUNC-00903/00904）。浮层行勾选优先 aria-label^=选择，回退 .arco-checkbox。由 P1-01 重写为 FUNC-00905；登录与关内部评审由 runner 会话前置。
