id: FUNC-01813
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01813
priority: P1
title: 新增企业弹层搜索后加入对比篮后篮内出现
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
tier: B
preconditions:
  - 「选择分析企业」浮层已打开（脚本自含开浮层）
locators:
  picker_title: text「选择分析企业」
  add_btn: button「新增」
  add_modal: .arco-modal-title「新增企业」
  name_search: placeholder「输入企业名称」
  join_basket: button「加入对比篮」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 开浮层→新增→按名称搜索→加入对比篮；篮内名单在 expect 判定
expect:
  - note: 1、该企业出现在篮内企业中
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const pickerRoot = () =>
        page.locator('.system-compare-panel:visible, .arco-modal:visible').filter({ hasText: '选择分析企业' }).last();
      const listBasketEnterpriseNames = async (scope) => {
        const names = [];
        const basketSection = scope.locator('[data-testid="compare-basket-list"], .ent-compare-basket-list, .compare-basket-enterprise-list').first();
        const useScope = (await basketSection.count()) ? basketSection : scope;
        const cards = useScope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        for (let i = 0; i < cardN; i++) {
          const card = cards.nth(i);
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = useScope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const openSelectOverlay = async () => {
        const pickerQs =
          'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50';
        await page.goto(toUrl(`${evalRoute}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        if (!(await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false))) {
          const main = page.locator('main');
          const cta = main.getByRole('button', { name: /多企业技术力对比分析|前往对比篮选择企业/ }).first();
          if (await cta.isVisible().catch(() => false)) {
            await cta.click({ timeout: 8000 });
            await page.waitForTimeout(1200);
          }
        }
        if (!(await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false))) {
          const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
          if (await dockBtn.count()) {
            await dockBtn.click({ timeout: 10000 });
            await page.waitForTimeout(1000);
          }
        }
      };
      const pickFragment = (name) => {
        const s = String(name).replace(/\s+/g, '');
        const core = s.replace(/(股份有限公司|有限责任公司|有限公司|集团)$/u, '');
        const base = core.length >= 2 ? core : s;
        if (base.length <= 3) return base;
        return base.slice(0, Math.min(6, base.length));
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await openSelectOverlay();
      await page.waitForTimeout(800);
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      const panel = pickerRoot();
      await expect(panel).toBeVisible({ timeout: 10000 });
      const beforeBasket = await listBasketEnterpriseNames(panel);
      const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
      const addBtn = (await workspace.count())
        ? workspace.getByRole('button', { name: '新增', exact: true })
        : panel.getByRole('button', { name: '新增', exact: true });
      await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
      await addBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const modalRoot = page.locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible').filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) }).last();
      await expect(modalRoot).toBeVisible({ timeout: 15000 });
      await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
      const loadFail = modalRoot.getByText('名单读取失败', { exact: false });
      if (await loadFail.count() && await loadFail.first().isVisible().catch(() => false)) {
        throw new Error('新增企业推荐接口失败（名单读取失败）');
      }
      const joinBtns = modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
      await expect(joinBtns.first()).toBeVisible({ timeout: 30000 });
      let targetRow = null;
      let targetName = '';
      const joinN = await joinBtns.count();
      for (let i = 0; i < joinN; i++) {
        const btn = joinBtns.nth(i);
        const row = btn.locator('xpath=ancestor::tr[1]');
        const nm = ((await row.locator('td').first().innerText()) || '').trim();
        if (!nm) continue;
        const alreadyIn = beforeBasket.some((b) => b.includes(nm) || nm.includes(b));
        if (!alreadyIn) {
          targetRow = row;
          targetName = nm;
          break;
        }
      }
      if (!targetName) {
        const firstJoin = joinBtns.first();
        targetRow = firstJoin.locator('xpath=ancestor::tr[1]');
        targetName = ((await targetRow.locator('td').first().innerText()) || '').trim();
      }
      if (!targetName) throw new Error('无法读取待加入企业名称');
      const fragment = pickFragment(targetName);
      const search = modalRoot.getByPlaceholder('输入企业名称');
      await expect(search.first()).toBeVisible({ timeout: 8000 });
      const inp = search.first();
      await inp.click({ timeout: 8000 });
      await inp.fill('');
      await inp.pressSequentially(fragment, { delay: 35 });
      await page.waitForTimeout(1200);
      await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
      await page.waitForTimeout(500);
      let joinBtn = modalRoot.getByRole('row', { name: new RegExp(targetName.slice(0, 4)) }).getByRole('button', { name: '加入对比篮', exact: true }).first();
      if (!(await joinBtn.count())) {
        joinBtn = modalRoot.locator('tbody .arco-table-tr').filter({ hasText: targetName }).getByRole('button', { name: '加入对比篮', exact: true }).first();
      }
      if (!(await joinBtn.count())) {
        joinBtn = modalRoot.getByRole('button', { name: '加入对比篮', exact: true }).first();
        const row = joinBtn.locator('xpath=ancestor::tr[1]');
        targetName = ((await row.locator('td').first().innerText()) || '').trim() || targetName;
      }
      await expect(joinBtn).toBeVisible({ timeout: 15000 });
      await joinBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      const modalStill = page.locator('.arco-modal:visible').filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) });
      if (await modalStill.count()) {
        const closeModal = modalStill.last().locator('.arco-modal-close-icon, button[aria-label="关闭"]').first();
        if (await closeModal.count() && await closeModal.isVisible().catch(() => false)) {
          try { await closeModal.click({ timeout: 3000 }); await page.waitForTimeout(400); } catch {}
        }
      }
      await page.waitForTimeout(600);
      const afterPanel = pickerRoot();
      await expect(afterPanel).toBeVisible({ timeout: 10000 });
      const afterBasket = await listBasketEnterpriseNames(afterPanel);
      const found = afterBasket.some((b) => b.includes(targetName) || targetName.includes(b) || b.replace(/\s/g, '').includes(fragment));
      if (!found) {
        const body = await afterPanel.innerText().catch(() => '');
        if (!body.includes(targetName) && !body.includes(fragment)) {
          throw new Error('加入对比篮后篮内未见企业：' + targetName + '；篮内=[' + afterBasket.join(' | ') + ']');
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例 01813；路径对齐 key-domain 01729/01723（CompareBasketAddModal「新增企业」+「输入企业名称」搜索 + 行内「加入对比篮」）。30888 路由 enterprise-center/evaluation；开浮层走 picker 深链。优先选篮内尚未存在的企业行；加入后断言浮层篮内名单含该企业。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
