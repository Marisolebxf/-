id: P0-16
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00917
priority: P0
title: 结果态差距分析报告入口可打开且报告含优势与差距信息
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
preconditions:
  - 已处于结果态（脚本内现场发起：复用 P0-15 三分支链回填 2 家 + 开始分析）
locators:
  start: button「开始分析」
  report_section: 评估报告
  report_entry: button「查看 HTML 报告」
  report_title: 企业评估 · 只读报告 / 技术力评估报告
  findings: 关键发现（领先/差距结论…同源摘要）
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 复用 P0-15 三分支先收口结果态，再点「查看 HTML 报告」断报告打开与优势/差距信息；机检在 expect
expect:
  - note: 先到结果态——现场发起后轮询至结果呈现（快路径 URL view=result 三要素收口 / 慢路径原地渲染 body 呈现结果区标题与 \d+分；超窗走最近评估 Tab 兜底），数值不钉死
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('button[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } await page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first().click({ timeout: 8000 }); const sels = page.locator('[aria-label^="选择 "]'); await sels.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {}); await page.waitForTimeout(800); const n = await sels.count(); if (n < 2) throw new Error('可选企业不足'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(500); const okBtn = page.getByRole('button', { name: '确定' }).first(); await okBtn.scrollIntoViewIfNeeded().catch(() => {}); try { await okBtn.click({ timeout: 5000 }) } catch { try { await okBtn.click({ force: true, timeout: 5000 }) } catch { await okBtn.evaluate((el) => el.click()) } } await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) { throw new Error('回填后开始分析禁用（预检复发？ticket=ENV-EVAL-TECH-PRECHECK-001）') }; await start.click(); let branch = null; const t0 = Date.now(); while (Date.now() - t0 < 5000) { const procEl = page.getByText(/技术力评估生成中|可视化分析过程/).first(); if (await procEl.isVisible().catch(() => false)) { branch = 'processing'; break } if (/view=result/.test(page.url())) { branch = 'result'; break } await page.waitForTimeout(300) } const bodyRes = async () => { const t = await page.locator('body').innerText().catch(() => ''); return /技术力评估结果/.test(t) && /\d+\s*分/.test(t) }; if (branch !== 'result') { const t1 = Date.now(); while (Date.now() - t1 < 60000) { if (/view=result/.test(page.url())) { branch = 'result'; break } if (await bodyRes()) { branch = 'inplace'; break } await page.waitForTimeout(1000) } } const waitBody = async (ms) => { const t = Date.now(); while (Date.now() - t < ms) { if (await bodyRes()) return true; await page.waitForTimeout(1000) } return await bodyRes() }; if (branch === 'result' || branch === 'inplace') { await waitBody(30000) } if (!(await bodyRes())) { const tab = page.getByRole('tab', { name: /最近评估/ }).first(); if (await tab.isVisible().catch(() => false)) { try { await tab.click({ timeout: 3000 }); await page.waitForTimeout(1500) } catch {} } let tid = (/task_id=(EVAL-\d{8}-\d{3})/.exec(page.url()) || [])[1] || (/EVAL-\d{8}-\d{3}/.exec(await page.locator('body').innerText().catch(() => '')) || [])[0]; if (!tid) throw new Error('结果内容未呈现且无 task_id 可兜底（branch=' + branch + '）：' + page.url()); await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology&view=result&analysis_type=technology&task_id=' + tid, { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); if (!(await waitBody(20000))) throw new Error('结果态内容未呈现（branch=' + branch + '，URL=' + page.url() + '）'); branch = 'result' } if (/view=result/.test(page.url())) { if (!/workspace=technology/.test(page.url())) throw new Error('结果态 URL 缺 workspace=technology：' + page.url()); if (!/task_id=EVAL-\d{8}-\d{3}/.test(page.url())) throw new Error('结果态 URL 缺 task_id=EVAL-YYYYMMDD-NNN：' + page.url()) } else { if (!/workspace=technology/.test(page.url())) throw new Error('慢态原地渲染 URL 缺 workspace=technology：' + page.url()) }
  - note: 差距分析报告打开且可读（as-built：结果区「评估报告」下点 button「查看 HTML 报告」→ 同页 view=report + report_id=REPORT-*；呈现「企业评估 · 只读报告」与「技术力评估报告」）
    assert: |-
      await expect(page.getByText('评估报告').first()).toBeVisible({ timeout: 10000 }); const entry = page.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first(); await expect(entry).toBeVisible({ timeout: 10000 }); await expect(entry).toBeEnabled(); await entry.scrollIntoViewIfNeeded().catch(() => {}); await entry.click({ timeout: 8000 }); await page.waitForTimeout(2000); const t0 = Date.now(); while (Date.now() - t0 < 15000 && !/view=report/.test(page.url())) await page.waitForTimeout(500); if (!/view=report/.test(page.url())) throw new Error('报告未切 view=report：' + page.url()); if (!/report_id=REPORT-[A-Z0-9]+/.test(page.url())) throw new Error('报告 URL 缺 report_id=REPORT-*：' + page.url()); await expect(page.getByText(/只读报告/).first()).toBeVisible({ timeout: 10000 }); await expect(page.getByText('技术力评估报告').first()).toBeVisible({ timeout: 10000 })
  - note: 报告内容含技术优势与技术差距信息（as-built：关键发现节「领先/差距结论…同源摘要」；不钉死算法结论正文，数值归 observed）
    assert: |-
      const body = await page.locator('body').innerText(); if (!body.includes('关键发现')) throw new Error('报告缺「关键发现」节'); if (!/领先\s*\/\s*差距|领先\/差距|优势|短板/.test(body)) throw new Error('报告未呈现优势/差距信息（领先/差距|优势|短板）'); if (!/技术力/.test(body)) throw new Error('报告正文未含技术力语境')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  实勘（2026-10-15T12:12~12:13Z 无头 fixtures/scout/probe-p016c.json + probe-p016d.json + report-page.png）：
  ①用例「差距分析报告」入口 as-built=结果区区块「评估报告」+ button「查看 HTML 报告」（非独立「差距分析报告」文案 → D1）。
  ②点击后同页导航（非 popup）：URL 增 view=report&report_id=REPORT-*（例 REPORT-9BE0F687）；标题「企业评估 · 只读报告」+「技术力评估报告」；有「返回评估结果」。
  ③报告目录含 04 关键发现，正文「领先/差距结论以结果页结构化指标为准；本报告为同源摘要。」——优势与差距以「领先/差距」同词承载（用例「技术优势/技术差距」无独立标题 → D1）；结论细节归算法库，本条不钉死。
  ④结果页另有「技术指标与差距诊断」表列「领先差距与优势短板」（P0-15 邻域）；本条收口报告入口，不重复断言该表。
  ⑤冷深链 view=result 无 analysis_fp 会话时常落「返回配置」空壳（probe-p016/p016b）；正式链必走现场发起/指纹复用，不做冷深链主路径。
  ⑥回退：回填后开始分析 disabled+预检 → throw 带 ticket=ENV-EVAL-TECH-PRECHECK-001（与 P0-13~15 同；零 allow_skip，不假绿）。确定钮偶发 viewport 外 → assert 内 force/DOM click 兜底。
  格式：列表 2 空格缩进；assert 单行 |-，禁折叠块。
tier: B
