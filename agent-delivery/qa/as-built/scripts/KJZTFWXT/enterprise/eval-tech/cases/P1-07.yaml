id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00922
priority: P1
title: 移除对象条目不回写对比篮
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
preconditions:
- 对象区已回填≥2 家
expect:
- note: 该企业从对象区移除
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(600); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('对比篮不足 2 家'); await sels.nth(0).click(); await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500) }; const before = await page.getByText(/来自对比篮 ·/).innerText().catch(()=> ''); const rm = page.locator('[aria-label="移除"]').first(); if (!(await rm.count())) throw new Error('对象区无移除按钮'); await rm.click(); await page.waitForTimeout(800); const after = await page.getByText(/来自对比篮 ·/).innerText().catch(()=> ''); if (before && after && before === after) throw new Error('移除后家数文案未变')
- note: 移除不回写对比篮勾选状态
  assert: |-
    await page.getByRole('button', { name: /返回对比篮调整对象|前往对比篮选择企业/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
