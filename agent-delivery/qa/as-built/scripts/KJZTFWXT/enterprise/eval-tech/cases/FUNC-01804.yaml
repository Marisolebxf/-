id: FUNC-01804
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01804
priority: P1
tier: B
title: 最近评估按此配置新建评估带回企业并停在配置页
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 在一条已完成记录上点击「按此配置新建评估」
expect:
  - note: 1、回到当前分析配置
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=technology&mode=technology';
      const main = () => page.locator('main.app-main').first();
      const companyRe = /[\u4e00-\u9fa5A-Za-z0-9（）()·&]+(?:股份有限公司|有限责任公司|有限公司)/g;
      const namesFrom = (text) => {
        const hits = [...(text || '').matchAll(companyRe)].map((m) => m[0].trim());
        const noise = /评估|分析|技术力|已完成|恢复|删除|新建|报告|系统|模板|对比篮|任务/;
        const fromSummary = (text || '')
          .split(/[、,，]/g)
          .map((s) => s.replace(/等\s*\d+\s*家.*$/, '').trim())
          .filter((s) => /有限公司$/.test(s) && s.length >= 6);
        return [...new Set(hits.concat(fromSummary))].filter((n) => n.length >= 6 && !noise.test(n));
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(recentTab).toBeVisible({ timeout: 12000 });
      await recentTab.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      let cloneBtns = page.getByRole('button', { name: '按此配置新建评估' });
      if ((await cloneBtns.count()) < 1) {
        cloneBtns = page.locator('main').getByText('按此配置新建评估', { exact: true });
      }
      if ((await cloneBtns.count()) < 1) {
        throw new Error('最近评估无「按此配置新建评估」（ticket=ENV-EVAL-TECH-HISTORY-001）');
      }
      let targetBtn = null;
      let rowNames = [];
      for (let i = 0; i < (await cloneBtns.count()); i++) {
        const btn = cloneBtns.nth(i);
        if (!(await btn.isVisible().catch(() => false))) continue;
        const row = btn.locator('xpath=ancestor::tr[1]');
        const rowText = (await row.count()) ? await row.innerText().catch(() => '') : '';
        if (!/已完成/.test(rowText)) continue;
        const names = namesFrom(rowText);
        targetBtn = btn;
        rowNames = names;
        if (names.length > 0) break;
      }
      if (!targetBtn) targetBtn = cloneBtns.first();
      if (rowNames.length < 1) {
        const rowText = await targetBtn.locator('xpath=ancestor::tr[1]').innerText().catch(() => '');
        rowNames = namesFrom(rowText);
      }
      await page.evaluate((names) => { window.__gkx_qa_01804 = { rowNames: names }; }, rowNames);
      await expect(targetBtn).toBeEnabled({ timeout: 8000 });
      await targetBtn.click({ timeout: 10000 });
      const t0 = Date.now();
      while (Date.now() - t0 < 20000) {
        const u = page.url();
        const body = await main().innerText().catch(() => '');
        if (/view=result/.test(u) || (/技术力评估结果/.test(body) && !/指标与权重/.test(body))) break;
        if (/评估模板/.test(body) && /指标与权重/.test(body) && !/view=history/.test(u)) break;
        await page.waitForTimeout(500);
      }
      const currentTab = page.getByRole('tab', { name: '当前分析', exact: true });
      if (await currentTab.isVisible().catch(() => false)) {
        await expect(currentTab).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      }
      await expect(page.getByText('评估模板', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByText('指标与权重', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、评估对象含该行企业
    assert: |-
      const snap = await page.evaluate(() => window.__gkx_qa_01804 || null);
      const main = () => page.locator('main.app-main').first();
      const body = await main().innerText().catch(() => '');
      const url = page.url();
      const removeN = await main().locator('button[aria-label^="移除"]').count();
      const fromBasket = /来自对比篮/.test(body) && !/暂未选择评估对象/.test(body);
      const urlHasCodes = /enterprise_codes=/.test(url);
      const rowNames = (snap && snap.rowNames) || [];
      const nameHit = rowNames.filter((n) => body.includes(n));
      if (removeN > 0 || fromBasket || urlHasCodes) return;
      if (rowNames.length > 0 && nameHit.length > 0) return;
      const hint = rowNames.length ? rowNames.slice(0, 2).join('、') : '行内未解析到公司名';
      throw new Error('评估对象仍空（ticket=ENV-EVAL-TECH-HISTORY-002；' + hint + '）');
  - note: 3、不自动进入结果页
    assert: |-
      const u = page.url();
      const body = await page.locator('main.app-main').first().innerText().catch(() => '');
      if (/view=result/.test(u)) throw new Error('URL 含 view=result：' + u);
      if (/技术力评估结果/.test(body) && !/指标与权重/.test(body)) {
        throw new Error('主区仍为技术力评估结果态');
      }
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id
