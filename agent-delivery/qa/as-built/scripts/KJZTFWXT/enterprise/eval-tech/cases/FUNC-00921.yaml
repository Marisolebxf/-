id: FUNC-00921
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00921
priority: P1
tier: B
title: 浮层内名称搜索、类型筛选与重置
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
expect:
  - note: 名称搜索后列表仅含匹配企业
    assert: |-
      const evalRoute = '/enterprise/evaluation?workspace=technology&mode=technology';
      const pickerQs =
        'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2&compare_picker_max=50';
      const pickerRoot = () =>
        page.locator('.system-compare-panel:visible, .arco-modal:visible').filter({ hasText: '选择分析企业' }).last();
      const rowLabels = async (scope) => {
        const labels = [];
        const sels = scope.locator('[aria-label^="选择 "]');
        const n = await sels.count();
        for (let i = 0; i < n; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const name = aria.replace(/^选择\s*/, '').trim();
          if (name) labels.push(name);
        }
        return labels;
      };
      const openSelectOverlay = async () => {
        const main = page.locator('main');
        await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 15000 });
        const cta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await cta.count() && (await cta.first().isVisible().catch(() => false))) {
          await cta.first().click({ timeout: 8000 });
        } else {
          await page.goto(evalRoute + '&' + pickerQs, { waitUntil: 'domcontentloaded' });
        }
        await page.waitForTimeout(1000);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 15000 });
      };
      await openSelectOverlay();
      let overlay = pickerRoot();
      if (!(await overlay.count())) overlay = page.locator('body');
      let before = await rowLabels(overlay);
      if (before.length < 2) {
        await page.goto(evalRoute + '&' + pickerQs, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        overlay = (await pickerRoot().count()) ? pickerRoot() : page.locator('body');
        before = await rowLabels(overlay);
      }
      if (before.length < 2) throw new Error('浮层企业不足 2 家，无法测过滤');
      const kw = before[0].slice(0, Math.min(4, before[0].length)) || before[0];
      const box = overlay.getByPlaceholder('按企业名称搜索');
      await expect(box).toBeVisible({ timeout: 8000 });
      await box.fill(kw);
      await page.waitForTimeout(800);
      const afterSearch = await rowLabels(overlay);
      if (afterSearch.length < 1) throw new Error('名称搜索后无结果');
      for (const nm of afterSearch) {
        if (!nm.includes(kw)) throw new Error('搜索后列表含不匹配企业: ' + nm);
      }
      await box.fill('');
      await page.waitForTimeout(500);
  - note: 类型筛选后列表仅含该类型企业
    assert: |-
      const root = page.locator('.system-compare-panel:visible, .arco-modal:visible').filter({ hasText: '选择分析企业' }).last();
      if (!(await root.count())) throw new Error('浮层未打开');
      const typeNames = ['高新技术企业', '上市企业', '专精特新', '小巨人', '链主龙头', '小微企业', '外资企业'];
      const openTypeDropdown = async () => {
        const typeView = root.locator('.arco-select-view').first();
        await expect(typeView).toBeVisible({ timeout: 8000 });
        await typeView.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const popup = page.locator('.arco-select-dropdown:visible').last();
        await expect(popup.locator('.arco-select-option').first()).toBeVisible({ timeout: 8000 });
      };
      let picked = null;
      for (const t of typeNames) {
        await openTypeDropdown();
        const opt = page.locator('.arco-select-dropdown:visible .arco-select-option').filter({ hasText: t }).first();
        await opt.click({ timeout: 8000 });
        await page.keyboard.press('Escape');
        await page.waitForTimeout(900);
        const emptyHint = root.getByText('当前篮内无匹配企业');
        const rows = root.locator('[aria-label^="选择 "]');
        const rc = await rows.count();
        if (rc >= 1 && !(await emptyHint.isVisible().catch(() => false))) {
          picked = t;
          break;
        }
        await root.getByRole('button', { name: '重置', exact: true }).first().click();
        await page.waitForTimeout(600);
      }
      if (!picked) throw new Error('各企业类型筛选后均无匹配企业');
      await expect(root.locator('[aria-label^="选择 "]').first()).toBeVisible();
      await expect(root.getByText(picked, { exact: true }).first()).toBeVisible();
  - note: 重置后勾选与筛选回到初始态
    assert: |-
      const overlay = page.locator('.system-compare-panel:visible, .arco-modal:visible').filter({ hasText: '选择分析企业' }).last();
      await overlay.getByRole('button', { name: '重置', exact: true }).first().click();
      await page.waitForTimeout(700);
      const searchVal = await overlay.getByPlaceholder('按企业名称搜索').inputValue();
      if (searchVal && searchVal.trim()) throw new Error('重置后搜索框未清空');
      await expect(overlay.locator('.arco-select-view').filter({ hasText: /全部企业类型/ }).first()).toBeVisible({ timeout: 8000 });
      const ok = overlay.getByRole('button', { name: '确定', exact: true });
      await expect(ok).toBeDisabled();
      const checked = overlay.locator('.arco-checkbox-checked');
      await expect(checked).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
