id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00906
priority: P0
title: 对象回填后数据覆盖与可信度区出现五档可信度筛选（as-built 为下拉）
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-tech
preconditions:
  - 已进入技术力评估页
  - 对比篮至少有 2 家企业（env-gate 实勘 basket_count≥2）
locators:
  section_title: 数据覆盖与可信度
  filter_select: '.arco-select-view[aria-label="筛选数据可信度"]'
  popup: '.arco-trigger-popup:visible'
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 打开浮层勾选 2 家企业后点确定，浏览数据覆盖与可信度区
expect:
  - note: 勾选 2 家确定后「数据覆盖与可信度」区出现可信度筛选控件
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('对比篮不足 2 家'); await sels.nth(0).click(); await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2500); await expect(page.getByText('数据覆盖与可信度', { exact: true }).first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view[aria-label="筛选数据可信度"]')).toBeVisible({ timeout: 8000 })
  - note: 筛选项含全部可信度、高可信、中可信、低可信、不可生成五档
    assert: |-
      const trig = page.locator('.arco-select-view[aria-label="筛选数据可信度"]'); await trig.click({ timeout: 8000 }); const pop = page.locator('.arco-trigger-popup:visible').last(); await expect(pop).toBeVisible({ timeout: 8000 }); for (const t of ['全部可信度', '高可信', '中可信', '低可信', '不可生成']) { await expect(pop.getByText(t, { exact: true })).toBeVisible({ timeout: 4000 }) } await page.keyboard.press('Escape'); await page.waitForTimeout(300)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  D2 偏差：用例与备注称「五档可信度筛选 Tab（页签）」；2026-10-15 无头实勘为 Arco 下拉筛选（aria-label=筛选数据可信度，触发器回显 title=全部可信度，选项恰为五档且顺序一致），脚本跟现场。五档选项文本以 fixtures/testdata.yaml coverage.tabs 为词单。
  环境增量：env-gate 当日复测（scout-p007*.json）预检不再失败、区块正常渲染（当前可见 2/2 家、开始分析 enabled）；若预检复发阻塞本区块，回退口径按门控态断言 + ticket=ENV-EVAL-TECH-PRECHECK-001。
  格式注：本文件列表用 2 空格缩进——run-scripts.mjs 极简 YAML 解析器只认缩进列表，`k:` 下顶格列表会截断整文件（存量 20 个 cases 文件为顶格风格，机跑解析为空，已另报父单）。
tier: B
