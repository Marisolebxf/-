id: P0-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00909
priority: P0
title: 取消勾选技术指标可移出并恢复回显
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
steps:
- action: goto
  target: /enterprise/evaluation?workspace=technology&mode=technology
expect:
- note: 取消勾选后该指标移出当次组合
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; const cb = page.locator('label.arco-checkbox').filter({ has: page.getByText('技术合作') }).first(); const target = (await cb.count()) ? cb : page.locator('.arco-checkbox').nth(3); await target.click({ timeout: 8000 }); await page.waitForTimeout(500); const sumTxt = await page.getByText(/权重合计/).first().innerText(); if (!sumTxt) throw new Error('无权重和提示')
- note: 恢复勾选后该指标权重回显
  assert: |-
    const cb2 = page.locator('label.arco-checkbox').filter({ has: page.getByText('技术合作') }).first(); const target2 = (await cb2.count()) ? cb2 : page.locator('.arco-checkbox').nth(3); await target2.click({ timeout: 8000 }); await page.waitForTimeout(500); const spins = page.locator('[role=spinbutton]'); await expect(spins).toHaveCount(5, { timeout: 8000 }); const v = await spins.nth(3).inputValue(); if (v === '' || v === null) throw new Error('恢复后权重未回显')
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
