id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00905
priority: P1
title: 浮层未勾选时取消选择与确定禁用
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
steps:
- action: click
  target: 前往对比篮选择企业
expect:
- note: 未勾选时「取消选择」与「确定」均为禁用态且浮层不关闭
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); if (!(await page.getByText('选择分析企业').count())) throw new Error('浮层未开'); const clear = page.getByRole('button', { name: '取消选择' }); const ok = page.getByRole('button', { name: '确定' }); if (!(await clear.isDisabled())) throw new Error('未勾选时取消选择应禁用'); if (!(await ok.isDisabled())) throw new Error('未勾选时确定应禁用')
- note: 「取消选择」可清空当前勾选
  assert: |-
    const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('对比篮不足 2 家'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(300); const clear = page.getByRole('button', { name: '取消选择' }); if (await clear.isDisabled()) throw new Error('勾选后取消选择仍禁用'); await clear.click(); await page.waitForTimeout(400)
- note: 清空后「确定」回到禁用且对象区无回填
  assert: |-
    const ok = page.getByRole('button', { name: '确定' }); if (!(await ok.isDisabled())) throw new Error('清空后确定应禁用'); await page.getByRole('button', { name: '取消' }).click(); await page.waitForTimeout(500); if (await page.getByText(/来自对比篮 ·/).count()) throw new Error('对象区被回填')
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
