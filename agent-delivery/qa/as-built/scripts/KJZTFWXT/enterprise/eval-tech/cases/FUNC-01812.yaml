id: FUNC-01812
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01812
priority: P1
title: 选择分析企业浮层移除篮内企业立即消失
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
tier: B
preconditions:
  - 「选择分析企业」浮层已打开（脚本自含入篮≥2 与开浮层）
  - 篮内至少有 1 家企业
locators:
  picker_title: text「选择分析企业」
  remove_btn: button aria-label「移除」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 开浮层后对一家企业点「移除」；名单与计数在 expect 判定（无确认弹框）
expect:
  - note: 1、该企业不再出现在篮内；2、篮内企业计数减少
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, await addBtns.count() - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(800);
          n = await basketEntCount();
          if (n < min && idx >= await addBtns.count() - 1) break;
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const gotoEvalTech = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 10000 });
      };
      const openSelectOverlay = async () => {
        const pickerQs =
          'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50';
        const main = page.locator('main');
        const cta = main.getByRole('button', { name: /多企业技术力对比分析|前往对比篮选择企业/ }).first();
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        }
        if (!(await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false))) {
          await page.goto(toUrl(`${evalRoute}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
        }
        if (!(await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false))) {
          const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
          if (await dockBtn.count()) {
            await dockBtn.click({ timeout: 10000 });
            await page.waitForTimeout(1000);
          }
        }
      };
      const pickerRoot = () =>
        page.locator('.system-compare-panel:visible, .arco-modal:visible').filter({ hasText: '选择分析企业' }).last();
      const listEnterpriseNames = async (scope) => {
        const names = [];
        const cards = scope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        for (let i = 0; i < cardN; i++) {
          const card = cards.nth(i);
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = scope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const overlayEnterpriseCount = async (scope) => {
        const txt = (await scope.innerText()).replace(/\s+/g, ' ');
        const m = txt.match(/企业\s*(\d+)\s*\/\s*50/);
        if (m) return parseInt(m[1], 10);
        const names = await listEnterpriseNames(scope);
        return names.length;
      };
      await ensureBasketEnterprises(2);
      await gotoEvalTech();
      await closeBasket();
      await openSelectOverlay();
      await page.waitForTimeout(800);
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      const scope = pickerRoot();
      await expect(scope).toBeVisible({ timeout: 10000 });
      const removeBtns = scope.getByRole('button', { name: '移除', exact: true });
      await expect(removeBtns.first()).toBeVisible({ timeout: 15000 });
      const beforeRemoveN = await removeBtns.count();
      if (beforeRemoveN < 1) throw new Error('浮层篮内无移除按钮');
      const beforeNames = await listEnterpriseNames(scope);
      if (beforeNames.length < 1) throw new Error('篮内应有至少 1 家企业，实际 0');
      const beforeCount = await overlayEnterpriseCount(scope);
      const targetName = beforeNames[0];
      const removeBtn = scope.locator('.ent-compare-item-card').filter({ hasText: targetName }).getByRole('button', { name: '移除', exact: true }).first();
      const rm = (await removeBtn.count()) ? removeBtn : removeBtns.first();
      await rm.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const confirmModal = page.locator('.arco-modal:visible').filter({ hasText: /移除|删除|确认/ });
      if (await confirmModal.count()) {
        throw new Error('移除不应弹出确认框（用例备注：移除没有弹出框）');
      }
      const afterScope = pickerRoot();
      const afterNames = await listEnterpriseNames(afterScope);
      const afterRemoveN = await afterScope.getByRole('button', { name: '移除', exact: true }).count();
      if (afterNames.includes(targetName)) {
        throw new Error('移除后企业仍在篮内：' + targetName);
      }
      const afterCount = await overlayEnterpriseCount(afterScope);
      if (afterCount >= beforeCount) {
        throw new Error(`篮内企业计数应减少（前 ${beforeCount} 后 ${afterCount}）`);
      }
      if (afterRemoveN >= beforeRemoveN) {
        throw new Error(`移除钮数量应减少（前 ${beforeRemoveN} 后 ${afterRemoveN}）`);
      }
      if (beforeCount > 0 && afterCount >= beforeCount && afterNames.length >= beforeNames.length) {
        throw new Error(`计数与名单未减少：前 ${beforeCount}/${beforeNames.length} 后 ${afterCount}/${afterNames.length}`);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例 01812；浮层篮内点 aria-label「移除」无二次确认（与 01811/01826 清空对比篮不同）。30888 路由 enterprise-center/evaluation；入篮≥2 以便断言计数减少。企业数读浮层「企业 N/50」或名单条数。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
