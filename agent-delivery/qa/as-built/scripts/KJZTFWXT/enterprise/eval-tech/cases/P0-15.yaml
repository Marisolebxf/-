priority: P0
title: 结果态展示技术力排名且默认按得分降序
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
preconditions:
  - 已处于结果态且评估对象含至少 2 家企业（脚本内现场发起：复用 P0-14 三分支链回填 2 家 + 开始分析）
locators:
  start: button「开始分析」
  restore: button「恢复结果」（最近评估 Tab；空壳兜底，禁冷深链）
  rank_title: 技术力加权排名（as-built；用例称「技术力排名」）
  rank_count: \d+ 家企业
  score_col: 技术力综合得分
  sort_asc: 无升序入口（实勘 has_asc_btn=false）
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 复用 P0-14 三分支先收口结果态（body 就绪轮询；空壳走最近评估「恢复结果」，禁无 fp 冷深链），再断排名区块标题/名次得分呈现与默认降序；机检在 expect
expect:
  - note: 先到结果态——现场发起后轮询至 body 呈现「技术力评估结果」+\d+分（勿只靠 URL）；空壳则 reload 保 fp 或「最近评估→恢复结果」；禁无 analysis_fp 冷深链；数值不钉死
    assert: |-
      await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('button[aria-label="关闭对比篮"]'); if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) { try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} } await page.getByRole('button', { name: /前往对比篮选择企业|返回对比篮调整对象/ }).first().click({ timeout: 8000 }); const sels = page.locator('[aria-label^="选择 "]'); await sels.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {}); await page.waitForTimeout(800); const n = await sels.count(); if (n < 2) throw new Error('可选企业不足'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(500); const okBtn = page.getByRole('button', { name: '确定' }).first(); await okBtn.scrollIntoViewIfNeeded().catch(() => {}); try { await okBtn.click({ timeout: 5000 }) } catch { try { await okBtn.click({ force: true, timeout: 5000 }) } catch { await okBtn.evaluate((el) => el.click()) } } await page.waitForTimeout(2500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) { throw new Error('回填后开始分析禁用（预检复发？ticket=ENV-EVAL-TECH-PRECHECK-001）') }; await start.click(); let branch = null; const t0 = Date.now(); while (Date.now() - t0 < 5000) { const procEl = page.getByText(/技术力评估生成中|可视化分析过程/).first(); if (await procEl.isVisible().catch(() => false)) { branch = 'processing'; break } if (/view=result/.test(page.url())) { branch = 'result'; break } await page.waitForTimeout(300) } const bodyRes = async () => { const t = await page.locator('body').innerText().catch(() => ''); return /技术力评估结果/.test(t) && /\d+\s*分/.test(t) }; const waitBody = async (ms) => { const t = Date.now(); while (Date.now() - t < ms) { if (await bodyRes()) return true; await page.waitForTimeout(1000) } return await bodyRes() }; if (!(await bodyRes())) { const t1 = Date.now(); while (Date.now() - t1 < 90000) { if (/view=result/.test(page.url())) branch = 'result'; if (await bodyRes()) { branch = (branch === 'result' ? 'url_then_body' : 'inplace'); break } await page.waitForTimeout(1000) } } if (!(await bodyRes()) && /view=result/.test(page.url()) && /analysis_fp=/.test(page.url())) { await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2000); if (await waitBody(60000)) branch = 'reload_fp' } if (!(await bodyRes())) { const tab = page.getByRole('tab', { name: /最近评估/ }).first(); if (await tab.isVisible().catch(() => false)) { try { await tab.click({ timeout: 3000 }); await page.waitForTimeout(1500) } catch {} } const restore = page.getByRole('button', { name: '恢复结果' }); if ((await restore.count()) < 1) throw new Error('结果内容未呈现且最近评估无「恢复结果」（branch=' + branch + '，ticket=ENV-EVAL-TECH-RESULT-SHELL-001）：' + page.url()); await restore.first().click({ timeout: 8000 }); if (!(await waitBody(60000))) throw new Error('恢复结果后仍无「技术力评估结果」+\\d+分（branch=' + branch + '，ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）'); branch = 'restore' } if (!(await bodyRes())) throw new Error('结果态内容未呈现（branch=' + branch + '，ticket=ENV-EVAL-TECH-RESULT-SHELL-001，URL=' + page.url() + '）'); if (/view=result/.test(page.url())) { if (!/workspace=technology/.test(page.url())) throw new Error('结果态 URL 缺 workspace=technology：' + page.url()); if (!/task_id=EVAL-\d{8}-\d{3}/.test(page.url())) throw new Error('结果态 URL 缺 task_id=EVAL-YYYYMMDD-NNN：' + page.url()) } else { if (!/workspace=technology/.test(page.url())) throw new Error('慢态原地渲染 URL 缺 workspace=technology：' + page.url()) }
  - note: 排名区块列出各对比企业的名次与得分（as-built 标题「技术力加权排名」+ 家数提示 + 排名 canvas；名次/得分由表行企业名+技术力综合得分列代理，名次数值标签归 observed）
    assert: |-
      await expect(page.getByText('技术力加权排名').first()).toBeVisible({ timeout: 15000 }); await expect(page.getByText(/\d+\s*家企业/).first()).toBeVisible({ timeout: 10000 }); let rank = { ok: false }; for (let i = 0; i < 20 && !rank.ok; i++) { rank = await page.evaluate(() => { const own = (w) => [...document.querySelectorAll('*')].find((e) => [...e.childNodes].some((c) => c.nodeType === 3 && String(c.textContent).includes(w))) || [...document.querySelectorAll('*')].find((e) => e.children.length === 0 && (e.textContent || '').includes(w)); const t = own('技术力加权排名'); if (!t) return { ok: false }; let b = t; for (let i = 0; i < 12 && b; i++) { b = b.parentElement; if (b && b.querySelector('canvas')) break } return { ok: !!(b && b.querySelector('canvas')) } }); if (!rank.ok) await page.waitForTimeout(1500) } if (!rank.ok) throw new Error('排名区块内未呈现 canvas（30s 轮询超时）'); const listing = await page.evaluate(() => { const body = document.body.innerText || ''; if (!body.includes('技术力综合得分')) return { ok: false, reason: '缺列「技术力综合得分」' }; const cos = [...body.matchAll(/([\u4e00-\u9fffA-Za-z0-9]+(?:公司|集团))\n(\d{1,3})\n/g)].map((m) => ({ name: m[1], score: Number(m[2]) })); if (cos.length < 2) { const table = document.querySelector('table, .arco-table'); if (!table) return { ok: false, reason: '企业得分序列不足且无表' }; const rows = [...table.querySelectorAll('tbody tr, .arco-table-body .arco-table-tr, .arco-table-tr')].map((tr) => [...tr.querySelectorAll('td, .arco-table-td')].map((c) => (c.innerText || '').trim().replace(/\s+/g, ' '))).filter((cells) => cells.some((c) => /公司|集团/.test(c))); const fromRows = rows.map((cells) => { const name = cells.find((c) => /公司|集团/.test(c)); const score = cells.find((c, idx) => idx > 0 && /^\d{1,3}$/.test(c)); return name && score ? { name, score: Number(score) } : null }).filter(Boolean); if (fromRows.length < 2) return { ok: false, reason: '对比企业得分行不足 2' }; return { ok: true, cos: fromRows } } return { ok: true, cos } }); if (!listing.ok) throw new Error('排名名次/得分未列出: ' + listing.reason); if (listing.cos.length < 2) throw new Error('对比企业不足 2 家: ' + JSON.stringify(listing.cos))
  - note: 默认按技术力得分降序排列（表行/正文企业得分序列单调非增；升序入口现场缺失，不测切换）
    assert: |-
      const order = await page.evaluate(() => { const body = document.body.innerText || ''; let cos = [...body.matchAll(/([\u4e00-\u9fffA-Za-z0-9]+(?:公司|集团))\n(\d{1,3})\n/g)].map((m) => ({ name: m[1], score: Number(m[2]) })); if (cos.length < 2) { const table = document.querySelector('table, .arco-table'); const rows = table ? [...table.querySelectorAll('tbody tr, .arco-table-body .arco-table-tr, .arco-table-tr')].map((tr) => [...tr.querySelectorAll('td, .arco-table-td')].map((c) => (c.innerText || '').trim().replace(/\s+/g, ' '))).filter((cells) => cells.some((c) => /公司|集团/.test(c))) : []; cos = rows.map((cells) => { const name = cells.find((c) => /公司|集团/.test(c)); const score = cells.find((c, idx) => idx > 0 && /^\d{1,3}$/.test(c)); return name && score ? { name, score: Number(score) } : null }).filter(Boolean) } const scores = cos.map((c) => c.score); const desc = scores.length >= 2 && scores.every((s, i) => i === 0 || scores[i - 1] >= s); return { cos: cos.slice(0, 6), scores, desc } }); if (!order.desc) throw new Error('默认未按技术力得分降序: ' + JSON.stringify(order.cos))
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  实勘（2026-10-15T12:01Z 无头 fixtures/scout/probe-p015.json + result-rank.png）：复用 P0-14 链（浮层回填 2 家→开始分析→乙分支指纹直达 view=result）后——
  ①排名区块标题 as-built=「技术力加权排名」（用例「技术力排名」→ D1）；副标「2 家企业」；区块内 ECharts canvas（与 probe-p014 near_title 一致）。
  ②紧邻「技术指标与差距诊断」表承载企业名+技术力综合得分列（华为 75 → 小飞鱼 25），scores_desc=true；名次无独立「第 N」标签，以行序代理（名次并列口径归 observed）。
  ③升序/排序入口：has_asc_btn=false、has_sort_trigger=false（coverage 开放项 4 → D2：无入口按 as-built 记，本条不测升序切换）。
  ④回退：回填后开始分析 disabled+预检文案 → throw 带 ticket=ENV-EVAL-TECH-PRECHECK-001（与 P0-13/14 同；零 allow_skip，不假绿）。
  ⑤REWORK（验收 Task 8142634d C6 / runs/20261015-50892-eval-tech-r3-runner）：URL 已含 view=result+task_id=EVAL-20261015-004 但 body 无「技术力评估结果」+\d+分；旧兜底无 analysis_fp 冷深链必落「返回配置」空壳（probe-p015-rework.json cold_deeplink.has_back_cfg=true）。修法：①body 就绪统一轮询 90s（勿只靠 URL）；②同 URL 含 analysis_fp 时 reload 再等 60s；③仍空走「最近评估→恢复结果」（probe-p015-restore.json：同 tid-004 带 fp 约 1s 出正文+排名）；④禁止无 fp 冷深链；仍空真红 ticket=ENV-EVAL-TECH-RESULT-SHELL-001。
  边界：得分数值正确性归算法库；本条前置现场发起链，不做冷深链主路径。
  格式：列表 2 空格缩进；assert 单行 |-，禁折叠块。
