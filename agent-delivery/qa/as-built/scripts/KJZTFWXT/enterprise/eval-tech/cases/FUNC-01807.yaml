id: FUNC-01807
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01807
priority: P1
tier: B
title: 已取消记录点继续查看后进入失败页
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 最近评估→定位「已取消」行→点「继续查看」；失败页断言在 expect
expect:
  - note: 1、页面出现「评估失败」
    assert: |-
      const main = () => page.locator('main.diagnosis-main').first();
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const pickCancelledContinueOnPage = async () => {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = await row.innerText().catch(() => '');
          if (!/已取消/.test(rowText)) continue;
          const cont = row.getByRole('button', { name: '继续查看' }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          return cont;
        }
        return null;
      };
      const pickCancelledContinue = async () => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 12; guard++) {
          const btn = await pickCancelledContinueOnPage();
          if (btn) return btn;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      const continueBtn = await pickCancelledContinue();
      if (!continueBtn) {
        throw new Error('最近评估无状态为已取消的记录（ticket=ENV-EVAL-TECH-HISTORY-CANCELLED-001）');
      }
      await continueBtn.scrollIntoViewIfNeeded().catch(() => {});
      await continueBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await expect(main().getByText('评估失败', { exact: true }).first()).toBeVisible({ timeout: 20000 });
  - note: 2、出现「重试」与「按此配置新建」
    assert: |-
      const main = () => page.locator('main.diagnosis-main').first();
      await expect(main().getByRole('button', { name: '重试' }).first()).toBeVisible({ timeout: 10000 });
      await expect(main().getByRole('button', { name: '按此配置新建' }).first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
