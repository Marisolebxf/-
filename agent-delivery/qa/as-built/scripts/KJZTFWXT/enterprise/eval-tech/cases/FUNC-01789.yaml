id: FUNC-01789
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01789
priority: P1
tier: B
title: 备选-当天再次开始
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 用例册 01788 建立当天成功结果，00923 调整配置回到带企业的配置区
expect:
  - note: 1、打开已有的技术力评估结果
    assert: |-
      const evalPath = '/enterprise/evaluation?workspace=technology&mode=technology';
      const tidRe = /((?:DEMO-)?EVAL-\d{8}-\d+)/;
      const parseTid = (url) => {
        const m = (url || '').match(/task_id=((?:DEMO-)?EVAL-\d{8}-\d+)/);
        return m ? decodeURIComponent(m[1]) : null;
      };
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /技术力评估结果/.test(t) && /技术力最高得分/.test(t) && /\d+\s*分/.test(t);
      };
      const addTwoViaNew = async () => {
        for (let i = 0; i < 2; i++) {
          await page.getByRole('button', { name: '新增', exact: true }).click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const search = page.getByPlaceholder(/企业名称|搜索/).first();
          await search.fill(i === 0 ? '华为' : '腾讯');
          await page.waitForTimeout(1200);
          await page.getByRole('button', { name: '加入对比篮', exact: true }).first().click({ timeout: 10000 });
          await page.waitForTimeout(1000);
        }
      };
      const openPicker = async () => {
        await closeBasket();
        const adj = page.getByRole('button', { name: '调整配置' });
        if (await adj.count() && await adj.first().isVisible().catch(() => false)) {
          await adj.first().click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        }
        const cta = main().getByRole('button', { name: /多企业技术力对比分析|前往对比篮选择企业/ }).first();
        await expect(cta).toBeVisible({ timeout: 15000 });
        await cta.click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      };
      const fillTwoFromBasket = async () => {
        await openPicker();
        let rows = page.locator('[aria-label^="选择 "]');
        if (await rows.count() < 2) {
          await addTwoViaNew();
          rows = page.locator('[aria-label^="选择 "]');
        }
        if (await rows.count() < 2) throw new Error('浮层可选企业不足 2 家');
        await rows.nth(0).click();
        await rows.nth(1).click();
        const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
        await expect(confirm).toBeEnabled({ timeout: 8000 });
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await closeBasket();
        if (/暂未选择评估对象/.test(await main().innerText().catch(() => ''))) throw new Error('确定后对象区仍为空态');
      };
      const clickStartAndWaitResult = async (maxMs) => {
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) throw new Error('开始分析禁用');
        await start.click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          if (await bodyResultReady()) return { ok: true, url: page.url() };
          const url = page.url();
          if (/view=result/.test(url) && await page.getByText('技术力评估结果').first().isVisible().catch(() => false)) {
            return { ok: true, url };
          }
          if (/评估失败|暂无评估结果资产/.test(await page.locator('body').innerText().catch(() => ''))) {
            throw new Error('分析终态失败：' + url);
          }
          await page.waitForTimeout(800);
        }
        return { ok: false, url: page.url() };
      };
      if (!page.url().includes('/enterprise/evaluation')) {
        await page.goto(evalPath, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await fillTwoFromBasket();
      const first = await clickStartAndWaitResult(180000);
      if (!first.ok) throw new Error('前置首次分析未到结果态：' + first.url);
      const baselineTid = parseTid(page.url()) || (tidRe.exec(await page.locator('body').innerText().catch(() => '')) || [])[1];
      if (!baselineTid) throw new Error('首次结果未见 task_id：' + page.url());
      const adjBtn = page.getByRole('button', { name: '调整配置' });
      await expect(adjBtn.first()).toBeVisible({ timeout: 10000 });
      await adjBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await closeBasket();
      if (/暂未选择评估对象/.test(await main().innerText().catch(() => ''))) throw new Error('调整配置后对象区丢失');
      await page.evaluate((id) => sessionStorage.setItem('func01789_baseline_tid', id), baselineTid);
      const start2 = page.getByRole('button', { name: '开始分析' });
      await expect(start2).toBeEnabled({ timeout: 15000 });
      await start2.click({ timeout: 8000 });
      const t1 = Date.now();
      while (Date.now() - t1 < 45000) {
        if (await bodyResultReady()) break;
        if (/view=result/.test(page.url()) && await page.getByText('技术力评估结果').first().isVisible().catch(() => false)) break;
        await page.waitForTimeout(500);
      }
      await expect(main().getByRole('heading', { name: '技术力评估结果' }).first()).toBeVisible({ timeout: 20000 });
  - note: 2、出现「已打开今天相同条件的评估结果」
    assert: |-
      await expect(page.getByText('已打开今天相同条件的评估结果').first()).toBeVisible({ timeout: 15000 });
  - note: 3、任务 ID 与当天已成功的那次相同
    assert: |-
      const tidRe = /((?:DEMO-)?EVAL-\d{8}-\d+)/;
      const parseTid = (url) => {
        const m = (url || '').match(/task_id=((?:DEMO-)?EVAL-\d{8}-\d+)/);
        return m ? decodeURIComponent(m[1]) : null;
      };
      const baselineTid = await page.evaluate(() => sessionStorage.getItem('func01789_baseline_tid'));
      if (!baselineTid) throw new Error('缺少基线 task_id');
      const finalTid = parseTid(page.url()) || (tidRe.exec(await page.locator('body').innerText().catch(() => '')) || [])[1];
      if (!finalTid) throw new Error('二次开始后未见 task_id：' + page.url());
      expect(finalTid).toBe(baselineTid);
on_fail: 截图 + 抄 X-Trace-Id
