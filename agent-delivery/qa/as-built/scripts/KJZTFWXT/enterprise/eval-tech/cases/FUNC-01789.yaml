id: FUNC-01789
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01789
priority: P1
title: 当天相同条件再次开始分析打开已有结果且不新增任务
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 当天已有相同企业与模板的成功结果；配置区已带回这组企业（脚本自含：先跑通 1 次分析再回配置）
locators:
  start: button「开始分析」
  adjust: button「调整配置」
  same_day_hint: 已打开今天相同条件的评估结果
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 前置建立当天成功结果→调整配置→再次点「开始分析」；判定在 expect
expect:
  - note: 1、打开已有的技术力评估结果；2、出现「已打开今天相同条件的评估结果」；3、任务 ID 与当天已成功的那次相同（不新增任务）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const tidRe = /((?:DEMO-)?EVAL-\d{8}-\d+)/;
      const parseTid = (url) => {
        const m = (url || '').match(/task_id=((?:DEMO-)?EVAL-\d{8}-\d+)/);
        return m ? decodeURIComponent(m[1]) : null;
      };
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /技术力评估结果/.test(t) && /技术力最高得分/.test(t) && /\d+\s*分/.test(t);
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const recSection = page.locator('main').locator('section').filter({ hasText: '推荐企业' }).first();
        await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 15000 });
        const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
        const cardCount = await cards.count();
        if (cardCount < min) throw new Error('推荐企业卡不足 ' + min + ' 张');
        for (let i = 0; n < min && i < cardCount; i++) {
          const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
          if (!(await btn.count()) || !(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min);
      };
      const fillTwoFromBasket = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const adj = page.getByRole('button', { name: '调整配置' });
        if (await adj.count() && await adj.first().isVisible().catch(() => false)) {
          await adj.first().click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        }
        const cta = main().getByRole('button', { name: /多企业技术力对比分析|前往对比篮选择企业/ }).first();
        if (await cta.isVisible().catch(() => false)) await cta.click({ timeout: 8000 });
        else {
          await page.goto(toUrl(evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2'), { waitUntil: 'domcontentloaded' });
        }
        await page.waitForTimeout(1000);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
        const rows = page.locator('[aria-label^="选择 "]');
        if (await rows.count() < 2) throw new Error('浮层可选企业不足 2 家');
        await rows.nth(0).click();
        await rows.nth(1).click();
        const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
        await expect(confirm).toBeEnabled({ timeout: 8000 });
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await closeBasket();
        if (/暂未选择评估对象/.test(await main().innerText().catch(() => ''))) throw new Error('确定后对象区仍为空态');
      };
      const clickStartAndWaitResult = async (maxMs) => {
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) {
          if (/预检未返回企业明细/.test(await page.locator('body').innerText())) {
            throw new Error('开始分析禁用（ticket=ENV-EVAL-TECH-PRECHECK-001）');
          }
          throw new Error('开始分析禁用');
        }
        await start.click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          if (await bodyResultReady()) return { ok: true, url: page.url() };
          const url = page.url();
          if (/view=result/.test(url) && await page.getByText('技术力评估结果').first().isVisible().catch(() => false)) {
            return { ok: true, url };
          }
          if (/评估失败|暂无评估结果资产/.test(await page.locator('body').innerText().catch(() => ''))) {
            throw new Error('分析终态失败：' + url);
          }
          await page.waitForTimeout(800);
        }
        return { ok: false, url: page.url() };
      };
      await ensureBasketEnterprises(2);
      await fillTwoFromBasket();
      const first = await clickStartAndWaitResult(180000);
      if (!first.ok) throw new Error('前置首次分析未到结果态（ticket=ENV-EVAL-TECH-RESULT-SHELL-001）：' + first.url);
      const baselineTid = parseTid(page.url()) || (tidRe.exec(await page.locator('body').innerText().catch(() => '')) || [])[1];
      if (!baselineTid) throw new Error('首次结果未见 task_id：' + page.url());
      const adjBtn = page.getByRole('button', { name: '调整配置' });
      if (!(await adjBtn.count()) || !(await adjBtn.first().isVisible().catch(() => false))) {
        throw new Error('结果态未见「调整配置」，无法回到同条件配置区');
      }
      await adjBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await closeBasket();
      const cfgBody = await main().innerText().catch(() => '');
      if (/暂未选择评估对象/.test(cfgBody)) throw new Error('调整配置后对象区丢失（前置未满足「配置区已带回企业」）');
      const start2 = page.getByRole('button', { name: '开始分析' });
      await expect(start2).toBeEnabled({ timeout: 15000 });
      await start2.click({ timeout: 8000 });
      let sawHint = false;
      let sawNewProcessingTid = null;
      const t1 = Date.now();
      while (Date.now() - t1 < 45000) {
        const body = await page.locator('body').innerText().catch(() => '');
        if (/已打开今天相同条件的评估结果/.test(body)) sawHint = true;
        const u = page.url();
        const cur = parseTid(u);
        if (/view=processing/.test(u) && cur && cur !== baselineTid) sawNewProcessingTid = cur;
        if (await bodyResultReady()) break;
        if (/view=result/.test(u) && await page.getByText('技术力评估结果').first().isVisible().catch(() => false)) break;
        await page.waitForTimeout(500);
      }
      if (!(await bodyResultReady())) {
        if (/analysis_fp=/.test(page.url())) {
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
        }
        const tWait = Date.now();
        while (Date.now() - tWait < 20000 && !(await bodyResultReady())) await page.waitForTimeout(800);
        if (!(await bodyResultReady())) throw new Error('二次开始后未到结果态：' + page.url());
      }
      const finalTid = parseTid(page.url()) || (tidRe.exec(await page.locator('body').innerText().catch(() => '')) || [])[1];
      if (!finalTid) throw new Error('二次开始后未见 task_id：' + page.url());
      if (finalTid !== baselineTid) {
        throw new Error('任务 ID 变化（疑似新增任务）：基线 ' + baselineTid + ' 当前 ' + finalTid + '；processing新tid=' + sawNewProcessingTid);
      }
      if (sawNewProcessingTid) {
        throw new Error('二次开始进入新任务过程态 ' + sawNewProcessingTid + '（基线 ' + baselineTid + '）');
      }
      const bodyAfter = await page.locator('body').innerText().catch(() => '');
      if (!/已打开今天相同条件的评估结果/.test(bodyAfter) && !sawHint) {
        await expect(page.getByText('已打开今天相同条件的评估结果').first()).toBeVisible({ timeout: 5000 });
      }
      await expect(main().getByRole('heading', { name: '技术力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      if (parseTid(page.url()) && parseTid(page.url()) !== baselineTid) {
        throw new Error('URL task_id 与基线不一致');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01789 附录 E.5：同用户同条件当天已成功→再次「开始分析」应直达已有结果且 task_id 不变；现场提示「已打开今天相同条件的评估结果」（probe-p016/p016c report_block）。
  30888 路由 enterprise-center/evaluation；前置在 assert 内完成首次分析+调整配置（用例前置 1/2）。若二次开始落入 view=processing 且 task_id≠基线→判失败（与 01790 重新分析对立）。
  B 档零 allow_skip；预检 ENV-EVAL-TECH-PRECHECK-001；空壳 ENV-EVAL-TECH-RESULT-SHELL-001。
