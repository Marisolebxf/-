id: FUNC-01801
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01801
priority: P1
title: 从只读报告点击「返回评估结果」回到技术力评估结果
story: US-ENT-EVAL-TECH
entry_id: ent-eval-tech
tier: B
preconditions:
  - 已打开技术力评估报告（脚本内：结果态→查看 HTML 报告）
locators:
  back_result: button「返回评估结果」
  result_heading: heading「技术力评估结果」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 进入报告态→点「返回评估结果」→断言回到结果区；机检在 expect
expect:
  - note: 1、回到「技术力评估结果」（结果区标题与得分语境可见，非只读报告页）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        return /技术力评估结果/.test(t) && /技术力最高得分/.test(t) && /\d+\s*分/.test(t);
      };
      const openRecentResult = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const restore = main().getByRole('button', { name: /恢复结果|查看结果/ }).first();
        if (!(await restore.isVisible().catch(() => false))) return false;
        await restore.click({ timeout: 8000 });
        await page.waitForTimeout(3500);
        if (!/view=result/.test(page.url())) {
          const tid = (/DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3}/.exec(await main().innerText().catch(() => '')) || [])[0];
          if (tid) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=technology&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
          }
        }
        return await bodyResultReady();
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const recSection = main().locator('section').filter({ hasText: '推荐企业' }).first();
        await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 15000 });
        const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
        for (let i = 0; n < min && i < await cards.count(); i++) {
          const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
          if (!(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min);
      };
      const startAnalysisFallback = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const cta = main().getByRole('button', { name: /多企业技术力对比分析|前往对比篮选择企业/ }).first();
        if (await cta.isVisible().catch(() => false)) await cta.click({ timeout: 8000 });
        else await page.goto(toUrl(evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
        const rows = page.locator('[aria-label^="选择 "]');
        if (await rows.count() < 2) throw new Error('浮层可选企业不足 2 家');
        await rows.nth(0).click();
        await rows.nth(1).click();
        const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
        await expect(confirm).toBeEnabled({ timeout: 8000 });
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await closeBasket();
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) throw new Error('开始分析禁用（ticket=ENV-EVAL-TECH-PRECHECK-001）');
        await start.click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 120000 && !(await bodyResultReady())) {
          if (/view=result/.test(page.url())) {
            const tid = new URL(page.url()).searchParams.get('task_id');
            if (tid && (Date.now() - t0) % 15000 < 1200) {
              await page.goto(toUrl(evalRoute + '&view=result&analysis_type=technology&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2000);
            }
          }
          const errBody = await page.locator('body').innerText().catch(() => '');
          if (/评估失败|暂无评估结果资产/.test(errBody)) throw new Error('任务终态失败或空结果（D3）：' + page.url());
          await page.waitForTimeout(1000);
        }
        if (!(await bodyResultReady())) throw new Error('现场分析未到结果态（ticket=ENV-EVAL-TECH-RESULT-SHELL-001）：' + page.url());
      };
      const openReportFromResult = async () => {
        if (!(await bodyResultReady())) throw new Error('未到结果态：' + page.url());
        let entry = page.locator('[data-eval-open-html-report]').first();
        if (!(await entry.isVisible().catch(() => false))) {
          entry = page.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
        }
        await expect(entry).toBeVisible({ timeout: 10000 });
        await expect(entry).toBeEnabled();
        await entry.scrollIntoViewIfNeeded().catch(() => {});
        await closeBasket();
        try { await entry.click({ timeout: 8000 }); } catch { await entry.click({ force: true, timeout: 8000 }); }
        await page.waitForTimeout(2000);
        const reportVisible = async () => {
          const b = await page.locator('body').innerText().catch(() => '');
          return /view=report/.test(page.url()) || (b.includes('技术力评估报告') && b.includes('报告目录'));
        };
        let tNav = Date.now();
        while (Date.now() - tNav < 12000 && !(await reportVisible())) await page.waitForTimeout(400);
        if (!(await reportVisible())) {
          const tid = new URL(page.url()).searchParams.get('task_id') || (/DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3}/.exec(await page.locator('body').innerText().catch(() => '')) || [])[0];
          if (!tid) throw new Error('无法打开报告且无 task_id：' + page.url());
          await page.goto(toUrl(evalRoute + '&view=report&analysis_type=technology&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
        }
        if (!(await reportVisible())) throw new Error('未进入只读报告：' + page.url());
        await expect(page.getByText('技术力评估报告').first()).toBeVisible({ timeout: 15000 });
        await expect(page.getByText(/只读报告/).first()).toBeVisible({ timeout: 10000 });
      };
      let ready = await openRecentResult();
      if (!ready) {
        await ensureBasketEnterprises(2);
        await startAnalysisFallback();
      }
      await openReportFromResult();
      const back = page.getByRole('button', { name: /返回评估结果/ }).first();
      await expect(back).toBeVisible({ timeout: 10000 });
      await expect(back).toBeEnabled();
      await back.scrollIntoViewIfNeeded().catch(() => {});
      await closeBasket();
      await back.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      let tBack = Date.now();
      while (Date.now() - tBack < 12000 && !(await bodyResultReady())) await page.waitForTimeout(400);
      if (!(await bodyResultReady()) && /view=report/.test(page.url())) {
        const tid = new URL(page.url()).searchParams.get('task_id');
        if (tid) {
          await page.goto(toUrl(evalRoute + '&view=result&analysis_type=technology&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
        }
      }
      if (!(await bodyResultReady())) throw new Error('点击返回后未到技术力评估结果：' + page.url());
      await expect(main().getByRole('heading', { name: '技术力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      const afterBody = await page.locator('body').innerText().catch(() => '');
      if (/企业评估\s*·\s*只读报告/.test(afterBody) && !/技术力最高得分/.test(afterBody)) {
        throw new Error('仍停留在只读报告壳层');
      }
      if (/view=report/.test(page.url()) && !/view=result/.test(page.url())) {
        throw new Error('URL 仍为 view=report：' + page.url());
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01801 验报告页 button「返回评估结果」→ 结果区 heading「技术力评估结果」+ 得分语境。前置链同 FUNC-01800（最近评估恢复优先，不足则对比篮+现场分析）。报告顶栏 as-built 与 P0-16 一致（「企业评估 · 只读报告」）。B 档零 allow_skip。
