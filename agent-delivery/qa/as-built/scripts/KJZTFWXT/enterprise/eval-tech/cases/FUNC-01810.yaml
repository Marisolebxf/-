id: FUNC-01810
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01810
priority: P1
tier: B
title: 最近评估翻到第2页后换成另一批任务
entry_id: ent-eval-tech
preconditions:
  - 最近评估总数超过一页
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 点击「最近评估」
expect:
  - note: 1、第 2 页任务与第 1 页不同
    assert: |-
      const PAGE_SIZE = 10;
      const tablists = page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) });
      const list = (await tablists.count()) ? tablists.first() : page.locator('[role=tablist]').first();
      const recent = list.getByRole('tab', { name: '最近评估', exact: true });
      await expect(recent).toBeVisible({ timeout: 15000 });
      await recent.click({ timeout: 8000 });
      await expect(recent).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      await expect(page.getByRole('button', { name: '新建评估' }).first()).toBeVisible({ timeout: 15000 });
      const main = page.locator('main');
      await expect(main.locator('thead th, .arco-table-header .arco-table-th').first()).toBeVisible({ timeout: 15000 });
      const pagination = main.locator('.arco-pagination');
      if (await pagination.count()) await pagination.first().scrollIntoViewIfNeeded();
      const page2Item = main.locator('.arco-pagination-item').filter({ hasText: /^2$/ });
      const page2Btn = main.getByRole('button', { name: '2', exact: true });
      const page2Visible =
        ((await page2Item.count()) > 0 && (await page2Item.first().isVisible())) ||
        ((await page2Btn.count()) > 0 && (await page2Btn.first().isVisible()));
      if (!page2Visible) {
        throw new Error('数据闸门：最近评估未超过一页（ticket=ENV-EVAL-TECH-HISTORY-PAGE2-001）');
      }
      const page2Click = (await page2Item.count()) > 0 ? page2Item.first() : page2Btn.first();
      const rows = main.locator('tbody tr.arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 10000 });
      const page1Ids = [];
      const rowCount = await rows.count();
      for (let i = 0; i < rowCount; i++) {
        const cells = rows.nth(i).locator('td');
        if ((await cells.count()) > 1) page1Ids.push((await cells.nth(1).innerText()).trim());
      }
      expect(page1Ids.length).toBeGreaterThan(0);
      await page2Click.click({ timeout: 8000 });
      await expect(page2Click).toHaveClass(/active/, { timeout: 10000 });
      const page2Ids = [];
      const rowCount2 = await rows.count();
      for (let i = 0; i < rowCount2; i++) {
        const cells = rows.nth(i).locator('td');
        if ((await cells.count()) > 1) page2Ids.push((await cells.nth(1).innerText()).trim());
      }
      expect(page2Ids.length).toBeGreaterThan(0);
      for (const id of page2Ids) {
        expect(page1Ids).not.toContain(id);
      }
on_fail: 截图 + 抄 X-Trace-Id
