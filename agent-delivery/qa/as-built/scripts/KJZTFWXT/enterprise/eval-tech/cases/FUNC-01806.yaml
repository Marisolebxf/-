id: FUNC-01806
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01806
priority: P1
tier: B
title: 备选-删除确定
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: click
    target: |-
      await page.locator('.enterprise-center-primary-tabs').getByText('最近评估', { exact: true }).click()
  - action: click
    target: |-
      const historyMain = page.locator('main');
      const row = historyMain.locator('tbody tr').filter({ has: page.getByRole('button', { name: '删除' }) }).first();
      await expect(row).toBeVisible();
      const taskId = (await row.locator('td').nth(1).innerText()).trim();
      await page.evaluate((id) => {
        window.__func01806DeletedTaskId = id;
      }, taskId);
      await row.getByRole('button', { name: '删除' }).click();
  - action: click
    target: |-
      await page.getByRole('button', { name: '确定' }).click()
expect:
  - note: 该任务不再出现在最近评估列表
    assert: |-
      const taskId = await page.evaluate(() => window.__func01806DeletedTaskId);
      const historyMain = page.locator('main');
      await expect(historyMain.getByText(taskId, { exact: true })).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
