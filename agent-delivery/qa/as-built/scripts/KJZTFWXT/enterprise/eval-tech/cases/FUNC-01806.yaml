id: FUNC-01806
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01806
priority: P1
title: 确定删除后分析记录从最近评估列表消失
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-tech
tier: B
preconditions:
  - 最近评估中至少有一条可删除记录（无则真红 ticket=ENV-EVAL-TECH-HISTORY-001）
locators:
  recent_tab: tab「最近评估」
  delete_button: button「删除」
  modal_ok: 弹框 button「确定」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 最近评估→记录该行任务 ID→点「删除」→弹框点「确定」；行消失断言在 expect
expect:
  - note: 1、该任务不再出现在最近评估列表
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const waitRecentList = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 20000) {
          const t = await main().innerText().catch(() => '');
          if (/删除/.test(t) || /恢复结果/.test(t) || /继续查看/.test(t)) return;
          if (/共\s*\d+\s*条/.test(t) && !/加载/.test(t)) return;
          if (/暂无|没有.*记录|空/.test(t)) return;
          await page.waitForTimeout(400);
        }
      };
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const tableTaskIds = async () => {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        const ids = [];
        for (let i = 0; i < n; i++) {
          const txt = await rows.nth(i).innerText().catch(() => '');
          const m = txt.match(TID_RE);
          if (m) ids.push(m[0]);
        }
        if (ids.length) return ids;
        const body = await main().innerText().catch(() => '');
        const all = body.match(new RegExp(TID_RE.source, 'g')) || [];
        return [...new Set(all)];
      };
      await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await waitRecentList();
      const delBtn = main().getByRole('button', { name: '删除', exact: true }).first();
      const hasHistoryRow = (await main().getByRole('button', { name: '恢复结果' }).count()) > 0
        || (await main().getByRole('button', { name: '继续查看' }).count()) > 0
        || TID_RE.test(await main().innerText().catch(() => ''));
      if (!(await delBtn.count()) || !(await delBtn.isVisible().catch(() => false))) {
        if (hasHistoryRow) {
          throw new Error('最近评估有历史行但操作列无「删除」按钮（ticket=DEF-ENT-EVAL-HISTORY-DELETE-UI-001）');
        }
        throw new Error('最近评估无可删除记录（ticket=ENV-EVAL-TECH-HISTORY-001）');
      }
      const row = delBtn.locator('xpath=ancestor::tr[1]');
      let rowText = (await row.count()) ? await row.innerText().catch(() => '') : '';
      if (!rowText || !TID_RE.test(rowText)) {
        rowText = await main().innerText().catch(() => '');
      }
      const tidM = rowText.match(TID_RE);
      if (!tidM) throw new Error('删除前行未见任务 ID（ticket=ENV-EVAL-TECH-HISTORY-001）');
      const expectedTid = tidM[0];
      const idsBefore = await tableTaskIds();
      if (!idsBefore.includes(expectedTid)) {
        throw new Error('锚定任务 ID 不在表格行内：' + expectedTid);
      }
      await delBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      const ok = modal.getByRole('button', { name: '确定', exact: true });
      await expect(ok).toBeVisible({ timeout: 5000 });
      await ok.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const t0 = Date.now();
      while (Date.now() - t0 < 15000) {
        const idsAfter = await tableTaskIds();
        if (!idsAfter.includes(expectedTid)) break;
        await page.waitForTimeout(500);
      }
      const idsFinal = await tableTaskIds();
      if (idsFinal.includes(expectedTid)) {
        throw new Error('确定删除后任务仍在最近评估列表：' + expectedTid);
      }
      const rowStill = main().locator('table tbody tr').filter({ hasText: expectedTid });
      await expect(rowStill).toHaveCount(0, { timeout: 3000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  01806 验「最近评估」行内「删除」→Modal 标题「删除分析记录」→「确定」后该行任务 ID 从表内消失（30888 enterprise-center/evaluation；软删 analysisTaskDelete）。D3·2026-10-19 复勘 admin 有 DEMO-EVAL 行但操作列仅「恢复结果/按此配置新建评估/查看 HTML 报告」，无「删除」（lumen-ui-topic 源码已含删除钮，K8s dev 未含）→DEF-ENT-EVAL-HISTORY-DELETE-UI-001。无历史 ENV-EVAL-TECH-HISTORY-001。破坏性：会真删一条记录。main 用 diagnosis-main|app-main。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
