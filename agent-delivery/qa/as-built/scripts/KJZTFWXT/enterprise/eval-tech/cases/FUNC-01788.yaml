id: FUNC-01788
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01788
priority: P1
tier: B
title: 对比篮勾选两家企业开始分析进入技术力评估结果
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 1-5 用例步骤：选企业浮层→勾选2家→确定→开始分析→等待结果
    assert: |-
      const main = () => page.locator('main').first();
      await main().getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 });
      const picker = page.locator('.arco-modal').filter({ hasText: '选择分析企业' });
      await expect(picker.first()).toBeVisible({ timeout: 10000 });
      const rows = picker.locator('[aria-label^="选择 "]');
      if ((await rows.count()) < 2) throw new Error('对比篮可选企业不足 2 家');
      await rows.nth(0).click();
      await rows.nth(1).click();
      await picker.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
      await expect(main().getByText('请先在对比篮选择企业')).toBeHidden({ timeout: 15000 });
      const start = main().getByRole('button', { name: '开始分析' });
      await expect(start).toBeEnabled({ timeout: 20000 });
      await start.click({ timeout: 8000 });
      const deadline = Date.now() + 120000;
      let ready = false;
      while (Date.now() < deadline) {
        const body = await main().innerText().catch(() => '');
        if (/技术力评估结果/.test(body) && /技术力最高得分/.test(body) && /\d+\s*分/.test(body)) {
          ready = true;
          break;
        }
        const viewResult = page.getByRole('button', { name: '查看结果' });
        if (await viewResult.isVisible().catch(() => false)) {
          await viewResult.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          continue;
        }
        await page.waitForTimeout(2000);
      }
      if (!ready) throw new Error('120s 内未到结果态（技术力评估结果/最高得分/分值）');
expect:
  - note: 1、页面出现「技术力评估结果」
    assert: |-
      const main = page.locator('main').first();
      await expect(main.getByText('技术力评估结果').first()).toBeVisible({ timeout: 15000 });
  - note: 2、「技术力最高得分」有分值
    assert: |-
      const main = page.locator('main').first();
      const block = main.locator('div').filter({ hasText: /技术力最高得分/ }).first();
      await expect(block).toBeVisible({ timeout: 15000 });
      const text = (await block.innerText()).replace(/\s+/g, ' ');
      if (!/\d+\s*分/.test(text)) throw new Error('技术力最高得分未见分值：' + text.slice(0, 160));
on_fail: 截图 + 抄 X-Trace-Id
