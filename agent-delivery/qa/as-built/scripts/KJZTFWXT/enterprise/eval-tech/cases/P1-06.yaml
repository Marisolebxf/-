id: P1-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00921
priority: P1
title: 浮层名称搜索类型筛选与重置
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-tech
preconditions:
- 浮层已打开且列表多家企业
expect:
- note: 名称搜索后列表仅含匹配企业
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('对比篮企业不足'); const name = (await sels.nth(0).getAttribute('aria-label') || '').replace(/^选择\s*/,'').slice(0, 4); const box = page.getByPlaceholder('按企业名称搜索'); await box.fill(name || '深圳'); await page.waitForTimeout(800); if ((await sels.count()) < 1) throw new Error('搜索后无结果')
- note: 类型筛选后列表仅含该类型企业
  assert: |-
    await page.getByPlaceholder('按企业名称搜索').fill(''); await page.waitForTimeout(400); const typeTr = page.locator('.arco-select-view').filter({ hasText: /全部企业类型/ }).first(); if (await typeTr.count()) { await typeTr.click(); await page.waitForTimeout(400); const opt = page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').first(); if (await opt.count()) await opt.click(); await page.waitForTimeout(600) }
- note: 重置后勾选与筛选回到初始态
  assert: |-
    await page.getByRole('button', { name: '重置' }).click(); await page.waitForTimeout(500); await expect(page.getByText('全部企业类型').first()).toBeVisible({ timeout: 8000 }); const ok = page.getByRole('button', { name: '确定' }); if (!(await ok.isDisabled())) throw new Error('重置后确定应回到禁用（无勾选）')
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
