id: P0-12
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00911
priority: P0
title: 一键平均分配均分已选指标权重
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-tech
steps:
- action: click
  target: 一键平均分配
expect:
- note: 5 项全选时均分后各项权重为 20
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await page.getByRole('button', { name: '一键平均分配' }).click({ timeout: 8000 }); await page.waitForTimeout(500); const spins = page.locator('[role=spinbutton]'); const vals = []; for (let i = 0; i < await spins.count(); i++) vals.push(Number(await spins.nth(i).inputValue())); if (vals.length !== 5 || vals.some(v => v !== 20)) throw new Error('五维均分期望全 20，实见 ' + vals.join('/'))
- note: 取消 1 项后均分各项为 25
  assert: |-
    const cb = page.locator('label.arco-checkbox').filter({ has: page.getByText('技术合作') }).first(); if (await cb.count()) await cb.click(); else await page.locator('.arco-checkbox').nth(3).click(); await page.waitForTimeout(300); await page.getByRole('button', { name: '一键平均分配' }).click(); await page.waitForTimeout(500); const spins = page.locator('[role=spinbutton]'); const vals = []; for (let i = 0; i < await spins.count(); i++) vals.push(Number(await spins.nth(i).inputValue())); if (!vals.length || vals.some(v => v !== 25)) throw new Error('四维均分期望 25，实见 ' + vals.join('/'))
- note: 两次均分后权重和均为 100
  assert: 'await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 })'
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
