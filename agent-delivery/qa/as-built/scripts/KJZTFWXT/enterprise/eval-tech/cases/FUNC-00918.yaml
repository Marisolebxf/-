id: FUNC-00918
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00918
priority: P1
title: 当前分析与最近评估 Tab 往返保留配置
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-tech
tier: B
preconditions:
  - 已带入评估对象并调整过权重（脚本自含回填≥2家）
  - 最近评估中至少 1 条历史任务（无则 ticket=ENV-EVAL-TECH-HISTORY-001）
locators:
  tab_current: tab「当前分析」
  tab_recent: tab「最近评估」
  spinbutton: role=spinbutton（指标权重）
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 回填对象→调权重→最近评估/当前分析往返；判定在 expect
expect:
  - note: 1、「最近评估」以列表呈现历史评估任务
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        const maxTry = Math.max(min, 6);
        for (let i = 0; n < min && i < maxTry; i++) {
          const cnt = await addBtns.count();
          if (cnt < 1) throw new Error('搜索页无加入对比篮按钮');
          await addBtns.nth(Math.min(i, cnt - 1)).click({ timeout: 8000 });
          await page.waitForTimeout(800);
          n = await basketEntCount();
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const ensureConfigWithObjects = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
        if (await curTab.count()) { await curTab.first().click({ timeout: 5000 }); await page.waitForTimeout(600); }
        const body = await main().innerText().catch(() => '');
        if (/技术力评估结果/.test(body) || page.url().includes('view=result')) {
          const adj = page.getByRole('button', { name: '调整配置' });
          if (await adj.count()) { await adj.first().click({ timeout: 8000 }); await page.waitForTimeout(1200); }
        }
        if (/暂未选择评估对象|请先在对比篮/.test(await main().innerText().catch(() => ''))) {
          const cta = main().getByRole('button', { name: /多企业技术力对比分析|前往对比篮选择企业/ }).first();
          if (await cta.isVisible().catch(() => false)) await cta.click({ timeout: 8000 });
          else {
            await page.goto(toUrl(evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2'), { waitUntil: 'domcontentloaded' });
          }
          await page.waitForTimeout(1000);
          await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
          const rows = page.locator('[aria-label^="选择 "]');
          if (await rows.count() < 2) throw new Error('浮层可选企业不足 2 家');
          await rows.nth(0).click();
          await rows.nth(1).click();
          const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
          await expect(confirm).toBeEnabled({ timeout: 8000 });
          await confirm.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          await closeBasket();
        }
        if (/暂未选择评估对象/.test(await main().innerText().catch(() => ''))) {
          throw new Error('回填后对象区仍为空（ticket=ENV-EVAL-TECH-PRECHECK-001）');
        }
      };
      const readWeights = async () => {
        const spins = page.locator('[role=spinbutton]');
        const n = await spins.count();
        const vals = [];
        for (let i = 0; i < n; i++) vals.push(await spins.nth(i).inputValue());
        return vals;
      };
      const objectFingerprint = async () => {
        const t = await main().innerText().catch(() => '');
        const removeN = await main().getByRole('button', { name: '移除' }).count();
        const fromBasket = /来自对比篮/.test(t);
        return { removeN, fromBasket, hasMetrics: /指标与权重/.test(t) };
      };
      const countRecentTasks = async () => {
        const txt = await main().innerText().catch(() => '');
        const ids = txt.match(new RegExp(TID_RE.source, 'g')) || [];
        const uniq = [...new Set(ids)];
        const rowN = await main().locator('table tbody tr').count();
        return { uniq: uniq.length, rowN, hasRestore: await main().getByRole('button', { name: '恢复结果' }).count() > 0 };
      };
      const evalTablist = () =>
        page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) }).first();
      const clickWorkspaceTab = async (name) => {
        await closeBasket();
        const list = evalTablist();
        await expect(list).toBeVisible({ timeout: 10000 });
        const btn = list.getByRole('tab', { name, exact: true });
        await btn.scrollIntoViewIfNeeded().catch(() => {});
        if (name === '当前分析') {
          const recent = list.getByRole('tab', { name: '最近评估', exact: true });
          await recent.focus();
          await page.keyboard.press('ArrowLeft');
          await page.waitForTimeout(600);
          const sel = await btn.getAttribute('aria-selected');
          if (sel !== 'true') await btn.click({ timeout: 8000, force: true });
        } else {
          await btn.click({ timeout: 10000, force: true });
        }
        await page.waitForTimeout(1000);
      };
      await ensureBasketEnterprises(2);
      await ensureConfigWithObjects();
      const w0 = await readWeights();
      if (!w0.length) throw new Error('未见权重 spinbutton');
      const spin = page.locator('[role=spinbutton]').first();
      const stepUp = page.locator('.arco-input-number-step-button').first();
      await stepUp.click({ timeout: 5000 });
      await page.waitForTimeout(300);
      const w1 = await readWeights();
      if (w1[0] === w0[0]) throw new Error('权重步进未变化: ' + w0[0]);
      const obj0 = await objectFingerprint();
      await expect(evalTablist().getByRole('tab', { name: '最近评估', exact: true })).toBeVisible({ timeout: 10000 });
      await clickWorkspaceTab('最近评估');
      await page.waitForTimeout(400);
      const recent = await countRecentTasks();
      const listOk = recent.rowN > 0 || recent.hasRestore || recent.uniq >= 1;
      if (!listOk) {
        if (/暂无|还没有|无评估/.test(await main().innerText().catch(() => ''))) {
          throw new Error('最近评估无历史任务（ticket=ENV-EVAL-TECH-HISTORY-001）');
        }
        throw new Error('最近评估未见任务列表形态（无表格行/恢复结果/任务 ID）');
      }
      await page.evaluate((s) => { window.__FUNC00918 = s; }, { weights: w1, obj: obj0, recentCount: recent.uniq, recentRows: recent.rowN });
  - note: 2、返回后对象与权重保持原值
    assert: |-
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const evalTablist = () =>
        page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) }).first();
      const clickWorkspaceTab = async (name) => {
        await closeBasket();
        const list = evalTablist();
        await expect(list).toBeVisible({ timeout: 10000 });
        const btn = list.getByRole('tab', { name, exact: true });
        await btn.scrollIntoViewIfNeeded().catch(() => {});
        if (name === '当前分析') {
          const recent = list.getByRole('tab', { name: '最近评估', exact: true });
          await recent.focus();
          await page.keyboard.press('ArrowLeft');
          await page.waitForTimeout(600);
          const sel = await btn.getAttribute('aria-selected');
          if (sel !== 'true') await btn.click({ timeout: 8000, force: true });
        } else {
          await btn.click({ timeout: 10000, force: true });
        }
        await page.waitForTimeout(1000);
      };
      const s = await page.evaluate(() => window.__FUNC00918);
      if (!s || !s.weights) throw new Error('前置状态缺失，请先跑上条 expect');
      await clickWorkspaceTab('当前分析');
      const spins = page.locator('[role=spinbutton]');
      const n = await spins.count();
      if (n !== s.weights.length) throw new Error('权重输入框数量变化: ' + s.weights.length + '→' + n);
      for (let i = 0; i < n; i++) {
        const v = await spins.nth(i).inputValue();
        if (v !== s.weights[i]) throw new Error('权重未保持 idx=' + i + ': ' + s.weights[i] + '→' + v);
      }
      const t = await main().innerText().catch(() => '');
      if (s.obj.fromBasket && !/来自对比篮/.test(t)) throw new Error('返回后丢失「来自对比篮」文案');
      const removeN = await main().getByRole('button', { name: '移除' }).count();
      if (s.obj.removeN > 0 && removeN < s.obj.removeN) {
        throw new Error('评估对象移除钮变少: ' + s.obj.removeN + '→' + removeN);
      }
      if (!/指标与权重/.test(t)) throw new Error('返回后未见指标与权重配置区');
  - note: 3、往返切换不产生新任务
    assert: |-
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/g;
      const main = () => page.locator('main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const evalTablist = () =>
        page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) }).first();
      const clickWorkspaceTab = async (name) => {
        await closeBasket();
        const list = evalTablist();
        await expect(list).toBeVisible({ timeout: 10000 });
        const btn = list.getByRole('tab', { name, exact: true });
        await btn.scrollIntoViewIfNeeded().catch(() => {});
        if (name === '当前分析') {
          const recent = list.getByRole('tab', { name: '最近评估', exact: true });
          await recent.focus();
          await page.keyboard.press('ArrowLeft');
          await page.waitForTimeout(600);
          const sel = await btn.getAttribute('aria-selected');
          if (sel !== 'true') await btn.click({ timeout: 8000, force: true });
        } else {
          await btn.click({ timeout: 10000, force: true });
        }
        await page.waitForTimeout(1000);
      };
      const s = await page.evaluate(() => window.__FUNC00918);
      if (!s) throw new Error('前置状态缺失');
      const url0 = page.url();
      if (/view=processing/.test(url0) && !/task_id=/.test(url0)) {
        throw new Error('Tab 往返后误入过程态且无 task_id：' + url0);
      }
      await clickWorkspaceTab('最近评估');
      const txt = await main().innerText().catch(() => '');
      const ids = txt.match(TID_RE) || [];
      const uniq = [...new Set(ids)].length;
      if (uniq > s.recentCount) {
        throw new Error('往返后历史任务数增加: ' + s.recentCount + '→' + uniq);
      }
      await clickWorkspaceTab('当前分析');
      const u1 = page.url();
      if (/view=processing/.test(u1) && !/task_id=/.test(u1)) {
        throw new Error('返回当前分析后误入无 task_id 过程态：' + u1);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 现场两 Tab（当前分析/最近评估）；30888 路由 enterprise-center/evaluation。历史任务以表格行/恢复结果/EVAL 任务 ID 代理；无历史 ENV-EVAL-TECH-HISTORY-001。B 档零 allow_skip。
