id: FUNC-00918
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00918
priority: P1
tier: B
title: 备选-Tab 切换保留配置
entry_id: ent-eval-tech
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=technology&mode=technology
  - action: evaluate
    note: 前置入篮回填与权重调节、Tab 往返及断言在 expect
expect:
  - note: 1、「最近评估」以列表呈现历史评估任务
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=technology&mode=technology';
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const main = page.locator('main');
        const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
        await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 15000 });
        const cards = recSection.locator('div').filter({ hasText: '推荐理由：' }).filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) });
        const cardCount = await cards.count();
        if (cardCount < min) throw new Error('推荐企业卡不足 ' + min + ' 张');
        for (let i = 0; n < min && i < cardCount; i++) {
          const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
          if (!(await btn.count()) || !(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const gotoEvalTech = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        if (page.url().includes('/login')) throw new Error('登录失败');
        await closeBasket();
        await expect(page.getByRole('heading', { name: '企业技术力评估对比分析' }).first()).toBeVisible({ timeout: 15000 });
      };
      const openSelectOverlay = async () => {
        const main = page.locator('main');
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await emptyCta.count() && await emptyCta.first().isVisible().catch(() => false)) {
          await emptyCta.first().click({ timeout: 8000 });
          return;
        }
        const pickerQs = 'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=2&compare_picker_max=50';
        await page.goto(toUrl(`${evalRoute}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const fillTwoEnterprises = async () => {
        if ((page.url().match(/enterprise_codes/g) || []).length >= 2) return;
        await openSelectOverlay();
        await page.waitForTimeout(800);
        await closeBasket();
        const sels = page.locator('[aria-label^="选择 "]');
        await expect(sels.first()).toBeVisible({ timeout: 20000 });
        if (await sels.count() < 2) throw new Error('浮层可选企业不足 2 家');
        await sels.nth(0).click();
        await sels.nth(1).click();
        await page.waitForTimeout(300);
        const confirm = page.getByRole('button', { name: '确定', exact: true }).last();
        await expect(confirm).toBeEnabled({ timeout: 8000 });
        await confirm.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await closeBasket();
      };
      const talentWeight = () => page.locator('input[aria-label="技术人才权重"]');
      const bumpTalentUp = async () => {
        const spin = talentWeight();
        await spin.scrollIntoViewIfNeeded().catch(() => {});
        const before = Number(await spin.inputValue());
        const btns = page.locator('.arco-input-number').filter({ has: spin }).locator('.arco-input-number-step-button');
        if (await btns.count() >= 1) await btns.first().click({ timeout: 8000 });
        else await spin.evaluate((el) => { el.focus(); el.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true })); });
        await page.waitForTimeout(400);
        const after = Number(await spin.inputValue());
        if (!(after > before)) throw new Error('权重上调失败: ' + before + '→' + after);
        return after;
      };
      const clickRecentTab = async () => {
        const recent = page.getByRole('tab', { name: '最近评估', exact: true }).first();
        await expect(recent).toBeVisible({ timeout: 10000 });
        await recent.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const countHistoryRows = async () => {
        const rows = page.locator('main .arco-table-body .arco-table-tr, main tbody tr');
        const n = await rows.count();
        if (n > 0) return n;
        const body = await page.locator('main').innerText().catch(() => '');
        if (/任务名称/.test(body) && /任务 ID/.test(body)) return Math.max(1, (body.match(/ENT-/g) || []).length);
        return 0;
      };
      await gotoEvalTech();
      await ensureBasketEnterprises(2);
      await gotoEvalTech();
      await fillTwoEnterprises();
      const weightAfter = await bumpTalentUp();
      await page.evaluate((w) => { window.__qa918 = { weight: w }; }, weightAfter);
      await clickRecentTab();
      const histRows = await countHistoryRows();
      if (histRows < 1) throw new Error('最近评估无历史任务行');
      await page.evaluate((n) => { window.__qa918 = { ...(window.__qa918 || {}), histRows: n }; }, histRows);
      await expect(page.getByRole('button', { name: '新建评估' }).first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByText('任务名称', { exact: true }).first()).toBeVisible({ timeout: 10000 });
  - note: 2、返回后对象与权重保持原值
    assert: |-
      const stored = await page.evaluate(() => window.__qa918 || {});
      const currentTab = page.getByRole('tab', { name: '当前分析', exact: true }).first();
      await expect(currentTab).toBeVisible({ timeout: 10000 });
      await currentTab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const main = page.locator('main');
      await expect(main.getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
      const spin = page.locator('input[aria-label="技术人才权重"]');
      await expect(spin).toBeVisible({ timeout: 10000 });
      const w = Number(await spin.inputValue());
      if (stored.weight == null || w !== stored.weight) throw new Error('权重未保留: 期望 ' + stored.weight + ' 实际 ' + w);
      await page.evaluate(() => { window.__qa918 = { ...(window.__qa918 || {}), onCurrent: true }; });
  - note: 3、往返切换不产生新任务
    assert: |-
      const stored = await page.evaluate(() => window.__qa918 || {});
      if (!stored.onCurrent) throw new Error('未回到当前分析');
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 10000 });
      expect(page.url()).not.toMatch(/view=processing/);
      const recent = page.getByRole('tab', { name: '最近评估', exact: true }).first();
      await recent.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const rows = page.locator('main .arco-table-body .arco-table-tr, main tbody tr');
      let n = await rows.count();
      if (n < 1) {
        const body = await page.locator('main').innerText().catch(() => '');
        if (/任务名称/.test(body)) n = stored.histRows || 1;
      }
      if (stored.histRows != null && n !== stored.histRows) throw new Error('历史任务数变化: ' + stored.histRows + '→' + n);
on_fail: 截图 + 抄 X-Trace-Id
