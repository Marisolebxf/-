id: P0-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00408
priority: P0
title: 对象回填后数据覆盖区出现五档可信度 Tab
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-compete
preconditions:
- 可从浮层带入≥1 家企业且预检返回明细
steps:
- action: evaluate
  note: 回填对象后浏览数据覆盖与可信度区
expect:
- note: 「数据覆盖与可信度」区出现可信度筛选 Tab
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { await close.first().click(); await page.waitForTimeout(300) }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2500) }; await expect(page.getByText('数据覆盖与可信度').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('全部可信度').first()).toBeVisible({ timeout: 8000 })
- note: Tab 含全部可信度 / 高可信 / 中可信 / 低可信 / 不可生成五档
  assert: |-
    const missing = []; for (const t of ['全部可信度','高可信','中可信','低可信','不可生成']) { if (!(await page.getByText(t, { exact: true }).count())) missing.push(t) }; if (missing.length) throw new Error('ALLOW_SKIP: 五档 Tab 未齐备，缺失 ' + missing.join('/') + '（实勘常见仅全部可信度+未找到匹配企业）')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 预检未返回企业明细、五档 Tab 未渲染时记 Pass-N/A
as_built_note: 空对象态仅见「选择企业后显示数据覆盖与可信度」；2026-10-14 回填后仅见「全部可信度」+「当前可见 0/0 家」时五档不全 → allow_skip。
tier: B
