id: FUNC-00437
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00437
priority: P0
title: 权重和不为 100 时开始分析被拦截且不自动归一化
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-compete
tier: B
preconditions:
  - env-gate select_objects=pass（对比篮≥1 家企业；不足时脚本经企业查询补篮）
  - 已回填至少 1 家企业；权重和可偏离 100
locators:
  step_up: 创新能力行权重上调钮
  avg_button: button「一键平均分配」
  start: button「开始分析」/「发起分析」/「个性化竞争力评价与输出」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 补篮回填→调节钮偏离 100→拦截开始分析→一键平均→恢复可用；断言在 expect
expect:
  - note: 1、权重和≠100 时「开始分析」被拦截且无任务发起
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const dimNames = ['创新能力', '经营能力', '成长能力'];
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 ' + n);
      };
      const openEnterprisePicker = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const fillOneEnterprise = async () => {
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        if (/enterprise_codes/.test(page.url()) && await main().getByText(/来自对比篮/).first().isVisible().catch(() => false)) return;
        await openEnterprisePicker();
        const panel = page.locator('.system-compare-panel');
        await expect(panel).toBeVisible({ timeout: 10000 });
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count() < 1) throw new Error('对比篮无可选企业');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(300);
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
      };
      const readDimWeights = async () => {
        const vals = [];
        for (const name of dimNames) {
          const row = page.getByRole('row').filter({ hasText: name }).first();
          await expect(row).toBeVisible({ timeout: 8000 });
          const spin = row.locator('[role=spinbutton], .arco-input-number input').first();
          vals.push(Number(await spin.inputValue()));
        }
        return vals;
      };
      const resolveStartBtn = async () => {
        const m = main();
        const classic = m.getByRole('button', { name: '开始分析' });
        if (await classic.count() && await classic.first().isVisible().catch(() => false)) return classic.first();
        const alt = m.getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        if (await alt.count() && await alt.isVisible().catch(() => false)) return alt;
        const primary = m.locator('button.arco-btn-primary').filter({ hasText: /开始分析|发起分析|个性化竞争力评价与输出/ }).first();
        return primary;
      };
      await fillOneEnterprise();
      await page.getByRole('tab', { name: '当前分析' }).click({ timeout: 5000 }).catch(() => {});
      await page.waitForTimeout(500);
      const row0 = page.getByRole('row').filter({ hasText: dimNames[0] }).first();
      const up = row0.locator('.arco-input-number-step-button').first();
      for (let i = 0; i < 6; i++) {
        await up.click({ timeout: 5000 });
        await page.waitForTimeout(200);
      }
      await page.waitForTimeout(400);
      const tweaked = await readDimWeights();
      const sum = tweaked.reduce((a, b) => a + b, 0);
      if (sum === 100) throw new Error('调节后权重和仍为 100: ' + tweaked.join('/'));
      globalThis.__func00437_tweaked = tweaked;
      globalThis.__func00437_sumBad = sum;
      const start = await resolveStartBtn();
      await start.scrollIntoViewIfNeeded().catch(() => {});
      const disabled = await start.isDisabled().catch(() => false);
      if (!disabled) {
        await start.click({ force: true }).catch(() => {});
        await page.waitForTimeout(900);
      }
      if (/view=processing/.test(page.url())) throw new Error('权重和≠100 仍进入过程态 view=processing');
      if (!disabled && /view=result/.test(page.url())) throw new Error('权重和≠100 仍进入结果态');
  - note: 2、提示定位权重和问题且权重不被静默归一化
    assert: |-
      const dimNames = ['创新能力', '经营能力', '成长能力'];
      const tweaked = globalThis.__func00437_tweaked;
      if (!tweaked) throw new Error('前置：未偏离权重');
      const readNow = async () => {
        const vals = [];
        for (const name of dimNames) {
          const row = page.getByRole('row').filter({ hasText: name }).first();
          const spin = row.locator('[role=spinbutton], .arco-input-number input').first();
          vals.push(Number(await spin.inputValue()));
        }
        return vals;
      };
      const now = await readNow();
      if (now.join(',') !== tweaked.join(',')) {
        throw new Error('权重被静默归一化: 改前 ' + tweaked.join('/') + ' 现 ' + now.join('/'));
      }
      const hint = page.getByText(/权重|校验|100%|合计/).first();
      const hintOk = await hint.isVisible().catch(() => false);
      const failSum = await page.getByText(/校验未通过|请调整|不为\s*100|≠\s*100|偏离/).first().isVisible().catch(() => false);
      if (!hintOk && !failSum) {
        const body = await page.locator('main').first().innerText().catch(() => '');
        if (!/权重/.test(body) || /校验通过/.test(body)) {
          throw new Error('未见权重问题提示；合计区: ' + body.slice(0, 200));
        }
      }
      if (await page.getByText(/权重合计：100%\s*·\s*校验通过/).first().isVisible().catch(() => false)) {
        throw new Error('和≠100 时不应显示校验通过');
      }
  - note: 3、一键平均后「开始分析」恢复可用
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const resolveStartBtn = async () => {
        const m = main();
        const classic = m.getByRole('button', { name: '开始分析' });
        if (await classic.count() && await classic.first().isVisible().catch(() => false)) return classic.first();
        const alt = m.getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        if (await alt.count() && await alt.isVisible().catch(() => false)) return alt;
        return m.locator('button.arco-btn-primary').filter({ hasText: /开始分析|发起分析|个性化竞争力评价与输出/ }).first();
      };
      await page.getByRole('button', { name: '一键平均分配' }).click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const dimNames = ['创新能力', '经营能力', '成长能力'];
      let sum = 0;
      for (const name of dimNames) {
        const row = page.getByRole('row').filter({ hasText: name }).first();
        const spin = row.locator('[role=spinbutton], .arco-input-number input').first();
        sum += Number(await spin.inputValue());
      }
      if (sum !== 100) throw new Error('一键平均后权重和 ' + sum + ' ≠ 100');
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
      let start = null;
      for (let i = 0; i < 15; i++) {
        const btn = await resolveStartBtn();
        if (await btn.count() && await btn.isVisible().catch(() => false) && !(await btn.isDisabled().catch(() => true))) {
          start = btn;
          break;
        }
        await page.waitForTimeout(500);
      }
      if (!start) {
        const body = await main().innerText().catch(() => '');
        if (/预检未返回|未找到匹配企业/.test(body)) throw new Error('ALLOW_SKIP: 预检异常致开始分析仍禁用');
        if (/暂未选择评估对象/.test(body)) throw new Error('一键平均后评估对象丢失');
        throw new Error('一键平均后未见可用的开始分析同族主按钮');
      }
      await start.scrollIntoViewIfNeeded().catch(() => {});
      await expect(start).toBeEnabled({ timeout: 3000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  由 P0-21 重写为 FUNC-00437。30888 /enterprise-center/evaluation（禁 50892）。偏离手段=创新能力行上调钮连点（observed）；三维固定组合未见取消勾选。拦截形态=禁用或点击不进 view=processing（开放项 2）。D1·主按钮「个性化竞争力评价与输出」=用例「开始分析」。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。过程态主区缺陷见 ENV-EVAL-COMPETE-PROC-001（本用例不测过程页）。
