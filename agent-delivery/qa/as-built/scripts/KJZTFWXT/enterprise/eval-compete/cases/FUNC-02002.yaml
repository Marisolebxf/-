id: FUNC-02002
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02002
priority: P0
tier: B
title: 篮内企业查看画像展示三段摘要
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
expect:
  - note: 1、出现「企业画像快览」
    assert: |-
      const openPicker = async () => {
        const cta = page.getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 10000 });
        } else {
          await page.getByRole('button', { name: /返回对比篮调整对象/ }).click({ timeout: 10000 });
        }
        await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      };
      await openPicker();
      const basketPanel = page
        .locator('[aria-label="对比篮"], .system-compare-panel')
        .filter({ hasText: '篮内企业' })
        .first();
      let profileBtn = basketPanel.getByRole('button', { name: '查看画像', exact: true }).first();
      if (!(await profileBtn.isVisible().catch(() => false))) {
        await page.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        await page.getByRole('button', { name: '加入对比篮', exact: true }).first().click({ timeout: 12000 });
        await page.waitForTimeout(800);
        profileBtn = basketPanel.getByRole('button', { name: '查看画像', exact: true }).first();
      }
      await expect(profileBtn).toBeVisible({ timeout: 12000 });
      const urlBefore = page.url();
      await profileBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      if (page.url() !== urlBefore && /\/development\/enterprise\//.test(page.url())) {
        throw new Error('D3·篮内查看画像跳转详情深链「' + page.url() + '」而非企业画像快览抽屉');
      }
      const drawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer).toBeVisible({ timeout: 15000 });
      await expect(drawer.locator('.arco-drawer-header, .arco-drawer-title').first()).toContainText('企业画像快览');
  - note: 2、含基础摘要、竞争力摘要、风险摘要
    assert: |-
      const drawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer.getByText('基础摘要', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('竞争力摘要', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('风险摘要', { exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
