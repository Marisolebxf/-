id: FUNC-00406
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00406
priority: P0
title: 勾选企业确定后对象区回填且可发起分析
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-compete
tier: B
preconditions:
  - env-gate select_objects=pass（对比篮≥1；不足时经 /development/search 补篮）
  - 可进入对比篮 picker 态（open_compare_basket=1）
locators:
  overlay_title: 选择分析企业
  select_row: '[aria-label^="选择 "]'
  confirm: button「确定」
  start: button「开始分析」或 as-built「发起分析」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 侧栏进综合竞争力空态→打开选择分析企业 picker→勾选 1 家→确定；断言在 expect
expect:
  - note: 对象区回填已选企业条目（含对比篮来源与返回对比篮、按企业名称定位）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 ' + n);
      };
      const sidebarEnterCompete = async () => {
        const entryNames = ['企业综合竞争力评估', '企业竞争力分析'];
        let clicked = false;
        for (const name of entryNames) {
          const link = page.getByRole('link', { name, exact: true });
          if (await link.count()) {
            await link.first().scrollIntoViewIfNeeded().catch(() => {});
            await link.first().click({ timeout: 10000 });
            clicked = true;
            break;
          }
        }
        if (!clicked) {
          const search = page.getByRole('link', { name: '企业查询', exact: true });
          if (await search.count()) {
            await search.first().click({ timeout: 8000 });
            await page.waitForTimeout(500);
            for (const name of entryNames) {
              const link = page.getByRole('link', { name, exact: true });
              if (await link.count()) {
                await link.first().click({ timeout: 10000 });
                clicked = true;
                break;
              }
            }
          }
        }
        if (!clicked) throw new Error('侧栏未找到企业综合竞争力评估/企业竞争力分析入口');
        await page.waitForTimeout(1200);
        await expect(page.getByRole('heading', { name: /企业.*竞争力/ }).first()).toBeVisible({ timeout: 15000 });
      };
      const openSelectOverlay = async () => {
        const cta = page.getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 10000 });
          await page.waitForTimeout(1000);
          return;
        }
        const u = new URL(page.url());
        u.searchParams.set('open_compare_basket', '1');
        u.searchParams.set('compare_basket_mode', 'picker');
        u.searchParams.set('compare_object_type', 'enterprise');
        u.searchParams.set('compare_picker_min', '1');
        u.searchParams.set('compare_picker_max', '50');
        u.searchParams.set('analysis_type', 'competitiveness');
        await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
      };
      await ensureBasketEnterprises(1);
      await page.goto(toUrl('/enterprise-center/overview'), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await dismissBasket();
      await sidebarEnterCompete();
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
      }
      await openSelectOverlay();
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      const sels = page.locator('[aria-label^="选择 "]');
      if (await sels.count() < 1) throw new Error('对比篮 picker 无可选企业');
      await sels.nth(0).click({ force: true });
      await page.waitForTimeout(400);
      const ok = page.getByRole('button', { name: '确定' });
      await expect(ok).toBeEnabled({ timeout: 8000 });
      await ok.click({ timeout: 8000 });
      await page.waitForTimeout(2000);
      await dismissBasket();
      await expect(page.getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
      const ret = page.getByRole('button', { name: /返回对比篮调整对象|返回对比篮/ });
      if (await ret.count()) await expect(ret.first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByPlaceholder(/按企业名称定位|按企业名称/).first()).toBeVisible({ timeout: 8000 });
  - note: URL 追加所选企业参数与对比篮来源标记
    assert: |-
      await expect(page).toHaveURL(/enterprise_codes/);
      await expect(page).toHaveURL(/source=compare-basket/);
  - note: 「开始分析」恢复可用（D1·30888 主按钮文案可为「发起分析」）
    assert: |-
      let start = null;
      for (let i = 0; i < 20; i++) {
        const candidates = page.locator('button.arco-btn-primary').filter({ hasText: /开始分析|发起分析/ });
        if (await candidates.count()) {
          const btn = candidates.first();
          if (!(await btn.isDisabled().catch(() => true))) { start = btn; break; }
        }
        await page.waitForTimeout(1000);
      }
      if (!start) {
        const body = await page.locator('main').first().innerText().catch(() => '');
        if (/预检未返回|未找到匹配企业/.test(body)) throw new Error('预检阻塞导致分析按钮仍禁用（D3）');
        throw new Error('回填后未见可用的开始/发起分析主按钮');
      }
      await start.scrollIntoViewIfNeeded().catch(() => {});
      await expect(start).toBeEnabled({ timeout: 3000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 由 P0-07 重写。30888 禁 /enterprise/evaluation 深链（404）；路由 enterprise-center/evaluation；空态无 CTA 时用 compareBasketPicker 协议打开「选择分析企业」picker。D1·主按钮「发起分析」=用例「开始分析」；D1·部分构建无「返回对比篮调整对象」按钮时以「来自对比篮」+定位框为准。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
