id: FUNC-02010
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02010
priority: P0
title: 按此配置新建评估回到配置并带上该次对象
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-compete
tier: B
preconditions:
  - 最近评估中有一条综合竞争力记录
locators:
  recent_tab: tab「最近评估」
  clone_btn: button「按此配置新建评估」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness&view=history
  - action: evaluate
    note: 最近评估→点「按此配置新建评估」；配置态、对象回填与不产生新任务判定在 expect
expect:
  - note: 1、进入当前分析配置；2、对象区出现该次企业；3、不立即产生新任务
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const assertEvalPage = async () => {
        if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
          throw new Error('深链 404（ticket=ENV-EVAL-COMPETE-ROUTE-001）');
        }
        if (page.url().includes('/login')) {
          throw new Error('未登录跳转到 /login（ticket=ENV-EVAL-COMPETE-SESSION-001）');
        }
        await expect(page.getByRole('heading', { name: '企业综合竞争力评估' })).toBeVisible({ timeout: 15000 });
      };
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const histRoute = evalRoute + '&view=history';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const clickHistoryTab = async () => {
        const byKey = page.locator('[data-tab-key="history"]');
        if (await byKey.count() && await byKey.first().isVisible().catch(() => false)) {
          await byKey.first().click({ timeout: 8000 });
          return;
        }
        const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recentTab).toBeVisible({ timeout: 15000 });
        await recentTab.click({ timeout: 8000 });
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const waitHistoryReady = async (maxMs) => {
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          const spin = main().locator('.arco-spin-loading:visible, .arco-table-loading');
          if (await spin.count() && await spin.first().isVisible().catch(() => false)) {
            await page.waitForTimeout(400);
            continue;
          }
          const cloneN = await page.getByRole('button', { name: '按此配置新建评估' }).count();
          if (cloneN > 0) return true;
          const rows = main().locator('table tbody tr');
          if (await rows.count() > 0) return true;
          await page.waitForTimeout(500);
        }
        return false;
      };
      const countHistRows = async () => {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        if (n > 0) return n;
        const tidCells = main().getByText(/EVAL-\d{8}-\d{3}|DEMO-EVAL-\d{8}-\d+/);
        return await tidCells.count();
      };
      const extractCodes = (text) => {
        const hits = [...(text || '').matchAll(/[a-f0-9]{32}/gi)].map((m) => m[0].toLowerCase());
        return [...new Set(hits)];
      };
      const extractEnterpriseNames = (text) => {
        const re = /[\u4e00-\u9fa5A-Za-z0-9（）()·&]+(?:股份有限公司|有限责任公司|有限公司)/g;
        const hits = [...(text || '').matchAll(re)].map((m) => m[0].trim());
        const noise = /评估|分析|竞争力|综合竞争力|已完成|失败|恢复|删除|新建|报告|系统|模板|对比篮/;
        return [...new Set(hits)].filter((n) => n.length >= 6 && !noise.test(n));
      };
      const saveSnap = async (snap) => {
        await page.evaluate((d) => { window.__gkx_qa_02010 = d; }, snap);
      };
      const waitConfigFilled = async (maxMs) => {
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          const body = await main().innerText().catch(() => '');
          const u = page.url();
          if (/view=result/.test(u) || /综合竞争力评估结果/.test(body)) return 'result';
          if (/view=processing/.test(u) && /可视化分析过程|综合竞争力评估生成中/.test(body)) return 'processing';
          const removeN = await main().locator('button[aria-label^="移除"]').count();
          if (removeN > 0) return 'objects';
          if (/来自对比篮/.test(body) && !/暂未选择评估对象/.test(body)) return 'objects';
          if ((u.match(/enterprise_codes/g) || []).length > 0) return 'url';
          if (/指标与权重/.test(body) && /评估模板/.test(body) && !/view=history/.test(u)) {
            if (!/暂未选择评估对象/.test(body)) return 'config';
          }
          await page.waitForTimeout(600);
        }
        return 'timeout';
      };
      await page.goto(toUrl(histRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await assertEvalPage();
      await closeBasket();
      if (!/view=history/.test(page.url())) await clickHistoryTab();
      await page.waitForTimeout(1200);
      await scrollHistoryActions();
      const ready = await waitHistoryReady(35000);
      if (!ready) {
        throw new Error('最近评估列表未就绪（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
      }
      await scrollHistoryActions();
      const histBefore = await countHistRows();
      if (histBefore < 1) {
        throw new Error('最近评估无综合竞争力历史行（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
      }
      const cloneBtns = page.getByRole('button', { name: '按此配置新建评估' });
      const nClone = await cloneBtns.count();
      if (nClone < 1) {
        throw new Error('最近评估无「按此配置新建评估」按钮（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
      }
      const scoreRow = (rowText, names) => {
        let s = 0;
        if (/已完成/.test(rowText)) s += 100;
        else if (/失败/.test(rowText)) s -= 30;
        if (/综合竞争力/.test(rowText) || /competitiveness/i.test(rowText)) s += 20;
        if (names.length === 1) s += 40;
        else if (names.length > 1) s += 10;
        return s;
      };
      let picked = null;
      let bestScore = -1;
      for (let i = 0; i < nClone; i++) {
        const btn = cloneBtns.nth(i);
        if (!(await btn.isVisible().catch(() => false))) continue;
        const row = btn.locator('xpath=ancestor::tr[1]');
        const rowText = (await row.count() ? await row.innerText().catch(() => '') : '') || (await btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]').innerText().catch(() => ''));
        if (!/综合竞争力/.test(rowText) && !/competitiveness/i.test(rowText)) continue;
        const names = extractEnterpriseNames(rowText);
        const sc = scoreRow(rowText, names);
        if (sc > bestScore) {
          bestScore = sc;
          picked = { btn, rowText };
        }
        if (/已完成/.test(rowText) && names.length > 0 && sc >= bestScore) break;
      }
      if (!picked) {
        picked = { btn: cloneBtns.first(), rowText: await cloneBtns.first().locator('xpath=ancestor::tr[1]').innerText().catch(() => '') };
      }
      const rowText = picked.rowText;
      const rowCodes = extractCodes(rowText);
      const rowNames = extractEnterpriseNames(rowText);
      await expect(picked.btn).toBeEnabled({ timeout: 8000 });
      const hydrateWait = page.waitForResponse(
        (r) => /entProfileBasic|enterprise.*profile|analysis\/tasks/i.test(r.url()) && r.status() < 400,
        { timeout: 25000 },
      ).catch(() => null);
      await picked.btn.click({ timeout: 10000 });
      await hydrateWait;
      await page.waitForTimeout(600);
      const curTab = page.locator('[data-tab-key="current"]');
      if (await curTab.count() && await curTab.first().isVisible().catch(() => false)) {
        await curTab.first().click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      const fillState = await waitConfigFilled(35000);
      await closeBasket();
      const url = page.url();
      const body = await main().innerText().catch(() => '');
      if (fillState === 'processing' || (/view=processing/.test(url) && /可视化分析过程|综合竞争力评估生成中/.test(body))) {
        throw new Error('点击后自动进入过程态（用例要求不立即产生新任务）：' + url);
      }
      if (fillState === 'result' || /view=result/.test(url) || (/综合竞争力评估结果/.test(body) && !/指标与权重/.test(body))) {
        throw new Error('点击后进入结果页（用例要求停在配置页）：' + url);
      }
      if (!/评估模板/.test(body) && !/指标与权重/.test(body) && !/评估对象/.test(body)) {
        throw new Error('未见当前分析配置区（评估模板/指标与权重/评估对象）：' + url);
      }
      const removeN = await main().locator('button[aria-label^="移除"]').count();
      const urlCodeN = (url.match(/enterprise_codes/g) || []).length;
      const emptyObj = /暂未选择评估对象/.test(body);
      const fromBasket = /来自对比篮/.test(body) && !emptyObj;
      const nameHit = rowNames.filter((n) => body.includes(n));
      const snap = { rowCodes, rowNames, url, removeN, emptyObj, fromBasket, fillState, nameHit, histBefore };
      await saveSnap(snap);
      const objectsOk = removeN > 0 || urlCodeN > 0 || fromBasket || nameHit.length > 0;
      if (!objectsOk) {
        const hint = rowNames.length ? ('行企业=' + rowNames.slice(0, 3).join('、')) : ('行编码=' + rowCodes.join(','));
        throw new Error('配置页对象区仍为空（ticket=ENV-EVAL-COMPETE-HISTORY-002；' + hint + '）');
      }
      const fromUrl = extractCodes(url);
      const fromBody = extractCodes(body);
      const filledCodes = [...new Set([...fromUrl, ...fromBody])];
      if (rowCodes.length > 0 && removeN < 1) {
        const hit = rowCodes.filter((c) => filledCodes.includes(c));
        if (hit.length < 1 && nameHit.length < 1) {
          throw new Error('对象区未含该行企业编码（行=' + rowCodes.join(',') + ' 页=' + filledCodes.slice(0, 6).join(',') + '）');
        }
      }
      if (rowNames.length > 0 && removeN < 1 && nameHit.length < 1 && !fromBasket) {
        throw new Error('对象区未匹配行内企业名：行=' + rowNames.slice(0, 3).join('、'));
      }
  - note: 2、对象区出现该次企业
    assert: |-
      const s = await page.evaluate(() => window.__gkx_qa_02010 || null);
      if (!s) throw new Error('缺 expect1 落盘');
      if (s.removeN > 0) return;
      const url = page.url();
      const body = await page.locator('main.diagnosis-main, main.app-main').first().innerText().catch(() => '');
      const fromUrl = (url.match(/[a-f0-9]{32}/gi) || []).map((c) => c.toLowerCase());
      const fromBody = (body.match(/[a-f0-9]{32}/gi) || []).map((c) => c.toLowerCase());
      const codes = [...new Set(fromUrl.concat(fromBody))];
      if (s.removeN > 0 || s.fromBasket) return;
      if (s.rowNames && s.rowNames.length) {
        if (!s.rowNames.some((n) => body.includes(n))) {
          throw new Error('对象区未匹配行内企业名：行=' + s.rowNames.slice(0, 3).join('、'));
        }
        return;
      }
      if (s.rowCodes && s.rowCodes.length) {
        if (!s.rowCodes.some((c) => codes.includes(c))) {
          throw new Error('对象区未匹配行内企业编码：行=' + s.rowCodes.join(',') + ' 页=' + codes.slice(0, 8).join(','));
        }
        return;
      }
      throw new Error('行内无企业编码/公司名可核对（ticket=ENV-EVAL-COMPETE-HISTORY-002）');
  - note: 3、不立即产生新任务
    assert: |-
      const s = await page.evaluate(() => window.__gkx_qa_02010 || null);
      if (!s) throw new Error('缺 expect1 落盘');
      const u = page.url();
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const t = await main().innerText().catch(() => '');
      if (/view=result/.test(u)) throw new Error('URL 仍为结果 view=result：' + u);
      if (/view=processing/.test(u) && /可视化分析过程|综合竞争力评估生成中/.test(t)) {
        throw new Error('仍在过程态（不应自动起任务）：' + u);
      }
      if (/综合竞争力评估结果/.test(t) && !/指标与权重/.test(t)) {
        throw new Error('主区仍为综合竞争力评估结果态');
      }
      await expect(page.getByText('评估模板', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
      if (await curTab.isVisible().catch(() => false)) {
        await curTab.click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
      await recentTab.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      const rows = main().locator('table tbody tr');
      let histAfter = await rows.count();
      if (histAfter < 1) {
        histAfter = await main().getByText(/EVAL-\d{8}-\d{3}|DEMO-EVAL-\d{8}-\d+/).count();
      }
      if (typeof s.histBefore === 'number' && histAfter > s.histBefore) {
        throw new Error('最近评估条数增加：点击前 ' + s.histBefore + ' 点击后 ' + histAfter + '（不应立即产生新任务）');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  02010 最近评估「按此配置新建评估」→当前分析配置（评估模板/指标与权重/评估对象）；D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/evaluation + workspace=competitiveness&mode=competitiveness&view=history（禁止 enterprise-center 404，对齐 02007/02012）。入口深链 view=history + 表格横向滚操作列；对象断言：移除钮 / URL enterprise_codes / 来自对比篮 / 行内公司名；hydrate wait 35s。不自动进过程/结果；最近评估条数不增。无历史 ENV-EVAL-COMPETE-HISTORY-001；克隆后对象仍空 ENV-EVAL-COMPETE-HISTORY-002（D3·C1 产品，与 01804/01922 同族）。用例备注：预检失败致开始分析不可用不作为唯一通过条件。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
