id: P0-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00414
priority: P0
title: 分析完成后自动转入结果态且 URL 视图参数切换
story: US-ENT-EVAL-RESULT
entry_id: ent-eval-compete
preconditions:
- 过程态已发起（至少 1 家企业，配置有效）或可重新发起
locators:
  result_area: 综合竞争力评估结果
steps:
- action: goto
  target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
- action: evaluate
  note: 回填对象→开始分析→等待 view=result
- action: wait
  for: URL view=result 或结果区呈现
expect:
- note: URL 视图参数变为结果态
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { await close.first().click(); await page.waitForTimeout(300) }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); if (await sels.count() >= 2) await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2500) }; const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('ALLOW_SKIP: 开始分析禁用无法进入结果态'); await start.click(); await page.waitForTimeout(2000); const startTs = Date.now(); let ok = false; while (Date.now() - startTs < 90000) { const u = page.url(); const t = await page.locator('main.content-shell-layout, main').first().innerText().catch(()=> ''); if (/view=result/.test(u)) { ok = true; break } if (/调整配置|重新分析/.test(t) && !/评估生成中|生成中/.test(t) && !/评估失败|生成失败/.test(t)) { ok = true; break } if (/评估失败|生成失败|本次评估生成失败/.test(t)) throw new Error('ALLOW_SKIP: 评估任务生成失败无法进入结果态'); await page.waitForTimeout(3000) }; if (!ok) throw new Error('等待结果态超时'); await expect(page).toHaveURL(/view=result/)
- note: 页面呈现综合竞争力评估结果区
  assert: 'await expect(page.getByText(/综合竞争力评估结果|综合竞争力得分|评估结果/).first()).toBeVisible({ timeout: 15000 })'
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业、开始分析禁用，或任务生成失败/超时未转结果时记 Pass-N/A + observed
as_built_note: 2026-10-14 实勘过程态可达（analysis_type=competitiveness + EVAL-YYYYMMDD-NNN），但任务曾「评估失败/生成失败」→ 本环境结果态可能不可达，allow_skip。
tier: A
