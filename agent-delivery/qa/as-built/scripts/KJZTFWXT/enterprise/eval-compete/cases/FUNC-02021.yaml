id: FUNC-02021
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02021
priority: P1
title: 只读综合竞争力报告点击导出触发下载或已导出反馈
story: US-ENT-EVAL-RESULT
entry_id: ent-eval-compete
tier: B
preconditions:
  - 已打开成功评估的只读 HTML 报告（as-built：最近评估→查看 HTML 报告或结果态入口）
  - 演示需开通「付费权益」方可点导出（30888 人设菜单 switch）
locators:
  report_root: '[data-report-readonly="true"]'
  export_btn: '[data-report-export-unlocked] button[data-report-download]'
  paid_switch: switch「付费权益」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 打开只读报告→开通付费演示→点「导出」；下载或 Toast 在 expect
expect:
  - note: 1、出现文件下载或导出完成提示
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const reportRoot = () => page.locator('[data-report-readonly="true"]').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const reportShellReady = async () => {
        if (!/view=report/.test(page.url())) return false;
        if (!(await reportRoot().isVisible().catch(() => false))) return false;
        const t = await reportRoot().innerText().catch(() => '');
        return /报告目录/.test(t) || /企业评估\s*[·・]\s*只读报告/.test(t) || /报告身份|封面与报告身份/.test(t);
      };
      const waitReportShell = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await reportShellReady()) return true;
          await page.waitForTimeout(500);
        }
        return await reportShellReady();
      };
      const openFromHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const restores = main().getByRole('button', { name: '恢复结果' });
        const n = await restores.count();
        for (let i = 0; i < n; i++) {
          const restore = restores.nth(i);
          if (!(await restore.isVisible().catch(() => false))) continue;
          const row = restore.locator('xpath=ancestor::tr[1]');
          const htmlBtn = row.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
          if (!(await htmlBtn.count()) || !(await htmlBtn.isVisible().catch(() => false))) continue;
          if (!(await htmlBtn.isEnabled().catch(() => false))) continue;
          await htmlBtn.scrollIntoViewIfNeeded().catch(() => {});
          await htmlBtn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          const tNav = Date.now();
          while (Date.now() - tNav < 30000 && !/view=report/.test(page.url())) await page.waitForTimeout(400);
          if (/view=report/.test(page.url()) && await waitReportShell(60000)) return true;
        }
        const attrBtn = main().locator('[data-eval-history-open-html-report]:not(.arco-btn-disabled)').first();
        if (await attrBtn.count() && await attrBtn.isVisible().catch(() => false) && await attrBtn.isEnabled().catch(() => false)) {
          await attrBtn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          if (await waitReportShell(60000)) return true;
        }
        return false;
      };
      const openFromResult = async () => {
        const onResult = async () => /view=result/.test(page.url()) && /综合竞争力评估结果/.test(await main().innerText().catch(() => ''));
        if (!(await onResult())) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          await closeBasket();
          const tab = page.getByRole('tab', { name: '最近评估', exact: true });
          if (await tab.isVisible().catch(() => false)) {
            await tab.click({ timeout: 8000 });
            await page.waitForTimeout(800);
          }
          const restore = main().getByRole('button', { name: '恢复结果' }).first();
          if (await restore.isVisible().catch(() => false)) {
            await restore.click({ timeout: 8000 });
            await page.waitForTimeout(3500);
          }
          if (!(await onResult())) {
            const body = await main().innerText().catch(() => '');
            const tid = (body.match(TID_RE) || [])[0];
            if (tid) {
              await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2500);
            }
          }
        }
        if (!(await onResult())) return false;
        const entry = page.locator('[data-eval-open-html-report]').first();
        const btn = (await entry.isVisible().catch(() => false)) ? entry : main().getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
        await expect(btn).toBeVisible({ timeout: 10000 });
        await closeBasket();
        await btn.click({ timeout: 8000 }).catch(() => btn.click({ force: true, timeout: 8000 }));
        let tNav = Date.now();
        while (Date.now() - tNav < 30000 && !/view=report/.test(page.url())) await page.waitForTimeout(400);
        if (!/view=report/.test(page.url())) {
          const tid = new URL(page.url()).searchParams.get('task_id') || (TID_RE.exec(await main().innerText().catch(() => '')) || [])[0];
          if (tid) {
            await page.goto(toUrl(evalRoute + '&view=report&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
          }
        }
        return await waitReportShell(90000);
      };
      const openHtmlReport = async () => {
        if (await reportShellReady()) return;
        if (await openFromHistory()) return;
        if (await openFromResult()) return;
        throw new Error('无法打开综合竞争力只读报告（ticket=ENV-EVAL-COMPETE-REPORT-001）');
      };
      const dismissBlockingModals = async () => {
        for (let i = 0; i < 3; i++) {
          const wrap = page.locator('.arco-modal-wrapper').filter({ has: page.locator('.arco-modal') });
          if (!(await wrap.count()) || !(await wrap.first().isVisible().catch(() => false))) break;
          await page.keyboard.press('Escape').catch(() => {});
          await page.waitForTimeout(250);
          const cancel = page.getByRole('button', { name: '取消', exact: true });
          if (await cancel.count() && await cancel.first().isVisible().catch(() => false)) {
            await cancel.first().click({ timeout: 2000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const ensurePaidForExport = async () => {
        const reportUrl = page.url();
        const menuBtn = page.locator('button.persona-switch').first();
        const findPaidSwitch = async () => {
          for (const name of [/付费权益/, '付费权益（报告导出）']) {
            const sw = page.getByRole('switch', { name });
            if (await sw.count() && await sw.first().isVisible().catch(() => false)) return sw.first();
          }
          return null;
        };
        await dismissBlockingModals();
        await menuBtn.scrollIntoViewIfNeeded().catch(() => {});
        await menuBtn.click({ timeout: 8000, force: true });
        await page.waitForTimeout(500);
        let paidSw = await findPaidSwitch();
        if (!paidSw) throw new Error('人设菜单未见付费权益 switch');
        if ((await paidSw.getAttribute('aria-checked')) !== 'true') {
          await paidSw.click({ timeout: 5000 });
          await page.waitForTimeout(600);
        }
        await page.keyboard.press('Escape').catch(() => {});
        await dismissBlockingModals();
        const paidOk = await page.locator('button.persona-switch').first().getAttribute('data-paid');
        if (paidOk !== '1') {
          throw new Error('付费权益 switch 未生效（persona-switch data-paid≠1）');
        }
        if (!(await reportRoot().locator('[data-report-export-unlocked]').count())) {
          await page.goto(reportUrl, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
          if (!(await waitReportShell(60000))) throw new Error('开通付费后报告壳未就绪');
        }
        if (!(await reportRoot().locator('[data-report-export-unlocked]').count())) {
          throw new Error('付费已开但报告页仍为 data-report-export-locked');
        }
      };
      if (!/view=report/.test(page.url()) || !(await reportShellReady())) {
        await openHtmlReport();
      } else if (!(await waitReportShell(15000))) {
        await openHtmlReport();
      }
      await expect(reportRoot()).toBeVisible({ timeout: 10000 });
      await expect(reportRoot().getByText(/企业评估\s*[·・]\s*只读报告/).first()).toBeVisible({ timeout: 8000 });
      await ensurePaidForExport();
      await dismissBlockingModals();
      let exportBtn = reportRoot().locator('[data-report-export-unlocked][data-report-download], [data-report-export-unlocked] button[data-report-download]').first();
      if (!(await exportBtn.count()) || !(await exportBtn.isVisible().catch(() => false))) {
        const fallback = reportRoot().getByRole('button', { name: /^导出$/, exact: true }).first();
        if (await fallback.isVisible().catch(() => false)) exportBtn = fallback;
      }
      await expect(exportBtn).toBeVisible({ timeout: 12000 });
      if (await exportBtn.isDisabled().catch(() => true)) {
        throw new Error('付费已开但导出钮仍 disabled');
      }
      const downloadPromise = page.waitForEvent('download', { timeout: 20000 }).catch(() => null);
      await exportBtn.click({ timeout: 10000 });
      const dl = await downloadPromise;
      let feedbackOk = false;
      if (dl) feedbackOk = true;
      if (!feedbackOk) {
        const msg = page.locator('.arco-message').filter({ hasText: /报告已导出|导出成功|已导出|导出完成/ });
        await expect(msg.first()).toBeVisible({ timeout: 12000 });
        feedbackOk = true;
      }
      if (!feedbackOk) throw new Error('点击导出后既无 download 也无已导出提示');
      if (!/view=report/.test(page.url())) throw new Error('导出后离开报告页：' + page.url());
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  02021 备选-导出报告：只读综合竞争力 HTML 报告顶栏点「导出」→ 浏览器 download 或 Arco Message「报告已导出/导出成功」。30888 须先开人设「付费权益」后 data-report-export-unlocked（同 01903/02025 分工）。前置打开报告口径同 02014/02020。路由 /enterprise-center/evaluation competitiveness view=report。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
