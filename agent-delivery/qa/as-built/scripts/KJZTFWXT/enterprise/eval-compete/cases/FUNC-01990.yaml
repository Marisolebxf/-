id: FUNC-01990
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01990
priority: P1
title: 当天相同条件再次开始分析不新增任务
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
tier: B
preconditions:
  - 当天已用相同对象与权重成功完成一次评估
  - 已从该结果回到配置且未改条件
locators:
  start: button「开始分析」/「个性化竞争力评价与输出」
  adjust: button「调整配置」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 成功结果→调整配置回配置态→再次点开始分析；任务 ID 与结果打开在 expect
expect:
  - note: 1、不产生新的任务 ID
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const extractTaskId = async () => {
        let tid = null;
        try { tid = new URL(page.url()).searchParams.get('task_id'); } catch {}
        if (!tid) {
          const t = await main().innerText().catch(() => '');
          const tm = t.match(/(?:DEMO-)?EVAL-\d{8}-\d{3,}/g);
          if (tm && tm.length) tid = tm[tm.length - 1];
        }
        return tid;
      };
      const normalizeTid = (tid) => {
        if (!tid) return null;
        return tid.replace(/^DEMO-/, '');
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家');
      };
      const openEnterprisePicker = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const bodyResultReady = async () => {
        if (!/view=result/.test(page.url())) {
          const t = await main().innerText().catch(() => '');
          if (/综合竞争力评估结果/.test(t) && /\d+\s*分/.test(t)) return true;
          return false;
        }
        return await page.getByRole('heading', { name: '综合竞争力评估结果' }).first().isVisible().catch(() => false)
          || await page.getByText(/综合竞争力评估结果/).first().isVisible().catch(() => false);
      };
      const waitForCompeteResult = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          if (await bodyResultReady()) return;
          const showBtn = main().getByRole('button', { name: /查看评估结果/ });
          if (await showBtn.first().isVisible().catch(() => false)) {
            await showBtn.first().click({ timeout: 8000 });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          const u = page.url();
          const tid = (() => { try { return new URL(u).searchParams.get('task_id'); } catch { return null; } })();
          if (tid && /view=processing/.test(u)) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          const t = await main().innerText().catch(() => '');
          if (/评估失败|生成失败|本次评估生成失败/.test(t)) throw new Error('分析终态失败：' + u);
          await page.waitForTimeout(2000);
        }
        throw new Error('180s 内未到综合竞争力评估结果：' + page.url());
      };
      const runConfigToResult = async () => {
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await openEnterprisePicker();
        const panel = page.locator('.system-compare-panel');
        await expect(panel).toBeVisible({ timeout: 10000 });
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count() < 1) throw new Error('对比篮无可选企业');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(300);
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await dismissBasket();
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count()) ? startClassic : startAlt;
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-COMPETE-PRECHECK-001）');
          throw new Error('对象已回填但开始分析仍禁用');
        }
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await waitForCompeteResult();
      };
      const adjustBtn = async () => {
        if (!(await bodyResultReady())) return null;
        for (const name of ['调整配置', '返回配置']) {
          const btns = main().getByRole('button', { name, exact: true });
          const n = await btns.count();
          for (let i = 0; i < n; i++) {
            const b = btns.nth(i);
            if (await b.isVisible().catch(() => false)) return b;
          }
        }
        return null;
      };
      const clickStartAnalysis = async () => {
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count() && await startClassic.first().isVisible().catch(() => false))
          ? startClassic.first() : startAlt;
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-COMPETE-PRECHECK-001）');
          throw new Error('开始分析按钮禁用');
        }
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const hydrateConfigFromHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recentTab).toBeVisible({ timeout: 12000 });
        await recentTab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const cloneBtns = page.getByRole('button', { name: '按此配置新建评估' });
        const n = await cloneBtns.count();
        if (n < 1) return false;
        let picked = null;
        for (let i = 0; i < n; i++) {
          const btn = cloneBtns.nth(i);
          if (!(await btn.isVisible().catch(() => false))) continue;
          const row = btn.locator('xpath=ancestor::tr[1]');
          const rowText = await row.count() ? await row.innerText().catch(() => '') : '';
          if (!/综合竞争力/.test(rowText) && !/competitiveness/i.test(rowText)) continue;
          picked = btn;
          if (/已完成/.test(rowText)) break;
        }
        if (!picked) picked = cloneBtns.first();
        await picked.click({ timeout: 10000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 20000) {
          const body = await main().innerText().catch(() => '');
          const u = page.url();
          if (/view=processing/.test(u) || /view=result/.test(u)) return false;
          if ((/来自对比篮/.test(body) || /移除/.test(body)) && /评估对象/.test(body)) return true;
          if (/指标与权重/.test(body) && /评估模板/.test(body) && !/暂未选择评估对象/.test(body)) return true;
          await page.waitForTimeout(500);
        }
        return false;
      };
      const ensureFirstSuccessToday = async () => {
        if (globalThis.__func01988_ready && globalThis.__func01988_taskId) {
          const tid = globalThis.__func01988_taskId;
          const ids = [tid];
          if (!/^DEMO-/.test(tid)) ids.push('DEMO-' + tid);
          for (const taskId of ids) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(taskId)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return taskId;
          }
        }
        if (await bodyResultReady()) {
          const tid = await extractTaskId();
          if (tid) return tid;
        }
        if (await hydrateConfigFromHistory()) {
          globalThis.__func01990_branch = 'history-clone-then-start';
          await clickStartAnalysis();
          await waitForCompeteResult();
          const tid = await extractTaskId();
          if (!tid || !/^(?:DEMO-)?EVAL-\d{8}-\d{3,}$/.test(tid)) throw new Error('历史克隆后首次分析未见任务 ID');
          globalThis.__func01988_taskId = tid;
          globalThis.__func01988_ready = true;
          return tid;
        }
        try {
          await runConfigToResult();
        } catch (e) {
          const msg = String(e && e.message || e);
          if (msg.includes('ENV-GATE') || msg.includes('对比篮')) {
            throw new Error('ENV-GATE:无对比篮且无最近评估可克隆（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
          }
          throw e;
        }
        const tid = await extractTaskId();
        if (!tid || !/^(?:DEMO-)?EVAL-\d{8}-\d{3,}$/.test(tid)) throw new Error('首次评估未见任务 ID');
        globalThis.__func01988_taskId = tid;
        globalThis.__func01988_ready = true;
        return tid;
      };
      const returnToConfigUnchanged = async () => {
        let adjust = await adjustBtn();
        await dismissBasket();
        await page.keyboard.press('Escape').catch(() => {});
        if (adjust) {
          await adjust.evaluate((el) => el.click());
          const tAdj = Date.now();
          while (Date.now() - tAdj < 15000) {
            const body = await main().innerText().catch(() => '');
            const hasStart = (await page.getByRole('button', { name: '开始分析' }).count())
              || (await page.getByRole('button', { name: '个性化竞争力评价与输出' }).count());
            if (!/view=result/.test(page.url()) && /评估对象/.test(body) && hasStart) break;
            await page.waitForTimeout(400);
          }
        } else if (/view=result/.test(page.url())) {
          const u = new URL(page.url());
          u.searchParams.delete('view');
          u.searchParams.delete('task_id');
          await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        if (/view=result/.test(page.url())) {
          const u = new URL(page.url());
          u.searchParams.delete('view');
          u.searchParams.delete('task_id');
          await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        await expect(main().getByText('评估对象').first()).toBeVisible({ timeout: 12000 });
      };
      const clickStartAgain = async () => {
        await clickStartAnalysis();
        await page.waitForTimeout(1200);
      };
      const firstTid = await ensureFirstSuccessToday();
      const firstNorm = normalizeTid(firstTid);
      globalThis.__func01990_firstTid = firstTid;
      await returnToConfigUnchanged();
      globalThis.__func01990_onConfig = true;
      const beforeSecond = normalizeTid(await extractTaskId());
      await clickStartAgain();
      const tWait = Date.now();
      while (Date.now() - tWait < 30000) {
        if (/view=processing/.test(page.url())) break;
        const body = await main().innerText().catch(() => '');
        if (/已打开今天相同条件的评估结果|相同条件/.test(body)) break;
        if (await bodyResultReady()) break;
        try {
          const uTid = new URL(page.url()).searchParams.get('task_id');
          if (uTid) break;
        } catch {}
        await page.waitForTimeout(500);
      }
      const afterTid = await extractTaskId();
      const afterNorm = normalizeTid(afterTid);
      const bodyAfter = await main().innerText().catch(() => '');
      const allIds = (bodyAfter + ' ' + page.url()).match(/(?:DEMO-)?EVAL-\d{8}-\d{3,}/g) || [];
      const uniqNorm = [...new Set(allIds.map((x) => x.replace(/^DEMO-/, '')))];
      if (uniqNorm.length > 1) {
        throw new Error('出现多个任务 ID：' + uniqNorm.join(', ') + ' 期望复用 ' + firstNorm);
      }
      if (/view=processing/.test(page.url())) {
        const procTid = normalizeTid((() => { try { return new URL(page.url()).searchParams.get('task_id'); } catch { return null; } })());
        if (procTid && procTid !== firstNorm) {
          throw new Error('第二次开始分析进入新过程态，任务 ID=' + procTid + ' 原任务=' + firstNorm);
        }
      }
      const reused = (afterNorm === firstNorm) || (beforeSecond === firstNorm && !afterNorm)
        || /已打开今天相同条件的评估结果/.test(bodyAfter);
      if (!reused && afterNorm && afterNorm !== firstNorm) {
        throw new Error('产生了新任务 ID：' + afterNorm + ' 原=' + firstNorm);
      }
      globalThis.__func01990_reuseOk = true;
      globalThis.__func01990_afterTid = afterTid || firstTid;
  - note: 2、打开该次已有评估结果
    assert: |-
      if (!globalThis.__func01990_reuseOk) throw new Error('前置：任务复用未通过');
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const firstTid = globalThis.__func01990_firstTid;
      const tid = globalThis.__func01990_afterTid || firstTid;
      const body = await main().innerText().catch(() => '');
      const url = page.url();
      const urlTid = (() => { try { return new URL(url).searchParams.get('task_id'); } catch { return null; } })();
      const norm = (x) => (x || '').replace(/^DEMO-/, '');
      const openedHint = /已打开今天相同条件的评估结果|相同条件.*评估结果/.test(body);
      const resultVisible = /view=result/.test(url) && (
        await page.getByRole('heading', { name: '综合竞争力评估结果' }).first().isVisible().catch(() => false)
        || await page.getByText(/综合竞争力评估结果/).first().isVisible().catch(() => false)
        || (/综合竞争力评估结果/.test(body) && /\d+\s*分/.test(body))
      );
      const onResultView = resultVisible;
      const urlHasOrig = urlTid && norm(urlTid) === norm(firstTid);
      const bodyHasOrig = norm(tid) && (body.includes(tid) || body.includes(norm(tid)) || body.includes('DEMO-' + norm(tid)));
      if (openedHint || onResultView || urlHasOrig || bodyHasOrig) {
        if (urlHasOrig || bodyHasOrig || onResultView) {
          await expect(main().getByText(new RegExp(norm(tid).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))).first()).toBeVisible({ timeout: 10000 }).catch(() => {});
        }
        globalThis.__func01990_done = true;
        return;
      }
      throw new Error('未见打开已有结果（无提示/无 view=result/无原任务号）：' + url);
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  当天相同条件复用（USM-05）：30888 路由 /enterprise-center/evaluation。前置优先同批 01988 深链；否则「最近评估→按此配置新建评估」回填对象与权重后跑通当日首次成功分析，再对比篮兜底。回配置用「调整配置」或 URL 去 view/task_id；未改条件再点「开始分析」/「个性化竞争力评价与输出」。D1：现场可能停在配置页提示「已打开今天相同条件的评估结果」且 URL 带原 task_id、结果区不自动展开——机检以原任务号在 URL/正文或 view=result 为打开已有结果。登录与关内部评审由 runner 会话前置。tier B，零 allow_skip。过程态取消见 00434（ENV-EVAL-COMPETE-PROC-001）。
