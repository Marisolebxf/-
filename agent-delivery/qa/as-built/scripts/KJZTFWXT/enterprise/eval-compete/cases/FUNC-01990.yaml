id: FUNC-01990
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01990
priority: P1
tier: B
title: 备选-当天再次开始分析
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation
  - action: click
    target: 企业综合竞争力评估
  - action: click
    target: 最近评估
  - action: click
    target: 按此配置新建评估
  - action: click
    target: 开始分析
  - action: assert_visible
    target: 综合竞争力评估结果
  - action: evaluate
    target: |-
      const m = document.querySelector('main')?.textContent?.match(/EVAL-\d{8}-\d{3}/);
      if (!m) throw new Error('no task id on result page');
      sessionStorage.setItem('func01990_task_id', m[0]);
  - action: click
    target: 调整配置
  - action: click
    target: 开始分析
  - action: click
    target: 查看结果
expect:
  - note: 1、不产生新的任务 ID
    assert: |-
      const prev = await page.evaluate(() => sessionStorage.getItem('func01990_task_id'));
      const cur = await page.locator('main').locator('text=/EVAL-\\d{8}-\\d{3}/').first().textContent();
      expect(cur?.trim()).toBe(prev);
  - note: 2、打开该次已有评估结果
    assert: |-
      await expect(page.locator('main').getByText('综合竞争力评估结果')).toBeVisible({ timeout: 60000 });
on_fail: 截图 + 抄 X-Trace-Id
