id: P0-20
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00436
priority: P0
title: 未选评估对象时开始分析按钮禁用
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
preconditions:
  - env-gate overall=pass
  - 已进入综合竞争力评估页且评估对象区为空（无 enterprise_codes）
locators:
  cta: button「前往对比篮选择企业」
  start: button「开始分析」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
expect:
  - note: 空态对象区可见「前往对比篮选择企业」且 URL 无 enterprise_codes
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); if (/enterprise_codes/.test(page.url())) { await page.goto('http://10.50.69.111:30892/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000) }; const close = page.locator('button[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false) && await close.first().isEnabled().catch(() => false)) { try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300) } catch {} }; await expect(page).not.toHaveURL(/enterprise_codes/); await expect(page.getByRole('button', { name: '前往对比篮选择企业' })).toBeVisible({ timeout: 8000 })
  - note: 「开始分析」为禁用态且点击后不进入过程/结果态
    assert: |-
      const start = page.getByRole('button', { name: '开始分析' }); await expect(start).toBeVisible({ timeout: 8000 }); await expect(start).toBeDisabled({ timeout: 8000 }); await start.click({ force: true }).catch(() => {}); await page.waitForTimeout(800); if (/view=processing|view=result/.test(page.url())) throw new Error('空态强制点击后仍进入过程/结果态')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 空态 CTA「前往对比篮选择企业」；开始分析 = disabled（scout）。带回对象后恢复可用由 00406=P0-07 承载。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
