id: P1-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00434
priority: P1
title: 过程态取消任务后终止本次分析且配置保留
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
preconditions:
- 处于过程态（任务进行中）
expect:
- note: 任务终止且页面离开过程态
  assert: |-
    if (!page.url().includes('view=processing')) { await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(600); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() >= 1) { await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500) } }; const start = page.getByRole('button', { name: '开始分析' }); if (await start.count() && !(await start.isDisabled())) { await start.click(); await page.waitForTimeout(2000) } }; if (!page.url().includes('view=processing')) throw new Error('SKIP_NO_PROCESSING'); await page.getByRole('button', { name: /取消任务/ }).click({ timeout: 8000 }); await page.waitForTimeout(1500); if (page.url().includes('view=processing')) throw new Error('取消后仍在过程态')
- note: 已回填对象与配置不被清空
  assert: |-
    await expect(page.locator('[role=spinbutton]').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/来自对比篮|评估对象/).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无法进入过程态时记 Pass-N/A
as_built_note: 取消后去向（回配置态）以现场为准 observed。
tier: B
