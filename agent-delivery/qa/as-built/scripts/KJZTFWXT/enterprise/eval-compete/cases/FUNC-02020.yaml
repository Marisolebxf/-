id: FUNC-02020
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02020
priority: P0
title: 只读 HTML 报告按固定目录展示七节
story: US-ENT-EVAL-RESULT
entry_id: ent-eval-compete
tier: B
preconditions:
  - 已打开一条成功评估的 HTML 报告（as-built：最近评估行「查看 HTML 报告」或结果态入口）
locators:
  report_eyebrow: 企业评估 · 只读报告
  report_toc: nav[aria-label="报告目录"]
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 打开只读报告并阅读报告目录；导航与判定在 expect
expect:
  - note: 1、页眉为「企业评估 · 只读报告」；目录含报告身份、执行摘要、对象与范围、关键发现
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const reportRoot = () => page.locator('[data-report-readonly="true"]').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const reportShellReady = async () => {
        if (!/view=report/.test(page.url())) return false;
        if (!(await reportRoot().isVisible().catch(() => false))) return false;
        const t = await reportRoot().innerText().catch(() => '');
        return /报告目录/.test(t) || /报告身份|封面与报告身份/.test(t);
      };
      const waitReportShell = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await reportShellReady()) return true;
          await page.waitForTimeout(500);
        }
        return await reportShellReady();
      };
      const openFromHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(tab).toBeVisible({ timeout: 10000 });
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const restores = main().getByRole('button', { name: '恢复结果' });
        const n = await restores.count();
        for (let i = 0; i < n; i++) {
          const restore = restores.nth(i);
          if (!(await restore.isVisible().catch(() => false))) continue;
          const row = restore.locator('xpath=ancestor::tr[1]');
          const htmlBtn = row.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
          if (!(await htmlBtn.count()) || !(await htmlBtn.isVisible().catch(() => false))) continue;
          if (!(await htmlBtn.isEnabled().catch(() => false))) continue;
          await htmlBtn.scrollIntoViewIfNeeded().catch(() => {});
          await htmlBtn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          const tNav = Date.now();
          while (Date.now() - tNav < 30000 && !/view=report/.test(page.url())) await page.waitForTimeout(400);
          if (/view=report/.test(page.url()) && await waitReportShell(60000)) return true;
        }
        const attrBtn = main().locator('[data-eval-history-open-html-report]:not(.arco-btn-disabled)').first();
        if (await attrBtn.count() && await attrBtn.isVisible().catch(() => false) && await attrBtn.isEnabled().catch(() => false)) {
          await attrBtn.click({ timeout: 8000 });
          await page.waitForTimeout(2000);
          if (await waitReportShell(60000)) return true;
        }
        return false;
      };
      const openFromResult = async () => {
        const onResult = async () => /view=result/.test(page.url()) && /综合竞争力评估结果/.test(await main().innerText().catch(() => ''));
        if (!(await onResult())) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          await closeBasket();
          const tab = page.getByRole('tab', { name: '最近评估', exact: true });
          if (await tab.isVisible().catch(() => false)) {
            await tab.click({ timeout: 8000 });
            await page.waitForTimeout(800);
          }
          const restore = main().getByRole('button', { name: '恢复结果' }).first();
          if (await restore.isVisible().catch(() => false)) {
            await restore.click({ timeout: 8000 });
            await page.waitForTimeout(3500);
          }
          if (!(await onResult())) {
            const body = await main().innerText().catch(() => '');
            const tid = (body.match(TID_RE) || [])[0];
            if (tid) {
              await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2500);
            }
          }
        }
        if (!(await onResult())) return false;
        const entry = page.locator('[data-eval-open-html-report]').first();
        const btn = (await entry.isVisible().catch(() => false)) ? entry : main().getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
        await expect(btn).toBeVisible({ timeout: 10000 });
        await closeBasket();
        await btn.click({ timeout: 8000 }).catch(() => btn.click({ force: true, timeout: 8000 }));
        let tNav = Date.now();
        while (Date.now() - tNav < 30000 && !/view=report/.test(page.url())) await page.waitForTimeout(400);
        if (!/view=report/.test(page.url())) {
          const tid = new URL(page.url()).searchParams.get('task_id') || (TID_RE.exec(await main().innerText().catch(() => '')) || [])[0];
          if (tid) {
            await page.goto(toUrl(evalRoute + '&view=report&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
          }
        }
        return await waitReportShell(90000);
      };
      const ensureReport = async () => {
        if (globalThis.__func02020_report && await reportShellReady()) return;
        if (await reportShellReady()) {
          globalThis.__func02020_report = true;
          return;
        }
        if (await openFromHistory()) {
          globalThis.__func02020_report = true;
          return;
        }
        if (await openFromResult()) {
          globalThis.__func02020_report = true;
          return;
        }
        throw new Error('无法打开综合竞争力只读报告（ticket=ENV-EVAL-COMPETE-REPORT-001）');
      };
      await ensureReport();
      await expect(reportRoot()).toBeVisible({ timeout: 10000 });
      await expect(reportRoot().getByText(/企业评估\s*[·・]\s*只读报告/).first()).toBeVisible({ timeout: 8000 });
      const toc = reportRoot().locator('nav[aria-label="报告目录"]');
      await expect(toc).toBeVisible({ timeout: 8000 });
      const tocText = await toc.innerText().catch(() => '');
      const group1 = [
        ['报告身份', '封面与报告身份', '01 报告身份'],
        ['执行摘要', '决策摘要', '02 执行摘要'],
        ['对象与范围', '评估范围与方法', '03 对象与范围'],
        ['关键发现', '综合结果', '04 关键发现'],
      ];
      const miss1 = group1.filter((g) => !g.some((s) => tocText.includes(s))).map((g) => g[0]);
      if (miss1.length) throw new Error('目录缺前四节：' + miss1.join('、'));
      globalThis.__func02020_toc = tocText;
  - note: 2、目录含证据与分析、数据来源与生成说明、局限性与使用边界
    assert: |-
      if (!globalThis.__func02020_report) throw new Error('前置：只读报告未打开');
      const reportRoot = page.locator('[data-report-readonly="true"]').first();
      const toc = reportRoot.locator('nav[aria-label="报告目录"]');
      await expect(toc).toBeVisible({ timeout: 8000 });
      const tocText = globalThis.__func02020_toc || (await toc.innerText().catch(() => ''));
      const linkCount = await toc.locator('a').count();
      const group2 = [
        ['证据与分析', '模式分析', '05 证据与分析'],
        ['数据来源与生成说明', '06 数据来源与生成说明'],
        ['局限性与使用边界', '数据质量与局限', '局限', '07 局限性与使用边界'],
      ];
      const miss2 = group2.filter((g) => !g.some((s) => tocText.includes(s))).map((g) => g[0]);
      if (miss2.length) throw new Error('目录缺后三节：' + miss2.join('、') + '（links=' + linkCount + '）');
      if (linkCount > 0 && linkCount < 7 && linkCount !== 9) {
        throw new Error('报告目录链接数为 ' + linkCount + '，预期 ≥7 或 legacy 9');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  02020 验只读报告附录 B 七节目录（30888 /enterprise-center/evaluation competitiveness；view=report）。前置：最近评估已完成行「查看 HTML 报告」优先，否则结果态 data-eval-open-html-report。D1：现场可能为 legacy 九节 demo 文案，断言用别名组兼容。页眉「企业评估·只读报告」。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
