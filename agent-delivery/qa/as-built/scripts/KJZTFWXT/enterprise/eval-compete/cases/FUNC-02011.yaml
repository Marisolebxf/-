id: FUNC-02011
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02011
priority: P1
tier: B
title: 备选-删除分析记录取消
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation
  - action: evaluate
    note: 点「最近评估」→首条可见行点「删除」→弹框点「取消」
expect:
  - note: 1、弹出文案说明删除后列表不再显示
    assert: |-
      const main = page.locator('main.diagnosis-main, main.app-main').first();
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 12000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(main.getByRole('button', { name: '新建评估', exact: true }).first()).toBeVisible({ timeout: 12000 });
      const scrollActions = async () => {
        const bodies = main.locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const n = await bodies.count();
        for (let i = 0; i < n; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      await scrollActions();
      let delBtn = main.getByRole('button', { name: '删除', exact: true }).first();
      if (!(await delBtn.isVisible().catch(() => false))) {
        await scrollActions();
        delBtn = main.getByRole('button', { name: '删除', exact: true }).first();
      }
      if (!(await delBtn.isVisible().catch(() => false))) {
        throw new Error('最近评估无可见「删除」按钮（DEF-ENT-EVAL-HISTORY-DELETE-UI-001）');
      }
      const row = delBtn.locator('xpath=ancestor::tr[1]').first();
      const rowText = (await row.count()) ? await row.innerText().catch(() => '') : await main.innerText();
      const tidM = rowText.match(/(?:EVAL-\d{8}-\d{3}|DEMO-EVAL-\d{8}-\d+)/);
      if (!tidM) throw new Error('删除前行未见任务 ID');
      globalThis.__func02011_tid = tidM[0];
      await delBtn.click({ timeout: 8000 });
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      const bodyText = (await modal.innerText()).replace(/\s+/g, ' ');
      if (!/不再显示|不再展示|列表.*不|删除后/.test(bodyText)) {
        throw new Error('弹框未说明删除后列表不再显示');
      }
      await modal.getByRole('button', { name: '取消', exact: true }).click({ timeout: 8000 });
      await expect(modal).toBeHidden({ timeout: 10000 });
      globalThis.__func02011_done = true;
  - note: 2、取消后该任务仍在列表中
    assert: |-
      if (!globalThis.__func02011_done) throw new Error('未完成删除取消');
      const tid = globalThis.__func02011_tid;
      const main = page.locator('main.diagnosis-main, main.app-main').first();
      await expect(main.locator('table tbody tr').filter({ hasText: tid }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
