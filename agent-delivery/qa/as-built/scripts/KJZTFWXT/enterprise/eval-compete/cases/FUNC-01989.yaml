id: FUNC-01989
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01989
priority: P1
title: 结果页重新分析后出现新的成功结果
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
tier: B
preconditions:
  - 已打开一条成功的综合竞争力评估结果
locators:
  reanalyze: button「重新分析」
  result_heading: heading「综合竞争力评估结果」
  top_score_card: text「综合竞争力最高得分」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 结果态点重新分析→等待新结果；任务 ID 与指标卡在 expect
expect:
  - note: 1、新结果的任务 ID 与点击重新分析前不同
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const extractTaskId = async () => {
        let tid = null;
        try { tid = new URL(page.url()).searchParams.get('task_id'); } catch {}
        if (!tid) {
          const t = await main().innerText().catch(() => '');
          const tm = t.match(/(?:DEMO-)?EVAL-\d{8}-\d{3,}/);
          if (tm) tid = tm[0];
        }
        return tid;
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 ' + n);
      };
      const openEnterprisePicker = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const bodyResultReady = async () => {
        if (!/view=result/.test(page.url())) return false;
        return await page.getByRole('heading', { name: '综合竞争力评估结果' }).first().isVisible().catch(() => false)
          || await page.getByText(/综合竞争力评估结果/).first().isVisible().catch(() => false);
      };
      const reanalyzeBtn = async () => {
        const scopes = [page, main()];
        for (const scope of scopes) {
          const b = scope.getByRole('button', { name: '重新分析', exact: true });
          if (await b.count() && await b.first().isVisible().catch(() => false)) return b.first();
          const alt = scope.locator('button').filter({ hasText: '重新分析' });
          if (await alt.count() && await alt.first().isVisible().catch(() => false)) return alt.first();
        }
        return null;
      };
      const bodyResultReadyStrict = async () => {
        if (!/view=result/.test(page.url())) return false;
        const heading = await page.getByRole('heading', { name: '综合竞争力评估结果' }).first().isVisible().catch(() => false);
        const toolbar = !!(await reanalyzeBtn());
        return heading && toolbar;
      };
      const pollReanalyzeToolbar = async (ms) => {
        const t1 = Date.now();
        while (Date.now() - t1 < ms) {
          if (await bodyResultReadyStrict()) return true;
          await page.waitForTimeout(800);
        }
        return false;
      };
      const waitForCompeteResult = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          if (await bodyResultReady()) return;
          const showBtn = main().getByRole('button', { name: /查看评估结果/ });
          if (await showBtn.first().isVisible().catch(() => false)) {
            await showBtn.first().click({ timeout: 8000 });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          const u = page.url();
          const tid = (() => { try { return new URL(u).searchParams.get('task_id'); } catch { return null; } })();
          if (tid && /view=processing/.test(u)) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          const t = await main().innerText().catch(() => '');
          if (/评估失败|生成失败|本次评估生成失败/.test(t)) throw new Error('分析终态失败：' + u);
          await page.waitForTimeout(2000);
        }
        throw new Error('180s 内未到综合竞争力评估结果：' + page.url());
      };
      const waitForNewCompeteResult = async (oldTid) => {
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          const cur = await extractTaskId();
          if (cur && oldTid && cur !== oldTid && (await bodyResultReadyStrict())) return cur;
          const showBtn = main().getByRole('button', { name: /查看评估结果/ });
          if (await showBtn.first().isVisible().catch(() => false)) {
            await showBtn.first().click({ timeout: 8000 });
            await page.waitForTimeout(2500);
          }
          const u = page.url();
          const tid = (() => { try { return new URL(u).searchParams.get('task_id'); } catch { return null; } })();
          if (tid && tid !== oldTid && /view=processing/.test(u)) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
          }
          const t = await main().innerText().catch(() => '');
          if (/评估失败|生成失败|本次评估生成失败/.test(t)) throw new Error('重新分析终态失败：' + u);
          await page.waitForTimeout(2000);
        }
        throw new Error('180s 内未到新任务结果，旧任务=' + oldTid + ' 当前=' + page.url());
      };
      const runConfigToResult = async () => {
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await openEnterprisePicker();
        let panel = page.locator('.system-compare-panel');
        let sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count() < 1) {
          await ensureBasketEnterprises(1);
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await dismissBasket();
          await openEnterprisePicker();
          panel = page.locator('.system-compare-panel');
          sels = panel.locator('[aria-label^="选择 "]');
        }
        await expect(panel).toBeVisible({ timeout: 10000 });
        if (await sels.count() < 1) throw new Error('对比篮无可选企业');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(300);
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await dismissBasket();
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count()) ? startClassic : startAlt;
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-COMPETE-PRECHECK-001）');
          throw new Error('对象已回填但开始分析仍禁用');
        }
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await waitForCompeteResult();
      };
      const reenterResultFrom01988 = async () => {
        const tid = globalThis.__func01988_taskId;
        if (!tid || !globalThis.__func01988_ready) return false;
        await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2500);
        const t0 = Date.now();
        while (Date.now() - t0 < 30000) {
          if (await bodyResultReadyStrict()) return true;
          await page.waitForTimeout(500);
        }
        return await bodyResultReadyStrict();
      };
      const ensureResultWithReanalyze = async () => {
        if (globalThis.__func01989_onResult) return;
        if (await reenterResultFrom01988()) {
          globalThis.__func01989_onResult = true;
          return;
        }
        if (await bodyResultReadyStrict()) {
          globalThis.__func01989_onResult = true;
          return;
        }
        await runConfigToResult();
        await expect(page.getByRole('heading', { name: '综合竞争力评估结果' }).first()).toBeVisible({ timeout: 15000 });
        if (!(await pollReanalyzeToolbar(45000))) {
          throw new Error('D3-30888 结果区无「重新分析」（历史 DEMO 空壳无工具条；ticket=ENV-EVAL-COMPETE-REANALYZE-001）');
        }
        globalThis.__func01989_onResult = true;
      };
      await ensureResultWithReanalyze();
      const beforeTid = await extractTaskId();
      if (!beforeTid || !/^(?:DEMO-)?EVAL-\d{8}-\d{3,}$/.test(beforeTid)) {
        throw new Error('结果页未见可比对任务 ID：' + page.url());
      }
      await dismissBasket();
      await page.keyboard.press('Escape').catch(() => {});
      let reBtn = await reanalyzeBtn();
      if (!reBtn) throw new Error('结果区无「重新分析」按钮');
      await expect(reBtn).toBeEnabled({ timeout: 8000 });
      await reBtn.scrollIntoViewIfNeeded().catch(() => {});
      await reBtn.click({ force: true, timeout: 15000 });
      await page.waitForTimeout(1500);
      const procDeadline = Date.now() + 45000;
      let sawProcessing = /view=processing/.test(page.url());
      while (!sawProcessing && Date.now() < procDeadline) {
        sawProcessing = /view=processing/.test(page.url());
        if (!sawProcessing) await page.waitForTimeout(500);
      }
      if (!sawProcessing && !/view=result/.test(page.url())) {
        throw new Error('点重新分析后未进入过程态：' + page.url());
      }
      const afterTid = await waitForNewCompeteResult(beforeTid);
      globalThis.__func01989_beforeTid = beforeTid;
      globalThis.__func01989_afterTid = afterTid;
      if (beforeTid === afterTid) throw new Error('重新分析后任务 ID 未变化：' + beforeTid);
      globalThis.__func01989_done = true;
      await expect(main().getByText(afterTid).first()).toBeVisible({ timeout: 10000 });
  - note: 2、页面出现综合竞争力最高得分
    assert: |-
      if (!globalThis.__func01989_done) throw new Error('前置：重新分析新结果未完成');
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      await expect(main().getByText('综合竞争力最高得分', { exact: true }).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  作废 00433（只验过程态）。01989 须等到新成功结果：结果态点「重新分析」无二次确认（用例册）；30888 路由 /enterprise-center/evaluation。最近评估「恢复结果」常为 DEMO 空壳无「重新分析」工具条（同 00432 D3）→ 脚本对比篮发起至带工具条的成功结果；可链接同批 01988 task 深链。任务 ID 格式 DEMO-EVAL-YYYYMMDD-NNNN。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
