id: FUNC-01989
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01989
priority: P1
tier: B
title: 备选-重新分析到新结果
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 同册01988前置至成功结果→点击重新分析→等待新结果就绪
expect:
  - note: 1、新结果的任务 ID 与点击前不同
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const taskIdFromUrl = () => {
        try { return new URL(page.url()).searchParams.get('task_id'); } catch { return null; }
      };
      const taskIdFromMain = async () => {
        let tid = taskIdFromUrl();
        if (tid) return tid;
        const t = await main().innerText().catch(() => '');
        const tm = t.match(/(?:DEMO-)?EVAL-\d{8}-\d{3,}/);
        return tm ? tm[0] : null;
      };
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, (await addBtns.count()) - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(700);
          n = await basketEntCount();
          if (n < min && idx >= (await addBtns.count()) - 1) break;
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足');
      };
      const openEnterprisePicker = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const bodyResultReady = async () => {
        if (!/view=result/.test(page.url())) return false;
        const heading = page.getByRole('heading', { name: '综合竞争力评估结果' }).first();
        if (await heading.isVisible().catch(() => false)) return true;
        return await page.getByText(/综合竞争力评估结果/).first().isVisible().catch(() => false);
      };
      const scoreCardReady = async () =>
        await main().getByText('综合竞争力最高得分').first().isVisible().catch(() => false);
      const waitForCompeteResult = async (opts = {}) => {
        const needNewTask = opts.needNewTask;
        const prevTask = opts.prevTask;
        const needScore = !!opts.needScore;
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          const body = await main().innerText().catch(() => '');
          if (/404|抱歉，页面不存在/.test(body)) throw new Error('误入 404：' + page.url());
          const curTask = await taskIdFromMain();
          const ready =
            (needNewTask && prevTask && curTask && curTask !== prevTask) ||
            (!needNewTask && (await bodyResultReady()));
          if (ready && (!needScore || (await scoreCardReady()))) return curTask;
          const showBtn = main().getByRole('button', { name: /查看评估结果/ });
          if (await showBtn.first().isVisible().catch(() => false)) {
            await showBtn.first().click({ timeout: 8000 });
            await page.waitForTimeout(2500);
            continue;
          }
          if (/评估失败|生成失败|本次评估生成失败/.test(body)) throw new Error('分析终态失败：' + page.url());
          await page.waitForTimeout(2000);
        }
        throw new Error('180s 内未到稳定结果：' + page.url());
      };
      const runConfigToResult = async () => {
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await openEnterprisePicker();
        const panel = page.locator('.system-compare-panel');
        await expect(panel).toBeVisible({ timeout: 10000 });
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count() < 1) throw new Error('对比篮无可选企业');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(300);
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await dismissBasket();
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count()) ? startClassic : startAlt;
        await expect(start).toBeEnabled({ timeout: 15000 });
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await waitForCompeteResult({ needScore: true });
      };
      if (!globalThis.__func01989_onResult) {
        if (!(await bodyResultReady())) await runConfigToResult();
        else await waitForCompeteResult({ needScore: true });
        globalThis.__func01989_onResult = true;
      }
      await expect(page.getByRole('heading', { name: '综合竞争力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      const taskBefore = await taskIdFromMain();
      if (!taskBefore) throw new Error('结果页未见任务 ID');
      globalThis.__func01989_taskIdBefore = taskBefore;
      const rerunBtn = main().getByRole('button', { name: '重新分析' });
      await expect(rerunBtn).toBeVisible({ timeout: 10000 });
      await rerunBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      const taskAfter = await waitForCompeteResult({ needNewTask: true, prevTask: taskBefore, needScore: true });
      if (!taskAfter) throw new Error('重分析后未解析到新任务 ID');
      globalThis.__func01989_taskIdAfter = taskAfter;
      if (taskBefore === taskAfter) throw new Error('任务 ID 未变化：' + taskBefore);
      await expect(main().getByText(taskAfter).first()).toBeVisible({ timeout: 15000 });
  - note: 2、页面出现综合竞争力最高得分
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const card = main().getByText('综合竞争力最高得分').first();
      await expect(card).toBeVisible({ timeout: 30000 });
      await page.waitForTimeout(800);
      await expect(main().getByText('综合竞争力最高得分').first()).toBeVisible({ timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id
