id: FUNC-02024
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02024
priority: P1
tier: B
title: 主流程-删除记录确定后任务从最近评估消失
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation
  - action: evaluate
    note: 最近评估→锚定任务→点「删除」→弹框「确定」；提示与列表在 expect
expect:
  - note: 1、出现「已删除」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const evalPath = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main').first();
      const rowFromAnchor = (anchor) =>
        anchor.locator('xpath=ancestor::tr[1] | ancestor::*[contains(@class,"arco-table-tr")][1]').first();
      const deleteInRow = (row) => row.getByRole('button', { name: '删除', exact: true });
      const parseTotalCount = (text) => {
        const m = text.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const pickHistoryDelete = async () => {
        for (const name of ['恢复结果', '继续查看', '按此配置新建评估', '查看 HTML 报告']) {
          const btns = main().getByRole('button', { name, exact: true });
          const n = await btns.count();
          for (let i = 0; i < n; i++) {
            const anchor = btns.nth(i);
            if (!(await anchor.isVisible().catch(() => false))) continue;
            const row = rowFromAnchor(anchor);
            const del = deleteInRow(row);
            if (!(await del.count())) continue;
            await del.scrollIntoViewIfNeeded().catch(() => {});
            if (await del.isVisible().catch(() => false)) return { del, row };
          }
        }
        const dels = main().getByRole('button', { name: '删除', exact: true });
        const dn = await dels.count();
        for (let i = 0; i < dn; i++) {
          const del = dels.nth(i);
          await del.scrollIntoViewIfNeeded().catch(() => {});
          if (await del.isVisible().catch(() => false)) return { del, row: rowFromAnchor(del) };
        }
        return null;
      };
      const tableTaskIds = async () => {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        const ids = [];
        for (let i = 0; i < n; i++) {
          const txt = await rows.nth(i).innerText().catch(() => '');
          const m = txt.match(TID_RE);
          if (m) ids.push(m[0]);
        }
        return ids;
      };
      await page.goto(toUrl(evalPath), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 15000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(main().locator('.arco-table').first()).toBeVisible({ timeout: 15000 });
      await scrollHistoryActions();
      let picked = await pickHistoryDelete();
      if (!picked) {
        await scrollHistoryActions();
        picked = await pickHistoryDelete();
      }
      const bodyText = await main().innerText().catch(() => '');
      const hasHistoryRow = TID_RE.test(bodyText)
        || (await main().getByRole('button', { name: '恢复结果' }).count()) > 0
        || (await main().getByRole('button', { name: '继续查看' }).count()) > 0;
      if (!picked) {
        if (hasHistoryRow) {
          throw new Error('最近评估有历史行但操作列无「删除」按钮（ticket=DEF-ENT-EVAL-HISTORY-DELETE-UI-001）');
        }
        throw new Error('最近评估无可删除记录');
      }
      const { del: delBtn, row } = picked;
      const rowText = (await row.count()) ? await row.innerText().catch(() => '') : bodyText;
      const tidM = rowText.match(TID_RE);
      if (!tidM) throw new Error('删除前行未见任务 ID');
      const expectedTid = tidM[0];
      const totalBefore = parseTotalCount(await main().innerText().catch(() => ''));
      const idsBefore = await tableTaskIds();
      globalThis.__func02024_tid = expectedTid;
      globalThis.__func02024_totalBefore = totalBefore;
      globalThis.__func02024_idsBeforeLen = idsBefore.length;
      await delBtn.click({ timeout: 8000 });
      const modal = page.locator('.arco-modal').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      await modal.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
      await expect(page.locator('.arco-message').filter({ hasText: '已删除' }).first()).toBeVisible({ timeout: 10000 });
      globalThis.__func02024_deleted = true;
  - note: 2、该任务不再出现在最近评估
    assert: |-
      if (!globalThis.__func02024_deleted) throw new Error('前置：未完成删除确定');
      const expectedTid = globalThis.__func02024_tid;
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main').first();
      const t0 = Date.now();
      while (Date.now() - t0 < 15000) {
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        let found = false;
        for (let i = 0; i < n; i++) {
          const txt = await rows.nth(i).innerText().catch(() => '');
          if (txt.includes(expectedTid)) { found = true; break; }
        }
        if (!found) break;
        await page.waitForTimeout(500);
      }
      await expect(main().locator('table tbody tr').filter({ hasText: expectedTid })).toHaveCount(0, { timeout: 5000 });
  - note: 3、列表总条数减少 1
    assert: |-
      if (!globalThis.__func02024_deleted) throw new Error('前置：未完成删除确定');
      const main = () => page.locator('main.diagnosis-main').first();
      const parseTotalCount = (text) => {
        const m = text.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const totalBefore = globalThis.__func02024_totalBefore;
      const idsBeforeLen = globalThis.__func02024_idsBeforeLen;
      const totalAfter = parseTotalCount(await main().innerText().catch(() => ''));
      if (totalBefore != null && totalAfter != null) {
        if (totalAfter !== totalBefore - 1) {
          throw new Error(`总条数应减 1：删除前共 ${totalBefore} 条，删除后共 ${totalAfter} 条`);
        }
        return;
      }
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const rows = main().locator('table tbody tr');
      const n = await rows.count();
      let idRows = 0;
      for (let i = 0; i < n; i++) {
        if (TID_RE.test(await rows.nth(i).innerText().catch(() => ''))) idRows++;
      }
      if (typeof idsBeforeLen === 'number' && idRows !== idsBeforeLen - 1) {
        throw new Error(`任务行数应减 1：删除前 ${idsBeforeLen} 行，删除后 ${idRows} 行`);
      }
on_fail: 截图 + 抄 X-Trace-Id
