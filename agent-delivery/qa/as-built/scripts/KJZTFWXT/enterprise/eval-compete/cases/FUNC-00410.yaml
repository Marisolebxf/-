id: FUNC-00410
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00410
priority: P0
title: 指标与权重区三维默认权重 40/40/20 且和为 100
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
tier: A
preconditions:
  - env-gate overall=pass
  - 已进入综合竞争力页
  - 系统模板为默认加载态
locators:
  metrics: 创新能力/经营能力/成长能力
  spins: '[role=spinbutton]'
  view: button「查看」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 进入综合竞争力默认模板态，浏览指标与权重区；维度/权重/调节钮在 expect
expect:
  - note: 维度为创新能力 / 经营能力 / 成长能力 3 项
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const enterCompete = async () => {
        const entryNames = ['企业综合竞争力评估', '企业竞争力分析'];
        for (const name of entryNames) {
          const link = page.getByRole('link', { name, exact: true });
          if (await link.count()) {
            await link.first().scrollIntoViewIfNeeded().catch(() => {});
            await link.first().click({ timeout: 10000 });
            await page.waitForURL(/\/enterprise(\-center)?\/evaluation/, { timeout: 15000 });
            return;
          }
        }
        const search = page.getByRole('link', { name: '企业查询', exact: true });
        if (await search.count()) {
          await search.first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
          for (const name of entryNames) {
            const link = page.getByRole('link', { name, exact: true });
            if (await link.count()) {
              await link.first().click({ timeout: 10000 });
              await page.waitForURL(/\/enterprise(\-center)?\/evaluation/, { timeout: 15000 });
              return;
            }
          }
        }
        const origin = new URL(page.url()).origin;
        await page.goto(origin + '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
      };
      await dismissBasket();
      if (!/\/enterprise(\-center)?\/evaluation/.test(page.url())) await enterCompete();
      const bodyTxt = await page.locator('body').innerText().catch(() => '');
      if (/Unexpected Application Error|404 Not Found/.test(bodyTxt)) {
        throw new Error('ENV-BLOCKED:当前环境综合竞争力工作区不可达（SPA 404）');
      }
      await expect(page.getByRole('heading', { name: /企业.*竞争力/ }).first()).toBeVisible({ timeout: 12000 });
      await dismissBasket();
      for (const n of ['创新能力', '经营能力', '成长能力']) {
        await expect(page.getByText(n, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
  - note: 默认权重为 40 / 40 / 20 且和为 100
    assert: |-
      const u = page.url();
      if (!/\/enterprise(\-center)?\/evaluation/.test(u) || !/workspace=competitiveness/.test(u)) {
        throw new Error('ENV-BLOCKED:未进入综合竞争力工作区 ' + u);
      }
      await page.getByRole('tab', { name: '当前分析' }).click({ timeout: 5000 }).catch(() => {});
      await page.waitForTimeout(500);
      const vals = [];
      for (const name of ['创新能力', '经营能力', '成长能力']) {
        const row = page.getByRole('row').filter({ hasText: name }).first();
        await expect(row).toBeVisible({ timeout: 8000 });
        const spin = row.locator('[role=spinbutton], .arco-input-number input').first();
        vals.push(String(await spin.inputValue()));
      }
      if (vals.join(',') !== '40,40,20') throw new Error('默认权重 ' + vals.join('/') + ' ≠ 40/40/20');
      const sum = vals.reduce((a, b) => a + Number(b), 0);
      if (sum !== 100) throw new Error('权重和 ' + sum);
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
  - note: 每项带权重调节钮与查看明细入口
    assert: |-
      for (const name of ['创新能力', '经营能力', '成长能力']) {
        const row = page.getByRole('row').filter({ hasText: name }).first();
        if (await row.locator('.arco-input-number-step-button').count() < 2) {
          throw new Error(name + ' 调节钮不足');
        }
        await expect(row.getByRole('button', { name: '查看' }).first()).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 分组「综合竞争力三域」；D2·全页 spin 共 4 个（含额外 0），权重按指标行取前 3 维 40/40/20；合计「权重合计：100% · 校验通过」。进页=overview 侧栏「企业竞争力分析」或 center/evaluation 深链。由 P0-09 重写为 FUNC-00410。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
