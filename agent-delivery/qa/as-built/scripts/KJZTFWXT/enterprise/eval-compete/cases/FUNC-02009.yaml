id: FUNC-02009
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02009
priority: P1
title: 失败记录点继续查看后展示失败原因
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-compete
tier: B
preconditions:
  - 最近评估中有状态为失败的记录（列表 API 或表格分页检索；无则 ticket=ENV-EVAL-COMPETE-HISTORY-FAILED-001）
locators:
  recent_tab: tab「最近评估」
  continue_btn: button「继续查看」
  fail_title: 评估失败
  retry_btn: button「重试」
  new_from_config_btn: button「按此配置新建」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 最近评估→定位状态「失败」行（非已取消）→点「继续查看」；失败页断言在 expect
expect:
  - note: 1、页面出现「评估失败」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRouteCatalog = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const evalRouteCenter = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const TID_RE = /(?:DEMO-)?EVAL-\d{8}-\d{3,}/;
      const main = () => page.locator('main.diagnosis-main, main.app-main, main').first();
      const normTid = (s) => String(s || '').replace(/^DEMO-/, '');
      const gotoCompetePage = async () => {
        if (globalThis.__func02009_evalRoute) return globalThis.__func02009_evalRoute;
        const body0 = await page.locator('body').innerText().catch(() => '');
        const alreadyOk =
          !/404|页面不存在|抱歉/.test(body0) &&
          (await page.getByText(/企业竞争力分析|企业综合竞争力评估/).first().isVisible().catch(() => false));
        if (alreadyOk) {
          globalThis.__func02009_evalRoute = /enterprise-center\/evaluation/.test(page.url()) ? evalRouteCenter : evalRouteCatalog;
          return globalThis.__func02009_evalRoute;
        }
        for (const route of [evalRouteCatalog, evalRouteCenter]) {
          await page.goto(toUrl(route), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          const body = await page.locator('body').innerText().catch(() => '');
          if (/404|页面不存在|抱歉/.test(body)) continue;
          const ok = await page.getByText(/企业竞争力分析|企业综合竞争力评估/).first().isVisible({ timeout: 15000 }).catch(() => false);
          if (ok) {
            globalThis.__func02009_evalRoute = route;
            return route;
          }
        }
        throw new Error('ENV-EDU-TTS-SVCZ-EVAL-ROUTE-001:综合竞争力工作区双路由均不可达');
      };
      const activeEvalRoute = () => globalThis.__func02009_evalRoute || evalRouteCatalog;
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const extractTid = (rowText) => {
        const m = rowText.match(TID_RE);
        return m ? m[0] : null;
      };
      const isFailedHistoryRow = (rowText) => {
        if (/已取消/.test(rowText)) return false;
        if (/恢复结果/.test(rowText)) return false;
        if (!/失败/.test(rowText)) return false;
        return /继续查看/.test(rowText);
      };
      const rowMatchesHint = (rowText, taskIdHint) => {
        if (!taskIdHint) return true;
        const short = normTid(taskIdHint);
        return rowText.includes(taskIdHint) || rowText.includes(short) || (short && rowText.includes('DEMO-' + short));
      };
      const pickFailedContinueOnPage = async (taskIdHint) => {
        await scrollHistoryActions();
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = await row.innerText().catch(() => '');
          if (taskIdHint && !rowMatchesHint(rowText, taskIdHint)) continue;
          if (!isFailedHistoryRow(rowText)) continue;
          const cont = row.getByRole('button', { name: '继续查看' }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          const tid = extractTid(rowText);
          return { btn: cont, tid: tid || taskIdHint };
        }
        return null;
      };
      const pickFailedContinue = async (taskIdHint) => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 24; guard++) {
          const hit = await pickFailedContinueOnPage(taskIdHint);
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      const fetchFailedTaskId = async () => {
        const listUrl = toUrl('/topicAsync/topic/v1/analysis/tasks/list');
        const users = ['admin', 'guest'];
        const failed = new Set(['failed', 'fail', 'error']);
        for (const user_id of users) {
          for (let pageNum = 1; pageNum <= 8; pageNum++) {
            const resp = await page.request.post(listUrl, {
              data: { user_id, analysisType: 'enterprise_eval', subType: 'competitiveness', page: pageNum, size: 50 },
            });
            if (!resp.ok()) continue;
            let json = {};
            try { json = await resp.json(); } catch { continue; }
            const data = json?.data ?? json;
            const records = data?.records ?? data?.list ?? [];
            const hit = records.find((r) => failed.has(String(r?.status || '').toLowerCase()));
            if (hit?.taskId) return String(hit.taskId);
            if (!records.length || records.length < 50) break;
          }
        }
        return null;
      };
      const openHistory = async () => {
        await gotoCompetePage();
        await closeBasket();
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(tab).toBeVisible({ timeout: 12000 });
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const rowN = await main().locator('table tbody tr').count();
        if (rowN < 1) {
          throw new Error('最近评估表无数据行（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
        }
        await expect(main().locator('table tbody tr').first()).toBeVisible({ timeout: 12000 });
      };
      const onFailPage = async () => {
        if (!/view=result/.test(page.url())) return false;
        return await main().getByText('评估失败', { exact: true }).first().isVisible().catch(() => false);
      };
      if (!globalThis.__func02009_clicked) {
        await openHistory();
        let taskHint = globalThis.__func02009_failed_tid;
        if (!taskHint) {
          taskHint = await fetchFailedTaskId();
          if (taskHint) globalThis.__func02009_failed_tid = taskHint;
        }
        let hit = await pickFailedContinue(taskHint || null);
        if (!hit && !taskHint) hit = await pickFailedContinue(null);
        if (!hit) {
          throw new Error('最近评估无状态为失败的记录（ticket=ENV-EVAL-COMPETE-HISTORY-FAILED-001）');
        }
        globalThis.__func02009_row_tid = hit.tid || taskHint;
        await hit.btn.scrollIntoViewIfNeeded().catch(() => {});
        await scrollHistoryActions();
        await hit.btn.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        globalThis.__func02009_clicked = true;
        if (!(await onFailPage()) && globalThis.__func02009_row_tid) {
          const tid = globalThis.__func02009_row_tid;
          const route = activeEvalRoute();
          await page.goto(
            toUrl(route + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)),
            { waitUntil: 'domcontentloaded' },
          );
          await page.waitForTimeout(2500);
        }
      }
      const tNav = Date.now();
      while (Date.now() - tNav < 35000 && !(await onFailPage())) {
        await page.waitForTimeout(400);
      }
      await expect(main().getByText('评估失败', { exact: true }).first()).toBeVisible({ timeout: 20000 });
      globalThis.__func02009_onFail = true;
  - note: 2、页面给出失败原因
    assert: |-
      if (!globalThis.__func02009_onFail) throw new Error('前置：失败页未就绪');
      const main = () => page.locator('main.diagnosis-main, main.app-main, main').first();
      const tx = (await main().innerText().catch(() => '')).replace(/\s+/g, ' ');
      const hasReason =
        /本次评估生成失败|本次分析失败|失败原因|任务错误|任务失败|trace-?id|Trace-Id|生成失败|错误详情|errorMsg/.test(tx) ||
        (tx.length > 80 && /评估失败/.test(tx));
      if (!hasReason) {
        throw new Error('未见失败原因文案（片段=' + tx.slice(0, 320) + '）');
      }
  - note: 3、出现「重试」与「按此配置新建」
    assert: |-
      if (!globalThis.__func02009_onFail) throw new Error('前置：失败页未就绪');
      const main = () => page.locator('main.diagnosis-main, main.app-main, main').first();
      await expect(main().getByRole('button', { name: '重试' }).first()).toBeVisible({ timeout: 10000 });
      const newBtn = main().getByRole('button', { name: /按此配置新建/ }).first();
      await expect(newBtn).toBeVisible({ timeout: 10000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  02009 验「最近评估」状态「失败」行（非已取消，与 02008 分开）点「继续查看」→ view=result「评估失败」+失败原因+「重试」「按此配置新建」。D1·edu tts/svcz 双路由 catalog /enterprise/evaluation 与 enterprise-center 回退（对齐 00413/01997/02012）；Tab 进最近评估（非 view=history 深链）。先 POST analysis/tasks/list 锚 status=failed 再表格分页；行必含「失败」+「继续查看」；继续无失败页则 task_id 深链兜底。无失败行→ENV-EVAL-COMPETE-HISTORY-FAILED-001；双路由 404→ENV-EDU-TTS-SVCZ-EVAL-ROUTE-001。D4·2026-10-21 rewrite-FUNC-02009 svcz 机跑 fail（全站深链 SPA 404 + tasks/list 无 failed，与 02012/00413 同态）。登录与关内部评审由 runner 前置。B 档零 allow_skip。
