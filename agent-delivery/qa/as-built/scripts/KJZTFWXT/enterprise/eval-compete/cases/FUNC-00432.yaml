id: FUNC-00432
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00432
priority: P1
tier: B
title: 结果态点击调整配置返回配置态
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
expect:
  - note: 1、页面返回配置态且对象区可见
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const resultReady = async () => {
        const u = page.url();
        if (/view=result/.test(u)) {
          return await page.getByRole('heading', { name: '综合竞争力评估结果' }).first().isVisible().catch(() => false)
            || await main().getByText(/综合竞争力评估结果/).first().isVisible().catch(() => false);
        }
        return false;
      };
      const reachResult = async () => {
        if (await resultReady()) return;
        const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recentTab).toBeVisible({ timeout: 15000 });
        await recentTab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const restore = page.getByRole('button', { name: '恢复结果' });
        if (await restore.first().isVisible().catch(() => false)) {
          await restore.first().click({ timeout: 10000 });
          const t0 = Date.now();
          while (Date.now() - t0 < 45000) {
            if (await resultReady()) return;
            await page.waitForTimeout(500);
          }
        }
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (!(await cta.isVisible().catch(() => false))) {
          await page.getByRole('tab', { name: '当前分析', exact: true }).click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
        }
        await expect(cta).toBeVisible({ timeout: 12000 });
        await cta.click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
        await expect(panel).toBeVisible({ timeout: 12000 });
        const sel = panel.locator('[aria-label^="选择 "]').first();
        if (!(await sel.count())) throw new Error('修订 blocked：对比篮无可选企业');
        await sel.click({ force: true });
        await page.waitForTimeout(300);
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        const start = main().getByRole('button', { name: '开始分析' });
        await expect(start).toBeEnabled({ timeout: 15000 });
        await start.click({ timeout: 8000 });
        const t1 = Date.now();
        while (Date.now() - t1 < 180000) {
          if (await resultReady()) return;
          const show = main().getByRole('button', { name: /查看评估结果/ });
          if (await show.first().isVisible().catch(() => false)) {
            await show.first().click({ timeout: 8000 });
            await page.waitForTimeout(2000);
            if (await resultReady()) return;
          }
          const body = await main().innerText().catch(() => '');
          if (/评估失败|生成失败/.test(body)) throw new Error('分析失败：' + page.url());
          await page.waitForTimeout(2000);
        }
        throw new Error('180s 内未到结果态');
      };
      await reachResult();
      const adjust = main().getByRole('button', { name: '调整配置', exact: true });
      await expect(adjust.first()).toBeVisible({ timeout: 12000 });
      await adjust.first().click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(main().getByText('评估对象').first()).toBeVisible({ timeout: 15000 });
      await expect(main().getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 12000 });
  - note: 2、URL 视图参数离开结果态
    assert: |-
      if (/view=result/.test(page.url())) throw new Error('仍停留 view=result：' + page.url());
      await expect(page).toHaveURL(/workspace=competitiveness/, { timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
