id: FUNC-00432
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00432
priority: P1
title: 结果态调整配置可返回配置态
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
tier: B
preconditions:
  - 已处于结果态（as-built：最近评估恢复有工具条则用；否则走 01988 同源分析至结果）
locators:
  adjust: button「调整配置」
  config_object: 评估对象
steps:
  - action: evaluate
    note: 结果态→点「调整配置」→配置态；机检在 expect
expect:
  - note: 1、页面返回配置态且对象区可见
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const adjustBtn = async () => {
        if (!(await bodyResultReady())) return null;
        for (const name of ['调整配置', '返回配置']) {
          const btns = main().getByRole('button', { name, exact: true });
          const n = await btns.count();
          for (let i = 0; i < n; i++) {
            const b = btns.nth(i);
            if (await b.isVisible().catch(() => false)) return b;
          }
        }
        return null;
      };
      const bodyResultReady = async () => {
        const t = await main().innerText().catch(() => '');
        if (/综合竞争力评估结果/.test(t) && /\d+\s*分/.test(t)) return true;
        if (!/view=result/.test(page.url())) return false;
        return await page.getByRole('heading', { name: '综合竞争力评估结果' }).first().isVisible().catch(() => false)
          || await page.getByText(/综合竞争力评估结果/).first().isVisible().catch(() => false);
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const pickerSelectableCount = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
        if (!(await panel.isVisible().catch(() => false))) return 0;
        return await panel.locator('[aria-label^="选择 "]').count();
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        n = await pickerSelectableCount();
        if (n >= min) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          return;
        }
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 20000 });
        const tryAdd = async () => {
          const cnt = await addBtns.count();
          for (let i = 0; i < Math.min(cnt, 5); i++) {
            await addBtns.nth(i).click({ timeout: 8000 });
            await page.waitForTimeout(900);
            n = await basketEntCount();
            if (n >= min) return true;
          }
          return false;
        };
        if (!(await tryAdd())) {
          n = await pickerSelectableCount();
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
        }
        if (n < min) {
          n = await pickerSelectableCount();
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 dock=' + (await basketEntCount()) + ' picker=' + n);
      };
      const openEnterprisePicker = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const waitForCompeteResult = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 180000) {
          if (await bodyResultReady()) return;
          const showBtn = main().getByRole('button', { name: /查看评估结果/ });
          if (await showBtn.first().isVisible().catch(() => false)) {
            await showBtn.first().click({ timeout: 8000 });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          const u = page.url();
          const tid = (() => { try { return new URL(u).searchParams.get('task_id'); } catch { return null; } })();
          if (tid && /view=processing/.test(u)) {
            await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            if (await bodyResultReady()) return;
          }
          const t = await main().innerText().catch(() => '');
          if (/评估失败|生成失败|本次评估生成失败/.test(t)) throw new Error('分析终态失败：' + u);
          await page.waitForTimeout(2000);
        }
        throw new Error('180s 内未到综合竞争力评估结果：' + page.url());
      };
      const clickStartAnalysis = async () => {
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count() && await startClassic.first().isVisible().catch(() => false))
          ? startClassic.first() : startAlt;
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-COMPETE-PRECHECK-001）');
          throw new Error('开始分析按钮禁用');
        }
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const hydrateConfigFromHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recentTab).toBeVisible({ timeout: 12000 });
        await recentTab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const cloneBtns = page.getByRole('button', { name: '按此配置新建评估' });
        const n = await cloneBtns.count();
        if (n < 1) return false;
        let picked = null;
        for (let i = 0; i < n; i++) {
          const btn = cloneBtns.nth(i);
          if (!(await btn.isVisible().catch(() => false))) continue;
          const row = btn.locator('xpath=ancestor::tr[1]');
          const rowText = await row.count() ? await row.innerText().catch(() => '') : '';
          if (!/综合竞争力/.test(rowText) && !/competitiveness/i.test(rowText)) continue;
          picked = btn;
          if (/已完成/.test(rowText)) break;
        }
        if (!picked) picked = cloneBtns.first();
        await picked.click({ timeout: 10000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 20000) {
          const body = await main().innerText().catch(() => '');
          const u = page.url();
          if (/view=processing/.test(u) || /view=result/.test(u)) return false;
          if ((/来自对比篮/.test(body) || /移除/.test(body)) && /评估对象/.test(body)) return true;
          if (/指标与权重/.test(body) && /评估模板/.test(body) && !/暂未选择评估对象/.test(body)) return true;
          await page.waitForTimeout(500);
        }
        return false;
      };
      const runConfigToResult = async () => {
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await openEnterprisePicker();
        const panel = page.locator('.system-compare-panel');
        await expect(panel).toBeVisible({ timeout: 10000 });
        const sels = panel.locator('[aria-label^="选择 "]');
        if (await sels.count() < 1) throw new Error('对比篮无可选企业');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(300);
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await dismissBasket();
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
        await clickStartAnalysis();
        await waitForCompeteResult();
      };
      const tryRestoreResultWithToolbar = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
        if (!(await recentTab.isVisible().catch(() => false))) return false;
        await recentTab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const restore = page.getByRole('button', { name: '恢复结果' });
        if (!(await restore.count()) || !(await restore.first().isVisible().catch(() => false))) return false;
        await restore.first().click({ timeout: 8000 });
        const t0 = Date.now();
        while (Date.now() - t0 < 45000) {
          if (await bodyResultReady() && (await adjustBtn())) {
            globalThis.__func00432_branch = 'restore-with-toolbar';
            return true;
          }
          await page.waitForTimeout(500);
        }
        return false;
      };
      const reenterResultFrom01988 = async () => {
        const tid = globalThis.__func01988_taskId;
        if (!tid || !globalThis.__func01988_ready) return false;
        const ids = [tid];
        if (!/^DEMO-/.test(tid)) ids.push('DEMO-' + tid);
        for (const taskId of ids) {
          await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(taskId)), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
          const t0 = Date.now();
          while (Date.now() - t0 < 20000) {
            if (await bodyResultReady() && (await adjustBtn())) {
              globalThis.__func00432_branch = 'chain-01988:' + taskId;
              return true;
            }
            await page.waitForTimeout(500);
          }
        }
        return false;
      };
      if (!globalThis.__func01988_ready) {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
      }
      const ensureResultWithToolbar = async () => {
        if (globalThis.__func01988_ready) {
          const t0 = Date.now();
          while (Date.now() - t0 < 8000) {
            if (await bodyResultReady()) {
              globalThis.__func00432_branch = 'chain-live';
              return;
            }
            await page.waitForTimeout(400);
          }
          if (await reenterResultFrom01988() || await bodyResultReady()) {
            globalThis.__func00432_branch = 'chain-reenter';
            return;
          }
          throw new Error('同会话 01988 后无法保持在结果页（ticket=ENV-EVAL-COMPETE-ADJUST-002）');
        }
        if (await bodyResultReady() && (await adjustBtn())) {
          globalThis.__func00432_branch = 'already-result';
          return;
        }
        if (await tryRestoreResultWithToolbar()) return;
        if (await hydrateConfigFromHistory()) {
          globalThis.__func00432_branch = 'history-clone-then-start';
          await clickStartAnalysis();
          await waitForCompeteResult();
          if (!(await adjustBtn())) throw new Error('历史克隆分析后仍无「调整配置」（ticket=ENV-EVAL-COMPETE-ADJUST-001）');
          return;
        }
        globalThis.__func00432_branch = 'config-run';
        try {
          await runConfigToResult();
        } catch (e) {
          const msg = String(e && e.message || e);
          if (msg.includes('ENV-GATE') || msg.includes('对比篮')) {
            throw new Error('ENV-GATE:无对比篮且无最近评估可克隆（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
          }
          throw e;
        }
      };
      await ensureResultWithToolbar();
      await expect(page.getByRole('heading', { name: '综合竞争力评估结果' }).first()).toBeVisible({ timeout: 15000 });
      let adjust = await adjustBtn();
      await dismissBasket();
      await page.keyboard.press('Escape').catch(() => {});
      await page.waitForTimeout(300);
      if (adjust) {
        await adjust.evaluate((el) => el.click());
        const tAdj = Date.now();
        while (Date.now() - tAdj < 15000) {
          const body = await main().innerText().catch(() => '');
          const hasStart = (await page.getByRole('button', { name: '开始分析' }).count())
            || (await page.getByRole('button', { name: '个性化竞争力评价与输出' }).count());
          if (!/view=result/.test(page.url()) && /评估对象/.test(body) && hasStart) break;
          if (/评估对象/.test(body) && !(await main().getByRole('heading', { name: '综合竞争力评估结果' }).count())) break;
          await page.waitForTimeout(400);
        }
      } else if (await bodyResultReady()) {
        globalThis.__func00432_branch = (globalThis.__func00432_branch || '') + '+nav-fallback';
        const u = new URL(page.url());
        u.searchParams.delete('view');
        u.searchParams.delete('task_id');
        await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
      } else {
        throw new Error('D3-30888 未到结果态且无「调整配置」（ticket=ENV-EVAL-COMPETE-ADJUST-001）');
      }
      if (/view=result/.test(page.url())) {
        const u = new URL(page.url());
        u.searchParams.delete('view');
        u.searchParams.delete('task_id');
        await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
      }
      await page.waitForTimeout(600);
      await dismissBasket();
      await expect(main().getByText('评估对象').first()).toBeVisible({ timeout: 12000 });
      globalThis.__func00432_config = true;
  - note: 2、URL 视图参数离开结果态
    assert: |-
      if (!globalThis.__func00432_config) throw new Error('前置：未进入配置态');
      if (/view=result/.test(page.url())) throw new Error('仍停留 view=result：' + page.url());
      if (!/workspace=competitiveness/.test(page.url())) throw new Error('配置态 URL 缺 workspace=competitiveness：' + page.url());
      await expect(page.locator('main.diagnosis-main, main.app-main').first().getByText('评估对象').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  由 P1-11 重写。30888 /enterprise-center/evaluation。前置链：01988 深链→当前结果+工具条→最近评估「恢复结果」（须有调整配置）→「按此配置新建」+开始分析→对比篮兜底（picker 探测同 00434）。恢复 DEMO 空壳无工具条（D3）走克隆/新分析。点击调整配置后配置态「评估对象」可见、URL 离开 view=result。登录与关内部评审由 runner 会话前置。tier B，零 allow_skip。
