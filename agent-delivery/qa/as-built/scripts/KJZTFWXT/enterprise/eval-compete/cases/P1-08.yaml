id: P1-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00429
priority: P1
title: 移除对象条目后对象区与门控状态正确
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-compete
preconditions:
- 对象区已回填至少 1 家企业
expect:
- note: 该企业从对象区移除
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(600); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500) }; const before = await page.getByText(/来自对比篮 ·/).innerText().catch(()=> ''); const rm = page.locator('main [aria-label="移除"], [aria-label="移除"]').first(); if (!(await rm.count())) throw new Error('对象区无移除按钮'); await rm.click(); await page.waitForTimeout(800); const after = await page.getByText(/来自对比篮 ·/).innerText().catch(()=> ''); if (before && after && before === after) throw new Error('移除后家数文案未变')
- note: 移除不回写对比篮
  assert: |-
    await page.getByRole('button', { name: /返回对比篮调整对象|前往对比篮选择企业/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 }); /* 篮内企业仍在，observed */
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无法回填对象时记 Pass-N/A
tier: B
