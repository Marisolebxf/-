id: FUNC-02008
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02008
priority: P1
tier: B
title: 已取消行继续查看进入评估失败说明
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation
  - action: evaluate
    note: 最近评估→已取消行点继续查看（无则 list API 或自造取消后再点）；失败页断言在 expect
expect:
  - note: 1、页面出现「评估失败」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const histRoute = evalRoute + '&view=history';
      const TID_RE = /(?:DEMO-)?EVAL-\d{8}-\d{3,}/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const fetchCancelledTaskId = async () => {
        const listUrl = toUrl('/topicAsync/topic/v1/analysis/tasks/list');
        const users = ['admin', 'guest'];
        const cancelled = new Set(['cancelled', 'canceled', 'cancel', '已取消']);
        for (const user_id of users) {
          for (let pageNum = 1; pageNum <= 8; pageNum++) {
            const resp = await page.request.post(listUrl, {
              data: { user_id, analysisType: 'enterprise_eval', subType: 'competitiveness', page: pageNum, size: 50 },
            });
            if (!resp.ok()) continue;
            let json = {};
            try { json = await resp.json(); } catch { continue; }
            const data = json?.data ?? json;
            const records = data?.records ?? data?.list ?? [];
            const hit = records.find((r) => cancelled.has(String(r?.status || '').toLowerCase()) || /取消/.test(String(r?.status || '')));
            if (hit?.taskId) return String(hit.taskId);
            if (!records.length || records.length < 50) break;
          }
        }
        return null;
      };
      const pickCancelledContinueOnPage = async (taskIdHint) => {
        await scrollHistoryActions();
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = await row.innerText().catch(() => '');
          if (taskIdHint) {
            const short = taskIdHint.replace(/^DEMO-/, '');
            if (!rowText.includes(taskIdHint) && !rowText.includes(short)) continue;
          } else if (!/已取消/.test(rowText)) continue;
          const cont = row.getByRole('button', { name: '继续查看' }).first();
          if (!(await cont.count()) || !(await cont.isVisible().catch(() => false))) continue;
          return cont;
        }
        return null;
      };
      const pickCancelledContinue = async (taskIdHint) => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 12; guard++) {
          const btn = await pickCancelledContinueOnPage(taskIdHint);
          if (btn) return btn;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      const openHistory = async () => {
        await page.goto(toUrl(histRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        if (!/view=history/.test(page.url())) {
          const tab = page.getByRole('tab', { name: '最近评估', exact: true });
          await expect(tab).toBeVisible({ timeout: 10000 });
          await tab.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        }
        await expect(main().getByRole('button', { name: '新建评估', exact: true }).first()).toBeVisible({ timeout: 12000 });
      };
      const bootstrapCancelledRow = async () => {
        const dismissBasket = async () => {
          const close = page.locator('button[aria-label="关闭对比篮"]');
          if (await close.count() && await close.first().isVisible().catch(() => false)) {
            await close.first().click({ timeout: 2000 }).catch(() => {});
            await page.waitForTimeout(400);
          }
        };
        const basketEntCount = async () => {
          const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
          if (!(await dockBtn.count())) return 0;
          const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
          const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
          return entM ? parseInt(entM[1], 10) : 0;
        };
        const pickerSelectableCount = async () => {
          const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
          await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
          const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
          if (!(await panel.isVisible().catch(() => false))) return 0;
          return await panel.locator('[aria-label^="选择 "]').count();
        };
        const ensureBasketEnterprises = async (min) => {
          let n = await basketEntCount();
          if (n >= min) return;
          n = await pickerSelectableCount();
          if (n >= min) {
            await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
            return;
          }
          await page.goto(toUrl('/enterprise/enterprise-search'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
          await dismissBasket();
          const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
          await expect(addBtns.first()).toBeVisible({ timeout: 20000 });
          for (let i = 0; i < Math.min(await addBtns.count(), 5); i++) {
            await addBtns.nth(i).click({ timeout: 8000 });
            await page.waitForTimeout(900);
            n = await basketEntCount();
            if (n >= min) return;
          }
          if (n < min) {
            n = await pickerSelectableCount();
            await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
          }
          if (n < min) throw new Error('ENV-GATE:对比篮企业不足（ticket=ENV-EVAL-COMPETE-SELECT-OBJECTS-001）');
        };
        const openEnterprisePicker = async () => {
          const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
          const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
          if (await cta.isVisible().catch(() => false)) {
            await cta.click({ timeout: 8000 });
            await page.waitForTimeout(1200);
            return;
          }
          await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
        };
        const clickCancelAsap = async () => {
          const cancelClicked = await page.evaluate(() => {
            return new Promise((resolve) => {
              const failedUi = () => {
                const t = document.body.innerText || '';
                return /评估失败|本次评估生成失败/.test(t) && /按此配置新建/.test(t);
              };
              const tryClick = () => {
                if (failedUi()) { resolve('failed'); return true; }
                const btn = Array.from(document.querySelectorAll('button')).find((b) => /取消任务/.test((b.textContent || '').trim()));
                if (btn) { btn.click(); resolve('ok'); return true; }
                return false;
              };
              if (tryClick()) return;
              const deadline = Date.now() + 20000;
              const obs = new MutationObserver(() => { tryClick(); });
              obs.observe(document.body, { childList: true, subtree: true });
              const tick = setInterval(() => {
                if (tryClick()) { clearInterval(tick); obs.disconnect(); }
                else if (Date.now() > deadline) { clearInterval(tick); obs.disconnect(); resolve('timeout'); }
              }, 40);
            });
          });
          if (cancelClicked === 'failed') throw new Error('D3:Demo 任务秒失败未见取消任务（ticket=ENV-EVAL-COMPETE-PROC-001）');
          if (cancelClicked === 'timeout') throw new Error('20s 内未点到取消任务（ticket=ENV-EVAL-COMPETE-PROC-001）');
          await page.waitForTimeout(1500);
        };
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        if (!(/enterprise_codes/.test(page.url()) && await main().getByText(/来自对比篮/).first().isVisible().catch(() => false))) {
          await openEnterprisePicker();
          const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
          await expect(panel).toBeVisible({ timeout: 10000 });
          const sels = panel.locator('[aria-label^="选择 "]');
          if (await sels.count() < 1) throw new Error('对比篮无可选企业');
          await sels.nth(0).click({ force: true });
          await page.waitForTimeout(300);
          await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          await dismissBasket();
          await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
        }
        const start = main().getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) throw new Error('对象已回填但开始分析仍禁用');
        const cancelWait = clickCancelAsap();
        await start.click({ timeout: 8000 });
        await cancelWait;
      };
      if (!globalThis.__func02008_clicked) {
        await openHistory();
        let taskHint = globalThis.__func02008_row_tid || (await fetchCancelledTaskId());
        if (taskHint) globalThis.__func02008_row_tid = taskHint;
        let continueBtn = await pickCancelledContinue(taskHint || null);
        if (!continueBtn && !taskHint) continueBtn = await pickCancelledContinue(null);
        if (!continueBtn) {
          try {
            await bootstrapCancelledRow();
            await openHistory();
            taskHint = await fetchCancelledTaskId();
            if (taskHint) globalThis.__func02008_row_tid = taskHint;
            continueBtn = await pickCancelledContinue(taskHint || null);
            if (!continueBtn) continueBtn = await pickCancelledContinue(null);
          } catch (e) {
            const msg = String(e.message || e);
            if (/PROC-001|SELECT-OBJECTS-001/.test(msg)) throw e;
            throw new Error('自造已取消记录失败：' + msg.slice(0, 180));
          }
        }
        if (!continueBtn) {
          throw new Error('最近评估无状态为已取消的记录（ticket=ENV-EVAL-COMPETE-HISTORY-CANCELLED-001）');
        }
        await continueBtn.scrollIntoViewIfNeeded().catch(() => {});
        await scrollHistoryActions();
        await continueBtn.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        globalThis.__func02008_clicked = true;
      }
      const tNav = Date.now();
      while (Date.now() - tNav < 30000 && !/view=result|view=processing/.test(page.url())) {
        await page.waitForTimeout(400);
      }
      await expect(main().getByText('评估失败', { exact: true }).first()).toBeVisible({ timeout: 20000 });
  - note: 2、出现「重试」与「按此配置新建」
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      await expect(main().getByRole('button', { name: '重试' }).first()).toBeVisible({ timeout: 10000 });
      const newBtn = main().getByRole('button', { name: /按此配置新建/ }).first();
      await expect(newBtn).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
