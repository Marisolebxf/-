id: FUNC-02014
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02014
priority: P0
title: 最近评估已完成行打开只读 HTML 报告
story: US-ENT-EVAL-RESULT
entry_id: ent-eval-compete
tier: B
preconditions:
  - 最近评估中有报告份数大于 0 的已完成记录
locators:
  hist_tab: Tab「最近评估」
  html_report_btn: button「查看 HTML 报告」
  report_eyebrow: 企业评估 · 只读报告
  report_back: 返回评估结果
  report_export: 导出
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 最近评估已完成行点「查看 HTML 报告」；导航与判定在 expect
expect:
  - note: 1、进入只读 HTML 报告（view=report；页眉「企业评估 · 只读报告」）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const reportRoot = () => page.locator('[data-report-readonly="true"]').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
          await closeB.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const reportReady = async () => {
        if (!/view=report/.test(page.url())) return false;
        const eyebrow = page.getByText(/企业评估\s*[·・]\s*只读报告/).first();
        if (await eyebrow.isVisible().catch(() => false)) return true;
        if (await reportRoot().isVisible().catch(() => false)) return true;
        return false;
      };
      const waitReport = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await reportReady()) return true;
          await page.waitForTimeout(400);
        }
        return await reportReady();
      };
      const clickHistoryHtmlReport = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const histTab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(histTab).toBeVisible({ timeout: 12000 });
        await histTab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const table = main().locator('.arco-table').first();
        await expect(table).toBeVisible({ timeout: 10000 });
        const rows = table.locator('tbody tr');
        const rowCount = await rows.count();
        for (let i = 0; i < rowCount; i++) {
          const row = rows.nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          if (!/\d+\s*份/.test(rowText) || /0\s*份/.test(rowText)) continue;
          const htmlBtn = row.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
          if (!(await htmlBtn.count()) || !(await htmlBtn.isVisible().catch(() => false))) continue;
          if (!(await htmlBtn.isEnabled().catch(() => false))) continue;
          await htmlBtn.scrollIntoViewIfNeeded().catch(() => {});
          await htmlBtn.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          const tNav = Date.now();
          while (Date.now() - tNav < 25000 && !/view=report/.test(page.url())) {
            await page.waitForTimeout(400);
          }
          if (await waitReport(45000)) {
            globalThis.__func02014_opened = true;
            return;
          }
        }
        const attrBtn = main().locator('[data-eval-history-open-html-report]:not(.arco-btn-disabled)').first();
        if (await attrBtn.count() && await attrBtn.isVisible().catch(() => false) && await attrBtn.isEnabled().catch(() => false)) {
          await attrBtn.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          if (await waitReport(45000)) {
            globalThis.__func02014_opened = true;
            return;
          }
        }
        throw new Error('ENV-GATE:最近评估无「已完成且报告份数>0」可点「查看 HTML 报告」的行');
      };
      await clickHistoryHtmlReport();
      await expect(page).toHaveURL(/view=report/, { timeout: 10000 });
      await expect(page.getByText(/企业评估\s*[·・]\s*只读报告/).first()).toBeVisible({ timeout: 15000 });
  - note: 2、页上有「返回评估结果」与「导出」
    assert: |-
      if (!globalThis.__func02014_opened) throw new Error('前置：只读报告未从历史行打开');
      const back = page.getByRole('button', { name: '返回评估结果' }).first();
      await expect(back).toBeVisible({ timeout: 10000 });
      const exportBtn = page.getByRole('button', { name: /^导出$/ }).first();
      if (!(await exportBtn.isVisible().catch(() => false))) {
        const alt = page.locator('main button').filter({ hasText: /^导出$/ }).first();
        await expect(alt).toBeVisible({ timeout: 8000 });
      } else {
        await expect(exportBtn).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  02014 主流程-历史查看报告：最近评估 Tab 内「已完成」且报告列非 0 份的行点「查看 HTML 报告」→ view=report 只读页。断言页眉「企业评估·只读报告」及「返回评估结果」「导出」。30888 路由 /enterprise-center/evaluation；无合格历史行抛 ENV-GATE（D4）。登录与关内部评审由 runner 会话前置。tier B，零 allow_skip。
