id: FUNC-02007
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02007
priority: P1
tier: B
title: 已完成记录的恢复结果打开该次结果
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
expect:
  - note: 1、进入综合竞争力评估结果
    assert: |-
      const main = page.locator('main.diagnosis-main');
      await page.getByRole('tab', { name: '最近评估' }).click();
      await main.getByRole('columnheader', { name: '任务 ID' }).waitFor({ state: 'visible', timeout: 15000 });
      let row = main
        .locator('tr')
        .filter({ hasText: '已完成' })
        .filter({ hasText: '综合竞争力' })
        .filter({ has: main.getByRole('button', { name: '恢复结果' }) })
        .first();
      if ((await row.count()) === 0) {
        await page.getByRole('tab', { name: '当前分析' }).click();
        await main.getByRole('button', { name: '前往对比篮选择企业' }).click();
        const panel = page.locator('.arco-modal, .arco-drawer').filter({ hasText: '选择分析企业' }).first();
        await panel.waitFor({ state: 'visible', timeout: 15000 });
        await panel.getByRole('checkbox').first().check();
        await panel.getByRole('button', { name: '确定' }).click();
        await main.getByRole('button', { name: '开始分析' }).click();
        await main.getByText('综合竞争力评估结果').waitFor({ state: 'visible', timeout: 180000 });
        await page.getByRole('tab', { name: '最近评估' }).click();
        await main.getByRole('columnheader', { name: '任务 ID' }).waitFor({ state: 'visible', timeout: 15000 });
        row = main
          .locator('tr')
          .filter({ hasText: '已完成' })
          .filter({ hasText: '综合竞争力' })
          .filter({ has: main.getByRole('button', { name: '恢复结果' }) })
          .first();
      }
      const rowText = await row.innerText();
      const tidMatch = rowText.match(/EVAL-\d{8}-\d+/);
      if (!tidMatch) throw new Error('最近评估已完成行未捕获任务 ID');
      await page.evaluate((t) => sessionStorage.setItem('qaRowTid', t), tidMatch[0]);
      await row.getByRole('button', { name: '恢复结果' }).click();
      await expect(main.getByText('综合竞争力评估结果')).toBeVisible({ timeout: 30000 });
  - note: 2、结果任务 ID 与该行任务 ID 一致
    assert: |-
      const main = page.locator('main.diagnosis-main');
      const rowTid = await page.evaluate(() => sessionStorage.getItem('qaRowTid'));
      const pageText = await main.innerText();
      const pageMatch = pageText.match(/EVAL-\d{8}-\d+/);
      if (!pageMatch) throw new Error('结果页未找到任务 ID');
      await expect(pageMatch[0]).toBe(rowTid);
on_fail: 截图 + 抄 X-Trace-Id
