id: FUNC-02007
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02007
priority: P0
title: 已完成记录点恢复结果打开该次结果
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-compete
tier: B
preconditions:
  - 最近评估中有状态为已完成的综合竞争力记录（列表 API 或表格分页检索；无则 ticket=ENV-EVAL-COMPETE-HISTORY-COMPLETED-001）
locators:
  recent_tab: tab「最近评估」
  restore_btn: button「恢复结果」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 最近评估→定位「已完成」行→点「恢复结果」；结果页与任务 ID 互证在 expect
expect:
  - note: 1、进入综合竞争力评估结果
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const histRoute = evalRoute + '&view=history';
      const TID_RE = /(?:DEMO-)?EVAL-\d{8}-\d{3,}/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const extractTid = (rowText) => {
        const m = rowText.match(TID_RE);
        return m ? m[0] : null;
      };
      const isCompletedRestoreRow = (rowText) => /已完成/.test(rowText) && /恢复结果/.test(rowText);
      const pickCompletedRestoreOnPage = async (taskIdHint) => {
        await scrollHistoryActions();
        const rows = main().locator('table tbody tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const rowText = await row.innerText().catch(() => '');
          if (taskIdHint && !rowText.includes(taskIdHint.replace(/^DEMO-/, '')) && !rowText.includes(taskIdHint)) continue;
          if (!taskIdHint && !isCompletedRestoreRow(rowText)) continue;
          if (taskIdHint && !/恢复结果/.test(rowText)) continue;
          const restore = row.getByRole('button', { name: '恢复结果' }).first();
          if (!(await restore.count()) || !(await restore.isVisible().catch(() => false))) continue;
          const tid = extractTid(rowText);
          if (!tid) continue;
          return { restore, tid };
        }
        return null;
      };
      const pickCompletedRestore = async (taskIdHint) => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 24; guard++) {
          const hit = await pickCompletedRestoreOnPage(taskIdHint);
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      const fetchSuccessTaskId = async () => {
        const listUrl = toUrl('/topicAsync/topic/v1/analysis/tasks/list');
        const users = ['admin', 'guest'];
        const ok = new Set(['success', 'completed', 'succeeded', 'done']);
        for (const user_id of users) {
          for (let pageNum = 1; pageNum <= 8; pageNum++) {
            const resp = await page.request.post(listUrl, {
              data: { user_id, analysisType: 'enterprise_eval', subType: 'competitiveness', page: pageNum, size: 50 },
            });
            if (!resp.ok()) continue;
            let json = {};
            try { json = await resp.json(); } catch { continue; }
            const data = json?.data ?? json;
            const records = data?.records ?? data?.list ?? [];
            const hit = records.find((r) => ok.has(String(r?.status || '').toLowerCase()));
            if (hit?.taskId) return String(hit.taskId);
            if (!records.length || records.length < 50) break;
          }
        }
        return null;
      };
      const showRecentTable = async () => {
        await closeBasket();
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(tab).toBeVisible({ timeout: 12000 });
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        return await main().locator('table tbody tr').count();
      };
      const openHistory = async () => {
        if (!/evaluation/.test(page.url())) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
        }
        let rowN = await showRecentTable();
        if (rowN < 1) {
          await page.goto(toUrl(histRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          rowN = await showRecentTable();
        }
        if (rowN < 1) {
          throw new Error('最近评估表无数据行（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
        }
        await expect(main().locator('table tbody tr').first()).toBeVisible({ timeout: 12000 });
      };
      const onResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return /综合竞争力评估结果/.test(t);
      };
      if (!globalThis.__func02007_clicked) {
        await openHistory();
        let taskHint = globalThis.__func02007_row_tid;
        if (!taskHint) {
          taskHint = await fetchSuccessTaskId();
          if (taskHint) globalThis.__func02007_row_tid = taskHint;
        }
        let hit = await pickCompletedRestore(taskHint || null);
        if (!hit && !taskHint) hit = await pickCompletedRestore(null);
        if (!hit) {
          throw new Error('最近评估无状态为已完成的可恢复记录（ticket=ENV-EVAL-COMPETE-HISTORY-COMPLETED-001）');
        }
        globalThis.__func02007_row_tid = hit.tid;
        await hit.restore.scrollIntoViewIfNeeded().catch(() => {});
        await scrollHistoryActions();
        await hit.restore.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        globalThis.__func02007_clicked = true;
        if (!(await onResult())) {
          await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(hit.tid)), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
        }
      }
      const tNav = Date.now();
      while (Date.now() - tNav < 45000 && !(await onResult())) {
        const showBtn = main().getByRole('button', { name: /查看评估结果/ });
        if (await showBtn.first().isVisible().catch(() => false)) {
          await showBtn.first().click({ timeout: 8000 });
          await page.waitForTimeout(2000);
        }
        await page.waitForTimeout(400);
      }
      await expect(page).toHaveURL(/view=result/, { timeout: 5000 });
      await expect(page.getByText(/综合竞争力评估结果/).first()).toBeVisible({ timeout: 20000 });
      globalThis.__func02007_onResult = true;
  - note: 2、结果任务 ID 与该行任务 ID 一致
    assert: |-
      if (!globalThis.__func02007_onResult) throw new Error('前置：结果页未就绪');
      const rowTid = globalThis.__func02007_row_tid;
      if (!rowTid) throw new Error('前置：未见历史行任务 ID');
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const norm = (s) => String(s || '').replace(/^DEMO-/, '');
      const rowShort = norm(rowTid);
      let resultTid = null;
      try {
        const sp = new URL(page.url()).searchParams.get('task_id');
        if (sp) resultTid = sp;
      } catch {}
      if (!resultTid) {
        const t = await main().innerText().catch(() => '');
        const tm = t.match(/任务\s*ID[：:]\s*((?:DEMO-)?EVAL-\d{8}-\d{3,})/);
        if (tm) resultTid = tm[1];
        if (!tm) {
          const tm2 = t.match(/((?:DEMO-)?EVAL-\d{8}-\d{3,})/);
          if (tm2) resultTid = tm2[0];
        }
      }
      if (!resultTid) throw new Error('结果页未见任务 ID');
      if (norm(resultTid) !== rowShort) {
        throw new Error('任务 ID 不一致：行=' + rowTid + ' 结果=' + resultTid);
      }
      await expect(main().getByText(new RegExp(rowShort.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))).first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/evaluation + workspace=competitiveness&mode=competitiveness（禁止 enterprise-center 404）。步骤=最近评估「已完成」行点「恢复结果」（非继续查看；已取消/失败见 02008/02009）。机检=view=result+「综合竞争力评估结果」+ URL/摘要 task_id 与行内 EVAL 互证（DEMO- 前缀展示差异按 norm）；点恢复无结果则 task_id 深链兜底。先 POST analysis/tasks/list 锚 success 再表格分页；无已完成可恢复→ENV-EVAL-COMPETE-HISTORY-COMPLETED-001。D4·2026-10-20 rewrite-FUNC-02007 svcz 机跑 fail·ENV-EVAL-COMPETE-HISTORY-COMPLETED-001（admin 最近评估 Tab 无「恢复结果」/已完成行，实勘同目录 scout/rewrite-FUNC-02007-probe-catalog）。登录与关评审由 runner 前置。P0 tier B，零 allow_skip。
