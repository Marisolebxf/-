id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00404
priority: P0
title: 同壳技术力与商业力 mode 隔离且配置不串扰
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
preconditions:
- 对比篮已加入企业
- 本条只验隔离反向，不展开兄弟功能正向用例
steps:
- action: goto
  target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
- action: evaluate
  note: 分别打开 technology / business 路由核 mode；回综合竞争力页核模板不串
expect:
- note: 两者分别进入各自工作台且地址含各自 mode 值
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=technology&mode=technology', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); await expect(page).toHaveURL(/mode=technology/); await expect(page.getByRole('heading', { name: /技术力/ })).toBeVisible({ timeout: 8000 }); await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=business&mode=business', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); await expect(page).toHaveURL(/mode=business/); await expect(page.getByRole('heading', { name: /商业力/ })).toBeVisible({ timeout: 8000 })
- note: 综合竞争力页与两工作台配置互不串扰
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); await expect(page).toHaveURL(/mode=competitiveness/); await expect(page.getByRole('heading', { name: '企业综合竞争力评估' })).toBeVisible({ timeout: 8000 }); await expect(page.locator('.arco-select-view').filter({ hasText: /综合竞争力标准模板/ }).first()).toBeVisible({ timeout: 8000 }); const tech = await page.getByText('技术力标准模板').count(); const biz = await page.getByText('商业力标准模板').count(); if (tech || biz) throw new Error('综合竞争力页串入兄弟模板文案')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 仅验 mode 隔离与本页不串模板；技术力/商业力正向各自册承载。对象/权重组态细核 observed。
tier: B
