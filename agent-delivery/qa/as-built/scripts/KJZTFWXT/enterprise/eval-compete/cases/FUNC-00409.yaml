id: FUNC-00409
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00409
priority: P0
title: 评估模板区呈现系统/我的/当次自定义三组
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-compete
tier: A
preconditions:
  - 已进入综合竞争力评估页
locators:
  template_select: .arco-select-view 含系统综合竞争力模板或标准模板
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 进入综合竞争力页后打开评估模板下拉，三组构成在 expect
expect:
  - note: 模板区分组为系统模板 / 我的模板 / 当次自定义配置三类
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const enterCompete = async () => {
        const entryNames = ['企业综合竞争力评估', '企业竞争力分析'];
        for (const name of entryNames) {
          const link = page.getByRole('link', { name, exact: true });
          if (await link.count()) {
            await link.first().scrollIntoViewIfNeeded().catch(() => {});
            await link.first().click({ timeout: 10000 });
            await page.waitForURL(/\/enterprise(\-center)?\/evaluation/, { timeout: 15000 });
            return;
          }
        }
        const search = page.getByRole('link', { name: '企业查询', exact: true });
        if (await search.count()) {
          await search.first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
          for (const name of entryNames) {
            const link = page.getByRole('link', { name, exact: true });
            if (await link.count()) {
              await link.first().click({ timeout: 10000 });
              await page.waitForURL(/\/enterprise(\-center)?\/evaluation/, { timeout: 15000 });
              return;
            }
          }
        }
        const origin = new URL(page.url()).origin;
        await page.goto(origin + '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
      };
      await dismissBasket();
      if (!/\/enterprise(\-center)?\/evaluation/.test(page.url())) await enterCompete();
      const bodyTxt = await page.locator('body').innerText().catch(() => '');
      if (/Unexpected Application Error|404 Not Found/.test(bodyTxt)) {
        throw new Error('ENV-BLOCKED:当前环境综合竞争力工作区不可达（SPA 404）');
      }
      await expect(page.getByRole('heading', { name: /企业.*竞争力/ }).first()).toBeVisible({ timeout: 12000 });
      await dismissBasket();
      const trg = page.locator('.arco-select-view').filter({ hasText: /综合竞争力|标准模板|未保存|系统综合/ }).first();
      await trg.click({ timeout: 10000 });
      await page.waitForTimeout(700);
      const pop = page.locator('.arco-select-popup').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const txt = await pop.innerText();
      for (const g of ['系统模板', '当次自定义配置']) {
        if (!txt.includes(g)) throw new Error('模板分组缺失: ' + g + ' / 实见 ' + txt.slice(0, 240));
      }
      if (!txt.includes('我的模板')) {
        throw new Error('ENV-BLOCKED:30888 评估模板下拉缺少「我的模板」分组（实见仅系统模板与当次自定义配置）');
      }
  - note: 系统模板名为「综合竞争力标准模板」（D1·30888 现场可为「系统综合竞争力模板 v1.0」）
    assert: |-
      const pop = page.locator('.arco-select-popup').last();
      const txt = await pop.innerText();
      if (!/综合竞争力标准模板|系统综合竞争力模板 v1\.0/.test(txt)) {
        throw new Error('系统模板名不符: ' + txt.slice(0, 200));
      }
  - note: 我的模板数量随账号历史增减（初始账号为 0；分组标题可带计数）
    assert: |-
      const pop = page.locator('.arco-select-popup').last();
      await expect(pop.getByText(/我的模板/).first()).toBeVisible({ timeout: 8000 });
  - note: 当次自定义配置初始为「当前未保存配置」
    assert: |-
      const pop = page.locator('.arco-select-popup').last();
      await expect(pop.getByText('当前未保存配置').first()).toBeVisible({ timeout: 8000 });
      await page.keyboard.press('Escape');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 下拉用 .arco-select-popup（非 .arco-trigger-popup）；系统模板现场「系统综合竞争力模板 v1.0」（50892/用例册「综合竞争力标准模板」）。2026-10-19 机勘：下拉含系统模板/当次自定义/当前未保存配置，缺「我的模板」分组→环境未齐三态。进页=overview 侧栏「企业竞争力分析」或 center/evaluation 深链。由 P0-03 重写为 FUNC-00409。A 档零 allow_skip。
