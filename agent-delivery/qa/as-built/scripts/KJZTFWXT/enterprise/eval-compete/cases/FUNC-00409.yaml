id: FUNC-00409
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00409
priority: P1
tier: B
title: 主流程-模板三态
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 浏览评估模板区，打开评估模板下拉
expect:
  - note: 模板区分组为系统模板 / 我的模板 / 当次自定义配置三类
    assert: |-
      const main = page.locator('main').first();
      await expect(main).toBeVisible({ timeout: 15000 });
      await expect(main.getByText('评估模板').first()).toBeVisible({ timeout: 8000 });
      const sel = main.locator('.arco-select-view').first();
      await sel.click({ timeout: 10000 });
      await page.waitForTimeout(700);
      const pop = page.locator('.arco-select-popup').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      await expect(pop.getByText('系统模板').first()).toBeVisible();
      await expect(pop.getByText('我的模板').first()).toBeVisible();
      await expect(pop.getByText('当次自定义配置').first()).toBeVisible();
  - note: 系统模板名为「综合竞争力标准模板」
    assert: |-
      const pop = page.locator('.arco-select-popup').last();
      await expect(pop.getByText('综合竞争力标准模板').first()).toBeVisible({ timeout: 8000 });
  - note: 我的模板数量随账号历史增减（初始账号为 0）
    assert: |-
      const pop = page.locator('.arco-select-popup').last();
      await expect(pop.getByText(/我的模板/).first()).toBeVisible({ timeout: 8000 });
  - note: 当次自定义配置初始为「当前未保存配置」
    assert: |-
      const pop = page.locator('.arco-select-popup').last();
      await expect(pop.getByText('当前未保存配置').first()).toBeVisible({ timeout: 8000 });
      await page.keyboard.press('Escape');
on_fail: 截图 + 抄 X-Trace-Id
