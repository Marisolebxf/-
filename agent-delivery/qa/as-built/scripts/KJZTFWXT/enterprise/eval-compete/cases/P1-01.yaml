id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00407
priority: P1
title: 浮层未勾选时取消选择与确定禁用
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-compete
expect:
- note: 两按钮均为禁用态不可点击
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { await close.first().click(); await page.waitForTimeout(300) }; await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); if (!(await page.getByText('选择分析企业').count())) throw new Error('浮层未开'); const clear = page.getByRole('button', { name: '取消选择' }); const ok = page.getByRole('button', { name: '确定' }); if (!(await clear.isDisabled())) throw new Error('未勾选时取消选择应禁用'); if (!(await ok.isDisabled())) throw new Error('未勾选时确定应禁用')
- note: 浮层不关闭且不回填对象
  assert: |-
    await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 }); await page.getByRole('button', { name: '取消' }).click(); await page.waitForTimeout(500); if (await page.getByText(/来自对比篮 ·/).count()) throw new Error('对象区被回填')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业时记 Pass-N/A
tier: B
