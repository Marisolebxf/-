id: FUNC-02022
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02022
priority: P1
tier: B
title: 备选-稍后查看
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 同册 01988/00413/01989 补过程态后点稍后查看
expect:
  - note: 1、进入最近评估列表
    assert: |-
      const main = () => page.locator('main').first();
      const TID_RE = /(?:DEMO-)?EVAL-\d{8}-\d{3,}/;
      if (!globalThis.__func02022_setup) {
        await page.waitForTimeout(800);
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        await expect(cta).toBeVisible({ timeout: 20000 });
        await cta.click({ timeout: 8000 });
        const panel = page.locator('.arco-modal, .system-compare-panel').filter({ hasText: '选择分析企业' }).last();
        await expect(panel).toBeVisible({ timeout: 12000 });
        const sels = panel.locator('[aria-label^="选择 "]');
        await expect(sels.first()).toBeVisible({ timeout: 10000 });
        await sels.first().click({ force: true });
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        const startBtn = main().getByRole('button', { name: '开始分析' });
        await expect(startBtn).toBeEnabled({ timeout: 15000 });
        await startBtn.click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        let u = page.url();
        if (!/view=processing/.test(u)) {
          const rerun = main().getByRole('button', { name: '重新分析', exact: true });
          if (await rerun.isVisible().catch(() => false)) {
            await rerun.click({ timeout: 8000 });
          } else {
            await startBtn.click({ timeout: 8000 }).catch(() => {});
          }
          await page.waitForTimeout(1500);
          u = page.url();
        }
        if (!/view=processing/.test(u)) {
          await page.waitForURL(/view=processing/, { timeout: 25000 }).catch(() => {});
          u = page.url();
        }
        try {
          const tid0 = new URL(u).searchParams.get('task_id');
          if (tid0 && TID_RE.test(tid0)) globalThis.__func02022_taskId = tid0;
        } catch {}
        const laterBtn = main().getByRole('button', { name: '稍后查看', exact: true });
        const procTitle = main().getByText('综合竞争力评估生成中').first();
        const laterOk = await laterBtn.isVisible().catch(() => false);
        const titleOk = await procTitle.isVisible().catch(() => false);
        if (!laterOk && !titleOk) {
          const txt = await main().innerText().catch(() => '');
          if (/view=processing/.test(u) && !/稍后查看/.test(txt)) {
            throw new Error('D4:view=processing 主区未渲染无法点稍后查看（ticket=ENV-EVAL-COMPETE-PROC-001）');
          }
          if (/综合竞争力评估结果/.test(txt) && !/稍后查看/.test(txt)) {
            throw new Error('修订 已发起仍为空结果壳或秒完成无法进入过程态点稍后查看');
          }
        }
        await expect(laterBtn).toBeVisible({ timeout: 25000 });
        await laterBtn.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        globalThis.__func02022_setup = true;
      }
      const u = page.url();
      const historyTab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(historyTab).toBeVisible({ timeout: 12000 });
      const selected = await historyTab.getAttribute('aria-selected');
      if (selected !== 'true' && !/view=history/.test(u)) {
        throw new Error('稍后查看后未进入最近评估：' + u);
      }
      await expect(main().getByRole('button', { name: '新建评估', exact: true }).first()).toBeVisible({ timeout: 12000 });
  - note: 2、本次任务仍在列表中
    assert: |-
      const TID_RE = /(?:DEMO-)?EVAL-\d{8}-\d{3,}/;
      let tid = globalThis.__func02022_taskId;
      if (!tid) {
        try { tid = new URL(page.url()).searchParams.get('task_id'); } catch {}
      }
      if (!tid) {
        const body = await page.locator('main').first().innerText().catch(() => '');
        const m = body.match(TID_RE);
        if (m) tid = m[0];
      }
      if (!tid || !TID_RE.test(tid)) throw new Error('未见本次 EVAL 任务标识');
      const main = () => page.locator('main').first();
      await expect(main().getByText(tid, { exact: false }).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
