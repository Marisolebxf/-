id: FUNC-02022
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02022
priority: P1
title: 生成中稍后查看转入最近评估且任务仍在
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
tier: B
preconditions:
  - 过程页处于综合竞争力评估生成中（脚本内补篮回填后点开始分析进入）
locators:
  start: button「开始分析」/「个性化竞争力评价与输出」
  later: 稍后查看
  recent_tab: tab「最近评估」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 补篮回填→开始分析→点「稍后查看」；最近评估与任务仍在列表断言在 expect
expect:
  - note: 1、进入最近评估列表
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const TID_RE = /(?:DEMO-)?EVAL-\d{8}-\d{3,}/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const pickerSelectableCount = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
        if (!(await panel.isVisible().catch(() => false))) return 0;
        return await panel.locator('[aria-label^="选择 "]').count();
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        n = await pickerSelectableCount();
        if (n >= min) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          return;
        }
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await dismissBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 20000 });
        const tryAdd = async () => {
          const cnt = await addBtns.count();
          for (let i = 0; i < Math.min(cnt, 5); i++) {
            await addBtns.nth(i).click({ timeout: 8000 });
            await page.waitForTimeout(900);
            n = await basketEntCount();
            if (n >= min) return true;
          }
          return false;
        };
        if (!(await tryAdd())) {
          n = await pickerSelectableCount();
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
        }
        if (n < min) {
          n = await pickerSelectableCount();
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
        }
        if (n < min) throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，当前 dock=' + (await basketEntCount()) + ' picker=' + n);
      };
      const openEnterprisePicker = async () => {
        const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const fillAndStart = async () => {
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        if (!(/enterprise_codes/.test(page.url()) && await main().getByText(/来自对比篮/).first().isVisible().catch(() => false))) {
          await openEnterprisePicker();
          const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
          await expect(panel).toBeVisible({ timeout: 10000 });
          const sels = panel.locator('[aria-label^="选择 "]');
          if (await sels.count() < 1) throw new Error('对比篮无可选企业');
          await sels.nth(0).click({ force: true });
          await page.waitForTimeout(300);
          await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          await dismissBasket();
          await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
        }
        const clickLaterAsap = async () => {
          const laterClicked = await page.evaluate(() => {
            return new Promise((resolve) => {
              const failedUi = () => {
                const t = document.body.innerText || '';
                return /评估失败|本次评估生成失败/.test(t) && /按此配置新建评估/.test(t);
              };
              const tryClick = () => {
                if (failedUi()) {
                  resolve('failed');
                  return true;
                }
                const btn = Array.from(document.querySelectorAll('button')).find((b) =>
                  /稍后查看/.test((b.textContent || '').trim()),
                );
                if (btn) {
                  btn.click();
                  resolve('later');
                  return true;
                }
                return false;
              };
              if (tryClick()) return;
              const deadline = Date.now() + 22000;
              const obs = new MutationObserver(() => { tryClick(); });
              obs.observe(document.body, { childList: true, subtree: true });
              const tick = setInterval(() => {
                if (tryClick()) {
                  clearInterval(tick);
                  obs.disconnect();
                } else if (Date.now() > deadline) {
                  clearInterval(tick);
                  obs.disconnect();
                  resolve('timeout');
                }
              }, 40);
            });
          });
          if (laterClicked === 'failed') {
            throw new Error('D3:Demo 任务秒失败未见稍后查看（ticket=ENV-EVAL-COMPETE-PROC-001）');
          }
          if (laterClicked === 'timeout') {
            const u = page.url();
            const mainText = await main().innerText().catch(() => '');
            try {
              const tid = new URL(u).searchParams.get('task_id');
              if (tid) globalThis.__func02022_taskId = tid;
            } catch {}
            if (
              /view=processing/.test(u) &&
              !/稍后查看/.test(mainText) &&
              !/综合竞争力评估生成中/.test(mainText)
            ) {
              throw new Error('D4:view=processing 主区未渲染无法点稍后查看（ticket=ENV-EVAL-COMPETE-PROC-001）');
            }
            if (/view=processing/.test(u) && /评估失败|生成失败/.test(mainText)) {
              throw new Error('D3:Demo 任务秒失败（ticket=ENV-EVAL-COMPETE-PROC-001）');
            }
            throw new Error('22s 内未点到稍后查看：' + u + ' | ' + mainText.slice(0, 240));
          }
          await page.waitForTimeout(1500);
        };
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count()) ? startClassic : startAlt;
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-COMPETE-PRECHECK-001）');
          throw new Error('对象已回填但开始分析仍禁用');
        }
        const laterWait = clickLaterAsap();
        await start.click({ timeout: 8000 });
        await laterWait;
      };
      const extractTaskId = async () => {
        const u = page.url();
        let tid = null;
        try { tid = new URL(u).searchParams.get('task_id'); } catch {}
        if (!tid) {
          const body = await page.locator('body').innerText().catch(() => '');
          const m = body.match(TID_RE);
          if (m) tid = m[0];
        }
        if (!tid || !TID_RE.test(tid)) throw new Error('未见 EVAL 任务标识：' + u);
        return tid;
      };
      if (!globalThis.__func02022_done) {
        await fillAndStart();
        await page.waitForURL(/view=history|view=processing/, { timeout: 25000 }).catch(() => {});
        globalThis.__func02022_taskId = await extractTaskId();
        globalThis.__func02022_done = true;
      }
      const uAfter = page.url();
      if (/view=processing/.test(uAfter)) {
        const stillGen = await page.getByText(/综合竞争力评估生成中/).first().isVisible().catch(() => false);
        if (stillGen) throw new Error('稍后查看后仍在过程态 view=processing：' + uAfter);
      }
      if (!/view=history/.test(uAfter)) {
        const tab = page.getByRole('tab', { name: '最近评估', exact: true });
        if (await tab.isVisible().catch(() => false)) {
          const selected = await tab.getAttribute('aria-selected');
          if (selected !== 'true') throw new Error('URL 无 view=history 且最近评估 tab 未选中：' + uAfter);
        } else {
          throw new Error('稍后查看后未进入最近评估（无 view=history）：' + uAfter);
        }
      }
      await expect(main().getByRole('button', { name: '新建评估', exact: true }).first()).toBeVisible({ timeout: 12000 });
      const recentTab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(recentTab).toBeVisible({ timeout: 8000 });
  - note: 2、本次任务仍在列表中
    assert: |-
      let tid = globalThis.__func02022_taskId;
      if (!tid) {
        try { tid = new URL(page.url()).searchParams.get('task_id'); } catch {}
      }
      if (!tid) throw new Error('前置：未捕获任务 ID');
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const t0 = Date.now();
      let found = false;
      while (Date.now() - t0 < 15000) {
        const t = await main().innerText().catch(() => '');
        if (t.includes(tid)) { found = true; break; }
        await page.waitForTimeout(500);
      }
      if (!found) {
        const body = await main().innerText().catch(() => '');
        throw new Error('最近评估列表未见本次任务 ' + tid + '；片段：' + body.slice(0, 300));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  02022 备选-稍后查看：作废 00435「我的任务」口径。过程态点「稍后查看」→ showHistory（view=history）。发起/补篮/并行点稍后查看同 FUNC-00434 取消任务模式。30888 路由 /enterprise-center/evaluation（禁 50892）。2026-10-20 机跑：URL 已 view=processing+task_id 但 main 仍配置空壳、无稍后查看（同 rewrite-FUNC-00434）→D4 ENV-EVAL-COMPETE-PROC-001。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
