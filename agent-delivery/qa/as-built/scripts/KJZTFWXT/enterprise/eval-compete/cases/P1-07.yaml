id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00428
priority: P1
title: 重新选择系统模板后指标与权重恢复预设且对象不恢复
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-compete
preconditions:
- 已带入至少 1 家企业；已用调节钮修改权重
expect:
- note: 指标与权重恢复为模板预设 40 / 40 / 20
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) await close.first().click(); await page.locator('.arco-input-number-step-button').nth(0).click(); await page.waitForTimeout(200); const trg = page.locator('.arco-select-view').filter({ hasText: /综合竞争力|模板|未保存|当前/ }).first(); await trg.click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible').getByText('综合竞争力标准模板', { exact: true }).first().click(); await page.waitForTimeout(600); const vals = []; const spins = page.locator('[role=spinbutton]'); for (let i = 0; i < 3; i++) vals.push(await spins.nth(i).inputValue()); if (vals.join(',') !== '40,40,20') throw new Error('系统模板未恢复: ' + vals.join('/'))
- note: 已带入的企业对象保持不恢复
  assert: |-
    const had = page.url().includes('enterprise_codes'); /* 模板切换不应清空已有对象 URL；无对象时本点 observed */ await page.waitForTimeout(200)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 默认为模板预设非均分；均分由一键平均承载。
tier: B
