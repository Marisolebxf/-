id: FUNC-01997
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01997
priority: P0
title: 浮层企业类型下拉七个固定选项
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-compete
tier: B
preconditions:
  - 「选择分析企业」浮层已打开（脚本自含对比篮≥1 与开浮层）
locators:
  type_filter: placeholder「全部企业类型」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 开浮层后展开「全部企业类型」；选项个数与名称在 expect 判定
expect:
  - note: 1、选项共 7 个
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const evalRouteFallback = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const gotoCompetePage = async () => {
        for (const route of [evalRoute, evalRouteFallback]) {
          await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          const body = await page.locator('body').innerText().catch(() => '');
          if (/Unexpected Application Error|404 Not Found/.test(body)) continue;
          const h = await page.getByRole('heading', { name: /企业.*竞争力/ }).first().isVisible().catch(() => false);
          if (h) return route;
        }
        throw new Error('ENV-BLOCKED:无法进入综合竞争力评估工作区（/enterprise/evaluation 与 enterprise-center 回退均不可用）');
      };
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const main = () => page.locator('main.diagnosis-main, main.app-main, main').first();
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const waitBasketAtLeast = async (min, ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if ((await basketEntCount()) >= min) return true;
          await page.waitForTimeout(400);
        }
        return (await basketEntCount()) >= min;
      };
      const addFromVisibleCards = async (need) => {
        let added = 0;
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        const btnN = await addBtns.count();
        for (let i = 0; i < btnN && added < need; i++) {
          const btn = addBtns.nth(i);
          if (!(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          added++;
        }
        if (added < need) {
          const rec = page.locator('main section').filter({ hasText: '推荐企业' }).first();
          if (await rec.isVisible().catch(() => false)) {
            const cards = rec.locator('div').filter({ hasText: '推荐理由：' });
            for (let i = 0, c = await cards.count(); i < c && added < need; i++) {
              const btn = cards.nth(i).getByRole('button', { name: '加入对比篮', exact: true });
              if (await btn.isVisible().catch(() => false)) {
                await btn.click({ timeout: 8000 });
                await page.waitForTimeout(700);
                added++;
              }
            }
          }
        }
        return added;
      };
      const ensureBasketEnterprises = async (min) => {
        if ((await basketEntCount()) >= min) return;
        const searchPaths = ['/enterprise/enterprise-search', '/development/search'];
        for (const sp of searchPaths) {
          await page.goto(toUrl(sp), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await closeBasket();
          const searchInput = page
            .getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ })
            .or(page.getByPlaceholder(/企业名|产业|资质/))
            .first();
          if (await searchInput.isVisible().catch(() => false)) {
            await searchInput.fill('人工智能');
            const searchBtn = page.getByRole('button', { name: '搜索', exact: true }).first();
            if (await searchBtn.isVisible().catch(() => false)) {
              await searchBtn.click({ timeout: 8000 });
              await page.waitForTimeout(1200);
              await page.getByText('智能搜索结果', { exact: true }).first().waitFor({ state: 'visible', timeout: 25000 }).catch(() => {});
            }
          }
          let n = await basketEntCount();
          while (n < min) {
            const need = min - n;
            const clicked = await addFromVisibleCards(need);
            if (!clicked) break;
            await waitBasketAtLeast(min, 8000);
            n = await basketEntCount();
            if (n >= min) return;
          }
        }
        if ((await basketEntCount()) < min) {
          throw new Error('ENV-GATE:对比篮企业不足 ' + min + '，当前 ' + (await basketEntCount()));
        }
      };
      const openSelectOverlay = async () => {
        const route = globalThis.__func01997_evalRoute || evalRoute;
        const pickerQs =
          'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50&analysis_type=competitiveness';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(`${route}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        if (!(await page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false))) {
          const cta2 = main().getByRole('button', { name: /返回对比篮调整对象|个性化竞争力评价与输出/ }).first();
          if (await cta2.isVisible().catch(() => false)) {
            await cta2.click({ timeout: 8000 });
            await page.waitForTimeout(1000);
          }
        }
      };
      const pickerRoot = () =>
        page
          .locator('.system-compare-panel:visible, .arco-modal:visible, .arco-drawer:visible, [role="dialog"]')
          .filter({ hasText: '选择分析企业' })
          .last();
      const readTypeLabels = async () => {
        const root = pickerRoot();
        const workspace = root.locator('[data-testid="compare-basket-workspace"]').first();
        const scope = (await workspace.count()) ? workspace : root;
        const typePh = scope.getByPlaceholder('全部企业类型');
        const typeView = scope.locator('.arco-select-view').filter({ hasText: /全部企业类型/ }).first();
        await expect(typePh.or(typeView).first()).toBeVisible({ timeout: 10000 });
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(200);
        let opened = false;
        for (const target of [typeView, typePh]) {
          if (!(await target.count()) || !(await target.first().isVisible().catch(() => false))) continue;
          await target.first().scrollIntoViewIfNeeded().catch(() => {});
          try {
            await target.first().click({ force: true, timeout: 5000 });
            await page.waitForTimeout(700);
            opened =
              (await page.locator('.arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option, label.arco-select-option-checkbox:visible').count()) > 0;
            if (opened) break;
          } catch {
            /* retry next target */
          }
        }
        if (!opened) {
          throw new Error('D4·无头下「全部企业类型」下拉未能展开（同 FUNC-00424/00951）');
        }
        let opts = page.locator('.arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option');
        if (!(await opts.count())) {
          opts = page.locator('label.arco-select-option-checkbox:visible, .arco-select-popup:visible label.arco-select-option-checkbox');
        }
        await expect(opts.first()).toBeVisible({ timeout: 8000 });
        const labels = [];
        for (let i = 0, c = await opts.count(); i < c; i++) {
          const t = ((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t && !/^全部/.test(t)) labels.push(t);
        }
        return labels;
      };
      const overlayVisible = async () =>
        page.getByText('选择分析企业', { exact: true }).first().isVisible().catch(() => false);
      let activeRoute = await gotoCompetePage();
      await closeBasket();
      await openSelectOverlay();
      await page.waitForTimeout(800);
      if (!(await overlayVisible())) {
        await ensureBasketEnterprises(1);
        activeRoute = await gotoCompetePage();
        await closeBasket();
        await openSelectOverlay();
        await page.waitForTimeout(800);
      }
      globalThis.__func01997_evalRoute = activeRoute;
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      globalThis.__func01997_labels = await readTypeLabels();
      if (globalThis.__func01997_labels.length !== 7) {
        throw new Error(`企业类型选项应为 7 个，实际 ${globalThis.__func01997_labels.length}：${globalThis.__func01997_labels.join('、')}`);
      }
  - note: 2、名称与附录 A 一致（外资企业、高新技术企业、小微企业、上市企业、专精特新、小巨人、链主龙头）
    assert: |-
      const APPENDIX_A = ['外资企业', '高新技术企业', '小微企业', '上市企业', '专精特新', '小巨人', '链主龙头'];
      const labels = globalThis.__func01997_labels;
      if (!labels || labels.length !== 7) {
        throw new Error('前置：类型选项未就绪');
      }
      for (let i = 0; i < APPENDIX_A.length; i++) {
        if (labels[i] !== APPENDIX_A[i]) {
          throw new Error(`第 ${i + 1} 项应为附录 A「${APPENDIX_A[i]}」，实际「${labels[i] || '(无)'}」；全套：${labels.join('、')}`);
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  D1·edu.itic-sci.com/tts/svcz 浮层「全部企业类型」下拉为附录 A 全称七项（与用例一致）；路由优先 catalog /enterprise/evaluation?workspace=competitiveness&mode=competitiveness，回退 enterprise-center。开浮层对齐 FUNC-01988/01910（CTA 优先 + picker 深链 analysis_type=competitiveness）；空篮先开浮层再回退入篮。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
