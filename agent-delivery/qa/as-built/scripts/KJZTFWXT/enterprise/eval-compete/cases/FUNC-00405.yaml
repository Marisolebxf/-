id: FUNC-00405
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00405
priority: P0
title: 空态按钮打开选择分析企业浮层且构成正确
story: US-ENT-EVAL-OBJ
entry_id: ent-eval-compete
tier: A
preconditions:
  - env-gate overall=pass；select_objects=pass（对比篮≥1 家企业）
  - 已进入综合竞争力页；评估对象区为空（URL 无 enterprise_codes）
locators:
  cta: button「前往对比篮选择企业」
  overlay_title: 选择分析企业
  search: placeholder「按企业名称搜索」
  type_filter: placeholder「全部企业类型」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 侧栏进入综合竞争力空态页→点「前往对比篮选择企业」；浮层构成在 expect
expect:
  - note: 浮层打开且标题为「选择分析企业」；副标题含从对比篮勾选与确定回填不发起分析的语义
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const onCompeteEmpty = async () => {
        const h = await page.getByRole('heading', { name: '企业综合竞争力评估' }).first().isVisible().catch(() => false);
        return h && !/enterprise_codes/.test(page.url());
      };
      const sidebarEnterCompete = async () => {
        const entryNames = ['企业综合竞争力评估'];
        let clicked = false;
        for (const name of entryNames) {
          const link = page.getByRole('link', { name, exact: true });
          if (await link.count()) {
            await link.first().scrollIntoViewIfNeeded().catch(() => {});
            await link.first().click({ timeout: 10000 });
            clicked = true;
            break;
          }
        }
        if (!clicked) {
          const search = page.getByRole('link', { name: '企业查询', exact: true });
          if (await search.count()) {
            await search.first().click({ timeout: 8000 });
            await page.waitForTimeout(500);
            for (const name of entryNames) {
              const link = page.getByRole('link', { name, exact: true });
              if (await link.count()) {
                await link.first().click({ timeout: 10000 });
                clicked = true;
                break;
              }
            }
          }
        }
        if (!clicked) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        } else {
          await page.waitForTimeout(1200);
        }
        const bodyAfter = await page.locator('body').innerText().catch(() => '');
        if (/Unexpected Application Error|404 Not Found/.test(bodyAfter)) {
          throw new Error('ENV-BLOCKED:当前环境无 /enterprise/evaluation 综合竞争力工作区（SPA 404）');
        }
        await expect(page.getByRole('heading', { name: '企业综合竞争力评估' }).first()).toBeVisible({ timeout: 15000 });
      };
      await dismissBasket();
      if (!(await onCompeteEmpty())) {
        const bodyTxt = await page.locator('body').innerText().catch(() => '');
        if (/Unexpected Application Error|404 Not Found/.test(bodyTxt)) {
          await page.goto(toUrl('/enterprise-center/overview'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        if (!(await page.getByRole('heading', { name: '企业综合竞争力评估' }).first().isVisible().catch(() => false))) {
          await page.goto(toUrl('/enterprise-center/overview'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
          await dismissBasket();
          await sidebarEnterCompete();
        }
        if (/enterprise_codes/.test(page.url())) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await dismissBasket();
        }
      }
      await expect(page.getByRole('button', { name: '前往对比篮选择企业' })).toBeVisible({ timeout: 10000 });
      await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 10000 });
      await page.waitForTimeout(800);
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 10000 });
      await expect(page.getByText(/从对比篮勾选/).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText(/不会发起分析任务/).first()).toBeVisible({ timeout: 8000 });
  - note: 浮层含企业 Tab、名称搜索框与企业类型筛选
    assert: |-
      await expect(page.getByRole('tab', { name: /企业/ }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByPlaceholder('按企业名称搜索')).toBeVisible({ timeout: 8000 });
      await expect(page.getByPlaceholder('全部企业类型')).toBeVisible({ timeout: 8000 });
  - note: 企业列表含勾选框、查看画像与移除动作
    assert: |-
      const n = await page.locator('[aria-label^="选择 "]').count();
      if (n < 1) throw new Error('对比篮无可选企业（aria-label^=选择）');
      await expect(page.getByRole('button', { name: '查看画像' }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.locator('[aria-label="移除"]').first()).toBeVisible({ timeout: 8000 });
  - note: 浮层底栏含确定与取消选择
    assert: |-
      await expect(page.getByRole('button', { name: '确定' })).toBeVisible({ timeout: 8000 });
      await expect(page.getByRole('button', { name: '取消选择' })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D4·30888 机跑未达评估页（深链 SPA 404、侧栏无「企业综合竞争力评估」）；闸门真源仍为 50892 env-gate。进页逻辑=overview 预热后侧栏或 evalRoute。浮层直回填。由 P0-02 重写为 FUNC-00405。A 档零 allow_skip。
