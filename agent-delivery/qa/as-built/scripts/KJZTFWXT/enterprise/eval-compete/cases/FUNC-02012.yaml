id: FUNC-02012
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02012
priority: P1
title: 最近评估翻到第二页后仍是评估任务
story: US-ENT-EVAL-HISTORY
entry_id: ent-eval-compete
tier: B
preconditions:
  - 最近评估总数超过一页（现场 pageSize=10；用例册备注现场共 16 条）
locators:
  tab_recent: tab「最近评估」
  page2: .arco-pagination-item「2」
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 最近评估→读第 1 页任务 ID 与表头→点分页「2」；换批与表头断言在 expect
expect:
  - note: 1、列表换成另一批任务
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const evalRouteFallback = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const gotoCompetePage = async () => {
        for (const route of [evalRoute, evalRouteFallback]) {
          await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          const body = await page.locator('body').innerText().catch(() => '');
          if (/404|页面不存在|Unexpected Application Error/.test(body)) continue;
          const h = await page.getByRole('heading', { name: /企业综合竞争力评估/ }).first().isVisible().catch(() => false);
          if (h) return route;
        }
        throw new Error('ENV-BLOCKED:无法进入综合竞争力评估工作区（ticket=ENV-EDU-TTS-SVCZ-EVAL-ROUTE-001）');
      };
      const PAGE_SIZE = 10;
      const TID_RE = /(?:DEMO-EVAL-\d{8}-\d+|EVAL-\d{8}-\d{3})/;
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false) && await closeB.first().isEnabled().catch(() => false)) {
          try { await closeB.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const clickRecentTab = async () => {
        const tablists = page.locator('[role=tablist]').filter({ has: page.getByRole('tab', { name: '最近评估', exact: true }) });
        const list = (await tablists.count()) ? tablists.first() : page.locator('[role=tablist]').first();
        const recent = list.getByRole('tab', { name: '最近评估', exact: true });
        await expect(recent).toBeVisible({ timeout: 10000 });
        await recent.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await expect(recent).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      };
      const historyPagination = () => {
        const table = main().locator('.arco-table').first();
        return table.locator('xpath=following::div[contains(@class,"arco-pagination")][1]');
      };
      const fetchHistoryTotal = async () => {
        const listUrl = toUrl('/topicAsync/topic/v1/analysis/tasks/list');
        for (const user_id of ['admin', 'guest']) {
          const resp = await page.request.post(listUrl, {
            data: { user_id, analysisType: 'enterprise_eval', subType: 'competitiveness', page: 1, size: 1 },
          });
          if (!resp.ok()) continue;
          let json = {};
          try { json = await resp.json(); } catch { continue; }
          const data = json?.data ?? json;
          const total = data?.total ?? data?.totalCount;
          if (typeof total === 'number' && total >= 0) return total;
        }
        return null;
      };
      const readTotalFromPagination = async () => {
        const pg = historyPagination();
        if (!(await pg.count()) || !(await pg.isVisible().catch(() => false))) {
          return await page.evaluate(() => {
            const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
            const tables = [...document.querySelectorAll('main .arco-table, main table')];
            for (const table of tables) {
              const head = norm(table.querySelector('thead, .arco-table-header')?.innerText || '');
              if (!/任务名称/.test(head)) continue;
              let el = table.parentElement;
              for (let i = 0; i < 6 && el; i++) {
                const pgEl = el.querySelector(':scope > .arco-pagination, .arco-pagination');
                if (pgEl) {
                  const m = norm(pgEl.innerText).match(/共\s*(\d+)\s*条/);
                  if (m) return parseInt(m[1], 10);
                }
                el = el.parentElement;
              }
            }
            return null;
          });
        }
        const t = (await pg.innerText().catch(() => '')).replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const readRowTaskIds = async () => {
        return await page.evaluate((reSource) => {
          const re = new RegExp(reSource);
          const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
          const ids = [];
          const tables = [...document.querySelectorAll('main table, main .arco-table')];
          for (const table of tables) {
            const rows = [...table.querySelectorAll('tbody tr, .arco-table-body .arco-table-tr')];
            for (const row of rows) {
              const text = norm(row.innerText);
              const m = text.match(re);
              if (m) ids.push(m[0]);
            }
            if (ids.length) break;
          }
          return [...new Set(ids)];
        }, TID_RE.source);
      };
      const readRecentTableHeaders = async () => {
        return await page.evaluate(() => {
          const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
          const tables = [...document.querySelectorAll('main table, main .arco-table')];
          for (const table of tables) {
            const headRow = table.querySelector('thead tr') || table.querySelector('.arco-table-header .arco-table-tr');
            if (!headRow) continue;
            const cells = [...headRow.querySelectorAll('th, .arco-table-th')].map((c) => norm(c.innerText)).filter(Boolean);
            if (cells.length >= 5 && cells.some((c) => /任务/.test(c))) return cells;
          }
          return [];
        });
      };
      await gotoCompetePage();
      await closeBasket();
      await clickRecentTab();
      await expect(main().getByRole('heading', { name: '企业综合竞争力评估' }).first()).toBeVisible({ timeout: 15000 });
      await expect(main().getByRole('button', { name: '新建评估', exact: true }).first()).toBeVisible({ timeout: 12000 });
      await expect(main().locator('.arco-table').first()).toBeVisible({ timeout: 10000 });
      const totalApi = await fetchHistoryTotal();
      const totalUi = await readTotalFromPagination();
      const total = totalApi ?? totalUi;
      if (total !== null && total <= PAGE_SIZE) {
        throw new Error('数据闸门：最近评估共 ' + total + ' 条不大于单页 ' + PAGE_SIZE + '，无法验翻页（ticket=ENV-EVAL-COMPETE-HISTORY-PAGE2-001）');
      }
      const page2Btn = historyPagination().locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 = (await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false));
      if (!hasPage2) {
        if (total !== null && total > PAGE_SIZE) {
          throw new Error('产品异常：总数 ' + total + ' 超过单页但未见分页「2」（ticket=GAP-EVAL-HISTORY-PAGINATION-001）');
        }
        throw new Error('数据闸门：分页「2」不可见，最近评估未超过一页（ticket=ENV-EVAL-COMPETE-HISTORY-PAGE2-001）');
      }
      const hdrPage1 = await readRecentTableHeaders();
      if (!hdrPage1.length) throw new Error('第 1 页未读到最近评估表头（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
      globalThis.__func02012_hdr1 = hdrPage1;
      const idsPage1 = await readRowTaskIds();
      if (!idsPage1.length) {
        throw new Error('第 1 页未见任务 ID 行（ticket=ENV-EVAL-COMPETE-HISTORY-001）');
      }
      await page2Btn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      await expect(page2Btn).toHaveClass(/arco-pagination-item-active/, { timeout: 8000 });
      const idsPage2 = await readRowTaskIds();
      if (!idsPage2.length) {
        throw new Error('点击分页「2」后未见任务行');
      }
      const overlap = idsPage1.filter((id) => idsPage2.includes(id));
      if (overlap.length) {
        throw new Error('第 2 页与第 1 页任务 ID 重叠: ' + overlap.join(', '));
      }
      globalThis.__func02012_page2 = true;
  - note: 2、表头列与第一页相同
    assert: |-
      if (!globalThis.__func02012_page2) throw new Error('前置：未完成翻到第 2 页');
      const hdrPage1 = globalThis.__func02012_hdr1;
      if (!hdrPage1 || !hdrPage1.length) throw new Error('前置：未记录第 1 页表头');
      const hdrPage2 = await page.evaluate(() => {
        const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
        const tables = [...document.querySelectorAll('main table, main .arco-table')];
        for (const table of tables) {
          const headRow = table.querySelector('thead tr') || table.querySelector('.arco-table-header .arco-table-tr');
          if (!headRow) continue;
          const cells = [...headRow.querySelectorAll('th, .arco-table-th')].map((c) => norm(c.innerText)).filter(Boolean);
          if (cells.length >= 5 && cells.some((c) => /任务/.test(c))) return cells;
        }
        return [];
      });
      if (!hdrPage2.length) throw new Error('第 2 页未读到表头');
      if (hdrPage2.length !== hdrPage1.length) {
        throw new Error('表头列数变化: 第1页' + hdrPage1.length + '列 vs 第2页' + hdrPage2.length + '列');
      }
      for (let i = 0; i < hdrPage1.length; i++) {
        if (hdrPage1[i] !== hdrPage2[i]) {
          throw new Error('表头第' + (i + 1) + '列不一致: 「' + hdrPage1[i] + '」 vs 「' + hdrPage2[i] + '」');
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  D1·edu tts/svcz 路由优先 catalog /enterprise/evaluation?workspace=competitiveness&mode=competitiveness，回退 enterprise-center（对齐 01997/02007）；步骤点「最近评估」Tab 进历史（不用 view=history 深链）。历史表分页取 .arco-table 后首个 .arco-pagination；总条数优先 POST analysis/tasks/list total。点「2」后任务 ID 不重叠、表头列一致。pageSize=10，用例册备注现场 16 条。admin 仅 2 条→ENV-EVAL-COMPETE-HISTORY-PAGE2-001；工作区不可达→ENV-EDU-TTS-SVCZ-EVAL-ROUTE-001。D4·2026-10-21 rewrite-FUNC-02012 svcz 机跑 fail（全站深链 404，与 01997 同态）。登录与关内部评审由 runner 会话前置。tier B，零 allow_skip。
