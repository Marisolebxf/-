id: FUNC-02012
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02012
priority: P1
title: 最近评估翻到第二页后仍是评估任务
entry_id: ent-eval-compete
tier: B
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 点「最近评估」Tab 后点分页「2」（列表与表头断言在 expect）
expect:
  - note: 1、列表换成另一批任务
    assert: |-
      const main = () => page.locator('main.diagnosis-main').first();
      const TID_RE = /EVAL-\d{8}-\d{3}/;
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 10000 });
      await tab.click();
      await expect(tab).toHaveAttribute('aria-selected', 'true', { timeout: 8000 });
      await expect(main().getByRole('button', { name: '新建评估', exact: true }).first()).toBeVisible({ timeout: 10000 });
      const readIds = async () =>
        page.evaluate((reSource) => {
          const re = new RegExp(reSource, 'g');
          const table = document.querySelector('main.diagnosis-main .arco-table');
          if (!table) return [];
          const ids = [];
          for (const row of table.querySelectorAll('tbody tr, .arco-table-body .arco-table-tr')) {
            const m = (row.innerText || '').match(re);
            if (m) ids.push(m[0]);
          }
          return [...new Set(ids)];
        }, TID_RE.source);
      const ids1 = await readIds();
      if (!ids1.length) {
        throw new Error('数据闸门：最近评估暂无任务行，无法验翻页（ticket=ENV-EVAL-COMPETE-HISTORY-PAGE2-001）');
      }
      globalThis.__func02012_ids1 = ids1;
      globalThis.__func02012_hdr1 = await page.evaluate(() => {
        const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
        const table = document.querySelector('main.diagnosis-main .arco-table');
        if (!table) return [];
        const headRow = table.querySelector('thead tr, .arco-table-header .arco-table-tr');
        if (!headRow) return [];
        return [...headRow.querySelectorAll('th, .arco-table-th')].map((c) => norm(c.innerText)).filter(Boolean);
      });
      const page2 = main().locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      await expect(page2).toBeVisible({ timeout: 8000 });
      await page2.click();
      await expect(page2).toHaveClass(/arco-pagination-item-active/, { timeout: 8000 });
      const ids2 = await readIds();
      if (!ids2.length) throw new Error('点击分页「2」后未见任务行');
      const overlap = ids1.filter((id) => ids2.includes(id));
      if (overlap.length) throw new Error('第 2 页与第 1 页任务重叠: ' + overlap.join(', '));
      globalThis.__func02012_page2 = true;
  - note: 2、表头列与第一页相同
    assert: |-
      if (!globalThis.__func02012_page2) throw new Error('前置：未翻到第 2 页');
      const hdr1 = globalThis.__func02012_hdr1;
      if (!hdr1?.length) throw new Error('前置：未记录第 1 页表头');
      const hdr2 = await page.evaluate(() => {
        const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
        const table = document.querySelector('main.diagnosis-main .arco-table');
        if (!table) return [];
        const headRow = table.querySelector('thead tr, .arco-table-header .arco-table-tr');
        if (!headRow) return [];
        return [...headRow.querySelectorAll('th, .arco-table-th')].map((c) => norm(c.innerText)).filter(Boolean);
      });
      expect(hdr2.length).toBe(hdr1.length);
      for (let i = 0; i < hdr1.length; i++) {
        if (hdr1[i] !== hdr2[i]) throw new Error('表头第' + (i + 1) + '列不一致');
      }
on_fail: 截图 + 抄 X-Trace-Id
