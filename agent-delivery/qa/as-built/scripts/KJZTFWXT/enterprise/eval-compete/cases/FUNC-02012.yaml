id: FUNC-02012
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02012
priority: P1
tier: B
title: 备选-最近评估翻页
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 点击「最近评估」后点页码 2；翻页与表头判定在 expect
expect:
  - note: 1、列表换成另一批任务
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const tab = page.getByRole('tab', { name: '最近评估', exact: true });
      await expect(tab).toBeVisible({ timeout: 15000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const histTable = main().locator('.arco-table').first();
      await expect(histTable).toBeVisible({ timeout: 15000 });
      await expect(main().getByText('最近评估暂无数据')).toHaveCount(0);
      const pageOneFirst = (await histTable.locator('tbody tr').first().innerText()).trim();
      globalThis.__func02012_pageOneFirst = pageOneFirst;
      const page2 = main().locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      await expect(page2).toBeVisible({ timeout: 8000 });
      await page2.click();
      await page.waitForTimeout(600);
      const pageTwoFirst = (await histTable.locator('tbody tr').first().innerText()).trim();
      if (!pageOneFirst || pageTwoFirst === pageOneFirst) {
        throw new Error('翻到第 2 页后首行与第 1 页相同；第1页=' + pageOneFirst.slice(0, 100) + '；第2页=' + pageTwoFirst.slice(0, 100));
      }
      globalThis.__func02012_headerCells = (await histTable.locator('thead th').allInnerTexts()).map((s) => s.replace(/\s+/g, ' ').trim());
  - note: 2、表头列与第一页相同
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const histTable = main().locator('.arco-table').first();
      let headerCells = globalThis.__func02012_headerCells;
      if (!headerCells || !headerCells.length) {
        headerCells = (await histTable.locator('thead th').allInnerTexts()).map((s) => s.replace(/\s+/g, ' ').trim());
      }
      const required = ['任务名称', '任务 ID', '模式', '企业摘要', '创建时间', '状态', '可信度', '报告', '操作'];
      const headers = headerCells.join('|');
      for (const col of required) {
        if (!headerCells.some((h) => h === col || h.includes(col))) {
          throw new Error('第 2 页表头缺少列：' + col + '；实际：' + headers);
        }
      }
      const hasTpl = headerCells.some((h) => /模板\s*\/\s*版本/.test(h));
      if (!hasTpl) throw new Error('第 2 页表头缺少列：模板 / 版本；实际：' + headers);
on_fail: 截图 + 抄 X-Trace-Id
