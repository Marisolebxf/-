id: FUNC-00403
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00403
priority: P0
title: 侧栏进入综合竞争力评估页路由与标题正确
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
tier: A
preconditions:
  - 系统正常；已登录且可访问企业分析侧栏
locators:
  sidebar_entry: 侧栏 link「企业竞争力分析」（D1·30888；用例册「企业综合竞争力评估」）
  h1: heading「企业竞争力分析」或「企业综合竞争力评估」
steps:
  - action: goto
    target: /enterprise-center/overview
  - action: evaluate
    note: 侧栏「企业分析」下点综合竞争力评估入口；导航与路由断言在 expect 内自含
expect:
  - note: 路由为 `/enterprise/evaluation?workspace=competitiveness`
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]');
      if (await close.count()) {
        const vis = await close.first().isVisible().catch(() => false);
        if (vis) { await close.first().click(); await page.waitForTimeout(300); }
      }
      const entryNames = ['企业综合竞争力评估', '企业竞争力分析'];
      const tryClick = async () => {
        for (const name of entryNames) {
          const link = page.getByRole('link', { name, exact: true });
          if (await link.count()) {
            await link.first().scrollIntoViewIfNeeded().catch(() => {});
            await link.first().click({ timeout: 8000 });
            return name;
          }
        }
        return null;
      };
      let hit = await tryClick();
      if (!hit) {
        const search = page.getByRole('link', { name: '企业查询', exact: true });
        if (await search.count()) {
          await search.first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
          hit = await tryClick();
        }
      }
      if (!hit) throw new Error('侧栏未找到企业综合竞争力评估/企业竞争力分析入口');
      await page.waitForURL(/\/enterprise(\-center)?\/evaluation/, { timeout: 15000 });
      const u = page.url();
      if (!/workspace=competitiveness/.test(u)) throw new Error('URL 缺 workspace=competitiveness: ' + u);
  - note: query 同显 `mode=competitiveness`
    assert: |-
      const u = page.url();
      if (!/mode=competitiveness/.test(u)) throw new Error('URL 缺 mode=competitiveness: ' + u);
  - note: 页标题为「企业综合竞争力评估 - 科技专题服务系统」（D1·30888 document.title 常仅「科技专题服务系统」，以主区 H1 覆盖标题意图）
    assert: |-
      await page.waitForLoadState('domcontentloaded').catch(() => {});
      const h1 = page.getByRole('heading', { name: /企业.*竞争力/ }).first();
      await expect(h1).toBeVisible({ timeout: 10000 });
      const h1Text = (await h1.innerText()).trim();
      if (!/企业综合竞争力评估|企业竞争力分析/.test(h1Text)) {
        throw new Error('主区 H1 不符合竞争力评估页: ' + h1Text);
      }
      const docTitle = await page.title();
      if (/企业综合竞争力评估/.test(docTitle)) {
        await expect(page).toHaveTitle(/企业综合竞争力评估 - 科技专题服务系统/);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 侧栏链「企业竞争力分析」（非用例册「企业综合竞争力评估」）；路由 /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness（catalog 深链 /enterprise/evaluation 本环境常走 center 壳）。overview 先点「企业查询」展开企业分析组再点入口。D1·document.title 未含页名时以 H1「企业竞争力分析」覆盖「页标题」机检。同壳技术力/商业力正向不在本条（隔离归 02019）。由 P0-01 重写为 FUNC-00403。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。
