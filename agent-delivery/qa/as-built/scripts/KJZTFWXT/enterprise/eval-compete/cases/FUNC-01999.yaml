id: FUNC-01999
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01999
priority: P1
title: 取消勾选成长能力后权重合计偏离 100
story: US-ENT-EVAL-QUALITY
entry_id: ent-eval-compete
tier: B
preconditions:
  - 三项维度均已勾选且权重和为 100
locators:
  growth_row: row「成长能力」
  growth_checkbox: 成长能力行 .arco-checkbox
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 指标与权重区取消勾选「成长能力」；合计偏离断言在 expect
expect:
  - note: 1、权重合计变为 80%
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const dimNames = ['创新能力', '经营能力', '成长能力'];
      const closeBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          try { await close.first().click({ timeout: 1500 }); await page.waitForTimeout(300); } catch {}
        }
      };
      const gotoCompeteConfig = async () => {
        if (!/\/enterprise(\-center)?\/evaluation/.test(page.url()) || !/workspace=competitiveness/.test(page.url())) {
          await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
        }
        await closeBasket();
        await expect(page.getByRole('heading', { name: /企业.*竞争力/ }).first()).toBeVisible({ timeout: 12000 });
        const curTab = page.getByRole('tab', { name: '当前分析', exact: true });
        if (await curTab.count()) {
          await curTab.first().click({ timeout: 5000 });
          await page.waitForTimeout(600);
        }
      };
      const growthRow = () => page.getByRole('row').filter({ hasText: '成长能力' }).first();
      const growthCheckbox = () => growthRow().locator('.arco-checkbox').first();
      await gotoCompeteConfig();
      await expect(page.getByText(/权重合计：100%/).first()).toBeVisible({ timeout: 8000 });
      for (const name of dimNames) {
        const row = page.getByRole('row').filter({ hasText: name }).first();
        await expect(row).toBeVisible({ timeout: 8000 });
        const cls = (await row.locator('.arco-checkbox').first().getAttribute('class')) || '';
        if (!/arco-checkbox-checked/.test(cls)) throw new Error('前置：' + name + ' 未勾选');
      }
      const cb = growthCheckbox();
      const clsBefore = (await cb.getAttribute('class')) || '';
      if (!/arco-checkbox-checked/.test(clsBefore)) throw new Error('前置：成长能力未勾选');
      await cb.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const clsAfter = (await cb.getAttribute('class')) || '';
      if (/arco-checkbox-checked/.test(clsAfter)) throw new Error('成长能力勾选未取消');
      let sumText = '';
      for (let i = 0; i < 15; i++) {
        sumText = (await page.getByText(/权重合计：/).first().innerText().catch(() => '')).trim();
        if (/权重合计：80%/.test(sumText)) break;
        await page.waitForTimeout(400);
      }
      if (!/权重合计：80%/.test(sumText)) {
        throw new Error('取消勾选后合计非 80%: ' + (sumText || '(空)'));
      }
      globalThis.__func01999_sumText = sumText;
  - note: 2、合计行出现「需调整为 100%」
    assert: |-
      let sumText = globalThis.__func01999_sumText || '';
      if (!sumText) {
        sumText = (await page.getByText(/权重合计：/).first().innerText().catch(() => '')).trim();
      }
      if (!/需调整为\s*100%/.test(sumText)) {
        throw new Error('合计行未提示需调整: ' + (sumText || '(空)'));
      }
      if (/校验通过/.test(sumText) && /权重合计：100%/.test(sumText)) {
        throw new Error('仍为 100% 校验通过态: ' + sumText);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  用例 FUNC-01999 备选-取消勾选「成长能力」；路由 catalog /enterprise/evaluation?workspace=competitiveness&mode=competitiveness（testdata.route）。对象空态可调权与勾选；成长能力行 .arco-checkbox 取消后合计「权重合计：80% · 需调整为 100%」（对齐 EvalConfigPanel）。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
