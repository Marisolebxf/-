    await page.goto('http://111.198.38.90:50892/enterprise/evaluation?workspace=competitiveness&mode=competitiveness', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); await page.waitForTimeout(300); const clear = page.getByRole('button', { name: '取消选择' }); if (await clear.isDisabled()) throw new Error('勾选后取消选择仍禁用'); await clear.click(); await page.waitForTimeout(400); const ok = page.getByRole('button', { name: '确定' }); if (!(await ok.isDisabled())) throw new Error('清空后确定应禁用')
