id: FUNC-00413
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00413
priority: P0
title: 点击开始分析后进入过程态且任务标识正确
story: US-ENT-EVAL-COMP
entry_id: ent-eval-compete
tier: B
preconditions:
  - env-gate select_objects=pass（对比篮≥1 家企业；不足时经企业查询补篮）
  - 权重配置有效（默认三域合计 100%）
locators:
  start: button「开始分析」/「个性化竞争力评价与输出」
  cancel: 取消任务
  later: 稍后查看
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 补篮回填→点开始分析；过程态四断言在 expect
expect:
  - note: 页面进入过程态且标题为「综合竞争力评估生成中」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRouteCatalog = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const gotoCompetePage = async () => {
        if (globalThis.__func00413_evalRoute) return globalThis.__func00413_evalRoute;
        const body0 = await page.locator('body').innerText().catch(() => '');
        const alreadyOk =
          !/404|页面不存在|抱歉/.test(body0) &&
          (await page.getByText(/企业竞争力分析|企业综合竞争力评估/).first().isVisible().catch(() => false));
        if (alreadyOk) {
          globalThis.__func00413_evalRoute = /enterprise-center\/evaluation/.test(page.url()) ? evalRoute : evalRouteCatalog;
          return globalThis.__func00413_evalRoute;
        }
        for (const route of [evalRouteCatalog, evalRoute]) {
          await page.goto(toUrl(route), { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1200);
          const body = await page.locator('body').innerText().catch(() => '');
          if (/404|页面不存在|抱歉/.test(body)) continue;
          const ok = await page.getByText(/企业竞争力分析|企业综合竞争力评估/).first().isVisible({ timeout: 15000 }).catch(() => false);
          if (ok) {
            globalThis.__func00413_evalRoute = route;
            return route;
          }
        }
        throw new Error('ENV-EDU-TTS-SVCZ-EVAL-ROUTE-001:综合竞争力工作区双路由均不可达');
      };
      const activeEvalRoute = () => globalThis.__func00413_evalRoute || evalRouteCatalog;
      const main = () => page.locator('main.diagnosis-main, main.app-main, main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 2000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const waitBasketAtLeast = async (min, ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if ((await basketEntCount()) >= min) return true;
          await page.waitForTimeout(400);
        }
        return (await basketEntCount()) >= min;
      };
      const pickerSelectableCount = async () => {
        const pickUrl = activeEvalRoute() + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
        if (!(await panel.isVisible().catch(() => false))) return 0;
        return await panel.locator('[aria-label^="选择 "]').count();
      };
      const addFromVisibleCards = async (need) => {
        let added = 0;
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        const btnN = await addBtns.count();
        for (let i = 0; i < btnN && added < need; i++) {
          const btn = addBtns.nth(i);
          if (!(await btn.isVisible().catch(() => false))) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(700);
          added++;
        }
        return added;
      };
      const ensureBasketEnterprises = async (min) => {
        if ((await basketEntCount()) >= min) return;
        let pickerN = await pickerSelectableCount();
        if (pickerN >= min) {
          await page.goto(toUrl(activeEvalRoute()), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          return;
        }
        await page.goto(toUrl('/enterprise/enterprise-search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        const searchInput = page
          .getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ })
          .or(page.getByPlaceholder(/企业名|产业|资质/))
          .first();
        if (await searchInput.isVisible().catch(() => false)) {
          await searchInput.fill('人工智能');
          const searchBtn = page.getByRole('button', { name: '搜索', exact: true }).first();
          if (await searchBtn.isVisible().catch(() => false)) {
            await searchBtn.click({ timeout: 8000 });
            await page.waitForTimeout(1200);
            await page.getByText('智能搜索结果', { exact: true }).first().waitFor({ state: 'visible', timeout: 25000 }).catch(() => {});
          }
        }
        let n = await basketEntCount();
        while (n < min) {
          const need = min - n;
          const clicked = await addFromVisibleCards(need);
          if (!clicked) break;
          await waitBasketAtLeast(min, 8000);
          n = await basketEntCount();
        }
        if (n < min) {
          pickerN = await pickerSelectableCount();
          await page.goto(toUrl(activeEvalRoute()), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          if (pickerN < min) {
            throw new Error('ENV-GATE:对比篮企业不足 ' + min + ' 家，dock=' + (await basketEntCount()) + ' picker=' + pickerN);
          }
        }
      };
      const openEnterprisePicker = async () => {
        const pickUrl = activeEvalRoute() + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
          return;
        }
        await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
      };
      const watchProcessingUi = () =>
        page.evaluate(() => {
          return new Promise((resolve, reject) => {
            const snap = () => {
              const text = document.body.innerText || '';
              const btns = [...document.querySelectorAll('button')].map((b) => b.textContent || '');
              if (/评估失败|本次评估生成失败|生成失败/.test(text) && !/综合竞争力评估生成中/.test(text)) {
                return { kind: 'failed', url: location.href, bodyText: text };
              }
              if (
                /view=processing/.test(location.href) &&
                /综合竞争力评估生成中/.test(text) &&
                /可视化分析过程/.test(text) &&
                btns.some((t) => /取消任务/.test(t)) &&
                btns.some((t) => /稍后查看/.test(t))
              ) {
                return { kind: 'running', url: location.href, bodyText: text };
              }
              return null;
            };
            const finish = (v) => {
              clearInterval(tick);
              obs.disconnect();
              resolve(v);
            };
            const hit = snap();
            if (hit) {
              resolve(hit);
              return;
            }
            const deadline = Date.now() + 20000;
            const obs = new MutationObserver(() => {
              const s = snap();
              if (s) finish(s);
            });
            obs.observe(document.body, { childList: true, subtree: true });
            const tick = setInterval(() => {
              const s = snap();
              if (s) finish(s);
              else if (Date.now() > deadline) {
                clearInterval(tick);
                obs.disconnect();
                reject(new Error('20s 内未到运行中过程态 UI'));
              }
            }, 40);
          });
        });
      const fillAndStart = async () => {
        await gotoCompetePage();
        await ensureBasketEnterprises(1);
        await page.goto(toUrl(activeEvalRoute()), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        if (!(/enterprise_codes/.test(page.url()) && await main().getByText(/来自对比篮/).first().isVisible().catch(() => false))) {
          await openEnterprisePicker();
          const panel = page.locator('.system-compare-panel, .arco-modal').filter({ hasText: '选择分析企业' }).last();
          await expect(panel).toBeVisible({ timeout: 10000 });
          const sels = panel.locator('[aria-label^="选择 "]');
          if (await sels.count() < 1) throw new Error('对比篮无可选企业');
          await sels.nth(0).click({ force: true });
          if (await sels.count() >= 2) await sels.nth(1).click({ force: true }).catch(() => {});
          await page.waitForTimeout(300);
          await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          await dismissBasket();
          await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
        }
        await page.getByRole('tab', { name: '当前分析' }).click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count()) ? startClassic : startAlt;
        if (await start.isDisabled()) {
          const mainText = await main().innerText();
          if (/预检未返回企业明细/.test(mainText)) throw new Error('开始分析禁用：预检未返回企业明细（ticket=ENV-EVAL-COMPETE-PRECHECK-001）');
          throw new Error('对象已回填但开始分析仍禁用');
        }
        const uiWait = watchProcessingUi();
        await start.click({ timeout: 8000 });
        let snap;
        try {
          snap = await uiWait;
        } catch (e) {
          const bodyText = await page.locator('body').innerText().catch(() => '');
          if (/view=processing/.test(page.url()) && /评估失败|生成失败/.test(bodyText)) {
            throw new Error('D3:Demo 任务秒失败，过程页仅「评估失败」无「综合竞争力评估生成中」（ticket=ENV-EVAL-COMPETE-PROC-001）');
          }
          throw e;
        }
        if (snap.kind === 'failed') {
          throw new Error('D3:Demo 任务秒失败，过程页仅「评估失败」无「综合竞争力评估生成中」（ticket=ENV-EVAL-COMPETE-PROC-001）');
        }
        globalThis.__func00413_snap = { url: snap.url, bodyText: snap.bodyText };
      };
      if (!globalThis.__func00413_snap) {
        await fillAndStart();
      }
      await expect(page.getByText(/综合竞争力评估生成中/).first()).toBeVisible({ timeout: 5000 });
  - note: URL 含过程视图参数与分析类型参数
    assert: |-
      const u = (globalThis.__func00413_snap && globalThis.__func00413_snap.url) || page.url();
      if (!/view=processing/.test(u)) throw new Error('URL 无 view=processing：' + u);
      if (!/analysis_type=competitiveness|mode=competitiveness/.test(u)) throw new Error('URL 无分析类型参数：' + u);
  - note: 任务标识参数为「EVAL-年月日-三位序号」形态
    assert: |-
      const u = (globalThis.__func00413_snap && globalThis.__func00413_snap.url) || page.url();
      let tid = null;
      try { tid = new URL(u).searchParams.get('task_id'); } catch {}
      const body = (globalThis.__func00413_snap && globalThis.__func00413_snap.bodyText) || '';
      if (!tid) {
        const m = body.match(/(?:DEMO-)?EVAL-\d{8}-\d{3,}/);
        if (m) tid = m[0];
      }
      if (!tid || !/^(?:DEMO-)?EVAL-\d{8}-\d{3,}$/.test(tid)) throw new Error('未见 EVAL-日期-序号 任务标识：' + u);
      globalThis.__func00413_taskId = tid;
  - note: 页面含可视化分析过程区块与「取消任务」「稍后查看」按钮
    assert: |-
      const bodyText = (globalThis.__func00413_snap && globalThis.__func00413_snap.bodyText) || await page.locator('body').innerText().catch(() => '');
      if (!/可视化分析过程/.test(bodyText)) throw new Error('未见可视化分析过程区块');
      await expect(page.getByRole('button', { name: /取消任务/ }).first()).toBeVisible({ timeout: 5000 });
      await expect(page.getByRole('button', { name: /稍后查看/ }).first()).toBeVisible({ timeout: 5000 });
      if (/综合竞争力评估生成中/.test(bodyText) && /\b100\s*%/.test(bodyText)) throw new Error('过程态不应出现 100% 伪造进度');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  回炉 rewrite-FUNC-00413：steps goto=catalog；assert 双路由 catalog→enterprise-center（同 01997/02012）。补篮 picker→/enterprise/enterprise-search（禁 /development/search）；MutationObserver 抢 running。D1·任务号 DEMO-EVAL-…；URL 分析类型 mode=competitiveness。双路由 404→ENV-EDU-TTS-SVCZ-EVAL-ROUTE-001；可达但 Demo 秒失败→ENV-EVAL-COMPETE-PROC-001。2026-10-21 机跑 rewrite-FUNC-00413 svcz 双路由 SPA 404。登录关评审 runner 前置。B 档零 allow_skip。
