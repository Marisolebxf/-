id: FUNC-00434
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00434
priority: P1
tier: B
title: 过程态取消任务后终止分析且配置保留
entry_id: ent-eval-compete
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 同册回填对象→开始分析→尽快取消任务
expect:
  - note: 1、任务终止且页面离开过程态
    assert: |-
      const main = () => page.locator('main').first();
      const evalRoute = '/enterprise/evaluation?workspace=competitiveness&mode=competitiveness';
      const pickUrl =
        evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
      const openPicker = async () => {
        const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
        if (await cta.isVisible().catch(() => false)) {
          await cta.click({ timeout: 8000 });
          await page.waitForTimeout(800);
          return;
        }
        await page.goto(pickUrl, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
      };
      const ensureObjectFilled = async () => {
        await page.getByRole('tab', { name: '当前分析' }).click({ timeout: 5000 }).catch(() => {});
        if (await main().getByText(/来自对比篮/).first().isVisible().catch(() => false)) return;
        await openPicker();
        const panel = page.locator('.arco-modal, .system-compare-panel').filter({ hasText: '选择分析企业' }).last();
        await expect(panel).toBeVisible({ timeout: 12000 });
        const pick = panel.locator('[aria-label^="选择 "]').first();
        if (!(await pick.count())) throw new Error('对比篮无可选企业');
        await pick.click({ force: true });
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 12000 });
      };
      const clickCancelAsap = async () => {
        const clicked = await page.evaluate(() => {
          return new Promise((resolve) => {
            const tryClick = () => {
              const btn = Array.from(document.querySelectorAll('button')).find((b) =>
                /取消任务/.test((b.textContent || '').trim()),
              );
              if (btn) {
                btn.click();
                resolve(true);
                return true;
              }
              return false;
            };
            if (tryClick()) return;
            const deadline = Date.now() + 18000;
            const obs = new MutationObserver(() => tryClick());
            obs.observe(document.body, { childList: true, subtree: true });
            const tick = setInterval(() => {
              if (tryClick()) {
                clearInterval(tick);
                obs.disconnect();
              } else if (Date.now() > deadline) {
                clearInterval(tick);
                obs.disconnect();
                resolve(false);
              }
            }, 30);
          });
        });
        if (!clicked) {
          const txt = await page.locator('body').innerText().catch(() => '');
          if (/评估失败|按此配置新建/.test(txt) && !/取消任务/.test(txt)) {
            throw new Error('D3:Demo 任务无 running 窗口未见取消任务（ENV-EVAL-COMPETE-PROC-001）');
          }
          throw new Error('未点到取消任务：' + txt.slice(0, 240));
        }
        await page.waitForTimeout(1200);
      };
      if (!globalThis.__func00434_done) {
        await ensureObjectFilled();
        globalThis.__func00434_urlBeforeStart = page.url();
        const start = main().getByRole('button', { name: '开始分析' });
        await expect(start).toBeEnabled({ timeout: 12000 });
        const cancelWait = clickCancelAsap();
        await start.click({ timeout: 8000 });
        await cancelWait;
        globalThis.__func00434_done = true;
      }
      const url = page.url();
      if (/view=processing/.test(url)) {
        const gen = await main().getByText('综合竞争力评估生成中').first().isVisible().catch(() => false);
        if (gen) throw new Error('取消后仍在过程态：' + url);
      }
      const body = await main().innerText().catch(() => '');
      if (/综合竞争力评估生成中/.test(body) && /取消任务/.test(body)) {
        throw new Error('取消后仍见生成中与取消任务');
      }
      globalThis.__func00434_leftProcessing = true;
  - note: 2、已回填对象与配置不被清空
    assert: |-
      if (!globalThis.__func00434_leftProcessing) throw new Error('前置：未离开过程态');
      const main = () => page.locator('main').first();
      await expect(main().getByText(/来自对比篮|评估对象/).first()).toBeVisible({ timeout: 12000 });
      const url = page.url();
      const before = globalThis.__func00434_urlBeforeStart || '';
      if (/enterprise_codes/i.test(before) && !/enterprise_codes/i.test(url)) {
        throw new Error('取消后 URL 丢失 enterprise_codes');
      }
      for (const name of ['创新能力', '经营能力', '成长能力']) {
        const row = page.getByRole('row').filter({ hasText: name }).first();
        await expect(row).toBeVisible({ timeout: 8000 });
        const spin = row.locator('[role=spinbutton], .arco-input-number input').first();
        await expect(spin).toBeVisible({ timeout: 5000 });
        const v = await spin.inputValue();
        if (!v || !/^\d+$/.test(v)) throw new Error('权重不可读：' + name);
      }
on_fail: 截图 + 抄 X-Trace-Id
