id: FUNC-02025
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02025
priority: P0
title: 只读报告点击「付费」给出导出说明且不离开报告
story: US-ENT-EVAL-RESULT
entry_id: ent-eval-compete
tier: B
preconditions:
  - 已打开成功评估的只读 HTML 报告（assert 自含：最近评估→查看 HTML 报告）
  - 当前账号未开通报告导出付费权益（30888 admin 默认未付费）
locators:
  report_eyebrow: 企业评估 · 只读报告
  paid_badge: '[data-paid-badge="required"]'
  export_locked: '[data-report-export-locked]'
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 打开只读报告后点击橙色「付费」标签；说明文案与停留报告页在 expect 判定
expect:
  - note: 1、出现「付费用户可导出报告 PDF（演示：顶栏打开「付费权益」）」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const reportRoot = () => page.locator('[data-report-readonly="true"]').first();
      const closeBasket = async () => {
        const closeB = page.locator('button[aria-label="关闭对比篮"]');
        if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
          await closeB.first().click({ timeout: 1500 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const reportReady = async () => {
        if (!/view=report/.test(page.url())) return false;
        if (await reportRoot().isVisible().catch(() => false)) return true;
        return await page.getByText(/企业评估\s*[·・]\s*只读报告/).first().isVisible().catch(() => false);
      };
      const waitReport = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await reportReady()) return true;
          await page.waitForTimeout(400);
        }
        return await reportReady();
      };
      const openReportFromHistory = async () => {
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
        const histTab = page.getByRole('tab', { name: '最近评估', exact: true });
        await expect(histTab).toBeVisible({ timeout: 12000 });
        await histTab.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        const table = main().locator('.arco-table').first();
        await expect(table).toBeVisible({ timeout: 10000 });
        const rows = table.locator('tbody tr');
        const rowCount = await rows.count();
        for (let i = 0; i < rowCount; i++) {
          const row = rows.nth(i);
          const rowText = await row.innerText().catch(() => '');
          if (!/已完成/.test(rowText)) continue;
          if (!/\d+\s*份/.test(rowText) || /0\s*份/.test(rowText)) continue;
          const htmlBtn = row.getByRole('button', { name: /查看\s*HTML\s*报告/ }).first();
          if (!(await htmlBtn.count()) || !(await htmlBtn.isVisible().catch(() => false))) continue;
          if (!(await htmlBtn.isEnabled().catch(() => false))) continue;
          await htmlBtn.scrollIntoViewIfNeeded().catch(() => {});
          await htmlBtn.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          const tNav = Date.now();
          while (Date.now() - tNav < 25000 && !/view=report/.test(page.url())) {
            await page.waitForTimeout(400);
          }
          if (await waitReport(45000)) {
            globalThis.__func02025_report = true;
            return;
          }
        }
        const attrBtn = main().locator('[data-eval-history-open-html-report]:not(.arco-btn-disabled)').first();
        if (await attrBtn.count() && await attrBtn.isVisible().catch(() => false) && await attrBtn.isEnabled().catch(() => false)) {
          await attrBtn.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          if (await waitReport(45000)) {
            globalThis.__func02025_report = true;
            return;
          }
        }
        throw new Error('ENV-GATE:最近评估无「已完成且报告份数>0」可点「查看 HTML 报告」的行');
      };
      await openReportFromHistory();
      await expect(page).toHaveURL(/view=report/, { timeout: 10000 });
      const locked = page.locator('[data-report-export-locked]').first();
      await expect(locked).toBeVisible({ timeout: 8000 });
      const paidTag = locked.locator('[data-paid-badge="required"]').first();
      await expect(paidTag).toBeVisible({ timeout: 5000 });
      await expect(paidTag).toContainText('付费');
      const backBtn = page.getByRole('button', { name: '返回评估结果' }).first();
      await expect(backBtn).toBeVisible({ timeout: 8000 });
      globalThis.__func02025_url = page.url();
      await paidTag.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await paidTag.hover({ timeout: 5000 }).catch(() => {});
      await page.waitForTimeout(500);
      const tipRe = /付费用户可导出报告 PDF.*付费权益/;
      let tipText = '';
      const tips = page.locator('.arco-tooltip-content:visible, .arco-trigger-popup:visible .arco-tooltip-content');
      const tipN = await tips.count();
      for (let i = 0; i < tipN; i++) {
        const t = (await tips.nth(i).innerText().catch(() => '')) || '';
        if (tipRe.test(t)) {
          tipText = t;
          break;
        }
      }
      if (!tipText) {
        const body = (await page.locator('body').innerText().catch(() => '')) || '';
        if (tipRe.test(body)) tipText = body.match(tipRe)[0];
      }
      if (!tipText) {
        throw new Error('点击「付费」后未见导出说明 Tooltip（期望含「付费用户可导出报告 PDF」与「付费权益」）');
      }
      globalThis.__func02025_tip = tipText;
  - note: 2、页面仍停留在该只读报告
    assert: |-
      if (!globalThis.__func02025_report) throw new Error('前置：只读报告未打开');
      await expect(page).toHaveURL(/view=report/, { timeout: 8000 });
      const reportRoot = page.locator('[data-report-readonly="true"]').first();
      await expect(reportRoot).toBeVisible({ timeout: 10000 });
      await expect(page.getByText(/企业评估\s*[·・]\s*只读报告/).first()).toBeVisible({ timeout: 8000 });
      const backBtn = page.getByRole('button', { name: '返回评估结果' }).first();
      await expect(backBtn).toBeVisible({ timeout: 8000 });
      const locked = page.locator('[data-report-export-locked]').first();
      await expect(locked).toBeVisible({ timeout: 5000 });
      if (globalThis.__func02025_url && !/view=report/.test(page.url())) {
        throw new Error('点击付费后离开报告页：' + page.url());
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  02025 主流程-报告付费说明：只读报告顶栏「返回评估结果」与「导出」之间的 orangered「付费」Tag（data-paid-badge=required）。点击/hover 后 Tooltip 原文「付费用户可导出报告 PDF（演示：顶栏打开「付费权益」）」；不导航离开 view=report。前置同 02014 从最近评估打开 HTML 报告。30888 /enterprise-center/evaluation competitiveness。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。
