id: FUNC-00418
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00418
priority: P0
title: 结果态展示综合竞争力排名且默认按得分降序
story: US-ENT-EVAL-RESULT
entry_id: ent-eval-compete
tier: B
preconditions:
  - 已处于结果态；评估对象含至少 2 家企业（as-built：最近评估→恢复结果；无记录则对比篮选≥2 家后分析）
locators:
  rank_section: 综合竞争力排名
  rank_tag: tag「N 家企业」
steps:
  - action: goto
    target: /enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness
  - action: evaluate
    note: 浏览「综合竞争力排名」区块；导航与判定在 expect
expect:
  - note: 1、排名区块列出各企业名次（条形图按名次自上而下展示，含对象家数标签）
    assert: |-
      const main = () => page.locator('main.diagnosis-main, main.app-main').first();
      const dismissBasket = async () => {
        const close = page.locator('button[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const onResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return /综合竞争力评估结果/.test(t);
      };
      const objectCountFromSummary = async () => {
        const t = await main().innerText().catch(() => '');
        const m = t.match(/对象[：:]\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : 0;
      };
      const runConfigToResult = async () => {
        const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
        const toUrl = (p) => origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
        const evalRoute = '/enterprise-center/evaluation?workspace=competitiveness&mode=competitiveness';
        const basketEntCount = async () => {
          const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
          if (!(await dockBtn.count())) return 0;
          const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
          const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
          return entM ? parseInt(entM[1], 10) : 0;
        };
        const ensureBasketEnterprises = async (min) => {
          let n = await basketEntCount();
          if (n >= min) return;
          await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await dismissBasket();
          const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
          await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
          while (n < min) {
            const idx = Math.min(n, (await addBtns.count()) - 1);
            await addBtns.nth(idx).click({ timeout: 8000 });
            await page.waitForTimeout(700);
            n = await basketEntCount();
            if (n < min && idx >= (await addBtns.count()) - 1) break;
          }
          if (n < min) throw new Error('ENV-GATE:对比篮企业不足');
        };
        const openEnterprisePicker = async () => {
          const pickUrl = evalRoute + '&open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise';
          const cta = main().getByRole('button', { name: '前往对比篮选择企业' });
          if (await cta.isVisible().catch(() => false)) {
            await cta.click({ timeout: 8000 });
            await page.waitForTimeout(1200);
            return;
          }
          await page.goto(toUrl(pickUrl), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
        };
        const bodyResultReady = async () => {
          if (!/view=result/.test(page.url())) return false;
          return await page.getByRole('heading', { name: '综合竞争力评估结果' }).first().isVisible().catch(() => false)
            || await page.getByText(/综合竞争力评估结果/).first().isVisible().catch(() => false);
        };
        const waitForCompeteResult = async () => {
          const t0 = Date.now();
          while (Date.now() - t0 < 180000) {
            if (await bodyResultReady()) return;
            const showBtn = main().getByRole('button', { name: /查看评估结果/ });
            if (await showBtn.first().isVisible().catch(() => false)) {
              await showBtn.first().click({ timeout: 8000 });
              await page.waitForTimeout(2500);
              if (await bodyResultReady()) return;
            }
            const u = page.url();
            const tid = (() => { try { return new URL(u).searchParams.get('task_id'); } catch { return null; } })();
            if (tid && /view=processing/.test(u)) {
              await page.goto(toUrl(evalRoute + '&view=result&analysis_type=competitiveness&task_id=' + encodeURIComponent(tid)), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2500);
              if (await bodyResultReady()) return;
            }
            const tx = await main().innerText().catch(() => '');
            if (/评估失败|生成失败|本次评估生成失败/.test(tx)) throw new Error('分析终态失败');
            await page.waitForTimeout(2000);
          }
          throw new Error('180s 内未到结果态');
        };
        await ensureBasketEnterprises(2);
        await page.goto(toUrl(evalRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await openEnterprisePicker();
        const panel = page.locator('.system-compare-panel');
        await expect(panel).toBeVisible({ timeout: 10000 });
        const sels = panel.locator('[aria-label^="选择 "]');
        const selCount = await sels.count();
        if (selCount < 2) throw new Error('对比篮可选企业不足2家');
        await sels.nth(0).click({ force: true });
        await page.waitForTimeout(300);
        await sels.nth(1).click({ force: true });
        await page.waitForTimeout(300);
        await panel.getByRole('button', { name: '确定', exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        const startClassic = main().getByRole('button', { name: '开始分析' });
        const startAlt = main().getByRole('button', { name: '个性化竞争力评价与输出' }).last();
        const start = (await startClassic.count()) ? startClassic : startAlt;
        if (await start.isDisabled()) throw new Error('开始分析禁用');
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await waitForCompeteResult();
      };
      const ensureResultPage = async () => {
        if (globalThis.__func00418_onResult) return;
        if (await onResult()) {
          const n = await objectCountFromSummary();
          if (n >= 2) {
            globalThis.__func00418_onResult = true;
            globalThis.__func00418_objectN = n;
            return;
          }
        }
        await dismissBasket();
        await expect(page.getByText('最近评估', { exact: true }).first()).toBeVisible({ timeout: 12000 });
        await page.getByText('最近评估', { exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const restore = page.getByRole('button', { name: '恢复结果' });
        const hasRestore = (await restore.count()) > 0 && await restore.first().isVisible().catch(() => false);
        if (hasRestore) {
          await restore.first().click({ timeout: 8000 });
          const t0 = Date.now();
          while (Date.now() - t0 < 45000) {
            if (await onResult()) break;
            await page.waitForTimeout(500);
          }
        } else {
          await page.getByText('当前分析', { exact: true }).first().click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(500);
          await runConfigToResult();
        }
        await expect(page).toHaveURL(/view=result/);
        await expect(page.getByText(/综合竞争力评估结果/).first()).toBeVisible({ timeout: 15000 });
        const n = await objectCountFromSummary();
        if (n < 2) throw new Error('恢复结果对象仅' + n + '家，不足用例前置2家');
        globalThis.__func00418_onResult = true;
        globalThis.__func00418_objectN = n;
      };
      const scrollToRank = async () => {
        for (let i = 0; i < 50; i++) {
          const el = main().getByText('综合竞争力排名', { exact: true }).first();
          if (await el.count() && await el.isVisible().catch(() => false)) return;
          await page.mouse.wheel(0, 600);
          await page.waitForTimeout(400);
        }
        throw new Error('滚动后未见「综合竞争力排名」');
      };
      const readCompeteRank = async () => {
        let out = null;
        for (let i = 0; i < 25 && !out; i++) {
          out = await page.evaluate(() => {
            const own = (w) =>
              [...document.querySelectorAll('*')].find((e) =>
                [...e.childNodes].some((c) => c.nodeType === 3 && String(c.textContent).trim() === w),
              ) || [...document.querySelectorAll('*')].find((e) => e.children.length === 0 && (e.textContent || '').trim() === w);
            const t = own('综合竞争力排名');
            if (!t) return { ok: false, reason: '无排名标题' };
            let b = null;
            let p = t;
            for (let j = 0; j < 16 && p; j++) {
              const tx = p.innerText || '';
              if (tx.includes('综合竞争力排名') && p.querySelector('canvas')) b = p;
              p = p.parentElement;
            }
            if (!b) {
              let q = t;
              for (let j = 0; j < 14 && q; j++) {
                q = q.parentElement;
                if (q && q.querySelector('canvas')) { b = q; break; }
              }
            }
            const canvases = b ? [...b.querySelectorAll('canvas')] : [];
            if (!canvases.length) return { ok: false, reason: '排名区块无 canvas' };
            const blockText = (b.innerText || '').replace(/\s+/g, ' ');
            const tagM = blockText.match(/(\d+)\s*家企业/);
            const pickBarInst = () => {
              const ec = window.echarts;
              if (!ec || !ec.getInstanceByDom) return null;
              for (let ci = canvases.length - 1; ci >= 0; ci--) {
                const host = canvases[ci].parentElement;
                if (!host) continue;
                const inst = ec.getInstanceByDom(host);
                if (!inst) continue;
                const opt = inst.getOption() || {};
                const ser = (opt.series || []).find((s) => s && s.type === 'bar');
                if (!ser) continue;
                const vals = (ser.data || [])
                  .map((d) => (typeof d === 'object' ? Number(d.value) : Number(d)))
                  .filter((v) => v > 0 && !Number.isNaN(v));
                if (vals.length >= 2) return { inst, vals, names: ((opt.yAxis || [])[0]?.data || []).map(String).filter(Boolean) };
              }
              return null;
            };
            const picked = pickBarInst();
            if (picked) {
              const { vals, names } = picked;
              return { ok: true, via: 'echarts', entN: tagM ? parseInt(tagM[1], 10) : vals.length, vals, names, barCount: vals.length };
            }
            const nums = [...blockText.matchAll(/\b(\d{2,3}(?:\.\d)?)\b/g)].map((m) => Number(m[1])).filter((v) => v >= 40 && v <= 100);
            const uniq = [...new Set(nums)];
            if (uniq.length >= 2) {
              const asc = [...uniq].sort((a, b) => a - b);
              return { ok: true, via: 'text_proxy', entN: tagM ? parseInt(tagM[1], 10) : asc.length, vals: asc, names: [], barCount: asc.length };
            }
            return { ok: false, reason: 'echarts 不可用且文本未解析到得分' };
          });
          if (!out || !out.ok) await page.waitForTimeout(1000);
        }
        return out;
      };
      await ensureResultPage();
      await scrollToRank();
      const rankTitle = main().getByText('综合竞争力排名', { exact: true }).first();
      await expect(rankTitle).toBeVisible({ timeout: 12000 });
      await rankTitle.scrollIntoViewIfNeeded();
      await page.waitForTimeout(1200);
      const empty = main().getByText('暂无排名数据');
      if (await empty.isVisible().catch(() => false)) throw new Error('排名区为空');
      const entFromSummary = globalThis.__func00418_objectN || await objectCountFromSummary();
      let entN = entFromSummary;
      if (await main().getByText(/\d+\s*家企业/).count()) {
        const tx = (await main().getByText(/\d+\s*家企业/).first().innerText()) || '';
        const tm = tx.match(/(\d+)\s*家/);
        if (tm) entN = parseInt(tm[1], 10);
      }
      if (entN < 2) throw new Error('排名对象企业数不足2：' + entN);
      globalThis.__func00418_rankN = entN;
      await expect(main().getByText(new RegExp(entN + '\\s*家企业')).first()).toBeVisible({ timeout: 8000 });
      const rank = await readCompeteRank();
      if (!rank || !rank.ok) throw new Error('排名条形未就绪: ' + (rank && rank.reason ? rank.reason : 'timeout'));
      if (rank.barCount < 2) throw new Error('排名条不足2：' + rank.barCount);
      globalThis.__func00418_rankData = rank;
  - note: 2、默认按综合竞争力得分降序排列（图顶至底得分非增序，等同名次 1→N）
    assert: |-
      if (!globalThis.__func00418_onResult) throw new Error('前置：结果页未就绪');
      const rank = globalThis.__func00418_rankData;
      if (!rank || !rank.ok) throw new Error('前置：排名数据未解析');
      const arr = rank.vals;
      if (!arr || arr.length < 2) throw new Error('得分序列不足2项');
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] < arr[i - 1]) throw new Error('category 轴序得分非升序：' + arr.join(','));
      }
      const visualDesc = [...arr].reverse();
      for (let i = 1; i < visualDesc.length; i++) {
        if (visualDesc[i] > visualDesc[i - 1]) throw new Error('图顶至底非降序：' + arr.join(','));
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: |-
  00418 结果·综合竞争力排名。30888 路由 /enterprise-center/evaluation。UI 为 EvalRankingChart 条形图（非表格名次列）；名次由自上而下顺序体现，extra 为「N 家企业」tag。rows 源数据已按 score 降序（buildRankedEvaluationRows）。前置同 01991/01992/00416：最近评估→恢复结果，对象<2 则对比篮选≥2 再分析。登录与关内部评审由 runner 会话前置。tier B，零 allow_skip。
