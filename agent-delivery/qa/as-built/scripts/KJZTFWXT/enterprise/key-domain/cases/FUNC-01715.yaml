id: FUNC-01715
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01715
priority: P1
title: 全选当前筛选结果已选等于列出家数
story: US-KEYENT-01
entry_id: ent-key-domain
tier: B
preconditions:
  - env-gate overall=pass
  - 「选择分析企业」已打开（assert 可自含入篮与打开选择器）
  - 当前列出至少一家企业
locators:
  picker_title: text「选择分析企业」
  select_all: checkbox aria-label「全选当前筛选结果」
  enterprise_row: '[aria-label^="选择 "]'
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  - action: wait
    timeout_ms: 800
  - action: evaluate
    note: 打开选择器后点「全选当前筛选结果」；已选与结果态在 expect 判定
expect:
  - note: 1、已选家数等于当前列出的企业家数；2、尚未出现「领域布局概览」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => (String(p).startsWith('http') ? p : origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p));
      const route = '/enterprise-center/key-enterprise-analysis?workspace=domain&view=domain';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(350); }
        }
      };
      const gotoRoute = async () => {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, await addBtns.count() - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(800);
          n = await basketEntCount();
          if (n < min && idx >= await addBtns.count() - 1) break;
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const clickPageOpenPicker = async () => {
        const main = page.locator('main');
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        const openBtn = main.getByRole('button', { name: '打开对比篮', exact: true });
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await pickBtn.count() && await pickBtn.first().isVisible().catch(() => false)) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await openBtn.count() && await openBtn.first().isVisible().catch(() => false)) {
          await openBtn.first().click({ timeout: 8000 });
        } else if (await emptyCta.count()) {
          await emptyCta.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到选择分析企业/打开对比篮入口');
        }
        await page.waitForTimeout(800);
      };
      const pickerRoot = () => page.locator('.system-compare-panel:visible, .arco-modal:visible').filter({ hasText: '选择分析企业' }).last();
      const countListedEnterprises = async () => {
        const root = pickerRoot();
        const scope = (await root.count()) ? root : page.locator('body');
        const sels = scope.locator('[aria-label^="选择 "]');
        const n = await sels.count();
        if (n < 1) throw new Error('选择器未列出企业');
        return n;
      };
      const readPickerSelectedCount = async () => {
        const panel = pickerRoot();
        const scope = (await panel.count()) ? panel : page.locator('body');
        const txt = (await scope.innerText().catch(() => '')) || '';
        const liveM = txt.match(/当前已选择\s*(\d+)\s*家企业/);
        if (liveM) return parseInt(liveM[1], 10);
        const sels = page.locator('[aria-label^="选择 "]');
        let checked = 0;
        for (let i = 0; i < await sels.count(); i++) {
          if ((await sels.nth(i).getAttribute('aria-checked')) === 'true') checked++;
        }
        return checked;
      };
      const resultOverviewVisible = async () => {
        if (await page.getByRole('heading', { name: '领域布局概览' }).count()) return true;
        const kpi = page.getByText('已覆盖领域', { exact: true });
        if ((await kpi.count()) && await kpi.first().isVisible().catch(() => false)) {
          const bar = page.getByText(/来自对比篮\s*·\s*\d+\s*家/);
          if (await bar.count()) return true;
        }
        return false;
      };
      await gotoRoute();
      await ensureBasketEnterprises(1);
      await gotoRoute();
      await clickPageOpenPicker();
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      const listed = await countListedEnterprises();
      const root = pickerRoot();
      const selectAll = root.locator('[aria-label="全选当前筛选结果"]').first();
      if (!(await selectAll.count())) {
        const fallback = page.getByRole('checkbox', { name: '全选当前筛选结果' });
        await expect(fallback.first()).toBeVisible({ timeout: 8000 });
        await fallback.first().click({ timeout: 8000 });
      } else {
        await expect(selectAll).toBeVisible({ timeout: 8000 });
        await selectAll.click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      const selected = await readPickerSelectedCount();
      if (selected !== listed) {
        throw new Error('全选后已选 ' + selected + ' 家，列出 ' + listed + ' 家');
      }
      if (await resultOverviewVisible()) {
        throw new Error('全选后不应进入结果态（领域布局概览/已覆盖领域 KPI）');
      }
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 5000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 用例 01715 前置「选择分析企业」已打开；脚本自含入篮与打开页内选择器。列出家数计 picker 内 aria-label「选择 *」行数；全选点 aria-label「全选当前筛选结果」。结果态未进以无 heading「领域布局概览」且无「来自对比篮·N家」+「已覆盖领域」同屏。登录与关内部评审由 runner 会话前置。B 档。
