id: FUNC-01721
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01721
priority: P1
title: 清空对比篮弹框点取消后企业仍在
story: US-KEYENT-01
entry_id: ent-key-domain
tier: B
preconditions:
  - env-gate overall=pass
  - 「选择分析企业」已列出企业（assert 可自含入篮与打开选择器）
locators:
  picker_title: text「选择分析企业」
  clear_basket_btn: button「清空对比篮」
  modal_cancel: 弹框 button「取消」
  enterprise_card: .ent-compare-item-card
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  - action: wait
    timeout_ms: 800
  - action: evaluate
    note: 打开选择器后点「清空对比篮」→ 弹框点「取消」；文案与名单在 expect 判定
expect:
  - note: 1、弹出框说明将清空篮内企业；2、弹出框说明不会删除企业数据；3、取消后这些企业仍在
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => (String(p).startsWith('http') ? p : origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p));
      const route = '/enterprise-center/key-enterprise-analysis?workspace=domain&view=domain';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(350); }
        }
      };
      const gotoRoute = async () => {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, await addBtns.count() - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(900);
          n = await basketEntCount();
          if (n < min && idx >= await addBtns.count() - 1) break;
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const clickPageOpenPicker = async () => {
        const main = page.locator('main');
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        const openBtn = main.getByRole('button', { name: '打开对比篮', exact: true });
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        const adjustBtn = main.getByRole('button', { name: '打开对比篮调整对象', exact: true });
        if (await pickBtn.count() && await pickBtn.first().isVisible().catch(() => false)) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await adjustBtn.count() && await adjustBtn.first().isVisible().catch(() => false)) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await openBtn.count() && await openBtn.first().isVisible().catch(() => false)) {
          await openBtn.first().click({ timeout: 8000 });
        } else if (await emptyCta.count()) {
          await emptyCta.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到选择分析企业/打开对比篮入口');
        }
        await page.waitForTimeout(800);
      };
      const visiblePanel = () => page.locator('.system-compare-panel:visible').last();
      const listEnterpriseNames = async (scope) => {
        const names = [];
        const cards = scope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        for (let i = 0; i < cardN; i++) {
          const card = cards.nth(i);
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = scope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      await gotoRoute();
      await ensureBasketEnterprises(1);
      await gotoRoute();
      await clickPageOpenPicker();
      await expect(page.getByText('从对比篮勾选本页分析对象').first()).toBeVisible({ timeout: 12000 });
      const panel = visiblePanel();
      await expect(panel).toBeVisible({ timeout: 8000 });
      const scope = panel;
      const beforeNames = await listEnterpriseNames(scope);
      if (beforeNames.length < 1) throw new Error('篮内应有至少 1 张企业卡，实际 0');
      const clearBtn = scope.getByRole('button', { name: '清空对比篮', exact: true });
      await expect(clearBtn.first()).toBeVisible({ timeout: 8000 });
      await clearBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '清空对比篮' }).last();
      await expect(modal).toBeVisible({ timeout: 10000 });
      await expect(modal.getByText('清空对比篮', { exact: true }).first()).toBeVisible();
      const bodyText = (await modal.innerText()).replace(/\s+/g, ' ');
      if (!/确认清空.*篮内.*企业|清空篮内.*企业/.test(bodyText)) {
        throw new Error('弹框未说明将清空篮内企业，正文：' + bodyText.slice(0, 120));
      }
      if (!bodyText.includes('不会删除企业数据')) {
        throw new Error('弹框未说明不会删除企业数据，正文：' + bodyText.slice(0, 120));
      }
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 8000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const afterNames = await listEnterpriseNames(scope);
      if (afterNames.length !== beforeNames.length) {
        throw new Error(`取消后卡数应保持 ${beforeNames.length}，实际 ${afterNames.length}`);
      }
      for (const name of beforeNames) {
        if (!afterNames.includes(name)) {
          throw new Error('取消后企业不在篮内：' + name);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 用例 01721；Modal.confirm 标题「清空对比篮」、正文「确认清空篮内全部企业吗？此操作不会删除企业数据。」（EnterpriseCompareBasketView.confirmClearBasket）。取消不关篮；确定清空归其他用例。流程对齐 01716–020。登录与关内部评审由 runner 会话前置。B 档。
