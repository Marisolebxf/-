id: FUNC-01699
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01699
priority: P0
title: 企业详情知识产权页签专利表头
story: US-KEYENT-01
entry_id: ent-key-domain
tier: B
preconditions:
  - env-gate overall=pass
  - 已打开「企业详情」（assert 自含领域结果页或企业查询打开）
locators:
  section: main 内「重点领域分布」
  evidence_drawer: .arco-drawer:visible 含「为什么识别为」
  detail_btn: 依据抽屉 footer button「企业详情」
  detail_drawer: .arco-drawer:visible 标题「企业详情」
  tab_patent: 企业详情抽屉 tab「知识产权」
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  - action: wait
    timeout_ms: 800
  - action: evaluate
    note: 打开企业详情后点「知识产权」；表头在 expect 判定
expect:
  - note: 1、表头含专利名称、类型、日期、状态
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => (String(p).startsWith('http') ? p : origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p));
      const route = '/enterprise-center/key-enterprise-analysis?workspace=domain&view=domain';
      const kpiNames = ['已覆盖领域', '涉及企业', '跨领域企业', '识别依据'];
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(350); }
        }
      };
      const ensureDomainPage = async () => {
        if ((await page.getByText('404 Not Found').count()) > 0 || !/key-enterprise-analysis/.test(page.url())) {
          await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(600);
        }
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/共\s*(\d+)\s*项/) || dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const addOneEntFromSearch = async () => {
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await closeBasket();
        const addBtn = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtn.first()).toBeVisible({ timeout: 15000 });
        await addBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(900);
        if (await basketEntCount() < 1) throw new Error('入篮后对比篮仍为空');
      };
      const clickPageOpenBasket = async () => {
        const main = page.locator('main');
        const adjustBtn = main.getByRole('button', { name: '打开对比篮调整对象', exact: true });
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        const openBtn = main.getByRole('button', { name: '打开对比篮', exact: true });
        const ctaBtn = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await adjustBtn.count() && await adjustBtn.first().isVisible().catch(() => false)) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await pickBtn.count() && await pickBtn.first().isVisible().catch(() => false)) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await openBtn.count() && await openBtn.first().isVisible().catch(() => false)) {
          await openBtn.first().click({ timeout: 8000 });
        } else if (await ctaBtn.count()) {
          await ctaBtn.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到选择分析企业/打开对比篮入口');
        }
      };
      const fillResultViaPicker = async () => {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        await clickPageOpenBasket();
        await page.waitForTimeout(800);
        const sels = page.locator('[aria-label^="选择 "]');
        if (!(await sels.count())) throw new Error('选择器无可勾选企业');
        await sels.first().click();
        await page.waitForTimeout(400);
        const confirmBtn = page.getByRole('button', { name: '确定' });
        for (let t = 0; t < 25 && (await confirmBtn.first().isDisabled().catch(() => true)); t++) await page.waitForTimeout(200);
        if (await confirmBtn.first().isDisabled().catch(() => true)) throw new Error('确定仍禁用');
        await confirmBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(4000);
      };
      const hasResultKpis = async () => {
        for (const n of kpiNames) {
          if (!(await page.getByText(n, { exact: true }).count())) return false;
        }
        return true;
      };
      const distScope = () => {
        const label = page.locator('main').getByText('重点领域分布', { exact: true }).first();
        return label.locator('xpath=ancestor::section[1]');
      };
      const detailDrawer = async () => {
        const detail = page.locator('.arco-drawer:visible').filter({
          has: page.locator('.arco-drawer-header').filter({ hasText: '企业详情' }),
        }).last();
        await expect(detail).toBeVisible({ timeout: 15000 });
        await expect(detail.locator('.arco-drawer-header')).toContainText('企业详情');
        return detail;
      };
      const openEnterpriseDetailViaEvidence = async () => {
        const scope = distScope();
        const scopeCount = await scope.count();
        const main = page.locator('main');
        const evidenceBtns = (scopeCount ? scope : main).getByRole('button', { name: '查看识别依据', exact: true });
        if (!(await evidenceBtns.count())) throw new Error('分布表无「查看识别依据」按钮');
        let btn = null;
        for (let i = 0; i < await evidenceBtns.count(); i++) {
          const b = evidenceBtns.nth(i);
          if (!(await b.isDisabled().catch(() => true))) { btn = b; break; }
        }
        if (!btn) throw new Error('分布表「查看识别依据」均禁用');
        await btn.scrollIntoViewIfNeeded().catch(() => {});
        await btn.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const whyDrawer = page.locator('.arco-drawer:visible').filter({ hasText: /为什么识别为/ }).last();
        await expect(whyDrawer).toBeVisible({ timeout: 10000 });
        const detailEntry = whyDrawer.getByRole('button', { name: '企业详情', exact: true });
        await expect(detailEntry).toBeVisible({ timeout: 8000 });
        await detailEntry.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        return detailDrawer();
      };
      const openEnterpriseDetailFromSearch = async () => {
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        let card = page.locator('main').locator('[class*=result], [class*=card], .arco-list-item, article, li').filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) }).first();
        if (!(await card.count())) {
          const rec = page.locator('main').locator('section').filter({ hasText: '推荐企业' }).first();
          card = rec.locator('div').filter({ has: page.getByRole('button', { name: '查看画像', exact: true }) }).first();
        }
        if (!(await card.count())) throw new Error('企业查询无可点企业卡');
        const nameBtn = card.locator('button').filter({ hasText: /有限公司|股份|集团|有限责任公司/ }).first();
        await expect(nameBtn).toBeVisible({ timeout: 12000 });
        await nameBtn.click({ timeout: 8000 });
        await page.waitForTimeout(700);
        return detailDrawer();
      };
      const openEnterpriseDetail = async () => {
        try {
          return await openEnterpriseDetailViaEvidence();
        } catch (e) {
          return openEnterpriseDetailFromSearch();
        }
      };
      await ensureDomainPage();
      await closeBasket();
      if (!(await hasResultKpis())) {
        if (await basketEntCount() < 1) await addOneEntFromSearch();
        await fillResultViaPicker();
      }
      await expect(page.getByText(/来自对比篮\s*·\s*\d+\s*家/).first()).toBeVisible({ timeout: 12000 });
      const detail = await openEnterpriseDetail();
      const patentTab = detail.getByRole('tab', { name: '知识产权' });
      await expect(patentTab).toBeVisible({ timeout: 8000 });
      await patentTab.scrollIntoViewIfNeeded();
      await patentTab.click({ timeout: 8000 });
      await page.waitForTimeout(450);
      await expect(detail.locator('.arco-drawer-header-title')).toHaveText('企业详情');
      for (const label of ['专利名称', '类型', '日期', '状态']) {
        await expect(detail.locator('th').filter({ hasText: new RegExp('^' + label + '$') })).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 领域结果态回填对齐 01697/01695（main 内 text 定位分布区，非 heading role）。优先识别依据→「企业详情」，依据均禁用时回退企业查询点企业名开详情。知识产权四列表头与用例一致；空态仍验表头。登录与关内部评审由 runner 会话前置。B 档。
