id: FUNC-01708
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01708
priority: P1
tier: B
title: 主流程-查看画像
entry_id: ent-key-domain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?workspace=domain&view=domain
  - action: evaluate
    note: 同册 01690/01688/01711 打开「选择分析企业」并点击篮内「查看画像」
expect:
  - note: 1、抽屉标题为「企业画像快览」
    assert: |-
      const main = page.locator('main');
      const adjustBtn = main.getByRole('button', { name: '打开对比篮调整对象' });
      const openBtn = main.getByRole('button', { name: '打开对比篮' });
      const ctaBtn = main.getByRole('button', { name: '前往对比篮选择企业' });
      if (await adjustBtn.isVisible().catch(() => false)) {
        await adjustBtn.click();
      } else if (await openBtn.isVisible().catch(() => false)) {
        await openBtn.click();
      } else {
        await ctaBtn.click();
      }
      await expect(page.getByText('选择分析企业', { exact: true })).toBeVisible({ timeout: 15000 });
      const entSel = page.locator('[aria-label^="选择 "]').first();
      await expect(entSel).toBeVisible({ timeout: 12000 });
      const entLabel = ((await entSel.getAttribute('aria-label')) || '').replace(/^选择\s*/, '').trim();
      if (!entLabel) throw new Error('无法读取篮内企业名称');
      await page.evaluate((name) => {
        window.__func01708_ent = name;
      }, entLabel);
      const profileBtn = page.getByRole('button', { name: '查看画像', exact: true }).first();
      await expect(profileBtn).toBeVisible({ timeout: 12000 });
      await profileBtn.click();
      const drawer = page.locator('.arco-drawer').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer).toBeVisible({ timeout: 15000 });
      await expect(drawer.locator('.arco-drawer-title, .arco-drawer-header').first()).toContainText('企业画像快览');
  - note: 2、名称是所点企业
    assert: |-
      const entLabel = await page.evaluate(() => window.__func01708_ent || '');
      const drawer = page.locator('.arco-drawer').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer).toBeVisible();
      const shortEnt = entLabel.slice(0, Math.min(8, entLabel.length));
      await expect(drawer).toContainText(shortEnt);
  - note: 3、含基础摘要、竞争力摘要、风险摘要
    assert: |-
      const drawer = page.locator('.arco-drawer').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer.getByText('基础摘要', { exact: true })).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('竞争力摘要', { exact: true })).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('风险摘要', { exact: true })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
