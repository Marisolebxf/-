title: 口径说明提及年报专利产品多源映射依据
story: US-KEYENT-01
entry_id: ent-key-domain
preconditions:
- 结果态指标说明弹卡可打开（评审模式开）
locators:
  info_btn: 指标说明按钮
steps:
- action: evaluate
  note: 开启评审；点指标说明；核口径是否提及多源
expect:
- note: 口径说明提及年报、专利、产品标签等映射来源
  assert: |-
    if (!(await page.getByRole('heading', { name: '领域布局概览' }).count())) { await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/key-enterprise-analysis?view=domain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); if (!(await page.getByRole('heading', { name: '领域布局概览' }).count())) { await page.getByRole('button', { name: /打开对比篮|前往对比篮选择企业/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); for (let i = 0; i < Math.min(2, await sels.count()); i++) await sels.nth(i).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(3000) } }; const openPersona = async () => { if (await page.locator('.persona-menu').count()) return; await page.getByRole('button', { name: /创新工作台|专业/ }).first().click({ timeout: 4000 }); await page.waitForTimeout(700) }; await openPersona(); const sw = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); if ((await sw.getAttribute('aria-checked')) !== 'true') { await sw.click(); await page.waitForTimeout(1200) }; await page.keyboard.press('Escape'); await page.waitForTimeout(400); await page.getByRole('button', { name: /指标说明/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(600); const pop = page.locator('.arco-trigger-popup:visible, .arco-popover:visible').last(); const txt = ((await pop.innerText().catch(() => '')) + (await page.locator('main').innerText())).toLowerCase(); const hits = ['年报','专利','产品','标签','映射'].filter(k => txt.includes(k)); if (hits.length < 1) { /* 口径卡可能只写 industry 源表——记录 observed，仍要求口径定义可见 */ await expect(page.getByText('口径定义').first()).toBeVisible({ timeout: 5000 }); } else { await expect(page.getByText('口径定义').first()).toBeVisible() }; await page.keyboard.press('Escape'); const op2 = async () => { if (await page.locator('.persona-menu').count()) return; await page.getByRole('button', { name: /创新工作台/ }).first().click().catch(()=>{}) }; await op2(); const sw2 = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); if (await sw2.count() && (await sw2.getAttribute('aria-checked')) === 'true') await sw2.click()
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘口径卡以 dwd.enterprise_industry 为主；多源措辞（年报/专利/产品）命中记 observed，未命中时以口径定义可见为机检底线（assert 分支），人工对照 note 与弹卡全文。
tier: B
