id: FUNC-01689
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01689
priority: P1
tier: B
title: 系统对比篮发起领域分布分析进入结果页
entry_id: ent-key-domain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?workspace=domain&view=domain
  - action: evaluate
    note: 系统对比篮勾选企业并发起领域分布分析（对应用例步骤 1～5）
    assert: |-
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click();
            await page.waitForTimeout(350);
          }
        }
      };
      await closeBasket();
      const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
      await expect(dockBtn).toBeVisible({ timeout: 12000 });
      await dockBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page.getByText('系统对比篮').first()).toBeVisible({ timeout: 8000 });
      const entTab = page.getByRole('tab', { name: '企业', exact: true });
      if (await entTab.count()) await entTab.first().click();
      await page.waitForTimeout(400);
      const basketMain = page.locator('.arco-drawer-body, .compare-basket-panel').last();
      let picked = false;
      for (const sel of [
        basketMain.locator('[aria-label^="选择 "]'),
        basketMain.locator('.arco-checkbox:not(.arco-checkbox-disabled)'),
        page.locator('.arco-drawer-body [aria-label^="选择 "]'),
      ]) {
        if (await sel.count()) {
          await sel.first().click({ timeout: 5000 });
          picked = true;
          break;
        }
      }
      if (!picked) throw new Error('对比篮企业页签内无企业可勾选');
      await page.waitForTimeout(300);
      const launchBtn = page.getByRole('button', { name: '发起分析', exact: true });
      await expect(launchBtn.first()).toBeEnabled({ timeout: 8000 });
      await launchBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(page.getByText('选择分析任务', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await page.getByText('重点企业领域分布分析', { exact: true }).first().click();
      await page.waitForTimeout(300);
      const nextBtn = page.getByRole('button', { name: '下一步：前往配置', exact: true });
      for (let t = 0; t < 25 && (await nextBtn.first().isDisabled().catch(() => true)); t++) {
        await page.waitForTimeout(200);
      }
      await nextBtn.first().click({ timeout: 8000 });
      await page.waitForURL(/key-enterprise-analysis/, { timeout: 15000 });
      await page.waitForTimeout(6000);
      const viewResult = page.getByRole('button', { name: '查看结果', exact: true });
      if (await viewResult.count() && (await viewResult.first().isVisible().catch(() => false))) {
        await viewResult.first().click({ timeout: 8000 });
        await page.waitForTimeout(3000);
      }
expect:
  - note: 1、页面标题为「重点企业领域分析」
    assert: |-
      const title = page.getByRole('heading', { name: '重点企业领域分析', exact: true });
      if (await title.count()) {
        await expect(title.first()).toBeVisible({ timeout: 12000 });
      } else {
        await expect(page.getByText('重点企业领域分析', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      }
  - note: 2、页面出现「领域布局概览」
    assert: |-
      const heading = page.getByRole('heading', { name: '领域布局概览', exact: true });
      if (await heading.count()) {
        await expect(heading.first()).toBeVisible({ timeout: 12000 });
      } else if (await page.getByText('领域布局概览', { exact: true }).count()) {
        await expect(page.getByText('领域布局概览', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      } else if (await page.getByText('尚未选择分析对象').count()) {
        throw new Error('ENV-KEYDOMAIN-RESULT-PICKER-001 已发起仍为空结果壳');
      } else {
        await expect(page.getByText('已覆盖领域', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
