id: FUNC-01707
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01707
priority: P0
title: 识别依据抽屉进入企业发展痛难点分析且对象为当前企业
story: US-KEYENT-01
entry_id: ent-key-domain
tier: B
preconditions:
  - env-gate overall=pass
  - 已打开某企业识别依据抽屉且 footer 含「进入风险洞察」（assert 自含回填与点「查看识别依据」）
locators:
  section: heading「重点领域分布」
  evidence_drawer: .arco-drawer:visible 含「为什么识别为」
  risk_btn: 依据抽屉 footer button「进入风险洞察」
  pain_page: heading「企业发展痛难点分析」
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  - action: evaluate
    note: 无结果则选择分析企业回填→分布表点「查看识别依据」→点「进入风险洞察」；痛难点页标题与对象在 expect
expect:
  - note: 1、页面标题为「企业发展痛难点分析」；2、分析对象含该企业
    assert: |-
      const routes = [
        '/enterprise-center/key-enterprise-analysis?workspace=domain&view=domain',
        '/enterprise/key-enterprise-analysis?view=domain',
      ];
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(350); }
        }
      };
      const origin = () => new URL(page.url()).origin;
      const gotoRoute = async () => {
        for (const r of routes) {
          await page.goto(origin() + r, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          await closeBasket();
          const body = (await page.locator('body').innerText().catch(() => '')) || '';
          if (!/404 Not Found|Unexpected Application Error/.test(body)) return r;
        }
        throw new Error('深链均不可达');
      };
      const ensureBasketEnterprise = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        await expect(dockBtn).toBeVisible({ timeout: 12000 });
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/) || dockLabel.match(/共\s*(\d+)\s*项/);
        const entCount = entM ? parseInt(entM[1], 10) : 0;
        if (entCount >= 1) return;
        await page.goto(origin() + '/development/search', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtn = page.getByRole('button', { name: '加入对比篮', exact: true }).first();
        await expect(addBtn).toBeVisible({ timeout: 8000 });
        await addBtn.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const ensureResult = async () => {
        await closeBasket();
        const main = page.locator('main');
        const distHeading = page.getByRole('heading', { name: '重点领域分布' });
        const kpi = main.getByText('已覆盖领域', { exact: true });
        if (await distHeading.count()) return;
        if (await kpi.count() && await kpi.first().isVisible().catch(() => false)) return;
        await ensureBasketEnterprise();
        await gotoRoute();
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        const openBtn = main.getByRole('button', { name: '打开对比篮', exact: true });
        const ctaBtn = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await pickBtn.count() && await pickBtn.first().isVisible().catch(() => false)) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await openBtn.count()) {
          await openBtn.first().click({ timeout: 8000 });
        } else if (await ctaBtn.count()) {
          await ctaBtn.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到选择分析企业/打开对比篮入口');
        }
        await page.waitForTimeout(900);
        const pickerSels = page.locator('[aria-label^="选择 "]');
        if (!(await pickerSels.count())) throw new Error('选择分析企业弹层无可勾选企业');
        await pickerSels.first().click();
        await page.waitForTimeout(400);
        const confirmBtn = page.getByRole('button', { name: '确定' });
        for (let t = 0; t < 25 && (await confirmBtn.first().isDisabled().catch(() => true)); t++) await page.waitForTimeout(200);
        if (await confirmBtn.first().isDisabled().catch(() => true)) throw new Error('确定仍禁用');
        await confirmBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(4000);
        if (!(await distHeading.count()) && !(await kpi.count())) {
          throw new Error('确定后未进入结果态: ' + page.url());
        }
      };
      const findDistributionTable = async () => {
        const main = page.locator('main');
        const heading = page.getByRole('heading', { name: '重点领域分布' });
        if (await heading.count() && await heading.first().isVisible().catch(() => false)) {
          const sec = heading.locator('xpath=ancestor::section[1]').first();
          const table = (await sec.count() ? sec : heading.locator('xpath=ancestor::div[1]')).locator('.arco-table').first();
          if (await table.count()) return table;
        }
        const tables = main.locator('.arco-table');
        for (let i = 0; i < await tables.count(); i++) {
          const table = tables.nth(i);
          const thead = ((await table.locator('thead').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (thead.includes('产业领域') && thead.includes('代表企业') && thead.includes('操作')) return table;
        }
        throw new Error('未找到重点领域分布表（main 无五列表头 arco-table）');
      };
      const openEvidenceFromDistribution = async () => {
        const table = await findDistributionTable();
        const tbodyRow = table.locator('tbody tr').filter({ hasNotText: '暂无数据' });
        const evidenceInTable = table.getByRole('button', { name: '查看识别依据', exact: true }).filter({ hasNot: page.locator('[disabled]') });
        if (await tbodyRow.count() && await evidenceInTable.count()) {
          await evidenceInTable.first().click({ timeout: 8000 });
        } else {
          const matrixBtn = page.locator('main').getByRole('button', { name: /条依据/ }).filter({ hasNot: page.locator('[disabled]') });
          if (!(await matrixBtn.count())) {
            throw new Error('分布表无可用行且覆盖矩阵无可点「条依据」（30888 常空领域数据）');
          }
          await matrixBtn.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(500);
        const whyDrawer = page.locator('.arco-drawer:visible').filter({ hasText: /为什么识别为/ }).last();
        await expect(whyDrawer).toBeVisible({ timeout: 10000 });
        return whyDrawer;
      };
      const parseEntFromEvidenceDrawer = (titleHay) => {
        const afterWhy = titleHay.replace(/为什么识别为「[^」]+」/, '').trim();
        const entLine = afterWhy.split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
        return entLine.length >= 4 ? entLine : '';
      };
      await gotoRoute();
      await ensureResult();
      let evidenceDrawer = await openEvidenceFromDistribution();
      await page.waitForResponse((r) => /domain-evidence/.test(r.url()) && r.status() < 400, { timeout: 15000 }).catch(() => null);
      await page.waitForTimeout(500);
      evidenceDrawer = page.locator('.arco-drawer:visible').filter({ hasText: /为什么识别为/ }).last();
      const drawerHay = ((await evidenceDrawer.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      let entHint = parseEntFromEvidenceDrawer(drawerHay);
      if (!entHint) {
        const table = await findDistributionTable().catch(() => null);
        if (table) {
          const row = table.locator('tbody tr').filter({ hasNotText: '暂无数据' }).first();
          if (await row.count()) {
            const rep = ((await row.locator('td').nth(3).innerText().catch(() => '')) || '').trim();
            if (rep && !/^[-—]$/.test(rep)) entHint = rep.split(/[、,，]/)[0].trim();
          }
        }
      }
      const riskBtn = page.getByRole('button', { name: '进入风险洞察', exact: true });
      if (!(await riskBtn.count())) {
        throw new Error('依据抽屉无「进入风险洞察」（需 domain-evidence 返回 org_id）；文案=' + drawerHay.slice(0, 280));
      }
      await Promise.all([
        page.waitForURL(/\/enterprise(-center)?\/risk/, { timeout: 20000 }),
        riskBtn.first().click({ timeout: 8000 }),
      ]);
      await page.waitForTimeout(1200);
      const ensurePainWorkspace = async () => {
        const painHeading = page.getByRole('heading', { name: '企业发展痛难点分析' });
        const onPain = await painHeading.count() && await painHeading.first().isVisible().catch(() => false);
        const mainPeek = ((await page.locator('main').first().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (onPain && !/暂未选择分析对象/.test(mainPeek)) return;
        const u = new URL(page.url());
        const tab = u.searchParams.get('tab') || u.searchParams.get('workspace') || '';
        if (tab !== 'pain-points') {
          u.searchParams.set('workspace', 'pain-points');
          u.searchParams.set('tab', 'pain-points');
          await page.goto(u.toString(), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
        }
      };
      await ensurePainWorkspace();
      const main = page.locator('main').first();
      const titleLoc = page.getByRole('heading', { name: '企业发展痛难点分析' });
      if (await titleLoc.count()) {
        await expect(titleLoc.first()).toBeVisible({ timeout: 12000 });
      } else {
        await expect(page.getByText('企业发展痛难点分析', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      }
      const bodyTxt = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!bodyTxt.includes('企业发展痛难点分析')) {
        throw new Error('痛难点页主区未含标题「企业发展痛难点分析」');
      }
      if (entHint && entHint.length >= 4) {
        const short = entHint.slice(0, Math.min(6, entHint.length));
        if (!bodyTxt.includes(short)) {
          throw new Error('分析对象未含企业「' + short + '」；样本=' + bodyTxt.slice(0, 320));
        }
      } else {
        const objTitle = main.getByText('分析对象', { exact: true });
        const fromBasket = main.getByText(/来自对比篮/);
        if (!(await objTitle.count()) && !(await fromBasket.count())) {
          throw new Error('无法读取依据抽屉企业名且痛难点页无分析对象区');
        }
        await expect(objTitle.or(fromBasket).first()).toBeVisible({ timeout: 10000 });
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D3·30888 demo「进入风险洞察」深链为 /enterprise-center/risk 且默认供应链 Tab；机检在同 URL 上补 workspace/tab=pain-points 跳转（保留 enterprise_codes[]，侧栏切换会丢对象）。目标态 lumen goRisk 直落痛难点。分布表空时回退矩阵「N 条依据」。登录与关内部评审由 runner 会话前置。B 档。
