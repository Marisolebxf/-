id: FUNC-01720
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01720
priority: P1
title: 选择分析企业内点击移除立即移出
story: US-KEYENT-01
entry_id: ent-key-domain
tier: B
preconditions:
  - env-gate overall=pass
  - 「选择分析企业」已列出企业（assert 可自含入篮与打开选择器）
locators:
  picker_title: text「选择分析企业」
  remove_btn: button[aria-label="移除"]
  enterprise_card: .ent-compare-item-card
  toast: .arco-message-content
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  - action: wait
    timeout_ms: 800
  - action: evaluate
    note: 打开选择器后点首张企业卡「移除」；名单与提示在 expect 判定
expect:
  - note: 1、该企业不再出现在篮内列表；2、提示已移出对比篮
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => (String(p).startsWith('http') ? p : origin.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p));
      const route = '/enterprise-center/key-enterprise-analysis?workspace=domain&view=domain';
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(350); }
        }
      };
      const gotoRoute = async () => {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await closeBasket();
      };
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        return entM ? parseInt(entM[1], 10) : (totalM ? parseInt(totalM[1], 10) : 0);
      };
      const ensureBasketEnterprises = async (min) => {
        let n = await basketEntCount();
        if (n >= min) return;
        await page.goto(toUrl('/development/search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(addBtns.first()).toBeVisible({ timeout: 15000 });
        while (n < min) {
          const idx = Math.min(n, await addBtns.count() - 1);
          await addBtns.nth(idx).click({ timeout: 8000 });
          await page.waitForTimeout(800);
          n = await basketEntCount();
          if (n < min && idx >= await addBtns.count() - 1) break;
        }
        if (n < min) throw new Error('对比篮企业不足 ' + min + '，当前 ' + n);
      };
      const clickPageOpenPicker = async () => {
        const main = page.locator('main');
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        const openBtn = main.getByRole('button', { name: '打开对比篮', exact: true });
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        const adjustBtn = main.getByRole('button', { name: '打开对比篮调整对象', exact: true });
        if (await pickBtn.count() && await pickBtn.first().isVisible().catch(() => false)) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await adjustBtn.count() && await adjustBtn.first().isVisible().catch(() => false)) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await openBtn.count() && await openBtn.first().isVisible().catch(() => false)) {
          await openBtn.first().click({ timeout: 8000 });
        } else if (await emptyCta.count()) {
          await emptyCta.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到选择分析企业/打开对比篮入口');
        }
        await page.waitForTimeout(800);
      };
      const pickerRoot = () => page.locator('.system-compare-panel:visible, .arco-modal:visible').filter({ hasText: '选择分析企业' }).last();
      const cardName = async (card) => {
        const nameEl = card.locator('.ent-compare-item-card__name');
        if (await nameEl.count()) return (await nameEl.first().innerText()).trim();
        const aria = card.locator('[aria-label^="选择 "]').first();
        if (await aria.count()) {
          const m = ((await aria.getAttribute('aria-label')) || '').match(/^选择\s+(.+)$/);
          if (m) return m[1].trim();
        }
        return (await card.innerText()).split('\n')[0].trim();
      };
      await gotoRoute();
      await ensureBasketEnterprises(1);
      await gotoRoute();
      await clickPageOpenPicker();
      await expect(page.getByText('选择分析企业', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      const root = pickerRoot();
      const scope = (await root.count()) ? root : page.locator('body');
      const cards = scope.locator('.ent-compare-item-card');
      if (await cards.count() < 1) {
        const selRows = scope.locator('[aria-label^="选择 "]');
        if (await selRows.count() < 1) throw new Error('篮内应有至少 1 家企业，实际 0');
      }
      const beforeCount = await cards.count() || await scope.locator('[aria-label^="选择 "]').count();
      const targetCard = (await cards.count()) ? cards.first() : scope.locator('.ent-compare-item-card').first();
      let removedName = '';
      if (await targetCard.count()) {
        removedName = await cardName(targetCard);
      } else {
        const aria = ((await scope.locator('[aria-label^="选择 "]').first().getAttribute('aria-label')) || '');
        const m = aria.match(/^选择\s+(.+)$/);
        removedName = m ? m[1].trim() : '';
      }
      if (!removedName) throw new Error('首张企业未读到名称');
      const confirmModal = page.locator('.arco-modal:visible').filter({ hasText: '清空对比篮' });
      const removeBtn = scope.getByRole('button', { name: '移除', exact: true }).first();
      await expect(removeBtn).toBeVisible({ timeout: 8000 });
      await removeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      if (await confirmModal.count() && await confirmModal.first().isVisible().catch(() => false)) {
        throw new Error('移除不应弹出清空确认框（用例：点击即移出）');
      }
      await expect(page.locator('.arco-message-content').filter({ hasText: '已移出对比篮' }).first()).toBeVisible({ timeout: 10000 });
      const afterCount = await cards.count() || await scope.locator('[aria-label^="选择 "]').count();
      if (afterCount !== beforeCount - 1) {
        throw new Error(`移除后篮内企业数应为 ${beforeCount - 1}，实际 ${afterCount}`);
      }
      const leak = scope.locator('.ent-compare-item-card').filter({ hasText: removedName });
      if (await leak.count() && await leak.first().isVisible().catch(() => false)) {
        throw new Error('该企业仍出现在篮内列表：' + removedName);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 用例 01720；移除按钮 aria-label=移除（CompareItemCard），无二次确认，Message.success「已移出对比篮」（EnterpriseCompareBasketView.removeItem）。清空确认归 01721。前置 ensure 对齐 01722（dock 共 N 项 + 检索入篮）。选择器 scope 对齐 01716/01722。登录与关内部评审由 runner 会话前置。B 档。
