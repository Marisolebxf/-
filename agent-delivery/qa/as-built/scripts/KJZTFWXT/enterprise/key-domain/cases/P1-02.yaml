- note: 报告含领域分析结论结构
  assert: |-
    if (!(await page.getByText(/只读|报告身份|执行摘要/).count())) { if (!(await page.getByRole('heading', { name: '领域布局概览' }).count())) { await page.goto('http://10.50.69.111:30892/enterprise/key-enterprise-analysis?view=domain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); if (!(await page.getByRole('heading', { name: '领域布局概览' }).count())) { await page.getByRole('button', { name: /打开对比篮|前往对比篮选择企业/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); for (let i = 0; i < Math.min(2, await sels.count()); i++) await sels.nth(i).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(3000) } }; await page.getByRole('button', { name: '查看 HTML 报告' }).click({ timeout: 8000 }); await page.waitForTimeout(800) }; const body = await page.locator('body').innerText(); if (!/(领域|关键发现|执行摘要|对象与范围)/.test(body)) throw new Error('报告无领域/结论结构字样')
- note: 结论对象与当前页面分析对象一致
  assert: |-
    const pageObjs = (await page.locator('main').innerText().catch(()=>'')); const badge = (await page.getByText(/来自对比篮/).first().textContent().catch(()=>null)); await expect(page.getByRole('button', { name: '返回分析结果' })).toBeVisible({ timeout: 8000 }); await page.getByRole('button', { name: '返回分析结果' }).click({ timeout: 8000 }); await page.waitForTimeout(600); await expect(page.getByText(/来自对比篮/).first()).toBeVisible({ timeout: 8000 }); void pageObjs; void badge
