id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00515
priority: P0
title: 结果态按四大区块顺序构成完整
story: US-KEYENT-01
entry_id: ent-key-domain
preconditions:
  - env-gate overall=pass
  - 已选至少一家企业并进入结果态（本条用页内对比篮回填）
  - 内部评审模式关闭
locators:
  blocks: heading「领域布局概览」/「企业领域覆盖」/「跨领域布局」/「重点领域分布」
  picker_cta: button「前往对比篮选择企业」或「打开对比篮」
  select: aria-label^=「选择 」
  confirm: button「确定」
  kpi: 已覆盖领域
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=domain
  - action: evaluate
    note: 关系统对比篮浮层；若无结果区块则页内回填≥1 家→确定；核四大区块自上而下顺序
expect:
  - note: 四大区块按序完整呈现（中两块可同排）
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/key-enterprise-analysis?view=domain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; if (!(await page.getByRole('heading', { name: '领域布局概览' }).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).first().click({ timeout: 8000 }).catch(async () => { await page.getByRole('button', { name: /打开对比篮/ }).first().click({ timeout: 8000 }) }); await page.waitForTimeout(1000); const confirmBtn = page.getByRole('button', { name: '确定' }); let hasConfirm = (await confirmBtn.count()) > 0 && (await confirmBtn.first().isVisible().catch(() => false)); if (!hasConfirm) { const close2 = page.locator('[aria-label="关闭对比篮"]'); if (await close2.count()) { const v2 = await close2.first().isVisible().catch(() => false); if (v2) { await close2.first().click(); await page.waitForTimeout(300) } }; await page.getByRole('button', { name: '前往对比篮选择企业' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1000); hasConfirm = (await confirmBtn.count()) > 0 && (await confirmBtn.first().isVisible().catch(() => false)) }; const sels = page.locator('[aria-label^="选择 "]'); const n = await sels.count(); if (!hasConfirm || n < 1) throw new Error('页内回填不可用: confirm=' + hasConfirm + ' select=' + n); for (let i = 0; i < Math.min(2, n); i++) await sels.nth(i).click(); await page.waitForTimeout(400); for (let t = 0; t < 20 && (await confirmBtn.first().isDisabled().catch(() => true)); t++) await page.waitForTimeout(200); if (await confirmBtn.first().isDisabled().catch(() => true)) throw new Error('确定仍禁用'); await confirmBtn.first().click({ timeout: 8000 }); await page.waitForTimeout(3500) }; const names = ['领域布局概览', '企业领域覆盖', '跨领域布局', '重点领域分布']; for (const t of names) await expect(page.getByRole('heading', { name: t })).toBeVisible({ timeout: 10000 }); const texts = []; for (const t of names) { const box = await page.getByRole('heading', { name: t }).boundingBox(); texts.push({ t, y: box ? box.y : -1 }) }; for (let i = 1; i < texts.length; i++) { if (texts[i].y >= 0 && texts[i - 1].y >= 0 && texts[i].y < texts[i - 1].y - 2) throw new Error('区块顺序异常: ' + JSON.stringify(texts)) }
  - note: 各区块内容区已渲染非骨架
    assert: |-
      await expect(page.getByText('已覆盖领域').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByRole('heading', { name: '企业领域覆盖' })).toBeVisible({ timeout: 8000 }); const main = page.locator('main'); const hay = ((await main.innerText().catch(() => '')) || '') + '|' + ((await page.locator('body').innerText().catch(() => '')) || ''); if (!/已覆盖领域/.test(hay) || !/企业/.test(hay)) throw new Error('结果内容区未渲染: ' + hay.slice(0, 200))
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 结果态经页内「前往对比篮选择企业」勾选≥1 家→确定回填（系统浮层无确定时先关再开页内 picker）。四大区块 heading 齐备；中两块「企业领域覆盖/跨领域布局」可同排（y 相等，observed）。概览 KPI 壳见「已覆盖领域」。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
