id: P0-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00511
priority: P0
title: 侧栏进入重点企业领域分析路由与标题正确
story: US-KEYENT-01
entry_id: ent-key-domain
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 经人设面板关闭内部评审模式（默认态执行时 observed 记录）
locators:
  menu: 菜单项「企业分析」→「重点企业领域分析」（侧栏二级；现场无页内类型/领域 Tab）
  title: document title「重点企业领域分析 - 科技专题服务系统」
  h1: heading「重点企业领域分析」（level 1）
  object_bar: section aria-label「领域分析对象」
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?view=domain
  - action: assert_url
    expect_contains: /enterprise/key-enterprise-analysis
  - action: assert_visible
    target: heading 重点企业领域分析
expect:
  - note: 路由为重点企业领域分析页且地址参数含 view=domain
    assert: |-
      await expect(page).toHaveURL(/\/enterprise\/key-enterprise-analysis/); await expect(page).toHaveURL(/view=domain/)
  - note: 页面标题与主区 H1 为「重点企业领域分析」
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page).toHaveTitle(/重点企业领域分析 - 科技专题服务系统/); await expect(page.getByRole('heading', { name: '重点企业领域分析' })).toBeVisible({ timeout: 8000 })
  - note: 主区呈现领域分析对象区
    assert: |-
      await expect(page.locator('section[aria-label="领域分析对象"]')).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 深链等价侧栏到达；侧栏「企业分析」下两个二级（类型/领域），无页内 Tab；本条只验领域参数与标题——不把类型看板（view=type）当断言对象；同壳隔离反向归 00528（P1-06）。参数可双并存 workspace=domain&view=domain（observed）。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
