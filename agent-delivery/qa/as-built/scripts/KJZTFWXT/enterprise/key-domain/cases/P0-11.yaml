id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00522
priority: P0
title: 重点领域分布区展示领域聚合分布且随对象变化刷新
story: US-KEYENT-01
entry_id: ent-key-domain
preconditions:
- 结果态「重点领域分布」已加载
locators:
  section: heading「重点领域分布」
  table: 表头 产业领域 / 涉及企业 / 识别依据
steps:
- action: evaluate
  note: 浏览重点领域分布；可选调整对象后重看
expect:
- note: 区块以图或列表呈现领域聚合分布
  assert: |-
    if (!(await page.getByRole('heading', { name: '重点领域分布' }).count())) { await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/key-enterprise-analysis?view=domain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); if (!(await page.getByRole('heading', { name: '重点领域分布' }).count())) { await page.getByRole('button', { name: /打开对比篮|前往对比篮选择企业/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); for (let i = 0; i < Math.min(2, await sels.count()); i++) await sels.nth(i).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(3000) } }; await expect(page.getByRole('heading', { name: '重点领域分布' })).toBeVisible({ timeout: 8000 }); await expect(page.getByText('产业领域').first()).toBeVisible({ timeout: 8000 })
- note: 对象变化后区块随之刷新
  assert: |-
    const before = await page.locator('main').innerText(); await page.getByRole('button', { name: '打开对比篮调整对象' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if ((await sels.count()) >= 2) await sels.nth(Math.min(2, await sels.count() - 1)).click(); await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 }); await page.waitForTimeout(3000); await expect(page.getByRole('heading', { name: '重点领域分布' })).toBeVisible({ timeout: 10000 }); const after = await page.locator('main').innerText(); if (!after.includes('重点领域分布')) throw new Error('刷新后丢失重点领域分布'); void before
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 表可「暂无数据」；刷新口径 observed。
tier: B
