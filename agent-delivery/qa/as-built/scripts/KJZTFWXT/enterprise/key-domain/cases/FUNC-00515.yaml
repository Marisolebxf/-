id: FUNC-00515
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00515
priority: P0
title: 结果态按四大区块顺序构成完整
story: US-KEYENT-01
entry_id: ent-key-domain
tier: A
preconditions:
  - env-gate overall=pass
  - 已选至少一家企业并进入结果态（assert 可自含对比篮回填）
locators:
  route_primary: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  route_legacy: /enterprise/key-enterprise-analysis?view=domain
  pick_enterprise: button「选择分析企业」
  blocks_legacy: heading 四大区块标题（50892）
  blocks_30888: KPI 四指标 + 企业业务关联与领域覆盖计算 ×N
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  - action: evaluate
    note: 关系统对比篮浮层；无结果则保证篮内≥1 家→选择分析企业→确定；四大区块在 expect 判定
expect:
  - note: 1、四大区块按序完整呈现（中两块可同排）
    assert: |-
      const routes = [
        '/enterprise-center/key-enterprise-analysis?workspace=domain&view=domain',
        '/enterprise/key-enterprise-analysis?view=domain',
      ];
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(350); }
        }
      };
      const origin = () => new URL(page.url()).origin;
      const gotoRoute = async () => {
        for (const r of routes) {
          await page.goto(origin() + r, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(800);
          await closeBasket();
          const body = (await page.locator('body').innerText().catch(() => '')) || '';
          if (!/404 Not Found|Unexpected Application Error/.test(body)) return r;
        }
        throw new Error('深链均不可达');
      };
      const ensureBasketEnterprise = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        await expect(dockBtn).toBeVisible({ timeout: 12000 });
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        const entCount = entM ? parseInt(entM[1], 10) : 0;
        if (entCount >= 1) return;
        await page.goto(origin() + '/development/search', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await closeBasket();
        const main = page.locator('main');
        const recSection = main.locator('section').filter({ hasText: '推荐企业' }).first();
        await expect(recSection.getByText('推荐企业', { exact: true })).toBeVisible({ timeout: 12000 });
        const addBtn = page.getByRole('button', { name: '加入对比篮', exact: true }).first();
        await expect(addBtn).toBeVisible({ timeout: 8000 });
        await addBtn.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const ensureResult = async () => {
        await closeBasket();
        const legacyOverview = page.getByRole('heading', { name: '领域布局概览' });
        if (await legacyOverview.count()) return 'legacy';
        const main = page.locator('main');
        const kpi = main.getByText('已覆盖领域', { exact: true });
        if (await kpi.count() && await kpi.first().isVisible().catch(() => false)) return '30888';
        await ensureBasketEnterprise();
        const activeRoute = await gotoRoute();
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        const openBtn = main.getByRole('button', { name: '打开对比篮', exact: true });
        const ctaBtn = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        if (await pickBtn.count() && await pickBtn.first().isVisible().catch(() => false)) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await openBtn.count()) {
          await openBtn.first().click({ timeout: 8000 });
        } else if (await ctaBtn.count()) {
          await ctaBtn.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到选择分析企业/打开对比篮入口');
        }
        await page.waitForTimeout(900);
        const pickerSels = page.locator('[aria-label^="选择 "]');
        const nPick = await pickerSels.count();
        if (nPick < 1) throw new Error('选择分析企业弹层无可勾选企业');
        await pickerSels.first().click();
        await page.waitForTimeout(400);
        const confirmBtn = page.getByRole('button', { name: '确定' });
        for (let t = 0; t < 25 && (await confirmBtn.first().isDisabled().catch(() => true)); t++) await page.waitForTimeout(200);
        if (await confirmBtn.first().isDisabled().catch(() => true)) throw new Error('确定仍禁用');
        await confirmBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(4000);
        if (await legacyOverview.count()) return 'legacy';
        if (await kpi.count()) return '30888';
        throw new Error('确定后未进入结果态: ' + page.url());
      };
      if (/enterprise_codes=/.test(page.url())) {
        await gotoRoute();
      }
      const mode = await ensureResult();
      if (mode === 'legacy') {
        const names = ['领域布局概览', '企业领域覆盖', '跨领域布局', '重点领域分布'];
        for (const t of names) await expect(page.getByRole('heading', { name: t })).toBeVisible({ timeout: 10000 });
        const texts = [];
        for (const t of names) {
          const box = await page.getByRole('heading', { name: t }).boundingBox();
          texts.push({ t, y: box ? box.y : -1 });
        }
        for (let i = 1; i < texts.length; i++) {
          if (texts[i].y >= 0 && texts[i - 1].y >= 0 && texts[i].y < texts[i - 1].y - 2) {
            throw new Error('区块顺序异常: ' + JSON.stringify(texts));
          }
        }
      } else {
        const kpis = ['已覆盖领域', '涉及企业', '跨领域企业', '识别依据'];
        for (const k of kpis) await expect(page.getByText(k, { exact: true }).first()).toBeVisible({ timeout: 10000 });
        const calcHeads = page.getByRole('heading', { name: '企业业务关联与领域覆盖计算' });
        const nCalc = await calcHeads.count();
        if (nCalc < 3) throw new Error('结果分析区块不足 3 段: ' + nCalc);
        await expect(page.getByText('产业领域').first()).toBeVisible({ timeout: 10000 });
        const yKpi = (await page.getByText('已覆盖领域', { exact: true }).first().boundingBox())?.y ?? -1;
        const yTable = (await page.getByText('产业领域').first().boundingBox())?.y ?? -1;
        const yReport = (await page.getByRole('heading', { name: '重点企业领域分布分析报告' }).boundingBox())?.y ?? -1;
        if (yKpi >= 0 && yTable >= 0 && yTable < yKpi - 2) throw new Error('概览应位于分布表之前');
        if (yTable >= 0 && yReport >= 0 && yReport < yTable - 2) throw new Error('分布表应位于报告区之前');
      }
  - note: 2、各区块内容区已渲染非骨架
    assert: |-
      const main = page.locator('main');
      const skel = main.locator('.arco-skeleton:visible');
      const skCount = await skel.count();
      if (skCount > 0) throw new Error('结果主区仍有可见骨架屏: ' + skCount);
      const hay = (await main.innerText().catch(() => '')) || '';
      if (!/已覆盖领域/.test(hay) || !/企业/.test(hay)) throw new Error('结果内容区未渲染: ' + hay.slice(0, 200));
      if (await page.getByRole('heading', { name: '领域布局概览' }).count()) {
        await expect(page.getByRole('heading', { name: '企业领域覆盖' })).toBeVisible({ timeout: 8000 });
      } else {
        await expect(page.getByText(/来自对比篮\s*·\s*\d+\s*家/).first()).toBeVisible({ timeout: 8000 });
        await expect(page.getByText('代表企业').first()).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 深链为 /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain（/enterprise/… 路由 404）；空态 CTA「选择分析企业」；四大区块现场为概览 KPI 四指标 + 多段「企业业务关联与领域覆盖计算」+ 分布表「产业领域」+ 底栏「重点企业领域分布分析报告」（用例册四 heading 标题在 50892 仍断言）。篮内无企业时 assert 自含企业查询入篮。登录与关内部评审由 runner 会话前置。金样零 allow_skip。
