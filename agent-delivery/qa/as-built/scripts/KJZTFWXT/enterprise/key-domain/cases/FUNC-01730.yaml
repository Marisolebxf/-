id: FUNC-01730
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01730
priority: P1
tier: B
title: 新增企业行「详情」关闭弹层并打开企业画像快览
entry_id: ent-key-domain
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/key-enterprise-analysis?workspace=domain&view=domain
  - action: evaluate
    note: 01690 打开选择分析企业；01723 点「新增」；01730 点首行「详情」
    assert: |-
      const main = page.locator('main');
      const openPicker = async () => {
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        const openBtn = main.getByRole('button', { name: '打开对比篮', exact: true });
        const adjustBtn = main.getByRole('button', { name: '打开对比篮调整对象', exact: true });
        if (await emptyCta.isVisible().catch(() => false)) {
          await emptyCta.click({ timeout: 8000 });
        } else if (await adjustBtn.isVisible().catch(() => false)) {
          await adjustBtn.click({ timeout: 8000 });
        } else if (await openBtn.isVisible().catch(() => false)) {
          await openBtn.click({ timeout: 8000 });
        } else {
          throw new Error('未找到打开选择分析企业入口');
        }
        await page.waitForTimeout(600);
      };
      await openPicker();
      const panel = page.locator('.system-compare-panel:visible').last();
      await expect(panel.getByText('从对比篮勾选本页分析对象', { exact: false }).first()).toBeVisible({ timeout: 12000 });
      const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
      const addBtn = (await workspace.count())
        ? workspace.getByRole('button', { name: '新增', exact: true })
        : panel.getByRole('button', { name: '新增', exact: true });
      await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
      const recommendWait = page
        .waitForResponse((r) => /recommend/i.test(r.url()) && r.request().method() === 'POST', { timeout: 25000 })
        .catch(() => null);
      await addBtn.first().click({ timeout: 8000 });
      await recommendWait;
      await page.waitForTimeout(400);
      const modalRoot = page.locator('[data-testid="compare-basket-add-modal"]');
      await expect(modalRoot).toBeVisible({ timeout: 15000 });
      await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
      const detailBtn = modalRoot.getByRole('button', { name: '详情', exact: true }).first();
      await expect(detailBtn).toBeVisible({ timeout: 20000 });
      await detailBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
expect:
  - note: 1、「新增企业」关闭
    assert: |-
      const modalRoot = page.locator('[data-testid="compare-basket-add-modal"]');
      await expect(modalRoot).toBeHidden({ timeout: 10000 });
  - note: 2、打开该企业的「企业画像快览」
    assert: |-
      const url = page.url();
      if (/\/development\/enterprise\//.test(url)) {
        throw new Error('D3·详情跳转到 development 深链，未出现「企业画像快览」。url=' + url);
      }
      const quickDrawer = page
        .locator('.arco-drawer-wrapper:visible, .arco-drawer:visible')
        .filter({ hasText: '企业画像快览' })
        .last();
      const titleHit = page.getByText('企业画像快览', { exact: true });
      const hasDrawer =
        ((await quickDrawer.count()) && (await quickDrawer.first().isVisible().catch(() => false))) ||
        ((await titleHit.count()) && (await titleHit.first().isVisible().catch(() => false)));
      if (!hasDrawer) {
        throw new Error('点击「详情」后未出现「企业画像快览」；url=' + url);
      }
      await expect(page.getByText('企业画像快览', { exact: true }).first()).toBeVisible({ timeout: 5000 });
      await expect(page.getByText('基础摘要', { exact: true }).first()).toBeVisible({ timeout: 5000 });
on_fail: 截图 + 抄 X-Trace-Id
