id: FUNC-01725
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01725
priority: P1
title: 画像快览「查看详情」进入该企业完整画像页
story: US-KEYENT-01
entry_id: ent-key-domain
tier: B
preconditions:
  - env-gate overall=pass
  - 「企业画像快览」已打开（本条 assert 自含：领域页可达后走智能搜索出结果点「查看画像」；新增企业列表本环境无行见 as_built_note）
locators:
  view_profile: main button「查看画像」
  view_detail: .arco-drawer:visible button「查看详情」
steps:
  - action: goto
    target: /enterprise-center/key-enterprise-analysis?workspace=domain&view=domain
  - action: wait
    timeout_ms: 600
  - action: goto
    target: /development/search
  - action: fill
    target: 搜索框
    value: 人工智能
  - action: click
    target: 搜索
  - action: wait
    for: 智能搜索结果与「查看画像」
    timeout_ms: 2000
  - action: evaluate
    note: 打开画像快览并点「查看详情」由 expect assert 自含
expect:
  - note: 1、进入该企业的画像页；2、页内能对应所点企业（接口失败出现「返回企业检索」「重试」仍算进入画像页）
    assert: |-
      await page.keyboard.press('Escape');
      const closeB = page.locator('button[aria-label="关闭对比篮"]');
      if (await closeB.count() && await closeB.first().isVisible().catch(() => false)) {
        await closeB.first().click({ timeout: 2000 }).catch(() => {});
        await page.waitForTimeout(300);
      }
      await expect(page.getByText('智能搜索结果', { exact: true })).toBeVisible({ timeout: 20000 });
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/)).toBeVisible({ timeout: 12000 });
      const profileBtn = page.locator('main').getByRole('button', { name: '查看画像' }).first();
      await expect(profileBtn).toBeVisible({ timeout: 15000 });
      const routeBefore = page.url();
      await profileBtn.click();
      const quickDrawer = page.locator('.arco-drawer:visible').first();
      await quickDrawer.waitFor({ state: 'visible', timeout: 12000 });
      await expect(quickDrawer.locator('.arco-drawer-header')).toContainText('企业画像快览');
      const quickHay = ((await quickDrawer.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const nameMatch = quickHay.match(/[\u4e00-\u9fa5（）()A-Za-z0-9]{4,40}有限公司/);
      const entLabel = nameMatch ? nameMatch[0] : '';
      const shortEnt = entLabel ? entLabel.slice(0, Math.min(8, entLabel.length)) : '';
      const detailBtn = quickDrawer.getByRole('button', { name: '查看详情' });
      await expect(detailBtn).toBeVisible({ timeout: 8000 });
      await detailBtn.click();
      await page.waitForTimeout(1200);
      if (page.url() !== routeBefore && /\/development\/enterprise\//.test(page.url())) {
        const main = page.locator('main');
        const bodyTxt = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (shortEnt && !bodyTxt.includes(shortEnt)) {
          throw new Error('深链画像页未含企业「' + shortEnt + '」');
        }
        const markers = ['工商概况', '返回企业检索', '重试', '主要团队', '企业详情'];
        if (!markers.some((m) => bodyTxt.includes(m))) {
          throw new Error('深链画像页缺少画像页标记；url=' + page.url());
        }
      } else {
        const drawer = page.locator('.arco-drawer:visible').first();
        await drawer.waitFor({ state: 'visible', timeout: 12000 });
        await expect(drawer.locator('.arco-drawer-header')).toContainText('企业详情');
        const hay = ((await drawer.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (shortEnt && !hay.includes(shortEnt)) {
          throw new Error('企业详情未含快览所选企业「' + shortEnt + '」');
        }
        const bizTab = drawer.getByRole('tab', { name: '工商概况' });
        if (await bizTab.count()) {
          await expect(bizTab.first()).toHaveAttribute('aria-selected', 'true');
        } else if (hay.includes('返回企业检索') || hay.includes('重试')) {
          await expect(drawer.getByText(/返回企业检索|重试/).first()).toBeVisible({ timeout: 8000 });
        } else {
          await expect(drawer.getByText('工商概况').first()).toBeVisible({ timeout: 8000 });
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·30888 用例前置「企业画像快览」：领域页深链可达后改走 /development/search 智能搜索「查看画像」（01472/01482 同路径；本环境「新增企业」表体 20s 无行，01723/01730 前置不可用）。快览「查看详情」→「企业详情」抽屉或 /development/enterprise/ 深链；勘察期可出现「返回企业检索」「重试」仍判进入画像页。登录与关内部评审由 runner 会话前置。P1·B 档。
