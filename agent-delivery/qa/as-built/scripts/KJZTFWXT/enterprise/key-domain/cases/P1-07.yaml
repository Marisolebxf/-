id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00529
priority: P1
title: 结果态刷新后分析对象与四大区块恢复
story: US-KEYENT-01
entry_id: ent-key-domain
preconditions:
- 结果态已渲染完成（URL 带对象或上下文）
locators:
  blocks: 四大区块标题
steps:
- action: reload
- action: evaluate
  note: 核对未回落空态
expect:
- note: 页面不回落至待选择空态
  assert: |-
    if (!(await page.getByRole('heading', { name: '领域布局概览' }).count())) { await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/key-enterprise-analysis?view=domain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.getByRole('button', { name: /打开对比篮|前往对比篮选择企业/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); for (let i = 0; i < Math.min(2, await sels.count()); i++) await sels.nth(i).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(3000) }; const urlBefore = page.url(); await page.reload({ waitUntil: 'domcontentloaded' }); await page.waitForTimeout(2500); if (await page.getByRole('heading', { name: '待选择分析对象' }).count()) { /* 若 URL 无持久化参数可能回落——以 URL 是否含对象/上下文判定 */ if (!/enterprise_codes|return_context_id|source=compare-basket/.test(urlBefore)) throw new Error('刷新前 URL 无持久化上下文，无法验收恢复'); throw new Error('有持久化上下文但刷新回落空态: ' + page.url()) }
- note: 分析对象与四大区块恢复呈现
  assert: |-
    await expect(page.getByRole('heading', { name: '领域布局概览' })).toBeVisible({ timeout: 12000 }); for (const t of ['企业领域覆盖','跨领域布局','重点领域分布']) await expect(page.getByRole('heading', { name: t })).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/来自对比篮|当前对象/).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 页内确定回填 URL 常含 enterprise_codes[]+source；系统发起含 return_context_id。指标数值一致性 observed。
tier: B
