id: P0-10
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00521
priority: P0
title: 跨领域布局区呈现企业多元化程度评估内容
story: US-KEYENT-01
entry_id: ent-key-domain
preconditions:
- 结果态「跨领域布局」区块已加载
locators:
  section: heading「跨领域布局」
  chart: 图谱/画布（canvas 或 .echarts）
steps:
- action: evaluate
  note: 浏览跨领域布局区块
expect:
- note: 区块呈现各企业的多元化程度评估
  assert: |-
    if (!(await page.getByRole('heading', { name: '跨领域布局' }).count())) { await page.goto('http://111.198.38.90:50892/enterprise/key-enterprise-analysis?view=domain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); if (!(await page.getByRole('heading', { name: '跨领域布局' }).count())) { await page.getByRole('button', { name: /打开对比篮|前往对比篮选择企业/ }).first().click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); for (let i = 0; i < Math.min(2, await sels.count()); i++) await sels.nth(i).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(3000) } }; await expect(page.getByRole('heading', { name: '跨领域布局' })).toBeVisible({ timeout: 8000 })
- note: 评估含覆盖领域数或分布形态等可读信息
  assert: |-
    const root = page.getByRole('heading', { name: '跨领域布局' }).locator('xpath=ancestor::*[self::section or self::div][1]'); const hasCanvas = await page.locator('canvas').count(); const hasChart = await page.locator('[_echarts_instance_], .echarts, canvas').count(); if (!hasCanvas && !hasChart) { const t = await page.locator('main').innerText(); if (!t.includes('跨领域布局')) throw new Error('跨领域布局无图或可读内容') }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 现场为力导向关系图（企业/产业领域）；无单独「多元化指数」文案时以图例与节点为可读信息（observed）。
tier: B
