# 重点企业领域分析 fixtures（2026-10-14；仅测试环境信息，正式密钥不得写入）
# 蓝本 = 用例册 v2.0（00511~00530）；实勘 = 2026-10-14 50892 fixtures/scout/

base_url: "http://10.50.69.111:30892/"
viewport: {width: 1920, height: 1080, device_scale_factor: 1}
login:
  username: admin
  password: "123456"
route: "/enterprise/key-enterprise-analysis?view=domain"
route_aliases:
  - "/enterprise/key-enterprise-analysis?workspace=domain&view=domain"

# 空态（实勘）
empty:
  h1: 重点企业领域分析
  section_title: 待选择分析对象
  empty_desc: 尚未选择企业
  cta: 前往对比篮选择企业
  open_basket: 打开对比篮
  # 用例摘要四入口引导文案现场主区未渲染；仅见空态+对比篮 CTA（as_built）
  four_entry_guide_visible: false

# 页内「选择分析企业」回填弹层（打开对比篮 / 前往对比篮选择企业）
page_picker:
  title: 选择分析企业
  hint: 从对比篮勾选本页分析对象，点击「确定」回填；不会发起分析任务。
  confirm: 确定
  cancel: 取消
  select_aria_prefix: "选择 "
  # 勾选后点确定 → 结果态（本册结果态主路径）

# 系统对比篮浮层（右下 dock / 系统级）
system_basket:
  dock_aria_prefix: 打开对比篮，共
  start_analysis: 发起分析
  analysis_type_domain: 重点企业领域分布分析
  next_config: 下一步：前往配置
  six_types:
    - 重点企业领域分布分析
    - 技术力评估
    - 商业力评估
    - 综合竞争力评估
    - 企业供应链关系分析
    - 企业发展痛点分析

# 配置/结果态页头对象区
object_bar:
  aria_label: 领域分析对象
  from_basket_prefix: 来自对比篮
  return_basket: 返回对比篮
  adjust_objects: 打开对比篮调整对象

# 结果态四大区块（标题）
result_blocks:
  - 领域布局概览
  - 企业领域覆盖
  - 跨领域布局
  - 重点领域分布

# 概览 KPI（现场可见文案；用例三项名见 as_built_note）
kpi_visible_labels:
  - 已覆盖领域
  - 涉及企业
  - 跨领域企业
  - 识别依据
# 评审态指标说明 aria（对齐用例三项口径名）
kpi_review_aria:
  - 指标说明：覆盖领域数
  - 指标说明：领域覆盖深度
  - 指标说明：领域覆盖广度
kpi_pending_hint: 口径待甲方确认

# HTML 报告
report:
  open_button: 查看 HTML 报告
  back_button: 返回分析结果
  # as-built：空态页头亦可见报告按钮（与用例 00527「空态无入口」偏差，见 coverage）

# 评审模式（persona 菜单；P3）
review:
  persona_menu: 右上角人设按钮（persona-menu）
  toggle_aria: 内部评审模式
  badge_hint: 口径待甲方确认
  metric_card_fields: [口径定义, 指标ID]

# 同壳隔离（侧栏二级，无页内 Tab）
shell:
  type_menu: 重点企业类型分析
  domain_menu: 重点企业领域分析
  type_query: view=type
  domain_query: view=domain
