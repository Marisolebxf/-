id: FUNC-01419
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01419
priority: P1
tier: B
title: 主流程-结果行业领域
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 前置到达条件筛选成功结果（同册 01408/01437）；展开结果区行业领域下拉
expect:
  - note: 1、选项个数等于当前结果行业领域去重个数
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const isSuccessResult = async () => {
        const st = stack();
        const t = await st.innerText().catch(() => '');
        const url = page.url();
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        const byKey = page.locator('button[data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        if ((await byKey.count()) < 1 && (await byName.count()) < 1) return false;
        const tab = (await byKey.count()) ? byKey.first() : byName.first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 20; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const goFilterTab = async () => {
        const byKey = page.locator('button[data-tab-key="filter"]');
        const byName = page.getByRole('tab', { name: '条件筛选推荐' });
        if ((await byKey.count()) < 1 && (await byName.count()) < 1) return;
        const tab = (await byKey.count()) ? byKey.first() : byName.first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const reachFilterSuccess = async () => {
        await goFilterTab();
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await goFilterTab();
        await page.keyboard.press('Escape').catch(() => {});
        const openPh = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const i = page.locator(`input[placeholder="${ph}"]`).first();
          await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        const pickOption = async (text) => {
          const opt = page.locator(optSel).filter({ hasText: text }).first();
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        await openPh('全部企业标签');
        await pickOption('高新技术企业');
        await openPh('全部行业领域');
        const ai = page.locator(optSel).filter({ hasText: '人工智能' });
        if (await ai.count()) await ai.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        const st = stack();
        let ok = false;
        let last = '';
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          const url = page.url();
          if ((/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last)?.analyzed >= 1) {
              ok = true;
              break;
            }
          }
          if (/任务失败|分析失败|推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析进入失败态: ' + last.slice(0, 240));
          }
        }
        if (!ok) {
          const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
          if (stuck) {
            throw new Error('环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达招引推荐分析结果');
          }
          throw new Error('未在超时内到达条件筛选成功结果: ' + last.slice(0, 200));
        }
        await expect(st.getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      };
      const uniqueIndustriesFromTable = async () => {
        const st = stack();
        const ths = st.locator('.arco-table-th');
        const tn = await ths.count();
        let colIdx = -1;
        for (let i = 0; i < tn; i++) {
          const ht = ((await ths.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, '');
          if (ht.includes('行业领域')) {
            colIdx = i;
            break;
          }
        }
        if (colIdx < 0) throw new Error('结果表未见「行业领域」列');
        const rows = st.locator('.arco-table-body .arco-table-tr');
        const rn = await rows.count();
        const set = new Set();
        for (let r = 0; r < rn; r++) {
          const cell = rows.nth(r).locator('.arco-table-td').nth(colIdx);
          const v = ((await cell.innerText().catch(() => '')) || '').trim();
          if (v && !/^[-—]$/.test(v)) set.add(v);
        }
        if (set.size < 1) throw new Error('结果表行业领域列为空，无法核对去重个数');
        return set;
      };
      const openResultIndustryDropdown = async () => {
        const st = stack();
        await expect(st.locator('input[placeholder="搜索企业名称"]').first()).toBeVisible({ timeout: 10000 });
        const search = st.locator('input[placeholder="搜索企业名称"]').first();
        const toolbar = search.locator('xpath=ancestor::div[.//input[@placeholder="搜索企业名称"]][1]');
        let views = toolbar.locator('.arco-select-view');
        if ((await views.count()) < 1) {
          views = st
            .getByText('招引推荐分析结果')
            .locator('xpath=following::input[@placeholder="搜索企业名称"][1]/following::div[contains(@class,"arco-select-view")]');
        }
        const n = await views.count();
        if (n < 1) throw new Error('结果区未见行业领域下拉（.arco-select-view）');
        await views.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opts = page.locator(optSel);
        await expect(opts.first()).toBeVisible({ timeout: 8000 });
      };
      await reachFilterSuccess();
      const expectedSet = await uniqueIndustriesFromTable();
      await openResultIndustryDropdown();
      const opts = page.locator(optSel);
      const on = await opts.count();
      const labels = [];
      for (let i = 0; i < on; i++) {
        labels.push(((await opts.nth(i).innerText().catch(() => '')) || '').trim());
      }
      const optionSet = new Set(labels.filter(Boolean));
      if (optionSet.size !== expectedSet.size) {
        throw new Error(
          '行业领域选项个数 ' +
            optionSet.size +
            ' 与结果去重个数 ' +
            expectedSet.size +
            ' 不一致；选项=' +
            [...optionSet].join('、') +
            '；表内=' +
            [...expectedSet].join('、'),
        );
      }
      for (const v of expectedSet) {
        const hit = [...optionSet].some((o) => o === v || o.includes(v) || v.includes(o));
        if (!hit) throw new Error('下拉缺少结果表中的行业领域：' + v);
      }
on_fail: 截图 + 抄 X-Trace-Id
