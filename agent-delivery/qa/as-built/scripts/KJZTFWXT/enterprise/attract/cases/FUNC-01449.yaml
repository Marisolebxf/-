id: FUNC-01449
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01449
priority: P1
tier: B
title: 备选-取消选择
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01437恢复条件筛选成功结果，无则同册01408发起；勾选一行后点取消选择
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option';
      const pickFieldSelect = async (fieldLabel, optionText) => {
        const block = stack().locator('section, div').filter({ hasText: fieldLabel }).first();
        await block.locator('.arco-select-view').first().click({ timeout: 8000 });
        await page.locator(optSel).filter({ hasText: optionText }).first().click({ timeout: 8000 });
        await page.waitForTimeout(200);
      };
      const openRecentTab = async () => {
        const tab = page.locator('.enterprise-center-primary-tabs').getByText('最近分析', { exact: true }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const tryRestoreSuccess = async () => {
        await openRecentTab();
        for (let pageIdx = 0; pageIdx < 3; pageIdx += 1) {
          const rows = stack().locator('.arco-table-body .arco-table-tr');
          const n = await rows.count();
          for (let i = 0; i < n; i += 1) {
            const row = rows.nth(i);
            const text = (await row.innerText()).replace(/\s+/g, ' ');
            if (!text.includes('条件筛选')) continue;
            if (!text.includes('已完成')) continue;
            const restore = row.getByRole('button', { name: '恢复结果' }).first();
            if (!(await restore.isVisible().catch(() => false))) continue;
            await restore.click({ timeout: 8000 });
            await page.waitForTimeout(800);
            const ok = await stack().getByText('招引推荐分析结果').first().isVisible({ timeout: 20000 }).catch(() => false);
            if (ok) return true;
          }
          const next = stack().locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(400);
        }
        return false;
      };
      const waitSuccessResult = async () => {
        const viewResult = stack().getByRole('button', { name: '查看结果' }).first();
        if (await viewResult.isVisible({ timeout: 8000 }).catch(() => false)) {
          await viewResult.click({ timeout: 8000 });
        }
        return stack().getByText('招引推荐分析结果').first().isVisible({ timeout: 180000 }).catch(() => false);
      };
      const run01408 = async (tag, industry) => {
        const filterTab = page.locator('.enterprise-center-primary-tabs').getByText('条件筛选推荐', { exact: true }).first();
        await filterTab.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await pickFieldSelect('企业标签', tag);
        await pickFieldSelect('行业领域', industry);
        const start = stack().getByRole('button', { name: '开始分析' }).first();
        await start.click({ timeout: 8000 });
        if (await stack().getByText('推荐分析失败').first().isVisible({ timeout: 15000 }).catch(() => false)) {
          return false;
        }
        return waitSuccessResult();
      };
      const combos = [
        ['专精特新', '人工智能'],
        ['高新技术企业', '人工智能'],
        ['专精特新', '集成电路'],
        ['瞪羚企业', '新能源'],
      ];
      let onResult = await tryRestoreSuccess();
      if (!onResult) {
        for (const [tag, ind] of combos) {
          if (await run01408(tag, ind)) {
            onResult = true;
            break;
          }
        }
      }
      if (!onResult) {
        globalThis.__func01449 = { done: false, blocked: 'ENV-ATTRACT-ASYNC-NO-SUCCESS-001' };
        return;
      }
      const dataRow = stack().locator('.arco-table-body .arco-table-tr').filter({ has: page.locator('.arco-checkbox') }).first();
      await dataRow.scrollIntoViewIfNeeded({ timeout: 12000 });
      const cb = dataRow.locator('.arco-checkbox').first();
      await cb.click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const cancelBtn = stack().getByRole('button', { name: '取消选择' }).first();
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      globalThis.__func01449 = { done: true };
expect:
  - note: 1、已选家数变为 0
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const ctx = globalThis.__func01449;
      if (ctx?.blocked) throw new Error(`BLOCKED:修订 ${ctx.blocked} 30892无已完成条件筛选成功结果且多组01408均失败，取消选择未测`);
      if (!ctx?.done) throw new Error('BLOCKED:修订 ENV-ATTRACT-ASYNC-NO-SUCCESS-001 取消选择未测');
      const text = await stack().innerText();
      const m = text.match(/已选\s*(\d+)\s*家/);
      if (!m) throw new Error('未见已选家数文案');
      if (Number(m[1]) !== 0) throw new Error(`已选家数仍为 ${m[1]}`);
      await expect(stack().getByText(/已选\s*0\s*家/)).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
