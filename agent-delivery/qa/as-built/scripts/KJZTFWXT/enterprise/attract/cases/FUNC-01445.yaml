title: 备选-热门科创城市
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 全国 / 全部
  - action: click
    target: 第一层「全国热门科创城市」
expect:
  - note: 第二列共 19 项，名称见附录 E
    assert: |-
      const popup = page.locator('.arco-trigger-popup:visible, .arco-cascader-popup-visible').first();
      await expect(popup).toBeVisible();
      const secondCol = popup.locator('.arco-cascader-list-column').nth(1);
      await expect(secondCol.locator('.arco-cascader-option')).toHaveCount(19);
      const cities = ['北京','上海','广州','深圳','杭州','苏州','南京','武汉','成都','西安','合肥','长沙','青岛','厦门','天津','重庆','无锡','宁波','东莞'];
      for (const name of cities) {
        await expect(secondCol.getByText(name, { exact: true })).toBeVisible();
      }
on_fail: 截图 + 抄 X-Trace-Id
