id: FUNC-01425
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01425
priority: P0
tier: B
title: 主流程-结果表列
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
expect:
  - note: 1、列含排名、企业名称、行业领域、地域来源、目标特征、招引推荐指数、操作
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      const openRecentTab = async () => {
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) > 0) {
          await tab.click({ timeout: 8000 });
          await page.waitForTimeout(800);
          return;
        }
        const legacy = page.getByRole('tab', { name: '最近分析' });
        await expect(legacy.first()).toBeVisible({ timeout: 12000 });
        await legacy.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const pickCompletedFilterRestore = async () => {
        for (let pageTry = 0; pageTry < 15; pageTry++) {
          const buttons = stack.getByRole('button', { name: '恢复结果' });
          const n = await buttons.count();
          for (let i = 0; i < n; i++) {
            const btn = buttons.nth(i);
            let row = btn.locator('xpath=ancestor::tr[1]');
            if ((await row.count()) < 1) {
              row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
            }
            const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
            if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) return btn;
          }
          const next = stack.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) < 1) break;
          const clicked = await next.click({ timeout: 5000 }).then(() => true).catch(() => false);
          if (!clicked) break;
          await page.waitForTimeout(600);
        }
        throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：最近分析无已完成条件筛选可恢复结果');
      };
      await openRecentTab();
      for (let i = 0; i < 30; i++) {
        const t = await stack.innerText().catch(() => '');
        if (/招引推荐 · 最近分析/.test(t) && (/恢复结果|任务名称/.test(t))) break;
        await page.waitForTimeout(500);
      }
      const restoreBtn = await pickCompletedFilterRestore();
      await restoreBtn.scrollIntoViewIfNeeded();
      await restoreBtn.click({ timeout: 15000 });
      let ok = false;
      for (let i = 0; i < 40; i++) {
        await page.waitForTimeout(500);
        const t = await stack.innerText().catch(() => '');
        if (/招引推荐分析结果/.test(t) && /排名/.test(t)) {
          ok = true;
          break;
        }
      }
      if (!ok) {
        throw new Error('恢复结果后未出现成功结果表列头，url=' + page.url());
      }
      const main = page.locator('main');
      for (const col of ['排名', '企业名称', '行业领域', '地域来源', '目标特征', '招引推荐指数', '操作']) {
        await expect(main.getByRole('columnheader', { name: col }).or(main.locator('th').filter({ hasText: col })).first()).toBeVisible({ timeout: 10000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
