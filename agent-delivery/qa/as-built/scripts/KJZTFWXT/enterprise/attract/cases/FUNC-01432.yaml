id: FUNC-01432
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01432
priority: P1
tier: B
title: 主流程-名单计数
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: evaluate
    note: 同册01433在企业查询结果点击「加入招引候选」
    assert: |-
      const main = page.locator('main');
      const join = main.getByRole('button', { name: '加入招引候选' }).first();
      await join.waitFor({ state: 'visible', timeout: 20000 });
      await join.click();
      await page.waitForTimeout(800);
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 打开「候选工作台」
    assert: |-
      const tab = page.getByRole('tab', { name: '候选工作台' });
      if ((await tab.getAttribute('aria-selected')) !== 'true') {
        await tab.click();
      }
      await expect(page.getByTestId('recruit-tab-stack').getByText('人工线索候选工作台')).toBeVisible({ timeout: 15000 });
expect:
  - note: 「待复核」家数与「共 N 家」一致
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      await expect(stack.getByText('人工线索候选工作台')).toBeVisible({ timeout: 15000 });
      const text = await stack.innerText();
      const pendingMatch = text.match(/待复核\s*(\d+)\s*家/);
      const totalMatch = text.match(/共\s*(\d+)\s*家/);
      if (!pendingMatch || !totalMatch || Number(pendingMatch[1]) < 1) {
        throw new Error('ENV-ATTRACT-CANDIDATE-EMPTY');
      }
      if (pendingMatch[1] !== totalMatch[1]) {
        throw new Error(`待复核 ${pendingMatch[1]} 家与共 ${totalMatch[1]} 家不一致`);
      }
  - note: 未勾选时已选为 0 家
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      await expect(stack.getByText(/已选\s*0\s*家/)).toBeVisible();
  - note: 提示单次最多 50 家
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      await expect(stack.getByText(/单次最多\s*50\s*家/)).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
