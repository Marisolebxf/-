id: FUNC-01424
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01424
priority: P1
tier: B
title: 主流程-PDF报告弹窗与就绪下载
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01437恢复结果或01408发起；点击「创建 / 查看 PDF 报告」
expect:
  - note: 1、弹窗标题为「推荐结果输出任务」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const m = text.match(/共分析\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : 0;
      };
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        const url = page.url();
        const n = parseCounts(t);
        return (
          n >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        const tab =
          (await page.locator('button[data-tab-key="history"]').count())
            ? page.locator('button[data-tab-key="history"]').first()
            : page.getByRole('tab', { name: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        let fallback = null;
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!/已完成/.test(txt)) continue;
          if (/条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 24; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
          if (!fallback) fallback = btn;
        }
        if (fallback) {
          await fallback.click({ timeout: 15000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult()) return true;
          }
        }
        return false;
      };
      const run01408 = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        const openPh = async (ph) => {
          const i = page.locator(`input[placeholder="${ph}"]`).first();
          await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        const pick = async (text) => {
          await page.locator(optSel).filter({ hasText: text }).first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        };
        await openPh('全部企业标签');
        await pick('专精特新');
        await openPh('全部行业领域');
        await pick('人工智能');
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          const t = await stack().innerText().catch(() => '');
          if (await isSuccessResult()) return;
          if (/推荐分析失败|任务失败|筛选条件未命中/.test(t) && !/可视化分析过程/.test(t)) {
            throw new Error('推荐分析进入失败态: ' + t.slice(0, 220));
          }
        }
        const t = await stack().innerText().catch(() => '');
        if (/可视化分析过程/.test(t)) {
          throw new Error('环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达条件筛选成功结果');
        }
        throw new Error('未在超时内到达条件筛选成功结果: ' + t.slice(0, 200));
      };
      const reachSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await run01408();
      };
      const pickPdfCta = async () => {
        const st = stack();
        const dataBtn = st.locator('[data-recruit-open-pdf-report]').first();
        if ((await dataBtn.count()) && (await dataBtn.isVisible().catch(() => false))) return dataBtn;
        const named = st.getByRole('button', { name: /创建\s*\/\s*查看\s*PDF\s*报告/ }).first();
        if ((await named.count()) && (await named.isVisible().catch(() => false))) return named;
        return null;
      };
      await dismissBasket();
      await reachSuccess();
      const pdfBtn = await pickPdfCta();
      if (!pdfBtn) throw new Error('结果区无「创建 / 查看 PDF 报告」入口');
      await expect(pdfBtn).toBeEnabled({ timeout: 8000 });
      await pdfBtn.click({ timeout: 10000 });
      const modal = page
        .locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal')
        .filter({ hasText: '推荐结果输出任务' })
        .last();
      await expect(modal).toBeVisible({ timeout: 15000 });
      await expect(modal.getByText('推荐结果输出任务', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、可见提交输出任务、组装结果快照、生成报告产物、可下载归档
    assert: |-
      const modal = page
        .locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal')
        .filter({ hasText: '推荐结果输出任务' })
        .last();
      for (const stage of ['提交输出任务', '组装结果快照', '生成报告产物', '可下载归档']) {
        await expect(modal.getByText(stage, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
  - note: 3、就绪后出现「下载产物」与「查看 PDF」
    assert: |-
      const modal = page
        .locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal')
        .filter({ hasText: '推荐结果输出任务' })
        .last();
      for (let i = 0; i < 36; i++) {
        const body = await modal.innerText().catch(() => '');
        if (/报告生成失败|创建报告任务失败/.test(body) && !/报告产物已就绪/.test(body)) {
          throw new Error('PDF 输出任务进入失败态: ' + body.slice(0, 220));
        }
        const dl = modal.getByRole('button', { name: '下载产物' });
        const pdf = modal.getByRole('button', { name: '查看 PDF' });
        if ((await dl.count()) && (await pdf.count())) {
          if ((await dl.first().isVisible()) && (await pdf.first().isVisible())) break;
        }
        if (i === 35) {
          throw new Error('环境闸门 ENV-ATTRACT-PDF-TASK-NO-SUCCESS-001：输出任务超时未就绪');
        }
        await page.waitForTimeout(2500);
      }
      await expect(modal.getByRole('button', { name: '下载产物' }).first()).toBeVisible({ timeout: 8000 });
      await expect(modal.getByRole('button', { name: '查看 PDF' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
