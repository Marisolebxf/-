id: FUNC-01426
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01426
priority: P1
tier: B
title: 主流程-详情抽屉
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01437恢复成功结果→点某行详情；抽屉在 expect 判定
expect:
  - note: 1、抽屉标题含该企业名与「招引推荐详情」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const isSuccessResult = async () => {
        const st = stack();
        const t = await st.innerText().catch(() => '');
        const url = page.url();
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const historyDeepLink = async () => {
        const origin = new URL(page.url()).origin;
        await page.goto(origin + '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history', {
          waitUntil: 'domcontentloaded',
        });
        await page.waitForTimeout(1200);
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return true;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/招引推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          return false;
        }
        return true;
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/招引推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染');
      };
      const tryRestoreCompletedFilter = async () => {
        const opened = await openRecentTab();
        if (!opened) return false;
        await waitHistoryShell();
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        if (n < 1) return false;
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成|完成/.test(txt)) {
            await btn.scrollIntoViewIfNeeded();
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 24; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const runOneFilter = async (tagLabel, industryLabel) => {
        const optSel =
          '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
        const openPh = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const i = page.locator(`input[placeholder="${ph}"]`).first();
          await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        const pickOption = async (text) => {
          const opt = page.locator(optSel).filter({ hasText: text }).first();
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        const filterTab = page.getByRole('tab', { name: '条件筛选推荐' });
        if (await filterTab.count()) await filterTab.first().click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const back = page.getByRole('button', { name: '返回配置' });
        if (await back.isVisible().catch(() => false)) await back.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await openPh('全部企业标签');
        await pickOption(tagLabel);
        await openPh('全部行业领域');
        await pickOption(industryLabel);
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        const st = stack();
        let last = '';
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          const url = page.url();
          if ((/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last)?.analyzed >= 1) return true;
          }
          if (/未命中任何企业候选/.test(last)) return false;
          if (/任务失败|分析失败|推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) return false;
        }
        if (/可视化分析过程/.test(last) || page.url().includes('analysis_view=processing')) {
          throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001');
        }
        return false;
      };
      const runFilter01408 = async () => {
        const pairs = [
          ['专精特新', '人工智能'],
          ['高新技术企业', '人工智能'],
          ['专精特新', '集成电路'],
        ];
        for (const [tag, ind] of pairs) {
          if (await runOneFilter(tag, ind)) return;
        }
        throw new Error('ENV-ATTRACT-NO-CANDIDATES-001');
      };
      const reachFilterSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await runFilter01408();
        await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      };
      const readRowEnterpriseName = async (row) => {
        const link = row.getByRole('link').first();
        if (await link.count()) {
          const raw = ((await link.innerText({ timeout: 8000 }).catch(() => '')) || '').trim();
          if (raw.length >= 2) return raw;
        }
        const txt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        const parts = txt.split(/\s+/).filter((p) => p.length >= 2 && !/^\d+(\.\d+)?$/.test(p));
        const hit = parts.find((p) => /公司|集团|有限|科技/.test(p));
        if (hit) return hit;
        throw new Error('结果行无企业名称可读');
      };
      await dismissBasket();
      await reachFilterSuccess();
      const st = stack();
      const row = st.locator('.arco-table-body .arco-table-tr').first();
      await expect(row).toBeVisible({ timeout: 10000 });
      const entName = await readRowEnterpriseName(row);
      const detail = row.getByRole('button', { name: '详情' }).first();
      await expect(detail).toBeVisible({ timeout: 8000 });
      await detail.click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      const title = await drawer.locator('.arco-drawer-header, .arco-drawer-title').first().innerText().catch(() => '');
      const titleText = title || (await drawer.innerText().catch(() => '')).split('\n')[0] || '';
      if (!titleText.includes(entName)) throw new Error('抽屉标题未含企业名「' + entName + '」');
      if (!/招引推荐详情/.test(titleText)) throw new Error('抽屉标题未含「招引推荐详情」');
      globalThis.__func01426 = { entName };
  - note: 2、可见三类综合维度、高潜挖掘依据、核心优势、关键指标、合作价值、风险信用、政策方向
    assert: |-
      const ctx = globalThis.__func01426;
      if (!ctx?.entName) throw new Error('前置：未打开详情抽屉');
      const drawer = page.locator('.arco-drawer:visible').first();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const sections = ['三类综合维度', '高潜挖掘依据', '核心优势', '关键指标', '合作价值', '风险信用', '政策方向'];
      for (const s of sections) {
        await expect(drawer.getByText(s, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
      const body = await drawer.innerText();
      if (!body.includes(ctx.entName)) throw new Error('抽屉正文与所选企业不一致');
on_fail: 截图 + 抄 X-Trace-Id
