id: FUNC-01414
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01414
priority: P1
tier: B
title: 恢复已完成条件筛选记录并回显本次筛选摘要
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 1、结果区出现「本次筛选」
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-trigger-popup:visible .arco-select-option';
      const ensureResult = async () => {
        for (let j = 0; j < 24; j++) {
          await page.waitForTimeout(500);
          const viewBtn = main.getByRole('button', { name: '查看结果' });
          if (await viewBtn.isVisible().catch(() => false)) {
            await viewBtn.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(1000);
          }
          const rt = await main.innerText().catch(() => '');
          if (/招引推荐分析结果/.test(rt) && /本次筛选/.test(rt)) return;
          if (/招引推荐分析结果/.test(rt) && !/可视化分析过程/.test(rt)) return;
        }
        throw new Error('恢复结果后未见招引推荐分析结果与本次筛选');
      };
      await page.keyboard.press('Escape').catch(() => {});
      await main.getByText('最近分析', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(1000);
      let restoreBtn = main.getByRole('button', { name: '恢复结果' }).first();
      if (!(await restoreBtn.isVisible().catch(() => false))) {
        await main.getByText('条件筛选推荐', { exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const openSelectByPh = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const inp = main.locator(`input[placeholder="${ph}"]`).first();
          await inp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
          await page.waitForTimeout(400);
        };
        const pickOpt = async (text) => {
          const opt = page.locator(optSel).filter({ hasText: text }).first();
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        };
        await openSelectByPh('全部企业标签');
        await pickOpt('专精特新');
        await openSelectByPh('全部行业领域');
        const aiOpt = page.locator(optSel).filter({ hasText: '人工智能' });
        if (await aiOpt.count()) await aiOpt.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: /^人工智能/ }).first().click({ timeout: 8000 });
        await page.waitForTimeout(300);
        const start = main.getByRole('button', { name: '开始分析' });
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        for (let i = 0; i < 40; i++) {
          await page.waitForTimeout(2500);
          const viewBtn = main.getByRole('button', { name: '查看结果' });
          if (await viewBtn.isVisible().catch(() => false)) {
            await viewBtn.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(1500);
          }
          const t = await main.innerText().catch(() => '');
          if (/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) break;
          if (/推荐分析失败|筛选条件未命中/.test(t) && !/可视化分析过程/.test(t)) break;
        }
        await main.getByText('最近分析', { exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(1000);
        restoreBtn = main.getByRole('button', { name: '恢复结果' }).first();
      }
      await expect(restoreBtn).toBeVisible({ timeout: 15000 });
      await restoreBtn.click({ timeout: 8000 });
      await ensureResult();
      await expect(main.getByText(/本次筛选/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、文中能对应本次企业标签与行业领域
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      const t = await main.innerText();
      const tagOk = /专精特新|高新技术|瞪羚|上市|外资|重点|科技型|独角兽/.test(t);
      const indOk = /人工智能|集成电路|生物医药|新能源|低空|量子|海洋|智能机器/.test(t);
      if (!tagOk) throw new Error('摘要中未见可识别的企业标签取值');
      if (!indOk) throw new Error('摘要中未见可识别的行业领域取值');
on_fail: 截图 + 抄 X-Trace-Id
