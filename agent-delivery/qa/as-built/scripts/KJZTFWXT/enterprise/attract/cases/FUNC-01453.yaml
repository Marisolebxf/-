id: FUNC-01453
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01453
priority: P1
tier: B
title: 备选-按此配置条件筛选
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 1、进入「条件筛选推荐」
    assert: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const pickSelectOption = async (selectIndex, optionName) => {
        const view = main.locator('.arco-select-view').nth(selectIndex);
        await expect(view).toBeVisible({ timeout: 15000 });
        await view.click({ timeout: 8000 });
        const opt = page
          .locator('.arco-select-dropdown:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option')
          .filter({ hasText: optionName })
          .first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
      };
      await pickSelectOption(0, '专精特新');
      await pickSelectOption(1, '人工智能');
      const runBtn = main.getByRole('button', { name: '开始分析' });
      await expect(runBtn).toBeEnabled({ timeout: 10000 });
      await runBtn.click({ timeout: 8000 });
      for (let i = 0; i < 90; i++) {
        const t = await stack().innerText().catch(() => '');
        if (/招引推荐分析结果/.test(t) && (/共分析|本次筛选|排名|搜索企业名称/.test(t))) break;
        const viewBtn = stack().getByRole('button', { name: '查看结果' });
        if (await viewBtn.isVisible().catch(() => false)) {
          await viewBtn.click({ timeout: 5000 }).catch(() => {});
        }
        await page.waitForTimeout(1000);
      }
      const historyTab = page
        .locator('.global-workbench-tabs [data-tab-key="history"]')
        .first()
        .or(page.getByRole('tab', { name: '最近分析' }).first());
      await expect(historyTab).toBeVisible({ timeout: 15000 });
      await historyTab.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      for (let i = 0; i < 30; i++) {
        const t = await stack().innerText().catch(() => '');
        if (/任务名称/.test(t) && /按此配置新建/.test(t)) break;
        await page.waitForTimeout(500);
      }
      const buttons = stack().getByRole('button', { name: '按此配置新建' });
      await expect(buttons.first()).toBeVisible({ timeout: 15000 });
      let newBtn = null;
      const n = await buttons.count();
      for (let i = 0; i < n; i++) {
        const btn = buttons.nth(i);
        let row = btn.locator('xpath=ancestor::tr[1]');
        if ((await row.count()) < 1) {
          row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
        }
        const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
        if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
          newBtn = btn;
          break;
        }
      }
      if (!newBtn) newBtn = buttons.first();
      await newBtn.scrollIntoViewIfNeeded();
      await newBtn.click({ timeout: 15000 });
      await page.waitForTimeout(800);
      await expect(page.getByRole('tab', { name: '条件筛选推荐' })).toHaveAttribute('aria-selected', 'true', { timeout: 15000 });
  - note: 2、条件区带回该次筛选值
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      const t = await main.innerText();
      if (!/专精特新/.test(t) || !/人工智能/.test(t)) {
        throw new Error('条件区未回显专精特新与人工智能');
      }
      await expect(main.getByText('专精特新').first()).toBeVisible({ timeout: 8000 });
      await expect(main.getByText('人工智能').first()).toBeVisible({ timeout: 8000 });
  - note: 3、不自动开始分析
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      await expect(main.getByText('可视化分析过程')).toHaveCount(0);
      await expect(main.getByText('招引推荐分析结果')).toHaveCount(0);
      await expect(main.getByRole('button', { name: '开始分析' })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
