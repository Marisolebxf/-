id: P0-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00990
priority: P0
title: 招引推荐指数旁ⓘ点开含指标口径要素
story: US-ENT-RECRUIT-A2
entry_id: ent-attract
preconditions:
- 已成功完成一次分析且结果区指数可见
locators:
  info: button aria-label「指标说明：招引推荐指数」
steps:
- action: click
  target: 指标说明：招引推荐指数
- action: evaluate
  note: 核对口径要素；再开一次
expect:
- note: 弹卡内容含指标名、口径定义、公式与更新频率要素
  assert: |-
    const stack = page.getByTestId('recruit-tab-stack'); if (!(await stack.getByText('招引推荐分析结果').count())) { await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const ph = page.locator('input[placeholder="全部企业标签"]').first(); await ph.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: '高新技术企业' }).first().click(); await page.getByRole('button', { name: '开始分析' }).click(); for (let i = 0; i < 24; i++) { await page.waitForTimeout(2500); if (await stack.getByText('招引推荐分析结果').count()) break } }; let info = page.getByRole('button', { name: /指标说明：招引推荐指数/ }); if (!(await info.count())) { await page.locator('button.persona-switch').first().click(); await page.waitForTimeout(600); const sw = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); if ((await sw.getAttribute('aria-checked')) !== 'true') { await sw.click(); await page.waitForTimeout(900) }; await page.keyboard.press('Escape'); await page.waitForTimeout(400); info = page.getByRole('button', { name: /指标说明：招引推荐指数/ }) }; if (!(await info.count())) throw new Error('无指标说明按钮'); await info.first().click({ timeout: 8000 }); await page.waitForTimeout(700); const pop = page.locator('.arco-trigger-popup:visible, .arco-popover:visible').last(); const txt = await pop.innerText(); for (const k of ['口径定义','公式','更新频率']) { if (!txt.includes(k)) throw new Error('弹卡缺要素: ' + k) }
- note: 多次开关稳定不报错
  assert: |-
    await page.keyboard.press('Escape'); await page.waitForTimeout(400); const info = page.getByRole('button', { name: /指标说明：招引推荐指数/ }).first(); await info.click({ timeout: 8000 }); await page.waitForTimeout(600); await expect(page.locator('.arco-trigger-popup:visible, .arco-popover:visible').last()).toBeVisible({ timeout: 8000 }); await page.keyboard.press('Escape')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 业务态若无 ⓘ，开评审后可见（实勘多处 metric-spec-card）；metric_id=M_ENT_ATTRACT_RECRUIT_INDEX。
tier: B
