id: FUNC-01441
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01441
priority: P1
tier: B
title: 主流程-返回候选列表
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01409造已完成候选工作台记录
    script: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candTab =
        page.locator('.global-workbench-tabs [data-tab-key="candidates"]').first().or(
          page.getByRole('tab', { name: '候选工作台' }).first(),
        );
      await expect(candTab).toBeVisible({ timeout: 15000 });
      await candTab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const rowCheck = main.locator('.arco-table-body .arco-checkbox').first();
      await expect(rowCheck).toBeVisible({ timeout: 15000 });
      await rowCheck.click({ timeout: 8000 });
      const reviewBtn = main.getByRole('button', { name: '执行指定对象复核' });
      await expect(reviewBtn).toBeEnabled({ timeout: 10000 });
      await reviewBtn.click({ timeout: 8000 });
      const startBtn = main.getByRole('button', { name: '开始分析' });
      await expect(startBtn).toBeVisible({ timeout: 15000 });
      await startBtn.click({ timeout: 8000 });
      for (let i = 0; i < 90; i++) {
        const t = await stack().innerText().catch(() => '');
        if (/人工线索复核结果/.test(t)) break;
        await page.waitForTimeout(1000);
      }
      await expect(stack().getByText(/人工线索复核结果/).first()).toBeVisible({ timeout: 5000 });
  - action: evaluate
    note: 打开最近分析
    script: |-
      const tab =
        page.locator('.global-workbench-tabs [data-tab-key="history"]').first().or(
          page.getByRole('tab', { name: '最近分析' }).first(),
        );
      await expect(tab).toBeVisible({ timeout: 15000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const stack = page.getByTestId('recruit-tab-stack');
      for (let i = 0; i < 24; i++) {
        const t = await stack.innerText().catch(() => '');
        if (/任务名称/.test(t) && (/恢复结果/.test(t) || /暂无|还没有/.test(t))) break;
        await page.waitForTimeout(500);
      }
  - action: evaluate
    note: 对该记录点击「恢复结果」
    script: |-
      const stack = page.getByTestId('recruit-tab-stack');
      const buttons = stack.getByRole('button', { name: '恢复结果' });
      const n = await buttons.count();
      if (n < 1) throw new Error('最近分析无「恢复结果」按钮');
      let target = null;
      for (let i = 0; i < n; i++) {
        const btn = buttons.nth(i);
        let row = btn.locator('xpath=ancestor::tr[1]');
        if ((await row.count()) < 1) {
          row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
        }
        const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
        if (txt && /已完成/.test(txt) && /候选工作台/.test(txt)) {
          target = btn;
          break;
        }
      }
      if (!target) {
        for (let i = n - 1; i >= 0; i--) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && !/条件筛选/.test(txt)) {
            target = btn;
            break;
          }
        }
      }
      if (!target) target = buttons.first();
      await target.scrollIntoViewIfNeeded();
      await target.click({ timeout: 15000 });
      for (let i = 0; i < 48; i++) {
        const t = await stack.innerText().catch(() => '');
        if (/人工线索复核结果/.test(t) && /返回候选列表/.test(t)) break;
        const viewBtn = stack.getByRole('button', { name: '查看结果' }).first();
        if (await viewBtn.isVisible().catch(() => false)) {
          await viewBtn.click({ timeout: 8000 });
        }
        await page.waitForTimeout(500);
      }
      await expect(stack.getByRole('button', { name: '返回候选列表' }).first()).toBeVisible({
        timeout: 5000,
      });
  - action: evaluate
    note: 点击「返回候选列表」
    script: |-
      const stack = page.getByTestId('recruit-tab-stack');
      const backBtn = stack.getByRole('button', { name: '返回候选列表' }).first();
      await expect(backBtn).toBeVisible({ timeout: 15000 });
      await backBtn.click({ timeout: 15000 });
      await page.waitForTimeout(800);
expect:
  - note: 1、回到「人工线索候选工作台」
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      await expect(stack.getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({
        timeout: 15000,
      });
  - note: 2、名单仍可勾选
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      const rows = stack.locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 10000 });
      const firstCb = rows.first().locator('.arco-checkbox').first();
      await expect(firstCb).toBeVisible({ timeout: 8000 });
      const bar = stack.getByTestId('candidate-action-bar');
      await expect(bar).toBeVisible({ timeout: 8000 });
      await firstCb.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect
        .poll(async () => ((await firstCb.getAttribute('class')) || '').includes('arco-checkbox-checked'))
        .toBe(true);
      const afterBar = ((await bar.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const selM = afterBar.match(/已选\s*(\d+)\s*家/);
      const selected = selM ? parseInt(selM[1], 10) : 0;
      await expect(selected).toBeGreaterThanOrEqual(1);
on_fail: 截图 + 抄 X-Trace-Id
