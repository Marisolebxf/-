id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00980
priority: P0
title: 条件区含企业标签行业领域与区域三选择器且占位正确
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入招引页且停留「条件筛选推荐」Tab
locators:
  tag_label: 条件区文案「企业标签」
  field_label: 条件区文案「行业领域」
  region_label: 条件区文案「地域来源」（用例称区域）
  tag_ph: placeholder「全部企业标签」
  field_ph: placeholder「全部行业领域」
  region_ph: aria-label「选择区域」/ title·文案「全国 / 全部」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
  - action: evaluate
    note: 浏览条件区三选择器标签与占位
expect:
  - note: 条件区含企业标签、行业领域、区域（实勘标签「地域来源」）三选择器
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const stack = page.getByTestId('recruit-tab-stack'); await expect(stack.getByText('企业标签', { exact: true }).first()).toBeVisible({ timeout: 8000 }); await expect(stack.getByText('行业领域', { exact: true }).first()).toBeVisible({ timeout: 8000 }); await expect(stack.getByText('地域来源', { exact: true }).first()).toBeVisible({ timeout: 8000 })
  - note: 三选择器占位分别为「全部企业标签」「全部行业领域」「全国 / 全部」
    assert: |-
      await expect(page.locator('input[placeholder="全部企业标签"]').first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('input[placeholder="全部行业领域"]').first()).toBeVisible({ timeout: 8000 }); const region = page.locator('[aria-label="选择区域"]'); await expect(region.first()).toBeVisible({ timeout: 8000 }); const title = (await region.first().getAttribute('title')) || ''; if (title !== '全国 / 全部') throw new Error('区域占位 title 非「全国 / 全部」: ' + title); await expect(page.getByText('全国 / 全部').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 区域控件标签文案实勘为「地域来源」（用例称区域）；占位/title 为「全国 / 全部」，aria-label=选择区域。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
