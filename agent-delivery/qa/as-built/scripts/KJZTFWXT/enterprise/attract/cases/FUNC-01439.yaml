id: FUNC-01439
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01439
priority: P1
tier: B
title: 主流程-报告条件筛选
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01408前置+最近分析点已完成条件筛选「查看 HTML 报告」；报告页在 expect 判定
expect:
  - note: 1、出现「招引推荐报告」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const reportReady = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        if (!(await reader.isVisible().catch(() => false))) return false;
        return await reader.locator('h1').filter({ hasText: '招引推荐报告' }).first().isVisible().catch(() => false);
      };
      const waitReportBody = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await reportReady()) return true;
          await page.waitForTimeout(600);
        }
        return await reportReady();
      };
      const ensureFilterSuccess = async () => {
        await expect(stack()).toBeVisible({ timeout: 15000 });
        await page.keyboard.press('Escape').catch(() => {});
        const tagInput = page.locator('input[placeholder="全部企业标签"]').first();
        await tagInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const tagOpt = page.locator(optSel).filter({ hasText: '专精特新' }).first();
        await expect(tagOpt).toBeVisible({ timeout: 8000 });
        await tagOpt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const industryInput = page.locator('input[placeholder="全部行业领域"]').first();
        await industryInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const industryOpt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(industryOpt).toBeVisible({ timeout: 8000 });
        await industryOpt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        const title = () => stack().getByText('招引推荐分析结果', { exact: true }).first();
        let last = '';
        for (let i = 0; i < 60; i++) {
          await page.waitForTimeout(i === 0 ? 800 : 2500);
          last = await stack().innerText().catch(() => '');
          if (await stack().getByText('推荐分析失败').first().isVisible().catch(() => false) && !/可视化分析过程/.test(last)) {
            throw new Error('条件筛选发起后进入推荐分析失败，无法构造前置已完成记录');
          }
          const titleVis = await title().isVisible().catch(() => false);
          if (titleVis && !/可视化分析过程/.test(last)) return;
          if (/已打开今天相同条件的推荐分析结果/.test(last) && titleVis) return;
        }
        throw new Error('未在超时内到达招引推荐分析结果: ' + last.slice(0, 200));
      };
      const openRecentTab = async () => {
        const tablist = page.getByRole('tablist', { name: '招引企业推荐分析页签' });
        await expect(tablist).toBeVisible({ timeout: 12000 });
        await tablist.getByRole('tab', { name: '最近分析' }).click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await expect(page.getByText('招引推荐 · 最近分析').first()).toBeVisible({ timeout: 15000 });
      };
      const pickCompletedFilterHtmlReport = async () => {
        const st = stack();
        const buttons = st.locator('[data-recruit-history-open-html-report], button').filter({ hasText: '查看 HTML 报告' });
        const n = await buttons.count();
        if (n < 1) return null;
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          if (await btn.isDisabled().catch(() => true)) continue;
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt) && !/候选工作台/.test(txt)) return btn;
        }
        return null;
      };
      const openReportFromHistory = async () => {
        await dismissBasket();
        await openRecentTab();
        let reportBtn = await pickCompletedFilterHtmlReport();
        if (!reportBtn) {
          await tablist().getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(500);
          await ensureFilterSuccess();
          await openRecentTab();
          reportBtn = await pickCompletedFilterHtmlReport();
        }
        if (!reportBtn) {
          throw new Error('最近分析无「已完成」的条件筛选任务可「查看 HTML 报告」');
        }
        await reportBtn.scrollIntoViewIfNeeded().catch(() => {});
        await reportBtn.click({ timeout: 15000 });
        if (!(await waitReportBody(60000))) {
          throw new Error('点击 HTML 报告后未进入只读报告页，url=' + page.url());
        }
      };
      const tablist = () => page.getByRole('tablist', { name: '招引企业推荐分析页签' });
      await openReportFromHistory();
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader.locator('h1').filter({ hasText: '招引推荐报告' }).first()).toBeVisible({ timeout: 12000 });
  - note: 2、可见「返回分析结果」
    assert: |-
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      const back = reader.locator('[data-report-back], button').filter({ hasText: '返回分析结果' }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
  - note: 3、目录含报告身份、执行摘要、对象与范围
    assert: |-
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      const toc = reader.locator('nav.report-toc');
      await expect(toc).toBeVisible({ timeout: 8000 });
      const tocText = await toc.innerText();
      for (const label of ['报告身份', '执行摘要', '对象与范围']) {
        if (!tocText.includes(label)) {
          throw new Error('报告目录缺「' + label + '」；目录片段=' + tocText.slice(0, 200));
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
