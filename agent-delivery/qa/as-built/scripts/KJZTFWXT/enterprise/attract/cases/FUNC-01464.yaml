id: FUNC-01464
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01464
priority: P1
title: 异常-结果搜索无匹配
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；已打开一条条件筛选的成功结果（assert 自含）
locators:
  result_search: input[placeholder="搜索企业名称"]
  filtered_count: 文案「当前筛选」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
  - action: wait
    for: 招引页 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 成功结果→「搜索企业名称」输入不存在的企业名；当前筛选与任务门控在 expect
expect:
  - note: 1、「当前筛选」为 0 家
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const histRoute =
        '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history';
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const TAG = '高新技术企业';
      const FIELD_PRIMARY = '人工智能';
      const FIELD_FALLBACK = '新一代信息技术';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        const filteredM = text.match(/当前筛选\s*(\d+)\s*家/);
        if (!analyzedM || !filteredM) return null;
        return { analyzed: parseInt(analyzedM[1], 10), filtered: parseInt(filteredM[1], 10) };
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        if (!(await hasHistoryTab())) {
          await page.goto(baseUrl.replace(/\/$/, '') + histRoute, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
        }
        if (!(await hasHistoryTab())) return false;
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
          if ((await legacy.count()) < 1) {
            const byName = page.getByRole('tab', { name: '最近分析' });
            if ((await byName.count()) < 1) return false;
            await byName.first().click({ timeout: 8000 });
          } else await legacy.click({ timeout: 8000 });
        } else await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        return true;
      };
      const isSuccessResult = async () => {
        const st = stack();
        const t = await st.innerText().catch(() => '');
        const url = page.url();
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const isExplicitFailPanel = async (st) => {
        const t = await st.innerText().catch(() => '');
        if (/可视化分析过程/.test(t)) return false;
        const back = st.getByRole('button', { name: '返回配置' }).first();
        const retry = st.getByRole('button', { name: '重试（保留条件）' }).first();
        return (
          (await back.isVisible().catch(() => false)) && (await retry.isVisible().catch(() => false))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        if (!(await openRecentTab())) return false;
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!(txt && /已完成/.test(txt) && /条件筛选/.test(txt))) continue;
          await btn.click({ timeout: 15000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult()) return true;
          }
          if (!(await openRecentTab())) break;
        }
        return await isSuccessResult();
      };
      const waitSuccessResult = async (rounds = 48) => {
        const st = stack();
        let last = '';
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          const url = page.url();
          if ((/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last)?.analyzed >= 1) return;
          }
          if ((await isExplicitFailPanel(st)) && !/可视化分析过程/.test(last)) {
            throw new Error(
              '环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：条件筛选无法到达「招引推荐分析结果」（observed 推荐分析失败页，与 FUNC-01418/01449 同源 D4）',
            );
          }
        }
        const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
        if (stuck) {
          const hist = await hasHistoryTab();
          throw new Error(
            '环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达成功结果以测结果内无匹配搜索' +
              (hist ? '' : '（仅两 Tab 无最近分析）') +
              '（与 FUNC-01418 同源 D4）',
          );
        }
        throw new Error('未在超时内到达条件筛选成功结果: ' + last.slice(0, 200));
      };
      const openPh = async (ph) => {
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator(`input[placeholder="${ph}"]`).first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const pickOption = async (text) => {
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const reachFilterSuccess = async () => {
        await waitFilterReady();
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter() && (await isSuccessResult())) return;
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        await openPh('全部企业标签');
        await pickOption(TAG);
        await openPh('全部行业领域');
        const ai = page.locator(optSel).filter({ hasText: FIELD_PRIMARY });
        if (await ai.count()) await ai.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: FIELD_FALLBACK }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitSuccessResult();
        await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      };
      const readResultNames = async () => {
        const st = stack();
        const cells = st.locator('.arco-table-body .arco-table-td').filter({ hasText: /公司|集团|有限|科技|股份/ });
        const n = await cells.count();
        const names = [];
        for (let i = 0; i < Math.min(n, 20); i++) {
          const raw = ((await cells.nth(i).innerText().catch(() => '')) || '').trim();
          if (raw.length >= 2 && !/排名|企业名称|详情/.test(raw)) names.push(raw);
        }
        return names;
      };
      const pickNoMatchQuery = (names) => {
        const tries = ['FUNC01464不存在企业', 'ZZZ_NO_MATCH_01464', '𠀀𠀁无此企业名'];
        for (const q of tries) {
          const lower = q.toLocaleLowerCase('zh-CN');
          if (!names.some((n) => n.toLocaleLowerCase('zh-CN').includes(lower))) return q;
        }
        return 'NO_MATCH_' + Date.now();
      };
      await dismissBasket();
      await reachFilterSuccess();
      const taskBefore = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      const st = stack();
      const bodyBefore = await st.innerText().catch(() => '');
      const before = parseCounts(bodyBefore);
      if (!before || before.analyzed < 1) {
        throw new Error('成功结果未见「共分析/当前筛选」计数: ' + bodyBefore.slice(0, 200));
      }
      const names = await readResultNames();
      const noMatch = pickNoMatchQuery(names);
      const search = st.locator('input[placeholder="搜索企业名称"]').first();
      await expect(search).toBeVisible({ timeout: 10000 });
      await search.fill(noMatch);
      await search.press('Enter');
      let filtered = before.filtered;
      for (let i = 0; i < 16; i++) {
        await page.waitForTimeout(400);
        const t = await st.innerText().catch(() => '');
        const c = parseCounts(t);
        if (c) {
          filtered = c.filtered;
          if (filtered === 0) break;
        }
      }
      if (filtered !== 0) {
        throw new Error('无匹配搜索后「当前筛选」仍为 ' + filtered + ' 家，query=' + noMatch);
      }
      globalThis.__func01464 = { taskBefore, analyzedBefore: before.analyzed, noMatch };
  - note: 2、不新增分析任务
    assert: |-
      const ctx = globalThis.__func01464;
      if (!ctx) throw new Error('前置：未完成结果内无匹配搜索');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const st = stack();
      const body = await st.innerText().catch(() => '');
      if (/可视化分析过程/.test(body)) {
        throw new Error('无匹配搜索后误入「可视化分析过程」，疑似新建分析任务');
      }
      const taskAfter = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      if (ctx.taskBefore && taskAfter && ctx.taskBefore !== taskAfter) {
        throw new Error('搜索后 task_id 变化：' + ctx.taskBefore + ' -> ' + taskAfter);
      }
      const analyzedM = body.match(/共分析\s*(\d+)\s*家/);
      if (!analyzedM) throw new Error('搜索后未见「共分析」');
      const analyzedAfter = parseInt(analyzedM[1], 10);
      if (analyzedAfter !== ctx.analyzedBefore) {
        throw new Error(
          '共分析家数变化（' + ctx.analyzedBefore + ' -> ' + analyzedAfter + '），疑似重新分析而非前端过滤',
        );
      }
      await expect(st.locator('input[placeholder="搜索企业名称"]').first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·svcz 深链 catalog_path=/enterprise/attraction（禁止 forbidden_paths）。前置同 01418/01449：栈内成功态→最近分析恢复已完成条件筛选→高新+人工智能发起。结果 placeholder「搜索企业名称」；无匹配→当前筛选 0 家且共分析/task_id 不变。D4·无异步成功→ ENV-ATTRACT-ASYNC-NO-SUCCESS-001。登录与关评审由 runner 前置。B 档零 allow_skip。
