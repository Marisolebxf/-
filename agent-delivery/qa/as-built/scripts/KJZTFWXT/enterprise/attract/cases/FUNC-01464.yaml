id: FUNC-01464
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01464
priority: P1
tier: B
title: 异常-结果搜索无匹配
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: wait
    for: 招引页渲染
    timeout_ms: 2500
  - action: evaluate
    note: 同册01408前置→结果内搜索无匹配名；断言在 expect
expect:
  - note: 1、「当前筛选」为 0 家
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const FILTER_TRIES = [
        { tag: '专精特新', field: '人工智能' },
        { tag: '高新技术企业', field: '人工智能' },
        { tag: '高新技术企业', field: '新一代信息技术' },
      ];
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染');
      };
      const parseCounts = (text) => {
        const filteredM = text.match(/当前筛选\s*(\d+)\s*家/);
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!filteredM || !analyzedM) return null;
        return { filtered: parseInt(filteredM[1], 10), analyzed: parseInt(analyzedM[1], 10) };
      };
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        const c = parseCounts(t);
        return c && c.analyzed >= 1 && /招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t);
      };
      const openRecentAndRestore = async () => {
        await page.getByRole('tab', { name: '最近分析' }).click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!(txt && /已完成/.test(txt) && /条件筛选/.test(txt))) continue;
          await btn.click({ timeout: 15000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult()) return true;
          }
        }
        return false;
      };
      const waitSuccessResult = async () => {
        const st = stack();
        let last = '';
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          if (/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last) && parseCounts(last)?.analyzed >= 1) return;
          const fail = st.getByRole('button', { name: '返回配置' });
          if ((await fail.isVisible().catch(() => false)) && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：条件筛选无法到达成功结果');
          }
        }
        if (/可视化分析过程/.test(last)) {
          throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：分析超时仍停在过程页');
        }
        throw new Error('未到达成功结果: ' + last.slice(0, 180));
      };
      const openSelect = async (ph) => {
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator(`input[placeholder="${ph}"]`).first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const pickOption = async (text) => {
        await page.locator(optSel).filter({ hasText: text }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const runFilterAnalysis = async (tag, field) => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await openSelect('全部企业标签');
        await pickOption(tag);
        await openSelect('全部行业领域');
        const opt = page.locator(optSel).filter({ hasText: field });
        if ((await opt.count()) < 1) return false;
        await opt.first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        if (!(await start.isEnabled().catch(() => false))) return false;
        await start.click();
        try {
          await waitSuccessResult();
          return true;
        } catch (e) {
          if (String(e.message || e).includes('ENV-ATTRACT')) return false;
          throw e;
        }
      };
      const reachSuccess = async () => {
        await waitFilterReady();
        if (await isSuccessResult()) return;
        if (await openRecentAndRestore()) return;
        for (const combo of FILTER_TRIES) {
          if (await runFilterAnalysis(combo.tag, combo.field)) return;
          await page.getByRole('button', { name: '返回配置' }).click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(600);
        }
        throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法到达条件筛选成功结果');
      };
      await reachSuccess();
      const st = stack();
      const bodyBefore = await st.innerText().catch(() => '');
      const before = parseCounts(bodyBefore);
      if (!before || before.analyzed < 1) throw new Error('成功结果无计数');
      const taskBefore = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      const noMatch = 'FUNC01464不存在企业ZZZ';
      const search = st.locator('input[placeholder="搜索企业名称"]').first();
      await expect(search).toBeVisible({ timeout: 10000 });
      await search.fill(noMatch);
      await search.press('Enter');
      let filtered = before.filtered;
      for (let i = 0; i < 20; i++) {
        await page.waitForTimeout(400);
        const c = parseCounts(await st.innerText().catch(() => ''));
        if (c) {
          filtered = c.filtered;
          if (filtered === 0) break;
        }
      }
      await expect(st.getByText(/当前筛选\s*0\s*家/)).toBeVisible({ timeout: 8000 });
      globalThis.__func01464 = { taskBefore, analyzedBefore: before.analyzed };
  - note: 2、不新增分析任务
    assert: |-
      const ctx = globalThis.__func01464;
      if (!ctx) throw new Error('前置未完成');
      const st = page.getByTestId('recruit-tab-stack');
      const body = await st.innerText().catch(() => '');
      await expect(st.getByText(/可视化分析过程/)).not.toBeVisible();
      const taskAfter = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      if (ctx.taskBefore && taskAfter && ctx.taskBefore !== taskAfter) {
        throw new Error('task_id 变化，疑似新建任务');
      }
      const analyzedM = body.match(/共分析\s*(\d+)\s*家/);
      if (!analyzedM) throw new Error('未见共分析');
      if (parseInt(analyzedM[1], 10) !== ctx.analyzedBefore) {
        throw new Error('共分析家数变化，疑似重新分析');
      }
on_fail: 截图 + 抄 X-Trace-Id
