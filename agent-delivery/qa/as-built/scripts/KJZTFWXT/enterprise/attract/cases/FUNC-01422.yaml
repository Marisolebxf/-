id: FUNC-01422
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01422
priority: P1
tier: B
title: 当天相同条件再次开始打开已有结果且不新增最近分析任务
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 1、打开已有的「招引推荐分析结果」
    assert: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const TAG = '专精特新';
      const FIELD = '人工智能';
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const goFilterTab = async () => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const openSelect = async (ph) => {
        await goFilterTab();
        const inp = main.locator(`input[placeholder="${ph}"]`).first();
        await inp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const pickOpt = async (text) => {
        await page.locator(optSel).filter({ hasText: text }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const applyFilters = async () => {
        await openSelect('全部企业标签');
        await pickOpt(TAG);
        await main.locator('.arco-cascader-view').first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await main.getByText(FIELD, { exact: true }).click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const successResultVisible = async () => {
        const t = await stack().innerText().catch(() => '');
        return /招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t) && /共分析\s*\d+\s*家/.test(t);
      };
      const waitFirstSuccess = async () => {
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          if (await successResultVisible()) return;
          const t = await stack().innerText().catch(() => '');
          if (/推荐分析失败|任务失败/.test(t) && !/可视化分析过程/.test(t)) {
            throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：条件筛选分析失败，无法造出当天成功前置');
          }
        }
        const t = await stack().innerText().catch(() => '');
        if (/可视化分析过程/.test(t)) {
          throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：长期停留在可视化分析过程');
        }
        throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：超时未达招引推荐分析结果');
      };
      const tryRestoreCompleted = async () => {
        const hist = page.locator('button[data-tab-key="history"]');
        const tab = (await hist.count()) ? hist.first() : page.getByRole('tab', { name: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const restore = stack().getByRole('button', { name: '恢复结果' });
        const n = await restore.count();
        for (let i = 0; i < n; i++) {
          const row = restore.nth(i).locator('xpath=ancestor::tr[1]');
          const txt = await row.innerText().catch(() => '');
          if (!/已完成/.test(txt) || !/条件筛选/.test(txt)) continue;
          if (!/专精特新/.test(txt) || !/人工智能/.test(txt)) continue;
          await restore.nth(i).click({ timeout: 12000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await successResultVisible()) return true;
          }
        }
        return false;
      };
      if (!(await successResultVisible())) {
        if (!(await tryRestoreCompleted())) {
          await applyFilters();
          const start = main.getByRole('button', { name: '开始分析' }).first();
          await expect(start).toBeEnabled({ timeout: 8000 });
          await start.click();
          await waitFirstSuccess();
        }
      }
      const countRecRows = async () => {
        const hist = page.locator('button[data-tab-key="history"]');
        const tab = (await hist.count()) ? hist.first() : page.getByRole('tab', { name: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const t = await stack().innerText().catch(() => '');
        const n = (t.match(/REC-/g) || []).length;
        await goFilterTab();
        return n;
      };
      const nBefore = await countRecRows();
      await page.evaluate((n) => { window.__func01422_nBefore = n; }, nBefore);
      await applyFilters();
      const start2 = main.getByRole('button', { name: '开始分析' }).first();
      await expect(start2).toBeEnabled({ timeout: 8000 });
      await start2.click();
      for (let i = 0; i < 36; i++) {
        await page.waitForTimeout(500);
        if (await successResultVisible()) break;
      }
      await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 10000 });
  - note: 2、最近分析不新增一条任务
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const nBefore = await page.evaluate(() => window.__func01422_nBefore ?? -1);
      const hist = page.locator('button[data-tab-key="history"]');
      const tab = (await hist.count()) ? hist.first() : page.getByRole('tab', { name: '最近分析' }).first();
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(stack().getByText('任务名称').first()).toBeVisible({ timeout: 8000 });
      const t = await stack().innerText().catch(() => '');
      const nAfter = (t.match(/REC-/g) || []).length;
      if (nBefore >= 0 && nAfter > nBefore) {
        throw new Error('最近分析 REC- 条数增加：' + nBefore + ' -> ' + nAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id
