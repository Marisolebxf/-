id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00984
priority: P0
title: 设置任一条件后开始分析恢复可用且须显式发起
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
  - 已登录 admin（已在业务页且 URL 不含 /login 则不重复登录）
  - 已进入招引页且停留「条件筛选推荐」Tab
  - 当前无条件且「开始分析」置灰
locators:
  start: button「开始分析」
  tag_ph: placeholder「全部企业标签」
  tag_opt: 高新技术企业
  empty_hint: 请设置条件并执行推荐分析
steps:
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
  - action: evaluate
    note: 选企业标签「高新技术企业」→核对开始分析恢复可用且不自动跑
expect:
  - note: 任一条件设置后「开始分析」恢复可用
    assert: |-
      const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeVisible({ timeout: 8000 }); await expect(start).toBeDisabled({ timeout: 8000 }); const ph = page.locator('input[placeholder="全部企业标签"]').first(); await ph.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: '高新技术企业' }).first().click(); await page.waitForTimeout(600); await expect(start).toBeEnabled({ timeout: 8000 }); const cls = (await start.getAttribute('class')) || ''; if (/arco-btn-disabled/.test(cls)) throw new Error('选标签后开始分析仍含 arco-btn-disabled')
  - note: 恢复可用后不自动执行分析须显式点击发起
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack'); await page.waitForTimeout(800); await expect(stack.getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 8000 }); const t = await stack.innerText(); if (/可视化分析过程/.test(t)) throw new Error('选条件后自动进入分析过程'); if (/招引推荐分析结果/.test(t) && !t.includes('请设置条件')) throw new Error('选条件后自动出现结果态'); if (/analysis_view=processing/.test(page.url())) throw new Error('选条件后 URL 自动进入 processing')
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: 门控条件为企业标签；env-gate 合法项「高新技术企业」选后开始分析 enabled，结果区仍见「请设置条件并执行推荐分析」（不自动跑）。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
