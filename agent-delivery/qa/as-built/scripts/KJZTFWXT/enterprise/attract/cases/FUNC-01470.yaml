id: FUNC-01470
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01470
priority: P1
title: 备选-删除取消（候选工作台）
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；最近分析有一条候选工作台且状态为已完成的记录
locators:
  recent_tab: Tab「最近分析」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history
  - action: wait
    for: 招引页 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 最近分析→已完成候选工作台行点「删除」→弹框点「取消」；弹窗标题与行仍在 expect 判定
expect:
  - note: 1、弹窗含「删除分析记录」
    assert: |-
      const toUrl = (p) => baseUrl.replace(/\/$/, '') + (p.startsWith('/') ? p : '/' + p);
      const histRoute =
        '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history';
      const stack = () => page.getByTestId('recruit-tab-stack');
      const TID_RE = /REC-\d{8}-\d+/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const historyDeepLink = async () => {
        await page.goto(toUrl(histRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/招引推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-ATTRACT-NO-HISTORY-TAB-001：现场招引页无「最近分析」Tab/深链（仅条件筛选+候选工作台时不自动化本用例）',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/招引推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const scrollHistoryActions = async () => {
        const bodies = stack().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const isSuccessCandidateRow = (rowText, taskIdHint) => {
        if (!rowText || !TID_RE.test(rowText)) return false;
        if (taskIdHint && !rowText.includes(taskIdHint)) return false;
        if (/条件筛选/.test(rowText) && !/候选工作台/.test(rowText)) return false;
        if (!/候选工作台/.test(rowText)) return false;
        if (!/恢复结果/.test(rowText)) return false;
        if (/失败|处理中|已取消/.test(rowText)) return false;
        return true;
      };
      const pickSuccessCandidateOnPage = async (taskIdHint) => {
        await scrollHistoryActions();
        const rows = stack().locator('table tbody tr, .arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const txt = await row.innerText().catch(() => '');
          if (!isSuccessCandidateRow(txt, taskIdHint)) continue;
          const del = row.getByRole('button', { name: '删除', exact: true }).last();
          if ((await del.count()) < 1) continue;
          await row.scrollIntoViewIfNeeded();
          await scrollHistoryActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          const tidM = txt.match(TID_RE);
          if (!tidM) continue;
          return { del, tid: tidM[0], rowTxt: txt };
        }
        return null;
      };
      const pickSuccessCandidateDelete = async (taskIdHint) => {
        const pag = stack().locator('.arco-pagination').first();
        for (let guard = 0; guard < 24; guard++) {
          const hit = await pickSuccessCandidateOnPage(taskIdHint);
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      const fetchSuccessCandidateTaskId = async () => {
        const listUrl = toUrl('/topicAsync/topic/v1/analysis/tasks/list');
        for (const user_id of ['admin', 'guest']) {
          for (let pageNum = 1; pageNum <= 8; pageNum++) {
            const resp = await page.request.post(listUrl, {
              data: {
                user_id,
                analysisType: 'talent_recommend',
                subType: 'attraction',
                page: pageNum,
                size: 50,
              },
            });
            if (!resp.ok()) continue;
            let json = {};
            try { json = await resp.json(); } catch { continue; }
            const data = json?.data ?? json;
            const records = data?.records ?? data?.list ?? [];
            for (const r of records) {
              if (String(r?.status || '').toLowerCase() !== 'success') continue;
              let params = {};
              try {
                params = r.targetParams ? JSON.parse(r.targetParams) : {};
              } catch { params = {}; }
              if (params.selectionMode === 'candidate_workbench') return String(r.taskId || r.taskName || '');
            }
            if (!records.length || records.length < 50) break;
          }
        }
        return null;
      };
      await dismissBasket();
      await openRecentTab();
      await waitHistoryShell();
      let taskHint = globalThis.__func01470_success_tid;
      if (!taskHint) {
        taskHint = await fetchSuccessCandidateTaskId();
        if (taskHint) globalThis.__func01470_success_tid = taskHint;
      }
      let picked = await pickSuccessCandidateDelete(taskHint || null);
      if (!picked && taskHint) picked = await pickSuccessCandidateDelete(null);
      if (!picked) {
        const stText = await stack().innerText().catch(() => '');
        if (/REC-/.test(stText) && /候选工作台/.test(stText) && !/恢复结果/.test(stText)) {
          throw new Error(
            '环境闸门 ENV-ATTRACT-NO-SUCCESS-CANDIDATE-001：有候选工作台历史但无「已完成」（无「恢复结果」行，前置 2 不满足）',
          );
        }
        if (!/REC-/.test(stText)) {
          throw new Error('环境闸门 ENV-ATTRACT-NO-HISTORY-ROW-001：最近分析无任务行（前置 2 不满足）');
        }
        throw new Error(
          '环境闸门 ENV-ATTRACT-NO-CANDIDATE-DELETE-001：有已完成候选工作台但操作列无「删除」或未滚到操作列',
        );
      }
      globalThis.__func01470 = { tid: picked.tid, rowTxt: picked.rowTxt };
      await picked.del.scrollIntoViewIfNeeded();
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      await expect(modal.getByText('删除分析记录', { exact: true }).first()).toBeVisible({ timeout: 5000 });
  - note: 2、该任务仍在列表中
    assert: |-
      if (!globalThis.__func01470?.tid) throw new Error('前置：未打开删除弹窗');
      const expectedTid = globalThis.__func01470.tid;
      const stack = () => page.getByTestId('recruit-tab-stack');
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const rowStill = stack().locator('table tbody tr, .arco-table-tr').filter({ hasText: expectedTid });
      await expect(rowStill.first()).toBeVisible({ timeout: 8000 });
      const msg = page.locator('.arco-message:visible').filter({ hasText: '已删除' });
      if (await msg.count()) {
        throw new Error('点取消后仍出现「已删除」提示，任务可能被删：' + expectedTid);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 /enterprise/attraction&entry=history（entry-seed ent-attract）。已完成行机检锚=条件摘要含「候选工作台」且操作列「恢复结果」。步骤=该行「删除」→Modal「删除分析记录」→「取消」→REC 仍在表内。API 锚 selectionMode=candidate_workbench+success。D4·2026-10-20 rewrite-FUNC-01470 svcz 2/2 expect 绿。无 Tab→ENV-ATTRACT-NO-HISTORY-TAB-001；无恢复结果行→ENV-ATTRACT-NO-SUCCESS-CANDIDATE-001。非破坏性。登录与关评审由 runner 前置。B 档零 allow_skip。
