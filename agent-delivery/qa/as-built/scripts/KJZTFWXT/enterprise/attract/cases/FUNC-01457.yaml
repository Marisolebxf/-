id: FUNC-01457
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01457
priority: P1
tier: B
title: 备选-本页隔离
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
expect:
  - note: 标题为「招引企业推荐分析」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const enterAttractViaSidebar = async () => {
        await dismissBasket();
        const menuitem = page.getByRole('menuitem', { name: '招引企业推荐分析' });
        if (await menuitem.count()) {
          await menuitem.first().click({ timeout: 12000 });
        } else {
          const pickMenu = page.locator('.arco-menu-item').filter({ hasText: /^招引企业推荐分析$/ });
          await expect(pickMenu.first()).toBeVisible({ timeout: 10000 });
          await pickMenu.first().click({ timeout: 12000 });
        }
        await page.waitForURL(/\/enterprise\/attraction/, { timeout: 20000 });
        await page.waitForTimeout(600);
      };
      await enterAttractViaSidebar();
      await expect(page.getByRole('heading', { name: '招引企业推荐分析', level: 1 })).toBeVisible({ timeout: 15000 });
  - note: 页签为条件筛选推荐、候选工作台、最近分析
    assert: |-
      await expect(page.getByRole('tab', { name: '条件筛选推荐' })).toBeVisible();
      await expect(page.getByRole('tab', { name: '候选工作台' })).toBeVisible();
      await expect(page.getByRole('tab', { name: '最近分析' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
