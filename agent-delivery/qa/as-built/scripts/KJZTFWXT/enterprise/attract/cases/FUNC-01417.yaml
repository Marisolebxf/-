id: FUNC-01417
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01417
priority: P0
title: 共分析家数与分页总条数一致
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；最近分析中已有一条条件筛选且状态为已完成的记录
locators:
  recent_tab: Tab「最近分析」
  restore_button: button「恢复结果」
  analyzed_count: 文案「共分析」
  pagination_total: 分页「共 N 条」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction
  - action: wait
    for: 条件区 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 最近分析→已完成条件筛选行「恢复结果」；家数与分页在 expect 判定
expect:
  - note: 1、显示「共分析」家数
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const assertRecentTabAvailable = async () => {
        const byKey = page.locator('button[data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        if ((await byKey.count()) < 1 && (await byName.count()) < 1) {
          throw new Error('环境闸门 ENV-ATTRACT-NO-HISTORY-TAB-001：现场招引页无「最近分析」Tab/恢复结果入口（仅条件筛选+候选工作台时不自动化本用例）');
        }
      };
      const openRecentTab = async () => {
        await waitFilterReady();
        await assertRecentTabAvailable();
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
          await expect(legacy).toBeVisible({ timeout: 12000 });
          await legacy.click({ timeout: 8000 });
        } else {
          await expect(tab).toBeVisible({ timeout: 12000 });
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/招引推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const pickCompletedFilterRestore = async () => {
        await openRecentTab();
        await waitHistoryShell();
        const st = stack();
        await expect(st.getByText('招引推荐 · 最近分析').first()).toBeVisible({ timeout: 10000 });
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        if (n < 1) throw new Error('最近分析无已完成任务可「恢复结果」');
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            return btn;
          }
        }
        throw new Error('最近分析无「已完成」的条件筛选任务可「恢复结果」');
      };
      await dismissBasket();
      const btn = await pickCompletedFilterRestore();
      await btn.scrollIntoViewIfNeeded();
      await btn.click({ timeout: 15000 });
      let ok = false;
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(500);
        const t = await stack().innerText().catch(() => '');
        if (/共分析\s*\d+\s*家/.test(t) && (/招引推荐分析结果/.test(t) || /数据更新时间/.test(t))) {
          ok = true;
          break;
        }
      }
      if (!ok) throw new Error('点击恢复结果后未见「共分析 N 家」或结果标题，url=' + page.url());
      await expect(stack().getByText(/共分析\s*\d+\s*家/).first()).toBeVisible({ timeout: 10000 });
      globalThis.__func01417_restored = true;
  - note: 2、该家数与分页总条数一致
    assert: |-
      if (!globalThis.__func01417_restored) throw new Error('前置：未恢复结果');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const st = stack();
      const body = await st.innerText().catch(() => '');
      const analyzedM = body.match(/共分析\s*(\d+)\s*家/);
      if (!analyzedM) throw new Error('结果区未见「共分析 N 家」');
      const analyzed = parseInt(analyzedM[1], 10);
      const readPaginationTotal = async () => {
        const pags = st.locator('.arco-pagination');
        const cnt = await pags.count();
        for (let i = cnt - 1; i >= 0; i--) {
          const pag = pags.nth(i);
          if (!(await pag.isVisible().catch(() => false))) continue;
          const pt = (await pag.innerText().catch(() => '')).replace(/\s+/g, ' ');
          const m = pt.match(/共\s*(\d+)\s*条/);
          if (m) return parseInt(m[1], 10);
        }
        const fallback = body.match(/共\s*(\d+)\s*条/);
        if (fallback) return parseInt(fallback[1], 10);
        return null;
      };
      const pageTotal = await readPaginationTotal();
      if (pageTotal === null) {
        throw new Error('结果表未见分页「共 N 条」（共分析=' + analyzed + '）');
      }
      if (analyzed !== pageTotal) {
        throw new Error('共分析 ' + analyzed + ' 家与分页总条数 ' + pageTotal + ' 不一致');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·深链 /enterprise-center/attraction（catalog /enterprise/attraction 404）。成功态「共分析 N 家」须与推荐结果表 .arco-pagination「共 N 条」一致（scout-deep3 示例 50/50）。D4·2026-10-20 复勘 30888 为 demo 两 Tab 无「最近分析/恢复结果」→ ENV-ATTRACT-NO-HISTORY-TAB-001（与 FUNC-01414~016 同闸门）。登录与关评审由 runner 会话前置。tier B，零 allow_skip。
