id: FUNC-01420
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01420
priority: P0
title: 结果地域来源下拉选项数等于当前结果去重个数
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；已打开一条条件筛选的成功结果（assert 自含条件筛选发起）
locators:
  result_region_select: placeholder「地域来源」（结果筛选区，非条件区级联）
  region_column: 结果表列「地域来源」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction
  - action: evaluate
    note: 到达成功结果→翻页采集表内地域来源去重→展开结果区地域来源下拉；个数在 expect 判定
expect:
  - note: 1、选项个数等于当前结果地域来源去重个数
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const isSuccessResult = async () => {
        const st = stack();
        const t = await st.innerText().catch(() => '');
        const url = page.url();
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        const byKey = page.locator('button[data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        if ((await byKey.count()) < 1 && (await byName.count()) < 1) return false;
        const tab = (await byKey.count()) ? byKey.first() : byName.first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 20; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const reachFilterSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        const openPh = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const i = page.locator(`input[placeholder="${ph}"]`).first();
          await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        const pickOption = async (text) => {
          const opt = page.locator(optSel).filter({ hasText: text }).first();
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        await openPh('全部企业标签');
        await pickOption('高新技术企业');
        await openPh('全部行业领域');
        const ai = page.locator(optSel).filter({ hasText: '人工智能' });
        if (await ai.count()) await ai.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        const st = stack();
        let ok = false;
        let last = '';
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          const url = page.url();
          if ((/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last)?.analyzed >= 1) {
              ok = true;
              break;
            }
          }
          if (/任务失败|分析失败|推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析进入失败态: ' + last.slice(0, 240));
          }
        }
        if (!ok) {
          const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
          if (stuck) {
            throw new Error('环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：条件筛选发起后长期停留在可视化分析过程，无法在超时内到达「招引推荐分析结果」以测结果地域来源下拉（30888 无最近分析恢复时与 FUNC-01408/01418 同源 D4）');
          }
          throw new Error('未在超时内到达条件筛选成功结果: ' + last.slice(0, 200));
        }
        await expect(st.getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      };
      const resolveRegionColIndex = async (st) => {
        const ths = st.locator('.arco-table thead .arco-table-th');
        const nTh = await ths.count();
        for (let i = 0; i < nTh; i++) {
          const t = ((await ths.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t === '地域来源') return i;
        }
        throw new Error('结果表未见「地域来源」列头');
      };
      const collectDistinctRegionsFromTable = async () => {
        const st = stack();
        const colIdx = await resolveRegionColIndex(st);
        const uniq = new Set();
        for (let round = 0; round < 40; round++) {
          const trs = st.locator('.arco-table-body .arco-table-tr');
          const rn = await trs.count();
          for (let r = 0; r < rn; r++) {
            const td = trs.nth(r).locator('.arco-table-td').nth(colIdx);
            const v = ((await td.innerText()) || '').replace(/\s+/g, ' ').trim();
            if (v && v !== '—' && v !== '-') uniq.add(v);
          }
          const pag = st.locator('.arco-pagination').filter({ has: page.locator('.arco-pagination-item') }).last();
          if ((await pag.count()) < 1 || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next');
          if ((await next.count()) < 1) break;
          const cls = (await next.first().getAttribute('class')) || '';
          if (/disabled/.test(cls)) break;
          await next.first().click({ timeout: 5000 });
          await page.waitForTimeout(600);
        }
        if (!uniq.size) throw new Error('结果表「地域来源」列无有效单元格');
        return uniq;
      };
      const readResultRegionDropdownLabels = async () => {
        const st = stack();
        await page.keyboard.press('Escape').catch(() => {});
        const inp = st.locator('input[placeholder="地域来源"]').first();
        await expect(inp).toBeVisible({ timeout: 10000 });
        await inp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const pop = page.locator('.arco-trigger-popup:visible, .arco-select-popup-visible').last();
        await expect(pop).toBeVisible({ timeout: 8000 });
        const opts = pop.locator('.arco-select-option');
        const on = await opts.count();
        const labels = [];
        for (let i = 0; i < on; i++) {
          const t = ((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t) labels.push(t);
        }
        await page.keyboard.press('Escape').catch(() => {});
        return labels;
      };
      await dismissBasket();
      await reachFilterSuccess();
      const expected = await collectDistinctRegionsFromTable();
      const dropdownLabels = await readResultRegionDropdownLabels();
      const dropdownSet = new Set(dropdownLabels);
      if (dropdownSet.size !== expected.size) {
        throw new Error(
          '结果区「地域来源」下拉选项数 ' + dropdownSet.size + ' 与表内去重个数 ' + expected.size + ' 不一致；下拉=[' +
            [...dropdownSet].join('、') + '] 表内=[' + [...expected].join('、') + ']',
        );
      }
      for (const v of expected) {
        if (!dropdownSet.has(v)) {
          throw new Error('下拉缺少表内地域来源「' + v + '」；下拉=[' + [...dropdownSet].join('、') + ']');
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 深链 /enterprise-center/attraction；结果筛选 placeholder「地域来源」（条件区为级联「地域来源」）。选项源=RecruitResultPanel regionOptions（rows 去重 regionGroup）；机检翻页扫表列去重与下拉 option 个数及集合一致。前置同 FUNC-01418/01419（栈内成功态→最近分析恢复→高新+行业发起）。D4·无异步成功→ ENV-ATTRACT-ASYNC-NO-SUCCESS-001。勘察样例 4 城：深圳/东莞/惠州/广州。登录与关评审由 runner 前置。B 档零 allow_skip。
