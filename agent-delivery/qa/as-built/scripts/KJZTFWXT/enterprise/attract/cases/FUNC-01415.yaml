id: FUNC-01415
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01415
priority: P1
tier: B
title: 恢复结果展示本次权重及三项取值
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01408造已完成条件筛选；点最近分析→恢复结果
expect:
  - note: 1、结果区出现「本次权重」
    assert: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = main.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
      };
      const openHistoryTab = async () => {
        await waitFilterReady();
        const tab = page.getByRole('tab', { name: '最近分析' });
        if ((await tab.count()) < 1) {
          throw new Error('修订 blocked：页签无「最近分析」');
        }
        await tab.first().click({ timeout: 12000 });
        await page.waitForTimeout(800);
      };
      const hasCompletedFilterRestore = async () => {
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) return btn;
        }
        return null;
      };
      const run01408Seed = async () => {
        await waitFilterReady();
        const tagInput = main.locator('input[placeholder="全部企业标签"]').first();
        await tagInput.locator('xpath=ancestor::*[contains(@class,"arco-select")]//*[contains(@class,"arco-select-view")]').first().click({ timeout: 12000 }).catch(async () => {
          await tagInput.click({ timeout: 8000 });
        });
        await page.locator('.arco-select-dropdown:visible .arco-select-option').filter({ hasText: '专精特新' }).first().click({ timeout: 12000 });
        await main.locator('.arco-cascader-view').first().click({ timeout: 12000 });
        await page.locator('.arco-cascader-panel-column:visible').getByText('人工智能', { exact: true }).first().click({ timeout: 12000 });
        const startBtn = main.getByRole('button', { name: '开始分析' });
        await expect(startBtn).toBeEnabled({ timeout: 10000 });
        await startBtn.click({ timeout: 12000 });
        for (let i = 0; i < 60; i++) {
          const t = await stack().innerText().catch(() => '');
          if (/招引推荐分析结果/.test(t)) return;
          await page.waitForTimeout(1000);
        }
        throw new Error('修订：01408 发起后未见招引推荐分析结果');
      };
      let restoreBtn = null;
      await openHistoryTab();
      restoreBtn = await hasCompletedFilterRestore();
      if (!restoreBtn) {
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 });
        await run01408Seed();
        await openHistoryTab();
        restoreBtn = await hasCompletedFilterRestore();
      }
      if (!restoreBtn) throw new Error('修订 blocked：最近分析无已完成条件筛选可恢复结果');
      await restoreBtn.scrollIntoViewIfNeeded();
      await restoreBtn.click({ timeout: 15000 });
      for (let i = 0; i < 24; i++) {
        const t = await stack().innerText().catch(() => '');
        if (/本次权重/.test(t)) break;
        await page.waitForTimeout(500);
      }
      await expect(stack().getByText(/本次权重/).first()).toBeVisible({ timeout: 12000 });
  - note: 2、能看到三项权重取值
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const body = await stack().innerText();
      const weightLine = (body.match(/本次权重[^\n]*/) || [])[0] || '';
      if (!weightLine) throw new Error('结果区未见「本次权重」行');
      const englishTriple =
        /technologyMatch\s*=\s*\d+/.test(weightLine) &&
        /growth\s*=\s*\d+/.test(weightLine) &&
        /regionalFit\s*=\s*\d+/.test(weightLine);
      const chineseTriple =
        /技术匹配度/.test(weightLine) &&
        /成长性/.test(weightLine) &&
        /区域适配性/.test(weightLine) &&
        (weightLine.match(/=\s*\d+/g) || []).length >= 3;
      const slashValues = (weightLine.match(/=\s*\d+/g) || []).length >= 3 && /\//.test(weightLine);
      if (!englishTriple && !chineseTriple && !slashValues) {
        throw new Error('本次权重行未见三项权重取值：' + weightLine.slice(0, 200));
      }
on_fail: 截图 + 抄 X-Trace-Id
