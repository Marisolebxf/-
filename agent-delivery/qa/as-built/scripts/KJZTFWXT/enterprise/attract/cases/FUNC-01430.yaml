id: FUNC-01430
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01430
priority: P1
tier: B
title: 主流程-全部规模
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01433加入招引候选后打开候选工作台并展开「全部规模」
expect:
  - note: 1、选项个数等于当前名单企业规模的去重个数
    assert: |-
      const origin = new URL(page.url()).origin;
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const openCandidateTab = async () => {
        await expect(candTab()).toBeVisible({ timeout: 15000 });
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          await candTab().click({ timeout: 10000 });
          await page.waitForTimeout(800);
        }
        const keyBtn = page.locator('button[data-tab-key="candidates"]').first();
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true' && (await keyBtn.count())) {
          await keyBtn.click({ timeout: 8000, force: true });
          await page.waitForTimeout(800);
        }
      };
      const rowCount = async () => {
        const tr = stack().locator('.arco-table-body .arco-table-tr, table tbody tr');
        let n = await tr.count();
        if (n > 0) return n;
        const t = await stack().innerText().catch(() => '');
        const m = t.match(/共\s*(\d+)\s*家/);
        return m ? Number(m[1]) : 0;
      };
      const addFromEnterpriseSearch = async () => {
        await page.goto(origin + '/enterprise/enterprise-search', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        const addBtn = page.getByRole('button', { name: '加入招引候选' }).first();
        if (await addBtn.count()) {
          await addBtn.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
          return;
        }
        const poolBtn = page.getByRole('button', { name: '引育候选' }).first();
        if (await poolBtn.count()) {
          await poolBtn.click({ timeout: 8000 });
          await page.waitForTimeout(400);
          const menuAdd = page.getByText('加入招引候选', { exact: true }).first();
          if (await menuAdd.count()) await menuAdd.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        }
      };
      await addFromEnterpriseSearch();
      await page.goto(origin + '/enterprise/attraction', { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1500);
      await openCandidateTab();
      if ((await rowCount()) < 1) {
        throw new Error('ENV-ATTRACT-CANDIDATE-EMPTY：同册01433企业查询加入后候选工作台仍无企业');
      }
      const resolveScaleColIndex = async () => {
        const ths = stack().locator('.arco-table thead .arco-table-th');
        const nTh = await ths.count();
        for (let i = 0; i < nTh; i++) {
          const t = ((await ths.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t === '企业规模') return i;
        }
        throw new Error('候选表未见「企业规模」列');
      };
      const collectDistinctScales = async () => {
        const colIdx = await resolveScaleColIndex();
        const uniq = new Set();
        for (let round = 0; round < 30; round++) {
          const trs = stack().locator('.arco-table-body .arco-table-tr');
          const rn = await trs.count();
          for (let r = 0; r < rn; r++) {
            const v = ((await trs.nth(r).locator('.arco-table-td').nth(colIdx).innerText()) || '')
              .replace(/\s+/g, ' ')
              .trim();
            if (v && v !== '—' && v !== '-') uniq.add(v);
          }
          const next = stack().locator('.arco-pagination-item-next').first();
          if ((await next.count()) < 1) break;
          const cls = (await next.getAttribute('class')) || '';
          if (/disabled/.test(cls)) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(500);
        }
        if (!uniq.size) throw new Error('名单「企业规模」列无有效值');
        return uniq;
      };
      const expected = await collectDistinctScales();
      await page.keyboard.press('Escape').catch(() => {});
      const scaleSelect = stack().locator('.arco-select-view').filter({ has: page.locator('input[placeholder="全部规模"]') }).first();
      await expect(scaleSelect).toBeVisible({ timeout: 10000 });
      await scaleSelect.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const pop = page.locator('.arco-select-popup:visible, .arco-trigger-popup:visible').last();
      await expect(pop).toBeVisible({ timeout: 8000 });
      const labels = [];
      const opts = pop.locator('.arco-select-option');
      const on = await opts.count();
      for (let i = 0; i < on; i++) {
        const t = ((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
        if (t && t !== '全部规模') labels.push(t);
      }
      await page.keyboard.press('Escape').catch(() => {});
      const dropdownSet = new Set(labels);
      if (dropdownSet.size !== expected.size) {
        throw new Error(
          '全部规模下拉选项数 ' + dropdownSet.size + ' 与名单规模去重 ' + expected.size + ' 不一致；下拉=' +
            [...dropdownSet].join('、') + ' 表=' + [...expected].join('、'),
        );
      }
      for (const v of expected) {
        if (!dropdownSet.has(v)) {
          throw new Error('下拉缺少规模「' + v + '」');
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
