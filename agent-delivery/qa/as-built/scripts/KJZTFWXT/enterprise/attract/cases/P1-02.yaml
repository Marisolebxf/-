id: P1-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00996
priority: P1
title: 任务分析期间开始分析不可重复提交
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
- 已设置一组条件；一次分析正在运行
locators:
  start: button 开始分析
steps:
- action: evaluate
  note: 发起后立即再点开始分析
expect:
- note: 分析中「开始分析」不可重复发起新任务
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const ph = page.locator('input[placeholder="全部行业领域"]').first(); await ph.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: '低空经济' }).first().click(); await page.waitForTimeout(500); const start = page.getByRole('button', { name: '开始分析' }).first(); await start.click(); await page.waitForTimeout(800); const stack = page.getByTestId('recruit-tab-stack'); if (await stack.getByText('可视化分析过程').count()) { const dis = await start.isDisabled(); if (!dis) { /* 同条件复用可能瞬间成功，observed */ const t = await stack.innerText(); if (/可视化分析过程/.test(t) && !(await start.isDisabled())) throw new Error('分析中开始分析仍可点') } } else { /* 秒级完成属 observed */ }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 同条件秒复用时可能看不到「分析中」窗口；有过程态时验禁用。
tier: B
