id: P0-14
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00991
priority: P0
title: 阈值待定角标存在且点开有解释内容
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
- 已成功完成一次分析且结果区角标可见
locators:
  badge: aria-label 含阈值/Q015 的角标按钮
steps:
- action: click
  target: 阈值待定角标
expect:
- note: 角标点开后有解释内容不空白不报错
  assert: |-
    const stack = page.getByTestId('recruit-tab-stack'); if (!(await stack.getByText(/招引推荐|开始分析/).count())) { await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000) }; let badge = page.locator('[aria-label*="阈值"], [aria-label*="Q015"], .perm-pending-badge'); if (!(await badge.count()) || !(await badge.first().isVisible().catch(()=>false))) { await page.locator('button.persona-switch').first().click(); await page.waitForTimeout(600); const sw = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); if ((await sw.getAttribute('aria-checked')) !== 'true') { await sw.click(); await page.waitForTimeout(900) }; await page.keyboard.press('Escape'); await page.waitForTimeout(400); badge = page.locator('[aria-label*="阈值"], [aria-label*="Q015"], .perm-pending-badge') }; if (!(await badge.count())) throw new Error('SKIP_NO_BADGE'); await badge.first().click({ timeout: 8000 }); await page.waitForTimeout(600); const pop = page.locator('.arco-trigger-popup:visible, .arco-popover:visible, .arco-tooltip-content:visible').last(); const txt = (await pop.innerText().catch(()=>'')) || (await badge.first().getAttribute('aria-label')) || ''; if (!txt.trim()) throw new Error('角标无解释内容')
- note: 指数区无正式阈值与权重表述
  assert: |-
    const stack = page.getByTestId('recruit-tab-stack'); const t = await stack.innerText(); if (/正式阈值\s*[=：]/.test(t)) throw new Error('出现正式阈值表述')
allow_skip: 业务态无阈值角标且评审开后仍不可见时 Pass-N/A
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘角标 aria-label「正式指标语义与阈值待 Q015 闭合。」；多见于评审态。
tier: B
