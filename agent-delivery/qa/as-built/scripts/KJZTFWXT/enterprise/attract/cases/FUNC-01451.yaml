id: FUNC-01451
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01451
priority: P1
tier: B
title: 备选-加入对比篮后篮内企业数增加
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册 01437/01408 到达条件筛选成功结果→勾选一行→点「加入对比篮」
expect:
  - note: 1、对比篮中的企业数量增加
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const TAG = '专精特新';
      const FIELD = '人工智能';
      const basketEntCount = async () => {
        const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
        if (!(await dockBtn.count())) return null;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        if (entM) return parseInt(entM[1], 10);
        const totalM = dockLabel.match(/共\s*(\d+)\s*项/);
        if (totalM) return parseInt(totalM[1], 10);
        return null;
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const parseSelected = (text) => {
        const m = text.match(/已选\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          /招引推荐分析结果/.test(t) &&
          !/可视化分析过程/.test(t)
        );
      };
      const openRecentTab = async () => {
        const tab = page.getByRole('tab', { name: '最近分析' });
        if ((await tab.count()) < 1) return false;
        await tab.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        return true;
      };
      const clickRestoreBtn = async (btn) => {
        await btn.click({ timeout: 15000 });
        for (let j = 0; j < 24; j++) {
          await page.waitForTimeout(500);
          if (await isSuccessResult()) return true;
        }
        return false;
      };
      const tryRestoreCompleted = async (needFilterOrigin) => {
        if (!(await openRecentTab())) return false;
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!(txt && /已完成/.test(txt))) continue;
          if (needFilterOrigin && !/条件筛选/.test(txt)) continue;
          if (await clickRestoreBtn(btn)) return true;
          if (!(await openRecentTab())) break;
        }
        return await isSuccessResult();
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 20; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染');
      };
      const openPh = async (ph) => {
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator(`input[placeholder="${ph}"]`).first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const pickOption = async (text) => {
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const waitSuccessFromAnalysis = async () => {
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          const last = await stack().innerText().catch(() => '');
          if (/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) {
            if (parseCounts(last)?.analyzed >= 1) return;
          }
          if (/任务失败|分析失败|推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析失败: ' + last.slice(0, 200));
          }
        }
        const last = await stack().innerText().catch(() => '');
        if (/可视化分析过程/.test(last)) {
          throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：异步未在超时内到达成功结果');
        }
        throw new Error('未到达成功结果: ' + last.slice(0, 200));
      };
      const runFilterAnalysis = async () => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await waitFilterReady();
        await openPh('全部企业标签');
        await pickOption(TAG);
        await openPh('全部行业领域');
        await pickOption(FIELD);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitSuccessFromAnalysis();
      };
      await page.waitForTimeout(800);
      if (!(await tryRestoreCompleted(true))) {
        if (!(await tryRestoreCompleted(false))) {
          await runFilterAnalysis();
        }
      }
      await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      const beforeBasket = await basketEntCount();
      if (beforeBasket === null) {
        throw new Error('对比篮 dock 不可读，无法断言数量增加');
      }
      const st = stack();
      const clearBtn = st.getByRole('button', { name: '取消选择', exact: true }).first();
      if (parseSelected(await st.innerText().catch(() => '')) > 0 && (await clearBtn.count()) && !(await clearBtn.isDisabled())) {
        await clearBtn.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      }
      const rows = st.locator('.arco-table-body .arco-table-tr');
      await expect(rows.first()).toBeVisible({ timeout: 8000 });
      const addBtn = st.getByRole('button', { name: '加入对比篮', exact: true }).first();
      await expect(addBtn).toBeVisible({ timeout: 8000 });
      const rowN = await rows.count();
      let increased = false;
      for (let r = 0; r < Math.min(rowN, 5); r++) {
        const row = rows.nth(r);
        const cb = row.locator('.arco-checkbox').first();
        await cb.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        if (await addBtn.isDisabled()) continue;
        await addBtn.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const after = await basketEntCount();
        if (after !== null && after > beforeBasket) {
          increased = true;
          break;
        }
        const msg = page.locator('.arco-message-content').filter({ hasText: /已在对比篮|对比篮已满/ });
        if (await msg.first().isVisible().catch(() => false)) {
          if ((await clearBtn.count()) && !(await clearBtn.isDisabled())) {
            await clearBtn.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(350);
          }
          continue;
        }
      }
      const afterBasket = await basketEntCount();
      expect(increased && afterBasket !== null && afterBasket > beforeBasket).toBeTruthy();
on_fail: 截图 + 抄 X-Trace-Id
