id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00997
priority: P1
title: 分析成功但无匹配企业时呈现空结果提示且条件保留
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
- 已进入页面且可发起分析
locators:
  empty_hint: 空结果 / 无匹配类提示
steps:
- action: evaluate
  note: 冷僻条件组合发起；等空结果
expect:
- note: 呈现「分析成功但无匹配企业」类提示
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const openPh = async (ph, opt) => { const i = page.locator(`input[placeholder="${ph}"]`).first(); await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: opt }).first().click(); await page.waitForTimeout(400) }; await openPh('全部企业标签','独角兽企业'); await openPh('全部行业领域','量子信息'); await page.getByRole('button', { name: '开始分析' }).click(); const stack = page.getByTestId('recruit-tab-stack'); let hit = false; for (let i = 0; i < 24; i++) { await page.waitForTimeout(2500); const t = await stack.innerText(); if (/空结果|无匹配|暂无推荐|0\s*家/.test(t) && !/可视化分析过程/.test(t)) { hit = true; break } if (/共分析\s*[1-9]/.test(t) && /招引推荐分析结果/.test(t)) { throw new Error('SKIP_NOT_EMPTY') } }; if (!hit) throw new Error('SKIP_NOT_EMPTY')
- note: 全部条件保留且不自动放宽不以其他范围企业填充
  assert: |-
    const stack = page.getByTestId('recruit-tab-stack'); const t = await stack.innerText(); if (!/独角兽|量子信息/.test(t)) throw new Error('条件未保留'); if (/可视化分析过程/.test(t)) throw new Error('仍在过程态')
allow_skip: 冷僻组合仍返回非空名单时 Pass-N/A + observed
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
