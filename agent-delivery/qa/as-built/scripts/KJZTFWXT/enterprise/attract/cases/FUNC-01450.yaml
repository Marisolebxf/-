id: FUNC-01450
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01450
priority: P1
tier: B
title: 备选-全选筛选结果
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 1、已选家数等于「当前筛选」家数
    assert: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const pickSelectOption = async (selectIndex, optionName) => {
        const view = main.locator('.arco-select-view').nth(selectIndex);
        await expect(view).toBeVisible({ timeout: 15000 });
        await view.click({ timeout: 8000 });
        const opt = page
          .locator('.arco-select-dropdown:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option')
          .filter({ hasText: optionName })
          .first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
      };
      const filterTab = page
        .locator('.global-workbench-tabs [data-tab-key="filter"]')
        .first()
        .or(page.getByRole('tab', { name: '条件筛选推荐' }).first());
      await expect(filterTab).toBeVisible({ timeout: 15000 });
      await filterTab.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await pickSelectOption(0, '专精特新');
      await pickSelectOption(1, '人工智能');
      const runBtn = main.getByRole('button', { name: '开始分析' });
      await expect(runBtn).toBeEnabled({ timeout: 10000 });
      await runBtn.click({ timeout: 8000 });
      let reached = false;
      for (let i = 0; i < 120; i++) {
        const t = await stack().innerText().catch(() => '');
        if (/招引推荐分析结果/.test(t) && (/共分析|本次筛选|排名|搜索企业名称/.test(t))) {
          reached = true;
          break;
        }
        if (/查看结果/.test(t)) {
          const viewResult = stack().getByRole('button', { name: '查看结果' });
          if (await viewResult.isVisible().catch(() => false)) {
            await viewResult.click({ timeout: 8000 });
          }
        }
        await page.waitForTimeout(1000);
      }
      if (!reached) {
        const t = await stack().innerText().catch(() => '');
        if (/请设置条件并执行推荐分析/.test(t) && !/招引推荐分析结果/.test(t)) {
          throw new Error('BLOCKED: 已发起仍为空结果壳');
        }
        throw new Error('分析未在120s内到达招引推荐分析结果');
      }
      await expect(stack().getByText(/招引推荐分析结果/).first()).toBeVisible({ timeout: 5000 });
      const selectAllBtn = stack().getByRole('button', { name: /全选当前筛选结果/ });
      await expect(selectAllBtn).toBeVisible({ timeout: 10000 });
      await selectAllBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const bodyText = await stack().innerText();
      const filterMatch = bodyText.match(/当前筛选\s*(\d+)\s*家/);
      const selectedMatch = bodyText.match(/已选\s*(\d+)\s*家/);
      expect(filterMatch, '应显示当前筛选家数').toBeTruthy();
      expect(selectedMatch, '应显示已选家数').toBeTruthy();
      const filterN = parseInt(filterMatch[1], 10);
      const selectedN = parseInt(selectedMatch[1], 10);
      expect(filterN).toBeGreaterThan(0);
      expect(selectedN).toBe(filterN);
on_fail: 截图 + 抄 X-Trace-Id
