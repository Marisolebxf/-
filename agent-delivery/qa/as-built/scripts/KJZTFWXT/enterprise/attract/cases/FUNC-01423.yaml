id: FUNC-01423
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01423
priority: P1
tier: B
title: 主流程-重新分析
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01437恢复条件筛选成功结果；无则同册01408；点击重新分析并在弹窗确定
expect:
  - note: 出现「可视化分析过程」
    assert: |-
      const stack = () => page.locator('main[data-testid="recruit-tab-stack"]');
      const optSel = '.arco-select-popup:visible .arco-select-option';
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        return /招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t) && /共分析\s*\d+\s*家/.test(t);
      };
      const openHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        const tab = (await byKey.count()) ? byKey.first() : byName.first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
      };
      const tryRestoreCompletedFilter = async () => {
        await openHistoryTab();
        for (let pageNo = 0; pageNo < 5; pageNo += 1) {
          const buttons = stack().getByRole('button', { name: '恢复结果' });
          const n = await buttons.count();
          for (let i = 0; i < n; i += 1) {
            const btn = buttons.nth(i);
            let row = btn.locator('xpath=ancestor::tr[1]');
            if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
            const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
            if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
              await btn.click({ timeout: 15000 });
              for (let j = 0; j < 60; j++) {
                await page.waitForTimeout(500);
                if (await isSuccessResult()) return true;
              }
              return false;
            }
          }
          const next = stack().locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)');
          if (!(await next.count())) break;
          await next.click();
          await page.waitForTimeout(600);
        }
        return false;
      };
      const run01408 = async () => {
        const filterTab = page.getByRole('tab', { name: '条件筛选推荐' });
        if (await filterTab.count()) await filterTab.click({ timeout: 8000 });
        const pick = async (label, optionText) => {
          const field = stack().locator('div.flex-col').filter({ hasText: label }).first();
          await field.locator('.arco-select-view').click();
          await page.locator(optSel).filter({ hasText: optionText }).first().click();
        };
        await pick('企业标签', '专精特新');
        await pick('行业领域', '人工智能');
        await stack().getByRole('button', { name: '开始分析' }).click();
        for (let j = 0; j < 240; j++) {
          await page.waitForTimeout(500);
          if (await isSuccessResult()) return;
          const t = await stack().innerText().catch(() => '');
          if (/推荐分析失败/.test(t)) throw new Error('BLOCKED:修订 ENV-NO-CANDIDATE 筛选无命中企业');
        }
        throw new Error('BLOCKED:修订 ENV-ATTRACT-ASYNC-NO-SUCCESS-001 首次分析未回成功结果');
      };
      const reachSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await run01408();
      };
      await reachSuccess();
      await stack().getByRole('button', { name: '重新分析' }).click({ timeout: 8000 });
      const modal = page.locator('.arco-modal:visible');
      if (await modal.count()) {
        await modal.getByRole('button', { name: '确定' }).click();
      }
      await expect(stack().getByText('可视化分析过程')).toBeVisible({ timeout: 30000 });
      globalThis.__func01423 = { started: true };
  - note: 结束后再次出现「招引推荐分析结果」
    assert: |-
      if (!globalThis.__func01423?.started) throw new Error('前置：未进入重新分析过程');
      const stack = () => page.locator('main[data-testid="recruit-tab-stack"]');
      for (let j = 0; j < 360; j++) {
        await page.waitForTimeout(500);
        const t = await stack().innerText().catch(() => '');
        if (/招引推荐分析结果/.test(t) && /共分析\s*\d+\s*家/.test(t) && !/可视化分析过程/.test(t)) {
          await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 5000 });
          return;
        }
        if (/推荐分析失败/.test(t)) {
          throw new Error('BLOCKED:修订 重新分析进入失败态');
        }
      }
      const tail = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(tail)) {
        throw new Error('BLOCKED:修订 ENV-ATTRACT-ASYNC-NO-SUCCESS-001 重新分析后120s未回成功结果');
      }
      throw new Error('BLOCKED:修订 未回到招引推荐分析结果');
on_fail: 截图 + 抄 X-Trace-Id
