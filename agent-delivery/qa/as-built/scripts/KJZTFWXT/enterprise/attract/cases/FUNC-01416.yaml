id: FUNC-01416
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01416
priority: P1
tier: B
title: 恢复结果后标题旁显示数据更新时间
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 1、标题旁显示「数据更新时间」
    assert: |-
      const main = page.locator('main');
      const filterTab = page.locator('.global-workbench-tabs button[data-tab-key="filter"]').or(
        page.getByRole('tab', { name: '条件筛选推荐' }),
      ).first();
      await expect(filterTab).toBeVisible({ timeout: 15000 });
      await filterTab.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const tagInput = main.locator('input[placeholder="全部企业标签"]').first();
      await expect(tagInput).toBeVisible({ timeout: 15000 });
      await tagInput.click({ timeout: 5000 });
      await main.getByText('专精特新', { exact: true }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await main.locator('.arco-cascader-view').first().click({ timeout: 8000 });
      await main.getByRole('menuitem', { name: '人工智能' }).click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const runBtn = main.getByRole('button', { name: '开始分析' });
      await expect(runBtn).toBeEnabled({ timeout: 8000 });
      await runBtn.click({ timeout: 8000 });
      await expect(main.getByText(/招引推荐分析结果/).first()).toBeVisible({ timeout: 120000 });
      const historyTab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').or(
        page.getByRole('tab', { name: '最近分析' }),
      ).first();
      await historyTab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const restore = main.getByRole('button', { name: '恢复结果' });
      await expect(restore.first()).toBeVisible({ timeout: 15000 });
      let target = restore.first();
      const n = await restore.count();
      for (let i = 0; i < n; i++) {
        const btn = restore.nth(i);
        let row = btn.locator('xpath=ancestor::tr[1]');
        if ((await row.count()) < 1) {
          row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
        }
        const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
        if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
          target = btn;
          break;
        }
      }
      await target.click({ timeout: 15000 });
      await expect(main.getByText(/招引推荐分析结果/).first()).toBeVisible({ timeout: 20000 });
      await expect(main.getByText(/数据更新时间/).first()).toBeVisible({ timeout: 10000 });
on_fail: 截图 + 抄 X-Trace-Id
