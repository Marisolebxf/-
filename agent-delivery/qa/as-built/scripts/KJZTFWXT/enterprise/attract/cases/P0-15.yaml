id: P0-15
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00992
priority: P0
title: 候选工作台 Tab 展示候选企业列表且空列表有空态占位
story: US-ENT-RECRUIT-L1
entry_id: ent-attract
preconditions:
- 已进入招引企业推荐分析页
locators:
  cand_tab: tab 候选工作台
steps:
- action: goto
  target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
- action: click
  target: 候选工作台
expect:
- note: 列表含企业、线索来源、加入人时间与状态类字段
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); await page.getByRole('tab', { name: '候选工作台' }).click(); await page.waitForTimeout(1000); const stack = page.getByTestId('recruit-tab-stack'); const t = await stack.innerText(); const hasCols = /企业|线索|来源|加入|状态|时间/.test(t); const hasEmpty = /暂无|空|还没有|无候选/.test(t); const hasList = /排名|企业名称|招引推荐/.test(t); if (!hasCols && !hasEmpty && !hasList) throw new Error('候选工作台未见列表字段或空态: ' + t.slice(0, 200))
- note: 空列表呈现空态占位不报错
  assert: 'const stack = page.getByTestId(''recruit-tab-stack''); await expect(stack).toBeVisible({ timeout: 8000 })'
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 有残留候选/复核结果时字段形态 observed；空态文案以现场为准。
tier: B
