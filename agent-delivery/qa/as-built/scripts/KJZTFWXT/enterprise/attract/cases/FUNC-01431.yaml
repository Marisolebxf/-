id: FUNC-01431
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01431
priority: P0
tier: B
title: 主流程-候选勾选
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
  - action: evaluate
    note: 同册01433入池后打开候选工作台，再勾选与取消勾选
expect:
  - note: 1、勾选后已选家数增加
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const selectedCountText = (n) => stack().getByText(new RegExp('已选\\s*' + n + '\\s*家'));
      const rowCount = async () => stack().locator('.arco-table-body .arco-table-tr').count();
      const openCandidateTab = async () => {
        const tab = candTab();
        if ((await tab.getAttribute('aria-selected').catch(() => '')) !== 'true') {
          await expect(tab).toBeVisible({ timeout: 10000 });
          await tab.click({ timeout: 10000 });
          await page.waitForTimeout(900);
        }
        if ((await tab.getAttribute('aria-selected').catch(() => '')) !== 'true') {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) await byKey.click({ timeout: 8000, force: true });
          await page.waitForTimeout(900);
        }
      };
      const ensureCandidateFromSearch = async () => {
        await openCandidateTab();
        if ((await rowCount()) > 0) return;
        await page.goto(toUrl(searchRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('科技');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        const recruitDrop = page.locator('main').getByRole('button', { name: '引育候选' }).first();
        await recruitDrop.scrollIntoViewIfNeeded({ timeout: 15000 });
        await recruitDrop.click({ timeout: 15000 });
        await page.waitForTimeout(600);
        await page.getByRole('menuitem', { name: /加入招引候选/ }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if ((await rowCount()) < 1) {
          const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
          throw new Error('ENV-ATTRACT-CANDIDATE-EMPTY：候选工作台无企业: ' + txt.slice(0, 160));
        }
      };
      await ensureCandidateFromSearch();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 10000 });
      await expect(selectedCountText(0)).toBeVisible({ timeout: 8000 });
      const firstRow = stack().locator('.arco-table-body .arco-table-tr').first();
      const rowCheckbox = firstRow.locator('.arco-checkbox').first();
      await expect(rowCheckbox).toBeVisible({ timeout: 8000 });
      await rowCheckbox.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(selectedCountText(1)).toBeVisible({ timeout: 8000 });
  - note: 2、取消后已选家数回到 0
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const selectedCountText = (n) => stack().getByText(new RegExp('已选\\s*' + n + '\\s*家'));
      const firstRow = stack().locator('.arco-table-body .arco-table-tr').first();
      const rowCheckbox = firstRow.locator('.arco-checkbox').first();
      await rowCheckbox.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      await expect(selectedCountText(0)).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
