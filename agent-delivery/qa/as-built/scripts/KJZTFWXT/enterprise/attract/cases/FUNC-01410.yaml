id: FUNC-01410
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01410
priority: P1
tier: B
title: 条件筛选推荐展开企业标签下拉选项与附录 A 一致
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: wait
    for: 条件筛选推荐与企业标签
    timeout_ms: 8000
  - action: evaluate
    note: 展开企业标签下拉
expect:
  - note: 选项共 8 个，名称见附录 A
    assert: |-
      const main = page.locator('main');
      await expect(main.getByRole('tab', { name: '条件筛选推荐' })).toBeVisible({ timeout: 8000 });
      const tagInput = main.locator('input[placeholder="全部企业标签"]').first();
      await expect(tagInput).toBeVisible({ timeout: 8000 });
      const tagView = tagInput.locator(
        'xpath=ancestor::*[contains(@class,"arco-select-view")][1]',
      );
      await tagView.scrollIntoViewIfNeeded();
      await tagView.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const popup = page.locator('.arco-trigger-popup:visible').last();
      await expect(popup).toBeVisible({ timeout: 8000 });
      const expected = [
        '外资企业',
        '瞪羚企业',
        '高新技术企业',
        '重点企业',
        '上市企业',
        '专精特新',
        '科技型中小企业',
        '独角兽企业',
      ];
      const opts = popup.locator('.arco-select-option');
      await expect(opts).toHaveCount(8, { timeout: 5000 });
      const texts = (await opts.allTextContents())
        .map((t) => t.replace(/\s+/g, '').trim())
        .filter(Boolean);
      for (const name of expected) {
        if (!texts.some((t) => t === name || t.includes(name))) {
          throw new Error(`下拉未见「${name}」，实际=${texts.join('、')}`);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
