id: FUNC-01408
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01408
priority: P1
tier: B
title: 专精特新与人工智能条件筛选发起招引推荐并到达成功结果
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 1、成功页标题为「招引推荐分析结果」
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const openSelectByPh = async (ph) => {
        await page.keyboard.press('Escape').catch(() => {});
        const inp = main.locator(`input[placeholder="${ph}"]`).first();
        await inp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const pickOpt = async (text) => {
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      await openSelectByPh('全部企业标签');
      await pickOpt('专精特新');
      await openSelectByPh('全部行业领域');
      const aiOpt = page.locator(optSel).filter({ hasText: '人工智能' });
      await expect(aiOpt.first()).toBeVisible({ timeout: 8000 });
      await aiOpt.first().click({ timeout: 8000 });
      await page.waitForTimeout(300);
      const start = main.getByRole('button', { name: '开始分析' });
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click();
      let ok = false;
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(2500);
        const viewBtn = main.getByRole('button', { name: '查看结果' });
        if (await viewBtn.isVisible().catch(() => false)) {
          await viewBtn.click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(1500);
        }
        const t = await main.innerText();
        if (/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) {
          ok = true;
          break;
        }
        if (/推荐分析失败/.test(t) && !/可视化分析过程/.test(t)) {
          throw new Error('ENV-NO-CANDIDATE: 筛选无命中企业');
        }
      }
      if (!ok) throw new Error('未在超时内到达招引推荐分析结果');
      await expect(main.getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
  - note: 2、结果区出现「本次筛选」或结果表
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      const t = await main.innerText();
      const hasSummary = /本次筛选/.test(t);
      const hasTable = t.includes('排名') && t.includes('企业名称');
      if (!hasSummary && !hasTable) throw new Error('结果区未见「本次筛选」或结果表列头');
      if (hasTable) {
        await expect(main.getByText('排名', { exact: true }).first()).toBeVisible({ timeout: 8000 });
        await expect(main.getByText('企业名称', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      } else {
        await expect(main.getByText(/本次筛选/).first()).toBeVisible({ timeout: 8000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
