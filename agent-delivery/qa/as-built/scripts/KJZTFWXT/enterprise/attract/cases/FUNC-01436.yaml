id: FUNC-01436
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01436
priority: P0
title: 主流程-新建分析
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录，可从企业分析进入招引企业推荐分析
locators:
  recent_tab: Tab「最近分析」
  new_analysis: button「新建分析」
  filter_tab: Tab「条件筛选推荐」
  tag_input: placeholder「全部企业标签」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction&entry=history
  - action: wait
    for: 招引页 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 最近分析点「新建分析」；条件 Tab 与未自动起任务由 expect 判定
expect:
  - note: 1、切到「条件筛选推荐」 2、不自动开始分析
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const historyDeepLink = async () => {
        const origin = new URL(page.url()).origin;
        await page.goto(
          origin +
            '/enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction&entry=history',
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/招引推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-ATTRACT-NO-HISTORY-TAB-001：现场招引页无「最近分析」Tab/深链（仅条件筛选+候选工作台时不自动化本用例）',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/招引推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const filterTabSelected = async () => {
        const byKey = page.locator('.global-workbench-tabs button[data-tab-key="filter"]').first();
        if (await byKey.count()) {
          const aria = await byKey.getAttribute('aria-selected');
          const cls = await byKey.getAttribute('class').catch(() => '');
          if (aria === 'true' || /active|selected/i.test(cls || '')) return true;
        }
        const roleTab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
        if (await roleTab.count()) {
          const aria = await roleTab.getAttribute('aria-selected');
          if (aria === 'true') return true;
        }
        const body = await page.locator('main').innerText().catch(() => '');
        const st = await stack().innerText().catch(() => '');
        return (
          (await page.locator('input[placeholder="全部企业标签"]').first().isVisible().catch(() => false)) &&
          !/招引推荐 · 最近分析/.test(st) &&
          /条件筛选推荐|招引推荐条件|全部企业标签/.test(body + st)
        );
      };
      await dismissBasket();
      await openRecentTab();
      await waitHistoryShell();
      const newBtn = stack()
        .getByRole('button', { name: '新建分析' })
        .or(page.getByRole('button', { name: '新建分析' }))
        .first();
      await expect(newBtn).toBeVisible({ timeout: 10000 });
      await newBtn.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
      if (!(await filterTabSelected())) {
        const tabs = await page
          .locator('.global-workbench-tabs button[data-tab-key], [role=tab][data-tab-key]')
          .evaluateAll((els) =>
            els.map((el) => ({
              key: el.getAttribute('data-tab-key'),
              selected: el.getAttribute('aria-selected'),
              text: (el.textContent || '').trim(),
            })),
          )
          .catch(() => []);
        throw new Error('点击新建分析后未切到条件筛选推荐；tabs=' + JSON.stringify(tabs) + '；url=' + page.url());
      }
      await expect(page.locator('input[placeholder="全部企业标签"]').first()).toBeVisible({ timeout: 8000 });
      const stText = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(stText)) {
        throw new Error('新建分析后不应自动出现「可视化分析过程」');
      }
      if (/招引推荐分析结果/.test(stText) && !/请设置条件/.test(stText)) {
        throw new Error('新建分析后不应自动进入成功结果页');
      }
      await page.waitForTimeout(2000);
      const stAfter = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(stAfter)) {
        throw new Error('等待 2s 后仍出现「可视化分析过程」，疑似自动开始分析');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 深链 entry=history→点「新建分析」；机检=data-tab-key=filter 或条件区可见且无最近分析壳层、2s 内无可视化分析过程/结果页。D4·2026-10-20 机跑 rewrite-FUNC-01436 仍为 demo 两 Tab 无最近分析→交卷 blocked·ENV-ATTRACT-NO-HISTORY-TAB-001（runner 记 fail/C6，同 01435）。B 档零 allow_skip。
