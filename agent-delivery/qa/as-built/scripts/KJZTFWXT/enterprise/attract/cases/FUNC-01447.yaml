id: FUNC-01447
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01447
priority: P1
tier: B
title: 备选-导出数据处于禁用状态
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 「导出数据」处于禁用状态
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const openSelectByPh = async (ph) => {
        await page.keyboard.press('Escape').catch(() => {});
        const inp = main.locator(`input[placeholder="${ph}"]`).first();
        await inp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const pickOpt = async (text) => {
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const historyTab = page
        .locator('.global-workbench-tabs [data-tab-key="history"]')
        .first()
        .or(page.getByRole('tab', { name: '最近分析' }).first());
      await expect(historyTab).toBeVisible({ timeout: 15000 });
      await historyTab.click({ timeout: 8000 });
      await page.waitForTimeout(900);
      for (let i = 0; i < 30; i++) {
        const t = await main.innerText().catch(() => '');
        if (/任务名称/.test(t) && /恢复结果/.test(t)) break;
        await page.waitForTimeout(500);
      }
      const buttons = main.getByRole('button', { name: '恢复结果' });
      await expect(buttons.first()).toBeVisible({ timeout: 15000 });
      let restoreBtn = null;
      const n = await buttons.count();
      for (let i = 0; i < n; i++) {
        const btn = buttons.nth(i);
        let row = btn.locator('xpath=ancestor::tr[1]');
        if ((await row.count()) < 1) {
          row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
        }
        const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
        if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
          restoreBtn = btn;
          break;
        }
      }
      if (!restoreBtn) {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await openSelectByPh('全部企业标签');
        await pickOpt('高新技术企业');
        await openSelectByPh('全部行业领域');
        await pickOpt('人工智能');
        const start = main.getByRole('button', { name: '开始分析' });
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 8000 });
      } else {
        await restoreBtn.scrollIntoViewIfNeeded();
        await restoreBtn.click({ timeout: 15000 });
      }
      let onResult = false;
      for (let i = 0; i < 90; i++) {
        await page.waitForTimeout(1000);
        const viewBtn = main.getByRole('button', { name: '查看结果' });
        if (await viewBtn.isVisible().catch(() => false)) {
          await viewBtn.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(800);
        }
        const t = await main.innerText().catch(() => '');
        if (/招引推荐分析结果/.test(t) && (/共分析|本次筛选|排名|搜索企业名称/.test(t))) {
          onResult = true;
          break;
        }
        if (/推荐分析失败|候选分析失败/.test(t) && !/可视化分析过程/.test(t)) break;
      }
      if (!onResult) throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001');
      await expect(main.getByText(/招引推荐分析结果/).first()).toBeVisible({ timeout: 15000 });
      const exportBtn = main.getByRole('button', { name: '导出数据' });
      await expect(exportBtn).toBeVisible({ timeout: 8000 });
      await expect(exportBtn).toBeDisabled();
on_fail: 截图 + 抄 X-Trace-Id
