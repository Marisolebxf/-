id: P1-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00999
priority: P1
title: 成功态后调整条件出现重分析提示且显式发起后结果更新
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
- 已成功完成一次分析且结果可见
locators:
  rehint: 调整条件后将重新发起招引推荐分析
  start: 开始分析
steps:
- action: evaluate
  note: 改行业领域；看提示；再点开始分析
expect:
- note: 条件调整后出现「调整条件后将重新发起招引推荐分析」提示
  assert: |-
    const stack = page.getByTestId('recruit-tab-stack'); if (!(await stack.getByText('招引推荐分析结果').count())) { await page.goto('http://10.50.69.111:30892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const ph0 = page.locator('input[placeholder="全部企业标签"]').first(); await ph0.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: '高新技术企业' }).first().click(); await page.getByRole('button', { name: '开始分析' }).click(); for (let i = 0; i < 24; i++) { await page.waitForTimeout(2500); if (await stack.getByText('招引推荐分析结果').count()) break } }; const ph = page.locator('input[placeholder="全部行业领域"]').first(); await ph.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: '新能源' }).first().click(); await page.waitForTimeout(800); await expect(page.getByText(/调整条件后将重新发起招引推荐分析/).first()).toBeVisible({ timeout: 8000 })
- note: 重分析须显式发起不静默自动重跑
  assert: |-
    await page.waitForTimeout(1000); const stack = page.getByTestId('recruit-tab-stack'); if (await stack.getByText('可视化分析过程').count()) throw new Error('条件变更后静默重跑')
- note: 完成后结果按新条件更新旧结果不残留
  assert: |-
    await page.getByRole('button', { name: '开始分析' }).click(); const stack = page.getByTestId('recruit-tab-stack'); for (let i = 0; i < 24; i++) { await page.waitForTimeout(2500); const t = await stack.innerText(); if (/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) { if (!/新能源|本次筛选/.test(t)) { /* 条件摘要形态 observed */ } break } }
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
