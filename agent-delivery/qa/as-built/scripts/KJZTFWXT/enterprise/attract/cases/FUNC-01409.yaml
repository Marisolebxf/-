id: FUNC-01409
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01409
priority: P0
title: 候选工作台勾选企业执行指定对象复核并到达人工线索复核成功结果
story: US-ENT-RECRUIT-L1
entry_id: ent-attract
tier: A
preconditions:
  - 候选工作台至少有一家待分析企业（本条 assert 自含企业查询/对比篮加入招引候选兜底）
locators:
  attract_route: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  cand_tab: tab「候选工作台」
  review_btn: button「执行指定对象复核」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 候选勾选→指定对象复核→开始分析→成功结果（assert 自含）
expect:
  - note: 打开候选工作台并勾选一家企业后进入「指定对象模型参数配置」且可点「开始分析」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const isCandidateWorkspace = async () => {
        if (!(await candTab().count())) return false;
        return (await candTab().getAttribute('aria-selected').catch(() => '')) === 'true';
      };
      const openCandidateTab = async () => {
        if (await isCandidateWorkspace()) return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if (!(await isCandidateWorkspace())) {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if (!(await isCandidateWorkspace())) {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const actionBar = () => stack().getByTestId('candidate-action-bar');
      const rowCount = async () => stack().locator('.arco-table-body .arco-table-tr').count();
      const hasCandidatePanel = async () => {
        const bar = actionBar();
        return (await bar.count()) > 0 && (await bar.first().isVisible().catch(() => false));
      };
      const ensureOneCandidate = async () => {
        await openCandidateTab();
        if (await hasCandidatePanel()) return;
        let rows = await rowCount();
        if (rows > 0 && (await page.getByRole('button', { name: '执行指定对象复核' }).count())) return;
        const tryBasket = async () => {
          const dock = page.getByRole('button', { name: /打开对比篮/ });
          if (!(await dock.count())) return false;
          await dock.first().click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const addA = page.getByRole('button', { name: '加入招引候选' });
          if (!(await addA.count())) return false;
          const sels = page.locator('[aria-label^="选择 "]');
          if (await sels.count()) await sels.first().click();
          await page.waitForTimeout(400);
          if (!(await addA.first().isEnabled())) return false;
          await addA.first().click({ timeout: 8000 });
          await page.waitForTimeout(1000);
          await page.keyboard.press('Escape').catch(() => {});
          return true;
        };
        if (await tryBasket()) {
          await openCandidateTab();
          if (await hasCandidatePanel()) return;
        }
        await page.goto(toUrl(searchRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const addOpt = page.getByText('加入招引候选', { exact: true }).first();
        if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if (!(await hasCandidatePanel())) {
          const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
          throw new Error('环境闸门 ENV-ATTRACT-CANDIDATE-EMPTY：候选工作台无企业（企业查询/对比篮加入后仍为空）: ' + txt.slice(0, 160));
        }
      };
      const parseSelectedCount = (t) => {
        const m = (t || '').replace(/\s+/g, ' ').match(/已选\s*(\d+)\s*家/);
        return m ? Number(m[1]) : -1;
      };
      const selectFirstCandidateRow = async () => {
        await expect(actionBar()).toBeVisible({ timeout: 10000 });
        for (let attempt = 0; attempt < 4; attempt++) {
          const cb = stack().locator('.arco-table-body .arco-table-tr .arco-checkbox').first();
          if (await cb.count()) {
            const checked = (await cb.getAttribute('class'))?.includes('arco-checkbox-checked');
            if (!checked) await cb.click({ timeout: 8000 });
          } else {
            const row = stack().locator('.arco-table-tr:has(.arco-table-td)').first();
            await row.locator('.arco-checkbox, input[type=checkbox]').first().click({ timeout: 8000 }).catch(() => {});
          }
          await page.waitForTimeout(700);
          const n = parseSelectedCount(await actionBar().innerText().catch(() => ''));
          if (n === 1) return;
        }
        throw new Error('勾选首行后已选仍为 ' + parseSelectedCount(await actionBar().innerText().catch(() => '')) + '，bar=' + ((await actionBar().innerText().catch(() => '')) || '').slice(0, 80));
      };
      await dismissBasket();
      await ensureOneCandidate();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 10000 });
      await selectFirstCandidateRow();
      const review = actionBar().getByRole('button', { name: '执行指定对象复核' }).first();
      await expect(review).toBeEnabled({ timeout: 8000 });
      await review.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const config = page.getByTestId('specified-review-config');
      await expect(config).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('指定对象模型参数配置', { exact: false }).first()).toBeVisible({ timeout: 8000 });
      const start = config.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      await page.waitForTimeout(1200);
  - note: 成功页标题为「人工线索复核结果」且结果表或「共分析」家数可见
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const readStack = async () => {
        try {
          return await stack().innerText({ timeout: 4000 });
        } catch {
          return await page.locator('body').innerText({ timeout: 3000 }).catch(() => '');
        }
      };
      let ok = false;
      let last = '';
      for (let i = 0; i < 48; i++) {
        await page.waitForTimeout(2500);
        last = await readStack();
        if (/候选分析失败|分析失败/.test(last) && /候选|复核/.test(last)) {
          throw new Error('候选复核失败终态: ' + last.slice(0, 240));
        }
        if (/人工线索复核结果/.test(last)) {
          const hasTable = /企业名称/.test(last) && /排名|招引推荐指数|操作/.test(last);
          const hasCount = /共分析\s*\d+\s*家/.test(last);
          if (hasTable || hasCount) {
            ok = true;
            break;
          }
        }
      }
      if (!ok) {
        const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
        if (stuck) {
          throw new Error('环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：超时仍停留在候选复核过程态');
        }
        throw new Error('超时未见「人工线索复核结果」及结果表/家数: ' + last.slice(0, 220));
      }
      await expect(stack().getByText('人工线索复核结果', { exact: false }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu svcz 深链 entry-seed catalog_path /enterprise/attraction&entry=candidates（禁止 /enterprise-center、/development/search）。前置 seed 同 01463（/enterprise/enterprise-search + 对比篮）。D4·候选空→ ENV-ATTRACT-CANDIDATE-EMPTY；异步卡过程→ ENV-ATTRACT-ASYNC-NO-SUCCESS-001。登录与关评审由 runner 前置。金样零 allow_skip。
