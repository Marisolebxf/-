id: FUNC-01429
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01429
priority: P1
tier: B
title: 主流程-全部产业
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 同册01433入池→候选工作台→展开全部产业（assert 自含）
expect:
  - note: 1、选项个数等于当前名单所属产业的去重个数
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const isCandidateWorkspace = async () => {
        if (!(await candTab().count())) return false;
        return (await candTab().getAttribute('aria-selected').catch(() => '')) === 'true';
      };
      const openCandidateTab = async () => {
        if (await isCandidateWorkspace()) return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if (!(await isCandidateWorkspace())) {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if (!(await isCandidateWorkspace())) {
          throw new Error('未能打开候选工作台');
        }
      };
      const rowCount = async () => stack().locator('.arco-table-body .arco-table-tr').count();
      const ensureCandidateFromSearch = async () => {
        await openCandidateTab();
        if ((await rowCount()) > 0) return;
        await page.goto(toUrl(searchRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('科技');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const addOpt = page.getByText('加入招引候选', { exact: true }).first();
        if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if ((await rowCount()) < 1) {
          const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
          throw new Error('ENV-ATTRACT-CANDIDATE-EMPTY：候选工作台无企业: ' + txt.slice(0, 160));
        }
      };
      const findIndustryColIndex = async () => {
        const ths = stack().locator('.arco-table-header .arco-table-th');
        const n = await ths.count();
        for (let i = 0; i < n; i += 1) {
          const t = ((await ths.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, '');
          if (/所属产业|产业领域|行业/.test(t)) return i;
        }
        return 2;
      };
      const distinctIndustriesFromTable = async () => {
        const col = await findIndustryColIndex();
        const rows = stack().locator('.arco-table-body .arco-table-tr');
        const n = await rows.count();
        const set = new Set();
        for (let i = 0; i < n; i += 1) {
          const cell = rows.nth(i).locator('.arco-table-td').nth(col);
          const v = ((await cell.innerText({ timeout: 5000 }).catch(() => '')) || '').replace(/\s+/g, ' ').trim();
          if (v && v !== '-' && v !== '—') set.add(v);
        }
        return set;
      };
      await ensureCandidateFromSearch();
      const expected = await distinctIndustriesFromTable();
      if (expected.size < 1) {
        throw new Error('名单产业列为空，无法比对下拉选项数');
      }
      const main = page.locator('main');
      const industrySelect = main.locator('.arco-select-view').filter({ hasText: '全部产业' }).first();
      await expect(industrySelect).toBeVisible({ timeout: 10000 });
      await industrySelect.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const dropdown = page.locator('.arco-select-dropdown:visible').last();
      await expect(dropdown).toBeVisible({ timeout: 8000 });
      const options = dropdown.locator('.arco-select-option');
      const optCount = await options.count();
      expect(optCount).toBe(expected.size);
on_fail: 截图 + 抄 X-Trace-Id
