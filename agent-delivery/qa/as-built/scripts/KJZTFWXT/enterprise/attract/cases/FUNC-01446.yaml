id: FUNC-01446
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01446
priority: P1
tier: B
title: 调整分析条件回到空态且条件区保留原筛选
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01437恢复已完成条件筛选成功结果，否则同册01408发起
expect:
  - note: 1、结果区回到「请设置条件并执行推荐分析」
    assert: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option';
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        return /招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t) && /共分析\s*\d+\s*家/.test(t);
      };
      const tryRestore = async () => {
        const tab = page.locator('button[data-tab-key="history"]').or(page.getByRole('tab', { name: '最近分析' })).first();
        if ((await tab.count()) < 1) return false;
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          const row = btn.locator('xpath=ancestor::tr[1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (/已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 12000 });
            for (let j = 0; j < 24; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const openSelect = async (placeholder) => {
        await page.keyboard.press('Escape').catch(() => {});
        const input = main.locator(`input[placeholder="${placeholder}"]`).first();
        await input.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const pickOption = async (name) => {
        await page.locator(optSel).filter({ hasText: name }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const runFilterAnalysis = async () => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await openSelect('全部企业标签');
        await pickOption('专精特新');
        await openSelect('全部行业领域');
        await pickOption('人工智能');
        const start = main.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          if (await isSuccessResult()) return;
          const t = await stack().innerText().catch(() => '');
          if (/推荐分析失败|任务失败/.test(t) && !/可视化分析过程/.test(t)) {
            throw new Error('条件筛选分析失败: ' + t.slice(0, 200));
          }
        }
        const t = await stack().innerText().catch(() => '');
        if (/可视化分析过程/.test(t)) {
          throw new Error('ENV-ATTRACT-ASYNC-NO-SUCCESS-001：120s内未到达成功结果');
        }
        throw new Error('未到达成功结果: ' + t.slice(0, 200));
      };
      if (!(await isSuccessResult())) {
        if (!(await tryRestore())) await runFilterAnalysis();
      }
      await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 10000 });
      const readSelect = async (ph) => {
        const wrap = main.locator(`input[placeholder="${ph}"]`).first().locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
        return ((await wrap.innerText()) || '').replace(/\s+/g, ' ').trim();
      };
      globalThis.__func01446 = {
        tagBefore: await readSelect('全部企业标签'),
        fieldBefore: await readSelect('全部行业领域'),
      };
      const adjust = stack().getByRole('button', { name: '调整分析条件' }).first();
      await expect(adjust).toBeVisible({ timeout: 10000 });
      await adjust.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(stack().getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 10000 });
  - note: 2、条件区仍保留进入结果前的筛选值
    assert: |-
      const ctx = globalThis.__func01446;
      if (!ctx?.tagBefore || !ctx?.fieldBefore) throw new Error('缺少进入结果前的筛选快照');
      const main = page.locator('main');
      const readSelect = async (ph) => {
        const wrap = main.locator(`input[placeholder="${ph}"]`).first().locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
        return ((await wrap.innerText()) || '').replace(/\s+/g, ' ').trim();
      };
      const tagAfter = await readSelect('全部企业标签');
      const fieldAfter = await readSelect('全部行业领域');
      if (tagAfter !== ctx.tagBefore) {
        throw new Error('企业标签变化：前=' + ctx.tagBefore + ' 后=' + tagAfter);
      }
      if (fieldAfter !== ctx.fieldBefore) {
        throw new Error('行业领域变化：前=' + ctx.fieldBefore + ' 后=' + fieldAfter);
      }
      await expect(main.getByRole('button', { name: '开始分析' }).first()).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
