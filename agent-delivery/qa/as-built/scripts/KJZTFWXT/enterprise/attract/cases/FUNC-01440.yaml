id: FUNC-01440
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01440
priority: P1
tier: B
title: 主流程-报告候选工作台
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01409前置+最近分析点已完成候选工作台「查看 HTML 报告」；报告页在 expect 判定
expect:
  - note: 1、出现「招引推荐报告」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const candRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const reportReady = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        if (!(await reader.isVisible().catch(() => false))) return false;
        return await reader.locator('h1').filter({ hasText: '招引推荐报告' }).first().isVisible().catch(() => false);
      };
      const waitReportBody = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          if (await reportReady()) return true;
          await page.waitForTimeout(600);
        }
        return await reportReady();
      };
      const tablist = () => page.getByRole('tablist', { name: '招引企业推荐分析页签' });
      const openRecentTab = async () => {
        await expect(tablist()).toBeVisible({ timeout: 12000 });
        await tablist().getByRole('tab', { name: '最近分析' }).click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await expect(page.getByText('招引推荐 · 最近分析').first()).toBeVisible({ timeout: 15000 });
      };
      const pickCompletedCandidateHtmlReport = async () => {
        const st = stack();
        const buttons = st.locator('[data-recruit-history-open-html-report], button').filter({ hasText: '查看 HTML 报告' });
        const n = await buttons.count();
        if (n < 1) return null;
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          if (await btn.isDisabled().catch(() => true)) continue;
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /候选工作台/.test(txt)) return btn;
        }
        return null;
      };
      const candTab = () => tablist().getByRole('tab', { name: '候选工作台' });
      const openCandidateTab = async () => {
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
      };
      const actionBar = () => stack().getByTestId('candidate-action-bar');
      const parseSelectedCount = (t) => {
        const m = (t || '').replace(/\s+/g, ' ').match(/已选\s*(\d+)\s*家/);
        return m ? Number(m[1]) : -1;
      };
      const ensureOneCandidate = async () => {
        await openCandidateTab();
        if ((await actionBar().count()) && (await actionBar().first().isVisible().catch(() => false))) return;
        await page.goto(toUrl('/enterprise/enterprise-search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const addOpt = page.getByText('加入招引候选', { exact: true }).first();
        if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if (!(await actionBar().count()) || !(await actionBar().first().isVisible().catch(() => false))) {
          throw new Error('候选工作台无企业，无法构造已完成候选任务');
        }
      };
      const selectFirstCandidateRow = async () => {
        await expect(actionBar()).toBeVisible({ timeout: 10000 });
        for (let attempt = 0; attempt < 4; attempt++) {
          const cb = stack().locator('.arco-table-body .arco-table-tr .arco-checkbox').first();
          if (await cb.count()) {
            const checked = (await cb.getAttribute('class'))?.includes('arco-checkbox-checked');
            if (!checked) await cb.click({ timeout: 8000 });
          } else {
            const row = stack().locator('.arco-table-tr:has(.arco-table-td)').first();
            await row.locator('.arco-checkbox, input[type=checkbox]').first().click({ timeout: 8000 }).catch(() => {});
          }
          await page.waitForTimeout(700);
          if (parseSelectedCount(await actionBar().innerText().catch(() => '')) === 1) return;
        }
        throw new Error('勾选首行后已选仍为 ' + parseSelectedCount(await actionBar().innerText().catch(() => '')));
      };
      const ensureCandidateSuccess = async () => {
        await dismissBasket();
        await ensureOneCandidate();
        await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 10000 });
        await selectFirstCandidateRow();
        const review = actionBar().getByRole('button', { name: '执行指定对象复核' }).first();
        await expect(review).toBeEnabled({ timeout: 8000 });
        await review.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const config = page.getByTestId('specified-review-config');
        await expect(config).toBeVisible({ timeout: 12000 });
        await config.getByRole('button', { name: '开始分析' }).first().click({ timeout: 8000 });
        const title = () => stack().getByText('人工线索复核结果', { exact: false }).first();
        let last = '';
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(i === 0 ? 800 : 2500);
          last = await stack().innerText().catch(() => '');
          if (/候选分析失败/.test(last)) {
            throw new Error('候选复核失败，无法构造前置已完成记录');
          }
          if (await title().isVisible().catch(() => false) && !/可视化分析过程/.test(last)) return;
        }
        throw new Error('未在超时内到达人工线索复核结果: ' + last.slice(0, 200));
      };
      const openReportFromHistory = async () => {
        await dismissBasket();
        await openRecentTab();
        let reportBtn = await pickCompletedCandidateHtmlReport();
        if (!reportBtn) {
          await tablist().getByRole('tab', { name: '候选工作台' }).click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(500);
          await ensureCandidateSuccess();
          await openRecentTab();
          reportBtn = await pickCompletedCandidateHtmlReport();
        }
        if (!reportBtn) {
          throw new Error('最近分析无「已完成」的候选工作台任务可「查看 HTML 报告」');
        }
        await reportBtn.scrollIntoViewIfNeeded().catch(() => {});
        await reportBtn.click({ timeout: 15000 });
        if (!(await waitReportBody(60000))) {
          throw new Error('点击 HTML 报告后未进入只读报告页，url=' + page.url());
        }
      };
      await openReportFromHistory();
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader.locator('h1').filter({ hasText: '招引推荐报告' }).first()).toBeVisible({ timeout: 12000 });
  - note: 2、可见「返回分析结果」
    assert: |-
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      const back = reader.locator('[data-report-back], button').filter({ hasText: '返回分析结果' }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
