id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00986
priority: P0
title: 显式发起招引推荐分析后到达成功态且过程有反馈
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
- 已设置一组常规条件（如企业标签「高新技术企业」）
locators:
  tag_select: placeholder「全部企业标签」
  start: button「开始分析」
  process: 可视化分析过程
  result: 招引推荐分析结果
steps:
- action: goto
  target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
- action: click
  target: 企业标签下拉选「高新技术企业」
- action: click
  target: 开始分析
- action: wait
  for: 成功态结果区
expect:
- note: 发起后进入分析中且结果区有过程反馈不白屏
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; const ph = page.locator('input[placeholder="全部企业标签"]').first(); await ph.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: '高新技术企业' }).first().click({ timeout: 8000 }); await page.waitForTimeout(600); const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeEnabled({ timeout: 8000 }); await start.click(); await page.waitForTimeout(1500); const stack = page.getByTestId('recruit-tab-stack'); const mid = await stack.innerText(); if (!/可视化分析过程|分析中|任务提交|算法计算|招引推荐分析结果/.test(mid)) throw new Error('发起后无过程/结果反馈: ' + mid.slice(0, 200))
- note: 完成后到达成功态并呈现本次结果
  assert: |-
    const stack = page.getByTestId('recruit-tab-stack'); let ok = false; for (let i = 0; i < 24; i++) { await page.waitForTimeout(2500); const t = await stack.innerText(); if (/招引推荐分析结果|共分析\s*\d+\s*家/.test(t) && !/可视化分析过程/.test(t)) { ok = true; break } } if (!ok) throw new Error('未在超时内到达成功结果态')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 过程区含五阶段条（任务提交→…→结果组装）；同条件可能秒级复用已有任务（observed）；全程不伪造百分比。
tier: A
