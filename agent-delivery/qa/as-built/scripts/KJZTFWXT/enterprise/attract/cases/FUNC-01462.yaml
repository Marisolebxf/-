id: FUNC-01462
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01462
priority: P1
title: 异常-失败无报告
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；最近分析有状态为失败的记录
locators:
  recent_tab: Tab「最近分析」
  html_report_button: button「查看 HTML 报告」或 data-recruit-history-open-html-report
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history
  - action: wait
    for: 招引页 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 最近分析→点选一条失败行；该行「查看 HTML 报告」禁用态在 expect 判定
expect:
  - note: 1、该行「查看 HTML 报告」处于禁用状态
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const historyDeepLink = async () => {
        const base = new URL(page.url());
        const prefix = base.pathname.startsWith('/tts/svcz') ? '/tts/svcz' : '';
        await page.goto(
          base.origin +
            prefix +
            '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history',
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/招引推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-ATTRACT-NO-HISTORY-TAB-001：现场招引页无「最近分析」Tab/深链（仅条件筛选+候选工作台时不自动化本用例）',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/招引推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const pickFailedRowHtmlReport = async () => {
        const st = stack();
        const rows = st.locator('.arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const txt = await row.innerText().catch(() => '');
          if (!txt || !/失败/.test(txt)) continue;
          const btn = row.locator('[data-recruit-history-open-html-report], button:has-text("查看 HTML 报告")').first();
          if ((await btn.count()) < 1) continue;
          await row.scrollIntoViewIfNeeded();
          const taskCell = row.locator('.arco-table-td').first();
          if (await taskCell.count()) {
            await taskCell.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
          return btn;
        }
        throw new Error(
          '环境闸门 ENV-ATTRACT-NO-FAILED-HISTORY-001：最近分析无状态为「失败」的任务行（前置 2 不满足）',
        );
      };
      await dismissBasket();
      await openRecentTab();
      await waitHistoryShell();
      const reportBtn = await pickFailedRowHtmlReport();
      await expect(reportBtn).toBeVisible({ timeout: 8000 });
      await expect(reportBtn).toBeDisabled({ timeout: 8000 });
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      if (await reader.isVisible().catch(() => false)) {
        throw new Error('失败行「查看 HTML 报告」仍打开了报告页，与用例预期不符');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu 深链 catalog_path /enterprise/attraction&entry=history（勿用 forbidden /enterprise-center）；步骤=最近分析点选含「失败」状态行（RecruitHistoryTable status!==success→data-recruit-history-open-html-report disabled）。机检=该行 button disabled 且未进 SystemReportReader。D4·无最近分析 Tab→ENV-ATTRACT-NO-HISTORY-TAB-001；无失败行→ENV-ATTRACT-NO-FAILED-HISTORY-001。2026-10-20 rewrite-FUNC-01462-r2 无头 1/1 绿。登录与关评审由 runner 前置。B 档零 allow_skip。
