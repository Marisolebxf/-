id: FUNC-01434
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01434
priority: P0
title: 主流程-对比篮加入候选
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；对比篮中已有企业（assert 自含企业查询入篮兜底）
locators:
  search_route: /development/search（30888 企业查询）
  basket_dock: button「打开对比篮」
  basket_sel: 对比篮 [aria-label^="选择"]
  add_attract: 对比篮 button「加入招引候选」
  cand_tab: tab「候选工作台」
  source_column: 候选表列「线索来源」
steps:
  - action: goto
    target: /
  - action: goto
    target: /development/search
  - action: evaluate
    note: 对比篮勾选→加入招引候选→候选工作台（assert 自含）
expect:
  - note: 1、该企业出现在人工线索候选工作台 2、线索来源为「对比篮」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const origin = new URL(page.url()).origin;
      const candRoute = '/enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const openCandidateTab = async () => {
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) === 'true') return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const sourceInRow = async (companyName) => {
        const main = page.locator('.diagnosis-main');
        const tbl = main.locator('.arco-table').first();
        if (await tbl.count()) {
          const ths = await tbl.locator('.arco-table-th').allInnerTexts();
          const colIdx = ths.findIndex((h) => /线索来源/.test(h));
          if (colIdx >= 0) {
            const rows = tbl.locator('.arco-table-body .arco-table-tr');
            const rn = await rows.count();
            for (let i = 0; i < rn; i++) {
              const row = rows.nth(i);
              const txt = (await row.innerText()).replace(/\s+/g, ' ');
              if (!txt.includes(companyName)) continue;
              const cell = row.locator('.arco-table-td').nth(colIdx);
              return (await cell.innerText()).replace(/\s+/g, ' ').trim();
            }
          }
        }
        const body = await main.innerText({ timeout: 8000 }).catch(() => '');
        if (!body.includes(companyName)) return null;
        const esc = companyName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const m = body.match(new RegExp(esc + '[\\s\\S]{0,160}?(对比篮|企业查询|推荐分析)'));
        return m ? m[1] : null;
      };
      const basketLayer = () =>
        page.locator('[data-system-surface-id="compare-basket"][data-panel-open="true"]');
      const addAttractFromBasketFor = async (preferName) => {
        await dismissBasket();
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (!(await dock.count())) throw new Error('未见「打开对比篮」入口');
        await dock.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const layer = basketLayer();
        if (!(await layer.count())) {
          await page.keyboard.press('Escape').catch(() => {});
          return false;
        }
        const sel = layer
          .locator(`[aria-label="选择 ${preferName}"], [aria-label="选择${preferName}"]`)
          .first();
        if (!(await sel.count())) {
          await page.keyboard.press('Escape').catch(() => {});
          return false;
        }
        await sel.click({ timeout: 8000 });
        await page.waitForTimeout(350);
        const addA = layer
          .locator('[data-testid="compare-basket-action-bar"]')
          .getByRole('button', { name: '加入招引候选' });
        if (!(await addA.isEnabled().catch(() => false))) {
          await page.keyboard.press('Escape').catch(() => {});
          return false;
        }
        await addA.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await page.keyboard.press('Escape').catch(() => {});
        return true;
      };
      const basketToAttract = async () => {
        for (const kw of ['人工智能', '生物医药', '新能源']) {
          await dismissBasket();
          const input = page.getByRole('textbox', { name: /输入企业名/ }).first();
          await input.fill(kw);
          await page.getByRole('button', { name: '搜索', exact: true }).click();
          const hit = page.getByText(/命中\s*[1-9]\d*\s*家企业/).first();
          if (!(await hit.isVisible({ timeout: 20000 }).catch(() => false))) continue;
          const main = page.locator('main');
          const yinyuBtns = main.getByRole('button', { name: /引育候选/ });
          const btnN = await yinyuBtns.count();
          for (let i = 0; i < Math.min(btnN, 8); i++) {
            const yq = yinyuBtns.nth(i);
            const card = yq.locator('xpath=ancestor::div[contains(@class,"rounded")][1]');
            const pick = card.locator('[aria-label^="选择"]').first();
            if (!(await pick.count())) continue;
            const aria = (await pick.getAttribute('aria-label')) || '';
            const name = aria.replace(/^选择\s*/, '').trim();
            if (!name || name.length < 4 || /区域|产业|标签/.test(name)) continue;
            await pick.click({ timeout: 8000 });
            await page.waitForTimeout(350);
            const bulk = page
              .locator('div')
              .filter({ hasText: /已选\s*1\s*家企业/ })
              .filter({ has: page.getByRole('button', { name: '加入对比' }) })
              .first();
            if (!(await bulk.count())) {
              await pick.click({ timeout: 3000 }).catch(() => {});
              continue;
            }
            await bulk.getByRole('button', { name: '加入对比' }).click({ timeout: 8000 });
            await page.waitForTimeout(1000);
            await pick.click({ timeout: 3000 }).catch(() => {});
            if (!(await addAttractFromBasketFor(name))) continue;
            await page.goto(origin + candRoute, { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            await openCandidateTab();
            await page.waitForTimeout(800);
            const workbench = page.getByText('人工线索候选工作台', { exact: false }).first();
            if (!(await workbench.isVisible().catch(() => false))) {
              await page.goto(origin + '/development/search', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(1000);
              continue;
            }
            const source = await sourceInRow(name);
            if (source === '对比篮') return name;
            await page.goto(origin + '/development/search', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);
          }
        }
        return null;
      };
      await dismissBasket();
      const entName = await basketToAttract();
      if (!entName) {
        const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
        throw new Error('环境闸门 ENV-ATTRACT-CANDIDATE-EMPTY：对比篮加入后候选工作台未见线索来源为「对比篮」的企业: ' + txt.slice(0, 160));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 /development/search 结果卡引育候选同层 rounded 内 checkbox 入篮（批量「加入对比」）；系统层 data-system-surface-id=compare-basket 内勾选 + compare-basket-action-bar「加入招引候选」（禁止点主列表背景 checkbox）。候选深链 entry=candidates；线索来源=对比篮。D4·落库失败→ ENV-ATTRACT-CANDIDATE-EMPTY。登录与关评审由 runner 前置。B 档零 allow_skip。
