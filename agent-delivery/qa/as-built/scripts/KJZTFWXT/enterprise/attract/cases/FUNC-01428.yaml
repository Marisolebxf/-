id: FUNC-01428
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01428
priority: P0
title: 主流程-候选名称过滤
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；候选工作台已有企业（assert 自含企业查询加入招引候选兜底）
locators:
  cand_tab: tab「候选工作台」
  name_search: placeholder「按企业名称搜索」
  cand_table: .diagnosis-main .arco-table-body .arco-table-tr
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 候选工作台→读名单→按企业名称搜索片段→校验只缩小名单
expect:
  - note: 1、名单只保留名称匹配的企业 2、不出现「可视化分析过程」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const origin = new URL(page.url()).origin;
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const isCandidateWorkspace = async () => {
        if (!(await candTab().count())) return false;
        return (await candTab().getAttribute('aria-selected').catch(() => '')) === 'true';
      };
      const openCandidateTab = async () => {
        if (await isCandidateWorkspace()) return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if (!(await isCandidateWorkspace())) {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if (!(await isCandidateWorkspace())) {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const rowCount = async () => stack().locator('.arco-table-body .arco-table-tr').count();
      const ensureOneCandidate = async () => {
        await openCandidateTab();
        let rows = await rowCount();
        if (rows > 0) return;
        const tryBasket = async () => {
          const dock = page.getByRole('button', { name: /打开对比篮/ });
          if (!(await dock.count())) return false;
          await dock.first().click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const addA = page.getByRole('button', { name: '加入招引候选' });
          if (!(await addA.count())) return false;
          const sels = page.locator('[aria-label^="选择 "]');
          if (await sels.count()) await sels.first().click();
          await page.waitForTimeout(400);
          if (!(await addA.first().isEnabled())) return false;
          await addA.first().click({ timeout: 8000 });
          await page.waitForTimeout(1000);
          await page.keyboard.press('Escape').catch(() => {});
          return true;
        };
        if (await tryBasket()) {
          await openCandidateTab();
          rows = await rowCount();
          if (rows > 0) return;
        }
        await page.goto(origin + '/development/search', { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const addOpt = page.getByText('加入招引候选', { exact: true }).first();
        if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(origin + candRoute, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        rows = await rowCount();
        if (rows < 1) {
          const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
          throw new Error('环境闸门 ENV-ATTRACT-CANDIDATE-EMPTY：候选工作台无企业（对比篮/企业查询加入后仍为空）: ' + txt.slice(0, 160));
        }
      };
      const parsePendingReview = (text) => {
        const m = text.match(/待复核\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const readRowName = async (row) => {
        const link = row.getByRole('link').first();
        if (await link.count()) {
          const raw = ((await link.innerText({ timeout: 8000 }).catch(() => '')) || '').trim();
          if (raw.length >= 2) return raw;
        }
        const txt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        const parts = txt.split(/\s+/).filter((p) => p.length >= 2 && !/^\d+(\.\d+)?$/.test(p));
        const hit = parts.find((p) => /公司|集团|有限|科技|股份|企业/.test(p));
        if (hit) return hit;
        if (parts[0]) return parts[0];
        throw new Error('候选行无企业名称: ' + txt.slice(0, 100));
      };
      const readAllNames = async () => {
        const rows = stack().locator('.arco-table-body .arco-table-tr');
        const n = await rows.count();
        const names = [];
        for (let i = 0; i < n; i++) names.push(await readRowName(rows.nth(i)));
        return names;
      };
      const pickFragment = (allNames) => {
        const first = allNames[0] || '';
        if (!first) throw new Error('名单无企业名');
        if (allNames.length === 1) {
          const frag = first.slice(0, Math.min(4, first.length));
          return { fragment: frag, expected: allNames.filter((n) => n.includes(frag)) };
        }
        for (let len = Math.min(6, first.length); len >= 2; len--) {
          for (let start = 0; start + len <= first.length; start++) {
            const frag = first.slice(start, start + len);
            const expected = allNames.filter((n) => n.includes(frag));
            if (expected.length >= 1 && expected.length < allNames.length) {
              return { fragment: frag, expected };
            }
          }
        }
        const frag = first.slice(0, Math.min(4, first.length));
        return { fragment: frag, expected: allNames.filter((n) => n.includes(frag)) };
      };
      await dismissBasket();
      await ensureOneCandidate();
      const bodyBefore = await page.locator('body').innerText().catch(() => '');
      if (/可视化分析过程/.test(bodyBefore) && !/人工线索候选工作台/.test(bodyBefore)) {
        throw new Error('未在候选工作台，现场含可视化分析过程');
      }
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 10000 });
      const pendingBefore = parsePendingReview(bodyBefore);
      const namesBefore = await readAllNames();
      if (namesBefore.length < 1) throw new Error('候选表无数据行');
      const { fragment, expected } = pickFragment(namesBefore);
      const search = stack().getByPlaceholder('按企业名称搜索').first();
      await expect(search).toBeVisible({ timeout: 10000 });
      await search.fill(fragment);
      await page.waitForTimeout(800);
      const namesAfter = await readAllNames();
      if (namesAfter.length < 1) {
        throw new Error('搜索「' + fragment + '」后名单为空，预期至少 ' + expected.length + ' 家');
      }
      if (namesAfter.length > expected.length) {
        throw new Error('过滤后行数 ' + namesAfter.length + ' 大于应匹配家数 ' + expected.length);
      }
      const fragLower = fragment.toLocaleLowerCase('zh-CN');
      for (const n of namesAfter) {
        if (!n.toLocaleLowerCase('zh-CN').includes(fragLower)) {
          throw new Error('过滤后仍见不匹配企业「' + n + '」，片段=' + fragment);
        }
      }
      const expectedSet = new Set(expected);
      for (const n of namesAfter) {
        if (!expectedSet.has(n)) {
          const loose = expected.some((e) => e.includes(n) || n.includes(e));
          if (!loose) throw new Error('过滤后出现非预期企业「' + n + '」');
        }
      }
      if (namesBefore.length > 1 && namesAfter.length >= namesBefore.length) {
        throw new Error('多企业名单搜索后未缩小：前 ' + namesBefore.length + ' 后 ' + namesAfter.length);
      }
      const bodyAfter = await page.locator('body').innerText().catch(() => '');
      if (/可视化分析过程/.test(bodyAfter)) {
        throw new Error('名称搜索后误入「可视化分析过程」');
      }
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 5000 });
      if (!/找到\s*\d+\s*家/.test(bodyAfter) && namesAfter.length < namesBefore.length) {
        throw new Error('过滤后应出现「找到 N 家」或可见行数缩小');
      }
      const pendingAfter = parsePendingReview(bodyAfter);
      if (pendingBefore !== null && pendingAfter !== null && pendingAfter !== pendingBefore) {
        throw new Error('「待复核」总数应不变：前 ' + pendingBefore + ' 后 ' + pendingAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 /enterprise-center/attraction&entry=candidates；30888 无 data-tab-key，以 role=tab「候选工作台」aria-selected 判定（recruit-tab-stack innerText 仅含页签文案不可用）。搜索 CandidatePanel「按企业名称搜索」；过滤后「找到 N 家」、待复核 tag 不变。前置对比篮/企业查询加入（同 01409）。D4·候选空→ ENV-ATTRACT-CANDIDATE-EMPTY。登录与关评审由 runner 前置。B 档零 allow_skip。
