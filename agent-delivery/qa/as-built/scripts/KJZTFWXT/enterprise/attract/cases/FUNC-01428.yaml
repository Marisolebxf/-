id: FUNC-01428
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01428
priority: P1
tier: B
title: 主流程-候选名称过滤
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 同册01433入池→候选工作台→按企业名称搜索片段（assert 自含）
expect:
  - note: 1、名单只保留名称匹配的企业
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const isCandidateWorkspace = async () => {
        if (!(await candTab().count())) return false;
        return (await candTab().getAttribute('aria-selected').catch(() => '')) === 'true';
      };
      const openCandidateTab = async () => {
        if (await isCandidateWorkspace()) return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if (!(await isCandidateWorkspace())) {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if (!(await isCandidateWorkspace())) {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const rowCount = async () => stack().locator('.arco-table-body .arco-table-tr').count();
      const ensureCandidateFromSearch = async () => {
        await openCandidateTab();
        if ((await rowCount()) > 0) return;
        await page.goto(toUrl(searchRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('科技');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        const recruitDrop = page.locator('main').getByRole('button', { name: /引育候选/ }).first();
        await recruitDrop.scrollIntoViewIfNeeded();
        await recruitDrop.click({ timeout: 15000 });
        await page.waitForTimeout(500);
        await page.locator('main').getByText('加入招引候选', { exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if ((await rowCount()) < 1) {
          const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
          throw new Error('ENV-ATTRACT-CANDIDATE-EMPTY：候选工作台无企业（企业查询加入招引候选后仍为空）: ' + txt.slice(0, 160));
        }
      };
      const readRowName = async (row) => {
        const link = row.getByRole('link').first();
        if (await link.count()) {
          const raw = ((await link.innerText({ timeout: 8000 }).catch(() => '')) || '').trim();
          if (raw.length >= 2) return raw;
        }
        const txt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        const parts = txt.split(/\s+/).filter((p) => p.length >= 2 && !/^\d+(\.\d+)?$/.test(p));
        const hit = parts.find((p) => /公司|集团|有限|科技|股份|企业/.test(p));
        return hit || parts[0] || '';
      };
      const readAllNames = async () => {
        const rows = stack().locator('.arco-table-body .arco-table-tr');
        const n = await rows.count();
        const names = [];
        for (let i = 0; i < n; i++) names.push(await readRowName(rows.nth(i)));
        return names.filter(Boolean);
      };
      const pickFragment = (allNames) => {
        const first = allNames[0] || '';
        if (!first) throw new Error('名单无企业名');
        if (allNames.length === 1) {
          const frag = first.slice(0, Math.min(4, first.length));
          return { fragment: frag, expected: allNames.filter((n) => n.includes(frag)) };
        }
        for (let len = Math.min(6, first.length); len >= 2; len--) {
          for (let start = 0; start + len <= first.length; start++) {
            const frag = first.slice(start, start + len);
            const expected = allNames.filter((n) => n.includes(frag));
            if (expected.length >= 1 && expected.length < allNames.length) {
              return { fragment: frag, expected };
            }
          }
        }
        const frag = first.slice(0, Math.min(4, first.length));
        return { fragment: frag, expected: allNames.filter((n) => n.includes(frag)) };
      };
      await ensureCandidateFromSearch();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 10000 });
      const namesBefore = await readAllNames();
      if (namesBefore.length < 1) throw new Error('候选表无数据行');
      const { fragment, expected } = pickFragment(namesBefore);
      const search = stack().getByPlaceholder('按企业名称搜索').first();
      await expect(search).toBeVisible({ timeout: 10000 });
      await search.fill(fragment);
      await page.waitForTimeout(800);
      const namesAfter = await readAllNames();
      if (namesAfter.length < 1) {
        throw new Error('搜索「' + fragment + '」后名单为空，预期至少 ' + expected.length + ' 家');
      }
      const fragLower = fragment.toLocaleLowerCase('zh-CN');
      for (const n of namesAfter) {
        if (!n.toLocaleLowerCase('zh-CN').includes(fragLower)) {
          throw new Error('过滤后仍见不匹配企业「' + n + '」，片段=' + fragment);
        }
      }
      if (namesBefore.length > 1 && namesAfter.length >= namesBefore.length) {
        throw new Error('多企业名单搜索后未缩小：前 ' + namesBefore.length + ' 后 ' + namesAfter.length);
      }
  - note: 2、不出现「可视化分析过程」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('可视化分析过程', { exact: false })).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
