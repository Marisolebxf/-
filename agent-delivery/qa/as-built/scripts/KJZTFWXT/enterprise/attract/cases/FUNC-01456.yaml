id: FUNC-01456
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01456
priority: P1
tier: B
title: 备选-候选每页条数
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 打开候选工作台；无名单时按用例 01433 经企业查询加入招引候选
    target: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const openCandidateTab = async () => {
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) === 'true') return;
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
      };
      const hasRows = async () => (await stack().locator('.arco-table-body .arco-table-tr').count()) > 0;
      await openCandidateTab();
      if (await hasRows()) return;
      const origin = new URL(page.url()).origin;
      await page.goto(origin + '/enterprise/enterprise-search', { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1500);
      await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
      await page.getByRole('button', { name: '搜索' }).click();
      await page.waitForTimeout(5000);
      await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const addOpt = page.getByText('加入招引候选', { exact: true }).first();
      if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      await page.goto(origin + '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates', {
        waitUntil: 'domcontentloaded',
      });
      await page.waitForTimeout(2000);
      await openCandidateTab();
      if (!(await hasRows())) {
        throw new Error('ENV-ATTRACT-CANDIDATE-EMPTY：候选工作台无企业');
      }
  - action: evaluate
    note: 展开名单底栏每页条数（candidate-pagination-bar 底栏 sticky，先滚入视口）
    target: |-
      const bar = page.getByTestId('candidate-pagination-bar');
      await bar.scrollIntoViewIfNeeded();
      await page.waitForTimeout(300);
      const sel = bar.locator('.arco-select-view').first();
      await sel.click({ timeout: 10000 });
      await page.waitForTimeout(400);
expect:
  - note: 1、选项为 10 条/页、20 条/页、50 条/页共 3 个
    assert: |-
      await page.waitForTimeout(400);
      const opt10 = page.getByRole('option', { name: /10\s*条\/页/ });
      const opt20 = page.getByRole('option', { name: /20\s*条\/页/ });
      const opt50 = page.getByRole('option', { name: /50\s*条\/页/ });
      await expect(opt10).toHaveCount(1);
      await expect(opt20).toHaveCount(1);
      await expect(opt50).toHaveCount(1);
      await expect(opt10.first()).toBeVisible();
      await expect(opt20.first()).toBeVisible();
      await expect(opt50.first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
