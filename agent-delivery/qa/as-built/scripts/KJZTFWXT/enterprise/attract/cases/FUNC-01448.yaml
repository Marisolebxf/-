id: FUNC-01448
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01448
priority: P1
title: 结果翻页后已选家数保留且表头不变
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；成功结果多于一页（assert 自含）
locators:
  result_table: recruit-tab-stack 内 .arco-table
  row_checkbox: 结果表首行 checkbox
  page_next: .arco-pagination-item-next
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction
  - action: wait
    for: 条件区 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 成功结果→勾选一行→翻页；表头与已选在 expect 判定
expect:
  - note: 1、表头列保持不变 2、翻页后已选家数不归零
    assert: |-
      const REQUIRED_COLS = ['排名', '企业名称', '行业领域', '地域来源', '目标特征', '招引推荐指数', '操作'];
      const PAGE_SIZE = 20;
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const TAG = '高新技术企业';
      const FIELD_PRIMARY = '人工智能';
      const FIELD_FALLBACK = '新一代信息技术';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        if (!(await hasHistoryTab())) {
          const origin = new URL(page.url()).origin;
          await page.goto(
            origin +
              '/enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction&entry=history',
            { waitUntil: 'domcontentloaded' },
          );
          await page.waitForTimeout(1200);
        }
        if (!(await hasHistoryTab())) return false;
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
          if ((await legacy.count()) < 1) {
            const byName = page.getByRole('tab', { name: '最近分析' });
            if ((await byName.count()) < 1) return true;
            await byName.first().click({ timeout: 8000 });
          } else await legacy.click({ timeout: 8000 });
        } else await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        return true;
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const parseSelected = (text) => {
        const m = text.match(/已选\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const isSuccessResult = async () => {
        const st = stack();
        const t = await st.innerText().catch(() => '');
        const url = page.url();
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        if (!(await openRecentTab())) return false;
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        let bestAnalyzed = -1;
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!(txt && /已完成/.test(txt) && /条件筛选/.test(txt))) continue;
          await btn.click({ timeout: 15000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (!(await isSuccessResult())) continue;
            const analyzed = parseCounts(await st.innerText().catch(() => ''))?.analyzed ?? 0;
            if (analyzed > bestAnalyzed) bestAnalyzed = analyzed;
            if (analyzed > PAGE_SIZE) return true;
            break;
          }
          if (bestAnalyzed > PAGE_SIZE) return true;
          if (!(await openRecentTab())) break;
        }
        return bestAnalyzed >= 1;
      };
      const waitSuccessResult = async (rounds = 48) => {
        const st = stack();
        let last = '';
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          const url = page.url();
          if ((/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last)?.analyzed >= 1) return;
          }
          if (/任务失败|分析失败|推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析进入失败态: ' + last.slice(0, 240));
          }
        }
        const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
        if (stuck) {
          const hist = await hasHistoryTab();
          throw new Error(
            '环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达成功结果以测结果翻页（30888' +
              (hist ? '' : ' 仅两 Tab 无最近分析') +
              ' 与 FUNC-01408/01418 同源 D4）',
          );
        }
        throw new Error('未在超时内到达条件筛选成功结果: ' + last.slice(0, 200));
      };
      const openPh = async (ph) => {
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator(`input[placeholder="${ph}"]`).first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const pickOption = async (text) => {
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const reachFilterSuccess = async () => {
        await waitFilterReady();
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter() && await isSuccessResult()) return;
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        await openPh('全部企业标签');
        await pickOption(TAG);
        await openPh('全部行业领域');
        const ai = page.locator(optSel).filter({ hasText: FIELD_PRIMARY });
        if (await ai.count()) await ai.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: FIELD_FALLBACK }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitSuccessResult();
        await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      };
      const readHeaderLabels = async (st) => {
        const table = st.locator('.arco-table').first();
        await expect(table).toBeVisible({ timeout: 10000 });
        const ths = table.locator('.arco-table-header .arco-table-th, thead .arco-table-th');
        const n = await ths.count();
        const labels = [];
        for (let i = 0; i < n; i++) {
          const t = ((await ths.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t && !/^$/.test(t)) labels.push(t);
        }
        return labels;
      };
      const assertRequiredCols = (labels) => {
        const missing = REQUIRED_COLS.filter((c) => !labels.some((h) => h === c || h.includes(c)));
        if (missing.length) {
          throw new Error('结果表头缺列：' + missing.join('、') + '；现场=' + labels.join('|'));
        }
      };
      const resultPagination = (st) =>
        st.locator('.arco-pagination').filter({ has: page.locator('.arco-pagination-item') }).last();
      await dismissBasket();
      await reachFilterSuccess();
      const st = stack();
      const bodyText = await st.innerText().catch(() => '');
      const analyzed = parseCounts(bodyText)?.analyzed ?? 0;
      if (analyzed <= PAGE_SIZE) {
        throw new Error(
          '数据闸门：共分析 ' + analyzed + ' 家不大于单页 ' + PAGE_SIZE + '，无法验翻页（ticket=ENV-ATTRACT-RESULT-PAGE2-001）',
        );
      }
      const pag = resultPagination(st);
      await expect(pag).toBeVisible({ timeout: 8000 });
      const next = pag.locator('.arco-pagination-item-next').first();
      const nextCls = (await next.getAttribute('class')) || '';
      if (/disabled/.test(nextCls)) {
        throw new Error('数据闸门：共分析 ' + analyzed + ' 家但下一页禁用，无法验翻页（ticket=ENV-ATTRACT-RESULT-PAGE2-001）');
      }
      const headersBefore = await readHeaderLabels(st);
      assertRequiredCols(headersBefore);
      const rows = st.locator('.arco-table-body .arco-table-tr');
      const rowN = await rows.count();
      if (rowN < 1) throw new Error('结果表无数据行，无法勾选');
      const firstCb = rows.first().locator('.arco-checkbox').first();
      await expect(firstCb).toBeVisible({ timeout: 8000 });
      const beforeSel = parseSelected(bodyText);
      if (beforeSel !== null && beforeSel !== 0) {
        throw new Error('勾选前已选家数应为 0，现场=' + beforeSel);
      }
      await firstCb.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const afterCheckText = await st.innerText().catch(() => '');
      const afterCheckSel = parseSelected(afterCheckText);
      if (afterCheckSel === null || afterCheckSel < 1) {
        throw new Error('勾选一行后已选应≥1 家，现场=' + afterCheckSel);
      }
      const cls = (await firstCb.getAttribute('class')) || '';
      if (!/arco-checkbox-checked/.test(cls)) {
        throw new Error('勾选后 checkbox 未进入 checked 态');
      }
      await next.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const headersAfter = await readHeaderLabels(st);
      if (headersAfter.join('|') !== headersBefore.join('|')) {
        throw new Error('翻页后表头变化：前=' + headersBefore.join('|') + ' 后=' + headersAfter.join('|'));
      }
      assertRequiredCols(headersAfter);
      const afterPageText = await st.innerText().catch(() => '');
      const afterPageSel = parseSelected(afterPageText);
      if (afterPageSel === null || afterPageSel < 1) {
        throw new Error('翻页后已选家数归零或不可读，现场=' + afterPageSel + '；片段=' + afterPageText.slice(0, 120));
      }
      if (afterPageSel !== afterCheckSel) {
        throw new Error('翻页后已选家数变化：勾选后=' + afterCheckSel + ' 翻页后=' + afterPageSel);
      }
      const active = pag.locator('.arco-pagination-item-active').first();
      const activeText = ((await active.innerText()) || '').trim();
      if (activeText !== '2') {
        throw new Error('翻页后当前页应为 2，现场 active=' + (activeText || '(空)'));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 深链 /enterprise-center/attraction；前置=栈内成功态→最近分析(entry=history 深链兜底)恢复已完成条件筛选(优先共分析>20)→否则高新+人工智能（或新一代信息技术）发起。机检=结果表首行勾选→下一页；表头七列与翻页前一致；已选家数保持≥1（RecruitResultPanel 跨页选择）。默认 pageSize=20，共分析≤20 或下一页禁用→ENV-ATTRACT-RESULT-PAGE2-001。D4·30888 仅两 Tab 无最近分析且异步卡 processing→ENV-ATTRACT-ASYNC-NO-SUCCESS-001（2026-10-20 机跑 rewrite-FUNC-01448 同 01446/047）。登录与关评审由 runner 前置。B 档零 allow_skip。
