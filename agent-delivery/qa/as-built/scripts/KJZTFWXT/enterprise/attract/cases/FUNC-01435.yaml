id: FUNC-01435
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01435
priority: P0
tier: B
title: 主流程-最近分析列
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history
  - action: evaluate
    note: 打开「最近分析」
    assert: |-
      const tab = page.getByRole('tab', { name: '最近分析' });
      if ((await tab.getAttribute('aria-selected')) !== 'true') {
        await tab.click();
        await expect(tab).toHaveAttribute('aria-selected', 'true', { timeout: 15000 });
      }
      await expect(page.getByTestId('recruit-tab-stack')).toBeVisible({ timeout: 15000 });
expect:
  - note: 列名为任务名称、条件摘要、企业摘要、创建时间、状态、操作
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      const headers = ['任务名称', '条件摘要', '企业摘要', '创建时间', '状态', '操作'];
      for (const name of headers) {
        await expect(stack.locator('th').filter({ hasText: name }).first()).toBeVisible({ timeout: 15000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
