id: FUNC-01454
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01454
priority: P1
tier: B
title: 备选-按此配置候选
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01409造已完成候选工作台记录
    script: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candTab =
        page.locator('.global-workbench-tabs [data-tab-key="candidates"]').first().or(
          page.getByRole('tab', { name: '候选工作台' }).first(),
        );
      await expect(candTab).toBeVisible({ timeout: 15000 });
      await candTab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const rowCheck = main.locator('.arco-table-body .arco-checkbox').first();
      await expect(rowCheck).toBeVisible({ timeout: 15000 });
      await rowCheck.click({ timeout: 8000 });
      const reviewBtn = main.getByRole('button', { name: '执行指定对象复核' });
      await expect(reviewBtn).toBeEnabled({ timeout: 10000 });
      await reviewBtn.click({ timeout: 8000 });
      const startBtn = main.getByRole('button', { name: '开始分析' });
      await expect(startBtn).toBeVisible({ timeout: 15000 });
      await startBtn.click({ timeout: 8000 });
      for (let i = 0; i < 90; i++) {
        const t = await stack().innerText().catch(() => '');
        if (/人工线索复核结果/.test(t)) break;
        const viewBtn = stack().getByRole('button', { name: '查看结果' });
        if (await viewBtn.isVisible().catch(() => false)) {
          await viewBtn.click({ timeout: 5000 }).catch(() => {});
        }
        await page.waitForTimeout(1000);
      }
      await expect(stack().getByText(/人工线索复核结果/).first()).toBeVisible({ timeout: 5000 });
  - action: click
    target: 最近分析
  - action: evaluate
    note: 等待最近分析表并点已完成候选工作台行的按此配置新建
    script: |-
      const stack = page.getByTestId('recruit-tab-stack');
      for (let i = 0; i < 30; i++) {
        const t = await stack.innerText().catch(() => '');
        if (/任务名称/.test(t) && /按此配置新建/.test(t)) break;
        await page.waitForTimeout(500);
      }
      const buttons = stack.getByRole('button', { name: '按此配置新建' });
      await expect(buttons.first()).toBeVisible({ timeout: 15000 });
      const n = await buttons.count();
      let target = null;
      const rowMatchesCandidate = (txt) =>
        txt && /已完成/.test(txt) && /候选工作台/.test(txt) && !/条件筛选推荐/.test(txt);
      for (let i = 0; i < n; i++) {
        const btn = buttons.nth(i);
        let row = btn.locator('xpath=ancestor::tr[1]');
        if ((await row.count()) < 1) {
          row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
        }
        const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
        if (rowMatchesCandidate(txt)) {
          target = btn;
          break;
        }
      }
      if (!target) {
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && !/条件筛选/.test(txt) && /指定对象|人工线索|候选复核/.test(txt)) {
            target = btn;
            break;
          }
        }
      }
      if (!target) throw new Error('最近分析无已完成「候选工作台」任务可「按此配置新建」');
      await target.scrollIntoViewIfNeeded();
      await target.click({ timeout: 15000 });
      for (let i = 0; i < 24; i++) {
        const candTab = page.getByRole('tab', { name: '候选工作台' });
        if ((await candTab.getAttribute('aria-selected').catch(() => '')) === 'true') break;
        const t = await stack.innerText().catch(() => '');
        if (/人工线索候选工作台/.test(t)) break;
        await page.waitForTimeout(500);
      }
expect:
  - note: 1、进入「候选工作台」
    assert: |-
      await expect(page.getByRole('tab', { name: '候选工作台' })).toHaveAttribute('aria-selected', 'true', {
        timeout: 15000,
      });
      await expect(
        page.getByTestId('recruit-tab-stack').getByText(/人工线索候选工作台/).first(),
      ).toBeVisible({ timeout: 10000 });
  - note: 2、不自动开始分析
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      await expect(main.getByText('可视化分析过程')).toHaveCount(0);
      await expect(main.getByText('人工线索复核结果')).toHaveCount(0);
      await expect(main.getByRole('button', { name: '执行指定对象复核' })).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
