id: FUNC-01467
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01467
priority: P1
tier: B
title: 过程态点稍后查看后任务仍在最近分析
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: evaluate
    note: 侧栏进招引→成功结果→重新分析→稍后查看→再进最近分析
expect:
  - note: 1、再次进入后不再显示「可视化分析过程」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const attractRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction';
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const enterAttractViaSidebar = async () => {
        await page.goto(toUrl('/enterprise/enterprise-search'), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        const item = page.locator('.arco-menu').getByText('招引企业推荐分析', { exact: true }).first();
        await item.click({ timeout: 15000 });
        await page.waitForURL(/\/enterprise\/attraction/, { timeout: 20000 });
        await page.waitForTimeout(1000);
      };
      const openHistoryTab = async () => {
        const tabKey = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if (await tabKey.count()) await tabKey.click({ timeout: 12000, force: true });
        else await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 12000, force: true });
        await page.waitForTimeout(900);
      };
      const waitHistoryShell = async () => {
        for (let i = 0; i < 30; i++) {
          const t = await stack().innerText().catch(() => '');
          if (/招引推荐 · 最近分析|任务名称/.test(t)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染');
      };
      const parseCounts = (text) => {
        const m = text.match(/共分析\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : 0;
      };
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        const url = page.url();
        return (
          parseCounts(t) >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 40; i++) {
          if (await isSuccessResult()) return;
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          const t = await stack().innerText().catch(() => '');
          if (/请设置条件并执行推荐分析/.test(t)) return;
          await page.waitForTimeout(500);
        }
      };
      const tryRestoreCompletedFilter = async () => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000, force: true }).catch(() => {});
        await openHistoryTab();
        await waitHistoryShell();
        const restores = stack().getByRole('button', { name: '恢复结果' });
        const cnt = await restores.count();
        for (let i = 0; i < cnt; i++) {
          const btn = restores.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (/已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 24; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const runFilterAnalysis01408 = async () => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 12000, force: true });
        await waitFilterReady();
        const openSelect = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const inp = page.locator(`input[placeholder="${ph}"]`).first();
          await inp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 12000, force: true });
          await page.waitForTimeout(500);
        };
        const pick = async (text) => {
          await page.locator(optSel).filter({ hasText: text }).first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        };
        await openSelect('全部企业标签');
        await pick('专精特新');
        await openSelect('全部行业领域');
        await pick('人工智能');
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        for (let i = 0; i < 56; i++) {
          await page.waitForTimeout(2500);
          if (await isSuccessResult()) return;
          const t = await stack().innerText().catch(() => '');
          if (/推荐分析失败/.test(t) && !/可视化分析过程/.test(t)) {
            throw new Error('推荐分析失败: ' + t.slice(0, 200));
          }
        }
        throw new Error('修订 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达条件筛选成功结果');
      };
      const reachSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await runFilterAnalysis01408();
      };
      await enterAttractViaSidebar();
      await reachSuccess();
      const reBtn = stack().getByRole('button', { name: '重新分析', exact: true }).first();
      await expect(reBtn).toBeVisible({ timeout: 8000 });
      await expect(reBtn).toBeEnabled({ timeout: 8000 });
      await reBtn.click({ timeout: 10000 });
      await page.waitForTimeout(500);
      const modalOk = page.locator('.arco-modal:visible').last().getByRole('button', { name: '确定' });
      if (await modalOk.count()) await modalOk.first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      let laterBtn = null;
      for (let i = 0; i < 90; i++) {
        const later = page.getByRole('button', { name: '稍后查看', exact: true });
        if ((await later.count()) && (await later.first().isVisible().catch(() => false))) {
          laterBtn = later.first();
          break;
        }
        const t = await stack().innerText().catch(() => '');
        if (/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t) && !page.url().includes('analysis_view=processing')) {
          throw new Error('重新分析瞬时完成未见过程窗与稍后查看');
        }
        await page.waitForTimeout(1000);
      }
      if (!laterBtn) throw new Error('90s 内未见「稍后查看」');
      await expect(stack().getByText('可视化分析过程').first()).toBeVisible({ timeout: 8000 });
      await laterBtn.click({ timeout: 12000 });
      await page.waitForTimeout(1500);
      await enterAttractViaSidebar();
      await openHistoryTab();
      await waitHistoryShell();
      const after = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(after)) throw new Error('再次进入后仍显示可视化分析过程');
      if (page.url().includes('analysis_view=processing')) throw new Error('URL 仍为 processing');
  - note: 2、最近分析中该任务状态为「处理中」
    assert: |-
      await expect(page.getByTestId('recruit-tab-stack')).toContainText('处理中', { timeout: 10000 });
  - note: 3、该行操作含「继续查看」
    assert: |-
      const cont = page.getByRole('button', { name: '继续查看', exact: true });
      await expect(cont.first()).toBeVisible({ timeout: 10000 });
      let row = cont.first().locator('xpath=ancestor::tr[1]');
      if ((await row.count()) < 1) row = cont.first().locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
      if (await row.count()) {
        await expect(row.first()).toContainText('处理中');
      }
on_fail: 截图 + 抄 X-Trace-Id
