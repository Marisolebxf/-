id: FUNC-01467
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01467
priority: P1
title: 过程态稍后查看后任务仍在最近分析
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；已打开一条条件筛选的成功结果（assert 自含恢复/发起成功结果→重新分析→过程态点稍后查看→再进最近分析）
locators:
  reanalyze: button「重新分析」
  view_later: button「稍后查看」
  process_title: 可视化分析过程
  recent_tab: Tab「最近分析」
  continue_view: button「继续查看」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=history
  - action: wait
    for: 招引页 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 成功结果→重新分析→过程态点稍后查看→再进菜单打开最近分析；终态断言在 expect
expect:
  - note: 1、再次进入后不再显示「可视化分析过程」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const attractRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction';
      const historyRoute = attractRoute + '&entry=history';
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const REC_RE = /(REC-\d{8}-\d{3,}|DEMO-REC-\d{8}-\d{3,})/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const isSuccessResult = async () => {
        const st = stack();
        const t = await st.innerText().catch(() => '');
        const url = page.url();
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        const histBody = await stack().innerText().catch(() => '');
        if (!/招引推荐 · 最近分析/.test(histBody)) {
          await openHistoryTab().catch(() => {});
        }
        try {
          await waitHistoryShell();
        } catch {
          return false;
        }
        const scrollHistoryActions = async () => {
          const bodies = stack().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
          const bn = await bodies.count();
          for (let i = 0; i < bn; i++) {
            await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
          }
          await page.waitForTimeout(400);
        };
        await scrollHistoryActions();
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 20; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const isFilterConfig = (t) =>
        /招引推荐条件/.test(t) &&
        !/可视化分析过程/.test(t) &&
        !/招引推荐分析结果/.test(t) &&
        !/共分析\s*\d+\s*家/.test(t);
      const waitSuccessResult = async (rounds = 48) => {
        const st = stack();
        let last = '';
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          const url = page.url();
          if ((/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last)?.analyzed >= 1) return;
          }
          if (
            !isFilterConfig(last) &&
            /推荐分析失败|候选分析失败/.test(last) &&
            !/可视化分析过程/.test(last)
          ) {
            throw new Error('推荐分析进入失败态: ' + last.slice(0, 240));
          }
        }
        const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
        if (stuck) {
          throw new Error('环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达成功结果以测「稍后查看」');
        }
        if (isFilterConfig(last)) {
          throw new Error('环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达条件筛选成功结果（30888 与 01423/01455 同源 D4）');
        }
        throw new Error('未在超时内到达条件筛选成功结果: ' + last.slice(0, 200));
      };
      const reachFilterSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await page.goto(toUrl(attractRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 12000, force: true }).catch(() => {});
        await waitFilterReady();
        await page.waitForTimeout(600);
        const openPh = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const i = page.locator(`input[placeholder="${ph}"]`).first();
          await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 12000, force: true });
          await page.waitForTimeout(500);
        };
        const pickOption = async (text) => {
          const opt = page.locator(optSel).filter({ hasText: text }).first();
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        await openPh('全部企业标签');
        await pickOption('高新技术企业');
        await openPh('全部行业领域');
        const ai = page.locator(optSel).filter({ hasText: '人工智能' });
        if (await ai.count()) await ai.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        for (let w = 0; w < 24; w++) {
          await page.waitForTimeout(500);
          const t = await stack().innerText().catch(() => '');
          if (/可视化分析过程/.test(t) || /招引推荐分析结果/.test(t) || page.url().includes('analysis_view=')) break;
          if (!isFilterConfig(t) && /推荐分析失败|候选分析失败/.test(t)) {
            throw new Error('推荐分析进入失败态: ' + t.slice(0, 240));
          }
        }
        await waitSuccessResult();
      };
      const pickReanalyze = async () => {
        const st = stack();
        const inStack = st.getByRole('button', { name: '重新分析', exact: true });
        if (await inStack.count() && await inStack.first().isVisible().catch(() => false)) return inStack.first();
        const pageBtn = page.getByRole('button', { name: '重新分析', exact: true });
        if (await pageBtn.count() && await pageBtn.first().isVisible().catch(() => false)) return pageBtn.first();
        return null;
      };
      const confirmRerunModalIfVisible = async () => {
        for (let i = 0; i < 8; i++) {
          const modal = page.locator('.arco-modal:visible').last();
          const wrap = page.locator('.arco-modal-wrapper:visible .arco-modal').last();
          const box = (await modal.count()) ? modal : wrap;
          if ((await box.count()) && (await box.isVisible().catch(() => false))) {
            const ok = box.getByRole('button', { name: '确定' });
            if (await ok.count()) {
              await ok.first().click({ timeout: 8000 });
              await page.waitForTimeout(600);
              return;
            }
          }
          await page.waitForTimeout(400);
        }
      };
      const readTaskHint = async () => {
        const u = page.url();
        const fromUrl = (u.match(/task_id=([^&]+)/) || [])[1];
        if (fromUrl) return decodeURIComponent(fromUrl);
        const body = await stack().innerText().catch(() => '');
        const m = body.match(REC_RE);
        return m ? m[1] : null;
      };
      const waitLaterBtn = async (ms) => {
        const t0 = Date.now();
        while (Date.now() - t0 < ms) {
          const later = page.getByRole('button', { name: '稍后查看', exact: true });
          if ((await later.count()) && (await later.first().isVisible().catch(() => false)) && (await later.first().isEnabled().catch(() => false))) {
            return later.first();
          }
          const stTxt = await stack().innerText().catch(() => '');
          const url = page.url();
          if (/招引推荐分析结果/.test(stTxt) && !/可视化分析过程/.test(stTxt) && !url.includes('analysis_view=processing')) {
            return null;
          }
          await page.waitForTimeout(400);
        }
        return null;
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 36; i++) {
          if (await isSuccessResult()) return;
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          const t = await stack().innerText().catch(() => '');
          if (/请设置条件并执行推荐分析/.test(t)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const openHistoryTab = async () => {
        await waitFilterReady().catch(() => {});
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if (await tab.count()) {
          await tab.click({ timeout: 12000, force: true }).catch(async () => {
            await page.locator('[role=tab][data-tab-key="history"]').first().click({ timeout: 12000, force: true });
          });
          await page.waitForTimeout(900);
          return;
        }
        const byName = page.getByRole('tab', { name: '最近分析' });
        if (await byName.count()) {
          await byName.first().click({ timeout: 12000, force: true });
          await page.waitForTimeout(900);
          return;
        }
        await page.goto(toUrl(historyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/招引推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /处理中/.test(t))) return;
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染，url=' + page.url());
      };
      const openRecentViaMenu = async () => {
        await page.goto(toUrl(attractRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await openHistoryTab();
        await waitHistoryShell();
      };
      await dismissBasket();
      await reachFilterSuccess();
      const reBtn = await pickReanalyze();
      if (!reBtn) {
        throw new Error('结果区无「重新分析」（ticket=ENV-ATTRACT-REANALYZE-001）');
      }
      await expect(reBtn).toBeEnabled({ timeout: 8000 });
      await reBtn.click({ timeout: 10000 });
      await page.waitForTimeout(500);
      await confirmRerunModalIfVisible();
      const laterBtn = await waitLaterBtn(90000);
      if (!laterBtn) {
        const url = page.url();
        const t = await stack().innerText().catch(() => '');
        if (/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) {
          throw new Error('ENV-ATTRACT-PROCESS-WINDOW-001: 重新分析瞬时完成未见过程窗与「稍后查看」（URL=' + url + '）');
        }
        throw new Error('ENV-ATTRACT-PROCESS-WINDOW-001: 90s 内未见可点「稍后查看」（URL=' + url + '）');
      }
      await expect(stack().getByText('可视化分析过程').first()).toBeVisible({ timeout: 8000 });
      const taskHint = await readTaskHint();
      try {
        await laterBtn.click({ timeout: 12000 });
      } catch {
        await laterBtn.click({ timeout: 12000, force: true });
      }
      await page.waitForTimeout(1500);
      const tLeave = Date.now();
      while (Date.now() - tLeave < 12000) {
        const stTxt = await stack().innerText().catch(() => '');
        const url = page.url();
        if (!/可视化分析过程/.test(stTxt) && !url.includes('analysis_view=processing')) break;
        await page.waitForTimeout(400);
      }
      await openRecentViaMenu();
      const stAfter = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(stAfter)) {
        throw new Error('再次进入后仍显示「可视化分析过程」');
      }
      if (page.url().includes('analysis_view=processing')) {
        throw new Error('再次进入后 URL 仍为 processing: ' + page.url());
      }
      globalThis.__func01467 = { taskHint };
  - note: 2、最近分析中该任务状态为「处理中」
    assert: |-
      if (!globalThis.__func01467) throw new Error('前置：未完成稍后查看与再进最近分析');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const body = await stack().innerText().catch(() => '');
      if (!/招引推荐 · 最近分析|最近分析/.test(body)) {
        throw new Error('未在最近分析列表态: ' + body.slice(0, 160));
      }
      if (!/处理中/.test(body)) {
        throw new Error('最近分析列表未见「处理中」状态: ' + body.slice(0, 240));
      }
      const hint = globalThis.__func01467.taskHint;
      if (hint && !body.includes(hint)) {
        const top = body.match(/(REC-\d{8}-\d{3,}|DEMO-REC-\d{8}-\d{3,})/);
        if (!top) throw new Error('列表未见任务标识，期望含 ' + hint);
        globalThis.__func01467.taskHint = top[1];
      }
  - note: 3、该行操作含「继续查看」
    assert: |-
      if (!globalThis.__func01467) throw new Error('前置未完成');
      const cont = page.getByRole('button', { name: '继续查看', exact: true });
      await expect(cont.first()).toBeVisible({ timeout: 10000 });
      let row = cont.first().locator('xpath=ancestor::tr[1]');
      if ((await row.count()) < 1) row = cont.first().locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
      const rowText = (await row.count()) ? await row.first().innerText().catch(() => '') : '';
      if (rowText && !/处理中/.test(rowText)) {
        throw new Error('「继续查看」所在行状态非处理中: ' + rowText.slice(0, 200));
      }
      const hint = globalThis.__func01467.taskHint;
      if (hint && rowText && !rowText.includes(hint)) {
        const mainTxt = await page.getByTestId('recruit-tab-stack').innerText().catch(() => '');
        if (!mainTxt.includes(hint)) {
          throw new Error('处理中行与任务标识未对齐，hint=' + hint);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu svcz 路由 catalog /enterprise/attraction&entry=history（非 enterprise-center）；步骤=最近分析恢复已完成条件筛选→重新分析+确定→过程态点「稍后查看」→再进菜单开「最近分析」。预期①无过程面板②处理中③继续查看。D4·2026-10-20 机跑 rewrite-FUNC-01467 svcz 120s 无成功结果/无可恢复已完成行→交卷 blocked·ENV-ATTRACT-ASYNC-NO-SUCCESS-001（同 01423/01455）。D3·无重新分析→ENV-ATTRACT-REANALYZE-001；无过程窗→ENV-ATTRACT-PROCESS-WINDOW-001；无最近分析 Tab→ENV-ATTRACT-NO-HISTORY-TAB-001。登录与关评审由 runner 前置。B 档零 allow_skip。
