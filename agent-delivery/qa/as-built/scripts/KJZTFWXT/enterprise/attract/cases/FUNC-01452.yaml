id: FUNC-01452
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01452
priority: P1
tier: B
title: 备选-结果侧栏
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: wait
    for: 条件区 SPA 渲染
    timeout_ms: 2500
expect:
  - note: 1、侧栏出现首行企业名
    assert: |-
      const main = page.locator('main[data-testid="recruit-tab-stack"]');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const m = text.match(/共分析\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : 0;
      };
      const isSuccessResult = async () => {
        const t = await main.innerText().catch(() => '');
        return /招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t) && parseCounts(t) >= 1;
      };
      const openRecentTab = async () => {
        const tab = page.getByRole('tab', { name: '最近分析' });
        if ((await tab.count()) < 1) return false;
        await tab.first().click({ timeout: 8000 });
        await page.waitForTimeout(900);
        return true;
      };
      const tryRestoreCompleted = async () => {
        if (!(await openRecentTab())) return false;
        const buttons = main.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!(txt && /已完成/.test(txt) && /条件筛选/.test(txt))) continue;
          await btn.click({ timeout: 15000 });
          for (let j = 0; j < 20; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult()) return true;
          }
          await openRecentTab();
        }
        return false;
      };
      const openSelectByPh = async (ph) => {
        await page.keyboard.press('Escape').catch(() => {});
        const inp = main.locator(`input[placeholder="${ph}"]`).first();
        await inp.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const pickOpt = async (text) => {
        const opt = page.locator(optSel).filter({ hasText: text }).first();
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const waitResultAfterAction = async (rounds = 48) => {
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(2500);
          const viewBtn = main.getByRole('button', { name: '查看结果' });
          if (await viewBtn.isVisible().catch(() => false)) {
            await viewBtn.click({ timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(1200);
          }
          const t = await main.innerText().catch(() => '');
          if (/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t) && parseCounts(t) >= 1) return 'ok';
          if (/推荐分析失败|筛选条件未命中/.test(t) && !/可视化分析过程/.test(t)) return 'fail';
        }
        const t = await main.innerText().catch(() => '');
        if (/可视化分析过程/.test(t)) return 'processing';
        return 'timeout';
      };
      const tryContinueProcessing = async () => {
        if (!(await openRecentTab())) return false;
        const buttons = main.getByRole('button', { name: '继续查看' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!(txt && /条件筛选/.test(txt))) continue;
          await btn.click({ timeout: 15000 });
          const st = await waitResultAfterAction(48);
          return st === 'ok';
        }
        return false;
      };
      const runFilterPair = async (tag, field) => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await openSelectByPh('全部企业标签');
        await pickOpt(tag);
        await openSelectByPh('全部行业领域');
        await pickOpt(field);
        const start = main.getByRole('button', { name: '开始分析' });
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        let st = await waitResultAfterAction(48);
        if (st === 'ok') return true;
        if (st === 'fail') return false;
        if (st === 'processing' && (await tryContinueProcessing())) return true;
        if (st === 'processing') throw new Error('修订 已发起仍为空结果壳');
        return false;
      };
      const reachSuccess = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部企业标签"]').first();
          if (await tag.isVisible().catch(() => false)) break;
          await page.waitForTimeout(500);
        }
        if (await isSuccessResult()) return;
        if (await tryRestoreCompleted()) return;
        const pairs = [
          ['专精特新', '人工智能'],
          ['高新技术企业', '人工智能'],
          ['专精特新', '集成电路'],
          ['重点企业', '新能源'],
        ];
        for (const [tag, field] of pairs) {
          if (await runFilterPair(tag, field)) return;
        }
        throw new Error('修订 无法到达条件筛选成功结果页');
      };
      const readRowEnterpriseName = async (row) => {
        const link = row.getByRole('link').first();
        if (await link.count()) {
          const raw = ((await link.innerText({ timeout: 8000 }).catch(() => '')) || '').trim();
          if (raw.length >= 2) return raw;
        }
        const txt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        const parts = txt.split(/\s+/).filter((p) => p.length >= 2 && !/^\d+(\.\d+)?$/.test(p));
        const hit = parts.find((p) => /公司|集团|有限|科技/.test(p));
        if (hit) return hit;
        throw new Error('结果行无企业名称: ' + txt.slice(0, 120));
      };
      await dismissBasket();
      await reachSuccess();
      await expect(main.getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      const row = main.locator('.arco-table-body .arco-table-tr').first();
      await expect(row).toBeVisible({ timeout: 10000 });
      const entName = await readRowEnterpriseName(row);
      const nameHeading = main.locator('h3').filter({ hasText: entName }).first();
      await expect(nameHeading).toBeVisible({ timeout: 10000 });
      globalThis.__func01452 = {
        entName,
        panel: nameHeading.locator('xpath=ancestor::div[contains(@class,"overflow-auto")][1]'),
      };
  - note: 2、可见三类综合维度、高潜挖掘依据、目标特征、核心优势、合作价值、企业风险与信用
    assert: |-
      const ctx = globalThis.__func01452;
      if (!ctx?.entName) throw new Error('修订 侧栏企业名未就绪');
      const panel = ctx.panel;
      await expect(panel).toBeVisible({ timeout: 8000 });
      for (const s of ['三类综合维度', '高潜挖掘依据', '目标特征', '核心优势', '合作价值', '企业风险与信用']) {
        await expect(panel.getByText(s, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
      const body = await panel.innerText();
      if (!body.includes(ctx.entName)) throw new Error('侧栏正文与首行企业不一致');
on_fail: 截图 + 抄 X-Trace-Id
