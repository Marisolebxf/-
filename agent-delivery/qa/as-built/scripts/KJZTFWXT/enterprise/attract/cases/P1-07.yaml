id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01001
priority: P1
title: 查看历史分析结果不覆盖条件筛选推荐 Tab 当前条件与状态
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
- 当前已设置一组条件甲；最近分析存在历史任务
locators:
  recent_tab: 最近分析
  restore: 恢复结果 / 继续查看
steps:
- action: evaluate
  note: 设条件甲→最近分析点开历史→回条件 Tab
expect:
- note: 历史任务的条件与结果版本随任务保留
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const ph = page.locator('input[placeholder="全部企业标签"]').first(); await ph.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option, .arco-trigger-popup:visible li').filter({ hasText: '瞪羚企业' }).first().click(); await page.waitForTimeout(500); await page.getByRole('tab', { name: '最近分析' }).click(); await page.waitForTimeout(900); const stack = page.getByTestId('recruit-tab-stack'); await expect(stack.getByText(/REC-/).first()).toBeVisible({ timeout: 8000 }); const restore = stack.getByRole('button', { name: /恢复结果|继续查看/ }).first(); if (await restore.count()) { await restore.click(); await page.waitForTimeout(1200) }
- note: 返回后当前条件仍为条件甲未被覆盖
  assert: |-
    await page.getByRole('tab', { name: '条件筛选推荐' }).click(); await page.waitForTimeout(900); const stack = page.getByTestId('recruit-tab-stack'); const t = await stack.innerText(); if (!/瞪羚企业/.test(t)) throw new Error('条件甲未保留: ' + t.slice(0, 200))
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
