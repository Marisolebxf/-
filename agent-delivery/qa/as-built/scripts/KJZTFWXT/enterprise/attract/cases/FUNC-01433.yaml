id: FUNC-01433
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01433
priority: P0
title: 主流程-查询加入候选
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录，可从企业分析进入招引企业推荐分析
locators:
  search_route: /development/search（30888 企业查询）
  yinyu_btn: 结果卡 button「引育候选」
  add_attract: menuitem「加入招引候选」
  cand_tab: tab「候选工作台」
  source_column: 候选表列「线索来源」
steps:
  - action: goto
    target: /
  - action: goto
    target: /development/search
  - action: evaluate
    note: 企业查询引育候选→加入招引候选（assert 自含）
expect:
  - note: 1、该企业出现在人工线索候选工作台 2、线索来源为「企业查询」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const origin = new URL(page.url()).origin;
      const candRoute = '/enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const openCandidateTab = async () => {
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) === 'true') return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const candidateMain = () => {
        const stackEl = stack();
        return page.locator('.diagnosis-main').filter({ has: stackEl }).first().or(stackEl);
      };
      const sourceInRow = async (companyName) => {
        const root = candidateMain();
        const tbl = root.locator('.arco-table').first();
        if (!(await tbl.count())) return null;
        const ths = await tbl.locator('.arco-table-th').allInnerTexts();
        const colIdx = ths.findIndex((h) => /线索来源/.test(h));
        if (colIdx < 0) throw new Error('候选表未见「线索来源」列头');
        const rows = tbl.locator('.arco-table-body .arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const txt = (await row.innerText()).replace(/\s+/g, ' ');
          if (!txt.includes(companyName)) continue;
          const cell = row.locator('.arco-table-td').nth(colIdx);
          return (await cell.innerText()).replace(/\s+/g, ' ').trim();
        }
        return null;
      };
      await dismissBasket();
      const main = page.locator('main');
      const input = page.getByRole('textbox', { name: /输入企业名/ }).first();
      await input.fill('人工智能');
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/).first()).toBeVisible({ timeout: 20000 });
      const yinyuBtns = main.getByRole('button', { name: /引育候选/ });
      const btnN = await yinyuBtns.count();
      if (btnN < 1) throw new Error('企业查询结果无「引育候选」按钮');
      let entName = '';
      let added = false;
      for (let i = 0; i < Math.min(btnN, 8); i++) {
        const yq = yinyuBtns.nth(i);
        const card = yq.locator('xpath=ancestor::div[contains(@class,"rounded")][1]');
        const pickLbl = card.locator('[aria-label^="选择"]').first();
        if (!(await pickLbl.count())) continue;
        const aria = (await pickLbl.getAttribute('aria-label')) || '';
        const candidateName = aria.replace(/^选择/, '').replace(/\s+/g, ' ').trim();
        if (!candidateName || candidateName.length < 2) continue;
        await yq.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const addItem = page.getByRole('menuitem', { name: '加入招引候选', exact: true });
        const already = page.getByRole('menuitem', { name: '已在招引候选', exact: true });
        if (await already.count() && await already.first().isVisible().catch(() => false)) {
          await page.keyboard.press('Escape').catch(() => {});
          continue;
        }
        if (!(await addItem.count())) {
          const addTxt = page.locator('.arco-dropdown-popup:visible, .arco-trigger-popup:visible').getByText('加入招引候选', { exact: true }).first();
          if (!(await addTxt.count())) {
            await page.keyboard.press('Escape').catch(() => {});
            continue;
          }
          await addTxt.click({ timeout: 8000 });
        } else {
          await addItem.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(1200);
        entName = candidateName;
        added = true;
        break;
      }
      if (!added || !entName) {
        throw new Error('未能从企业查询结果执行「加入招引候选」（可能均已加入或菜单不可点）');
      }
      await page.goto(origin + candRoute, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(2500);
      await openCandidateTab();
      await page.waitForTimeout(800);
      const workbench = page.getByText('人工线索候选工作台', { exact: false }).first();
      if (!(await workbench.isVisible().catch(() => false))) {
        const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
        throw new Error('环境闸门 ENV-ATTRACT-CANDIDATE-EMPTY：未进入人工线索候选工作台: ' + txt.slice(0, 160));
      }
      const source = await sourceInRow(entName);
      if (!source) {
        const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
        throw new Error('环境闸门 ENV-ATTRACT-CANDIDATE-EMPTY：加入后候选工作台未见企业「' + entName + '」: ' + txt.slice(0, 160));
      }
      if (source !== '企业查询') {
        throw new Error('线索来源应为「企业查询」，现场行来源=' + source + '；企业=' + entName);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 企业查询 /development/search；结果卡「引育候选」下拉 menuitem「加入招引候选」（非结果区独立按钮，对齐 FUNC-01487）。候选深链 /enterprise-center/attraction&entry=candidates；CandidatePanel 列「线索来源」企业查询路径缺省 resolveSource。D4·加入后名单仍无该企业→ ENV-ATTRACT-CANDIDATE-EMPTY（同 01409/028）。登录与关评审由 runner 前置。B 档零 allow_skip。
