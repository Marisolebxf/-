id: FUNC-01433
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01433
priority: P1
tier: B
title: 主流程-查询加入候选
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/enterprise-search
  - action: evaluate
    note: 1、在企业查询结果点击「加入招引候选」
    assert: |-
      const main = page.locator('main');
      const input = page.getByRole('textbox', { name: /输入企业名|企业名称/ }).first();
      await input.fill('科技');
      await page.getByRole('button', { name: '搜索', exact: true }).click();
      await expect(page.getByText(/命中\s*[1-9]\d*\s*家企业/).first()).toBeVisible({ timeout: 25000 });
      let entName = '';
      const addDirect = main.getByRole('button', { name: '加入招引候选', exact: true });
      if (await addDirect.count()) {
        const card = addDirect.first().locator('xpath=ancestor::div[contains(@class,"rounded")][1]');
        const pickLbl = card.locator('[aria-label^="选择"]').first();
        const aria = (await pickLbl.getAttribute('aria-label').catch(() => '')) || '';
        entName = aria.replace(/^选择/, '').trim();
        if (!entName) {
          entName = ((await card.innerText()).split('\n').find((l) => l.trim().length > 3) || '').trim();
        }
        await addDirect.first().click({ timeout: 10000 });
      } else {
        const yinyu = main.getByRole('button', { name: /引育候选/ });
        await expect(yinyu.first()).toBeVisible({ timeout: 10000 });
        const n = await yinyu.count();
        for (let i = 0; i < Math.min(n, 10); i++) {
          const btn = yinyu.nth(i);
          const card = btn.locator('xpath=ancestor::div[contains(@class,"rounded")][1]');
          const pickLbl = card.locator('[aria-label^="选择"]').first();
          const aria = (await pickLbl.getAttribute('aria-label').catch(() => '')) || '';
          const candidateName = aria.replace(/^选择/, '').trim();
          if (!candidateName) continue;
          await btn.click({ timeout: 8000 });
          await page.waitForTimeout(400);
          const already = page.getByRole('menuitem', { name: '已在招引候选', exact: true });
          if (await already.isVisible().catch(() => false)) {
            await page.keyboard.press('Escape').catch(() => {});
            continue;
          }
          const addItem = page.getByRole('menuitem', { name: '加入招引候选', exact: true });
          await expect(addItem.first()).toBeVisible({ timeout: 5000 });
          await addItem.first().click({ timeout: 8000 });
          entName = candidateName;
          break;
        }
      }
      if (!entName) throw new Error('未能从企业查询结果加入招引候选或未解析企业名');
      await page.waitForTimeout(1500);
      await page.evaluate((name) => {
        localStorage.setItem('__func01433EntName', name);
      }, entName);
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 2、打开招引企业推荐分析的「候选工作台」
    assert: |-
      const tab = page.getByRole('tab', { name: '候选工作台' }).first();
      await expect(tab).toBeVisible({ timeout: 15000 });
      if ((await tab.getAttribute('aria-selected')) !== 'true') {
        await tab.click({ timeout: 10000 });
        await page.waitForTimeout(800);
      }
      await expect(tab).toHaveAttribute('aria-selected', 'true', { timeout: 10000 });
      await expect(page.getByText('人工线索候选工作台').first()).toBeVisible({ timeout: 15000 });
expect:
  - note: 1、该企业出现在人工线索候选工作台
    assert: |-
      const entName = await page.evaluate(() => localStorage.getItem('__func01433EntName') || '');
      if (!entName) throw new Error('缺少已加入的企业名');
      const stack = page.locator('main[data-testid="recruit-tab-stack"], main .diagnosis-main, main').first();
      await expect(stack.getByText(entName, { exact: false }).first()).toBeVisible({ timeout: 15000 });
  - note: 2、线索来源为「企业查询」
    assert: |-
      const entName = await page.evaluate(() => localStorage.getItem('__func01433EntName') || '');
      const main = page.locator('main');
      const tbl = main.locator('.arco-table').first();
      await expect(tbl).toBeVisible({ timeout: 10000 });
      const ths = await tbl.locator('.arco-table-th').allInnerTexts();
      const colIdx = ths.findIndex((h) => /线索来源/.test(h));
      if (colIdx < 0) throw new Error('候选表未见「线索来源」列');
      const rows = tbl.locator('.arco-table-body .arco-table-tr');
      const n = await rows.count();
      let source = '';
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        const txt = await row.innerText();
        if (!txt.includes(entName)) continue;
        source = (await row.locator('.arco-table-td').nth(colIdx).innerText()).replace(/\s+/g, ' ').trim();
        break;
      }
      if (!source) throw new Error('候选工作台未见企业「' + entName + '」');
      await expect(source).toBe('企业查询');
on_fail: 截图 + 抄 X-Trace-Id
