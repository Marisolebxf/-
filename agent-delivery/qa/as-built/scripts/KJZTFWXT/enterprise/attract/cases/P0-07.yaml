id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00981
priority: P0
title: 条件区呈现 8 个产业链项且集合与生产环境一致
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
preconditions:
- 已进入页面且停留条件筛选推荐 Tab
locators:
  field_select: 行业领域下拉（placeholder 全部行业领域）
steps:
- action: goto
  target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction
- action: click
  target: 行业领域下拉
- action: evaluate
  note: 核对 8 项清单
expect:
- note: 快捷标签含集成电路、生物医药、人工智能、新能源、低空经济、量子信息、海洋经济、智能机器人 8 项
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const cb = page.locator('[aria-label="关闭对比篮"]'); if (await cb.count() && await cb.first().isVisible()) { await cb.first().click(); await page.waitForTimeout(400) }; const ph = page.locator('input[placeholder="全部行业领域"]').first(); await ph.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 }); await page.waitForTimeout(600); const pop = page.locator('.arco-trigger-popup:visible').last(); const txt = await pop.innerText(); for (const n of ['集成电路','生物医药','人工智能','新能源','低空经济','量子信息','海洋经济','智能机器人']) { if (!txt.includes(n)) throw new Error('缺产业链项: ' + n) }; await page.keyboard.press('Escape')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 8 项落在「行业领域」下拉选项，页内无独立快捷 chip（与用例「快捷标签」措辞偏差，以实勘为准）。
tier: B
