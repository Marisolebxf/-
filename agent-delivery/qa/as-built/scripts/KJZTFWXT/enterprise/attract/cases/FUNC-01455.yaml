id: FUNC-01455
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01455
priority: P1
tier: B
title: 可视化过程态点击取消任务回到待发起空态
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: wait
    for: 条件区 SPA 渲染
    timeout_ms: 3000
expect:
  - note: 1、过程面板退出
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        const url = page.url();
        const analyzed = t.match(/共分析\s*(\d+)\s*家/);
        return (
          analyzed &&
          parseInt(analyzed[1], 10) >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        const tab = page.locator('button[data-tab-key="history"]').or(page.getByRole('tab', { name: '最近分析' })).first();
        if ((await tab.count()) < 1) return false;
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 24; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const waitSuccessResult = async (rounds = 48) => {
        let last = '';
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(2500);
          last = await stack().innerText().catch(() => '');
          if (await isSuccessResult()) return;
          if (/任务失败|分析失败|推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析进入失败态: ' + last.slice(0, 200));
          }
        }
        if (/可视化分析过程/.test(last) || page.url().includes('analysis_view=processing')) {
          throw new Error('修订 已发起仍为空结果壳');
        }
        throw new Error('未在超时内到达条件筛选成功结果');
      };
      const reachFilterSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        const openPh = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const i = page.locator(`input[placeholder="${ph}"]`).first();
          await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        const pickOption = async (text) => {
          await page.locator(optSel).filter({ hasText: text }).first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        await openPh('全部企业标签');
        await pickOption('专精特新');
        await openPh('全部行业领域');
        const ai = page.locator(optSel).filter({ hasText: '人工智能' });
        if (await ai.count()) await ai.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitSuccessResult();
      };
      const confirmRerunModal = async () => {
        for (let i = 0; i < 8; i++) {
          const modal = page.locator('.arco-modal:visible').last();
          if ((await modal.count()) && (await modal.isVisible().catch(() => false))) {
            const ok = modal.getByRole('button', { name: '确定' });
            if (await ok.count()) {
              await ok.first().click({ timeout: 8000 });
              await page.waitForTimeout(600);
              return;
            }
          }
          await page.waitForTimeout(400);
        }
      };
      await reachFilterSuccess();
      const reBtn = stack().getByRole('button', { name: '重新分析', exact: true }).first();
      await expect(reBtn).toBeVisible({ timeout: 8000 });
      await expect(reBtn).toBeEnabled({ timeout: 8000 });
      await reBtn.click({ timeout: 10000 });
      await confirmRerunModal();
      await expect(stack().getByText('可视化分析过程').first()).toBeVisible({ timeout: 90000 });
      const cancelBtn = stack().getByRole('button', { name: '取消任务' }).first();
      await expect(cancelBtn).toBeVisible({ timeout: 15000 });
      await cancelBtn.click({ timeout: 10000 });
      await page.waitForTimeout(1200);
      globalThis.__func01455_cancelled = true;
      await expect(stack().getByText('可视化分析过程')).toHaveCount(0, { timeout: 12000 });
  - note: 2、结果区显示「请设置条件并执行推荐分析」
    assert: |-
      if (!globalThis.__func01455_cancelled) throw new Error('前置：未完成取消任务');
      const stack = page.getByTestId('recruit-tab-stack');
      await expect(stack.getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 12000 });
on_fail: 截图 + 抄 X-Trace-Id
