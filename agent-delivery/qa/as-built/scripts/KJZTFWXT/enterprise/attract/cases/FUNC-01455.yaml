id: FUNC-01455
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01455
priority: P1
title: 过程态取消任务后回到待发起空态
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；已点击「重新分析」并看到可视化分析过程（assert 自含成功结果→重新分析→抢窗点取消）
locators:
  reanalyze: button「重新分析」
  cancel_task: button「取消任务」
  process_title: 可视化分析过程
  empty_hint: 请设置条件并执行推荐分析
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise-center/attraction?workspace=attraction&recommendation_tab=attraction
  - action: wait
    for: 条件区 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 成功结果→重新分析→过程态点「取消任务」；终态断言在 expect
expect:
  - note: 1、过程面板退出
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const isSuccessResult = async () => {
        const st = stack();
        const t = await st.innerText().catch(() => '');
        const url = page.url();
        const counts = parseCounts(t);
        return (
          counts &&
          counts.analyzed >= 1 &&
          ((/招引推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const tryRestoreCompletedFilter = async () => {
        const byKey = page.locator('button[data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        if ((await byKey.count()) < 1 && (await byName.count()) < 1) return false;
        const tab = (await byKey.count()) ? byKey.first() : byName.first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 20; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const waitSuccessResult = async (rounds = 48) => {
        const st = stack();
        let last = '';
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(2500);
          last = await st.innerText().catch(() => '');
          const url = page.url();
          if ((/招引推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last)?.analyzed >= 1) return;
          }
          if (/任务失败|分析失败|推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析进入失败态: ' + last.slice(0, 240));
          }
        }
        const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
        if (stuck) {
          throw new Error('环境闸门 ENV-ATTRACT-ASYNC-NO-SUCCESS-001：无法在超时内到达成功结果以测「取消任务」（30888 与 FUNC-01408/01423 同源 D4）');
        }
        throw new Error('未在超时内到达条件筛选成功结果: ' + last.slice(0, 200));
      };
      const reachFilterSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await page.getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        const openPh = async (ph) => {
          await page.keyboard.press('Escape').catch(() => {});
          const i = page.locator(`input[placeholder="${ph}"]`).first();
          await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        const pickOption = async (text) => {
          const opt = page.locator(optSel).filter({ hasText: text }).first();
          await opt.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        };
        await openPh('全部企业标签');
        await pickOption('高新技术企业');
        await openPh('全部行业领域');
        const ai = page.locator(optSel).filter({ hasText: '人工智能' });
        if (await ai.count()) await ai.first().click({ timeout: 8000 });
        else await page.locator(optSel).filter({ hasText: '新一代信息技术' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitSuccessResult();
        await expect(stack().getByText('招引推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      };
      const pickReanalyze = async () => {
        const st = stack();
        const inStack = st.getByRole('button', { name: '重新分析', exact: true });
        if (await inStack.count() && await inStack.first().isVisible().catch(() => false)) return inStack.first();
        const pageBtn = page.getByRole('button', { name: '重新分析', exact: true });
        if (await pageBtn.count() && await pageBtn.first().isVisible().catch(() => false)) return pageBtn.first();
        return null;
      };
      const confirmRerunModalIfVisible = async () => {
        for (let i = 0; i < 8; i++) {
          const modal = page.locator('.arco-modal:visible').last();
          const wrap = page.locator('.arco-modal-wrapper:visible .arco-modal').last();
          const box = (await modal.count()) ? modal : wrap;
          if ((await box.count()) && (await box.isVisible().catch(() => false))) {
            const ok = box.getByRole('button', { name: '确定' });
            if (await ok.count()) {
              await ok.first().click({ timeout: 8000 });
              await page.waitForTimeout(600);
              return;
            }
          }
          await page.waitForTimeout(400);
        }
      };
      const clickCancelAsap = async () => {
        const cancelClicked = await page.evaluate(() => {
          return new Promise((resolve) => {
            const failedUi = () => {
              const t = document.body.innerText || '';
              return /推荐分析失败|任务失败|分析失败/.test(t) && !/取消任务/.test(t);
            };
            const tryClick = () => {
              if (failedUi()) {
                resolve('failed');
                return true;
              }
              const btn = Array.from(document.querySelectorAll('button')).find((b) =>
                /取消任务/.test((b.textContent || '').trim()),
              );
              if (btn) {
                btn.click();
                resolve('ok');
                return true;
              }
              return false;
            };
            if (tryClick()) return;
            const deadline = Date.now() + 90000;
            const obs = new MutationObserver(() => { tryClick(); });
            obs.observe(document.body, { childList: true, subtree: true });
            const tick = setInterval(() => {
              if (tryClick()) {
                clearInterval(tick);
                obs.disconnect();
              } else if (Date.now() > deadline) {
                clearInterval(tick);
                obs.disconnect();
                resolve('timeout');
              }
            }, 40);
          });
        });
        return cancelClicked;
      };
      await dismissBasket();
      await reachFilterSuccess();
      const reBtn = await pickReanalyze();
      if (!reBtn) {
        throw new Error('结果区无「重新分析」按钮（D3·30888 DEMO 空壳无工具条；ticket=ENV-ATTRACT-REANALYZE-001）');
      }
      await expect(reBtn).toBeEnabled({ timeout: 8000 });
      const cancelRace = clickCancelAsap();
      await reBtn.click({ timeout: 10000 });
      await page.waitForTimeout(500);
      await confirmRerunModalIfVisible();
      const cancelResult = await cancelRace;
      if (cancelResult === 'failed') {
        throw new Error('D3:Demo 任务无 running 窗口未见取消任务（ticket=ENV-ATTRACT-PROCESS-WINDOW-001）');
      }
      if (cancelResult === 'timeout') {
        const bodyText = await stack().innerText().catch(() => '');
        const url = page.url();
        if (/招引推荐分析结果/.test(bodyText) && !/可视化分析过程/.test(bodyText) && !url.includes('analysis_view=processing')) {
          throw new Error('ENV-ATTRACT-PROCESS-WINDOW-001: 重新分析当天复用/瞬时完成直达结果，未见可点「取消任务」（URL=' + url + '）');
        }
        if (/可视化分析过程/.test(bodyText) || url.includes('analysis_view=processing')) {
          throw new Error('ENV-ATTRACT-PROCESS-WINDOW-001: 90s 内未点到「取消任务」（URL=' + url + ' | ' + bodyText.slice(0, 200) + '）');
        }
        throw new Error('ENV-ATTRACT-PROCESS-WINDOW-001: 重新分析后未见过程窗或取消钮（URL=' + url + '）');
      }
      await page.waitForTimeout(1200);
      globalThis.__func01455_cancelled = true;
      const stAfter = await stack().innerText().catch(() => '');
      const urlAfter = page.url();
      if (/可视化分析过程/.test(stAfter) || urlAfter.includes('analysis_view=processing')) {
        throw new Error('点取消任务后仍停留在可视化分析过程: ' + urlAfter);
      }
  - note: 2、结果区显示「请设置条件并执行推荐分析」
    assert: |-
      if (!globalThis.__func01455_cancelled) throw new Error('前置：未完成取消任务');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const st = stack();
      await expect(st.getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 10000 });
      const body = await st.innerText().catch(() => '');
      if (/可视化分析过程/.test(body)) throw new Error('取消后栈内仍含「可视化分析过程」');
      if (/招引推荐分析结果/.test(body) && /共分析\s*\d+\s*家/.test(body) && !/请设置条件/.test(body)) {
        throw new Error('取消后仍为成功结果主态，未见待发起空态');
      }
      const url = page.url();
      if (url.includes('analysis_view=result') || url.includes('analysis_view=processing')) {
        throw new Error('取消后 URL 仍带 analysis_view=result|processing: ' + url);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·30888 深链 /enterprise-center/attraction；前置同 01423（成功结果→「重新分析」+弹窗确定兜底）。步骤=过程态 MutationObserver 抢「取消任务」。预期①离开可视化分析过程②结果区「请设置条件并执行推荐分析」。D3·无重新分析→ ENV-ATTRACT-REANALYZE-001；过程窗/瞬时完成无可点取消→ ENV-ATTRACT-PROCESS-WINDOW-001；前置成功链卡 processing→ ENV-ATTRACT-ASYNC-NO-SUCCESS-001。D4·2026-10-20 二轮机跑 rewrite-FUNC-01455-r2 仍 120s 无成功结果→交卷 blocked·ENV-ATTRACT-ASYNC-NO-SUCCESS-001（同首轮回炉/01423）。登录与关评审由 runner 前置。B 档零 allow_skip。
