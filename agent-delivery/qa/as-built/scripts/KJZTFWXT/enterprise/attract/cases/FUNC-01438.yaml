id: FUNC-01438
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01438
priority: P1
tier: B
title: 主流程-恢复候选工作台
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册01409造已完成候选工作台记录
    script: |-
      const main = page.locator('main');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candTab =
        page.locator('.global-workbench-tabs [data-tab-key="candidates"]').first().or(
          page.getByRole('tab', { name: '候选工作台' }).first(),
        );
      await expect(candTab).toBeVisible({ timeout: 15000 });
      await candTab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const rowCheck = main.locator('.arco-table-body .arco-checkbox').first();
      await expect(rowCheck).toBeVisible({ timeout: 15000 });
      await rowCheck.click({ timeout: 8000 });
      const reviewBtn = main.getByRole('button', { name: '执行指定对象复核' });
      await expect(reviewBtn).toBeEnabled({ timeout: 10000 });
      await reviewBtn.click({ timeout: 8000 });
      const startBtn = main.getByRole('button', { name: '开始分析' });
      await expect(startBtn).toBeVisible({ timeout: 15000 });
      await startBtn.click({ timeout: 8000 });
      for (let i = 0; i < 90; i++) {
        const t = await stack().innerText().catch(() => '');
        if (/人工线索复核结果/.test(t)) break;
        await page.waitForTimeout(1000);
      }
      await expect(stack().getByText(/人工线索复核结果/).first()).toBeVisible({ timeout: 5000 });
  - action: evaluate
    note: 打开最近分析
    script: |-
      const tab =
        page.locator('.global-workbench-tabs [data-tab-key="history"]').first().or(
          page.getByRole('tab', { name: '最近分析' }).first(),
        );
      await expect(tab).toBeVisible({ timeout: 15000 });
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const stack = page.getByTestId('recruit-tab-stack');
      for (let i = 0; i < 24; i++) {
        const t = await stack.innerText().catch(() => '');
        if (/任务名称/.test(t) && (/恢复结果/.test(t) || /暂无|还没有/.test(t))) break;
        await page.waitForTimeout(500);
      }
  - action: evaluate
    note: 对已完成候选工作台记录点击恢复结果
    script: |-
      const stack = page.getByTestId('recruit-tab-stack');
      const buttons = stack.getByRole('button', { name: '恢复结果' });
      const n = await buttons.count();
      if (n < 1) throw new Error('最近分析无「恢复结果」按钮');
      let target = null;
      for (let i = 0; i < n; i++) {
        const btn = buttons.nth(i);
        let row = btn.locator('xpath=ancestor::tr[1]');
        if ((await row.count()) < 1) {
          row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
        }
        const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
        if (txt && /已完成/.test(txt) && !/条件筛选/.test(txt)) {
          target = btn;
          break;
        }
      }
      if (!target) {
        for (let i = n - 1; i >= 0; i--) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt)) {
            target = btn;
            break;
          }
        }
      }
      if (!target) target = buttons.first();
      await target.scrollIntoViewIfNeeded();
      await target.click({ timeout: 15000 });
      for (let i = 0; i < 24; i++) {
        const t = await stack.innerText().catch(() => '');
        if (/人工线索复核结果/.test(t)) break;
        await page.waitForTimeout(500);
      }
expect:
  - note: 1、打开「人工线索复核结果」
    assert: |-
      await expect(
        page.getByTestId('recruit-tab-stack').getByText(/人工线索复核结果/).first(),
      ).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
