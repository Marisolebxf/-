id: FUNC-01443
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01443
priority: P1
tier: B
title: 备选-地域全球
entry_id: ent-attract
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: |-
      page.locator('main').filter({ has: page.getByText('地域来源', { exact: true }) }).locator('.arco-cascader-view')
  - action: click
    target: |-
      page.locator('.arco-cascader-popup-visible .arco-cascader-list-column').first().getByText('全球', { exact: true })
expect:
  - note: 第二列为「G20 国家」，共 1 项
    assert: |-
      const popup = page.locator('.arco-cascader-popup-visible');
      const secondCol = popup.locator('.arco-cascader-list-column').nth(1);
      await expect(secondCol.getByText('G20 国家', { exact: true })).toBeVisible();
      await expect(secondCol.locator('.arco-cascader-list-item')).toHaveCount(1);
on_fail: 截图 + 抄 X-Trace-Id
