id: FUNC-01463
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01463
priority: P1
title: 异常-候选搜索无匹配
story: US-ENT-RECRUIT-A1
entry_id: ent-attract
tier: B
preconditions:
  - 已登录；候选工作台已有企业（assert 自含对比篮/企业查询加入招引候选兜底）
locators:
  cand_tab: tab「候选工作台」
  name_search: placeholder「按企业名称搜索」
  empty_table: 表格 empty「未找到匹配企业」
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates
  - action: evaluate
    note: 候选工作台→输入不存在的企业名→校验名单清空且不发起分析
expect:
  - note: 1、当前名单不再显示原有企业
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise/attraction?workspace=attraction&recommendation_tab=attraction&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const isCandidateWorkspace = async () => {
        if (!(await candTab().count())) return false;
        return (await candTab().getAttribute('aria-selected').catch(() => '')) === 'true';
      };
      const openCandidateTab = async () => {
        if (await isCandidateWorkspace()) return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if (!(await isCandidateWorkspace())) {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if (!(await isCandidateWorkspace())) {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const waitStackReady = async () => {
        await expect(page.getByTestId('recruit-tab-stack')).toBeVisible({ timeout: 15000 });
        for (let i = 0; i < 20; i++) {
          if (await stack().getByText('人工线索候选工作台', { exact: false }).count()) return;
          await page.waitForTimeout(400);
        }
        throw new Error('未见 recruit-tab-stack / 人工线索候选工作台，url=' + page.url());
      };
      const dataRows = () => stack().locator('.arco-table-tr:has(.arco-table-td)');
      const rowCount = async () => {
        const rows = dataRows();
        const n = await rows.count();
        let c = 0;
        for (let i = 0; i < n; i++) {
          const t = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/^企业名称/.test(t)) continue;
          if (/未找到匹配企业/.test(t)) continue;
          if (!/公司|集团|有限|科技|股份|企业/.test(t)) continue;
          c++;
        }
        return c;
      };
      const readRowName = async (row) => {
        const link = row.getByRole('link').first();
        if (await link.count()) {
          const raw = ((await link.innerText({ timeout: 8000 }).catch(() => '')) || '').trim();
          if (raw.length >= 2) return raw;
        }
        const txt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        const parts = txt.split(/\s+/).filter((p) => p.length >= 2 && !/^\d+(\.\d+)?$/.test(p));
        const hit = parts.find((p) => /公司|集团|有限|科技|股份|企业/.test(p));
        if (hit) return hit;
        if (parts[0]) return parts[0];
        return txt.slice(0, 40);
      };
      const readAllNames = async () => {
        const rows = dataRows();
        const n = await rows.count();
        const names = [];
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/^企业名称/.test(t)) continue;
          names.push(await readRowName(row));
        }
        return names;
      };
      const pickNoMatchQuery = (names) => {
        const tries = ['FUNC01463不存在企业', 'ZZZ_NO_MATCH_01463', '𠀀𠀁无此企业名'];
        for (const q of tries) {
          const lower = q.toLocaleLowerCase('zh-CN');
          if (!names.some((n) => n.toLocaleLowerCase('zh-CN').includes(lower))) return q;
        }
        return 'NO_MATCH_' + Date.now();
      };
      const basketLayer = () =>
        page.locator('[data-system-surface-id="compare-basket"][data-panel-open="true"]');
      const addAttractFromBasketFor = async (preferName) => {
        await dismissBasket();
        const dock = page.getByRole('button', { name: /打开对比篮/ });
        if (!(await dock.count())) return false;
        await dock.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const layer = basketLayer();
        if (!(await layer.count())) {
          await page.keyboard.press('Escape').catch(() => {});
          return false;
        }
        const sel = layer
          .locator(`[aria-label="选择 ${preferName}"], [aria-label="选择${preferName}"]`)
          .first();
        if (!(await sel.count())) {
          await page.keyboard.press('Escape').catch(() => {});
          return false;
        }
        await sel.click({ timeout: 8000 });
        await page.waitForTimeout(350);
        const addA = layer
          .locator('[data-testid="compare-basket-action-bar"]')
          .getByRole('button', { name: '加入招引候选' });
        if (!(await addA.isEnabled().catch(() => false))) {
          await page.keyboard.press('Escape').catch(() => {});
          return false;
        }
        await addA.click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await page.keyboard.press('Escape').catch(() => {});
        return true;
      };
      const seedViaSearchCard = async () => {
        await page.goto(baseUrl + searchRoute, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await dismissBasket();
        const input = page.getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ }).first();
        await input.fill('人工智能');
        await page.getByRole('button', { name: '搜索', exact: true }).click();
        const hit = page.getByText(/命中\s*[1-9]\d*\s*家企业/).first();
        if (!(await hit.isVisible({ timeout: 25000 }).catch(() => false))) return false;
        const yq = page.locator('main').getByRole('button', { name: '引育候选' }).first();
        if (!(await yq.isVisible({ timeout: 10000 }).catch(() => false))) return false;
        await yq.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const addOpt = page.getByRole('menuitem', { name: '加入招引候选', exact: true }).first();
        if (!(await addOpt.isVisible({ timeout: 8000 }).catch(() => false))) return false;
        await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        return true;
      };
      const seedViaCompareBasket = async () => {
        for (const kw of ['人工智能', '生物医药', '新能源']) {
          await page.goto(baseUrl + searchRoute, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await dismissBasket();
          const input = page.getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ }).first();
          await input.fill(kw);
          await page.getByRole('button', { name: '搜索', exact: true }).click();
          const hit = page.getByText(/命中\s*[1-9]\d*\s*家企业/).first();
          if (!(await hit.isVisible({ timeout: 20000 }).catch(() => false))) continue;
          const main = page.locator('main');
          const yinyuBtns = main.getByRole('button', { name: /引育候选/ });
          const btnN = await yinyuBtns.count();
          for (let i = 0; i < Math.min(btnN, 8); i++) {
            const yq = yinyuBtns.nth(i);
            const card = yq.locator('xpath=ancestor::div[contains(@class,"rounded")][1]');
            const pick = card.locator('[aria-label^="选择"]').first();
            if (!(await pick.count())) continue;
            const aria = (await pick.getAttribute('aria-label')) || '';
            const name = aria.replace(/^选择\s*/, '').trim();
            if (!name || name.length < 4 || /区域|产业|标签/.test(name)) continue;
            await pick.click({ timeout: 8000 });
            await page.waitForTimeout(350);
            const bulk = page
              .locator('div')
              .filter({ hasText: /已选\s*1\s*家企业/ })
              .filter({ has: page.getByRole('button', { name: '加入对比' }) })
              .first();
            if (!(await bulk.count())) {
              await pick.click({ timeout: 3000 }).catch(() => {});
              continue;
            }
            await bulk.getByRole('button', { name: '加入对比' }).click({ timeout: 8000 });
            await page.waitForTimeout(1000);
            await pick.click({ timeout: 3000 }).catch(() => {});
            if (await addAttractFromBasketFor(name)) return true;
          }
        }
        return false;
      };
      const ensureOneCandidate = async () => {
        await waitStackReady();
        await openCandidateTab();
        for (let i = 0; i < 15; i++) {
          if ((await rowCount()) > 0) return;
          await page.waitForTimeout(400);
        }
        if (await seedViaSearchCard()) {
          await page.goto(baseUrl + candRoute, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
          await openCandidateTab();
          if ((await rowCount()) > 0) return;
        }
        if (await seedViaCompareBasket()) {
          await page.goto(baseUrl + candRoute, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2500);
          await openCandidateTab();
          if ((await rowCount()) > 0) return;
        }
        const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
        throw new Error('环境闸门 ENV-ATTRACT-CANDIDATE-EMPTY：候选工作台无企业（企业查询/对比篮加入后仍为空）: ' + txt.slice(0, 160));
      };
      await dismissBasket();
      await ensureOneCandidate();
      await waitStackReady();
      const namesBefore = await readAllNames();
      if (namesBefore.length < 1) throw new Error('候选表无数据行');
      const noMatch = pickNoMatchQuery(namesBefore);
      const search = stack().getByPlaceholder('按企业名称搜索').first();
      await expect(search).toBeVisible({ timeout: 10000 });
      await search.fill(noMatch);
      await search.press('Enter');
      await page.waitForTimeout(900);
      const rowsAfter = await rowCount();
      if (rowsAfter !== 0) {
        throw new Error('无匹配搜索后表体仍 ' + rowsAfter + ' 行，query=' + noMatch);
      }
      const emptyHint = stack().getByText('未找到匹配企业', { exact: false }).first();
      const summaryZero = stack().getByText(/找到\s*0\s*家/).first();
      const emptyOk = (await emptyHint.isVisible().catch(() => false)) || (await summaryZero.isVisible().catch(() => false));
      if (!emptyOk) {
        throw new Error('无匹配搜索后未见「未找到匹配企业」或「找到 0 家」');
      }
      for (const name of namesBefore) {
        if (!name || name.length < 2) continue;
        const esc = name.slice(0, Math.min(12, name.length)).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const cell = stack().locator('.arco-table-content, .arco-table').getByText(new RegExp(esc));
        if (await cell.count()) {
          const vis = await cell.first().isVisible().catch(() => false);
          if (vis) throw new Error('过滤后仍见原名单企业「' + name + '」');
        }
      }
  - note: 2、不出现「可视化分析过程」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(page.getByTestId('recruit-tab-stack')).toBeVisible({ timeout: 10000 });
      const body = await page.locator('body').innerText({ timeout: 8000 }).catch(() => '');
      if (/可视化分析过程/.test(body)) {
        throw new Error('无匹配名称搜索后误入「可视化分析过程」');
      }
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 8000 });
      const startReview = stack().getByRole('button', { name: '执行指定对象复核' }).first();
      if (await startReview.count()) {
        await expect(startReview).toBeDisabled({ timeout: 3000 });
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·svcz 深链 /enterprise/attraction&entry=candidates（/enterprise-center 404）。D2·Arco 表 tbody 为空壳，数据行用 stack 内 .arco-table-tr:has(.arco-table-td) 排除表头。CandidatePanel 名称搜索无匹配→ empty「未找到匹配企业」/「找到 0 家」，不出现可视化分析过程。前置 seed 走 /enterprise/enterprise-search（同 01434）。D4·候选空→ ENV-ATTRACT-CANDIDATE-EMPTY。登录与关评审由 runner 前置。B 档零 allow_skip。
