id: FUNC-02194
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02194
priority: P0
title: 统一判定模型展示三张只读卡片及支撑因子
entry_id: ent-cultivate
tier: A
preconditions:
  - 停在条件筛选推荐 Tab
locators:
  filter_tab: tab「条件筛选推荐」
  model_heading: 统一判定模型
  stack: testid recruit-tab-stack
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 看统一判定模型区域（expect 自含）
expect:
  - note: 卡片为技术壁垒、市场增速、团队背景（左→右顺序）
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const route = '/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const openFilterTab = async () => {
        const tab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        if ((await tab.getAttribute('aria-selected')) !== 'true') {
          await tab.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        }
      };
      const readStackText = async () => {
        const stack = page.getByTestId('recruit-tab-stack');
        await expect(stack.getByText('统一判定模型', { exact: true })).toBeVisible({ timeout: 8000 });
        return (await stack.innerText()).replace(/\s+/g, ' ').trim();
      };
      await dismissBasket();
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1200);
      await openFilterTab();
      let t = await readStackText();
      const expected = ['技术壁垒', '市场增速', '团队背景'];
      let last = -1;
      for (const d of expected) {
        const i = t.indexOf(d);
        if (i < 0) {
          await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1200);
          await openFilterTab();
          t = await readStackText();
          break;
        }
      }
      last = -1;
      for (const d of expected) {
        const i = t.indexOf(d);
        if (i < 0) {
          throw new Error(`统一判定模型区域未见「${d}」`);
        }
        if (i <= last) {
          throw new Error(`卡片顺序错误：${expected.join('→')}；文本片段=${t.slice(Math.max(0, t.indexOf('统一判定模型')), t.indexOf('统一判定模型') + 120)}`);
        }
        last = i;
      }
      await page.evaluate((body) => { window.__qa_model_stack = body; }, t);
  - note: 每张卡片有对应支撑因子说明（附录 A 全文）
    assert: |-
      let t = await page.evaluate(() => window.__qa_model_stack);
      if (!t || typeof t !== 'string') {
        t = (await page.getByTestId('recruit-tab-stack').innerText()).replace(/\s+/g, ' ').trim();
      }
      const factorCount = (t.match(/支撑因子：/g) || []).length;
      if (factorCount !== 3) {
        throw new Error(`支撑因子行数 ${factorCount}，预期 3`);
      }
      const expectedFactors = [
        '支撑因子：技术积累、创新与差异化能力',
        '支撑因子：营收与订单增速、企业成长潜力',
        '支撑因子：核心团队经历、研发与产业化能力',
      ];
      for (const f of expectedFactors) {
        if (!t.includes(f)) {
          throw new Error(`未见「${f}」；统一判定模型区=${t.slice(t.indexOf('统一判定模型'), t.indexOf('统一判定模型') + 200)}`);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: catalog_path 深链含 recommendation_tab=cultivation；三卡片与支撑因子文案与 fixtures/scout mainText、用例附录 A 一致（edu svcz 2026-10-20 探针）。登录与关评审由 runner 前置。
