id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01006
priority: P0
title: 条件区含产业类别政策导向与企业规模三选择器且占位正确
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
- 已进入培育页且停留条件筛选推荐 Tab
locators:
  industry: placeholder 全部产业类别
  policy: placeholder 全部政策导向
  size: placeholder 全部企业规模
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: evaluate
  note: 浏览条件区三选择器
expect:
- note: 条件区含产业类别、政策导向、企业规模三选择器
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; for (const lab of ['产业类别','政策导向','企业规模']) await expect(page.getByTestId('recruit-tab-stack').getByText(lab, { exact: true }).first()).toBeVisible({ timeout: 8000 })
- note: 三选择器占位分别为「全部产业类别」「全部政策导向」「全部企业规模」
  assert: |-
    for (const p of ['全部产业类别','全部政策导向','全部企业规模']) await expect(page.locator(`input[placeholder="${p}"]`).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 选项集内容以现场字典为准（observed）。
tier: B
