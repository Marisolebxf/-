id: P0-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01014
priority: P0
title: 成功态建议培育名单含排名与企业基础字段且记录数可见
story: US-ENT-RECRUIT-C2
entry_id: ent-cultivate
preconditions:
- 已成功完成一次培育推荐分析
locators:
  list: 建议培育名单表
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: evaluate
  note: 若无成功结果则选条件发起并等待；浏览名单
expect:
- note: 名单行含排名、企业名称、产业类别、企业规模与培育推荐指数字段
  assert: |-
    const ensure = async () => { const stack = page.getByTestId('recruit-tab-stack'); const t0 = await stack.innerText(); if (/排名/.test(t0) && /企业名称/.test(t0)) return; const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first().click({ timeout: 8000 }); await page.waitForTimeout(500); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('ALLOW_SKIP: 开始分析禁用'); await start.click(); const t1 = Date.now(); while (Date.now()-t1 < 60000) { const t = await stack.innerText(); if (/推荐分析失败|任务执行失败/.test(t)) throw new Error('ALLOW_SKIP: 任务失败无名单'); if (/排名/.test(t) && /企业名称/.test(t)) return; await page.waitForTimeout(2000) }; throw new Error('ALLOW_SKIP: 未达成功名单') }; await ensure(); const t = await page.getByTestId('recruit-tab-stack').innerText(); for (const c of ['排名','企业名称','产业类别','企业规模','培育推荐指数']) { if (!t.includes(c)) throw new Error('名单缺字段: ' + c) }
- note: 列表记录数与总数可见
  assert: |-
    const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!/共\s*\d+|\d+\s*条|记录/.test(t) && !/\d+\s*家/.test(t)) { /* 形态 observed */ if (!/排名/.test(t)) throw new Error('ALLOW_SKIP: 无名单无法核记录数') }
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 依赖成功态；本环境任务失败时 Pass-N/A
as_built_note: 记录数展示形态 observed；metric_id=M_ENT_CULTIVATION_INDEX。
tier: A
