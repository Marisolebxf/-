id: FUNC-02217
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02217
priority: P1
tier: B
title: 结果超过一页时翻页不新建任务
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 培育企业推荐分析
  - action: wait
    target: 800ms
expect:
  - note: 1、表头列与第 1 页相同
    assert: |-
      const PAGE_SIZE = 20;
      const REQUIRED = ['排名', '企业名称', '产业类别', '企业规模', '发展瓶颈', '培育推荐指数', '操作'];
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const parseCounts = (text) => {
        const m = text.match(/共分析\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        return parseCounts(t) >= 1 && /培育推荐分析结果/.test(t) && !/可视化分析过程/.test(t);
      };
      const openRecentTab = async () => {
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) > 0) await tab.click({ timeout: 8000 });
        else await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const countRecTasks = async () => {
        const t = await stack().innerText().catch(() => '');
        return (t.match(/REC-/g) || []).length;
      };
      const tryRestore = async () => {
        await openRecentTab();
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!(txt && /已完成/.test(txt) && /条件筛选/.test(txt))) continue;
          await btn.click({ timeout: 15000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (!(await isSuccessResult())) continue;
            if ((parseCounts(await stack().innerText().catch(() => '')) ?? 0) > PAGE_SIZE) return true;
          }
          await openRecentTab();
        }
        return false;
      };
      const waitSuccess = async () => {
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          const t = await stack().innerText().catch(() => '');
          if (/培育推荐分析结果/.test(t) && !/可视化分析过程/.test(t) && parseCounts(t) >= 1) return;
          if (/推荐分析失败/.test(t) && !/可视化分析过程/.test(t)) {
            throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001');
          }
        }
        const t = await stack().innerText().catch(() => '');
        if (/可视化分析过程/.test(t)) throw new Error('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001');
        throw new Error('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001');
      };
      const pickAi = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await page.locator(optSel).filter({ hasText: '人工智能' }).first().click({ timeout: 8000 });
      };
      const readHeaders = async (st) => {
        const table = st.locator('.arco-table').first();
        await expect(table).toBeVisible({ timeout: 10000 });
        const ths = table.locator('.arco-table-header .arco-table-th, thead .arco-table-th');
        const labels = [];
        for (let i = 0; i < await ths.count(); i++) {
          const t = ((await ths.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t) labels.push(t);
        }
        return labels;
      };
      await expect(stack()).toBeVisible({ timeout: 15000 });
      if (!(await isSuccessResult()) || (parseCounts(await stack().innerText().catch(() => '')) ?? 0) <= PAGE_SIZE) {
        if (!(await tryRestore())) {
          await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(600);
          await pickAi();
          await page.getByRole('button', { name: '开始分析' }).first().click();
          await waitSuccess();
        }
      }
      const analyzed = parseCounts(await stack().innerText().catch(() => '')) ?? 0;
      if (analyzed <= PAGE_SIZE) throw new Error('ENV-CULTIVATE-RESULT-PAGE2-001');
      const st = stack();
      const headersBefore = await readHeaders(st);
      const missing = REQUIRED.filter((c) => !headersBefore.some((h) => h === c || h.includes(c)));
      if (missing.length) throw new Error('表头缺列：' + missing.join('、'));
      const firstRow = st.locator('.arco-table').first().locator('.arco-table-body .arco-table-tr').first();
      const rankPage1 = ((await firstRow.locator('.arco-table-td').first().innerText()) || '').replace(/\s+/g, ' ').trim();
      await openRecentTab();
      const nBefore = await countRecTasks();
      await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(600);
      if (!(await isSuccessResult())) await tryRestore();
      const pag = st.locator('.arco-pagination').filter({ has: page.locator('.arco-pagination-item') }).last();
      let p2 = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      if ((await p2.count()) < 1) p2 = pag.locator('.arco-pagination-item-next').first();
      await p2.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      globalThis.__func02217 = {
        headersBefore,
        rankPage1,
        nBefore,
        taskBefore: (page.url().match(/task_id=([^&]+)/) || [])[1] || '',
      };
      const headersAfter = await readHeaders(st);
      if (headersAfter.join('|') !== headersBefore.join('|')) {
        throw new Error('翻页后表头变化');
      }
  - note: 2、第 2 页首行排名不同于第 1 页首行
    assert: |-
      const ctx = globalThis.__func02217;
      if (!ctx?.rankPage1) throw new Error('前置：未到达翻页态');
      const st = page.getByTestId('recruit-tab-stack');
      const firstRow = st.locator('.arco-table').first().locator('.arco-table-body .arco-table-tr').first();
      const rankPage2 = ((await firstRow.locator('.arco-table-td').first().innerText()) || '').replace(/\s+/g, ' ').trim();
      if (rankPage2 === ctx.rankPage1) throw new Error('第 2 页首行排名与第 1 页相同');
      const activeText = ((await st.locator('.arco-pagination-item-active').first().innerText()) || '').trim();
      if (activeText !== '2') throw new Error('当前页应为 2');
  - note: 3、不新增最近分析任务
    assert: |-
      const ctx = globalThis.__func02217;
      if (ctx?.nBefore == null) throw new Error('前置：未到达翻页态');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
      if ((await tab.count()) > 0) await tab.click({ timeout: 8000 });
      else await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(900);
      const nAfter = ((await stack().innerText().catch(() => '')).match(/REC-/g) || []).length;
      if (nAfter > ctx.nBefore) throw new Error('最近分析条数增加');
      const taskAfter = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      if (ctx.taskBefore && taskAfter && ctx.taskBefore !== taskAfter) throw new Error('task_id 变化');
on_fail: 截图 + 抄 X-Trace-Id
