id: FUNC-02198
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02198
priority: P0
tier: B
title: 主流程-结果搜索只滤当前结果
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 前置到达培育推荐分析结果→无匹配搜索→清空后按企业名片段搜索
expect:
  - note: 1、无匹配时当前筛选为 0 家
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const main = page.locator('main');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        const filteredM = text.match(/当前筛选\s*(\d+)\s*家/);
        if (!analyzedM || !filteredM) return null;
        return { analyzed: parseInt(analyzedM[1], 10), filtered: parseInt(filteredM[1], 10) };
      };
      const hasRankingTable = (text) =>
        /培育推荐分析结果/.test(text) && /排名/.test(text) && /企业名称/.test(text) && (parseCounts(text)?.analyzed ?? 0) >= 1;
      const ensureCultivationWorkspace = async () => {
        const body = await page.locator('main').innerText().catch(() => '');
        if (/培育推荐条件|深圳市内企业/.test(body)) return;
        const nav = page.getByRole('menuitem', { name: '培育企业推荐分析' }).first();
        if ((await nav.count()) < 1) {
          await page.getByText('培育企业推荐分析', { exact: true }).first().click({ timeout: 8000 });
        } else {
          await nav.click({ timeout: 8000 });
        }
        await page.waitForTimeout(800);
        await expect(page.locator('main').getByText('培育推荐条件').first()).toBeVisible({ timeout: 15000 });
      };
      const waitFilterReady = async () => {
        await ensureCultivationWorkspace();
        for (let i = 0; i < 24; i++) {
          if (await main.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const openRecentTab = async () => {
        await waitFilterReady();
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        } else {
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
      };
      const waitResultShell = async (timeoutMs = 120000) => {
        const title = () => stack().getByText('培育推荐分析结果').first();
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          const titleVis = await title().isVisible().catch(() => false);
          if (titleVis && !/可视化分析过程/.test(last) && hasRankingTable(last)) return last;
          if (/已打开今天相同条件的推荐分析结果/.test(last) && hasRankingTable(last)) return last;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析失败，无法到达成功结果页');
          }
        }
        if (/可视化分析过程/.test(last)) {
          throw new Error('修订 已发起仍为空结果壳');
        }
        throw new Error('未在超时内到达含企业排名表的成功结果: ' + last.slice(0, 200));
      };
      const runFilterAnalysis = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await waitFilterReady();
        const i = main.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        return await waitResultShell();
      };
      const pickHistoryRestore = async () => {
        await openRecentTab();
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /条件筛选/.test(txt) && /已完成|成功/.test(txt)) {
            await btn.scrollIntoViewIfNeeded();
            await btn.click({ timeout: 15000 });
            return await waitResultShell(60000);
          }
        }
        return null;
      };
      const ensureSuccessResult = async () => {
        await expect(stack()).toBeVisible({ timeout: 15000 });
        let body = await stack().innerText().catch(() => '');
        if (hasRankingTable(body)) return body;
        const restored = await pickHistoryRestore().catch(() => null);
        if (restored && hasRankingTable(restored)) return restored;
        return await runFilterAnalysis();
      };
      const readResultNames = async () => {
        const st = stack();
        const cells = st.locator('.arco-table-body .arco-table-td').filter({ hasText: /公司|集团|有限|科技|股份/ });
        const n = await cells.count();
        const names = [];
        for (let i = 0; i < Math.min(n, 24); i++) {
          const raw = ((await cells.nth(i).innerText().catch(() => '')) || '').trim();
          if (raw.length >= 2 && !/排名|企业名称|详情|操作/.test(raw)) names.push(raw);
        }
        return names;
      };
      const countHistoryRows = async () => {
        const hasHist =
          (await page.locator('button[data-tab-key="history"]').count()) > 0 ||
          (await page.getByRole('tab', { name: '最近分析' }).count()) > 0;
        if (!hasHist) return null;
        await openRecentTab();
        const st = stack();
        const rows = st.locator('.arco-table-body .arco-table-tr').filter({ has: st.locator('.arco-table-td') });
        const n = await rows.count();
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        return n;
      };
      const pickNoMatchQuery = (names) => {
        const tries = ['FUNC02198不存在企业', 'ZZZ_NO_MATCH_02198'];
        for (const q of tries) {
          const lower = q.toLocaleLowerCase('zh-CN');
          if (!names.some((n) => n.toLocaleLowerCase('zh-CN').includes(lower))) return q;
        }
        return 'NO_MATCH_' + Date.now();
      };
      await ensureSuccessResult();
      const historyRowsBefore = await countHistoryRows().catch(() => null);
      const taskBefore = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      const st = stack();
      const bodyBefore = await st.innerText().catch(() => '');
      const before = parseCounts(bodyBefore);
      if (!before || before.analyzed < 1) {
        throw new Error('成功结果未见「共分析/当前筛选」计数');
      }
      const names = await readResultNames();
      const noMatch = pickNoMatchQuery(names);
      const search = st.locator('input[placeholder="搜索企业名称"]').first();
      await expect(search).toBeVisible({ timeout: 10000 });
      await search.fill(noMatch);
      await search.press('Enter');
      let filtered = before.filtered;
      for (let i = 0; i < 16; i++) {
        await page.waitForTimeout(400);
        const t = await st.innerText().catch(() => '');
        const c = parseCounts(t);
        if (c) {
          filtered = c.filtered;
          if (filtered === 0) break;
        }
      }
      if (filtered !== 0) {
        throw new Error('无匹配搜索后「当前筛选」仍为 ' + filtered + ' 家');
      }
      globalThis.__func02198 = {
        taskBefore,
        analyzedBefore: before.analyzed,
        historyRowsBefore,
        sampleName: names[0] || '',
      };
  - note: 2、有匹配时只留下名称相符的行
    assert: |-
      const ctx = globalThis.__func02198;
      if (!ctx) throw new Error('前置：未完成无匹配搜索');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const st = stack();
      const parseCounts = (text) => {
        const filteredM = text.match(/当前筛选\s*(\d+)\s*家/);
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM || !filteredM) return null;
        return { analyzed: parseInt(analyzedM[1], 10), filtered: parseInt(filteredM[1], 10) };
      };
      const readResultNames = async () => {
        const cells = st.locator('.arco-table-body .arco-table-td').filter({ hasText: /公司|集团|有限|科技|股份/ });
        const n = await cells.count();
        const names = [];
        for (let i = 0; i < Math.min(n, 24); i++) {
          const raw = ((await cells.nth(i).innerText().catch(() => '')) || '').trim();
          if (raw.length >= 2 && !/排名|企业名称|详情|操作/.test(raw)) names.push(raw);
        }
        return names;
      };
      const search = st.locator('input[placeholder="搜索企业名称"]').first();
      await search.fill('');
      await search.press('Enter');
      await page.waitForTimeout(700);
      let sample = ctx.sampleName;
      if (!sample || sample.length < 2) {
        const restored = await readResultNames();
        sample = restored[0] || '';
      }
      if (!sample || sample.length < 2) throw new Error('结果表无企业名称可读行');
      const fragment = sample.slice(0, Math.min(4, sample.length));
      await search.fill(fragment);
      await search.press('Enter');
      let counts = null;
      for (let i = 0; i < 16; i++) {
        await page.waitForTimeout(400);
        counts = parseCounts(await st.innerText().catch(() => ''));
        if (counts && counts.filtered >= 1) break;
      }
      if (!counts || counts.filtered < 1) {
        throw new Error('按片段搜索后当前筛选仍 <1 家');
      }
      const visible = await readResultNames();
      const fragLower = fragment.toLocaleLowerCase('zh-CN');
      for (const name of visible) {
        if (!name.toLocaleLowerCase('zh-CN').includes(fragLower)) {
          throw new Error('可见行不含搜索片段');
        }
      }
  - note: 3、最近分析不因此新增任务
    assert: |-
      const ctx = globalThis.__func02198;
      if (!ctx) throw new Error('前置：未完成结果内搜索');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const st = stack();
      const body = await st.innerText().catch(() => '');
      if (/可视化分析过程/.test(body)) {
        throw new Error('结果搜索后误入可视化分析过程');
      }
      await expect(st.getByText('培育推荐分析结果').first()).toBeVisible({ timeout: 8000 });
      const taskAfter = (page.url().match(/task_id=([^&]+)/) || [])[1] || '';
      if (ctx.taskBefore && taskAfter && ctx.taskBefore !== taskAfter) {
        throw new Error('搜索后 task_id 变化');
      }
      const analyzedM = body.match(/共分析\s*(\d+)\s*家/);
      if (!analyzedM || parseInt(analyzedM[1], 10) !== ctx.analyzedBefore) {
        throw new Error('共分析家数因搜索发生变化');
      }
      const hasHist =
        (await page.locator('button[data-tab-key="history"]').count()) > 0 ||
        (await page.getByRole('tab', { name: '最近分析' }).count()) > 0;
      if (hasHist && ctx.historyRowsBefore != null) {
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        } else {
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
        const rows = st.locator('.arco-table-body .arco-table-tr').filter({ has: st.locator('.arco-table-td') });
        const afterN = await rows.count();
        if (afterN > ctx.historyRowsBefore) {
          throw new Error('最近分析行数增加，疑似搜索触发新任务');
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
