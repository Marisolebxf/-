id: P0-16
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01018
priority: P0
title: 阈值待定角标存在且点开有解释内容
story: US-ENT-RECRUIT-C2
entry_id: ent-cultivate
preconditions:
- 结果区或条件区角标可见
locators:
  badge: aria-label 含 Q015 / perm-pending-badge
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: click
  target: 阈值待定角标
expect:
- note: 角标点开后有解释内容不空白不报错
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const badge = page.locator('[aria-label*="Q015"], .perm-pending-badge').first(); if (!(await badge.count())) throw new Error('未见阈值待定角标'); await badge.click({ timeout: 8000 }); await page.waitForTimeout(600); const pop = await page.locator('.arco-trigger-popup:visible, .arco-popover:visible, .arco-tooltip:visible').first().innerText().catch(() => ''); if (!pop || pop.trim().length < 2) { const t = await page.locator('body').innerText(); if (!/Q015|阈值|正式指标/.test(t)) throw new Error('角标点开无解释内容') }
- note: 指数区无正式阈值与权重表述
  assert: |-
    const t = await page.getByTestId('recruit-tab-stack').innerText(); if (/正式阈值\s*=|权重配置已生效/.test(t)) throw new Error('出现正式阈值/权重表述')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 角标 aria-label「正式指标语义与阈值待 Q015 闭合。」；业务态去留 observed。
tier: B
