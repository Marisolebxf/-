id: FUNC-02222
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02222
priority: P1
tier: B
title: 重置清空结果区搜索和下拉并恢复筛选条数
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册前置→结果区搜索与产业下拉→点重置
expect:
  - note: 1、搜索框与两个下拉恢复未选
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        const filteredM = text.match(/当前筛选\s*(\d+)\s*家/);
        if (!analyzedM || !filteredM) return null;
        return { analyzed: parseInt(analyzedM[1], 10), filtered: parseInt(filteredM[1], 10) };
      };
      const hasRankingTable = (text) =>
        /培育推荐分析结果/.test(text) && /排名/.test(text) && /企业名称/.test(text) && (parseCounts(text)?.analyzed ?? 0) >= 1;
      const enterCultivation = async () => {
        if (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
        const link = page.getByRole('link', { name: '培育企业推荐分析' }).first();
        if ((await link.count()) < 1) {
          await page.getByText('培育企业推荐分析', { exact: true }).first().click({ timeout: 10000 });
        } else {
          await link.click({ timeout: 10000 });
        }
        await page.waitForTimeout(800);
        await expect(page.getByText('深圳市内企业').first()).toBeVisible({ timeout: 15000 });
      };
      const waitFilterReady = async () => {
        await enterCultivation();
        for (let i = 0; i < 24; i++) {
          if (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const openRecentTab = async () => {
        await waitFilterReady();
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        } else {
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
      };
      const pickHistoryRestore = async () => {
        await openRecentTab();
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /条件筛选/.test(txt) && /已完成|成功/.test(txt)) return btn;
        }
        return null;
      };
      const waitResultShell = async (timeoutMs = 90000) => {
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          if (hasRankingTable(last) && !/可视化分析过程/.test(last)) return last;
          if (/推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001');
          }
        }
        throw new Error('未到达培育推荐分析成功结果: ' + last.slice(0, 240));
      };
      const runFrom02188 = async () => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(400);
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        return await waitResultShell();
      };
      const ensureSuccessResult = async () => {
        await expect(stack()).toBeVisible({ timeout: 15000 });
        let body = await stack().innerText().catch(() => '');
        if (hasRankingTable(body)) return body;
        const restore = await pickHistoryRestore();
        if (restore) {
          await restore.scrollIntoViewIfNeeded();
          await restore.click({ timeout: 15000 });
          body = await waitResultShell(60000);
          if (hasRankingTable(body)) return body;
        }
        return await runFrom02188();
      };
      const readFirstCompanyName = async (st) => {
        const table = st.locator('.arco-table').first();
        await expect(table).toBeVisible({ timeout: 10000 });
        const ths = table.locator('.arco-table-th');
        let nameIdx = -1;
        const thn = await ths.count();
        for (let i = 0; i < thn; i++) {
          const t = ((await ths.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, '');
          if (t.includes('企业名称')) {
            nameIdx = i;
            break;
          }
        }
        if (nameIdx < 0) throw new Error('结果表未见企业名称列');
        const cell = table.locator('.arco-table-body .arco-table-tr').first().locator('.arco-table-td').nth(nameIdx);
        const name = ((await cell.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        if (!name) throw new Error('首行企业名称为空');
        return name.length >= 2 ? name.slice(0, Math.min(4, name.length)) : name;
      };
      const selectEmpty = async (placeholder) => {
        const inp = stack().locator('input[placeholder="' + placeholder + '"]').first();
        await expect(inp).toBeVisible({ timeout: 8000 });
        const val = await inp.inputValue().catch(() => '');
        if (val) throw new Error('下拉「' + placeholder + '」仍选中值：' + val);
      };
      await ensureSuccessResult();
      const st = stack();
      const baseline = parseCounts(await st.innerText().catch(() => ''));
      if (!baseline || baseline.analyzed < 1) throw new Error('未读到共分析/当前筛选计数');
      globalThis.__func02222 = { analyzed: baseline.analyzed };
      const query = await readFirstCompanyName(st);
      const search = st.locator('input[placeholder="搜索企业名称"]').first();
      await search.fill(query);
      await page.waitForTimeout(500);
      const indPh = st.locator('input[placeholder="产业类别"]').first();
      await indPh.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const indOpt = page.locator(optSel).first();
      await expect(indOpt).toBeVisible({ timeout: 8000 });
      await indOpt.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(search).not.toHaveValue('', { timeout: 5000 });
      await st.getByRole('button', { name: '重置' }).click({ timeout: 8000 });
      await page.waitForTimeout(700);
      await expect(search).toHaveValue('', { timeout: 8000 });
      await selectEmpty('产业类别');
      await selectEmpty('企业规模');
  - note: 2、当前筛选条数回到重置前的共分析范围
    assert: |-
      const ctx = globalThis.__func02222;
      if (!ctx || typeof ctx.analyzed !== 'number') throw new Error('前置：未保存共分析条数');
      const st = page.getByTestId('recruit-tab-stack');
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        const filteredM = text.match(/当前筛选\s*(\d+)\s*家/);
        if (!analyzedM || !filteredM) return null;
        return { analyzed: parseInt(analyzedM[1], 10), filtered: parseInt(filteredM[1], 10) };
      };
      let counts = null;
      for (let i = 0; i < 12; i++) {
        await page.waitForTimeout(400);
        counts = parseCounts(await st.innerText().catch(() => ''));
        if (counts && counts.filtered === ctx.analyzed && counts.analyzed === ctx.analyzed) break;
      }
      if (!counts) throw new Error('重置后未读到共分析/当前筛选');
      if (counts.analyzed !== ctx.analyzed) {
        throw new Error('重置后共分析 ' + counts.analyzed + ' 家，预期保持 ' + ctx.analyzed + ' 家');
      }
      if (counts.filtered !== ctx.analyzed) {
        throw new Error('重置后当前筛选 ' + counts.filtered + ' 家，预期回到共分析 ' + ctx.analyzed + ' 家');
      }
on_fail: 截图 + 抄 X-Trace-Id
