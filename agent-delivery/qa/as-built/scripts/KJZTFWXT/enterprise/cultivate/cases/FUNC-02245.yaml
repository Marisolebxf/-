id: FUNC-02245
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02245
priority: P1
tier: B
title: 异常-候选复核失败
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册02208→参数配置后点开始分析并等待结束
expect:
  - note: 1、出现「候选分析失败」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates';
      const openCandidateTab = async () => {
        const candTab = page.getByRole('tab', { name: '候选工作台' }).first();
        await expect(candTab).toBeVisible({ timeout: 15000 });
        if ((await candTab.getAttribute('aria-selected')) !== 'true') {
          await candTab.click({ timeout: 10000 });
          await page.waitForTimeout(800);
        }
      };
      const ensureConfigPage = async () => {
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await openCandidateTab();
        const bar = stack().getByTestId('candidate-action-bar');
        await expect(bar).toBeVisible({ timeout: 15000 });
        await expect(stack().getByText(/共\s*\d+\s*家/).first()).toBeVisible({ timeout: 15000 });
        const cb = stack().locator('.arco-table-body .arco-checkbox, tbody .arco-checkbox').first();
        await expect(cb).toBeVisible({ timeout: 12000 });
        if (!(await cb.getAttribute('class'))?.includes('arco-checkbox-checked')) {
          await cb.click({ timeout: 8000 });
          await page.waitForTimeout(700);
        }
        const selText = await bar.innerText().catch(() => '');
        if (!/已选\s*[1-9]\d*\s*家/.test(selText.replace(/\s+/g, ' '))) {
          await stack().locator('.arco-table-body .arco-table-tr, tbody tr').first().click({ timeout: 8000 }).catch(() => {});
          await cb.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(700);
        }
        const review = bar.getByRole('button', { name: '执行指定对象复核' }).first();
        await expect(review).toBeEnabled({ timeout: 8000 });
        await review.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const config = page.getByTestId('specified-review-config');
        await expect(config).toBeVisible({ timeout: 12000 });
        await expect(page.getByText('指定对象模型参数配置', { exact: false }).first()).toBeVisible({ timeout: 8000 });
        return config;
      };
      const config = await ensureConfigPage();
      const start = config.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 10000 });
      const failTitle = page.getByText('候选分析失败', { exact: false }).first();
      await expect(failTitle).toBeVisible({ timeout: 180000 });
  - note: 2、给出失败说明
    assert: |-
      const main = page.locator('main');
      const body = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!body.includes('候选分析失败')) {
        throw new Error('主区未见候选分析失败标题');
      }
      const withoutTitle = body.replace(/候选分析失败/g, '').trim();
      if (withoutTitle.length < 8) {
        throw new Error('失败说明过短或缺失: ' + body.slice(0, 200));
      }
  - note: 3、候选名单仍可回到
    assert: |-
      const config = page.getByTestId('specified-review-config');
      const back = config.getByRole('button', { name: '返回候选列表' }).first();
      if (!(await back.count())) {
        const back2 = page.locator('main').getByRole('button', { name: '返回候选列表' }).first();
        await expect(back2).toBeVisible({ timeout: 8000 });
        await back2.click({ timeout: 8000 });
      } else {
        await expect(back).toBeVisible({ timeout: 8000 });
        await back.click({ timeout: 8000 });
      }
      await page.waitForTimeout(800);
      await expect(page.getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 15000 });
on_fail: 截图 + 抄 X-Trace-Id
