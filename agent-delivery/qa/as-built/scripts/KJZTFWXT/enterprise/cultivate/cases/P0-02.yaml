id: P0-02
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01010
priority: P0
title: 未设任何条件时开始分析按钮置灰不可发起
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
  - env-gate overall=pass（start_disabled_default=pass）
  - 已进入培育页且停留「条件筛选推荐」Tab
  - 三选择器与快捷标签均未设置（脏会话先 goto 重置）
locators:
  start: button「开始分析」disabled
  empty_hint: 请设置条件并执行推荐分析
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 保持全部条件未设，浏览开始分析按钮
expect:
  - note: 「开始分析」呈置灰禁用态不可发起任务
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(() => false); if (v) { await closeB.first().click(); await page.waitForTimeout(400) } }; await page.goto('http://10.50.69.111:30892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeVisible({ timeout: 8000 }); await expect(start).toBeDisabled({ timeout: 8000 })
  - note: 页面不显示默认名单或演示分数
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack'); await expect(stack.getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 8000 }); const t = await stack.innerText(); if (/共分析\s*\d+\s*家|培育推荐指数\s*\d/.test(t) && !/请设置条件/.test(t)) throw new Error('未见引导却出现名单/分数')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 默认态结果区文案「请设置条件并执行推荐分析」；演示数据角标属壳层 observed，不当本条失败。env-gate overall=pass、start_disabled_default=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
