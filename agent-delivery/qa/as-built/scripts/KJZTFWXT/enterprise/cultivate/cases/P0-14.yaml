id: P0-14
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01016
priority: P0
title: 企业详情呈现发展瓶颈到所需支持链路
story: US-ENT-RECRUIT-C2
entry_id: ent-cultivate
preconditions:
- 已成功完成一次分析且名单非空
locators:
  detail: 企业详情抽屉/面板
steps:
- action: evaluate
  note: 点开名单任一企业行进入详情
expect:
- note: 详情含发展瓶颈、培育建议、所需支持的对应链路
  assert: |-
    const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!/排名|企业名称/.test(t) || /推荐分析失败|请设置条件/.test(t)) throw new Error('ALLOW_SKIP: 无成功名单可点详情'); const row = page.getByTestId('recruit-tab-stack').locator('tbody tr, .arco-table-body .arco-table-tr').first(); if (!(await row.count())) throw new Error('ALLOW_SKIP: 无行'); await row.click({ timeout: 8000 }); await page.waitForTimeout(1200); const body = await page.locator('.arco-drawer, [class*=detail], body').first().innerText(); if (!/发展瓶颈|培育建议|所需支持/.test(body)) throw new Error('ALLOW_SKIP: 详情未见三维链路文案（字段形态 observed）')
- note: 详情说明所需支持可作定制一企一策的依据且不在本模块生成政策方案或服务工单
  assert: |-
    const body = await page.locator('body').innerText(); if (/提交工单|生成政策方案|创建服务工单/.test(body)) throw new Error('越界生成工单/政策方案'); /* 一企一策依据说明形态 observed */
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 依赖成功名单/详情渲染
as_built_note: 完整定制载体在模块外；关闭抽屉用 .arco-drawer-close-btn（P8）。
tier: B
