id: FUNC-02197
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02197
priority: P1
tier: B
title: 企业排名表列出排名至操作的七列表头
entry_id: ent-cultivate
preconditions:
  - 已有培育推荐分析结果
  - 停在企业排名
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 用例册02188条件筛选或02210恢复结果，到达培育推荐分析成功结果
expect:
  - note: 1、列含排名、企业名称、产业类别、企业规模、发展瓶颈、培育推荐指数、操作
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const openRecentTab = async () => {
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        } else {
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/恢复结果/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染');
      };
      const tryRestoreCompleted = async () => {
        await openRecentTab();
        await waitHistoryShell();
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && !/失败|已取消/.test(txt)) {
            await btn.scrollIntoViewIfNeeded();
            await btn.click({ timeout: 15000 });
            return true;
          }
        }
        return false;
      };
      const waitResultShell = async (timeoutMs = 120000) => {
        const title = () => stack().getByText('培育推荐分析结果').first();
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          const titleVis = await title().isVisible().catch(() => false);
          if (titleVis && !/可视化分析过程/.test(last)) return last;
          if (/已打开今天相同条件的推荐分析结果/.test(last) && titleVis) return last;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001');
          }
        }
        if (/可视化分析过程/.test(last)) {
          throw new Error('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001');
        }
        throw new Error('未在超时内到达培育推荐分析结果');
      };
      const selectIndustry = async (name) => {
        const optSel = '.arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: name }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      const runFilterAnalysis = async (industry) => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(500);
        await waitFilterReady();
        await selectIndustry(industry);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        return await waitResultShell();
      };
      const ensureSuccessResult = async () => {
        await dismissBasket();
        await expect(stack()).toBeVisible({ timeout: 15000 });
        if (/analysis_view=result/.test(page.url())) {
          try {
            const body0 = await waitResultShell(45000);
            if (/培育推荐分析结果/.test(body0)) return body0;
          } catch (e) {
            const msg0 = String(e.message || e);
            if (msg0.includes('ENV-CULTIVATE-ANALYSIS-FAIL-001')) {
              /* fall through to restore / retry industries */
            } else if (msg0.includes('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001')) {
              throw e;
            }
          }
        }
        let body = await stack().innerText().catch(() => '');
        if (/培育推荐分析结果/.test(body) && /排名/.test(body) && /企业名称/.test(body)) return body;
        if (await tryRestoreCompleted().catch(() => false)) {
          try {
            body = await waitResultShell(60000);
            if (/培育推荐分析结果/.test(body)) return body;
          } catch (e) {
            if (!String(e.message || e).includes('ENV-CULTIVATE-ANALYSIS-FAIL-001')) throw e;
          }
        }
        const industries = ['集成电路', '生物医药', '人工智能', '新能源', '低空经济', '量子信息', '海洋经济', '智能机器人'];
        let lastErr = '';
        for (const ind of industries) {
          try {
            body = await runFilterAnalysis(ind);
            if (/培育推荐分析结果/.test(body)) return body;
          } catch (e) {
            lastErr = String(e.message || e);
            if (lastErr.includes('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001')) throw e;
            if (lastErr.includes('ENV-CULTIVATE-ANALYSIS-FAIL-001')) continue;
          }
        }
        throw new Error(lastErr || 'ENV-CULTIVATE-ANALYSIS-FAIL-001');
      };
      let body;
      try {
        body = await ensureSuccessResult();
      } catch (e) {
        const msg = String(e.message || e);
        if (msg.includes('ENV-CULTIVATE-ANALYSIS-FAIL-001')) {
          throw new Error('修订 blocked：无法到达培育推荐成功结果页以验表头（ENV-CULTIVATE-ANALYSIS-FAIL-001）');
        }
        if (msg.includes('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001')) {
          throw new Error('修订 blocked：发起后长期停可视化分析过程（ENV-CULTIVATE-ASYNC-NO-SUCCESS-001）');
        }
        throw e;
      }
      await expect(stack().getByText('培育推荐分析结果').first()).toBeVisible({ timeout: 10000 });
      const rankTab = stack().getByRole('tab', { name: '企业排名' });
      if (await rankTab.count()) {
        const vis = await rankTab.first().isVisible().catch(() => false);
        if (vis) await rankTab.first().click({ timeout: 5000 }).catch(() => {});
      }
      const headers = ['排名', '企业名称', '产业类别', '企业规模', '发展瓶颈', '培育推荐指数', '操作'];
      for (const name of headers) {
        const th = stack().locator('th').filter({ hasText: name }).first();
        await expect(th).toBeVisible({ timeout: 10000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
