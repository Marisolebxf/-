id: FUNC-02212
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02212
priority: P1
tier: B
title: 创建 PDF 报告直到产物就绪并可下载
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册02188到达培育推荐分析结果后点「创建 / 查看 PDF 报告」并等待弹窗结束（机检在 expect）
expect:
  - note: 1、弹窗标题为「推荐结果输出任务」
    assert: |-
      const REPORT_STAGES = ['提交输出任务', '组装结果快照', '生成报告产物', '可下载归档'];
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const outputModal = () =>
        page.locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal').filter({ hasText: '推荐结果输出任务' }).last();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const ensureCultivation = async () => {
        const heading = page.getByRole('heading', { name: '培育企业推荐分析' });
        const onCultivation = async () =>
          (await heading.isVisible().catch(() => false)) &&
          (await page.locator('main input[placeholder="全部产业类别"]').count()) > 0;
        if (!(await onCultivation())) {
          await page.getByRole('menuitem', { name: '培育企业推荐分析' }).click({ timeout: 15000 });
          await expect(heading).toBeVisible({ timeout: 20000 });
          await expect(page.locator('main input[placeholder="全部产业类别"]').first()).toBeVisible({
            timeout: 15000,
          });
        }
        const tab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
        if ((await tab.getAttribute('aria-selected')) !== 'true') {
          await tab.click({ timeout: 8000 });
        }
      };
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        const titleVis = await stack().getByText('培育推荐分析结果').first().isVisible().catch(() => false);
        return titleVis && !/可视化分析过程/.test(t);
      };
      const waitResultShell = async (timeoutMs = 120000) => {
        const title = () => stack().getByText('培育推荐分析结果').first();
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          const titleVis = await title().isVisible().catch(() => false);
          if (titleVis && !/可视化分析过程/.test(last)) return last;
          if (/已打开今天相同条件的推荐分析结果/.test(last) && titleVis) return last;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001');
          }
          const viewResult = stack().getByRole('button', { name: '查看结果' }).first();
          if (await viewResult.isVisible().catch(() => false)) {
            await viewResult.click({ timeout: 5000 }).catch(() => {});
          }
        }
        if (/可视化分析过程/.test(last) || page.url().includes('analysis_view=processing')) {
          throw new Error('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001');
        }
        throw new Error('未在超时内到达培育推荐分析结果: ' + last.slice(0, 200));
      };
      const tryRestoreCompletedFilter = async () => {
        const tab = page.getByRole('tab', { name: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            await waitResultShell(60000);
            return await isSuccessResult();
          }
        }
        return false;
      };
      const runFilterAnalysis = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        const main = page.locator('main').first();
        const selectView = main.locator('input[placeholder="全部产业类别"]').locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
        await selectView.click({ timeout: 8000 });
        const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        const start = main.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitResultShell();
      };
      const pickPdfCta = async () => {
        const st = stack();
        const dataBtn = st.locator('[data-recruit-open-pdf-report]').first();
        if ((await dataBtn.count()) && (await dataBtn.isVisible().catch(() => false))) return dataBtn;
        const named = st.getByRole('button', { name: /创建\s*\/\s*查看\s*PDF\s*报告/ }).first();
        if ((await named.count()) && (await named.isVisible().catch(() => false))) return named;
        return null;
      };
      const waitPdfTaskReady = async (modal, rounds = 36) => {
        for (let i = 0; i < rounds; i++) {
          const body = await modal.innerText().catch(() => '');
          if (/报告生成失败|创建报告任务失败/.test(body) && !/报告产物已就绪/.test(body)) {
            throw new Error('PDF 输出任务失败: ' + body.slice(0, 220));
          }
          const dl = modal.getByRole('button', { name: '下载产物' });
          const pdf = modal.getByRole('button', { name: '查看 PDF' });
          if ((await dl.count()) && (await pdf.count())) {
            if ((await dl.first().isVisible().catch(() => false)) && (await pdf.first().isVisible().catch(() => false))) {
              return;
            }
          }
          await page.waitForTimeout(2500);
        }
        throw new Error('推荐结果输出任务超时未就绪');
      };
      await dismissBasket();
      await ensureCultivation();
      await expect(stack()).toBeVisible({ timeout: 15000 });
      if (!(await isSuccessResult())) {
        if (!(await tryRestoreCompletedFilter())) {
          await runFilterAnalysis();
        }
      }
      if (!(await isSuccessResult())) {
        throw new Error('修订 已发起仍为空结果壳');
      }
      const pdfBtn = await pickPdfCta();
      if (!pdfBtn) throw new Error('结果区无「创建 / 查看 PDF 报告」');
      await expect(pdfBtn).toBeEnabled({ timeout: 8000 });
      await pdfBtn.click({ timeout: 10000 });
      const modal = outputModal();
      await expect(modal).toBeVisible({ timeout: 15000 });
      await expect(modal).toContainText('推荐结果输出任务', { timeout: 8000 });
      await waitPdfTaskReady(modal);
      globalThis.__func02212 = { modal, REPORT_STAGES };
  - note: 2、阶段含提交输出任务、组装结果快照、生成报告产物、可下载归档
    assert: |-
      const ctx = globalThis.__func02212;
      if (!ctx?.modal) throw new Error('前置：未完成 PDF 输出任务弹窗');
      for (const stage of ctx.REPORT_STAGES) {
        await expect(ctx.modal.getByText(stage, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
  - note: 3、就绪后出现「下载产物」和「查看 PDF」
    assert: |-
      const ctx = globalThis.__func02212;
      if (!ctx?.modal) throw new Error('前置：未完成 PDF 输出任务弹窗');
      await expect(ctx.modal.getByRole('button', { name: '下载产物' }).first()).toBeVisible({ timeout: 8000 });
      await expect(ctx.modal.getByRole('button', { name: '查看 PDF' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
