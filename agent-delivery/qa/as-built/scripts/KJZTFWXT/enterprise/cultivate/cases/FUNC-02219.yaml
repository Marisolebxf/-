id: FUNC-02219
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02219
priority: P1
tier: B
title: 全选当前筛选结果后已选等于当前筛选家数
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 1.点「全选当前筛选结果」（前置与点击在 expect 1 执行）
expect:
  - note: 1、已选家数等于当前筛选家数
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const parseFiltered = (text) => {
        const m = text.match(/当前筛选\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const parseSelected = (text) => {
        const m = text.match(/已选\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const hasRankingTable = (text) =>
        /培育推荐分析结果/.test(text) && /排名/.test(text) && (parseFiltered(text) ?? 0) >= 1;
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          if (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染');
      };
      const waitResultShell = async (timeoutMs = 120000) => {
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          if (/培育推荐分析结果/.test(last) && !/可视化分析过程/.test(last) && hasRankingTable(last)) return last;
          if (/已打开今天相同条件的推荐分析结果/.test(last) && hasRankingTable(last)) return last;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001');
          }
        }
        if (/可视化分析过程/.test(last)) throw new Error('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001');
        throw new Error('未到达成功结果');
      };
      const restoreFromHistory = async () => {
        await waitFilterReady();
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) > 0) await tab.click({ timeout: 8000 });
        else await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const st = stack();
        const restore = st.getByRole('button', { name: '恢复结果' });
        const n = await restore.count();
        for (let i = 0; i < n; i++) {
          const btn = restore.nth(i);
          const row = btn.locator('xpath=ancestor::tr[1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /条件筛选/.test(txt) && /已完成|成功/.test(txt)) {
            await btn.click({ timeout: 15000 });
            await waitResultShell(60000);
            return true;
          }
        }
        return false;
      };
      const run02188 = async () => {
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await waitFilterReady();
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
        await page.locator(optSel).filter({ hasText: '人工智能' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitResultShell();
      };
      await expect(stack()).toBeVisible({ timeout: 15000 });
      let body = await stack().innerText().catch(() => '');
      if (!hasRankingTable(body)) {
        const ok = await restoreFromHistory().catch(() => false);
        if (!ok) await run02188();
        body = await stack().innerText().catch(() => '');
      }
      const filtered = parseFiltered(body);
      if (filtered === null || filtered < 1) {
        throw new Error('前置未满足：当前筛选不少于 1 家');
      }
      const st = stack();
      const clear = st.getByRole('button', { name: '取消选择', exact: true }).first();
      if (await clear.count() && !(await clear.isDisabled())) {
        await clear.click({ timeout: 8000 });
        await page.waitForTimeout(300);
      }
      const btn = st.getByRole('button', { name: /全选当前筛选结果/ }).first();
      await expect(btn).toBeVisible({ timeout: 8000 });
      await btn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      body = await st.innerText().catch(() => '');
      const selected = parseSelected(body);
      if (selected === null) throw new Error('全选后未见已选计数');
      if (selected !== filtered) {
        throw new Error('已选 ' + selected + ' 家，当前筛选 ' + filtered + ' 家，应相等');
      }
  - note: 2、文案仍写明支持跨页
    assert: |-
      const st = page.getByTestId('recruit-tab-stack');
      await expect(st.getByText(/已选\s*\d+\s*家（支持跨页）/).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
