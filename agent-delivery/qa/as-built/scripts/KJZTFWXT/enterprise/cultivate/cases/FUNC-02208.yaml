id: FUNC-02208
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02208
priority: P0
title: 候选工作台勾选企业进入指定对象模型参数配置
story: US-ENT-RECRUIT-L1
entry_id: ent-cultivate
tier: A
preconditions:
  - 候选名单非空（assert 自含对比篮/企业查询加入培育候选兜底）
locators:
  cand_route: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates
  cand_tab: tab「候选工作台」
  review_btn: button「执行指定对象复核」
  config_panel: data-testid=specified-review-config
steps:
  - action: goto
    target: /
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates
  - action: evaluate
    note: 勾选 1 家→执行指定对象复核（参数页断言在 expect）
expect:
  - note: 1、出现「指定对象模型参数配置」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute = '/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const isCandidateWorkspace = async () => {
        if (!(await candTab().count())) return false;
        return (await candTab().getAttribute('aria-selected').catch(() => '')) === 'true';
      };
      const openCandidateTab = async () => {
        if (await isCandidateWorkspace()) return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if (!(await isCandidateWorkspace())) {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if (!(await isCandidateWorkspace())) {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const actionBar = () => stack().getByTestId('candidate-action-bar');
      const rowCount = async () => stack().locator('.arco-table-body .arco-table-tr').count();
      const hasCandidatePanel = async () => {
        const bar = actionBar();
        return (await bar.count()) > 0 && (await bar.first().isVisible().catch(() => false));
      };
      const ensureOneCandidate = async () => {
        await openCandidateTab();
        if (await hasCandidatePanel()) return;
        if ((await rowCount()) > 0 && (await page.getByRole('button', { name: '执行指定对象复核' }).count())) return;
        const tryBasket = async () => {
          const dock = page.getByRole('button', { name: /打开对比篮/ });
          if (!(await dock.count())) return false;
          await dock.first().click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const addC = page.getByRole('button', { name: '加入培育候选' });
          if (!(await addC.count())) return false;
          const sels = page.locator('[aria-label^="选择 "]');
          if (await sels.count()) await sels.first().click();
          await page.waitForTimeout(400);
          if (!(await addC.first().isEnabled())) return false;
          await addC.first().click({ timeout: 8000 });
          await page.waitForTimeout(1000);
          await page.keyboard.press('Escape').catch(() => {});
          return true;
        };
        if (await tryBasket()) {
          await openCandidateTab();
          if (await hasCandidatePanel()) return;
        }
        await page.goto(toUrl(searchRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const addOpt = page.getByText('加入培育候选', { exact: true }).first();
        if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if (!(await hasCandidatePanel()) && (await rowCount()) === 0) {
          const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
          throw new Error('环境闸门 ENV-CULTIVATE-CANDIDATE-EMPTY：候选工作台无企业: ' + txt.slice(0, 160));
        }
      };
      const parseSelectedCount = (t) => {
        const m = (t || '').replace(/\s+/g, ' ').match(/已选\s*(\d+)\s*家/);
        return m ? Number(m[1]) : -1;
      };
      const selectFirstCandidateRow = async () => {
        await expect(actionBar()).toBeVisible({ timeout: 10000 });
        for (let attempt = 0; attempt < 4; attempt++) {
          const cb = stack().locator('.arco-table-body .arco-table-tr .arco-checkbox').first();
          if (await cb.count()) {
            const checked = (await cb.getAttribute('class'))?.includes('arco-checkbox-checked');
            if (!checked) await cb.click({ timeout: 8000 });
          } else {
            const row = stack().locator('.arco-table-tr:has(.arco-table-td)').first();
            await row.locator('.arco-checkbox, input[type=checkbox]').first().click({ timeout: 8000 }).catch(() => {});
          }
          await page.waitForTimeout(700);
          const n = parseSelectedCount(await actionBar().innerText().catch(() => ''));
          if (n === 1) return;
        }
        throw new Error('勾选首行后已选仍为 ' + parseSelectedCount(await actionBar().innerText().catch(() => '')));
      };
      await dismissBasket();
      await ensureOneCandidate();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({ timeout: 10000 });
      await selectFirstCandidateRow();
      const review = actionBar().getByRole('button', { name: '执行指定对象复核' }).first();
      await expect(review).toBeEnabled({ timeout: 8000 });
      await review.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const config = page.getByTestId('specified-review-config');
      await expect(config).toBeVisible({ timeout: 12000 });
      await expect(page.getByText('指定对象模型参数配置', { exact: false }).first()).toBeVisible({ timeout: 8000 });
  - note: 2、写出本次已选家数
    assert: |-
      const config = page.getByTestId('specified-review-config');
      await expect(config).toBeVisible({ timeout: 8000 });
      const t = ((await config.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!/本次已选\s*1\s*家/.test(t)) {
        throw new Error('配置页未见「本次已选 1 家」，observed=' + t.slice(0, 180));
      }
      const tag = page.locator('[data-testid="specified-review-config"]').locator('xpath=ancestor::*[contains(@class,"arco-card") or contains(@class,"section")][1]').getByText(/已选\s*1\s*家/).first();
      if (!(await tag.count())) {
        const extra = await page.getByText(/已选\s*1\s*家/).first().isVisible().catch(() => false);
        if (!extra) throw new Error('标题区亦未见已选 1 家 tag');
      }
  - note: 3、有「返回候选列表」和「开始分析」
    assert: |-
      const config = page.getByTestId('specified-review-config');
      await expect(config).toBeVisible({ timeout: 8000 });
      const back = config.getByRole('button', { name: '返回候选列表' }).first();
      const start = config.getByRole('button', { name: '开始分析' }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
      await expect(start).toBeVisible({ timeout: 8000 });
      await expect(start).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path + workspace=cultivation&recommendation_tab=cultivation&entry=candidates。步骤=勾选 1 家→执行指定对象复核→参数配置页（不测成功结果，对齐用例备注与 02245）。前置兜底=对比篮/企业查询「加入培育候选」。D4·2026-10-20 rewrite-FUNC-02208 svcz 3/3 expect 绿；候选空→ ENV-CULTIVATE-CANDIDATE-EMPTY。登录与关评审由 runner 前置。A 档零 allow_skip。
