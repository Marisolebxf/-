id: FUNC-02218
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02218
priority: P1
tier: B
title: 企业排名勾选、加入对比篮与取消选择
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 到达培育推荐分析结果并执行勾选与对比篮操作（机检在 expect）
expect:
  - note: 1、勾选后已选为 1 家且「加入对比篮」可点
    assert: |-
      await page.goto('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', {
        waitUntil: 'domcontentloaded',
      });
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack()).toBeVisible({ timeout: 15000 });
      await expect(page.getByRole('heading', { name: '培育企业推荐分析' })).toBeVisible({ timeout: 15000 });
      const main = stack();
      const tab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
      if ((await tab.getAttribute('aria-selected')) !== 'true') {
        await tab.click({ timeout: 8000 });
      }
      await page.keyboard.press('Escape').catch(() => {});
      const title = () => stack().getByText('培育推荐分析结果').first();
      let onResult = await title().isVisible().catch(() => false);
      if (!onResult) {
        const selectView = main.locator('input[placeholder="全部产业类别"]').locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
        await selectView.click({ timeout: 8000 });
        const opt = page.locator('.arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        const start = main.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 8000 });
        for (let i = 0; i < 60; i++) {
          await page.waitForTimeout(i === 0 ? 800 : 2500);
          const last = await stack().innerText().catch(() => '');
          if (await title().isVisible().catch(() => false) && !/可视化分析过程/.test(last)) break;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001：无法到达培育推荐分析结果');
          }
          const viewResult = stack().getByRole('button', { name: '查看结果' }).first();
          if (await viewResult.isVisible().catch(() => false)) {
            await viewResult.click({ timeout: 5000 }).catch(() => {});
          }
        }
        await expect(title()).toBeVisible({ timeout: 8000 });
      }
      const row = stack().locator('.arco-table tbody tr').first();
      await expect(row).toBeVisible({ timeout: 8000 });
      const rowCheckbox = row.locator('.arco-checkbox').first();
      await rowCheckbox.click({ timeout: 8000 });
      const body = await stack().innerText().catch(() => '');
      if (!/已选\s*1\s*家/.test(body)) {
        throw new Error('勾选后未见已选 1 家: ' + body.slice(0, 200));
      }
      const addBtn = stack().getByRole('button', { name: '加入对比篮' }).first();
      await expect(addBtn).toBeEnabled({ timeout: 8000 });
      globalThis.__func02218 = { addBtn: true };
  - note: 2、出现已加入对比篮的提示
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      if (!globalThis.__func02218) throw new Error('前置：未完成勾选');
      const addBtn = stack().getByRole('button', { name: '加入对比篮' }).first();
      await addBtn.click({ timeout: 8000 });
      const msg = page.locator('.arco-message, .arco-notification').filter({ hasText: /对比篮/ }).first();
      await expect(msg).toBeVisible({ timeout: 10000 });
  - note: 3、取消选择后已选为 0 家且按钮再次不可点
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const cancelBtn = stack().getByRole('button', { name: '取消选择' }).first();
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const body = await stack().innerText().catch(() => '');
      if (!/已选\s*0\s*家/.test(body)) {
        throw new Error('取消选择后未见已选 0 家: ' + body.slice(0, 200));
      }
      const addBtn = stack().getByRole('button', { name: '加入对比篮' }).first();
      await expect(addBtn).toBeDisabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
