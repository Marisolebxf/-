id: FUNC-02244
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02244
priority: P1
title: 异常-继续查看已取消任务
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析有状态为已取消的任务（assert 自含：无则选产业发起分析并点「取消任务」造数）
locators:
  recent_tab: tab「最近分析」
  continue_btn: button「继续查看」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 最近分析→已取消行点「继续查看」；失败页与条件区断言在 expect
expect:
  - note: 1、标题为「推荐分析失败」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const extractConditionHint = (rowText) => {
        const parts = rowText.replace(/\s+/g, ' ').trim().split(/\s+/);
        const tokens = [];
        for (const p of parts) {
          if (/^REC-/.test(p) || p === '已取消' || p === '失败' || p === '已完成') continue;
          if (/^\d{4}-\d{2}-\d{2}/.test(p)) continue;
          if (p.length >= 2 && !/^继续查看|按此配置新建|查看 HTML 报告|删除$/.test(p)) tokens.push(p);
        }
        const joined = rowText.replace(/\s+/g, ' ');
        const m = joined.match(/条件筛选[^·]*·([^·]+(?:·[^·]+)?)/);
        if (m) return m[1].trim();
        const industry = joined.match(/(人工智能|集成电路|生物医药|新能源|低空经济|量子信息|海洋经济|智能机器人)/);
        if (industry) return industry[1];
        return tokens.slice(0, 4).join(' ') || joined.slice(0, 60);
      };
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const openFilterTab = async () => {
        const tab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
        await expect(tab).toBeVisible({ timeout: 10000 });
        if ((await tab.getAttribute('aria-selected')) !== 'true') {
          await tab.click({ timeout: 8000 });
          await page.waitForTimeout(500);
        }
      };
      const pickIndustryAi = async () => {
        await openFilterTab();
        const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first();
        await ind.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await page.locator(optSel).filter({ hasText: '人工智能' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(600);
      };
      const clickCancelAsap = async () => {
        return page.evaluate(() => {
          return new Promise((resolve) => {
            const failedUi = () => {
              const t = document.body.innerText || '';
              return /推荐分析失败|任务失败|分析失败/.test(t) && !/取消任务/.test(t);
            };
            const tryClick = () => {
              if (failedUi()) {
                resolve('failed');
                return true;
              }
              const btn = Array.from(document.querySelectorAll('button')).find((b) =>
                /取消任务/.test((b.textContent || '').trim()),
              );
              if (btn) {
                btn.click();
                resolve('ok');
                return true;
              }
              return false;
            };
            if (tryClick()) return;
            const deadline = Date.now() + 90000;
            const obs = new MutationObserver(() => { tryClick(); });
            obs.observe(document.body, { childList: true, subtree: true });
            const tick = setInterval(() => {
              if (tryClick()) {
                clearInterval(tick);
                obs.disconnect();
              } else if (Date.now() > deadline) {
                clearInterval(tick);
                obs.disconnect();
                resolve('timeout');
              }
            }, 40);
          });
        });
      };
      const seedCancelledHistoryRow = async () => {
        await openFilterTab();
        await pickIndustryAi();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        const cancelRace = clickCancelAsap();
        await start.click({ timeout: 10000 });
        await page.waitForTimeout(400);
        const cancelResult = await cancelRace;
        if (cancelResult === 'failed') {
          throw new Error('D3:造数时任务无 running 窗口即失败（ENV-CULTIVATE-PROCESS-WINDOW-001）');
        }
        if (cancelResult === 'timeout') {
          throw new Error('ENV-CULTIVATE-PROCESS-WINDOW-001: 造数 90s 内未点到「取消任务」');
        }
        await page.waitForTimeout(1200);
        await openRecentTab();
        await waitHistoryShell();
      };
      const pickCancelledContinue = async () => {
        const st = stack();
        const rows = st.locator('.arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const txt = await row.innerText().catch(() => '');
          if (!txt || !/已取消/.test(txt)) continue;
          const condHint = extractConditionHint(txt) || '人工智能';
          const btn = row.getByRole('button', { name: '继续查看' }).first();
          if ((await btn.count()) < 1) continue;
          await row.scrollIntoViewIfNeeded();
          await btn.click({ timeout: 15000 });
          await page.waitForTimeout(900);
          return { rowHint: txt.slice(0, 80), condHint };
        }
        return null;
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/enterprise\/attraction/);
      await expect(page).toHaveURL(/workspace=cultivation/);
      await openRecentTab();
      await waitHistoryShell();
      let picked = await pickCancelledContinue();
      if (!picked) {
        await seedCancelledHistoryRow();
        picked = await pickCancelledContinue();
      }
      if (!picked) {
        throw new Error(
          '环境闸门 ENV-CULTIVATE-NO-CANCELLED-HISTORY-001：造数后仍无「已取消」任务可点继续查看',
        );
      }
      await expect(stack().getByText('推荐分析失败', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      globalThis.__func02244 = picked;
  - note: 2、条件区仍显示该任务的条件
    assert: |-
      if (!globalThis.__func02244?.condHint) {
        throw new Error('前置未进入已取消失败页（ENV-CULTIVATE-NO-CANCELLED-HISTORY-001）');
      }
      const hint = globalThis.__func02244.condHint;
      const tab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
      if ((await tab.getAttribute('aria-selected')) !== 'true') {
        await tab.click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      const mainText = ((await page.locator('main').innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const indVal = page
        .locator('main .arco-select-view')
        .filter({ has: page.locator('input[placeholder="全部产业类别"]') })
        .first();
      await expect(indVal).toBeVisible({ timeout: 10000 });
      const tagText = ((await indVal.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const chips = hint.split(/[·、,，\s]+/).map((s) => s.trim()).filter((s) => s.length >= 2);
      const pool = tagText + ' ' + mainText;
      const hits = chips.filter((c) => pool.includes(c));
      if (hits.length < 1 && !/人工智能|集成电路|生物医药|新能源|低空经济|量子信息|海洋经济|智能机器人|候选工作台/.test(pool)) {
        throw new Error(
          '条件区未见任务条件摘要；hint=' + hint.slice(0, 80) + ' tag=' + tagText.slice(0, 80),
        );
      }
  - note: 3、有「返回配置」和「重试（保留条件）」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByRole('button', { name: '返回配置' }).first()).toBeVisible({ timeout: 8000 });
      await expect(stack().getByRole('button', { name: '重试（保留条件）' }).first()).toBeVisible({ timeout: 8000 });
      await expect(stack().getByRole('button', { name: '重试（保留条件）' }).first()).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation。步骤=最近分析「已取消」行「继续查看」（无行则 assert 自造：产业人工智能+开始分析+取消任务）→ RecruitWorkbench error a-result（title 推荐分析失败+条件区保留摘要+返回配置/重试保留条件）。无 Tab→ENV-CULTIVATE-NO-HISTORY-TAB-001；造数仍无已取消行→ENV-CULTIVATE-NO-CANCELLED-HISTORY-001。D4·2026-10-20 rewrite-FUNC-02244 svcz 3/3 expect 绿。登录与关评审由 runner 前置。B 档零 allow_skip。
