id: P1-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01028
priority: P1
title: 对比篮加入招引候选与加入培育候选落点相互隔离
story: US-ENT-RECRUIT-L1
entry_id: ent-cultivate
preconditions:
- 对比篮有企业
locators:
  add_c: 加入培育候选
  add_a: 加入招引候选
steps:
- action: evaluate
  note: 分别加入培育/招引后看培育候选工作台
expect:
- note: 加入培育候选的企业落入培育候选工作台
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); await page.waitForTimeout(500); const addC = page.getByRole('button', { name: '加入培育候选' }); const addA = page.getByRole('button', { name: '加入招引候选' }); await expect(addC).toBeVisible({ timeout: 8000 }); await expect(addA).toBeVisible({ timeout: 8000 }); if (await page.locator('[aria-label^="选择 "]').count()) await page.locator('[aria-label^="选择 "]').first().click({ force: true }); else if (await page.locator('.system-compare-panel .arco-checkbox').count()) await page.locator('.system-compare-panel .arco-checkbox').first().click({ force: true }); await page.waitForTimeout(300); if (await addC.isDisabled()) throw new Error('ALLOW_SKIP: 无法勾选篮内企业'); await addC.click({ timeout: 8000 }); await page.waitForTimeout(600); await page.getByRole('tab', { name: '候选工作台' }).click(); await page.waitForTimeout(800); const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!/待分析|对比篮|企业名称/.test(t)) throw new Error('培育候选未见记录')
- note: 加入招引候选的企业不落入培育候选工作台
  assert: |-
    const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }).catch(()=>{}); await page.waitForTimeout(400); const before = await page.getByTestId('recruit-tab-stack').innerText(); const addA = page.getByRole('button', { name: '加入招引候选' }); if (await page.locator('[aria-label^="选择 "]').count() >= 2) await page.locator('[aria-label^="选择 "]').nth(1).click({ force: true }); if (await addA.isDisabled()) throw new Error('ALLOW_SKIP: 无法勾选第二家做招引加入'); const nameGuess = '招引隔离探针'; await addA.click({ timeout: 8000 }); await page.waitForTimeout(600); await page.getByRole('tab', { name: '候选工作台' }).click(); await page.waitForTimeout(800); /* 招引工作台详验归招引册；本条只确认培育台不因招引按钮被污染为招引语义 */ const t = await page.getByTestId('recruit-tab-stack').innerText(); if (/招引候选工作台/.test(t) && !/人工线索候选工作台|培育/.test(t)) throw new Error('培育 Tab 被切到招引候选语义')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 篮内企业不足两家时 Pass-N/A
as_built_note: 招引工作台侧详验归 ent-attract；本册只验培育落点隔离。
tier: B
