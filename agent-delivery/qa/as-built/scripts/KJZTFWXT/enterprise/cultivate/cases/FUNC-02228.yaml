id: FUNC-02228
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02228
priority: P1
title: 备选-失败无HTML
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析有状态为失败的任务
locators:
  recent_tab: tab「最近分析」
  html_report_button: button「查看 HTML 报告」或 data-recruit-history-open-html-report
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 最近分析→失败行「查看 HTML 报告」禁用态在 expect 判定
expect:
  - note: 1、该按钮不可点
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const pickFailedRowHtmlReport = async () => {
        const st = stack();
        const rows = st.locator('.arco-table-tr');
        const n = await rows.count();
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          const txt = await row.innerText().catch(() => '');
          if (!txt || !/失败/.test(txt)) continue;
          const btn = row.locator('[data-recruit-history-open-html-report], button:has-text("查看 HTML 报告")').first();
          if ((await btn.count()) < 1) continue;
          await row.scrollIntoViewIfNeeded();
          const taskCell = row.locator('.arco-table-td').first();
          if (await taskCell.count()) {
            await taskCell.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
          return btn;
        }
        throw new Error(
          '环境闸门 ENV-CULTIVATE-NO-FAILED-HISTORY-001：最近分析无状态为「失败」的任务行（前置 1 不满足）',
        );
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/enterprise\/attraction/);
      await expect(page).toHaveURL(/workspace=cultivation/);
      await openRecentTab();
      await waitHistoryShell();
      const reportBtn = await pickFailedRowHtmlReport();
      await expect(reportBtn).toBeVisible({ timeout: 8000 });
      await expect(reportBtn).toBeDisabled({ timeout: 8000 });
      globalThis.__func02228 = { reportBtnDisabled: true };
  - note: 2、不打开培育推荐报告
    assert: |-
      if (!globalThis.__func02228?.reportBtnDisabled) {
        throw new Error('环境闸门 ENV-CULTIVATE-NO-FAILED-HISTORY-001（未找到失败行禁用按钮，报告断言跳过）');
      }
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      if (await reader.isVisible().catch(() => false)) {
        throw new Error('失败任务仍打开了培育推荐报告页，与用例预期不符');
      }
      const h1Report = page.locator('h1').filter({ hasText: '培育推荐报告' });
      if (await h1Report.first().isVisible().catch(() => false)) {
        throw new Error('页面出现「培育推荐报告」标题，与用例「不打开报告」不符');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation&entry=history。步骤=最近分析含「失败」状态行 data-recruit-history-open-html-report 禁用（对齐招引 01462·RecruitHistoryTable）。机检=button disabled + 无 SystemReportReader/h1「培育推荐报告」。无 Tab→ENV-CULTIVATE-NO-HISTORY-TAB-001；无失败行→ENV-CULTIVATE-NO-FAILED-HISTORY-001。登录与关评审由 runner 前置。B 档零 allow_skip。
