id: FUNC-02203
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02203
priority: P1
tier: B
title: 重新分析再跑一轮并在最近分析留下新的已完成任务
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: click
    target: 条件筛选推荐
  - action: click
    target: 全部产业类别
  - action: click
    target: 人工智能
  - action: click
    target: 按钮 开始分析
  - action: wait
    timeout_ms: 8000
    for: 分析过程
  - action: click
    target: 查看结果
  - action: assert_visible
    target: 培育推荐分析结果
  - action: click
    target: 按钮 重新分析
expect:
  - note: 1、先进入「可视化分析过程」
    assert: |-
      await expect(page.getByRole('heading', { name: '可视化分析过程' })).toBeVisible({ timeout: 30000 });
  - note: 2、结束后再次出现「培育推荐分析结果」
    assert: |-
      await expect(page.getByRole('heading', { name: '培育推荐分析结果' })).toBeVisible({ timeout: 180000 });
  - note: 3、最近分析新增一条已完成任务
    assert: |-
      await page.getByText('最近分析', { exact: true }).click();
      await expect(page.getByRole('heading', { name: '培育推荐 · 最近分析' })).toBeVisible();
      await expect(page.locator('main').locator('.arco-table-tr').filter({ hasText: '已完成' }).first()).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
