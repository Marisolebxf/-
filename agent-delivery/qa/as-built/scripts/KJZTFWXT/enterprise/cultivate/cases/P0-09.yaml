id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01008
priority: P0
title: 产业类别与企业规模选择器可展开选择且已选值回显不丢失
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
- 未设置任何条件
locators:
  industry: 全部产业类别
  size: 全部企业规模
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: evaluate
  note: 选产业类别与企业规模后再次展开产业类别
expect:
- note: 两选择器已选值在控件上正确回显
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first().click({ timeout: 8000 }); await page.waitForTimeout(400); const size = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部企业规模"]') }).first(); await size.click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '中型' }).first().click({ timeout: 8000 }); await page.waitForTimeout(500); await expect(page.locator('main .arco-select-view').filter({ hasText: '人工智能' }).first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('main .arco-select-view').filter({ hasText: '中型' }).first()).toBeVisible({ timeout: 8000 })
- note: 再次展开后已选项保持不丢失
  assert: |-
    const ind = page.locator('main .arco-select-view').filter({ hasText: /全部产业类别|人工智能/ }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(400); const selected = await page.locator('.arco-trigger-popup:visible .arco-select-option-selected, .arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).count(); await page.keyboard.press('Escape'); if (!selected && !(await page.locator('main .arco-select-view').filter({ hasText: '人工智能' }).count())) throw new Error('产业类别已选丢失')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 选择后不自动发起分析（顺带：开始分析仍须显式点）。
tier: B
