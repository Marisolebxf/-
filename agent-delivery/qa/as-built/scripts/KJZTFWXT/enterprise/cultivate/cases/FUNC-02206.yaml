id: FUNC-02206
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02206
priority: P1
tier: B
title: 主流程-候选下拉
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 培育企业推荐分析
  - action: wait
    target: |-
      await page.waitForURL(/workspace=cultivation/);
  - action: click
    target: 候选工作台
  - action: evaluate
    target: |-
      await expect(page.locator('main').getByText('人工线索候选工作台')).toBeVisible();
expect:
  - note: 全部产业现为 1 项「人工智能与应用」
    assert: |-
      const main = page.locator('main');
      await main.locator('.arco-select-view').filter({ hasText: '全部产业' }).first().click();
      const popup = page.locator('.arco-select-popup:visible');
      await expect(popup.getByText('人工智能与应用', { exact: true })).toBeVisible();
      await expect(popup.locator('.arco-select-option')).toHaveCount(1);
  - note: 全部规模现为 1 项「小型」
    assert: |-
      await page.keyboard.press('Escape');
      const main = page.locator('main');
      await main.locator('.arco-select-view').filter({ hasText: '全部规模' }).first().click();
      const popup = page.locator('.arco-select-popup:visible');
      await expect(popup.getByText('小型', { exact: true })).toBeVisible();
      await expect(popup.locator('.arco-select-option')).toHaveCount(1);
  - note: 空值不出现在选项里
    assert: |-
      const popup = page.locator('.arco-select-popup:visible');
      const texts = await popup.locator('.arco-select-option').allTextContents();
      for (const t of texts) {
        const s = t.trim();
        if (!s || s === '-' || s === '—' || s === 'null' || s === 'undefined') {
          throw new Error(`empty option: ${JSON.stringify(t)}`);
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
