id: FUNC-01022
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01022
priority: P1
tier: B
title: 备选-Tab 往返保留
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 同册02188前置：产业类别人工智能→开始分析→等待培育推荐分析结果
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      await expect(stack()).toBeVisible({ timeout: 15000 });
      await expect(page.getByRole('heading', { name: '培育企业推荐分析', level: 1 })).toBeVisible({ timeout: 15000 });
      await page.keyboard.press('Escape').catch(() => {});
      const industryInput = page.locator('input[placeholder="全部产业类别"]').first();
      await industryInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      const industryEcho = ((await opt.innerText().catch(() => '')) || '人工智能').trim();
      await opt.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click();
      const title = () => stack().getByText('培育推荐分析结果').first();
      let last = '';
      let ok = false;
      for (let i = 0; i < 60; i++) {
        await page.waitForTimeout(i === 0 ? 800 : 2500);
        last = await stack().innerText().catch(() => '');
        const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
        if (failVis && !/可视化分析过程/.test(last)) {
          throw new Error('条件筛选发起后进入推荐分析失败，无法构造前置成功结果');
        }
        const titleVis = await title().isVisible().catch(() => false);
        if (titleVis && !/可视化分析过程/.test(last)) {
          ok = true;
          break;
        }
        if (/已打开今天相同条件的推荐分析结果/.test(last) && titleVis) {
          ok = true;
          break;
        }
      }
      if (!ok) {
        throw new Error('未在超时内到达培育推荐分析结果: ' + last.slice(0, 200));
      }
      globalThis.__func01022 = { industryEcho, lastBody: last };
  - action: evaluate
    note: 1~3.三Tab往返（限定培育页签 tablist，避免误点侧栏招引）
    assert: |-
      const tablist = () => page.getByRole('tablist', { name: '培育企业推荐分析页签' });
      await expect(tablist()).toBeVisible({ timeout: 8000 });
      await tablist().getByRole('tab', { name: '候选工作台' }).click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page.getByText('人工线索候选工作台').first()).toBeVisible({ timeout: 12000 });
      await expect(page).toHaveURL(/workspace=cultivation/);
      await tablist().getByRole('tab', { name: '最近分析' }).click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(page.getByText('培育推荐 · 最近分析').first()).toBeVisible({ timeout: 12000 });
      await expect(page).toHaveURL(/workspace=cultivation/);
      await tablist().getByRole('tab', { name: '条件筛选推荐' }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(tablist().getByRole('tab', { name: '条件筛选推荐' })).toHaveAttribute('aria-selected', 'true');
      await expect(page).toHaveURL(/workspace=cultivation/);
expect:
  - note: 1、三 Tab 均可往返进入且页面停留本路由无报错；
    assert: |-
      await expect(page).toHaveURL(/\/enterprise\/attraction/, { timeout: 15000 });
      await expect(page).toHaveURL(/workspace=cultivation/);
      await expect(page.getByRole('heading', { name: '培育企业推荐分析', level: 1 })).toBeVisible({ timeout: 15000 });
      const err = page.getByTestId('recruit-tab-stack').getByText('推荐分析失败').first();
      if (await err.isVisible().catch(() => false)) {
        throw new Error('主区出现推荐分析失败，Tab 往返后路由态异常');
      }
  - note: 2、返回后已设条件与结果状态保留
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByText('培育推荐分析结果').first()).toBeVisible({ timeout: 15000 });
      const body = await stack().innerText().catch(() => '');
      if (!/本次筛选/.test(body)) {
        throw new Error('返回条件筛选推荐后未见本次筛选，成功结果态未保留');
      }
      const ctx = globalThis.__func01022;
      const tokens = ['人工智能', ctx?.industryEcho].filter(Boolean);
      const tagAfter = await page
        .locator('input[placeholder="全部产业类别"]')
        .locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]')
        .innerText()
        .catch(() => '');
      if (tagAfter && tagAfter.length >= 2) tokens.push(tagAfter.trim());
      const hit = tokens.some((tok) => tok && tok.length >= 2 && (body.includes(tok) || tagAfter.includes(tok)));
      if (!hit) {
        throw new Error('返回后产业类别条件未保留；tokens=' + tokens.join('|'));
      }
on_fail: 截图 + 抄 X-Trace-Id
