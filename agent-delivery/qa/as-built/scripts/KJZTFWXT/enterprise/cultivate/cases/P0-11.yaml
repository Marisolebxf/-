id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01011
priority: P0
title: 设置任一条件后开始分析恢复可用且须显式发起
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
  - 当前无条件且开始分析置灰
  - env-gate overall=pass（选企业规模后开始分析可 enabled）
locators:
  start: button「开始分析」
  size: input[placeholder="全部企业规模"] → 中型
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 选企业规模「中型」后验开始分析 enabled，且未点不自动跑
expect:
  - note: 任一条件设置后「开始分析」恢复可用
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(() => false); if (v) { await closeB.first().click().catch(() => {}); await page.waitForTimeout(300) } }; const start = page.getByRole('button', { name: '开始分析' }).first(); await expect(start).toBeDisabled({ timeout: 8000 }); await page.keyboard.press('Escape').catch(() => {}); const sizeInput = page.locator('input[placeholder="全部企业规模"]').first(); const sizeView = sizeInput.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]'); await (await sizeView.count() ? sizeView : sizeInput).click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible').last().locator('.arco-select-option').filter({ hasText: /^中型$/ }).first().click({ force: true, timeout: 8000 }); await page.waitForTimeout(700); await page.keyboard.press('Escape').catch(() => {}); await expect(start).toBeEnabled({ timeout: 8000 })
  - note: 恢复可用后不自动执行分析须显式点击发起
    assert: |-
      await expect(page).not.toHaveURL(/analysis_view=processing/); const t = await page.getByTestId('recruit-tab-stack').innerText(); if (/可视化分析过程|排队中|任务提交/.test(t)) throw new Error('未点击开始分析却进入过程态'); if (!/请设置条件并执行推荐分析|推荐分析结果/.test(t)) throw new Error('期望仍停在配置/结果引导态，实际=' + t.slice(0, 200))
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 无独立快捷 chip，第三路「仅点快捷标签」改由企业规模下拉等价覆盖（与 01007 as-built 一致）；本条以选「中型」一路验收恢复可用+不自动跑。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进（0 缩进会截断 expect 致虚 pass）。
tier: A
