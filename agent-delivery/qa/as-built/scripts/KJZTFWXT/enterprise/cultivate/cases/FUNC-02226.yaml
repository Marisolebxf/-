id: FUNC-02226
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02226
priority: P1
title: 备选-最近分析翻页第二页
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析多于 10 条（pageSize=10）
locators:
  recent_tab: tab「最近分析」
  page2: .arco-pagination-item「2」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history
  - action: evaluate
    note: 最近分析→读表头与第 1 页任务名→点分页「2」；三条 expect 判定
expect:
  - note: 1、列名不变（翻页前后六列一致）
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const PAGE_SIZE = 10;
      const REQUIRED_HEADERS = ['任务名称', '条件摘要', '企业摘要', '创建时间', '状态', '操作'];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const historyPagination = () => stack().locator('.arco-pagination').first();
      const clickPageTwo = async () => {
        const pag = historyPagination();
        await expect(pag).toBeVisible({ timeout: 10000 });
        const page2Btn = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
        if ((await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false))) {
          await page2Btn.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        } else {
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if ((await next.count()) < 1 || !(await next.isVisible().catch(() => false))) return null;
          await next.click({ timeout: 8000 });
          await page.waitForTimeout(1200);
        }
        const activeText = ((await pag.locator('.arco-pagination-item-active').first().innerText()) || '').trim();
        if (activeText !== '2') {
          throw new Error('翻页后当前页应为 2，现场 active=' + (activeText || '(空)'));
        }
        return 'page2';
      };
      const readTableHeaders = async () => {
        const st = stack();
        const tbl = st.locator('.arco-table').first();
        if (await tbl.count()) {
          const ths = await tbl.locator('.arco-table-th').allInnerTexts();
          return ths.map((h) => h.replace(/\s+/g, ' ').trim()).filter(Boolean);
        }
        const t = await st.innerText({ timeout: 8000 });
        return REQUIRED_HEADERS.filter((c) => t.includes(c));
      };
      const readTotalFromPagination = async () => {
        const pg = historyPagination();
        if (!(await pg.count()) || !(await pg.isVisible().catch(() => false))) return null;
        const t = (await pg.innerText().catch(() => '')).replace(/\s+/g, ' ');
        const m = t.match(/共\s*(\d+)\s*条/);
        return m ? parseInt(m[1], 10) : null;
      };
      const readTaskNamesOnPage = async () => {
        const rows = stack().locator('table tbody tr, .arco-table-body .arco-table-tr');
        const n = await rows.count();
        const names = [];
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const txt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
          if (!txt || /暂无/.test(txt)) continue;
          const cells = txt.split('\t').map((c) => c.trim()).filter(Boolean);
          const name = cells[0] || txt.split(/\s+/).slice(0, 3).join(' ');
          if (name && !/^任务名称$/.test(name)) names.push(name);
        }
        return [...new Set(names)];
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/enterprise\/attraction/);
      await expect(page).toHaveURL(/workspace=cultivation/);
      await openRecentTab();
      await waitHistoryShell();
      await expect(stack().getByText('培育推荐 · 最近分析').first()).toBeVisible({ timeout: 10000 });
      const total = await readTotalFromPagination();
      if (total !== null && total <= PAGE_SIZE) {
        throw new Error(
          '数据闸门：最近分析共 ' + total + ' 条不大于单页 ' + PAGE_SIZE + '，无法验翻页（ticket=ENV-CULTIVATE-HISTORY-PAGE2-001）',
        );
      }
      const pag = historyPagination();
      const page2Btn = pag.locator('.arco-pagination-item').filter({ hasText: /^2$/ }).first();
      const hasPage2 = (await page2Btn.count()) > 0 && (await page2Btn.isVisible().catch(() => false));
      const hasNext =
        (await pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').count()) > 0;
      if (!hasPage2 && !hasNext) {
        if (total !== null && total > PAGE_SIZE) {
          throw new Error('产品异常：总数 ' + total + ' 超过单页但分页不可点（ticket=GAP-CULTIVATE-HISTORY-PAGINATION-001）');
        }
        throw new Error(
          '数据闸门：分页「2」不可见，最近分析未超过一页（ticket=ENV-CULTIVATE-HISTORY-PAGE2-001）',
        );
      }
      const hdrPage1 = await readTableHeaders();
      const missing = REQUIRED_HEADERS.filter((c) => !hdrPage1.includes(c));
      if (missing.length) {
        throw new Error('第 1 页表头缺列：' + missing.join('、') + '；现场=' + hdrPage1.join('|'));
      }
      globalThis.__func02226_hdr1 = hdrPage1;
      const namesPage1 = await readTaskNamesOnPage();
      if (!namesPage1.length) {
        throw new Error('第 1 页未见可读任务名称（ticket=ENV-CULTIVATE-HISTORY-001）');
      }
      globalThis.__func02226_names1 = namesPage1;
      const nav = await clickPageTwo();
      if (!nav) {
        throw new Error('数据闸门：无法翻到第 2 页（ticket=ENV-CULTIVATE-HISTORY-PAGE2-001）');
      }
      const hdrPage2 = await readTableHeaders();
      if (hdrPage2.length !== hdrPage1.length) {
        throw new Error('表头列数变化: 第1页' + hdrPage1.length + '列 vs 第2页' + hdrPage2.length + '列');
      }
      for (let i = 0; i < hdrPage1.length; i++) {
        if (hdrPage1[i] !== hdrPage2[i]) {
          throw new Error('表头第' + (i + 1) + '列不一致: 「' + hdrPage1[i] + '」 vs 「' + hdrPage2[i] + '」');
        }
      }
      globalThis.__func02226_page2 = true;
  - note: 2、第 2 页任务名称与第 1 页不重复
    assert: |-
      if (!globalThis.__func02226_page2) throw new Error('前置：未完成翻到第 2 页');
      const namesPage1 = globalThis.__func02226_names1 || [];
      const stack = () => page.getByTestId('recruit-tab-stack');
      const readTaskNamesOnPage = async () => {
        const rows = stack().locator('table tbody tr, .arco-table-body .arco-table-tr');
        const n = await rows.count();
        const names = [];
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const txt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
          if (!txt || /暂无/.test(txt)) continue;
          const cells = txt.split('\t').map((c) => c.trim()).filter(Boolean);
          const name = cells[0] || txt.split(/\s+/).slice(0, 3).join(' ');
          if (name && !/^任务名称$/.test(name)) names.push(name);
        }
        return [...new Set(names)];
      };
      const namesPage2 = await readTaskNamesOnPage();
      if (!namesPage2.length) throw new Error('第 2 页未见可读任务名称');
      const overlap = namesPage1.filter((n) => namesPage2.includes(n));
      if (overlap.length) {
        throw new Error('第 2 页与第 1 页任务名称重叠: ' + overlap.join(' | '));
      }
  - note: 3、仍可见候选工作台或条件筛选起源
    assert: |-
      if (!globalThis.__func02226_page2) throw new Error('前置：未完成翻到第 2 页');
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByText('培育推荐 · 最近分析').first()).toBeVisible({ timeout: 8000 });
      const bodyText = (await stack().innerText().catch(() => '')).replace(/\s+/g, ' ');
      if (!/候选工作台|条件筛选/.test(bodyText)) {
        throw new Error('第 2 页最近分析未见「候选工作台」或「条件筛选」起源文案');
      }
      const rows = stack().locator('table tbody tr, .arco-table-body .arco-table-tr');
      const n = await rows.count();
      let rowHit = false;
      for (let i = 0; i < n; i++) {
        const txt = (await rows.nth(i).innerText().catch(() => '')).replace(/\s+/g, ' ');
        if (/候选工作台|条件筛选/.test(txt)) {
          rowHit = true;
          break;
        }
      }
      if (!rowHit) {
        throw new Error('第 2 页可见行内未见候选工作台/条件筛选起源标记');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation&entry=history。步骤=最近分析点页码「2」（stack 内 .arco-pagination）。机检=六列表头翻页前后一致；第 2 页任务名与第 1 页不重复；行内可见候选工作台或条件筛选起源。共≤10 或无分页→ENV-CULTIVATE-HISTORY-PAGE2-001。D4·2026-10-20 rewrite-FUNC-02226 svcz 3/3 expect 绿。登录与关评审由 runner 前置。B 档零 allow_skip。
