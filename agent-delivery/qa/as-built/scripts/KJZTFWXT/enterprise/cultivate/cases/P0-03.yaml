id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01013
priority: P0
title: 显式发起培育推荐分析后到达成功态且过程有反馈
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
- 已设置一组常规条件（如产业类别「人工智能」）
locators:
  industry: select「全部产业类别」
  start: button「开始分析」
  process: 可视化分析过程 / 五阶段
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: click
  target: 产业类别下拉选人工智能
- action: click
  target: 开始分析
- action: wait
  for: 分析中过程反馈或终态
expect:
- note: 发起后进入分析中且结果区有过程反馈不白屏
  assert: |-
    const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first().click({ timeout: 8000 }); await page.waitForTimeout(600); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('条件已选但开始分析仍禁用'); await start.click(); await page.waitForTimeout(1500); const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!/分析中|可视化分析过程|任务提交|排队中|推荐分析失败|成功/.test(t)) throw new Error('发起后无过程反馈: ' + t.slice(0, 200))
- note: 完成后到达成功态并呈现本次结果
  assert: |-
    const t0 = Date.now(); let done = false; while (Date.now() - t0 < 60000) { const t = await page.getByTestId('recruit-tab-stack').innerText(); if (/推荐分析失败|任务执行失败/.test(t)) throw new Error('ALLOW_SKIP: 本环境任务失败无法到达成功态'); if (/成功/.test(t) || /培育推荐指数/.test(t) && /排名|企业名称/.test(t)) { done = true; break } if (!/分析中|可视化分析过程|排队中/.test(t) && /请设置条件/.test(t)) break; await page.waitForTimeout(2000) }; if (!done) throw new Error('ALLOW_SKIP: 等待成功态超时')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 本环境常见「推荐分析失败」→ Pass-N/A + observed；过程反馈条仍须通过第一期望
as_built_note: 实勘 2026-10-14 发起后 URL 含 analysis_view=processing→result，失败文案「推荐分析失败 / 任务执行失败」。
tier: A
