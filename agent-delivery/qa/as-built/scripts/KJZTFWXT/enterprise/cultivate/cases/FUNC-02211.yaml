id: FUNC-02211
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02211
priority: P1
tier: B
title: 最近分析恢复候选工作台已完成任务打开人工线索复核结果
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 培育企业推荐分析
  - action: wait
    ms: 800
  - action: evaluate
    note: 最近分析须有候选工作台且已完成行，点恢复结果
    script: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const dismissBasket = async () => {
        const close = page.locator('.arco-drawer-close-btn, [aria-label="Close"]').first();
        if (await close.isVisible().catch(() => false)) await close.click();
      };
      await dismissBasket();
      await page.waitForURL(/\/enterprise\/attraction/, { timeout: 15000 });
      await expect(stack()).toBeVisible({ timeout: 15000 });
      await stack().getByText('最近分析', { exact: true }).click();
      await expect(stack().getByText('培育推荐 · 最近分析').first()).toBeVisible({ timeout: 15000 });
      const completedCandidateRows = stack()
        .locator('.arco-table tbody tr')
        .filter({ hasText: '候选工作台' })
        .filter({ has: page.locator('.arco-tag', { hasText: '已完成' }) });
      if ((await completedCandidateRows.count()) === 0) {
        throw new Error(
          'BLOCKED:修订 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001 最近分析无候选工作台已完成任务',
        );
      }
      await completedCandidateRows.first().getByRole('button', { name: '恢复结果' }).click();
      const reviewTitle = stack().getByText('人工线索复核结果').first();
      const reviewVisible = await reviewTitle
        .waitFor({ state: 'visible', timeout: 30000 })
        .then(() => true)
        .catch(() => false);
      if (!reviewVisible) {
        const emptyShell = stack().getByText('请设置条件并执行推荐分析').first();
        if (await emptyShell.isVisible().catch(() => false)) {
          throw new Error(
            'BLOCKED:修订 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001 恢复后未出现人工线索复核结果',
          );
        }
        throw new Error('恢复结果后未出现人工线索复核结果');
      }
expect:
  - note: 1、标题为「人工线索复核结果」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByText('人工线索复核结果').first()).toBeVisible({ timeout: 15000 });
  - note: 2、有「返回候选列表」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByRole('button', { name: '返回候选列表' })).toBeVisible({ timeout: 15000 });
  - note: 3、没有「调整分析条件」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByRole('button', { name: '调整分析条件' })).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
