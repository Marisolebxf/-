id: FUNC-02211
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02211
priority: P0
title: 主流程-恢复结果（候选工作台起源）
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析有「候选工作台」且已完成的任务
locators:
  recent_tab: tab「最近分析」
  restore_button: button「恢复结果」
  result_heading: 文案「人工线索复核结果」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history
  - action: evaluate
    note: 最近分析→已完成候选工作台行「恢复结果」；三条 expect 判定结果页差异
expect:
  - note: 1、标题为「人工线索复核结果」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const pickCompletedCandidateRestore = async () => {
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        if (n < 1) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001：最近分析无「恢复结果」按钮（缺已完成候选工作台任务）',
          );
        }
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /候选工作台/.test(txt)) return btn;
        }
        throw new Error(
          '环境闸门 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001：最近分析无「已完成」的候选工作台任务可「恢复结果」',
        );
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/enterprise\/attraction/);
      await expect(page).toHaveURL(/workspace=cultivation/);
      await openRecentTab();
      await waitHistoryShell();
      const restoreBtn = await pickCompletedCandidateRestore();
      await restoreBtn.scrollIntoViewIfNeeded();
      await restoreBtn.click({ timeout: 15000 });
      let ok = false;
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(500);
        const t = await stack().innerText().catch(() => '');
        if (/人工线索复核结果/.test(t) && (/共分析|返回候选列表|排名/.test(t) || /搜索企业名称/.test(t))) {
          ok = true;
          break;
        }
      }
      if (!ok) {
        throw new Error('点击恢复结果后未打开「人工线索复核结果」，url=' + page.url());
      }
      await expect(stack().getByText(/人工线索复核结果/).first()).toBeVisible({ timeout: 10000 });
  - note: 2、有「返回候选列表」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const back = stack().getByRole('button', { name: '返回候选列表' }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
  - note: 3、没有「调整分析条件」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const adjust = stack().getByRole('button', { name: '调整分析条件' });
      const n = await adjust.count();
      if (n < 1) return;
      for (let i = 0; i < n; i++) {
        const vis = await adjust.nth(i).isVisible().catch(() => false);
        if (vis) throw new Error('人工线索复核结果页不应出现「调整分析条件」');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation&entry=history。步骤=最近分析点已完成「候选工作台」行「恢复结果」（历史成功恢复，非新发起）。机检三条 expect 对齐用例（人工线索复核结果/返回候选列表/无调整分析条件）。D4·2026-10-20 rewrite-FUNC-02211 svcz 机跑 fail·ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001（最近分析表 0 个「恢复结果」，无已完成候选工作台起源可点；expect①② 红、③ 绿因仍停最近分析页）。缺 Tab→ENV-CULTIVATE-NO-HISTORY-TAB-001。登录与关评审由 runner 前置。B 档零 allow_skip。
