id: FUNC-02224
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02224
priority: P1
tier: B
title: 备选-按此配置新建
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 培育企业推荐分析
  - action: wait
    for: 培育页渲染
    timeout_ms: 1500
  - action: click
    target: 最近分析
  - action: evaluate
    note: 同册02209已开最近分析；点已完成候选工作台行「按此配置新建」
expect:
  - note: 1、打开「人工线索候选工作台」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const pickCompletedCandidateClone = async () => {
        const st = stack();
        await expect(st.getByText('培育推荐 · 最近分析').first()).toBeVisible({ timeout: 15000 });
        const buttons = st.getByRole('button', { name: '按此配置新建' });
        const n = await buttons.count();
        if (n < 1) {
          throw new Error('修订 blocked：最近分析无「按此配置新建」');
        }
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /候选工作台/.test(txt)) {
            await btn.scrollIntoViewIfNeeded();
            await btn.click({ timeout: 15000 });
            await page.waitForTimeout(1200);
            return txt;
          }
        }
        throw new Error('修订 blocked：ENV-CULTIVATE-HISTORY-CANDIDATE-DONE-001 无已完成候选工作台行');
      };
      await pickCompletedCandidateClone();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({
        timeout: 12000,
      });
      globalThis.__func02224 = { t0: Date.now() };
  - note: 2、已选为 0 家
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const actionBar = () => stack().getByTestId('candidate-action-bar');
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({
        timeout: 8000,
      });
      const bar = actionBar();
      if (await bar.count()) {
        const barText = ((await bar.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = barText.match(/已选\s*(\d+)\s*家/);
        const selected = m ? Number(m[1]) : -1;
        if (selected !== 0) {
          throw new Error('已选应为 0 家，现场=' + selected);
        }
      } else {
        const t = await stack().innerText().catch(() => '');
        if (!/已选\s*0\s*家/.test(t.replace(/\s+/g, ' '))) {
          throw new Error('未见已选 0 家，主区=' + t.slice(0, 200));
        }
      }
  - note: 3、不出现可视化分析过程
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const stText = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(stText)) {
        throw new Error('不应出现「可视化分析过程」');
      }
      await page.waitForTimeout(2000);
      const stAfter = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(stAfter)) {
        throw new Error('等待 2s 后仍出现「可视化分析过程」');
      }
on_fail: 截图 + 抄 X-Trace-Id
