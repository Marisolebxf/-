id: FUNC-02215
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02215
priority: P1
tier: B
title: 调整分析条件后回到条件区且产业类别保留
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
expect:
  - note: 1、结果区回到「请设置条件并执行推荐分析」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const parseCounts = (text) => {
        const m = text.match(/共分析\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : 0;
      };
      const isSuccessResult = async () => {
        const t = await stack().innerText().catch(() => '');
        const url = page.url();
        return (
          parseCounts(t) >= 1 &&
          ((/培育推荐分析结果/.test(t) && !/可视化分析过程/.test(t)) || url.includes('analysis_view=result'))
        );
      };
      const enterCultivation = async () => {
        const link = page.getByRole('link', { name: '培育企业推荐分析' }).first();
        if (await link.isVisible().catch(() => false)) {
          await link.click({ timeout: 10000 });
        } else {
          await page.getByText('培育企业推荐分析', { exact: true }).first().click({ timeout: 10000 });
        }
        await page.waitForTimeout(800);
        await expect(page.getByText('培育企业推荐分析').first()).toBeVisible({ timeout: 10000 });
        await expect(page.locator('input[placeholder="全部产业类别"]').first()).toBeVisible({ timeout: 10000 });
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          if (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染');
      };
      const openRecentTab = async () => {
        await waitFilterReady();
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) > 0) await tab.click({ timeout: 8000 });
        else await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const tryRestoreCompletedFilter = async () => {
        await openRecentTab();
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /条件筛选/.test(txt)) {
            await btn.click({ timeout: 15000 });
            for (let j = 0; j < 24; j++) {
              await page.waitForTimeout(500);
              if (await isSuccessResult()) return true;
            }
            return false;
          }
        }
        return false;
      };
      const waitSuccessResult = async () => {
        let last = '';
        for (let i = 0; i < 48; i++) {
          await page.waitForTimeout(2500);
          last = await stack().innerText().catch(() => '');
          const url = page.url();
          if ((/培育推荐分析结果/.test(last) && !/可视化分析过程/.test(last)) || url.includes('analysis_view=result')) {
            if (parseCounts(last) >= 1) return;
          }
          if (/推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('BLOCKED:ENV-CULTIVATE-ANALYSIS-FAIL-001');
          }
        }
        if (/可视化分析过程/.test(last)) throw new Error('BLOCKED:ENV-CULTIVATE-ASYNC-NO-SUCCESS-001');
        throw new Error('未到达条件筛选成功结果');
      };
      const readIndustryView = async () => {
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        const wrap = i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
        return ((await wrap.innerText()) || '').replace(/\s+/g, ' ').trim();
      };
      const pickAiIndustry = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
      };
      const reachFilterSuccess = async () => {
        if (await isSuccessResult()) return;
        if (await tryRestoreCompletedFilter()) return;
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        await pickAiIndustry();
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitSuccessResult();
      };
      await expect(stack()).toBeVisible({ timeout: 15000 });
      await enterCultivation();
      await reachFilterSuccess();
      const industryBefore = await readIndustryView();
      if (!industryBefore || industryBefore === '全部产业类别') {
        throw new Error('成功结果前产业类别未选中');
      }
      const adjust = stack().getByRole('button', { name: '调整分析条件' }).first();
      await expect(adjust).toBeVisible({ timeout: 10000 });
      await adjust.click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const st = stack();
      await expect(st.getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 10000 });
      const body = await st.innerText().catch(() => '');
      if (/可视化分析过程/.test(body)) throw new Error('调整后仍停留在可视化分析过程');
      if (/培育推荐分析结果/.test(body) && !/请设置条件/.test(body)) {
        throw new Error('调整后仍为结果态');
      }
      globalThis.__func02215 = { industryBefore };
  - note: 2、产业类别仍显示调整前的选中值
    assert: |-
      const ctx = globalThis.__func02215;
      if (!ctx) throw new Error('未记录调整前产业类别');
      const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
      const i = page.locator('input[placeholder="全部产业类别"]').first();
      const wrap = i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
      const industryAfter = norm(await wrap.innerText());
      const before = norm(ctx.industryBefore);
      if (!industryAfter || industryAfter === '全部产业类别') {
        throw new Error('调整后产业类别被清空');
      }
      if (industryAfter !== before) {
        throw new Error('产业类别变化：前=' + before + ' 后=' + industryAfter);
      }
      await expect(page.getByRole('button', { name: '开始分析' }).first()).toBeEnabled({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id

