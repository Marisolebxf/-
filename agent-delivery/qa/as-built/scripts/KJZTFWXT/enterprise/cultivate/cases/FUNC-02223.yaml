id: FUNC-02223
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02223
priority: P1
tier: B
title: 主流程-按此配置新建（条件筛选起源）
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
expect:
  - note: 1、回到条件筛选推荐
    assert: |-
      const main = page.locator('main');
      await main.getByRole('tab', { name: '最近分析' }).click();
      let row = main.locator('tr').filter({ hasText: '已完成' }).filter({ hasText: '条件筛选' }).first();
      if ((await row.count()) === 0) {
        await main.getByRole('tab', { name: '条件筛选推荐' }).click();
        await main.locator('.arco-select-view').filter({ hasText: '全部产业类别' }).first().click();
        await page.getByRole('option', { name: '人工智能' }).click();
        await main.getByRole('button', { name: '开始分析' }).click();
        await expect(main.getByText('培育推荐分析结果')).toBeVisible({ timeout: 180000 });
        await main.getByRole('tab', { name: '最近分析' }).click();
        row = main.locator('tr').filter({ hasText: '已完成' }).filter({ hasText: '条件筛选' }).first();
      }
      await row.getByRole('button', { name: '按此配置新建' }).click();
      await expect(main.getByRole('tab', { name: '条件筛选推荐', selected: true })).toBeVisible();
  - note: 2、条件区带回该任务的产业类别
    assert: |-
      const main = page.locator('main');
      await expect(main.locator('.arco-select-view').filter({ hasText: '全部产业类别' })).toHaveCount(0);
      await expect(main.getByRole('button', { name: '开始分析' })).toBeEnabled();
  - note: 3、结果区为「请设置条件并执行推荐分析」
    assert: |-
      await expect(page.locator('main').getByText('请设置条件并执行推荐分析')).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
