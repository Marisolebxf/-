id: FUNC-02223
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02223
priority: P0
title: 按条件筛选任务的配置新建时带回条件且不自动分析
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析有条件筛选且已完成的任务
locators:
  recent_tab: tab「最近分析」
  clone_btn: button「按此配置新建」
  filter_tab: tab「条件筛选推荐」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history
  - action: wait
    for: 培育页 SPA 渲染
    timeout_ms: 2500
  - action: evaluate
    note: 最近分析→已完成条件筛选行「按此配置新建」；Tab 与产业类别回填、不自动起任务在 expect 判定
expect:
  - note: 1、回到条件筛选推荐
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const parseIndustryFromRow = (rowTxt) => {
        const m = (rowTxt || '').match(/条件筛选\s*[·•]\s*([^\n\t]+)/);
        const raw = (m?.[1] || '').trim();
        const parts = raw
          .split(/[/、,，]/)
          .map((s) => s.trim())
          .filter(Boolean);
        const sizes = new Set(['大型', '中型', '小型', '微型']);
        for (const p of parts) {
          if (sizes.has(p)) continue;
          if (/^全部/.test(p)) continue;
          return p;
        }
        return parts[0] || raw;
      };
      const pickCompletedFilterClone = async () => {
        const st = stack();
        const buttons = st.getByRole('button', { name: '按此配置新建' });
        const n = await buttons.count();
        if (n < 1) {
          throw new Error('环境闸门 ENV-CULTIVATE-NO-CLONE-BTN-001：最近分析无「按此配置新建」按钮');
        }
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!txt || !/条件筛选/.test(txt)) continue;
          if (/候选工作台/.test(txt) && !/条件筛选/.test(txt)) continue;
          if (!/已完成|成功/.test(txt)) continue;
          return { btn, industryToken: parseIndustryFromRow(txt), rowTxt: txt.replace(/\s+/g, ' ').trim() };
        }
        throw new Error(
          '环境闸门 ENV-CULTIVATE-NO-SUCCESS-FILTER-001：最近分析无「已完成」的条件筛选任务可「按此配置新建」',
        );
      };
      const countRecTasks = async () => {
        const t = await stack().innerText().catch(() => '');
        return (t.match(/REC-/g) || []).length;
      };
      const filterTabSelected = async () => {
        const byKey = page.locator('.global-workbench-tabs button[data-tab-key="filter"]').first();
        if (await byKey.count()) {
          const aria = await byKey.getAttribute('aria-selected');
          const cls = await byKey.getAttribute('class').catch(() => '');
          if (aria === 'true' || /active|selected/i.test(cls || '')) return true;
        }
        const roleTab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
        if (await roleTab.count()) {
          const aria = await roleTab.getAttribute('aria-selected');
          if (aria === 'true') return true;
        }
        const st = await stack().innerText().catch(() => '');
        return (
          (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) &&
          !/培育推荐 · 最近分析/.test(st) &&
          /条件筛选推荐|培育推荐条件|全部产业类别/.test(st)
        );
      };
      await dismissBasket();
      await openRecentTab();
      await waitHistoryShell();
      const nBefore = await countRecTasks();
      const { btn, industryToken, rowTxt } = await pickCompletedFilterClone();
      await btn.scrollIntoViewIfNeeded();
      await btn.click({ timeout: 15000 });
      await page.waitForTimeout(1200);
      if (!(await filterTabSelected())) {
        throw new Error('点击按此配置新建后未进入条件筛选推荐；url=' + page.url());
      }
      await expect(page.locator('input[placeholder="全部产业类别"]').first()).toBeVisible({ timeout: 10000 });
      globalThis.__func02223 = { industryToken, rowTxt, nBefore };
  - note: 2、条件区带回该任务的产业类别
    assert: |-
      const ctx = globalThis.__func02223;
      if (!ctx?.industryToken) throw new Error('前置：未点击按此配置新建');
      const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
      const readSelectView = async (ph) => {
        const i = page.locator(`input[placeholder="${ph}"]`).first();
        const wrap = i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
        return norm(await wrap.innerText());
      };
      const decode = {
        AI001: '人工智能',
        IC001: '集成电路',
        BIO001: '生物医药',
      };
      const partMatchesView = (part, viewText) => {
        if (!part) throw new Error('行摘要未解析产业 token');
        const v = norm(viewText);
        if (!v || v === '全部产业类别') return false;
        const alts = [part];
        if (decode[part]) alts.push(decode[part]);
        for (const a of alts) {
          if (a.length >= 2 && (v.includes(a) || a.includes(v))) return true;
        }
        return false;
      };
      const industryAfter = await readSelectView('全部产业类别');
      if (!partMatchesView(ctx.industryToken, industryAfter)) {
        throw new Error(
          '产业类别与历史条件摘要不一致：摘要=' + ctx.industryToken + ' 现场=' + (industryAfter || '(空)') + '；行=' + (ctx.rowTxt || '').slice(0, 80),
        );
      }
  - note: 3、结果区为「请设置条件并执行推荐分析」且不自动分析
    assert: |-
      const ctx = globalThis.__func02223;
      const stack = () => page.getByTestId('recruit-tab-stack');
      const stText = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(stText)) {
        throw new Error('按此配置新建后不应自动出现「可视化分析过程」');
      }
      const url = page.url();
      if (url.includes('analysis_view=processing')) {
        throw new Error('URL 仍带 analysis_view=processing，疑似已自动起任务：' + url);
      }
      if (/培育推荐分析结果/.test(stText) && !/请设置条件/.test(stText)) {
        throw new Error('不应自动进入成功结果页主文案');
      }
      await expect(stack().getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 8000 });
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await page.waitForTimeout(2000);
      const stAfter = await stack().innerText().catch(() => '');
      if (/可视化分析过程/.test(stAfter)) {
        throw new Error('等待 2s 后仍出现「可视化分析过程」，疑似自动开始分析');
      }
      if (ctx?.nBefore != null) {
        const byKey = page.locator('button[data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        if ((await byKey.count()) || (await byName.count())) {
          const tab = (await byKey.count()) ? byKey.first() : byName.first();
          await tab.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(900);
          const nAfter = ((await stack().innerText().catch(() => '')).match(/REC-/g) || []).length;
          if (nAfter > ctx.nBefore) {
            throw new Error('最近分析 REC- 条数增加：' + ctx.nBefore + ' -> ' + nAfter + '，疑似自动新建任务');
          }
        }
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation&entry=history 兜底。步骤=最近分析点已完成「条件筛选」行「按此配置新建」。机检=条件筛选推荐 Tab+产业类别与行摘要 token 互证（AI001 等编码可映射汉字）+空态「请设置条件并执行推荐分析」且 2s 内无过程/成功结果、REC 条数不增。无 Tab→ENV-CULTIVATE-NO-HISTORY-TAB-001；无已完成条件筛选→ENV-CULTIVATE-NO-SUCCESS-FILTER-001。D4·2026-10-20 rewrite-FUNC-02223 svcz 机跑 fail·ENV-CULTIVATE-NO-SUCCESS-FILTER-001（最近分析仅有处理中/失败条件筛选行，无「已完成」可点按此配置新建；三条 expect 未触达，与 02210/02188 同源）。登录与关评审由 runner 前置。B 档零 allow_skip。
