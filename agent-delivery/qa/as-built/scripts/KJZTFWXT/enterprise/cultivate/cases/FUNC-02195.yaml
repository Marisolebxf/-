id: FUNC-02195
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02195
priority: P0
tier: B
title: 成功结果页本次筛选与发起条件一致且不编造未选项
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册02188：产业类别选「人工智能」→开始分析（成功结果与断言在 expect）
expect:
  - note: 1、本次筛选含发起时选中的产业类别
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const ensureCultivation = async () => {
        const body = await stack().innerText().catch(() => '');
        if (/培育推荐条件|全部产业类别/.test(body)) return;
        await page.getByText('培育企业推荐分析', { exact: true }).first().click({ timeout: 10000 });
        await page.waitForTimeout(800);
      };
      const waitResult = async (timeoutMs = 120000) => {
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          const ok = /培育推荐分析结果/.test(last) && /本次筛选/.test(last) && !/可视化分析过程/.test(last);
          if (ok) return last;
          if (/推荐分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001');
          }
          if (/已打开今天相同条件的推荐分析结果/.test(last) && /培育推荐分析结果/.test(last)) return last;
        }
        throw new Error('未到达培育推荐分析结果: ' + last.slice(0, 220));
      };
      const restoreFromHistory = async () => {
        await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await expect(stack().getByText('培育推荐 · 最近分析').first()).toBeVisible({ timeout: 10000 });
        const buttons = stack().getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!txt || !/已完成/.test(txt) || !/条件筛选/.test(txt)) continue;
          await btn.scrollIntoViewIfNeeded();
          await btn.click({ timeout: 15000 });
          try {
            return await waitResult(60000);
          } catch (e) {
            if (String(e.message || e).includes('ENV-CULTIVATE-ANALYSIS-FAIL-001')) continue;
            throw e;
          }
        }
        return null;
      };
      await ensureCultivation();
      let body = await stack().innerText().catch(() => '');
      if (/培育推荐分析结果/.test(body) && /本次筛选/.test(body)) {
        globalThis.__func02195 = { body, echo: '人工智能' };
        const tokens = ['人工智能', '产业类别'];
        const hit = tokens.some((t) => body.includes(t));
        if (hit) return;
      }
      const restored = await restoreFromHistory().catch(() => null);
      if (restored) {
        globalThis.__func02195 = { body: restored, echo: '人工智能' };
        const hit = ['人工智能', '产业类别'].some((t) => restored.includes(t));
        if (hit) return;
      }
      await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
      await page.waitForTimeout(500);
      const sel = page.locator('input[placeholder="全部产业类别"]').first();
      await sel.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 10000 });
      await page.waitForTimeout(400);
      const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      const echo = ((await opt.innerText().catch(() => '')) || '人工智能').trim();
      await opt.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click();
      try {
        body = await waitResult();
      } catch (e) {
        if (String(e.message || e).includes('ENV-CULTIVATE-ANALYSIS-FAIL-001')) {
          throw new Error('修订 blocked ENV-CULTIVATE-ANALYSIS-FAIL-001 条件筛选无法到达成功结果页验本次筛选');
        }
        throw e;
      }
      const tokens = [echo, '人工智能', '产业类别'].filter(Boolean);
      const hit = tokens.some((t) => t.length >= 2 && body.includes(t));
      if (!hit) throw new Error('本次筛选未含所选产业类别: ' + body.slice(0, 240));
      globalThis.__func02195 = { body, echo };
  - note: 2、未选的政策导向或企业规模不编造一项
    assert: |-
      const ctx = globalThis.__func02195;
      if (!ctx?.body) throw new Error('前置：未到达成功结果');
      const body = await page.getByTestId('recruit-tab-stack').innerText().catch(() => ctx.body);
      const m = body.match(/本次筛选[：:]\s*([^\n]+)/);
      const line = m ? m[1].trim() : '';
      if (!line) throw new Error('未解析到本次筛选摘要行');
      if (/政策导向[：:]/.test(line)) throw new Error('未选政策导向但摘要含政策导向: ' + line);
      if (/企业规模[：:]/.test(line)) throw new Error('未选企业规模但摘要含企业规模: ' + line);
      const forbidden = ['科技创新', '产业升级', '绿色发展', '市场拓展', '大型', '中型', '小型', '微型'];
      for (const w of forbidden) {
        if (line.includes(w)) throw new Error('未选政策/规模但含「' + w + '」: ' + line);
      }
on_fail: 截图 + 抄 X-Trace-Id
