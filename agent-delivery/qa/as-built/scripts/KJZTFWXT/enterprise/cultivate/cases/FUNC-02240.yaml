id: FUNC-02240
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02240
priority: P1
title: 备选-删除确定
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析有可删除的任务
locators:
  recent_tab: tab「最近分析」
  delete_button: button「删除」
  modal_ok: 弹框 button「确定」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 最近分析→可删行「删除」→弹框「确定」；列表消失与 toast 在 expect
expect:
  - note: 1、弹框写明删除后列表不再显示并点确定
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const REC_RE = /REC-\d{8}-\d{3,}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const scrollHistoryActions = async () => {
        const st = stack();
        const bodies = st.locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const rowFromDel = (del) =>
        del.locator('xpath=ancestor::tr[1] | ancestor::*[contains(@class,"arco-table-tr")][1]').first();
      const taskLabelFromRow = async (row) => {
        const txt = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
        const m = txt.match(REC_RE);
        if (m) return m[0];
        const firstTd = row.locator('.arco-table-td').first();
        if (await firstTd.count()) {
          const cell = (await firstTd.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
          if (cell) return cell.split(/\s/)[0];
        }
        return txt.slice(0, 40);
      };
      const pickDeletableOnPage = async () => {
        await scrollHistoryActions();
        const st = stack();
        const dels = st.getByRole('button', { name: '删除', exact: true });
        const n = await dels.count();
        for (let i = 0; i < n; i++) {
          const del = dels.nth(i);
          const row = rowFromDel(del);
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!txt || !REC_RE.test(txt)) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollHistoryActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          const label = await taskLabelFromRow(row);
          if (!label) continue;
          return { del, label };
        }
        return null;
      };
      const pickDeletableRow = async () => {
        const pag = stack().locator('.arco-pagination').first();
        for (let guard = 0; guard < 24; guard++) {
          const hit = await pickDeletableOnPage();
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        const shell = await stack().innerText().catch(() => '');
        if (/暂无|无历史|还没有/.test(shell) || !/REC-/.test(shell)) {
          throw new Error('环境闸门 ENV-CULTIVATE-NO-HISTORY-ROW-001：最近分析无任务行（前置 1 不满足）');
        }
        throw new Error(
          '环境闸门 ENV-CULTIVATE-NO-HISTORY-DELETE-001：有任务行但操作列无可见「删除」（需横向滚到操作列）',
        );
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/enterprise\/attraction/);
      await expect(page).toHaveURL(/workspace=cultivation/);
      await openRecentTab();
      await waitHistoryShell();
      const picked = await pickDeletableRow();
      globalThis.__func02240 = { label: picked.label };
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      await expect(modal.getByText(/删除后.*不再显示|不再展示|列表.*不/)).toBeVisible({ timeout: 5000 });
      const ok = modal.getByRole('button', { name: '确定', exact: true });
      await expect(ok).toBeVisible({ timeout: 5000 });
      await ok.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      globalThis.__func02240.confirmed = true;
  - note: 2、该任务名称从列表消失且提示已删除
    assert: |-
      if (!globalThis.__func02240?.confirmed) throw new Error('前置：未完成删除确定');
      const taskName = globalThis.__func02240.label;
      if (!taskName) throw new Error('前置：未记录任务名称');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const t0 = Date.now();
      while (Date.now() - t0 < 15000) {
        const t = await stack().innerText().catch(() => '');
        if (!t.includes(taskName)) break;
        await page.waitForTimeout(500);
      }
      const finalText = await stack().innerText().catch(() => '');
      if (finalText.includes(taskName)) {
        throw new Error('确定删除后任务名称仍在最近分析：' + taskName);
      }
      const rowStill = stack().locator('.arco-table-tr').filter({ hasText: taskName });
      await expect(rowStill).toHaveCount(0, { timeout: 3000 });
      const msgDeleted = page.locator('.arco-message-content').filter({ hasText: /已删除/ });
      let sawToast = false;
      for (let i = 0; i < 20; i++) {
        if (await msgDeleted.count() && (await msgDeleted.first().isVisible().catch(() => false))) {
          sawToast = true;
          break;
        }
        await page.waitForTimeout(300);
      }
      if (!sawToast) {
        throw new Error('确定删除后未出现「已删除」提示');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation（步骤=最近分析 Tab 或 entry=history→任一带 REC 可删行「删除」→Modal 含删除后列表不再显示→「确定」）。机检=任务名消失+toast 已删除。破坏性：真删一条历史。无 Tab→ENV-CULTIVATE-NO-HISTORY-TAB-001；无行→ENV-CULTIVATE-NO-HISTORY-ROW-001。取消路径见 02229/02230。D4·2026-10-20 rewrite-FUNC-02240 svcz 2/2 expect 绿。登录与关评审由 runner 前置。B 档零 allow_skip。
