id: P0-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01020
priority: P0
title: 对比篮浮层加入培育候选后候选工作台出现对应记录
story: US-ENT-RECRUIT-L1
entry_id: ent-cultivate
preconditions:
- 对比篮内已有企业（可从企业查询勾选；本环境常见已有篮内企业）
locators:
  dock: button 打开对比篮
  add: button「加入培育候选」
  tab: tab「候选工作台」
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: click
  target: 打开对比篮（若未开）
- action: click
  target: 勾选一家企业后点「加入培育候选」
- action: click
  target: 候选工作台 Tab
expect:
- note: 候选工作台出现该企业记录
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const dock = page.getByRole('button', { name: /打开对比篮/ }); if (await dock.count()) await dock.first().click({ timeout: 8000 }); await page.waitForTimeout(600); const panel = page.locator('.system-compare-panel, [class*=compare]').filter({ hasText: '加入培育候选' }).first(); const add = page.getByRole('button', { name: '加入培育候选' }); const cbs = page.locator('.system-compare-panel input[type=checkbox], [class*=compare-panel] .arco-checkbox').first(); if (await page.locator('.arco-checkbox').filter({ has: page.locator('[aria-label^="选择 "]') }).count()) { await page.locator('[aria-label^="选择 "]').first().click({ force: true }) } else if (await page.locator('.system-compare-panel .arco-checkbox').count()) { await page.locator('.system-compare-panel .arco-checkbox').first().click({ force: true }) }; await page.waitForTimeout(400); if (await add.isDisabled()) throw new Error('ALLOW_SKIP: 篮内无勾选企业，加入培育候选仍禁用'); await add.click({ timeout: 8000 }); await page.waitForTimeout(800); await page.getByRole('tab', { name: '候选工作台' }).click(); await page.waitForTimeout(1000); const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!/企业名称|待分析|对比篮|线索/.test(t)) throw new Error('候选工作台未见记录区: ' + t.slice(0, 200)); if (/暂无|空/.test(t) && !/共\s*[1-9]/.test(t) && !/待分析/.test(t)) throw new Error('ALLOW_SKIP: 加入后仍空列表')
- note: 记录线索来源呈人工线索待分析语义不冒充模型推荐
  assert: |-
    const t = await page.getByTestId('recruit-tab-stack').innerText(); if (/模型推荐|算法推荐/.test(t) && !/待分析|对比篮|企业查询|人工/.test(t)) throw new Error('线索来源疑似冒充模型推荐'); if (!/待分析|对比篮|企业查询/.test(t)) throw new Error('未见人工线索/待分析语义（observed 形态）')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业或勾选失败时 Pass-N/A
as_built_note: 对比篮关闭钮可见再点；两按钮隔离归 P1-07=01028；不写招引工作台详验。
tier: A
