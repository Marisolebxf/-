id: FUNC-02189
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02189
priority: P0
title: 只选产业类别后开始分析可点且不自动跑
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: A
preconditions:
  - 已进入培育页「条件筛选推荐」且三选择器均未设
locators:
  start: button「开始分析」
  industry_ph: placeholder「全部产业类别」
  industry_opt: 人工智能
  empty_hint: 请设置条件并执行推荐分析
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 仅产业类别选「人工智能」；开始分析可点与不自动跑判定在 expect
expect:
  - note: 1、「开始分析」变为可点
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const ph = page.locator('input[placeholder="全部产业类别"]').first();
          if (await ph.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染（未见全部产业类别），url=' + page.url());
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/enterprise\/attraction/);
      await expect(page).toHaveURL(/workspace=cultivation/);
      await waitFilterReady();
      const tab = page.getByRole('tab', { name: '条件筛选推荐' });
      if (await tab.count()) {
        await tab.first().click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      const start = page.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeVisible({ timeout: 8000 });
      await expect(start).toBeDisabled({ timeout: 8000 });
      const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first();
      await ind.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      await expect(start).toBeEnabled({ timeout: 8000 });
      const cls = (await start.getAttribute('class')) || '';
      if (/arco-btn-disabled/.test(cls)) throw new Error('选产业类别后开始分析仍含 arco-btn-disabled');
  - note: 2、结果区仍是「请设置条件并执行推荐分析」
    assert: |-
      const stack = page.getByTestId('recruit-tab-stack');
      await page.waitForTimeout(800);
      await expect(stack.getByText('请设置条件并执行推荐分析').first()).toBeVisible({ timeout: 8000 });
      const t = await stack.innerText();
      if (/可视化分析过程/.test(t)) throw new Error('选产业类别后自动进入分析过程');
      if (/培育推荐分析结果/.test(t) && !t.includes('请设置条件')) throw new Error('选产业类别后自动出现结果态');
      if (/analysis_view=processing/.test(page.url())) throw new Error('选产业类别后 URL 自动进入 processing');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation（= catalog.path + query，勿用 forbidden_paths）。步骤=条件筛选推荐 Tab + 仅产业类别选「人工智能」。机检=开始分析 enabled 且 recruit-tab-stack 仍见「请设置条件并执行推荐分析」、无自动过程/结果态。登录与关评审由 runner 前置。A 档零 allow_skip。
