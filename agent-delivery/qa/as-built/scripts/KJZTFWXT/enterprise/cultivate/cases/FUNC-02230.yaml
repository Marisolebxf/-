id: FUNC-02230
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02230
priority: P1
title: 删除候选工作台任务时取消则任务仍在
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析有候选工作台起源的任务
locators:
  recent_tab: tab「最近分析」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 最近分析→候选工作台起源行「删除」→弹框验文案→「取消」；行仍在 expect 判定
expect:
  - note: 1、弹出框写明删除后列表不再显示
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const TID_RE = /REC-\d{8}-\d{3,}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const scrollHistoryActions = async () => {
        const st = stack();
        const bodies = st.locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const rowFromAnchor = (anchor) =>
        anchor.locator('xpath=ancestor::tr[1] | ancestor::*[contains(@class,"arco-table-tr")][1]').first();
      const deleteInRow = (row) => row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
      const pickCandidateDelete = async () => {
        await scrollHistoryActions();
        const st = stack();
        const dels = st.getByRole('button', { name: '删除', exact: true });
        const n = await dels.count();
        if (n < 1) {
          const shell = await st.innerText().catch(() => '');
          if (/暂无|无历史|还没有/.test(shell)) {
            throw new Error('环境闸门 ENV-CULTIVATE-NO-CANDIDATE-HISTORY-001：最近分析无任务行');
          }
          throw new Error(
            '环境闸门 DEF-ENT-RECRUIT-HISTORY-DELETE-UI-001：最近分析有行但无「删除」按钮',
          );
        }
        for (let i = 0; i < n; i++) {
          const del = dels.nth(i);
          await del.scrollIntoViewIfNeeded().catch(() => {});
          if (!(await del.isVisible().catch(() => false))) continue;
          const row = rowFromAnchor(del);
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!txt || !/候选工作台/.test(txt)) continue;
          const tidM = txt.match(TID_RE);
          const nameLine = txt.split('\n').map((s) => s.trim()).find((s) => s && !TID_RE.test(s) && s.length > 2) || '';
          return { del, row, tid: tidM?.[0] || '', nameHint: nameLine.slice(0, 80), rowTxt: txt.replace(/\s+/g, ' ').trim() };
        }
        throw new Error(
          '环境闸门 ENV-CULTIVATE-NO-CANDIDATE-HISTORY-001：最近分析无候选工作台起源可删任务（与 02229 条件筛选分开）',
        );
      };
      await dismissBasket();
      await openRecentTab();
      await waitHistoryShell();
      await scrollHistoryActions();
      const picked = await pickCandidateDelete();
      globalThis.__func02230 = { ...picked };
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: /删除/ });
      await expect(modal.first()).toBeVisible({ timeout: 8000 });
      const bodyText = (await modal.first().innerText()).replace(/\s+/g, ' ');
      const explainsHidden =
        /不再显示|不再展示|列表.*不|删除后/.test(bodyText) || /删除.*记录/.test(bodyText);
      if (!explainsHidden) {
        throw new Error('弹框未说明删除后列表不再显示，正文：' + bodyText.slice(0, 240));
      }
      globalThis.__func02230.modalReady = true;
  - note: 2、取消后该任务仍在
    assert: |-
      const ctx = globalThis.__func02230;
      if (!ctx?.modalReady) throw new Error('前置：未打开删除弹框');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const TID_RE = /REC-\d{8}-\d{3,}/;
      const modal = page.locator('.arco-modal:visible').filter({ hasText: /删除/ });
      await expect(modal.first()).toBeVisible({ timeout: 5000 });
      const cancelBtn = modal.first().getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal.first()).toBeHidden({ timeout: 10000 });
      const stText = await stack().innerText().catch(() => '');
      if (ctx.tid && !stText.includes(ctx.tid)) {
        throw new Error('取消删除后 REC 任务不在最近分析：' + ctx.tid);
      }
      if (ctx.nameHint && ctx.nameHint.length > 3 && !stText.includes(ctx.nameHint.slice(0, 20))) {
        throw new Error('取消删除后任务名称不在列表：' + ctx.nameHint);
      }
      if (ctx.rowTxt && ctx.rowTxt.length > 10) {
        const key = ctx.rowTxt.match(/候选工作台[^\s]{0,40}/)?.[0] || '候选工作台';
        if (!stText.includes('候选工作台')) {
          throw new Error('取消后最近分析应仍含候选工作台起源任务');
        }
      }
      const msgDeleted = page.locator('.arco-message-content').filter({ hasText: /已删除/ });
      if (await msgDeleted.count() && (await msgDeleted.first().isVisible().catch(() => false))) {
        throw new Error('取消后不应出现「已删除」提示');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation&entry=history 兜底。步骤=最近分析点候选工作台起源行「删除」→弹框文案（删除后列表不再显示，与 02229 标题断言分立）→「取消」→REC/任务名仍在。D4·2026-10-20 rewrite-FUNC-02230 svcz 机跑 blocked·ENV-CULTIVATE-NO-CANDIDATE-HISTORY-001（最近分析多行均为「条件筛选 · …」、零「候选工作台」条件摘要，与 rewrite-FUNC-02224-probe 同因）。有删无候选行→DEF-ENT-RECRUIT-HISTORY-DELETE-UI-001。登录与关评审由 runner 前置。B 档零 allow_skip。
