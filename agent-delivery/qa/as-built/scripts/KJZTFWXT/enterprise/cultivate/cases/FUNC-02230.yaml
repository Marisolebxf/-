id: FUNC-02230
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02230
priority: P1
tier: B
title: 删除候选工作台任务时取消则任务仍在
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册02208+02245补候选起源任务，最近分析删取消
expect:
  - note: 1、弹出框写明删除后列表不再显示
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const TID_RE = /REC-\d{8}-\d{3,}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const ensureCultivationPage = async () => {
        const st = stack();
        const onCult =
          /深圳市内企业/.test(await st.innerText().catch(() => '')) ||
          (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false));
        if (onCult) return;
        const nav = page.getByRole('link', { name: '培育企业推荐分析' });
        if ((await nav.count()) < 1) {
          await page.getByText('培育企业推荐分析', { exact: true }).last().click({ timeout: 8000 });
        } else {
          await nav.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
        await expect(page.locator('input[placeholder="全部产业类别"]').first()).toBeVisible({ timeout: 15000 });
      };
      const waitFilterReady = async () => {
        await ensureCultivationPage();
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const clickWorkbenchTab = async (key, label) => {
        const tab = page.locator(`.global-workbench-tabs button[data-tab-key="${key}"]`).first();
        if ((await tab.count()) < 1) {
          await page.getByRole('tab', { name: label }).first().click({ timeout: 8000 });
        } else {
          await expect(tab).toBeVisible({ timeout: 12000 });
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
      };
      const ensureCandidateOriginTask = async () => {
        await clickWorkbenchTab('candidates', '候选工作台');
        const st = stack();
        await expect(st.getByText('人工线索候选工作台').first()).toBeVisible({ timeout: 15000 });
        const shell = await st.innerText().catch(() => '');
        if (/暂无|无候选|名单为空/.test(shell)) {
          throw new Error('修订 blocked 候选名单为空，无法按同册02208发起复核');
        }
        const rowCheck = st.locator('.arco-table-body tr .arco-checkbox, .arco-table-tr .arco-checkbox').first();
        await expect(rowCheck).toBeVisible({ timeout: 12000 });
        const checked = await rowCheck.locator('input').isChecked().catch(() => false);
        if (!checked) await rowCheck.click({ timeout: 8000 });
        const reviewBtn = st.getByRole('button', { name: '执行指定对象复核' });
        await expect(reviewBtn).toBeEnabled({ timeout: 8000 });
        await reviewBtn.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await expect(st.getByText('指定对象模型参数配置').first()).toBeVisible({ timeout: 15000 });
        const startBtn = st.getByRole('button', { name: '开始分析' });
        await expect(startBtn).toBeVisible({ timeout: 8000 });
        await startBtn.click({ timeout: 8000 });
        for (let i = 0; i < 120; i++) {
          const t = await st.innerText().catch(() => '');
          if (/候选分析失败|培育推荐 · 最近分析|可视化分析过程/.test(t) && !/指定对象模型参数配置/.test(t)) {
            if (/候选分析失败/.test(t) || /培育推荐 · 最近分析/.test(t)) break;
          }
          if (/候选分析失败/.test(t)) break;
          await page.waitForTimeout(1000);
        }
        const after = await st.innerText().catch(() => '');
        if (!/候选分析失败|REC-/.test(after) && !/培育推荐/.test(after)) {
          throw new Error('修订 02245 等待结束超时，主区：' + after.slice(0, 200));
        }
      };
      const openRecentTab = async () => {
        await clickWorkbenchTab('history', '最近分析');
        if (!/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          await page.goto(
            toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
            { waitUntil: 'domcontentloaded' },
          );
          await page.waitForTimeout(1200);
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t))) return;
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染，url=' + page.url());
      };
      const scrollHistoryActions = async () => {
        const st = stack();
        const bodies = st.locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const rowFromAnchor = (anchor) =>
        anchor.locator('xpath=ancestor::tr[1] | ancestor::*[contains(@class,"arco-table-tr")][1]').first();
      const pickCandidateDelete = async () => {
        await scrollHistoryActions();
        const st = stack();
        const dels = st.getByRole('button', { name: '删除', exact: true });
        const n = await dels.count();
        if (n < 1) throw new Error('最近分析无「删除」按钮');
        for (let i = 0; i < n; i++) {
          const del = dels.nth(i);
          await del.scrollIntoViewIfNeeded().catch(() => {});
          if (!(await del.isVisible().catch(() => false))) continue;
          const row = rowFromAnchor(del);
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!txt || !/候选工作台/.test(txt)) continue;
          const tidM = txt.match(TID_RE);
          const nameLine = txt.split('\n').map((s) => s.trim()).find((s) => s && !TID_RE.test(s) && s.length > 2) || '';
          return { del, tid: tidM?.[0] || '', nameHint: nameLine.slice(0, 80), rowTxt: txt.replace(/\s+/g, ' ').trim() };
        }
        throw new Error('修订 blocked 最近分析仍无候选工作台起源任务');
      };
      await dismissBasket();
      await waitFilterReady();
      await openRecentTab();
      await waitHistoryShell();
      let picked;
      try {
        picked = await pickCandidateDelete();
      } catch (e) {
        const msg = String(e?.message || e);
        if (!/仍无候选工作台|无「删除」/.test(msg)) throw e;
        await ensureCandidateOriginTask();
        await openRecentTab();
        await waitHistoryShell();
        picked = await pickCandidateDelete();
      }
      globalThis.__func02230 = { ...picked };
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: /删除/ });
      await expect(modal.first()).toBeVisible({ timeout: 8000 });
      const bodyText = (await modal.first().innerText()).replace(/\s+/g, ' ');
      const explainsHidden =
        /不再显示|不再展示|列表.*不|删除后/.test(bodyText) || /删除.*记录/.test(bodyText);
      if (!explainsHidden) {
        throw new Error('弹框未说明删除后列表不再显示，正文：' + bodyText.slice(0, 240));
      }
      globalThis.__func02230.modalReady = true;
  - note: 2、取消后该任务仍在
    assert: |-
      const ctx = globalThis.__func02230;
      if (!ctx?.modalReady) throw new Error('前置：未打开删除弹框');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const TID_RE = /REC-\d{8}-\d{3,}/;
      const modal = page.locator('.arco-modal:visible').filter({ hasText: /删除/ });
      await expect(modal.first()).toBeVisible({ timeout: 5000 });
      const cancelBtn = modal.first().getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal.first()).toBeHidden({ timeout: 10000 });
      const stText = await stack().innerText().catch(() => '');
      if (ctx.tid && !stText.includes(ctx.tid)) {
        throw new Error('取消删除后 REC 任务不在最近分析：' + ctx.tid);
      }
      if (ctx.nameHint && ctx.nameHint.length > 3 && !stText.includes(ctx.nameHint.slice(0, 20))) {
        throw new Error('取消删除后任务名称不在列表：' + ctx.nameHint);
      }
      if (!stText.includes('候选工作台')) {
        throw new Error('取消后最近分析应仍含候选工作台起源任务');
      }
      const msgDeleted = page.locator('.arco-message-content').filter({ hasText: /已删除/ });
      if (await msgDeleted.count() && (await msgDeleted.first().isVisible().catch(() => false))) {
        throw new Error('取消后不应出现「已删除」提示');
      }
on_fail: 截图 + 抄 X-Trace-Id
