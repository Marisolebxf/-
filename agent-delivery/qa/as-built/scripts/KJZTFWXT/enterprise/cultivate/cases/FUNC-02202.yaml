id: FUNC-02202
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02202
priority: P1
tier: B
title: 主流程-当天再分析打开已有结果
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册02188成功结果→02215调整分析条件→再次开始分析
expect:
  - note: 1、提示「已打开今天相同条件的推荐分析结果」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const main = page.locator('main');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const hasRankingTable = (text) =>
        /培育推荐分析结果/.test(text) && /排名/.test(text) && /企业名称/.test(text) && /共分析\s*\d+\s*家/.test(text);
      const ensureCultivationWorkspace = async () => {
        const body = await page.locator('main').innerText().catch(() => '');
        if (/培育推荐条件|深圳市内企业/.test(body)) return;
        const nav = page.getByRole('menuitem', { name: '培育企业推荐分析' }).first();
        if ((await nav.count()) < 1) {
          await page.getByText('培育企业推荐分析', { exact: true }).first().click({ timeout: 8000 });
        } else {
          await nav.click({ timeout: 8000 });
        }
        await page.waitForTimeout(800);
        await expect(page.locator('main').getByText('培育推荐条件').first()).toBeVisible({ timeout: 15000 });
      };
      const waitFilterReady = async () => {
        await ensureCultivationWorkspace();
        for (let i = 0; i < 24; i++) {
          if (await main.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const openRecentTab = async () => {
        await waitFilterReady();
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        } else {
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
      };
      const waitResultShell = async (timeoutMs = 120000) => {
        const title = () => stack().getByText('培育推荐分析结果').first();
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          const titleVis = await title().isVisible().catch(() => false);
          if (titleVis && !/可视化分析过程/.test(last) && hasRankingTable(last)) return last;
          if (/已打开今天相同条件的推荐分析结果/.test(last) && hasRankingTable(last)) return last;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('推荐分析失败，无法到达成功结果页');
          }
        }
        if (/可视化分析过程/.test(last)) {
          throw new Error('修订 已发起仍为空结果壳');
        }
        throw new Error('未在超时内到达培育推荐分析结果: ' + last.slice(0, 200));
      };
      const runFilterAnalysis = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await waitFilterReady();
        const i = main.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        return await waitResultShell();
      };
      const pickHistoryRestore = async () => {
        await openRecentTab();
        const st = stack();
        const buttons = st.getByRole('button', { name: '恢复结果' });
        const n = await buttons.count();
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /条件筛选/.test(txt) && !/失败|已取消/.test(txt)) {
            await btn.scrollIntoViewIfNeeded();
            await btn.click({ timeout: 15000 });
            return await waitResultShell(60000);
          }
        }
        return null;
      };
      const ensureSuccessResult = async () => {
        await expect(stack()).toBeVisible({ timeout: 15000 });
        let body = await stack().innerText().catch(() => '');
        if (hasRankingTable(body)) return body;
        const restored = await pickHistoryRestore().catch(() => null);
        if (restored && hasRankingTable(restored)) return restored;
        try {
          return await runFilterAnalysis();
        } catch (e) {
          const again = await pickHistoryRestore().catch(() => null);
          if (again && hasRankingTable(again)) return again;
          throw e;
        }
      };
      await ensureSuccessResult();
      const st = stack();
      const adjust = st.getByRole('button', { name: '调整分析条件' }).first();
      await expect(adjust).toBeVisible({ timeout: 15000 });
      await adjust.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await waitFilterReady();
      const industryInput = main.locator('input[placeholder="全部产业类别"]').first();
      const industryVal = ((await industryInput.inputValue().catch(() => '')) || '').trim();
      if (!industryVal && !/人工智能/.test(await stack().innerText().catch(() => ''))) {
        throw new Error('调整分析条件后产业类别未保留');
      }
      const startAgain = page.getByRole('button', { name: '开始分析' }).first();
      await expect(startAgain).toBeEnabled({ timeout: 8000 });
      const msgPromise = page
        .locator('.arco-message')
        .filter({ hasText: '已打开今天相同条件的推荐分析结果' })
        .first()
        .waitFor({ state: 'visible', timeout: 20000 })
        .catch(() => null);
      await startAgain.click();
      await msgPromise;
      let stackText = '';
      for (let i = 0; i < 24; i++) {
        await page.waitForTimeout(500);
        stackText = await st.innerText().catch(() => '');
        if (/已打开今天相同条件的推荐分析结果/.test(stackText) && hasRankingTable(stackText)) break;
        if (hasRankingTable(stackText) && !/可视化分析过程/.test(stackText)) break;
      }
      globalThis.__func02202 = {
        reuseMessage: stackText,
        stackText,
      };
      const toast = page.locator('.arco-message').filter({ hasText: '已打开今天相同条件的推荐分析结果' });
      const toastVis = await toast.first().isVisible().catch(() => false);
      const bodyHas = /已打开今天相同条件的推荐分析结果/.test(stackText);
      if (!toastVis && !bodyHas) {
        throw new Error('未见「已打开今天相同条件的推荐分析结果」提示');
      }
  - note: 2、仍停在已有结果页
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const st = stack();
      await expect(st.getByText('培育推荐分析结果').first()).toBeVisible({ timeout: 15000 });
      const body = await st.innerText().catch(() => '');
      if (/请设置条件并执行推荐分析/.test(body) && !/培育推荐分析结果/.test(body)) {
        throw new Error('仍在空条件壳，未打开已有结果');
      }
  - note: 3、不进入新的可视化分析过程
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const st = stack();
      const body = await st.innerText().catch(() => '');
      if (/可视化分析过程/.test(body)) {
        throw new Error('再次开始分析后进入了新的可视化分析过程');
      }
      await expect(st.getByText('可视化分析过程').first()).toBeHidden({ timeout: 3000 });
on_fail: 截图 + 抄 X-Trace-Id
