  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(300); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '生物医药' }).first().click({ timeout: 8000 }); await page.waitForTimeout(400); const start = page.getByRole('button', { name: '开始分析' }); if (await start.isDisabled()) throw new Error('选条件后仍禁用'); await start.click(); await page.waitForTimeout(800); const url1 = page.url(); const disabled = await start.isDisabled(); if (!disabled) { await start.click().catch(()=>{}); await page.waitForTimeout(600) }; const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!disabled && /analysis_view=processing/.test(page.url()) && page.url() !== url1 && (page.url().match(/task_id=/g)||[]).length > 1) throw new Error('疑似重复创建任务'); if (!disabled && !/分析中|可视化分析过程|推荐分析失败|成功/.test(t)) { /* 终态过快 observed */ }
