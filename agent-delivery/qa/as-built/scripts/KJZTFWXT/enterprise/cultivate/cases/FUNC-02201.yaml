id: FUNC-02201
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02201
priority: P0
tier: B
title: 主流程-风险明细
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 同册02188/02210与02199至详情可见查看风险明细
  - action: evaluate
    note: 点「查看风险明细」
expect:
  - note: 1、抽屉标题以「企业风险与信用」开头
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel =
        '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const parseCounts = (text) => {
        const m = text.match(/共分析\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : 0;
      };
      const hasRankingTable = (text) =>
        /培育推荐分析结果/.test(text) &&
        /排名/.test(text) &&
        /企业名称/.test(text) &&
        parseCounts(text) >= 1;
      const enterCultivation = async () => {
        const hdr = await page.locator('main').getByText('培育企业推荐分析').first().isVisible().catch(() => false);
        if (hdr) return;
        const aside = page.locator('aside, .arco-layout-sider, nav').first();
        const link = aside.getByText('培育企业推荐分析', { exact: true }).first();
        await link.click({ timeout: 12000 });
        await page.waitForURL(/recommendation_tab=cultivation|workspace=cultivation/, { timeout: 15000 }).catch(() => {});
        await expect(page.locator('main').getByText('培育企业推荐分析').first()).toBeVisible({ timeout: 12000 });
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 30; i++) {
          if (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const waitResultShell = async (timeoutMs = 120000) => {
        const title = () => stack().getByText('培育推荐分析结果').first();
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          if ((await title().isVisible().catch(() => false)) && !/可视化分析过程/.test(last) && hasRankingTable(last)) {
            return last;
          }
          if (/已打开今天相同条件的推荐分析结果/.test(last) && hasRankingTable(last)) return last;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('修订 blocked ENV-CULTIVATE-ANALYSIS-FAIL-001 条件筛选无法到达成功结果');
          }
          const viewResult = stack().getByRole('button', { name: '查看结果' }).first();
          if (await viewResult.isVisible().catch(() => false)) {
            await viewResult.click({ timeout: 5000 }).catch(() => {});
          }
        }
        if (/可视化分析过程/.test(last)) {
          throw new Error('修订 blocked ENV-CULTIVATE-ASYNC-NO-SUCCESS-001 长期停留在可视化分析过程');
        }
        throw new Error('未到达企业排名结果: ' + last.slice(0, 180));
      };
      const runFilterAnalysis = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        await waitFilterReady();
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        await waitResultShell();
      };
      const goHistoryTab = async () => {
        const tab = page.getByRole('tab', { name: '最近分析' }).first();
        await expect(tab).toBeVisible({ timeout: 12000 });
        if ((await tab.getAttribute('aria-selected')) !== 'true') {
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(800);
      };
      const openFromHistory = async () => {
        await goHistoryTab();
        const st = stack();
        for (const name of ['恢复结果', '继续查看']) {
          const buttons = st.getByRole('button', { name });
          const n = await buttons.count();
          for (let i = 0; i < n; i++) {
            const btn = buttons.nth(i);
            const row = btn.locator('xpath=ancestor::tr[1]');
            const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
            if (/条件筛选/.test(txt) && (/已完成|成功/.test(txt) || name === '继续查看')) {
              await btn.click({ timeout: 15000 });
              await waitResultShell(60000);
              return true;
            }
          }
        }
        return false;
      };
      await enterCultivation();
      await expect(stack()).toBeVisible({ timeout: 15000 });
      let body = await stack().innerText().catch(() => '');
      if (!hasRankingTable(body)) {
        const onFail = /推荐分析失败/.test(body);
        const ok = await openFromHistory().catch(() => false);
        if (!ok) {
          if (onFail) {
            throw new Error('修订 blocked ENV-CULTIVATE-ANALYSIS-FAIL-001 最近分析无可用成功结果且条件筛选失败');
          }
          await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(400);
          await runFilterAnalysis();
        }
      }
      body = await stack().innerText().catch(() => '');
      if (!hasRankingTable(body)) {
        throw new Error('修订 blocked ENV-CULTIVATE-ANALYSIS-FAIL-001 无法到达企业排名');
      }
      const table = stack().locator('.arco-table').first();
      const bodyRows = table.locator('.arco-table-body .arco-table-tr');
      if ((await bodyRows.count()) < 1) throw new Error('前置：企业排名无数据行');
      const rowIdx = (await bodyRows.count()) >= 2 ? 1 : 0;
      const row = bodyRows.nth(rowIdx);
      await row.getByRole('button', { name: '详情' }).click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const detailRoot = stack().locator('.arco-descriptions').first().locator('xpath=ancestor::div[contains(@class,"rounded")][1]');
      await expect(detailRoot).toBeVisible({ timeout: 10000 });
      const riskBtn = stack().getByRole('button', { name: '查看风险明细' }).first();
      await expect(riskBtn).toBeVisible({ timeout: 8000 });
      await riskBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      globalThis.__func02201 = { riskDrawer: true };
      const drawer = page.locator('.arco-drawer:visible').last();
      await expect(drawer).toBeVisible({ timeout: 10000 });
      await expect(drawer.locator('.arco-drawer-header').getByText(/^企业风险与信用/).first()).toBeVisible({ timeout: 8000 });
  - note: 2、分类含全部、司法涉诉、失信被执行、经营异常、行政处罚
    assert: |-
      if (!globalThis.__func02201?.riskDrawer) throw new Error('前置：未打开风险抽屉');
      const drawer = page.locator('.arco-drawer:visible').last();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      for (const cat of ['全部', '司法涉诉', '失信被执行', '经营异常', '行政处罚']) {
        await expect(drawer.getByText(cat, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
  - note: 3、表列含风险类型、事件摘要、发生日期、当前状态、信息来源
    assert: |-
      const drawer = page.locator('.arco-drawer:visible').last();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const head = drawer.locator('.arco-table-header, thead').first();
      await expect(head).toBeVisible({ timeout: 8000 });
      const headText = await head.innerText().catch(() => '');
      for (const col of ['风险类型', '事件摘要', '发生日期', '当前状态', '信息来源']) {
        if (!headText.includes(col)) {
          await expect(drawer.getByText(col).first()).toBeVisible({ timeout: 8000 });
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
