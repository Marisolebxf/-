id: FUNC-02201
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02201
priority: P0
title: 主流程-风险明细抽屉
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: A
preconditions:
  - 详情中可见「查看风险明细」（assert 自含到达成功结果并打开详情）
locators:
  risk_detail_btn: 详情侧栏 button「查看风险明细」
  risk_drawer: .arco-drawer:visible 标题含「企业风险与信用」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 成功结果→打开一行详情→点「查看风险明细」；抽屉标题/分类/表列在 expect
expect:
  - note: 1、抽屉标题以「企业风险与信用」开头 2、分类含全部、司法涉诉、失信被执行、经营异常、行政处罚 3、表列含风险类型、事件摘要、发生日期、当前状态、信息来源
    assert: |-
      const CATEGORIES = ['全部', '司法涉诉', '失信被执行', '经营异常', '行政处罚'];
      const TABLE_COLS = ['风险类型', '事件摘要', '发生日期', '当前状态', '信息来源'];
      const stack = () => page.getByTestId('recruit-tab-stack');
      const optSel = '.arco-select-popup:visible .arco-select-option, .arco-select-popup-visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const parseCounts = (text) => {
        const analyzedM = text.match(/共分析\s*(\d+)\s*家/);
        if (!analyzedM) return null;
        return { analyzed: parseInt(analyzedM[1], 10) };
      };
      const hasRankingTable = (text) =>
        /培育推荐分析结果/.test(text) && /排名/.test(text) && /企业名称/.test(text) && (parseCounts(text)?.analyzed ?? 0) >= 1;
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          if (await page.locator('input[placeholder="全部产业类别"]').first().isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const openRecentTab = async () => {
        await waitFilterReady();
        const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
        if ((await tab.count()) < 1) {
          await page.getByRole('tab', { name: '最近分析' }).first().click({ timeout: 8000 });
        } else {
          await tab.click({ timeout: 8000 });
        }
        await page.waitForTimeout(900);
      };
      const pickHistoryOpenButton = async () => {
        await openRecentTab();
        const st = stack();
        for (const name of ['恢复结果', '继续查看', '查看结果']) {
          const buttons = st.getByRole('button', { name });
          const n = await buttons.count();
          for (let i = 0; i < n; i++) {
            const btn = buttons.nth(i);
            let row = btn.locator('xpath=ancestor::tr[1]');
            if ((await row.count()) < 1) row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
            const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
            if (txt && /条件筛选/.test(txt) && (/已完成|成功/.test(txt) || name !== '恢复结果')) {
              return btn;
            }
          }
        }
        return null;
      };
      const waitResultShell = async (timeoutMs = 120000) => {
        const title = () => stack().getByText('培育推荐分析结果').first();
        const t0 = Date.now();
        let last = '';
        while (Date.now() - t0 < timeoutMs) {
          await page.waitForTimeout(500);
          last = await stack().innerText().catch(() => '');
          const titleVis = await title().isVisible().catch(() => false);
          if (titleVis && !/可视化分析过程/.test(last) && hasRankingTable(last)) return last;
          if (/已打开今天相同条件的推荐分析结果/.test(last) && hasRankingTable(last)) return last;
          const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
          if (failVis && !/可视化分析过程/.test(last)) {
            throw new Error('环境闸门 ENV-CULTIVATE-ANALYSIS-FAIL-001：无法到达培育推荐分析成功结果以测风险明细（与 02188/02197 同源 D4）');
          }
        }
        const stuck = /可视化分析过程/.test(last) || page.url().includes('analysis_view=processing');
        if (stuck) {
          throw new Error('环境闸门 ENV-CULTIVATE-ASYNC-NO-SUCCESS-001：长期停留在可视化分析过程，无法到达风险明细前置');
        }
        throw new Error('未在超时内到达含企业排名表的成功结果: ' + last.slice(0, 200));
      };
      const runFilterAnalysis = async () => {
        await page.keyboard.press('Escape').catch(() => {});
        const i = page.locator('input[placeholder="全部产业类别"]').first();
        await i.locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]').click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const opt = page.locator(optSel).filter({ hasText: '人工智能' }).first();
        await expect(opt).toBeVisible({ timeout: 8000 });
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const start = page.getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click();
        return await waitResultShell();
      };
      const ensureSuccessResult = async () => {
        await dismissBasket();
        await expect(stack()).toBeVisible({ timeout: 15000 });
        let body = await stack().innerText().catch(() => '');
        if (hasRankingTable(body)) return body;
        const histBtn = await pickHistoryOpenButton().catch(() => null);
        if (histBtn) {
          await histBtn.scrollIntoViewIfNeeded();
          await histBtn.click({ timeout: 15000 });
          body = await waitResultShell(60000);
          if (hasRankingTable(body)) return body;
        }
        await page.getByRole('tab', { name: '条件筛选推荐' }).first().click({ timeout: 8000 }).catch(() => {});
        await page.waitForTimeout(600);
        return await runFilterAnalysis();
      };
      await ensureSuccessResult();
      const st = stack();
      const rows = st.locator('.arco-table-body .arco-table-tr');
      const rowN = await rows.count();
      if (rowN < 1) throw new Error('企业排名表无数据行，无法打开详情');
      const row = rowN >= 2 ? rows.nth(1) : rows.first();
      await expect(row).toBeVisible({ timeout: 10000 });
      const detail = row.getByRole('button', { name: '详情' }).first();
      await expect(detail).toBeVisible({ timeout: 8000 });
      await detail.click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const riskBtn = st.getByRole('button', { name: '查看风险明细' }).first();
      await expect(riskBtn).toBeVisible({ timeout: 10000 });
      await riskBtn.click({ timeout: 10000 });
      await page.waitForTimeout(500);
      const drawers = page.locator('.arco-drawer:visible');
      const riskDrawer = drawers.filter({ hasText: '企业风险与信用' }).last();
      await expect(riskDrawer).toBeVisible({ timeout: 10000 });
      const title = await riskDrawer.locator('.arco-drawer-header, .arco-drawer-title').first().innerText().catch(() => '');
      const titleText = title || (await riskDrawer.innerText().catch(() => '')).split('\n')[0] || '';
      if (!titleText.startsWith('企业风险与信用')) {
        throw new Error('风险抽屉标题未以「企业风险与信用」开头: ' + titleText.slice(0, 120));
      }
      for (const cat of CATEGORIES) {
        const radio = riskDrawer.getByRole('radio', { name: cat }).first();
        const tabBtn = riskDrawer.locator('.arco-radio-button').filter({ hasText: cat }).first();
        if (await radio.count()) {
          await expect(radio).toBeVisible({ timeout: 8000 });
        } else {
          await expect(tabBtn).toBeVisible({ timeout: 8000 });
        }
      }
      const table = riskDrawer.locator('.arco-table').first();
      await expect(table).toBeVisible({ timeout: 8000 });
      const header = table.locator('.arco-table-header, thead').first();
      for (const col of TABLE_COLS) {
        await expect(header.getByText(col, { exact: true }).first()).toBeVisible({ timeout: 8000 });
      }
      const bodyRows = table.locator('.arco-table-body .arco-table-tr');
      const dataN = await bodyRows.count();
      if (dataN < 1) {
        const emptyOk =
          (await riskDrawer.getByText('暂无数据').count()) > 0 ||
          (await riskDrawer.getByText('当前类别暂无明细记录').count()) > 0 ||
          (await riskDrawer.locator('.arco-empty').count()) > 0;
        if (!emptyOk) throw new Error('无风险明细行且未见空态文案（用例备注：无明细时表内为「暂无数据」）');
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path + recommendation_tab=cultivation。风险抽屉真源 RecruitRiskDetailDrawer（标题「企业风险与信用 · ${name}」；五类 radio；表列 5 列）。培育详情在结果侧栏 RecruitDetailPanel，点行「详情」后点「查看风险明细」。前置同 02197（成功态直读→最近分析恢复→产业类别人工智能发起）。D4·2026-10-20 rewrite-FUNC-02201 svcz 机跑 fail·ENV-CULTIVATE-ANALYSIS-FAIL-001（无法到达成功结果，风险抽屉断言未触达；与 02188/02197 同源）。登录与关评审由 runner 前置。A 档零 allow_skip。
