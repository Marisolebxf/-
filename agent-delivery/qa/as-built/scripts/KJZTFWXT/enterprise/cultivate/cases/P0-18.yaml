id: P0-18
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01021
priority: P0
title: 最近分析 Tab 列出本视图历史分析任务且字段构成正确
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
  - 已进入培育页
locators:
  tab: '[data-tab-key="history"]' / getByRole(tab, name=最近分析, exact)
  stack: data-testid=recruit-tab-stack
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: click
    target: 最近分析
expect:
  - note: 列表含条件摘要、状态与创建时间类字段（空态或有行均可）
    assert: |-
      await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const byKey = page.locator('[data-tab-key="history"]').first(); if (await byKey.count()) await byKey.click({ timeout: 8000 }); else await page.getByRole('tab', { name: '最近分析', exact: true }).click({ timeout: 8000 }); await page.waitForTimeout(1000); await expect(page).toHaveURL(/entry=history/); const t = await page.getByTestId('recruit-tab-stack').innerText(); const cols = ['条件摘要','状态','创建时间']; const hasCols = cols.every((c) => t.includes(c)); const emptyOk = /暂无数据|共\s*0\s*条|暂无/.test(t); if (!hasCols && !emptyOk) throw new Error('最近分析缺列且非空态: ' + cols.filter((c) => !t.includes(c)).join(',')); await expect(page.getByText(/培育推荐 · 最近分析|最近分析/).first()).toBeVisible({ timeout: 8000 })
  - note: 空列表呈现空态占位不报错；有行则可见任务标识
    assert: |-
      const t = await page.getByTestId('recruit-tab-stack').innerText(); const emptyOk = /暂无数据|共\s*0\s*条|暂无/.test(t); const hasRows = /REC-|成功|失败|已完成|分析中|已取消|共\s*[1-9]/.test(t); if (!emptyOk && !hasRows) throw new Error('未见空态占位也无任务行'); await expect(page).toHaveURL(/workspace=cultivation/)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: data-tab-key=history；实勘列含条件摘要/状态/创建时间（另有任务名称/企业摘要/操作）；历史行可测字段，无成功名单终态亦可；空态「暂无数据」亦可。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进。
tier: A
