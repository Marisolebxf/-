id: FUNC-02227
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02227
priority: P0
title: 主流程-HTML报告（候选工作台起源）
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 最近分析有候选工作台且状态为已完成的记录
locators:
  recent_tab: tab「最近分析」
  html_report_button: button「查看 HTML 报告」或 data-recruit-history-open-html-report
  report_title: 文案「培育推荐报告」
  back_to_result: button「返回分析结果」或 data-report-back
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: evaluate
    note: 最近分析→已完成候选工作台行「查看 HTML 报告」；报告页在 expect 判定
expect:
  - note: 1、标题为「培育推荐报告」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz/';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const waitFilterReady = async () => {
        for (let i = 0; i < 24; i++) {
          const tag = page.locator('input[placeholder="全部产业类别"]').first();
          if (await tag.isVisible().catch(() => false)) return;
          await page.waitForTimeout(500);
        }
        throw new Error('条件区未渲染，url=' + page.url());
      };
      const hasHistoryTab = async () => {
        const byKey = page.locator('button[data-tab-key="history"], [role=tab][data-tab-key="history"]');
        const byName = page.getByRole('tab', { name: '最近分析' });
        return (await byKey.count()) > 0 || (await byName.count()) > 0;
      };
      const historyDeepLink = async () => {
        await page.goto(
          toUrl('/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=history'),
          { waitUntil: 'domcontentloaded' },
        );
        await page.waitForTimeout(1200);
      };
      const openRecentTab = async () => {
        await waitFilterReady().catch(() => {});
        if (await hasHistoryTab()) {
          const tab = page.locator('.global-workbench-tabs button[data-tab-key="history"]').first();
          if ((await tab.count()) < 1) {
            const legacy = page.locator('[role=tab][data-tab-key="history"]').first();
            await expect(legacy).toBeVisible({ timeout: 12000 });
            await legacy.click({ timeout: 8000 });
          } else {
            await expect(tab).toBeVisible({ timeout: 12000 });
            await tab.click({ timeout: 8000 });
          }
          await page.waitForTimeout(900);
          return;
        }
        await historyDeepLink();
        if (!(await hasHistoryTab()) && !/培育推荐 · 最近分析/.test(await stack().innerText().catch(() => ''))) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-HISTORY-TAB-001：现场培育页无「最近分析」Tab/深链，无法自动化本用例',
          );
        }
      };
      const waitHistoryShell = async () => {
        const st = stack();
        for (let i = 0; i < 30; i++) {
          const t = await st.innerText().catch(() => '');
          if (/培育推荐 · 最近分析/.test(t) && (/REC-/.test(t) || /任务名称/.test(t) || /暂无|无历史|还没有/.test(t))) {
            return;
          }
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析未渲染（未见标题或任务表），url=' + page.url());
      };
      const pickCompletedCandidateHtmlReport = async () => {
        const st = stack();
        const buttons = st.locator('[data-recruit-history-open-html-report], button:has-text("查看 HTML 报告")');
        const n = await buttons.count();
        if (n < 1) {
          throw new Error(
            '环境闸门 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001：最近分析无「查看 HTML 报告」按钮（缺已完成候选工作台任务）',
          );
        }
        for (let i = 0; i < n; i++) {
          const btn = buttons.nth(i);
          if (await btn.isDisabled().catch(() => true)) continue;
          let row = btn.locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) {
            row = btn.locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          }
          const txt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (txt && /已完成/.test(txt) && /候选工作台/.test(txt)) {
            const taskCell = row.locator('td').first();
            const taskName = (await taskCell.count())
              ? (await taskCell.innerText().catch(() => '')).trim()
              : '';
            const recMatch = txt.match(/REC-[A-Za-z0-9-]+/);
            return { btn, taskName, taskIdToken: recMatch ? recMatch[0] : taskName, rowText: txt };
          }
        }
        throw new Error(
          '环境闸门 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001：最近分析无「已完成」的候选工作台任务可「查看 HTML 报告」（前置 1 不满足）',
        );
      };
      const waitReportReader = async () => {
        const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        for (let i = 0; i < 36; i++) {
          if (await reader.isVisible().catch(() => false)) return reader;
          await page.waitForTimeout(500);
        }
        throw new Error('点击 HTML 报告后未进入只读报告页，url=' + page.url());
      };
      await dismissBasket();
      await expect(page).toHaveURL(/\/enterprise\/attraction/);
      await expect(page).toHaveURL(/workspace=cultivation/);
      await openRecentTab();
      await waitHistoryShell();
      const picked = await pickCompletedCandidateHtmlReport();
      await picked.btn.scrollIntoViewIfNeeded();
      await picked.btn.click({ timeout: 15000 });
      const reader = await waitReportReader();
      globalThis.__func02227 = {
        readerReady: true,
        taskName: picked.taskName,
        taskIdToken: picked.taskIdToken,
        rowText: picked.rowText,
      };
      await expect(reader.locator('h1').filter({ hasText: '培育推荐报告' }).first()).toBeVisible({
        timeout: 12000,
      });
  - note: 2、报告身份中的任务与该行任务名称一致
    assert: |-
      if (!globalThis.__func02227?.readerReady) {
        throw new Error('环境闸门 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001（报告页未打开，身份断言跳过）');
      }
      const ctx = globalThis.__func02227;
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader).toBeVisible({ timeout: 8000 });
      const identity = reader.locator('[data-report-section="report-identity"]');
      await expect(identity).toBeVisible({ timeout: 8000 });
      const identityText = await identity.innerText();
      const taskLine = identityText
        .split('\n')
        .map((l) => l.trim())
        .find((l) => /任务[:：]/.test(l));
      if (!taskLine) {
        throw new Error('报告身份区未见「任务：」行；identity=' + identityText.slice(0, 320));
      }
      const taskName = (ctx.taskName || '').trim();
      const token = (ctx.taskIdToken || taskName || '').trim();
      if (!taskName && !token) {
        throw new Error('缺少最近分析行任务名称（上一步未写入 globalThis.__func02227）');
      }
      const lineOk =
        (taskName && taskLine.includes(taskName)) ||
        (token && taskLine.includes(token)) ||
        (taskName && token && taskLine.replace(/\s/g, '').includes(taskName.replace(/\s/g, '')));
      if (!lineOk) {
        throw new Error(
          '报告身份任务与行内任务名称不一致：行任务=' +
            taskName +
            ' token=' +
            token +
            '；身份行=' +
            taskLine +
            '；行摘要=' +
            (ctx.rowText || '').slice(0, 120),
        );
      }
  - note: 3、有「返回分析结果」
    assert: |-
      if (!globalThis.__func02227?.readerReady) {
        throw new Error('环境闸门 ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001（报告页未打开，返回钮断言跳过）');
      }
      const reader = page.locator('.system-report-reader[data-report-readonly="true"]');
      await expect(reader).toBeVisible({ timeout: 8000 });
      const back = reader.locator('[data-report-back], button').filter({ hasText: '返回分析结果' }).first();
      await expect(back).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/attraction + workspace=cultivation&recommendation_tab=cultivation&entry=history 兜底。步骤=最近分析点已完成「候选工作台」行 data-recruit-history-open-html-report「查看 HTML 报告」。机检=h1「培育推荐报告」+ report-identity「任务：」与行任务名称/REC token 互证 + data-report-back「返回分析结果」。无 Tab→ENV-CULTIVATE-NO-HISTORY-TAB-001；无可点 HTML 报告已完成候选工作台→ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001。D4·2026-10-20 rewrite-FUNC-02227 svcz 机跑 fail·ENV-CULTIVATE-NO-CANDIDATE-COMPLETED-001（最近分析无「已完成+候选工作台」且 enabled 的「查看 HTML 报告」行，三条 expect 均未触达报告页；与 02211 同源）。登录与关评审由 runner 前置。B 档零 allow_skip。
