id: FUNC-02227
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02227
priority: P1
tier: B
title: 候选工作台已完成任务可打开只读 HTML 报告
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 「培育企业推荐分析」
  - action: click
    target: 「最近分析」
expect:
  - note: 1、标题为「培育推荐报告」
    assert: |-
      const main = page.locator('main');
      const row = main.getByRole('row').filter({ hasText: '候选工作台' }).filter({ hasText: '已完成' }).first();
      await expect(row, '最近分析需有候选工作台且已完成的任务行').toBeVisible({ timeout: 15000 });
      const taskName = (await row.getByRole('cell').first().innerText()).trim();
      await page.evaluate((name) => { window.__FUNC_02227_TASK_NAME = name; }, taskName);
      await row.getByRole('button', { name: '查看 HTML 报告' }).click();
      await expect(main.getByRole('heading', { name: '培育推荐报告' })).toBeVisible({ timeout: 15000 });
  - note: 2、报告身份中的任务与该行任务名称一致
    assert: |-
      const taskName = await page.evaluate(() => window.__FUNC_02227_TASK_NAME);
      if (!taskName) throw new Error('需先命中候选工作台已完成行');
      const main = page.locator('main');
      const identity = main.filter({ hasText: '报告身份' });
      await expect(identity.getByText(taskName, { exact: false })).toBeVisible();
  - note: 3、有「返回分析结果」
    assert: |-
      await expect(page.getByRole('button', { name: '返回分析结果' })).toBeVisible();
on_fail: 截图 + 抄 X-Trace-Id
