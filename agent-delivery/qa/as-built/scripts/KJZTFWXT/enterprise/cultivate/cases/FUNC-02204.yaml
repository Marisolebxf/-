id: FUNC-02204
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02204
priority: P0
title: 主流程-候选表列
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: A
preconditions:
  - 候选名单非空（assert 自含对比篮/企业查询加入培育候选兜底）
locators:
  cand_tab: tab「候选工作台」
  workbench_title: 文案「人工线索候选工作台」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates
  - action: evaluate
    note: 打开「候选工作台」Tab（标题与列断言在 expect）
expect:
  - note: 1、标题为「人工线索候选工作台」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const origin = new URL(page.url()).origin;
      const stack = () => page.getByTestId('recruit-tab-stack');
      const actionBar = () => stack().getByTestId('candidate-action-bar');
      const candRoute =
        '/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const isCandidateWorkspace = async () => {
        if (!(await candTab().count())) return false;
        return (await candTab().getAttribute('aria-selected').catch(() => '')) === 'true';
      };
      const openCandidateTab = async () => {
        if (await isCandidateWorkspace()) return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if (!(await isCandidateWorkspace())) {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if (!(await isCandidateWorkspace())) {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const rowCount = async () => stack().locator('.arco-table-body .arco-table-tr').count();
      const hasCandidatePanel = async () => {
        const bar = actionBar();
        return (await bar.count()) > 0 && (await bar.first().isVisible().catch(() => false));
      };
      const ensureOneCandidate = async () => {
        await openCandidateTab();
        if (await hasCandidatePanel()) return;
        let rows = await rowCount();
        if (rows > 0) return;
        const tryBasket = async () => {
          const dock = page.getByRole('button', { name: /打开对比篮/ });
          if (!(await dock.count())) return false;
          await dock.first().click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const addC = page.getByRole('button', { name: '加入培育候选' });
          if (!(await addC.count())) return false;
          const sels = page.locator('[aria-label^="选择 "]');
          if (await sels.count()) await sels.first().click();
          await page.waitForTimeout(400);
          if (!(await addC.first().isEnabled())) return false;
          await addC.first().click({ timeout: 8000 });
          await page.waitForTimeout(1000);
          await page.keyboard.press('Escape').catch(() => {});
          return true;
        };
        if (await tryBasket()) {
          await openCandidateTab();
          if (await hasCandidatePanel()) return;
        }
        await page.goto(origin + searchRoute, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const addOpt = page.getByText('加入培育候选', { exact: true }).first();
        if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await page.goto(origin + candRoute, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if (!(await hasCandidatePanel())) {
          const txt = await page.locator('body').innerText({ timeout: 5000 }).catch(() => '');
          throw new Error(
            '环境闸门 ENV-CULTIVATE-CANDIDATE-EMPTY：候选工作台无企业（对比篮/企业查询加入后仍为空）: ' +
              txt.slice(0, 160),
          );
        }
      };
      const assertCandidateNonEmpty = async () => {
        const t = ((await stack().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/共\s*[1-9]\d*\s*家/.test(t)) return;
        const del = stack().getByRole('button', { name: '删除' });
        if ((await del.count()) > 0) return;
        throw new Error('前置「候选名单非空」不满足：未见「共 N 家」(N≥1) 或行内「删除」');
      };
      await dismissBasket();
      await ensureOneCandidate();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({
        timeout: 10000,
      });
      await assertCandidateNonEmpty();
  - note: 2、列含企业名称、所属产业、企业规模、线索来源、加入时间、状态、操作
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const REQUIRED = ['企业名称', '所属产业', '企业规模', '线索来源', '加入时间', '状态', '操作'];
      const t = ((await stack().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const missing = REQUIRED.filter((c) => !t.includes(c));
      if (missing.length) {
        throw new Error('候选表缺列：' + missing.join('、') + '；stack 摘要=' + t.slice(0, 220));
      }
      await expect(stack().getByRole('button', { name: '删除' }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path + workspace=cultivation&recommendation_tab=cultivation&entry=candidates。步骤=打开「候选工作台」。机检 recruit-tab-stack 文案含 7 列表头 + 行内「删除」按钮（Arco tbody tr 计数不可靠，非空以「共 N 家」/删除钮为准）。前置兜底同 FUNC-02205。D4·2026-10-20 rewrite-FUNC-02204 svcz 2/2 expect 绿。候选空→ ENV-CULTIVATE-CANDIDATE-EMPTY。登录与关评审由 runner 前置。A 档零 allow_skip。
