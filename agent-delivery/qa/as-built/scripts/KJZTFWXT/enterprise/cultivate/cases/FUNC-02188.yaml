id: FUNC-02188
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02188
priority: P1
tier: B
title: 产业类别选人工智能后发起分析并到达培育推荐成功结果
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: evaluate
    note: 产业类别选人工智能并开始分析（机检在 expect）
expect:
  - note: 1、过程中出现「可视化分析过程」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const main = page.locator('main');
      await expect(main).toBeVisible({ timeout: 15000 });
      const heading = page.getByRole('heading', { name: '培育企业推荐分析' });
      if (!(await heading.isVisible().catch(() => false))) {
        await page.getByRole('menuitem', { name: '培育企业推荐分析' }).click({ timeout: 8000 });
        await expect(heading).toBeVisible({ timeout: 15000 });
      }
      const tab = page.getByRole('tab', { name: '条件筛选推荐' }).first();
      if ((await tab.getAttribute('aria-selected')) !== 'true') {
        await tab.click({ timeout: 8000 });
      }
      await page.keyboard.press('Escape').catch(() => {});
      const selectView = main.locator('input[placeholder="全部产业类别"]').locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]');
      await selectView.click({ timeout: 8000 });
      const opt = page.locator('.arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first();
      await expect(opt).toBeVisible({ timeout: 8000 });
      const industryEcho = ((await opt.innerText().catch(() => '')) || '人工智能').trim();
      await opt.click({ timeout: 8000 });
      const start = main.getByRole('button', { name: '开始分析' }).first();
      await expect(start).toBeEnabled({ timeout: 8000 });
      await start.click({ timeout: 8000 });
      let sawProcess = false;
      let sameDayOpen = false;
      let last = '';
      for (let i = 0; i < 16; i++) {
        await page.waitForTimeout(i === 0 ? 800 : 2000);
        last = await stack().innerText().catch(() => '');
        const url = page.url();
        if (/可视化分析过程/.test(last) || url.includes('analysis_view=processing')) {
          sawProcess = true;
          break;
        }
        if (/已打开今天相同条件的推荐分析结果/.test(last)) {
          sameDayOpen = true;
          break;
        }
        const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
        if (failVis) {
          throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001：发起后进入推荐分析失败');
        }
        const viewResult = stack().getByRole('button', { name: '查看结果' }).first();
        if (await viewResult.isVisible().catch(() => false)) {
          await viewResult.click({ timeout: 5000 }).catch(() => {});
        }
      }
      globalThis.__func02188 = { industryEcho, sawProcess, sameDayOpen, lastBody: last };
      if (sameDayOpen && !sawProcess) {
        throw new Error('当天复用已有结果，未进入新的「可视化分析过程」');
      }
      if (!sawProcess) {
        throw new Error('过程中未出现「可视化分析过程」: ' + last.slice(0, 240));
      }
      await expect(stack().getByText('可视化分析过程').first()).toBeVisible({ timeout: 5000 });
  - note: 2、结束后出现「培育推荐分析结果」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const title = () => stack().getByText('培育推荐分析结果').first();
      const ctx = globalThis.__func02188;
      if (!ctx) throw new Error('前置：未完成条件筛选发起');
      let last = ctx.lastBody || '';
      let ok = false;
      for (let i = 0; i < 60; i++) {
        await page.waitForTimeout(i === 0 ? 500 : 2500);
        last = await stack().innerText().catch(() => '');
        const titleVis = await title().isVisible().catch(() => false);
        if (titleVis && !/可视化分析过程/.test(last)) {
          ok = true;
          break;
        }
        const failVis = await stack().getByText('推荐分析失败').first().isVisible().catch(() => false);
        if (failVis && !/可视化分析过程/.test(last)) {
          throw new Error('ENV-CULTIVATE-ANALYSIS-FAIL-001：无法到达培育推荐分析结果');
        }
        if (/已打开今天相同条件的推荐分析结果/.test(last) && titleVis) {
          ok = true;
          break;
        }
        const viewResult = stack().getByRole('button', { name: '查看结果' }).first();
        if (await viewResult.isVisible().catch(() => false)) {
          await viewResult.click({ timeout: 5000 }).catch(() => {});
        }
      }
      if (!ok) {
        if (/可视化分析过程/.test(last) || page.url().includes('analysis_view=processing')) {
          throw new Error('ENV-CULTIVATE-ASYNC-NO-SUCCESS-001：长期停留在可视化分析过程');
        }
        throw new Error('未在超时内到达培育推荐分析结果: ' + last.slice(0, 240));
      }
      await expect(title()).toBeVisible({ timeout: 8000 });
      ctx.lastBody = last;
  - note: 3、本次筛选含本次选择的产业类别
    assert: |-
      const ctx = globalThis.__func02188;
      if (!ctx?.lastBody) throw new Error('前置：未到达成功结果');
      const body = await page.getByTestId('recruit-tab-stack').innerText().catch(() => ctx.lastBody || '');
      if (!/本次筛选/.test(body)) throw new Error('成功结果未见「本次筛选」');
      const echo = ctx.industryEcho || '人工智能';
      const tokens = [echo, '人工智能'];
      const tagAfter = await page
        .locator('main input[placeholder="全部产业类别"]')
        .locator('xpath=ancestor::*[contains(@class,"arco-select-view")][1]')
        .innerText()
        .catch(() => '');
      if (tagAfter && tagAfter.length >= 2 && !tokens.includes(tagAfter.trim())) tokens.push(tagAfter.trim());
      const hit = tokens.some((tok) => tok && tok.length >= 2 && body.includes(tok));
      if (!hit) {
        throw new Error('本次筛选未含所选产业类别；tokens=' + tokens.join('|'));
      }
on_fail: 截图 + 抄 X-Trace-Id
