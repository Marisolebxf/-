id: FUNC-02216
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02216
priority: P1
tier: B
title: 导出数据保持不可用且不会下载文件
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 培育企业推荐分析
  - action: wait
    ms: 800
  - action: evaluate
    note: 同册02188到达培育推荐分析结果后点「导出数据」
    script: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const resultTitle = () => stack().getByText('培育推荐分析结果').first();
      const failTitle = () => stack().getByText('推荐分析失败').first();
      const historyRow = () =>
        stack()
          .locator('.arco-table tbody tr')
          .filter({ hasText: '条件筛选' })
          .filter({ has: page.locator('.arco-tag', { hasText: '已完成' }) })
          .first();

      await expect(stack()).toBeVisible({ timeout: 15000 });

      const openResult = async () => {
        if (await resultTitle().isVisible().catch(() => false)) return;
        await stack().getByText('最近分析', { exact: true }).click();
        if (await historyRow().isVisible().catch(() => false)) {
          await historyRow().getByRole('button', { name: '恢复结果' }).click();
          await page.waitForURL(/analysis_view=result/, { timeout: 60000 }).catch(() => {});
          if (await resultTitle().isVisible().catch(() => false)) return;
        }
        await stack().getByText('条件筛选推荐', { exact: true }).click();
        const main = stack();
        const ind = main.locator('.arco-select-view').filter({ hasText: '全部产业类别' }).first();
        if (await ind.isVisible().catch(() => false)) {
          await ind.click();
          await page.locator('.arco-select-dropdown:visible').getByText('人工智能', { exact: true }).click();
        }
        await main.getByRole('button', { name: '开始分析' }).click();
        await Promise.race([
          resultTitle().waitFor({ state: 'visible', timeout: 180000 }),
          failTitle().waitFor({ state: 'visible', timeout: 180000 }),
        ]);
        if (await failTitle().isVisible().catch(() => false)) {
          throw new Error('BLOCKED:修订 已发起仍为空结果壳');
        }
        await expect(resultTitle()).toBeVisible({ timeout: 15000 });
      };

      await openResult();
      if (!(await resultTitle().isVisible().catch(() => false))) {
        throw new Error('BLOCKED:修订 已发起仍为空结果壳');
      }

      const exportBtn = stack().getByRole('button', { name: '导出数据' });
      await expect(exportBtn).toBeVisible({ timeout: 15000 });
      let downloaded = false;
      page.once('download', () => {
        downloaded = true;
      });
      await exportBtn.click({ force: true, timeout: 3000 }).catch(() => {});
      await page.waitForTimeout(800);
      await page.evaluate(
        (v) => sessionStorage.setItem('func02216_downloaded', v ? '1' : '0'),
        downloaded,
      );
expect:
  - note: 1、「导出数据」保持不可用
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByRole('button', { name: '导出数据' })).toBeDisabled();
  - note: 2、不产生下载文件
    assert: |-
      const flag = await page.evaluate(() => sessionStorage.getItem('func02216_downloaded'));
      if (flag !== '0') throw new Error('产生了下载文件');
on_fail: 截图 + 抄 X-Trace-Id
