id: FUNC-02213
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02213
priority: P1
tier: B
title: 主流程-HTML报告（条件筛选起源）
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: click
    target: |-
      await page.getByRole('tab', { name: '最近分析' }).click()
  - action: click
    target: |-
      const historyMain = page.locator('main');
      const row = historyMain
        .locator('tbody tr')
        .filter({ hasText: '已完成' })
        .filter({ hasNotText: '候选工作台' })
        .filter({ has: page.getByRole('button', { name: '查看 HTML 报告' }) })
        .first();
      const btn = row.getByRole('button', { name: '查看 HTML 报告' });
      await expect(btn).toBeVisible();
      await expect(btn).toBeEnabled();
      await btn.click();
expect:
  - note: 标题为「培育推荐报告」
    assert: |-
      await expect(page.locator('main').getByText('培育推荐报告').first()).toBeVisible()
  - note: 目录含报告身份、执行摘要、对象与范围、关键发现、证据与分析、数据来源与生成说明、局限性与使用边界
    assert: |-
      const main = page.locator('main');
      for (const label of ['报告身份', '执行摘要', '对象与范围', '关键发现', '证据与分析', '数据来源与生成说明', '局限性与使用边界']) {
        await expect(main.getByText(label).first()).toBeVisible();
      }
  - note: 有「返回分析结果」
    assert: |-
      await expect(page.getByRole('button', { name: '返回分析结果' })).toBeVisible()
on_fail: 截图 + 抄 X-Trace-Id
