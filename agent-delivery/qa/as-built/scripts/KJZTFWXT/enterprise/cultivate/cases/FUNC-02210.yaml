id: FUNC-02210
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02210
priority: P0
tier: B
title: 最近分析恢复条件筛选已完成任务打开推荐结果
entry_id: ent-cultivate
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/attraction
  - action: click
    target: 培育企业推荐分析
  - action: wait
    ms: 800
  - action: evaluate
    note: 同册02188补已完成条件筛选任务，最近分析点恢复结果
    script: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const historyRow = () =>
        stack()
          .locator('.arco-table tbody tr')
          .filter({ hasText: '条件筛选' })
          .filter({ has: page.locator('.arco-tag', { hasText: '已完成' }) })
          .first();

      await expect(stack()).toBeVisible({ timeout: 15000 });
      await stack().getByText('最近分析', { exact: true }).click();

      if (!(await historyRow().isVisible().catch(() => false))) {
        await stack().getByText('条件筛选推荐', { exact: true }).click();
        const main = stack();
        await main.locator('.arco-select-view').filter({ hasText: '全部产业类别' }).first().click();
        await page.locator('.arco-select-dropdown:visible').getByText('人工智能', { exact: true }).click();
        await main.getByRole('button', { name: '开始分析' }).click();
        const failTitle = main.getByText('推荐分析失败').first();
        const resultTitle = main.getByText('培育推荐分析结果').first();
        await Promise.race([
          resultTitle.waitFor({ state: 'visible', timeout: 180000 }),
          failTitle.waitFor({ state: 'visible', timeout: 180000 }),
        ]);
        if (await failTitle.isVisible().catch(() => false)) {
          throw new Error('BLOCKED:修订 已发起仍为空结果壳');
        }
        await expect(resultTitle).toBeVisible({ timeout: 5000 });
        await stack().getByText('最近分析', { exact: true }).click();
        await expect(historyRow()).toBeVisible({ timeout: 15000 });
      }

      const row = historyRow();
      const rowText = ((await row.innerText()) || '').replace(/\s+/g, ' ');
      const condCell = row.locator('td').nth(1);
      const summaryText = ((await condCell.innerText().catch(() => rowText)) || rowText).trim();
      const filterPart = summaryText.includes('·')
        ? summaryText.split('·').slice(1).join('·').trim()
        : summaryText.replace(/^条件筛选\s*/, '').trim();
      await page.evaluate(
        (p) => sessionStorage.setItem('func02210', JSON.stringify(p)),
        { filterPart, summaryText },
      );
      await row.getByRole('button', { name: '恢复结果' }).click();
      await page.waitForURL(/analysis_view=result/, { timeout: 60000 }).catch(() => {});
      await expect(stack().getByText('培育推荐分析结果').first()).toBeVisible({ timeout: 60000 });
expect:
  - note: 1、出现「培育推荐分析结果」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByText('培育推荐分析结果').first()).toBeVisible({ timeout: 15000 });
  - note: 2、有「调整分析条件」
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack().getByRole('button', { name: '调整分析条件' })).toBeVisible({ timeout: 15000 });
  - note: 3、本次筛选与该行条件摘要相符
    assert: |-
      const raw = await page.evaluate(() => sessionStorage.getItem('func02210'));
      const ctx = raw ? JSON.parse(raw) : null;
      if (!ctx?.filterPart) throw new Error('前置：未记录条件摘要');
      const stack = () => page.getByTestId('recruit-tab-stack');
      const parts = String(ctx.filterPart)
        .split('/')
        .map((s) => s.trim())
        .filter((s) => s && s !== '—');
      for (const part of parts) {
        await expect(stack().getByText(part, { exact: false }).first()).toBeVisible({ timeout: 15000 });
      }
on_fail: 截图 + 抄 X-Trace-Id
