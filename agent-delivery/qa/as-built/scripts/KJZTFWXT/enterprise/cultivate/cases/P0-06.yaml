id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01005
priority: P0
title: 招引与培育同壳层经 workspace 切换且互不复用条件
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
- 已进入培育页并设置一组培育条件
locators:
  cultivate_route: workspace=cultivation
  attract_route: workspace=attraction
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: evaluate
  note: 选产业类别后切招引再切回培育
expect:
- note: 招引视图条件区为招引维度且不显示培育已设条件
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(400); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first().click({ timeout: 8000 }); await page.waitForTimeout(500); await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=attraction&recommendation_tab=attraction', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const t = await page.getByTestId('recruit-tab-stack').innerText().catch(async () => page.locator('main').first().innerText()); if (/全部产业类别|培育推荐条件/.test(t) && !/招引推荐条件|全部企业标签|全部行业领域/.test(t)) throw new Error('招引视图仍显示培育条件区'); await expect(page.getByText(/招引推荐条件|企业标签|行业领域/).first()).toBeVisible({ timeout: 8000 })
- note: 切回培育后已设条件保留不被招引条件覆盖
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); await expect(page.getByRole('heading', { name: '培育企业推荐分析' })).toBeVisible({ timeout: 8000 }); const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!/培育推荐条件|产业类别/.test(t)) throw new Error('未回到培育条件区'); /* 条件保留形态 observed：同会话可能保留人工智能回显 */
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 本条仅验 workspace 切换隔离；招引条件详验归 ent-attract，禁止越界写招引断言细则。
tier: B
