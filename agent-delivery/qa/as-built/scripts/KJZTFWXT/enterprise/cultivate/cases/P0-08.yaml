id: P0-08
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01007
priority: P0
title: 条件区呈现 8 个产业链快捷项且集合与生产环境一致
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
- 已进入页面且停留条件筛选推荐 Tab
locators:
  industry_select: 产业类别下拉 8 option
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: click
  target: 产业类别下拉
expect:
- note: 快捷标签含集成电路、生物医药、人工智能、新能源、低空经济、量子信息、海洋经济、智能机器人 8 项
  assert: |-
    await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(500); const opts = await page.locator('.arco-trigger-popup:visible .arco-select-option').allTextContents(); const joined = opts.map(s => s.trim()).join('|'); for (const c of ['集成电路','生物医药','人工智能','新能源','低空经济','量子信息','海洋经济','智能机器人']) { if (!joined.includes(c)) throw new Error('缺产业链项: ' + c) }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 用例写「快捷标签」；实勘页内无可见 chip，8 项仅在产业类别下拉 option（同 sz-status P0-02 口径）。
tier: B
