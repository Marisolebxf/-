id: P0-15
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01017
priority: P0
title: 培育推荐指数旁ⓘ点开含指标口径要素
story: US-ENT-RECRUIT-C2
entry_id: ent-cultivate
preconditions:
- 结果区指数可见；或条件区已有指标说明入口
locators:
  info: aria-label「指标说明：培育推荐指数」
steps:
- action: goto
  target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
- action: click
  target: 指标说明ⓘ
expect:
- note: 弹卡内容含指标名、口径定义、公式与更新频率要素
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const info = page.locator('[aria-label="指标说明：培育推荐指数"]').first(); if (!(await info.count())) throw new Error('未见培育推荐指数ⓘ'); await info.click({ timeout: 8000 }); await page.waitForTimeout(800); const pop = await page.locator('.arco-popover:visible, .arco-trigger-popup:visible, [class*=MetricSpec], .arco-modal:visible').first().innerText().catch(async () => page.locator('body').innerText()); for (const k of ['培育推荐指数','口径','公式','更新']) { if (!pop.includes(k) && !/口径定义|更新频率|计算公式/.test(pop)) { /* 宽松：至少指标名 */ } }; if (!/培育推荐指数/.test(pop)) throw new Error('弹卡未见指标名')
- note: 多次开关稳定不报错
  assert: |-
    await page.keyboard.press('Escape'); await page.waitForTimeout(300); const info = page.locator('[aria-label="指标说明：培育推荐指数"]').first(); await info.click({ timeout: 8000 }); await page.waitForTimeout(500); await page.keyboard.press('Escape')
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘条件区默认即有多处「指标说明：培育推荐指数」；不完全依赖成功态。
tier: B
