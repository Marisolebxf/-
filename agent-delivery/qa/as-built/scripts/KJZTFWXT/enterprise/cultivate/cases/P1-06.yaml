id: P1-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01027
priority: P1
title: 成功态后调整条件出现重分析提示且显式发起后结果更新
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
preconditions:
- 已成功完成一次分析
locators:
  hint: 调整条件后将重新发起培育推荐分析
steps:
- action: evaluate
  note: 调整条件并显式重跑
expect:
- note: 条件调整后出现「调整条件后将重新发起培育推荐分析」提示
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const ind = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="全部产业类别"]') }).first(); await ind.click({ timeout: 8000 }); await page.waitForTimeout(300); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '人工智能' }).first().click({ timeout: 8000 }); await page.waitForTimeout(400); const start = page.getByRole('button', { name: '开始分析' }); if (!(await start.isDisabled())) { await start.click(); await page.waitForTimeout(3000) }; await ind.click({ timeout: 8000 }); await page.waitForTimeout(300); await page.locator('.arco-trigger-popup:visible .arco-select-option').filter({ hasText: '新能源' }).first().click({ timeout: 8000 }); await page.waitForTimeout(600); const t = await page.getByTestId('recruit-tab-stack').innerText(); if (!/调整条件后将重新发起培育推荐分析/.test(t)) throw new Error('ALLOW_SKIP: 未见重分析提示（可能未达成功态）')
- note: 重分析须显式发起不静默自动重跑
  assert: await expect(page).not.toHaveURL(/analysis_view=processing/); /* 调整后不应自动进入 processing */
- note: 完成后结果按新条件更新旧结果不残留
  assert: 'throw new Error(''ALLOW_SKIP: 依赖重跑成功终态'')'
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 成功态/重跑成功不可达时 Pass-N/A；提示文案尽量验
as_built_note: 提示原文「调整条件后将重新发起培育推荐分析」。
tier: B
