id: FUNC-02242
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02242
priority: P1
title: 备选-清空确定
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 候选名单非空（assert 自含对比篮/企业查询加入培育候选兜底）
locators:
  cand_tab: tab「候选工作台」
  clear_btn: button「清空名单」
  modal_ok: 弹窗 button「确定」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates
  - action: evaluate
    note: 候选工作台→点清空名单→弹窗验标题→点确定；空名单 expect 判定
expect:
  - note: 1、名单不再有企业行
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const origin =
        typeof baseUrl === 'string' && baseUrl
          ? baseUrl.replace(/\/$/, '')
          : new URL(page.url()).origin;
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const candRoute =
        '/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const openCandidateTab = async () => {
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) === 'true') return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const dataRows = () => stack().locator('.arco-table-tr:has(.arco-table-td)');
      const rowCount = async () => {
        const rows = dataRows();
        const n = await rows.count();
        let c = 0;
        for (let i = 0; i < n; i++) {
          const t = ((await rows.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
          if (/^企业名称/.test(t)) continue;
          if (!/公司|集团|有限|科技|股份|企业/.test(t)) continue;
          c++;
        }
        return c;
      };
      const seedViaSearch = async () => {
        await page.goto(toUrl(searchRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1500);
        await dismissBasket();
        await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
        await page.getByRole('button', { name: '搜索' }).click();
        await page.waitForTimeout(5000);
        await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const addOpt = page.getByText('加入培育候选', { exact: true }).first();
        if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
      };
      const ensureOneCandidate = async () => {
        await openCandidateTab();
        if ((await rowCount()) > 0) return;
        await seedViaSearch();
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if ((await rowCount()) > 0) return;
        const tryBasket = async () => {
          const dock = page.getByRole('button', { name: /打开对比篮/ });
          if (!(await dock.count())) return false;
          await dock.first().click({ timeout: 8000 });
          await page.waitForTimeout(800);
          const addC = page.getByRole('button', { name: '加入培育候选' });
          if (!(await addC.count())) return false;
          const sels = page.locator('[aria-label^="选择 "]');
          if (await sels.count()) await sels.first().click();
          await page.waitForTimeout(400);
          if (!(await addC.first().isEnabled())) return false;
          await addC.first().click({ timeout: 8000 });
          await page.waitForTimeout(1000);
          await page.keyboard.press('Escape').catch(() => {});
          return true;
        };
        if (await tryBasket()) {
          await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(2000);
          await openCandidateTab();
        }
        if ((await rowCount()) < 1) {
          throw new Error('环境闸门 ENV-CULTIVATE-CANDIDATE-EMPTY：候选工作台无企业');
        }
      };
      await dismissBasket();
      await ensureOneCandidate();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({
        timeout: 10000,
      });
      if ((await rowCount()) < 1) throw new Error('清空前候选表应有企业行');
      const clearBtn = stack().getByRole('button', { name: '清空名单' }).first();
      await expect(clearBtn).toBeVisible({ timeout: 8000 });
      await expect(clearBtn).toBeEnabled({ timeout: 8000 });
      await clearBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal-wrapper:visible .arco-modal, .arco-modal:visible').last();
      await expect(modal).toBeVisible({ timeout: 8000 });
      const title = modal.locator('.arco-modal-title, [class*=modal-title]').first();
      const titleText = ((await title.innerText().catch(() => '')) || '').trim();
      if (!/清空候选名单/.test(titleText)) {
        throw new Error('弹窗标题非「清空候选名单」: ' + titleText);
      }
      const okBtn = modal.getByRole('button', { name: '确定', exact: true }).first();
      await expect(okBtn).toBeVisible({ timeout: 5000 });
      await okBtn.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const modalAfter = page.locator('.arco-modal-wrapper:visible .arco-modal, .arco-modal:visible');
      if (await modalAfter.count()) {
        const vis = await modalAfter.first().isVisible().catch(() => false);
        if (vis) throw new Error('点确定后清空候选名单弹窗仍打开');
      }
      const rowsAfter = await rowCount();
      if (rowsAfter !== 0) {
        throw new Error('确定清空后候选表仍应有 0 行企业数据，实际=' + rowsAfter);
      }
      const entCell = stack()
        .locator('.arco-table-content, .arco-table')
        .getByText(/公司|集团|有限|科技|股份|企业/)
        .filter({ hasNotText: /^企业名称/ });
      const entN = await entCell.count();
      for (let i = 0; i < entN; i++) {
        const t = ((await entCell.nth(i).innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/^企业名称/.test(t)) continue;
        if (/公司|集团|有限|科技|股份|企业/.test(t) && t.length > 4) {
          throw new Error('确定清空后表内仍见企业名: ' + t.slice(0, 40));
        }
      }
  - note: 2、待复核为 0 家
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      await expect(stack()).toBeVisible({ timeout: 10000 });
      const tag = stack().locator('.arco-tag').filter({ hasText: /待复核\s*\d+\s*家/ }).first();
      await expect(tag).toBeVisible({ timeout: 8000 });
      const tagT = ((await tag.innerText({ timeout: 5000 }).catch(() => '')) || '').replace(/\s+/g, ' ');
      const pm = tagT.match(/待复核\s*(\d+)\s*家/);
      const pending = pm ? Number(pm[1]) : -1;
      if (pending !== 0) {
        throw new Error('确定清空后待复核应为 0 家，实际=' + pending + '（' + tagT + '）');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path + workspace=cultivation&recommendation_tab=cultivation&entry=candidates。步骤=候选工作台「清空名单」→Modal「清空候选名单」→「确定」。机检=清空后无企业数据行+待复核 0 家（空态可不显「共 0 家」，不扩断言；取消路径见 02233）。前置兜底同 02231（企业查询/对比篮「加入培育候选」）。D4·2026-10-20 rewrite-FUNC-02242 svcz 2/2 expect 绿。会清掉共享名单。登录与关评审由 runner 前置。B 档零 allow_skip。
