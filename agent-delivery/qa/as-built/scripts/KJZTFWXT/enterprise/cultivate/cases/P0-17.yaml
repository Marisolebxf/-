id: P0-17
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01019
priority: P0
title: 候选工作台 Tab 展示候选企业列表且空列表有空态占位
story: US-ENT-RECRUIT-L1
entry_id: ent-cultivate
preconditions:
  - 已进入培育页
locators:
  tab: '[data-tab-key="candidates"]' / getByRole(tab, name=候选工作台, exact)
  stack: data-testid=recruit-tab-stack
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation
  - action: click
    target: 候选工作台
expect:
  - note: 列表含企业、线索来源、加入人时间与状态类字段
    assert: |-
      await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1200); const closeB = page.locator('[aria-label="关闭对比篮"]'); if (await closeB.count()) { const v = await closeB.first().isVisible().catch(()=>false); if (v) await closeB.first().click().catch(()=>{}) }; const byKey = page.locator('[data-tab-key="candidates"]').first(); if (await byKey.count()) await byKey.click({ timeout: 8000 }); else await page.getByRole('tab', { name: '候选工作台', exact: true }).click({ timeout: 8000 }); await page.waitForTimeout(1000); await expect(page).toHaveURL(/entry=candidates/); const t = await page.getByTestId('recruit-tab-stack').innerText(); const cols = ['企业名称','线索来源','加入时间','状态']; const hasCols = cols.every((c) => t.includes(c)); const emptyOk = /暂无数据|共\s*0\s*家|暂无候选/.test(t); if (!hasCols && !emptyOk) throw new Error('候选列表缺列且非空态: ' + cols.filter((c) => !t.includes(c)).join(',')); await expect(page.getByText(/人工线索候选工作台|候选工作台/).first()).toBeVisible({ timeout: 8000 })
  - note: 空列表呈现空态占位不报错
    assert: |-
      const t = await page.getByTestId('recruit-tab-stack').innerText(); const emptyOk = /暂无数据|共\s*0\s*家|暂无候选/.test(t); const hasRows = /待分析|共\s*[1-9]\s*家/.test(t); if (!emptyOk && !hasRows) throw new Error('未见空态占位也无候选行'); await expect(page).toHaveURL(/workspace=cultivation/)
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: data-tab-key=candidates；实勘常有对比篮人工线索「待分析」；列含所属产业/企业规模亦可。env-gate overall=pass。A 档零 allow_skip。list 相对父键 2 空格缩进。
tier: A
