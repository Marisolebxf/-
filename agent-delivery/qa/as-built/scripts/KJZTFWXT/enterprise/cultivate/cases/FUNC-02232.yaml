id: FUNC-02232
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02232
priority: P1
title: 备选-移除所选取消
story: US-ENT-RECRUIT-C1
entry_id: ent-cultivate
tier: B
preconditions:
  - 已勾选 1 家候选（assert 自含对比篮/企业查询加入培育候选兜底）
locators:
  cand_tab: tab「候选工作台」
  remove_btn: button「移除所选」
  modal_cancel: 弹窗 button「取消」
steps:
  - action: goto
    target: /enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates
  - action: evaluate
    note: 勾选 1 家→点移除所选→验弹窗标题→取消；名单与已选计数在 expect 判定
expect:
  - note: 1、弹出框标题为「移除所选」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const origin = (typeof baseUrl === 'string' && baseUrl)
        ? baseUrl.replace(/\/$/, '')
        : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const stack = () => page.getByTestId('recruit-tab-stack');
      const actionBar = () => stack().getByTestId('candidate-action-bar');
      const candRoute =
        '/enterprise/attraction?workspace=cultivation&recommendation_tab=cultivation&entry=candidates';
      const searchRoute = '/enterprise/enterprise-search';
      const candTab = () => page.getByRole('tab', { name: '候选工作台' }).first();
      const openCandidateTab = async () => {
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) === 'true') return;
        await expect(candTab()).toBeVisible({ timeout: 10000 });
        await candTab().click({ timeout: 10000 });
        await page.waitForTimeout(900);
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          const byKey = page.locator('button[data-tab-key="candidates"]').first();
          if (await byKey.count()) {
            await byKey.click({ timeout: 8000, force: true });
            await page.waitForTimeout(900);
          }
        }
        if ((await candTab().getAttribute('aria-selected').catch(() => '')) !== 'true') {
          throw new Error('未能打开候选工作台（候选页签 aria-selected≠true）');
        }
      };
      const parseSelectedCount = (t) => {
        const m = (t || '').replace(/\s+/g, ' ').match(/已选\s*(\d+)\s*家/);
        return m ? Number(m[1]) : -1;
      };
      const readRowName = async (row) => {
        const link = row.getByRole('link').first();
        if (await link.count()) {
          const raw = ((await link.innerText({ timeout: 8000 }).catch(() => '')) || '').trim();
          if (raw.length >= 2) return raw;
        }
        const txt = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').trim();
        const parts = txt.split(/\s+/).filter((p) => p.length >= 2 && !/^\d+(\.\d+)?$/.test(p));
        const hit = parts.find((p) => /公司|集团|有限|科技|股份|企业/.test(p));
        if (hit) return hit;
        if (parts[0]) return parts[0];
        return txt.slice(0, 40);
      };
      const ensureOneCandidate = async () => {
        await openCandidateTab();
        const bar = actionBar();
        if ((await bar.count()) && (await bar.first().isVisible().catch(() => false))) return;
        const seedViaSearch = async () => {
          await page.goto(toUrl(searchRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
          await dismissBasket();
          await page.getByRole('textbox', { name: /输入企业名/ }).fill('人工智能');
          await page.getByRole('button', { name: '搜索' }).click();
          await page.waitForTimeout(5000);
          await page.getByRole('button', { name: '引育候选' }).first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
          const addOpt = page.getByText('加入培育候选', { exact: true }).first();
          if (await addOpt.count()) await addOpt.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
        };
        await seedViaSearch();
        await page.goto(toUrl(candRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(2000);
        await openCandidateTab();
        if (!(await actionBar().count()) || !(await actionBar().first().isVisible().catch(() => false))) {
          throw new Error('环境闸门 ENV-CULTIVATE-CANDIDATE-EMPTY：候选工作台无企业');
        }
      };
      const checkTargetRow = async (targetRow) => {
        await expect(actionBar()).toBeVisible({ timeout: 10000 });
        for (let attempt = 0; attempt < 4; attempt++) {
          const cb = targetRow.locator('.arco-checkbox, input[type=checkbox]').first();
          if (await cb.count()) {
            const checked = (await cb.getAttribute('class'))?.includes('arco-checkbox-checked');
            if (!checked) await cb.click({ timeout: 8000, force: true });
          } else {
            await targetRow.click({ timeout: 8000, force: true }).catch(() => {});
          }
          await page.waitForTimeout(700);
          if (parseSelectedCount(await actionBar().innerText().catch(() => '')) === 1) return;
        }
        throw new Error('勾选首行后已选仍为 ' + parseSelectedCount(await actionBar().innerText().catch(() => '')));
      };
      await dismissBasket();
      await ensureOneCandidate();
      await expect(stack().getByText('人工线索候选工作台', { exact: false }).first()).toBeVisible({
        timeout: 10000,
      });
      const rows = stack().locator('.arco-table-tr:has(.arco-table-td)');
      const n = await rows.count();
      let targetName = '';
      let targetRow = null;
      for (let i = 0; i < n; i++) {
        const row = rows.nth(i);
        const t = ((await row.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (/^企业名称/.test(t)) continue;
        if (!/公司|集团|有限|科技|股份|企业/.test(t)) continue;
        targetRow = row;
        targetName = await readRowName(row);
        break;
      }
      if (!targetRow || !targetName) throw new Error('候选表无可用数据行');
      await checkTargetRow(targetRow);
      const selectedBefore = parseSelectedCount(await actionBar().innerText().catch(() => ''));
      if (selectedBefore !== 1) {
        throw new Error('用例要求已选 1 家，现场=' + selectedBefore);
      }
      page.__func02232 = { targetName, selectedBefore };
      const removeBtn = actionBar().getByRole('button', { name: '移除所选' }).first();
      await expect(removeBtn).toBeEnabled({ timeout: 8000 });
      await removeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal-wrapper:visible .arco-modal, .arco-modal:visible').last();
      await expect(modal).toBeVisible({ timeout: 8000 });
      const title = modal.locator('.arco-modal-title, [class*=modal-title]').first();
      const titleText = ((await title.innerText().catch(() => '')) || '').trim();
      if (!/移除所选/.test(titleText)) {
        throw new Error('弹窗标题非「移除所选」: ' + titleText);
      }
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true }).first();
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(600);
  - note: 2、取消后该企业仍在且已选计数不变
    assert: |-
      const stack = () => page.getByTestId('recruit-tab-stack');
      const actionBar = () => stack().getByTestId('candidate-action-bar');
      const ctx = page.__func02232 || {};
      const targetName = ctx.targetName || '';
      const selectedBefore = ctx.selectedBefore ?? -1;
      if (!targetName) throw new Error('缺少目标企业名（上一步未写入 page.__func02232）');
      const modal = page.locator('.arco-modal-wrapper:visible .arco-modal, .arco-modal:visible');
      if (await modal.count()) {
        const vis = await modal.first().isVisible().catch(() => false);
        if (vis) throw new Error('点取消后移除所选弹窗仍打开');
      }
      await expect(stack()).toBeVisible({ timeout: 10000 });
      const esc = targetName.slice(0, Math.min(16, targetName.length)).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const cell = stack().locator('.arco-table-content, .arco-table').getByText(new RegExp(esc));
      await expect(cell.first()).toBeVisible({ timeout: 8000 });
      await expect(actionBar()).toBeVisible({ timeout: 8000 });
      const barText = ((await actionBar().innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const sm = barText.match(/已选\s*(\d+)\s*家/);
      const selectedAfter = sm ? Number(sm[1]) : -1;
      if (selectedBefore >= 0 && selectedAfter !== selectedBefore) {
        throw new Error('取消后已选计数不应变化：前=' + selectedBefore + ' 后=' + selectedAfter);
      }
      if (selectedAfter !== 1) {
        throw new Error('取消后已选应仍为 1 家，现场=' + selectedAfter);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path + workspace=cultivation&recommendation_tab=cultivation&entry=candidates。步骤=勾选 1 家→「移除所选」→Modal「移除所选」→「取消」。机检=标题+取消后企业名仍可见且已选仍为 1 家（确定路径见 02247）。前置兜底同 02205/02231。D4·2026-10-20 rewrite-FUNC-02232 svcz 2/2 expect 绿。候选空→ ENV-CULTIVATE-CANDIDATE-EMPTY。登录与关评审由 runner 前置。B 档零 allow_skip。
