id: FUNC-02497
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02497
priority: P1
tier: B
title: 异常-对比篮路径仍为详情
entry_id: ent-detail
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/demo-org-id?source=compare
  - action: evaluate
    target: |-
      const bc = page.locator('nav.ent-profile-breadcrumb');
      await bc.getByRole('button', { name: '对比篮' }).click();
      await page.waitForURL(/\/enterprise\/enterprise-compare$/, { timeout: 15000 });
expect:
  - note: 地址以 /enterprise/enterprise-compare 结束
    assert: |-
      await expect(page).toHaveURL(/\/enterprise\/enterprise-compare$/)
  - note: 页面标题仍为「企业详情 - 科技专题服务系统」
    assert: |-
      await expect(page).toHaveTitle('企业详情 - 科技专题服务系统')
  - note: 正文仍为「Request failed with status code 424」
    assert: |-
      await expect(page.getByText('Request failed with status code 424')).toBeVisible()
  - note: 面包屑变为「企业分析 / 企业画像」
    assert: |-
      const crumb = page.locator('nav.ent-profile-breadcrumb');
      await expect(crumb.getByRole('button', { name: '企业分析' })).toBeVisible();
      await expect(crumb.getByText('企业画像', { exact: true })).toBeVisible();
      await expect(crumb.getByRole('button', { name: '对比篮' })).toHaveCount(0);
on_fail: 截图 + 抄 X-Trace-Id
