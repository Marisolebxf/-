id: FUNC-02091
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02091
priority: P1
tier: B
title: 主流程-环节分布
entry_id: ent-sz-status
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 展开产业链下拉；点选「人工智能」；等待定位结果（判定在 expect）
expect:
  - note: 区块标题为「产业链环节分布」
    assert: |-
      const stageNames = ['行业应用', '算力芯片', '数据标注', '算法框架'];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const selectAiChain = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const collectOptions = () =>
          page.evaluate(() => {
            const out = [];
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              const st = window.getComputedStyle(el);
              if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
              if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
              out.push(t);
            }
            return [...new Set(out)];
          });
        if (!(await page.locator('main .arco-select-view').filter({ hasText: '人工智能' }).first().count())) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          let options = await collectOptions();
          if (options.length === 0) {
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (!options.includes('人工智能')) {
            throw new Error('D3·下拉无「人工智能」；现场 ' + options.length + ' 项：' + (options.join('、') || '(空)'));
          }
          const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
          await popup.locator('.arco-select-option, li[role=option]').filter({ hasText: /^人工智能$/ }).first().click({ timeout: 8000 });
          await page.waitForTimeout(800);
        }
        let ok = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('深圳相关企业清单', { exact: true }).count()) { ok = true; break; }
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { ok = true; break; }
          await page.waitForTimeout(120);
        }
        if (!ok) throw new Error('选链后定位结果未出现');
      };
      await page.evaluate(() => {
        window.__GKX_QA_SZ_STAGE_DIST__ = null;
        if (window.__GKX_QA_SZ_FETCH_PATCHED__) return;
        window.__GKX_QA_SZ_FETCH_PATCHED__ = true;
        const orig = window.fetch.bind(window);
        window.fetch = async (...args) => {
          const res = await orig(...args);
          const url = String(args[0] ?? '');
          if (url.includes('chain-stage-stats')) {
            try {
              const j = await res.clone().json();
              const payload = j?.data ?? j;
              const list = payload?.stage_distribution ?? payload?.stage_stats ?? [];
              const names = list
                .map((x) => String(x?.stage_name ?? x?.node_stage_name ?? x?.name ?? '').trim())
                .filter(Boolean);
              if (names.length) window.__GKX_QA_SZ_STAGE_DIST__ = names;
            } catch (e) {}
          }
          return res;
        };
      });
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('修订 ENV-ENTRY-UNREACHABLE');
      }
      await page.reload({ waitUntil: 'domcontentloaded' });
      await dismissBasket();
      await selectAiChain();
      await expect(page.getByText('产业链环节分布', { exact: true }).first()).toBeVisible({ timeout: 12000 });
  - note: 图中有行业应用、算力芯片、数据标注、算法框架
    assert: |-
      const stageNames = ['行业应用', '算力芯片', '数据标注', '算法框架'];
      const card = page
        .locator('[data-testid="szstatus-chain-position"] div.border')
        .filter({ has: page.getByText('产业链环节分布', { exact: true }) })
        .first();
      await expect(card).toBeVisible({ timeout: 10000 });
      let seen = await page.evaluate(() => window.__GKX_QA_SZ_STAGE_DIST__ || []);
      if (!stageNames.every((n) => seen.includes(n))) {
        const canvasOk = await card.locator('canvas').first().isVisible().catch(() => false);
        const loaded = await page.getByText('覆盖产业链环节', { exact: true }).isVisible().catch(() => false);
        const bodyText = await page.locator('main').innerText();
        const domHit = stageNames.filter((n) => bodyText.includes(n));
        if (domHit.length >= 4) {
          seen = domHit;
        } else if (canvasOk && loaded && seen.length >= 4) {
          seen = seen;
        } else if (canvasOk && loaded) {
          const box = await card.locator('canvas').first().boundingBox();
          if (box) {
            for (const fx of [0.2, 0.4, 0.6, 0.8]) {
              await page.mouse.move(box.x + box.width * fx, box.y + box.height * 0.7);
              await page.waitForTimeout(350);
            }
          }
          const tipHit = await page.evaluate((names) => {
            const t = document.body.innerText || '';
            return names.filter((n) => t.includes(n));
          }, stageNames);
          if (tipHit.length >= 2) seen = [...new Set([...seen, ...tipHit])];
        }
      }
      const missing = stageNames.filter((n) => !seen.includes(n));
      if (missing.length) {
        throw new Error(
          '环节分布 stage_distribution 未含四环节：缺 ' + missing.join('、') +
          '；实际：' + (seen.join('、') || '（未捕获）'),
        );
      }
on_fail: 截图 + 抄 X-Trace-Id
