id: FUNC-02122
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02122
priority: P0
title: 默认参照下相对优势与相对短板
story: US-SZSTATUS-03
entry_id: ent-sz-status
tier: B
preconditions:
  - 已进入「多城市横向对标」
  - 「对比对象 B」仍为 NATIONAL（默认参照）
locators:
  tab_benchmark: 「多城市横向对标」/「多城市横向对标分析」Tab
  observation_block: 当前产业链相对观察
  advantage_section: 相对优势
  weakness_section: 相对短板
  object_b: '[data-testid="szstatus-radar-object-b"]'
steps:
  - action: goto
    target: /enterprise-center/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 选链、切对标 Tab；确认 B=NATIONAL 后阅读相对观察区块（判定在 expect）
expect:
  - note: 所在区块标题为「当前产业链相对观察」；默认参照为 NATIONAL
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const selectChainToResult = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const collectOptions = () =>
          page.evaluate(() => {
            const out = [];
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              const st = window.getComputedStyle(el);
              if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
              if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
              out.push(t);
            }
            return [...new Set(out)];
          });
        const prefer = ['人工智能', '新一代信息技术'];
        let needPick = true;
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            needPick = false;
            break;
          }
        }
        if (needPick) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          let options = await collectOptions();
          if (options.length === 0) {
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) {
            await chain.click({ timeout: 8000 });
            await page.waitForTimeout(400);
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
          const pick = prefer.find((n) => options.includes(n)) || options[0];
          const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
          const opt = popup.getByText(pick, { exact: true }).first();
          if (await opt.count()) await opt.click({ timeout: 8000 });
          else {
            await page.evaluate((name) => {
              for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
                const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
                if (t === name) { el.click(); return; }
              }
            }, pick);
          }
          await page.waitForTimeout(800);
        }
        let ok = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { ok = true; break; }
          if (await page.locator('main .arco-spin:visible, main .arco-skeleton:visible').count()) {
            await page.waitForTimeout(150);
            continue;
          }
          await page.waitForTimeout(120);
        }
        if (!ok) throw new Error('选链后定位结果未出现（未见「覆盖产业链环节」）');
      };
      const clickBenchmarkTab = async () => {
        const benchNames = ['多城市横向对标分析', '多城市横向对标'];
        for (const bn of benchNames) {
          const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: bn }).first();
          if (await tab.count()) {
            await tab.click({ timeout: 8000 });
            return;
          }
        }
        throw new Error('未找到多城市横向对标 Tab');
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      await selectChainToResult();
      await dismissBasket();
      await clickBenchmarkTab();
      await page.waitForTimeout(2000);
      const radar = page.locator('[data-testid="szstatus-city-radar"]');
      await expect(radar).toBeVisible({ timeout: 15000 });
      const objectB = page.locator('[data-testid="szstatus-radar-object-b"]').first();
      await expect(objectB).toBeVisible({ timeout: 8000 });
      const bValue = ((await objectB.locator('.arco-select-view-value, .arco-select-view').first().innerText()) || '')
        .trim()
        .replace(/\s+/g, ' ');
      if (!/NATIONAL|全国/.test(bValue)) {
        throw new Error('对比对象 B 非默认 NATIONAL：' + bValue);
      }
      await expect(page.getByText('当前产业链相对观察').first()).toBeVisible({ timeout: 12000 });
      await expect(page.getByText(/当前参照[：:]\s*(NATIONAL|全国)/).first()).toBeVisible({ timeout: 8000 });
  - note: 「相对优势」列出高于当前参照的指标（或无优势时现场降级文案）；「相对短板」为未发现低于参照项
    assert: |-
      const block = page.locator('main').filter({ hasText: '当前产业链相对观察' }).first();
      await expect(block.getByText('相对优势', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(block.getByText('相对短板', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const weaknessExact = block.getByText('当前可比指标未发现低于参照对象的项', { exact: true });
      await expect(weaknessExact.first()).toBeVisible({ timeout: 8000 });
      const advantageBody = await page.evaluate(() => {
        const walk = (root) => {
          const nodes = root.querySelectorAll('*');
          for (const el of nodes) {
            const t = (el.innerText || '').trim();
            if (t === '相对优势' && el.children.length <= 2) {
              let parent = el.parentElement;
              for (let i = 0; i < 6 && parent; i++) {
                const full = (parent.innerText || '').replace(/\s+/g, ' ');
                const advIdx = full.indexOf('相对优势');
                const weakIdx = full.indexOf('相对短板');
                if (advIdx >= 0 && weakIdx > advIdx) {
                  return full.slice(advIdx + '相对优势'.length, weakIdx).trim();
                }
                parent = parent.parentElement;
              }
            }
          }
          return '';
        };
        return walk(document.querySelector('main') || document.body);
      });
      const hasListedAdvantage =
        advantageBody.length > 0 &&
        !/当前可比指标暂无相对优势/.test(advantageBody) &&
        !/^暂无/.test(advantageBody);
      const hasEmptyAdvantage = /当前可比指标暂无相对优势/.test(advantageBody);
      if (!hasListedAdvantage && !hasEmptyAdvantage) {
        throw new Error('相对优势区既无指标列表也无已知降级文案，读到：「' + advantageBody.slice(0, 120) + '」');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  30888 无 ADS 对标分时相对优势降级为「当前可比指标暂无相对优势」、相对短板固定「当前可比指标未发现低于参照对象的项」（scout-benchmark，D1 空数据）。
  有数环境须出现具体高于 NATIONAL 的指标名列表。选链/对标 Tab 同 FUNC-02089/02119；须关对比篮。禁止 50892。
