id: P1-04
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00977
priority: P1
title: 查看报告可打开且返回后筛选态保留
story: US-SZSTATUS-01
entry_id: ent-sz-status
preconditions:
- 已进入页面
- 已选定一条产业链
locators:
  report_btn: button「查看 HTML 报告」
steps:
- action: click
  target: 查看 HTML 报告
- action: evaluate
  note: 关闭报告返回
expect:
- note: 报告以浮层或新页打开且内容可读不报错
  assert: |-
    if (!(await page.locator('main .arco-select-view').filter({ hasText: /人工智能|生物医药/ }).count())) { await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/shenzhen-enterprise-status-analysis', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const chain = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="请选择产业链"]') }).first(); await chain.click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible').getByText('人工智能', { exact: true }).first().click({ timeout: 8000 }); await page.waitForTimeout(3000) }; await page.getByRole('button', { name: '查看 HTML 报告' }).click({ timeout: 8000 }); await page.waitForTimeout(1500); const opened = (await page.getByText(/只读|报告身份|执行摘要|返回分析结果/).count()) > 0 || page.url().includes('report'); if (!opened) throw new Error('报告未打开或文案未识别')
- note: 返回后产业链、Tab 与筛选态保留
  assert: |-
    const back = page.getByRole('button', { name: /返回分析结果|关闭/ }).first(); if (await back.count()) await back.click({ timeout: 8000 }); else await page.keyboard.press('Escape'); await page.waitForTimeout(800); await expect(page.getByRole('heading', { name: '深圳企业现状分析' })).toBeVisible({ timeout: 8000 }); await expect(page.locator('main .arco-select-view').filter({ hasText: /人工智能|生物医药/ }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 报告正文结构 observed；页面级能力按 as-built 验证。
allow_skip: 报告入口点击后无浮层/新页可识别文案时记 Pass-N/A + observed
tier: B
