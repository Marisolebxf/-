id: P1-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00978
priority: P1
title: 评审模式开启显示需求追溯且关闭后零泄漏
story: US-SZSTATUS-01
entry_id: ent-sz-status
preconditions:
- 顶部人设面板内部评审模式开关可用
- 已进入页面
locators:
  review_switch: switch「内部评审模式」
  trace_btn: 深圳企业现状分析需求追溯
steps:
- action: goto
  target: /enterprise/shenzhen-enterprise-status-analysis
- action: evaluate
  note: 开评审 → 点追溯 → 关评审 → 切对标 Tab 核对零泄漏
expect:
- note: 开启后「深圳企业现状分析需求追溯」按钮可见可点
  assert: |-
    const openPersona = async () => { if (await page.locator('.persona-menu').count()) return; const btn = page.getByRole('button', { name: /创新工作台|专业/ }).first(); try { await btn.click({ timeout: 4000 }) } catch { await page.locator('button.persona-switch').first().click({ timeout: 4000 }) } await page.waitForTimeout(800) }; await openPersona(); const sw = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); if ((await sw.getAttribute('aria-checked')) !== 'true') { await sw.click({ timeout: 8000 }); await page.waitForTimeout(1200) }; await page.keyboard.press('Escape'); await page.waitForTimeout(400); await expect(page.getByRole('button', { name: '深圳企业现状分析需求追溯' })).toBeVisible({ timeout: 8000 })
- note: 关闭后页面无追溯按钮与指标编号类内部字样
  assert: |-
    const op = async () => { if (await page.locator('.persona-menu').count()) return; await page.locator('button.persona-switch, button').filter({ hasText: /创新工作台/ }).first().click({ timeout: 5000 }); await page.waitForTimeout(800) }; await op(); const sw2 = page.locator('.persona-menu button[role=switch][aria-label="内部评审模式"]').first(); if ((await sw2.getAttribute('aria-checked')) === 'true') { await sw2.click({ timeout: 8000 }); await page.waitForTimeout(1200) }; await page.keyboard.press('Escape'); await page.waitForTimeout(400); if (await page.getByRole('button', { name: '深圳企业现状分析需求追溯' }).count()) throw new Error('关闭后追溯按钮仍在'); const leak = await page.evaluate(() => { const m = document.querySelector('main'); const txt = m ? m.textContent : ''; return ['需求追溯','M_ENT_','Q0','GAP-'].filter(t => txt.includes(t)) }); if (leak.length) throw new Error('关闭后泄漏: ' + leak.join(','))
- note: 两 Tab 下均无内部字样泄漏
  assert: |-
    await page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: '多城市横向对标' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); const leak2 = await page.evaluate(() => { const m = document.querySelector('main'); const txt = m ? m.textContent : ''; return ['需求追溯','指标未登记','指标说明'].filter(t => txt.includes(t)) }); if (leak2.length) throw new Error('对标 Tab 泄漏: ' + leak2.join(','))
- note: 开关往返不改变产业链、Tab 与筛选态
  assert: |-
    await expect(page.getByRole('heading', { name: '深圳企业现状分析' })).toBeVisible({ timeout: 8000 }); await expect(page.getByText('全国热门科创城市 / 深圳 / 全部').first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 结构性检查 4 点；结束后必须确认评审已关；追溯内容 observed。
tier: B
