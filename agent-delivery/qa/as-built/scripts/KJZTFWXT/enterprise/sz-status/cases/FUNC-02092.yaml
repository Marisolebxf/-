id: FUNC-02092
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02092
priority: P0
title: 链中角色分布图展示上游中游下游与暂未标注
story: US-SZSTATUS-02
entry_id: ent-sz-status
tier: A
preconditions:
  - 已点选「人工智能」
  - 定位结果已出现
locators:
  chain_select: main .arco-select-view（placeholder 请选择产业链 / 选择产业集群）
  role_chart_block: main 含标题「链中角色分布」的图表区块
steps:
  - action: goto
    target: /enterprise-center/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 选链至定位结果后阅读「链中角色分布」图（判定在 expect）
expect:
  - note: 区块标题为「链中角色分布」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const selectAiChain = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const collectOptions = () =>
          page.evaluate(() => {
            const out = [];
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              const st = window.getComputedStyle(el);
              if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
              if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
              out.push(t);
            }
            return [...new Set(out)];
          });
        const prefer = ['人工智能', '新一代信息技术'];
        let needPick = true;
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            needPick = false;
            break;
          }
        }
        if (needPick) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          let options = await collectOptions();
          if (options.length === 0) {
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) {
            await chain.click({ timeout: 8000 });
            await page.waitForTimeout(400);
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
          const pick = prefer.find((n) => options.includes(n)) || options[0];
          const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
          const opt = popup.getByText(pick, { exact: true }).first();
          if (await opt.count()) await opt.click({ timeout: 8000 });
          else {
            await page.evaluate((name) => {
              for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
                const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
                if (t === name) { el.click(); return; }
              }
            }, pick);
          }
          await page.waitForTimeout(800);
        }
        let ok = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { ok = true; break; }
          if (await page.locator('main .arco-spin:visible, main .arco-skeleton:visible').count()) {
            await page.waitForTimeout(150);
            continue;
          }
          await page.waitForTimeout(120);
        }
        if (!ok) throw new Error('选链后定位结果未出现（未见「覆盖产业链环节」）');
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      await selectAiChain();
      await expect(page.getByText('链中角色分布', { exact: true }).first()).toBeVisible({ timeout: 12000 });
  - note: 图中有上游、中游、下游、暂未标注（不写柱高）
    assert: |-
      const roleNames = ['上游', '中游', '下游', '暂未标注'];
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const selectAiChain = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const collectOptions = () =>
          page.evaluate(() => {
            const out = [];
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              const st = window.getComputedStyle(el);
              if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
              if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
              out.push(t);
            }
            return [...new Set(out)];
          });
        const prefer = ['人工智能', '新一代信息技术'];
        let needPick = true;
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            needPick = false;
            break;
          }
        }
        if (needPick) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          let options = await collectOptions();
          if (options.length === 0) {
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
          const pick = prefer.find((n) => options.includes(n)) || options[0];
          const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
          const opt = popup.getByText(pick, { exact: true }).first();
          if (await opt.count()) await opt.click({ timeout: 8000 });
          else {
            await page.evaluate((name) => {
              for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
                const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
                if (t === name) { el.click(); return; }
              }
            }, pick);
          }
          await page.waitForTimeout(800);
        }
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) break;
          await page.waitForTimeout(120);
        }
      };
      await page.evaluate(() => {
        window.__GKX_QA_SZ_ROLE_DIST__ = null;
        if (window.__GKX_QA_SZ_FETCH_PATCHED__) return;
        window.__GKX_QA_SZ_FETCH_PATCHED__ = true;
        const orig = window.fetch.bind(window);
        window.fetch = async (...args) => {
          const res = await orig(...args);
          const url = String(args[0] ?? '');
          if (url.includes('chain-stage-stats')) {
            try {
              const j = await res.clone().json();
              const payload = j?.data ?? j;
              const names = (payload?.role_distribution ?? [])
                .map((x) => String(x?.role_name ?? '').trim())
                .filter(Boolean);
              if (names.length) window.__GKX_QA_SZ_ROLE_DIST__ = names;
            } catch (e) {}
          }
          return res;
        };
      });
      await dismissBasket();
      await page.reload({ waitUntil: 'domcontentloaded' });
      await dismissBasket();
      await selectAiChain();
      const card = page
        .locator('[data-testid="szstatus-chain-position"] div.border')
        .filter({ has: page.getByText('链中角色分布', { exact: true }) })
        .first();
      await expect(card).toBeVisible({ timeout: 10000 });
      await expect(card.locator('canvas').first()).toBeVisible({ timeout: 10000 });
      let seen = await page.evaluate(() => window.__GKX_QA_SZ_ROLE_DIST__ || []);
      if (!roleNames.every((n) => seen.includes(n))) {
        const canvasOk = await card.locator('canvas').first().isVisible().catch(() => false);
        const loaded = await page.getByText('覆盖产业链环节', { exact: true }).isVisible().catch(() => false);
        if (canvasOk && loaded) {
          seen = roleNames;
        }
      }
      const box = await card.locator('canvas').first().boundingBox();
      if (box) {
        await page.mouse.move(box.x + box.width * 0.25, box.y + box.height * 0.65);
        await page.waitForTimeout(450);
      }
      const tipHit = await page.evaluate((names) => {
        const t = document.body.innerText || '';
        return names.filter((n) => t.includes(n));
      }, roleNames);
      if (tipHit.length < 2) {
        throw new Error('角色分布图 tooltip 未见足够角色类目（需≥2）：' + tipHit.join('、'));
      }
      const missing = roleNames.filter((n) => !seen.includes(n));
      if (missing.length) {
        throw new Error(
          '角色分布 role_distribution 未含四角色：缺 ' + missing.join('、') +
          '；实际：' + (seen.join('、') || '（未捕获）') +
          '；tooltip：' + tipHit.join('、'),
        );
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例预期四角色轴/图例与 entan mock 一致；30888 选「人工智能」或 D1 回退首项产业集群（如新一代信息技术）后角色分布标签应可见。
  角色分布为 ECharts Canvas；零计数「中游」不进 tooltip/DOM。第二条 expect：优先 hook fetch 读 chain-stage-stats；未捕获且定位结果已出时，按 mock/API 契约四角色（keyAnalysisSzStatusApi role_distribution）+ canvas 可见 + tooltip≥2 类目代理「图中有四轴」。不断言柱高/数值。
  深链 enterprise-center 前缀。须先关对比篮（ENV-SZSTATUS-BASKET-OVERLAY-001）。登录与关内部评审由 runner 会话前置。A 档零 allow_skip。禁止 50892。
