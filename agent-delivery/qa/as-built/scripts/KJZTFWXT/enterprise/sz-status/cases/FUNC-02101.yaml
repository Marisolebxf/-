id: FUNC-02101
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02101
priority: P1
title: 全选当前结果再取消全选已选归零
story: US-SZSTATUS-02
entry_id: ent-sz-status
tier: B
preconditions:
  - 清单已出现
  - 当前没有勾选
locators:
  chain_select: main .arco-select-view（placeholder 请选择产业链 / 选择产业集群）
  enterprise_table: '[data-testid="szstatus-enterprise-table"]'
  select_all_btn: 全选当前结果 / 取消全选
  batch_count: 已选 N 家 · 当前结果 M 家
steps:
  - action: goto
    target: /enterprise-center/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 选链至清单有行后全选再取消（判定在 expect）
expect:
  - note: 1、按钮变为「取消全选」且已选等于当前页行数；2、再点后已选为 0 且按钮回到「全选当前结果」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const collectOptions = () =>
        page.evaluate(() => {
          const out = [];
          for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
            const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
            const st = window.getComputedStyle(el);
            if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
            if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
            out.push(t);
          }
          return [...new Set(out)];
        });
      const selectChainForList = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const prefer = ['人工智能', '新一代信息技术'];
        let needPick = true;
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            needPick = false;
            break;
          }
        }
        if (!needPick) return;
        await chain.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        let options = await collectOptions();
        if (options.length === 0) {
          await page.keyboard.press('ArrowDown');
          await page.waitForTimeout(700);
          options = await collectOptions();
        }
        if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
        const pick = prefer.find((n) => options.includes(n)) || options[0];
        const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
        const opt = popup.getByText(pick, { exact: true }).first();
        if (await opt.count()) await opt.click({ timeout: 8000 });
        else {
          await page.evaluate((name) => {
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              if (t === name) { el.click(); return; }
            }
          }, pick);
        }
        await page.waitForTimeout(800);
      };
      const waitList = async () => {
        let listOk = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('深圳相关企业清单', { exact: true }).count()) { listOk = true; break; }
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { listOk = true; break; }
          if (await page.locator('main .arco-spin:visible, main .arco-skeleton:visible').count()) {
            await page.waitForTimeout(150);
            continue;
          }
          await page.waitForTimeout(120);
        }
        if (!listOk) throw new Error('选链后定位结果未出现（未见清单或「覆盖产业链环节」）');
        await expect(page.getByText('深圳相关企业清单', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      };
      const readBatchCounts = async () => {
        const line = page.locator('main').getByText(/已选 \d+ 家 · 当前结果 \d+ 家/).first();
        await expect(line).toBeVisible({ timeout: 8000 });
        const txt = ((await line.innerText()) || '').replace(/\s+/g, ' ');
        const sel = txt.match(/已选\s*(\d+)\s*家/);
        const cur = txt.match(/当前结果\s*(\d+)\s*家/);
        if (!sel || !cur) throw new Error('未解析批量栏计数: ' + txt.slice(0, 120));
        return { selected: parseInt(sel[1], 10), currentResult: parseInt(cur[1], 10) };
      };
      const countVisibleDataRows = async () => {
        const rows = page.locator('[data-testid="szstatus-enterprise-table"] tbody tr').filter({
          hasNot: page.locator('.arco-table-tr-empty'),
        });
        const n = await rows.count();
        let dataRows = 0;
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const txt = ((await row.innerText()) || '').trim();
          if (!txt || /当前条件下暂无企业/.test(txt)) continue;
          dataRows += 1;
        }
        return dataRows;
      };
      const PAGE_SIZE = 20;
      const readActivePage = async () => {
        const active = page.locator('.arco-pagination-item-active').first();
        if (!(await active.count())) return 1;
        const t = ((await active.innerText()) || '').trim();
        const n = parseInt(t, 10);
        return Number.isFinite(n) && n > 0 ? n : 1;
      };
      const expectedSelectedAfterSelectAll = (currentResult, pageNum) => {
        if (pageNum <= 1) return Math.min(currentResult, PAGE_SIZE);
        const start = (pageNum - 1) * PAGE_SIZE;
        const remain = Math.max(0, currentResult - start);
        return Math.min(remain, PAGE_SIZE);
      };
      const ensureZeroSelected = async () => {
        let n = (await readBatchCounts()).selected;
        if (n === 0) return;
        const cancelAll = page.getByText('取消全选', { exact: true }).first();
        if (await cancelAll.count()) {
          await cancelAll.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(400);
          n = (await readBatchCounts()).selected;
          if (n === 0) return;
        }
        const selectAll = page.getByText('全选当前结果', { exact: true }).first();
        if (await selectAll.count()) {
          await selectAll.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(400);
          const cancel = page.getByText('取消全选', { exact: true }).first();
          if (await cancel.count()) {
            await cancel.click({ timeout: 8000 });
            await page.waitForTimeout(400);
          }
          n = (await readBatchCounts()).selected;
        }
        if (n !== 0) throw new Error('前置未满足：当前已选 ' + n + ' 家，无法验全选/取消');
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      await selectChainForList();
      await waitList();
      if (await page.getByText('当前条件下暂无企业').isVisible().catch(() => false)) {
        throw new Error('环境阻塞 ENV-SZSTATUS-ENTERPRISE-LIST-001：清单空态，无法全选');
      }
      const visibleRows = await countVisibleDataRows();
      if (visibleRows === 0) {
        throw new Error('环境阻塞 ENV-SZSTATUS-ENTERPRISE-LIST-001：清单无可见数据行');
      }
      await ensureZeroSelected();
      const beforeAll = await readBatchCounts();
      if (beforeAll.currentResult === 0) {
        throw new Error('环境阻塞 ENV-SZSTATUS-ENTERPRISE-LIST-001：当前结果 0 家');
      }
      const selectAllBtn = page.getByText('全选当前结果', { exact: true }).first();
      await expect(selectAllBtn).toBeVisible({ timeout: 8000 });
      await selectAllBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const cancelBtn = page.getByText('取消全选', { exact: true }).first();
      await expect(cancelBtn).toBeVisible({ timeout: 8000 });
      const pageNum = await readActivePage();
      const expectSelected = expectedSelectedAfterSelectAll(beforeAll.currentResult, pageNum);
      const afterAll = await readBatchCounts();
      if (afterAll.selected !== expectSelected) {
        throw new Error(
          '全选后已选应等于当前页勾选 ' + expectSelected + ' 家，读到 ' + afterAll.selected + ' 家（当前结果 ' +
            beforeAll.currentResult + ' 家，页码 ' + pageNum + '）',
        );
      }
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const selectedAfterCancel = (await readBatchCounts()).selected;
      if (selectedAfterCancel !== 0) {
        throw new Error('取消全选后已选应为 0 家，读到 ' + selectedAfterCancel + ' 家');
      }
      await expect(page.getByText('全选当前结果', { exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例「当前页勾选行数」机检=全选后已选等于 min(当前结果,20)（第 1 页）；全选态以批量栏文案「取消全选」为准（与 EnterpriseTable a-checkbox 同节点）。≤20 无第 2 页见 02099。
  30888 深链 enterprise-center 前缀；产业集群优先人工智能。清单空→ENV-SZSTATUS-ENTERPRISE-LIST-001。
  须先关对比篮。登录与关内部评审由 runner 会话前置。禁止 50892。B 档零 allow_skip。
