id: FUNC-00974
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00974
priority: P1
title: 双 Tab 可往返且返回后已选链与结果态保留
story: US-SZSTATUS-04
entry_id: ent-sz-status
tier: B
preconditions:
  - 已选定产业链「人工智能」（或环境首项）；定位结果已加载
locators:
  tab_pos: 产业链定位 / 深圳企业产业链定位
  tab_bench: 多城市横向对标 / 多城市横向对标分析
  chain_select: main .arco-select-view（placeholder 请选择产业链 / 选择产业集群）
  region_anchor: 全国热门科创城市 / 深圳 / 全部
steps:
  - action: goto
    target: /enterprise-center/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 选链至定位结果后双 Tab 往返（判定在 expect）
expect:
  - note: 双 Tab 均可见可激活
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const selectChainToResult = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const collectOptions = () =>
          page.evaluate(() => {
            const out = [];
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              const st = window.getComputedStyle(el);
              if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
              if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
              out.push(t);
            }
            return [...new Set(out)];
          });
        const prefer = ['人工智能', '新一代信息技术'];
        let picked = '';
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            picked = name;
            break;
          }
        }
        if (!picked) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          let options = await collectOptions();
          if (options.length === 0) {
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
          picked = prefer.find((n) => options.includes(n)) || options[0];
          const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
          const opt = popup.getByText(picked, { exact: true }).first();
          if (await opt.count()) await opt.click({ timeout: 8000 });
          else {
            await page.evaluate((name) => {
              for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
                const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
                if (t === name) { el.click(); return; }
              }
            }, picked);
          }
          await page.waitForTimeout(800);
        }
        let ok = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { ok = true; break; }
          if (await page.locator('main .arco-spin:visible, main .arco-skeleton:visible').count()) {
            await page.waitForTimeout(150);
            continue;
          }
          await page.waitForTimeout(120);
        }
        if (!ok) throw new Error('选链后定位结果未出现（未见「覆盖产业链环节」）');
        return picked;
      };
      const clickBenchmarkTab = async () => {
        const benchNames = ['多城市横向对标分析', '多城市横向对标'];
        for (const bn of benchNames) {
          const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: bn }).first();
          if (await tab.count()) {
            await tab.click({ timeout: 8000 });
            return;
          }
        }
        throw new Error('未找到多城市横向对标 Tab');
      };
      const clickPositionTab = async () => {
        const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (!(await tab.count())) throw new Error('未找到产业链定位 Tab');
        await tab.click({ timeout: 8000 });
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      const chainName = await selectChainToResult();
      await page.evaluate((n) => { window.__szstatus_tab_chain = n; }, chainName);
      const posTab = page.locator('main [role=tab], main .arco-tabs-tab').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
      await expect(posTab).toBeVisible({ timeout: 8000 });
      const benchTab = page.locator('main [role=tab], main .arco-tabs-tab').filter({ hasText: /多城市横向对标/ }).first();
      await expect(benchTab).toBeVisible({ timeout: 8000 });
  - note: 返回「产业链定位」后已选产业链与定位结果保留
    assert: |-
      const chainName = await page.evaluate(() => window.__szstatus_tab_chain || '人工智能');
      const clickBenchmarkTab = async () => {
        const benchNames = ['多城市横向对标分析', '多城市横向对标'];
        for (const bn of benchNames) {
          const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: bn }).first();
          if (await tab.count()) {
            await tab.click({ timeout: 8000 });
            return;
          }
        }
        throw new Error('未找到多城市横向对标 Tab');
      };
      const clickPositionTab = async () => {
        const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (!(await tab.count())) throw new Error('未找到产业链定位 Tab');
        await tab.click({ timeout: 8000 });
      };
      await clickBenchmarkTab();
      await page.waitForTimeout(2000);
      await clickPositionTab();
      await page.waitForTimeout(1500);
      await expect(page.locator('main .arco-select-view').filter({ hasText: chainName }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('覆盖产业链环节', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(page.getByText('深圳相关企业清单').first()).toBeVisible({ timeout: 8000 });
  - note: 两 Tab 下区域锚点一致保持深圳
    assert: |-
      const assertShenzhenAnchor = async (tabLabel) => {
        const main = page.locator('main');
        const mainTxt = await main.innerText();
        const hasLock = /区域固定[：:]\s*深圳/.test(mainTxt);
        const hasLegacy = /全国热门科创城市\s*\/\s*深圳/.test(mainTxt);
        if (!hasLock && !hasLegacy) {
          throw new Error(tabLabel + ' Tab 下未见深圳区域锚点（区域固定或 legacy 级联）');
        }
      };
      const clickPositionTab = async () => {
        const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (!(await tab.count())) throw new Error('未找到产业链定位 Tab');
        await tab.click({ timeout: 8000 });
      };
      const clickBenchmarkTab = async () => {
        const benchNames = ['多城市横向对标分析', '多城市横向对标'];
        for (const bn of benchNames) {
          const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: bn }).first();
          if (await tab.count()) {
            await tab.click({ timeout: 8000 });
            return;
          }
        }
        throw new Error('未找到多城市横向对标 Tab');
      };
      await clickPositionTab();
      await page.waitForTimeout(500);
      await assertShenzhenAnchor('产业链定位');
      await clickBenchmarkTab();
      await page.waitForTimeout(1500);
      await assertShenzhenAnchor('多城市横向对标');
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  深链须 enterprise-center 前缀（30888）。选链逻辑同 FUNC-02089/02122。D2·Tab 文案为「深圳企业产业链定位」「多城市横向对标分析」（非 exact「产业链定位」）。
  区域锚点同 FUNC-00961：「区域固定：深圳市」；legacy「全国热门科创城市/深圳/全部」分支兼容。两 Tab 共享筛选区。禁止 50892。
