id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00974
priority: P1
title: 双 Tab 可往返且返回后已选链与结果态保留
story: US-SZSTATUS-04
entry_id: ent-sz-status
preconditions:
- 已选定产业链人工智能
- 定位结果已加载
locators:
  tab_pos: 产业链定位
  tab_bench: 多城市横向对标
steps:
- action: click
  target: 多城市横向对标
- action: click
  target: 产业链定位
expect:
- note: 双 Tab 均可见可激活
  assert: |-
    if (!(await page.getByText('深圳相关企业清单').count())) { await page.goto('http://10.50.69.111:30892/enterprise/shenzhen-enterprise-status-analysis', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const chain = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="请选择产业链"]') }).first(); await chain.click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible').getByText('人工智能', { exact: true }).first().click({ timeout: 8000 }); await page.waitForTimeout(3500) }; await expect(page.locator('main').getByText('产业链定位', { exact: true }).first()).toBeVisible({ timeout: 8000 }); await expect(page.locator('main').getByText('多城市横向对标', { exact: true }).first()).toBeVisible({ timeout: 8000 })
- note: 返回「产业链定位」后已选产业链与定位结果保留
  assert: |-
    await page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: '多城市横向对标' }).first().click({ timeout: 8000 }); await page.waitForTimeout(2000); await page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: '产业链定位' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1500); await expect(page.locator('main .arco-select-view').filter({ hasText: '人工智能' }).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('深圳相关企业清单').first()).toBeVisible({ timeout: 8000 })
- note: 两 Tab 下区域锚点一致保持深圳
  assert: 'await expect(page.getByText(''全国热门科创城市 / 深圳 / 全部'').first()).toBeVisible({ timeout: 8000 })'
on_fail: 截图 + X-Trace-Id + C1~C6
tier: B
