id: FUNC-02100
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02100
priority: P1
title: 勾选清单首行再取消时已选计数跟着变
story: US-SZSTATUS-02
entry_id: ent-sz-status
tier: B
preconditions:
  - 清单已出现
  - 当前没有勾选
locators:
  chain_select: main .arco-select-view（placeholder 请选择产业链 / 选择产业集群）
  enterprise_table: '[data-testid="szstatus-enterprise-table"]'
  batch_count: 已选 N 家 · 当前结果 M 家
  first_row_checkbox: 清单 tbody 首行 .arco-checkbox
steps:
  - action: goto
    target: /enterprise-center/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 选链至清单有行后勾选首行再取消（判定在 expect）
expect:
  - note: 1、首次勾选后已选计数为 1 家；2、再次点击后已选计数为 0 家
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const collectOptions = () =>
        page.evaluate(() => {
          const out = [];
          for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
            const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
            const st = window.getComputedStyle(el);
            if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
            if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
            out.push(t);
          }
          return [...new Set(out)];
        });
      const selectChainForList = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const prefer = ['人工智能', '新一代信息技术'];
        let needPick = true;
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            needPick = false;
            break;
          }
        }
        if (!needPick) return;
        await chain.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        let options = await collectOptions();
        if (options.length === 0) {
          await page.keyboard.press('ArrowDown');
          await page.waitForTimeout(700);
          options = await collectOptions();
        }
        if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
        const pick = prefer.find((n) => options.includes(n)) || options[0];
        const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
        const opt = popup.getByText(pick, { exact: true }).first();
        if (await opt.count()) await opt.click({ timeout: 8000 });
        else {
          await page.evaluate((name) => {
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              if (t === name) { el.click(); return; }
            }
          }, pick);
        }
        await page.waitForTimeout(800);
      };
      const waitList = async () => {
        let listOk = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('深圳相关企业清单', { exact: true }).count()) { listOk = true; break; }
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { listOk = true; break; }
          if (await page.locator('main .arco-spin:visible, main .arco-skeleton:visible').count()) {
            await page.waitForTimeout(150);
            continue;
          }
          await page.waitForTimeout(120);
        }
        if (!listOk) throw new Error('选链后定位结果未出现（未见清单或「覆盖产业链环节」）');
        await expect(page.getByText('深圳相关企业清单', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      };
      const readSelectedCount = async () => {
        const line = page.locator('main').getByText(/已选 \d+ 家 · 当前结果 \d+ 家/).first();
        await expect(line).toBeVisible({ timeout: 8000 });
        const txt = ((await line.innerText()) || '').replace(/\s+/g, ' ');
        const m = txt.match(/已选\s*(\d+)\s*家/);
        if (!m) throw new Error('未解析已选家数: ' + txt.slice(0, 120));
        return parseInt(m[1], 10);
      };
      const firstDataRow = () =>
        page.locator('[data-testid="szstatus-enterprise-table"] tbody tr').filter({
          hasNot: page.locator('.arco-table-tr-empty'),
        }).first();
      const firstRowCheckbox = () => firstDataRow().locator('.arco-checkbox').first();
      const ensureZeroSelected = async () => {
        let n = await readSelectedCount();
        if (n === 0) return;
        const selectAll = page.getByText('全选当前结果', { exact: true }).first();
        if (await selectAll.count()) {
          await selectAll.click({ timeout: 8000 }).catch(() => {});
          await page.waitForTimeout(400);
          n = await readSelectedCount();
          if (n > 0) {
            await selectAll.click({ timeout: 8000 }).catch(() => {});
            await page.waitForTimeout(400);
            n = await readSelectedCount();
          }
        }
        if (n !== 0) {
          const cb = firstRowCheckbox();
          if (await cb.count()) {
            const checked =
              (await cb.getAttribute('aria-checked')) === 'true' ||
              (await cb.locator('.arco-checkbox-checked').count()) > 0;
            if (checked) {
              await cb.click({ timeout: 8000 });
              await page.waitForTimeout(300);
            }
          }
          n = await readSelectedCount();
        }
        if (n !== 0) throw new Error('前置未满足：当前已选 ' + n + ' 家，无法验单行勾选');
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      await selectChainForList();
      await waitList();
      if (await page.getByText('当前条件下暂无企业').isVisible().catch(() => false)) {
        throw new Error('环境阻塞 ENV-SZSTATUS-ENTERPRISE-LIST-001：清单空态，无法勾选首行');
      }
      const row = firstDataRow();
      await expect(row).toBeVisible({ timeout: 8000 });
      const cb = firstRowCheckbox();
      await expect(cb).toBeVisible({ timeout: 8000 });
      await ensureZeroSelected();
      await cb.click({ timeout: 8000 });
      await page.waitForTimeout(350);
      let selected = await readSelectedCount();
      if (selected !== 1) {
        throw new Error('首次勾选后已选应为 1 家，读到 ' + selected + ' 家');
      }
      await cb.click({ timeout: 8000 });
      await page.waitForTimeout(350);
      selected = await readSelectedCount();
      if (selected !== 0) {
        throw new Error('再次点击取消后已选应为 0 家，读到 ' + selected + ' 家');
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  用例只验「已选」计数 1→0，不断言「当前结果 M」具体值。首行勾选点 tbody 首条非空行 .arco-checkbox（P2 分步 wait）。
  30888 深链 enterprise-center 前缀；产业集群优先人工智能。清单空→ENV-SZSTATUS-ENTERPRISE-LIST-001。
  残留勾选先尝试「全选当前结果」取消再点首行。须先关对比篮。登录与关内部评审由 runner 会话前置。禁止 50892。B 档零 allow_skip。
