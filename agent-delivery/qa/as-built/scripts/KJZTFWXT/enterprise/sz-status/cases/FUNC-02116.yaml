id: FUNC-02116
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02116
priority: P1
title: 对标 Tab 打开报告对象为多城市横向对标
story: US-SZSTATUS-03
entry_id: ent-sz-status
tier: B
preconditions:
  - 已点选一条产业链；当前 Tab 为「多城市横向对标」（assert 自含选链并切对标 Tab）
locators:
  report_btn: button「生成 / 查看报告」或「查看 HTML 报告」
  report_reader: .system-report-reader[data-report-readonly="true"]
  tab_benchmark: 「多城市横向对标」/「多城市横向对标分析」Tab
steps:
  - action: goto
    target: /enterprise-center/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 对标 Tab 下打开 HTML 报告；报告对象与类型在 expect 判定
expect:
  - note: 1、报告对象为「深圳企业多城市横向对标」；2、报告类型为「深圳企业现状分析」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const selectChainToResult = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const collectOptions = () =>
          page.evaluate(() => {
            const out = [];
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              const st = window.getComputedStyle(el);
              if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
              if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
              out.push(t);
            }
            return [...new Set(out)];
          });
        const prefer = ['人工智能', '新一代信息技术', '生物医药'];
        let needPick = true;
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            needPick = false;
            break;
          }
        }
        if (needPick) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          let options = await collectOptions();
          if (options.length === 0) {
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
          const pick = prefer.find((n) => options.includes(n)) || options[0];
          const clicked = await page.evaluate((name) => {
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              if (t === name) { el.click(); return true; }
            }
            return false;
          }, pick);
          if (!clicked) {
            const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
            await popup.getByText(pick, { exact: true }).first().click({ timeout: 8000 });
          }
          await page.waitForTimeout(800);
        }
        let ok = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { ok = true; break; }
          if (await page.locator('main .arco-spin:visible, main .arco-skeleton:visible').count()) {
            await page.waitForTimeout(150);
            continue;
          }
          await page.waitForTimeout(120);
        }
        if (!ok) throw new Error('选链后定位结果未出现（未见「覆盖产业链环节」）');
      };
      const clickBenchmarkTab = async () => {
        const benchNames = ['多城市横向对标分析', '多城市横向对标'];
        for (const bn of benchNames) {
          const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: bn }).first();
          if (await tab.count()) {
            await tab.click({ timeout: 8000 });
            return;
          }
        }
        throw new Error('未找到多城市横向对标 Tab');
      };
      const openHtmlReport = async () => {
        const reportBtn = page.getByRole('button', { name: /生成\s*\/\s*查看报告|查看\s*HTML\s*报告/ });
        await expect(reportBtn).toBeVisible({ timeout: 8000 });
        await reportBtn.scrollIntoViewIfNeeded();
        await reportBtn.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        let reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        if (!(await reader.isVisible().catch(() => false))) {
          const modal = page.locator('.arco-modal:visible').filter({ hasText: /报告/ }).last();
          const viewHtml = modal.getByRole('button', { name: '查看 HTML 报告' });
          for (let i = 0; i < 90; i++) {
            if (await viewHtml.isVisible().catch(() => false)) {
              await viewHtml.click({ timeout: 8000 });
              break;
            }
            await page.waitForTimeout(1000);
          }
        }
        reader = page.locator('.system-report-reader[data-report-readonly="true"]');
        await expect(reader).toBeVisible({ timeout: 15000 });
        return reader;
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      await selectChainToResult();
      await dismissBasket();
      await clickBenchmarkTab();
      await page.waitForTimeout(1500);
      await expect(
        page.getByText('对标城市').or(page.getByText('城市 × 指标对比表')).first(),
      ).toBeVisible({ timeout: 12000 });
      const viewParam = await page.evaluate(() => new URL(location.href).searchParams.get('view'));
      if (viewParam !== 'city-benchmark') {
        throw new Error('对标 Tab 未写入 view=city-benchmark，当前 view=' + viewParam);
      }
      const reader = await openHtmlReport();
      await expect(reader).toBeVisible({ timeout: 8000 });
      const readerText = ((await reader.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      if (!readerText.includes('深圳企业多城市横向对标')) {
        throw new Error('报告对象不符（阅读器全文）：' + readerText.slice(0, 280));
      }
      if (!readerText.includes('深圳企业现状分析')) {
        throw new Error('报告类型不符（阅读器全文未见「深圳企业现状分析」）：' + readerText.slice(0, 280));
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  D1·30888：选链→切「多城市横向对标」（query view=city-benchmark）→报告入口同 02114。
  报告类型「深圳企业现状分析」可能在蓝 Tag（lumen）、eyebrow 或报告身份行（demo）；对象「深圳企业多城市横向对标」可在 subject 行或带产业链前缀（如「人工智能 · …」）。
  返回路径见 FUNC-00977。登录与关内部评审由 runner 会话前置。B 档零 allow_skip。禁止 50892。
