id: FUNC-02121
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02121
priority: P0
title: 对比对象B改为北京市后参照与相对短板
story: US-SZSTATUS-03
entry_id: ent-sz-status
tier: B
preconditions:
  - 已进入「多城市横向对标」且对标结果已出现（脚本自含选链并切 Tab）
locators:
  tab_benchmark: 「多城市横向对标」/「多城市横向对标分析」Tab
  object_b: '[data-testid="szstatus-radar-object-b"]'
  observation: '[data-testid="szstatus-relative-observation"]'
steps:
  - action: goto
    target: /enterprise/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 选链、切对标 Tab，对象 B 点选北京市（判定在 expect）
expect:
  - note: 「当前参照」变为北京市（含简称/区划码归一）
    assert: |-
      const BEIJING = '北京市';
      const toCanonical = (raw) => {
        const t = String(raw || '').trim().replace(/\s+/g, ' ');
        if (!t) return '';
        const alias = { 北京: BEIJING, '110000': BEIJING };
        if (alias[t]) return alias[t];
        if (t === BEIJING) return t;
        return t;
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const selectChainToResult = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        const collectOptions = () =>
          page.evaluate(() => {
            const out = [];
            for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              const st = window.getComputedStyle(el);
              if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
              if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
              out.push(t);
            }
            return [...new Set(out)];
          });
        const prefer = ['人工智能', '新一代信息技术'];
        let needPick = true;
        for (const name of prefer) {
          if (await page.locator('main .arco-select-view').filter({ hasText: name }).first().count()) {
            needPick = false;
            break;
          }
        }
        if (needPick) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          let options = await collectOptions();
          if (options.length === 0) {
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(700);
            options = await collectOptions();
          }
          if (options.length === 0) throw new Error('产业集群下拉展开后未读到任何选项');
          const pick = prefer.find((n) => options.includes(n)) || options[0];
          const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
          const opt = popup.getByText(pick, { exact: true }).first();
          if (await opt.count()) await opt.click({ timeout: 8000 });
          else {
            await page.evaluate((name) => {
              for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
                const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
                if (t === name) { el.click(); return; }
              }
            }, pick);
          }
          await page.waitForTimeout(800);
        }
        let ok = false;
        for (let i = 0; i < 50; i++) {
          if (await page.getByText('覆盖产业链环节', { exact: true }).count()) { ok = true; break; }
          if (await page.locator('main .arco-spin:visible, main .arco-skeleton:visible').count()) {
            await page.waitForTimeout(150);
            continue;
          }
          await page.waitForTimeout(120);
        }
        if (!ok) throw new Error('选链后定位结果未出现（未见「覆盖产业链环节」）');
      };
      const clickBenchmarkTab = async () => {
        const benchNames = ['多城市横向对标分析', '多城市横向对标'];
        for (const bn of benchNames) {
          const tab = page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: bn }).first();
          if (await tab.count()) {
            await tab.click({ timeout: 8000 });
            return;
          }
        }
        throw new Error('未找到多城市横向对标 Tab');
      };
      const pickObjectB = async () => {
        const trigger = page.locator('[data-testid="szstatus-radar-object-b"]').first();
        await expect(trigger).toBeVisible({ timeout: 8000 });
        await trigger.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const picked = await page.evaluate(() => {
          const popups = [...document.querySelectorAll('.arco-trigger-popup, .arco-select-dropdown')].filter((p) => {
            const st = window.getComputedStyle(p);
            if (st.display === 'none' || st.visibility === 'hidden') return false;
            const r = p.getBoundingClientRect();
            return r.width > 0 && r.height > 0;
          });
          for (const p of popups) {
            const txt = p.innerText || '';
            if (!/(110000|NATIONAL|北京|上海|苏州|广州)/.test(txt)) continue;
            for (const el of p.querySelectorAll('.arco-select-option, li[role=option]')) {
              const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
              if (t === '北京市' || t === '北京' || t === '110000') {
                el.click();
                return t;
              }
            }
          }
          return null;
        });
        if (!picked) throw new Error('对比对象 B 下拉未点到北京市/北京/110000');
        await page.waitForFunction(() => {
          const root = document.querySelector('[data-testid="szstatus-relative-observation"]');
          if (!root) return false;
          return /当前参照[：:]\s*(北京市|北京|110000)/.test(root.innerText || '');
        }, { timeout: 15000 });
        await page.waitForTimeout(800);
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      await selectChainToResult();
      await dismissBasket();
      await clickBenchmarkTab();
      await page.waitForTimeout(2000);
      await expect(page.locator('[data-testid="szstatus-city-radar"]')).toBeVisible({ timeout: 15000 });
      await pickObjectB();
      const obs = page.locator('[data-testid="szstatus-relative-observation"]').first();
      await expect(obs).toBeVisible({ timeout: 12000 });
      const refText = ((await obs.innerText()) || '').replace(/\s+/g, ' ');
      const m = refText.match(/当前参照[：:]\s*([^\s]+)/);
      const refName = toCanonical(m ? m[1].trim() : '');
      if (refName !== BEIJING) {
        throw new Error('当前参照应为北京市（含北京/110000），读到：「' + refText.slice(0, 120) + '」');
      }
  - note: 「相对短板」出现低于该参照的说明（不写具体指标名）
    assert: |-
      const block = page.locator('[data-testid="szstatus-relative-observation"]').first();
      await expect(block.getByText('相对短板', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const weaknessBody = await page.evaluate(() => {
        const root = document.querySelector('[data-testid="szstatus-relative-observation"]');
        if (!root) return '';
        const full = (root.innerText || '').replace(/\s+/g, ' ');
        const idx = full.indexOf('相对短板');
        if (idx < 0) return '';
        return full.slice(idx + '相对短板'.length).trim();
      });
      const emptyExact = /当前可比指标未发现低于参照对象的项/.test(weaknessBody);
      const hasBelowRef = /低于/.test(weaknessBody) && !emptyExact;
      if (!hasBelowRef) {
        throw new Error(
          '相对短板区应出现低于参照的说明，读到：「' + weaknessBody.slice(0, 160) + '」',
        );
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: >-
  D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/shenzhen-enterprise-status-analysis；对比对象 B 根节点即 Arco select（无子 .arco-select-view），点 [data-testid=szstatus-radar-object-b]；下拉项现场为北京/110000 非「北京市」，当前参照行展示 110000，脚本经 toCanonical 对齐用例「北京市」。
  D4·2026-10-20 rewrite-FUNC-02121 svcz：选北京后 city-insight 相对短板仍为「当前可比指标未发现低于参照对象的项」（无「低于」说明行），expect② 红；与 FUNC-02122 全国参照空短板同源数据/洞察缺口。
  选链/关对比篮同 FUNC-02120/02122。登录与关内部评审由 runner 前置。B 档零 allow_skip。
