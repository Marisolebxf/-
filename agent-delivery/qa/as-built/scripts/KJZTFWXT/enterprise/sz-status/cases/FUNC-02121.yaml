id: FUNC-02121
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02121
priority: P1
tier: B
title: 对比对象B改选北京市后参照与相对短板更新
entry_id: ent-sz-status
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 同册02088选链、00969切多城市对标至结果出现
    script: |-
      const main = page.locator('main');
      await main.getByPlaceholder('请选择产业链').click();
      await page.locator('.arco-select-dropdown:visible').getByText('人工智能', { exact: true }).click();
      await expect(main.getByText('人工智能').first()).toBeVisible({ timeout: 120000 });
      await expect(main.getByText('深圳相关企业清单')).toBeVisible({ timeout: 120000 });
      await main.getByRole('tab', { name: '多城市横向对标' }).click();
      await expect(main.getByText('城市 × 指标对比表')).toBeVisible({ timeout: 120000 });
  - action: evaluate
    note: 展开对比对象B并点选北京市
    script: |-
      const main = page.locator('main');
      const objB = main.locator('.arco-select').filter({ hasText: '对比对象 B' });
      await objB.locator('.arco-select-view').click();
      await page.locator('.arco-select-dropdown:visible').getByText('北京市', { exact: true }).click();
expect:
  - note: 「当前参照」变为北京市
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('当前参照', { exact: true })).toBeVisible();
      await expect(main.getByText(/当前参照[\s\S]*北京市/)).toBeVisible();
  - note: 「相对短板」出现低于该参照的说明
    assert: |-
      const main = page.locator('main');
      await expect(main.getByText('相对短板', { exact: true })).toBeVisible();
      const section = main.locator('section, div').filter({ hasText: '相对短板' }).first();
      const txt = await section.innerText();
      if (!/低于/.test(txt)) {
        throw new Error('相对短板区未见「低于」说明: ' + txt.replace(/\s+/g, ' ').slice(0, 240));
      }
      if (/当前可比指标未发现低于参照对象的项/.test(txt)) {
        throw new Error('相对短板仍为无低于项空态');
      }
on_fail: 截图 + 抄 X-Trace-Id
