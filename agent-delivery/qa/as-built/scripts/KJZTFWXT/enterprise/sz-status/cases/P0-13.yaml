id: P0-13
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-00972
priority: P0
title: 对标视图呈现优势与短板说明或按可比性降级
story: US-SZSTATUS-03
entry_id: ent-sz-status
preconditions:
- 已切至多城市横向对标 Tab 且视图加载完成
locators:
  advantage: 相对优势
  weakness: 相对短板
steps:
- action: evaluate
  note: 浏览优势与短板说明区
expect:
- note: 优势与短板说明按可比指标呈现
  assert: |-
    if (!(await page.getByText('相对优势').count())) { await page.goto('https://edu.itic-sci.com/tts/svcz/enterprise/shenzhen-enterprise-status-analysis', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const chain = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="请选择产业链"]') }).first(); await chain.click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible').getByText('人工智能', { exact: true }).first().click({ timeout: 8000 }); await page.waitForTimeout(3000); await page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: '多城市横向对标' }).first().click({ timeout: 8000 }); await page.waitForTimeout(3000) }; await expect(page.getByText('相对优势').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('相对短板').first()).toBeVisible({ timeout: 8000 })
- note: 可比指标不足 3 项时降级呈现不输出强结论
  assert: 'await expect(page.getByText(/暂无相对优势|未发现低于参照|当前可比指标/).first()).toBeVisible({ timeout: 8000 })'
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 空数据下降级文案「当前可比指标暂无相对优势」等（observed）。
tier: B
