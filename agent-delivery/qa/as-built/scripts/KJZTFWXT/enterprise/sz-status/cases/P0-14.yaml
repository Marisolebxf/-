preconditions:
- 已选定一条产业链
- 当前停留于产业链定位 Tab
locators:
  spin: .arco-spin
steps:
- action: evaluate
  note: 从定位 Tab 切到对标并立即浏览
expect:
- note: 对标计算中呈现过程态且不白屏不报错
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/shenzhen-enterprise-status-analysis', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const chain = page.locator('main .arco-select-view').filter({ has: page.locator('input[placeholder="请选择产业链"]') }).first(); if (!(await page.locator('main .arco-select-view').filter({ hasText: '人工智能' }).count())) { await chain.click({ timeout: 8000 }); await page.waitForTimeout(500); await page.locator('.arco-trigger-popup:visible').getByText('人工智能', { exact: true }).first().click({ timeout: 8000 }); await page.waitForTimeout(3000) }; await page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: '产业链定位' }).first().click({ timeout: 5000 }).catch(()=>{}); await page.waitForTimeout(400); await page.locator('main [role=tab], main .arco-tabs-tab, main button').filter({ hasText: '多城市横向对标' }).first().click({ timeout: 8000 }); let saw = false; for (let i = 0; i < 20; i++) { if (await page.locator('.arco-spin, .arco-skeleton').count()) { saw = true; break } if (await page.getByText('对标城市').count()) { saw = true; break } await page.waitForTimeout(100) }; if (!saw) throw new Error('未见对标过程态或视图'); await expect(page.getByRole('heading', { name: '深圳企业现状分析' })).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 加载极快时以对标视图出现为准；计算失败需构造异常，不写不可执行预期。
tier: B
