id: FUNC-02088
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02088
priority: P0
title: 从产业链下拉点选人工智能后到达定位结果
story: US-SZSTATUS-01
entry_id: ent-sz-status
tier: A
preconditions:
  - 已进入深圳企业现状分析页
  - 尚未选定产业链
locators:
  chain_select: main .arco-select-view（placeholder 请选择产业链 / 选择产业集群）
  option_ai: .arco-trigger-popup:visible 选项「人工智能」
  list_title: 深圳相关企业清单
steps:
  - action: goto
    target: /enterprise-center/shenzhen-enterprise-status-analysis
  - action: evaluate
    note: 展开产业链下拉、点选人工智能、等待清单区（判定在 expect）
expect:
  - note: 产业链下拉回显「人工智能」
    assert: |-
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) { await close.first().click(); await page.waitForTimeout(300); }
        }
      };
      const ensurePosTab = async () => {
        const posTab = page.locator('main [role=tab]').filter({ hasText: /产业链定位|深圳企业产业链定位/ }).first();
        if (await posTab.count()) {
          const sel = (await posTab.getAttribute('aria-selected')) || '';
          const cls = (await posTab.getAttribute('class')) || '';
          if (sel !== 'true' && !/active/.test(cls)) await posTab.click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      };
      const collectOptions = () =>
        page.evaluate(() => {
          const out = [];
          for (const el of document.querySelectorAll('.arco-select-option, li[role=option]')) {
            const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
            const st = window.getComputedStyle(el);
            if (!t || st.display === 'none' || st.visibility === 'hidden') continue;
            if (el.offsetParent === null && !el.closest('.arco-select-dropdown')) continue;
            out.push(t);
          }
          return [...new Set(out)];
        });
      const selectAiChain = async () => {
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"], input[placeholder="选择产业链条"]'),
        }).first();
        await expect(chain).toBeVisible({ timeout: 12000 });
        await chain.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        let options = await collectOptions();
        if (options.length === 0) {
          await page.keyboard.press('ArrowDown');
          await page.waitForTimeout(700);
          options = await collectOptions();
        }
        if (!options.includes('人工智能')) {
          throw new Error('D3·下拉无「人工智能」（用例金样不可改用现场产业集群项）；现场 ' + options.length + ' 项：' + (options.join('、') || '(空)'));
        }
        const popup = page.locator('.arco-trigger-popup:visible, .arco-select-dropdown:visible');
        const opt = popup.locator('.arco-select-option, li[role=option]').filter({ hasText: /^人工智能$/ }).first();
        await opt.click({ timeout: 8000 });
        await page.waitForTimeout(400);
      };
      await dismissBasket();
      await page.waitForLoadState('domcontentloaded');
      if (await page.getByText('抱歉，页面不存在').isVisible().catch(() => false)) {
        throw new Error('ENV·edu 目标页 404，无法执行选链步骤');
      }
      await expect(page.getByRole('heading', { name: '深圳企业现状分析', level: 1 })).toBeVisible({ timeout: 12000 });
      await ensurePosTab();
      await selectAiChain();
      await expect(page.locator('main .arco-select-view').filter({ hasText: '人工智能' }).first()).toBeVisible({ timeout: 12000 });
  - note: 页面出现「深圳相关企业清单」
    assert: |-
      if (!(await page.getByText('深圳相关企业清单', { exact: true }).count())) {
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        if (await chain.count()) {
          await chain.click({ timeout: 8000 });
          await page.waitForTimeout(500);
          await page.locator('.arco-trigger-popup:visible').getByText('人工智能', { exact: true }).first().click({ timeout: 8000 });
        }
      }
      let ok = false;
      for (let i = 0; i < 50; i++) {
        if (await page.getByText('深圳相关企业清单', { exact: true }).count()) { ok = true; break; }
        await page.waitForTimeout(150);
      }
      if (!ok) throw new Error('选链后未出现「深圳相关企业清单」');
      await expect(page.getByText('深圳相关企业清单', { exact: true }).first()).toBeVisible({ timeout: 8000 });
  - note: 清单中有企业行（非仅空态占位）
    assert: |-
      if (!(await page.getByText('深圳相关企业清单', { exact: true }).count())) {
        const chain = page.locator('main .arco-select-view').filter({
          has: page.locator('input[placeholder="请选择产业链"], input[placeholder="选择产业集群"]'),
        }).first();
        await chain.click({ timeout: 8000 });
        await page.waitForTimeout(500);
        await page.locator('.arco-trigger-popup:visible').getByText('人工智能', { exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(2000);
      }
      if (await page.getByText('当前条件下暂无企业').isVisible().catch(() => false)) {
        throw new Error('清单为空态「当前条件下暂无企业」，未见企业行');
      }
      const detailBtns = page.locator('main').getByRole('button', { name: '查看详情' });
      if (await detailBtns.count() < 1) {
        const bodyRows = page.locator('main .arco-table-tbody tr, main .arco-table-body .arco-table-tr');
        const texts = await bodyRows.evaluateAll((els) =>
          els.map((el) => (el.innerText || '').trim()).filter((t) => t && !/暂无|共\s*\d+\s*条/.test(t))
        );
        if (!texts.length) throw new Error('清单区无企业数据行且无「查看详情」');
      }
      await expect(detailBtns.first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id + C1~C6 分类
as_built_note: >-
  金样；goto enterprise-center/shenzhen-enterprise-status-analysis（与 FUNC-02093/02104 同口径；catalog /enterprise 本环境 404 仅记 D1）。
  D3·现场 placeholder「选择产业集群」，展开 15 项为产业集群清单（FUNC-02093），无「人工智能」；用例要求点选并回显「人工智能」，禁止 alias 虚绿。
  无可见快捷 chip（P7 点 .arco-select-view）。Tab「深圳企业产业链定位」。须先关对比篮（ENV-SZSTATUS-BASKET-OVERLAY-001）。登录与关内部评审由 runner 前置。A 档零 allow_skip。
