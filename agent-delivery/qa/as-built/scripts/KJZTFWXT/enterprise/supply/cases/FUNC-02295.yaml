id: FUNC-02295
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02295
priority: P0
title: 结果页任务摘要回显当次关系范围
story: US-ENT-RISK-SUPPLY
entry_id: ent-supply
tier: A
preconditions:
  - 已打开一条成功结果（assert 自含最近分析恢复）
locators:
  restore: button「恢复结果」
  clone_config: button「按此配置新建分析」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 恢复成功结果→读任务摘要关系范围→按此配置新建核对勾选一致
expect:
  - note: 1、任务摘要含「关系范围」 2、摘要与配置页勾选类型一致
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const opts = ['供应商', '客户', '合作伙伴'];
      const norm = (arr) => [...arr].sort().join('|');
      const parseScopeLine = (text) => {
        const m = text.match(/关系范围[：:]\s*([^\n]+)/);
        if (!m) return null;
        return m[1]
          .split(/[、,，/\s]+/)
          .map((s) => s.trim())
          .filter((s) => opts.includes(s));
      };
      const readCheckedOnConfig = async () => {
        const picked = [];
        for (const n of opts) {
          const box = main().locator('.arco-checkbox').filter({ hasText: n }).first();
          await expect(box).toBeVisible({ timeout: 8000 });
          const cls = (await box.getAttribute('class')) || '';
          if (/arco-checkbox-checked/.test(cls)) picked.push(n);
        }
        return picked;
      };
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const restoreFirstCompleted = async () => {
        await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await dismissBasket();
        await openRecentTab();
        const restore = page.getByRole('button', { name: '恢复结果' });
        if (!(await restore.count())) {
          throw new Error('环境闸门 ENV-SUPPLY-NO-COMPLETED-001：最近分析无「恢复结果」已完成任务');
        }
        await restore.first().click({ timeout: 15000 });
        await expect(page).toHaveURL(/view=result/, { timeout: 25000 });
        await expect(page.getByText('任务摘要').first()).toBeVisible({ timeout: 25000 });
      };
      await restoreFirstCompleted();
      await dismissBasket();
      let t = await main().innerText().catch(() => '');
      if (!/关系范围/.test(t)) throw new Error('任务摘要未见「关系范围」字段');
      const fromSummary = parseScopeLine(t);
      if (!fromSummary || fromSummary.length < 1) {
        throw new Error('任务摘要「关系范围」行无法解析类型：' + t.slice(0, 400));
      }
      const cloneBtn = main().getByRole('button', { name: /按此配置新建/ }).first();
      if (!(await cloneBtn.count()) || !(await cloneBtn.isVisible().catch(() => false))) {
        throw new Error('环境闸门 ENV-SUPPLY-CLONE-CONFIG-001：结果页无「按此配置新建」');
      }
      await cloneBtn.click({ timeout: 12000 });
      await page.waitForTimeout(1200);
      await expect(page.getByText('关系范围', { exact: true }).first()).toBeVisible({ timeout: 12000 });
      const fromConfig = await readCheckedOnConfig();
      if (fromConfig.length < 1) throw new Error('配置页关系范围无勾选项');
      if (norm(fromSummary) !== norm(fromConfig)) {
        throw new Error(
          '关系范围与发起勾选不一致: 摘要=' + fromSummary.join('、') + ' 配置=' + fromConfig.join('、')
        );
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 testdata.route。前置=最近分析「恢复结果」进成功结果。步骤=读任务摘要「关系范围」行→点「按此配置新建」读三复选→集合一致。D4·rewrite-FUNC-02295 svcz。无已完成→ENV-SUPPLY-NO-COMPLETED-001。登录与关评审由 runner 前置。A 档零 allow_skip。
