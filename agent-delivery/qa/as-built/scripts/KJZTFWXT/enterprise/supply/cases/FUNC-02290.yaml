id: FUNC-02290
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02290
priority: P0
title: 过程页稍后查看后任务仍在最近分析
story: US-ENT-RISK-PROCESS
entry_id: ent-supply
tier: B
preconditions:
  - 已登录；过程页可点「稍后查看」（assert 自含回填或重新分析进过程态）
locators:
  view_later: button「稍后查看」
  recent_tab: tab「最近分析」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 进过程态→点稍后查看→开最近分析（判定在 expect）
expect:
  - note: 1、离开过程页并进入最近分析
    assert: |-
      const BUDGET_MS = 75000;
      const deadline = Date.now() + BUDGET_MS;
      const left = () => deadline - Date.now();
      if (left() < 5000) throw new Error('ENV-SUPPLY-SCRIPT-BUDGET-001: 断言预算不足');
      const body404 = async () => /404|页面不存在|抱歉，页面不存在/.test(await page.locator('body').innerText().catch(() => ''));
      if (await body404()) throw new Error('ENV-EDU-TTS-SVCZ-404-001: 供应链 SPA 404 ' + page.url());
      const main = () => page.locator('main.app-main, main.content-shell-layout').first();
      const procHint = /企业供应链关系分析生成中|可视化分析过程/;
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 2500 }).catch(() => {});
            await page.waitForTimeout(200);
          }
        }
      };
      const ensureFilled = async () => {
        await dismissBasket();
        if (await main().getByText(/来自对比篮/).first().isVisible().catch(() => false)) return;
        await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const sels = page.locator('[aria-label^="选择 "]');
        if ((await sels.count()) < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
        await sels.first().click({ force: true });
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await dismissBasket();
      };
      const inProcess = async () => {
        const t = await main().innerText().catch(() => '');
        return procHint.test(t) || page.url().includes('view=processing');
      };
      const pickLeaveBtn = async () => {
        const processing = await inProcess();
        const names = processing ? ['稍后查看'] : ['稍后查看', '查看最近分析'];
        for (const name of names) {
          const b = page.getByRole('button', { name, exact: true });
          if (
            (await b.count()) &&
            (await b.first().isVisible().catch(() => false)) &&
            (await b.first().isEnabled().catch(() => false))
          ) {
            return name;
          }
        }
        return null;
      };
      const clickLeave = async (name) => {
        await dismissBasket();
        const clicked = await page.evaluate((label) => {
          const btn = Array.from(document.querySelectorAll('button')).find(
            (b) => (b.textContent || '').trim() === label && !b.disabled,
          );
          if (btn) {
            btn.click();
            return true;
          }
          return false;
        }, name);
        if (!clicked) throw new Error('ENV-SUPPLY-PROCESS-WINDOW-001: 无法点击「' + name + '」');
        await page.waitForTimeout(800);
      };
      const waitLeaveBtn = async () => {
        while (left() > 3000) {
          const name = await pickLeaveBtn();
          if (name) return name;
          if (!(await inProcess())) break;
          await page.waitForTimeout(300);
        }
        return pickLeaveBtn();
      };
      const reachProcess = async () => {
        const url = page.url();
        const body = await main().innerText().catch(() => '');
        const onResult =
          /view=result/.test(url) && /任务摘要/.test(body) && !/可视化分析过程/.test(body);
        if (onResult) {
          const reBtn = page.getByRole('button', { name: '重新分析', exact: true }).first();
          if (!(await reBtn.isVisible().catch(() => false))) {
            throw new Error('ENV-SUPPLY-DAY-REUSE-001');
          }
          await reBtn.click({ timeout: 8000 });
        } else {
          await ensureFilled();
          const start = page.getByRole('button', { name: '开始分析' }).first();
          await expect(start).toBeEnabled({ timeout: 8000 });
          await start.click({ timeout: 8000 });
        }
        for (let i = 0; i < 24 && left() > 4000; i++) {
          await page.waitForTimeout(i === 0 ? 300 : 400);
          if (await pickLeaveBtn()) return;
          if (await inProcess()) return;
          const b = await main().innerText().catch(() => '');
          if (/已打开今天相同条件的风险分析结果/.test(b)) {
            throw new Error('ENV-SUPPLY-DAY-REUSE-001');
          }
        }
        if (!(await inProcess()) && !(await pickLeaveBtn())) {
          throw new Error('ENV-SUPPLY-PROCESS-WINDOW-001');
        }
      };
      const readTaskHint = async () => {
        const u = page.url();
        const fromUrl = (u.match(/task_id=([^&]+)/) || [])[1];
        if (fromUrl) return decodeURIComponent(fromUrl);
        const body = await main().innerText().catch(() => '');
        const m = body.match(TID_RE);
        return m ? m[0] : null;
      };
      const openRecentTab = async () => {
        const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
        const historyPath = '/enterprise/risk?workspace=supply-chain&tab=supply-chain&view=history';
        if (page.url().includes('view=history')) {
          await page.waitForTimeout(400);
          return;
        }
        const tab = page.getByRole('tab', { name: '最近分析' }).first();
        if (await tab.isVisible().catch(() => false)) {
          const sel = await tab.getAttribute('aria-selected').catch(() => '');
          if (sel === 'true') return;
          const viaTab = await page.evaluate(() => {
            const t = Array.from(document.querySelectorAll('[role="tab"]')).find(
              (el) => (el.textContent || '').includes('最近分析'),
            );
            if (t) {
              t.click();
              return true;
            }
            return false;
          });
          if (viaTab) {
            await page.waitForTimeout(700);
            if (page.url().includes('view=history') || /最近分析/.test(await main().innerText().catch(() => ''))) return;
          }
        }
        await page.goto(origin + historyPath, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(700);
      };
      await dismissBasket();
      await reachProcess();
      const leaveName = await waitLeaveBtn();
      if (!leaveName) throw new Error('ENV-SUPPLY-PROCESS-WINDOW-001: 未见稍后查看');
      const taskHint = await readTaskHint();
      const inflightBefore = await page.locator('button[aria-label*="打开我的任务"]').first().getAttribute('aria-label').catch(() => '');
      await clickLeave(leaveName);
      await openRecentTab();
      const bodyAfter = await main().innerText().catch(() => '');
      if (procHint.test(bodyAfter) && page.url().includes('view=processing')) {
        throw new Error('点稍后查看后仍停留过程态');
      }
      globalThis.__func02290 = { taskHint, inflightBefore };
  - note: 2、该任务仍留在最近分析列表中
    assert: |-
      if (!globalThis.__func02290) throw new Error('前置：未完成稍后查看与再进最近分析');
      const main = page.locator('main.app-main, main.content-shell-layout').first();
      const body = await main.innerText().catch(() => '');
      if (!/最近分析/.test(body) && !page.url().includes('view=history')) {
        throw new Error('未在最近分析列表态: ' + body.slice(0, 160));
      }
      const hint = globalThis.__func02290.taskHint;
      const rows = body.match(/RISK-\d{8}-\d{3}/g) || [];
      if (rows.length < 1) throw new Error('最近分析列表无 RISK 任务行');
      if (hint && body.includes(hint)) return;
      if (/处理中|进行中/.test(body)) return;
      if (await page.getByRole('button', { name: '继续查看', exact: true }).count()) return;
      throw new Error('列表未见进行中任务，期望含 ' + (hint || rows[0]));
  - note: 3、页角仍显示进行中的任务数
    assert: |-
      if (!globalThis.__func02290) throw new Error('前置未完成');
      const dock = page.locator('button[aria-label*="打开我的任务"]').first();
      await expect(dock).toBeVisible({ timeout: 6000 });
      const label = (await dock.getAttribute('aria-label')) || '';
      const m = label.match(/(\d+)\s*个进行中/);
      const mainTxt = await page.locator('main.app-main, main.content-shell-layout').first().innerText().catch(() => '');
      if (m && parseInt(m[1], 10) >= 1) return;
      const before = globalThis.__func02290.inflightBefore || '';
      const mBefore = before.match(/(\d+)\s*个进行中/);
      const nBefore = mBefore ? parseInt(mBefore[1], 10) : 0;
      const nAfter = m ? parseInt(m[1], 10) : 0;
      if (nAfter > nBefore) return;
      if (/处理中|进行中/.test(mainTxt)) return;
      throw new Error('页角未见进行中计数: ' + label);
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz catalog /enterprise/risk?workspace=supply-chain&tab=supply-chain。回填或重新分析进过程→点「稍后查看」/「查看最近分析」→开「最近分析」。首条 assert 75s 预算（防 SCRIPT-BUDGET-001）。登录关评审 runner 前置。B 档零 allow_skip。
