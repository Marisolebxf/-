id: FUNC-02320
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02320
priority: P1
title: 全选当前筛选结果已选等于列出家数且确定可用
story: US-ENT-RISK-OBJECT
entry_id: ent-supply
tier: B
preconditions:
  - 已打开「选择分析企业」（assert 自含打开浮层）
  - 当前筛选至少列出 1 家企业（assert 自含入篮与必要时收窄筛选≤2 家）
locators:
  overlay_title: 选择分析企业
  select_all_chk: checkbox aria-label「全选当前筛选结果」
  confirm_btn: button「确定」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 打开选择分析企业→点「全选当前筛选结果」；已选计数与确定门控在 expect
expect:
  - note: 1、已选家数等于当前列出的企业数
    assert: |-
      const route = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const toUrl = (p) => (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') + (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const pickerRoot = () => page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const listEnterpriseNames = async (scope) => {
        const names = [];
        const cards = scope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        for (let i = 0; i < cardN; i++) {
          const card = cards.nth(i);
          if (!(await card.isVisible().catch(() => false))) continue;
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = scope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const sel = sels.nth(i);
          if (!(await sel.isVisible().catch(() => false))) continue;
          const aria = (await sel.getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const parseSelectedCount = async (scope) => {
        const txt = ((await scope.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        const m = txt.match(/已选\s*(\d+)\s*家/);
        if (m) return parseInt(m[1], 10);
        const liveM = txt.match(/当前已选择\s*(\d+)\s*家企业/);
        if (liveM) return parseInt(liveM[1], 10);
        const sels = scope.locator('[aria-label^="选择 "]');
        let checked = 0;
        for (let i = 0; i < await sels.count(); i++) {
          if ((await sels.nth(i).getAttribute('aria-checked')) === 'true') checked++;
        }
        return checked;
      };
      const joinOneViaAddModal = async (panel) => {
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
        const addBtn = (await workspace.count())
          ? workspace.getByRole('button', { name: '新增', exact: true })
          : panel.getByRole('button', { name: '新增', exact: true });
        await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
        await addBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const modalRoot = page
          .locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible')
          .filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) })
          .last();
        await expect(modalRoot).toBeVisible({ timeout: 15000 });
        await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
        const joinBtns = modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(joinBtns.first()).toBeVisible({ timeout: 30000 });
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
      };
      const ensureBasketInPicker = async (panel, min) => {
        let names = await listEnterpriseNames(panel);
        if (names.length >= min) return;
        await joinOneViaAddModal(panel);
        names = await listEnterpriseNames(panel);
        if (names.length < min) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      };
      const narrowFilterIfNeeded = async (panel, maxListed) => {
        let names = await listEnterpriseNames(panel);
        if (names.length <= maxListed) return names.length;
        const search = panel.getByPlaceholder('按企业名称搜索');
        if (!(await search.count())) return names.length;
        const target = names[0];
        for (const len of [Math.min(4, target.length), target.length]) {
          await search.fill('');
          await search.fill(target.slice(0, len));
          await page.waitForTimeout(600);
          names = await listEnterpriseNames(panel);
          if (names.length >= 1 && names.length <= maxListed) return names.length;
        }
        return (await listEnterpriseNames(panel)).length;
      };
      const openPicker = async () => {
        const main = page.locator('main');
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        const adjustBtn = main.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        if (await adjustBtn.count() && (await adjustBtn.first().isVisible().catch(() => false))) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await pickBtn.count() && (await pickBtn.first().isVisible().catch(() => false))) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await emptyCta.count()) {
          await emptyCta.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到打开「选择分析企业」入口');
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await closeBasket();
      await openPicker();
      const panel = pickerRoot();
      await expect(panel).toBeVisible({ timeout: 8000 });
      await ensureBasketInPicker(panel, 1);
      const emptyFilter = panel.getByText('当前篮内无匹配企业', { exact: false });
      if (await emptyFilter.isVisible().catch(() => false)) {
        const resetBtn = panel.getByRole('button', { name: '重置', exact: true });
        if (await resetBtn.count()) await resetBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
      }
      let listN = await narrowFilterIfNeeded(panel, 2);
      if (listN < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      if (listN > 2) {
        throw new Error('ENV-SUPPLY-FILTER-NARROW-001：当前筛选列出 ' + listN + ' 家，本页最多选 2 家，无法同时满足全选与「确定」可用');
      }
      let selected = await parseSelectedCount(panel);
      if (selected !== 0) {
        const clearBtn = panel.getByRole('button', { name: '取消选择', exact: true });
        if (await clearBtn.count() && !(await clearBtn.first().isDisabled())) {
          await clearBtn.first().click({ timeout: 8000 });
          await page.waitForTimeout(400);
        }
      }
      const selectAll = panel
        .getByRole('checkbox', { name: '全选当前筛选结果' })
        .or(panel.locator('[aria-label="全选当前筛选结果"]'));
      await expect(selectAll.first()).toBeVisible({ timeout: 8000 });
      await selectAll.first().scrollIntoViewIfNeeded({ timeout: 8000 }).catch(() => {});
      await selectAll.first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      selected = await parseSelectedCount(panel);
      listN = (await listEnterpriseNames(panel)).length;
      if (selected !== listN) {
        throw new Error('全选后已选 ' + selected + ' 家，当前列出 ' + listN + ' 家');
      }
      globalThis.__func02320_listN = listN;
      globalThis.__func02320_selected = selected;
  - note: 2、「确定」变为可用
    assert: |-
      const listN = globalThis.__func02320_listN;
      const selected = globalThis.__func02320_selected;
      if (listN == null || selected == null) throw new Error('前置：未完成全选');
      const panel = page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      await expect(panel).toBeVisible({ timeout: 8000 });
      const confirmBtn = panel.getByRole('button', { name: '确定', exact: true });
      await expect(confirmBtn.first()).toBeVisible({ timeout: 8000 });
      if (await confirmBtn.first().isDisabled()) {
        throw new Error('全选 ' + selected + ' 家后「确定」仍不可用（列出 ' + listN + ' 家）');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/risk + workspace=supply-chain&tab=supply-chain。步骤=打开「选择分析企业」→必要时按企业名搜索收窄当前筛选≤2 家（本页 max 2）→取消选择→点 aria-label「全选当前筛选结果」checkbox。机检=已选 N 家等于列出 N 家且「确定」enabled。篮空→ENV-SUPPLY-BASKET-EMPTY-001；筛后仍>2 家→ENV-SUPPLY-FILTER-NARROW-001。登录与关评审由 runner 前置。B 档零 allow_skip。
