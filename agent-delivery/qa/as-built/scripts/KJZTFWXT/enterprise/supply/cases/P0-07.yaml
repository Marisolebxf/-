id: P0-07
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01034
priority: P0
title: 对象区为空时呈现前往对比篮引导提示
story: US-ENT-RISK-SUPPLY
entry_id: ent-supply
preconditions:
  - env-gate overall=pass
  - 未带入分析对象（无 enterprise_codes；脏会话先清参重进）
locators:
  guide: 请先在对比篮选择企业，再进入风险洞察配置。
  cta: 前往对比篮选择企业
  start: 开始分析
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
expect:
  - note: 对象区空态显示「请先在对比篮选择企业」引导文案
    assert: |-
      await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); if (/enterprise_codes/.test(page.url())) { await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000) }; const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await expect(page.getByText(/请先在对比篮选择企业/).first()).toBeVisible({ timeout: 8000 })
  - note: 对象区呈现「前往对比篮选择企业」引导按钮
    assert: |-
      await expect(page.getByRole('button', { name: '前往对比篮选择企业' })).toBeVisible({ timeout: 8000 })
  - note: 无对象时「开始分析」处于禁用态
    assert: |-
      await expect(page.getByRole('button', { name: '开始分析' })).toBeDisabled({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 空态引导文案实勘「请先在对比篮选择企业，再进入风险洞察配置。」；CTA「前往对比篮选择企业」；开始分析空态 disabled（scout）。env-gate overall=pass。A 档空态引导，零 allow_skip。list 相对父键 2 空格缩进。
tier: A
