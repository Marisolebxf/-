id: FUNC-02311
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02311
priority: P1
title: 删除分析记录时点取消后该任务仍在
story: US-ENT-RISK-PROCESS
entry_id: ent-supply
tier: B
preconditions:
  - 最近分析中有一条供应链任务
locators:
  recent_tab: tab「最近分析」
  delete_button: button「删除」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 最近分析→锚定一行点「删除」→弹框验标题与文案→点「取消」；行仍在 expect 判定
expect:
  - note: 1、弹出「删除分析记录」，说明删除后列表不再显示
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await expect(page).toHaveURL(/view=history/, { timeout: 12000 });
      };
      const rowFromDel = (del) =>
        del.locator('xpath=ancestor::tr[1] | ancestor::*[contains(@class,"arco-table-tr")][1]').first();
      const deleteInRow = (row) => row.locator('button, .arco-btn').filter({ hasText: /^删除$/ }).last();
      const pickSupplyDelete = async () => {
        await scrollHistoryActions();
        const anchors = [
          ...(await main().getByRole('button', { name: '恢复结果', exact: true }).all()),
          ...(await main().getByRole('button', { name: '继续查看', exact: true }).all()),
        ];
        for (const anchor of anchors) {
          if (!(await anchor.isVisible().catch(() => false))) continue;
          const row = rowFromDel(anchor);
          const rowText = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
          if (!TID_RE.test(rowText)) continue;
          let del = deleteInRow(row);
          if (!(await del.count())) del = row.getByRole('button', { name: '删除', exact: true }).last();
          if (!(await del.count())) continue;
          await row.scrollIntoViewIfNeeded().catch(() => {});
          await scrollHistoryActions();
          if (!(await del.isVisible().catch(() => false))) continue;
          const tidM = rowText.match(TID_RE);
          if (!tidM) continue;
          return { del, row, tid: tidM[0] };
        }
        const dels = main().getByRole('button', { name: '删除', exact: true });
        const dn = await dels.count();
        for (let i = 0; i < dn; i++) {
          const del = dels.nth(i);
          if (!(await del.isVisible().catch(() => false))) continue;
          const row = rowFromDel(del);
          const rowText = (await row.innerText().catch(() => '')).replace(/\s+/g, ' ').trim();
          const tidM = rowText.match(TID_RE);
          if (!tidM) continue;
          return { del, row, tid: tidM[0] };
        }
        return null;
      };
      const waitHistoryList = async () => {
        const t0 = Date.now();
        while (Date.now() - t0 < 20000) {
          const t = await main().innerText().catch(() => '');
          if (/删除/.test(t) || /恢复结果/.test(t) || /继续查看/.test(t)) return;
          if (/任务名称/.test(t) && /操作/.test(t)) return;
          if (/暂无|没有.*记录|空/.test(t)) return;
          await page.waitForTimeout(400);
        }
      };
      await dismissBasket();
      await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await openRecentTab();
      await waitHistoryList();
      await expect(main().getByText('任务名称').first()).toBeVisible({ timeout: 12000 });
      let picked = await pickSupplyDelete();
      if (!picked) {
        await scrollHistoryActions();
        picked = await pickSupplyDelete();
      }
      const mainText = await main().innerText().catch(() => '');
      const hasHistoryRow = TID_RE.test(mainText)
        || (await main().getByRole('button', { name: '恢复结果' }).count()) > 0
        || (await main().getByRole('button', { name: '继续查看' }).count()) > 0;
      if (!picked) {
        if (/暂无数据|暂无|没有.*记录/.test(mainText) && !hasHistoryRow) {
          throw new Error('环境闸门 ENV-SUPPLY-NO-HISTORY-001：最近分析无供应链任务');
        }
        const delTotal = await main().getByRole('button', { name: '删除', exact: true }).count();
        if (hasHistoryRow && delTotal === 0) {
          throw new Error('环境闸门 DEF-ENT-RISK-HISTORY-DELETE-UI-001：有历史行但操作列无「删除」');
        }
        throw new Error('环境闸门 ENV-SUPPLY-NO-HISTORY-001：最近分析无可点「删除」的供应链任务行');
      }
      globalThis.__func02311 = { tid: picked.tid, modalReady: false };
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      await expect(modal.locator('.arco-modal-title').filter({ hasText: '删除分析记录' }).first()).toBeVisible();
      const bodyText = (await modal.innerText()).replace(/\s+/g, ' ');
      const explainsHidden =
        /不再显示|不再展示|列表.*不|删除后/.test(bodyText) || /删除.*记录/.test(bodyText);
      if (!explainsHidden) {
        throw new Error('弹框未说明删除后列表不再显示，正文：' + bodyText.slice(0, 240));
      }
      globalThis.__func02311.modalReady = true;
  - note: 2、取消后该任务仍在列表中
    assert: |-
      if (!globalThis.__func02311?.modalReady) throw new Error('前置：未打开删除分析记录弹框');
      const expectedTid = globalThis.__func02311.tid;
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const main = () => page.locator('main.content-shell-layout, main').first();
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 5000 });
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 5000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const tableTaskIds = async () => {
        const rows = main().locator('table tbody tr, .arco-table-tr');
        const n = await rows.count();
        const ids = [];
        for (let i = 0; i < n; i++) {
          const txt = await rows.nth(i).innerText().catch(() => '');
          const m = txt.match(TID_RE);
          if (m) ids.push(m[0]);
        }
        if (ids.length) return ids;
        const body = await main().innerText().catch(() => '');
        return [...new Set(body.match(new RegExp(TID_RE.source, 'g')) || [])];
      };
      const idsAfter = await tableTaskIds();
      if (!idsAfter.includes(expectedTid)) {
        throw new Error('取消删除后任务不在最近分析列表：' + expectedTid);
      }
      const rowStill = main().locator('table tbody tr, .arco-table-tr').filter({ hasText: expectedTid });
      await expect(rowStill.first()).toBeVisible({ timeout: 8000 });
      const msgDeleted = page.locator('.arco-message-content').filter({ hasText: /已删除/ });
      if (await msgDeleted.count() && (await msgDeleted.first().isVisible().catch(() => false))) {
        throw new Error('取消后不应出现「已删除」提示');
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz entry-seed ent-supply catalog_path /enterprise/risk?workspace=supply-chain&tab=supply-chain。步骤=最近分析→任一带 RISK 任务行「删除」→Modal「删除分析记录」含删除后列表不再显示→「取消」→任务 ID 仍在。非破坏性（确定删除见 02312）。无任务→ENV-SUPPLY-NO-HISTORY-001；有行无删→DEF-ENT-RISK-HISTORY-DELETE-UI-001。登录与关评审由 runner 前置。B 档零 allow_skip。
