id: FUNC-02316
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02316
priority: P1
title: 清空对比篮弹框点取消后企业仍在
story: US-ENT-RISK-OBJECT
entry_id: ent-supply
tier: B
preconditions:
  - 已打开「选择分析企业」
  - 篮内至少有 1 家企业（assert 自含打开浮层）
locators:
  overlay_title: 选择分析企业
  clear_basket_btn: button「清空对比篮」
  modal_cancel: 弹框 button「取消」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 打开选择分析企业后点「清空对比篮」→ 弹框点「取消」；询问文案与名单在 expect 判定
expect:
  - note: 1、询问是否清空篮内全部企业，并说明不会删除企业数据
    assert: |-
      const route = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const toUrl = (p) => (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') + (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const visiblePanel = () => page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const listEnterpriseNames = async (scope) => {
        const names = [];
        const cards = scope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        for (let i = 0; i < cardN; i++) {
          const card = cards.nth(i);
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = scope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const overlayEnterpriseCount = async (scope) => {
        const txt = (await scope.innerText()).replace(/\s+/g, ' ');
        const m = txt.match(/企业\s*(\d+)\s*\/\s*50/);
        if (m) return parseInt(m[1], 10);
        return (await listEnterpriseNames(scope)).length;
      };
      const ensureEnterpriseInPicker = async (panel) => {
        if ((await overlayEnterpriseCount(panel)) >= 1) return;
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
        const addBtn = (await workspace.count())
          ? workspace.getByRole('button', { name: '新增', exact: true })
          : panel.getByRole('button', { name: '新增', exact: true });
        await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
        await addBtn.first().click({ timeout: 8000 });
        await page.waitForTimeout(500);
        const modalRoot = page
          .locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible')
          .filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) })
          .last();
        await expect(modalRoot).toBeVisible({ timeout: 15000 });
        await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
        const loadFail = modalRoot.getByText('名单读取失败', { exact: false });
        if (await loadFail.count() && (await loadFail.first().isVisible().catch(() => false))) {
          throw new Error('ENV-SUPPLY-ADD-ENTERPRISE-API-001');
        }
        const joinBtns = modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(joinBtns.first()).toBeVisible({ timeout: 30000 });
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
        if ((await overlayEnterpriseCount(panel)) < 1 && (await listEnterpriseNames(panel)).length < 1) {
          throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
        }
      };
      const openPicker = async () => {
        const adjustBtn = page.getByRole('button', { name: '返回对比篮调整对象' });
        const pickBtn = page.getByRole('button', { name: '选择分析企业' });
        const emptyCta = page.getByRole('button', { name: '前往对比篮选择企业' });
        if (await adjustBtn.count() && (await adjustBtn.first().isVisible().catch(() => false))) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await pickBtn.count() && (await pickBtn.first().isVisible().catch(() => false))) {
          await pickBtn.first().click({ timeout: 8000 });
        } else {
          await expect(emptyCta.first()).toBeVisible({ timeout: 8000 });
          await emptyCta.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await closeBasket();
      const openDockPanel = async () => {
        const dock = page.locator('button[aria-label*="打开对比篮"]').first();
        await expect(dock).toBeVisible({ timeout: 8000 });
        await dock.click({ timeout: 8000 });
        await page.waitForTimeout(700);
        const p = page.locator('.system-compare-panel:visible').last();
        await expect(p).toBeVisible({ timeout: 8000 });
        return p;
      };
      const dockPanel = await openDockPanel();
      await ensureEnterpriseInPicker(dockPanel);
      await closeBasket();
      await openPicker();
      let panel = (await visiblePanel().count()) ? visiblePanel() : page.locator('body');
      if ((await listEnterpriseNames(panel)).length < 1) {
        await ensureEnterpriseInPicker(panel);
      }
      panel = (await visiblePanel().count()) ? visiblePanel() : panel;
      const beforeNames = await listEnterpriseNames(panel);
      if (beforeNames.length < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      globalThis.__func02316_before = beforeNames;
      const clearBtn = panel.getByRole('button', { name: '清空对比篮', exact: true });
      await expect(clearBtn.first()).toBeVisible({ timeout: 8000 });
      await clearBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '清空对比篮' }).last();
      await expect(modal).toBeVisible({ timeout: 10000 });
      await expect(modal.getByText('清空对比篮', { exact: true }).first()).toBeVisible();
      const bodyText = (await modal.innerText()).replace(/\s+/g, ' ');
      if (!/确认清空.*篮内.*企业|清空篮内.*全部.*企业|是否清空.*篮内/.test(bodyText)) {
        throw new Error('弹框未说明将清空篮内企业，正文：' + bodyText.slice(0, 160));
      }
      if (!bodyText.includes('不会删除企业数据')) {
        throw new Error('弹框未说明不会删除企业数据，正文：' + bodyText.slice(0, 160));
      }
      globalThis.__func02316_modal = modal;
  - note: 2、取消后该企业仍在篮内
    assert: |-
      const beforeNames = globalThis.__func02316_before;
      const modal = globalThis.__func02316_modal;
      if (!beforeNames?.length || !modal) throw new Error('前置：弹框或篮内名单未就绪');
      const cancelBtn = modal.getByRole('button', { name: '取消', exact: true });
      await expect(cancelBtn).toBeVisible({ timeout: 8000 });
      await cancelBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const panel = (await page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).count())
        ? page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last()
        : page.locator('body');
      const afterNames = [];
      const cards = panel.locator('.ent-compare-item-card');
      const cardN = await cards.count();
      for (let i = 0; i < cardN; i++) {
        const card = cards.nth(i);
        const nameEl = card.locator('.ent-compare-item-card__name');
        const name = (await nameEl.count())
          ? (await nameEl.first().innerText()).trim()
          : (await card.innerText()).split('\n')[0].trim();
        if (name) afterNames.push(name);
      }
      if (!afterNames.length) {
        const sels = panel.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) afterNames.push(m[1].trim());
        }
      }
      if (afterNames.length !== beforeNames.length) {
        throw new Error(`取消后篮内企业数应保持 ${beforeNames.length}，实际 ${afterNames.length}`);
      }
      for (const name of beforeNames) {
        if (!afterNames.includes(name)) {
          throw new Error('取消后企业不在篮内：' + name);
        }
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/risk + workspace=supply-chain&tab=supply-chain。Modal.confirm 标题「清空对比篮」、正文含确认清空篮内企业与「不会删除企业数据」（对齐 KEYDOM FUNC-01721 / scout-overlay）。前置=系统对比篮 dock 或浮层「新增→加入对比篮」补≥1 企业后开「选择分析企业」。对比篮空/新增 API 失败→ENV-SUPPLY-BASKET-EMPTY-001 或 ENV-SUPPLY-ADD-ENTERPRISE-API-001。确定清空见 FUNC-02330。登录与关评审由 runner 前置。B 档零 allow_skip。
