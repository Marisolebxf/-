id: P0-11
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01038
priority: P0
title: 数据与权限预检区块只呈现校验状态缺失项与阻断原因
entry_id: ent-supply
preconditions:
- 已进入供应链页
steps:
- action: goto
  target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
- action: evaluate
  note: 空态与回填后浏览预检
expect:
- note: 预检区仅显示校验状态、缺失项与阻断原因
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await expect(page.getByText('数据与权限预检').first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/选择企业后显示数据与权限预检/).first()).toBeVisible({ timeout: 8000 }); await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); if (await sels.count() >= 2) await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2000); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; const t = await page.locator('main').innerText(); if (!/对象有效|数据覆盖|模型状态|权限范围/.test(t)) throw new Error('回填后预检字段缺失')
- note: 卡片标题栏无「开始分析」按钮
  assert: |-
    const starts = page.getByRole('button', { name: '开始分析' }); if ((await starts.count()) !== 1) throw new Error('开始分析入口数异常')
- note: 预检内容无接入进度百分比类字段
  assert: |-
    const t = await page.locator('main').innerText(); if (/接入进度|\d+%完成/.test(t) && !/进度\t0%/.test(t)) { /* 过程态进度另论；配置页预检禁百分比 */ } if (/数据与权限预检[\s\S]{0,200}?\d+%/.test(t)) throw new Error('预检区出现百分比')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业时仅空态预检可验，回填段 Pass-N/A
as_built_note: 回填后预检实勘「对象有效：2/2 / 数据覆盖：可用于演示 / 模型状态：演示可用 / 权限范围：当前可查看」。
tier: B
