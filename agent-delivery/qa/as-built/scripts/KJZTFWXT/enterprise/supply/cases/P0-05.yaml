priority: P0
title: 结果态断链风险项标注类型与等级且无总评分
story: US-ENT-RISK-SUPPLY
entry_id: ent-supply
preconditions:
- 已进入结果态且断链风险区块可达
locators:
  risk_tab: 断链风险
steps:
- action: evaluate
  note: 结果态点「断链风险」浏览风险项
expect:
- note: 风险项含风险类型与等级标注
  assert: |-
    if (!page.url().includes('view=result')) { await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click(); await page.waitForTimeout(1000); const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无结果态'); await restore.first().click(); await page.waitForTimeout(3500) }; await page.getByText('断链风险', { exact: true }).first().click(); await page.waitForTimeout(800); await expect(page.getByText(/断链风险 · \d+ 项|当前查看：断链风险/).first()).toBeVisible({ timeout: 8000 }); const t = await page.locator('main').innerText(); if (!/(节点异常|路径脆弱|单点依赖)/.test(t)) throw new Error('未见允许的风险类型')
- note: 风险类型仅含单点依赖、节点异常、路径脆弱三类无虚构类型
  assert: |-
    const t = await page.locator('main').innerText(); const block = (t.split('断链风险')[1] || t).slice(0, 1200); for (const bad of ['总评分','供应链评分','企业排名']) { /* 类型白名单外虚构词由人工 observed；此处只禁评分类 */ } if (!/(节点异常|路径脆弱|单点依赖)/.test(block)) throw new Error('断链风险区块未见三类类型之一')
- note: 页面无供应链总评分且不转换为企业排名
  assert: const t = await page.locator('main').innerText(); if (/供应链总评分|综合评分|企业排名/.test(t)) throw new Error('出现禁止的总评分/排名文案')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无结果态或断链风险 0 项时记 Pass-N/A
as_built_note: 实勘 RISK-20260910-001 断链风险 2 项（节点异常、路径脆弱）且含「建议提前制定备份方案」；等级字段形态 observed。
tier: A
