id: FUNC-02331
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02331
priority: P1
title: 关掉新增企业后点查看画像打开企业画像快览
story: US-ENT-RISK-OBJECT
entry_id: ent-supply
tier: B
preconditions:
  - 已打开「选择分析企业」且篮内至少有 1 家企业（assert 自含开浮层）
locators:
  overlay_title: 选择分析企业
  add_btn: button「新增」
  add_modal: .arco-modal-title「新增企业」
  view_profile: button「查看画像」
  profile_drawer: .arco-drawer:visible 标题含「企业画像快览」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 开浮层→点「新增」→关掉「新增企业」→该行「查看画像」；快览与摘要块在 expect 判定
expect:
  - note: 1、打开「企业画像快览」
    assert: |-
      const route = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const toUrl = (p) => (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') + (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const visiblePanel = () => page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const joinOneViaAddModal = async (panel) => {
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
        const addBtn = (await workspace.count())
          ? workspace.getByRole('button', { name: '新增', exact: true })
          : panel.getByRole('button', { name: '新增', exact: true });
        await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
        const recommendWait = page.waitForResponse((r) => /recommend/i.test(r.url()) && r.request().method() === 'POST', { timeout: 25000 }).catch(() => null);
        await addBtn.first().click({ timeout: 8000 });
        await recommendWait;
        await page.waitForTimeout(500);
        const modalRoot = page
          .locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible')
          .filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) })
          .last();
        await expect(modalRoot).toBeVisible({ timeout: 15000 });
        await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
        const joinBtns = modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
        await expect(joinBtns.first()).toBeVisible({ timeout: 30000 });
        await joinBtns.first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(300);
      };
      const ensureBasketInPicker = async (panel, min) => {
        let names = await listEnterpriseNames(panel);
        if (names.length >= min) return;
        await joinOneViaAddModal(panel);
        names = await listEnterpriseNames(panel);
        if (names.length < min) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      };
      const listEnterpriseNames = async (scope) => {
        const names = [];
        const cards = scope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        for (let i = 0; i < cardN; i++) {
          const card = cards.nth(i);
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = scope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
      const basketEntCount = async () => {
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const seedBasketFromSearchPage = async (min) => {
        const searchInput = page
          .getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ })
          .or(page.getByPlaceholder(/企业名|产业|资质/))
          .first();
        if (await searchInput.isVisible().catch(() => false)) {
          await searchInput.fill('华为');
          const searchBtn = page.getByRole('button', { name: '搜索', exact: true }).first();
          if (await searchBtn.isVisible().catch(() => false)) {
            await searchBtn.click({ timeout: 8000 });
            await page.waitForTimeout(1500);
          }
        }
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        let n = await basketEntCount();
        for (let round = 0; round < 5 && n < min; round++) {
          const btnN = await addBtns.count();
          let clicked = 0;
          for (let i = 0; i < btnN && n < min; i++) {
            const btn = addBtns.nth(i);
            if (!(await btn.isVisible().catch(() => false))) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForTimeout(700);
            clicked++;
            n = await basketEntCount();
          }
          if (!clicked) break;
        }
        return (await basketEntCount()) >= min;
      };
      const ensureBasketEnterprises = async (min) => {
        if ((await basketEntCount()) >= min) return;
        for (const sp of ['/enterprise/enterprise-search', '/development/search']) {
          await page.goto(toUrl(sp), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await closeBasket();
          if (await seedBasketFromSearchPage(min)) return;
        }
        throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      };
      const openPicker = async () => {
        const adjustBtn = page.getByRole('button', { name: '返回对比篮调整对象' });
        const pickBtn = page.getByRole('button', { name: '选择分析企业' });
        const emptyCta = page.getByRole('button', { name: '前往对比篮选择企业' });
        if (await adjustBtn.count() && (await adjustBtn.first().isVisible().catch(() => false))) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await pickBtn.count() && (await pickBtn.first().isVisible().catch(() => false))) {
          await pickBtn.first().click({ timeout: 8000 });
        } else {
          await expect(emptyCta.first()).toBeVisible({ timeout: 8000 });
          await emptyCta.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
      };
      const openPickerDeepLink = async () => {
        const pickerQs =
          'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50';
        await page.goto(toUrl(`${route}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 10000 });
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await closeBasket();
      try {
        await ensureBasketEnterprises(1);
      } catch {
        /* 浮层内「新增」入篮兜底 */
      }
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await openPicker();
      let panel = visiblePanel();
      if (!(await panel.count()) || !(await panel.isVisible().catch(() => false))) {
        await openPickerDeepLink();
        panel = visiblePanel();
      }
      await expect(panel).toBeVisible({ timeout: 8000 });
      await ensureBasketInPicker(panel, 1);
      const beforeNames = await listEnterpriseNames(panel);
      if (beforeNames.length < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      const entLabel = beforeNames[0];
      globalThis.__func02331_entLabel = entLabel;
      globalThis.__func02331_shortEnt = entLabel.length >= 4 ? entLabel.slice(0, Math.min(8, entLabel.length)) : entLabel;
      const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
      const addBtn = (await workspace.count())
        ? workspace.getByRole('button', { name: '新增', exact: true })
        : panel.getByRole('button', { name: '新增', exact: true });
      await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
      const recommendWait = page.waitForResponse((r) => /recommend/i.test(r.url()) && r.request().method() === 'POST', { timeout: 25000 }).catch(() => null);
      await addBtn.first().click({ timeout: 8000 });
      await recommendWait;
      await page.waitForTimeout(500);
      const modalRoot = page.locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible').filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) }).last();
      await expect(modalRoot).toBeVisible({ timeout: 15000 });
      await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
      await expect(modalRoot.locator('.arco-modal-title').filter({ hasText: '新增企业' }).first()).toBeVisible();
      const closeAdd = modalRoot.locator('.arco-modal-close-icon, .arco-modal-close-btn').first();
      if (await closeAdd.count() && await closeAdd.isVisible().catch(() => false)) {
        await closeAdd.click({ timeout: 8000 });
      } else {
        await modalRoot.getByRole('button', { name: '取消', exact: true }).first().click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      await expect(modalRoot).toBeHidden({ timeout: 10000 });
      await page.locator('.arco-modal-mask:visible').waitFor({ state: 'hidden', timeout: 8000 }).catch(() => {});
      panel = visiblePanel();
      await expect(panel).toBeVisible({ timeout: 8000 });
      const basketTab = panel.getByRole('tab', { name: '篮内企业' }).or(panel.getByText('篮内企业', { exact: true }));
      if (await basketTab.count() && (await basketTab.first().isVisible().catch(() => false))) {
        await basketTab.first().click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      const rowCard = panel.locator('.ent-compare-item-card').filter({ hasText: entLabel }).first();
      let profileBtn;
      if (await rowCard.count() && await rowCard.isVisible().catch(() => false)) {
        profileBtn = rowCard.getByRole('button', { name: '查看画像', exact: true }).first();
      } else {
        profileBtn = panel.getByRole('button', { name: '查看画像', exact: true }).first();
      }
      await expect(profileBtn).toBeVisible({ timeout: 12000 });
      const urlBefore = page.url();
      await profileBtn.scrollIntoViewIfNeeded().catch(() => {});
      await profileBtn.click({ timeout: 8000, force: true });
      await page.waitForTimeout(1500);
      const shortEnt = globalThis.__func02331_shortEnt || '';
      if (page.url() !== urlBefore && /\/development\/enterprise\//.test(page.url())) {
        const main = page.locator('main');
        const bodyTxt = ((await main.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (shortEnt && !bodyTxt.includes(shortEnt)) {
          throw new Error('D1·详情深链页未含所点企业「' + shortEnt + '」；url=' + page.url());
        }
        throw new Error(
          'D3·用例意图=篮内「查看画像」打开「企业画像快览」抽屉；现场 navigate 至详情深链 '
            + page.url()
            + '。目标态 lumen CompareItemCard+ElementProfile 抽屉。',
        );
      }
      const wrongDetail = page.locator('.arco-drawer:visible').filter({ hasText: '企业详情' }).last();
      if (await wrongDetail.isVisible().catch(() => false) && shortEnt) {
        const hay = ((await wrongDetail.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
        if (hay.includes(shortEnt)) {
          throw new Error('D3·打开「企业详情」抽屉而非「企业画像快览」');
        }
      }
      let drawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      if (!(await drawer.isVisible().catch(() => false))) {
        drawer = page.locator('.arco-drawer:visible').last();
      }
      if (!(await drawer.isVisible().catch(() => false))) {
        const titles = [];
        for (let i = 0, c = await page.locator('.arco-drawer:visible').count(); i < c; i++) {
          const t = await page.locator('.arco-drawer:visible').nth(i).locator('.arco-drawer-header, .arco-drawer-title').first().innerText().catch(() => '');
          if (t) titles.push(t.replace(/\s+/g, ' ').trim());
        }
        throw new Error('D3·点击「查看画像」后无「企业画像快览」抽屉；url=' + page.url() + '；可见抽屉标题=' + (titles.join('|') || '无'));
      }
      await expect(drawer).toBeVisible({ timeout: 5000 });
      await expect(drawer.locator('.arco-drawer-header, .arco-drawer-title').first()).toContainText('企业画像快览');
      globalThis.__func02331_drawerOpened = true;
  - note: 2、快览中的企业名与所点行一致
    assert: |-
      if (!globalThis.__func02331_drawerOpened) throw new Error('前置：企业画像快览未打开');
      const drawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      const shortEnt = globalThis.__func02331_shortEnt || '';
      const entLabel = globalThis.__func02331_entLabel || '';
      const hay = ((await drawer.innerText().catch(() => '')) || '').replace(/\s+/g, ' ');
      const needle = shortEnt || entLabel;
      if (needle && !hay.includes(needle)) {
        throw new Error('快览正文未含所点企业名片段「' + needle + '」');
      }
  - note: 3、可见「基础摘要」「竞争力摘要」「风险摘要」
    assert: |-
      if (!globalThis.__func02331_drawerOpened) throw new Error('前置：企业画像快览未打开');
      const drawer = page.locator('.arco-drawer:visible').filter({ hasText: '企业画像快览' }).last();
      await expect(drawer).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('基础摘要', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('竞争力摘要', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      await expect(drawer.getByText('风险摘要', { exact: true }).first()).toBeVisible({ timeout: 8000 });
      const closeBtn = drawer.locator('.arco-drawer-close-btn').first();
      if (await closeBtn.count()) {
        await closeBtn.click({ timeout: 5000 }).catch(() => {});
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/risk + workspace=supply-chain&tab=supply-chain。前置=浮层篮内≥1（不足时「新增」入篮后 Esc，对齐 FUNC-02318）。步骤=再点「新增」→关「新增企业」→所点行「查看画像」。机检=「企业画像快览」抽屉+企业名片段+三块摘要；跳 /development/enterprise/ 深链或「企业详情」抽屉判 D3。推荐名单不可用→ENV-SUPPLY-BASKET-EMPTY-001。登录与关评审由 runner 前置。B 档零 allow_skip。
