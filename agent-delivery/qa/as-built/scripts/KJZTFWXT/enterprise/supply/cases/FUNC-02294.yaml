id: FUNC-02294
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02294
priority: P0
title: 结果页任务摘要回显当次分析对象
story: US-ENT-RISK-SUPPLY
entry_id: ent-supply
tier: B
preconditions:
  - 已打开一条成功结果（assert 自含：对比篮回填 1 家发起或最近分析恢复）
locators:
  cta: 前往对比篮选择企业
  start: 开始分析
  restore: 恢复结果
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 进入成功结果页并阅读任务摘要；判定在 expect
expect:
  - note: 1、任务摘要含「分析对象」 2、名称与发起时的企业一致
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const isSuccessResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return /任务摘要/.test(t) && /分析对象/.test(t);
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const startViaBasket = async () => {
        await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
        const sels = page.locator('[aria-label^="选择 "]');
        if ((await sels.count()) < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
        const first = sels.first();
        const aria = (await first.getAttribute('aria-label')) || '';
        const entName = aria.replace(/^选择\s*/, '').trim();
        if (!entName) throw new Error('无法读取勾选企业名');
        await page.evaluate((name) => { globalThis.__FUNC_02294_ENT__ = name; }, entName);
        await first.click();
        await page.waitForTimeout(400);
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) throw new Error('ENV-SUPPLY-START-DISABLED-001');
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        if (/view=result/.test(page.url()) && /任务摘要/.test(await main().innerText().catch(() => ''))) {
          const reBtn = page.getByRole('button', { name: '重新分析' });
          if (await reBtn.count()) await reBtn.first().click({ timeout: 8000 }).catch(() => {});
        }
        const deadline = Date.now() + 120000;
        while (Date.now() < deadline) {
          const body = await main().innerText().catch(() => '');
          const url = page.url();
          if (/view=result/.test(url) && /任务摘要/.test(body)) break;
          if (/分析失败/.test(body) && !/view=result/.test(url)) {
            throw new Error('ENV-SUPPLY-ANALYSIS-FAIL-001');
          }
          await page.waitForTimeout(1200);
        }
        if (!(await isSuccessResult())) throw new Error('ENV-SUPPLY-ASYNC-NO-SUCCESS-001');
        return entName;
      };
      const openViaRestore = async () => {
        await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        if (await isSuccessResult()) {
          const t = await main().innerText();
          const m = t.match(/分析对象[：:]\s*([^\n]+)/);
          if (m) {
            const firstEnt = m[1].split(/[、,，]/)[0].trim();
            await page.evaluate((name) => { globalThis.__FUNC_02294_ENT__ = name; }, firstEnt);
            return firstEnt;
          }
        }
        await openRecentTab();
        const restore = page.getByRole('button', { name: '恢复结果' });
        if (!(await restore.count())) return null;
        const btn = restore.first();
        const row = btn.locator('xpath=ancestor::tr[1]');
        let entHint = '';
        if (await row.count()) {
          entHint = (await row.innerText()).replace(/\s+/g, ' ').trim();
        }
        await btn.click({ timeout: 15000 });
        await page.waitForTimeout(1500);
        if (!(await isSuccessResult())) throw new Error('ENV-SUPPLY-RESTORE-001');
        const summaryLine = ((await main().innerText()).match(/分析对象[：:]\s*([^\n]+)/) || [])[1] || '';
        const ref = summaryLine.split(/[、,，]/)[0].trim() || entHint.split(/\s+/).find((w) => w.includes('公司') || w.length > 4) || entHint.slice(0, 24);
        if (!ref) throw new Error('ENV-SUPPLY-ENT-REF-001');
        await page.evaluate((name) => { globalThis.__FUNC_02294_ENT__ = name; }, ref);
        return ref;
      };
      let entRef = await openViaRestore();
      if (!entRef) entRef = await startViaBasket();
      await expect(page.getByText('任务摘要').first()).toBeVisible({ timeout: 8000 });
      const entName = await page.evaluate(() => globalThis.__FUNC_02294_ENT__ || '');
      if (!entName) throw new Error('缺少发起企业名上下文');
      const t = await main().innerText();
      const m = t.match(/分析对象[：:]\s*([^\n]+)/);
      if (!m) throw new Error('任务摘要未见分析对象行');
      if (!m[1].includes(entName) && !entName.includes(m[1].split(/[、,，]/)[0].trim())) {
        throw new Error('分析对象与发起企业不一致: 摘要=' + m[1] + ' 发起=' + entName);
      }
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 catalog_path /enterprise/risk?workspace=supply-chain&tab=supply-chain。前置=成功结果（已在结果页则直读；否则最近分析「恢复结果」或对比篮 1 家发起）。步骤=阅读任务摘要。机检=含「分析对象」行且企业名与发起时一致。无已完成→走篮发起；篮空→ENV-SUPPLY-BASKET-EMPTY-001；120s 无结果→ENV-SUPPLY-ASYNC-NO-SUCCESS-001。登录与关评审由 runner 前置。B 档零 allow_skip。
