id: FUNC-02317
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02317
priority: P1
title: 新增企业加入对比篮后进入篮内
story: US-ENT-RISK-OBJECT
entry_id: ent-supply
tier: B
preconditions:
  - 已打开「选择分析企业」（assert 自含打开浮层）
locators:
  overlay_title: 选择分析企业
  add_btn: button「新增」
  add_modal: .arco-modal-title「新增企业」
  join_basket: button「加入对比篮」
  row_remove_basket: button「移出对比篮」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 打开选择分析企业→新增→加入对比篮；提示、篮内名单与行按钮态在 expect
expect:
  - note: 1、提示已加入该企业
    assert: |-
      const route = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const toUrl = (p) => (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') + (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const pickerRoot = () => page.locator('.system-compare-panel:visible').last();
      const listBasketEnterpriseNames = async (scope) => {
        const names = [];
        const basketSection = scope.locator('[data-testid="compare-basket-list"], .ent-compare-basket-list, .compare-basket-enterprise-list').first();
        const useScope = (await basketSection.count()) ? basketSection : scope;
        const cards = useScope.locator('.ent-compare-item-card');
        const cardN = await cards.count();
        for (let i = 0; i < cardN; i++) {
          const card = cards.nth(i);
          const nameEl = card.locator('.ent-compare-item-card__name');
          const name = (await nameEl.count())
            ? (await nameEl.first().innerText()).trim()
            : (await card.innerText()).split('\n')[0].trim();
          if (name) names.push(name);
        }
        if (names.length) return names;
        const sels = useScope.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
        return names;
      };
      const openPicker = async () => {
        const main = page.locator('main');
        const emptyCta = main.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        const adjustBtn = main.getByRole('button', { name: '返回对比篮调整对象', exact: true });
        const pickBtn = main.getByRole('button', { name: '选择分析企业', exact: true });
        if (await adjustBtn.count() && (await adjustBtn.first().isVisible().catch(() => false))) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await pickBtn.count() && (await pickBtn.first().isVisible().catch(() => false))) {
          await pickBtn.first().click({ timeout: 8000 });
        } else if (await emptyCta.count()) {
          await emptyCta.first().click({ timeout: 8000 });
        } else {
          throw new Error('未找到打开选择分析企业入口');
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await closeBasket();
      await openPicker();
      const panel = pickerRoot();
      await expect(panel).toBeVisible({ timeout: 8000 });
      const beforeBasket = await listBasketEnterpriseNames(panel);
      await page.evaluate((names) => {
        window.__gkxFunc02317 = { before: names };
      }, beforeBasket);
      const workspace = panel.locator('[data-testid="compare-basket-workspace"]');
      const addBtn = (await workspace.count())
        ? workspace.getByRole('button', { name: '新增', exact: true })
        : panel.getByRole('button', { name: '新增', exact: true });
      await expect(addBtn.first()).toBeVisible({ timeout: 8000 });
      await addBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const modalRoot = page.locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible').filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) }).last();
      await expect(modalRoot).toBeVisible({ timeout: 15000 });
      await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
      const loadFail = modalRoot.getByText('名单读取失败', { exact: false });
      if (await loadFail.count() && (await loadFail.first().isVisible().catch(() => false))) {
        throw new Error('新增企业推荐接口失败（名单读取失败）');
      }
      const findJoinButtons = () => modalRoot.getByRole('button', { name: '加入对比篮', exact: true });
      const refreshJoinList = async () => {
        for (const kw of ['股份', '科技', '有限', '深圳']) {
          const search = modalRoot.getByPlaceholder('输入企业名称');
          if (!(await search.count())) break;
          await search.click({ timeout: 5000 }).catch(() => {});
          await search.fill('');
          await search.pressSequentially(kw, { delay: 40 });
          await page.waitForTimeout(1300);
          await modalRoot.locator('.arco-spin').waitFor({ state: 'hidden', timeout: 25000 }).catch(() => {});
          if (await findJoinButtons().count()) return;
        }
      };
      if (!(await findJoinButtons().count())) {
        await refreshJoinList();
      }
      let joinBtns = findJoinButtons();
      if (!(await joinBtns.count())) {
        throw new Error('ENV-SUPPLY-ADD-MODAL-NO-JOIN-001：新增企业弹层无「加入对比篮」行（推荐名单可能已在篮内且搜索无新结果）');
      }
      await expect(joinBtns.first()).toBeVisible({ timeout: 15000 });
      let targetName = '';
      const joinN = await joinBtns.count();
      for (let i = 0; i < joinN; i++) {
        const btn = joinBtns.nth(i);
        const row = btn.locator('xpath=ancestor::tr[1]');
        const nm = ((await row.locator('td').first().innerText()) || '').trim();
        if (!nm) continue;
        const alreadyIn = beforeBasket.some((b) => b.includes(nm) || nm.includes(b));
        if (!alreadyIn) {
          targetName = nm;
          await btn.click({ timeout: 8000 });
          break;
        }
      }
      if (!targetName) {
        const firstJoin = joinBtns.first();
        const row = firstJoin.locator('xpath=ancestor::tr[1]');
        targetName = ((await row.locator('td').first().innerText()) || '').trim();
        if (!targetName) throw new Error('无法读取待加入企业名称');
        await firstJoin.click({ timeout: 8000 });
      }
      await page.waitForTimeout(500);
      await page.evaluate(({ name, before }) => {
        window.__gkxFunc02317 = { ...(window.__gkxFunc02317 || {}), target: name, before };
      }, { name: targetName, before: beforeBasket });
      const msgLoc = page.locator('.arco-message-list .arco-message-content, .arco-message-content').filter({ hasText: /已加入/ });
      await msgLoc.first().waitFor({ state: 'visible', timeout: 8000 }).catch(() => {});
      const msgVisible = await msgLoc.first().isVisible().catch(() => false);
      if (!msgVisible) {
        const rowCheck = modalRoot.locator('.arco-table-tr').filter({ hasText: targetName });
        const removeBtn = rowCheck.getByRole('button', { name: '移出对比篮', exact: true }).first();
        if (!(await removeBtn.isVisible().catch(() => false))) {
          throw new Error('未见「已加入」提示且行内未变为「移出对比篮」：' + targetName);
        }
      } else if (targetName) {
        const msgText = (await msgLoc.first().innerText().catch(() => '')) || '';
        if (!msgText.includes(targetName) && !msgText.includes('已加入')) {
          throw new Error('提示文案异常：' + msgText.slice(0, 80));
        }
      }
  - note: 2、该企业出现在篮内企业
    assert: |-
      const targetName = await page.evaluate(() => window.__gkxFunc02317?.target || '');
      if (!targetName) throw new Error('前置：未完成加入对比篮');
      const pickerRoot = () => page.locator('.system-compare-panel:visible').last();
      const panel = pickerRoot();
      await expect(panel).toBeVisible({ timeout: 8000 });
      const names = [];
      const cards = panel.locator('.ent-compare-item-card');
      const cardN = await cards.count();
      for (let i = 0; i < cardN; i++) {
        const card = cards.nth(i);
        const nameEl = card.locator('.ent-compare-item-card__name');
        const name = (await nameEl.count())
          ? (await nameEl.first().innerText()).trim()
          : (await card.innerText()).split('\n')[0].trim();
        if (name) names.push(name);
      }
      if (!names.length) {
        const sels = panel.locator('[aria-label^="选择 "]');
        const selN = await sels.count();
        for (let i = 0; i < selN; i++) {
          const aria = (await sels.nth(i).getAttribute('aria-label')) || '';
          const m = aria.match(/^选择\s+(.+)$/);
          if (m && m[1]) names.push(m[1].trim());
        }
      }
      const found = names.some((b) => b.includes(targetName) || targetName.includes(b));
      if (!found) {
        const body = await panel.innerText().catch(() => '');
        if (!body.includes(targetName)) {
          throw new Error('篮内企业列表未见：' + targetName + '；篮内=[' + names.join(' | ') + ']');
        }
      }
  - note: 3、该行按钮变为「移出对比篮」
    assert: |-
      const targetName = await page.evaluate(() => window.__gkxFunc02317?.target || '');
      if (!targetName) throw new Error('前置：未完成加入对比篮');
      const modalRoot = page.locator('[data-testid="compare-basket-add-modal"], .arco-modal:visible').filter({ has: page.locator('.arco-modal-title', { hasText: '新增企业' }) }).last();
      if (!(await modalRoot.isVisible().catch(() => false))) {
        const panel = page.locator('.system-compare-panel:visible').last();
        const addBtn = panel.getByRole('button', { name: '新增', exact: true });
        if (await addBtn.count()) {
          await addBtn.first().click({ timeout: 8000 });
          await page.waitForTimeout(500);
        }
      }
      await expect(modalRoot).toBeVisible({ timeout: 10000 });
      const rowAfter = modalRoot.locator('.arco-table-tr').filter({ hasText: targetName });
      await expect(rowAfter.getByRole('button', { name: '移出对比篮', exact: true }).first()).toBeVisible({ timeout: 8000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/risk + workspace=supply-chain&tab=supply-chain。步骤=打开「选择分析企业」→「新增」→CompareBasketAddModal 行内「加入对比篮」（对齐 KEYDOM 01724 / EVAL 02004）。优先选篮内尚未存在的企业行。Message「已加入」含企业名；篮内名单与弹层行「移出对比篮」互证。推荐名单失败→接口错误文案。登录与关评审由 runner 前置。B 档零 allow_skip。
