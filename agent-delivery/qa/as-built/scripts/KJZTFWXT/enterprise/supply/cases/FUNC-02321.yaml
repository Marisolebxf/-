id: FUNC-02321
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02321
priority: P1
tier: B
title: 去掉一枚对象标签后预检对象有效计数减少
entry_id: ent-supply
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 同册打开选择窗、篮内勾选 2 家确定回填，再去掉 1 枚对象 tag
expect:
  - note: 1、对象区只剩另一家
    assert: |-
      const route = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const toUrl = (p) =>
        (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892') +
        (p.startsWith('/') ? p : '/' + p);
      const main = () => page.locator('main.content-shell-layout, main').first();
      const parseBasketCount = (text) => {
        const m = text.match(/来自对比篮\s*[·•]\s*(\d+)\s*家/);
        return m ? parseInt(m[1], 10) : null;
      };
      const parseObjectValid = (text) => {
        const m = text.match(/对象有效[：:]\s*(\d+)\s*\/\s*(\d+)/);
        return m ? { ok: parseInt(m[1], 10), total: parseInt(m[2], 10) } : null;
      };
      const objectArea = () =>
        main()
          .locator('section, div')
          .filter({ hasText: '分析对象' })
          .filter({ hasText: /来自对比篮/ })
          .first();
      const listObjectEnterpriseLines = async () => {
        const area = objectArea();
        const scope = (await area.count()) ? area : main();
        const t = (await scope.innerText().catch(() => '')).split('\n').map((s) => s.trim()).filter(Boolean);
        const out = [];
        for (const line of t) {
          if (/来自对比篮|分析对象|返回对比篮|移除|Close/.test(line)) continue;
          if (/公司|集团|有限|股份|科技/.test(line)) out.push(line);
        }
        return [...new Set(out)];
      };
      const pickerRoot = () =>
        page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const dismissNewEnterpriseOverlay = async () => {
        const overlay = page.getByText('新增企业', { exact: true });
        if (!(await overlay.first().isVisible().catch(() => false))) return;
        const cancel = page.getByRole('button', { name: '取消', exact: true }).last();
        if (await cancel.isVisible().catch(() => false)) {
          await cancel.click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(400);
        }
      };
      const openPicker = async () => {
        if (await page.getByText('选择分析企业').first().isVisible().catch(() => false)) return;
        const m = main();
        const emptyCta = m.getByRole('button', { name: '前往对比篮选择企业', exact: true });
        await emptyCta.click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 10000 });
      };
      const addOneViaNewTab = async (panel) => {
        await dismissNewEnterpriseOverlay();
        await panel.getByRole('button', { name: '新增', exact: true }).first().click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const join = page.getByRole('button', { name: '加入对比篮', exact: true }).first();
        await expect(join).toBeVisible({ timeout: 10000 });
        await join.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await dismissNewEnterpriseOverlay();
      };
      const ensureTwoOnConfig = async () => {
        let body = await main().innerText().catch(() => '');
        let cnt = parseBasketCount(body);
        const valid = parseObjectValid(body);
        if (cnt === 2 && valid && valid.ok === 2 && valid.total === 2) return;
        await openPicker();
        let panel = pickerRoot();
        await expect(panel).toBeVisible({ timeout: 10000 });
        await dismissNewEnterpriseOverlay();
        const basketTab = panel
          .getByRole('tab', { name: '篮内企业' })
          .or(panel.getByText('篮内企业', { exact: true }));
        if (await basketTab.count()) {
          await basketTab.first().click({ timeout: 5000 }).catch(() => {});
          await page.waitForTimeout(500);
        }
        panel = pickerRoot();
        let sels = panel.locator('[aria-label^="选择 "]');
        let selN = await sels.count();
        while (selN < 2) {
          await addOneViaNewTab(panel);
          panel = pickerRoot();
          sels = panel.locator('[aria-label^="选择 "]');
          selN = await sels.count();
          if (selN < 2) throw new Error('篮内企业不足 2 家，当前 ' + selN);
        }
        const selectAll = panel.getByRole('button', { name: '全选当前筛选结果', exact: true });
        await selectAll.click({ timeout: 8000 });
        await page.waitForTimeout(400);
        const confirm = panel.getByRole('button', { name: '确定', exact: true });
        await expect(confirm.first()).toBeEnabled({ timeout: 8000 });
        await confirm.first().click({ timeout: 8000 });
        await page.waitForTimeout(1200);
        await dismissNewEnterpriseOverlay();
        body = await main().innerText().catch(() => '');
        cnt = parseBasketCount(body);
        if (cnt !== 2) throw new Error('回填后对象区应为 2 家，当前 ' + (cnt ?? '无文案'));
        const v2 = parseObjectValid(body);
        if (!v2 || v2.ok !== 2 || v2.total !== 2) {
          throw new Error('回填后预检对象有效应为 2/2，当前 ' + (v2 ? v2.ok + '/' + v2.total : '无文案'));
        }
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await ensureTwoOnConfig();
      const beforeNames = await listObjectEnterpriseLines();
      if (beforeNames.length < 2) {
        throw new Error('对象区应显示 2 家企业名，解析到 ' + beforeNames.length);
      }
      const area = objectArea();
      const scope = (await area.count()) ? area : main();
      const tagCloses = scope.locator('.arco-tag-close-btn');
      if ((await tagCloses.count()) < 1) throw new Error('对象区未见可关闭的对象 tag');
      const removedName = beforeNames[0];
      await tagCloses.first().click({ timeout: 8000 });
      await page.waitForTimeout(700);
      const afterText = await main().innerText().catch(() => '');
      const afterCnt = parseBasketCount(afterText);
      if (afterCnt !== 1) throw new Error('去掉 tag 后「来自对比篮」应为 1 家，当前 ' + (afterCnt ?? '无文案'));
      if (afterText.includes(removedName)) {
        throw new Error('被去掉的企业仍在对象区：' + removedName);
      }
      const afterNames = await listObjectEnterpriseLines();
      if (afterNames.length !== 1) {
        throw new Error('对象区应剩 1 家，解析到 ' + afterNames.length);
      }
  - note: 2、预检对象有效计数由 2 变为 1
    assert: |-
      const main = () => page.locator('main.content-shell-layout, main').first();
      const t = await main().innerText().catch(() => '');
      const m = t.match(/对象有效[：:]\s*(\d+)\s*\/\s*(\d+)/);
      if (!m) throw new Error('预检区未见「对象有效」计数');
      const ok = parseInt(m[1], 10);
      const total = parseInt(m[2], 10);
      if (ok !== 1 || total !== 1) {
        throw new Error('预检对象有效应为 1/1，当前 ' + ok + '/' + total);
      }
on_fail: 截图 + 抄 X-Trace-Id
