id: FUNC-02299
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02299
priority: P0
title: 结构列表四组分组与空态文案
story: US-ENT-RISK-SUPPLY
entry_id: ent-supply
tier: A
preconditions:
  - 已打开一条成功结果（assert 自含最近分析恢复）
locators:
  restore: button「恢复结果」
  tab_structure: tab「结构列表」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 最近分析恢复→点结构列表→读四组结构
expect:
  - note: 1、分组为供应商、客户、合作伙伴、企业关系
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && await close.first().isVisible().catch(() => false)) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await dismissBasket();
      await openRecentTab();
      const restore = page.getByRole('button', { name: '恢复结果' });
      if (!(await restore.count())) {
        throw new Error('环境闸门 ENV-SUPPLY-NO-COMPLETED-001：最近分析无「恢复结果」已完成任务');
      }
      await restore.first().click({ timeout: 15000 });
      await expect(page).toHaveURL(/view=result/, { timeout: 25000 });
      await expect(page.getByText('供应链图谱').first()).toBeVisible({ timeout: 25000 });
      await dismissBasket();
      const structTab = page.locator('main .arco-radio-button, main [role=tab], main button').filter({ hasText: /^结构列表$/ }).first();
      await structTab.click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const list = page.locator('[aria-label="供应链结构列表"]');
      await expect(list).toBeVisible({ timeout: 12000 });
      const listText = await list.innerText().catch(() => '');
      for (const g of ['供应商', '客户', '合作伙伴', '企业关系']) {
        if (!listText.includes(g)) throw new Error('结构列表缺分组标题：' + g);
      }
      const checked = page.locator('.arco-radio-button.arco-radio-checked').filter({ hasText: /^结构列表$/ });
      if (await checked.count()) {
        await expect(checked.first()).toBeVisible({ timeout: 5000 });
      }
      globalThis.__func02299_list = list;
      globalThis.__func02299_ready = true;
  - note: 2、没有对象的分组给出暂无文案（空态为「当前中心暂无{分组名}」）
    assert: |-
      if (!globalThis.__func02299_ready) throw new Error('前置：未进入结构列表');
      const list = globalThis.__func02299_list || page.locator('[aria-label="供应链结构列表"]');
      for (const label of ['供应商', '客户', '合作伙伴']) {
        const title = list.locator('.industry-topic-section-title').filter({ hasText: label }).first();
        await expect(title).toBeVisible({ timeout: 8000 });
        const small = await title.locator('small').innerText().catch(() => '');
        const n = Number((small.match(/(\d+)/) || [])[1]);
        const section = title.locator('xpath=ancestor::section[1]');
        if (n === 0) {
          await expect(section.getByText('当前中心暂无' + label)).toBeVisible({ timeout: 8000 });
        } else {
          const nodes = section.locator('.industry-topic-structure-list__nodes button');
          if ((await nodes.count()) < 1) {
            throw new Error('分组「' + label + '」计数 ' + n + ' 但未见节点行');
          }
        }
      }
      const relTitle = list.locator('.industry-topic-section-title').filter({ hasText: '企业关系' }).first();
      await expect(relTitle).toBeVisible({ timeout: 8000 });
      const cb = await list.locator('input[type=checkbox]').count();
      if (cb > 0) throw new Error('结构列表不应含行勾选');
      const pag = await list.locator('.arco-pagination').count();
      if (pag > 0) throw new Error('结构列表不应分页');
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 testdata.route /enterprise/risk?workspace=supply-chain&tab=supply-chain。前置=最近分析「恢复结果」进成功结果。步骤=点「结构列表」。机检=aria 供应链结构列表内四组标题；0 家分组须「当前中心暂无{名}」；有数据分组须见节点 button；无 checkbox/分页。D4·2026-10-20 rewrite-FUNC-02299 svcz 2/2 expect 绿。无已完成→ENV-SUPPLY-NO-COMPLETED-001。登录与关评审由 runner 前置。A 档零 allow_skip。
