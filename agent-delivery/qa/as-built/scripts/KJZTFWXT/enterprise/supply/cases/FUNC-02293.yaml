id: FUNC-02293
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02293
priority: P0
title: 当天相同对象与关系范围再次开始打开已有结果且不新增任务
story: US-ENT-RISK-PROCESS
entry_id: ent-supply
tier: A
preconditions:
  - 同一对象与关系范围当天已有成功结果；已回到配置页（assert 自含首次成功→返回配置）
locators:
  start: button「开始分析」
  back_config: button「返回配置」
  recent_tab: tab「最近分析」
  same_day_hint: 已打开今天相同条件的风险分析结果
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 首次成功→返回配置→记最近分析条数→再次开始分析；三条预期在 expect
expect:
  - note: 1、打开该成功结果页；2、提示已打开今天相同条件的风险分析结果
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const isSuccessResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        if (/可视化分析过程|企业供应链关系分析生成中/.test(t) && !/任务摘要/.test(t)) return false;
        return (
          (await page.getByText('任务摘要').first().isVisible().catch(() => false)) &&
          (await page.getByText('供应链图谱').first().isVisible().catch(() => false))
        );
      };
      const ensureFilled = async () => {
        await dismissBasket();
        if (await main().getByText(/来自对比篮/).first().isVisible().catch(() => false)) return;
        await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const sels = page.locator('[aria-label^="选择 "]');
        if ((await sels.count()) < 1) throw new Error('ENV-SUPPLY-BASKET-001：对比篮无可选企业');
        await sels.nth(0).click();
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(2000);
        await dismissBasket();
        await expect(main().getByText(/来自对比篮/).first()).toBeVisible({ timeout: 10000 });
      };
      const waitSuccessAfterStart = async (rounds = 90) => {
        let last = '';
        for (let i = 0; i < rounds; i++) {
          await page.waitForTimeout(i < 4 ? 500 : 2000);
          last = await main().innerText().catch(() => '');
          if (await isSuccessResult()) return;
          if (/已打开今天相同条件的风险分析结果/.test(last)) {
            if (await isSuccessResult()) return;
          }
          const toast = page.locator('.arco-message, .arco-notification').filter({ hasText: /已打开今天相同条件的风险分析结果/ });
          if (await toast.count() && (await toast.first().isVisible().catch(() => false)) && (await isSuccessResult())) return;
          if (/分析失败|本次分析失败/.test(last) && !/可视化分析过程/.test(last)) {
            throw new Error('ENV-SUPPLY-ANALYSIS-FAIL-001：无法到达当天成功结果前置');
          }
        }
        if (/可视化分析过程|view=processing/.test(page.url() + last)) {
          throw new Error('ENV-SUPPLY-ASYNC-NO-SUCCESS-001：首次分析长期停留过程态');
        }
        throw new Error('首次分析未在超时内到达成功结果：' + last.slice(0, 220));
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const restoreCompletedIfNeeded = async () => {
        if (await isSuccessResult()) return true;
        await openRecentTab();
        const restore = page.getByRole('button', { name: '恢复结果' });
        if (!(await restore.count())) return false;
        for (let i = 0; i < Math.min(await restore.count(), 5); i++) {
          let row = restore.nth(i).locator('xpath=ancestor::tr[1]');
          if ((await row.count()) < 1) row = restore.nth(i).locator('xpath=ancestor::*[contains(@class,"arco-table-tr")][1]');
          const rt = (await row.count()) ? await row.innerText().catch(() => '') : '';
          if (!rt || !/已完成/.test(rt)) continue;
          await restore.nth(i).click({ timeout: 15000 });
          for (let j = 0; j < 24; j++) {
            await page.waitForTimeout(500);
            if (await isSuccessResult()) return true;
          }
        }
        return false;
      };
      const reachTodaySuccessOnce = async () => {
        if (await restoreCompletedIfNeeded()) return;
        await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1000);
        await ensureFilled();
        const start = main().getByRole('button', { name: '开始分析' }).first();
        await expect(start).toBeEnabled({ timeout: 8000 });
        await start.click({ timeout: 15000 });
        await waitSuccessAfterStart();
      };
      const backToConfig = async () => {
        const back = page.getByRole('button', { name: '返回配置' }).first();
        if (await back.isVisible().catch(() => false)) {
          await back.click({ timeout: 10000 });
          await page.waitForTimeout(1200);
        } else {
          await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
        }
        await dismissBasket();
        const t = await main().innerText().catch(() => '');
        if (!/来自对比篮/.test(t) && !/关系范围/.test(t)) {
          await ensureFilled();
        }
        await expect(main().getByRole('button', { name: '开始分析' }).first()).toBeVisible({ timeout: 10000 });
      };
      const countRiskRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await dismissBasket();
      await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await reachTodaySuccessOnce();
      const taskFirst =
        new URL(page.url()).searchParams.get('task_id') ||
        (await main().innerText().catch(() => '')).match(TID_RE)?.[0] ||
        '';
      if (!taskFirst) throw new Error('首次成功未见 RISK 任务标识');
      await backToConfig();
      await openRecentTab();
      const nBefore = await countRiskRows();
      await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await dismissBasket();
      await ensureFilled();
      const start2 = main().getByRole('button', { name: '开始分析' }).first();
      await expect(start2).toBeEnabled({ timeout: 20000 });
      await start2.click({ timeout: 15000 });
      let sawHint = false;
      let last = '';
      for (let i = 0; i < 20; i++) {
        await page.waitForTimeout(i === 0 ? 400 : 600);
        last = await main().innerText().catch(() => '');
        const toast = page.locator('.arco-message, .arco-notification').filter({ hasText: /已打开今天相同条件的风险分析结果/ });
        if (/已打开今天相同条件的风险分析结果/.test(last)) sawHint = true;
        if (await toast.count() && (await toast.first().isVisible().catch(() => false))) sawHint = true;
        if (sawHint && (await isSuccessResult())) break;
        if (await isSuccessResult() && sawHint) break;
      }
      globalThis.__func02293 = { taskFirst, nBefore, sawHint, lastBody: last };
      if (!sawHint) {
        await expect(page.getByText('已打开今天相同条件的风险分析结果').first()).toBeVisible({ timeout: 8000 });
      }
      await expect(page.getByText('任务摘要').first()).toBeVisible({ timeout: 15000 });
      await expect(page.getByText('供应链图谱').first()).toBeVisible({ timeout: 15000 });
      await expect(page).toHaveURL(/view=result/, { timeout: 10000 });
      const taskSecond =
        new URL(page.url()).searchParams.get('task_id') ||
        (await main().innerText().catch(() => '')).match(TID_RE)?.[0] ||
        '';
      if (taskFirst && taskSecond && taskFirst !== taskSecond) {
        throw new Error('同条件当天复用 task_id 不一致：' + taskFirst + ' vs ' + taskSecond);
      }
  - note: 3、最近分析条数不增加（用例步骤 2 打开最近分析）
    assert: |-
      const ctx = globalThis.__func02293;
      if (!ctx) throw new Error('前置：未完成二次开始分析');
      const main = () => page.locator('main.content-shell-layout, main').first();
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const countRiskRows = async () => {
        const body = await main().innerText().catch(() => '');
        const ids = body.match(TID_RE) || [];
        return new Set(ids).size;
      };
      await openRecentTab();
      await expect(page).toHaveURL(/view=history|最近分析/, { timeout: 10000 });
      const nAfter = await countRiskRows();
      if (nAfter > ctx.nBefore) {
        throw new Error('最近分析 RISK 条数增加：' + ctx.nBefore + ' -> ' + nAfter);
      }
      const body = await main().innerText().catch(() => '');
      if (ctx.taskFirst && !body.includes(ctx.taskFirst)) {
        throw new Error('最近分析列表未见原任务 ' + ctx.taskFirst);
      }
on_fail: 截图 + 抄 X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz entry-seed /enterprise/risk?workspace=supply-chain&tab=supply-chain。前置=当天同对象关系范围成功一次（最近分析恢复已完成或对比篮回填发起）。步骤=返回配置→记最近分析 RISK 去重条数→goto 配置页 ensureFilled→再次「开始分析」→开最近分析核对。预期=结果页+提示「已打开今天相同条件的风险分析结果」+条数不增+task_id 复用。与 02292「重新分析」、02289 过程窗分流。D4·2026-10-20 rewrite-FUNC-02293 svcz 2/2 expect 绿。无成功/异步不落成功→ ENV-SUPPLY-ASYNC-NO-SUCCESS-001；篮空→ ENV-SUPPLY-BASKET-001。登录与关评审由 runner 前置。A 档零 allow_skip。
