id: P1-05
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01054
priority: P1
title: 移除全部对象后回到空态提示且开始分析禁用
entry_id: ent-supply
preconditions:
- 已带入对象
expect:
- note: 对象区回到前往对比篮引导的空态提示
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); if (await sels.count() >= 2) await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2000); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) } }; for (let i = 0; i < 5; i++) { const rm = page.locator('main').getByRole('button', { name: '移除' }); if (!(await rm.count())) break; await rm.first().click(); await page.waitForTimeout(500) }; await expect(page.getByText(/请先在对比篮选择企业/).first()).toBeVisible({ timeout: 8000 })
- note: 「开始分析」回到禁用态
  assert: 'if (!(await page.getByRole(''button'', { name: ''开始分析'' }).isDisabled())) throw new Error(''清空后开始分析未禁用'')'
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无法回填对象时 Pass-N/A
as_built_note: 与 01034 空态互补（初始空态 / 移除回退空态）。
tier: B
