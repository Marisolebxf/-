id: FUNC-02315
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02315
priority: P1
title: 全部企业类型下拉有七个选项
story: US-ENT-RISK-OBJECT
entry_id: ent-supply
tier: B
preconditions:
  - 已打开「选择分析企业」（assert 自含打开浮层）
locators:
  overlay_title: 选择分析企业
  type_filter: placeholder「全部企业类型」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 打开选择分析企业后展开「全部企业类型」；选项个数与附录 A 名称在 expect
expect:
  - note: 1、选项共 7 个（清单见附录 A）
    assert: |-
      const route = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const toUrl = (p) => (typeof baseUrl === 'string' ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz') + (p.startsWith('/') ? p : '/' + p);
      const closeBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count()) {
          const vis = await close.first().isVisible().catch(() => false);
          if (vis) {
            await close.first().click({ timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(300);
          }
        }
      };
      const visiblePanel = () => page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const dockBtn = page.locator('button[aria-label*="打开对比篮"]').first();
      const basketEntCount = async () => {
        if (!(await dockBtn.count())) return 0;
        const dockLabel = (await dockBtn.getAttribute('aria-label')) || '';
        const entM = dockLabel.match(/企业\s*(\d+)\s*\/\s*50/);
        return entM ? parseInt(entM[1], 10) : 0;
      };
      const seedBasketFromSearchPage = async (min) => {
        const searchInput = page
          .getByRole('textbox', { name: /输入企业名、产业、资质、区域或专利关键词/ })
          .or(page.getByPlaceholder(/企业名|产业|资质/))
          .first();
        if (await searchInput.isVisible().catch(() => false)) {
          await searchInput.fill('华为');
          const searchBtn = page.getByRole('button', { name: '搜索', exact: true }).first();
          if (await searchBtn.isVisible().catch(() => false)) {
            await searchBtn.click({ timeout: 8000 });
            await page.waitForTimeout(1500);
          }
        }
        const addBtns = page.getByRole('button', { name: '加入对比篮', exact: true });
        let n = await basketEntCount();
        for (let round = 0; round < 5 && n < min; round++) {
          const btnN = await addBtns.count();
          let clicked = 0;
          for (let i = 0; i < btnN && n < min; i++) {
            const btn = addBtns.nth(i);
            if (!(await btn.isVisible().catch(() => false))) continue;
            await btn.click({ timeout: 8000 });
            await page.waitForTimeout(700);
            clicked++;
            n = await basketEntCount();
          }
          if (!clicked) break;
        }
        return (await basketEntCount()) >= min;
      };
      const ensureBasketEnterprises = async (min) => {
        if ((await basketEntCount()) >= min) return;
        for (const sp of ['/enterprise/enterprise-search', '/development/search']) {
          await page.goto(toUrl(sp), { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          await closeBasket();
          if (await seedBasketFromSearchPage(min)) return;
        }
        throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      };
      const openPicker = async () => {
        const adjustBtn = page.getByRole('button', { name: '返回对比篮调整对象' });
        const pickBtn = page.getByRole('button', { name: '选择分析企业' });
        const emptyCta = page.getByRole('button', { name: '前往对比篮选择企业' });
        if (await adjustBtn.count() && (await adjustBtn.first().isVisible().catch(() => false))) {
          await adjustBtn.first().click({ timeout: 8000 });
        } else if (await pickBtn.count() && (await pickBtn.first().isVisible().catch(() => false))) {
          await pickBtn.first().click({ timeout: 8000 });
        } else {
          await expect(emptyCta.first()).toBeVisible({ timeout: 8000 });
          await emptyCta.first().click({ timeout: 8000 });
        }
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
      };
      const openPickerDeepLink = async () => {
        const pickerQs =
          'open_compare_basket=1&compare_basket_mode=picker&compare_object_type=enterprise&compare_picker_min=1&compare_picker_max=50';
        await page.goto(toUrl(`${route}&${pickerQs}`), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(1200);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 10000 });
      };
      const pickerRoot = () =>
        page
          .locator('.system-compare-panel:visible, .arco-modal:visible, .arco-drawer:visible')
          .filter({ hasText: '选择分析企业' })
          .last();
      const collectOptionLabels = async (root) => {
        let opts = root.locator('label.arco-select-option-checkbox:visible');
        if (!(await opts.count())) {
          opts = page.locator('.arco-select-popup:visible label.arco-select-option-checkbox, .arco-trigger-popup:visible label.arco-select-option-checkbox');
        }
        if (!(await opts.count())) {
          opts = page.locator('.arco-select-popup:visible .arco-select-option, .arco-trigger-popup:visible .arco-select-option');
        }
        const labels = [];
        for (let i = 0, c = await opts.count(); i < c; i++) {
          const t = ((await opts.nth(i).innerText()) || '').replace(/\s+/g, ' ').trim();
          if (t && !/^全部/.test(t)) labels.push(t);
        }
        return labels;
      };
      const readTypeLabels = async () => {
        const panel = pickerRoot();
        await expect(panel).toBeVisible({ timeout: 8000 });
        const workspace = panel.locator('[data-testid="compare-basket-workspace"]').first();
        const scope = (await workspace.count()) ? workspace : panel;
        const typePh = scope.getByPlaceholder('全部企业类型');
        const typeView = scope.locator('.sci-arco-select .arco-select-view, .arco-select-view').filter({ hasText: /全部企业类型/ }).first();
        const typeSuffix = typeView.locator('.arco-select-suffix, .arco-select-view-suffix').first();
        await expect(typePh.or(typeView).first()).toBeVisible({ timeout: 10000 });
        await page.keyboard.press('Escape').catch(() => {});
        await page.waitForTimeout(250);
        const tryOpen = async () => {
          for (const target of [typeSuffix, typeView, typePh, scope.locator('.sci-arco-select').first()]) {
            if (!(await target.count()) || !(await target.first().isVisible().catch(() => false))) continue;
            await target.first().scrollIntoViewIfNeeded().catch(() => {});
            try {
              await target.first().click({ timeout: 5000 });
              await page.waitForTimeout(650);
              const labels = await collectOptionLabels(scope);
              if (labels.length >= 7) return labels;
            } catch {
              /* next target */
            }
          }
          try {
            await typeView.click({ force: true, timeout: 5000 });
            await page.waitForTimeout(650);
          } catch {}
          try {
            await typePh.focus();
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(500);
          } catch {}
          return collectOptionLabels(scope);
        };
        let labels = await tryOpen();
        if (labels.length < 7) {
          await page.keyboard.press('Escape').catch(() => {});
          await page.waitForTimeout(200);
          labels = await tryOpen();
        }
        if (labels.length < 7) {
          throw new Error('D4·无头下「全部企业类型」下拉未能展开或选项不足 7：实见 ' + labels.length + (labels.length ? '（' + labels.join('、') + '）' : ''));
        }
        return labels;
      };
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      if (/enterprise_codes/.test(page.url())) {
        await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
      }
      await closeBasket();
      await ensureBasketEnterprises(1);
      await page.goto(toUrl(route), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await closeBasket();
      await openPicker();
      let panel = visiblePanel();
      if (!(await panel.count()) || !(await panel.isVisible().catch(() => false))) {
        await openPickerDeepLink();
        panel = visiblePanel();
      }
      await expect(panel).toBeVisible({ timeout: 8000 });
      const basketTab = panel.getByRole('tab', { name: '篮内企业' }).or(panel.getByText('篮内企业', { exact: true }));
      if (await basketTab.count() && (await basketTab.first().isVisible().catch(() => false))) {
        await basketTab.first().click({ timeout: 5000 }).catch(() => {});
        await page.waitForTimeout(400);
      }
      const selsBefore = panel.locator('[aria-label^="选择 "]');
      if ((await selsBefore.count()) < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
      await expect(panel.getByPlaceholder('全部企业类型').or(panel.locator('.arco-select-view').filter({ hasText: /全部企业类型/ })).first()).toBeVisible({ timeout: 8000 });
      globalThis.__func02315_labels = await readTypeLabels();
      if (globalThis.__func02315_labels.length !== 7) {
        throw new Error(`企业类型选项应为 7 个，实际 ${globalThis.__func02315_labels.length}：${globalThis.__func02315_labels.join('、')}`);
      }
  - note: 2、名称与附录 A 一致（外资企业、高新技术企业、小微企业、上市企业、专精特新、小巨人、链主龙头）
    assert: |-
      const APPENDIX_A = ['外资企业', '高新技术企业', '小微企业', '上市企业', '专精特新', '小巨人', '链主龙头'];
      const labels = globalThis.__func02315_labels;
      if (!labels || labels.length !== 7) {
        throw new Error('前置：类型选项未就绪');
      }
      for (let i = 0; i < APPENDIX_A.length; i++) {
        if (labels[i] !== APPENDIX_A[i]) {
          throw new Error(`第 ${i + 1} 项应为附录 A「${APPENDIX_A[i]}」，实际「${labels[i] || '(无)'}」；全套：${labels.join('、')}`);
        }
      }
      await page.keyboard.press('Escape').catch(() => {});
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 entry-seed catalog_path /enterprise/risk + workspace=supply-chain&tab=supply-chain。前置=篮内≥1 企业并打开「选择分析企业」浮层（对齐 FUNC-02314）。步骤=面板内展开 placeholder「全部企业类型」的 .arco-select-view。机检=选项 7 个且顺序与用例附录 A 全称一致（scout-overlay 实勘同口径）。对比篮空→ENV-SUPPLY-BASKET-EMPTY-001。登录与关评审由 runner 前置。B 档零 allow_skip。
