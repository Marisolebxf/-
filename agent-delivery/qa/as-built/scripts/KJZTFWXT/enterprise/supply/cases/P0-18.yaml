id: P0-18
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01049
priority: P0
title: 最近分析任务列表含标识类型对象时间与状态
entry_id: ent-supply
preconditions:
  - env-gate overall=pass
  - 最近分析有历史任务（history_completed；可「恢复结果」）
locators:
  tab_recent: tab/button「最近分析」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: click
    target: 最近分析
expect:
  - note: 列表含任务标识、分析类型、对象、时间与状态字段
    assert: |-
      await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count()) { const vis = await close.first().isVisible().catch(() => false); if (vis) { await close.first().click(); await page.waitForTimeout(300) } }; await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1200); await expect(page).toHaveURL(/view=history/); const t = await page.locator('main.content-shell-layout, main').first().innerText(); for (const c of ['任务名称','分析类型','企业摘要','创建时间','状态','操作']) { if (!t.includes(c)) throw new Error('最近分析缺列: ' + c) }
  - note: 供应链类型任务可辨识
    assert: |-
      const t = await page.locator('main.content-shell-layout, main').first().innerText(); if (!/RISK-\d{8}-\d{3}/.test(t)) throw new Error('未见 RISK 任务标识'); if (!t.includes('企业供应链关系分析')) throw new Error('未见分析类型「企业供应链关系分析」'); await expect(page.getByRole('button', { name: /恢复结果|继续查看/ }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: 实勘列头=任务名称/分析类型/企业摘要/创建时间/状态/操作；类型列「企业供应链关系分析」；失败行「继续查看」、已完成「恢复结果」。env-gate overall=pass 且 history_completed。A 档零 allow_skip。list 相对父键 2 空格缩进。
tier: A
