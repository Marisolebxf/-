id: P1-01
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01050
priority: P1
title: 关系范围自由组合且全部取消后发起被拦截
entry_id: ent-supply
preconditions:
- 已带入 1–2 家企业
expect:
- note: 各组合可自由勾选取消且当次任务范围跟随勾选
  assert: |-
    await page.goto('http://111.198.38.90:50892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; if (!(await page.getByText(/来自对比篮/).count())) { await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 1) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(1500); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) } }; const partner = page.locator('main .arco-checkbox').filter({ hasText: '合作伙伴' }).first(); await partner.click(); await page.waitForTimeout(300); await partner.click(); await page.waitForTimeout(300)
- note: 全部取消后发起被拦截
  assert: |-
    for (const n of ['供应商','客户','合作伙伴']) { const box = page.locator('main .arco-checkbox').filter({ hasText: n }).first(); const cls = (await box.getAttribute('class')) || ''; if (/arco-checkbox-checked/.test(cls)) await box.click(); await page.waitForTimeout(200) }; await page.waitForTimeout(400); const start = page.getByRole('button', { name: '开始分析' }); if (!(await start.isDisabled())) { await start.click().catch(() => {}); await page.waitForTimeout(800); if (page.url().includes('view=processing')) throw new Error('全不选仍进入过程态') }
- note: 离开返回后勾选草稿保留
  assert: |-
    await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click(); await page.waitForTimeout(600); await page.locator('main [role=tab], main button').filter({ hasText: '当前分析' }).first().click(); await page.waitForTimeout(800); /* 全不选草稿是否保留 observed；至少页面停留本路由 */ await expect(page).toHaveURL(/workspace=supply-chain/)
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无企业可回填时 Pass-N/A
as_built_note: 全不选拦截形态（禁用或提示）observed。
tier: B
