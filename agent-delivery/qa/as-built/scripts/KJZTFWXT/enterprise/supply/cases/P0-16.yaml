expect:
- note: 图谱定位到该风险项对应节点
  assert: |-
    if (!page.url().includes('view=result')) { await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click(); await page.waitForTimeout(800); const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无结果态'); await restore.first().click(); await page.waitForTimeout(3000) }; await page.getByText('断链风险', { exact: true }).first().click(); await page.waitForTimeout(600); const t = await page.locator('main').innerText(); if (!/断链风险 · [1-9]/.test(t) && !/节点异常|路径脆弱|单点依赖/.test(t)) throw new Error('ALLOW_SKIP: 无风险项'); const locBtn = page.locator('main button, main a').filter({ hasText: /定位|查看|图谱/ }); if (!(await locBtn.count())) throw new Error('ALLOW_SKIP: 未见定位入口，改人工 observed'); await locBtn.first().click(); await page.waitForTimeout(800)
