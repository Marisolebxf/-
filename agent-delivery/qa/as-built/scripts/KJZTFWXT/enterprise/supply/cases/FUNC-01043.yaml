id: FUNC-01043
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01043
priority: P0
tier: B
title: 主流程-下钻边界
entry_id: ent-supply
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk
  - action: evaluate
    note: 同册02306恢复结果→结构列表点节点直至末级「暂无下级关系」
expect:
  - note: 1、呈现「暂无下级关系」类末级提示
    assert: |-
      const shell = () => page.locator('.analysis-shell-root, .content-shell-layout').first();
      const main = () => page.locator('main').first();
      const recentTab = () =>
        shell().locator('button, [role=tab]').filter({ hasText: /^最近分析$/ }).first();
      await recentTab().click({ timeout: 15000 });
      await page.waitForTimeout(800);
      const restores = page.getByRole('button', { name: '恢复结果' });
      if ((await restores.count()) === 0) {
        throw new Error('blocked:修订 最近分析无已完成供应链任务可恢复');
      }
      await restores.first().click({ timeout: 15000 });
      await page.waitForURL(/view=result/, { timeout: 25000 }).catch(() => {});
      await page.waitForTimeout(2000);
      await expect(page.getByText('任务摘要').first()).toBeVisible({ timeout: 15000 });
      await main().getByText('结构列表', { exact: true }).first().click({ timeout: 10000 });
      await page.waitForTimeout(600);
      const panelBtn = () =>
        main().locator('div.border-t').getByRole('button').first();
      const isLeaf = async () => {
        const btn = panelBtn();
        if (!(await btn.count())) return false;
        return ((await btn.innerText()) || '').replace(/\s+/g, ' ').trim() === '暂无下级关系';
      };
      const nodeButtons = main().locator('section').getByRole('button').filter({ hasText: /有限公司/ });
      const total = await nodeButtons.count();
      let found = false;
      for (let j = 0; j < total; j++) {
        await nodeButtons.nth(j).click({ timeout: 10000 });
        await page.waitForTimeout(600);
        if (await isLeaf()) {
          found = true;
          break;
        }
        const drill = panelBtn();
        const dt = ((await drill.innerText().catch(() => '')) || '').trim();
        if (dt === '以此为中心下钻' && !(await drill.isDisabled().catch(() => true))) {
          await drill.click({ timeout: 8000 });
          await page.waitForTimeout(1500);
          if (await isLeaf()) {
            found = true;
            break;
          }
        }
      }
      if (!found) {
        throw new Error('blocked:修订 ENV-SUPPLY-NO-LEAF-NODE-001 可恢复任务未见叶节点「暂无下级关系」');
      }
      await expect(page.getByText('当前节点').first()).toBeVisible({ timeout: 8000 });
      await expect(panelBtn()).toHaveText('暂无下级关系', { timeout: 8000 });
on_fail: 截图 + 抄 X-Trace-Id
