id: P1-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01052
priority: P1
title: 风险项显示建议提前制定备份方案提示且无方案编辑入口
entry_id: ent-supply
preconditions:
- 结果态；断链风险有项
expect:
- note: 风险项显示「建议提前制定备份方案」提示
  assert: |-
    if (!page.url().includes('view=result')) { await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(800); await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click(); await page.waitForTimeout(800); const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无结果态'); await restore.first().click(); await page.waitForTimeout(3000) }; await page.getByText('断链风险', { exact: true }).first().click(); await page.waitForTimeout(600); await expect(page.getByText('建议提前制定备份方案').first()).toBeVisible({ timeout: 8000 })
- note: 提示仅出现在已标注潜在风险的风险项上
  assert: |-
    const t = await page.locator('main').innerText(); if (!/建议提前制定备份方案/.test(t)) throw new Error('未见备份方案提示'); if (!/(节点异常|路径脆弱|单点依赖)/.test(t)) throw new Error('提示出现时未见风险类型')
- note: 页面无备份方案编辑器或制定入口
  assert: const t = await page.locator('main').innerText(); if (/制定备份方案|备份方案编辑|编辑备份方案/.test(t)) throw new Error('出现备份方案编辑入口')
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无风险项时 Pass-N/A
as_built_note: 实勘风险项附带「建议提前制定备份方案。」句号文案。
tier: B
