id: FUNC-02318
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02318
priority: P1
tier: B
title: 选择分析企业浮层行上移除立即离开篮内
entry_id: ent-supply
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk
expect:
  - note: 1、无二次确认
    assert: |-
      const main = page.locator('main');
      const openPicker = async () => {
        const cta = main.getByRole('button', { name: '前往对比篮选择企业' });
        const adjust = main.getByRole('button', { name: '返回对比篮调整对象' });
        if (await adjust.isVisible().catch(() => false)) {
          await adjust.click({ timeout: 8000 });
        } else {
          await expect(cta).toBeVisible({ timeout: 10000 });
          await cta.click({ timeout: 8000 });
        }
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 10000 });
      };
      await openPicker();
      const panel = page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      await expect(panel).toBeVisible({ timeout: 8000 });
      const countInPanel = async () => {
        const txt = (await panel.innerText()).replace(/\s+/g, ' ');
        const m = txt.match(/企业\s*(\d+)\s*\/\s*50/);
        return m ? parseInt(m[1], 10) : 0;
      };
      if ((await countInPanel()) < 1) {
        await panel.getByRole('button', { name: '新增' }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const addBtn = page.getByRole('button', { name: '加入对比篮', exact: true }).first();
        await expect(addBtn).toBeVisible({ timeout: 10000 });
        await addBtn.click({ timeout: 8000 });
        await page.waitForTimeout(800);
        const basketTab = panel.getByRole('tab', { name: '篮内企业' }).or(panel.getByText('篮内企业', { exact: true }));
        if (await basketTab.first().isVisible().catch(() => false)) {
          await basketTab.first().click({ timeout: 5000 });
          await page.waitForTimeout(400);
        }
      }
      const before = await countInPanel();
      if (before < 1) throw new Error('篮内仍无企业，无法测移除');
      globalThis.__func02318_beforeCount = before;
      const removeBtn = panel.getByRole('button', { name: '移除', exact: true }).first();
      await expect(removeBtn).toBeVisible({ timeout: 8000 });
      await removeBtn.click({ timeout: 8000 });
      await page.waitForTimeout(500);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: /确认|清空对比篮/ });
      await expect(modal).toHaveCount(0);
      globalThis.__func02318_removed = true;
  - note: 2、该企业从篮内消失
    assert: |-
      if (!globalThis.__func02318_removed) throw new Error('未完成移除点击');
      const panel = page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      await expect(panel).toBeVisible({ timeout: 8000 });
      const before = globalThis.__func02318_beforeCount;
      if (before === 1) {
        await expect(panel.getByText('对比篮暂无企业').or(panel.getByText(/企业\s*0\s*\/\s*50/))).toBeVisible({ timeout: 8000 });
      } else {
        const afterCards = await panel.locator('.ent-compare-item-card').count();
        if (afterCards >= before) {
          throw new Error('移除后篮内卡片数未减少');
        }
      }
  - note: 3、企业计数减少
    assert: |-
      if (!globalThis.__func02318_removed) throw new Error('未完成移除点击');
      const before = globalThis.__func02318_beforeCount;
      const panel = page.locator('.system-compare-panel:visible').filter({ hasText: '选择分析企业' }).last();
      const txt = (await panel.innerText()).replace(/\s+/g, ' ');
      const m = txt.match(/企业\s*(\d+)\s*\/\s*50/);
      const after = m ? parseInt(m[1], 10) : null;
      if (after === null || after >= before) {
        throw new Error(`企业计数应减少（前 ${before} 后 ${after}）`);
      }
on_fail: 截图 + 抄 X-Trace-Id
