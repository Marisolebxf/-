id: P0-17
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01048
priority: P0
title: 从最近分析恢复已完成供应链任务且结果一致
entry_id: ent-supply
preconditions:
- 至少 1 条已完成供应链任务
steps:
- action: click
  target: 最近分析
- action: click
  target: 恢复结果
expect:
- note: 恢复后结果与直接查看结果一致
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1200); const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无已完成任务'); const before = await page.locator('main').innerText(); await restore.first().click(); await page.waitForTimeout(3500); await expect(page).toHaveURL(/view=result/); await expect(page.getByText('供应链图谱').first()).toBeVisible({ timeout: 10000 }); await expect(page.getByText('关键节点与断链风险').first()).toBeVisible({ timeout: 8000 })
- note: 恢复不新建任务且不覆盖旧任务快照
  assert: |-
    await expect(page).toHaveURL(/task_id=RISK-/); const t = await page.locator('main').innerText(); if (!/任务摘要|分析对象/.test(t)) throw new Error('恢复后未见任务摘要'); /* 列表条数不因恢复增减：切回最近分析核对 */ await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click(); await page.waitForTimeout(1000); await expect(page.getByText(/共 \d+ 条/).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无已完成任务时 Pass-N/A
as_built_note: 恢复入口文案「恢复结果」；失败任务为「继续查看」。
tier: B
