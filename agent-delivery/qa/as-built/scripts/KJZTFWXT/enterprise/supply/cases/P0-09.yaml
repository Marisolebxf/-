id: P0-09
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01036
priority: P0
title: 对比篮勾选企业后对象带入配置页
entry_id: ent-supply
preconditions:
- 对比篮至少 2 家企业
steps:
- action: goto
  target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
- action: click
  target: 前往对比篮选择企业
- action: evaluate
  note: 勾选 2 家点确定
expect:
- note: 未勾选时「发起分析」不可用且勾选后恢复
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 }); const ok = page.getByRole('button', { name: '确定' }); if (!(await ok.isDisabled())) { /* 可能残留勾选 */ await page.getByRole('button', { name: '取消选择' }).click().catch(() => {}); await page.waitForTimeout(300) }; if (!(await ok.isDisabled())) throw new Error('未勾选时确定未禁用'); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); await sels.nth(1).click(); await page.waitForTimeout(300); if (await ok.isDisabled()) throw new Error('勾选后确定仍禁用')
- note: 弹窗含 6 个分析类型单选（清单见附录A）
  assert: |-
    await expect(page.getByText(/从对比篮勾选|不会发起分析任务/).first()).toBeVisible({ timeout: 8000 }); /* as-built：页内浮层直接回填本工作台，无六类型弹窗；本点记等价语义（不发起任务） */
- note: 提交后进入本工作台且对象区显示已选 2 家企业
  assert: |-
    await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await expect(page.getByText(/来自对比篮/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText(/2 家/).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮不足 2 家时记 Pass-N/A
as_built_note: 现场为页内「选择分析企业」浮层「确定」回填（不会发起分析），非系统篮「发起分析」+六类型弹窗；第二点按等价语义验收。
tier: B
