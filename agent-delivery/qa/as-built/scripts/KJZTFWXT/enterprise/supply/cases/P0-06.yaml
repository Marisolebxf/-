id: P0-06
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01033
priority: P0
title: 供应链与痛点同壳经 workspace 切换且互不复用
entry_id: ent-supply
preconditions:
- 已进入供应链页；可深链痛点视图
steps:
- action: goto
  target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
- action: evaluate
  note: 回填 2 家对象后切痛点再切回
expect:
- note: 痛点视图不显示供应链已带入对象与关系范围勾选
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 }); await page.waitForTimeout(800); const sels = page.locator('[aria-label^="选择 "]'); if (await sels.count() < 2) throw new Error('SKIP_NO_BASKET'); await sels.nth(0).click(); await sels.nth(1).click(); await page.getByRole('button', { name: '确定' }).click(); await page.waitForTimeout(2000); await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=pain-points&tab=pain-points', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await expect(page.getByRole('heading', { name: '企业发展痛难点分析' })).toBeVisible({ timeout: 8000 }); const pain = await page.locator('main').innerText(); if (/供应商|客户|合作伙伴/.test(pain) && /关系范围/.test(pain)) throw new Error('痛点视图仍见供应链关系范围'); if (!/诊断范围|前往对比篮选择企业/.test(pain)) throw new Error('痛点视图未呈现自身配置空态')
- note: 切回供应链后对象与关系范围保留不被痛点配置覆盖
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1500); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; const t = await page.locator('main').innerText(); await expect(page.getByRole('heading', { name: '企业供应链关系分析' })).toBeVisible({ timeout: 8000 }); if (!/关系范围/.test(t) || !/供应商/.test(t)) throw new Error('切回后关系范围缺失'); /* 对象是否保留以 URL enterprise_codes 或「来自对比篮」为准；深链无 codes 时允许空态回退 observed */
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 对比篮无企业时记 Pass-N/A
as_built_note: 仅验隔离反向；痛点页内容不写正向用例。深链无携带 enterprise_codes 时对象可能不保留——以标题/关系范围区块隔离为主判据，对象保留 observed。
tier: B
