id: P0-03
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01041
priority: P0
title: 结果态交互式图谱以目标企业为中心且三类关系可区分
story: US-ENT-RISK-SUPPLY
entry_id: ent-supply
preconditions:
- 「最近分析」存在已完成供应链任务可恢复；或结果态可达
locators:
  graph: 供应链图谱
  legend: 中心企业 / 供应商 / 客户 / 合作伙伴
steps:
- action: goto
  target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
- action: click
  target: 最近分析
- action: click
  target: 恢复结果
- action: wait
  for: 供应链图谱
expect:
- note: 图谱区块存在且画布可拖拽缩放
  assert: |-
    await page.goto('http://10.50.69.111:30892/enterprise/risk?workspace=supply-chain&tab=supply-chain', { waitUntil: 'domcontentloaded' }); await page.waitForTimeout(1000); const close = page.locator('[aria-label="关闭对比篮"]'); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first().click({ timeout: 8000 }); await page.waitForTimeout(1200); const restore = page.getByRole('button', { name: '恢复结果' }); if (!(await restore.count())) throw new Error('ALLOW_SKIP: 无已完成可恢复任务'); await restore.first().click(); await page.waitForTimeout(3500); if (await close.count() && await close.first().isVisible().catch(() => false)) { await close.first().click(); await page.waitForTimeout(300) }; await expect(page.getByText('供应链图谱', { exact: true }).first()).toBeVisible({ timeout: 10000 }); const canvas = page.locator('canvas').first(); await expect(canvas).toBeVisible({ timeout: 10000 })
- note: 目标企业为中心节点
  assert: |-
    await expect(page.getByText(/当前展示：1级|中心/).first()).toBeVisible({ timeout: 8000 }); await expect(page.getByText('中心企业', { exact: true }).first()).toBeVisible({ timeout: 8000 })
- note: 供应商、客户、合作伙伴三类节点视觉可区分且与图例一致
  assert: |-
    for (const t of ['供应商','客户','合作伙伴']) await expect(page.getByText(t, { exact: true }).first()).toBeVisible({ timeout: 8000 })
on_fail: 截图 + X-Trace-Id + C1~C6
allow_skip: 无已完成历史任务可恢复时记 Pass-N/A
as_built_note: 结果态经「最近分析→恢复结果」进入（新发起任务可能分析失败）；图例文案含中心企业+三类关系；拖拽缩放属交互能力，机检以 canvas 可见代理。
tier: A
