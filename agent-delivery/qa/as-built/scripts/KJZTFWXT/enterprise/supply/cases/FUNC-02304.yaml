id: FUNC-02304
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02304
priority: P0
title: 点创建报告后出现报告任务阶段
story: US-ENT-RISK-SUPPLY
entry_id: ent-supply
tier: B
preconditions:
  - 已打开一条成功结果；供应链分析报告仍为未创建（assert 自含）
locators:
  create_report: button「创建报告」
  report_modal: 弹窗标题「供应链分析报告任务」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 成功结果→点「创建报告」；报告任务弹层阶段与「后台继续」在 expect
expect:
  - note: 1、弹出「供应链分析报告任务」 2、阶段含数据准备、内容组装、图表生成、报告生成 3、可点「后台继续」
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const STAGES = ['数据准备', '内容组装', '图表生成', '报告生成'];
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const isSuccessResult = async () => {
        if (!/view=result/.test(page.url())) return false;
        const t = await main().innerText().catch(() => '');
        return /任务摘要/.test(t) && /供应链分析报告/.test(t);
      };
      const reportSection = () =>
        main().locator('section, [class*="SectionPanel"], div').filter({ hasText: '供应链分析报告' }).first();
      const hasUncreatedReport = async () => {
        const sec = reportSection();
        if (!(await sec.count())) return false;
        const t = await sec.innerText().catch(() => '');
        return /未创建/.test(t) && !/已生成/.test(t);
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const waitSuccess = async (timeoutMs = 120000) => {
        const t0 = Date.now();
        while (Date.now() - t0 < timeoutMs) {
          if (await isSuccessResult()) return;
          const body = await main().innerText().catch(() => '');
          if (/分析失败/.test(body) && !/view=result/.test(page.url())) {
            throw new Error('ENV-SUPPLY-ANALYSIS-FAIL-001');
          }
          await page.waitForTimeout(1200);
        }
        throw new Error('ENV-SUPPLY-ASYNC-NO-SUCCESS-001');
      };
      const startViaBasket = async () => {
        await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
        await expect(page.getByText('选择分析企业').first()).toBeVisible({ timeout: 8000 });
        const sels = page.locator('[aria-label^="选择 "]');
        if ((await sels.count()) < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
        await sels.first().click();
        await page.waitForTimeout(400);
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) throw new Error('ENV-SUPPLY-START-DISABLED-001');
        await start.click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        if (/view=result/.test(page.url()) && /任务摘要/.test(await main().innerText().catch(() => ''))) {
          const reBtn = page.getByRole('button', { name: '重新分析' });
          if (await reBtn.count()) await reBtn.first().click({ timeout: 8000 }).catch(() => {});
        }
        await waitSuccess();
      };
      const openViaRestore = async () => {
        await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        if (await isSuccessResult() && (await hasUncreatedReport())) return true;
        await openRecentTab();
        const restore = page.getByRole('button', { name: '恢复结果' });
        if (!(await restore.count())) return false;
        const n = await restore.count();
        for (let i = 0; i < n; i++) {
          const btn = restore.nth(i);
          await btn.click({ timeout: 15000 });
          await page.waitForTimeout(1500);
          if (await isSuccessResult() && (await hasUncreatedReport())) return true;
          if (await isSuccessResult() && !(await hasUncreatedReport())) {
            await openRecentTab();
            continue;
          }
        }
        return false;
      };
      const reachUncreatedResult = async () => {
        if (await isSuccessResult() && (await hasUncreatedReport())) return;
        if (await openViaRestore()) return;
        await startViaBasket();
        if (!(await isSuccessResult())) throw new Error('ENV-SUPPLY-ASYNC-NO-SUCCESS-001');
        if (!(await hasUncreatedReport())) {
          throw new Error('ENV-SUPPLY-REPORT-NOT-UNCREATED-001：报告区非「未创建」，无法点创建报告');
        }
      };
      const reportModal = () =>
        page.locator('.arco-modal:visible, .arco-modal-wrapper:visible .arco-modal').filter({ hasText: '供应链分析报告任务' }).last();
      await dismissBasket();
      await reachUncreatedResult();
      const createBtn = main().getByRole('button', { name: '创建报告', exact: true });
      if (!(await createBtn.count())) {
        throw new Error('ENV-SUPPLY-NO-CREATE-REPORT-001：未见「创建报告」按钮（可能已为已生成）');
      }
      await expect(createBtn.first()).toBeVisible({ timeout: 8000 });
      await createBtn.first().click({ timeout: 8000 });
      await page.waitForTimeout(600);
      const modal = reportModal();
      await expect(modal).toBeVisible({ timeout: 8000 });
      const modalText = await modal.innerText().catch(() => '');
      if (!/供应链分析报告任务/.test(modalText)) {
        throw new Error('未见弹窗标题「供应链分析报告任务」');
      }
      for (const stage of STAGES) {
        if (!modalText.includes(stage)) throw new Error('报告任务阶段缺少：' + stage);
      }
      const bg = modal.getByRole('button', { name: '后台继续' });
      await expect(bg.first()).toBeVisible({ timeout: 5000 });
      await expect(bg.first()).toBeEnabled({ timeout: 5000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 catalog_path /enterprise/risk?workspace=supply-chain&tab=supply-chain。前置=成功结果且报告区「未创建」（恢复结果优先找未创建行，否则对比篮 1 家发起）。步骤=点「创建报告」。机检=弹层「供应链分析报告任务」+四阶段（数据准备/内容组装/图表生成/报告生成；UI 另有已提交/已完成步骤条项）+「后台继续」可见可点。无未创建可恢复→篮发起；篮空→ENV-SUPPLY-BASKET-EMPTY-001；仅已生成任务→ENV-SUPPLY-REPORT-NOT-UNCREATED-001。登录与关评审由 runner 前置。A 档零 allow_skip。
