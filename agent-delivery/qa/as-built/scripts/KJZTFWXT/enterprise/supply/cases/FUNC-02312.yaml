id: FUNC-02312
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-02312
priority: P1
title: 删除分析记录并确定后该任务从列表消失
story: US-ENT-RISK-PROCESS
entry_id: ent-supply
tier: B
preconditions:
  - 最近分析中有一条可删除的供应链任务
locators:
  recent_tab: tab「最近分析」
  delete_button: button「删除」
  modal_ok: 弹框 button「确定」
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 最近分析→优先已取消/失败行点「删除」→弹框点「确定」；行消失在 expect
expect:
  - note: 1、该任务从列表消失
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'https://edu.itic-sci.com/tts/svcz';
      const toUrl = (p) => origin + (p.startsWith('/') ? p : '/' + p);
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const TID_RE = /RISK-\d{8}-\d{3}/;
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
        await expect(page).toHaveURL(/view=history/, { timeout: 12000 });
      };
      const waitHistoryTable = async () => {
        for (let i = 0; i < 30; i++) {
          const t = await main().innerText().catch(() => '');
          if (/最近分析/.test(t) && (/任务名称/.test(t) || /RISK-/.test(t))) return;
          await page.waitForTimeout(500);
        }
        throw new Error('最近分析表未渲染，url=' + page.url());
      };
      const scrollHistoryActions = async () => {
        const bodies = main().locator('.arco-table-body, .arco-table-content, .arco-scrollbar-container');
        const bn = await bodies.count();
        for (let i = 0; i < bn; i++) {
          await bodies.nth(i).evaluate((el) => { el.scrollLeft = el.scrollWidth; }).catch(() => {});
        }
        await page.waitForTimeout(400);
      };
      const rowDeletePriority = (rowText) => {
        if (!rowText || !TID_RE.test(rowText) || !/企业供应链关系分析/.test(rowText)) return -1;
        if (/已取消/.test(rowText)) return 4;
        if (/失败/.test(rowText)) return 3;
        if (/处理中|进行中|生成中/.test(rowText)) return 2;
        if (/已完成/.test(rowText)) return 1;
        return 0;
      };
      const tableTaskIds = async () => {
        const rows = main().locator('table tbody tr, .arco-table-tr');
        const n = await rows.count();
        const ids = [];
        for (let i = 0; i < n; i++) {
          const txt = await rows.nth(i).innerText().catch(() => '');
          const m = txt.match(TID_RE);
          if (m) ids.push(m[0]);
        }
        if (ids.length) return [...new Set(ids)];
        const body = await main().innerText().catch(() => '');
        return [...new Set(body.match(new RegExp(TID_RE.source, 'g')) || [])];
      };
      const pickDeletableRowOnPage = async () => {
        await scrollHistoryActions();
        const rows = main().locator('table tbody tr, .arco-table-tr');
        const n = await rows.count();
        let best = null;
        let bestScore = -1;
        for (let i = 0; i < n; i++) {
          const row = rows.nth(i);
          if (!(await row.isVisible().catch(() => false))) continue;
          const txt = await row.innerText().catch(() => '');
          const score = rowDeletePriority(txt);
          if (score < 0) continue;
          const del = row.getByRole('button', { name: '删除', exact: true }).last();
          if ((await del.count()) < 1 || !(await del.isVisible().catch(() => false))) continue;
          const tidM = txt.match(TID_RE);
          if (!tidM) continue;
          if (score > bestScore) {
            bestScore = score;
            best = { row, del, taskId: tidM[0], rowText: txt };
          }
        }
        return best;
      };
      const pickDeletableRow = async () => {
        const pag = main().locator('.arco-pagination').first();
        for (let guard = 0; guard < 24; guard++) {
          const hit = await pickDeletableRowOnPage();
          if (hit) return hit;
          if (!(await pag.count()) || !(await pag.isVisible().catch(() => false))) break;
          const next = pag.locator('.arco-pagination-item-next:not(.arco-pagination-item-disabled)').first();
          if (!(await next.count()) || !(await next.isVisible().catch(() => false))) break;
          await next.click({ timeout: 5000 });
          await page.waitForTimeout(800);
        }
        return null;
      };
      await page.goto(toUrl(supplyRoute), { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(1000);
      await dismissBasket();
      await openRecentTab();
      await waitHistoryTable();
      const picked = await pickDeletableRow();
      if (!picked) {
        const body = await main().innerText().catch(() => '');
        if (!/RISK-/.test(body)) {
          throw new Error('环境闸门 ENV-SUPPLY-NO-HISTORY-001：最近分析无供应链任务行（前置 1 不满足）');
        }
        throw new Error(
          '环境闸门 ENV-SUPPLY-NO-DELETABLE-001：有历史行但未见可点「删除」的供应链任务（操作列未滚出或无删除钮）',
        );
      }
      const expectedTid = picked.taskId;
      const idsBefore = await tableTaskIds();
      if (!idsBefore.includes(expectedTid)) {
        throw new Error('锚定任务 ID 不在表格内：' + expectedTid);
      }
      await picked.row.scrollIntoViewIfNeeded().catch(() => {});
      await scrollHistoryActions();
      await picked.del.click({ timeout: 8000 });
      await page.waitForTimeout(400);
      const modal = page.locator('.arco-modal:visible').filter({ hasText: '删除分析记录' });
      await expect(modal).toBeVisible({ timeout: 8000 });
      const ok = modal.getByRole('button', { name: '确定', exact: true });
      await expect(ok).toBeVisible({ timeout: 5000 });
      await ok.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      await expect(modal).toBeHidden({ timeout: 10000 });
      const t0 = Date.now();
      while (Date.now() - t0 < 15000) {
        const idsAfter = await tableTaskIds();
        if (!idsAfter.includes(expectedTid)) break;
        await page.waitForTimeout(500);
      }
      const idsFinal = await tableTaskIds();
      if (idsFinal.includes(expectedTid)) {
        throw new Error('确定删除后任务仍在最近分析列表：' + expectedTid);
      }
      const rowStill = main().locator('table tbody tr, .arco-table-tr').filter({ hasText: expectedTid });
      await expect(rowStill).toHaveCount(0, { timeout: 3000 });
on_fail: 截图 + X-Trace-Id + C1~C6
as_built_note: D1·edu tts/svcz 深链 catalog_path /enterprise/risk?workspace=supply-chain&tab=supply-chain。步骤=最近分析优先「已取消」/「失败」可删行（降低对已完成 金样 的破坏）→「删除」→Modal「删除分析记录」→「确定」。机检=确定后 RISK 任务 ID 从表内消失。无历史→ENV-SUPPLY-NO-HISTORY-001；有行无删除→ENV-SUPPLY-NO-DELETABLE-001。破坏性：会真删一条供应链历史。登录与关评审由 runner 前置。B 档零 allow_skip。
