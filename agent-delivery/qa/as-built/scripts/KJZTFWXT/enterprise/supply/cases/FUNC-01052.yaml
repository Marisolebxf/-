id: FUNC-01052
func_id: ZNFWJQ-KJZTFWXT-v1.0-FUNC-01052
priority: P1
tier: B
title: 风险项显示建议提前制定备份方案提示且无方案编辑入口
entry_id: ent-supply
preconditions: []
locators: {}
steps:
  - action: goto
    target: /enterprise/risk?workspace=supply-chain&tab=supply-chain
  - action: evaluate
    note: 浏览关键节点与断链风险区块风险项；存在时浏览供应链报告区块
expect:
  - note: 风险项显示「建议提前制定备份方案」提示
    assert: |-
      const origin = (typeof baseUrl === 'string' && baseUrl) ? baseUrl.replace(/\/$/, '') : 'http://10.50.69.111:30892';
      const supplyRoute = '/enterprise/risk?workspace=supply-chain&tab=supply-chain';
      const main = () => page.locator('main.content-shell-layout, main').first();
      const dismissBasket = async () => {
        const close = page.locator('[aria-label="关闭对比篮"]');
        if (await close.count() && (await close.first().isVisible().catch(() => false))) {
          await close.first().click({ timeout: 3000 }).catch(() => {});
          await page.waitForTimeout(300);
        }
      };
      const openRecentTab = async () => {
        const tab = page.locator('main [role=tab], main button').filter({ hasText: '最近分析' }).first();
        await tab.click({ timeout: 8000 });
        await page.waitForTimeout(900);
      };
      const clickRiskSectionTab = async (label) => {
        await expect(page.getByText('关键节点与断链风险').first()).toBeVisible({ timeout: 15000 });
        const grp = main()
          .locator('.analysis-rounded-radio, .arco-radio-group')
          .filter({ hasText: label })
          .first();
        const opt = grp.getByText(label, { exact: true });
        if (!(await opt.count())) throw new Error('未见' + label + '切换钮');
        await opt.scrollIntoViewIfNeeded().catch(() => {});
        await opt.click({ timeout: 12000 });
        await page.waitForTimeout(600);
      };
      const sectionHasBackupHint = async () => {
        const t = await main().innerText().catch(() => '');
        return /建议提前制定备份方案/.test(t);
      };
      const browseRiskPanels = async () => {
        for (const label of ['关键节点', '断链风险']) {
          await clickRiskSectionTab(label);
          if (await sectionHasBackupHint()) return true;
        }
        return false;
      };
      const assertBackupHint = async () => {
        await expect(page.getByText(/建议提前制定备份方案/).first()).toBeVisible({ timeout: 8000 });
      };
      const waitForResult = async () => {
        const deadline = Date.now() + 120000;
        while (Date.now() < deadline) {
          const body = await main().innerText().catch(() => '');
          const url = page.url();
          if (/view=result/.test(url) && /任务摘要/.test(body)) return true;
          if (/企业供应链关系分析生成中|view=processing|任务提交|数据汇聚|算法计算|结果组装/.test(body + url)) {
            await page.waitForTimeout(1500);
            continue;
          }
          await page.waitForTimeout(800);
        }
        return false;
      };
      const runFreshAnalysis = async () => {
        await page.goto(origin + supplyRoute, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        await page.getByRole('button', { name: '前往对比篮选择企业' }).click({ timeout: 8000 });
        await page.waitForTimeout(600);
        const sels = page.locator('[aria-label^="选择 "]');
        if ((await sels.count()) < 1) throw new Error('ENV-SUPPLY-BASKET-EMPTY-001');
        await sels.first().click();
        await page.waitForTimeout(400);
        await page.getByRole('button', { name: '确定' }).click({ timeout: 8000 });
        await page.waitForTimeout(1500);
        await dismissBasket();
        const start = page.getByRole('button', { name: '开始分析' });
        if (await start.isDisabled()) throw new Error('ENV-SUPPLY-START-DISABLED-001');
        await start.click({ timeout: 8000 });
        if (!(await waitForResult())) throw new Error('ENV-SUPPLY-ASYNC-NO-SUCCESS-001');
        await dismissBasket();
        return await browseRiskPanels();
      };
      const tryRestoreRow = async (index) => {
        await page.goto(origin + supplyRoute, { waitUntil: 'domcontentloaded' });
        await page.waitForTimeout(800);
        await dismissBasket();
        await openRecentTab();
        const restore = page.getByRole('button', { name: '恢复结果' });
        if ((await restore.count()) <= index) return false;
        await restore.nth(index).click({ timeout: 15000 });
        await expect(page).toHaveURL(/view=result/, { timeout: 25000 });
        await dismissBasket();
        if (await browseRiskPanels()) {
          await assertBackupHint();
          return true;
        }
        return false;
      };
      if (/view=result/.test(page.url())) {
        await dismissBasket();
        if (await page.getByText('任务摘要').count()) {
          if (await browseRiskPanels()) {
            await assertBackupHint();
            globalThis.__func01052_ready = true;
            return;
          }
        }
      }
      await page.goto(origin + supplyRoute, { waitUntil: 'domcontentloaded' });
      await page.waitForTimeout(800);
      await dismissBasket();
      await openRecentTab();
      const restoreCount = await page.getByRole('button', { name: '恢复结果' }).count();
      if (restoreCount >= 1) {
        for (let i = 0; i < Math.min(restoreCount, 9); i++) {
          if (await tryRestoreRow(i)) {
            globalThis.__func01052_ready = true;
            return;
          }
        }
      }
      if (await runFreshAnalysis()) {
        await assertBackupHint();
        globalThis.__func01052_ready = true;
        return;
      }
      throw new Error('ENV-SUPPLY-RISK-EMPTY-001：恢复与新建分析均未见备份方案提示');
  - note: 提示仅出现在已标注潜在风险的风险项上
    assert: |-
      const main = page.locator('main.content-shell-layout, main').first();
      const t = await main.innerText();
      if (!/建议提前制定备份方案/.test(t)) throw new Error('未见备份方案提示');
      if (!/(节点异常|路径脆弱|单点依赖|潜在风险)/.test(t)) throw new Error('提示出现时未见风险类型或潜在风险标注');
      const cards = main.locator('[role=button], .arco-card, div').filter({ hasText: /建议提前制定备份方案/ });
      const n = await cards.count();
      if (n < 1) throw new Error('未见带备份提示的风险卡片');
      const cardText = (await cards.first().innerText()).replace(/\s+/g, ' ');
      if (!/(节点异常|路径脆弱|单点依赖|潜在风险)/.test(cardText)) {
        throw new Error('备份提示卡片上未见风险标注：' + cardText.slice(0, 120));
      }
  - note: 页面无备份方案编辑器或制定入口
    assert: |-
      const main = page.locator('main.content-shell-layout, main').first();
      const t = await main.innerText();
      const scrubbed = t.replace(/建议提前制定备份方案\.?/g, '');
      if (/制定备份方案|备份方案编辑|编辑备份方案|创建备份方案/.test(scrubbed)) {
        throw new Error('出现备份方案编辑或制定入口');
      }
      const editorish = main.locator('button, a').filter({ hasText: /制定备份方案|编辑备份方案|保存备份方案/ });
      if (await editorish.count()) throw new Error('存在备份方案操作按钮');
      if (await page.getByText('供应链分析报告').count()) {
        const report = main.locator('section, div').filter({ hasText: '供应链分析报告' }).first();
        const rt = (await report.innerText().catch(() => t)).replace(/\s+/g, ' ');
        if (/制定备份方案|备份方案编辑|编辑备份方案/.test(rt)) {
          throw new Error('供应链报告区块出现备份方案编辑入口');
        }
      }
on_fail: 截图 + 抄 X-Trace-Id
