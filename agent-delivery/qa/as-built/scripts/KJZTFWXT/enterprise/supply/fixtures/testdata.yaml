    views: [图谱, 结构列表]
    filters: [只看关键, 只看风险]
  key_risk:
    title: 关键节点与断链风险
    tabs: [关键节点, 断链风险]
    # 实勘 RISK-20260910-001：关键节点 0 项；断链风险 2 项（节点异常 / 路径脆弱）
    backup_hint: 建议提前制定备份方案
    risk_types_allowed: [单点依赖, 节点异常, 路径脆弱]

review:
  persona_menu: button.persona-switch
  toggle_label: 内部评审模式
  trace_buttons:
    - 风险洞察需求追溯
    - 关系范围需求追溯

compare_basket:
  close_aria: 关闭对比篮
  close_only_if_visible: true   # 派单注意：关闭钮可能不可见——可见再点
  not_in_scope: true
