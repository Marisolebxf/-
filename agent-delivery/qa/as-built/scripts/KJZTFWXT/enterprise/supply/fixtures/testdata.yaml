base_url: "http://111.198.38.90:50892/"
viewport: { width: 1920, height: 1080, device_scale_factor: 1 }
login:
  username: admin
  password: "123456"
route: "/enterprise/risk?workspace=supply-chain&tab=supply-chain"
route_pain_sibling: "/enterprise/risk?workspace=pain-points&tab=pain-points"

page:
  title: 企业供应链关系分析
  document_title: 企业供应链关系分析 - 科技专题服务系统
  tabs: [当前分析, 最近分析]
  default_tab: 当前分析

empty_state:
  guide_text: 请先在对比篮选择企业，再进入风险洞察配置。
