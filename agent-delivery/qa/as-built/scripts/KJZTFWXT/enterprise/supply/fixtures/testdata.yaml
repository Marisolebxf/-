relation_scope:
  label: 关系范围
  options: [供应商, 客户, 合作伙伴]
  default_all_checked: true
  hint: 结果默认展示一级关系，可在图谱中按节点逐层展开。

precheck:
  section: 数据与权限预检
  empty_hint: 选择企业后显示数据与权限预检
  # 回填 2 家后实勘字段（不钉死数值文案以外的演示态）
  filled_keys: [对象有效, 数据覆盖, 模型状态, 权限范围]

start_button: 开始分析

overlay:
  title: 选择分析企业
  subtitle_contains: 从对比篮勾选本页分析对象
  confirm: 确定
  cancel: 取消
  max_select: 2
  # as-built：勾选第 3 家后「确定」禁用（超限前移到浮层，无法回填 3 家到配置页）

filled:
  source_prefix: 来自对比篮
  return_cta: 返回对比篮调整对象

history:
  tab: 最近分析
  view_query: view=history
  columns: [任务名称, 分析类型, 企业摘要, 创建时间, 状态, 操作]
