  type_label: 企业供应链关系分析
  # 实勘有已完成任务可恢复（如 RISK-20260910-001）

result:
  restore_entry: 恢复结果
  sections: [任务摘要, 供应链图谱, 关键节点与断链风险, 供应链分析报告]
  graph:
    title: 供应链图谱
    legend: [中心企业, 供应商, 客户, 合作伙伴]
