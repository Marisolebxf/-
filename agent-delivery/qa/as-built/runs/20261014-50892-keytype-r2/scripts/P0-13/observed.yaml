zoom_evidence:
  method: 天地图 WMTS 瓦片 URL 的 TILEMATRIX 参数（等价 Leaflet zoom 级）
  initial: '9'
  after_zoom_in: '10'
  after_zoom_out: '9'
map_instance:
  leaflet_container_count: 1
  leaflet_element_id: 3
  map_pane_transform: translate3d(0px, 0px, 0px)
note: zoom 级数通过瓦片矩阵间接读取（Leaflet map 实例未挂 window，_leaflet_events 为 zone 包装函数无 ctx 可达）。
