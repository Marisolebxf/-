spec_card_full_text: |
  各类型企业数 指标ID M_ENT_TYPE_COUNT
  口径定义 pending_data_lead(Q010)：外企/高企/小微/上市等企业类型精确判定规则待甲方确认；临时默认按 is_foreign/is_high_tech/is_sme/is_listed 规则分类计数。
  计算公式 pending_algorithm（按 is_foreign/is_high_tech/is_sme/is_listed 标签判定后分组 COUNT）
  源表 dwd.enterprise.is_foreign/is_high_tech/... <- ods: dwd_org_tag_info, dwd_company_honor_tags, dwd_org_stock_base
  源系统 Mock @ batch=mock_20260618 更新频率 每日 版本 0.1.0
  口径待甲方确认（开放项 Q010 · 企业类型（外企/高企/小微/上市）判定规则），当前为团队临时默认值。
  就绪度：指标定义已登记口径待确认 / 结构支撑待评估 / 源映射 ODS 未稳定 / 数据接入 Mock 占位（Wave 0）
