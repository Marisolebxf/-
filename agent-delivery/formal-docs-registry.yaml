# 七要素支持层 WBS（指标/图谱/模型/专题服务/展示绑定）
system_wbs:
  path: agent-delivery/system-wbs.yaml
  layers: [L1 数据底座, L2 指标+图谱, L3 深度模型, L4 综合分析, L5 AI赋能]
  elements: [E1企业, E2产业链, E3科研机构, E4技术链, E5人才, E6服务机构, E7政策]
  active_epics:
    - E-PLATFORM-P0   # Wave0 横向平台
    - E-INNOV-M1      # 创新监测快路径（E2/E4 切片）
    - E-E7-POLICY-M1  # Wave1 政策首条垂向
  design_refs:
    - 2-概要设计/docs/科创数据要素全域-分层建设思路.md
    - 2-概要设计/2-2概要设计/5链分析与7要素关系网络.md
    - 2-概要设计/2-2概要设计/科技专题服务算法库-概要设计说明书.md
  graph_engine:
    doc: agent-delivery/graph-engine.md
    runtime: NebulaGraph
    demo: ${GKX_ROOT}/repos/demo-algo-ent-analysis
    dev: { graphd: "192.168.88.43:9669", demo_space: entan, policy_space: gkx_policy }
  database_design:
    doc: agent-delivery/数据库设计.md
    mysql_schemas: [innov_dim, innov_dwd, innov_dwm, innov_ads, innov_cfg, gkx_dim, gkx_dwd, gkx_dwm, ads, gkx_cfg, app_user]
    child_ddl: innov-ddl

# 甲方验收（2-1需求分析 功能点真源 · 不读招标 PDF）
acceptance_compliance:
