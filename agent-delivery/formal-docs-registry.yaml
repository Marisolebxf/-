# 交付物命名与正式文件编号对齐
deliverable_naming:
  handoff: "agent-handoffs/{task-id}.md"
  acceptance_md: "验收文档/{模块}-{页面}-{报告类型}.md"
  acceptance_docx: "验收文档/{模块}-{页面}-{报告类型}.docx"  # 用 officecli 从模板生成
  format_ref_field: "format_ref"  # 可选：标注对齐的 V6 章节/样式，便于归档对照
  content_rule: "实测与代码为准，勿粘贴 V6 大段原文"
