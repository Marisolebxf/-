# task-registry leaf 模板（复制到 task-registry.yaml 的 tasks: 段落下）
# 说明：agent-delivery/task-creation-guide.md
# 新建 leaf 默认 status: backlog；解锁 ready 走 scan → confirm，勿手改 ready 绕过。

  - id: "{MODULE}-PACK-L01"                    # 例 ENT-MOD-SEARCH-PACK-L01
    epic: E-ENT-SCRUM-PDR                      # 所属 Epic
    delivery_phase: definition                   # definition | implementation | crosscut
    parent: "{MODULE}-PDR-G1-RECLOSE"           # 同模块聚合 parent（可选）
    title: "{模块中文名} — 核心产品包（USM、TRACE、IA、Wireframe）"
    agent: product-agent
    repo: agent-delivery
    depends_on: []                             # 首 leaf 可为空；下游填上游 id
    status: backlog                            # 新建禁止 ready；unlock 走 confirm
    priority: P0                               # P0 | P1 | P2
    sprint_id: "2026-W30"                      # Planning 时填写；可先留空
    cicd: skip_design_only                     # 纯文档 leaf 常用
    definition_of_done:
      - USM/TRACE/IA/Wireframe 四份路径一致且可评审
      - bid-reference 章节映射完整
    evidence: []                               # 完成后填 handoff 路径
    estimated_tokens: 80_000
    effort_points: 2
    difficulty: S
    effort_source: planning_estimate
    # Graph Engineering（新 leaf 宜填）
    subcoord: ui-subcoord                      # 见 graph_engineering_policy
    graph_role: leaf                           # leaf | fan-out | fan-in | gate
    ods_dependency_phase: n/a                  # phase1_pending_ods | phase2_mapped | n/a
    touched_files:                             # 同仓并行必填（Convoy 自动检测）
      - agent-delivery/agent-handoffs/**
    # convoy: BACKEND-API                      # 可选显式组（dispatch-queue.yaml#convoy_groups）
    note: "由 PM 登记；unlock 见 dispatch-rules def-pack-unlock-*"

  # ── 定义轨下游示例（须 confirm 解锁，非 scan 时新建）────────────
  - id: "{MODULE}-UX-L01"
    epic: E-ENT-SCRUM-PDR
    delivery_phase: definition
    parent: "{MODULE}-PDR-G1-RECLOSE"
    title: "{模块中文名} — UX 交互深化"
    agent: ux-agent
    repo: agent-delivery
    depends_on: ["{MODULE}-PACK-L01"]
    status: backlog
    priority: P0
    definition_of_done:
      - UX-SPEC 主/异常路径与交互规格完成
    estimated_tokens: 60_000
    effort_points: 2
    difficulty: M

  # ── 实现轨示例（门 3 DG-G3 通过后入库 · delivery_phase: implementation）──
  - id: "{MODULE}-API-CONTRACT-L01"
    epic: E-ENT-SCRUM-PDR
    delivery_phase: implementation
    title: "{模块中文名} — Java API 契约与门面"
    agent: api-agent
    repo: lumen-svc-platform
    depends_on: ["{MODULE}-DG-G3"]             # 或 ARCH-IMPL leaf
    status: backlog
    priority: P0
    definition_of_done:
      - OpenAPI / 契约与 architecture-baseline 一致
      - 不含 NLP/算法实现（铁律 1）
    estimated_tokens: 120_000
    effort_points: 3
    difficulty: M
    note: "DG ✅ 后 PM 门 I1 拆单入库；unlock 走 impl-gate3-unlock + confirm"
