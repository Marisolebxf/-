# 团队花名册（认领真名真源）
# 用途：task-registry claimed_by / supervised_by 真名校验；站会负责人；评审签字；监管容量查询
# 维护：各 team lead + PM（郭万迎）；新成员 24h 内登记
# 关联：task-claiming-guide.md §8 · 产品定义评审规程.md §1.4 · team-members.md（简介）
# 容量：max_agent_concurrency = 每人**本机同时打开的 Cursor agent 会话**上限（默认 20）；
#       超过则改用 Background Agents（云端）。**不是** registry 挂载任务数上限，也**不是**派单上限。
#       find-supervisor-slot.mjs = 亲和/负载参考，不得作派单硬门禁。
#       可选 preferred_subcoords: [ui-subcoord, ...] 覆盖默认 team 亲和

version: 1
updated: "2026-11-05"
maintainer: human:淮政玮

capacity_policy:
  field: max_agent_concurrency
  meaning: local_cursor_agent_sessions   # 本机 Cursor agent 会话并发；非派单 / 非 registry 挂载上限
  default_full_time: 20
  default_part_time: 2
  find_slot: scripts/find-supervisor-slot.mjs
  find_slot_role: advisory_affinity_only   # 仅亲和与参考负载；不得因 free=0 拒派
  note: >
    max_agent_concurrency≤20 = 每人本机同时开 Cursor agent 会话的上限（超则 Background Agents）。
    同一 supervised_by 可挂任意多条 claimed/in_progress/review；coordinator 派单吞吐无此上限。

# 语义 Owner 临时代行（2026-07-20 · PM 淮政玮授权）
# 真源条文：agent-delivery/产品定义评审规程.md §1.4.1
semantic_owner_delegation:
  effective_from: "2026-07-20"
  authorized_by: human:淮政玮
  nominal_owner: human:王惠
  acting_owner: human:唐绍祖
  scope: metric_semantic_signoff
  note: 唐绍祖暂时等同于王惠；可代替王惠会签 metric 语义卡、METRIC-OPEN、PDR-05/06、H-01 等；不含甲方业务口径拍板
  # 全模块语义双签（方案 B · 2026-07-29 · 项目负责人确认；同日扩展至非企业模块）
  metric_dual_signoff:
    effective_from: "2026-07-29"
    authorized_by: human:淮政玮
    scope: all_modules   # ENT / POLICY / 全要素 METRIC-OPEN + lineage-review；不限企业维度
    primary_semantic_owner: human:王惠      # 指标科学定义 · 口径主责（metric-subcoord）
    algorithm_cosigner: human:唐绍祖         # 公式/权重/算法定义卡可代签收口
    still_nominal: human:王惠             # 名义语义 Owner；日常以双签为准
    supersedes_day_to_day: section_1_4_1_for_koujing  # 口径日常不再仅靠唐绍祖代王惠
    note: |
      方案 B（全模块）：王惠定指标口径与 METRIC-OPEN 适用性；唐绍祖可代签算法权重/公式。
      门 1 PDR-05/06 / H-01：口径侧王惠 + 算法侧唐绍祖（或算法 N/A 有据）缺一不可。
      §1.4.1 临时代行保留：王惠缺席时，唐绍祖可按临时代行临时代口径会签，须纪要注明。
      不含甲方业务口径拍板（仍走 客户决策清单跟踪表.md）。

