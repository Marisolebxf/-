    auto_dispatch: true
    awaiting: [E-INNOV-M1-L05]
    convoy: BACKEND-API
    worktree_branch: feat/E-INNOV-M1-L06
    estimated_tokens: 200_000
    dispatch_doc: agent-handoffs/平台基建-PLATFORM/DISPATCH-QUEUE-2026-06-20.md#l06

  - id: E-INNOV-M1-L09
    tier: 5
