    worktree_branch: feat/E-PLATFORM-P0-L05
    estimated_tokens: 300_000
    dispatch_doc: agent-handoffs/平台基建-PLATFORM/DISPATCH-QUEUE-2026-06-20.md#p0-l05

  - id: E-PLATFORM-P0-L07
    tier: 2
    priority: 22
    agent: frontend-agent
    auto_dispatch: true
    awaiting: [E-PLATFORM-P0-L00]
    worktree_branch: feat/E-PLATFORM-P0-L07
