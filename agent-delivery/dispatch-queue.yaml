# coordinator 触发规则
trigger_policy:
  on_task_done:
    - re_scan_queue: true
    - max_parallel_dispatch: 2   # 避免瞬间超过并发 4（含在跑任务）
  on_convoy_busy:
    - defer_same_convoy: true
    - retry_after_minutes: 15
