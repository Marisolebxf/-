    dispatch_doc: agent-handoffs/平台基建-PLATFORM/DISPATCH-QUEUE-2026-06-20.md#p0-l06

  # ── Tier 4：前后端联调 ──
  - id: E-INNOV-M1-L08
    tier: 4
    priority: 40
    agent: frontend-agent
    auto_dispatch: true
