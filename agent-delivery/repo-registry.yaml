    lumen-ui-science-pc:
      ci: true
      image: gkx-lumen-pc
      deploy: deploy:k8s
      deploy_trigger: auto_on_dev
      dev_url: http://192.168.88.50:30891
    lumen-ui-topic:
      ci: true
      image: gkx-lumen-topic
      deploy: deploy:k8s
      deploy_trigger: auto_on_dev
      dev_url: http://192.168.88.50:30892
    lumen-svc-platform:
      ci: false  # 待 L02b 移植
      image: gkxlumen-*
      deploy: helm
      deploy_trigger: manual
    demo-svc-platform:
