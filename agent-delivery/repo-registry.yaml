# 以下为 v2 老结构（保持原状，不做 break change）
# ============================================================
design_reference:
  repo: gkx1/demo-ui-science
  url: https://gitlab.htmisoft.net/gkx1/demo-ui-science.git
  deployed_url: https://skxrules.unicomcn.tech:30999/
