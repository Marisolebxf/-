    demo:
      name: demo2
      remote: https://gitlab.htmisoft.net/gkx1/demo-ui-science.git
      local: ${GKX_ROOT}/repos/demo-ui-science
      branch: main
      dev_url: https://skxrules.unicomcn.tech:30999/   # 现有演示环境
    propagation:
      to_lumen: forbidden            # 严守铁律：禁止直接 merge 到任何 lumen 仓
      via: frontend-agent_rewrite    # 由 frontend-agent 工程化复刻（同既有 demo→lumen 模式）
    owners:
      primary: [ui-agent, ux-agent]  # 高频改动：原型/页面/IA
      assist: 传统前端工程师          # 复杂交互/工程化辅助
      review: UI_UE_3_humans         # 评审 + 与甲方对齐 + 创意决策
    rules:
      design_spec_compliance: spec_doc§14  # 8 条检查 + 6 条验收 = 14 条；handoff 必带对照
      design_tokens_only: true             # 禁止硬编码颜色/间距/字号；只从 Design.md §4 / §5 / §6 token 导入
      page_skeleton_six_containers: spec_doc§3.1 # app-shell / app-frame / app-header(64px) / app-sidebar(200px) / content-shell / workspace-grid
      three_segment_workspace: spec_doc§3.2  # 左图层 + 中央地图 + 右侧分析（右侧分析不可删除）
      component_library_only: true         # 优先复用 src/components；新组件须经 UI/UE 评审
