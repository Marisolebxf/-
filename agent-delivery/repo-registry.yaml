agent_rules:
  - demo 仓：POC / Spike；禁止堆正式交付代码
  - lumen 仓（backend + fronted_pc + fronted_mobile）：正式 UI + Java API 交付来源
  - Python 算法：algorithm-agent / data-agent 专职；禁止在 Java 仓写 NLP/模型/图谱计算
  - demo2：frontend-agent 只读参考，禁止 git merge
  - innov-algo-demo：M1 Python 算法流水线；Java gkxlumen-innov 只做 ADS 查询与 REST
  - 可观测性：全栈 OTel 必遵，见 observability.md；新代码不得破坏 demo 已验证的三联查
  - 知识图谱：统一 NebulaGraph，见 graph-engine.md；禁止 Neo4j 新依赖
  - 数据库：DDL 总纲见 数据库设计.md；innov 子域见 innov-ddl
  - 甲方验收：2-1需求分析 功能点 100% 有入口；DEMO 必登记 demo-fallback-registry.yaml
  - **前端规范（D8）**：所有前端 PR（demo2 沙箱页 + lumen 正式页）必经 `Design.md §14` 14 条对照（8 检查 + 6 验收）；token 不硬编码、按 `§4 / §5 / §6 / §13` 导入；新页面 `@arco-design/web-react` 权威，禁引 `antd`；主色固定 `#165DFF`；handoff 缺 §14 对照 = qa-agent 打回

