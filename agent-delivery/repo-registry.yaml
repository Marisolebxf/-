# gkx-lumen 组项目一览（截图确认）
# 正式 lumen：lumen-svc-platform | lumen-ui-science-pc | lumen-ui-science-mobile | lumen-ui-topic | lumen-ui-admin | lumen-algo-platform | lumen-algo-py | lumen-etl-es-py
# demo 原型：demo-svc-platform | demo-ui-* | demo-admin-ui | demo-algo-* | demo-svc-topic-py
# D12：lumen 前端调用链禁止打到任何 demo-* 服务（含 Java Feign / helm 回落）
# 注：GitLab 仓库名 fronted 为原文拼写（非 frontend）
#
# 架构铁律（三仓职责）：
#   Python 仓 = 全部算法服务（ETL、NLP、图谱、赋分、指数、预测、深度模型）
#   Java 仓   = 业务 API 层（只读 ADS/聚合/SQL 级统计/用户态），禁止写算法逻辑
#   前端仓   = 只调 Java REST，不直连 Python、不直连数据库
#   D12      = lumen-* 正式；demo-* 原型；lumen 调用链不依赖 demo 运行时

architecture:
  algorithm_language: python  # 所有算法服务均为 Python，无 Java 算法模块
  business_api_language: java
  python_repos:
    - lumen-algo-py          # 正式算法（产业链等已切；创新监测/企业图谱迁入见 D12 债）
    - lumen-etl-es-py        # 正式 ES ETL
    - demo-algo-science      # 创新监测 POC；不得作为 lumen 前端调用链下游
    - demo-algo-ent-analysis # 企业图谱 POC；不得作为 lumen 前端调用链下游
    - gkx_demo_python        # 已 archive
  java_repos:
    - demo-svc-platform / lumen-svc-platform  # 含 gkx-innov 等业务 REST，非算法
  python_internal_api_only: true

# D8 决策（2026-06-17 初版 / 2026-06-18 升级为 Figma 风格稿落地版）
frontend_design_authority:
  spec_doc: agent-delivery/Design.md     # 2026-06-18 由 v1.1 抽象 UI 框架升级为 Figma 落地稿（14 节）
  authority_level: D8                    # 等同于架构铁律，违反 = architect-agent 拒绝合并
  new_page_stack:                        # 新页面权威栈（含 lumen 与 demo2 沙箱页），Design.md §0 + §13
    framework: "React + Vite"
    ui_library: "Arco Design (@arco-design/web-react)"  # 不引 antd / antd/dist/reset.css
    icon: "@arco-design/web-react/icon"
    charts: "ECharts (echarts-for-react)"
    graphs: "AntV G6 或 ECharts graph"
    maps: "Leaflet"
    date: "dayjs"
    styling: "CSS Modules / 普通 CSS / Tailwind 工具类（必须沉淀 token 到 Design.md §4 CSS 变量）"
  legacy_compatibility:
    demo2_existing: "Ant Design v5（demo2 历史代码保留兼容；禁止新页面回退到 AntD）"
    mix_in_same_page: forbidden          # 同页面 Arco / AntD 混搭禁止
  fixed_primary_color: "#165DFF"         # Design.md §0 + §4.1 主色，不可替换为 #2F6DF6 / #1677FF 等近似蓝
  fixed_page_bg: "#D8E7FC"               # Design.md §0 页面底色
  fixed_control_height: "32px"           # Design.md §0 + §14 验收 #4
  fixed_header_height: "64px"            # Design.md §3.1 + §14 验收 #2
  fixed_sidebar_width_expanded: "200px"  # Design.md §3.1 + §14 验收 #3
  design_tokens_authoritative_source: spec_doc§4+§5+§6+§13   # 基础色 / 字体 / 圆角阴影 / 主题 token 映射
  base_color_css_vars: spec_doc§4.1      # 13 个 CSS 变量（--sci-bg-page / --sci-surface-* / --sci-text-* / --sci-primary* 等）
  fixed_business_factor_color_map:       # 10 类业务要素固定配色（spec_doc §4.3）
    expert: "#4180FD"            # 专家学者
    enterprise: "#16C7C7"        # 企业
    researchInstitution: "#4DD164" # 科研机构 / 机构
    meeting: "#F6BA21"           # 会议
    paper: "#A872E2"             # 论文
    patent: "#58A8F9"            # 专利
    serviceAgency: "#F779B6"     # 服务机构
    project: "#83DDD3"           # 项目
    topic: "#78D986"             # 课题
    journal: "#FBD08A"           # 期刊
    # ⚠️ "资讯" 在 Design.md §4.3 已取消，业务必需时按 chart 序列补位并在 handoff 说明
  chart_palette_priority_order:          # spec_doc §4.3 图表序列优先顺序
    - "#4180FD"
    - "#58A8F9"
    - "#8DB6F2"
    - "#96C9ED"
    - "#16C7C7"
    - "#83DDD3"
    - "#4DD164"
    - "#78D986"
    - "#FD7E03"
    - "#F6BA21"
    - "#FBD08A"
    - "#A872E2"
    - "#BA8DE5"
    - "#F779B6"
  page_skeleton_six_containers: spec_doc§3.1 # app-shell / app-frame / app-header(64px) / app-sidebar(200px) / content-shell(margin 16px) / workspace-grid(184px + 1fr + 520px)
  three_segment_workspace: spec_doc§3.2  # 左侧图层 + 中央地图/主视图 + 右侧分析面板（右侧分析面板默认不可删除）
  tab_component: spec_doc§7.3            # 轻量蓝字 + 浅蓝底激活态；不要把主导航塞进 tabs；旧 v1.1 一级/二级分级已取消
  acceptance_checklist: spec_doc§14      # 8 条检查 + 6 条验收 = 14 条；UI / Frontend handoff 必带对照
  forbidden_imports:                     # Design.md §13 硬铁律；CI 应有扫描
    - "antd"
    - "antd/dist/reset.css"
    - "vendor-antd"
  must_read_for_agents: [ux-agent, ui-agent, frontend-agent, qa-agent, architect-agent]

