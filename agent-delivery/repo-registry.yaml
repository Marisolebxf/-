# 仓库注册表：demo（POC）与 lumen（正式）镜像关系
# 来源：GitLab 组 SZCGKX 项目列表（2026-06-16 确认）
# demo2 独立演进，不参与本表；lumen 为全新 fork，不 merge demo2。
# 本地根目录：E:\gkx_src
# GitLab 组：https://gitlab.htmisoft.net/SZCGKX
#
# ⚠️ M1 迁移说明（2026-06-19 起）：
#   本文件 v2 老结构（version 2 / local_root / gitlab_group / repos / cicd 等）保留不动，
#   兼容所有现有 200+ 个 agent 文件的引用；
#   新工作请同时参考头部新增的 `migration_to_gkx_lumen` 段，
#   它登记了 11 个老仓 → 11 个 gkx-lumen 新仓的 GitLab URL / 项目 ID / 迁移状态，
#   以及 4 个不迁移仓的 archive 决议（RFC-002 §13 Q4 + Q4a）。
#   M5 验收完成（路径解耦达标）后，由后续 RFC 决定何时切换主结构指向 gkx-lumen。

version: 2
local_root: E:\gkx_src
gitlab_group: SZCGKX

# ============================================================
# M1 迁移段（2026-06-19 加；RFC-002 §7.3 + §13 Q4/Q4a 决议落地）
# ============================================================
migration_to_gkx_lumen:
  added_at: 2026-06-19
  rfc: RFC-002-gkx-v2-greenfield-rebuild.md
  status: phase_b_complete   # phase_a_complete | phase_b_complete | m2_in_progress | ... | m6_done
  new_local_root: E:\gkx-lumen
  new_workspace_root: E:\gkx-lumen\gkx-orchestration   # 主仓 = orchestration（含 agent-delivery 等编排资产）
  new_repos_root: E:\gkx-lumen\repos                   # 11 个业务子仓 clone 目录
  new_worktrees_root: E:\gkx-lumen\worktrees
  new_gitlab_group: gkx-lumen
  new_gitlab_group_id: 336
  new_gitlab_group_url: https://gitlab.htmisoft.net/gkx-lumen
  legacy_gitlab_groups:
    - { path: SZCGKX, id: 271, url: https://gitlab.htmisoft.net/SZCGKX, status: deprecating, m6_target: archived }
    - { path: gkx1, id: 241, url: https://gitlab.htmisoft.net/gkx1, status: deprecating_partial, note: "仅 demo2/topic_demo 与本项目相关；datascreen/demo 不属本项目（Q4a）" }
  # 11 个迁移仓的映射（path_old → path_new）
  # 老 path 中 group 前缀去掉，按 path 唯一；新 GitLab path 在 gkx-lumen group 下
  migration_map:
    # 主仓（编排资产 + RFC + agent-delivery）— 唯一在 M1 已 push 内容的仓
    - { old_group: SZCGKX, old_path: gkx-orchestration,         old_id: 209, new_path: gkx-orchestration,         new_id: 215, status: pushed,  role: orchestration }
    # 10 业务子仓（M1 仅创建空仓，Phase C M3 起按需迁内容；fresh init 不带老 history）
    - { old_group: gkx1,   old_path: demo2,                     old_id: 151, new_path: demo-ui-science,           new_id: 216, status: empty,   role: frontend_ui_demo_science,        notes: "RFC-002 §7.3：科技信息展示系统前端 demo（Arco/D8/D9 试点真源）" }
    - { old_group: SZCGKX, old_path: ent-analysis-demo,         old_id: 207, new_path: demo-algo-ent-analysis,    new_id: 217, status: empty,   role: python_algorithm_ent,            notes: "RFC-002 §7.3：企业维度算法 demo（NebulaGraph 真源）" }
    - { old_group: SZCGKX, old_path: gkx_dataease,              old_id: 185, new_path: dataease,                  new_id: 218, status: empty,   role: bi_embed,                        notes: "RFC-002 §7.3：开源 DataEase fork（工具不套规约，可不迁；M1 仅建仓占位）" }
    - { old_group: SZCGKX, old_path: gkx_demo_ui,               old_id: 173, new_path: demo-ui-system-test,       new_id: 219, status: empty,   role: frontend_ui_demo_system_test,    notes: "RFC-002 §7.3：系统级实验前端（可观测/算法效果等演示）" }
    - { old_group: SZCGKX, old_path: gkx_lumen_backend,         old_id: 197, new_path: lumen-svc-platform,        new_id: 220, status: empty,   role: java_backend_platform,           notes: "RFC-002 §7.3：后端 Java 微服务正式仓（覆盖两系统）；Q6 决议 feature/ent-metrics-catalog 单独 push 不合 main" }
    - { old_group: SZCGKX, old_path: gkx_lumen_fronted_mobile,  old_id: 199, new_path: lumen-ui-science-mobile,   new_id: 228, status: empty,   role: frontend_lumen_mobile_science,   notes: "RFC-002 §7.3：科技信息展示系统-移动端前端正式仓" }
    - { old_group: SZCGKX, old_path: gkx_lumen_fronted_pc,      old_id: 198, new_path: lumen-ui-science-pc,       new_id: 221, status: empty,   role: frontend_lumen_pc_science,       notes: "RFC-002 §7.3：科技信息展示系统-PC 前端正式仓" }
    - { old_group: SZCGKX, old_path: gkx_service_demo,          old_id: 171, new_path: demo-svc-platform,         new_id: 223, status: empty,   role: java_backend_demo_platform,      notes: "RFC-002 §7.3：demo 环境后端服务（含 gkx-innov + helm gkx-platform 模板）" }
    - { old_group: SZCGKX, old_path: innov-algo-demo,           old_id: 204, new_path: demo-algo-science,         new_id: 224, status: empty,   role: python_algorithm_innov,          notes: "RFC-002 §7.3：创新监测算法 demo（P1–P9 + Nebula 过渡）" }
    - { old_group: gkx1,   old_path: topic_demo,                old_id: 213, new_path: demo-ui-topic,             new_id: 229, status: empty,   role: frontend_ui_demo_topic,          notes: "RFC-002 §7.3：科技专题服务系统前端 demo（当下主战场之一）" }
    - { old_group: SZCGKX, old_path: gkx_lumen_fronted_topic,     old_id: null, new_path: lumen-ui-science-topic,    new_id: 232, status: pushed,  role: frontend_lumen_topic_science,     notes: "E-PLATFORM-P0-L00：科技专题服务系统正式前端（fork pc 框架 + CI NodePort 30892）" }
  # 4 个不迁移仓（RFC-002 §13 Q4 + Q4a 决议），仅加 archive 公告，M6 随老 group archive
  archive_repos:
    - { old_group: SZCGKX, old_path: gkx_ui_demo,         old_id: 172, decision: Q4,  reason: "4 月以来零活跃" }
    - { old_group: SZCGKX, old_path: gkx_demo_python,     old_id: 175, decision: Q4,  reason: "仅 3 commits，已废弃" }
    - { old_group: gkx1,   old_path: datascreen,          old_id: 149, decision: Q4a, reason: "2026-03 以来零活跃，似乎不是本项目（M1 执行中新发现）" }
    - { old_group: gkx1,   old_path: demo,                old_id: 148, decision: Q4a, reason: "2026-03 以来零活跃，似乎不是本项目（M1 执行中新发现）" }
  # 路径解耦：所有引用此结构的脚本/agent，应优先用 ${GKX_ROOT} 环境变量替代 local_root；
  # 旧 local_root: E:\gkx_src 仅作 M2-M4 灰度期兼容，M5 strict 验收时禁止再硬编码。
  path_decoupling_env_var: GKX_ROOT
  branch_policy:
    effective: "2026-06-20"
    orchestration_repo: gkx-orchestration   # 主仓：仅 main，不跑业务 CI
    integration_branch: dev                 # 11 业务子仓统一集成到 dev
    ci_cd_trigger: dev                      # 仅 push dev 触发 GitLab CI/CD（workflow.rules）
    feature_flow: "feat/* → MR/merge → dev → CI/CD → K8s dev"
    main_branch_role: "稳定快照 / 里程碑归档（不触发 CI）"
    script: scripts/apply-dev-branch-policy.ps1
  m6_trigger_conditions:
    - "老根所有未 push 内容已备份到老 GitLab"
    - "M5 验收通过（verify-paths --strict 零残留）"
    - "M2/M3 试运行 + 灰度验收通过"
    - "团队管理者签发"

# ============================================================
# 以下为 v2 老结构（保持原状，不做 break change）
# ============================================================
design_reference:
  repo: gkx1/demo2
  url: https://gitlab.htmisoft.net/gkx1/demo2.git
  deployed_url: https://skxrules.unicomcn.tech:30999/
  policy: read_only_for_agents

# SZCGKX 组项目一览（截图确认）
# 正式 lumen：gkx_lumen_backend | gkx_lumen_fronted_pc | gkx_lumen_fronted_mobile
# demo POC：gkx_service_demo | gkx_demo_ui | gkx_ui_demo | gkx_demo_python
#           innov-algo-demo | ent-analysis-demo | gkx_dataease
# 注：GitLab 仓库名 fronted 为原文拼写（非 frontend）
#
# 架构铁律（三仓职责）：
#   Python 仓 = 全部算法服务（ETL、NLP、图谱、赋分、指数、预测、深度模型）
#   Java 仓   = 业务 API 层（只读 ADS/聚合/SQL 级统计/用户态），禁止写算法逻辑
#   前端仓   = 只调 Java REST，不直连 Python、不直连数据库

architecture:
  algorithm_language: python  # 所有算法服务均为 Python，无 Java 算法模块
  business_api_language: java
  python_repos:
    - innov-algo-demo      # 创新监测 P1–P9
    - ent-analysis-demo    # 企业深度分析 / 图谱构建
    - gkx_demo_python      # 其他 Python 算法 POC
  java_repos:
    - gkx_service_demo / gkx_lumen_backend  # 含 gkx-innov 等业务 REST，非算法
  python_internal_api_only: true

# D8 决策（2026-06-17 初版 / 2026-06-18 升级为 Figma 风格稿落地版）
frontend_design_authority:
  spec_doc: agent-delivery/Design.md     # 2026-06-18 由 v1.1 抽象 UI 框架升级为 Figma 落地稿（14 节）
  authority_level: D8                    # 等同于架构铁律，违反 = architect-agent 拒绝合并
  new_page_stack:                        # 新页面权威栈（含 lumen 与 demo2 沙箱页），Design.md §0 + §13
    framework: "React + Vite"
    ui_library: "Arco Design (@arco-design/web-react)"  # 不引 antd / antd/dist/reset.css
    icon: "@arco-design/web-react/icon"
    charts: "ECharts (echarts-for-react)"
    graphs: "AntV G6 或 ECharts graph"
    maps: "Leaflet"
    date: "dayjs"
    styling: "CSS Modules / 普通 CSS / Tailwind 工具类（必须沉淀 token 到 Design.md §4 CSS 变量）"
  legacy_compatibility:
    demo2_existing: "Ant Design v5（demo2 历史代码保留兼容；禁止新页面回退到 AntD）"
    mix_in_same_page: forbidden          # 同页面 Arco / AntD 混搭禁止
  fixed_primary_color: "#165DFF"         # Design.md §0 + §4.1 主色，不可替换为 #2F6DF6 / #1677FF 等近似蓝
  fixed_page_bg: "#D8E7FC"               # Design.md §0 页面底色
  fixed_control_height: "32px"           # Design.md §0 + §14 验收 #4
  fixed_header_height: "64px"            # Design.md §3.1 + §14 验收 #2
  fixed_sidebar_width_expanded: "200px"  # Design.md §3.1 + §14 验收 #3
  design_tokens_authoritative_source: spec_doc§4+§5+§6+§13   # 基础色 / 字体 / 圆角阴影 / 主题 token 映射
  base_color_css_vars: spec_doc§4.1      # 13 个 CSS 变量（--sci-bg-page / --sci-surface-* / --sci-text-* / --sci-primary* 等）
  fixed_business_factor_color_map:       # 10 类业务要素固定配色（spec_doc §4.3）
    expert: "#4180FD"            # 专家学者
    enterprise: "#16C7C7"        # 企业
    researchInstitution: "#4DD164" # 科研机构 / 机构
    meeting: "#F6BA21"           # 会议
    paper: "#A872E2"             # 论文
    patent: "#58A8F9"            # 专利
    serviceAgency: "#F779B6"     # 服务机构
    project: "#83DDD3"           # 项目
    topic: "#78D986"             # 课题
    journal: "#FBD08A"           # 期刊
    # ⚠️ "资讯" 在 Design.md §4.3 已取消，业务必需时按 chart 序列补位并在 handoff 说明
  chart_palette_priority_order:          # spec_doc §4.3 图表序列优先顺序
    - "#4180FD"
    - "#58A8F9"
    - "#8DB6F2"
    - "#96C9ED"
    - "#16C7C7"
    - "#83DDD3"
    - "#4DD164"
    - "#78D986"
    - "#FD7E03"
    - "#F6BA21"
    - "#FBD08A"
    - "#A872E2"
    - "#BA8DE5"
    - "#F779B6"
  page_skeleton_six_containers: spec_doc§3.1 # app-shell / app-frame / app-header(64px) / app-sidebar(200px) / content-shell(margin 16px) / workspace-grid(184px + 1fr + 520px)
  three_segment_workspace: spec_doc§3.2  # 左侧图层 + 中央地图/主视图 + 右侧分析面板（右侧分析面板默认不可删除）
  tab_component: spec_doc§7.3            # 轻量蓝字 + 浅蓝底激活态；不要把主导航塞进 tabs；旧 v1.1 一级/二级分级已取消
  acceptance_checklist: spec_doc§14      # 8 条检查 + 6 条验收 = 14 条；UI / Frontend handoff 必带对照
  forbidden_imports:                     # Design.md §13 硬铁律；CI 应有扫描
    - "antd"
    - "antd/dist/reset.css"
    - "vendor-antd"
  must_read_for_agents: [ux-agent, ui-agent, frontend-agent, qa-agent, architect-agent]

cicd:
  harbor: harbor.htmisoft.net/gkx
  runner_tag: rag
  namespaces: { dev: dev, uat: uat, prod: prod }
  per_repo:
    innov-algo-demo:
      ci: true
      image: gkx-innov-py
      deploy: deploy:innov-py
      deploy_trigger: manual_on_dev
    gkx_lumen_fronted_pc:
      ci: true
      image: gkx-lumen-pc
      deploy: deploy:k8s
      deploy_trigger: auto_on_dev
      dev_url: http://192.168.88.50:30891
    gkx_lumen_fronted_topic:
      ci: true
      image: gkx-lumen-topic
      deploy: deploy:k8s
      deploy_trigger: auto_on_dev
      dev_url: http://192.168.88.50:30892
    gkx_lumen_backend:
      ci: false  # 待 L02b 移植
      image: gkxlumen-*
      deploy: helm
      deploy_trigger: manual
    gkx_service_demo:
      ci: true
      note: demo 参考模板，含 gkx-innov + helm gkx-platform

repos:
  - id: ui_pc
    role: frontend_pc
    screen: medium  # 中屏；展示系统主交付端
    demo:
      name: gkx_demo_ui
      remote: https://gitlab.htmisoft.net/SZCGKX/gkx_demo_ui.git
      local: E:\gkx_src\gkx_demo_ui
      branch: main
    lumen:
      name: gkx_lumen_fronted_pc
      remote: https://gitlab.htmisoft.net/SZCGKX/gkx_lumen_fronted_pc.git
      local: E:\gkx_src\gkx_lumen_fronted_pc
      branch: dev
      fork_from: gkx_ui_demo
    notes: |
      中屏正式前端。demo2 为 UI 交互真源（只读参考）。
      **已含 observability.ts**（Grafana Tempo/Loki 深链）；新页面须沿用 request 拦截器 traceId。

  - id: ui_mobile
    role: frontend_mobile
    screen: small_large  # 小屏/大屏适配
    demo:
      name: gkx_ui_demo
      remote: https://gitlab.htmisoft.net/SZCGKX/gkx_ui_demo.git
      local: E:\gkx_src\gkx_ui_demo
      branch: main
    lumen:
      name: gkx_lumen_fronted_mobile
      remote: https://gitlab.htmisoft.net/SZCGKX/gkx_lumen_fronted_mobile.git
      local: E:\gkx_src\gkx_lumen_fronted_mobile
      branch: dev
      fork_from: gkx_ui_demo
    notes: E-INNOV-M1 不阻塞；M1 完成后做布局/主题适配。

  - id: ui_topic
    role: frontend_topic
    screen: medium  # 中屏；科技专题服务系统主交付端（/topic）
    demo:
      name: gkx_demo_ui
      remote: https://gitlab.htmisoft.net/SZCGKX/gkx_demo_ui.git
      local: E:\gkx_src\gkx_demo_ui
      branch: main
      note: 专题/图谱视图（entan 等）作只读参考
    lumen:
      name: lumen-ui-science-topic
      remote: https://gitlab.htmisoft.net/gkx-lumen/lumen-ui-science-topic.git
      local: E:\gkx-lumen\repos\lumen-ui-science-topic
      branch: main
      fork_from: lumen-ui-science-pc   # 复用框架/observability.ts/网关配置
      gitlab_project_id: 232
    notes: |
      科技专题服务系统正式前端，承载 /topic/**（专题分析页）。
      只调 Java gkxlumen-topic / gkxlumen-metrics（经网关），不直连 Python/DB。
      复用 gkx_lumen_fronted_pc 的 observability.ts 与 request 拦截器（traceId）。
      架构定位见 architecture-baseline.md（方案 A：与 pc 共享聚合核心）。

  - id: demo2_proto
    role: prototype                 # UI/UE 原型车间（可浏览/可演示/可汇报）
    stack_authority:                # D8（2026-06-18 升级）：以 Design.md（Figma 风格稿落地版）为权威栈
      new_pages: "react + vite + @arco-design/web-react + @arco-design/web-react/icon + echarts + antv-g6 + leaflet + dayjs"  # 新沙箱页必走 Arco
      legacy_existing: "react19 + antd v5 + antv-g6 + leaflet + echarts + tailwind + vite"  # demo2 历史代码兼容保留
      mix_in_same_page: forbidden   # 同页面 Arco / AntD 混搭禁止
      forbidden_imports: ["antd", "antd/dist/reset.css", "vendor-antd"]  # Design.md §13 硬铁律
    dev_cmd: "npm run dev"          # vite --host 127.0.0.1 --port 4176
    sandbox_route_prefix: /sandbox  # ui-agent 试点产物路由前缀，不进主菜单
    demo:
      name: demo2
      remote: https://gitlab.htmisoft.net/gkx1/demo2.git
      local: E:\gkx_src\demo2
      branch: main
      dev_url: https://skxrules.unicomcn.tech:30999/   # 现有演示环境
    propagation:
      to_lumen: forbidden            # 严守铁律：禁止直接 merge 到任何 lumen 仓
      via: frontend-agent_rewrite    # 由 frontend-agent 工程化复刻（同既有 demo→lumen 模式）
    owners:
      primary: [ui-agent, ux-agent]  # 高频改动：原型/页面/IA
      assist: 传统前端工程师          # 复杂交互/工程化辅助
      review: UI_UE_3_humans         # 评审 + 与甲方对齐 + 创意决策
    rules:
      design_spec_compliance: spec_doc§14  # 8 条检查 + 6 条验收 = 14 条；handoff 必带对照
      design_tokens_only: true             # 禁止硬编码颜色/间距/字号；只从 Design.md §4 / §5 / §6 token 导入
      page_skeleton_six_containers: spec_doc§3.1 # app-shell / app-frame / app-header(64px) / app-sidebar(200px) / content-shell / workspace-grid
      three_segment_workspace: spec_doc§3.2  # 左图层 + 中央地图 + 右侧分析（右侧分析不可删除）
      component_library_only: true         # 优先复用 src/components；新组件须经 UI/UE 评审
      page_naming: bid-reference_chapter   # 页面命名/路由按 bid-reference MD 章节号
      mock_data_only: true                 # 不接 lumen 真实 API；只用 mocks/ 下数据
      direction_color_law: "上升红 / 下降绿 / 持平灰；连续量蓝系梯度"
      business_object_color_law: "10 类业务要素遵守 spec_doc§4.3 全局映射（专家/企业/科研机构/会议/论文/专利/服务机构/项目/课题/期刊）"
    notes: |
      原型仓，不进入 lumen 生产链路。
      职责：把 bid-reference 范围 MD 翻译为可浏览/演示/汇报的页面，供甲方评审与团队对齐。
      工作流：bid-reference MD → ux-agent（IA/wireframe）→ ui-agent（demo2 代码）→ UI/UE 评审 → 汇报甲方 → frontend-agent（lumen 工程化复刻）
      **D8（2026-06-18 升级）**：所有新沙箱页权威栈 = @arco-design/web-react + ECharts + AntV G6 + Leaflet；demo2 已有 AntD 代码兼容保留，但同页面禁止混搭。
      token / 配色 / 组件清单 / 验收清单严格按 `agent-delivery/Design.md`（Figma 风格稿落地版，14 节）。

  - id: backend
    role: java_backend
