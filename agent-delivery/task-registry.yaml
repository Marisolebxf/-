# AI Token 预算与成本跟踪策略（详见 agent-delivery/budget-estimate.md）
cost_tracking_policy:
  doc: agent-delivery/budget-estimate.md
  mandatory: true               # 每个 task 完工 handoff 必填以下字段
  fields:
    estimated_tokens: int       # 派单前估算（按 budget-estimate.md §2 模型）
    actual_tokens: int          # 完工后实测 in+out 之和
    model_used: enum            # claude-haiku-4 | claude-sonnet-4.5 | claude-opus-4.7 | claude-opus-4.8 | gpt-5-mini | gpt-5 | gpt-5-pro
    actual_cost: float          # 美元，按下方 cost_formula 自动计算
    cost_warn: enum             # green | yellow($>5) | orange($>10) | red($>20)

  # ──────────────────────────────────────────────────────────────────
  # 统一成本计算口径（v1.2 修订，2026-06-22）
  # ──────────────────────────────────────────────────────────────────
  # 问题：各 agent 回填 actual_cost 口径不一，导致数据不可比
  # 方案：定义标准公式 + 按 agent 类型设定默认 in/out 比例
  # 原则：actual_cost 一律按公式计算，不再接受手工估算
  # ──────────────────────────────────────────────────────────────────
  cost_formula:
    description: |
      actual_cost = actual_tokens × input_ratio × input_price / 1M
                 + actual_tokens × output_ratio × output_price / 1M
      input_ratio + output_ratio = 1.0，按 agent 类型取 default_ratios
      单价取 pricing 表（对齐 budget-estimate.md §1.2）
    rounding: 2

  pricing:                      # $/M tokens，对齐 budget-estimate.md §1.2
    claude-haiku-4:    {input: 0.25,  output: 1.25}
    claude-sonnet-4.5: {input: 3.00,  output: 15.00}
    claude-opus-4.7:   {input: 15.00, output: 75.00}
    claude-opus-4.8:   {input: 15.00, output: 75.00}  # 假设与 4.7 同价，待确认
    gpt-5-mini:        {input: 0.25,  output: 1.25}
    gpt-5:             {input: 3.00,  output: 15.00}
    gpt-5-pro:         {input: 15.00, output: 75.00}

  default_ratios:               # 按 agent 类型设定默认 in/out 比例
    coordinator-agent: {input: 0.95, output: 0.05}  # 派单：读多写极少
    architect-agent:   {input: 0.80, output: 0.20}  # 评审：读设计+写评审结论
    ux-agent:          {input: 0.85, output: 0.15}  # IA/wireframe：读+写规范
    ui-agent:          {input: 0.85, output: 0.15}  # 视觉规范：读+写设计稿
    frontend-agent:    {input: 0.80, output: 0.20}  # 编码：读上下文+写代码
    api-agent:         {input: 0.80, output: 0.20}  # 编码：读上下文+写代码
    algorithm-agent:   {input: 0.75, output: 0.25}  # 算法：读论文+写复杂代码
    data-agent:        {input: 0.80, output: 0.20}  # 数据：读 schema+写脚本
    devops-agent:      {input: 0.85, output: 0.15}  # CI/Helm：读配置+写 yaml
    qa-agent:          {input: 0.80, output: 0.20}  # 测试：读规格+写测试用例
    integration-agent: {input: 0.85, output: 0.15}  # 联调：读文档+写胶水代码

  precise_override:             # 精确回填优先（Console 可获取时）
    fields: [actual_input_tokens, actual_output_tokens]
    when_available: use precise values instead of default_ratios
    note: "在 handoff 中注明 source: console_precise"
  hard_stop_rules:
    - "actual_cost > $20 → 强制 stop + architect 评审是否拆分"
    - "单 task 跑超估算 ×3 → 暂停 + lead 复盘 prompt"
  retro_weekly: agent-delivery/budget-estimate.md#9-每周-retro-模板
  recalibrate_after: 首个 Epic 完成后由 PM 触发 v1.2 重校准
  guardrail_phase: Phase 2     # 当前人工监控；Phase 2 上 Background Agents 时改自动告警

  # v1.2 新增：结构化阈值（可被脚本解析执行，对齐 budget-estimate.md §7）
  cost_thresholds:
    yellow:            {single_task_gt: 5.0,   auto: 'mark cost_warn: yellow',             manual: 'PM 知会'}
    orange:            {single_task_gt: 10.0,  auto: 'pause + notify lead',                manual: '复盘 prompt + 决定是否继续'}
    red_task:          {single_task_gt: 20.0,  auto: 'hard stop + notify architect + PM',  manual: 'architect 评审是否拆分'}
    red_team_day:      {team_daily_gt: 50.0,   auto: 'team standdown',                     manual: '全团队复盘'}
    red_project_month: {project_monthly_gt: 500.0, auto: 'notify PM',                      manual: 'PM 评审是否超范围 / 调预算'}

  budget_aggregation:
    compute_method: sum tasks actual_cost by epic / team / month
    epic_summary: auto-computed from tasks with status=done
    team_summary: auto-computed from tasks.agent grouping
    monthly_summary: auto-computed from tasks.completed_at month
    report_trigger: weekly (every Monday) or on demand
    report_output: agent-delivery/budget-estimate.md §9 retro 模板

  validation:
    mandatory_on_done: true
    check_list:
      - estimated_tokens > 0
      - actual_tokens > 0
      - model_used in valid_enum
      - actual_cost > 0
      - cost_warn matches threshold
    valid_model_enum: [claude-haiku-4, claude-sonnet-4.5, claude-opus-4.7, claude-opus-4.8, gpt-5-mini, gpt-5, gpt-5-pro]
    fail_action: block status→done until all 5 fields valid

# ── Kanban 状态机 + Scrum 节拍（2026-07-11 落地）──────────────────
# 名词与流程：agent-delivery/task-claiming-guide.md
# Sprint 容器：agent-delivery/scrum-sprint.yaml
# 刷新 ready/backlog：scripts/sync-task-ready-status.ps1

task_state_machine:
  version: 1
  effective: "2026-07-11"
  doc: agent-delivery/task-claiming-guide.md
  states: [backlog, ready, claimed, in_progress, review, done, blocked]
  terminal_states: [done]
  legacy_map:
    pending: "运行 sync-task-ready-status.ps1 → backlog | ready | blocked"
    completed: done
  transitions:
    backlog: [ready, blocked]
    ready: [claimed, blocked]
    claimed: [in_progress, ready, blocked]
    in_progress: [review, blocked]
    review: [done, in_progress]
    blocked: [backlog, ready]
    done: []
  auto_ready:
    script: scripts/sync-task-ready-status.ps1
    rule: "depends_on 全 done 且无 blocked_by → ready；有 blocked_by → blocked；否则 backlog"
  claim_policy:
    doc: agent-delivery/task-claiming-guide.md
    name_format: human:中文真名
    required_on_claim: [claimed_by, supervised_by, claim_type, claimed_at, lock_until]
    claim_types: [pull, coordinator_dispatch]
    default_lock_hours: 4
    background_lock_hours: 24
    convoy: agent-delivery/dispatch-queue.yaml#convoy_groups
    lease_recovery: scripts/recover-expired-leases.mjs
    find_supervisor_slot: scripts/find-supervisor-slot.mjs
    supervisor_cap: "team-roster.yaml#max_agent_concurrency = 本机 Cursor 会话上限；≠派单/registry 挂载上限"
  fields:
    claimed_by: "human:{真名} 或 agent:{role}"
    supervised_by: "human:{真名}；Agent 执行必填"
    claim_type: "pull | coordinator_dispatch"
    claimed_at: ISO8601
    lock_until: ISO8601
    update_time: "ISO8601 +08:00；任务创建/状态/认领/备注等任意字段变更时必刷；飞书「更新时间」可排序"
    sprint_id: "scrum-sprint.yaml sprints[].id"
    blocked_by: "阻塞原因文字"
    effort_points: "1|2|3|5|8|13；派单时 coordinator 必填（贡献分）"
    difficulty: "S|M|L|XL；派单时 coordinator 必填（难度档）"
    delivery_phase: "definition|implementation|crosscut；飞书「交付阶段」投影；派单时宜填"
    subcoord: "见 graph_engineering_policy；新 leaf 宜填"
    graph_role: "leaf|fan-out|fan-in|gate；新 leaf 宜填"
    ods_dependency_phase: "phase1_pending_ods|phase2_mapped|n/a；数据相关必填"
    touched_files: "glob 列表；同仓并行必填（B3 Convoy 自动检测）"
    convoy: "可选；显式 Convoy 组名（见 dispatch-queue.yaml#convoy_groups）"

# ── 更新时间（飞书看板排序 · 2026-07-29）──────────────────────────
# 真源：task.update_time；写入入口：scripts/lib/task-registry-lib.mjs#touchUpdateTime
# 飞书列「更新时间」见 feishu-bitable.yaml（DateTime，outbound 投影毫秒时间戳）
update_time_policy:
  version: 1
  effective: "2026-07-29"
  owner: coordinator
  field: update_time
  format: "ISO8601 Asia/Shanghai +08:00"
  required_on: [create, status_change, claim, heartbeat, note_patch, any_field_mutation]
  writers:
    - scripts/lib/task-registry-lib.mjs#updateTaskFields
    - scripts/lib/board-task-status.mjs
    - scripts/recover-expired-leases.mjs
    - scripts/coordinator-dispatch.mjs
    - scripts/sync-task-ready-status.ps1
  backfill: scripts/backfill-update-time.mjs
  feishu_column: "更新时间"
  note: "手工改 YAML 时也须同步刷 update_time；否则飞书排序滞后。优先走 board-task-status / updateTaskFields。"

# ── Graph Engineering 拓扑元数据（2026-07-28）──────────────────────
# 真源：智能体编排与派单手册.md §十六 · Graph-Engineering-ODS解耦-会话纪要-2026-07-28.md
# 本机 Cursor 会话 ≠ 派单上限：见 claim_policy + team-roster#capacity_policy
graph_engineering_policy:
  version: 1
  effective: "2026-07-28"
  owner: coordinator
  docs:
    handbook: agent-delivery/智能体编排与派单手册.md
    session: agent-delivery/agent-handoffs/编排方法论/Graph-Engineering-ODS解耦-会话纪要-2026-07-28.md
    lineage: agent-delivery/data-lineage-policy.md
    refinery: agent-delivery/refinery-merge-queue.md
  concurrency:
    supervisor_cap_field: max_agent_concurrency   # 本机 Cursor agent 会话上限（非派单）
    supervisor_default_cap: 4
    meaning: local_cursor_agent_sessions
    registry_mount_cap: null                      # 同一 supervised_by 挂载无上限
    coordinator_dispatch_cap: null                # 派单无上限；find-slot 仅亲和参考
    find_slot: scripts/find-supervisor-slot.mjs
    find_slot_role: advisory_affinity_only
    recover_leases: scripts/recover-expired-leases.mjs
  lease_recovery:
    claimed_expired: "status→ready；清空 claimed_by/supervised_by/claim_type/claimed_at/lock_until"
    in_progress_expired: "默认仅告警；--include-in-progress 时 status→blocked + blocked_by=lease_expired"
    review_expired: ignore
  convoy_auto:
    detect: scripts/detect-convoy-conflicts.mjs
    lib: scripts/lib/convoy-lib.mjs
    rules:
      - "显式 convoy 同组 + serial → 硬冲突（不可并行认领）"
      - "同 repo + touched_files glob 重叠 → 硬冲突"
      - "同 repo 但任一方缺 touched_files → 软警告（--strict 时失败；agent-delivery 豁免）"
    soft_warn_skip_repos: [agent-delivery]
    required_on_parallel_same_repo: [touched_files]
    dispatch_queue_groups: agent-delivery/dispatch-queue.yaml#convoy_groups
  coordinator_loop:
    script: scripts/coordinator-loop.mjs
    path: A_light
    decision: "2026-07-28：不接 Cursor SDK 自动开会话；串联 lease→ready→convoy→slot→scan→人工确认派单"
    does_not: [auto_open_cursor_agent, auto_confirm_without_human, auto_git_push]
  refinery:
    status: scaffold_only
    enabled_default: false
    doc: agent-delivery/refinery-merge-queue.md
    queue: agent-delivery/refinery-queue.yaml
    enqueue: scripts/refinery-enqueue.mjs
  subcoords:
    - id: platform-subcoord
      agents: [devops, api, integration]
      mission: 平台基建 CI/Helm/网关/Java 聚合
    - id: data-algo-subcoord
      agents: [data, algorithm]
      mission: 项目自研 DWD→ADS + Python 算法（产数据）
    - id: lineage-subcoord
      agents: [data, architect]
      mission: 表级/指标级血缘闸门；Phase1 标 pending_ods；风险升级甲方决策清单
    - id: metric-subcoord
      agents: [algorithm, data, doc]
      mission: metric 8 件套口径；横切消费 lineage
    - id: ui-subcoord
      agents: [ux, ui, frontend]
      mission: IA→demo 沙箱→lumen 复刻
    - id: assurance-subcoord
      agents: [qa]
      mission: MD 对照验收 + Tempo/Loki 三联查
    - id: doc-subcoord
      agents: [doc]
      mission: Epic 末 fan-in 汇编验收材料
  agent_default_subcoord:
    devops: platform-subcoord
    api: platform-subcoord
    integration: platform-subcoord
    data: data-algo-subcoord
    algorithm: data-algo-subcoord
    ux: ui-subcoord
    ui: ui-subcoord
    frontend: ui-subcoord
    qa: assurance-subcoord
    doc: doc-subcoord
    architect: lineage-subcoord
  graph_roles: [leaf, fan-out, fan-in, gate]
  ods_dependency_phases:
    phase1_pending_ods: "现在~2026-08-20；项目自研 DWD；不做 ODS→DWD 映射"
    phase2_mapped: "8/20 后；GDF 映射 + lineage 验证通过"
    n/a: "纯平台/UI 壳/文档等不依赖 ODS 的任务"
  required_on_new_leaf:
    recommended: [subcoord, graph_role, ods_dependency_phase]
    note: "历史任务不强制回填；新派单宜填。数据/指标类 ods_dependency_phase 不可省略（用 phase1_pending_ods 或 phase2_mapped）"

# ── 交付阶段（定义 / 实现分流 · 2026-07-21）──────────────────────
# 真源：task.delivery_phase；飞书列「交付阶段」见 feishu-bitable.yaml
# 规程：definition → 产品定义评审规程；implementation → 产品实现规程；crosscut → 平台/编排等
delivery_phase_policy:
  version: 1
  effective: "2026-07-21"
  owner: coordinator
  values: [definition, implementation, crosscut]
  feishu_column: "交付阶段"
  docs:
    definition: agent-delivery/产品定义评审规程.md
    implementation: agent-delivery/产品实现规程.md
  classify: agent-delivery/feishu-bitable.yaml#delivery_phase_classify
  backfill: scripts/backfill-delivery-phase.mjs
  views:
    - "飞书筛选视图：交付阶段=定义"
    - "飞书筛选视图：交付阶段=实现"
    - "飞书表格分组：功能模块 → 交付阶段"

# ── 贡献分 / 难度（绩效汇总用 · 2026-07-13）──────────────────────
# 真源：task 上的 effort_points + difficulty；飞书投影列见 feishu-bitable.yaml
# 结算：个人贡献分 = Σ effort_points（status=done，默认归属 claimed_by）
contribution_policy:
  version: 1
  effective: "2026-07-13"
  owner: coordinator          # 派单时填写；Lead 可复议后改
  fields:
    effort_points: [1, 2, 3, 5, 8, 13]
    difficulty: [S, M, L, XL]
  settle:
    formula: "sum(effort_points) where status=done"
    credit_default: claimed_by
    note: "多人拆分可选 credit_share；actual_tokens/cost 不计入人力绩效"
  backfill:
    script: scripts/backfill-effort-points.mjs
    heuristic: token_v1       # 按 estimated_tokens 初标；effort_source=backfill_token_heuristic
    mapping:
      - { tokens_lt: 100000,  difficulty: S,  effort_points: 1 }
      - { tokens_lt: 300000,  difficulty: M,  effort_points: 3 }
      - { tokens_lt: 600000,  difficulty: L,  effort_points: 5 }
      - { tokens_lt: 1000000, difficulty: XL, effort_points: 8 }
      - { tokens_lt: null,    difficulty: XL, effort_points: 13 }  # >=1M 或未知默认见脚本
  report: scripts/report-contribution.mjs
  feishu_columns: [贡献分, 难度]

scrum_policy:
  doc: agent-delivery/scrum-sprint.yaml
  human_board: feishu_bitable              # Phase 0；审批通过后改为 feishu_project
  feishu_bitable: agent-delivery/feishu-bitable.yaml
  feishu_project: agent-delivery/feishu-project.yaml   # deferred
  current_sprint: "2026-W28"
  sprint_length_weeks: 2
  ceremonies:
    planning: {when: "Sprint 第1周一 90min", owner: PM}
    daily: {when: "每工作日 09:30 15min", owner: "各 team lead"}
    review: {when: "Sprint 末隔周五演示", owner: "PM + UI/UE"}
    retro: {when: "Sprint 末周五 60min", owner: PM}
  sprint_commit_rules:
    - "仅 sprint committed_task_ids 内 task 可优先 Pull；stretch 有余力再做"
    - "Sprint 外 silent 加活禁止；须 PM swap 或下 Sprint 排入"
    - "Ready 队列由 coordinator 维护；Planning 时 PM 写 sprint_id"

epics:
  - id: E-TECH-NEWS-IE-M1
