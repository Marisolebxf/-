# AI Token 预算与成本跟踪策略（详见 agent-delivery/budget-estimate.md）
cost_tracking_policy:
  doc: agent-delivery/budget-estimate.md
  mandatory: true               # 每个 task 完工 handoff 必填以下 4 字段
  fields:
    estimated_tokens: int       # 派单前估算（按 budget-estimate.md §2 模型）
    actual_tokens: int          # 完工后实测 in+out 之和
    model_used: enum            # claude-haiku-4 | claude-sonnet-4.5 | claude-opus-4.7 | gpt-5-mini | gpt-5 | gpt-5-pro
    actual_cost: float          # 美元，按 model_used 的公开价表算
    cost_warn: enum             # green | yellow($>5) | orange($>10) | red($>20)
  hard_stop_rules:
    - "actual_cost > $20 → 强制 stop + architect 评审是否拆分"
    - "单 task 跑超估算 ×3 → 暂停 + lead 复盘 prompt"
  retro_weekly: agent-delivery/budget-estimate.md#9-每周-retro-模板
  recalibrate_after: 首个 Epic 完成后由 PM 触发 v1.2 重校准
  guardrail_phase: Phase 2     # 当前人工监控；Phase 2 上 Background Agents 时改自动告警

