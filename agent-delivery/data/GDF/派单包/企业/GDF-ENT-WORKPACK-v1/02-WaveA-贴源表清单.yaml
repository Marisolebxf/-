# GDF-ENT Wave A 贴源表清单
# ---------------------------------------------------------------------------
# 承诺表真源（2026-07-31 起）：
#   agent-delivery/data/third-party-source/doc/
#   及 md-extract/（版权人才企业机构政策 + 市场研究/产业链）
# live 核验对照（非承诺清单）：
#   third-party-source/gkx-mysql-raw/SOURCE-TABLES.md
# ---------------------------------------------------------------------------
# 源：MySQL gkx.<表名>（只读；落库名以承诺英文表名为准，可能与 live 旧名不一致）
# 目标：MySQL gkxlumenx_ods.<同名表>
# prio: P0=关单必做 | P1=风险/海外/招投标明细等 | P2=本包不纳入（见 exclude / deferred）
# priority_status: team_default → 启动会确认后 confirmed

version: GDF-ENT-WORKPACK-v1.2
updated: "2026-07-31"
source_authority: third-party-source/doc
source_authority_extract: third-party-source/doc/md-extract
source_db: gkx
target_db: gkxlumenx_ods
mirror_mode: isomorphic
default_filter: "is_deleted = 0"
priority_status: team_default

exclude:
  - pattern: "ods_*"
    reason: 供应方不暴露；承诺表中偶见 ods_ 行，正式产线不配
  - pattern: "*_bak_*"
    reason: 备份表
  - pattern: "dwd_company*"
    reason: 已确认暂不贴源
  - pattern: "company_*"
    reason: 量子专题工商簇（承诺表无 dwd_ 前缀）；等同 company*，暂不贴源（2026-07-31）
  - pattern: "hycy_*"
    reason: 海洋专题表，非本波企业核心；另立项
  - pattern: "industry_code"
    reason: 量子/海洋 Sheet 内行业码短名；产业链侧另有承诺表，不按专题短名镜像

# 相对 live SOURCE-TABLES 的关键命名差（贴源时以承诺名为目标表名）
naming_delta_vs_live:
  - promised: dwd_org_base_info
    live_often_seen: dwd_org_reg_info
    action: 按承诺名 dwd_org_base_info 建目标表；若源库仅有 reg_info，启动会登记供应方核验
  - promised: dwd_org_heis_info
    live_often_seen: dwd_org_hels_info
    action: 按承诺名 heis；缺表则核验
  - promised: dwd_bid_*_out
    live_often_seen: dwd_org_bid_info
    action: 按承诺四张招投标出库表镜像，不以 org_bid_info 替代

groups:

  - id: org_master_cn
    title: 国内机构-主数据与经营（承诺：版权人才…/国内机构要素库）
    source_sheet: 版权人才、企业机构、政策数据汇总表.xlsx / 国内机构要素库
    tables:
      - { name: dwd_org_base_info, priority: P0, cn: 国内机构信息, note: 企业主数据；非 reg_info }
      - { name: dwd_org_shareholder_info, priority: P0, cn: 股东信息 }
      - { name: dwd_org_executive_info, priority: P0, cn: 高管信息 }
      - { name: dwd_org_org_product_info, priority: P0, cn: 经营信息 }
      - { name: dwd_org_annual_financial_info, priority: P0, cn: 年报财务信息 }
      - { name: dwd_org_important_news_info, priority: P0, cn: 重点资讯 }
      - { name: dwd_org_stock_base, priority: P0, cn: 上市企业基本信息 }
      - { name: dwd_org_stock_finance_info, priority: P0, cn: 上市企业主要财务指标 }
      - { name: dwd_org_heis_info, priority: P0, cn: 高校机构信息, note: 承诺拼写 heis }
      - { name: dwd_research_institute_base_info, priority: P0, cn: 科研机构基本信息 }
      - { name: dwd_org_changerecord_info, priority: P1, cn: 工商变更信息 }
      - { name: dwd_org_recruit_info, priority: P1, cn: 招聘信息 }

  - id: org_special_region
    title: 港澳台企业（承诺：国内机构要素库）
    source_sheet: 版权人才、企业机构、政策数据汇总表.xlsx / 国内机构要素库
