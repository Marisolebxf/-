    GDF 贴源不管 demo_gkxlumenx_*。
    chain_dtl / pat_dtl 在 pending_source_requests；先洗 tags 可覆盖字段。链专利本期不洗。
    dwd_org_sc_info 在 candidate_unconfirmed（潜在可能，不贴不洗）。
    并购 dwd_org_merger_acquisition_info：Q-WP3-21 P2 mirror_only，不洗不建 DWD。
