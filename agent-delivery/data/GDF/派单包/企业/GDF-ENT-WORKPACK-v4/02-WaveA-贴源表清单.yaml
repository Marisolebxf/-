  note: |
    v3.1.6（2026-10-20）：扩入 5 张（专利发明人 + 司法明细/年报 base/年报 asset/利润表，16 号文 A7 拍板③）；专利四分表补登记；ODS 56 张结构已建成终验（脚本归档包外 GDF/ODS建表DDL-已执行-20261020/）。
    产业/企业拆分对称声明（16 号文附录 A / CHAIN 09 §1.3）：按目标表拆责任——industry_chain* 三表归 CHAIN 包洗；enterprise_industry_chain 归本包洗，与 entity_rel 同键（org_id + INB node_id）；product_tags 仅本包洗；news 两包均不洗。Wave A 贴源只贴一次，两包共用 ODS。
