# 三方源缺口索引（sidecar）
#
# 给「指标进度统计」Excel「源缺口」列用。
# 不是 8 件套（身份证在 seed / MCP kit）。
# 不是 D3 枚举真源（D3 仍在 metric-readiness-matrix-*；本波不改 D3、不改绿）。
# 有本文件 metrics.{id}.summary 则导出优先用它，否则回落矩阵 d3_gap。
# 禁止把按日流水账写入矩阵 YAML；日志只写各域 md。
#
# Excel 单元格（PROGRESS-L01）：[{as_of}] {summary}
# 口头计数：source_gap_indexed / source_gap_fallback / source_gap_empty
#
# schema 锁定：DATA-SUPPLIER-Q-METHOD-L01 / 派单包 §4。
# POLICY 切片：DATA-SUPPLIER-Q-POLICY-L01（2026-09-01）已 upsert 卡住的 metric_id。

# version: sidecar schema 版本（整数）。当前 1。PROGRESS 只认本版字段名。
version: 1

# updated: 本 YAML 最近一次写入日期（YYYY-MM-DD）。与单条 as_of 可不同。
updated: "2026-09-01"

# metrics: 以 metric_id 为键。空对象 = 尚无索引，进度表整列回落 d3_gap。
# 每条必填字段（PROGRESS 依赖这些键；缺键视为该 metric 无 sidecar）：
#
#   metrics.{metric_id}:
#     as_of: "YYYY-MM-DD"     # 最近一次分析日（写入现行待回复 / 日志的那天）
#     algorithm_type: STAT    # 本波：STAT | COMPUTE | MODEL | third_party | GRAPH | UNKNOWN
#                             # 不要写入 MIXED / LITERATURE（本波跳过）
#     q_id: POLICY-P0-3      # 现行待回复题号；一列一题，多指标可共用同一 q_id
#     summary: "…"            # ≤80 字。空值率、缺码、枚举对不上等；不要贴整段日志
#     domain: POLICY          # 域码：ENT | CHAIN | SVC | POLICY | SYNTH | INNOV | ORG | TALENT | TECH | COMMON | TNIE
#                             # 综合 = SYNTH（不是 COMP）
#
# 注释示例（不要当作真实条目取消注释；域切片叶 upsert 真 metric_id）：
#   M_EXAMPLE:
#     as_of: "2026-09-01"
#     algorithm_type: STAT
#     q_id: POLICY-P0-3
#     summary: "无 INB 产业码；theme 95.7% 为字符串 NULL"
#     domain: POLICY

