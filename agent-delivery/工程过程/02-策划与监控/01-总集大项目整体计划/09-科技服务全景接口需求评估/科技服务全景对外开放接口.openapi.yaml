  /szc/v1/open/exchange/activity/detail:
    get:
      tags: [科技交流]
      summary: 资源推荐与专家信息接口（活动详情）
      operationId: getOpenExchangeActivityDetail
      description: |
        需求 2.7.3.3 S-02「支持列表与详情」的详情侧，同时对应 S-03 的「详情弹窗」场景。

        ### 与列表接口的关系
        **响应恒是列表项的超集。** 列表里有的字段这里全都有，字段名、类型、语义、取值
        完全一致（服务端是同一份装配逻辑），展示端可以用同一套解析处理列表卡片与详情弹窗。

        多出来的只有两项，都是列表刻意不带的：

        | 字段 | 说明 |
        | --- | --- |
        | `content` | 活动正文（富文本）。整页带出会让列表响应体积失控，所以只在详情下发 |
        | `agenda` | 完整议程。列表只给去重后的讲者姓名（`exchange.speakers` / `reasoning.speakers`） |

        ### 不自增浏览量
        平台内的详情接口每次访问都会给活动浏览量加一。本接口**不自增**，
        外部系统按需轮询不会污染平台内的统计数字。也就是说响应里的 `viewCount`
        不会因为调用本接口而变化。

        ### 各类的正文与议程覆盖情况
        | activityType | content 来源与填充率 | agenda |
        | --- | --- | :-: |
        | `exchange` | 活动正文，19/19 有值 | ✅ |
        | `reasoning` | 活动正文，109/113 有值 | ✅ |
        | `live` | 活动正文，24/24 有值 | ✕ 无议程表 |
        | `course` | **恒为空串**，课程没有正文列 | ✕ 无议程表 |

        `live` 没有议程表，它的讲者在 `live.hostName` 与 `live.speakerNames` 上；
        `course` 的章节是另一套结构、不是议程，课程的文字介绍在
        `course.introduction` 与 `course.teacherInfo` 上。

        ### 查不到的处理
        未审核、已下架、已删除、仅认证用户可见的活动**一律按不存在处理**，
        与「ID 压根不存在」返回同一个错误，不区分原因。这是有意的：
        区分开会让调用方拿 ID 逐个探测，从响应差异反推出活动的内部状态。
      parameters:
        - name: activityType
          in: query
          required: true
          description: |
            活动类型，取值与列表接口一致。
            **必须与 `activityId` 配对**：四类的 ID 空间彼此独立
            （`course` 是字符串业务编号，其余三类是活动主键），
            同一个数字在不同类型下指向不同的活动，只给 ID 无法定位唯一一条。
          schema:
            type: string
            enum: [exchange, reasoning, live, course]
        - name: activityId
          in: query
          required: true
          description: 活动标识，取列表响应里 `activityId` 的原值
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: |
            gkx-core 正常处理的成功及业务错误以 `code` 区分：`code=0` 成功，非 0 为业务错误。
            代理、网络或超时等基础设施失败可能使用非 200 HTTP 状态。
          content:
            application/json:
