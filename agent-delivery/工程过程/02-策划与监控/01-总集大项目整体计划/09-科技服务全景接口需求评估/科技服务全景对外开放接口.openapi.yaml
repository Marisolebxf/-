  /szc/v1/open/exchange/activity/list:
    get:
      tags: [科技交流]
      summary: 活动数据接口（四类活动列表）
      operationId: listOpenExchangeActivities
      description: |
        需求 2.7.3.3 科技交流活动数据接口。按活动类型返回平台对外可见的活动列表。

        ### 四类活动与查询方式

        `activityType` **必填**，一次只查一类：

        | activityType | 平台侧对应 | 特有字段对象 |
        | --- | --- | --- |
        | `exchange` | 科技交流活动 | `exchange` |
        | `reasoning` | 科技思辨 | `reasoning` |
        | `live` | 科技直播 | `live` |
        | `course` | 科技竞赛下的课程 | `course` |

        **不支持跨类型合并查询。** 四类在平台侧的数据源不同（前三类在活动主表按业务类型区分，
        课程在课程表），可见性判定与状态语义也不同，合并分页会让 `total` 与排序失去确定性。
        需要混合展示时请分别拉取后在展示端合并。

        ### 响应结构

        响应分两层：四类共有的统一字段（标题、简介、封面、起止时间、进度状态、主办方、
        详情页链接、更新时间）直接放在列表项上，可用同一套模板渲染四类卡片；
        各类特有信息放在 `exchange` / `reasoning` / `live` / `course` 四个对象里，
        **只有与 `activityType` 匹配的那个非 null**，其余三个恒为 null。

        ### 可见性

        由服务端固定，调用方无法放宽。四类各自沿用平台内对未登录访客的口径：

        - `exchange`：已审核通过 + 已上线 + 推广范围为全体用户
        - `reasoning`：已上线 + 审核通过 + 状态在筹备中/待开始/进行中/已结束内（排除草稿与已取消）
          + 非「认证用户专属」
        - `live`：已上架 + 审核通过 + 未取消
        - `course`：已上架 + 非隐藏课非机构课 + 定时发布已到点 + 非「认证用户专属」

        **四类都不过滤已归档数据**，与平台内列表行为一致。科技交流的归档状态通过
        `exchange.isArchived` 下发，展示端若只想展示在办活动可按它自行剔除。

        ### 筛选维度支持矩阵

        原型筛选区共 6 项，各类的支持情况：

        | 原型筛选 | 参数 | exchange | reasoning | live | course |
        | --- | --- | :-: | :-: | :-: | :-: |
        | 活动时间 | `timeRange` | ✅ | ✅ | ✅ | ✅ |
        | 活动状态 | `status` | ✅ | ✅ | ✅ | ✅ |
        | 活动类型 | `categoryId` | ✅ | ✕ | — | ✕ |
        | 活动类型（直播） | `liveType` | — | — | ✅ | — |
        | 技术领域 | `subjectAreaId` | ✅ | ✕ | ✅ | ✕ |
        | 活动规模 | — | ✕ | ✕ | ✕ | ✕ |
        | 活动地点 / 地图视图 | — | ✕ | ✕ | ✕ | ✕ |

        ✅ 支持　✕ 平台侧无数据　— 该类无此维度

        「活动类型」在原型上是一个下拉，但平台侧落在两个不同的字段上
        （交流活动是主表数字列、科技直播是扩展表字符串列，枚举完全不同），
        所以拆成 `categoryId` 与 `liveType` 两个参数，按 `activityType` 二选一。

        不支持项的具体原因：

        - **活动规模（国际 / 国内 / 区域 / 市级）**：这是活动的**级别与地域范围**，
          平台侧四类活动上都没有这个维度。已核查：活动主表与三张扩展表的全部列里
          没有任何级别或地域范围列；交流扩展表的预留 JSON 列实测 0/78 有值；
          字典表里也搜不到这组取值。

          全平台唯一有级别概念的是**竞赛**（`competition.competition_level`），
          但它的枚举是「国家级 / 省级 / 市级 / 区县级 / 行业级 / 学校级」，
          既不是原型这四档，也不适用于交流活动。

          要支持这一项需要给活动表加级别列并补录历史数据，属于表结构变更。

        - **活动地点与地图视图**：平台侧没有经纬度列，活动地点只有文字地址
          （见 `exchange.venueAddress`，且仅 `exchange` 有；举办城市列被写死为空串）。
          地图撒点无法交付，只能提供列表视图。

        - **`reasoning` 的活动类型与技术领域**：这两列在科技思辨链路零写入
          （实测 113 条可见活动的类别与学科门类全为 0）。思辨有自己的分类维度，
          见 `reasoning.category`（自由文本）与 `reasoning.keywords`。

        - **`course` 的活动类型与技术领域**：课程表没有这两列，课程的分类数据在开课申请的
          标签字段上，与活动的类别体系不同源。

        **与平台内接口对数时注意身份差异**：平台内列表对已登录的认证专家会额外放开
        「仅认证用户可见」的活动，而本接口一律按未登录访客口径。所以用登录态调用
        平台内接口拿到的条数可能比本接口多，差值就是这类定向活动。
      parameters:
        - name: activityType
          in: query
          required: true
          description: |
            活动类型。`exchange` 科技交流活动 / `reasoning` 科技思辨 /
            `live` 科技直播 / `course` 科技竞赛下的课程。
          schema:
            type: string
            enum: [exchange, reasoning, live, course]
        - name: keyword
          in: query
          required: false
          description: 关键词，模糊匹配标题与简介
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          required: false
          description: |
            进度档位筛选。取值与响应里的 `status` 字段**完全一致**，
            即「响应说自己是某档」就一定「用该档能筛出来」。

            - `upcoming` 未开始（含报名中、筹备中、待开始、未开课）
            - `ongoing` 进行中（含直播中、开课中）
            - `ended` 已结束

            四类的原始状态口径不同，这里折叠成统一三档，详见响应 `status` 字段说明。
          schema:
            type: string
            enum: [upcoming, ongoing, ended]
        - name: timeRange
          in: query
          required: false
          description: |
            活动时间（原型「活动时间」下拉）。不传即「全部时间」。

            - `thisWeek` 本周（周一为周首日）
            - `thisMonth` 本月
            - `thisQuarter` 本季度

            **四类都生效**，按活动开始时间判定，课程按开课时间。
            语义是「开始时间落在该自然区间内」。未填开始时间的活动不会被任一档位选中——
            开始时间未知，无法断言它落在哪个区间。

            区间由服务端按服务进程时区换算成绝对时间后下推，不依赖数据库时区。
          schema:
            type: string
            enum: [thisWeek, thisMonth, thisQuarter]
        - name: categoryId
          in: query
          required: false
          description: |
            活动类别（原型「活动类型」下拉）。**仅 `activityType=exchange` 生效。**

            | 取值 | 名称 |
            | --: | --- |
            | 1 | 学术交流 |
            | 2 | 专题研讨 |
            | 3 | 技术讲座 |
            | 4 | 专业论坛 |
            | 5 | 合作项目 |
            | 6 | 行业资讯 |

            取值范围以平台侧创建活动的入参定义为准，是 1..6。
            数据库列注释只写了 1..4，那是注释没跟上，别按它理解。
            测试环境实测只有 1..4 有数据：1 有 11 条、2 有 4 条、3 有 1 条、4 有 3 条。

            科技思辨的类别列在平台侧零写入、课程没有该列，这两类传了不生效。
            科技直播的类型维度是另一个字段，见 `liveType`。
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5, 6]
        - name: liveType
          in: query
          required: false
          description: |
            直播类型。**仅 `activityType=live` 生效。**

            它与上面的 `categoryId` 是**同一个原型筛选项「活动类型」**的两种落法：
            平台侧交流活动的类别是活动主表上的数字列（`categoryId`），
            科技直播的类型是直播扩展表上的字符串列（本参数），
            两者不同表、不同类型、枚举也完全不同，没法合成一个参数，
            所以按 `activityType` 分开传。

            平台侧完整枚举：

            | 取值 | 名称 |
            | --- | --- |
            | `lecture` | 学术讲座 |
            | `seminar` | 研讨会 |
            | `review` | 评审会 |
            | `open_class` | 公开课 |
            | `training` | 技术培训 |
            | `other` | 其他 |

            测试环境实测只有前三种有数据：`seminar` 12 条、`lecture` 10 条、`review` 2 条。

            **刻意不做枚举校验**：枚举定义在数据库列上、平台侧随时可能加档位，
            写死在接口校验里会导致新档位一上线就被拒掉。
            响应里的 `live.liveType` 返回同一套取值。
          schema: { type: string, maxLength: 32 }
        - name: subjectAreaId
          in: query
          required: false
          description: |
            学科门类（原型「技术领域」下拉）。**仅 `exchange` 与 `live` 生效**，取值 1..13。

            **注意这不是产业集群。** 活动主表上没有产业集群列，只有学科门类。
            两者粒度不同——学科门类是哲学/理学/工学这类学科划分，
            产业集群是智能机器人/量子信息这类产业方向。原型「产业集群 / 产业」
            这个维度在活动数据上没有对应字段，只能用学科门类近似。

            科技思辨的学科门类列在平台侧零写入（实测 113 条可见活动全为 0），
            课程没有该列，这两类传了也不会生效。
          schema: { type: integer, minimum: 1, maximum: 13 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeActivityListResponse' }
              examples:
                科技交流活动:
                  value:
