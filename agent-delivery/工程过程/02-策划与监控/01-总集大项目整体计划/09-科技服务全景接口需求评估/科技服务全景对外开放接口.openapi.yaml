openapi: 3.0.3

info:
  title: 科技服务全景对外开放接口
  version: 1.0.0
  description: |
    深圳市科技创新局国际科技信息中心项目，科技服务全景板块对外数据接口。
    对应招投标需求 2.7.3.3 / 2.7.4.3 / 2.7.5.3「接口开发设计」。

    ## 通用约定

    **响应包装**：gkx-core 正常处理的成功、参数校验失败和业务失败均使用统一 JSON envelope，
    业务结果以响应体的 `code` 区分；gkx-tics-api 仅透传上游响应，不二次包装。
    反向代理、网络、超时等基础设施失败可返回非 200，调用方应同时处理 HTTP 状态与业务 envelope。

    - 成功：`{"code": 0, "data": {...}}`
    - core 业务/校验失败：`{"code": 148888, "error": "错误描述"}`

    **鉴权**：本组接口公开只读，不要求登录。带与不带 JWT 返回结果一致，
    接口不依赖调用者身份，也不会因调用者不同而返回不同数据。

    **时间格式**：除活动详情的 `agenda[].startTime` / `agenda[].endTime` 外，所有时间戳输出为 RFC3339，
    如 `2026-06-01T10:00:00+08:00`；可空时间字段无值时返回 `null`。议程两个时间字段是主办方录入的原始文本，
    可能是 `14:00`、`2006-01-02 15:04:05` 或空串，调用方不得按 RFC3339 强制解析。

    **分页**：普通分页接口的 `page` 从 1 开始，`pageSize` 默认 20、上限 100；
    `/exchange/activity/sync` 与 `/communication/content/sync` 的 `pageSize` 默认 20、上限 200。

    ## 关于「字段缺失」的说明

    本文档只声明在本系统内确实有录入来源的字段。以下需求项经核对确认**平台侧无数据**，
    因此不在任何响应结构中出现，请对接方不要按这些字段设计展示：

    | 需求项 | 不下发原因 |
    | --- | --- |
    | 竞赛奖金 | `competition.prize_total` 无任何写入入口；奖品表无创建入口；无发放流程 |
    | 竞赛奖项设置 | `competition_awards` 无写入入口 |
    | 竞赛影响力 / 影响范围 | 无对应设计 |
    | 竞赛举办需求 / 需求发布 | 无对应设计 |
    | 赛事说明 / 排名说明 / 数据集说明 | 落库内容是对象存储文件路径，不是文本正文 |
    | 竞赛项目 / 课题 | 无业务实体 |
    | 数据集应用场景映射 | 仅有训练/测试/评分三种用途分类，无业务场景标签 |

    另有部分字段虽然下发，但**数据稀疏**，调用方必须容忍空值，详见各字段说明。

servers:
  - url: https://{host}/ticsapi
    description: 网关地址（gkx-tics-api），按环境替换 host。完整公共调用地址为 https://{host}/ticsapi/szc/v1/open/...；测试环境示例为 https://szc.test.dp.tech/ticsapi/szc/v1/open/...。servers.url 已包含 /ticsapi，以下 paths 保留 /szc/v1 前缀
    variables:
      host:
        default: szc.test.dp.tech
        description: 网关域名（不含 /ticsapi 路径）

tags:
  - name: 科技竞赛
    description: |
      对应招投标需求 2.7.4.3。**已实现**。

      平台侧对应「竞赛」业务模块。
  - name: 科技交流
    description: |
      对应招投标需求 2.7.3.3。**已实现**。

      平台侧对应四类数据，由 `activityType` 参数区分：

      | activityType | 平台侧对应 |
      | --- | --- |
      | `exchange` | 科技传播下的科技交流活动 |
      | `reasoning` | 科技传播下的科技思辨 |
      | `live` | 科技直播 |
      | `course` | 科技竞赛下的课程 |

      四类共享一组统一字段（标题、简介、封面、起止时间、进度状态、主办方、详情页链接），
      各类特有的信息放在同名的类型特有对象里，只有与 `activityType` 匹配的那个非 null。

      **以下需求项平台侧无录入入口，整体不提供：**

      - **经纬度 / GIS 地图分布**：平台侧没有经纬度列，活动地点只有文字地址，
        且仅科技交流活动有该字段。地图撒点无法交付。
      - **举办城市**：无写入入口，不存在对应数据。
      - **活动规模（国际 / 国内 / 区域 / 市级）**：这是活动的级别与地域范围，
        平台侧四类活动上**根本没有这个维度的列**。已核查活动主表与三张扩展表的全部列、
        交流扩展表的预留 JSON 列（实测 0/78 有值）、以及各字典表，都没有这组取值。
        唯一有级别概念的是竞赛（`competition_level`：国家级/省级/市级/区县级/行业级/学校级），
        枚举不同且不适用于交流活动。注意别和下面的「预计参会人数」混为一谈，
        那是参与人数规模，不是级别。
      - **预计参会人数**：列存在但创建与编辑都写死 0。
        报名人数上限（`exchange.maxAttendeeCount`）与已报名人数
        （`exchange.registeredCount`）有真实录入，已下发。
      - **线上 / 线下 / 混合形式**：只有「线下」一种形式。
      - **线上会议链接与会议号、联系人姓名电话邮箱、协办单位**：无写入入口，不存在对应数据。
      - **专家的成果摘要与论文数**：对应列填充率极低（实测 27 条专家档案里仅 3 条非空
        且抽样全为空串），作为展示字段不可用。
      - **专家职称**：平台的 `academic_level` 列实测存的是「博士 / 硕士 / 本科」这类学历，
        不是「院士 / 教授」这类职称，故按学历语义下发。
      - **可跳转人才画像的稳定 ID**：专家档案与学者库之间没有关联关系。
      - **资源的阅读量、重要性、关联性**：活动附件表只有文件名、类型、大小、地址四项，
        没有阅读计数，也没有任何评分列。
      - **各统计卡片的环比增长率**：平台没有按时间留存的活动与参与快照表，
        算不出历史同期基数。

      **讲者与专家的支持情况**（需求 S-02）：

      | 类型 | 可提供 |
      | --- | --- |
      | `exchange` | 议程讲者姓名（`exchange.speakers`）+ 资料附件（`exchange.resources`） |
      | `reasoning` | 议程讲者姓名 + **结构化专家信息**（`reasoning.experts`：姓名、角色、机构、院系、领域、研究方向标签、学历、头像） |
      | `live` | 主持人与讲者姓名（`live.hostName` / `live.speakerNames`） |
      | `course` | 讲师署名（`course.lecturers`） |

      四类里只有科技思辨有活动与专家档案的绑定关系，因此只有它能给出带机构与领域的
      专家卡片；其余三类的讲者只有姓名。

      **概览统计**（对应原型顶部四张卡片）已提供，见响应的 `stats`：
      年度活动数、累计参与人次、合作机构数、专家讲者数，四类合计。

      路径：
      - `GET /szc/v1/open/exchange/activity/list` 活动数据接口
  - name: 科技传播
    description: |
      对应招投标需求 2.7.5.3。**已实现**。

      数据范围是平台的**科创热点**内容。内容类型即平台已有的 7 类，
      接口按这 7 类原样提供，不做其他分类体系的转换或归并：

      | contentType | 名称 |
      | --- | --- |
      | 1 | 顶级期刊 |
      | 2 | 学术会议 |
      | 3 | 前沿成果 |
      | 4 | 活动资讯 |
      | 5 | 技术课程 |
      | 6 | 成果转化 |
      | 7 | 需求发布 |

      以下字段平台侧无数据，接口整体不提供：点赞数（无该列）、
      收藏数（列存在但零写入）、分发渠道字段、月度浏览趋势 / 活跃用户 / 真实 UV
      （只有累计计数器，无按时间的行为流水表）。

paths:
  /szc/v1/open/competition/list:
    get:
      tags: [科技竞赛]
      summary: 竞赛信息接口（列表）
      operationId: listOpenCompetitions
      description: |
        需求 2.7.4.3-1 竞赛信息接口。返回平台已发布且上架的竞赛列表，
        支持关键词、竞赛类型、赛事类别、赛事层次、赛程阶段多条件检索与分页。

        **本接口不配套详情接口**。列表项的 `detailUrl` 即竞赛在本平台的前端详情页地址，
        赛事详情请跳转该链接查看。

        可见性由服务端固定，调用方无法放宽：仅返回未删除、已发布、已上架、
        且非「仅认证专家可见」的竞赛。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 关键词，模糊匹配赛事名称 / 简介 / 主办方 / 赛事主题
          schema: { type: string, maxLength: 100 }
        - name: theme
          in: query
          required: false
          description: |
            竞赛类型（赛题方向），如「数据科学」「人工智能」。

            **注意**：底层是自由文本列、无字典约束，只能模糊匹配，不是受控枚举。
            平台侧没有标准化的竞赛领域字典，因此该维度无法提供固定下拉选项，
            建议做成搜索框，或由调用方对实际返回值自行聚合。
          schema: { type: string, maxLength: 100 }
        - name: competitionLevel
          in: query
          required: false
          description: |
            赛事层次。1 国家级 / 2 省级 / 3 市级 / 4 区县级 / 5 行业级 / 6 学校级

            **数据质量提示**：该列在平台侧没有取值校验，且创建竞赛时未指定层次会
            落默认值 6（学校级）。按此维度做统计时需知悉该风险。

            另需注意此枚举与需求文档的「国际 / 国内 / 区域 / 市级」口径不一致，
            仅「市级」同名，平台侧没有「国际级」取值。
          schema: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
        - name: stage
          in: query
          required: false
          description: |
            赛程阶段筛选。取值与响应里的 `stage` 字段**完全一致**，
            即「响应说自己是某档」就一定「用该档能筛出来」。

            - `upcoming` 未开始（对应原型「即将开始」tab）
            - `registering` 报名中
            - `processing` 进行中（含报名已截止、作品提交中，对应原型「正在进行」tab）
            - `reviewing` 评审公示（含提交已截止、初审、复审、待公示、结果公示）
            - `completed` 已结束（对应原型「已结束」tab）
          schema:
            type: string
            enum: [upcoming, registering, processing, reviewing, completed]
        - name: registrationDeadline
          in: query
          required: false
          description: |
            报名时间筛选，对应原型「报名时间」下拉。不传即「全部时间」。

            - `thisWeek` 本周截止
            - `thisMonth` 本月截止

            语义是**报名截止时间落在本周 / 本月这个自然区间内**，包含区间内
            已经截止的赛事。档位名是「本周截止」而非「本周可报名」，
            把已截止的剔掉会与档位名不符。周起始按**周一**。

            区间由服务端按服务进程时区换算成绝对时间后下推，不依赖数据库时区。
            未填报名截止时间的赛事不会被任一档位选中——截止时间未知，
            无法断言它本周还是本月截止。

            原型同排的「奖金规模」下拉**不提供**：奖金字段在平台侧无写入路径、恒为 0，
            按它筛选会把全部赛事筛成同一档。
          schema:
            type: string
            enum: [thisWeek, thisMonth]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionListResponse' }
              examples:
                成功:
                  value:
                    code: 0
                    data:
                      total: 2
                      page: 1
                      pageSize: 20
                      items:
                        - competitionId: 1024
                          postId: "aB3xY"
                          name: "2026 国际数据科学挑战赛"
                          theme: "数据科学"
                          competitionType: 1
                          competitionTypeName: "常规赛"
                          competitionLevel: 1
                          competitionLevelName: "国家级"
                          sponsor: "国际数据科学联盟"
                          organizer: "深圳市科技创新局"
                          overview: "面向全球数据科学爱好者的赛事，涵盖机器学习、数据挖掘等方向。"
                          cover: "competition/1024/cover.jpg"
                          status: 3
                          statusName: "作品提交中"
                          stage: "processing"
                          startTime: "2026-06-01T10:00:00+08:00"
                          endTime: "2026-08-31T18:00:00+08:00"
                          participantCount: 5600
                          participantType: 2
                          viewCount: 18200
                          detailUrl: "https://szc.test.dp.tech/tics/competitions/47593612168?tab=introduce"
                          updateTime: "2026-07-15T09:12:33+08:00"
                业务失败:
                  value:
                    code: 148888
                    error: "invalid request parameter"

  /szc/v1/open/competition/resource/list:
    get:
      tags: [科技竞赛]
      summary: 竞赛资源接口（对应需求「项目查询接口」）
      operationId: listOpenCompetitionResources
      description: |
        对应需求 2.7.4.3-2「项目查询接口」。

        **接口为什么不叫 project**：需求所指的「竞赛下项目 / 课题」在平台侧
        **没有对应业务实体**，三个候选都不成立：

        | 候选 | 不成立的原因 |
        | --- | --- |
        | 赛道 | 表与模型存在，但在代码中从未被引用，属未启用功能 |
        | 作品提交 | 只有文件路径、得分与运行状态，没有名称字段，无法作为项目展示 |
        | 开源作品 | 指向文章（有标题），但属参赛者自愿产出、数据稀疏，且无「按竞赛列全部」的查询能力 |

        因此该需求项落地为「竞赛资源」，路径按实际返回内容命名，避免用 project
        误导调用方按项目维度设计展示。实际交付的是**竞赛绑定的数据集明细**
        （含训练 / 测试 / 评分用途分类），以及竞赛前端详情入口。
        数据集绑定关系由主办方通过竞赛管理接口维护，有完整录入链路。

        **也不下发「系列赛子赛事」**：父子关联表虽定义了写方法，但全仓零调用，
        克隆竞赛也不建立父子关系，即平台没有配置子赛事的入口，该字段恒为空数组。
        对外声明它会误导调用方按系列赛维度设计展示。

        不下发内部对象存储路径（`downloadUri` / `tiefbluePath` / `datasetPath` / `uri`）。
        每个公开绑定数据集可返回 `downloadUrl`；该值是实时换取、有有效期的预签名地址，
        换取失败或上游数据集、版本不可见时为空串，调用方不得缓存或转存。
      parameters:
        - $ref: '#/components/parameters/CompetitionId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionResourceResponse' }
              examples:
                成功:
                  value:
                    code: 0
                    data:
                      competitionId: 1024
                      datasets:
                        - dsId: 8801
                          dsPostId: "kQ7mn"
                          versionId: 3
                          version: 3
                          dsName: "城市交通流量训练集"
                          dsType: 0
                          dsTypeName: "训练数据"
                          envName: ""
                          downloadUrl: "https://example.com/signed-download-url"
                          updateTime: "2026-06-20T14:05:00+08:00"
                      detailUrl: "https://szc.test.dp.tech/tics/competitions/47593612168?tab=introduce"
                竞赛不可见:
                  value:
                    code: 148888
                    error: "competition not found"

  /szc/v1/open/competition/ranking:
    get:
      tags: [科技竞赛]
      summary: 成绩榜单接口
      operationId: getOpenCompetitionRanking
      description: |
        需求 2.7.4.3-3 成绩榜单接口。提供成绩排行榜与参赛行为数据，支持多终端拉取。

        分数口径是平台的 **A 榜**（公开榜）成绩，按分数降序排列，
        同分时提交次数少者优先，再按最早达到该分数的时间排序。

        **不提供榜单类型选择**：平台另有 B 榜（结果榜），但它依赖主办方的评分程序
        在评分结果里返回私榜分数，平台侧已不再产出该数据，实测最后一条非零 B 分
        停在数月前。且 B 分全为 0 时 B 榜排序会退化为「按提交次数升序」，
        给出的名次与成绩无关，比空榜更具误导性。因此本接口统一返回 A 榜。

        **提交截止前返回空榜**（`total: 0, items: []`）：比赛进行中不对外公开成绩，
        避免泄露实时排名。这是正常业务行为，不是接口故障。
        判断方式是先调列表接口看该竞赛的 `stage`——`upcoming` 与 `registering`
        阶段必然是空榜，`processing` 阶段要看作品提交是否已截止，
        `reviewing` 与 `completed` 阶段有成绩即可见，且赛后不会失效。

        **关于「项目名」**：需求要求榜单返回项目名，但平台侧榜单实体是参赛队伍而非项目，
        没有对应字段，因此不下发。可用 `teamName` 代替。

        **关于「参赛机构」**：取参赛者报名时填写的单位名称，只认审核通过且未撤回的报名。
        队伍取任一成员的报名单位（平台侧没有队伍级单位字段）；未报名或未填写时为空串。

        出于隐私考虑，成员信息不下发邮箱与手机号。
      parameters:
        - $ref: '#/components/parameters/CompetitionId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionRankingResponse' }
              examples:
                成功:
                  value:
                    code: 0
                    data:
                      competitionId: 1024
                      total: 120
                      page: 1
                      pageSize: 20
                      items:
                        - rank: 1
                          teamName: "QuantumForce"
                          score: "98.5000"
                          institution: "清华大学"
                          submissionCount: 42
                          submissionTime: "2026-08-20T21:30:11+08:00"
                          awardName: ""
                          members:
                            - userName: "张三"
                              avatar: "https://example.com/avatar/1.png"

  /szc/v1/open/competition/discussion/list:
    get:
      tags: [科技竞赛]
      summary: 竞赛社区讨论列表
      operationId: listOpenCompetitionDiscussions
      description: |
        需求 2.7.4.3-3 成绩榜单接口中「用户互动」部分，对应原型竞赛页的「社区讨论」tab。

        只返回审核通过且未删除的帖子，按置顶分、最后回复时间、创建时间倒序。

        ### 与平台内讨论区接口的对应关系

        本接口与平台内 `GET /szc/v1/square/discussion/page?scene=1&sceneId=…` 读同一批数据、
        同一套过滤条件（状态有效 + 审核通过）、同一个排序，字段对应如下：

        | 本接口 | 站内接口 | 说明 |
        | --- | --- | --- |
        | `competitionId` | `sceneId` | **注意进制不同**：站内收的是混淆 ID，本接口收原始竞赛 ID。列表接口同时返回 `competitionId` 与 `postId`，前者用于本接口，后者即站内的 `sceneId` |
        | `partitionId` | `partitionId` | 见参数说明中的差异 |
        | `author` | `creator` | 同一份用户数据 |
        | `lastReplier` | `lastReplier` | 同一份用户数据 |
        | `replyCount` | `commentNum` | 同源同值 |
        | `likeCount` | `likeNum` | 同源同值 |

        **两个接口的数据完全一致**：相同的竞赛与分区入参下，返回的帖子集合、顺序、
        用户信息、互动计数都与站内一一对应，可直接对数。

        **不下发帖子浏览数**：讨论表没有浏览量列，平台侧从未统计过帖子浏览量，
        返回 0 会让展示端误判为冷门帖，因此该字段整体不出现。
        **不下发帖子正文**：列表场景只需标题与互动计数，正文需跳转本平台讨论区页面查看。
        站内接口同样不返回正文。
      parameters:
        - $ref: '#/components/parameters/CompetitionId'
        - name: partitionId
          in: query
          required: false
          description: |
            讨论分区筛选。1 报名交流区 / 2 作品提交互助区 / 3 竞赛评审讨论区 / 4 成果交流区。
            不传表示不筛选，返回该竞赛下全部分区的帖子。

            **筛选生效条件与站内一致**：只有该竞赛开启了动态分区时才按分区过滤；
            未开启动态分区的竞赛会**忽略**本参数、返回全部分区的帖子。
            这是平台既有行为，本接口照搬以保证与站内返回同一批数据。
            换言之，传了 `partitionId` 却拿到多个分区的帖子是正常的，
            说明该竞赛未开启动态分区，此时应按响应里的 `partitionId` 自行分组。

            未分区的帖子（`partitionId` 为 0）无法单独筛选，
            不传参数时它们照常返回。
          schema:
            type: integer
            enum: [1, 2, 3, 4]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDiscussionResponse' }
              examples:
                成功:
                  value:
                    code: 0
                    data:
                      competitionId: 1024
                      total: 37
                      page: 1
                      pageSize: 20
                      items:
                        - postId: "8883528444"
                          title: "数据集下载失败怎么解决"
                          author:
                            userName: "参赛者A"
                            avatar: "https://example.com/avatar/a.png"
