  /szc/v1/open/communication/content/sync:
    get:
      tags: [科技传播]
      summary: 多端数据同步与分发
      operationId: syncOpenCommunicationContents
      description: |
        需求 2.7.5.3-3 多端数据同步与分发。按更新时间提供内容变更流，供多个前端/端侧
        保持与平台一致。

        **用法**：首次不传 `updatedSince` 全量拉取，之后以上一次响应的
        `nextUpdatedSince` 作为水位线增量拉取。记录按 `updateTime` **升序**返回，
        按水位线推进不会漏记录。

        **已下线内容也会返回**（`status=offline`），这是下游感知下架的唯一途径 ——
        若只返回已发布内容，下游将永远无法得知某条内容已被撤回，会一直展示。
        对已下线记录只回状态与时间戳，不回正文等内容字段。

        **关于「渠道覆盖字段一致」**：平台侧内容表**没有分发渠道字段**
        （推广范围与访问范围是受众口径，不是渠道），因此无法按渠道差异化分发。
        本接口提供的一致性保证是另一种形式：所有端调用同一套接口、读同一份数据源，
        不存在按端差异化的内容副本，因此天然一致。如需按渠道区分投放，
        需要在平台侧新增渠道能力，不在当前接口范围内。
      parameters:
        - name: updatedSince
          in: query
          required: false
          description: |
            水位线。只返回更新时间**严格晚于**该时刻的记录；省略表示全量拉取。
            接受 `2006-01-02`、`2006-01-02 15:04:05`、RFC3339 三种格式。
          schema: { type: string, example: "2026-06-01 09:12:33" }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          description: 每页条数，默认 20，上限 200（同步场景允许比普通列表更大的页）
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationSyncResponse' }
              examples:
                成功:
                  value:
                    code: 0
                    data:
                      total: 342
                      page: 1
                      pageSize: 20
                      nextUpdatedSince: "2026-06-02T15:41:07+08:00"
                      items:
                        - contentId: 5012
                          status: "published"
                          title: "人工智能前沿研究综述"
                          isArchived: false
                          publishTime: "2026-05-20T10:00:00+08:00"
                          offlineTime: null
                          updateTime: "2026-06-01T09:12:33+08:00"
                        - contentId: 4870
                          status: "offline"
                          title: "已撤回的旧版综述"
                          isArchived: false
                          publishTime: "2026-03-11T14:00:00+08:00"
                          offlineTime: "2026-06-02T15:41:07+08:00"
                          updateTime: "2026-06-02T15:41:07+08:00"

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始，默认 1
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数，默认 20，上限 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CompetitionId:
      name: competitionId
      in: query
      required: true
      description: 竞赛 ID，取自列表接口的 `competitionId`
      schema: { type: integer, format: int64, minimum: 1 }

  schemas:
    CompetitionListResponse:
      type: object
      description: |
        gkx-core 正常处理的业务结果使用统一响应包装，以 `code` 区分成功与失败；
        gkx-tics-api 对其直接透传，不二次包装。成功时 code=0 且 data 有值；
        业务失败时 code 非 0（通用业务错误码 148888）且 error 有值、data 缺省。
        代理、网络或超时等基础设施失败可能使用非 200 HTTP 状态。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/CompetitionListData' }
        error: { type: string, description: 业务失败时的错误描述，成功时不返回 }

    CompetitionListData:
      type: object
      required: [total, page, pageSize, items, stats]
      properties:
        total: { type: integer, format: int64, description: 总条数 }
        page: { type: integer, description: 当前页码 }
        pageSize: { type: integer, description: 每页条数 }
        items:
          type: array
          items: { $ref: '#/components/schemas/CompetitionItem' }
        stats: { $ref: '#/components/schemas/CompetitionStats' }

    CompetitionStats:
      type: object
      description: |
        列表页顶部统计卡片，对应原型「年度赛事 / 参赛团队 / 参赛人数」三张卡。

        **取值不随筛选条件和页码变化**，恒为全部对外可见赛事的汇总。
        原型里这些卡片位于筛选器上方，本身就是全局概览而非当前筛选结果的小计。
        统计与列表共用同一份可见性条件，因此卡片数不会大于列表能翻到的总数。

        **原型第四张卡「奖金总额」不提供**：`competition.prize_total` 在平台侧
        没有任何写入路径，发放奖金的代码处明确标注未支持，该列恒为 0。
        **各卡片下方的增长率也不提供**：平台没有按时间留存的赛事/参赛快照表，
        算不出历史同期基数。

        统计查询失败时服务端降级为全 0 并不影响列表返回。
        若 `competitionCount` 为 0 而 `items` 非空，即为统计降级，可重试。
      required: [competitionCount, annualCompetitionCount, participantCount, teamCount]
      properties:
        competitionCount:
          type: integer
          format: int64
          description: 对外可见赛事总数，不限年份
        annualCompetitionCount:
          type: integer
          format: int64
          description: |
            本年度赛事数，对应原型「年度赛事」卡片。

            口径为**报名开始时间落在当前自然年**。未填报名开始时间的赛事不计入；
            跨年赛事按报名开始的那一年归属。
        participantCount:
          type: integer
          format: int64
          description: |
            累计参赛人数，对应原型「参赛人数」卡片。

            口径与站内赛事卡片的「参与人数」严格一致：个人身份的有效参赛记录数。
            已组队的成员**仍然计入**（组队只会把其个人记录转为「已组队」状态而非删除），
            已退赛的不计入。

            注意这是**人次**：同一人参加多个赛事会被重复计入。平台侧没有
            跨赛事去重的参赛人数统计口径。
        teamCount:
          type: integer
          format: int64
          description: |
            累计参赛团队数，对应原型「参赛团队」卡片。

            口径是团队身份的有效参赛记录数。平台内一支队伍在一个赛事下记一条，
            因此该值等于跨全部对外可见赛事的组队次数。

    CompetitionItem:
      type: object
      description: |
        竞赛列表项。只含展示卡片所需字段，不铺开赛程各阶段时间等明细，
        详情通过 detailUrl 跳转前端页面查看。
      properties:
        competitionId:
          type: integer
          format: int64
          description: 竞赛 ID，用于调用项目查询与成绩榜单接口
        postId:
          type: string
          description: 对外混淆 ID，与前端详情页链接中的标识一致
        name: { type: string, description: 赛事名称 }
        theme:
          type: string
          description: 竞赛类型（赛题方向）。自由文本，可能为空串
        competitionType:
          type: integer
          description: |
            赛事类别（组织形态，非赛题方向）。1 常规赛 / 2 学习赛 / 3 不限 / 4 认证赛 / 5 系列赛。

            **只下发、不提供筛选**：该列没有录入入口（创建时由服务端硬编码为 1，
            创建与编辑接口都不接收该字段），线上实际只有常规赛与认证赛两种取值，
            作为筛选维度没有意义。如需按此区分，请在调用方本地过滤。
        competitionTypeName:
          type: string
          description: 赛事类别名称。未知取值时为空串
        competitionLevel:
          type: integer
          description: |
            赛事层次。1 国家级 / 2 省级 / 3 市级 / 4 区县级 / 5 行业级 / 6 学校级。
            创建时未指定会落默认值 6，按此维度统计需知悉数据质量风险。
        competitionLevelName:
          type: string
          description: 赛事层次名称。未知取值时为空串，便于区分「未填」与「填了未知值」
        sponsor: { type: string, description: 主办方 }
        organizer: { type: string, description: 举办方 }
        overview: { type: string, description: 赛事简介 }
        cover:
          type: string
          description: 封面。平台侧默认落对象存储相对路径，需要拼接存储域名后使用
        status:
          type: integer
          format: int64
          description: |
            赛程位置状态原值。1 未开始 / 2 报名中 / 3 作品提交 / 4 初审 / 5 复审 /
            6 结果公示 / 7 已结束 / 8 报名已截止 / 9 作品提交已截止 / 10 待结果公示。

            **注意**：8~10 是后补的阶段间空档档位、追加在枚举尾部，
            因此**状态数值大小不等于赛程时间先后**，不要用数值比较判断赛程进度，
            请改用 stage 字段。
        statusName: { type: string, description: 赛程位置状态名称 }
        stage:
          type: string
          enum: [upcoming, registering, processing, reviewing, completed]
          description: |
            赛程粗分组，由 status 折叠而来，数值单调对应赛程时间序，可直接用于比较与筛选。
            只需要「未开始 / 进行中 / 已结束」三态的展示端建议直接用本字段。
        startTime:
          type: string
          format: date-time
          nullable: true
          description: 报名开始时间。未配置时为 null
        endTime:
          type: string
          format: date-time
          nullable: true
          description: 结果公示结束时间。未配置时为 null
        participantCount: { type: integer, format: int64, description: 参与人数 }
        participantType:
          type: integer
          format: int64
          description: 参赛类别。1 按人数 / 2 按队伍
        viewCount: { type: integer, format: int64, description: 浏览量 }
        detailUrl:
          type: string
          description: |
            竞赛在本平台的前端详情页链接，展示端直接跳转即可。

            形如 `{平台地址}/tics/competitions/{postId}?tab=introduce`，例如
            `https://szc.test.dp.tech/tics/competitions/47593612168?tab=introduce`。

            路径里用的是 `postId`（对外混淆 ID），**不是 `competitionId`**。
            调用资源、榜单、讨论区三个接口时要用 `competitionId`，两者不可混用。
            `tab=introduce` 让链接确定落在「简介」页签。
        updateTime:
          type: string
          format: date-time
          description: 最后更新时间，可用于增量拉取判断

    CompetitionResourceResponse:
      type: object
      description: 统一响应包装，口径同 CompetitionListResponse。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/CompetitionResourceData' }
        error: { type: string, description: 业务失败时的错误描述，成功时不返回 }

    CompetitionResourceData:
      type: object
      description: |
        竞赛资源。平台侧无竞赛项目/课题实体，故本结构不含项目维度，
        详见接口描述中的说明。
      properties:
        competitionId: { type: integer, format: int64 }
        datasets:
          type: array
          description: |
            竞赛绑定的**公开数据集（训练数据）**明细，无绑定时为空数组。

            **只包含主办方显式对外绑定的公开数据集。** 竞赛的测试集与评分集在平台侧
            以「隐藏」状态存储，不在本接口口径内——评分集含标准答案，
            对外暴露等于泄题。因此一个只配置了测试/评分集、没有绑定公开数据集的竞赛，
            这里返回空数组是正确结果，不是故障。

            该口径与平台内竞赛详情页展示的数据集完全一致（同一查询）。
            若站内详情页也看不到数据集，则该竞赛确实没有公开数据集。
          items: { $ref: '#/components/schemas/CompetitionDataset' }
        detailUrl:
          type: string
          description: |
            竞赛前端详情页，也是获取数据的统一入口。

            形如 `{平台地址}/tics/competitions/{postId}?tab=introduce`，
            与竞赛列表接口返回的同一字段完全一致（同一套拼接逻辑）。

    CompetitionDataset:
      type: object
      description: |
        竞赛绑定的公开数据集（训练数据）。

        含 `downloadUrl` 下载地址。不下发 `tiefbluePath` / `datasetPath` / `uri`
        这类内部对象存储路径：平台外无法访问，且会暴露内部存储结构。
      properties:
        dsId: { type: integer, format: int64, description: 数据集 ID }
        dsPostId: { type: string, description: 数据集对外混淆 ID }
        versionId: { type: integer, format: int64, description: 版本记录 ID }
        version:
          type: integer
          description: 版本号展示值。命名不符合 vN 规范时降级为 0
        dsName:
          type: string
          description: |
            数据集名称。该字段在数据集服务侧，需一次 RPC 取得。

            取不到时降级为空串而非编造占位值，此时 `dsId` / `versionId` 仍然有效。
            出现空名称通常意味着该数据集或版本已在数据集服务侧删除或撤回，
            而竞赛侧的绑定关系还在。
        dsType:
          type: integer
          description: |
            数据集用途。0 训练数据 / 1 测试数据 / 2 评分数据。

            **本接口实际恒为 0**：测试集与评分集以「隐藏」状态存储、不在对外口径内，
            能被返回的绑定都是公开训练数据。保留该字段是为了让调用方在极端情况下
            （同一数据集版本被同时绑定为评测集与公开集）仍能识别出用途差异。
        dsTypeName: { type: string, description: 数据集用途名称 }
        envName:
          type: string
          description: |
            运行环境变量名。**本接口恒为空串**。

            该字段只在绑定评测集（测试集/评分集）时写入，绑定公开训练数据的路径
            不设置它，而本接口只返回公开训练数据。
        downloadUrl:
          type: string
          description: |
            数据集版本的下载地址。

            **这是带访问凭证的预签名地址、有有效期，不是永久链接。**
            调用方必须每次调用本接口实时获取，**不要缓存、不要转存分发**，
            过期后地址会失效。

            该地址由服务端实时向存储服务换取（存在性校验 + 取地址两次调用）。
            换取失败或数据集文件已不存在时降级为空串，不影响同一响应里其余数据集。
            与 `dsName` 同源，上游数据集服务未返回该条记录时也为空串。
        updateTime:
          type: string
          format: date-time
          description: |
            数据集更新时间。

            取不到时为零值时间 `0001-01-01T00:00:00Z`，与 `dsName` 为空串同因：
            上游数据集服务未返回该条记录。


    CompetitionRankingResponse:
      type: object
      description: 统一响应包装，口径同 CompetitionListResponse。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/CompetitionRankingData' }
        error: { type: string, description: 业务失败时的错误描述，成功时不返回 }

    CompetitionRankingData:
      type: object
      properties:
        competitionId: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/CompetitionRankingItem' }

    CompetitionRankingItem:
      type: object
      properties:
        rank: { type: integer, format: int64, description: 排名 }
        teamName:
          type: string
          description: 队伍名称。个人参赛时为参赛者展示名
        score:
          type: string
          description: 得分。按赛事配置的精度格式化后的字符串，不是数值类型
        institution:
          type: string
          description: |
            参赛单位，取报名信息中的单位名称，只认审核通过且未撤回的报名。
            队伍取任一成员的报名单位；未报名或未填写时为空串。
        submissionCount: { type: integer, format: int64, description: 提交次数 }
        submissionTime:
          type: string
          format: date-time
          nullable: true
          description: 最后提交时间。无提交时为 null
        awardName:
          type: string
          description: |
            获奖等级名称。**数据稀疏，绝大多数竞赛为空串，调用方必须容忍空值。**

            原因：平台侧没有「奖项设置」功能，奖项配置表只有读接口、没有任何写入入口，
            按配置自动评奖的逻辑恒不生效。该字段唯一的数据来源是运营手动调用发放接口
            且按名次发放时落库的获奖等级；按用户、按团队两种发放方式在平台侧未实现。
        members:
          type: array
          description: 队伍成员。不含邮箱与手机号
          items: { $ref: '#/components/schemas/CompetitionRankingMember' }

    CompetitionRankingMember:
      type: object
      properties:
        userName: { type: string, description: 成员展示名 }
        avatar: { type: string, description: 头像地址，可能为空串 }

    CompetitionDiscussionResponse:
      type: object
      description: 统一响应包装，口径同 CompetitionListResponse。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/CompetitionDiscussionData' }
        error: { type: string, description: 业务失败时的错误描述，成功时不返回 }

    CompetitionDiscussionData:
      type: object
      properties:
        competitionId: { type: integer, format: int64 }
        total: { type: integer, format: int64, description: 总帖数（仅含审核通过的帖子） }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/CompetitionDiscussionItem' }

    CompetitionDiscussionItem:
      type: object
      description: |
        讨论帖。不含浏览数（平台侧无该列）与正文（需跳转讨论区页面查看）。
      properties:
        postId: { type: string, description: 帖子对外 ID }
        title: { type: string, description: 帖子标题 }
        author:
          allOf:
            - $ref: '#/components/schemas/CompetitionDiscussionUser'
          nullable: true
          description: 发帖人。对应站内讨论区接口的 `creator`。用户服务异常时为 null
        lastReplier:
          allOf:
            - $ref: '#/components/schemas/CompetitionDiscussionUser'
          nullable: true
          description: |
            最后回复人。对应站内讨论区接口的 `lastReplier`。

            **无人回复时为 null**，与 `lastReplyTime` 同步出现。
            线上多数帖子没有回复，调用方必须能处理 null。
        replyCount:
          type: integer
          format: int64
          description: |
            回复数。与站内讨论区接口的 `commentNum` 同源同值。

            **已知偏差**：该计数只在发表回复或审核通过时递增，**删除回复时不回退**，
            因此它是历史累计回复数，可能大于当前实际可见的回复条数。
            本接口不做修正，以保证与站内返回一致。
        likeCount:
          type: integer
          format: int64
          description: |
            点赞数。与站内讨论区接口的 `likeNum` 同源同值。

            **已知偏差**：该计数有点赞/取消双向维护，但底层写入不判断该用户是否已点过，
            同一用户重复调用点赞接口会重复累加。
            本接口不做修正，以保证与站内返回一致。
        isTop: { type: boolean, description: 是否置顶 }
        partitionId:
          type: integer
          description: |
            讨论分区。0 未分区 / 1 报名交流区 / 2 作品提交互助区 /
            3 竞赛评审讨论区 / 4 成果交流区。

            分区在发帖时由服务端按当时赛程推导后固化，不随赛程改期漂移；
            0 表示发帖时赛程尚未开始或该竞赛未开启动态分区。

            本接口提供可选 query 参数 `partitionId`（1..4）。仅当竞赛开启动态分区时服务端才按该值过滤；
            未开启时参数被忽略并返回全部分区。`partitionId=0` 仅能在响应中识别“未分区”帖子，
            不能作为单独筛选条件。
        partitionName: { type: string, description: 讨论分区名称 }
        createTime: { type: string, format: date-time, description: 发帖时间 }
        lastReplyTime:
          type: string
          format: date-time
          nullable: true
          description: 最后回复时间。无回复时为 null，与 `lastReplier` 同步出现

    CompetitionDiscussionUser:
      type: object
      description: |
        讨论区用户（发帖人 / 最后回复人）。

        只含展示所需的昵称与头像。站内同位置的对象还带用户等级、组织、用户类型，
        那些是站内运营与权限字段，对外不下发。
      properties:
        userName: { type: string, description: 用户昵称 }
        avatar: { type: string, description: 头像 URL。用户未设置时为空串 }

    ExchangeActivityListResponse:
      type: object
      description: 统一响应包装，口径同 CompetitionListResponse。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/ExchangeActivityListData' }
        error: { type: string, description: 业务失败时的错误信息，成功时不出现 }

    ExchangeActivityListData:
      type: object
      required: [activityType, activityTypeName, total, page, pageSize, items, stats]
      properties:
        activityType:
          type: string
          enum: [exchange, reasoning, live, course]
          description: 本次查询的活动类型，回显请求入参
        activityTypeName: { type: string, description: 活动类型名称 }
        total: { type: integer, format: int64, description: 总条数 }
        page: { type: integer, description: 当前页码 }
        pageSize: { type: integer, description: 每页条数 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ExchangeActivityItem' }
        stats: { $ref: '#/components/schemas/ExchangeStats' }

    ExchangeStats:
      type: object
      description: |
        概览统计，对应原型顶部四张卡片。

        **统计范围是四类活动合计**，与本次请求的 `activityType`、筛选条件、页码都无关：
        原型里这些卡片位于视图与筛选器上方，本身就是整个科技交流域的概览。
        换言之查 `course` 与查 `live` 拿到的 `stats` 完全相同。

        **各卡片下方的环比增长率不提供**：平台没有按时间留存的活动与参与快照表，
        算不出历史同期基数。

        统计查询失败时服务端降级为全 0 并不影响列表返回。
      required: [annualActivityCount, participantCount, organizationCount, expertCount]
      properties:
        annualActivityCount:
          type: integer
          format: int64
          description: |
            本年度活动数，四类合计。对应原型「年度活动」卡片。

            口径是活动开始时间（课程为开课时间）落在当前自然年。
            未填开始时间的不计入——无法断言它属于哪一年。
        participantCount:
          type: integer
          format: int64
          description: |
            累计参与人次，四类合计。对应原型「参与人次」卡片。

            四类的参与口径不同，各取各自有真实写入的那一项：

            | 类型 | 取值来源 |
            | --- | --- |
            | 科技交流 | 活动的已报名人数 |
            | 科技思辨 | 报名记录里审核通过的条数 |
            | 科技直播 | 累计观看人数 |
            | 课程 | 学习人数 |

            **这是人次而非去重人数**：同一人参与多个活动会被重复计入。
        organizationCount:
          type: integer
          format: int64
          description: |
            合作机构数，按主办方名称去重。对应原型「合作机构」卡片。

            课程不计入：平台侧课程没有主办方字段。
        expertCount:
          type: integer
          format: int64
          description: |
            专家讲者数，按姓名去重。对应原型「专家讲者」卡片。

            合并三个来源：科技思辨活动绑定的专家、科技交流与科技思辨两张议程表里的讲者。
            科技直播的主持人讲者与课程讲师不计入——前者只有用户 ID 需逐个回查，
            后者是课程署名而非活动讲者，口径与前三者不一致。

    ExchangeActivityItem:
      type: object
      description: |
        活动列表项。前半是四类共有的统一字段，后半是四个互斥的类型特有对象，
        只有与 `activityType` 匹配的那个非 null。

        以下需求项平台侧无数据，整体不下发：经纬度与地图坐标、举办城市、
        活动规模（国际/国内/区域/市级，平台侧无级别列）、预计参会人数（写死 0）、
        线上会议链接与会议号、联系人信息、协办单位、
        活动与专家讲者的关联（详见 tag 说明）。
      properties:
        activityType:
          type: string
          enum: [exchange, reasoning, live, course]
        activityTypeName: { type: string, description: 活动类型名称 }
        activityId:
          type: string
          description: |
            平台内的活动标识，与 `detailUrl` 里的标识一致。

            **以字符串返回**：课程的该值是课程业务编号（字符串数字），
            其余三类是活动主键。四类的 ID 空间彼此独立，**跨类型不可比较**。
        title: { type: string }
        summary:
          type: string
          description: |
            简介。

            **科技思辨恒为空串**：平台侧该列没有写入入口，思辨的背景说明写在正文里，
            而列表接口不下发正文。
        coverImageUrl: { type: string, description: 封面图地址，可能为空串 }
        startTime:
          type: string
          format: date-time
          nullable: true
          description: 活动开始时间；课程为开课时间。可能为 null
        endTime:
          type: string
          format: date-time
          nullable: true
          description: 活动结束时间；课程为结课时间。可能为 null
        status:
          type: string
          enum: [upcoming, ongoing, ended]
          description: |
            统一进度档位。四类的原始状态口径不同，折叠规则如下：

            | 类型 | 判定方式 | upcoming | ongoing | ended |
            | --- | --- | --- | --- | --- |
            | `exchange` | 按时间实时推导 | 报名中 | 进行中 | 已结束 |
            | `reasoning` | 读平台状态列 | 筹备中、待开始 | 进行中 | 已结束 |
            | `live` | 读平台状态列 | 草稿、筹备中、待开始 | 直播中 | 已结束 |
            | `course` | 按开课与结课时间实时推导 | 未开课 | 开课中 | 已结束 |

            **注意 `reasoning` 与 `live` 读的是平台的状态列**，该列由定时任务按时间推进，
            可能比真实时间晚一两分钟。这是平台既有设计，本接口不改成实时推导，
            否则同一活动在平台内与本接口显示的状态会不一致。

            课程在开课或结课时间未配全时归入 `upcoming`——时间缺配无法断言进度。
        statusName: { type: string, description: 进度档位名称 }
        organizerName:
          type: string
          description: |
            主办方名称。

            **课程恒为空串**：平台侧课程没有主办方概念，最接近的归属信息是讲师，
            见 `course.lecturers`。
        detailUrl:
          type: string
          description: |
            该活动在本平台的前端详情页链接，展示端直接跳转即可。各类的形式：

            | 类型 | 形式 |
            | --- | --- |
            | `exchange` | `{平台地址}/tics/sci-comm/detail/{activityId}` |
            | `reasoning` | `{平台地址}/tics/science-thinking/{progress\|ended}?activityId={activityId}` |
            | `live` | `{平台地址}/tics/technology-live-streaming/details?activityId={activityId}` |
            | `course` | `{平台地址}/tics/courses/{activityId}?tab=courses` |

            **科技思辨的路径按状态分岔**：`status` 为 `ended` 时走 `/ended`，
            其余走 `/progress`。两个页面内容不同（已结束页展示总结与研讨区入口，
            进行中页展示当期议程与讨论区），不能互换。

            注意 `exchange` 用的是**路径参数**而非查询参数，与其余三类形式不同。
        updateTime:
          type: string
          format: date-time
          description: 最后更新时间，可用于增量判断
        exchange:
          allOf:
            - $ref: '#/components/schemas/ExchangeExchangeDetail'
          nullable: true
          description: 科技交流活动特有字段。`activityType` 非 `exchange` 时为 null
        reasoning:
          allOf:
            - $ref: '#/components/schemas/ExchangeReasoningDetail'
          nullable: true
          description: 科技思辨特有字段。`activityType` 非 `reasoning` 时为 null
        live:
          allOf:
            - $ref: '#/components/schemas/ExchangeLiveDetail'
          nullable: true
          description: 科技直播特有字段。`activityType` 非 `live` 时为 null
        course:
          allOf:
            - $ref: '#/components/schemas/ExchangeCourseDetail'
          nullable: true
          description: 课程特有字段。`activityType` 非 `course` 时为 null

    ExchangeExchangeDetail:
      type: object
      description: 科技交流活动的特有字段。
      properties:
        categoryId:
          type: integer
          format: int64
          description: |
            活动类别。1 学术交流 / 2 专题研讨 / 3 技术讲座 / 4 专业论坛 /
            5 合作项目 / 6 行业资讯
        categoryName: { type: string, description: 活动类别名称，未知取值时为空串 }
        subjectAreaId: { type: integer, format: int64, description: 学科门类 ID }
        subjectAreaName: { type: string, description: 学科门类名称 }
        venueAddress:
          type: string
          description: |
            举办地点的文字地址，可能为空串。

            **只有文字地址，没有城市与经纬度**：城市列被创建与编辑写死空串，
            经纬度列在平台侧不存在，因此无法提供地图定位所需坐标。
        registrationEndTime:
          type: string
          format: date-time
          nullable: true
          description: |
            报名截止时间，可能为 null。
            没有报名开始时间：该列创建与编辑都写 null。
        maxAttendeeCount: { type: integer, description: 报名人数上限，0 表示不限 }
        registeredCount:
          type: integer
          format: int64
          description: 已报名人数。报名成功加一，取消或驳回减一
        viewCount:
          type: integer
          format: int64
          description: 累计浏览量，详情页访问时累加
        tags:
          type: array
          items: { type: string }
          description: 活动标签，无标签时为空数组
        externalSourceUrl:
          type: string
          description: |
            主办方填写的外部原活动链接，可能为空串。
            这是外部站点地址，不是本平台详情页——本平台详情页见统一字段 `detailUrl`。
        isArchived:
          type: boolean
          description: |
            是否已归档。

            **归档活动照常返回**，与平台内列表行为一致，服务端不替调用方过滤。
            归档的业务语义是「活动已收进档案、不再作为在办活动运营」；
            展示端若只想展示在办活动，按该字段自行剔除。

            平台侧只有归档入口、没有取消归档入口，所以该值一旦为 `true` 就不会变回 `false`。
        speakers:
          type: array
          items: { type: string }
          description: |
            议程讲者姓名，按议程顺序排列、同一活动内已去重；无议程时为空数组。

            **只有姓名**：讲者单位、头衔、用户 ID 三列虽然建了表，但创建与编辑都不写入，
            实测全库为空，因此无法提供带单位头衔头像的讲者卡片。
            结构化的专家信息只有科技思辨有，见 `reasoning.experts`。
        resources:
          type: array
          items: { $ref: '#/components/schemas/ExchangeResourceItem' }
          description: |
            活动关联的资料附件，无附件时为空数组。

            需求要求的资源「阅读量、重要性、关联性」平台侧没有对应数据：
            附件表只有文件名、类型、大小、地址四项，没有阅读计数，也没有任何评分列。

    ExchangeReasoningDetail:
      type: object
      description: |
        科技思辨的特有字段。

        有意不下发浏览量：平台侧思辨链路上浏览量列没有任何自增，恒为 0。
        也没有地点与报名人数上限：这两类列在思辨的表结构上不存在。
        没有结构化的活动类别与学科门类：那两列在本业务零写入，只有下面的自由文本 `category`。
      properties:
        category:
          type: string
          description: 领域分类文本，主办方自由填写，可能为空串
        keywords:
          type: array
          items: { type: string }
          description: 思辨主题关键词，无关键词时为空数组
        maxTopics: { type: integer, description: 最终入选话题数上限 }
        isCaseLibrary: { type: boolean, description: 是否已收入案例库 }
        registrationCount:
          type: integer
          format: int64
          description: |
            已报名人数（审核通过口径）。

            **该值从报名记录实时聚合**，不读活动表上的报名计数列——那一列在思辨链路
            没有任何写入、恒为 0。
        speakers:
          type: array
          items: { type: string }
          description: |
            议程讲者姓名，按议程顺序排列、同一活动内已去重；无议程时为空数组。
            该表只有讲者姓名一列，且是自由文本（可能写成「主持人：王教授」这种形式）。
        experts:
          type: array
          items: { $ref: '#/components/schemas/ExchangeExpertItem' }
          description: |
            活动关联的专家与主持人，无关联时为空数组。

            **这是四类里唯一有结构化专家信息的**：数据来自活动与专家的绑定关系，
            关联到平台的专家档案，因此能给出机构、院系、研究领域等信息。
            科技交流活动没有专家绑定表，只有议程讲者姓名（见 `exchange.speakers`）。

    ExchangeResourceItem:
      type: object
      description: |
        活动关联的资料附件。仅 `exchange` 有该数据，其余三类为空数组。

        原型要求的「阅读量、重要性、关联性」三项平台侧没有对应数据：
        附件表只有主键、所属活动、文件名、扩展名、大小、地址六列，
        既没有阅读计数，也没有任何人工或算法评分列。
      properties:
        resourceId:
          type: integer
          format: int64
          description: |
            资源稳定标识，跨场景一致，可用于展示端做去重与关联。
            与 `activityId` 是不同的 ID 空间，不可互相比较。
        fileName: { type: string, description: 原始文件名，作为资源标题使用 }
        fileExt: { type: string, description: 文件扩展名，作为资源类型使用 }
        fileSize: { type: integer, format: int64, description: 文件大小，单位字节 }
        fileUrl: { type: string, description: 文件访问地址 }

    ExchangeExpertItem:
      type: object
      description: |
        活动关联的专家 / 主持人，对应原型的「特邀专家讲者」卡片。

        以下原型字段平台侧无可用数据，不下发：

        - **成果摘要与论文数**：对应列的填充率极低（实测 27 条专家档案里仅 3 条非空，
          且抽样全为空串），作为展示字段不可用。
        - **人才画像（学者库）跳转 ID**：专家档案与学者库之间没有关联列，
          只能靠用户 ID 对撞。实测 27 位专家里仅 2 位能命中学者库
          （学者库 38 万条记录里只有 158 条挂了用户 ID），覆盖率不足以支撑
          「点专家卡片跳人才画像」这个交互。需要时可用 `userId` 自行对撞。

        专家本身的稳定标识是 `expertId`，跨活动跨场景一致，可满足需求里
        「同一专家主键跨场景一致」这一项。
      properties:
        expertId:
          type: integer
          format: int64
          description: |
            专家稳定标识，跨活动跨场景一致，可用于展示端做去重与关联。
            这是平台专家档案的标识，不是用户标识——同一个人在不同活动里的
            `expertId` 相同。
        userId:
          type: integer
          format: int64
          description: |
            该专家对应的平台用户标识，0 表示未关联。
            与 `expertId` 是不同的 ID 空间；需要跨模块对撞（例如自行关联学者库）时用这个。
        name: { type: string, description: 姓名 }
        role:
          type: string
          enum: [expert, host]
          description: 在本活动中的角色。`expert` 专家 / `host` 主持人
        organization: { type: string, description: 所属机构，可能为空串 }
        department: { type: string, description: 所属院系，可能为空串 }
        domain: { type: string, description: 研究领域，可能为空串 }
        researchFields:
          type: array
          items: { type: string }
          description: 研究方向标签，由档案里逗号分隔的研究方向拆开得到；无则为空数组
        academicLevel:
          type: string
          description: |
            学历。

            **注意不是职称**：平台侧该列名为 `academic_level`，但实测存的是
            「博士 / 硕士 / 本科」这类学历值。原型专家卡片上的职称位
            （如「中国科学院院士」）平台侧没有对应数据。
        avatar:
          type: string
          description: 头像地址，实时回查用户中心得到；服务异常或未设置时为空串

    ExchangeLiveDetail:
      type: object
      description: |
        科技直播的特有字段。

        **有意不下发回放播放地址**：平台侧回放是加密对象存储文件，需按次签发临时凭证
        才能播放，直接下发既无法使用也会暴露内部存储结构。`status` 为 `ended`
        即表示该场已结束、可能有回放。
        也不下发浏览量：直播链路上活动表的浏览量列零写入、恒为 0，观看规模请用 `joinCount`。
      properties:
        liveType: { type: string, description: 直播类型，主办方配置，可能为空串 }
        subjectAreaId: { type: integer, format: int64, description: 学科门类 ID }
        subjectAreaName: { type: string, description: 学科门类名称 }
        hostName:
          type: string
          description: 主持人展示名。用户服务异常或未配置时为空串
        speakerNames:
          type: array
          items: { type: string }
          description: |
            讲者展示名列表，无讲者时为空数组。

            姓名实时回查用户中心得到，不读活动表上的讲者姓名快照列——
            那一列只在创建时被写成空数组、此后不再维护。
        onlineViewers:
          type: integer
          format: int64
          description: 当前在线人数。仅直播中有意义，其余状态为最后一次落盘值
        joinCount:
          type: integer
          format: int64
          description: 累计观看人数，来源是进房行为记录的去重统计
        danmuCount: { type: integer, format: int64, description: 弹幕数 }
        commentCount: { type: integer, format: int64, description: 评论数 }
        likeCount: { type: integer, format: int64, description: 点赞数 }
        reservationCount:
          type: integer
          format: int64
          description: 预约人数。直播没有「报名」，只有预约

    ExchangeCourseDetail:
      type: object
      description: |
        课程的特有字段。

        **有意不下发价格与是否免费**：课程的收费商品 ID 列在平台侧零写入，
        无法判定课程的收费属性。
        **也不下发课程评分**：平台只有管理员内部打的质量管控分，没有学员评分，
        把内部管控分对外会被误读成用户口碑。
      properties:
        lecturers:
          type: array
          items: { type: string }
          description: |
            讲师署名列表，无讲师时为空数组。
            课程没有主办方概念，这是最接近的归属信息，故统一字段 `organizerName` 为空串。
        introduction: { type: string, description: 课程介绍，可能为空串 }
        teacherInfo: { type: string, description: 讲师介绍文本，可能为空串 }
        courseHour: { type: integer, format: int64, description: 课时数 }
        studyHour: { type: integer, format: int64, description: 预期学习时长（小时） }
        difficulty:
          type: integer
          description: 难度。1 低 / 2 中 / 3 高；0 表示主办方未填
        difficultyName: { type: string, description: 难度名称，未填时为空串 }
        learnerCount: { type: integer, format: int64, description: 学习人数 }
        viewCount: { type: integer, format: int64, description: 累计浏览量 }
        isPracticalCourse: { type: boolean, description: 是否实战课 }

    ExchangeActivityDetailData:
      description: |
        活动详情。**恒是列表项 `ExchangeActivityItem` 的超集**：
        列表里有的字段这里全都有，字段名、类型、语义、取值完全一致
        （服务端是同一份装配逻辑），展示端可以用同一套解析处理列表卡片与详情弹窗。

        多出来的只有 `content`（活动正文）与 `agenda`（完整议程）两项，
        都是列表刻意不带的。
      allOf:
        - $ref: '#/components/schemas/ExchangeActivityItem'
        - type: object
          required: [content, agenda]
          properties:
            content:
              type: string
              description: |
                活动正文，富文本（HTML 或 Markdown 由各业务录入时决定），可能为空串。

                各类的来源与实测填充率：
                - `exchange` 19/19 有正文；
                - `reasoning` 109/113 有正文；
                - `live` 24/24 有正文（取活动主表那份。扩展表另有一份创建时写入后
                  不再维护的副本，只 10/24 有值，仅在主表为空时作回落）；
                - `course` **恒为空串**——课程没有正文列，课程的文字介绍见
                  `course.introduction` 与 `course.teacherInfo`。
            agenda:
              type: array
              description: |
                活动议程，按议程顺序排列；无议程时为空数组。

                **只有 `exchange` 与 `reasoning` 有议程**，`live` 与 `course` 恒为空数组：
                直播的讲者挂在扩展表的用户标识列上（见 `live.hostName` /
                `live.speakerNames`），课程的章节是另一套结构、不是议程。
              items: { $ref: '#/components/schemas/ExchangeAgendaItem' }

    ExchangeAgendaItem:
      type: object
      description: |
        活动议程条目。两类活动的议程表列名不同，这里对齐成同一套字段：
        议程主题在 `exchange` 来自「议程主题」列、在 `reasoning` 来自「标题」列；
        简介分别来自「议程简介」与「内容摘要」列。

        以下原型议程字段平台侧无可用数据，不下发：
        - **议程地点**：`exchange` 的议程地点列虽然建了表，但创建与编辑都不写，
          实测挂在对外可见活动上的 26 行全为空；`reasoning` 的议程没有地点列。
          活动整体的地点见 `exchange.venueAddress`。
        - **讲者单位与头衔**：`exchange` 那两列同样零写入、实测 26 行全为空，
          `reasoning` 的议程没有这两列。带单位头衔的结构化讲者信息只有
          `reasoning.experts` 有（来自专家档案，不是议程）。
      required: [sortOrder, topic, summary, speakerName, startTime, endTime, durationMinutes]
      properties:
        sortOrder:
          type: integer
          description: 议程顺序，从 1 开始。响应已按它排好，一般不需要再排
        topic: { type: string, description: 议程主题 }
        summary:
          type: string
          description: |
            议程简介，可能为空串。
            **只有 `reasoning` 有值**：`exchange` 的议程简介列零写入，实测 26 行全为空。
        speakerName:
          type: string
          description: |
            讲者姓名，可能为空串。自由文本，实测存在「主持人：王教授」这类写法。
        startTime:
          type: string
          description: |
            议程开始时刻，**原样返回主办方录入的文本，格式不保证**。

            平台侧该列是字符串类型而不是时间类型，存的是主办方手填的内容，没有格式校验。
            实测存在两种写法：
            - 仅时刻 `14:00`：`reasoning` 99/99 全是这种，`exchange` 24/26 是这种；
            - 完整日期时间 `2026-09-20 15:00:00`：`exchange` 里有 2/26 是这种。

            所以**不要按固定格式解析**。只有时刻没有日期时，日期以活动的 `startTime` 为准。
            主办方未填时为空串。
        endTime:
          type: string
          description: 议程结束时刻，格式与 `startTime` 同，同样不保证格式
        durationMinutes:
          type: integer
          description: |
            议程时长（分钟），0 表示未填。
            **只有 `reasoning` 有值**：`exchange` 的议程表没有这一列，恒为 0。

    ExchangeSyncData:
      type: object
      description: |
        活动增量同步结果。记录按 `updateTime` 升序返回，按水位线推进不会漏。
      required: [activityType, activityTypeName, total, page, pageSize, items]
      properties:
        activityType:
          type: string
          enum: [exchange, reasoning, live, course]
          description: 本次同步的活动类型，回显请求入参
        activityTypeName: { type: string, description: 活动类型名称 }
        total:
          type: integer
          format: int64
          description: 满足水位线条件的变更总条数（同步基准集合内）
        page: { type: integer }
        pageSize: { type: integer }
        nextUpdatedSince:
          type: string
          format: date-time
          nullable: true
          description: |
            建议的下次水位线，取本页最后一条的 `updateTime`。
            **本页为空时为 `null`**，此时下游应保持上次水位线不变。
        items:
          type: array
          description: 变更记录，无变更时为空数组（不是 null）
          items: { $ref: '#/components/schemas/ExchangeSyncItem' }

    ExchangeSyncItem:
      type: object
      description: |
        活动变更记录。

        **当前已不可见的活动也会出现在这里**，`status` 为 `removed`。
        这是下游感知「哪一条该从自己的展示里移除」的唯一途径——列表接口只返回当前可见的
        活动，一条活动下架后会直接从列表里消失，下游无从知道它是被下架了还是翻页错了。
      required: [activityType, activityId, status, title, isArchived, updateTime]
      properties:
        activityType:
          type: string
          enum: [exchange, reasoning, live, course]
          description: 活动类型，与请求一致
        activityId:
          type: string
          description: 活动标识，可直接用于详情接口
        status:
          type: string
          enum: [visible, removed]
          description: |
            当前状态：
            - `visible` 仍对外可见，内容可能有更新，建议重新拉取详情；
            - `removed` 已不对外可见，下游应移除。

            `removed` 覆盖四种情形，**不做区分**（对外都是「该移除了」这一个动作）：
            已下架、已取消、已删除、推广范围改成了「仅认证用户可见」。
        title:
          type: string
          description: 标题。`removed` 的记录仍返回标题，便于下游核对要移除的是哪一条
        isArchived:
          type: boolean
          description: |
            是否已归档。归档不影响可见性，归档的活动 `status` 仍可能是 `visible`。
        updateTime:
          type: string
          format: date-time
          description: |
            本条记录的更新时间，即水位线依据。

            `course` 的该值是课程表与版本表更新时间的**较大者**：课程内容改在课程表上、
            上架下架改在版本表上，只看一侧会漏掉另一侧的变更。

    CommunicationContentListResponse:
      type: object
      description: 统一响应包装，口径同 CompetitionListResponse。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/CommunicationContentListData' }
        error: { type: string, description: 业务失败时的错误描述，成功时不返回 }

    CommunicationContentListData:
      type: object
      required: [total, page, pageSize, items, categories]
      properties:
        total: { type: integer, format: int64, description: 符合筛选条件的总条数 }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/CommunicationContentItem' }
        categories:
          type: array
          description: |
            内容类型导航及各类数量。固定返回全部 7 个类型（数量为 0 的也返回），
            顺序稳定，可直接用于渲染类目卡片。

            该统计与本次筛选条件无关，始终是全量可见内容的分布；
            与列表使用同一套可见性条件，不会出现导航数量与实际可查条数不一致。
          items: { $ref: '#/components/schemas/CommunicationCategoryItem' }

    CommunicationCategoryItem:
      type: object
      properties:
        contentType: { type: integer, format: int64, description: 内容类型 ID }
        contentTypeName: { type: string, description: 内容类型名称 }
        count: { type: integer, format: int64, description: 该类型下对外可见的内容数 }

    CommunicationContentItem:
      type: object
      description: |
        传播内容列表项。以下需求项平台侧无数据，整体不下发：
        点赞数（无该列）、收藏数（列存在但零写入）、分发渠道、
        月度浏览趋势 / 活跃用户 / 真实 UV（只有累计计数器，无行为流水表）。
      properties:
        contentId: { type: integer, format: int64, description: 内容 ID，用于调用详情接口 }
        title: { type: string }
        summary: { type: string, description: 摘要 }
        coverImageUrl: { type: string, description: 封面图地址，可能为空串 }
        contentType:
          type: integer
          format: int64
          description: |
            内容类型（需求的「类别」维度）。1 顶级期刊 / 2 学术会议 / 3 前沿成果 /
            4 活动资讯 / 5 技术课程 / 6 成果转化 / 7 需求发布
        contentTypeName: { type: string, description: 内容类型名称，未知取值时为空串 }
        subjectCategoryId:
          type: integer
          format: int64
          description: |
            产业集群（需求的「主题」维度）。1 细胞与基因 / 2 合成生物 / 3 智能机器人 /
            4 前沿新材料 / 5 光载信息 / 6 深地深海 / 7 脑科学与脑机工程 / 8 量子信息 / 9 其他
        subjectCategoryName: { type: string, description: 产业集群名称 }
        subjectAreaId:
          type: integer
          format: int64
          description: |
            学科门类（13 值）。与产业集群是**不同粒度**的维度：
            这里是哲学/理学/工学这类学科划分，覆盖不了「人工智能 vs 量子计算」的区分。
        subjectAreaName: { type: string, description: 学科门类名称 }
        institutionTypeId: { type: integer, format: int64, description: 发布机构类型 ID }
        institutionTypeName: { type: string, description: 发布机构类型名称 }
        institutionName: { type: string, description: 发布机构名称，可能为空串 }
        tags:
          type: array
          items: { type: string }
          description: |
            内容标签，含作者手填与平台自动打标两种来源，接口不区分来源。
            无标签时为空数组（不是 null）。对应详情页标题右侧展示的标签。
        viewCount:
          type: integer
          format: int64
          description: 累计浏览量。是累计值而非周期值，平台侧没有按时间分解的浏览统计
        shareCount: { type: integer, format: int64, description: 累计分享次数 }
        publishTime:
          type: string
          format: date-time
          nullable: true
          description: 最近发布时间
        updateTime:
          type: string
          format: date-time
          description: 最后更新时间，可用于增量判断
        detailUrl:
          type: string
          description: |
            内容在本平台的前端详情页链接，供展示端直接跳转。

            形如 `{平台地址}/tics/sci-comm/hot-spot/detail/{contentId}`，
            例如 `https://szc.test.dp.tech/tics/sci-comm/hot-spot/detail/110`。
            路径末段是 `contentId` 原值，科技传播域没有竞赛那样的混淆 ID 层。

    CommunicationContentDetailResponse:
      type: object
      description: 统一响应包装，口径同 CompetitionListResponse。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/CommunicationContentDetailData' }
        error: { type: string, description: 业务失败时的错误描述，成功时不返回 }

    CommunicationContentDetailData:
      allOf:
        - $ref: '#/components/schemas/CommunicationContentItem'
        - type: object
          description: 详情在列表项字段之上追加正文与元数据。
          properties:
            content: { type: string, description: Markdown 正文 }
            authorName:
              type: string
              description: 作者展示名。用户信息服务异常时降级为空串
            authorAvatar:
              type: string
              description: 作者头像地址。服务异常或未设置时为空串
            datasetUrl: { type: string, description: 作者填写的数据集链接，可能为空串 }
            codeRepoUrl: { type: string, description: 作者填写的代码仓库链接，可能为空串 }
            references:
              type: array
              description: 参考文献列表。解析失败时返回空数组，不影响正文可用
              items: { type: string }
            firstPublishTime:
              type: string
              format: date-time
              nullable: true
              description: 首次发布时间
            isArchived: { type: boolean, description: 是否已归档。归档内容仍可访问 }
            averageScore:
              type: number
              format: double
              description: 平均评分（1~5）。无人评分时为 0
            ratingCount:
              type: integer
              format: int64
              description: 参与评分人数。无人评分时为 0

    CommunicationSyncResponse:
      type: object
      description: 统一响应包装，口径同 CompetitionListResponse。
      required: [code]
      properties:
        code: { type: integer, description: 0 表示成功，非 0 表示业务失败, example: 0 }
        data: { $ref: '#/components/schemas/CommunicationSyncData' }
        error: { type: string, description: 业务失败时的错误描述，成功时不返回 }

    CommunicationSyncData:
      type: object
      properties:
        total: { type: integer, format: int64, description: 符合水位线条件的总变更数 }
        page: { type: integer }
        pageSize: { type: integer }
        nextUpdatedSince:
          type: string
          format: date-time
          nullable: true
          description: |
            建议的下次水位线，取本页最后一条的 `updateTime`。
            本页为空时返回 null，此时下游应保持原水位线不变。
        items:
          type: array
          items: { $ref: '#/components/schemas/CommunicationSyncItem' }

    CommunicationSyncItem:
      type: object
      description: |
        内容变更记录。已下线内容也会出现，这是下游感知下架的唯一途径。
        对已下线记录只回状态与时间戳，不回正文等内容字段。
      properties:
        contentId: { type: integer, format: int64 }
        status:
          type: string
          enum: [published, offline]
          description: |
            内容状态。`published` 已发布、`offline` 已下线。
            `offline` 即为删除信号，下游应移除该条内容的展示。

            这里刻意不下发库内的数字枚举，避免下游硬编码内部状态值。
        title:
          type: string
          description: 标题。已下线记录仍返回，便于下游核对要移除的是哪条
        isArchived: { type: boolean, description: 是否已归档 }
        publishTime:
          type: string
          format: date-time
          nullable: true
          description: 最近发布时间
        offlineTime:
          type: string
          format: date-time
          nullable: true
          description: 下线时间。未下线时为 null
        updateTime:
          type: string
          format: date-time
          description: 本条记录的更新时间，即水位线依据
