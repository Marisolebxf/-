  /szc/v1/open/exchange/activity/sync:
    get:
      tags: [科技交流]
      summary: 多场景数据流转与交互支持接口（活动增量同步）
      operationId: syncOpenExchangeActivities
      description: |
        需求 2.7.3.3 S-03 多场景数据流转与交互支持接口。
        供下游按更新时间增量拉取活动变更，保证专题页、详情弹窗等多个场景的数据一致。

        ### 用法
        1. 首次不传 `updatedSince`，全量拉取（按 `page` 翻完）；
        2. 记下响应里的 `nextUpdatedSince`；
        3. 之后每次把它作为 `updatedSince` 传入，只拿增量。

        记录按 `updateTime` **升序**返回，所以按水位线推进不会漏。
        同一时间戳的多条记录用标识补充排序，翻页顺序完全确定。

        ### 为什么必须用这个接口而不是轮询列表
        列表接口只返回**当前可见**的活动。一条活动下架后会直接从列表里消失，
        下游无从判断它是被下架了还是自己翻页错了，结果是已撤回的内容一直挂在页面上。

        本接口会把当前已不可见的活动也返回，`status` 为 `removed`，
        这是下游能正确移除内容的唯一途径。

        ### 数据范围比列表宽
        同步流的范围是「**曾经通过审核**」的活动（`course` 为「曾经上架」，
        即已上架或已下架）。从未审核通过的活动不会出现：它从来没有对外可见过，
        下游手里不可能有它，推一条 `removed` 只是噪音。

        实测各类的基准集合与其中当前可见的条数：

        | activityType | 同步基准集合 | 其中当前可见 | removed |
        | --- | --: | --: | --: |
        | `exchange` | 22 | 19 | 3 |
        | `reasoning` | 129 | 113 | 16 |
        | `live` | 73 | 24 | 49 |
        | `course` | 68 | 55 | 13 |

        ### 需为四类各维护一个水位线
        `activityType` 必填。四类的更新时间来自不同的表——前三类看活动主表的更新时间，
        课程要取课程表与版本表更新时间的**较大者**（课程内容改在课程表上、
        上架下架改在版本表上，只看一侧会漏掉另一侧的变更）。
        一条水位线无法同时对四类成立，所以不做跨类型合并。

        ### 与需求里其他约定项的对应
        - **主键跨场景一致**：`activityId` 可直接用于详情接口；资源与专家的稳定标识
          见详情响应里的 `resources[].resourceId` 与 `experts[].expertId`。
        - **更新时间字段**：即本接口的 `updateTime`。
        - **空态**：本页无变更时 `items` 为 `[]`（不是 `null`），
          `nextUpdatedSince` 为 `null`，下游应保持原水位线不动。
        - **错误码**：gkx-core 正常处理的业务结果看 `code`；代理、网络或超时等基础设施失败可能使用非 200 HTTP 状态。
        - **地图组件**：无法支持，平台侧没有经纬度列。
      parameters:
        - name: activityType
          in: query
          required: true
          description: 活动类型，取值与列表接口一致。四类需各自维护一个水位线
          schema:
            type: string
            enum: [exchange, reasoning, live, course]
        - name: updatedSince
          in: query
          required: false
          description: |
            水位线，只返回更新时间**严格晚于**该时刻的记录；为空表示全量拉取。
            用严格大于而不是大于等于：水位线本身那一条上一轮已经给过了。
            接受格式 `2006-01-02 15:04:05`、RFC3339、`2006-01-02`。
            **格式不合法会直接报错**，不会静默忽略——静默忽略会让调用方以为水位线生效、
            实际每次都拿到全量，表现是「同步永远同步不完」，极难排查。
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          description: |
            每页条数，默认 20，上限 200。上限比列表接口（100）宽：
            同步返回的是轻量投影（标识、标题、状态、时间戳），单条体积远小于列表项。
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: gkx-core 正常处理的业务结果看 `code`；代理、网络或超时等基础设施失败可能使用非 200 HTTP 状态。
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: { type: integer, example: 0 }
                  data: { $ref: '#/components/schemas/ExchangeSyncData' }
              examples:
                增量拉取_含下架信号:
                  value:
                    code: 0
                    data:
                      activityType: "exchange"
                      activityTypeName: "科技交流"
                      total: 22
                      page: 1
                      pageSize: 20
                      nextUpdatedSince: "2026-09-29T10:03:02+08:00"
                      items:
                        - activityType: "exchange"
                          activityId: "491"
                          status: "visible"
                          title: "智能机器人产业技术交流会"
                          isArchived: false
                          updateTime: "2026-09-28T14:28:06+08:00"
                        - activityType: "exchange"
                          activityId: "181"
                          status: "removed"
                          title: "（已下架）早期测试活动"
                          isArchived: false
                          updateTime: "2026-09-28T16:10:41+08:00"
                        - activityType: "exchange"
                          activityId: "543"
                          status: "visible"
                          title: "先进材料计算前沿学术交流会"
                          isArchived: true
                          updateTime: "2026-09-29T10:03:02+08:00"
                本轮无变更:
                  value:
                    code: 0
                    data:
                      activityType: "live"
                      activityTypeName: "科技直播"
                      total: 0
                      page: 1
                      pageSize: 20
                      nextUpdatedSince: null
                      items: []
                水位线格式错误:
                  value:
                    code: 148888
                    error: "invalid time format: 2026/09/29"

  /szc/v1/open/communication/content/list:
    get:
      tags: [科技传播]
      summary: 标准化数据查询服务
      operationId: listOpenCommunicationContents
      description: |
        需求 2.7.5.3-1 标准化数据查询服务。返回平台对外可见的科技传播内容，
        支持需求要求的「类别 / 时间 / 主题」三个维度筛选与分页。维度对应关系：

        | 需求维度 | 本接口参数 | 平台侧字段 |
        | --- | --- | --- |
        | 类别 | `contentTypes` | 内容类型（7 值，多选） |
        | 主题 | `subjectCategoryId` | 产业集群（9 值） |
        | 时间 | `publishStartTime` / `publishEndTime` | 最近发布时间 |

        另额外开放「学科门类」`subjectAreaIds`（13 值）与「发布机构类型」
        `institutionTypeIds` 两个维度。注意学科门类与产业集群是**不同粒度**的两个维度，
        前者是哲学/理学/工学这类学科划分，后者是智能机器人/量子信息这类产业方向。

        响应同时带回 `categories`（内容类型导航及各类数量），展示端渲染类目卡片
        无需再单独请求。该统计口径与本次筛选条件无关，始终是全量可见内容的分布，
        且与列表使用同一套可见性条件，不会出现「导航显示 10 条、点进去只有 3 条」。

        可见性由服务端固定：仅返回状态有效、已发布、版本审核通过、访问范围公开、
        且面向全体用户（非仅认证用户可见）的内容。

        排序支持最新发布、最多浏览、评分最高。**不支持「最多点赞」**：平台侧
        没有点赞列，收藏数列虽存在但零写入，均无法作为排序依据。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 关键词，模糊匹配标题与摘要
          schema: { type: string, maxLength: 100 }
        - name: contentTypes
          in: query
          required: false
          description: |
            内容类型多选（需求的「类别」维度）。重复传参实现多选，
            如 `?contentTypes=1&contentTypes=2`。

            1 顶级期刊 / 2 学术会议 / 3 前沿成果 / 4 活动资讯 /
            5 技术课程 / 6 成果转化 / 7 需求发布
          schema:
            type: array
            items: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7] }
        - name: subjectCategoryId
          in: query
          required: false
          description: |
            产业集群（需求的「主题」维度）。

            1 细胞与基因 / 2 合成生物 / 3 智能机器人 / 4 前沿新材料 / 5 光载信息 /
            6 深地深海 / 7 脑科学与脑机工程 / 8 量子信息 / 9 其他
          schema: { type: integer, minimum: 1, maximum: 9 }
        - name: subjectAreaIds
          in: query
          required: false
          description: |
            学科门类多选（13 个门类）。与 `subjectCategoryId` 是不同粒度的维度。

            1 哲学 / 2 经济学 / 3 法学 / 4 教育学 / 5 文学 / 6 历史学 / 7 理学 /
            8 工学 / 9 农学 / 10 医学 / 11 军事学 / 12 管理学 / 13 艺术学
          schema:
            type: array
            items: { type: integer, minimum: 1, maximum: 13 }
        - name: institutionTypeIds
          in: query
          required: false
          description: 发布机构类型多选
          schema:
            type: array
            items: { type: integer, minimum: 1 }
        - name: publishStartTime
          in: query
          required: false
          description: |
            发布时间下限（含）。接受 `2006-01-02`、`2006-01-02 15:04:05`、RFC3339 三种格式。
            格式不合法直接返回业务错误，不会静默忽略后返回全量数据。
          schema: { type: string, example: "2026-01-01" }
        - name: publishEndTime
          in: query
          required: false
          description: 发布时间上限（含），格式同上
          schema: { type: string, example: "2026-12-31" }
        - name: sortType
          in: query
          required: false
          description: |
            排序方式。省略为综合排序（浏览量优先，其次发布时间）。

            - `LATEST` 最新发布
            - `HOTTEST` 最多浏览
            - `SCORE` 评分最高（按平均分，其次评分人数）
          schema:
            type: string
            enum: [LATEST, HOTTEST, SCORE]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationContentListResponse' }
              examples:
                成功:
                  value:
