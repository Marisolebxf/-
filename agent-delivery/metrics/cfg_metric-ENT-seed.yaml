    source_tables: ["ads: dwd.enterprise", "dwd.enterprise <- ods: dwd_org_reg_info, dwd_company_base"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
