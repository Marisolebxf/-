# cfg_metric 种子 —— 产业链域（CHAIN）M_CHAIN_* 指标 8 件套
# ============================================================================
# 作用：把产业链维度全部 M_CHAIN_* metric_id 升级为 cfg_metric 8 件套种子
#       （D9 数据血缘铁律），供 algorithm-agent 实现 formula、api-agent 上线时读取。
# 输入真源：dwd_industry_chain_info / dwd_org_industry_chain_dtl /
#           dwd_org_industry_chain_prod_dtl / dwd_org_industry_chain_pat_dtl /
#           dwd_industry_chain_news_info
# 维护：data-agent  ·  创建：2026-06-23  ·  Wave 0（Mock 阶段）
# ----------------------------------------------------------------------------
# 状态图例（mapping_status）：
#   ✅ 源可直接聚合且口径清晰
#   🔧 源有原料但 formula 待 algorithm-agent
#   ⚠️ 源可用但业务口径待甲方确认（definition pending_data_lead）
#   ❌ 无来源（no_source）；或需独立采购（非平台默认计算）
#   🔧 calc_from_ent：跨域计算（如市场规模=链下企业年报营收加总）
# 8 件套：metric_id / metric_name_zh / definition / formula / source_tables /
#         source_systems / update_freq / version
# 推荐字段：is_mock / bid_ref / acceptance_unit_id / owner_agent / mapping_status
# ============================================================================

version: 1
updated: "2026-06-23"
domain: CHAIN
element_alias_note: "M_CHAIN_* 对应产业链要素 E2，按 Q009 统一为字母助记码 CHAIN"
seed_version: "0.1.0"
batch: mock_20260623
total_metrics: 60

defaults:
  source_systems: ["Mock @ batch=mock_20260623"]
  is_mock: true
  owner_agent: data-agent
  version: "0.1.0"

metrics:
  - metric_id: M_CHAIN_MARKET_SIZE
    metric_name_zh: 市场规模
    definition: "产业链下全部关联企业的年报营收合计（仅企业，不计机构/人才等）；单位默认亿元（展示换算在 ADS）。统计年与 ENT 年报字段对齐。非 ODS 直灌、非外购市调默认口径。"
    formula: "SUM(ent_annual_revenue) WHERE enterprise_code IN (SELECT entity_id FROM industry_chain_entity_rel WHERE chain_id=:chain_id AND entity_type='enterprise' AND valid_to IS NULL AND is_deleted=0) AND fiscal_year=:stat_year"
    source_tables:
      - "dwd.industry_chain_entity_rel"
      - "ENT域企业年报营收表（字段名与 ENT DWD 对齐后冻结）"
    source_systems: ["gkx-chain-rel", "gkx-ent-annual-report"]
    update_freq: yearly
    version: "0.2.0"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QC06
    source_status: calc_from_ent
    owner_agent: data-agent
  - metric_id: M_CHAIN_MARKET_GROWTH
    metric_name_zh: 市场增长率
    definition: "产业链市场规模同比增长率；依赖 M_CHAIN_MARKET_SIZE 相邻两年计算结果。"
    formula: "(M_CHAIN_MARKET_SIZE(y)-M_CHAIN_MARKET_SIZE(y-1))/NULLIF(M_CHAIN_MARKET_SIZE(y-1),0)*100"
    source_tables:
      - "ADS/指标引擎基于 M_CHAIN_MARKET_SIZE"
    source_systems: ["gkx-metric-engine"]
    update_freq: yearly
    version: "0.2.0"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QC06
    source_status: calc_from_ent
    owner_agent: data-agent
  - metric_id: M_CHAIN_ENTERPRISE_COUNT
    metric_name_zh: 产业链关联企业数
    definition: "纳入产业链要素库的关联企业去重总数；统计窗口为最新批次快照，对象范围 dwd.industry_chain_enterprise 全量，按 enterprise_code 去重。"
    formula: "COUNT(DISTINCT dwd.industry_chain_enterprise.enterprise_code)"
    source_tables: ["ads: chain_overview", "dwd.industry_chain_enterprise <- ods: dwd_org_industry_chain_dtl"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    owner_agent: data-agent
  - metric_id: M_CHAIN_ENTERPRISE_NEW_COUNT
    metric_name_zh: 新增关联企业数
    definition: "按年份分组新增产业链关联企业数；统计窗口为逐年，按 chain_score 首次出现年份或注册年份归集去重。"
    formula: "COUNT(DISTINCT enterprise_code) GROUP BY YEAR(首次关联时间)"
    source_tables: ["dwd.industry_chain_enterprise <- ods: dwd_org_industry_chain_dtl"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    owner_agent: data-agent
  - metric_id: M_CHAIN_INSTITUTION_COUNT
    metric_name_zh: 产业链关联机构数
    definition: "产业链关联科研机构/高校去重总数；对象范围 dwd.industry_chain_enterprise 中 org_type=机构 的记录，按 enterprise_name 去重。"
    formula: "COUNT(DISTINCT enterprise_name) WHERE org_type='机构'"
    source_tables: ["dwd.industry_chain_enterprise <- ods: dwd_org_industry_chain_dtl"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    owner_agent: data-agent
  - metric_id: M_CHAIN_INVEST_TOTAL
    metric_name_zh: 投融资总额
    definition: "pending_data_lead(QC07)：产业链相关投融资事件总金额（单位：万元）；可基于 dwd_industry_chain_news_info 融资类资讯+NLP抽取金额，或采购三方投融资数据库。"
    formula: "pending_algorithm（NLP抽取融资金额 / 采购数据聚合）"
    source_tables: ["dwd.industry_chain_news <- ods: dwd_industry_chain_news_info(融资类)"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
