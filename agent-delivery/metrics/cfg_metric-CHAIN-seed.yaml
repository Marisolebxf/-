    pending_ref: QC07
    definition_status: pending_data_lead
    owner_agent: data-agent
  - metric_id: M_CHAIN_INVEST_COUNT
    metric_name_zh: 投融资事件数
    definition: "pending_data_lead(QC07)：产业链相关投融资事件去重计数；数据源同 M_CHAIN_INVEST_TOTAL。"
    formula: "COUNT(DISTINCT news_id) WHERE news_type='financing'"
    source_tables: ["dwd.industry_chain_news <- ods: dwd_industry_chain_news_info(融资类)"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: "0.1.0"
