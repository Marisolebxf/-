city_ruling: |
  城市创新数据监控（基金/投资规模、机构与企业投入、创新成果；查看各城详情）
    = innov/ADS 看板读面 → other_system。不是 186 活力指数「实时监控」。
    禁止因 05 无「城市数据监控」专叶而 missing。禁止 mapped 182–191。
  创新能力排名计算：原文点名「基于数据模型分析计算各大城市的创新能力排名」，并可查看计算方法。
    对照 05 seq 186 区域创新活力综合分析模型（衡量区域科技/产业/人才/政策的创新能力与发展潜力，
    输出活力指数、单维评分，支持按区域查询与横向对比；排名=指数排序，与 SYNTH-VITALITY 同一叶）。
    半成品行38 调用系统=科技信息展示系统/科技指数计算，覆盖判定跟 186 → mapped，不改打 other_system。
    禁止 missing「库无城市排名叶」。禁止用 182 单维成果指数顶替综合排名。
    禁止用 M_CHAIN_REGION_INDEX / M_CHAIN_SZ_ADVANTAGE_RANK / M_CHAIN_COMPETITIVENESS_INDEX 顶替。
    禁止改挂 M_SYNTH_VIT_RANK 为本页 metric_id。计算方法=186 阈值/权重读面，不另开 missing。
  城市对标分析：选多城对比视图，展示创新投入、产出、环境差异。
    对照同一 186 叶的横向对比 + 单维评分 → mapped。
    招标三维（投入/产出/环境）≠ 186 四维（科技/产业/人才/政策）→ B 类名称/框架欠账，不另开 A。
    禁止 mapped 182–185 拼出三维。禁止用 seq 191 协同对比顶替。选城/对比图壳见订阅旁交互，不另 missing。
  创新能力要素分析：关键要素如人才、资金、政策，看各城在不同要素上的表现。
    对照 seq 187 区域创新要素类型综合评价（人才/企业/政策/服务机构/科研机构/资金/空间，
    输出各要素维度量化评分）→ mapped。例示三要素 ⊂ 七要素。
    禁止用 184/185 单维成果模型冒充人才/政策要素。禁止 mapped 188/189/190 层次/领域/综合指数。
    禁止 also_in SYNTH-ELEMENT M_SYNTH_ELEM_CONTRIB（贡献路径 ≠ 要素表现）。
    禁止改挂 M_SYNTH_ELEM_TYPE_SCORE。
  城市订阅功能：订阅关注城市，定期推送创新动态与能力变化 → n/a_ops。
    不是 seq 65 成果订阅、不是 seq 80 监测订阅。禁止改挂 M_SVC_REC_*。
  创新政策建议：基于城市创新能力分析结果提供针对性建议，用户查看并参考。
    原文未点名生成模型/算法。不要硬挂 seq 185 政策综合评价（评已有政策成效，不是本页建议生成）。
    186/187 报告附录「策略建议」是模型输出附带文案，不把本叶改挂 mapped。
    无专叶且是报告读面/文案 → other_system。禁止 missing「库无政策建议生成叶」。
  人才创新指数（xlsx 行34）：调用系统=新型高端智库/科技人才智慧服务（上层封装）→ other_system。
    禁止 mapped seq 184。不是 187 人才要素得分（见 CITY-D05）。

