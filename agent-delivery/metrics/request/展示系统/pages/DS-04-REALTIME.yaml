realtime_ruling: |
  数据指标分类展示（专利数量、论文引用率、投资金额等类别，用户选看）
    = innov/ADS V1 指标字段 + 前端分类切换 → other_system。
    不是 05 文本分类/基础指标专叶。禁止 mapped seq 96 论文量/专利量公式。
    禁止 also_in M_CHAIN_PATENT_COUNT（专题产业链关联专利数，不是本页全球看板计数）。
    不发明 M_INNOV_PATENT_* / M_REALTIME_*。
  可视化数据呈现（柱状图、折线图、饼图、热力图；用户切换图种）
    = 同一套 innov/ADS 指标的图表读面 → other_system。
    图种切换是图壳，不另开 missing，也不另开 n/a_ops 行。
    热力图是指标分布图，不是 DS-03 话题热力图，禁止 mapped seq 134。
    不是 GIS 热力；GIS 成果落点归 OVERVIEW seq 57 / DETAIL seq 61。
  知识图谱创新点落图（创新点落到领域知识图谱，看位置与关联）
    = 对照 seq 116（3）图谱可视化 API +（2）实体关系查询 API → mapped。
    详设可选 graph/view 走同一图谱 API，不是 GIS 地理落点。
    禁止因「落图」二字改打 other_system（那是只要 GIS 落点才 other_system）。
    禁止用 116（5）网络指标计算顶替本页赋分。禁止 mapped 技术链构图 seq 104/105。
  实体节点影响赋分（对图谱实体做创新影响赋分，看分数与排名）
    = 半成品 xlsx 行36「创新影响分数」，调用系统=深度挖掘算法 / 深度分析模型。
    原文明确要赋分算法。seq 116（5）只列网络密度、中心度，不是「创新影响赋分」。
    M_SVC_GRAPH_INFLUENCE / CENTRALITY 是 B 轨服务链图指标，对象不同，禁止改挂、禁止 missing 这两条 ID。
    禁止 also_in DS-02-PATH 中心度（不是同一指标）。
    05 97 叶无「全球/领域知识图谱实体创新影响赋分」专叶 → missing。不发明 M_*。
    分数列表/排名读面不另开 missing。
  创新影响预测（基于图谱与影响分数，预测对领域创新的积极影响及贡献度，看预测与趋势）
    = 招标父句「利用数据模型开展趋势预测和判断」+ 半成品 xlsx 行39「创新贡献度」。
    详设写预测模型可 501 = 实现通道可选，A2 仍对照 05：无全球创新影响预测专叶 → missing。
    禁止硬挂综合 seq 182–191（区域综合评价；182 虽含趋势分析报告，对象=区域指数不是全球实时影响预测）。
    禁止改挂 DS-07 科学创造力趋势预测 / 技术创新趋势预测（xlsx 行71/77，不是本五级）。
    禁止 also_in M_SYNTH_ELEM_CONTRIB（专题要素贡献度与影响路径，已 missing，对象不同）。
    不发明 M_*。预测结果/趋势读面不另开 missing。
  实时数据更新（刷新全球创新数据、看最新变化）
    = innov/ES/ADS 看板刷新 → other_system。不是 05 模型。
    不是 OVERVIEW seq 60「最新发布成果列表」刷新。

