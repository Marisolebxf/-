    看板壳 other_system。识别能力已由 PE-D02 焦点 166 + PE-D03 短板 169 mapped，不另开 missing。
    PLAN E4 规则 Mock 打标是 Wave0 实现，不改库覆盖。禁止伪 NLP 专叶 missing。
