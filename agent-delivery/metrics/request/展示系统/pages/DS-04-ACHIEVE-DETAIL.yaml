    「创新价值」在本页只读已落库字段。数值计算模型归 DS-04-ACHIEVE-OVERVIEW seq 59；
    对创新点做价值评估报告归 DS-04-MONITOR seq 79。本页不 missing 价值模型。
  关联载体（seq 64：企业/机构及它们的其它成果）= innov ADS 实体外键/列表下钻。other_system。
    需规是展示关联，未点名 05 关系抽取/构图。禁止 mapped 综合/图谱API seq 116。
    禁止因 05 无「成果—载体」专叶而 missing。
  订阅（seq 65）本页只消费「从详情订阅这一条成果」开关。n/a_ops。
    按区域/领域/类型设条件、订阅管理、智能推送归 DS-04-MONITOR seq 80–82，不进本页。
  创新成果对比（seq 66）= 用户勾选多条成果，对比视图并排展示创新价值 / 技术领域 / 地理分布等已有字段差异。
