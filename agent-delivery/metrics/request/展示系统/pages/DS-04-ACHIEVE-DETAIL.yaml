  地理标注（seq 61）= innov/ADS 成果坐标落到 GIS 点。other_system。不是 05 构图。
  地理范围筛选（seq 62）= 地图画矩形/圆/多边形或行政区划过滤成果列表。GIS 空间查询 + ADS。
    other_system。不是 05 模型。
