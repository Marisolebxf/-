result_ruling: |
  话题热力图（按技术领域关键词/主题出热度分布，展示关注度与活跃程度）
    = 对照 05 seq 134 技术前沿热点领域识别模型（研究热度 / 关键词权重 / 专家活跃度）。
    库已列叶且专题 TECH-D04/D05 记 third_party → 本页 third_party。禁止伪展开热度公式。
    禁止 missing「库无热力图叶」。禁止 mapped seq 96(11) 资讯热点标签冒充 134。
    时间轴看不同时期、悬停数值、点击下钻评估详情 = 图壳 → n/a_ops（见 RS-D05）。
  地理分布图（按区域呈现发展水平 / 应用 / 投资分布；缩放全球-国家-区域；图例筛技术类型）
    = 展示 GIS + ADS 读面 → other_system。
    禁止用综合 seq 182–191 区域综合评价顶替（原文不是那些模型）。
    禁止 mapped seq 104「地理位置」属性抽取当 GIS。禁止 mapped seq 96 区域论文/专利当本页地图模型。
    禁止 missing「库无地理分布叶」。点击区域看评估报告/发展建议 = 报告读面，不是 seq 140 深圳布局 Job。
  动态气泡图（大小=规模或投资额，位置=发展阶段或成熟度，颜色=类型/领域）
    = 位置维对照 seq 137 技术阶段分析模型（含成熟度指数输入）。实现类 third_party。
    禁止 missing「库无气泡图叶」。禁止用 M_CHAIN_PHASE_DETERMINATION / CYCLE_STAGE / TECH_MATURITY_SCORE 顶替。
    大小维（规模/投资）= ADS 编码，不是 05 气泡专叶；seq 96 无「技术规模/投资额」专名，
    禁止把论文量/专利量/交易额抄成气泡大小公式，禁止因此 missing。
    调坐标轴 / 时间轴播放 / 点击气泡看参数 = 图壳 n/a_ops。禁止改挂 seq 132 历程模型。
  弦线图（技术关联与影响路径；线粗=关联强度；色=技术类别）
    = 对照 seq 105 技术实体关系抽取（技术-技术边及关联强度）→ mapped。
    「影响路径」是弦上的关系流向可视化，不是 DS-02-PATH 关键路径，不是专题 M_SYNTH_ELEM_CONTRIB。
    禁止 also_in SYNTH-ELEMENT（不是同一缺口）。旋转/缩放/筛选/点击节点 = 图壳 n/a_ops。
    禁止 mapped seq 116。禁止用 M_SVC_GRAPH_* 顶替。

