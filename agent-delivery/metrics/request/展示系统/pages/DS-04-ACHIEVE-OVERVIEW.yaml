achieve_ruling: |
  分类列表 / 类型标签（专利、论文、创新资讯、创新机构、企业动态）= innov/ADS/ES 源类型字段
    + 前端筛选 → other_system。不是 05 文本分类模型。
    「按照创新价值进行自动分类」若指价值分档，消费同一「创新价值」分值，不另开 missing。
  检索分析（招标父句）= innov ES 检索门面 → other_system。禁止 mapped seq 116 实体检索 API。
  地理位置可视化（成果坐标落全球地图、缩放平移看分布）= GIS + innov 坐标 → other_system。
    缩放平移是本页地图壳，不抢 DS-01-MAP；地理标注/框选/详情归 DETAIL seq 61–63。
  重点成果突出：原文是高亮/闪烁/飞线 +「用户可设置」价值阈值、特定领域。
    判定 = 前端可视化 + 用户条件壳 → n/a_ops。不是自动重要性识别模型。
    阈值字段来自创新价值分值（本页唯一 A 类），禁止把本叶再打一条 missing。
  创新价值排序：原文点名「创新价值数值计算模型」再按价值高低看列表。
    半成品 xlsx 行35 主项=创新价值，调用系统=深度挖掘算法 / 深度分析模型。
    05 八维 97 叶无「全球创新成果价值」专叶。综合 seq 182 是区域科技创新成果综合评价
    （区域指数/优势领域，对象=区域不是全球成果清单逐条分值）→ 禁止硬挂 mapped。
    列表升序/降序/空态是同一结果的交互壳，不另开 missing。不发明 M_*。
  实时更新 / 最新发布成果 = innov/ES 按发布时间刷新列表 → other_system。
    不是 REALTIME seq 72 指标看板刷新，也不是预测模型。
  V1 指标读 ADS ≠ mapped 05。本页不把专利量/论文量等 V1 计数改挂为 05 技术链基础指标。

