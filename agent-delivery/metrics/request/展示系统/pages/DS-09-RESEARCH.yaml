research_ruling: |
  展示 seq 191 ≠ 05 seq 191：编号撞车，对象不同。禁止按号 mapped。
    展示 seq 191 = 两家企业研究领域重叠度（企业－专家－学术文献－研究关键词图谱）。
    05 seq 191 = 区域创新协同分析模型（完整度/中心度/密度 → 区域创新协同指数；SYNTH-COLLAB 专叶）。
  研究领域重叠度分析：原文点名基于知识图谱「分析」「提供重叠度计算结果」。05 综合 11 叶无重叠度专叶；
    116 语义相似度是两实体通用相似度 API（产品名/关键词），不是两企业研究领域重叠度模型。
    企业维 11 叶无重叠度。原文要算法且无专叶 → missing。禁止用 116/191协同/OUTPUT_CORR 顶替。
  研究领域等级划分：对重叠度做量化等级划分，可自定义阈值。05 无等级划分专叶。
    不是 141 竞争力指数分档，不是 145/146 技术力/商业力。原文要算法 → missing。
  半成品行106 研究领域重叠度、行107 竞争情报等级：调用系统虽标「科技专题服务系统」，
    需规仍要挖掘结果且 05 无叶 → 按 schema 例外打 missing，不改 other_system。
  多企业竞争情报比对：选多家企业比对竞争情报等级，出竞争矩阵与战略定位图。
    对照企业维 11 叶：97 基础指标分布；108/109 实体识别/关系抽取；141 深圳 vs 全国竞争力；
    142 历程；143 痛难点；144 供应链；145 技术力（含对标，对象=技术力指数）；
    146 商业力（含跨企业对比，对象=商业力指数）；147/148 招引/培育推荐。
    无一叶输出「竞争情报等级 / 竞争矩阵 / 战略定位图」。对不上 → missing。
    禁止 mapped 141/145/146。禁止用 M_CHAIN_COMPETITIVENESS_INDEX / M_ENT_* 顶替。
  研究领域知识图谱展示：展示企业/专家/学术文献/研究关键词实体及关系，交互式探索。
    对照 05 seq 116 产业全要素图谱API（实体检索 / 关系查询 / 图谱可视化）→ mapped。
    只覆盖展示与查询 API，不把 116 语义相似度/网络密度/中心度改挂为重叠度或协同。
    禁止改挂 108/109 为企业 NER/RE 构建叶（那是构图，不是本页展示 API）。
    禁止抢 DS-21/DS-23。禁止用 M_SVC_GRAPH_* 顶替。
  竞争情报分析报告：基于分析结果生成报告，查看和下载。报告读面/导出 → other_system。
    禁止因重叠度 missing 把报告叶改打 missing。禁止 n/a_ops（不是 CMS/权限）。
  企业发展战略建议：技术路线/资源配置/合作机会；支持方案模拟和评估。
    派单：报告/建议 = n/a_ops 或 other_system。本叶是建议读面 → other_system。
    禁止 missing「库无战略建议/模拟叶」。禁止硬挂 147/148。不编制规划文本。
  SYNTH-COLLAB OUTPUT_CORR = 协同网络与联合发明专利等产出的统计关联，不是企业研究领域重叠。
    仅确认同一缺口才 also_in → 本页无 also_in。

