page_ruling: |
  【语义层】METRIC-OPEN-ENT-EVAL 适用且 PDR-05/06 文档闭合（唐绍祖 §1.4.1 已签）。
  只消费 OPEN 矩阵 13 枚 + TRACE US-TECH/BIZ/COMP/RESULT + WF F-EVAL-01 §2.2 第6列同 13 枚。
  禁止发明 M_*。禁止把 GAP-METRIC-BID-01～06 写成正式 metric_id。
  禁止消费其他 ENT 页 METRIC-OPEN 与 seed 其余 47 个 M_ENT_*。
  禁止 B 轨 M_CHAIN_* / M_SVC_* missing 或改挂。
  禁止重列专题 7 条 missing（CHAIN 产品/专利/环节健康度/全球案例、E7 INDUSTRY_FIT、
    SYNTH 要素贡献/协同产出）。TOPIC-ENT-05 A=0，本页无 also_in。

  【拆开】模型产出 vs 评估壳。13 枚能对上 145/146/141/143 → mapped。
  配置/对象/权重编辑器/历史/额度/抽屉 = n/a_ops。
  Java 预检、过程页、雷达排名诊断读面、结构化报告装配 = other_system（呈现已有叶结果）。
  禁止把评估壳写成 missing。禁止 missing 权重引擎 / NLP 研报 / 雷达引擎 / 排名引擎。

  【痛难点】IA 不承接专题痛难点工作台与 ENT-RISK 结果包，不等于库未覆盖短板诊断。
  M_ENT_SHORTBOARD_COUNT / 结果页优势短板 / 报告改进方向 → seq 143 mapped。
  禁止写成 missing。禁止消费 M_ENT_PAINPOINT_*（属 ENT-RISK）。禁止改挂 141 顶替 143。
  145/146/141 亦输出优势短板，不另开第二套 missing。

  【技术力】SCORE/RANK/PATENT/RD → 145。专利引用/研发人员占比/核心技术覆盖度无 seed ID
    → EVAL-B02，145 维已覆盖，禁止 missing、禁止发明 M_*。
  【商业力】SCORE/营收/增长/利润率/市占 → 146。市占 K-O7 是数据欠账，不升 A。
    客户集中度/品牌声量无 seed ID → EVAL-B03。seed 商业力 bid_ref 错挂 E-23 → EVAL-B05。
  【综合】SCORE/RANK/INNOVATION → 141。组织能力无 seed ID → EVAL-B04。
  Q014 权重 → EVAL-B01，不改判 missing。

