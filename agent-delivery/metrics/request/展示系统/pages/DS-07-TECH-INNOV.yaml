techinnov_ruling: |
  专利数量统计分析（seq 140）：收集统计特定领域专利申请和授权数量；按时间、技术类别、地域、申请人看分布；柱状图/折线图看变化趋势。
    对照 05 seq 96（5）专利数量 +（6）深圳专利数量 +（7）区域专利申请数（时间/领域/申请人类型清洗，API 按领域与时间查询数量与环比）。
    → mapped。柱状/折线图壳并入本需求，不另开 missing。
    禁止 mapped 05 seq 140 深圳重点布局推荐。禁止用 M_CHAIN_PATENT_COUNT 顶替（链关联专利数，专题已 missing，对象不同，不重列、无 also_in）。
    禁止改挂 M_CHAIN_REG_PATENT / M_CHAIN_SZ_PATENT。禁止发明 M_TECH_PATENT_*。
    半成品行72 调用系统=科技专题服务系统；覆盖判定跟 seq 96，不改打 other_system。
  专利质量评估（seq 141）：引文分析、权利要求分析、家族专利分析；被引次数、权利要求数量、家族规模的分布与排名，识别高质量专利。
    原文要质量评估结果。05 无「专利质量/引文/权利要求/家族」专叶。
    seq 96（8）领先专利主体机构只是按阈值识别领先申请人（举例可含质量），不是本页专利质量分布与排名 → 禁止 mapped。
    seq 182「高价值专利数量」是区域成果指数分项；seq 186「专利成果质量」是活力指数输入；均对象不符 → 禁止硬挂。
    兄弟 INDUSTRY-POTENTIAL seq 150 技术影响力（专利被引 / SEP）不进本页。
    禁止 M_CHAIN_HIGH_VALUE_RATIO。不发明 M_*。→ missing。
  技术市场潜力分析（seq 142）：基于专利转让、许可、诉讼等市场活动，看技术市场活跃度、技术成熟度、商业化前景。
    对照 seq 135 技术产业化潜力识别模型（基础科研 / 成果转化 / 产品市场，实现类，专题 TOPIC-TECH-05 已 third_party 同一叶）。
    → third_party。禁止把 135 三维加权抄成我方公式。禁止 mapped seq 96（9）（10）交易额顶替潜力评分。
    禁止用 seq 137 阶段/成熟度指数或 INDUSTRY-POTENTIAL seq 147 技术产品成熟度评估顶替本叶。
    禁止 M_CHAIN_TECH_MATURITY_SCORE / M_CHAIN_HIGH_VALUE_RATIO / M_CHAIN_MARKET_SIZE。不发明 M_TECH_POTENTIAL_*。
  技术创新力综合评估（seq 143）：把本页各项指标综合展示，用户自定义权重，系统按权重算综合得分。
    要综合评估结果。05 无「技术创新力综合」专叶。
    禁止硬挂 seq 182（区域科技创新成果，含论文/机构，会吞 SCI-CREATE）。
    禁止硬挂 seq 186（区域创新活力四维；CITY / SYNTH-VITALITY 已对照，不是本页专利规模/质量/潜力加权）。
    禁止硬挂 seq 183 / 190。自定义权重是同一综合得分的交互壳，不另开 n/a_ops，也不改打 other_system。
    半成品行75 建议取值=综合评估分值。不发明 M_*。→ missing。
  技术创新空间分布（seq 144）：基于专利地域信息看空间分布；热力图、区域排名；地域集中度与差异。
    GIS + ADS 知产落图读面 → other_system。禁止因 05 无 GIS 专叶而 missing。
    禁止 mapped seq 96（7）把区域计数改成覆盖本叶（区域计数宿主是 TINN-D01；本叶是热力/地图）。
    禁止 mapped seq 116 可视化 API（图谱 API ≠ GIS）。半成品行76 记专题；派单 GIS+ADS，覆盖判定 other_system。
  技术创新趋势预测（seq 145）：基于历史数据和算法模型预测特定领域技术创新力趋势；看预测结果与置信区间。
    详设未给 DS-07 预测 501 行，派单「趋势预测可 501」= 实现通道，不等于 05 已有专叶。
    05 无「技术创新力趋势预测」专叶。禁止 mapped seq 134 热点趋势预测。禁止 mapped seq 132 历程。
    禁止硬挂 seq 186 趋势报告。禁止改挂 SCI-CREATE seq 139 / xlsx 行71 科学创造力趋势预测。
    置信区间读面并入本需求，不另开 missing。不发明 M_*。→ missing。

