indicator_ruling: |
  GIS地图指标展示（seq 105）：依托 GIS 在湾区地图上展示各区域主要创新指标，查看分布。
    = GIS + ADS 坐标/指标落图 → other_system。不是 05 构图、不是关系抽取。
    禁止 mapped 05 seq 105 技术实体关系抽取（序号碰巧相同）。
    禁止 mapped seq 116 图谱API。禁止因库无 GIS 叶而 missing。
  指标体系管理（seq 106）：提供完整创新指标体系（创新产值、创新比例、创新投入、
    创新技术合同交易额、专利及论文数量、专利授权量），用户勾选需要展示的指标。
    = 指标目录 + 勾选开关 → n/a_ops。不是模型训练、不是 05 指标体系设计。
    目录内各统计数字读 ADS / 展示侧科技指数计算 → 半成品行 49–53 + 「专利及论文数量」增行，other_system。
    禁止把勾选壳写成 missing。禁止 mapped 182–191「设计指标体系」。
  指标数据详情查看（seq 107）：点击地图上的指标数据，查看具体数值、同比环比变化、历史趋势。
    = ADS 详情读面 → other_system。半成品行 54–55 挂本叶。
    同比/趋势是已落库字段的时间差与序列，不是预测模型（预测归 REALTIME / GBA-CAPACITY 预警）。
    禁止 mapped 186 趋势预测。禁止 missing。
  数据来源说明（seq 108）：每个指标的数据采集机构、采集方法、采集时间，查看可靠性与时效性。
    = 血缘/口径说明读面（D9 8 件套展示侧）→ other_system。不是 05 叶。禁止 missing。
  数据计算方式说明（seq 109）：每个指标的计算公式、权重设置、参数选择，了解计算逻辑。
    = 口径帮助文案 / MetricSpecCard 读面 → n/a_ops。原文是「说明」，不是当场跑加权模型。
    湾区创新能力指数的预设算法计算归 GBA-CAPACITY seq 94，不进本页。
    禁止 mapped 182–191 加权综合。禁止因「含公式/权重」而 missing 或 mapped。
  指标对比分析（seq 110）：选择多个区域或多个指标，对比视图展示各区域在不同指标上的表现差异，
    发现发展不平衡。原文 = 字面并排对比视图，未点名对标模型 / 综合评价 / 排名计算。
    → n/a_ops。禁止对照 05 才 mapped；明确要对标模型才对照 05——本叶没有。
    禁止 mapped 186 横向对比、188 综合排名与对比分析报告、191 区域对比。
    禁止用 M_SVC_SZ_COMPARE_METRIC / DS-04-CITY seq 85 城市对标顶替。
    05 无「指标对比视图」专叶 ≠ missing。
  指标数据导出（seq 111）：选定指标导出 Excel/CSV，便于再分析与报告制作。
    = 导出壳 → n/a_ops。禁止 missing「库无导出叶」。禁止 mapped 任何 05 叶。

