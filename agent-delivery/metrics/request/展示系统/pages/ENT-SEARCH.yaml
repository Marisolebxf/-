  【语义层 9 个 M_ENT_*】METRIC-OPEN §2.1 列表卡片 KPI 8 条 + §3 M_ENT_MARKET_SHARE。
    TRACE US-05 正式 metrics 仅三评分；WF F2 第6列显式 ID 仅 M_ENT_COMPETITIVENESS_SCORE。
