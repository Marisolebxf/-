    对比篮带参 / 导出 / 空态推荐列表壳。检索不是 missing。禁止 mapped 108 NER。
  【明星数】METRIC-OPEN 有 M_ENT_STAR_ENTERPRISE_COUNT；seed 60 条未登记。消费该 ID，禁止补写 seed。
  【营收/成立时间】WF 排序字段无 metric_id。禁止挂 M_ENT_REVENUE_LATEST（非本页 METRIC-OPEN 清单）。
  半成品 xlsx 模块无「企业展示」。不改 xlsx。

