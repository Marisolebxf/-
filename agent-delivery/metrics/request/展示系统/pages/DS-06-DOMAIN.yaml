domain_ruling: |
  热力图展示（seq 124）：利用热力图展示深圳市各科技领域的空间分布和聚集程度，
    不同颜色代表不同聚集密度。= GIS + ADS 点位/密度图层 → other_system。
    不是构图、不是关系抽取、不是领域识别模型。禁止 mapped 133（输出=某项技术的覆盖率/集中度/领域图谱，
    不是全市领域热力）。禁止 mapped 189。禁止 mapped 产业链 seq 120 产业热点领域识别。
    禁止 mapped 产业链 seq 124 关键环节。禁止因库无 GIS/热力专叶而 missing。不发明 M_*。
  领域筛选功能（seq 125）：按科技领域类型（信息技术、生物医药、新材料、新能源）筛选，
    系统实时更新热力图。= 过滤切面 / 图层开关 → n/a_ops。四类是筛选项，不拆四条、不发明 M_*。
    不是 CARRIER seq 116 载体筛选。不是 CITY seq 129 城市选择。禁止 mapped 产业链 seq 125 瓶颈。
    禁止 missing。不进算法库差集。
  空间分布分析（seq 126）：分析各科技领域的空间分布特征，包括分布范围、中心位置、扩散方向，
    查看空间分布模式和发展趋势。原文点名的是 GIS 空间统计（范围/中心/扩散），领域类型已由筛选给定，
    不要求「从技术名识别细分领域」。→ other_system（GIS 聚合）。不对 133。
    133 = 给定某项技术，用图谱+机器学习预测其在深圳的细分领域覆盖率与集中度，输出领域图谱与预测报告；
    ≠ 本叶地图上的范围/中心/扩散。禁止硬挂 133。禁止 mapped 产业链 seq 126 区域产业指数。
    禁止 mapped 186 趋势预测（本叶「发展趋势」=空间扩散态势，不是城市指标预测）。
    禁止 mapped 技术链 seq 134 前沿热点。05 无「GIS 空间分布专叶」≠ missing。
  详细数据指标展示（seq 127）：各科技领域的企业数量、专利数量、研发投入、人才数量。
    = ADS 分领域明细表 → other_system。四字段不拆正式 M_*。
    禁止 mapped 182–185（区域成果/人才/政策综合评价 ≠ 领域四字段读表）。
    禁止 mapped 187/189。禁止改挂 M_CHAIN_SZ_ENTERPRISE_COUNT / M_CHAIN_SZ_PATENT / M_CHAIN_SZ_TALENT。
    禁止用 INDICATOR seq 119 十一维顶替。禁止 mapped 产业链 seq 127 深圳问题识别。禁止 missing。
  分析与建议（seq 128）：基于数据分析结果，提供各科技领域发展的现状评估和未来建议，
    包括优势领域、潜力领域、薄弱环节，查看发展建议报告。原文未点名生成模型。
    文案模板 / 报告读面 → n/a_ops。禁止硬挂 186（CITY 城市竞争力已挂，本页不改挂）。
    禁止硬挂 185 / 188–190。禁止 mapped 产业链 seq 128 深圳机遇 / seq 121 产业优势。
    禁止改挂技术链 seq 138–140。禁止 missing「库无建议生成叶」。禁止 also_in M_POLICY_INDUSTRY_FIT。
    禁止把 CITY seq 133 城市发展建议算进本页。禁止按号 mapped 产业链 seq 128。

