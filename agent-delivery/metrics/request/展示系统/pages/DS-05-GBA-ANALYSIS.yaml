analysis_ruling: |
  SWOT分析展示（seq 98）：以 SWOT 图表展示优势/短板/机会/威胁，用户查看各维详细内容与分析依据。
    原文是展示框架 + 读面，不是识别模型本身。05 无 SWOT 专叶 → n/a_ops（图壳）。
    禁止因「库无 SWOT 图种叶」写成 missing。禁止 mapped 182–191。禁止 mapped 05 seq 104。
    四象限识别见 GA-D03–D06，不在本叶重复 missing。
  创新能力因素统计（seq 99）：对创新资源/机构/机制/环境等促成因素做统计分析，查看详细数据与分布。
    = ADS 统计表 / 分布读面 → other_system。禁止 missing「库无因素统计叶」。
    禁止把 xlsx 行 41–44 / 48（指数与贡献度）算进本页（归 GBA-CAPACITY seq 96）。
    禁止 mapped 182–191 当因素统计模型。禁止改挂 M_SYNTH_ELEM_CONTRIB。
  优势因素分析（seq 100）：识别并分析优势因素，查看具体表现和影响程度。
    原文要识别/计算，不是只展框架。05 97 叶无 SWOT/优势因素识别专叶。
    seq 186/188 等输出「优势与短板」是区域指数综合评价附带清单，口径不是湾区 SWOT Strengths → 禁止硬挂。
    → missing。不发明 M_*。查看表现/影响程度 = 同一识别结果读面，不另开 other_system。
  短板因素分析（seq 101）：识别并分析短板因素，含表现与改进建议。
    同上，禁止硬挂 182–191，禁止用 M_CHAIN_BOTTLENECK_* / M_SVC_CHAIN_BOTTLENECK 顶替。
    → missing。改进建议随本叶，不改挂 seq 140。
  机会因素分析（seq 102）：识别并分析机会因素（政策支持/市场需求/技术突破/国际合作等）及利用建议。
    05 综合叶不输出 Opportunities 象限。→ missing。
  威胁因素分析（seq 103）：识别并分析威胁因素（竞争加剧/技术壁垒/政策变化/环境风险等）及应对策略。
    禁止用 M_CHAIN_TECH_BARRIER_INDEX / M_CHAIN_REG_TECH_BARRIER 顶替。→ missing。
  分析报告生成（seq 104）：基于 SWOT 结果生成分析报告，查看并导出 PDF/Word。
    模板拼装 + 导出壳，未点名报告生成算法 → n/a_ops。
    禁止 mapped 05 seq 104 技术实体识别构建。禁止因无「报告生成」专叶而 missing。

