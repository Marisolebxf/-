page_ruling: |
  未出台政策仿真模拟（seq 232）：输入类型/覆盖范围/支持力度/实施时间，基于历史数据与数学模型
    预测经济效益、社会影响、创新促进；可调参多次比较方案。
    对照 168 效果评估（执行效果 / 社会经济效应 / 环境影响 → 效果评估指数）→ 维度能对上 mapped。
    TRACE/WF 预估综合效果 = M_POLICY_EFFECT_SCORE。禁止因「仿真」自动 missing。
    详设不做全社会因果 → 假设与模型版本标注，不改判库缺口。
    171 是区域/产业布局建议，不把本叶改挂 LAYOUT_REC_COUNT。禁止 mapped 182/185。
    禁止按号 mapped。501 未注册不改判。xlsx 行111 标专题，覆盖判定跟 168。
  新出台政策效果预测（seq 233）：文本解析 + 历史相似政策，预测短长期效果及时间趋势、空间分布。
    预测主干对照 168 → mapped。METRIC 仍消费 EFFECT_SCORE，不另造预测 ID。
    空间分布小窗是 168 结果的 GIS 读面，不把本叶改打 other_system，也不另开空间仿真 missing。
    文本解析能力收口到 seq 237 / 106，本叶不 mapped 106、不 missing NLP 专叶。
    禁止按号 mapped。禁止 mapped 182/185。xlsx 行111 同预测值。
  区域经济发展空间模拟（seq 234）：选区域与政策类型，展示 GDP/产业结构/就业等空间分布
    （热力图、三维地图）。原文点名可视化形式，未点名 05 挖掘专叶。
    方法：空间模拟常 GIS+ADS → other_system。禁止 missing「区域经济仿真引擎」。
    禁止 mapped 168/171/182。禁止用 M_CHAIN_REG_REVENUE / M_CHAIN_MARKET_SIZE 顶替。
    不发明 M_GDP_* / M_EMPLOY_*。
  多维度效果评估（seq 235）：经济/社会/环境/创新得分；雷达图、柱状图。
    对照 168 分维度评估结果 → mapped。WF 落地成效维 = M_POLICY_IMPLEMENTATION_EFFECT
    （与 EFFECT_SCORE 同模型 POLICY_EFFECT_V0）。xlsx 行112 跟本叶。
    禁止 mapped 185（区域政策创新成果指数=数量/类型/效果，IA 划综合维）。
    禁止改挂 INDUSTRY_FIT。QPOL-02 记 B 类，不 missing。
  利益攸关方参与评估（seq 236）：在线问卷、意见征集、专家评审；汇总意见纳入效果评估模型。
    本叶是参与/问卷壳。PLAN 站内问卷 Mock、未外发。→ n/a_ops。
    「纳入评估」走 seq 235/168，不把本叶改 mapped 168，不 missing 利益攸关方评估专叶。
  政策文本智能解析（seq 237）：NLP/深度学习提取关键词、核心内容、支持对象、申报条件、支持力度。
    对照 106 政策实体识别构建（规则+词典 NER / 属性提取）→ mapped。
    不消费 RELATION_DEGREE（本页 TRACE 未挂）。≠ 核增 PC-02 拆解页，能力可复用、路由仍在推演区。
    禁止 missing「解析模型」。禁止发明 M_POLICY_PARSE_*。
  政策重点可视化展示（seq 238）：图表/思维导图展示目标、支持领域、实施路径、资金安排。
    解析结果的展示壳。→ other_system。不要硬挂 166 焦点清单。禁止 missing 思维导图算法。
  政策影响范围分析（seq 239）：受益对象、影响区域、影响行业；空间分布与时间变化；覆盖面与渗透深度。
    对照 107 政策实体关系抽取（受益对象 / 适用 / 覆盖范围）→ mapped。xlsx 行113 跟本叶。
    不要硬挂 167 覆盖维度（力度叶，DS-11）。不消费 INDUSTRY_FIT / INDUSTRY_COVERAGE。
    禁止 missing。metric_id=null（TRACE 未挂范围计数）。
  政策关联分析（seq 240）：亿级图谱，政策-政策/科技领域/产业关联网络。
    对照 107 扶持/适用/监管关系图谱 → mapped。PLAN 前端 ECharts Mock，禁止浏览器直连 Nebula。
    不消费 seed M_POLICY_RELATION_DEGREE（US-DS-POL-06 未挂）。禁止 also_in INDUSTRY_FIT。
    禁止 missing「关联模型」。
  政策实施路径预测（seq 241）：发布/申报/评审/拨付/效果评估等环节时间与责任主体。
    对照 171：WF 第6列 LAYOUT_REC_COUNT 口径=路径节点数 → 语义能对上 mapped。
    消费 M_POLICY_LAYOUT_REC_COUNT。这是推演页 KPI 消费 171 产出，不是把 DS-12 整页做成 .8.6 菜单。
    禁止改挂 M_CHAIN_LAYOUT_RECOMMEND_COUNT / M_CHAIN_LAYOUT_PRIORITY_SCORE。
    禁止 missing「路径预测专叶」。501 未注册不改判。
  政策解读报告生成（seq 242）：背景/主要内容/预期效果/实施建议；查看下载、自定义格式。
    报告壳 → other_system。不要当成新算法 missing。≠ US-DS-POL-10 / PC-04 智能研报
    （文案「推演解读报告」）。不要硬挂 168 改进建议报告或 171 优化策略当生成模型。
  半成品 xlsx 行111–113 为本四级匹配行（标专题）。行66/109/110 不进本页。

