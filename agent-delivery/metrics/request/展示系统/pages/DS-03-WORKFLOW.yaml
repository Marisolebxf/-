workflow_ruling: |
  本五级原文全部是展示侧工作流壳，不是专题技术链 Job 宿主。
  seq 52：流程图展示评估准备 / 数据收集 / 方法选择 / 分析计算 / 结果生成；
    点击环节看说明、高亮当前进度、流程导航。
    「分析计算」= 流程节点标签，禁止当成在本页调用 05 seq 134–140。
    进度高亮 = UI 状态，不是算法输出。→ n/a_ops。
  seq 53：展示专家评估法 / 经济分析法 / 运筹学评价法 / 综合评价法的原理、场景、步骤；
    对比、方法选择建议、按技术类型推荐方法组合、案例。
    方法名是经典评价方法论，不是 05 热点/潜力/阶段/瓶颈模型。
    「自动推荐方法组合」= 方法说明页的规则/模板助手，禁止 mapped 134–140，禁止 missing。→ n/a_ops。
  seq 54：参数权重/阈值表单、保存加载、模板库、导入导出；历史数据上的参数优化建议。
    表单与模板 = 运营配置。优化建议 = 壳内提示（已保存配置/历史运行），不是 05 调参 Job。
    禁止把 05 散文权重抄成我方公式，禁止发明 M_EVAL_PARAM_*。→ n/a_ops。
  seq 55：历史记录与结果变化；按时间/技术类型/评估方法筛选；并排对比；差异与变化原因说明。
    详设读面 ADS 评估结果。本页是工作流运行追踪，不是四类结果图。
    分数若在追踪表出现，来自 ADS 已落库结果（专题 Job 他页产出），本页不跑、不 mapped、不 missing。
    → other_system（display BFF 读 ADS）。
  只有本五级原文明确要在本页调用算法库出数、且 05 无叶，才 missing。本页没有。
  05 已列技术评估相关叶 ≠ 本页 mapped，也 ≠ 本页 missing。

