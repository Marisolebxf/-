page_ruling: |
  【数据梳理 seq 575–577】
  575 分类型活动信息归档：按领域/规模/参与者/主办单位结构化分类，检索与分组管理。
    = CMS/ADS 活动归档。→ other_system。禁止 missing 分类模型。禁止 mapped 112 NER。
  576 资源与专家关联映射：活动与科技资源、专家讲者建关联；记录推荐数据
    （阅读量、重要性、关联性）；整合讲者标签及成果。
    = CMS/ADS 挂接字段。挂接可空 ≠ 库缺口。→ other_system。
