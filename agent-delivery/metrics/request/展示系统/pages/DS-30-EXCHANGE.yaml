    禁止改挂 180/181 / M_SVC_REC_*；禁止 mapped 111/113/160；禁止 mapped 164。
    禁止因 05 无「活动–专家匹配」专叶而 missing。不发明 M_*。
  577 宣传素材统一整理：宣传图/简介/主办方/发布时间集中归档。→ other_system。
    禁止 missing 素材模型。
  【专题功能 seq 578–580】
  578 活动地图分布与标签筛选：GIS 展示活动地理分布；按领域/规模/参与者等标签筛。
    = GIS + ADS 点位/标签。→ other_system。禁止 missing GIS 算法。
    禁止 mapped 101 服务机构分布 / 112 NER / 116 图谱 API。
  579 资源推荐与详细呈现：图表、知识图谱展现联动资源的阅读量、重要程度、关联性。
    = 读 seq 576 已记录字段 + 可选 graph/view。挂接可空。→ other_system。
    详设 10：可嵌关系子图，无则 M+GIS。V1 读 ADS ≠ mapped 05。
    禁止因「资源推荐 / 智能匹配交流」改挂 180/181/164。禁止 mapped 116 当构图覆盖。
    半成品 xlsx 181 活动热度标了深度挖掘算法：原文是记录并展示阅读量/重要性/关联性，
    不是 05 热度模型。推翻默认 → other_system。不 missing。不发明 M_EXCHANGE_HEAT。
  580 专家讲者卡片与详情弹框：卡片/标签；悬停弹窗；链接跳转专家人才画像。
    = CMS/ADS 讲者卡片 + 路由到 DS-15。→ other_system。
    跳转 ≠ 本页跑 156/110/164。禁止 missing 画像模型。
  【接口 seq 581–583】
  581 活动数据及地图分布接口：地图标注、活动基础信息、标签筛选、宣传资料推送。
    = display BFF。→ n/a_ops。禁止 mapped 116。禁止 missing 接口算法。
  582 资源推荐与专家信息接口：资源与讲者卡片/详情实时调用。
    = BFF 读卡片。→ n/a_ops。名称含「推荐」≠ 180/181/164。
  583 多场景数据流转与交互支持：专题页 / GIS 组件 / 专家详情多场景调用一致。
    = BFF 编排。→ n/a_ops。禁止 missing 流转引擎。
