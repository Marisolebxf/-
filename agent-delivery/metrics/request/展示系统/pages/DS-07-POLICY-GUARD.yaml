page_ruling: |
  发展战略引导力评估（seq 152）：收集并分析发展战略规划、产业政策文件，评估战略规划的
    前瞻性、系统性和针对性；查看关键内容、实施路径和预期目标。原文要评估模型。
    对照政策 05 九叶：基础指标=级别/类型/时序/地域件数；图谱=实体属性与扶持/适用/监管关系；
    焦点=焦点/堵点清单；力度=效果/覆盖/成本→力度指数；效果=效果指数；短板/机遇/布局=清单与建议。
    无「发展战略引导力 / 前瞻性·系统性·针对性」专叶 → missing。
    禁止 mapped 166/167/168/185。禁止按号 mapped 科研机构 152。禁止 also_in E7-POLICY。
    禁止发明 M_POLICY_GUIDE_* / M_GUARD_*。查看规划文本不是图谱覆盖，不另开 other_system 冲掉 A。
  政策扶持力度分析（seq 153）：统计政策数量、类型、覆盖面，评估扶持广度和深度；
    按财税/人才/金融等类型、时间、地域看分布。
    评估广度/深度 → 05 seq 167 政策力度评估模型（覆盖维度≈广度，效果/成本≈深度，输出力度指数）→ mapped。
    数量/类型/时序/全国/深圳分布 → 05 seq 100 政策基础指标模型构建 → mapped（同五级统计半叶，不另开 missing）。
    覆盖面≠产业适配性。禁止 also_in M_POLICY_INDUSTRY_FIT。禁止改挂 M_POLICY_SUPPORT_STRENGTH /
    M_POLICY_INTENSITY_*。禁止按号 mapped 科研机构 153。禁止 mapped 185。
    半成品行85 建议取值含「资金支持强度」→ 经费叶 D04，不把 153 改打 other_system。
  经费支持分析（seq 154）：统计科研经费、产业基金、补贴资金；按来源/方向/时间看结构与趋势。
    原文是计数可视化，未点名评估模型。详设读 ADS → other_system。
    05 力度成本维=政策实施资源消耗，≠经费台账。基础指标无经费金额。
    禁止 missing「库无经费叶」。禁止 mapped 167/185。禁止按号 mapped 科研机构 154。
    禁止用 M_CHAIN_REG_FINANCING 顶替。半成品行86 标专题，覆盖判定跟本叶 other_system。
  项目支持分析（seq 155）：统计科技项目、产业项目；按类型/资助机构/时间看分布；
    提供项目数量、资助金额、实施效果等指标。计数/金额 → ADS other_system。
    「实施效果」与数量/金额并列，当项目记录字段，不是 seq 156 政策效果评估模型。
    禁止 mapped 168/155 科研机构扶持推荐。禁止 missing。禁止 M_CHAIN_REG_COMMERCIALIZATION。
    半成品行87 标专题，覆盖判定跟 other_system。
  政策实施效果评估（seq 156）：基于实施后数据变化评估实际效果，看实施前后关键指标对比。
    对照 05 seq 168 政策效果评估模型（效果评估指数、分维、实施前后）→ mapped。
    专题 E7 已 mapped M_POLICY_IMPLEMENTATION_EFFECT，本页无 TRACE ID，metric_id=null，
    不改挂、不重列、无 also_in。禁止按号 mapped 人才 156。禁止 mapped 185。
    半成品行88 + 行66 覆盖判定跟 168，不改 other_system。执行监测无 ODS 是数据欠账，不改判库缺口。
  政策与条件保障力综合评估（seq 157）：把本页各项指标综合展示，自定义权重算综合得分与排名。
    原文要评估模型。167=单政策力度三维指数；168=效果指数；185=区域政策创新成果指数（数量/类型/效果），
    IA/E7 划给综合维/SYNTH-VITALITY 输入，不是引导力+力度+经费+项目+效果的保障力综合。
    政策 9 叶无「政策与条件保障力综合评估」专叶 → missing。
    禁止 mapped 167/168/185/186。禁止按号 mapped 人才 157。禁止发明 M_POLICY_GUARD_*。
    禁止用自定义权重前端加权冲成 n/a_ops。半成品行89 跟本叶 missing。
  政策优化建议（seq 158）：基于评估结果给重点调整/力度加强/路径优化建议报告。
    原文未点名必须跑生成模型。默认 other_system（报告读面）。
    不要硬挂 166 焦点输出「优化建议」/ 169 短板改进策略 / 171 布局推荐。
    禁止 missing「库无建议生成叶」。禁止 also_in M_POLICY_LAYOUT_REC_COUNT。
    禁止按号 mapped 人才 158。半成品无此行。
    文末德尔菲/系统仿真/学术及科技创新系统评估模型 = 四级总述残留，见 PG-B05，不 missing。
  政策效果评估值（xlsx 行66）：四级挂名 KPI，本五级 seq 156 消费。覆盖跟 168。
    行64 人才竞争力、行65 创新活力、行67 科技指数不进本页。

