    禁止用 DS-06-INDICATOR 十一维论文切面顶替。不发明 M_SCI_PAPER_*。
  科学网络中心性评估（seq 137）：基于合作网络，评估领域内学者、研究机构的度中心性、接近中心性、
    中介中心性；查看网络图谱和中心性排名，识别核心研究力量。
    对照 seq 116（5）网络指标计算 API：指定图谱网络的网络密度、中心度等。
    度/接近/中介 = 中心度三类；116（2）含人物社交关系查询；116（3）图谱可视化覆盖网络图谱读面。
    → mapped。排名=中心度排序，不另 missing。
