page_ruling: |
  【科技数据资源统计 seq 330–334】
  330 资源接入情况总览：已接入类型与数量、分布比例、年度增长、来源机构活跃度。
    接入总览。运营 ADS。→ other_system。禁止写成算法缺口。禁止 mapped 05/116。不发明 M_*。
  331 资源来源分析与详情：来源结构（国内外库/院所/企业/开源）及变化；辅助判断质量与可靠性。
    质量/来源。「智能分类和标签」= 入站来源字段聚合，不是 05 NER。→ other_system。
    禁止 missing 分类算法。禁止 mapped 112。不发明 M_*。
  332 接入数据资源详情查询：单条/批量查看元数据、学科、采集时间、更新频率、关联项目。
    查询壳。→ n/a_ops。禁止 missing 检索模型。禁止 mapped 116（1）。不发明 M_*。
  333 可视化统计报表生成：按来源/时间/类型出报表图表；汇报导出。
    看板/导出壳。→ n/a_ops。详设 07 导出行数/频控。禁止 missing 报表算法。不发明 M_*。
  334 多源数据整合分析：不同格式/标准/来源的结构融合与归类统计。
    GDF/数据工厂 + Java 聚合，不是 05 新叶。→ other_system。
    禁止 missing 融合引擎。禁止 mapped 116 构图。不发明 M_*。权不在 DS-18。
  【大数据资源中心详情 seq 335–338】
  335 主题库分类展示：按主题结构分类展示要素库/领域主题库；多维标签查找。
    目录壳。明确不做主题库升格为图谱点。→ n/a_ops。
    禁止 mapped 116。禁止 missing。不发明点类型。权不在 DS-19 整页。
  336 资源详情深度浏览：专利/项目/论文等数据项元信息、更新频率、数据结构。
    浏览壳。论文/专利不是点类型（CROSS-KG 01 §6）。→ n/a_ops。
    禁止 missing 详情算法。不发明 M_*。
  337 关联检索：招标写「集成知识图谱和语义分析」。落地 = 主题库之间的目录关联检索壳。
    CROSS-KG 本版不加行；本模块不验收全要素图谱。禁止 mapped 116。→ n/a_ops。
    禁止 missing 检索/NLP。不发明 M_*。
  338 实时数据更新与动态监控：最新接入与更新状态、库增长、热点库活跃度。
    运营 ADS 更新台账。→ other_system。禁止 missing 流式模型。禁止 mapped 116（5）。不发明 M_*。
  【资源关联关系 seq 339–342】
  339 多层级关联关系可视化：来源/主题/专题/服务/场景的交互网络图。
    运营看板前端自绘（G6/ECharts），数据来自 catalog 关联表。默认不扫全图。
    禁止 mapped 116（3）。禁止 missing 构图。→ n/a_ops。不发明 M_*。
  340 节点与边关系分析：招标写「图数据库及关联分析算法」。落地 = Java 读运营 catalog
    节点/边台账（文献/项目/专利是口语对象，不是七要素点）。不扫 Nebula，不写 nGQL。
    本版不加 CROSS-KG 行。禁止 mapped 116 / DS-23。禁止写成算法 missing。→ other_system。
    不发明 M_*。
  341 资源关联导航：从主题库跳到相关数据与应用模块。
    导航壳。→ n/a_ops。禁止 mapped 116（2）。禁止 missing。不发明 M_*。
  342 语义关联与主题聚合：招标写「语义分析」。落地 = 主题标签/分类字段聚合，不是 116（4）。
    → other_system。禁止 missing 语义模型。禁止 mapped 112/116。不发明 M_*。
  【资源应用状态 seq 343–346】
  343 应用系统状态监控：可用性、接口响应、异常告警。
    运营监控/日志。→ other_system。禁止 missing 告警模型。不发明 M_*。权不在 DS-20 整页。
  344 资源接口状态跟踪：API 日志采集；活跃度、调用频率、失败率。
    运营日志。→ other_system。禁止写成算法缺口。不发明 M_*。
  345 资源应用主体详细列表：机构/企业/项目团队的调用类型、次数、用途。
    运营 ADS 主体台账。→ other_system。禁止 missing。禁止改挂 M_SVC_ORG_*。不发明 M_*。
  346 累计调用与趋势分析：上线以来累计调用量 + 时段趋势。
    调用趋势。运营日志/ADS。→ other_system。禁止 mapped 综合 182–191。禁止写成算法缺口。不发明 M_*。
