  【人才分布迁徙图 seq 267】叶名 + 招标父句 + 详设 06 = 迁徙。对上 05 seq 157 人才流动追踪模型 → mapped。
    流入/流出/留存 + 关系链时间属性。可视化是关系边，不是 GPS 回放。
    需规正文误拷 266 热力图描述（bid_desc_inherited）→ 以叶名为准，见 DS14-B02，不改判 missing。
    禁止因「迁徙图 / 职业轨迹」打 missing 轨迹引擎。禁止 mapped 116。禁止改挂 160 关系链整页（DS-15）。
  【地图操作 seq 268 / 273】多级缩放 / 滚轮 / 自动定位放大 / 点击 / 漫游 = GIS 相机/控件 → n/a_ops。
    268「点击查询详情」的弹出内容归 272，本叶只做点选手势。
  【筛选与搜索 seq 269 / 274】领域/专业/学历/职称/关键词 = 筛选壳 → n/a_ops。
    命中后飞点仍是 GIS。禁止 mapped 110 NER / 116 实体检索。禁止 missing 搜索模型。
  【动态统计与对比 seq 270 / 275】地区/各区排行榜 + 历史趋势/结构 = 读 ADS，对上 98 人才分布/领域分布/年度变化 → mapped。
    275「人才流动路径」是统计图呈现，迁徙算法覆盖在 267/157，本叶不改挂 157、不 missing 轨迹。
    禁止用 M_CHAIN_SZ_TALENT / REG_TALENT_STRUCTURE 顶替。第三方不展开公式。
  【重点技术领域人才地图 seq 271】领域分类展示对上 98（3）领域分布 → mapped。
    热力分布 / 区域分级（市→区→园区）= GIS 呈现，不另开 A。110–111 可支撑领域/单位标签，不把本叶改挂 160/156。
    禁止 mapped 184。禁止 GIS other_system 顶掉已对上的 98（本页选 mapped 98）。
  【人才分布信息查询 seq 272】点选弹代表性人才简介 + 指标面板 = GIS 点选详情 + 读 ADS → other_system。
    简介含研究方向/成果/合作网络是卡片呈现，不是 DS-15 画像页，禁止改挂 156/160。
    指标面板计数字段可与 98 同源，本叶不重复 mapped。禁止 missing 画像模型。
  【数据导出与报告生成 seq 276】地图数据导出 + 智能报告整理 = 导出/报告面 → other_system。
    禁止 missing 报告生成模型。分析数仍走 270/275/267。
  【半成品 xlsx 行 130–134】地区人才/科研产出/学术影响力/产业贡献/流动活跃度指数。
    调用系统=新型高端智库系统 / 科技人才智慧服务 → other_system。禁止 mapped 162/163/157/184。禁止 missing。

