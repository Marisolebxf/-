    禁止 mapped 116 网络密度顶替「异常关系密度」。禁止 mapped 191 区域协同密度/中心度。
    禁止因库无「异常监测」专叶而 missing。不发明 M_*。
  专家规则自动判别（seq 409）：内置专家知识与规则，对异常做规则判别。
    = 规则治理 other_system。详设【算法补】≠ A 类。禁止 missing。禁止 mapped 05 任何评价模型。
  黑名单自动触发机制（seq 410）：满足规则后把实体写入黑名单库。
    = 名单库运营 n/a_ops。禁止当算法库 missing。
  风险联动预警（seq 411）：通知业务部门并联动风控/客服等上下游。
    = 外系统联动 other_system。禁止 missing。
  审计与追溯分析（seq 412）：记录触发操作与原因，事后溯源稽查。
    = 审计运营 n/a_ops。详设【算法补】≠ missing。禁止因库无审计叶而 missing。
  指标整合（seq 413）：知识图谱分析指标 + 传统统计指标 + ML 特征统一管理展示。
    知识图谱分析指标能对上 116 只读网络指标计算API（密度/中心度）及关系权重 GET → mapped。
    传统统计指标仍读 catalog/ADS，同页不另 missing。ML 特征未注册 → 501 ≠ missing。
    禁止复制 DS-08-INDICATOR「指标项展示=字典树」判定。禁止 mapped 182–191。
    禁止抢 DS-23 xlsx 157–160 度/紧密/中介/PageRank 四行（算法结果展示页）。
    116 实体检索 / 可视化 / 语义相似度 不进本叶。
  权重配置（seq 414）：允许用户按场景设置指标权重。
    详设 weight 只读 → 写配置不是 V1 读面，n/a_ops。只读关系权重已由 116 覆盖在 seq 413，本叶不重复 mapped。
    禁止因 SET 对不上 116 GET 而 missing。禁止复制 DS-08 seq 163 智库权重展示判定。
  指标关联分析（seq 415）：挖掘指标之间联系。
    本页是指标读面，不是新挖掘 Job。已落库关联读 catalog/ADS → other_system。未注册 501 ≠ missing。
    禁止 mapped 116 实体关系查询（实体边 ≠ 指标间关联）。禁止 mapped 191。
    禁止重列专题 M_SYNTH_COLLAB_OUTPUT_CORR / M_SYNTH_ELEM_CONTRIB。不发明 M_*。
  一致性检验（seq 416）：检测指标逻辑是否合理。
    = 治理校验 other_system。禁止 mapped 186 文案里的数据一致性预处理。禁止 missing。
  综合评分（seq 417）：对项目/人员/机构出综合评分。
    已注册评分读 catalog/ADS → other_system。未注册 501 ≠ missing。
    禁止 mapped 182–191 区域综合评价（不是本页科技指数字典，也不跑专题综合 Job）。
    禁止复制 DS-08-INDICATOR 字典判定。不发明 M_*。
  动态指标学习（seq 418）：自动更新节点权重、关联强度、行为频次。
    V1 读 catalog/ADS / 116 已更新只读值 → other_system。自动学习 Job 未注册 → 501 ≠ missing。
    禁止把「动态学习」整叶 mapped 成 116 GET。禁止 missing「库无学习叶」。
    节点权重/关联强度只读已在 seq 413；本叶不重复 mapped。
