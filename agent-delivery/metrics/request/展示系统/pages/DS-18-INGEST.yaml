  351 渠道归集数据量：分渠道数据量。→ other_system。
  352 详细数据资源属性：类型/采集时间/质量等级/项目/领域。目录+质量字段。→ other_system。
  353 来源结构可视化对比：饼图/柱状图对比结构。图表壳。→ n/a_ops。
  354 多维筛选与分组：渠道/种类/时间/质量筛选分组。→ n/a_ops。
  355 资源归集明细导出：导出行。→ n/a_ops。
  【资源详情 seq 356–359】
  356 主题信息归类展示：学科/专题/项目方向标签。运营主题字段，不升格图谱点。→ other_system。
    禁止 missing 主题挖掘。禁止 mapped 116 / NER。
  357 分区信息明细：分区接入量/类型/质量。→ other_system。
  358 资源详情多维检索：主题/时间/来源/质量检索。→ n/a_ops。
  359 可视化详情面板：仪表盘展现详情。→ n/a_ops。
  【历史 seq 360–363】
  360 渠道与表历史归集记录：接入日志归档。→ other_system。
  361 历史更新周期统计：更新频率/时点/周期趋势。日志聚合。→ other_system。
    「时间序列分析技术」不是 05。禁止 missing。
  362 动态历史趋势可视化：接入量/更新/异常趋势图。→ n/a_ops。
  363 多维度历史详情检索：渠道/表/时间/异常检索。→ n/a_ops。
  【问题资源 seq 364–367】
  364 问题资源自动识别与列表：平台质量规则打标 + 列表。→ other_system。
    禁止写成 05 异常检测 missing。禁止挂 116。
  365 问题复现与批量检索：运维检索/复现。→ n/a_ops。
  366 问题分级与优先级管理：紧急/重要/普通治理工作流。→ n/a_ops。
  367 问题资源可视化统计报表：按类别/渠道/表分布与趋势。→ other_system。
    禁止写成挖掘 missing。图表壳不另开 A。
