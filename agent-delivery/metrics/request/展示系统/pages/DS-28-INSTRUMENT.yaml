    「总量/使用状态」是对接字段的前端聚合，不是 05 指标模型。禁止 missing。
  527 共享状态与利用动态：空闲/排期协调/忙碌图标；共享率、使用频率。平台状态。→ other_system。
    「可预约资源」= 平台开放字段展示，不是本系统预约闭环。xlsx 170/171 并入。
  528 仪器详细信息智能展示：弹窗型号/功能/制造商/原值/价格/归属/坐标/技术指标；下载资料。
    目录读面。→ other_system。「智能」是弹窗，禁止 mapped 180/181，禁止 missing。
  529 使用评价与频次：平台反馈评价 + 使用频率。→ other_system。xlsx 168/169 并入。
    「实时分析报告」= 平台统计展示，禁止 missing 评价模型，禁止改挂 174–179。
  【预约服务智能管理 seq 530–533】
  530 服务预约地图：地图筛看预约服务空间分布。地图+筛选壳。→ n/a_ops。
    服务状态/周期/频率来自对接，本叶判定跟地图。xlsx 174 预约次数并入展示字段，不升 A。
    禁止把本叶写成预约闭环 missing。
  531 服务信息明细与周期：弹窗周期/共享类型/服务项/样品要求/图片。目录。→ other_system。
  532 服务类型和共享率统计：类型分类 + 共享率/使用状况；报表导出。
    统计主项 = 平台状态。→ other_system。导出壳见缺口说明，不另开 A。xlsx 172 并入。
  533 预约订单追踪与排期调度：自动管理订单、排期、订阅提醒。
    详设明确不做预约/计费闭环。→ n/a_ops。禁止写成算法 missing。xlsx 预约次数不改挂本叶为闭环。
  【机构资源 seq 534–537】
  534 服务机构分类地图：院所/高校/企业/检测机构地图高亮。地图。→ n/a_ops。
    禁止 mapped 112 实体识别或 101 分布指标。
  535 机构资源优势与评价：弹窗优势资源、历史评价、共享能力评分；批量导出。
    平台评价字段。→ other_system。禁止 mapped 174–179 技术力指数。xlsx 173 并入。
    导出 = n/a_ops 附带，本叶不改判定。
  536 服务内容与能力明细：归档服务项目/流程/适用范围；按需检索。目录+检索。→ other_system。
    「合作匹配效率」是选型透明度，语义不是 180/181。禁止 mapped 推荐，禁止 missing。
  537 资源状态与实时活跃度：开放率、当前活跃、使用频率、热门高亮。实时活跃度。→ other_system。
    xlsx 175 并入。热门 ≠ 推荐模型。禁止 mapped 180/181。
