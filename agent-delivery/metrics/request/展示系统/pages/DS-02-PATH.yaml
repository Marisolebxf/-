    放大/变色/图标标记 = 同一识别结果的前端壳，不另开 missing。
  路径详情（技术意义、发展历程、关键突破点）= 弹窗读已有路径字段 → other_system。
    详情里的「发展历程」不是 seq 132 历程模型，禁止改挂。
  筛选过滤（路径类型 / 重要性级别 / 时间范围）= 前端过滤 → other_system。
  路径比较：原文是「并排或重叠方式展示」多条路径，不是比较模型。05 无路径比较专叶 → n/a_ops。
    禁止因无专叶而 missing。
  动态演示（按时序播放、调速、暂停）= 前端播放壳 → n/a_ops。禁止改挂 seq 132。
