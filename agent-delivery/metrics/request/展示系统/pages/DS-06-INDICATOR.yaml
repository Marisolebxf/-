indicator_ruling: |
  指标体系展示（seq 118）：展示深圳市创新监测指标体系完整框架（一/二/三级层级），
    用户查看各指标的定义、计算方法和数据来源。
    = metrics catalog / ADS 口径读面 → other_system。不是 05 设计指标体系，不是勾选管理壳。
