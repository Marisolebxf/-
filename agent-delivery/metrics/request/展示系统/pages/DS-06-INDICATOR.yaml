    禁止 mapped 182–191「设计指标体系」。禁止 mapped 05 seq 118 深圳产业链模型构建。
    禁止因库无「指标体系展示」叶而 missing。不发明 M_*。
  多维度指标展示（seq 119）：从论文、期刊、专利、专家学者、会议、组织机构、课题、
    项目、资金、政策、基础设施等维度展示科技发展指标，用户选择查看不同维度的指标数据。
    = ADS 分维读面 + 维度切换 → other_system。十一维是过滤切面，不拆十一条、不发明 M_*。
    十一维 ≠ 186 四维（科技/产业/人才/政策），≠ 187 七要素，≠ 189 产业/技术领域覆盖。
    禁止 mapped 182–185 用论文/专利/人才/政策单维成果模型顶替。
    禁止 mapped 05 seq 119 产业发展路线历程。禁止改挂 M_CHAIN_REG_PAPERS / PATENT 等。
  指标数据可视化（seq 120）：柱状图、折线图、饼图、雷达图展示指标数据，切换图表类型
    查看表现和变化趋势。= ADS 图表读面 → other_system。图表切换是壳，不另 missing。
    「变化趋势」本叶=已落库值的图表呈现，不是预测模型。禁止 mapped 186 趋势预测。
    禁止 mapped 05 seq 120 产业热点领域识别。禁止 mapped seq 116 图谱API。
    禁止因库无 GIS/图表专叶而 missing。
  指标时间趋势分析（seq 121）：展示各项指标历史变化趋势，选时间范围查看发展轨迹，
    分析科技发展变化规律。原文=字面读 ADS 时间序列，未点名趋势预测模型 / 数据模型。
    → other_system。不对照 05。禁止 mapped 186（输出含趋势预测 ≠ 本叶点名）。
    禁止 mapped 05 seq 121 深圳产业优势识别。禁止用 CITY seq 134（含未来预测）顶替。
    05 无「指标时序读面」专叶 ≠ missing。
  指标对比分析（seq 122）：选多个指标或多个时间段做对比分析，对比视图展示差异和变化。
    原文=字面并排读 ADS，未点名对标模型 / 综合评价 / 排名计算。→ other_system。
    对象是指标或时间段，不是城市（CITY seq 130）也不是载体（CARRIER seq 117）。
    禁止对照 05 才 mapped；明确要对标模型才对照——本叶没有。
    禁止 mapped 186 横向对比、188 综合排名与对比分析报告、191 区域对比。
    禁止 M_SVC_SZ_COMPARE_METRIC / DS-04-CITY seq 85 / GBA-INDICATOR seq 110 判定整页复制。
    禁止 mapped 05 seq 122 产业周期分析。05 无「指标对比视图」专叶 ≠ missing。
  指标详情查看（seq 123）：点击具体指标，查看详细数据、计算方法、数据来源、分析解读。
    = ADS 详情 + 口径说明 + 解读文案 → other_system。解读未点名生成模型。
    禁止 mapped 182–191 评价报告。禁止 mapped 05 seq 123 产业阶段分析。禁止 missing。

