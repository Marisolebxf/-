graph_ruling: |
  读面 A = 当前图 entities / relations / view，不是态势技术点网（DS-02-TECHGRAPH），
  不是路径/关键节点叠加（DS-02-PATH），不是论文点网（论文/专利不是点，CROSS-KG 03 §1.1）。
  动态查询（关键词/实体属性/时间范围；文献专利机构技术领域）
    = 116(1) 实体检索 API → mapped。文献/专利命中走 ES 清单，不建 Paper/Patent 点，
    不另开 missing，禁止第二套图库。禁止 mapped 各维图谱 104/105 当搜索框。
  数据过滤与筛选（地域/时间/技术分类/作者/合作关系组合）
    = 116(2) 关系查询 + 过滤条件 → mapped。作者/文献条件落 ES 门面，不另开 missing。
    前端勾选壳不拆成 n/a_ops 第二行（8 叶对齐）。
  多维度分析（按机构/领域/时间/合作网络切片切块）
    = 116(3) 可视化 + (2) 跨类型关系的视图切片 → mapped。
    「关键人物/创新路径」是切片洞察，不是 PATH 关键路径识别，禁止复制 PATH missing、禁止 also_in。
    禁止 mapped 综合 182–191 区域综合评价。禁止抢 DS-23 路径/社群。
  交互式可视化（图表/网络图/时序演化；拖拽缩放点击）
    = 116(3) 图谱可视化 API → mapped。G6 相机是同一 view JSON 的交互面，不另开 n/a_ops。
    时序演化图 ≠ B 面切面时间轴；A 面 view 禁止播历史（CROSS-KG 03 §2.1(3)），不另开 missing。
    禁止第二套图库。子图展开落在检索命中后的 relations/view，不单列叶。
  自动模式识别（ML/DL 模式、异常活跃节点、新兴关联路径）
    = 识别 501。05 无图谱模式识别/异常检测专叶 → missing。
    禁止 mapped 116(5) 中心度/密度（DS-23）。禁止复制 PATH 中心度/关键节点缺项。
  预测分析（论文/专利/热点技术演化趋势建模）
    = 预测 501。05 无展示侧图谱趋势预测专叶 → missing。
    禁止 mapped 182–191 输出里的「趋势预测报告」。禁止改挂 DS-09 预警。禁止静默假网 mapped。
  分类与聚类（实体/事件按相似性分组）
    = 05 无分类聚类专叶 → missing。禁止 mapped 116(4) 语义相似度当聚类（(4) 本身 501）。
  智能推荐（文献/专家/机构/项目/技术方案）
    = 推荐 501，禁用按钮壳。05 无展示侧图谱推荐专叶 → missing。
    禁止硬挂招入 164 / 企业招引 147 / 机构引入 180 / 技术布局 140 / 服务引入 180。
    禁止用 116(4) 相似度冒充推荐。禁止静默假网 mapped。无 also_in 专题 7 条。
  116 可 mapped 同一叶多次（检索/关系/可视化三面），不重写 05 定义。

