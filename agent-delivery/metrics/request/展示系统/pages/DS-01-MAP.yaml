map_ruling: |
  详设 04 DS-01 读面 = A 嵌图 + GIS + ADS；嵌图可薄、挂接可空。
  GIS 与图坐标两套，不以切面冻坐标驱动态势地图。
  招标父句（seq 1 继承至 2–4）：多图层展示、科创要素空间分布。本页只消费「怎么动图」，
  不消费图层开关、要素统计/影响力、事件等级。
  缩放平移复位 = GIS 相机/控件，n/a_ops。
  搜索要素定位 = 关键字对要素库模糊/精确匹配后飞到点位，检索门面 + GIS 定位，other_system。
  「智能匹配」不是 05 实体识别 / 图谱API seq 116，禁止 mapped、禁止 missing。

