capacity_ruling: |
  创新能力指标计算（seq 94）：基于海量实时科技数据，通过预设算法模型对湾区
    创新资源、创新机构、创新机制、创新环境等因素综合分析，实时计算湾区创新能力指标。
    原文点名预设算法模型 + 综合计算。对照 05 seq 186 区域创新活力综合分析模型
    （衡量区域科技/产业/人才/政策的创新能力与发展潜力，输出活力指数、单维评分及权重分布，
    支持按区域查询与实时运算；与 SYNTH-VITALITY / DS-04-CITY 排名同一叶，对象=湾区区域）。
    → mapped。禁止 missing「库无湾区创新能力专叶」。禁止按号 mapped 05 seq 95。
    禁止 mapped 182–185 单维成果指数顶替综合创新能力。禁止用 M_CHAIN_REGION_INDEX /
    M_CHAIN_COMPETITIVENESS_INDEX / M_CHAIN_SZ_ADVANTAGE_* 顶替。
    禁止改挂 M_SYNTH_VIT_INDEX。四因子 vs 四维见 GC-B03，不另开 A。
  指标数值展示（seq 95）：以数值、仪表盘、进度条展示当前数值和历史变化；可查看详细构成和计算方法。
    = ADS / 展示侧读面 → other_system。构成计算归 seq 96，计算方法查看不是当场跑模型
    （INDICATOR seq 109 说明壳不进本页）。禁止 mapped 186「实时监控」。
    禁止按号 mapped 05 seq 95 产业链基础指标。禁止 missing。xlsx 行 47 挂本叶。
  指标构成分析（seq 96）：将创新能力指标分解为子指标（创新资源/机构/机制/环境指数），
    查看各子指标数值和贡献度。对照同一 186 叶的单维度评分及权重分布 → mapped。
    半成品行 41–44 / 48 挂本叶；覆盖判定跟 186，不改打 other_system。
    禁止 mapped 187–190 要素四模型（七要素/层次/领域 ≠ 本四子）。
    禁止改挂 M_SYNTH_ELEM_CONTRIB（专题 missing=要素贡献路径，不是子指标对总指数贡献）。
    禁止按号 mapped 05 seq 96 技术基础指标。禁止拼 mapped 182–185。
  指标预警功能（seq 97）：设置预警阈值，指标异常波动或低于/高于预设值时自动发预警。
    原文是阈值配置 + 比较告警，未点名预警模型。详设「预警模型可 501」只在 DS-09 规划页。
    05 综合 11 叶无预警专叶，但本叶不要模型 → n/a_ops。
    禁止 missing「库无预警叶」。禁止 mapped 186 趋势预测。禁止按号 mapped 05 seq 97 企业基础指标。
    半成品行 46 误挂深度挖掘算法，覆盖判定跟本叶，不改 missing。
  粤港澳大湾区创新能力指标（xlsx 行 45）：总指标，seq 94 计算、seq 95 展示。
    半成品建议取值写成「城市创新能力指数值」，对象应是湾区不是全球城市；覆盖判定跟 186。
    禁止把 DS-04-CITY 行重列进来。
  指标当前数值（xlsx 行 47）：seq 95 读面字段 → other_system。

