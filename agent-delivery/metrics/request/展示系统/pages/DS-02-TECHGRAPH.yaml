graph_ruling: |
  读面 A = 技术点网（节点=技术点，边=技术-技术关系），不是论文点、不是服务链图、不是产业全要素综合 API。
  数据输入（手动/Excel/JSON、填名称属性层级、解析成数据结构）= 导入/运营壳 → n/a_ops。
    「自动解析」是文件 schema 解析，不是 05 NER。禁止 mapped seq 104，禁止 missing「库无导入叶」。
  图结构自动生成（按已有技术点数据算关联、出可视化网；层级/类型用颜色形状区分）
    = 对照 05 seq 104 实体识别、105 关系抽取、130 全景技术链模型。库已列叶 → mapped。
    布局算法/配色编码仍是图壳，写在同一需求的交互面，不另开 missing。
    实现类倾向 third_party 只约束热点/潜力/瓶颈/阶段 Job（G3），禁止把 104/105/130 改打 third_party，
    禁止把 05 散文抄成我方公式。
  图谱交互（缩放/平移/旋转/拖拽/展开折叠/高亮特定路径）= 图壳 n/a_ops。
    「高亮路径」是选中后的视觉强调，不是关键路径识别。禁止抢 DS-02-PATH、禁止因 501 未注册而 missing。
  技术点搜索定位 = 关键词模糊/精确匹配后高亮居中。图壳 + ADS/检索门面 → other_system。
    禁止 mapped 综合/图谱API seq 116 实体检索。禁止 missing「库无搜索叶」。
  技术点详情 = 名称/描述/属性参数/发展状态，弹窗或侧栏。ADS 或 graph/view 节点属性 → other_system。
    「发展状态」是节点字段，不是专题技术阶段研判 Job（seq 137）。禁止改挂 third_party 阶段/热点/潜力/瓶颈。

