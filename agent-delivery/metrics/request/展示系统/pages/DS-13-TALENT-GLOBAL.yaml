design05:
  ds13_algo_row: "DS-13 全球领域人才态势 · G1 · 读面 A+GIS · 子图可薄"
  impl: >
    本页是展示侧全球领域 GIS 读面，不是专题 05.5 十一叶子工作台，也不是 DS-14/15/16。
    经 display 拼装，内部复用 topic 人才资源；禁止第二套算法调用；禁止平行 stores。
    V1 读 ADS / 挂接可空 不自动等于 mapped。GIS 与嵌图失败互不挡数字。
    流动 = 关系边 + 时间属性，不是 GPS 轨迹。明确不做：独立人才本体；轨迹回放引擎。
  not_this_page: >
    DS-14 关注地区人才态势（含地区迁徙页，非轨迹引擎）。
    DS-15 重点科技人才画像（可与专题 `.7.5` 同源，本页只薄子图）。
    DS-16 人才引进推荐评估（G3 Job，501 直至注册，可与 `.7.9` 复用）。
    智库 ZHIKU-TALENT-MAP / POOL。综合 seq 184。企业/科研机构/技术链维。

page_ruling: |
  【人才分布图 seq 243–247】
  243 分布信息查看：地图热力是呈现；区域/城市人才数、行业、学历、类型统计 → 98
    （1）人才分布（2）机构类型清洗可支撑弹窗（3）领域分布（4）供给学历。→ mapped。
    禁止按号 mapped。禁止综合 184。禁止 M_CHAIN_REG_TALENT_STRUCTURE。热力不另开 A。
  244 多层级浏览与筛选：全球/国家/省州/城市缩放 + 行业/类型/时间筛选壳。→ n/a_ops。
    计数仍走 243/98。禁止 missing 缩放算法。禁止 mapped 98 顶掉壳。
  245 交互式操作与动态追踪：滚轮缩放、搜索定位、点击联动面板。地图操作壳。→ n/a_ops。
    「动态追踪」≠ 157 流动模型，≠ GPS。禁止 missing。禁止改挂 157。
  246 流动和迁移图示：迁移动画/趋势线 + 热点高亮。对照 157 流入/流出/留存（关系+时间）。
    → mapped。动画是呈现。禁止当 GPS 轨迹 missing。禁止轨迹引擎。xlsx 无本叶。
  247 联动与报表导出：弹窗明细是 243 读面；导出报告/表格。→ n/a_ops。
    禁止 missing 导出模型。禁止改挂 98。
  【人才洞察分析 seq 248–252】
  248 华人占比：按国家/机构看华人学者比例。98 四指标无族裔；159 是深圳短板。对不上。
    只要读 ADS → other_system。禁止 missing 华人占比模型。禁止发明 M_*。存储域未建≠A。
  249 地区分布洞察：多层级分布 + 学科/领域/时间联动后的结构。分布计数 → 98 mapped。
    筛选交互收口 244 壳，本叶不改 n/a_ops。禁止 184。禁止 DS-14 地区页故事。
  250 顶尖机构洞察：全球机构人才汇聚排名 + 弹窗学历/领域/成果。98（2）是省/国家机构数，
    不是机构人才排名；159 不是全球顶尖机构。对不上且读 ADS → other_system。
    禁止 missing 排名模型。禁止改挂 159 / M_CHAIN_SZ_TALENT。弹窗论文不改挂 162。
  251 产研对比：企业 vs 高校/院所人才数量与比例、产/研视图切换。机构类型维计数 → 98 mapped。
    口径「机构数 vs 机构内人才数」见 B 类，不改 missing。禁止 111 顶替计数。禁止 163。
  252 迁徙情况：职位变动/机构流动历史 + 流入流出热点。对照 157 → mapped。
    禁止轨迹引擎 missing。≠ DS-14 整页。禁止按号 mapped。
  【人才的最新动态 seq 253–256】
  253 气泡消息：地图气泡叠加动态。GIS 读面。→ other_system。禁止 missing 气泡引擎。
    禁止 mapped 157/162。禁止智库动态包改挂。
  254 热力密度：动态热力 + 多级缩放。GIS/热力。→ other_system。≠ 243 的 98 静态分布计数。
    禁止 missing 热力算法。缩放壳不改 n/a_ops 顶掉本叶（本叶主项是热力视觉）。
  255 交互式地图导航：滚轮缩放 + 搜索定位。地图操作。→ n/a_ops。与 245 同类壳，不合并删叶。
  256 区域动态筛选与趋势追踪：类型筛选壳 + 活跃趋势动画/历史回看（含职位流动）。
    流动/迁移对上 157（关系+时间）。→ mapped。禁止当 GPS 轨迹 missing。筛选不改 n/a_ops 顶掉。
  【人才详细信息 seq 257–265】
  257 基础信息：姓名/性别/国籍/学历/单位/职位。对照 110 实体属性。→ mapped。
    不是独立人才本体，不是 DS-15 整页。存储域未建见 B。
  258 科研成果统计：论文/著作/专利/项目数量、被引、成果影响力。对照 162 成果数量/学术影响力维。
    → mapped。xlsx 行128 标智库，覆盖跟 162，不改 other_system。禁止伪公式。禁止 M_CHAIN_ACADEMIC_POWER。
    禁止把 163 企业产业力当本叶。半成品「人才指数」成果总数并入本叶，不另开行。
  259 学术影响力：引用、h 指数、学科贡献量化。对照 162 → mapped。第三方不展开。
    xlsx 行114/122–124 标智库，覆盖跟 162。H/论文/引用无正式 ID 见 B，不升 A。禁止发明 M_*。
  260 领域与方向标签：NLP 识别研究领域/技术标签。对照 110 NER 领域属性。→ mapped。
    禁止 missing NLP 专叶。不把本叶改挂 111（关系在 261）。
  261 合作网络与关联专家：合作关系/机构/团队。对照 111 人才–机构/企业/科研关系。→ mapped。
    子图可薄。不把本叶做成 DS-15 / 160 关系链工作台。禁止独立本体。禁止浏览器直连 Nebula。
    禁止 M_CHAIN_*。
  262 最新动态跟踪：论文/项目/讲座资讯 feed。ADS/资讯读面。→ other_system。
    禁止 missing 动态引擎。禁止 mapped 110 库维护、禁止 mapped 157。
  263 评估与匹配度：潜力/风险/岗位匹配 + 评估报告。对照 164 招引推荐（含匹配度）。→ mapped。
    本页 G1 只读挂接，不跑 DS-16 Job；501 在 DS-16。禁止做成引进工作台。禁止 M_SVC_REC_*。
    不改挂 156 识别整页。禁止发明匹配 M_*。xlsx 无本叶专名。
  264 荣誉及奖项：奖项/荣誉/社会影响力数据列举。110/162/159 无荣誉专核。读 ADS → other_system。
    xlsx 行129 标智库，不改挂智库指数，也不 missing。禁止发明 M_*。
  265 国际合作与出访：合作项目/出访/海外交流列举。读 ADS 履历。→ other_system。
    禁止 mapped 157（157=区域流入流出，不是出访轨迹）。禁止轨迹 missing。禁止 111 顶替本叶列举。
  半成品 xlsx 行114–129 为「全球领域人才态势」匹配行（标智库）。覆盖判定跟 05 语义，
    不把已 mapped 改 other_system。行108 流动趋势、行130+ 关注地区/画像/引进 不进本页。
    行115–117 人才指数三项并入 243/258，不另增 items。行121 科研热点=门户，不进 23 叶。

impl_class_ruling: |
  algo-catalog 人才 default_hint：实现类倾向 third_party，禁止伪展开公式。
  建议取值/取值口径一律「第三方不展开」：对接人才库/论文库/专利库/招聘源，
  禁止把 05 叙述改写成可落地加权公式或伪 COUNT。
  已对上的 98/110/111/157/162/164 保持 mapped，不因「第三方实现」改打 third_party 或 missing。
  「无公式 / 存储域未建」是 B 类或数据欠账，不是 A 类 missing。

