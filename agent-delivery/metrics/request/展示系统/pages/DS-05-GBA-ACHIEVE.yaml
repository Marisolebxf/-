achieve_ruling: |
  地理位置落点展示（seq 89）：将湾区内创新成果、创新机构、创新企业等要素坐标在地图精确落点，
    缩放、平移查看区域分布。= GIS + ADS 坐标 → other_system。不是 05 构图。
    禁止 mapped seq 116 图谱可视化 API。禁止 mapped GBA-INDICATOR seq 105（那是指标落图，不是成果点）。
    禁止因库无 GIS 叶而 missing。缩放平移是本页地图壳，不抢 DS-01-MAP。
  多样化可视化效果（seq 90）：高亮、闪烁、飞线，突出重点成果与关键节点；用户自定义效果类型和强度。
    = 前端可视化 + 用户偏好 → n/a_ops。不是自动重要性/热点识别（识别见 seq 92）。
    禁止因 05 无「飞线/闪烁」叶而 missing。禁止 mapped seq 116。
  创新成果分类筛选（seq 91）：按创新类型（专利、论文、技术成果）、创新领域、时间范围筛选，实时更新地图。
    = ADS 字段过滤 + GIS 刷新 → other_system。不是 05 文本分类模型。
    禁止 missing「库无成果分类叶」。禁止 mapped seq 185 政策分类 NLP。
    禁止把全球 OVERVIEW seq 56 类型标签（含资讯/机构/企业动态）算进本页。
  创新热点区域识别（seq 92）：自动识别并标注大湾区内创新热点区域；查看创新密度、主要创新类型。
    原文要识别/标注，不是热力图层壳。对照 05：
      技术链 seq 134 = 技术前沿热点领域识别（论文/专利/资讯的领域前沿 NLP，对象=技术主题，
      专题 TOPIC-TECH-05 已 third_party）。语义是专题技术热点，不是湾区地图上的地理热点区域 → 禁止硬挂。
      综合 182–191 = 区域综合评价指数（对象=区域指数/优劣清单），不是成果点空间聚类/密度热点 → 禁止硬挂。
    05 97 叶无「地理热点区域 / 空间密度识别」专叶。对不上 → missing。metric_id 空。不发明 M_*。
    密度/主要类型 = 同一识别结果读面，不另开 other_system。无 also_in（专题 7 条 missing 不是本缺口；
    OVERVIEW 全球创新价值 missing 不是本缺口）。
  创新成果详情查看（seq 93）：点击地图标记点，查看成果描述、创新价值、发布时间、关联机构。
    = ADS 单条记录读面 → other_system。
    「创新价值」在本页只读已落库字段，不是全球 OVERVIEW seq 59「创新价值数值计算模型」。
    禁止无依据 also_in: DS-04-ACHIEVE-OVERVIEW 创新价值 missing。
    禁止 mapped 182（区域成果指数，不是逐条成果详情）。禁止 mapped seq 116 关系查询顶替关联机构字段。
    禁止因 05 无「成果详情」叶而 missing。
  V1 读 ADS ≠ mapped 05。本页不把专利/论文计数改挂为 05 技术链基础指标。

