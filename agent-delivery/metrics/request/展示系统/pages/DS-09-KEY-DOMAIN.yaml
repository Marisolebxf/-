keydomain_ruling: |
  区域科技创新空间布局分析（seq 185）：看创新资源地理分布，提供空间密度分析和集聚度评估。
    = GIS + ADS 点位/密度图层 → other_system。不是构图、不是关系抽取。
    禁止按号 mapped 05 综合 185 政策成效。禁止 mapped 191 协同网络「密度」（网络密度 ≠ 空间密度）。
    禁止因库无「空间密度专叶」写成 missing。xlsx 行100/101 同判定。
  竞争力水平与潜力评估（seq 186）：评估区域科技创新竞争力水平和潜力，看指标体系与评估结果，
    与对标区域对比。
    语义对照 05 综合 186：区域对象；正文「创新能力与发展潜力」；输出活力指数/单维评分；
    横向对比/按区域查询 → 对得上 → mapped（按语义，不是按展示序号 186）。
    语义对照 DS-06-CITY excel_row 135 / seq 132「竞争力分析」（优势领域/薄弱环节/发展潜力/报告）
    已 mapped 同一 186 叶；对象=深圳城市，本页对象=规划页区域。同叶 mapped，不复制 CITY 行，
    无 also_in（CITY 非缺口）。
    05 技术链 seq 135 技术产业化潜力：对象=某项技术（基础科研/成果转化/产品市场）→ 对不上，
    禁止 mapped，也不因此 missing。
    禁止 mapped 企业 seq 141 深圳企业竞争力（对象=企业）。
    禁止用 M_CHAIN_COMPETITIVENESS_INDEX / M_CHAIN_REGION_INDEX / M_CHAIN_SZ_ADVANTAGE_* 顶替。
    禁止改挂 M_SYNTH_VIT_*。禁止拼 mapped 182–185。禁止硬挂 187–190 要素叶。
    半成品行102/103 调用系统=科技专题服务系统，覆盖判定跟 186，不改打 other_system。
    招标「竞争力」vs 库「创新活力」见 KEYD-B03，不另开 A。
  土地用途与效益分析（seq 187）：看土地利用类型、创新产出效益，土地利用效率评估和优化建议。
    = GIS + ADS 用地/产出图层 → other_system。
    禁止按号 mapped 05 综合 187 要素类型（「空间」要素 ≠ 土地用途效益）。
    禁止 missing「库无土地效益叶」。xlsx 行104/105 同判定。土地句里的优化建议不改挂 seq 190。
  科技载体分布展示（seq 188）：地图展示科技载体分布，选类型查看，详情与创新活动分析。
    = GIS + ADS 载体点位/详情 → other_system。不是载体价值排名。
    禁止按号 mapped 05 综合 188 要素层次。禁止 mapped seq 116 图谱API。
    DS-06-CARRIER 对象=深圳载体创新价值排名（已 missing）；本页对象=规划页载体落图。
    对象不同，不是共有缺口 → 不 also_in。禁止抢 CARRIER seq 114 价值排名写成 missing。
    禁止 mapped 企业 141 / 科研机构 151。详情读 ADS，不另开 missing。
  产业与领域筛选联动（seq 189）：选产业大门类/科技领域细分，地图呈现技术空间分布，
    联动技术规模、技术发展状态、领军主题。
    = 筛选 + 地图联动壳 → n/a_ops。xlsx 行98/99 随壳展示，不另开 missing / 不 mapped。
    禁止按号 mapped 05 综合 189 要素领域指数。禁止 mapped 技术链 133 细分领域 / 137 技术阶段。
    禁止因库无「筛选联动」叶而 missing。领军主题不另开行。
  资源配置优化建议（seq 190）：基于空间布局和竞争力分析给投入建议与空间布局优化方案，
    支持方案模拟和效果预测。原文未点名生成模型 → 建议壳 n/a_ops。
    禁止 missing「库无建议生成/模拟叶」。禁止按号 mapped 05 综合 190。
    禁止把 186 报告附录策略建议/趋势预测改挂本叶 mapped。
    禁止 mapped 技术链 140 布局推荐。禁止改挂 M_CHAIN_LAYOUT_PRIORITY_SCORE /
    M_CHAIN_LAYOUT_RECOMMEND_COUNT（B 轨不得 missing，也不得无依据改挂）。
    禁止 also_in M_POLICY_INDUSTRY_FIT。不编制规划文本。
