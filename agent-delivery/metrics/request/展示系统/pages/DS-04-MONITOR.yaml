monitor_ruling: |
  监测模型设置（监测指标 / 阈值 / 频率）= 展示侧配置表单；自动监测是规则阈值调度，不是 05 挖掘叶
    → n/a_ops。禁止因 05 无「监测模型设置」专叶而 missing。
  创新点发现：SRS 写明「通过算法模型自动发现创新点」并给出识别列表与详情。
    seq 134 技术前沿热点领域识别：对象=技术链热点领域，专题 TOPIC-TECH-05 已 third_party；
    不是全球创新监测的创新点 → 对不上，禁止 mapped / third_party 改挂。
    seq 182–191 全是区域综合评价，禁止改挂「全球创新点发现」。
    05 97 叶无「全球创新点发现」专叶，且原文要点名算法 → missing。不发明 M_*。
    查看列表/详情 = 同一发现结果的读面，不另开 missing，也不另开 other_system。
  创新价值评估：SRS 对「发现的创新点」做价值评估并出评估结果 / 价值分析报告。
    半成品 xlsx 行40 调用系统=科技专题服务系统 / 科技专题战略分析（上层封装），
    但本五级要的是评估算法结果；页面仍暗示要算法库产出。
    seq 135 技术产业化潜力：对象=技术点三维潜力，不是创新点价值 → 对不上。
    seq 182 区域科技创新成果综合评价：对象=区域成果指数，不是全球创新点 → 禁止改挂。
    05 无「创新点价值评估」专叶 → missing。不发明 M_*。
    行35「创新价值」对象=创新成果，归 ACHIEVE-OVERVIEW seq 59，禁止算进本页。
  订阅管理（领域 / 创新载体 / 条件 / 推送频率）= 用户订阅配置 → n/a_ops。
    不是 seq 65 成果详情订阅（归 DETAIL）。
  创新关注点设置（关键词 / 技术领域 / 创新类型）= 关注点配置表单 → n/a_ops。
  智能推送：原文是按已设模型/订阅/关注点，经通知、邮件推送，并管理推送历史/设置
    = 消息通道 + 运营配置 → n/a_ops。未点名推荐/排序算法。
    禁止改挂 seq 140 深圳重点布局领域推荐，禁止改挂 M_SVC_REC_*。
  禁止用 DS-02-PATH 中心度缺口 also_in：中心度 ≠ 创新点发现 / 价值评估。

