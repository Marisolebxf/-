    → missing。不发明 M_LOCAL_ADV_*。
  科技人才流动监控（seq 182）：对核心技术人才全面监控；产业界和学术界流动；流动趋势分析与预警。
    对照人才 05：seq 157 人才流动追踪 = 社交/招聘/简历上的区域或行业流入/流出/留存 + 趋势/热点；
