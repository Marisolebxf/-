    订阅/推送壳，不编制规划文本，不跑推荐模型。
    → n/a_ops。禁止 missing「库无资源推送模型」。禁止改挂 M_SVC_REC_* / 164 招入推荐。
    禁止把资源清单生成当成 05 报告叶。不发明 M_PLAN_PUSH_*。
