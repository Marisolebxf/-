page_ruling: |
  全球热点技术捕捉（seq 178）：实时监测全球技术发展趋势，自动识别热门技术领域；
    热点技术列表及其发展趋势；热度指数、增长速度。
    对照 05 seq 134 技术前沿热点领域识别模型（论文/专利/资讯多源；自动识别新兴热点；
    研究热度/关键词权重/专家活跃度；输出热点列表、热点指数、趋势预测、发展阶段可视化）。
    热度指数 ⊂ 134 热点指数；增长速度 ⊂ 研究热度/趋势。自动识别 = 实现类 Job。
    TOPIC-TECH-05 TECH-D04/D05 与 DS-07-SCI-CREATE SCI-D03 同叶已 third_party。
    algo-catalog 技术链实现类倾向 third_party。
    → third_party。禁止伪展开热点公式。不是 missing（库已列叶）。
    半成品 xlsx 行96/97 调用系统=专题战略分析是路由启发式，覆盖判定跟 134。
    禁止改挂 132 历程。禁止 mapped 135 产业化潜力。禁止把 134 趋势输出改挂 seq 184。
    禁止按号 mapped 综合 182。不发明 M_HOTSPOT_* / M_HEAT_*。
  多维度指标体系展示（seq 179）：大屏展示技术发展、产业/机构/课题/成果/统计/人才等库的指标体系；
    自定义展示内容和布局；指标间联动。
    无计算模型原文。自定义布局/联动 = 展示运营壳。
    → n/a_ops。禁止 missing「库无多维指标体系模型」。禁止硬挂 186/187–190 当本叶覆盖。
    禁止把 W13 数据资源视窗或 metrics catalog 读数改打 mapped。不发明 M_PLAN_KPI_*。
  技术与产业热点动态跟踪（seq 180）：对技术与产业热点方向动态跟踪；选特定领域看全球发展动态；
    时间轴展示和空间分布可视化。
    对照同一 134 叶：动态监测、按主题/关键词跟踪、趋势预测、发展阶段可视化。
    → third_party（与捕捉同叶，不另开 A）。禁止伪公式。
    时间轴 = 134 发展阶段/趋势读面，禁止改挂 132 历程（TOPIC-TECH-05 历程=n/a_ops/CMS）。
    空间分布 134 无地理空间专核 → B 类粒度欠账，不另开 A；禁止硬挂 133 深圳细分领域分布
    （KEY-DOMAIN 空间布局邻叶，对象=深圳某技术覆盖率/集中度）。
    禁止 mapped 135。半成品无本叶专行。不发明 M_HOTSPOT_TRACK_*。
