    禁止抢 DS-04-CARRIER-RANK seq 76（全球榜详情）。禁止 mapped seq 116。
  创新价值排名展示（seq 114）：展示各载体创新价值排名，查看创新能力与表现，识别高价值载体。
    半成品 xlsx 行56 主项=创新价值排名；调用系统=科技信息展示系统 / 科技指数计算（上层封装，
    默认 other_system）。页面仍要载体级评价结果而 05 无对口叶 → 推翻 other_system 默认，打 missing。
    同构 DS-04-CARRIER-RANK seq 73/74（全球载体指数与多维排名已 missing）。
    对象=深圳创新载体（高校/机构/企业/工作室），不是城市、不是区域、不是全球载体榜。
    05 97 叶无「创新载体创新价值/创新能力指数」专叶。
    综合 seq 182–191 全是区域指数 → 禁止硬挂 mapped。
    企业 seq 141 深圳企业竞争力：只覆盖企业，覆盖不了高校/机构/工作室，禁止改挂。
    科研机构 seq 99/149 综合科研实力、领域科技综合实力：专题机构维，不是深圳载体价值榜。
    科研机构 seq 151/152 深圳科研机构优势/痛难点：对象=深圳科研机构对标全国，TOPIC-ORG-05 已 mapped，
    禁止改挂本榜、不 also_in（专题非缺口）。
    产业服务 seq 174–179 / M_SVC_ORG_TECH_SCORE = 服务机构技术力，不是深圳创新载体。
    B 轨不得 missing，也不得无依据改挂本排名。
    不发明 M_CARRIER_* / M_SZ_CARRIER_*。
    DS-08 指数可视化、xlsx「科技指数计算」上层封装 ≠ mapped 05。
    共有算法缺口：also_in: DS-04-CARRIER-RANK（全球页已 missing 载体指数；地域不同，缺口同类）。
  载体订阅功能（seq 115）：订阅重点载体，定期推送最新创新动态与成果更新。
    用户订阅 + 推送通道 → n/a_ops。禁止因库无「订阅」叶而 missing。
    禁止改挂 DS-04-CITY seq 87、DS-04-MONITOR seq 80、M_SVC_REC_*。
  载体筛选与搜索（seq 116）：按载体类型、创新领域、创新价值筛选，或关键词搜索。
    列表过滤/搜索壳 → n/a_ops。不是 05 模型。
    禁止 mapped 05 seq 116 产业全要素图谱API（序号碰巧相同）。
    筛选键「创新价值」消费 seq 114，不另开 missing。
  载体对比分析（seq 117）：用户自选多个载体，系统提供对比视图，展示创新成果、创新价值、
    发展潜力等方面差异。= 并排视图壳 → n/a_ops。不是实体匹配/相似载体算法（匹配才 missing）。
