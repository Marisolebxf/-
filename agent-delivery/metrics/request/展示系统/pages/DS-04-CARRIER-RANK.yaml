    产业服务 seq 174–179 / M_SVC_ORG_TECH_SCORE = 服务机构技术力（金融/知产/人力/市场/咨询/科创服务），
    不是全球创新载体。B 轨不得 missing，也不得无依据改挂本榜。
    不发明 M_CARRIER_* / M_INNOV_INDEX_*。
    DS-08 指数可视化、xlsx「科技指数计算」上层封装 ≠ mapped 05，也不把本缺口算进 DS-08。
  多维度排名展示（seq 74）：原文要总体排名、领域排名、地区排名，用户切换查看。
