cross_kg_carrier:
  source: agent-handoffs/产品整体定义/跨系统-知识图谱/01-系统分析.md
  section: "§6 科创要素映射；§8.5 SC-DS-26"
  ruling: >
    创新载体 / 孵化载体：载体 ≠ 企业；运营主体→企业或机构；入驻→企业；G1。
    Catalog DS-26/29 已声明独立实体；【算法补】是否升为属性节点或挂服务机构。
    升格前禁止第三套「载体本体」与七要素并列扩散。
    团队默认：载体作为挂接对象，点类型仍落企业/机构/服务机构三选一。
    禁止把 GIS 图层当图谱边。论文/专利/项目不进点类型（M + 弱 G1 / 事件 ADS）。
  sc_ds_26: "载体数量/人才等；载体–运营主体挂接；G1；ADS + A；V1 弱挂接；载体映射见 §6"

page_ruling: |
  【创新载体地图与增量分析 seq 485–488】
  485 多级空间分布与热力地图：GIS 缩放 + 行政层级筛查 + 热力密度 + 空间演变演示。
    多级空间/热力 GIS = other_system。不是 05 构图，不是关系抽取。
    禁止 mapped 05 seq 116。禁止因库无 GIS 叶而 missing。禁止发明 carrier 点类。
    点位读 ADS；载体落点仍按 §6 挂企业/机构/服务机构。
  486 载体年度与季度增量统计：新建立/新备案载体的同比环比、趋势曲线。ADS 计数读面 → other_system。
    禁止改挂 产业服务 101「新增服务机构动态」（对象=服务机构 ≠ 未升格载体全量）。
    禁止 missing「载体增量专叶」（会发明载体口径）。导出见 487 壳，本叶不改 n/a_ops 顶掉计数。
  487 分类筛选与分区对比分析：类型/区划/领域筛选 + 多区对比视图 + 批量导出。
    筛选导出 n/a_ops。禁止 mapped 116。禁止因库无「载体对比」叶而 missing。
    禁止做成实体匹配/相似载体算法 missing。
  488 载体详细资料及服务状态管理：点选卡片（名称/类型/法人/团队/服务范围/业绩）+ 资料下载/导出。
    详情读 ADS → other_system。预约情况只展示对接字段，不建预约闭环。
    明确不做完整园区运营系统。禁止 missing 园区 OS。禁止改挂 DS-28。
  【人才态势分析 seq 489–492】
  489 高端人才分布与结构统计：院士/千人/孔雀等在区域、平台、载体上的分布结构。
    分布计数 → 98 mapped。地图热力是呈现，不另开 GIS A。禁止按号 mapped。
    禁止综合 184。禁止 M_CHAIN_REG_TALENT_STRUCTURE。禁止做成 DS-13 整页。
  490 人才年度增量与成长趋势：高端人才年度新增、流动速率、同比环比曲线。
    流动/增量趋势 → 157 mapped（流入/流出/留存 + 趋势；关系+时间）。禁止 GPS 轨迹 missing。
    禁止改挂 158 高校新培育、184。禁止轨迹引擎。
  491 人才类别与专业细分对比：学科/岗位层次/技术领域结构比例与成长速度。
    领域/类型结构 → 98 mapped。对比图表是呈现。禁止 159 深圳短板改挂。禁止 184。
  492 人才与载体空间关系匹配：人才与载体空间/数据关联、热力、链路互动。
    弱挂接：载体未升格，边落 人才–企业/科研机构/服务机构 → 111 mapped。
    GIS 热力是呈现。互动评分/智能建议 = 读边，不升 160 / DS-15 关系链工作台。
    禁止发明 carrier 点类。禁止 missing「人才-载体匹配模型」。对不上才 other_system；本叶对得上 111。
  【载体人才协作关系分析 seq 493–496】
  493 跨载体协作网络可视化：网络拓扑描绘载体–人才协同、资源共享、合作密度。
    弱挂接可视化 → 116 关系查询 + 图谱可视化 API mapped。节点仍七要素，不升载体点类。
    禁止改挂 191 区域协同指数（对象=区域网络三指标，不是本页展示拓扑）。
    禁止 M_SVC_GRAPH_DENSITY / CENTRALITY / INFLUENCE。禁止做成 SYNTH-COLLAB 整页。
  494 空间资源叠加与生态链联动：载体分布 × 人才密度 × 项目 的 GIS 图层叠加与热点高亮。
    多级空间/热力 GIS = other_system。禁止把 GIS 当图谱边。联动高亮消费 493 已挂接边，不另 mapped 116。
    禁止写成 DS-30-ECO。项目不进点类型。禁止 missing 空间叠加算法。
  495 协同项目进展与动态推送：联合项目归集、进展图表、定期推送后台、导出。
    推送/导出/后台 n/a_ops。项目 = 事件/ADS，不单列 Project 点类。
    禁止 missing 推送引擎或项目进展模型。明确不做园区运营。绩效评估收口 496。
  496 协同绩效与影响力智能评估：原文要数据分析+网络关系挖掘，输出多维绩效成绩单和影响力评估报告。
    05 97 叶无「生态协同绩效 / 跨载体影响力」专叶。综合 191 = 区域协同指数（完整度/中心度/密度），对不上。
    服务 173 = 服务机构合作/交易/信用关系链，对不上。174–179 = 六类服务机构技术力，对不上。
    故 missing。禁止硬挂 191/173/182–190。禁止改挂 M_SVC_GRAPH_INFLUENCE / M_CHAIN_REG_ECOSYSTEM。
    禁止发明 M_ECO_* / M_CARRIER_*。不重列 SYNTH-COLLAB OUTPUT_CORR（对象=区域协同-产出相关，不是本页成绩单）。
    半成品行166/167 调用系统=深度挖掘算法，覆盖跟本叶 missing，不改 other_system。
  半成品行165「创新生态指数」调用系统=科技信息展示系统/科技指数计算（上层封装）→ 默认 other_system；
    12 叶原文无「创新生态指数」专名，不另开 items、不升 A。禁止与行180 DS-30 服务全景指数混行。

