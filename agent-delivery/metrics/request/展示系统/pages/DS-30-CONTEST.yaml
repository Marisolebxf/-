contest_ruling: |
  竞赛项目数据归集与分类（seq 584）：对全球科技赛事名称、领域、主办方、影响力等信息
    做标准化分类整理，明确赛事层次和举办需求。= 入仓/分类字段 + ADS。
    派单硬约束：竞赛归集 = other_system。
    「影响力」是归集属性，不是 05 区域综合评价 / 服务关系影响力指数。
    半成品 xlsx 行188 赛事影响力（深度分析模型）= 根据原文归纳，需规未点名影响力模型
    → 推翻「调用系统=深度挖掘算法」默认，随本叶 other_system。
    禁止 mapped seq 112 服务机构 NER。禁止 missing 分类/影响力模型。不发明 M_*。
  参赛社区内容结构化整合（seq 585）：参赛者数据、参与记录、论坛发言、排行榜等内容
    关联归档，便于数据管理和统计分析。= CMS/ADS 归档 + 计数统计。
    文中「排行榜」= 社区已有榜单归档，不是科技成果排行算法。
    禁止 mapped DS-08-RANK。禁止 mapped seq 101。
    半成品 xlsx 行187 竞赛热度（深度分析模型）= 归纳项，需规未点名热度模型
    → 推翻默认，随本叶 other_system。禁止改挂 M_SVC_ORG_MARKET_HEAT。
    禁止因库无「社区热度」叶而 missing。不发明 M_*。
  数据集与应用场景映射（seq 586）：细化每个竞赛的数据集明细及其应用场景，
    梳理数据流转与竞赛业务深度捆绑，实现数据、项目、交流多维一体管理。
    = 数据目录/映射表管理 → other_system。禁止 missing 映射引擎。禁止 mapped seq 116。
  竞赛列表与标识专题可视化（seq 587）：专题列表、赛事标识展示举办方与影响范围；
    举办需求和联名赛事专属入口。= 展示列表/标识壳 → other_system。
    「影响范围」读归集字段，不另开影响力 missing。禁止 mapped seq 116 可视化 API。
  竞赛发布与组织（seq 588）：以专题形式发布竞赛信息，提供竞赛活动全流程组织支持。
    = 发布/组织运营壳 → n/a_ops。禁止 missing 组织引擎。不做报名计分闭环。
  社区互动与成果沉淀（seq 589）：展示竞赛成果与数据，构建互动交流空间。
    成果读 ADS；互动=社区壳。合叶 other_system（读面优先）。
    禁止 missing 社区推荐/情感模型。禁止 mapped seq 180/181。不发明 M_*。
  竞赛信息接口（seq 590）：专用接口推送竞赛基础信息、举办方、需求发布与赛事详情，
    多条件检索。= 展示/业务 REST → other_system。
    禁止 mapped seq 116（图谱实体检索/关系查询，不是竞赛业务接口）。
    禁止因库无「竞赛 API」叶而 missing。
  项目查询接口（seq 591）：竞赛模块项目等内容的查询与推送。= 业务查询接口 → other_system。
    对象=竞赛项目/学习资源，不是 05 产业链项目指标、不是全域「课题/项目」要素叶。
    禁止 mapped seq 116。不发明 M_*。
  成绩榜单接口（seq 592）：为成绩排行榜、参赛行为提供独立数据接口，多终端展示。
    派单硬约束：成绩榜单接口 = other_system。
    半成品 xlsx 行186 竞赛排行/分级结果标了深度挖掘算法 / 基础指标分析模型。
    原文是独立数据接口，不是 05 模型计算排名。推翻默认 → other_system。
    禁止 mapped DS-08-RANK（对象=科技成果/科技指数榜，不是竞赛成绩）。
    禁止 mapped seq 101（服务机构基础指标）。禁止 mapped 180/181 推荐排序。
    禁止 missing「库无竞赛排名专叶」。不发明 M_*。
  05 97 叶无「科技竞赛 / 赛事热度 / 赛事影响力 / 成绩榜单」专叶。不发明 M_CONTEST_*。
  B 轨不得 missing，也不得无依据改挂本页。
  V1 读 ADS / 外系统接口 ≠ mapped 05。挂接可空。

