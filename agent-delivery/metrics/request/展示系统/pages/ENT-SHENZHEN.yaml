    为本页城市指标。CITY_AVG_TECH_POWER 派生自单企业技术力，本页 ID 仍是城市均值。

  【97 基础指标】定位视图的企业数、链中角色、重点环节企业数、覆盖环节派生、完整度计数、
    环节/角色分布图 → mapped 企业/基础指标.md#企业基础指标模型构建（seq 97）。
    97 支持按地区+领域过滤与节点分组计数。完整度「覆盖/全集/加权」公式未闭合 → B，不 missing。
    链中角色 seed 直接映射 industry_chain_role；无角色显示「暂未标注」，不推断。
    109 关系抽取是字段基建，不把本页做成图谱菜单、不 mapped 108/109。

  【141 竞争力】对标视图平均技术力、平均商业力、企业密度、相对优势与短板 → mapped
    企业/深度分析.md#深圳企业竞争力水平分析模型（seq 141）。
    141 是深圳 vs 全国加权竞争力（规模/财务/人力/市场）。本页四轴是技术力/商业力/密度/完整度。
    能对上「城市企业群竞争力对标」叶 → mapped，不是 missing。维名差 → SZ-B07。
    禁止 mapped 145/146 单企业评估叶顶替城市 GROUP BY。禁止输出综合竞争力总分/总排名。

  【GIS/分布】本页 Wireframe 无 GIS 地图。环节分布 / 角色分布 = 计数图 → mapped 97。
    「所在区」是清单字段不是落图。禁止因 05 无 GIS 专叶 missing。若后续把区做成底图 → other_system，
    本页未定义故不单列 GIS 行。禁止把 KEYPANO 区域 GIS 算进本页。

  【壳】产业链/Tab/环节/城市多选/清单检索全选 = n/a_ops。
    雷达与城市表是对标读面壳 → other_system（数值走 141 行）。
    详情宽幅 Drawer → other_system（ENT-PROFILE）。加入对比篮 → other_system（ENT-COMPARE）。
    禁止 missing 清单/Drawer/雷达模型。

  Q014 / Q016 / GAP-SZSTATUS-* 待确认 ≠ A。专题 ENT-B06 是 B 欠账，共有口径写 also_in: TOPIC-ENT-05，
    不重列 missing。专题 missing 7 条与本页无关，不重列、无 also_in。

