  【语义层】METRIC-OPEN-ENT-SHENZHEN 适用。只消费 7 条：
    M_ENT_SZ_COUNT / M_ENT_SZ_CHAIN_POSITION / M_ENT_KEY_NODE_COUNT / M_ENT_CHAIN_COMPLETENESS
    / M_ENT_CITY_AVG_TECH_POWER / GAP-SZSTATUS-CITY-AVG-BUSINESS-POWER / M_ENT_CITY_DENSITY。
