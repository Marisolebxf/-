maintain_ruling: |
  本五级七叶原文全部是人工编辑器：右键空白/工具栏加节点、选中删除、Ctrl 连边、点边删关系、
  双击改属性、Ctrl+Z/Y 撤销重做、保存与版本回滚。
  「自动生成唯一标识符」（seq 34）= 业务主键/UUID，不是 05 实体识别。
  关系类型「包含/依赖/促进」与关系强度、时间范围（seq 36）= 对话框人工填写，不是 05 关系抽取，
  也不是半成品「关联强度」网络指标。
  节点「重要性等级」（seq 38）= 表单字段，不是半成品「节点优先级/重要度」算法分。
  只有本五级原文明确要算法自动生成/推荐补边才 mapped 或 missing。本页没有。
  05 seq 104「支持添加、删除、修改实体及定期库更新」= NER 后的技术实体库运维，宿主在算法库，
  不是展示 G6 编辑器。禁止因此 mapped，禁止因此 missing。
  05 seq 105 = 多源关系抽取入库，不是本页「添加关系」对话框。

