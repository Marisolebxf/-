# 本页 = 需规五级「科创要素」（SRS 02 excel_row 12–16 / seq 9–13）。
#   基础信息查看、统计指标展示、分析数据展示、监测数据趋势变化、地图可视化（仅要素空间呈现）。
# 本页不承接：图层配置 → DS-01-LAYERS；地图操作（放大/平移/复位/搜索定位）→ DS-01-MAP；
#   科创事件（时间筛选/重要性分级/事件详情，半成品行 2–3、16）→ DS-01-EVENTS。
# 详设 04：DS-01 读面 = A 嵌图 + GIS + ADS；嵌图可薄、挂接可空。GIS 图层配置不进本页。
# 语义层已挂 OPEN（Round 18 present）。禁止发明正式 M_*。trace / WF 第6列为空。
# 对照：A1 表1/表2（DS-ALGO-GAP-L02）回填 A1 ID。不回滚 Round 18 OPEN。
# B 轨 63 M_CHAIN_* / 29 M_SVC_* 不得 missing；本页不把链/服务 ID 改挂为正式看板 ID。
# 专题 missing 7 条不重列。本页缺口与那 7 条实体不同，无 also_in。
# 人才/科研机构/技术链实现类倾向 third_party：已列叶 → mapped，口径写「第三方不展开」，禁止伪公式。
# 分类：A=missing / B=semantic_debt / C=mapped|third_party|other_system|n/a_ops。

taxonomy_ruling: |
  展示「科创要素」实体 = 论文、期刊、专利、专家学者、会议、组织机构（科研/企业/服务）、课题、项目、成果。
  专题 SYNTH-ELEMENT「创新要素」= 人才/企业/政策/服务机构/科研机构/资金/空间 七要素指数。
  禁止用 M_SYNTH_ELEM_* / seq 187–190 区域要素指数顶替本页数量、影响力或关联。
  禁止用 M_CHAIN_ACADEMIC_POWER 顶替专家学者影响力；禁止用 M_CHAIN_PATENT_COUNT 顶替专利影响力
  （后者是专题 CHAIN-TOPIC-PANORAMA missing「产业链关联专利数」，不重列、不 also_in）。

graph_assoc_ruling: |
  02「要素关联关系与影响程度」= 实体间关系权重 / 网络指标，对照 05 seq 116 图谱API（关系查询+密度/中心度）。
  不是 SYNTH-ELEMENT CONTRIB（对特定产业/成果的贡献路径，专题已 missing，本页不重列）。
  不是 seq 187「七要素作用强度」（错误分类学）。B 轨 M_SVC_GRAPH_* 是服务链图谱指标，禁止顶替、禁止 missing。

forecast_cluster_ruling: |
  02 监测「趋势预测」「异常点」与分析「要素聚类」要算法结果。
  05 综合 182/186/189/190 的趋势预测是区域指数报告；seq 96 正文「聚类分析」是区域论文统计方法一句；
  「异常值剔除」是清洗。三者均无科创要素实体专叶 → missing。不新造 M_*。

impl_class_ruling: |
  人才 seq 98/162、科研机构 seq 99、技术链 seq 96：差集判定=mapped（库已列叶）。
  建议取值写「第三方不展开」。禁止把 05 叙述改写成可落地加权式。

