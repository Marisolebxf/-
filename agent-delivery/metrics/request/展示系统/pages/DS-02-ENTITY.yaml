entity_ruling: |
  默认 Top5（人/机构/论文/专利）+ 卡片上的关联强度 = 05 seq 105 技术实体关系抽取
    （正文含「核心节点及关联强度」；边类型含技术–人才/企业/科研机构）
    + seq 104 技术实体识别构建（实体名称/类型/论文量/专利量等属性）。能对上 → mapped。
  论文/专利 = 材料 + 清单 + 计数（04 / 05.1）；计数宿主 seq 96。不进技术点类型。可 mapped 同一 05 叶。
  实体之间的连线/网络图 = 同一 seq 105 关系库的可视化消费 → mapped。禁止改挂 seq 116。
  点击交互 / 类型与时间筛选 / 详情弹窗壳 = n/a_ops 或 other_system（字段走 ADS/实体库）。
  时间轴动态播放关联变化 = 带时间戳边的前端回放，不是 PATH 动态演示，也不是 seq 132 历程模型 → n/a_ops。
  用户按时间/名称/类型排序 = 前端排序 → n/a_ops。
  按关联强度自动排序 = 已有 105 边权，并入 Top5/强度，不另开 missing。
  按「影响力」等指标自动排序、优先展示重要实体：原文点名重要性算法，05 无「技术点关联实体优先级」专叶
    → missing（metric_id 空，不发明 M_*）。半成品行19「技术点影响力」取数依据即此句，本页消费。
  技术链实现类倾向 third_party、禁止伪公式：本页 104/105/96 是图谱构建 + 基础计数，不是 G3 Job，故 mapped 而非 third_party。
  禁止用 M_CHAIN_ACADEMIC_POWER / M_SVC_GRAPH_INFLUENCE / CENTRALITY 顶替关联强度或实体影响力。

