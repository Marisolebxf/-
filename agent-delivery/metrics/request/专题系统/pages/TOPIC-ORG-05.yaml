# 本页 = 专题科研机构分析整包。无独立四件套叶子；边界真源 = 05.4 + SRS 04（excel_rows 62–86 / 十招标叶子）。
# 本页承接：涉及产业、技术领域布局、新增动态、深圳现状、合作关系链、技术力对比、
#   引入推荐、培育（扶持）推荐、深圳优势、痛难点。调用链 /topic/v1/institution/**。
# 本页不承接：产业服务链「服务机构」M_SVC_ORG_* / M_SVC_REC_* / seq 174–181；
#   产业链机构形近 ID（M_CHAIN_INSTITUTION_* / REG_RESEARCH_ORG / ACADEMIC_POWER 等）；
#   门户全球概况/领先机构/深圳介绍（catalog R-29~32）；运营内容管理（R-33/34）；
#   独立机构本体（05.4 §7 明确不做）。
# 语义层已挂 METRIC-OPEN-TOPIC-ORG（Round 17 present）；05.4 与 SRS 04 均未挂正式 metric_id。
#   → 页级 B 类语义欠账，禁止发明正式 M_*。source 用 srs04 / 05.4（无 TRACE/WF/METRIC-OPEN）。
# 对照：05 科研机构 10 叶（基础指标 1 + 图谱 2 + 深度分析 7）。能对上 → mapped。
# algo-catalog default_hint：实现类倾向 third_party，禁止伪展开公式。
#   mapped 只写对应叶子；建议取值写「第三方不展开」，不编论文/专利加权式。
# B 轨 63 M_CHAIN_* / 29 M_SVC_* 本页不消费，禁止打 missing。
# A1 双表未交（a1_tables_ready=false）→ A1需规ID / A1指标叶ID 一律 null。
# 分类：A=库缺口 missing / B=语义欠账 semantic_debt / C=已覆盖 mapped。本页 A=0。

