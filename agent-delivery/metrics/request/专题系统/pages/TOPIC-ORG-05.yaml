  科研机构与人才/技术链同档：A1/A2 schema 将实现类标为 third_party，不算我方公式库缺失。
  05 已列叶能对上 04/05.4 招标叶子 → 差集判定=mapped（库已涉及），不是 missing。
  建议取值/取值口径一律「第三方不展开」；禁止编造论文数×权重+专利数×权重等伪公式。
