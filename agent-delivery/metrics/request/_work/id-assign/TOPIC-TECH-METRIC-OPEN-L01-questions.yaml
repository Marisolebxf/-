items:
  - id: Q-MO-TECH-01
    status: 🟡
    topic: 深圳技术综合评估是否独立 metric_id
    related_temp: [TEMP_TOPIC_TECH_SZ_ASSESS]
    related_metric: [M_TECH_SZ_ASSESS, M_TECH_POTENTIAL_SCORE, M_TECH_STAGE_JUDGE]
    options:
      - id: A
        label: 独立号 M_TECH_SZ_ASSESS（深圳综合评估包）
      - id: B
        label: 不另开号，只消费潜力分 + 阶段判定的深圳地理切片
    default: A
    rationale: >
      检索：OPEN §3.5 写明潜力/阶段计算复用 §3.3/§3.4 核、不发明第二套公式，同时又把 seq 133/138/139/140
      并成一条 TEMP（问题/机遇/布局/细分同层）。05.1 `.4.4` `.4.9`～`.4.11` 是独立 Job 叶子，产出含优劣势与建议，
      不是简单 WHERE region=深圳。
      推理：公式不双轨 ≠ 页面消费面相同。默认独立号，避免把综合评估包误写成两条过滤别名。
      若甲方认定只是切片，废弃 M_TECH_SZ_ASSESS，改挂另外两号。

  - id: Q-MO-TECH-02
    status: 🟡
