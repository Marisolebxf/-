items:
  - id: Q-MO-TALENT-01
    status: 🟡
    title: 机构分布主口径：前 N 机构人才数 vs 区域机构数
    related_temp: [TEMP_TOPIC_TALENT_ORG_DIST]
    related_metric_id: [M_TALENT_ORG_DIST]
    legacy_debt: TAL-B03
    options:
      - id: A
        label: 前 N 家机构的人才数量与占比（SRS 04 seq 86–87）
      - id: B
        label: 每个省/国家拥有的人才机构数（05 seq 98（2）正文）
    default: A
    rationale: >
      招标叶子与 04 用户故事是「机构→人才数排名」；05 标题仍是机构分布，正文偏区域机构计数属叙述漂移。
      内部默认跟 04，05 机构计数不另造 ID。
    source: srs/04 seq 87 | 人才/基础指标.md seq 98（2） | 05.5 机构分布

  - id: Q-MO-TALENT-02
    status: 🟡
    title: 供给结构维：学历毕业序列 vs 职称/年龄存量
    related_temp: [TEMP_TOPIC_TALENT_SUPPLY]
    related_metric_id: [M_TALENT_SUPPLY_STRUCT]
    legacy_debt: TAL-B04
    options:
      - id: A
        label: 历年学士/硕士/博士毕业数量 + 存量以学历为主（05）
      - id: B
        label: 存量必须含学历/职称/年龄三切（04 seq 89）
    default: A
    rationale: >
      05 有可对上的学位毕业核；04 职称/年龄无专核。不发明职称/年龄结构 ID。历年窗口=自然年（常识，不另开 Q）。
    source: srs/04 seq 88–89 | seq 98（4）

  - id: Q-MO-TALENT-03
    status: 🟡
    title: 学术力分项维名与是否单列
    related_temp: [TEMP_TOPIC_TALENT_ACADEMIC_SCORE]
    related_metric_id: [M_TALENT_ACADEMIC_SCORE]
    legacy_debt: TAL-B05
    options:
      - id: A
        label: 一条综合指数；分项跟 05（成果数量/学术影响力/专业技能），04 H 指数等不展开、不单列
      - id: B
        label: 按 04 被引/H 指数/期刊影响力/合作广度单列分项 ID
    default: A
    rationale: >
      页面核是综合评分+排名；禁止伪展开 H 指数公式。04 分项作第三方内部特征。
    source: srs/04 seq 96–97 | seq 162

  - id: Q-MO-TALENT-04
    status: 🟡
    title: 产业力对象：个人转化贡献 vs 企业人才综合实力
    related_temp: [TEMP_TOPIC_TALENT_INDUSTRY_SCORE]
    related_metric_id: [M_TALENT_INDUSTRY_SCORE]
    legacy_debt: TAL-B06
    options:
      - id: A
        label: 人才个人专利转化/项目/商业化贡献（04；对象=人）
      - id: B
        label: 企业侧人才综合实力（影响力/产业覆盖/媒体知名度）（05 seq 163）
    default: A
    rationale: >
      招标叶子是「人才产业力」，对象是人不是企业。05 企业侧表述视为实现侧特征漂移，不改挂企业指标、不发明转化率 ID。
    source: srs/04 seq 99–100 | seq 163 | 05.5 `.7.8`

  - id: Q-MO-TALENT-05
    status: 🟡
    title: 高校新培育是否包含预测/新兴/校企专核
    related_temp: [TEMP_TOPIC_TALENT_UNIV_NEW]
    related_metric_id: [M_TALENT_UNIV_NEW]
    legacy_debt: TAL-B07
    options:
      - id: A
        label: 仅 05：新增识别、培养趋势、学科/技术方向、校际对比
      - id: B
        label: 必须含 04 三句：3–5 年毕业生预测、新专业/研究中心、校企合作（并单列）
    default: A
    rationale: >
      产品叶已对上 `.7.3`。04 三句 05 未单列专核；不另开 A 类、不发明预测/新兴/校企 ID。
    source: srs/04 seq 105–107 | seq 158 | 05.5 `.7.3`

  - id: Q-MO-TALENT-06
    status: 🟡
    title: 引入/培育分项维与建议文本是否单列 ID
    related_temp: [TEMP_TOPIC_TALENT_ATTRACT_SCORE, TEMP_TOPIC_TALENT_CULTIVATE_SCORE]
    related_metric_id: [M_TALENT_ATTRACT_SCORE, M_TALENT_CULTIVATE_SCORE]
    legacy_debt: TAL-B08
    options:
      - id: A
        label: 各一条综合指数；名单规模同核 STAT 面；分项与建议文本不单列
      - id: B
        label: 招引四维、培育四维及推荐理由/培育建议各自正式 ID
    default: A
    rationale: >
      OPEN 已禁止发明匹配度/潜力分项。Job 核是综合分。不消费 M_SVC_REC_* / 企业招引培育指数。
    source: srs/04 seq 101–104 | seq 164–165 | 05.5 `.7.9` `.7.10`

  - id: Q-MO-TALENT-07
    status: 🟡
    title: 深圳现状是否拆成计数 + 优劣势两条 ID
    related_temp: [TEMP_TOPIC_TALENT_SZ_STATUS]
    related_metric_id: [M_TALENT_SZ_STATUS]
    options:
      - id: A
        label: 一条 MIXED（计数对比 + 优劣势/短板）；供需仍走独立 ID
      - id: B
        label: 拆成现状计数 ID 与优劣势评价 ID
    default: A
    rationale: >
      05.5 把深圳现状收口到 `.1`+`.7.4` 同一招标叶子；MIXED 且拆不开时本 loop 要求进 Question。
      供需已有 M_TALENT_SZ_SUPPLY_DEMAND，不再混入。禁止 M_CHAIN_SZ_TALENT。
    source: 05.5 深圳现状 / `.7.4` | seq 93–94 / 159 | LOOP §2 MIXED 规则

  - id: Q-MO-TALENT-08
    status: 🟡
    title: 关系链路径/节点画像是否单列 ID
    related_temp: [TEMP_TOPIC_TALENT_RELATION]
    related_metric_id: [M_TALENT_RELATION_NET]
    legacy_debt: TAL-B11
    options:
      - id: A
        label: 一条网络结构 ID；最短路径与节点画像为呈现，不单列
      - id: B
        label: 路径长度、节点画像各自正式 ID
    default: A
    rationale: >
      OPEN 禁止发明路径类 ID。G1 核是网络结构；可视化/画像是呈现。不改挂 DS-15。
    source: srs/04 seq 90–92 | seq 160 | 05.5 `.7.5`

  - id: Q-MO-TALENT-09
    status: 🟡
    title: 深圳供需：第三方评价指数 vs 供给减需求算术
    related_temp: [TEMP_TOPIC_TALENT_SZ_SUPPLY_DEMAND]
    related_metric_id: [M_TALENT_SZ_SUPPLY_DEMAND]
    options:
      - id: A
        label: 第三方供需评价指数（缺口/盈余及趋势），不展开算术差
      - id: B
        label: 显式「供给−需求」或预测缺口公式
    default: A
    rationale: >
      05 是供需评价指数；04「供给与需求预测算缺口」若展开成算术差即伪公式。实现类 third_party。
      禁止 M_CHAIN_BOTTLENECK_TALENT。
    source: srs/04 seq 108 | seq 161 | 05.5 `.7.6`

  - id: Q-MO-TALENT-10
    status: 🟡
    title: 「重点人才」分析对象如何圈定
    related_temp: [TEMP_TOPIC_TALENT_REGIONAL_DIST, TEMP_TOPIC_TALENT_ORG_DIST, TEMP_TOPIC_TALENT_RELATION]
    related_metric_id: [M_TALENT_REGIONAL_DIST, M_TALENT_ORG_DIST, M_TALENT_RELATION_NET]
    options:
      - id: A
        label: 第三方名录/标签圈定的分析对象集（识别 `.7.1` 仅前置，不单列 ID）
      - id: B
        label: 必须先跑重点人才识别模型，以其产出集为唯一对象
    default: A
    rationale: >
      `.7.1` 非十一招标页、④ 无独立核。区域/机构/关系链的对象默认=名录去重重点人才标签，
      识别能力保持 mapped 前置。不发明识别正式 ID。
    source: 05.5 `.7.1` | TAL-D12 | seq 156
