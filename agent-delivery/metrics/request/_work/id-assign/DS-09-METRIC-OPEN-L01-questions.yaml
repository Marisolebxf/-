items:
  - local_id: Q-MO-DS09-01
    title: 规划页「本地」范围
    source_leaf: DS-09-METRIC-OPEN-L01
    metric_id: M_INNOV_PLAN_LOCAL_ADV
    page_ids: [DS-09-COMPREHENSIVE]
    options:
      - id: A
        text: 固定深圳本市
      - id: B
        text: 用户选定规划区域；未选时内部默认深圳
      - id: C
        text: 粤港澳大湾区 11 城（与 DS-05 同宇宙）
    default: B
    rationale: >
      OPEN 口径是规划页「本地」特色与优势，不是 DS-06 深圳城市竞争力拆项，也不是湾区创新能力因素。
      固定深圳会把未选区域的规划页读面锁死；跟 DS-05 同宇宙会改挂 M_INNOV_GBA_*。
      禁止 M_CHAIN_SZ_ADVANTAGE_* / M_SYNTH_VIT_*。
    status: 🟡
  - local_id: Q-MO-DS09-02
    title: 产业界↔学术界流动如何判定
    source_leaf: DS-09-METRIC-OPEN-L01
    metric_id: M_INNOV_PLAN_TALENT_FLOW
    page_ids: [DS-09-COMPREHENSIVE]
    options:
      - id: A
        text: 以任职单位类型为主（企业 vs 高校/院所）；论文署名与项目承担单位只作叙事、不进公式
      - id: B
        text: 任职 + 论文署名单位 + 项目承担单位三源并集进公式
      - id: C
        text: 复用 M_TALENT_FLOW_TRACK（区域/行业流入流出留存）
    default: A
    rationale: >
      招标对象是产业界和学术界之间的流动 + 预警，不是专题人才区域迁徙。
      C 口径不同且用户禁止改挂专题人才 ID。B 公式未签、易把 157 招聘流入流出混进来。
    status: 🟡
  - local_id: Q-MO-DS09-03
    title: 重叠度等级 vs 竞争情报等级是否同核
    source_leaf: DS-09-METRIC-OPEN-L01
    metric_ids: [M_INNOV_RES_GRADE, M_INNOV_RES_CI_LEVEL]
    page_ids: [DS-09-RESEARCH]
    options:
      - id: A
        text: 两条 ID（GRADE=重叠度分档；CI_LEVEL=情报强弱分值）
      - id: B
        text: 合并为一条，等级/分值只是读面
      - id: C
        text: 复用企业竞争力/技术力/商业力分档（141/145/146）
    default: A
    rationale: >
      OPEN 已分两条 TEMP，半成品把竞争情报等级列为独立主项。C 被 RESEARCH 禁 mapped。
      比对交互仍归 M_INNOV_RES_CI_COMPARE，不进本 Q。
    status: 🟡
  - local_id: Q-MO-DS09-04
    title: 规划页「区域竞争力/潜力」vs 186「创新活力」vs SYNTH-VITALITY
    source_leaf: DS-09-METRIC-OPEN-L01
    metric_ids: [M_INNOV_KEYD_COMPETITIVENESS, M_INNOV_KEYD_POTENTIAL]
    page_ids: [DS-09-KEY-DOMAIN]
    options:
      - id: A
        text: 独立两条 INNOV 号；186 只作语义读面对照；不改挂 SYNTH / 不 reuse 湾区/全球城市号
      - id: B
        text: 复用 M_SYNTH_VIT_INDEX / DIM_SCORE（或 GBA/CITY 186 读面号）
      - id: C
        text: 竞争力与潜力再合并为一条
    default: A
    rationale: >
      KEYD-B03 已记「竞争力水平」≠「区域创新活力」。对象=规划页区域，不是专题 Job 对比城市、不是湾区 11 城、不是全球城市。
      用户禁止改挂 M_SYNTH_*。OPEN 已拆 xlsx 102/103 两条 TEMP，默认不合并。
    status: 🟡
