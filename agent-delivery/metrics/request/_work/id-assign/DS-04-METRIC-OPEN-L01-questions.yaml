  - local_id: Q-MO-DS04-04
    title: 城市创新能力排名是否拆指数值 + 名次；能否复用 SYNTH / DS-06
    source_leaf: DS-04-METRIC-OPEN-L01
    metric_id: M_INNOV_CITY_RANK_GLOBAL
    page_ids: [DS-04-CITY]
    options:
      - id: A
        text: 一条 MIXED（名次为主、计算方法可查看）
      - id: B
        text: 拆 INDEX + RANK 两条
      - id: C
        text: 复用 M_SYNTH_VIT_INDEX + M_SYNTH_VIT_RANK，或复用 DS-06 深圳城市排名
    default: A
    rationale: >
      DS-04 OPEN 未单列 CITY_INDEX。M_SYNTH_VIT_RANK 口径=区域创新活力四维指数在对比范围内的排序
      （依赖 Q-SYNTH-01 公式），对象是专题 Job 区域，不是 /innov 全球城市创新能力读面 → 不同口径，禁止改挂。
      DS-06 是深圳 vs 对标城市，宇宙不同 → 不 reuse。
    status: 🟡
  - local_id: Q-MO-DS04-05
