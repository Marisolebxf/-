    metric_id: M_INNOV_CITY_BENCHMARK_GLOBAL
    page_ids: [DS-04-CITY]
    options:
      - id: A
        text: 计算维用招标三维（投入/产出/环境），另写三维公式
      - id: B
        text: 读面标签用招标三维，计算底物跟 186 四维（科技/产业/人才/政策）
      - id: C
        text: 两套并存、拆两条 ID
    default: B
    rationale: >
      A2 CITY-B03 已记三维≠四维为语义债、不另开 A；差集已 mapped 186。
      禁止发明三维 M_*，禁止改挂 M_SYNTH_VIT_DIM_SCORE / M_SYNTH_VIT_INDEX。
      全球城市读面不跑专题 SYNTH Job。
