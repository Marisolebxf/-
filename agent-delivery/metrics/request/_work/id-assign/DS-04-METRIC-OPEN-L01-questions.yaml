    page_ids: [DS-04-CITY]
    options:
      - id: A
        text: 本页全球封装独立 ID
      - id: B
        text: 与 DS-06 深圳重点人才指数同产品、复用同一 ID
      - id: C
        text: 挂 seq 184 / 改 mapped
    default: A
    rationale: >
      对象=全球城市语境下人才贡献/影响/活跃度封装读数；DS-06 是深圳重点人才质量/活跃/贡献。
      OPEN 禁止 mapped 184。内部默认独立 ID，类型建议 third_party（外采智库）。
