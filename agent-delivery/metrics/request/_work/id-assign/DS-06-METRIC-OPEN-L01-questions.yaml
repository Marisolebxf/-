items:
  - local_id: Q-MO-DS06-01
    title: 城际对比维：招标分项 vs 186 四维
    source_leaf: DS-06-METRIC-OPEN-L01
    metric_id: M_INNOV_CITY_COMPARE_SZ
    temp_ids: [TEMP_DS06_CITY_COMPARE]
    page_ids: [DS-06-CITY]
    open_ref: SZCITY-B03
    options:
      - id: A
        text: 计算维用招标分项（研发投入 / 专利数量 / 高新技术企业数量 / 创新人才），另写分项公式或拆四条 ID
      - id: B
        text: 读面标签用招标分项，计算底物跟 186 四维（科技/产业/人才/政策），一条 ID
      - id: C
        text: 复用 M_SYNTH_VIT_INDICATOR 或 M_INNOV_CITY_BENCHMARK_GLOBAL
    default: B
    rationale: >
      OPEN 已记招标分项 ≠ 186 四维为 SZCITY-B03，不另开 A、不发明分项 M_*。差集已 mapped 186。
      本页是深圳 vs 对标的 /display 读面，不跑专题 SYNTH Job。
      M_SYNTH_VIT_INDICATOR 口径=四维分项原始值与归一化得分（专题 Job）；M_INNOV_CITY_BENCHMARK_GLOBAL 宇宙=全球城市 → C 否。
    status: 🟡

  - local_id: Q-MO-DS06-02
    title: 深圳重点人才指数是否与智库 seq 184 / DS-04 全球人才创新指数同产品
    source_leaf: DS-06-METRIC-OPEN-L01
    metric_id: M_INNOV_CITY_TALENT_INDEX_SZ
    temp_ids: [TEMP_DS06_CITY_TALENT_INDEX]
    page_ids: [DS-06-CITY]
    open_ref: xlsx-行59
    options:
      - id: A
        text: 本页深圳封装独立 ID；类型建议 third_party
      - id: B
        text: 与 DS-04 M_INNOV_CITY_TALENT_INDEX_GLOBAL 同产品、复用同一 ID
      - id: C
        text: 挂 seq 184 / 改 mapped
    default: A
    rationale: >
      对象=深圳重点人才质量/活跃/贡献；DS-04 是全球城市语境下人才贡献/影响/活跃度。
      OPEN 禁止 mapped 184；差集 other_system 保持。DS-04 Q-MO-DS04-05 默认独立全球号、不 reuse DS-06。
      两侧独立 ID。OPEN 曾写 STAT；协议外采智库 → 建议 third_party（未签）。
    status: 🟡

  - local_id: Q-MO-DS06-03
    title: 深圳科技竞争力四子项是否拆 ID；能否套用湾区 SWOT
