    metric_id: M_INNOV_CITY_COMPETE_SZ
    temp_ids: [TEMP_DS06_CITY_COMPETE]
    page_ids: [DS-06-CITY]
    open_ref: xlsx-行60-63
    options:
      - id: A
        text: 一条 MIXED（优势领域 / 薄弱环节 / 发展潜力 / 发展水平共核）
      - id: B
        text: 拆四条 ID
      - id: C
        text: 复用 DS-05 M_INNOV_GBA_SWOT_* 四象限
    default: A
    rationale: >
      OPEN 只给一条 TEMP_DS06_CITY_COMPETE；xlsx 行60–63 为同叶四子项。
      湾区 SWOT 对象=11 城象限识别且库 missing，与深圳竞争力读面（mapped 186 优劣/潜力）不同口径 → C 否。
      MIXED 拆子项进本 Q，默认不拆。
    status: 🟡
