  - metric_id: M_SVC_CHAIN_SEGMENT_AVG_DEPTH
    metric_name_zh: "环节平均服务深度"
    definition: >
      2026-10-13 拍板：某服务链环节内各机构服务深度分的算术平均（0-100）。环节字典唯一真源 = CT-SVC-PT-01 六环节；禁止另造第七档。人口 org_id ∈ demo_gkxlumenx_dwd.svc_org_circle。语义=环节内平均服务强度，不是产业链节点覆盖比例。双缺口：① 无机构×服务链环节服务记录成员表（SVC-P0-3 / Q-SVCCHAIN-08）；② 机构服务深度分口径未签（Q-SVCCHAIN-02 / M_SVC_ORG_COVERAGE_DEPTH 系 MODEL，D1 draft）。本条不写 metric: 引用（避免继承 MODEL 叶把产业链 industry_link_code 当环节的错误轴，2026-10-13 人拍）。禁止用产业链 industry_link_code / node_stage、服务六类、国标 industry、15 集群、svc_chain_gap.avg_depth 冒充。
    formula: >
      目标口径：SELECT stage_id, AVG(depth) AS avg_depth
      FROM <机构×服务链环节服务记录 + 机构服务深度分>（缺口：无此表，待供方交付 SVC-P0-3）
      WHERE org_id IN (SELECT org_id FROM demo_gkxlumenx_dwd.svc_org_circle)
      GROUP BY stage_id;
      环节轴固定六码（CT-SVC-PT-01）；分子=机构在该环节的服务深度分（沿 M_SVC_ORG_COVERAGE_DEPTH，公式未签）；环节内无机构返回空（页面显示「—」，不伪造 0）。选产业是 API 过滤，不进口径。
      当前无法执行：① 机构×环节服务记录不存在；② 深度分口径未签。禁止把前端 fixture 或 svc_chain_gap.avg_depth 当已接通；禁止直接 AVG 产业链节点覆盖比例。
    algorithm_type: STAT
    source_tables: ["svc_org_circle", "（缺口）机构×服务链环节服务记录 <- ods: 待供方交付（SVC-P0-3）", "（缺口）机构服务深度分 <- metric: M_SVC_ORG_COVERAGE_DEPTH（未签；本条不写引用）"]
