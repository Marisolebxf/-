  - metric_id: M_SVC_ORG_NEW_COUNT
    metric_name_zh: "年度新增服务机构数"
    definition: >
      圈定池 svc_org_circle 内，按工商成立年计的年度新增家数。新增=YEAR(dwd_org_base_info.incorporation_date)。无成立日跳过。全库一条按年序列，不按领域切开。「首次开展服务」无源，不进本条。环比页面用相邻两年差，不入库。旧号 M_SVC_NEW_CNT 不再承担本序列。不用 svc_new_org_stat。Q-SVC-010 仍黄（入池规则 A）。
