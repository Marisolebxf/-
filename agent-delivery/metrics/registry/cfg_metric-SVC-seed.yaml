  - metric_id: M_SVC_CHAIN_SEGMENT_ORG_COUNT
    metric_name_zh: "环节服务机构数"
    definition: >
      2026-10-13 拍板：圈定池内落在指定服务链环节的服务机构去重家数。环节字典唯一真源 = CT-SVC-PT-01 六环节（stage-research 研发与科研合作 / stage-ip 知识产权与标准 / stage-transfer 技术转移与孵化 / stage-pilot 中试熟化 / stage-testing 检测认证 / stage-market 市场化服务）；禁止另造第七档。人口 org_id ∈ demo_gkxlumenx_dwd.svc_org_circle。语义=机构服务供给站位，不是企业产业链归属。缺口：无机构×环节服务记录成员表（SVC-P0-3 / Q-SVCCHAIN-08）。禁止用产业链 industry_link_code / node_stage、服务六类 FINANCE/IP/HR/MKT/CONSULT/INNOV、国标 industry、15 集群、svc_chain_gap.org_count_in_stage 冒充。Q-SVCCHAIN-08 仍黄。
    formula: >
      目标口径：SELECT stage_id, COUNT(DISTINCT org_id) AS org_count
      FROM <机构×服务链环节服务记录>（缺口：无此表，待供方交付 SVC-P0-3）
      WHERE org_id IN (SELECT org_id FROM demo_gkxlumenx_dwd.svc_org_circle)
      GROUP BY stage_id;
      环节轴固定六码（CT-SVC-PT-01）；同机构同环节多次服务只计 1；某环节 0 家返回 0（页面「暂无供给机构」不伪造）。选产业是 API 过滤，不进口径。
      当前无法执行：机构×环节服务记录在 ODS/DWD/ADS 均不存在。禁止把前端 fixture segment 或 svc_chain_gap 汇总壳当已接通。
    algorithm_type: STAT
