  - metric_id: M_SVC_ORG_COVERAGE_BREADTH
    metric_name_zh: "服务广度"
    definition: >
      2026-10-13 拍板：对齐企业 M_ENT_DOMAIN_COVERAGE_COUNT。单机构服务广度 = 圈定池机构落到的产业集群 cluster_id 去重数（15；industry_cluster：CL-SEI-01～10 + CL-FUT-01～05）。人口 org_id ∈ demo_gkxlumenx_dwd.svc_org_circle。上链 enterprise_industry_chain ← ods:dwd_org_industry_tags；chain_code 收 L0 后 JOIN industry_cluster_map；未映射不计；无上链行=0。语义=所属产业链覆盖的集群数，不是服务合同事实。禁止 hit_fields、国标 industry 单值、自建 svc_org_field_service。Q068 15 集群目录仍黄。
    formula: >
      SELECT c.org_id, COUNT(DISTINCT m.cluster_id) AS breadth
      FROM demo_gkxlumenx_dwd.svc_org_circle c
      LEFT JOIN demo_gkxlumenx_dwd.enterprise_industry_chain e ON e.org_id = c.org_id
      LEFT JOIN demo_gkxlumenx_dwd.industry_chain ic ON ic.chain_id = e.chain_code
      LEFT JOIN demo_gkxlumenx_dim.industry_cluster_map m
        ON m.industry_id = ic.industry_id AND m.is_active = 1 AND m.map_status = 'mapped'
      LEFT JOIN demo_gkxlumenx_dim.industry_cluster k
        ON k.cluster_id = m.cluster_id AND k.is_active = 1
      GROUP BY c.org_id;
      （与 M_ENT_DOMAIN_COVERAGE_COUNT 同构；人口加 circle。L0 行 industry_id=自身；L1 行 industry_id=L0。无匹配=0。禁止 COUNT hit_fields。）
    algorithm_type: STAT
    source_tables: ["svc_org_circle", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "产业链要素库"]
