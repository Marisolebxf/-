# cfg_metric 种子 —— 政策域（POLICY）M_POLICY_* 指标 8 件套
# ============================================================================
# 作用：把政策域（要素代号 POLICY / 废弃别名 E7）的全部 M_POLICY_* metric_id
#       升级为 cfg_metric 8 件套种子（D9 数据血缘铁律），供 algorithm-agent
#       实现 formula（🔧）、api-agent 上线时读取、ui-agent MetricSpecCard 展示。
# 输入真源：
#   - agent-delivery/data/政策相关-ODS到DWD字段映射分析报告(v2).md
#       （DWD 目标表 dwd.policy_base_info 37 字段；覆盖率 85.2%）
#   - ODS 真源（现行）：gkx.dwd_policy_base（国内）/ gkx.dwd_global_policy_base（国际）
#       对照 storage/POLICY/sources/inventory.md + ods-ddl.md。旧名 dwd_zck_policy /
#       dwd_zck_intl_policy 已废止，2026-08-31 由 DATA-POLICY-METRIC-REGISTRY-FIX-L01 全量纠偏。
#   - agent-delivery/bid-reference/科技专题服务算法库.md
#       （§1.1.1.1.1.1.1.1.3 政策基础指标模型；§1.1.1.1.1.1.1.8 政策深度分析模型）
#   - agent-delivery/acceptance-catalog/catalog-topic-policy.yaml（P-XX 功能点）
# 维护：data-agent  ·  创建：2026-06-23  ·  Wave 0（Mock 阶段）
# 2026-08-31 `DATA-POLICY-METRIC-REGISTRY-FIX-L01`（监管 human:淮政玮，授权直接编辑 registry）：
#   1) 12 处 source_tables 的废止 ODS 名 dwd_zck_policy → gkx.dwd_policy_base；
#   2) M_POLICY_RELATION_DEGREE 的 NebulaGraph gkx_policy → demo_gkx_chain（决策 #7 一张 G）；
#   3) M_POLICY_VALIDITY_RATE 摘除过期 formula_status: pending_algorithm
#      （公式已写全且 polan/basic/indicators.py 已实现），mapping_status 🔧 → ✅。
#   未改任何 definition 业务口径；QPOL-01/02/03 仍 🟡。
# 2026-08-31 `DATA-POLICY-D13-DS-MENU-L01`：补 D1–D3 三叶（TEXT_PARSE/MATCH/SIMULATE）；
#   4 条 DS-07/11 定向本管线覆盖（组合读面，不顶替 166–171）。D2/D3/D4 不改绿。
#
# element_alias_note: POLICY 为政策要素现行助记码（data-lineage-policy §3.2，
#   Q009 决策 2026-06-18 人类架构师/PM 会签）；E7 为废弃别名（旧引用不报错，
#   新指标一律用 POLICY）。本文件全部用 M_POLICY_*。
# ----------------------------------------------------------------------------
# 状态图例（mapping_status）：
#   ✅ 源可直接聚合且口径清晰
#   🔧 源有原料但 formula 待 algorithm-agent
#   ⚠️ 源可用但业务口径待甲方确认（definition pending_data_lead，引用 QPOL-01~03）
#   ❌ 无来源（no_source，需采购第三方数据）
# 8 件套（v1.5 共 9 项）：metric_id / metric_name_zh / definition / formula /
#         algorithm_type / source_tables / source_systems / update_freq / version
#         YAML 键 algorithm_type；未填视为 UNKNOWN，禁止据此标 D1=aligned
# 推荐字段：is_mock / bid_ref / acceptance_unit_id / owner_agent / mapping_status
#
# 待甲方决策项（登记到 客户决策清单跟踪表.md / DS-policy-availability-matrix）：
#   QPOL-01 政策一级指标定义（政策"类型"的一级分类口径：产业/人才/企业扶持… 的精确判定规则）
#   QPOL-02 推演参数（政策力度/效果/焦点/三维框架等评估模型的指标体系、权重、阈值）
#   QPOL-03 匹配规则（政策关联度 / 产业适配性 / 政策-主体匹配的相似度与判定规则）
# ============================================================================

version: 1
updated: "2026-08-24"
domain: POLICY
element_alias_note: "M_POLICY_* 政策要素，E7 为废弃别名（data-lineage-policy §3.2 / Q009）"
seed_version: "0.2.0"
batch: mock_20260623
total_metrics: 35
# METRIC-OPEN 核对（POLICY-METRIC-OPEN-L01 · 2026-08-05）：
#   - 19 条 8 件套字段齐全；状态分布未变（✅4 / 🔧12 / ⚠️3）
#   - 算法定义卡：metrics/registry/metric-spec-POLICY.yaml
#   - 缺口目录：agent-handoffs/产品整体定义/POLICY-data-gap-catalog.yaml
#   - 核对记录：agent-handoffs/产品整体定义/METRIC-OPEN-E7-DS10-12-核对记录.md
#   - POC formula 对照：agent-handoffs/政策模块-E7/ALGO-POLICY-fullset.md（不改 mapping_status）
#   - 消费模块：E7 专题 + DS10-12 展示（同一 M_POLICY_* 真源）
metric_open_ref: POLICY-METRIC-OPEN-L01
metric_spec_ref: metrics/registry/metric-spec-POLICY.yaml
data_gap_catalog_ref: agent-handoffs/产品整体定义/POLICY-data-gap-catalog.yaml

# 公共默认（每条已显式写出，此处仅备注）
defaults:
  source_systems: ["Mock @ batch=mock_20260623"]
  is_mock: true
  owner_agent: data-agent
  version: "0.1.0"

metrics:
  # ===== A · 政策基础指标（5 项，bid §1.1.1.1.1.1.1.1.3 / P-03~P-07）=====
  - metric_id: M_POLICY_LEVEL_DIST
    metric_name_zh: 政策级别分布
    definition: "按行政层级（国家级/省级/市级/区县级）对有效政策去重计数与占比；统计窗口为最新批次快照，对象范围 dwd.policy_base_info 全量未删除政策，按 policy_id 去重后 GROUP BY level。level 由 ODS policylevel 直接枚举映射（国家级→1/省级→2/市级→3/区县级→4），口径清晰。"
    formula: "COUNT(DISTINCT policy_id) GROUP BY dwd.policy_base_info.level"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_level_dist", "dwd.policy_base_info.level <- ods: gkx.dwd_policy_base.policylevel（国家级/省级/市级/区县级→1/2/3/4）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.1.1.1.1.1.3（1）政策级别指标"
    acceptance_unit_id: P-03
    owner_agent: data-agent

  - metric_id: M_POLICY_TYPE_DIST
    metric_name_zh: 政策类型分布
    definition: "pending_data_lead(QPOL-01)：按政策类型（产业政策/人才政策/企业扶持政策…）的去重计数与占比；'类型一级分类'的精确口径（取 topic_type 主题分类、还是 ma_contenttypenew 文件类型、还是 complextaginfojson 标签集解析）待甲方确认。临时默认取 ODS topic_type（主题分类）做一级归类，标签缺失时回退 ma_contenttypenew。"
    formula: "pending_algorithm（解析 topic_type/ma_contenttypenew/complextaginfojson 归一化类型后 COUNT(DISTINCT policy_id) GROUP BY type）"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_type_dist", "dwd.policy_base_info（type 派生）<- ods: gkx.dwd_policy_base.topic_type / ma_contenttypenew / complextaginfojson"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "⚠️"
    definition_status: pending_data_lead
    pending_ref: QPOL-01
    bid_ref: "§1.1.1.1.1.1.1.1.3（2）政策类型指标"
    acceptance_unit_id: P-04
    owner_agent: data-agent

  - metric_id: M_POLICY_TIMESERIES
    metric_name_zh: 政策时序指标
    definition: "按时间粒度（年/季/月）统计政策发布数量、环比/同比增长率与发布连续性；发布量为直接聚合（按 publish_date 归集去重），增长率与连续性指标（如断档月数、连续发布期）需算法二次计算。统计窗口逐期，对象范围 dwd.policy_base_info 全量未删除政策。"
    formula: "发布量=COUNT(DISTINCT policy_id) GROUP BY 期；增长率/连续性 pending_algorithm（环比 (本期-上期)/上期；连续性=连续非空期数/总期数）"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_timeseries", "dwd.policy_base_info.publish_date/publish_year <- ods: gkx.dwd_policy_base.pubtime/pubyear"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    formula_status: pending_algorithm
    bid_ref: "§1.1.1.1.1.1.1.1.3（3）政策时序指标"
    acceptance_unit_id: P-05
    owner_agent: data-agent

  - metric_id: M_POLICY_NATIONAL_DIST
    metric_name_zh: 全国政策分布
    definition: "按省级行政区对政策去重计数与占比，形成全国政策地图分布；统计窗口最新批次，对象范围 dwd.policy_base_info 全量未删除政策，按 region/area 解析归集到省级 region_code 后 GROUP BY 省。深圳/直辖市等按所属省级单位归集。"
    formula: "COUNT(DISTINCT policy_id) GROUP BY province(dwd.policy_base_info.region)"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_national_dist", "dwd.policy_base_info.region <- ods: gkx.dwd_policy_base.region/area", "dim: dim.region（省级映射）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.1.1.1.1.1.3（4）全国政策分布指标"
    acceptance_unit_id: P-06
    owner_agent: data-agent

  - metric_id: M_POLICY_SZ_DIST
    metric_name_zh: 深圳政策分布
    definition: "按深圳各行政区（福田/南山/宝安/龙岗等）对政策去重计数、占比与增长趋势；统计窗口最新批次/逐期，对象范围为 region 命中深圳的 dwd.policy_base_info 政策，按区县级 region 归集 GROUP BY 区。"
    formula: "COUNT(DISTINCT policy_id) WHERE region LIKE '%深圳%' GROUP BY district(dwd.policy_base_info.region)"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_sz_dist", "dwd.policy_base_info.region <- ods: gkx.dwd_policy_base.region（深圳各区）", "dim: dim.region（深圳区县映射）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.1.1.1.1.1.3（5）深圳政策分布指标"
    acceptance_unit_id: P-07
    owner_agent: data-agent

  # ===== B · 门户政策扶持指标（5 项，bid §1.1.1.1.1.1.1.1.3 + §8.2 / P-17~P-22,P-66）=====
  - metric_id: M_POLICY_TOTAL_COUNT
    metric_name_zh: 政策总数
    definition: "纳入政策要素库的政策去重总数；统计窗口最新批次快照，对象范围 dwd.policy_base_info 全量未删除政策，按 policy_id 去重计数。支持按层级/地区/时间多维筛选后的子集计数。"
    formula: "COUNT(DISTINCT dwd.policy_base_info.policy_id)"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_level_dist（含汇总行）", "dwd.policy_base_info <- ods: gkx.dwd_policy_base"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.1.1.1.1.1.3"
    acceptance_unit_id: P-17
    owner_agent: data-agent

  - metric_id: M_POLICY_INTENSITY_INDEX
    metric_name_zh: 政策力度指数
    definition: 在选定产业或技术领域范围内，按城市从效果、覆盖、成本三维综合评定的政策力度指数，取值0—100。
    formula: 三维分母不同：效果数占比（实施日非空、support_way非空，分母=该市有效政策）；覆盖数种类（支持对象去重+区县去重）；成本数占比（support_behavior非空/该市有效政策）。截面min-max后等权×100。
    algorithm_type: MODEL
    source_tables: ["dwd_policy_base(id, rank, city, district, status, expire_date, implementation_date, title, keywords, keypoints, theme, policy_support) — 去重, 国家级计入各市, 对比城市, 区内覆盖, 有效, 失效, 实施是否启动, 四字段命中, 扶持对象/行为/方式", "dwd_industry_chain_info(industry_code, industry_name, industry_link_code, industry_link_name) — 产业锚点定链（仅产业锚点）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: 1
    updated: "2026-08-27"
    algo_server_location: "repos/demo-algo-ent-analysis/polan/metrics/metrics.py（计算） + repos/demo-algo-ent-analysis/api/polan_metric_routes.py（服务接口）"
    calc_logic_ref: "metrics/calc-logic/POLICY/M_POLICY_INTENSITY_INDEX.md"
    is_mock: true
    mapping_status: "⚠️"
    pending_ref: QPOL-02
    bid_ref: "§1.1.1.1.1.1.1.8.2 政策力度评估模型"
    acceptance_unit_id: P-20
    owner_agent: data-agent

  - metric_id: M_POLICY_INDUSTRY_COVERAGE
    metric_name_zh: 政策产业覆盖度
    definition: "政策对产业链节点的覆盖比例（已覆盖节点数 / 产业链全节点数）；源侧政策关键词/要素可得，产业链全集来自跨域产业链维表，需算法做政策→产业节点的映射与覆盖率计算。"
    formula: "pending_algorithm（DISTINCT 覆盖产业节点数 / 产业链全节点数 * 100）"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_intensity", "dwd.policy_base_info.keywords/elements <- ods: gkx.dwd_policy_base.keywords/maelements", "dwd.industry_chain（跨域产业链维表）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    formula_status: pending_algorithm
    bid_ref: "§1.1.1.1.1.1.1.1.3"
    acceptance_unit_id: P-19
    owner_agent: data-agent

  - metric_id: M_POLICY_VALIDITY_RATE
    metric_name_zh: 政策时效
    definition: "有效政策占比（有效政策数 / 政策总数）；status（docstatus 20-已发布→有效 / 30-已撤销→失效）直接可得，结合 expire_date（ODS expiration_date）判定是否过期，需算法做'有效 = 已发布 且 未过期'的口径计算。expiration_date 在 ODS 存在但历史映射报告标待确认，按现 DDL 采用。"
    formula: "COUNT(status=1 AND (expire_date IS NULL OR expire_date>=today)) / COUNT(*) * 100"
    algorithm_type: STAT
    source_tables: ["ads: ads.policy_level_dist", "dwd.policy_base_info.status/expire_date <- ods: gkx.dwd_policy_base.docstatus(20/30)/expiration_date"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.1.1.1.1.1.3"
    acceptance_unit_id: P-17
    owner_agent: data-agent

  - metric_id: M_POLICY_RELATION_DEGREE
    metric_name_zh: 政策关联度
    definition: "pending_data_lead(QPOL-03)：单条政策与其他政策/产业/技术/企业等实体的关联强度（图谱节点的加权度中心性）；源侧政策谱系 pedigree（上/下位政策）可得，跨实体关联依赖政策实体关系图谱，关联类型与权重'匹配规则'待甲方确认。临时默认按 pedigree 引用条数 + 标签共现做无权度数。"
    formula: "pending_algorithm（NebulaGraph demo_gkx_chain 加权度中心性：support/apply_to/regulate/cite edge 数加权，权重待 QPOL-03）"
    algorithm_type: GRAPH
    source_tables: ["ads: ads.policy_focus", "dwd.policy_base_info.pedigree <- ods: gkx.dwd_policy_base.pedigree", "NebulaGraph demo_gkx_chain（政策投影一张 G）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    definition_status: pending_data_lead
    pending_ref: QPOL-03
    bid_ref: "§1.1.1.1.1.1.1.2.6 政策实体关系抽取"
    acceptance_unit_id: P-66
    owner_agent: data-agent

  # ===== C · 政策深度模型产出指标（6 项，bid §1.1.1.1.1.1.1.8.1~.8.6 / P-11~P-16）=====
  - metric_id: M_POLICY_FOCUS_INDEX
    metric_name_zh: 政策焦点指数
    definition: 指通过量化分析政策文本在制定背景、政策目标、适用范围、措施执行情况四个维度的内容特征，综合衡量政策文本完整性和执行有效性的指标。
    formula: 政策焦点指数从制定背景、政策目标、适用范围、措施执行情况四个维度分别计算得分后加权平均汇总得出。
    algorithm_type: MODEL
    source_tables: ["dwd_policy_base(id, content, abstract, theme, keypoints, policy_support, province, city, title, keywords, status, expire_date) — 去重, 正文词频, 摘要背景, 主题背景, 要点与目标, 对象与措施, 省范围, 市范围, 四字段命中, 有效, 失效", "dwd_industry_chain_info(industry_code, industry_name, industry_link_code, industry_link_name) — 产业锚点定链（仅产业锚点）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: 1
    updated: "2026-08-27"
    algo_server_location: "repos/demo-algo-ent-analysis/polan/metrics/metrics.py（计算） + repos/demo-algo-ent-analysis/api/polan_metric_routes.py（服务接口）"
    calc_logic_ref: "metrics/calc-logic/POLICY/M_POLICY_FOCUS_INDEX.md"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QPOL-02
    bid_ref: "§1.1.1.1.1.1.1.8.1 政策焦点识别模型"
    acceptance_unit_id: P-11
    owner_agent: data-agent

  - metric_id: M_POLICY_INTENSITY_SCORE
    metric_name_zh: 政策力度评分
    definition: 在选定产业或技术领域范围内，对单条有效政策从效果、覆盖、成本三维综合评定的政策力度评分，取值0—100。
    formula: 三维分母不同：效果数0/1平均（实施日非空、support_way非空）；覆盖数种类（该条支持对象去重+区县是否已填）；成本数0/1（support_behavior非空）。同对象同统计年截面min-max后等权×100。
    algorithm_type: MODEL
    source_tables: ["dwd_policy_base(id, implementation_date, district, status, expire_date, publish_year, title, keywords, keypoints, theme, policy_support) — 去重, 效果维实施日, 覆盖维区县, 有效, 失效, 同年截面, 四字段命中, 对象/行为/方式", "dwd_industry_chain_info(industry_code, industry_name, industry_link_code, industry_link_name) — 产业锚点定链（仅产业锚点）"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: 1
    updated: "2026-08-27"
    algo_server_location: "repos/demo-algo-ent-analysis/polan/metrics/metrics.py（计算） + repos/demo-algo-ent-analysis/api/polan_metric_routes.py（服务接口）"
    calc_logic_ref: "metrics/calc-logic/POLICY/M_POLICY_INTENSITY_SCORE.md"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QPOL-02
    bid_ref: "§1.1.1.1.1.1.1.8.2 政策力度评估模型"
    acceptance_unit_id: P-12
    owner_agent: data-agent

