  # ===== P3 · 企业能力评估对比分析（§1.1.1.2.4.2.3.3 + .3.4 / E-23 + E-24）=====
  - metric_id: M_ENT_TECH_POWER_SCORE
    metric_name_zh: 技术力得分
    definition: "企业技术力评估的综合得分，满分0-100分，综合反映企业在技术人才、技术创新、技术转化、技术合作、技术投入五个维度的综合水平。采用加权平均。"
    formula: "五维加权平均：技术人才(development_employee/employees_number) + 技术创新(有效发明专利数/专利占比/新增申请) + 技术转化(新产品销售收入占比/技术合同成交额) + 技术合作(产学研项目数/外部专家) + 技术投入(研发经费强度/人均研发经费)"
    source_tables: ["gkx.dwd_org_annual_financial_info(研发人员/营收/研发经费)", "gkx.dwd_org_rd_achiev_info(专利授权预聚合)", "gkx.dwd_patent+dwd_patent_legal(新增申请)", "gkx.dwd_zh_project+dwd_en_project(产学研合作)"]
    source_systems: ["gkxlumenx_ods.dwd_org_annual_financial_info(5352行,dev_employee/employees全None), dwd_patent(0行), dwd_patent_legal(0行); gkxlumenx_ads.tech_power(120行)"]
    update_freq: yearly_model_release
    version: "0.2.0"
    is_mock: false
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3.3"
    acceptance_unit_id: E-23
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_TECH_POWER_SCORE.md"
    db_verified: "2026-08-18 dwd_org_annual_financial_info=5352行(dev_employee/employees全None); dwd_patent/dwd_patent_legal=0行; gkxlumenx_ads.tech_power=120行"
  - metric_id: M_ENT_BUSINESS_POWER_SCORE
    metric_name_zh: 商业力得分
    definition: "企业商业力评估的综合得分，满分0-100分，综合反映企业在市场、产品、品牌、技术合作、产业链覆盖率、产业关键环节参与度六个维度的综合水平。采用主成分分析法。"
    formula: "六维主成分分析：市场(营收/市占率/盈利) + 产品(产品线覆盖/新产品收入/质量) + 品牌(声量/行业声誉) + 技术合作(产学研项目/外部专家) + 产业链覆盖率 + 关键环节参与度"
    source_tables: ["gkx.dwd_org_annual_financial_info(营收/利润)", "gkx.dwd_org_industry_chain_dtl(链节点)", "gkx.dwd_org_important_news_info(品牌声量)", "gkx.dwd_org_tech_tag(行业声誉)", "gkx.dwd_org_industry_chain_pat_dtl(技术合作)"]
    source_systems: ["gkxlumenx_ods: dwd_org_annual_financial_info=5352行(operating_revenue有数据); dwd_org_tech_tag缺失; dwd_org_industry_chain_dtl缺失; gkxlumenx_ads.biz_power=120行"]
    update_freq: yearly_model_release
    version: "0.2.0"
    is_mock: false
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3.3"
    acceptance_unit_id: E-23
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_BUSINESS_POWER_SCORE.md"
    db_verified: "2026-08-18 dwd_org_annual_financial_info=5352行; dwd_org_tech_tag缺失; dwd_org_industry_chain_dtl缺失; gkxlumenx_ads.biz_power=120行"
  - metric_id: M_ENT_TECH_RANK
    metric_name_zh: 技术力排名
    definition: "企业按技术力综合评分降序排名；依赖 M_ENT_TECH_POWER_SCORE，排名范围由筛选条件决定。"
    formula: "pending_algorithm（RANK() OVER ORDER BY tech_score DESC）"
    source_tables: ["派生自 M_ENT_TECH_POWER_SCORE（dwd.enterprise.tech_score）"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    formula_status: pending_algorithm
