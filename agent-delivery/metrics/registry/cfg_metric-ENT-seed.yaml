# cfg_metric 种子 —— 企业域（ENT）M_ENT_* 指标 8 件套
# ============================================================================
# 作用：把 ux 设计期 ENT-wireframe.md 文末汇总的全部 M_ENT_* metric_id
#       升级为 cfg_metric 8 件套种子（D9 数据血缘铁律），供 algorithm-agent
#       实现 formula（🔧）、api-agent 上线时读取。
# 输入真源：demo-ui-topic/docs/ia/enterprise/ENT-wireframe.md（来源列已写真实 DWD/ODS 表）
#           agent-delivery/data/企业相关-ODS到DWD字段映射分析报告(v2).md §3/§5
# 维护：data-agent  ·  创建：2026-06-18  ·  Wave 0（Mock 阶段）
#
# naming_pending_architect: Q009（ENT vs E1）——
#   data-lineage-policy §3.2 企业要素正式代号为 E1（即 M_E1_*），派单与 wireframe
#   统一用 M_ENT_*。本文件按 M_ENT_* 落种子，登记为开放项 K-O1，待 architect
#   拍板后由 data-agent 批量改名，**不在本次擅自改成 E1**。
# ----------------------------------------------------------------------------
# 状态图例（mapping_status）：
#   ✅ 源可直接聚合且口径清晰
#   🔧 源有原料但 formula 待 algorithm-agent
#   ⚠️ 源可用但业务口径待甲方确认（definition pending_data_lead，引用 Q010~Q016/Q019 等；Q017/Q018 已于 2026-08-11 按临时默认闭合）
#   ❌ 无来源（no_source，需采购第三方数据）
# 8 件套（v1.5 共 9 项）：metric_id / metric_name_zh / definition / formula /
#         algorithm_type / source_tables / source_systems / update_freq / version
#         YAML 键 algorithm_type；未填视为 UNKNOWN，禁止据此标 D1=aligned
# 推荐字段：is_mock / bid_ref / acceptance_unit_id / owner_agent / mapping_status
# ============================================================================

version: 1
updated: "2026-06-18"
domain: ENT
element_alias_note: "M_ENT_* 暂代企业要素 E1，待 Q009/K-O1 由 architect 统一"
seed_version: "0.1.0"
batch: mock_20260618
total_metrics: 60

# 公共默认（每条已显式写出，此处仅备注）
defaults:
  source_systems: ["Mock @ batch=mock_20260618"]
  is_mock: true
  owner_agent: data-agent
  version: "0.1.0"

metrics:
  # ===== P0 · 企业分析概述（§1.1.1.2.4.2.3 / E-20）=====
  - metric_id: M_ENT_TOTAL_COUNT
    metric_name_zh: 企业总数
    definition: "在选定的未来产业范围内，按企业统一社会信用代码去重的企业数量。"
    formula: "COUNT(DISTINCT credit_code WHERE 属于目标未来产业)；从 dwd_org_industry_tags 按 industry_name 正则匹配归类。"
    source_tables: ["gkx.dwd_org_industry_tags（credit_code, industry_code, industry_name）", "gkx.dwd_org_base_info"]
    source_systems: ["gkxlumenx_ods（真实 ODS，20000 行）"]
    update_freq: daily
    version: "0.2.0"
    is_mock: false
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_TOTAL_COUNT.md"
    db_verified: "2026-08-18 gkxlumenx_ods.dwd_org_industry_tags rows=20000, distinct credit_code=20000"
  - metric_id: M_ENT_INNOVATIVE_COUNT
    metric_name_zh: 创新型企业数
    definition: "pending_data_lead(Q011)：创新型企业口径（=高企∪专精特新∪瞪羚∪独角兽？）待甲方确认；临时默认取四类资质标签并集去重计数。"
    formula: "pending_algorithm（is_high_tech/is_little_giant/is_gazelle/is_unicorn 标签解析后取并集计数）"
    source_tables: ["dwd.enterprise.is_high_tech/is_little_giant/is_gazelle/is_unicorn <- ods: dwd_org_tag_info.org_tag, dwd_company_honor_tags.national_tag"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "⚠️"
    definition_status: pending_data_lead
    pending_ref: Q011
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent

  - metric_id: M_ENT_NEW_COUNT_Y
    metric_name_zh: 历年新增企业数
    definition: "按注册年份分组的新登记企业数。从dwd_org_base_info取incorporation_date，按YEAR分组COUNT(DISTINCT org_id)。"
    formula: "COUNT(DISTINCT org_id) GROUP BY YEAR(incorporation_date)，并计算累计 cumulative_count"
    source_tables: ["gkx.dwd_org_base_info(org_id, incorporation_date)"]
    source_systems: ["gkxlumenx_ods.dwd_org_base_info（20000行, incorporation_date非空=19980）"]
    update_freq: daily
    version: "0.2.0"
    is_mock: false
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_NEW_COUNT_Y.md"
    db_verified: "2026-08-18 gkxlumenx_ods.dwd_org_base_info rows=20000, incorporation_date non-null=19980"
  - metric_id: M_ENT_AVG_RD_INVESTMENT
    metric_name_zh: 平均研发投入
    definition: "企业平均研发投入额（单位：亿元）；统计窗口最新批次，对象范围为 rd_investment 非空企业，取算术平均。"
    formula: "AVG(dwd.enterprise.rd_investment)"
    source_tables: ["dwd.enterprise.rd_investment <- ods: dwd_org_annual_financial_info"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent

  - metric_id: M_ENT_PATENT_TOTAL
    metric_name_zh: 专利总量
    definition: "全部企业专利授权数之和；对象范围 dwd.enterprise 全量，patent_grant_count 为 ODS 预聚合值，按企业求和。"
    formula: "SUM(dwd.enterprise.patent_grant_count)"
    source_tables: ["dwd.enterprise.patent_grant_count <- ods: dwd_org_rd_achiev_info (inv_pat_auth_num+util_pat_auth_num+des_pat_auth_num)"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent

  - metric_id: M_ENT_HIGH_TECH_COUNT
    metric_name_zh: 高企数量
    definition: "pending_data_lead(Q010)：高新技术企业判定规则待甲方确认；临时默认按资质/荣誉标签解析 is_high_tech=1 计数。"
    formula: "pending_algorithm（解析 dwd_company_honor_tags/dwd_org_tag_info 高新技术企业标签后 COUNT）"
    source_tables: ["dwd.enterprise.is_high_tech <- ods: dwd_org_tag_info.org_tag, dwd_company_honor_tags.national_tag"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "⚠️"
    definition_status: pending_data_lead
    pending_ref: Q010
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent

  # ===== P1 · 重点企业类型分析（§1.1.1.2.4.2.3.1 / E-21）=====
  - metric_id: M_ENT_TYPE_MATCH_COUNT
    metric_name_zh: 匹配企业总数
    definition: "按所选产业 + 企业类型筛选后命中的企业去重总数；统计窗口最新批次，筛选条件由前端传入。"
    formula: "COUNT(DISTINCT enterprise_id) WHERE 产业 IN(:industry) AND 类型 IN(:type)"
    source_tables: ["dwd.enterprise <- ods: dwd_org_reg_info", "dwd.enterprise_industry <- ods: dwd_org_industry_chain_dtl"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3.1"
    acceptance_unit_id: E-21
    owner_agent: data-agent

  - metric_id: M_ENT_TYPE_COUNT
    metric_name_zh: 各类型企业数
    definition: "按企业类型（外资/高新/小微/上市/专精特新/小巨人）分组的企业计数。外企：org_type LIKE %外商%；上市：dwd_org_stock_base 去重；小微：scale_tag in(小型,微型)；高新/专精特新/小巨人：dwd_org_tech_tag.org_tag 筛选。"
    formula: "外企=COUNT(org_type LIKE %外商%)；上市=COUNT(DISTINCT dwd_org_stock_base)；高新/专精特新/小巨人=COUNT(DISTINCT org_id) FROM dwd_org_tech_tag WHERE org_tag 含对应标签"
    source_tables: ["gkx.dwd_org_tech_tag（org_id, org_tag）", "gkx.dwd_org_base_info（org_type）", "gkx.dwd_org_stock_base"]
    source_systems: ["gkxlumenx_dwd.enterprise_tag(170行); dwd_org_tech_tag真实库缺失; dwd_org_base_info=20000行(org_type LIKE %外商%=61)"]
    update_freq: monthly_yearly
    version: "0.2.0"
    is_mock: false
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_TYPE_COUNT.md"
    db_verified: "2026-08-18 dwd_org_tech_tag缺失; gkxlumenx_dwd.enterprise_tag=170行; dwd_org_base_info org_type含外商=61"
  - metric_id: M_ENT_TYPE_RATIO
    metric_name_zh: 类型占比
    definition: "各企业类型数量占匹配企业总数的百分比；依赖 M_ENT_TYPE_COUNT 与 M_ENT_TYPE_MATCH_COUNT，类型口径同 Q010。"
    formula: "M_ENT_TYPE_COUNT / M_ENT_TYPE_MATCH_COUNT * 100"
    source_tables: ["派生自 M_ENT_TYPE_COUNT, M_ENT_TYPE_MATCH_COUNT"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3.1"
    acceptance_unit_id: E-21
    owner_agent: data-agent

  - metric_id: M_ENT_REGIONAL_COUNT
    metric_name_zh: 区域企业数量
    definition: "pending_data_lead(Q012)：行政区划下钻精度（到市/到区县）待甲方确认，临时默认到市级；按 headquarters_city + 经纬度归集去重计数。"
    formula: "COUNT(DISTINCT enterprise_id) GROUP BY dwd.enterprise.headquarters_city"
    source_tables: ["dwd.enterprise.headquarters_city/经纬度 <- ods: dwd_org_reg_info, dwd_company_location_tags"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "⚠️"
    definition_status: pending_data_lead
    pending_ref: Q012
    bid_ref: "§1.1.1.2.4.2.3.1"
    acceptance_unit_id: E-21
    owner_agent: data-agent

  - metric_id: M_ENT_REGIONAL_DENSITY
    metric_name_zh: 区域企业密度
    definition: "pending_data_lead(Q012)：单位区域面积或单位 GDP 的企业数；区划精度待甲方确认。formula 待算法实现。"
    formula: "pending_algorithm（区域企业数 / 区域面积 或 / 单位GDP）"
    source_tables: ["dwd.enterprise.headquarters_city <- ods: dwd_org_reg_info", "区域面积/GDP 维表（待补）"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    definition_status: pending_data_lead
    pending_ref: Q012
    bid_ref: "§1.1.1.2.4.2.3.1"
    acceptance_unit_id: E-21
    owner_agent: data-agent

  - metric_id: M_ENT_AGGLOMERATION_INDEX
    metric_name_zh: 集聚指数
    definition: "衡量企业在区域内空间集聚程度（区位熵/基尼系数）；formula 待 algorithm-agent，区划精度依赖 Q012。"
    formula: "pending_algorithm（区位熵 LQ 或 基尼系数）"
    source_tables: ["dwd.enterprise.headquarters_city <- ods: dwd_org_reg_info", "dwd.enterprise_industry <- ods: dwd_org_industry_chain_dtl"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    formula_status: pending_algorithm
    pending_ref: Q012
    bid_ref: "§1.1.1.2.4.2.3.1"
    acceptance_unit_id: E-21
    owner_agent: data-agent

  # ===== P2 · 重点企业领域分布分析（§1.1.1.2.4.2.3.2 / E-22）=====
  - metric_id: M_ENT_DOMAIN_COVERAGE_COUNT
    metric_name_zh: 覆盖领域数
    definition: "企业涉及的产业领域去重数；对象范围 dwd.enterprise_industry，按 industry_chain/领域字段 DISTINCT 计数。"
    formula: "COUNT(DISTINCT dwd.enterprise_industry.industry_chain)"
    source_tables: ["dwd.enterprise_industry <- ods: dwd_org_industry_chain_dtl, dwd_industry_chain_info, dwd_company_industry_tags"]
    source_systems: ["Mock @ batch=mock_20260618"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3.2"
    acceptance_unit_id: E-22
    owner_agent: data-agent

  - metric_id: M_ENT_DOMAIN_COVERAGE_BREADTH
    metric_name_zh: 覆盖广度
    definition: "pending_data_lead(Q013)：覆盖广度=覆盖领域数/产业领域全集，领域全集与权重口径待算法 lead + 甲方确认。"
    formula: "pending_algorithm（覆盖领域数 / 产业领域全集）"
    source_tables: ["dwd.enterprise_industry <- ods: dwd_org_industry_chain_dtl", "产业领域全集维表 <- ods: dwd_industry_chain_info"]
