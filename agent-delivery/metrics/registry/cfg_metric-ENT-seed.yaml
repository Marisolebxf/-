  - metric_id: M_ENT_DOMAIN_COVERAGE_BREADTH
    metric_name_zh: 覆盖广度
    definition: "国内覆盖领域数 / 激活产业集群数（15 全开）。派生自 COUNT，不加权。国外无法计算。Q068 未甲方确认。"
