    pending_ref: Q013
    bid_ref: "§1.1.1.2.4.2.3.2"
    acceptance_unit_id: E-22
    owner_agent: data-agent

  - metric_id: M_ENT_DIVERSIFICATION_INDEX
    metric_name_zh: 多元化指数
    definition: "pending_data_lead(Q013)：企业领域分布的多元化程度（领域分布熵）；权重与口径待确认，formula 待算法实现。"
    formula: "pending_algorithm（领域分布熵 Shannon entropy）"
    source_tables: ["dwd.enterprise_industry <- ods: dwd_org_industry_chain_dtl, dwd_industry_chain_info"]
    source_systems: ["Mock @ batch=mock_20260618"]
