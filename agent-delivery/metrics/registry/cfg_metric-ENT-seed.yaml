    definition: "按注册年份分组的新登记企业数（国内∪国外）。计算键 org_id；年份取 registration_date。港澳台不计入国外。不按产业过滤。"
    formula: "COUNT(DISTINCT org_id) FROM (enterprise_base UNION enterprise_forg_base) GROUP BY YEAR(registration_date)，并计算累计 cumulative_count"
