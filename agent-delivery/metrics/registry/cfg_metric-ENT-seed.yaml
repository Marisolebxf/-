  - metric_id: M_ENT_INNOVATIVE_COUNT
    metric_name_zh: 创新型企业数
    definition: "国内企业四类资质并集去重：专精特新∪小巨人∪制造业单项冠军∪创新型中小企业。判定=enterprise_tag.tag_code ∈ {little_giant, little_giant_pro, manufacturing_champion, innovative_sme}。源中文 org_tag 由项目映射到码（含曾获/过期），属洗数。不含高企/瞪羚/独角兽。只国内；国外无对等标签表，不造表。选产业是 API。算法 2026-09 默认，Q011 仍 🟡。"
    formula: "COUNT(DISTINCT org_id) FROM enterprise_tag JOIN enterprise_base WHERE tag_code IN ('little_giant','little_giant_pro','manufacturing_champion','innovative_sme')。中文 org_tag 映射到四码（曾获算）不算无法执行。选产业经 enterprise_industry_chain 半连接，未选不按产业滤。禁止 tag_name 模糊含。禁止 high_tech/gazelle/unicorn。禁止 sme_tech 冒充创新型中小企业。目标建议 ads.ent_innovative_count，当前无此表。"
    algorithm_type: STAT
    source_tables: ["enterprise_tag <- ods: dwd_org_tech_tag", "enterprise_base <- ods: dwd_org_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.1"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 L01 handoff 会签记录）"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: Q011
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_INNOVATIVE_COUNT.md"

  - metric_id: M_ENT_NEW_COUNT_Y
