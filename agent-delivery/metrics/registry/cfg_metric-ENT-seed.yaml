  - metric_id: M_ENT_REGIONAL_COUNT
    metric_name_zh: 区域企业数量
    definition: "国内按 region_id 省2/市4/县6 三级都出（各粒度一行）。国外按 country_code 国家合并进同一条，不按国外城市拆、不写入 region_id。产业不是分组维。选产业是 API 过滤，不改分组键。"
    formula: "国内 COUNT(DISTINCT org_id) FROM enterprise_base 分别 GROUP BY LEFT(region_id,2)、LEFT(region_id,4)、region_id 三套都写。国外 COUNT(DISTINCT org_id) FROM enterprise_forg_base GROUP BY country_code。禁止国外 city_code 进本条。"
    algorithm_type: STAT
    source_tables: ["enterprise_base.region_id <- ods: dwd_org_base_info", "enterprise_forg_base.country_code <- ods: dwd_forg_base_info"]
    source_systems: ["国内机构要素库", "国外机构要素库"]
