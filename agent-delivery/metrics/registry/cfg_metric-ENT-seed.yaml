  - metric_id: M_ENT_DOMAIN_COVERAGE_DEPTH
    metric_name_zh: 领域覆盖深度
    definition: 企业在目标产业链图谱中所覆盖节点的最大层级深度，归一化至0-1。
    formula: 企业集合命中的节点j在产业链图谱中的层级/该产业链（industrycode）下所有节点的最大层级
