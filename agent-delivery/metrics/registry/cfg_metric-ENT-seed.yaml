    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_REGIONAL_DENSITY.md"

  - metric_id: M_ENT_AGGLOMERATION_INDEX
    metric_name_zh: "集聚指数"
    definition: "在选定产业范围内度量企业在全国—省—市逐级区域的空间集聚程度，取值0—100，综合反映专业化集聚、均衡度与集中度。"
    formula: "三维(区位熵/空间基尼系数/HHI)极值归一后等权加权。"
    algorithm_type: MODEL
    source_tables: ["dwd_org_base_info(org_id, external_id, city, province, area, industry, industry_l1_code, industry_l2_code, industry_l3_code, registered_capital_value, reg_status) — 企业区域+行业+注册资本,存续", "dwd_org_industry_tags(credit_code, industry_code, industry_name) — 企业与产业链归类", "dwd_dim_admin_area(cur_code, cur_name, parent_code, city_code, area_code, cur_level) — 行政区划层级（区划精度对齐 Q012）"]
