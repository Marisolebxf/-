  - metric_id: M_ENT_REGIONAL_DENSITY
    metric_name_zh: 区域企业密度
    definition: "二次 STAT。国内省/市/县企业数 / code_region.area（家/km²，单位待核）。分子 <- metric: M_ENT_REGIONAL_COUNT 国内三级。与 CITY_DENSITY 同一套分母。GDP 不进。全国行不算。国外不算。area 空或≤0 该区空（不写 0）。Q012 仍 🟡。算法 2026-09 默认。维表有 area，不是缺表。缺口：area 灌数空则该区空；region_id 缺列在 COUNT 叶；无独立目标表。"
    formula: "国内省/市/县企业数 / code_region.area。分子 <- enterprise_region_summary <- metric: M_ENT_REGIONAL_COUNT（LEFT(region_id,2)/4/6 三套）。分母 JOIN dim.code_region.area。area 空或≤0 该区空（不当 0）。全国行不算。国外国家行不算。禁止 GDP；禁止重扫主档当分子；禁止 headquarters_city。缺口：维表 gkxlumenx_dim.code_region 有 area 列，不是缺表；现网若仍全空是灌数缺口；COUNT 主档无 region_id；目标建议 ads.ent_regional_density，当前无此表。"
    algorithm_type: STAT
    source_tables:
      - "enterprise_region_summary <- metric: M_ENT_REGIONAL_COUNT"
      - "code_region.area"
    source_systems: ["国内机构要素库"]
    update_freq: daily
    version: "0.3.1"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 L01 handoff 会签记录）"
    is_mock: true
    mapping_status: "🔧"
