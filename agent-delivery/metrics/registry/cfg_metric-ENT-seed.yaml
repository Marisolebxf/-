    acceptance_unit_id: E-21
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_REGIONAL_COUNT.md"

  - metric_id: M_ENT_REGIONAL_DENSITY
    metric_name_zh: 区域企业密度
    definition: "pending_data_lead(Q012)：国内按与 REGIONAL_COUNT 相同区划键，企业去重数 / code_region.area（家/km²，单位待核）。默认市。国外无法计算。GDP 本波不进公式。"
    formula: "COUNT(DISTINCT org_id) FROM enterprise_base GROUP BY LEFT(region_id, :level) / code_region.area 默认 level=4；area 空或≤0 该区无法计算；国外无法计算"
    algorithm_type: STAT
    source_tables: ["enterprise_base.region_id <- ods: dwd_org_base_info"]
    source_systems: ["国内机构要素库"]
    update_freq: daily
    version: "0.3.0"
    is_mock: true
    mapping_status: "⚠️"
    definition_status: pending_data_lead
    pending_ref: Q012
