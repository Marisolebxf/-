  - metric_id: M_ENT_AVG_RD_INVESTMENT
    metric_name_zh: 平均研发投入
    definition: "选定产业内全部法人、最近一个完整自然年 R&D 经费内部支出的算术平均。成员并集按 org_id 去重后再 AVG。只国内；国外无上链不并。禁止上市财务。未选产业不计算。"
    formula: "AVG(rd_investment) FROM ads.ent_rd_latest WHERE org_id IN (SELECT DISTINCT org_id FROM enterprise_industry_chain WHERE 产业键∈:selected)。快照=enterprise_finance_history 每企最近完整年 rd（空/占位0不进）。多选=成员并集去重后一次 AVG。① DWD财务列+上链表在即可写。② ODS→DWD灌数另写，不进无法执行。禁止无过滤JOIN上链表；禁止各产业sum/n加总冒充去重。快照表当前无此表。禁止上市财务"
    algorithm_type: STAT
    source_tables: ["enterprise_finance_history <- ods: dwd_org_annual_financial_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.1"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 L01 handoff 会签记录）"
    is_mock: true
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_AVG_RD_INVESTMENT.md"

  - metric_id: M_ENT_PATENT_TOTAL
