    formula: "COUNT(DISTINCT org_id) FROM (enterprise_base UNION enterprise_forg_base)；选产业时国内经 enterprise_industry_chain 按 chain_code/chain_name 过滤，国外无上链表暂不纳入"
    algorithm_type: STAT
    source_tables: ["enterprise_base <- ods: dwd_org_base_info", "enterprise_forg_base <- ods: dwd_forg_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
