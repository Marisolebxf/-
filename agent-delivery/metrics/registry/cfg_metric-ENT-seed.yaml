  - metric_id: M_ENT_KEYPANO_DOMAIN_SUMMARY
    metric_name_zh: 领域摘要
    definition: "从目标产业链当前链位（上游/中游/下游）的重点企业论文、专利中抽取关键词，将关键词映射到产业链细分领域，计算映射覆盖率并生成证据摘要。映射覆盖率 = 已映射关键词数 / 该链位关键词总数 * 100%。覆盖率>=60%判定为\"证据充分\"，否则为\"证据不足\"。"
    formula: "1.链位归集：dwd_org_industry_tags关联dwd_industry_chain_info按level（上游/中游/下游）分组企业；2.关键词抽取：从该链位重点企业论文标题/摘要、专利名称/摘要中抽取技术关键词；3.领域映射：关键词与产业链细分领域匹配，统计命中率；4.覆盖率=命中关键词数/该链位关键词总数*100%；5.汇总论文关键词、专利关键词及关联重点企业形成证据摘要。"
    algorithm_type: MODEL
    source_tables: ["gkx.dwd_org_industry_tags(credit_code, industry_code, industry_link_code) — 企业与产业链节点关联（链位归集）", "gkx.dwd_industry_chain_info(industry_code, industry_link_code, level) — 产业链节点层级（上/中/下游分组）", "gkx.dwd_org_base_info(org_id, name_cn, external_id) — 企业基础信息（关联重点企业名称）", "gkx.dwd_patent_base(patent_id, org_id, patent_name, abstract) — 企业专利关键词抽取来源", "gkx.dwd_paper_base(paper_id, org_id, title, abstract) — 企业论文关键词抽取来源"]
