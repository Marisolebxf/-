  - metric_id: M_ENT_DOMAIN_COVERAGE_COUNT
    metric_name_zh: 覆盖领域数
    definition: "国内企业集合覆盖的产业集群 cluster_id 去重（深圳 10+5 共 15；非国标、非 chain_code）。企业经产业链 L0 industry_id 落 industry_cluster_map。国外无法计算。Q068 未甲方确认。"
    formula: "COUNT(DISTINCT cluster_id)；enterprise_industry_chain.chain_code 收 L0 industry_id 后 JOIN industry_cluster_map；未映射不计；国外无法计算"
    algorithm_type: STAT
    source_tables: ["enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["产业链要素库"]
    update_freq: daily
