  # ===== P1 · 重点企业类型分析（§1.1.1.2.4.2.3.1 / E-21）=====

  - metric_id: M_ENT_TYPE_MATCH_COUNT
    metric_name_zh: 匹配企业总数
    definition: "所选产业 ∩ 所选类型的国内企业去重。类型=enterprise_tag.tag_code，六类码同 TYPE_COUNT（foreign/high_tech/sme/listed/little_giant/little_giant_pro）。未选产业或未选类型则不计算。多选产业、多选类型均为并集，再求交。三方中文标签由项目对照落到内部码，属洗数，不算无法执行。禁止 enterprise_type/is_listed/org_size。国外无上链不并入。"
    formula: "未选产业或未选类型则不计算。COUNT(DISTINCT org_id) FROM enterprise_base JOIN enterprise_industry_chain JOIN enterprise_tag WHERE chain命中所选产业并集 AND tag_code IN 所选类型并集。中文 org_tag 映射到六码不算无法执行。目标建议 ads.ent_type_match_count，当前无此表。禁止 enterprise_type"
    algorithm_type: STAT
    source_tables: ["enterprise_base <- ods: dwd_org_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags", "enterprise_tag <- ods: dwd_org_tech_tag"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.2"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 L01 handoff 会签记录）"
    is_mock: true
