metrics:
  # ===== P0 · 企业分析概述（§1.1.1.2.4.2.3 / E-20）=====
  - metric_id: M_ENT_TOTAL_COUNT
    metric_name_zh: 企业总数
    definition: "选定未来产业范围内，国内∪国外企业按 org_id 去重。国内 enterprise_code=信用代码；国外=当地注册码。港澳台不计入国外。选产业时国外无上链表，暂不能并入该过滤结果。"
    formula: "COUNT(DISTINCT org_id) FROM (enterprise_base UNION enterprise_forg_base)；选产业时国内经 enterprise_industry_chain 按 chain_code/chain_name 过滤，国外无上链表暂不纳入"
    algorithm_type: STAT
    source_tables: ["enterprise_base <- ods: dwd_org_base_info", "enterprise_forg_base <- ods: dwd_forg_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "国外机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.0"
    is_mock: true
    mapping_status: "✅"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_TOTAL_COUNT.md"

  - metric_id: M_ENT_INNOVATIVE_COUNT
    metric_name_zh: 创新型企业数
    definition: "pending_data_lead(Q011)：创新型企业口径待甲方确认；团队临时默认按王惠底稿：专精特新∪小巨人∪制造业单项冠军∪创新型中小企业，并集去重。只国内；国外无对等标签表，不造 enterprise_forg_tag。选产业时国内经 industry_chain 过滤。"
    formula: "COUNT(DISTINCT org_id) FROM enterprise_tag JOIN enterprise_base WHERE tag_name 含 专精特新/小巨人/制造业单项冠军/创新型中小企业（并集）；选产业时国内经 enterprise_industry_chain 过滤。国外无标签表不并入"
    algorithm_type: STAT
    source_tables: ["enterprise_tag <- ods: dwd_org_tech_tag", "enterprise_base <- ods: dwd_org_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.0"
    is_mock: true
    mapping_status: "⚠️"
    definition_status: pending_data_lead
    pending_ref: Q011
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_INNOVATIVE_COUNT.md"

  - metric_id: M_ENT_NEW_COUNT_Y
    metric_name_zh: 历年新增企业数
    definition: "按注册年份分组的新登记企业数（国内∪国外）。计算键 org_id；年份取 registration_date。港澳台不计入国外。不按产业过滤。"
    formula: "COUNT(DISTINCT org_id) FROM (enterprise_base UNION enterprise_forg_base) GROUP BY YEAR(registration_date)，并计算累计 cumulative_count"
    algorithm_type: STAT
    source_tables: ["enterprise_base.registration_date <- ods: dwd_org_base_info.incorporation_date", "enterprise_forg_base.registration_date <- ods: dwd_forg_base_info.incorporation_date"]
    source_systems: ["国内机构要素库", "国外机构要素库"]
    update_freq: daily
    version: "0.4.0"
    is_mock: true
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_NEW_COUNT_Y.md"

  - metric_id: M_ENT_AVG_RD_INVESTMENT
    metric_name_zh: 平均研发投入
    definition: "选定产业内全部法人、最近一个完整自然年 R&D 经费内部支出的算术平均。成员并集按 org_id 去重后再 AVG。只国内；国外无上链不并。禁止上市财务。未选产业不计算。"
    formula: "AVG(rd_investment) FROM ads.ent_rd_latest WHERE org_id IN (SELECT DISTINCT org_id FROM enterprise_industry_chain WHERE 产业键∈:selected)。快照=enterprise_finance_history 每企最近完整年 rd（空/占位0不进）。多选=成员并集去重后一次 AVG。① DWD财务列+上链表在即可写。② ODS→DWD灌数另写，不进无法执行。禁止无过滤JOIN上链表；禁止各产业sum/n加总冒充去重。快照表当前无此表。禁止上市财务"
    algorithm_type: STAT
    source_tables: ["enterprise_finance_history <- ods: dwd_org_annual_financial_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.1"
    is_mock: true
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_AVG_RD_INVESTMENT.md"

  - metric_id: M_ENT_PATENT_TOTAL
    metric_name_zh: 专利总量
    definition: "企业作为专利权人的专利去重件数（总量，不过滤法律状态）。同一套专利 ODS，受让人名称映射到国内或国外主档 org_id。无独立国外专利表，不造表。不按产业过滤。"
    formula: "COUNT(DISTINCT patent_id) FROM enterprise_patent_detail"
    algorithm_type: STAT
    source_tables: ["enterprise_patent_detail <- ods: dwd_patent", "enterprise_patent_detail.assignee_name <- ods: dwd_patent_assignees"]
    source_systems: ["国内机构要素库", "国外机构要素库"]
    update_freq: daily
    version: "0.3.0"
    is_mock: true
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_PATENT_TOTAL.md"

  - metric_id: M_ENT_HIGH_TECH_COUNT
    metric_name_zh: 高企数量
    definition: "pending_data_lead(Q010)：高新技术企业去重家数。团队临时默认判定=enterprise_tag.tag_code='high_tech'。只国内；无国外标签表。不按产业过滤。无认定起止日则码在就算（曾获是否进由灌数决定）。禁止 tag_name 模糊含 / enterprise_type。"
    formula: "COUNT(DISTINCT org_id) FROM enterprise_tag JOIN enterprise_base WHERE tag_code='high_tech'。① DWD标签关系在即可数。② ODS→DWD灌数另写，不进无法执行。目标建议 ads.ent_high_tech_count，当前无此表。禁止 tag_name 含高新技术企业"
    algorithm_type: STAT
    source_tables: ["enterprise_tag <- ods: dwd_org_tech_tag", "enterprise_base <- ods: dwd_org_base_info"]
    source_systems: ["国内机构要素库"]
    update_freq: daily
    version: "0.3.1"
    is_mock: true
    mapping_status: "⚠️"
    definition_status: pending_data_lead
    pending_ref: Q010
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_HIGH_TECH_COUNT.md"

  # ===== P1 · 重点企业类型分析（§1.1.1.2.4.2.3.1 / E-21）=====

  - metric_id: M_ENT_TYPE_MATCH_COUNT
    metric_name_zh: 匹配企业总数
    definition: "所选产业 ∩ 所选类型的国内企业去重。类型条件=enterprise_tag.tag_code（六类码同TYPE_COUNT）。禁止enterprise_type/is_listed/org_size。国外无上链不并入。"
    formula: "COUNT(DISTINCT org_id) FROM enterprise_base JOIN enterprise_industry_chain JOIN enterprise_tag WHERE chain命中 AND tag_code=:type。① DWD标签关系在即可数。② ODS→DWD另写"
    algorithm_type: STAT
    source_tables: ["enterprise_base <- ods: dwd_org_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags", "enterprise_tag <- ods: dwd_org_tech_tag"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.1"
    is_mock: true
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3.1"
    acceptance_unit_id: E-21
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_TYPE_MATCH_COUNT.md"

  - metric_id: M_ENT_TYPE_COUNT
    metric_name_zh: 各类型企业数
    definition: "按六类分别COUNT(DISTINCT org_id)。一律enterprise_tag.tag_code：foreign/high_tech/sme/listed/little_giant/little_giant_pro。一企可进多类，禁止六类SUM当总数。只国内。禁止enterprise_type/is_listed/org_size/sme_tech。"
    formula: "对每个tag_code：COUNT(DISTINCT org_id) FROM enterprise_tag JOIN enterprise_base WHERE tag_code=:t。① DWD标签关系在即可数（含小微/外资/上市）。② ODS→DWD灌数另一步，不进无法执行。选产业再JOIN enterprise_industry_chain。目标建议enterprise_type_count，当前无此表"
    algorithm_type: STAT
    source_tables: ["enterprise_tag <- ods: dwd_org_tech_tag", "enterprise_base <- ods: dwd_org_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: monthly_yearly
    version: "0.3.1"
    is_mock: true
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3"
    acceptance_unit_id: E-20
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_TYPE_COUNT.md"

  - metric_id: M_ENT_TYPE_RATIO
    metric_name_zh: 类型占比
    definition: "六类各自 TYPE_COUNT[tag_code] / TYPE_MATCH_COUNT * 100。名单同 COUNT。一企可进多类，合计可>100%。只国内。小微分子可算。MATCH=0该类无法计算。"
    formula: "按类：M_ENT_TYPE_COUNT[t] / M_ENT_TYPE_MATCH_COUNT * 100；t∈{foreign,high_tech,sme,listed,little_giant,little_giant_pro}；MATCH=0无法计算。判定随COUNT的tag_code。①随COUNT可算完；②灌数另写"
    algorithm_type: STAT
    source_tables: ["enterprise_tag <- ods: dwd_org_tech_tag", "enterprise_base <- ods: dwd_org_base_info", "enterprise_industry_chain <- ods: dwd_org_industry_tags"]
    source_systems: ["国内机构要素库", "产业链要素库"]
    update_freq: daily
    version: "0.3.1"
    is_mock: true
    mapping_status: "🔧"
    bid_ref: "§1.1.1.2.4.2.3.1"
    acceptance_unit_id: E-21
    owner_agent: data-agent
    calc_logic_ref: "metrics/calc-logic/ENT/M_ENT_TYPE_RATIO.md"

  - metric_id: M_ENT_REGIONAL_COUNT
    metric_name_zh: 区域企业数量
    definition: "pending_data_lead(Q012)：国内按 region_id 六位三级前缀（省2/市4/县6）去重，临时默认聚到市。国外按 country_code（下钻 city_code），不写入 region_id。产业不是分组维。"
    formula: "国内 COUNT(DISTINCT org_id) FROM enterprise_base GROUP BY LEFT(region_id, :level) 默认 level=4；国外 COUNT(DISTINCT org_id) FROM enterprise_forg_base GROUP BY country_code（城市层 GROUP BY city_code）"
    algorithm_type: STAT
    source_tables: ["enterprise_base.region_id <- ods: dwd_org_base_info", "enterprise_forg_base.country_code <- ods: dwd_forg_base_info"]
    source_systems: ["国内机构要素库", "国外机构要素库"]
    update_freq: daily
