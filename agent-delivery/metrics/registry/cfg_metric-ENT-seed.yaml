    source_tables: ["gkx.dwd_org_industry_tags(credit_code, industry_code, industry_link_code) — 企业与产业链节点关联（链位归集）", "gkx.dwd_industry_chain_info(industry_code, industry_link_code, level) — 产业链节点层级（上/中/下游分组）", "gkx.dwd_org_base_info(org_id, name_cn, external_id) — 企业基础信息（关联重点企业名称）", "gkx.dwd_patent_base(patent_id, org_id, patent_name, abstract) — 企业专利关键词抽取来源", "gkx.dwd_paper_base(paper_id, org_id, title, abstract) — 企业论文关键词抽取来源"]
