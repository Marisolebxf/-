  metric_name_zh: 区域创新要素层次指数
  definition: 选定区域内、统计年度的区域创新要素层次指数，从七大结构（人才/企业/政策/服务机构/科研机构/资金/空间）的成熟度与均衡度合成，取值 0—100。分数越高表示创新体系结构越成熟、越均衡。不是七类要素配置水平（见 M_SYNTH_ELEM_TYPE_INDEX）。
  formula: 叶子标准化得分只读 M_SYNTH_ELEM_TYPE_INDEX 对应维。各结构成熟度=有值叶子等权；均衡度=熵（n=1记60，合计0记0，n≥2为H/ln(n)×100）；结构得分=(成熟度+均衡度)/2；有值结构等权合成总指数。缺叶子/缺结构不进分母、不填0。
  algorithm_type: MODEL
