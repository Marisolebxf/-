    definition: "pending_data_lead(QC02)：深圳覆盖的关键环节数占全链关键环节总数比例；关键环节判定口径同 QC02。"
    formula: "pending_algorithm（深圳覆盖关键环节数 / 全链关键环节数 * 100）"
    algorithm_type: STAT
    source_tables: ["dwd.industry_chain_enterprise <- ods: dwd_org_industry_chain_dtl", "dwd.industry_chain.is_key_node"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QC02
    definition_status: pending_data_lead
    owner_agent: data-agent
  - metric_id: M_CHAIN_DEVELOPMENT_MILESTONE_COUNT
    metric_name_zh: 发展里程碑数
    definition: "产业链发展路线中的里程碑事件数（重大技术突破/政策出台/龙头入驻等）；基于资讯+政策+企业事件综合提取。"
    formula: "pending_algorithm（基于 dwd.industry_chain_news + 政策事件 NLP 提取里程碑）"
    algorithm_type: MODEL
    source_tables: ["dwd.industry_chain_news <- ods: dwd_industry_chain_news_info", "政策域事件(跨域引用)"]
