  - metric_id: M_CHAIN_REG_TALENT_STRUCTURE
    metric_name_zh: "人才结构"
    definition: >
      2026-10-14 拍板（human:徐滕强：①主值+分布双形态——主值硕博占比喂指数合成（叶子权重8/100），四桶分布做下钻；②分母=有学历记录学者（SZ_TALENT 先例），未知桶单独展示不掺水分母；③只做学历维，职称/年龄无源禁发明（TAL-B04），三方库到位再扩；④覆盖率披露（用户质疑14.4%低覆盖误导后定）：指标卡强制同显"学历覆盖率"，覆盖率<50% 挂 ⚠️ 低覆盖样本角标、≥50% 干净展示，覆盖率与主值同框、禁止只报占比）：指定区域内、链上高校与科研机构所属学者按最高学历互斥分桶（博士/硕士/学士/未知）后的硕博占比=(博士+硕士)/有学历记录学者×100%。链路（与 RESEARCH_ORG 同构）：dwd_org_heis_info + dwd_research_institute_base_info（city 区域筛）→ 学者归属（过渡轨=机构名 scholar_org_name_zh 匹配，scholar_org_id 全空=数据未灌，灌数后切 org_id 等值连）→ dwd_scholar_education_background 取最高学历（一人多记录取博士>硕士>学士）。跨域注记：Q103 学历为主分箱先例；unknown≠低学历，录入缺失不得反向误导（用户 2026-10-14 识别覆盖率偏差）。实核（2026-10-14 demo）：深圳链上 194 学者（深圳大学88/先进院35/哈工大深圳20+...），有学历记录 28（覆盖率14.4%），最高学历分桶=博士27/学士1/硕士0/未知166，硕博占比96.4%（同框必显覆盖率14.4%）。全局学历覆盖74%（15851/21316），深圳低=分批灌数未覆盖，补录自然抬升。
    formula: >
      SELECT ROUND(100*SUM(bucket IN ('博士','硕士'))/NULLIF(SUM(bucket<>'未知'),0),1) AS master_phd_ratio,
             ROUND(100*SUM(bucket<>'未知')/COUNT(*),1) AS edu_coverage,
             SUM(bucket='博士') AS phd, SUM(bucket='硕士') AS master,
             SUM(bucket='学士') AS bachelor, SUM(bucket='未知') AS unknown_cnt
      FROM (SELECT s.scholar_id, CASE WHEN eb.degree_zh LIKE '%博士%' THEN '博士' WHEN eb.degree_zh LIKE '%硕士%' THEN '硕士' WHEN eb.degree_zh LIKE '%学士%' OR eb.degree_zh LIKE '%本科%' THEN '学士' ELSE '未知' END AS bucket
            FROM dwd_scholar s
            JOIN (SELECT name_cn FROM dwd_org_heis_info WHERE city=:region_city AND is_deleted=0
                  UNION ALL SELECT name_cn FROM dwd_research_institute_base_info WHERE city=:region_city AND is_deleted=0) org
              ON s.scholar_org_name_zh LIKE CONCAT('%',org.name_cn,'%')
            LEFT JOIN dwd_scholar_education_background eb ON eb.scholar_id=s.scholar_id AND eb.is_deleted=0 AND eb.degree_zh<>''
            WHERE s.is_deleted=0 GROUP BY s.scholar_id) t;
      展示铁律（拍板④）：主值旁必同显覆盖率；edu_coverage<50% 挂 ⚠️；未知桶进下钻不进分母。正式签名待 human:唐绍祖 会签（T0-X 注册档红线）。
    algorithm_type: STAT
    source_tables: ["dwd_org_heis_info（高校主档 city 区域轴；名称轨）", "dwd_research_institute_base_info（科研院所主档 city 区域轴；名称轨）", "dwd.scholar（学者主档 scholar_id 去重；scholar_org_id 全空=数据未灌，灌数后切 org_id 等值连）", "dwd_scholar_education_background（学历明细 degree_zh 自由文本→三桶+未知；一人多记录取最高）"]
