  - metric_id: M_CHAIN_SZ_COMPLETENESS
    metric_name_zh: 深圳产业链完整度
    definition: >
      2026-10-14 拍板（human:徐滕强）：深圳产业链完整度 = M_CHAIN_REG_ECOSYSTEM（区域环节完整度）在 region_city='深圳市' 的特例，口径完全复用不另立：分母 = 该链 L1 环节数（industry_chain_node WHERE chain_id=:chain_code AND node_level=1 AND is_deleted=0）；分子 = 被深圳企业上链覆盖的 L1 环节数（enterprise_industry_chain JOIN dwd_org_base_info ON org_id AND city='深圳市' AND is_deleted=0，COALESCE(parent_node_id, node_id) 折 L1）。同家族（REG_ECOSYSTEM/SZ_COMPLETENESS）同构 L1 口径（此前"用L1先"拍板），细稿引用 REG_ECOSYSTEM 文档不复制逻辑。旧稿 QC01"按节点数/按企业覆盖/按产值覆盖"三选一废弃，统一落 L1 节点覆盖版。
    formula: >
      SELECT ROUND(100 * cov.covered / denom.total, 1) AS sz_completeness_pct
      FROM (SELECT COUNT(*) AS total
            FROM demo_gkxlumenx_dwd.industry_chain_node
            WHERE chain_id = :chain_code AND node_level = 1 AND is_deleted = 0) denom,
           (SELECT COUNT(DISTINCT COALESCE(n.parent_node_id, e.node_id)) AS covered
            FROM demo_gkxlumenx_dwd.enterprise_industry_chain e
            JOIN demo_gkxlumenx_ods.dwd_org_base_info b
              ON b.org_id = e.org_id AND b.is_deleted = 0 AND b.city = '深圳市'
            LEFT JOIN demo_gkxlumenx_dwd.industry_chain_node n
              ON n.node_id = e.node_id AND n.is_deleted = 0
            WHERE e.chain_code = :chain_code) cov;
      与 M_CHAIN_REG_ECOSYSTEM 同 SQL，:region_city 绑定 '深圳市'。口径已定（human:徐滕强 2026-10-14：复用 REG_ECOSYSTEM 深圳特例 + L1）；正式签名待 human:唐绍祖 会签。
