    definition: "pending_data_lead：产业链/环节的热度综合评分；评分维度与权重待甲方确认。"
    formula: "pending_algorithm（企业增速*w1+投融资热度*w2+专利密度*w3+资讯热度*w4）"
    algorithm_type: MODEL
    source_tables: ["dwd.industry_chain_enterprise", "dwd.industry_chain_news", "dwd.industry_chain_patent <- ods: dwd_org_industry_chain_pat_dtl"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    definition_status: pending_data_lead
    owner_agent: data-agent
  - metric_id: M_CHAIN_SZ_ADVANTAGE_SCORE
    metric_name_zh: 深圳优势评分
    definition: 指定产业链上，深圳相对默认对标城市的四维综合得分，取值0—100。四维为企业、专利、政策、人才。先定链，再按城市筛区域。
    formula: "默认对标C={北京、上海、广州、深圳}，city字段匹配。先定链再按城市算三级原始值：企业数量=tags∩city去重；规模=年报营收合计；质量=上市研发投入/营收（无上市样本取0）；专利数量=链上该市企业专利去重且pbdt_year≤统计年；政策数量=有效且city匹配且industry_name命中title/keywords/keypoints/theme；人才数量=挂在该链且位于该市的高校/科研机构学者去重；综合水平=有学位记录者硕博占比。各三级在C上min-max到0—100，全相同则取50。企业三维各1/3，专利=1，政策=1，人才两维各1/2，四维各25%。输出深圳市综合分。"
    algorithm_type: MODEL
    source_tables: ["dwd_industry_chain_info(industry_code, industry_name) — 目标产业链范围, 产业链名称匹配政策", "dwd_org_industry_tags(industry_code, credit_code, company_name) — 链上企业/机构筛选, 信用代码关联, 名称匹配", "dwd_org_base_info(external_id, city) — 信用代码关联, 对标城市筛选", "dwd_org_annual_financial_info(external_id, year, operating_revenue) — 年报年度, 营业收入(企业规模)", "dwd_org_stock_finance_info(external_id, occur_period, operating_revenue, research_development_amount) — 上市研发强度", "dwd_patent(patent_id, first_applicant_name, first_current_assignee_name, pbdt_year) — 专利去重, 申请人匹配, 专利权人匹配, 公开年", "dwd_policy_base(id, title, keywords, keypoints, theme, city, status) — 政策去重, 标题/关键词/要点/主题匹配产业, 城市, 有效状态", "dwd_org_heis_info(org_id, external_id, name_cn, city) — 高校对链上机构, 城市", "dwd_research_institute_base_info(org_id, external_id, name_cn, city) — 科研机构对链上机构, 城市", "dwd_scholar(scholar_id, scholar_org_id, scholar_org_name_zh) — 学者去重, 所属机构", "dwd_scholar_education_background(scholar_id, degree_zh, degree_en) — 硕博识别"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: 1
    updated: "2026-08-27"
    algo_server_location: "repos/demo-algo-science/chainan/metrics/metrics.py（计算） + repos/demo-algo-science/api/chainan_metric_routes.py（服务接口）"
    calc_logic_ref: "metrics/calc-logic/CHAIN/M_CHAIN_SZ_ADVANTAGE_SCORE.md"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QC08
