    algorithm_type: STAT
    source_tables: ["dwd.industry_chain_news.heat_score <- ods: dwd_industry_chain_news_info.heat_score"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    formula_status: pending_algorithm
    owner_agent: data-agent
  - metric_id: M_CHAIN_SZ_ENTERPRISE_COUNT
    metric_name_zh: 深圳产业链企业数
    definition: "总部在深圳且属目标产业链的企业去重数；按 headquarters_city=深圳 + chain_id 筛选 COUNT。"
