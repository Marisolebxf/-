metrics:
  - metric_id: M_CHAIN_MARKET_SIZE
    metric_name_zh: 市场规模
    definition: "产业链下全部关联企业的年报营收合计（仅企业，不计机构/人才等）；单位默认亿元（展示换算在 ADS）。统计年与 ENT 年报字段对齐。非 ODS 直灌、非外购市调默认口径。"
    formula: "SUM(ent_annual_revenue) WHERE enterprise_code IN (SELECT entity_id FROM industry_chain_entity_rel WHERE chain_id=:chain_id AND entity_type='enterprise' AND valid_to IS NULL AND is_deleted=0) AND fiscal_year=:stat_year"
    algorithm_type: STAT
    source_tables:
      - "dwd.industry_chain_entity_rel"
      - "ENT域企业年报营收表（字段名与 ENT DWD 对齐后冻结）"
    source_systems: ["gkx-chain-rel", "gkx-ent-annual-report"]
    update_freq: yearly
    version: "0.2.0"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 handoff §9）"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QC06
    source_status: calc_from_ent
    owner_agent: data-agent
  - metric_id: M_CHAIN_MARKET_GROWTH
    metric_name_zh: 市场增长率
    definition: "产业链市场规模同比增长率；依赖 M_CHAIN_MARKET_SIZE 相邻两年计算结果。"
    formula: "(M_CHAIN_MARKET_SIZE(y)-M_CHAIN_MARKET_SIZE(y-1))/NULLIF(M_CHAIN_MARKET_SIZE(y-1),0)*100"
    algorithm_type: STAT
    source_tables:
      - "ADS/指标引擎基于 M_CHAIN_MARKET_SIZE"
    source_systems: ["gkx-metric-engine"]
    update_freq: yearly
    version: "0.2.0"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 handoff §9）"
    is_mock: true
    mapping_status: "🔧"
    pending_ref: QC06
    source_status: calc_from_ent
    owner_agent: data-agent
  - metric_id: M_CHAIN_ENTERPRISE_COUNT
    metric_name_zh: "产业链关联企业数"
    definition: >
      2026-10-14 拍板（human:徐滕强，尺子=严格真实口径优先，不因数据空换源）：产业链关联企业数 = 挂链企业去重数。真源唯一 = dwd.enterprise_industry_chain（企业上链明细表，DDL 实核：org_id 索引 / enterprise_code / chain_code / node_id / node_stage / is_chain_leader / chain_score / create_time；无 is_deleted 软删字段）。去重键 org_id（同企业挂多链/多节点只计 1）。当前 0 行 = 上游全量挂链明细未供应，如实 0 + ⚠️ PendingBadge，禁止用 dwd_org_industry_tags（104 行人工小样本，覆盖率 0.05%）顶数。表名漂移回执：老稿 industry_chain_enterprise / dwd_org_industry_chain_dtl 均不存在于现网，按真源重写。
    formula: >
      SELECT COUNT(DISTINCT org_id) AS chain_ent_total
      FROM demo_gkxlumenx_dwd.enterprise_industry_chain;
      当前真数：0（上链明细未供应，如实展示）。无 is_deleted 字段不加软删过滤（DDL 实核）。选链是 API 过滤（WHERE chain_code），不进口径本体。
    algorithm_type: STAT
    source_tables: ["dwd.enterprise_industry_chain <- ods: dwd_org_industry_tags（过渡期上游；全量挂链明细待供应方交付）"]
    source_systems: ["国内产业链要素库"]
    update_freq: daily
    version: "0.2.0"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 handoff §9）"
    is_mock: true
    mapping_status: "🔧"
    owner_agent: data-agent
    owner_human: "human:淮政玮"
  - metric_id: M_CHAIN_ENTERPRISE_NEW_COUNT
    metric_name_zh: "新增关联企业数"
    definition: >
      2026-10-14 拍板（human:徐滕强）：年度新增挂链企业数 = 该年首次挂上链的企业去重家数。真源 = dwd.enterprise_industry_chain，去重键 org_id（同 M_CHAIN_ENTERPRISE_COUNT）。时间轴目标态 = 首挂业务时间（first_link_date，现无此字段）。语义细化：退出后重新挂链不计新增（历史首挂才计 1 次）；分链视图按 (org_id, chain_code) 链内首挂归集。ODS 实核（2026-10-14）：入站 dwd_org_industry_tags（104 行）/ dwd_org_industry_product_tags（169 行）均无业务挂链日期，created_time 为同秒批量入库戳（2026-10-12 03:56:37）→ 源级缺口，已开 CHAIN-P0-5 问供应方。临时运营方案（不作口径）：首灌批全量即首挂，后续批次按 create_time 分批识别增量；禁止将 create_time 冒充业务时间写进口径本体。
    formula: >
      SELECT YEAR(MIN(first_link_date)) AS stat_year, COUNT(DISTINCT org_id) AS new_cnt
      FROM demo_gkxlumenx_dwd.enterprise_industry_chain
      GROUP BY org_id;
      外层再按 stat_year 聚合。first_link_date 为目标态字段（现无）；当前真数 0 行输出（明细未供应，如实 0 + ⚠️）。分链视图：WHERE chain_code = :chain 后按 (org_id, chain_code) 链内首挂。
    algorithm_type: STAT
    source_tables: ["dwd.enterprise_industry_chain <- ods: dwd_org_industry_tags（过渡期；全量挂链明细待供应方交付，业务挂链日期缺失见 CHAIN-P0-5）"]
    source_systems: ["国内产业链要素库"]
    update_freq: daily
    version: "0.2.0"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 handoff §9）"
    is_mock: true
    mapping_status: "🔧"
