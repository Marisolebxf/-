  - metric_id: M_CHAIN_REG_POLICY_COVERAGE
    metric_name_zh: "政策覆盖率"
    definition: >
      2026-10-14 拍板（human:徐滕强 4 点：①政策多的环节加分（饱和加权）②拆词匹配但不拆细（实体词入表、泛词不入）③分母用链环节定义（L1）④国家级政策覆盖全国）：指定区域内、指定产业链相关政策对链上 L1 环节的覆盖强度，输出 0-100%。分子=各 L1 环节政策命中数 hit_i 的饱和加权和 Σ(hit_i/(hit_i+5))（政策越多环节分越高、渐近 1 不爆表，k=5 首版定值可调不另建表）；分母=L1 环节总数（如 INB1701=6，dwd_industry_chain_info.level=1）。命中判定=政策 title 拆词 OR LIKE（词表=环节名实体词，算法侧维护：半导体/集成电路/通信/超高清/智能终端/软件等；停用词与/及/应用剔除，泛词网络/终端单独不入表防误判——实测网络一词引入 18 条误判 52→34）；政策池=有效态且（city=区域 OR city空且rank含国家级）；政策与环节多对多不去重跨环节。实核（2026-10-14 demo）：dwd_policy_base 20,000 行 status 全有效（demo 库在案；live gkxlumenx_ods 无此表=跨库差异注记非缺口）；city 非空 10,294/深圳 879/国家级 2,174；keywords/keypoints/theme 零填充（0/0/2 行）→ title 唯一承重，三列口径保留待灌。端到端真值：深圳×INB1701 加权覆盖率 61.8%（6/6 环节命中，hit=34/18/27/6/5/1；二元口径对照 100% 已失区分度，证明加权必要性）。
    formula: >
      SELECT l.industry_link_code, COUNT(DISTINCT p.id) AS hit_cnt
      FROM demo_gkxlumenx_ods.dwd_industry_chain_info l
      JOIN demo_gkxlumenx_ods.dwd_policy_base p
        ON p.is_deleted = 0 AND p.status = '有效'
       AND (p.city = :region_city
         OR ((p.city IS NULL OR p.city = '') AND p.`rank` LIKE '%国家级%'))
       AND (p.title LIKE CONCAT('%', :token_1, '%')
         OR p.title LIKE CONCAT('%', :token_2, '%'))
      WHERE l.is_deleted = 0 AND l.industry_code = :chain_code AND l.level = 1
      GROUP BY l.industry_link_code;
      外层：覆盖率 = Σ(hit_i/(hit_i+5)) / COUNT(L1 环节)（无命中环节计 0），输出 0-1 比例×100%。口径已钉（human:徐滕强 2026-10-14），正式签名待 human:唐绍祖 会签（T0-X 注册档红线）。
    algorithm_type: STAT
    source_tables: ["dwd_policy_base（政策池，demo 20,000 行；title 承重，keywords/keypoints/theme 零填充待灌）", "dwd_industry_chain_info（链与 L1 环节字典；分母）", "环节词表（算法侧维护：环节名→实体词组，非库表）"]
