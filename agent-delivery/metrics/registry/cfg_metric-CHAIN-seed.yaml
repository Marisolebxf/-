    metric_name_zh: 高价值环节占比
    definition: >
      2026-10-14 拍板（human:徐滕强，B 方案归一 L1）：高价值环节占比 = 该链高价值 L1 环节数 / 该链全部 L1 环节数。分母 = industry_chain_node 全部 L1（node_level=1，is_deleted=0，与 REG_ECOSYSTEM 分母同）；分子 = 其中 importance_level 命中高价值值集（:high_value_enum 占位）折 L1 去重。与 M_CHAIN_SZ_KEY_NODE_COVERAGE 共用 importance_level 字段、共用同一缺口 GAP-CHAIN-IMPORTANCE-ENUM（一次问清值域字典 + 标注层级，两指标解锁）。数据未灌时如实出 NULL/无数据，不伪造。旧稿 QC02 同步收敛到此口径。
    formula: >
      [锁定待值集] SELECT ROUND(100 * hv.hv_cnt / denom.total, 1) AS high_value_ratio_pct
      FROM (SELECT COUNT(DISTINCT COALESCE(n.parent_node_id, n.node_id)) AS total
            FROM demo_gkxlumenx_dwd.industry_chain_node n
            WHERE n.chain_id = :chain_code AND n.node_level = 1 AND n.is_deleted = 0) denom,
           (SELECT COUNT(DISTINCT COALESCE(n.parent_node_id, n.node_id)) AS hv_cnt
            FROM demo_gkxlumenx_dwd.industry_chain_node n
            WHERE n.chain_id = :chain_code AND n.is_deleted = 0
              AND n.importance_level IN (:high_value_enum)) hv;
      :high_value_enum 值集待 GAP-CHAIN-IMPORTANCE-ENUM 答复（公式结构已定，仅枚举占位）。口径已定（human:徐滕强 2026-10-14：L1 分母同 REG_ECOSYSTEM + importance_level 判定）；正式签名待 human:唐绍祖 会签。
