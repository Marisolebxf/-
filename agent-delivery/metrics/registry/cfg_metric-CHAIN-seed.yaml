               COUNT(*) OVER () AS total
        FROM demo_gkxlumenx_ods.dwd_industry_chain_news_info n
        WHERE n.is_deleted = 0 AND n.industry_code = :chain_code
      ) t WHERE t.rk <= GREATEST(CEIL(t.total * 0.1), 1);
