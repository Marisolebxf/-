  - metric_id: M_CHAIN_TECH_MATURITY_SCORE
    metric_name_zh: 技术成熟度评分
    definition: 指定产业链上，以链上企业专利按公开年汇总的近3年复合增速判定技术所处生命周期位置，输出0—100分。分值越高表示技术越趋近成熟（公开量增速趋缓）；持续负增长按衰退回落计分。
    formula: "时间戳用公开年pbdt_year，不用授权年；不要求granted_number非空，避免近两年发明专利审查未结导致右截断。从dwd_industry_chain_info定链，经dwd_org_industry_tags取链上企业，按申请人/专利权人匹配dwd_patent，按patent_id去重。P_t为该年公开专利去重件数。窗口k优先3、否则2、仅1年用同比，g_t=(P_t/P_{t-k})^(1/k)-1。P连续为0评0；上期为0且本期有量评25（萌芽）；g>5%且加速或缺上期g评50（成长）；g>5%且减速评70（趋于成熟）；|g|≤5%评90（成熟）；g<-5%评90×P_t/P_{t-k}并截断到[0,90)（衰退）。"
    algorithm_type: MODEL
    source_tables: ["dwd_industry_chain_info(industry_code, industry_name) — 目标产业链范围, 产业链名称", "dwd_org_industry_tags(industry_code, credit_code, company_name) — 链上企业筛选, 信用代码关联, 企业名称匹配专利权人", "dwd_patent(patent_id, first_applicant_name, first_current_assignee_name, pbdt_year) — 专利去重, 申请人匹配, 专利权人匹配, 公开年(年度公开量)"]
