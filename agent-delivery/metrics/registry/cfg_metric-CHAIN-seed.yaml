  - metric_id: M_CHAIN_TECH_POWER
    metric_name_zh: 技术能力
    definition: 指定区域在指定产业链上的技术能力得分，取值0—100。由区域专利（M_CHAIN_REG_PATENT）、区域技术壁垒（M_CHAIN_REG_TECH_BARRIER）、区域技术成熟度（M_CHAIN_REG_TECH_MATURITY）三维合成。本指标不输出TRL等级。
      区域内专利、技术成熟度与技术壁垒综合得分 统计窗口与对象范围待 T0-X 核对；公式与 algorithm_type 未签，本条仅为 OPEN draft 身份。
    formula: "三维等权。先按各子指标口径计算区域、链、年原始值，再在同一产业链、同一统计年度对全部对比区域做截面min-max归一化到[0,1]，算术平均后乘100。某维全部区域取值相同则该维取0.5。默认等权，前端可调权重但不另建权重表。区域用dwd_org_base_info.province/city过滤，深圳场景取city=深圳市。区域专利对齐M_CHAIN_REG_PATENT：COUNT(DISTINCT patent_id)，company_name匹配first_applicant_name或first_current_assignee_name，pbdt_year≤统计年。区域技术壁垒对齐M_CHAIN_REG_TECH_BARRIER：空白（连续3年发明授权量为0取1）与封锁（IPC占比向量欧氏距离）等权；该维为负向，min-max到[0,1]后取1-x再合成。区域技术成熟度对齐M_CHAIN_REG_TECH_MATURITY：按pbdt_year近k年复合增速映射0—100。"
    algorithm_type: MODEL
    source_tables: ["dwd_industry_chain_info(industry_code, industry_name) — 目标产业链范围, 产业链名称", "dwd_org_industry_tags(industry_code, credit_code, company_name) — 链上企业筛选, 信用代码关联, 企业名称匹配专利权人", "dwd_org_base_info(external_id, province, city) — 企业信用代码关联, 省份, 城市(区域筛选)", "dwd_patent(patent_id, first_applicant_name, first_current_assignee_name, kind, granted_number, pbdt_year, main_classification_ipcr) — 专利去重, 申请人匹配, 专利权人匹配, 发明识别, 授权判定, 公开年, IPC主分类"]
