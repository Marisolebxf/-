  - metric_id: M_CHAIN_INVEST_COUNT
    metric_name_zh: 投融资事件数
    definition: >
      2026-10-14 拍板（human:徐滕强，路径A：口径前置写实，方案A）：指定产业链链上企业的融资事件去重件数（被投视角），与 M_CHAIN_REG_FINANCING 同构（去 region 换 chain_code，全族同尺）。三要点：①去重键 = 复合业务键 (org_id, completion_date, funding_round)（同企业同日同轮计 1 件；该键是业务去重规则非物理唯一索引——表无 event_id 无 UNIQUE 约束，同日同轮多行由 SELECT DISTINCT 塌缩，碰撞风险如实注记；供应方补 event_id 后 DISTINCT 冗余可去、口径不动）；②时间窗默认全量，近 N 年作查询参数（completion_date 时间轴，FINANCING 先例同款）；③旧稿 news_type='financing' 写法废除（字段实测不存在，不可执行）。QC07 处置：从 🔴 降 🟡 跟踪——融资事件源 dwd_org_financing_info（25,654 行实测）已活，QC07 残余只剩投资方视角（对外投资 dwd_org_invest_info 46,967 行为关系存量非事件、无日期无轮次）无事件级源；未来页面要"链上企业投了谁"另立指标，不混本条。表名漂移回执：旧稿源 dwd.industry_chain_news（融资类）弃。
    formula: >
      SELECT COUNT(*) AS chain_fin_cnt FROM (
        SELECT DISTINCT f.org_id, f.completion_date, f.funding_round
        FROM demo_gkxlumenx_ods.dwd_org_financing_info f
        JOIN demo_gkxlumenx_dwd.enterprise_industry_chain e
          ON e.org_id = f.org_id AND e.chain_code = :chain_code
        WHERE f.is_deleted = 0
      ) k;
      近 N 年窗口版追加：AND f.completion_date >= :window_start（查询参数不进口径）。口径已钉（human:徐滕强 2026-10-14：方案A同构 + 复合键去重 + 窗口参数化）；正式签名待 human:唐绍祖 会签。
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 handoff §9）"
    algorithm_type: STAT
    source_tables: ["dwd_org_financing_info（分子：25,654 行实测；复合业务键 org_id+completion_date+funding_round；轮次干净中文枚举）", "dwd.enterprise_industry_chain（链桥：org_id + chain_code；INB1309 mock 可算，全量跟 CHAIN-P0-5）"]
