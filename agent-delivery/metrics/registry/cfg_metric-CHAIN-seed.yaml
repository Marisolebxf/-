  - metric_id: M_CHAIN_CONCENTRATION_INDEX
    metric_name_zh: 产业集中度
    definition: >
      2026-10-14 拍板（human:徐滕强：三段式——临时出数 + 正式口径完整保留 + 切换条件写明；临时错一点无所谓但正式不污染）。【正式口径（锁定待签，完整保留零预拍）】产业链企业分布的集中度指数：公式形态（HHI / CR_N）、份额基准（目标=营收份额）、统计粒度（环节级/全链级）、输出形态（连续/分级）全部保持 QC02 + 唐绍祖待签状态；解挂 = QC02 签发 + 企业×链营收聚合表落库（QC06 后置任务）。【临时口径（当前生效）】资本集中度代市场集中度：share_i = 企业 i 在该链累计融资额(元) / 该链全部企业累计融资额(元)（万/亿中文金额解析归一为元，非 CNY 或空值企业剔除——剔的是无金额企业非无融资企业，占比公式语义）；HHI = Σ share² × 10000（0-10000 点分）。定义层如实标注：临时=资本集中度代市场集中度，语义偏移已知；UI 侧不体现临时标注（沿 HOT_NEWS 2026-10-14 先例）。旧稿 chain_score 是链企匹配置信分非市场份额，禁止冒充（废弃壳表一并废止）。
    formula: >
      [临时口径·当前生效] WITH ent_amt AS (
        SELECT e.org_id, SUM(CASE
          WHEN f.funding_amount LIKE '%亿%' THEN CAST(REGEXP_SUBSTR(f.funding_amount,'^[0-9.]+') AS DECIMAL(20,2)) * 100000000
          WHEN f.funding_amount LIKE '%万%' THEN CAST(REGEXP_SUBSTR(f.funding_amount,'^[0-9.]+') AS DECIMAL(20,2)) * 10000
          ELSE NULL END) AS amt_cny
        FROM demo_gkxlumenx_dwd.enterprise_industry_chain e
        JOIN demo_gkxlumenx_ods.dwd_org_financing_info f
