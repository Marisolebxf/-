  - metric_id: M_CHAIN_NATIONAL_REGION_COUNT
    metric_name_zh: "全国分布区域数"
    definition: >
      2026-10-14 拍板（human:徐滕强）：指定产业链的链上主体总部所在省级行政区去重数，链维 KPI 随链切换（与 GLOBAL/SZ 同族：GLOBAL 国家粒度、本条省级粒度、SZ 区县粒度）。全国 34 省级行政区为全集不做选省过滤（现稿 scope=national 为无源伪条件已删）。值域细则（2026-10-14 demo 实核）：空 province 不计数（防虚高）；自治区简称（新疆/广西/内蒙古/宁夏共 14 行）按主档原值计数、归一全称走 ETL 清洗不进口径公式；港澳台按主档原值处理。市级为下钻维度不另开 ID。当前真数 0（桥 enterprise_industry_chain 0 行），如实 0 + ⚠️。
    formula: >
      SELECT COUNT(DISTINCT b.province) AS prov_region_cnt
      FROM demo_gkxlumenx_dwd.enterprise_industry_chain e
      JOIN demo_gkxlumenx_ods.dwd_org_base_info b ON b.org_id = e.org_id
      WHERE e.chain_code = :chain AND e.is_deleted = 0
        AND b.province IS NOT NULL AND b.province != '';
