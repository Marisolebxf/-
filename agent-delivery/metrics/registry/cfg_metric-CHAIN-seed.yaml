    owner_agent: data-agent
  - metric_id: M_CHAIN_SZ_REGION_COUNT
    metric_name_zh: 深圳产业分布区域数
    definition: "深圳产业链关联企业/机构覆盖的区/县去重数；按深圳下辖区划 DISTINCT 计数。"
    formula: "COUNT(DISTINCT headquarters_district) WHERE headquarters_city='深圳'"
    algorithm_type: STAT
    source_tables: ["dwd.industry_chain_enterprise", "dwd.enterprise.headquarters_district <- ods: dwd_company_location_tags"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "✅"
    owner_agent: data-agent
  - metric_id: M_CHAIN_TOTAL_COUNT
    metric_name_zh: 产业链总数
    definition: "纳入要素库的产业链去重总数；统计窗口为最新批次快照，对象范围 dwd.industry_chain 全量，按 chain_id 去重。"
