    algorithm_type: STAT
    source_tables: ["dwd.enterprise_industry_chain <- ods: dwd_org_industry_tags（国内桥；全量挂链明细待供应方交付见 CHAIN-P0-5）", "dwd_org_base_info.province（省级区域轴；demo 18.9 万行值域实核 2026-10-14）"]
