    source_tables: ["dwd.industry_chain_enterprise <- ods: dwd_org_industry_chain_dtl", "dwd.enterprise.headquarters_city <- ods: dwd_org_reg_info"]
    source_systems: ["Mock @ batch=mock_20260623"]
