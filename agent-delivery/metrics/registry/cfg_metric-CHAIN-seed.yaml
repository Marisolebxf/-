    source_tables: ["chain_investment(investment_id, chain_id, chain_name, enterprise_id, enterprise_name, round, amount, investor, invest_date, data_year) — 投融资明细（gkxlumenx_dwd / demo_gkxlumenx_dwd）", "chain_investment(chain_id, chain_name, stat_year, investment_count, total_amount, amount_growth_rate, count_growth_rate) — 投融资汇总（gkxlumenx_ads / demo_gkxlumenx_ads）", "industry_chain_investment_event(event_id, chain_id, node_id, investment_type, financing_round, amount, currency, event_date) — 投融资事件（demo_gkxlumenx_dwd，含币种/轮次）", "dwd_org_invest_info(org_id, name_cn, inv_name, investment_amount, investment_ratio) — 企业投资明细"]
