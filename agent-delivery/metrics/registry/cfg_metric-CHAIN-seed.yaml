  - metric_id: M_CHAIN_NEWS_COUNT
    metric_name_zh: 动态资讯数
    definition: >
      2026-10-14 拍板（human:徐滕强，路径A：口径前置写实）：指定产业链相关动态资讯的去重条数（池计数）。三要点：①源 = ods dwd_industry_chain_news_info（真表名，旧稿 dwd.industry_chain_news 漂移），每行一条资讯、pk_id 物理主键，COUNT(*) 直数即去重数（单表无 JOIN 无重复风险）；②挂链键 = industry_code 纯等值匹配（INB 链码体系，表自带免桥；同 product_tags 拍板：查询层禁 LIKE 迁就脏数据，值域比对仅质量参考不影响口径）；③时间窗默认全量 + 近 N 年作查询参数（publish_date 时间轴），默认窗口归前端/API 不进口径。demo 实测 90 行小样本（不全），口径不迁就；旧细稿 ADS 月聚合版（chain_news_stat）降为补充视图，主口径用明细直数。
    formula: >
      SELECT COUNT(*) AS chain_news_cnt
      FROM demo_gkxlumenx_ods.dwd_industry_chain_news_info n
      WHERE n.is_deleted = 0
