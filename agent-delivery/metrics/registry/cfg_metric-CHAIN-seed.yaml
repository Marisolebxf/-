    metric_name_zh: "高校论文"
    definition: >
      2026-10-14 拍板（human:徐滕强，路径A：口径前置写实，formula 签名位保持 pending_cosign）：指定区域内、指定产业链链上高校+科研院所所属学者发表的论文去重件数（机构范围沿用定义层既定口径，与 M_CHAIN_REG_COMP_ACADEMIC / M_CHAIN_INSTITUTION_COUNT 三处自洽；跨桶合作论文只计 1）。链路（4 表精简版，2026-10-14 实核后弃 dwd_scholar_papers JOIN）：机构桶（heis+ri UNION，external_id 挂链键 + city 区域键 + name_cn 学者匹配键三键一体）→ dwd_org_industry_tags 挂链（credit_code↔external_id 过渡桥）→ dwd_scholar（scholar_org_name_zh = 机构名匹配，REG_COMP_ACADEMIC 先例）→ dwd_scholar_paper_relation（paper_id 去重）。实核（2026-10-14 demo）：relation 388,615 行 / papers 738,106 行 / scholar 21,316 位；papers.status 实测唯一值 1（中文有效枚举不存在，status JOIN 无过滤价值整表弃用，未来灌入非 1 值时加回）；名称匹配面 32,215 行（同名校漏配风险注记，升级路径=供方补 scholar_org_id↔org_id 结构化映射）；端到端已验证：深圳 heis 路径真数 1,791 篇。
    formula: >
      SELECT COUNT(DISTINCT r.paper_id) AS paper_cnt
      FROM (
        SELECT external_id, name_cn, city FROM demo_gkxlumenx_ods.dwd_org_heis_info WHERE is_deleted = 0
        UNION
        SELECT external_id, name_cn, city FROM demo_gkxlumenx_ods.dwd_research_institute_base_info WHERE is_deleted = 0
      ) inst
      JOIN demo_gkxlumenx_ods.dwd_org_industry_tags t ON t.credit_code = inst.external_id AND t.industry_code = :chain
      JOIN demo_gkxlumenx_ods.dwd_scholar s ON s.scholar_org_name_zh = inst.name_cn AND s.is_deleted = 0
      JOIN demo_gkxlumenx_ods.dwd_scholar_paper_relation r ON r.scholar_id = s.scholar_id AND r.is_deleted = 0
      WHERE inst.city = :region_city AND r.year BETWEEN 1900 AND :stat_year;  -- 会签意见(human:唐绍祖 2026-10-16, 需改)：必须补时间过滤
