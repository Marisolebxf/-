    definition: >
      2026-10-14 拍板（human:徐滕强，路径A：口径前置写实，formula 签名位保持 pending_cosign）：指定区域、指定产业链链上企业的融资事件去重件数。骨架 = F8 既定链路：dwd_industry_chain_info / industry_chain 定链 → 桥（目标 enterprise_industry_chain，现 0 行；过渡 dwd_org_industry_tags 228 万 credit_code↔external_id）→ dwd_org_base_info.city 筛区域 → 分子 dwd_org_financing_info。实核（2026-10-14 demo）：25,654 行 / 6,503 家企业，completion_date 真业务日期（1963→2026），轮次干净中文枚举（股权投资/新三板/战略投资/A轮/IPO 等）。无 event_id 列（DDL 18 列无事件主键，dwd_id 为 ETL 自增流水不可用作去重）→ 复合唯一键 (org_id, completion_date, funding_round)（human:徐滕强 拍板），同企业同日同轮次计 1 件，碰撞风险（同日同轮多笔）如实注记。统计窗默认全量，近 N 年为 API 参数不进口径。金额列为 varchar 带中文单位（万/亿人民币）不解析（金额口径归 M_CHAIN_INVEST_TOTAL 另行处理）。
