  - metric_id: M_CHAIN_REG_ECOSYSTEM
    metric_name_zh: 区域产业生态
    definition: >
      2026-10-14 拍板（human:徐滕强，方案A：配套生态完备度=区域链上环节覆盖度；分母=L1 环节；路径A口径前置写实，formula 签名位保持 pending_cosign）：区域配套生态完备度 = 区域内链上企业挂点归一覆盖的 L1 环节数 / 该链 L1 环节总数 × 100%。废除旧稿 COUNT(DISTINCT credit_code)（与 M_CHAIN_ENTERPRISE_COUNT 同数复述、生态语义为空）。分子链桥 enterprise_industry_chain.node_id 挂点（挂 L2 向上归一 COALESCE(parent_node_id, node_id)，挂点深度不齐鲁棒）JOIN 主档 org_id+city 区域筛（org_id 全键禁名称匹配）；分母 industry_chain_node 该链 node_level=1 全集（与 M_CHAIN_REG_POLICY_COVERAGE 分母同尺，INB1701 L1=6 实测）。同族区分注记：与 M_CHAIN_SZ_COMPLETENESS（六环节服务链轴）/ M_ENT_CHAIN_COMPLETENESS（全域跨链叶子分母）均不同构。L1 饱和风险（强市 6/6=100%）如实接受，加权演进留 v0.3 不进首版。链桥现仅 INB1309 mock 2000 行（深圳 1004 家 org_id 全键实测通），其他链 0 行如实 0% + ⚠️；全量挂链 CHAIN-P0-5 交付灌入即真数，口径不动。
    formula: >
      SELECT ROUND(100 * cov.covered / denom.total, 1) AS ecosystem_pct
      FROM (SELECT COUNT(*) AS total FROM demo_gkxlumenx_dwd.industry_chain_node
            WHERE chain_id = :chain_code AND node_level = 1 AND is_deleted = 0) denom,
           (SELECT COUNT(DISTINCT COALESCE(n.parent_node_id, e.node_id)) AS covered
            FROM demo_gkxlumenx_dwd.enterprise_industry_chain e
            JOIN demo_gkxlumenx_ods.dwd_org_base_info b
              ON b.org_id = e.org_id AND b.is_deleted = 0 AND b.city = :region_city
            LEFT JOIN demo_gkxlumenx_dwd.industry_chain_node n
              ON n.node_id = e.node_id AND n.is_deleted = 0
            WHERE e.chain_code = :chain_code AND e.node_id IS NOT NULL) cov;
      口径已钉（human:徐滕强 2026-10-14：方案A + 分母 L1），正式签名待 human:唐绍祖 会签（环节全集层级属 D1 决策点）。
