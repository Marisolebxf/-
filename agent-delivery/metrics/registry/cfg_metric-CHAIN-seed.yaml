    algo_server_location: "repos/demo-algo-science/chainan/metrics/metrics.py（计算） + repos/demo-algo-science/api/chainan_metric_routes.py（服务接口）"
    calc_logic_ref: "metrics/calc-logic/CHAIN/M_CHAIN_INVEST_TOTAL.md"
