    formula: "时间戳用公开年pbdt_year，不用授权年；不要求granted_number非空。从dwd_industry_chain_info定链，经dwd_org_industry_tags取链上企业，用dwd_org_base_info.province/city筛区域，按申请人/专利权人匹配dwd_patent，按patent_id去重。P_t为该区域该年公开专利去重件数。窗口k优先3、否则2、仅1年用同比，g_t=(P_t/P_{t-k})^(1/k)-1。P连续为0评0；上期为0且本期有量评25（萌芽）；g>5%且加速或缺上期g评50（成长）；g>5%且减速评70（趋于成熟）；|g|≤5%评90（成熟）；g<-5%评90×P_t/P_{t-k}并截断到[0,90)（衰退）。映射同M_CHAIN_TECH_MATURITY_SCORE。"
