    algorithm_type: STAT
    source_tables: ["ads: chain_panorama", "dwd.industry_chain <- ods: dwd_industry_chain_info"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    owner_agent: data-agent
  - metric_id: M_CHAIN_NODE_COUNT
    metric_name_zh: 产业链节点数
    definition: "产业链图谱中所有节点去重总数（含产业链/环节/企业/机构节点）；由 NebulaGraph gkx_chain 空间统计。"
    formula: "pending_algorithm（NebulaGraph gkx_chain LOOKUP COUNT）"
    algorithm_type: GRAPH
    source_tables: ["NebulaGraph gkx_chain", "dwd.industry_chain <- ods: dwd_industry_chain_info"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    formula_status: pending_algorithm
    owner_agent: data-agent
  - metric_id: M_CHAIN_EDGE_COUNT
    metric_name_zh: 产业链边数
    definition: "产业链图谱中所有关系边总数（belongs_to/participates/supplies/depends_on）；由 NebulaGraph gkx_chain 空间统计。"
    formula: "pending_algorithm（NebulaGraph gkx_chain 边统计）"
    algorithm_type: GRAPH
    source_tables: ["NebulaGraph gkx_chain", "dwd.industry_chain <- ods: dwd_industry_chain_info"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: daily
    version: "0.1.0"
    is_mock: true
    mapping_status: "🔧"
    formula_status: pending_algorithm
    owner_agent: data-agent
  - metric_id: M_CHAIN_SZ_COMPLETENESS
    metric_name_zh: 深圳产业链完整度
    definition: "pending_data_lead(QC01)：深圳覆盖的产业链环节数占全链环节数比例；完整度口径（按节点数/按企业覆盖/按产值覆盖）待甲方确认。"
    formula: "pending_algorithm（深圳覆盖环节数 / 全链环节数 * 100）"
    algorithm_type: STAT
    source_tables: ["dwd.industry_chain_enterprise <- ods: dwd_org_industry_chain_dtl", "dwd.industry_chain <- ods: dwd_industry_chain_info"]
    source_systems: ["Mock @ batch=mock_20260623"]
    update_freq: weekly
    version: "0.1.0"
