    owner_human: "human:淮政玮"
  - metric_id: M_CHAIN_INSTITUTION_COUNT
    metric_name_zh: "产业链关联机构数"
    definition: >
      2026-10-14 拍板（human:徐滕强）：挂链科研机构/高校去重数。机构 = 高校（dwd_org_heis_info）+ 科研院所（dwd_research_institute_base_info）主档主体，与企业互斥——企业法人研究所（如 ××研究院有限公司）归 M_CHAIN_ENTERPRISE_COUNT，名称关键词不作为身份判定依据。真源 = dwd.industry_chain_entity_rel（链域统一挂链关系表，entity_type 原生维；图谱设计 03-详细设计定科研机构 = institution）。实核（2026-10-14）：demo entity_rel 仅 entity_type=product 319 行，机构挂链 0 行；live tags 228 万行双路径核验（名称精确匹配 1 家 / credit_code↔external_id 匹配 0）真机构实质未挂链 → 如实 0 + ⚠️，已开 CHAIN-P0-6 问供应方交付计划。
    formula: >
      SELECT COUNT(DISTINCT entity_id) AS chain_inst_total
      FROM demo_gkxlumenx_dwd.industry_chain_entity_rel
      WHERE entity_type = 'institution'
        AND valid_to IS NULL AND is_deleted = 0;
      当前真数：0（机构挂链未灌，如实展示）。选链视图：WHERE chain_id = :chain 后同去重。高校/院所细分走 entity_subtype（heis/ri），总量计数不拆。
    algorithm_type: STAT
    source_tables: ["dwd.industry_chain_entity_rel <- 机构主档 dwd_org_heis_info / dwd_research_institute_base_info（身份源；挂链明细待供应方交付见 CHAIN-P0-6）"]
    source_systems: ["国内产业链要素库"]
    update_freq: daily
    version: "0.2.0"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 handoff §9）"
