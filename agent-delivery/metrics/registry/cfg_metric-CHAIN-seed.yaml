  - metric_id: M_CHAIN_GLOBAL_REGION_COUNT
    metric_name_zh: "全球分布区域数"
    definition: >
      2026-10-14 拍板（human:徐滕强）：指定产业链的链上主体（企业+机构）总部所在国家/地区去重数，链维 KPI 随链切换。现阶段只算国内档：国内主档（dwd_org_base_info）现网全为中国，有链上主体即计 1（CN）。海外主体库在库（live 实核 2026-10-14：dwd_forg_base_info 2 万行 GB/US/CA + forg 院所/高校 222 国）但现无产业链挂接概念（industry_code 为 4 位 SIC 码，0 条 INB 链码）→ 海外档暂不实现，缺口保留：挂 CHAIN-P0-7 问供应方海外挂接交付计划，UI 按 SVC GLOBAL 模式显「全球数据待接入」⚠️（挂 Q-SVCCHAIN-07），不造海外数。当前真数 0（国内桥 enterprise_industry_chain 0 行），如实 0 + ⚠️。
    formula: >
      SELECT COUNT(DISTINCT 'CN') AS global_region_cnt
      FROM demo_gkxlumenx_dwd.enterprise_industry_chain
      WHERE is_deleted = 0;
      现阶段国内档：桥有数即恒 1（CN）；当前桥 0 行 → 真数 0。过渡桥版：FROM demo_gkxlumenx_ods.dwd_org_industry_tags t JOIN dwd_org_base_info b ON b.external_id = t.credit_code WHERE t.industry_code = :chain。海外档（forg UNION）待 CHAIN-P0-7 供应方明确挂接交付后再扩入公式——口径语义预留，实现不写。
    algorithm_type: STAT
    source_tables: ["dwd.enterprise_industry_chain <- ods: dwd_org_industry_tags（国内桥；海外挂接缺失见 CHAIN-P0-7）"]
    source_systems: ["国内产业链要素库"]
    update_freq: daily
    version: "0.2.0"
    pending_cosign: "已会签 human:唐绍祖 2026-10-16（formula 已审，同意滕强版口径；调查依据见 handoff §9）"
    is_mock: true
