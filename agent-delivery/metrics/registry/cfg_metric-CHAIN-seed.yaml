  - metric_id: M_CHAIN_REG_PATENT
    metric_name_zh: "专利"
    definition: >
      2026-10-14 拍板（human:徐滕强：企业关联必须 org_id 结构化键，名称匹配路径废止）：指定区域内、指定产业链链上企业的专利去重件数（patent_id 去重；不限 kind，kind/party_role/pbdt_year 均作下钻维度不进口径本体；时间轴 pbdt_year 默认全部公开年可下钻）。链路（org_id 全键版）：dwd.enterprise_industry_chain（chain_code 定链 + org_id）→ dwd_org_base_info（org_id 同键直连 + city 区域筛）→ dwd.enterprise_patent_org_rel（org_id↔patent_id 专利关系）→ dwd_patent（patent_id 去重）。实核（2026-10-14 demo）：dwd_patent 2,939,895 行（patent_id 全唯一，华为/比亚迪/华南理工等真实数据族）；主档 189,116 行 org_id 全非空唯一；六连接键 collation 全部 utf8mb4_general_ci 同序裸 JOIN 无需 COLLATE（collation 统一规则=遇不对齐统一 ALTER utf8mb4_0900_ai_ci，demo/正式库/设计文档三同步，另见全局规约）；enterprise_patent_org_rel 与企业桥 enterprise_industry_chain 均为 DWD 在案表（结构齐备、org_id 键位对齐，human:徐滕强 2026-10-14 确认），当前 0 行/仅 1 行测试数据=数据未灌（样本性，先不管，不报缺），灌数后即出真数。老稿表名漂移回执：dwd_org_industry_chain_pat_dtl（888 行）现网已不存在（2026-09-03 human:李伟 已裁定弃用）；名称匹配版（兄弟条目先例）经拍板废止，不落 formula。当前真数 0（数据未灌），如实 0；灌数后即出真数。
