    formula: >
      SELECT COUNT(DISTINCT r.patent_id) AS chain_patent_cnt
      FROM demo_gkxlumenx_dwd.enterprise_industry_chain e
      JOIN demo_gkxlumenx_dwd.enterprise_patent_org_rel r
