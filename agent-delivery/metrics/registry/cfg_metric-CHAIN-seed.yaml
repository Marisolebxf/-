    metric_name_zh: "区域技术成熟度"
    definition: >
      2026-10-14 拍板（随 Seq17 TECH_BARRIER 同链路同 kind 语义联动：链路切 org_id 全键=enterprise_industry_chain → dwd_org_base_info(city) → 专利关联过渡名称轨→enterprise_patent_org_rel；kind 语义 DDL 注释钉死 A/B/U/S；增速映射公式保留原稿不变——时间戳用公开年 pbdt_year、不要求 granted_number、不过滤 kind 全量公开专利、patent_id 去重）：指定区域在指定产业链上，以该区域链上企业专利按公开年汇总的近3年复合增速判定技术所处生命周期位置，输出0—100分。分值越高表示技术越趋近成熟（公开量增速趋缓）；持续负增长按衰退回落计分。口径对齐 M_CHAIN_TECH_MATURITY_SCORE。页面约束：不得用周期侧 TECH_MATURITY_SCORE 顶替（TOPIC-REG-013）。实核（2026-10-14 demo）：pbdt_year 2021-2026 六年窗可支撑 k=3；老链路 tags 与主档 0 命中(废)；新链桥 INB1309 深圳-org_id 实测通；rel 0行待灌走名称过渡轨。
    formula: >
      时间戳用公开年pbdt_year，不用授权年；不要求granted_number非空；不过滤kind（公开全量）。链路 org_id：e.enterprise_industry_chain(chain_code) JOIN b.dwd_org_base_info(org_id, city=:region_city)；专利关联过渡轨 p.first_current_assignee_name=b.name_cn，rel 灌数后切 r.org_id=e.org_id AND r.party_role IN ('APPLICANT','ASSIGNEE')；按patent_id去重。P_t为该区域该年公开专利去重件数。窗口k优先3、否则2、仅1年用同比，g_t=(P_t/P_{t-k})^(1/k)-1。P连续为0评0；上期为0且本期有量评25（萌芽）；g>5%且加速或缺上期g评50（成长）；g>5%且减速评70（趋于成熟）；|g|≤5%评90（成熟）；g<-5%评90×P_t/P_{t-k}并截断到[0,90)（衰退）。映射同M_CHAIN_TECH_MATURITY_SCORE。口径保留原稿（王惠调研迁移版），仅链路升级；正式签名待 human:唐绍祖 会签。
