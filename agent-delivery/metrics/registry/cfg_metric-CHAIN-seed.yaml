    formula: "pending_algorithm（企业增速*w1+投融资热度*w2+专利密度*w3 >= 阈值）"
    algorithm_type: MODEL
    source_tables: ["dwd.industry_chain_enterprise <- ods: dwd_org_industry_chain_dtl", "dwd.industry_chain_news <- ods: dwd_industry_chain_news_info"]
    source_systems: ["Mock @ batch=mock_20260623"]
