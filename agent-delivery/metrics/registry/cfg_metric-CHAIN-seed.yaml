  - metric_id: M_CHAIN_REG_TECH_BARRIER
    metric_name_zh: "区域技术壁垒"
    definition: >
      2026-10-14 拍板（human:徐滕强：①kind 语义按 DDL 注释钉死——A=发明申请、B=发明授权、U=实用新型授权、S=外观授权，发明授权=kind='B'（granted_number 非空双保险）；kind=D 语义补钉（human:徐滕强 2026-10-14 二次拍板：D 51.9万件按外观设计（等同 S）对待）；②空白子项由区域级0/1改无授权企业占比（0-100连续值，抗单企业抖动）；③封锁子项采简化方案——单窗口（统计年及前推2年共3年）IPC首层占比向量欧氏距离、同链跨区域平均、不做趋势判定（原"距离变大记1"两期窗口依赖+二值抖动，砍掉）；④enterprise_patent_org_rel DDL 满足需求（patent_id+org_id+party_role APPLICANT/ASSIGNEE+party_sequence，uk 四元去重），0 行=数据未灌，灌数前过渡轨 first_current_assignee_name=name_cn 名称匹配；collation 登记：rel.patent_id(general_ci) vs dwd_patent.patent_id(0900)，灌数时按用户通则统一 ALTER utf8mb4_0900_ai_ci 三同步）：区域技术壁垒=(空白得分+封锁得分)/2，两子项同链各区域截面 min-max 0-100。链路 org_id 全键：enterprise_industry_chain(chain_code) → dwd_org_base_info(city 区域筛) → 专利关联（过渡名称轨→rel 表 org_id 轨）→ dwd_patent。空白：统计年及此前3年(共4年度窗)链上企业 kind='B' 授权量为0的企业占比。封锁：3年窗口 main_classification_ipcr 首字母8维占比向量，区域企业 vs 同链其他区域企业平均欧氏距离（无IPC企业剔除；区域全无IPC→子项空值不进合成）。页面硬约束：不得用 M_CHAIN_TECH_BARRIER_INDEX（关键环节侧）顶替（TOPIC-REG-014）。实核（2026-10-14 demo）：patent 293万/ipcr覆盖82.4%/年份2021-2026；老链路 dwd_org_industry_tags 104行与主档0命中(废)；新链桥 INB1309=1984家、深圳1004家 org_id 实测通；rel 0行待灌。
    formula: >
      空白得分 = 100 * (区域内近4年度窗无 kind='B' 授权的链上企业数 / 区域链上企业总数)；
      封锁得分 = avg Euclid(IPC向量_a, IPC向量_b), a∈本区域链上企业(3年窗有IPC), b∈同链其他区域企业；
      区域技术壁垒 = (blank_score + blockade_score) / 2，两子项各自同链截面 min-max 0-100（负向指标，进 M_CHAIN_TECH_POWER 合成时取 1-x）。
      SELECT 路径：enterprise_industry_chain e JOIN dwd_org_base_info b ON b.org_id=e.org_id AND b.city=:region_city AND b.is_deleted=0 WHERE e.chain_code=:chain_code；
      专利关联过渡轨：LEFT JOIN dwd_patent p ON p.first_current_assignee_name=b.name_cn AND p.is_deleted=0（patent_id 去重）；
      rel 灌数后切换：JOIN enterprise_patent_org_rel r ON r.org_id=e.org_id AND r.party_role IN ('APPLICANT','ASSIGNEE') JOIN dwd_patent p ON p.patent_id=r.patent_id（org×patent 去重）。口径已钉（human:徐滕强 2026-10-14），正式签名待 human:唐绍祖 会签。
    algorithm_type: MODEL
