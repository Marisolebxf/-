# metric-readiness-matrix —— 企业维度（ENT 全域）四维就绪度矩阵
# ============================================================================
# 真源角色：企业维度指标四维就绪度（D1 定义 / D2 结构 / D3 源映射 / D4 接入）的机器真源；
#           FE 只读消费（demo 阶段镜像到 readinessSeed.ts；Wave1 走 /metrics/v1/catalog）。
# 模型定义：data-lineage-policy.md §2.3（v1.3；D2 `pending` 态为 v1.3.1 增补）
# 生成任务：ENT-READINESS-MATRIX-ENT-L01（监管 human:淮政玮）· 2026-08-01
#           前身 metric-readiness-matrix-ENT-EVAL.yaml（D9-READINESS-MODEL-L01）已整体吸收并删除。
#           L02 补录：ENT-READINESS-MATRIX-ENT-L02（监管 human:淮政玮）· 2026-08-01 —— demo-ui-topic
#           页面引用审计发现的 28 个缺口 metric_id：21 条新建（seed 已登记 10 + 未注册 11）+
#           8 个同义 ID 别名归一（见 demo_metric_id_aliases）+ 4 个复核确认已在矩阵；
#           另 UI-L02 防漏扫描补充发现 M_ENT_TYPE_RATIO（seed 已登记，原审计漏检）+1 条。
# 覆盖范围：9 个企业 METRIC-OPEN 任务触达的指标（EVAL 13 + SEARCH/RISK/RECRUIT/KEYPANO/STAR/SHENZHEN 40 = 53 条；
#           RISK 段含 seed 已登记但 gap catalog 未列的 M_ENT_NODE_CENTRALITY）
#           + L02 补录 22 条（ENT-OVERVIEW 11 + 未注册 11）= 75 条。
#   - COMPARE（对比篮）：派生容器、无统计指标，METRIC-OPEN 产物缺失（registry 标 done，待补验，见 §coverage_notes）
#   - OPS（维护管理）：产物为 15 条 capability（CMS 写侧能力）非统计指标，不入本矩阵
# 输入真源：metrics/cfg_metric-ENT-seed.yaml（8 件套 + mapping_status）
#           agent-handoffs/产品整体定义/{各模块}/ENT-*-data-gap-catalog.yaml（6 份）
#           agent-handoffs/产品整体定义/{各模块}/METRIC-OPEN-ENT-*-核对记录.md
# ----------------------------------------------------------------------------
# ⚠️ 诚实性约束（不伪闭合）：
#   - EVAL 13 条 D2 判定为 provisional（依据 DWD 设计文档目测），待 lineage-subcoord 核验。
#   - 非 EVAL 模块的 D2 一律 `pending`（未评估，v1.3.1 增补态）——结构支撑尚未逐条对照
#     DWD/ES/图 设计，禁止伪标 ready；待架构/data-agent 评估后逐条升级。
#   - D1/D3 按 policy §2.3.2 迁移映射从各模块 gap catalog 的 mapping_status/pending_ref 推导；
#     推导性判定均为 provisional 性质，正式口径以王惠正式化提交为准。
#   - D4 全部 mock（Wave 0），阶段清单全 todo；接入启动后由数据工厂更新。
#   - d1_def_status=missing（未注册 metric_id 的 GAP-* 条目）时 d2~d4 = n/a（policy §2.3.1）。
# ----------------------------------------------------------------------------
# 字段 schema（每条 metric）：
#   metric_id / metric_name_zh / acceptance_unit_id / module（所属 METRIC-OPEN 模块）
#   d1_def_status:        aligned | draft | missing
#   d1_pending_ref:       Q-* / GAP-*（draft 时必填）
#   d1_note:              补充说明（如未入 seed 待注册）
#   d2_schema_status:     ready | partial | missing | pending | n/a
#   d2_schema_detail:     { mysql_dwd, es, graph: {status}, gap }   # pending/n-a 时可省略
#   d2_assessed:          provisional | verified
#   d3_source_mapping_status: full | partial | none | pending_ods | n/a
#   d3_gap:               缺什么（partial/none 时必填；长文案仍以 data-gap-catalog 为准）
#   d4_ingestion_status:  mock | ingesting | live | n/a
#   d4_ingestion_stages:  { ods_synced, dwd_loaded, es_indexed, graph_loaded, verified }
#                         每项 done | in_progress | todo | n/a
#   legacy_mapping_status: 原 mapping_status（迁移对照，只读）
# ============================================================================

