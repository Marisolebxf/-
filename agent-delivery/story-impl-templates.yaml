# 按模块故事包生成的推荐实现 leaf（对齐 产品实现规程 §8.1）
# depends_on 默认挂 dg_task；status 一律 backlog；delivery_phase: implementation
story_driven_impl:
  theme_size: 3   # 每 Theme 最多几条未覆盖故事（2B 薄垂直）
    only_uncovered: true  # 仅 implementation_tasks 为空的故事；scan 可加 --all 覆盖已挂任务故事
  suggested_leaves:
    - suffix: ARCH-IMPL-L01
      agent: architect-agent
      repo: agent-delivery
      title: "{label} — 实现期架构/契约确认（故事驱动草案）"
      optional: true
      difficulty: M
      effort_points: "3"
    - suffix: API-CONTRACT-L01
      agent: api-agent
      repo: lumen-svc-platform
      title: "{label} — Java API 契约与门面（故事驱动草案）"
      optional: false
      difficulty: M
      effort_points: "5"
    - suffix: DATA-PATH-L01
      agent: data-agent
      repo: agent-delivery
      title: "{label} — 数据路径/Mapping（故事驱动草案）"
      optional: true
      difficulty: M
      effort_points: "5"
    - suffix: FE-WIRE-L01
      agent: frontend-agent
      repo: lumen-ui-topic
      title: "{label} — 前端 API 接线与状态硬化（故事驱动草案）"
      optional: false
      difficulty: M
      effort_points: "5"
    - suffix: QA-ACCEPT-L01
      agent: qa-agent
      repo: agent-delivery
      title: "{label} — Sprint 验收场景回归（故事驱动草案）"
      optional: false
      difficulty: S
      effort_points: "2"
