# 故事驱动实现拆单模板（机器可读）
# 维护：coordinator · 脚本 scripts/suggest-story-impl-tasks.mjs
# 规程：task-creation-guide.md §16 · 产品定义评审规程 §5.3 · 产品实现规程 §2.3
#
# 原则：
#   - 门1 PDR 完整闭合后：可生成故事库索引 + 实现 leaf **提案**（status=backlog）
#   - 门3 DG 后：才允许 confirm → ready（本模板不绕过）
#   - 绝不自动 merge task-registry

version: 1
updated: "2026-08-03"

