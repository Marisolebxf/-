# 飞书多维表格 ↔ task-registry.yaml 集成配置
# 维护：PM + coordinator · 指南见 feishu-bitable-integration.md
# 机器真源：task-registry.yaml；Bitable = 人类 Kanban 投影（Phase 0）

version: 1
updated: "2026-07-21"
doc: agent-delivery/feishu-bitable-integration.md
deferred: feishu-project.yaml   # 飞书项目审批通过后迁移

bitable:
  # 多维表格 URL 中 base 部分 → app_token；table 页签 → table_id
  app_token: "JI94bBxwsaIzyMsMBrYcPJscnDc"
  table_id: "tblb65lPULz31h9U"
  # 看板视图：在 Bitable 内新建「看板」视图，分组字段 = 状态（下方 field_names.status）
  kanban_view_hint: "分组依据 = 状态字段"
  # 定义/实现分流：建筛选视图「交付阶段=定义|实现」；模块总览可分组=功能模块→交付阶段
  phase_view_hint: "筛选 交付阶段；见 feishu-bitable-integration.md §2.1.1"

sync:
  enabled: true
  # Near-realtime: engineers use update-task-status (Node); projector / K8s Cron outbound.
  # See feishu-bitable-near-realtime.md — WSL NOT required.
  # 2026-07-28 决策：飞书 = 纯看板投影；registry 为唯一真源；飞书改动不回写 git
  direction: registry_to_bitable   # registry_to_bitable | bitable_to_registry | bidirectional
  mode: upsert
  include_statuses: [backlog, ready, claimed, in_progress, review, blocked, done]
  sprint_filter: ""                # 空=全量；或 "2026-W28"
  dry_run_default: false
  rate_limit_ms: 200
  # 看板字段以 registry 为准，outbound 全量投影（含状态/认领）；禁止 inbound 回写
  watch_kanban_precedence: registry

  external_id:
    registry_field: id
    bitable_field: task_id         # 见 field_names.task_id

  bitable_record_id_backfill:
    registry_field: feishu_bitable_record_id
    enabled: true

# Phase 1 · 人工在 Bitable 改字段 → 回写 task-registry.yaml
# 2026-07-28：关闭。飞书只读展示；改状态/认领请用 update-task-status / coordinator 派单。
inbound:
  enabled: false
  # 允许从 Bitable 回写的 registry 字段（enabled=false 时整段不生效）
  allowed_fields: [status, claimed_by, sprint_id, title, priority]
  new_tasks: queue                 # queue | reject
  proposals_file: agent-delivery/bitable-inbound-proposals.yaml
  normalize_human_prefix: true     # 「张三」→ human:张三（认领 inbound）
  validate_transitions: warn       # warn | strict | off
  task_id_pattern: "^[A-Z][A-Za-z0-9-]+$"

# 认领：User 人员列；监管人：文本列「监管人」（2026-07-12 已删除「监管人 (人员 )」列）
human_display:
  enabled: true
  mode: person              # person | text_at | both
  registry_human_prefix: "human:"
  bitable_at_prefix: "@"
  roster_file: agent-delivery/team-roster.yaml
  user_map_file: agent-delivery/feishu-user-map.yaml
  fields: [claimed_by, supervised_by]
  person_field_names:
    claimed_by: "认领"
  field_formats:
    claimed_by: user

# 字段真源（2026-07-28：纯看板）
# - 全部看板字段：registry → Bitable（outbound 全量投影）
# - 飞书拖拽/改列：不回写 registry（inbound.enabled=false）
# - 例外：webhook action=dispatch_confirm|reject / gap_proposal_* 仍写 pending-dispatch（非看板字段同步）
field_authority:
  registry_to_bitable: [status, claimed_by, supervised_by, sprint_id, title, priority, dispatch_gate, dispatch_confirm_by, dispatch_trigger]
  bitable_to_registry: []
  # 派单门控/确认人/解锁说明 仅 outbound 投影；confirm 走 webhook action=dispatch_confirm，不经 inbound sync

# Bitable 列名（与你在表格里建的列名完全一致，区分大小写）
# note / definition_of_done：outbound 写入多行文本；缺列时 sync 会尝试自动建「文本」列
field_names:
  task_id: "Task ID"
  title: "标题"
  status: "状态"
  agent: "Agent"
  epic: "Epic"
  sprint_id: "Sprint"
  supervised_by: "监管人"
  claimed_by: "认领"
  estimated_tokens: "Token估算"
  priority: "优先级"
  handoff: "Handoff"
  module: "功能模块"
  note: "备注"
  definition_of_done: "验收标准"
  effort_points: "贡献分"
  difficulty: "难度"
  delivery_phase: "交付阶段"   # 单选/文本：定义 | 实现 | 横切
  dispatch_gate: "派单门控"     # 单选/文本：— | 待确认 | 已确认 | 已驳回（outbound + webhook confirm）
  dispatch_confirm_by: "确认人" # 文本 @姓名（outbound；scan 自动填 PM/监管人）
  dispatch_trigger: "解锁说明"  # 文本：trigger ← cause_task（outbound 只读）
  # Graph Engineering（B3+）字段 registry 真源，默认不上板：
  # touched_files / convoy / subcoord / graph_role / ods_dependency_phase
  # 需要看板列时再补 field_names + board-task-status buildFields

# Mayor 循环（coordinator-loop --propose-dispatch）派单确认人：IM + 派单门控「确认人」列
mayor_loop_confirm_by: "human:淮政玮"

# outbound 派单门控 registry key → Bitable 显示名
dispatch_gate_map:
  none: "—"
  pending: "待确认"
  confirmed: "已确认"
  rejected: "已驳回"
  gap_proposed: "待审建单"
  gap_accepted: "建单已采纳"
  gap_rejected: "建单已驳回"

# registry delivery_phase → Bitable「交付阶段」显示名（与表格选项文字一致）
delivery_phase_map:
  definition: "定义"
  implementation: "实现"
  crosscut: "横切"

# 缺省 delivery_phase 时按 task-id / epic 推断（sync 出站 + backfill 脚本共用语义）
# 匹配顺序：crosscut → definition → implementation → default
delivery_phase_classify:
  default: crosscut
  crosscut_epic_prefixes: [E-PLATFORM-, E-PERM-, E-PLATFORM-ORCH]
  crosscut_id_regex: "(ORCH-|PLATFORM-|PERM-|E-PLATFORM-|E-PERM-)"
  definition_id_regex: "(PACK-L0|METRIC-OPEN|UX-L0|V1-HIFI|V1-FINAL|PDR-G1|G2-SIGNOFF|V2-LUMEN|V2-DEMO|DG-G3|-PDR-|HIFI-|WIREFRAME|USM-|TRACE-)"
  implementation_id_regex: "(IMPL-|JAVA-|FE-WIRE|FE-PERM|-API-|ALGO-ALIGN|QA-ACCEPT|DATA-PATH|DATA-IMPL|ENT-JAVA-|ENT-ARCH-API|ENT-DATA-|ENT-ALGO-)"

# Outbound：registry evidence 相对路径 → GitLab 可点击链接写入「Handoff」
# 例：agent-handoffs/foo.md
#   → https://gitlab.htmisoft.net/gkx-lumen/gkx-orchestration/-/blob/dev/agent-delivery/agent-handoffs/foo.md?ref_type=heads
handoff_link:
  enabled: true
  write_mode: plain              # plain=纯 URL 字符串（文本列可用）| hyperlink=超链接列 | url_text=富文本（多数租户 API 不支持）
  gitlab_base: "https://gitlab.htmisoft.net"
  gitlab_group: "gkx-lumen"
  repo: "gkx-orchestration"
  branch: "dev"
  path_prefix: "agent-delivery" # evidence 未带此前缀时自动补上

# Epic → 人类可读功能模块（sync 写入「功能模块」列；精确匹配优先，再 prefix，最后 default）
epic_module_map:
  E-E7-POLICY-M1: "E7 政策"
  E-POLICY-PROTOTYPE: "E7 政策（原型）"
  E-INNOV-M1: "E2 创新监测"
  E-ENT-PROTOTYPE: "E1 企业（原型）"
  E-ENT-REALDATA: "E1 企业"
  E-ENT-SCRUM-PDR: "E1 企业（PDR Scrum）"
  E-CHAIN-PROTOTYPE: "E2 产业链"
  E-SCI-REALDATA: "展示系统"
  E-PLATFORM-P0: "平台底座 P0"
  E-PLATFORM-P1: "平台底座 P1"
  E-PLATFORM-ORCH: "编排与认领"
  E-PERM-M1: "权限与安全"
  E-PROD-UXUE-ALIGN: "产品/UX对齐"
  E-PROD-UXUE-COMP: "产品/UX对齐"
  E-PROD-UXUE-FIX: "产品/UX对齐"

epic_module_prefix:
  E-E7-: "E7 政策"
  E-ENT-: "E1 企业"
  E-CHAIN-: "E2 产业链"
  E-PLATFORM-: "平台横切"
  E-PROD-UXUE-: "产品/UX对齐"

epic_module_default: "其他"

# registry status → Bitable「状态」单选选项名（与表格里选项文字一致）
status_map:
  backlog: "Backlog"
  ready: "Ready"
  claimed: "已认领"
  in_progress: "进行中"
  review: "评审中"
  done: "已完成"
  blocked: "阻塞"

# ── Webhook 入站（RFC-003 · 方案 B）──────────────────────────────
# Bitable 自动化「发送 HTTP 请求」→ POST 到 handler；或飞书开放平台事件订阅
# 密钥：.env 中 FEISHU_BITABLE_WEBHOOK_SECRET（必填，生产环境）
webhook:
  enabled: true
  path: /internal/feishu-bitable/webhook
  host: "0.0.0.0"
  port: 8787
  verification_token: ""          # 开放平台 url_verification（可选）
  signing_secret: ""              # 优先读 env FEISHU_BITABLE_WEBHOOK_SECRET
  skip_verification: false        # 仅本地调试可 true
  fetch_record_on_record_id: true # 仅有 record_id 时拉 Bitable API 补全字段
  validate_transitions: warn      # warn=允许跳级仅告警（与 inbound 一致）；strict=拒绝；off=不校验
  auto_git_push: true             # 写 registry 后 git-push-registry（决策 2026-07-21 PM）
  audit_log: agent-delivery/_tmp/feishu-webhook-audit.jsonl
  allowed_app_tokens:
    - "JI94bBxwsaIzyMsMBrYcPJscnDc"
  allowed_table_ids:
    - "tblb65lPULz31h9U"
  # 请求体必须用飞书「插入变量 → 记录 ID」，勿手打 {{record_id}} 字面量
  # 正确示例见 feishu-bitable-webhook-handler.md §4
  # Header: X-GKX-Webhook-Secret: <FEISHU_BITABLE_WEBHOOK_SECRET>
  # dev 外网（2026-07-21）：http://111.198.38.90:12287/internal/feishu-bitable/webhook
  public_url: "http://111.198.38.90:12287/internal/feishu-bitable/webhook"

# Sprint 2026-W28 committed（sync 时可打标优先级 P0）
sprint_committed:
  - E-PLATFORM-ORCH-L01
  - E-E7-POLICY-M1-L01
  - E-E7-POLICY-M1-L02
